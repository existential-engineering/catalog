description: F6 field recorder with 32-bit float technology and dual A/D converters.
details: |-
  The F6 is a 6-channel, 14-track field recorder and mixer that pairs 32-bit float recording with dual A/D converters, which Zoom presents as the first professional field recorder to combine the two. The intent is to capture loud and quiet material at full quality without setting gain, since the two converters cover different parts of the range and the float format keeps the result from clipping. The body is 100 mm wide and 119.8 mm deep and weighs 520 g.

  Six discrete inputs use locking Neutrik XLR connectors, pin 2 hot, with mic or line level selectable per input and +24/+48 V phantom power at up to 10 mA per channel. Mic gain runs from +12 to +75 dB into 3 kohm or more, line gain from -8 to +55 dB into 5 kohm or more, and equivalent input noise is -127 dBu or less. Each input has its own level knob on the front panel, next to a 1.54-inch full-color backlit LCD with a monochromatic mode and the transport keys.

  Recording goes to a single SD/SDHC/SDXC slot of up to 1 TB, in BWF and iXML WAV at 44.1 to 192 kHz and 16-bit, 24-bit or 32-bit float, or in MP3 at 128 to 320 kbps. Fourteen tracks can run at once, which is the six inputs captured twice over, once linear and once floating, plus the LR mix. When recording at 24 bits the advanced look-ahead hybrid limiters add a one-millisecond delay so clipping is caught before it reaches the file, and Zoom AutoMix pulls mix levels down automatically to reduce ambient sound.

  Outputs are a 3.5 mm stereo mini line out and a separate 3.5 mm stereo mini headphone out rated 100 mW per side with its own volume control. Headphone signals can be monitored pre or post fader, routed to either side, and given alert tones for battery and recording status. Timecode runs over one 3.5 mm stereo mini jack carrying input on the tip and output on the ring, generated by a temperature-compensated crystal oscillator accurate to 0.2 ppm whether the unit is on or off, with drop-frame and non-drop frame rates and Jam Sync.

  Over USB the F6 works as a 6-in/4-out multitrack audio interface at up to 96 kHz, in 32-bit float from firmware V2.0 onward, as an 8-in/4-out interface that records to the card at the same time at up to 48 kHz, or as a driverless 2-in/2-out stereo mix, which is the mode iOS devices use. Power can come from four AA batteries, a Sony L-Series battery, or a DC 5 V adapter such as the AD-17, and the unit supports USB bus power. Ambisonics mode adds A-to-B decoding and balanced gain linking, and with the optional BTA-1 adapter the F Control app for iPhone and iPad handles remote monitoring, levels, transport and metadata over Bluetooth.
specs: |-
  - 6-channel/14-track field audio recorder and mixer with 32-bit float recording and dual A/D converters
  - Inputs 1-6: locking Neutrik XLR jacks, pin 2 hot, mic/line selectable per input
  - Mic input: gain +12 to +75 dB, impedance 3 kohm or more, maximum input level +4 dBu
  - Line input: gain -8 to +55 dB, impedance 5 kohm or more, maximum input level +24 dBu
  - Phantom power +24/+48 V at 10 mA maximum per channel
  - Equivalent input noise -127 dBu or less (A-weighted, +75 dB gain, 150 ohm input)
  - Line output: 3.5 mm stereo mini unbalanced, output impedance 100 ohm or less, reference -10 dBV, maximum +10 dBV into 10 kohm, D/A dynamic range 95 dB typ.
  - Headphone output: 3.5 mm stereo mini unbalanced, output impedance 15 ohm or less, 100 mW + 100 mW into 32 ohm, D/A dynamic range 108 dB typ.
  - Advanced Look-Ahead Hybrid Limiters with 1 ms look-ahead, used when recording at 24-bit
  - Zoom AutoMix automatic mix level adjustment
  - Ambisonics mode with A-to-B decoding and balanced gain linking
  - Recording media: SD, SDHC and SDXC cards up to 1 TB
  - WAV formats 44.1/47.952/48/48.048/88.2/96/192 kHz at 16-bit, 24-bit or 32-bit float, mono/stereo/2-8 ch poly, BWF and iXML
  - Maximum simultaneous recording tracks 14 (6 inputs x 2, linear and floating, plus LR mix), 6 at 192 kHz in 32-bit float mode
  - MP3 at 128/192/320 kbps, 44.1/48 kHz, ID3v1 tags, up to 2 tracks
  - Recording time on a 32 GB card: 30:46:00 at 48 kHz/24-bit stereo WAV, 7:41:00 at 192 kHz
  - Timecode on a single 3.5 mm stereo mini jack, tip in and ring out, precision +/-0.2 ppm, input 0.2 to 5.0 Vpp into 4.6 kohm, output 3.3 Vpp from 50 ohm or less
  - Timecode frame rates 23.976ND, 24ND, 25ND, 29.97ND, 29.97D, 30ND, 30D with Jam Sync
  - USB 2.0: mass storage, multitrack interface 6-in/4-out at 44.1/48/88.2/96 kHz, 16/24-bit linear or 32-bit float from firmware V2.0, AIF with Rec 8-in/4-out at 44.1/48 kHz, stereo mix 2-in/2-out at 44.1/48 kHz 16-bit driverless
  - iOS audio interface operation supported in stereo mode only
  - Power: 4 AA batteries (alkaline, lithium or NiMH), Sony L-Series battery, or DC 5 V AC adapter (AD-17), with USB bus power supported
  - Battery life: 7.5 h or more alkaline / 10.5 h NiMH (2500 mAh) / 16.5 h lithium at 2 channels 48 kHz 16-bit, 4.5 / 7.0 / 10.5 h at 6 channels 48 kHz 24-bit
  - Power consumption 10 W
  - Display: 1.54 inch full-color LCD, 240 x 240, with monochromatic mode
  - Dimensions 100 mm (W) x 119.8 mm (D) x 62.9 mm (H), weight 520 g
  - Remote control from the F Control app for iPhone and iPad over Bluetooth with the optional BTA-1 adapter, or from the FRC-8 F-Control surface
