description: Hi-fi stereo delay with a lot of unique features.
details: |-
  Erica Synths Black Stereo Delay is a hi-fi stereo delay with a lot of unique features, based on a custom Erica Synths DSP engine. Tape, digital and ping-pong delay modes, hold with overdub and delicate delay time and feedback control, combined with CV and trigger control over various parameters, make this module both an effects unit in a modular system and an instrument on its own.

  The interface is straightforward and the functions are unmistakable, so the module reads less as a complex sound generator and more as an efficient tool for upgrading sounds of all kinds. It is practice oriented and suits improvisation and stage use.

  Hold mode samples up to 40 seconds of audio and takes an Add overdub, with soft limiting compression on both the feedback path and the add to hold path. Triggers control Hold, Add and Reverse, while CV controls delay time, dry and wet mix and feedback. Delay time can be set by tap or synchronised to an external clock, and the stereo delay spread is adjustable.

  Maximum audio input level before clipping is 16Vptp, trigger inputs accept 0V to 8V with a minimum of 2V for a high level, and the CV input range spans -5V to +5V. The frequency range runs from 5Hz to 24kHz at a 48kHz, 24bit sampling frequency, with delay times from 3ms to 3000ms. Firmware updates arrive through an audio bootloader, and the module occupies 16HP at a depth of 37mm.
specs: |-
  - Stereo delay with adjustable delay time
  - Tape, digital and ping-pong delay modes
  - Tap and clock synchronization of delay time
  - Reverse delay mode
  - Hold mode (samples up to 40 seconds of audio) with Add overdub
  - Trigger control over Hold, Add and Reverse
  - CV control over delay time, dry/wet mix and feedback
  - Feedback path soft limiting compression
  - Add to hold soft limiting compression
  - Adjustable stereo delay spread
  - Firmware update via audio bootloader
  - Max audio input level before clipping 16Vptp
  - Trigger inputs 0-8V (min 2V for high level)
  - CV input range (full span) -5V to +5V
  - Frequency range 5Hz to 24kHz
  - Sampling frequency 48kHz, 24bit
  - Delay time 3 to 3000 ms
  - Audio codecs -108 dynamic range, -98dB THD+N
  - Power consumption +162mA, -62mA
  - Module width 16HP
  - Module depth 37mm
