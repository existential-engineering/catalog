description: >-
  The Spectral Audio Neptune is an all-analog monophonic synthesizer in a 2U rack-mount
  format featuring three VCOs, a 24 dB cascade filter, and built-in MIDI and CV/Gate
  connectivity. Originally released in 1999, it was designed to deliver a fat Moog-type
  sound with an intuitive front-panel layout providing hands-on control of every
  parameter. A mkII revision followed in 2003 with improved components and added
  key-follow functionality.
details: |-
  The Neptune is a purely analog synthesizer with no digital components in its signal path. Its three very stable VCOs produce sawtooth and pulse waveforms, with VCO 3 switchable between LFO and oscillator modes. The synth includes ring modulation, oscillator sync, and a white noise generator, giving it a wide palette of timbres rooted in classic subtractive synthesis.

    The 24 dB precision cascade filter offers both highpass and lowpass modes with a dedicated ADSR envelope and switchable positive or negative modulation. The LFO section provides five waveshapes including sawtooth, triangle, rectangular, random, and noise, with MIDI clock sync and four modulation destinations covering both oscillators, the filter cutoff, and the mixer.

    Additional features include distortion and fuzzer effects, slide/portamento via MIDI, and velocity sensitivity. The Neptune supports both MIDI IN/THRU and switchable CV/Gate IN or OUT, bridging modern and vintage studio setups. A learn button simplifies MIDI channel and reference note assignment.

    The original Neptune debuted in 1999 and was available in violet, silver, or gold panel finishes. In 2003 the mkII revision introduced smoother potentiometers, soft-touch knobs, higher-efficiency LEDs, optimized push switches, key-follow functionality, improved white noise generation, and enhanced oscillator tuning ranges.
specs: |-
  - Polyphony: Monophonic (highest or last note priority)
    - Oscillators: 3 VCOs (VCO 1 and 2 with sawtooth and pulse; VCO 3 switchable LFO/oscillator)
    - Noise: White noise generator
    - Ring Modulation: Yes
    - Oscillator Sync: VCO 1 and 2 (mkII adds VCO 3)
    - Filter: 24 dB precision cascade (highpass and lowpass)
    - Filter Envelope: Dedicated ADSR with positive/negative modulation
    - Key Follow: 0%, 50%, 100% (mkII only)
    - LFO Shapes: Sawtooth, triangle, rectangular, random, noise
    - LFO Targets: VCO 1, VCO 2, cutoff, mixer
    - LFO Sync: MIDI clock
    - Amplifier Envelope: ADSR
    - Effects: Distortion, fuzzer, slide/portamento
    - MIDI: IN and THRU
    - CV/Gate: Switchable IN or OUT
    - Velocity Sensitivity: Yes
    - Patch Memory: None
    - Form Factor: 2U rack-mount
releaseDate: "1999"
