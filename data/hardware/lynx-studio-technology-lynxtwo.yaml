description: LynxTWO is a 192 kHz multichannel audio reference interface on a
  PCI card, offering 192 kHz analog audio and 96 kHz digital audio with on-board
  converters, hardware mixing and time code synchronization. It was sold in
  three channel configurations, the LynxTWO-A with four analog inputs and four
  analog outputs being the general purpose model.
details: |-
  The LynxTWO family of PCI cards were Lynx's first 192 kHz audio products. Introduced in 2000, these three versatile cards offered 192 kHz analog audio and 96 kHz digital audio with world-class converters and time code synchronization on board. With performance that exceeds many stand-alone converters, LynxTWO has set the standard for signal purity, versatile synchronization, powerful hardware mixing, and extensibility to support a variety of multichannel formats including ADAT and multiple AES/EBU or SPDIF.

  The LynxTWO-A model, with four analog inputs and outputs, is intended for general usage. LynxTWO-B, with two analog inputs and six analog outputs, is an excellent choice for playback of 5.1 audio or any application where six outputs are necessary, often precluding the need for a second or third card. With its six analog inputs and two analog outputs, the LynxTWO-C is an excellent choice for remote recording systems.

  LynxTWO's powerful 16-channel mixer allows extensive routing, control and metering with excellent visual reference. With the latest software, you can mix up to four inputs to any of 16 outputs. In addition to the inputs and outputs on the LynxTWO, the mixer incorporates program material from the optional LS-ADAT daughter card or from Aurora converters.

  With a design very similar to that of Lynx's highly acclaimed Aurora converters, LynxTWO delivers near Aurora-quality specs and performance in the compact PCI card format. Using the optional LynxTWO/Aurora Interface Kit, a LynxTWO can act as the computer interface and front end for the Aurora converter.
specs: |-
  - PCI card, powered from the host computer's PCI slot
  - 200 kHz sample rate / 100 kHz analog bandwidth, supported with all drivers
  - 192 kHz analog audio and 96 kHz digital audio
  - 24-bit AES3 or S/PDIF I/O with full status and subcode support
  - LynxTWO-A: four analog inputs and four analog outputs
  - LynxTWO-B: two analog inputs and six analog outputs
  - LynxTWO-C: six analog inputs and two analog outputs
  - Up to 8 LynxTWO cards in one Windows computer, up to three in Macintosh computers
  - Sample rate conversion on digital input
  - Non-audio digital I/O support for Dolby Digital and HDCD
  - 32-channel / 32-bit digital mixer with 16 sub outputs
  - Multiple dither algorithms per channel
  - SMPTE time code reader and generator with MTC conversion
  - Optional LS-ADAT daughter card adds ADAT I/O
  - Optional LynxTWO/Aurora Interface Kit allows the card to front-end an Aurora converter
releaseDate: "2000"
