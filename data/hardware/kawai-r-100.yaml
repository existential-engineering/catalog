description: >-
  The R-100 was Kawai's first digital drum machine, released in 1987. It
  features 24 PCM sounds organized into eight banks with touch-sensitive pads
  and eight individual outputs. Its 12-bit sampling at 32kHz delivered
  impressive drum sounds for the era.
details: |-
  The R-100 represents a significant milestone as the first digital drum machine released by Kawai in 1987. It organizes its sound library into eight banks, each containing three samples, with each bank assigned to a touch-sensitive pad. This design enables performers to add dynamics to their patterns, with adjustable pad sensitivity and individual instrument sensitivity.

  The workflow revolves around creating patterns of up to 99 beats per bar, linking patterns into songs, and chaining songs together. A backlit 16x2 character LCD screen handles navigation, displaying essential song and pattern information. The unit includes several editing features for correcting errors and modifying patterns on the fly.

  The front panel houses the LCD, a memory cartridge slot, metronome and stereo volume controls, and the main command interface. The rear panel provides comprehensive connectivity including MIDI IN/OUT/THRU, stereo outputs, a headphone jack, eight individual outputs, footswitch inputs for start/stop and hi-hat control, and sync/clock connectivity. An optional RC-16 memory cartridge extends the onboard storage capacity.
specs: |-
  - 8-voice polyphony
  - 8-part multitimbral
  - 12-bit PCM sound engine at 32kHz sampling rate
  - 24 sounds organized into 8 banks of 3 samples each
  - Touch-sensitive pads with adjustable sensitivity
  - 100 user patterns, up to 99 beats per bar
  - 100 user songs
  - 8 individual audio outputs
  - Stereo outputs (L/Mono and R)
  - Headphone output
  - MIDI In/Out/Thru
  - Footswitch inputs for Start/Stop and Hi-Hat
  - Sync/clock connectivity
  - Backlit 16x2 character LCD
  - Optional RC-16 memory cartridge expansion
