id: VHYVweyskn6serH9CKsfl
name: 20th Anniversary ABM-600-EVO-IV
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/20th-anniversary-abm-600-evo-iv
description: A limited-edition, hand-built 600-watt bass amplifier head built on
  Ashdown's ABM EVO-IV platform, with a variable valve-driven preamp using a
  12AX7 tube, a 9-band EQ, one-knob dynamic compression and a sub-harmonic
  generator. Styled to match the 20th Anniversary ABM 410H cabinet with black
  diamond check vinyl and an anodized alloy front panel.
details: |-
  Hand-built, hand-wired limited-edition ABM EVO-IV bass head, styled to match the 20th Anniversary ABM 410H cabinet with custom black diamond check vinyl and an anodized alloy front panel. Variable Valve Drive preamp (12AX7) footswitchable from clean to overdrive, a 9-band EQ with Bass/Middle/Treble rotaries plus six sliders at 100Hz, 180Hz, 340Hz, 1.3kHz, 2.6kHz and 5kHz, Ashdown's One Knob dynamic compressor, and an independently controllable sub-harmonic generator. Signature VU input level meter. Tuner output, line out, transparent FX loop and a line input for an external source; output muting cuts the DI output while leaving the tuner output live. Optional FS-4 footswitch controls compression, EQ, drive and sub harmonics. The anniversary run was limited to the end of 2017, each unit tested with a hand-signed label by Ashdown founder Mark Gooday.
specs: |-
  - Power output: 600W
  - Power requirement: 115/230V
  - Speaker outputs: 2 x Jack/Speakon sockets
  - Frequency response: -3dB at 17Hz and 30kHz
  - High instrument input: 3.9M Ohms, input range 150mV - 10V p-p
  - Low instrument input: 10k Ohms, input range 300mV to 40V p-p
  - Line input: 22k Ohms, 0dBu nominal
  - DI output: 600 Ohms balanced, -20dBu nominal with ground lift
  - Tuner output: 22k Ohms, 0dBu nominal
  - Minimum impedance: 4 Ohms
  - EQ: 9-band
  - Effects send: 22k Ohm, 0dBu nominal
  - Effects return: 22k Ohm, 0dBu nominal
  - Preamp tubes: 1 x 12AX7
  - H x W x D: 135 x 474 x 320 mm
  - Weight: 12.5 kg
