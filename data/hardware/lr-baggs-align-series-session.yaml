details: |-
  Inspired by our live video sessions, the Align Session brings studio quality saturation and multi-band compression to your pedalboard. Often used by studio engineers in post-production, saturation adds warmth, dimension, and harmonics to craft a rich sonic character for your acoustic signal. Unlike standard compression that can squash the entire range of your signal, our custom compression consists of three narrow bands of compression that target certain problematic frequencies for a focused response. Like a dynamic EQ, the harder you strum, the more they compress.
specs: |-
  - Analog saturation adds warmth, dimension, and harmonic content
  - Three-band compression targeting problematic frequencies (dynamic-EQ behavior)
  - Adjustable gain for passive and active pickups
  - Volume level control
  - Engage footswitch for affected signal or true bypass
  - Built-in preamp
  - Powered by 9V battery or 9V DC supply
