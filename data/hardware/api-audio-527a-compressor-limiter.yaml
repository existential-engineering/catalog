name: 527A Compressor/Limiter
manufacturer: api-audio
primaryCategory: compressor
supersedes: CPkGGj-5q0OwzxIVVEw-0
categories:
  - limiter
  - dynamics
  - rack-mount
url: https://apiaudio.com/product/527a-compressor-limiter/
description: VCA-based 500-series compressor/limiter with API's patented THRUST®
  circuit, selectable feed-forward/feed-back compression modes, hard/soft knee
  switching, and 31-position detented controls. Built with 2510/2520 discrete
  op-amps; linkable for stereo applications.
details: |-
  500-series VCA compressor/limiter. Feed-forward or feed-back
  compression mode selectable. Hard or soft knee. THRUST® frequency-dependent
  sidechain filter. 31-position detented controls: threshold (+10 to −20 dBu),
  ratio (1:1 to 1:∞), attack (1–25 ms), release (0.3–3 s), output. 10-segment
  GR/VU meter with overload LED. Soft and hard relay bypass. API 2510/2520
  discrete op-amps. Linkable for stereo/multichannel. VPR Alliance compliant.
specs: |-
  - Input impedance: 120 kΩ (balanced)
  - Output impedance: 75 Ω (transformer coupled, balanced)
  - Max input: +26 dBu
  - Max output: +30 dBu
  - Attack: 1–25 ms
  - Release: 0.3–3 s
  - Ratios: 1:1 to 1:∞
  - Threshold: +10 to −20 dBu
  - Frequency response: ±0.5 dB (20 Hz–40 kHz)
  - S/N ratio: 110 dB
  - Power: 3.5 W
  - Dimensions: 1.5″ × 5.25″ × 7″
  - Weight: 1.8 lb
