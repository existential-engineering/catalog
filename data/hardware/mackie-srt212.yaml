name: SRT212
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/loudspeakers/srt-series/SRT212.html
description: 'Mackie SRT212 12" 1600W professional powered loudspeaker with
  Advanced Impulse DSP acoustic tuning, Class-D amplifier, SRT Mix Control
  built-in 4-channel digital mixer, and Bluetooth streaming.'
details: |-
  Designed with real-world 'throw and go' situations in mind, Mackie SRT212 12-inch powered speakers bundle our Advanced Impulse DSP acoustic tuning technology with an ultra-powerful 1600W Class-D amplifier, custom transducers, and Bluetooth® streaming to create the ultimate workhorse loudspeaker.

  Be amplified to rock within minutes. The Mackie SRT212 12-inch powered speakers is loaded with time-saving features like the SRT Mix Control™ built-in 4-channel digital mixer with Bluetooth and Advanced Impulse™ DSP tuning to help you get up and running quickly with crystal clear sound. And with its transparent system protection, the amplifier won't give up when it matters most—because the show must go on.
specs: |-
  - 1600W Class-D amplifier
  - 12" LF driver
  - 1.4" HF driver
  - Dual XLR/TRS inputs (mic, line, instrument)
  - Stereo 1/8" aux input
  - XLR Direct Out per channel
  - XLR Mix Out
  - Frequency response: 44Hz – 20kHz
  - Max SPL: 132 dB
  - Coverage: 90° horizontal x 60° vertical
  - Alignment delay – up to 100 feet
  - Weight: 32.5 lb / 14.7 kg
  - Dimensions: 25.9 x 15.2 x 14.2 in / 658 x 386 x 361 mm
  - Bluetooth streaming
  - SRT Mix Control™ built-in 4-channel digital mixer
  - Advanced Impulse™ DSP tuning
  - M10 flypoints
