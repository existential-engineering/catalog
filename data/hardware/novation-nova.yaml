description: >-
  The Novation Nova is a repackaged SuperNova in a desktop performance module format, using
  analog sound modeling to create clean but analog-like sounds with 12-voice polyphony, 36
  oscillators, a 40-band vocoder, and 42 simultaneous effects.
details: |-
  Novation repackaged the SuperNova into a desktop performance module dubbed the Nova. It uses analog sound modeling (ASM) to create stunningly clean but analog-like sounds. Each voice features 3 completely independent oscillators, a variable noise source, and 2 ring modulators, yielding 36 oscillators, 24 ring modulators, and 12 noise sources available at once.

  All waveforms can be combined in the mixer section allowing the creation of very fat and complex timbres with over 130 modulation routings. The Nova includes two inputs for filtering external sounds, a 40-band vocoder, and 42 simultaneous effects including distortion, comb filter, chorus, phaser, flanger, delay, reverb, panning, tremolo, and EQ.

  As a performance module, the Nova is extremely hands-on with 20 knobs and 90 switches. The arpeggiator functions more like a real-time music processor with 384 monophonic, polyphonic, and user patterns available. Sounds can be layered in performances allowing arpeggiated and sustained sounds to be played simultaneously, with up to 6 arpeggiators running at once.

  With OS version 4.1, base polyphony was raised to 16 voices, and Novation added the DoubleSaw waveform with phasing, detuning, and unison, nine new special filter types, adjustable unison, and a knob pass-through option. A Nova II keyboard version was also released featuring 24-voice polyphony expandable to 48.
specs: |-
  - Polyphony: 12 voices (expandable to 24, 36, and 48)
  - Oscillators: 3 per voice (saw and variable pulse width) plus noise
  - LFO: 2 LFOs (saw, tri, square, sample/hold)
  - Filter: Resonant low-pass, high-pass, band-pass; 12, 18, and 24 dB/oct slopes with overdrive
  - Envelopes: 1 ADSR for amp, 2 DADSRs
  - Effects: Distortion, comb filtering, EQ, reverb, chorus, flange, phaser, delay, panning, 40-band vocoder
  - Keyboard: None (desktop module); keyboard version available in 49 or 61 notes
  - Memory: 256 programs, 128 performances
  - Control: MIDI (6 parts)
releaseDate: "1999"
releaseDateYearOnly: true
