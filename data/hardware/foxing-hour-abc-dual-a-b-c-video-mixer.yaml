description: A Eurorack module offering two sub-circuits, each with two positive
  inputs and one negative input, for additive and subtractive mixing of video
  luma signals.
details: |-
  ABC offers two sets of sub-circuits, each with two positive inputs (A and B) and one negative input (C). Perform simple additive and subtractive mixing with video luma signals. Mathematical equations can be preconfigured based on different BOMs. Builders will have the choices of, but not limited to the following: A+B-C (A+B)/2-C (Recommended) (A+B-C)/2

  Assembled units use the (A+B)/2-C configuration. It is also the recommended config for builders unsure about which to choose.
