description: The SoCo 16 LC is a semi-hollow electric guitar inspired by
  Austin's South Congress district. It features a solid maple center block and
  slightly larger 16" body dimensions that deliver versatile tones ranging from
  warm punchy jazz to sparkling airy leads. Built with a Honduran mahogany neck,
  rosewood fingerboard, and Lollar Low Wind Imperial Humbuckers, it combines
  classic construction with premium components.
details: |-
  The SoCo 16 LC is Collings Guitars' semi-hollow electric, named after Austin's South Congress Avenue. The body features maple laminate construction with a solid maple center block to reduce feedback while preserving resonant semi-hollow tone. At 16" wide, it sits in a slightly larger body format than many competitors. The neck is Honduran mahogany with an extra long mortise and tenon joint for solid neck-to-body coupling, topped with a rosewood fingerboard at a 12" radius. Electronics consist of Lollar Low Wind Imperial Humbuckers wired in 50s style with CTS 500K pots and Jupiter Vintage Yellow capacitors. Hardware includes a Kluson ABR-1 bridge and stop tailpiece, Gotoh tuners with Collings logo buttons, and a high gloss nitrocellulose lacquer finish. The guitar ships with D'Addario NYXL1149 strings and a deluxe hardshell case.
specs: |-
  - Body: Semi-hollow, maple laminate with solid maple center block
  - Body Width: 16"
  - Body Length: 20 1/4"
  - Body Depth: 1 5/8"
  - Total Length: 42 5/8"
  - Neck: Honduran mahogany, extra long mortise & tenon joint
  - Fingerboard: Rosewood, 12" radius
  - Inlays: MOP dots, 5mm non-tapered
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Frets: Medium 18% nickel-silver
  - Pickups: Lollar Low Wind Imperial Humbuckers
  - Controls: CTS 500K pots, Jupiter Vintage Yellow capacitors, 50s-style wiring
  - Knobs: Amber or black top hat
  - Bridge: Kluson ABR-1 (nickel-plated zinc)
  - Tailpiece: Kluson stop tailpiece
  - Tuners: Gotoh (nickel) with Collings logo
  - Binding: Non-grained ivoroid body and fingerboard binding
  - Pickguard: Black/Cream/Black
  - Finish: High gloss nitrocellulose lacquer
  - Peghead: Ebony veneer with MOP logo
  - Strings: D'Addario NYXL1149 (included)
  - Case: Deluxe hardshell case included
