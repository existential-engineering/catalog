description: Designed alongside Gregg Bissonette, this pedal recreates the swinging motion of traditional tambourine.
details: |-
  Designed alongside session and touring master, Gregg Bissonette, the foot-activated "Tambo Pedal" faithfully recreates the swinging hand motion of traditional tambourine technique.

  A height-adjustable, rubber padded stopper mimics the heel of the hand; an upright backstop for the dual-row steel jingle half moon tambo.

  A single chain-and-sprocket drive system is attached to a compact, single post 2000 pedal. Easy to position next to the hi-hat in any set-up.
specs: |-
  - Removable pro tambourine with ergonomic half moon shape and dual-row jingles
  - Single post 2000 pedal, compact and easy to position to the left of the hi-hat
  - Steel base plate, sturdy and solid on most carpeted surfaces
  - Single-Chain Sprocket drive
