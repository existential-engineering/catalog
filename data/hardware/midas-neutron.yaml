url: "https://www.midasconsoles.com/en/products/0603-ABF"
description: "High-performance audio system engine at the centre of the Midas
  PRO X live mixing system, the result of a three-year R&D program. Delivers 168
  simultaneous input channels and 99 time-aligned, phase-coherent output mix
  buses operating at 96 kHz with 40-bit floating-point processing and 62.5 µs
  latency. State-of-the-art DSP and FPGA technology in a MIMD architecture
  provides more than 100 Gigaflops of real-time audio processing, supporting up
  to 24 simultaneous multi-channel effects and up to 36 graphic equalizers.
  Klark Teknik HyperMAC (AES50-compliant) and AES50 digital audio networking
  provide 288 inputs and 294 outputs at 96 kHz over Gigabit Ethernet, with dual
  redundant HyperMAC snake connection to the PRO X Control Centre on optical
  fibre (up to 500 m on 50/125 µm multimode) or copper CAT5/5E (up to 100 m).
  N+1 redundancy across four DSP cards (three required for operation) and three
  removable, interchangeable power supplies. Compatible with all Midas digital
  I/O units and any AES50-equipped device. Rugged 7U steel rackmount enclosure
  with a future-proof expansion card slot. Designed for theatres, concert
  touring, broadcast and festivals."
details: |-
  Audio system engine for the Midas PRO X live mixing system. State-of-the-art DSP and FPGA technology in MIMD architecture delivering more than 100 Gigaflops of real-time processing at 40-bit floating-point precision and 96 kHz sample rate, with 62.5 µs latency. 168 input channels and 99 time-aligned, phase-coherent output mix buses; up to 24 simultaneous multi-channel effects and up to 36 graphic equalizers. Klark Teknik HyperMAC (AES50-compliant) provides a dual redundant snake to the PRO X Control Centre - 192 bidirectional channels over optical fibre (up to 500 m on 50/125 µm multimode) or copper CAT5/5E (up to 100 m Gigabit Ethernet), with CRC error detection and a dedicated 200 Mbit/s auxiliary data channel for control. Eight AES50 system connectors (24 channels each, RJ45 XLR) connect Midas digital I/O units and any other AES50-equipped devices. N+1 redundancy from four DSP cards (three required for operation) and three removable, interchangeable power supplies. Rear panel input, output, and power connections. Rugged 7U steel rackmount enclosure with a future-proof expansion card slot. Suitable for theatres, concert touring, broadcast and festivals.
specs: |-
  - Input Channels: 168 simultaneous input channels
  - Output Mix Buses: 99 time-aligned and phase-coherent output mix buses
  - Network Channel Capability: 288 inputs and 294 outputs at 96 kHz sampling rate
  - Sample Rate: 96 kHz
  - Processing Precision: 40-bit floating point
  - DSP Power: More than 100 Gigaflops of real-time audio processing
  - Architecture: MIMD (Multiple Instruction, Multiple Data) DSP and FPGA technology
  - DSP Cards: 4 standard, N+1 redundant (3 required for full operation)
  - Latency: 62.5 µs at 96 kHz sampling rate
  - Simultaneous Effects: Up to 24 multi-channel effects
  - Graphic Equalizers: Up to 36
  - HyperMAC Snake: Dual redundant, 192 channels bidirectional digital audio
  - HyperMAC Optical Fibre Distance: Up to 500 m on 50/125 µm multimode
  - HyperMAC Copper Distance: Up to 100 m over CAT5/5E (Gigabit Ethernet)
  - HyperMAC Auxiliary Data Channel: 200 Mbit/s dedicated for control data
  - AES50 System Connectors: 8 x AES50 (24 channels bidirectional digital audio) on RJ45 XLR
  - Snake connector (fibre): HyperMac (192 channels of bi-directional digital audio) on optical XLR
  - Duplicate snake connector (fibre): HyperMac (192 channels of bi-directional digital audio) on optical XLR
  - Snake connector (copper): HyperMac (192 channels of bi-directional digital audio) on RJ45 XLR
  - Duplicate snake connector (copper): HyperMac (192 channels of bi-directional digital audio) on RJ45 XLR
  - Control Expansion: 2 x RJ45 XLR
  - Ethernet Tunnel: RJ45 XLR
  - Word Clock IN connector: BNC
  - Word Clock OUT connector: BNC
  - AES3 Sync IN connector: 3-pin XLR
  - AES3 Sync OUT connector: 3-pin XLR
  - Power Supplies: Three removable, interchangeable PSUs with N+1 redundancy
  - AC Requirements: 100 V to 240 V, 50 Hz to 60 Hz
  - Power Consumption (2 PSUs): 0.54 A, 124.2 W / 1.10 A, 126.5 W
  - Power Consumption (3 PSUs): 0.69 A, 158.7 W / 1.15 A, 132.25 W
  - Operating Temperature Range: +5 °C to +40 °C
  - Storage Temperature Range: -20 °C to +60 °C
  - Dimensions: 7 U high, 425 mm deep
  - Net Weight: 25.5 kg
  - Shipping Weight: approx. 30 kg
