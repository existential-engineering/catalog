description: Vast range of tones, simple controls. 35 watt Redland Reverb head
  with 6L6 power tubes and variable output down to 1 watt.
details: |-
  35 watt head version of the Redland Reverb with 6L6 power tubes and
  tube-driven power scaling from 1W–35W. Unique tone stack drawing
  inspiration from Dumble and Peavey designs. Bass control provides a sizable
  scoop affecting 100Hz–1kHz. Treble uses a steeper 12dB/octave rolloff.

  Built with point-to-point construction on terminal strips, Soursound
  transformers with wax-potted output transformer, and Jupiter Yellow
  capacitors. Fits the Benson 1x12 and horizontal 2x12 speaker cabinets.
  Handmade in Portland, OR.
specs: |-
  - Power: 35W (2x6L6), variable from 1W–35W
  - Tubes: 2x12AX7, 1x12DW7 (reverb driver), 6L6GC (voltage regulator for power scaling)
  - Fuse: 3A Slo Blo
  - Speaker outputs: 1x 8 ohm, 1x 16 ohm
  - Controls: Volume, Wattage, Reverb, Bass, Treble
  - Construction: point-to-point on terminal strips, Soursound transformers, Jupiter Yellow capacitors, 12dB/octave treble rolloff
  - Cabinet: dovetailed pine
  - Dimensions: 21"W x 11"H x 8.5"D, 27 lbs
