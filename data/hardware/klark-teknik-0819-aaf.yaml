description: The DN9824 is a digital loudspeaker management processor with two
  inputs, four outputs and full matrix routing between them. It provides the
  crossover, equalisation, delay and limiting functions needed to drive a
  multi-way loudspeaker system, with internal summing of the two inputs to
  support redundant or stereo-summed mono feeds.
details: |-
  The DN9824 is a digital loudspeaker management processor with two inputs, four outputs and full matrix routing between them, carrying the crossover, equalisation, delay and limiting a multi-way loudspeaker system needs. The two inputs can be summed internally, which supports redundant feeds or a stereo-summed mono feed.

  Any of the four outputs may be assigned to Input A, Input B or the sum of A and B through the internal matrix. The same chassis can therefore serve as a 1:4 distribution crossover, a 2:2+2 stereo crossover, or any other combination the system topology calls for.

  Each of the four outputs provides six bands of parametric EQ for component-specific correction. A library of factory presets covers common loudspeaker combinations, and selecting a preset configures crossover frequencies, slopes, EQ and limiter parameters for that system, after which user parameters can be adjusted on top.

  Typical applications are touring PA processing, installation loudspeaker management and broadcast monitoring. The factory presets shorten setup time when a system changes, while the parametric EQ covers room correction and component compensation.
specs: |-
  - 2 inputs and 4 outputs with full matrix routing
  - Internal summing of Input A plus Input B
  - Output assignment to Input A, Input B or A+B
  - Six bands of parametric EQ per output
  - Crossover, delay and limiter per output
  - Factory preset library for common loudspeaker combinations
  - Balanced input and output, 1U rackmount
