description: The LTD Surveyor-204DX takes a classic ESP bass shape and offers it with great LTD quality and high value. Built with bolt-on construction at 34" scale, the Surveyor-204DX includes a lightweight, resonant poplar body with a burled poplar top, imparting a superbly unique look with the knots and figured wood grain showing through the transparent finish. It features a smooth and comfortable roasted maple neck with rosewood fingerboard, dot inlays, and 21 extra-jumbo frets. Components on the Surveyor-204DX include black hardware, LTD vintage tuners, an LTD DB-4 fixed bridge, controls for volume, balance, and tone boost, and a set of ESP LJB (bridge) and LPB (neck) pickups.
