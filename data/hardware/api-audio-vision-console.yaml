id: wAwIsy1P-cJadbdBLwG89
name: Vision Console
manufacturer: api-audio
primaryCategory: console
url: https://apiaudio.com/product/vision-console/
description: Analog surround recording and mixing console designed from the
  ground up for surround work. Features surround assign and panning per fader,
  5.1 mix bus, moving faders, simultaneous surround and stereo mixing, and
  comprehensive resettable switch automation. Available in 48, 64, and 80
  channel configurations.
details: "48/64/80-channel large-format analog console optimized for surround
  production. Each channel: dual input, two 100 mm motorized faders, 5-channel
  surround panning per fader, dedicated 5.1 mix bus, 3 stereo buses, 24 main
  buses, 10 aux sends, sweep filter, choice of 550L 4-band or 560L 10-band
  graphic EQ. Optional dynamics: 225L compressor and 235L noise gate. Center
  section: comprehensive surround monitoring (8 multi-channel playback
  selectors, bass management, individual solo/mute per surround speaker,
  fold-down matrix), machine control, monitor calibration, 3 sets of speaker
  assigns. Resettable switch and bus assign automation. Optional Final Touch
  Automation."
specs: |-
  - Configurations: 48, 64, or 80 channels
  - Faders: two 100 mm motorized per channel
  - Main buses: 24
  - Stereo buses: 3
  - Aux sends: 10
  - Monitor playback selectors: 8 multi-channel
  - Automation: resettable switch + bus assign, Final Touch optional
