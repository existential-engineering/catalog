description: Compact desktop guitar amp combining component-level digital
  modelling, Neural Amp Modeler (NAM) compatibility, and Hi-Fi Bluetooth audio
  playback.
details: |-
  For musicians who want inspiration without barriers — powerful immersive sound, intuitive control and the world's best tones, all in a compact desktop amp you can take anywhere. Combining decades of amp design expertise with cutting-edge component-level digital modelling and Neural Amp Modeller (NAM) compatibility, Beam Mini redefines what a compact amp can be. Enjoy best-in-class guitar tone and world-class Bluetooth audio playback, without compromise.

  Beam Mini delivers the dynamic, responsive feel of a true valve amp through advanced component-level modelling. Eleven authentic electric guitar amps (six Blackstar designs and five Ampton recreations of iconic amps), three bass amps, an acoustic voice and over 35 studio-grade effects deliver authentic tone with modern flexibility.

  Beam Mini is the first guitar amp that can load Neural Amp Modeler (NAM) captures. Partnering with TONE3000, Beam Mini accesses the world's largest open-source NAM library — explore 200,000+ community-created captures from classic and boutique amps to rare, experimental rigs directly from the Beam app. (NAM support coming Spring 2026.)

  Our sealed acoustically-tuned cabinet uses two full-range drivers plus two passive bass radiators, combined with Super Wide Stereo, to deliver powerful and articulate guitar tones and exceptional Bluetooth music playback. CabRig uses IR-based speaker and mic simulation for lifelike presence, while 'In The Room' technology brings the feel of a real valve amp.

  Jam along with Hi-Fi quality Bluetooth audio or unplug your guitar and use Beam Mini as a powerful portable speaker, with 18+ hours of battery life. A headset mic input with studio-quality preamp and reverb captures vocals and guitar wherever you are, and Beam Mini ships with Ableton Live Lite included. Future Moises stem-separation integration is planned via software update (August 2026).
specs: |-
  - Compact desktop guitar amp with 18+ hours of battery life
  - Eleven electric guitar amp models (6 Blackstar + 5 Ampton recreations)
  - Three bass amp models and an acoustic voice
  - Over 35 studio-grade effects
  - Component-level digital modelling
  - Neural Amp Modeler (NAM) capture loading via Beam app (Spring 2026)
  - TONE3000 integration for 200,000+ NAM captures
  - Sealed acoustically-tuned cabinet with two full-range drivers and two passive bass radiators
  - Super Wide Stereo
  - 'In The Room' technology for valve-amp feel
  - IR-driven CabRig speaker and mic simulation
  - Patented ISF (Infinite Shape Feature) tone control
  - Light Beam display and SpeedDial control
  - XpressFX for single-control effect intensity
  - Headset mic input with studio-quality preamp and reverb
  - Bluetooth connectivity for Hi-Fi audio playback and patch sharing
  - Designed for electric, bass and acoustic guitar
  - Ableton Live Lite included
  - Beam app for amps, cabs, mics, pedals, patches and community sharing
  - Future Moises stem-separation integration (August 2026 update)
