details: |-
  The Dyno My Roto puts a tri-chorus, a flanger and a rotary speaker cabinet voice in a compact pedal, aimed at the rack chorus sounds of the 1980s. Where most chorus pedals carry two voices, one dry and one modulated, this one uses three low-frequency oscillators so that several voices are modulated at once, which blurs any single affected voice into a thicker, more diffuse chorus.

  The rotary cabinet mode adds a Proximity control, which sets how far the listener sits from the spinning speaker cabinet. It adds depth and distance, behaving a little like a reverb control, and gives the rotation either presence or spatial expanse.

  The third voice is a RotoFlange sound with a simple negative feedback control, intended to reach classic flanger tones with a single knob.
