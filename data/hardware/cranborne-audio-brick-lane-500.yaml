description: Cranborne Audio Brick Lane 500 - 500 Series analogue PWM Compressor
  with 6 operating modes and variable Stress control for harmonically-enriched
  compression effects.
details: |-
  The Brick Lane 500 is not merely a compressor, it's a sophisticated sonic instrument designed for audio professionals who demand absolute control and exceptional sound quality. Whether tracking, mixing, or mastering, this modal compressor adapts to your most demanding audio sculpting requirements.

  At the heart of the Brick Lane 500 lies its groundbreaking Modal PWM Compression technology, a paradigm-shifting approach that empowers audio professionals with unparalleled compression flexibility. Unlike conventional compressors, this innovative design allows for unlimited shaping of compression envelopes and styles without compromise.

  The Brick Lane 500's Modal PWM Compression is like having six legendary hardware compressors at your fingertips, each with its own distinct personality, sonic signature, and dynamic DNA. Every mode effectively rewires your patchbay and brings a totally different style of compression, with compression ratios ranging between gentle 2:1 nudges and aggressive 20:1 sonic obliterations.

  The proprietary "Stress" control becomes a chameleon, radically changing its harmonic character and saturation profile in each mode. What adds subtle tube warmth in VELVET becomes a transient-destroying beast in SMASH, a mix-gluing agent in GLUE, and a loudness/clipping finalizer in POLISH.

  Brick Lane 500 features Cranborne Audio's OPTOSYNC technology, enabling two Brick Lane 500 units to work as a perfect stereo pair for mixes and stereo sources. Using OPTOSYNC, all controls are synchronized from the left unit to the right without cables or internal fixings, via LED and optical communication.
specs: |-
  - 6 compression modes: Velvet, Float, Smash, Tame, Glue, Polish
  - Compression Element: Pulse Width Modulation
  - Switching Frequency: 250kHz
  - Max Input Level: +24dBu (<0.003% THD)
  - Max Output Level: +26.5dBu (<0.003% THD)
  - Frequency Response: ±0.5dB, 2 Hz - 80 kHz
  - Noise Floor: <-100dBu (unweighted)
  - Dynamic Range: >118dB
  - Input Impedance: Line = 43 kOhms
  - Output Impedance: Line = 150 Ohms
  - Current Draw: 140mA per rail typical, 160mA per rail max
  - Distortion (THD): <0.0006% THD+N at 0dB GR, <0.00085% THD at 5/10/20dB GR
  - Harmonics (Stress Control): <20% THD depending on conditions
  - Stress Control Frequency Range: 200Hz - 6.2kHz
  - Sidechain Detection HPF: selectable OFF, 60Hz, 100Hz, 200Hz
  - Minimum Attack Time (Standard): 6 nanoseconds (2 microsecond processing delay)
  - Minimum Attack Time (POLISH mode with Analogue Lookahead): 6 nanoseconds (0ns processing delay @ 20kHz)
  - 12-segment LED level meter and 12-segment LED gain reduction meter
  - ±20dB input and output/make-up gain level
  - OptoSync wireless communication between modules for linked stereo control
  - 1/8" TRS socket for linking non-adjacent modules
  - Circuit auto-calibration for perfect stereo matching
  - True-bypass IN/OUT switching with complete or post input trim modes via DIP switch
  - Stepped, front-panel controls for recall and precise feel
  - Operating Temperature: +1 to 35°C
  - Storage Conditions: -20 to 50°C
  - Dimensions: 170mm W x 31mm H x 133mm D (6.6" x 1.2" x 5.2")
  - Unit Weight: 0.4kg (0.9 lbs)
