details: |-
  The D-18 Authentic 1937 is part of Martin's Authentic Series, a line dedicated to recreating instruments from what the company considers one of the finest years in its history. The guitar uses hide glue construction and historically accurate detailing throughout, drawing its body profile from early Golden Era Dreadnoughts.

  Genuine mahogany back and sides are paired with an Adirondack spruce top, and an Authentic 1937 forward-shifted scalloped bracing pattern delivers a dry, punchy tone with remarkable clarity. The neck is genuine mahogany with an Authentic 1937 shape and standard taper, joining the body at the 14th fret with a dovetail joint set in hide glue.

  Martin's Vintage Tone System (VTS) thermally ages both the top and braces to capture the rich, open sound of a well-preserved pre-war instrument. Period-accurate appointments include Waverly nickel open-back tuners with butterbean knobs, a Madagascar rosewood headplate with Script Old Style overlay logo, an Old Style 18 multi-stripe rosette, and abalone Old Style 18 fingerboard inlays.

  The ebony bridge uses an Authentic belly shape with a long glue-in bone saddle on a 16" radius, and the guitar ships in a ply hardshell case. A limited lifetime warranty is included.
specs: |-
  - Body size: Authentic D-14 Fret (Dreadnought)
  - Top: Adirondack Spruce with VTS
  - Back & sides: Genuine Mahogany
