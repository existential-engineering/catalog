  - Tuners: Waverly Nickel Open Back, Butterbean Knobs
  - Headstock: Solid with 1937 Taper
  - Headplate: Madagascar Rosewood
  - Headplate logo: Script Old Style Overlay
  - Binding: Brown Tortoise Pattern
