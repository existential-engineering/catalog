description: Inspired by the vintage lowboy hi-hats of the 1920s.
details: |-
  Inspired by the vintage lowboy hi-hats of the 1920s and utilizing the latest GlideTrack drive technology, the DW Lowboy hi-hat stand is smooth and effortless to play.

  A unique percussion accessory that easily fits into any drum set-up, it allows drummers to stack cymbal effects, add a hi-hat tambourine, or simply keep time the way they would with their main hi-hat. Percussionists can combine it with a pedal cajon to create a compact trap kit.

  It comes with a convenient nylon carrying bag. USA Patent No. 10,943,571.
specs: |-
  - Low-profile design suited to cajon players, with a modified steel base plate for enhanced stability
  - Glide Track Drive System
  - Adjustable cymbal seat for quick cymbal angle fine-tuning
  - Non-skid rubber grip material
  - Includes nylon carrying bag
