details: |-
  Project Lone Pine was Kali Audio's debut line of studio monitors, built around a 6.5-inch and an 8-inch 2-way system. The original LP-6 is the 6.5-inch model in that line.

  The original LP-6 is succeeded by the 2nd Wave versions, the LP-6 V2 and LP-6W V2, alongside the LP-8 V2. Kali Audio describes the 2nd Wave versions as having a 12 dB lower noise floor, 3 dB higher output, smoother high frequency response, and other upgrades that benefit the acoustic and cosmetic quality of the speakers.

  First manufactured in July 2018 and last manufactured in March 2021, the original LP-6 carried a US price of $149 each, as did the white LP-6W. The 8-inch LP-8 in the same line was $199 each.

  1st Wave and 2nd Wave units can be told apart by their transducers. 1st Wave monitors have a dark black, shiny finish, while 2nd Wave monitors have a lighter matte finish. The 3rd to 9th digits of the serial number give the date of manufacture in MMDDYY format. LP-Series speakers made before March 20, 2021 are all 1st Wave, and those made after May 1, 2021 are all 2nd Wave.

  Transducers and amplifiers are optimised for use with one another, so in most cases they are not interchangeable between 1st Wave and 2nd Wave units. Kali Audio states that the user manual and specs for the original version can still be found on its product history page.
