description: The C10 Traditional is a compact parlor acoustic guitar from
  Collings' vintage-inspired Traditional Series, delivering a focused, punchy
  response with an open, airy midrange. It pairs the short-scale comfort of the
  C10 body with Traditional Series construction for a broken-in feel and
  surprising projection. Handcrafted in Austin, Texas, it features a Sitka
  spruce top, Honduran mahogany back and sides, and premium appointments
  throughout.
details: |-
  The C10 Traditional sits within Collings' Traditional Series lineup, blending the compact parlor form factor of the C10 body style with vintage-inspired build techniques. Its scalloped X-brace pattern with an abbreviated soundboard graft (tongue brace) and ultra-thin nitrocellulose lacquer finish allow the top to vibrate freely, producing a responsive, lively tone well-suited to fingerpicking and light strumming. The compound-radius ebony fingerboard (14" to 26") and Vintage Now neck profile offer modern playability in a period-correct package. Nickel Waverly tuners, a bone nut and saddle, and tortoise-style appointments complete the vintage aesthetic.
specs: |-
  - Body Style: Parlor (C10)
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard Inlays: MOP dots
  - Fingerboard Radius: 14" - 26" compound
  - Neck Profile: Vintage Now (Full C shape)
  - Peghead Profile: Haircut
  - Peghead Veneer: Ebony with gold MOP Collings logo
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Scale Length: 24 7/8"
  - Nut: Bone, 1 3/4"
  - Frets: Medium 18% nickel-silver
  - Bridge: Ebony straight-style, 2 5/16" spacing
  - Saddle: Bone, cut-through
  - Bridge Pins/End Pin: Tortoise-style
  - Tuners: Nickel Waverly
  - Brace Material: Sitka spruce
  - Brace Pattern: Custom Traditional Series scalloped X-brace with abbreviated soundboard graft (tongue brace)
  - Backstrip: 1-style (Walnut)
  - Body Binding: Ivoroid with wood purfling
  - Rosette: Custom wood rosette
  - Pickguard: Tortoise
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 14 3/4"
  - Body Length: 19 1/4"
  - Body Depth: 4 1/4"
  - Total Length: 40"
  - Strings: D'Addario EJ-16 (.012" - .053")
