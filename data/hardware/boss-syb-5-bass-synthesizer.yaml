description: >-
  Boss's compact analog-modeled bass synthesizer pedal featuring monophonic DSP synthesis with
  lowpass filter, LFO control, and expression pedal input for real-time manipulation.
details: |-
  The SYB-5 packs analog-modeled bass synthesis into Boss's familiar compact stomp-box format, succeeding the SYB-3 with a more aggressive and industrial-leaning sound character. Released eight years after its predecessor, it expanded the available waveforms from three to five while adding dedicated LFO rate control for more dynamic tonal movement.

  The synthesis engine offers sawtooth, square, and PWM waveforms through a monophonic DSP oscillator, shaped by a lowpass filter with resonance, cutoff, and decay controls. Two wave-shape modes process external audio in normal and reverse configurations. The improved square waveform delivers noticeably fuller results than the SYB-3, and pitch tracking performance is markedly better at the lower price point.

  LFO modulation can be controlled via the onboard rate knob or an optional Roland EV-5 expression pedal connected through the dedicated EXP input, enabling foot-controlled filter sweeps and modulation depth changes during performance. The trade-off for the enhanced synthesis features is the removal of the SYB-3's noise generator and auto-wah functions.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: Analog-modeled DSP, 1 oscillator (sawtooth, square, PWM)
  - LFO: 1 with rate control
  - Filter: Lowpass with resonance, cutoff, and decay
  - Effects: 2 wave-shape modes (normal/reverse) for external sound
  - Format: Stomp-box pedal
  - Memory: None
  - Control: Expression pedal input (EV-5 compatible)
releaseDate: "2004"
