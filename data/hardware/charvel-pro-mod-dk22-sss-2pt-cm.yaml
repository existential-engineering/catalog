description: The Pro-Mod DK22 SSS 2PT CM combines modern high performance with
  standout style and versatile tone, designed for players whose musical vision
  and versatility knows no boundaries.
details: |-
  The Pro-Mod DK22 SSS 2PT CM pairs Charvel's Dinky body shape with a Caramelized Maple fingerboard and an SSS pickup configuration tailored for tonal versatility. The alder body features a sculpted shredder's cut heel and a scalloped lower back bout for unrestricted upper-fret access and player comfort.

  The bolt-on caramelized maple neck is reinforced with graphite for stability and finished in hand-rubbed satin urethane for a fast, broken-in feel. A heel-mount truss rod adjustment wheel simplifies setup, while Luminlay side dots aid visibility on dark stages. The 12"-16" compound radius caramelized maple fingerboard carries 22 jumbo frets and 4mm pearloid dot inlays, with a Graph Tech TUSQ XL nut at 1.6875" width.

  Electronics center on a Seymour Duncan Custom Hot Rails SHR-1B humbucker in the bridge, paired with Custom Flat Strat SSL-6 single-coils in the middle and neck (RWRP at the neck for hum cancellation in positions 2 and 4). A 500K EVH Bourns low-friction volume pot, no-load tone control, and 5-position blade switch round out a flexible control layout, all wearing flat black pickup covers.

  Hardware is anchored by a Gotoh Custom 510 tremolo bridge and Charvel-branded die-cast locking tuners in chrome, strung with nickel-plated steel .009-.042 strings. The instrument ships with Stratocaster-style skirt knobs in a color complementary to the finish.
