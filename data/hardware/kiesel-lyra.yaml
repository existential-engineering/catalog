description: The Lyra is a design collaboration between Greg Howe and Kiesel
  Guitars, combining modern and classic aesthetics. Contemporary features
  include an optional deep top bevel and a sculpted neck heel for access to the
  24th fret, while a pickguard and traditional headstock refer back to earlier
  designs.
specs: |-
  - Configurations: 6-string and 7-string, in fixed and tremolo forms
  - Construction: bolt-on with radiused neck heel, sculpted neck heel
  - Body: alder
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck widths: 1.69 in or 1.90 in at nut depending on configuration
  - Fingerboard: ebony with 14 in radius
  - Frets: 24 stainless steel medium-jumbo, .103 in wide x .048 in tall
  - Scale length: 25.5 in
  - Headstock: GT-style
  - Bridge: Hipshot fixed bridge or Hipshot Solo Saddle, .4125 in (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Pickguard: white multi-layered
  - Inlays: white pearl dots, black-ring Luminlay Super Blue side dots
  - Hardware: chrome with white plastic knobs
  - Optional deep top bevel
  - Dimensions: 39.5 in long, 1.66 in thick, 11 in wide, or 40.15 in long, 1.68 in thick, 11.2 in wide
  - Weight: 7.8 lbs to 8.2 lbs
  - Strings: Elixir Nanoweb 1046E
  - The Greg Howe Signature is a separate model built on this platform
