details: |-
  The Formula 5F6 emulates the classic tweed Fender Bassman amplifier from the late 1950s — one of the most revered amp circuits in rock, blues, and country history. As part of Catalinbread's Foundation Overdrive series, it is designed to sit at the front of your signal chain and give any clean amp the feel, response, and tone of a cranked tweed Bassman.

  The Gain knob mirrors the Bright Volume control of the original amp circuit. At low settings it produces glassy, sparkly cleans; at midway it becomes touch-sensitive and dynamic; maxed out it delivers thick, harmonically rich overdrive. The full three-band tone stack (Treble, Middle, Bass) is a faithful reproduction of the original Bassman circuit.

  Inside the pedal, a Presence trimpot (factory-set at midway, accessible via the bottom plate) adjusts high-treble content for fine-tuning to your rig. A Mode Switch — accessed through the four bottom screws — toggles between Stock Bassman mode and Secret Lead mode, which increases gain and reconfigures the tone stack for a brighter, more aggressive edge.

  The Formula 5F6 accepts 9-18V DC. At 9V the sound is softer and more saturating; at 18V it gains headroom, volume, and a more percussive attack.
