details: |-
  The Friedman Dual Button Footswitch is the original footswitch for the SS-100 (V2), BE-50 Deluxe, BE-100 (Deluxe) and Butterslax, supplied with the mono cable that connects it to the amplifier.

  It controls two channel amps from the floor, and an LED indicator beside each button shows which channel is currently selected, so the state of the amp is readable on a dark stage.

  The enclosure is assembled in the USA and designed for working musicians, built to survive being carried to gigs rather than left on a desk.
specs: |-
  - Two button channel switching for two channel amps
  - LED indicators show channel selection
  - Supplied with mono connecting cable
  - Compatible amplifiers: SS-100 (V2), BE-50 Deluxe, BE-100 (Deluxe), Butterslax
  - Assembled in the USA
  - Passive unit, powered from the amplifier through its cable rather than from a supply of its own
  - Shipping dimensions: 7 in x 7 in x 7 in
  - Weight: 2 lbs
