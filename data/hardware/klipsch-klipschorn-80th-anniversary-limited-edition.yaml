details: |-
  The Klipschorn 80th Anniversary Limited Edition is a limited-run commemorative loudspeaker celebrating eight decades of the original Klipschorn design — the first Klipsch speaker ever produced and the longest continuously manufactured speaker in history.

  Unlike the standard AK7 three-way passive design, the 80th Anniversary is a two-way, fully horn-loaded loudspeaker with an active crossover included in the package. It features the new K-5-K high-frequency horn mated to a high-powered compression driver, and an eight-foot folded bass horn for deep, efficient low-frequency reproduction.

  The cabinet is finished with book-matched veneer and adorned with real brass inlays and a sandcast aluminum horn — materials chosen to evoke a mid-century modern aesthetic and heirloom-quality construction intended for multi-generational use. Each unit is hand-built to order at the Klipsch factory in Hope, Arkansas.

  The package includes a special 180g vinyl pressing of KlipschTape recordings from the 1950s — archival recordings made by Paul W. Klipsch himself. A 10-year warranty covers Heritage Classic speakers. The active crossover, tuned specifically for the Klipschorn by master acoustician and PWK protégé Roy Delgado, aligns time and phase while boosting frequencies and balancing EQ for a flat, color-free response.

  The Klipschorn must be placed in a room corner, where the corner acts as an acoustic boundary to complete and load the bass horn — a requirement of the original patented design.
