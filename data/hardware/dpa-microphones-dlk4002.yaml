description: The DLK4002 Live Microphone Kit includes vocal mics for lead and
  backup vocals, instrument mics for close-miking any type of live instrument –
  both acoustical and electric, as well as various pencil mics for spot miking
  instrument groups or capturing ambiance sounds.
details: |-
  With 20 mics and capsules together with a multitude of useful accessories, your live stage set up will never sound better.

  This fantastic kit has been updated with the newest versions of our mics and accessories – including CORE+ and MicroLock®.
