details: |-
  808 Bass Drum

  The 808 Bass Drum Clone Eurorack PCB and Front Panel Kit is a DIY drum module based on the original TR-808 bass drum circuitry, adapted for Eurorack modular systems. This design stays true to the classic sound while introducing practical enhancements for modular synthesis. Key Features

  Sound & Control

  This 808 bass drum clone delivers the unmistakable deep, punchy character of the original circuit, ranging from tight, percussive hits to long, booming bass drums. The added pitch control expands the sonic range beyond the vintage design, while the optional decay modification allows for extended sustain when desired. Dedicated tone, decay, and level controls make it easy to dial in classic 808 sounds or explore more experimental percussive textures within a modular environment. DIY Build & Front Panel

  This DIY Eurorack 808 bass drum PCB and front panel kit is intended for intermediate builders. The front panel is made from durable PCB material and screen printed by hand, ensuring a cohesive aesthetic alongside other Guru Gara Synth modules. Technical Specifications

  Skiff Friendly Module

  View Documents

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category. Video Demo
