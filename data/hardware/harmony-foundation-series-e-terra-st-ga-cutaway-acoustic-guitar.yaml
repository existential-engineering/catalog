details: |-
  The Harmony Foundation Series is one for the discerning musician, an inseparable acoustic companion to weave tales out of every path of the journey. The Terra ST GA Cutaway is a versatile acoustic built with a solid spruce top for improved response to playing dynamics and a tone that only gets better over the years. The single cutaway, which enables high-fret access, accommodates a variety of styles. The okoume neck's lightweight nature enhances sustain and resonance to ensure each note rings clear and true. Solid spruce X-bracing improves top vibration to afford superior sound projection and tonal depth. The Terra ST GA Cutaway comes pre-strung with D'Addario EXP16 coated strings, guaranteeing lasting bright tones for every session. Equipped with a custom Harmony under-saddle pickup, it seamlessly transforms the instrument's rich acoustic tones into plug-and-play capabilities, making it ideal for live performances and amplified sessions. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
