details: |-
  Add some color to your sound with the limited-release G9202 Honey Dipper Special. This round-neck resonator guitar has all the same features as the wildly popular G9201 Honey Dipper, with the additions of aged white fingerboard binding, screened headstock graphic and a weathered 'Bell Bronze' finish.

  The instrument features Gretsch's Ampli-Sonic diaphragm hand-spun from nearly 99 percent pure aluminum in Eastern Europe. Construction includes a bell brass metal body, hard maple biscuit bridge with ebony and maple saddle, mahogany neck with Medium 'V' profile, and bound padauk fingerboard. Equipped with Grover Sta-Tite tuners with black buttons and a bone nut.
specs: |-
  - Series: Roots Collection
  - Body: Bell Brass, Resonator, Non-Cutaway
  - Neck: Mahogany, Medium 'V' shape, Vintage Semi-Gloss
  - Scale Length: 25"
  - Fingerboard: Padauk, bound, 15.75" radius
  - Frets: 19 medium jumbo
  - Nut: Bone, 1.75" width
  - Bridge: Hard Maple Biscuit with Ebony/Maple Saddle
  - Tailpiece: Weathered Trapeze
  - Tuning Machines: Grover Sta-Tite with black buttons
  - Hardware: Nickel
  - Strings: D'Addario EJ16 Phosphor Bronze (.012-.053)
  - Finish: Weathered Bell Bronze
