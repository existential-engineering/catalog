details: |-
  The S612 was one of Akai's first professional rack-mount samplers, released in 1985. It offered 12-bit sampling with variable rates from 4 to 32kHz, along with loop and truncate functions for sample manipulation. The device featured an overdub function and mic or line input jacks for audio capture.

  With only 128KB of internal memory, the S612 provided a maximum of 8 seconds of sampling time at the lowest sampling rate available. Users required an optional disk drive using the Quick Disk (QD) 2.8 inch format for permanent sample storage, with each disk side storing only a single sample.

  Despite its limitations, the S612 possessed several interesting sonic characteristics. It featured a continuous variable low-pass filter and an LFO capable of modulating samples and adding animated texture to sounds. The straightforward operation and external triggering capabilities made it well-suited for MIDI studio applications.

  The S612 proved particularly useful for lo-fi sound design and triggered effects rather than full-featured sampling. It gained recognition as the first sampler used by electronic music pioneers Future Sound of London. Today, the instrument represents an interesting artifact of early professional sampling technology, offering unique character for experimental production despite its severe memory constraints.
specs: |-
  - Polyphony: 6 voices
  - Sampling: 12-bit linear
  - Sample rates: 4kHz - 32kHz (variable)
  - Memory: 128 KB (8 seconds at 4KHz)
  - Modulation: LFO with sine wave, speed, depth and delay controls
  - Filter: Continuous variable low-pass filter
  - Keyboard: None
  - Effects: None
  - Control: MIDI
  - Format: Rack-mount
  - Date Produced: 1985
  - Storage: Optional Quick Disk (QD) 2.8 inch format
