description: Kali Audio's Lone Pine Series studio monitors are designed to allow
  you to hear every detail that's happening in your mix. The LP-8 is the
  bi-amped 100W model of the 2nd Wave of Project Lone Pine, pairing an 8-inch
  woofer with a 1-inch textile dome tweeter.
details: |-
  Transparency. Clarity. Accuracy. Kali Audio's Lone Pine Series studio monitors are designed to allow you to hear every detail that's happening in your mix.

  This starts with an exceptionally accurate frequency response. Whatever is present on your mix is what you'll hear in these monitors. Nothing is boosted or suppressed to cover flaws or try to sound more pleasing.

  With the LP-6 and LP-8, you can mix with more confidence, and you can also be assured that your mix will translate as best as possible to whatever systems your audience is using. The 2nd Wave goes even further, utilizing a more robust DSP for an even flatter frequency response on the top end.

  The 3-D Imaging Waveguide is built to let you hear three dimensional sound from a stereo pair of speakers. A dual-layer voice coil of large diameter allows for low distortion and high dynamic range, and the low noise port tube was precisely engineered using airflow simulations for powerful bass without port noise.

  The LP-8 is bi-amped, with 40 W on the high frequencies and 60 W on the low frequencies for 100 W of Class D power in total, and crosses over at 1800 Hz between its 8-inch optimized paper woofer and its 1-inch textile dome tweeter.
