description: A large-diaphragm condenser microphone with a clean
  spring-suspended aesthetic. Bright harmonics and presence for medium-to-long
  distance applications, ideal for small acoustic ensembles.
details: |-
  Louise is a large-diaphragm condenser microphone spring-suspended in a pivoting slim stainless steel ring. It is tuned for live performance use and suited to micing small acoustic ensembles.

  Louise has the clarity, gain, feedback resistance, and full, natural frequency response for live single-mic situations. She has a pleasing high end with no harshness, and a sound that performers, audiences, and engineers describe as astonishingly natural.

  She can also bring that sound into the studio, capturing vocals and acoustic instruments with straightforward clarity. Ear Trumpet Labs suggests her for single-miking a small acoustic ensemble, including acoustic instruments and multiple vocalists, on stage or in studio.

  Louise is acoustically identical to Josephine and to the various bike gear models. For a slightly warmer, mellower sound in the same applications, Ear Trumpet Labs points to Myrtle.
specs: |-
  - Hand-made microphone with unique appearance
  - Integral silk and foam pop filter, for effective control of plosives without loss of clarity
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000 Hz, 94 dB): -41.9 dB (8 mV/Pa)
  - Power requirement: +24V to +48V phantom power
