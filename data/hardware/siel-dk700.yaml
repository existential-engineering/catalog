description: >-
  The SIEL DK700 is a six-voice polyphonic analog synthesizer and an evolution of the
  Opera 6 with added MIDI functionality. It features dual digitally controlled oscillators
  per voice, six independent 24 dB/octave low-pass filters with resonance, and three LFOs
  for comprehensive sound design. Considered one of the best and rarest synthesizers SIEL
  ever produced, it delivers a fat, versatile analog tone.
details: |-
  The DK700 stands as one of the best synthesizers SIEL ever built and is considered quite rare in the marketplace. As an evolution of the Opera 6 model, it incorporates MIDI control while maintaining the analog character of its predecessor.

    The instrument employs a sophisticated architecture with six complete synthesis channels operating in parallel. Each voice contains two digitally controlled oscillators (DCOs) that ensure reliable pitch stability across the full keyboard range. The analog waveforms feed into a 24 dB/octave low-pass voltage-controlled filter with resonance capability, paired with a dedicated ADSR envelope generator per voice. Unlike the DK70/80 models, the DK700 features six independent filters and three LFOs, providing substantially more sonic flexibility.

    Three low-frequency oscillators enable parallel modulation of pitch, pulse-width for square waves, and filter parameters. The integral Programming Unit manages 73 timbric programs in DK700 mode and 55 patches for simultaneous slave control in master keyboard mode.

    The DK700 delivers a fat tone even without using a chorus unit, with very versatile analog sounds ranging from synth-horn textures to experimental effects.
specs: |-
  - Polyphony: 6 voices
    - Oscillators: 2 DCOs per voice (12 total)
    - Filter: Six 24 dB/octave low-pass VCF with resonance
    - Envelope Generators: Six ADSR envelopes
    - LFOs: 3 (modulate pitch, PWM, and filter)
    - Keyboard: 61 keys, velocity-sensitive
    - Memory: 73 patches (DK700 mode), 55 patches (master keyboard mode)
    - Control: MIDI
    - Year Produced: 1986
