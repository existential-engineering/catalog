description: An analog 1:8 switch controlled by three gate signals. It works
  bidirectionally to switch gates, control voltages, or audio signals, using the
  three control gates as a binary number to select the active input/output.
details: |-
  Analog 1:8 switch controlled by 3 gates. Works in both directions to switch gates, control voltages or audio signals. Three control gates combine into a binary number to determine the active input/output. When nothing is connected to the common i/o, the active output will be high (5V). Tech specs:

  ModularGrid
