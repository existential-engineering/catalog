description: These specialized stereo kits contain a matched set of pencil
  microphones and the accessories you need to capture amazing stereo sound. Find
  your kit today!
details: |-
  DPA's wide and versatile pencil mic series is legendary in the high-end recording and film production industry. Delivering clean, accurate sound, the mics in this series are used by professionals, who understand sound and insist on only using the best.

  We have collected our award-winning recording microphones in specialized stereo kits that contain the mics and accessories you need to capture fantastic sound no matter what your need. All kits are matched within either ±0.5 dB or ±1 dB depending on the kit you choose.
specs: |-
  - Kit contents: matched pair of 4041-SP Omnidirectional Large Diaphragm Microphones (P48)
  - Matching tolerance: ±0.5 dB or ±1 dB (depending on the kit)
  - Per-mic directional pattern: Omnidirectional
  - Per-mic principle of operation: Pressure
  - Per-mic cartridge type: Condenser w. stainless steel diaphragm
  - Per-mic frequency response: 20 Hz - 20 kHz
  - Per-mic effective frequency range ±2 dB: 20 Hz - 20 kHz with 4 - 6 dB soft boost at 8 kHz
  - Per-mic sensitivity, nominal, ±2 dB at 250 Hz: 70 mV/Pa; -23 dB re. 1 V/Pa
  - Per-mic equivalent noise level, A-weighted: Max. 8 dB(A) re. 20 µPa
  - Per-mic equivalent noise level, ITU-R BS.468-4: Max. 20 dB
  - Per-mic distortion, THD < 1%: 123 dB SPL RMS, 126 dB SPL peak
  - Per-mic dynamic range: Typ. 118 dB
  - Per-mic max. SPL, THD 10%: 134 dB SPL peak
  - Per-mic rated output impedance: < 200 Ω
  - Per-mic cable drive capability: 100 m (328 ft)
  - Per-mic power supply (for full performance): Via external Power supply
  - Per-mic current consumption: 2.20 mA
  - Per-mic connector: 3-pin XLR-M
  - Per-mic weight: 190 g (6.7 oz)
  - Per-mic capsule diameter: 24 mm (1 in)
  - Per-mic microphone length: 170 mm (6.7 in)
  - Per-mic temperature range: -40°C to 45°C (-40°F to 113°F)
  - Per-mic relative humidity (RH): Up to 90%
  - Modularity – interchangable capsules and preamplifiers
  - Up to 120 dB dynamic range
  - RF rejection between >60 and >40 dB
  - Linear frequency response
  - High SPL
  - Superior gain before feedback
