description: The Pro Series Signature Wes Borland King V KV is a high-output
  metal guitar built around Limp Bizkit guitarist Wes Borland's aggressive
  playing style and visual aesthetic. It features a nyatoh body in the iconic
  King V silhouette with neck-through maple construction, ebony fingerboard, and
  a Seymour Duncan Invader bridge pickup for massive tone. A Floyd Rose 1500
  Series double-locking tremolo and compound-radius fretboard complete an
  instrument designed for extreme performance.
specs: |-
  - Body: Nyatoh, King V shape, gloss finish, Black with White Bevels
  - Neck: 1-piece maple, neck-through construction, graphite reinforcement, scarf joint, gloss color-matched finish
  - Fingerboard: Ebony, 12"-16" compound radius
  - Frets: 24 jumbo
  - Scale Length: 25.5"
  - Nut Width: 1.6875"
  - Inlays: Pearloid sharkfin
  - Side Dots: Luminlay
  - Bridge Pickup: Seymour Duncan Invader SH8 humbucker (H only)
  - Controls: Single volume
  - Bridge: Floyd Rose 1500 Series double-locking tremolo
  - Tuners: Jackson sealed die-cast
  - Strap Buttons: Locking
  - Hardware Finish: Black
  - Headstock: Reverse Jackson pointed 6-in-line with white binding
  - Neck Binding: White
  - Strings: Nickel-plated steel (.009-.042)
  - Includes: Jackson gig bag
