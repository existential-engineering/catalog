description: Mixstream Pro Go Battery-Powered Standalone Streaming DJ Controller
  with Amazon Music.
details: |-
  From bedroom to beach and from livestreaming studio to patio party, the Mixstream Pro Go is always ready for action, wherever your vibe-quest takes you. With its built-in rechargeable battery, on-board speakers, Wi-Fi, USB/SD card slots, professional DJ performance essentials, and wireless lighting control, the Mixstream Pro Go is the world's first 100% wireless standalone DJ controller. No longer are you confined to your studio or bedroom, now you can share your mixing skills virtually anywhere. No wires, computers, or existing music library required!

  Play any track, from any genre, at any time! The Mixstream Pro Go integrates with Apple Music, Amazon Music Unlimited and other popular streaming services, giving you endless access to over 100 million tracks across all genres. With this unprecedented musical access, you no longer need an established music library to pull up and rock a party or gig. The built-in Wi-Fi and lightning-fast on-board song analysis lets you practice, perform and enjoy music for hours on end.
specs: |-
  - Rechargeable battery for mobile mixing
  - Built-in Wi-Fi with streaming service integration (Amazon Music Unlimited, TIDAL, Beatport, Beatsource, SoundCloud Go+, Dropbox)
  - Engine DJ embedded operating system
  - Built-in speakers with volume control
  - Engine Lighting control for Philips Hue, Nanoleaf, and DMX lighting
  - Computer Mode compatibility with Serato DJ and Virtual DJ
  - 7" multi-gesture HD touchscreen
  - 6" capacitive-touch scratch wheels with Smart Scratch
  - 8 dual-layer performance pads (4 per deck)
  - 4 effects (Echo, Flanger, Delay, Phaser)
  - Large Filter knobs and 3-band EQ per deck
  - Pitch Bend buttons and selectable pitch ranges (4%-100%)
  - Dimensions: 22.3" x 11.2" x 2.9" (566 x 284 x 74 mm)
  - Weight: 11 lbs (3.7 kg)
  - Main Output Frequency Response: 20 Hz - 20 kHz +/- 1 dB
  - Dynamic Range: > 114 dB (A-weighted)
  - Signal-to-Noise Ratio: > 94 dB (A-weighted)
  - Headroom: > 16 dB (Mic & Outputs)
  - T.H.D. (Line): < 0.01% (1 kHz, unity)
  - T.H.D. (Microphone): < 0.05% (1 kHz, unity)
  - Speaker Frequency Response: 20 Hz - 20 kHz +/- 1 dB
