details: >-
  An acoustic recreation of the classic drum machine. In 2015 I made an april
  fools video saying I'd created an '808 drumhead' which was a fake, of course -
  but then the cogs started turning and I wondered if I could actually make an
  acoustic recreation of an 808 - obviously this doesn't sound exactly like an
  808 what would be the point and where's the fun in that! - but - I've analysed
  the timbre of the sound choices in the drum machine and tried to recreate them
  using mic placement, dampening, stick choice, drum choice and even placing
  drums within drums.


  Features: 4500 samples recorded at 48khz/24-bit wav. 925.2 mb. Up to 7
  velocity layers /5 round robins. Custom effects & gui control. Selectable
  multiple outputs for further processing & mixing. An octave of tuned bass
  drums (and I mean tuned - not pitch shifted!). 4 bespoke & unique snares &
  'rimshot'. 4 toms. Congas. Percussion (woodblock, cowbell, maraca). Hihats,
  ride cymbal & 2 crashes. Multiple room, close and overhead microphones.
  Effects, adsr & pitch controls to hone and tailor the sound.


  The ac08 is made for the full version of kontakt.
