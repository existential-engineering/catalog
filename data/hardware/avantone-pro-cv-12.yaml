description: Large-diaphragm tube condenser microphone with 9 selectable polar
  patterns, a premium 6072A vacuum tube, and custom transformer — designed to
  evoke the sonic character of legendary European tube microphones from the
  1940s–60s.
details: |-
  The CV-12 is a large-diaphragm tube-based condenser microphone that evokes
  the sonic character of legendary European tube microphones from the 1940s
  through the 1960s. Its precision milled brass hull, woven metal grill, and
  polished nickel accents deliver a vintage aesthetic matched by equally
  vintage-inspired sound.

  With 9 selectable polar patterns — accessible via the included PS-12 power
  supply — the CV-12 is versatile enough for solo vocals, acoustic instruments,
  room recording, and more. A -10dB pad extends the maximum SPL to 146dB,
  while an 80Hz high-pass filter at 6dB/octave tames low-frequency rumble.

  At the heart of the CV-12 is a dual-sided 32mm center-terminated
  gold-sputtered Mylar capsule (6 micron) driven by a premium 6072A vacuum
  tube. The transformer-isolated output ensures a warm, musical signal path
  consistent with the classic tube microphone tradition.

  Each CV-12 ships in an aluminum road case and includes a custom retro
  shockmount, the PS-12 multi-pattern power supply (compatible with 115/230
  VAC), all necessary cables, owner's manual, and a hand-selected 6072A tube.
specs: |-
  - Capsule: Dual-sided 32mm center-terminated gold-sputtered Mylar (6 micron)
  - Frequency Response: 20Hz–20kHz ±3dB
  - Output Impedance: ≤250 Ohms (transformer isolated)
  - Maximum SPL: 136dB (0.5% THD); 146dB with -10dB pad
  - Equivalent Noise Level: <17dB
  - S/N Ratio: 78dB
  - Sensitivity: -35dB
  - Output Connector: Male XLR 7-pin
  - Polar Patterns: 9 selectable
  - High-Pass Filter: 80Hz, 6dB/octave
  - Pad: -10dB
  - Vacuum Tube: 6072A
  - Power: PS-12 power supply (115/230 VAC, included)
  - Dimensions: 237mm × 46mm
  - Weight: 0.8 kg (1.8 lbs)
