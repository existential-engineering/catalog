description: "Antelope Audio Discrete 8 Oryx, a 26x38 USB-C audio interface with
  8 console-grade preamps, real-time Synergy Core FX, and advanced headphone
  monitoring."
details: |-
  The Discrete 8 Oryx brings Antelope's latest innovations into a powerful, affordable studio hub for producers, engineers, and bands. Built for multi-instrument recording and hybrid workflows, it combines pristine conversion and clocking, console-grade preamps, real-time FX processing, advanced headphone tools, and expansive routing — all in one rack unit.

  At the heart of the Discrete 8 Oryx are the latest AD/DA converters (up to 130 dB headroom) and fourth-generation 64-bit AFC clocking. Together, they deliver wider stereo imaging, depth, and detail that go far beyond the specs of the converter chips alone. The interface features eight discrete Class-A microphone preamps, each crafted with six transistors and inspired by the circuitry of legendary recording consoles, offering exceptional clarity, an ultra-low noise floor, and up to 75 dB of gain. All eight inputs are DC-coupled and support both XLR and line-level TS/TRS connections, while the two front-panel inputs can also be switched to Hi-Z for direct instrument recording.

  With 26x38 simultaneous connectivity — including 8 preamps, 8 DC-coupled line outs (via D-Sub 25), ADAT, S/PDIF, reamp outs, monitor outs, and 4 headphone outs — the Discrete 8 Oryx serves as the centerpiece of any studio. A redesigned virtual patch bay software control panel offers drag-and-drop routing, simultaneous operation of all digital and analog ports, and direct low-latency monitoring with onboard effects. DC-coupled I/O supports Control Voltage for modular synthesis with hosts like Bitwig Studio or Ableton Live.

  Four independent stereo headphone outputs with premium DACs let each musician have a personalized monitor mix powered by four low-latency virtual mixers. X-Feed is a precision-engineered headphone crossfeed system that emulates the spatial behavior of loudspeakers in a stereo listening environment, with headphone calibration profiles and a two-band EQ.

  Powered by 2 DSP and 1 FPGA, the onboard Synergy Core platform runs analog-modeled effects — compressors, EQs, amps, reverbs — in real time with zero perceptible latency. Effects can be loaded on up to sixteen channel strips, processing any digital or analog input or output. 37 Real-Time FX are included, with more available on the Antelope Software Store. The interface is mic modeling ready when used with Edge series microphones.
specs: |-
  - 26x38 USB-C audio interface in a 1U rack-mount form factor
  - AD/DA converters with up to 130 dB headroom
  - Fourth-generation 64-bit AFC (Acoustically Focused Clocking)
  - Sample rates up to 24-bit / 192 kHz over USB
  - Eight discrete Class-A microphone preamps (six transistors each), up to 75 dB gain
  - All 8 inputs DC-coupled; XLR + line-level TS/TRS support
  - Front-panel inputs A1-A2 switchable to Hi-Z for instruments
  - 8 DC-coupled D-Sub 25 line outputs (up to 24-bit / 192 kHz)
  - 4 ADAT ports providing 16 channels of I/O at 48 kHz (channel count reduced at higher sample rates)
  - S/PDIF I/O: 2 channels at up to 24-bit / 192 kHz
  - Word Clock: 1 input + 3 outputs
  - USB 2.0 Type-C connection providing 24 channels of I/O
  - 4 independent stereo headphone outputs with premium DACs
  - X-Feed headphone crossfeed with calibration profiles and two-band EQ
  - Reamp outputs (R-1, R-2) for re-amplifying signals through external gear
  - Built-in talkback microphone with dedicated button
  - Dual footswitch input (1/4" TRS) for talkback and dim control
  - Synergy Core platform powered by 2 DSP + 1 FPGA
  - Up to 16 channel strips for real-time FX loading
  - 37 Real-Time FX included; more available via Antelope Software Store
  - Main monitor output: 1/4" TRS balanced, DC-coupled
  - Compatible with macOS and Windows
  - 18V / 20W DC power input
