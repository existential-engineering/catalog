description: 6 trigger input expander for the CV Trinity. For LFO and Automation
  modes, trigger inputs work as individual channel-independent reset inputs. For
  ADSR mode, they act as channel-independent re-trigger inputs.
details: 2HP. Powered from CV Trinity via ribbon connector — no independent bus
  power draw.
