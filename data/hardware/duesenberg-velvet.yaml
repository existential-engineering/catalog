description: The Duesenberg Velvet Series brings you full featured special
  editions of our Starplayer TV in two stunning matte finishes, Black Velvet and
  White Velvet.
details: |-
  The Velvet Series is a special edition of the Duesenberg Starplayer TV offered in two matte finishes, Black Velvet and White Velvet. The body is a semi-hollow construction with a solid sustain block, bent sides, an f-hole and an arched top and back, measuring 46 x 34 cm with 4.5 cm sides. Its top is laminated spruce with laminated flamed maple back and sides, cream multi-layer binding, a black Custom pickguard and a matt PUR lacquer finish, with a headstock finished to match the body colour. Duesenberg presents the matte finishes as sitting between traditional design and modern finishing.

  The neck is a set-in one-piece Maple neck in a Medium D shape, 42.5 mm wide at the nut and 52 mm at the 12th fret, with a steel dual-action truss rod. The Indian Rosewood fingerboard has a 305 mm radius, cream dot inlays and 22 jumbo frets on a 648 mm / 25.5 inch scale. Every Duesenberg instrument is Plek processed for level frets, then hand finished and set up by one of the company's luthiers, who signs the inside of the instrument.

  The guitar carries two Duesenberg Split/King Duo-Coil pickups. Rather than a splittable humbucker, each houses a full-size single coil extended to a complete humbucker by a separate fine-tuned coil, so that both real single-coil and real humbucker voices are available at the flick of a switch. Controls are one volume, one tone, a 3-way pickup selector and two mode switches on the custom pickguard, which ride on a small elevator mechanism so they can be raised for easy access or lowered flush out of the way.

  Hardware is gold finished throughout and comprises Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge and a Duesenberg Diamond Deluxe Tremola vibrato. Strap pins are Duesenberg Standard and Straplock compatible, and the guitar ships with Duesenberg Custom 10/50 strings.

  The instrument is supplied with a Duesenberg Custom Line Case as standard, a classically shaped handcrafted case of flightcase quality, along with all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Matching colour
  - Body type: Semi-hollow with sustain block, bent sides, f-hole
  - Body top: Laminated spruce
  - Back, sides: Laminated flamed maple
  - Body dimensions: 46 x 34 cm / 18.11" x 13.38"
  - Body height (sides): 4.5 cm / 1.8"
  - Binding: Cream multi-layer
  - Pickguard: Black Custom
  - Finish: Matt PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Diamond Deluxe Tremola
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware finish: Gold
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickups: Duesenberg SplitKing
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector, 2 Mode Switches
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
