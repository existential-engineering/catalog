description: An experimental fuzz/gate pedal born from an oddball circuit that
  destroys your signal in the most strangely natural way, tweaked and optimized
  for maximum stench and unpleasance.
details: |-
  The Unpleasant Surprise is an experimental fuzz/gate whose character comes from
  a parasitic circuit effect that was tweaked and optimized rather than corrected.
  As it turns your playing style upside down, it retains the essence of what is
  played while creating artifacts that are strange, harsh, and unusual but never
  out of context.

  The ONSET control affects interstage gain and mimics an inverse gate threshold:
  up for more saturation and sustain, down for sputtery fuzz. Three mini toggles
  (T, G, C) shape treble, amplifier bias, and feedforward crush respectively.
  True true bypass with no battery connection.
specs: |-
  - True true bypass
  - Dimensions: 2.5" x 4.4"
  - Input impedance: 1 MΩ
  - Output impedance: 1 kΩ
  - Power supply: 9 to 9.6 VDC center-negative
  - Current draw: 15 mA
  - 1/4" mono input and output jacks
  - 2.1mm barrel DC connector
  - No battery connection
  - Made in Hull, Québec
