description: Erica Synths Black MIDI-CV is a compact, highly accurate and easy
  to use duophonic MIDI interface.
details: |-
  The Black MIDI-CV V2 is a compact, highly accurate and easy to use duophonic MIDI interface in 6HP. It emulates classic monophonic and duophonic synth behaviour and can also be configured for use on two independent MIDI channels.

  Two CV and gate output pairs carry the two voices, and a one or two voice switch sets how incoming notes are distributed between them. A configurable MOD output follows either the modulation wheel or velocity.

  Bonus features are a MIDI clock output at 4ppq, which suits driving a sequencer, and an analogue glide circuit on both channels with a glide time up to 2 seconds.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. When designing the Black Series, Erica Synths did not economise on module width, putting design and usability first.

  The panel is 6HP wide at a depth of 30mm. CV covers 0 to 8V with a maximum deviation of 0.001V or one cent, gate and clock sit at 5V, and power draw is 40mA on the positive rail against 9mA on the negative one.
specs: |-
  - Two CV and Gate outputs
  - MIDI clock output (4ppq, sequencer friendly)
  - Configurable MOD output, modulation wheel or velocity
  - Analogue glide on both MIDI channels
  - One or two MIDI channel configuration
  - One or two voice switch
  - CV range 0-8V
  - Max CV deviation 0.001V; 1cent
  - Gate and Clock level 5V
  - Glide time 0 - 2"
  - Power consumption +40mA, -9mA
  - Module width 6HP
  - Module depth 30mm
