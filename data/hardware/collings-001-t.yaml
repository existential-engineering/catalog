description: The Traditional Series variations of the classic 12-fret 00 take a
  vintage-inspired approach to voicing and construction designed to produce a
  strong fundamental response and open feel, with rounder highs and less
  overtone complexity. The ultra-thin nitrocellulose lacquer finish and unique
  neck construction make for a woody and articulate voice with rich, balanced
  tone and excellent note separation.
details: |-
  The 001 T is part of the Traditional Series, featuring vintage-inspired voicing and construction with Honduran mahogany back and sides, tortoise body binding, walnut backstrip, dot fingerboard inlays, and a 1-style rosette. The ultra-thin nitrocellulose lacquer body finish and abbreviated soundboard graft (tongue brace) contribute to a looser, more broken-in feel and tone with a rounder high end and fuller low midrange.

  The Traditional neck profile differs from the standard Modified V, and the tapered slotted square peghead with volute adds a vintage aesthetic. Traditional models feature gold MOP inlays and custom wood purflings and rosette, and are offered with limited custom options compared to the standard series.
specs: |-
  - Top: Sitka spruce
  - Back & sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Bridge: Ebony pyramid-style, 2 5/16" spacing
  - Fingerboard: Ebony with gold MOP short dots
  - Fingerboard radius: 14" - 26" compound
  - Nut: Bone, 1 3/4"
  - Saddle: Bone, drop-in
  - Neck profile: Traditional
  - Peghead: Tapered slotted square with volute
  - Tuners: Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - Body binding: Tortoise with custom wood purflings
  - Rosette: Custom wood rosette
  - Backstrip: 1-style (Walnut)
  - Scale length: 24 7/8"
  - Body width: 14 1/4"
  - Body length: 19 3/8"
  - Body depth: 4"
  - Total length: 38"
  - Body finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck finish: High gloss polyester resin
  - Bracing: Custom Traditional Series pre-war scalloped X-brace
  - Strings: D'Addario EJ-16 (.012"-.053")
