description: An artful blend of heritage and innovation, the PCM96 Stereo
  Reverb/Effects Processor delivers 28 new and legendary Lexicon reverbs, delays
  and modulation effects with over 1,200 factory presets.
details: |-
  Lexicon breaks down the wall between hardware and software with the highly-anticipated PCM96 Stereo Reverb/Effects Processor. An artful blend of heritage and innovation, this powerhouse processor delivers 28 new and legendary Lexicon reverbs, delays and modulation effects straight into your DAW. Designed for the modern studio, the PCM96 can function as a control-only insert or FireWire streaming audio plug-in inside any Mac VST or Audio Units software.

  Appearing for the first time are new Room and Hall algorithms, plus an assortment of new mono reverbs and effects. With decades of legacy products to pull from, the PCM96 also includes the finest collection of factory presets available in a stereo processor — over 1,200 and growing — including some recognizable classics from Lexicon's immense library of sounds.

  The PCM96 gives new capabilities to traditional reverbs by adding multimode filters at several spots in the audio flow. This allows more exact shaping of the reverb while still maintaining the distinctive Lexicon sound. All reverbs also have an Infinite switch that allows the reverb to run forever, a useful feature for creating unusual backgrounds and sound effects.

  Lexicon's new Room algorithm provides a more flexible alternative to convolution-type reverbs. Reflection patterns can be easily selected, scaled and equalized — all while simultaneously passing audio. They can be instantly reversed or combined with a traditional reverb to extend the decay or bring a stronger sense of liveness to the space.

  With two channels XLR analog and two channels XLR AES/EBU digital I/O, as well as MIDI, Ethernet and FireWire connectivity, the PCM96 easily fits into a variety of recording and live sound environments.
specs: |-
  - 28 new and legendary Lexicon reverbs, delays, and modulation effects
  - Lexicon's new Room algorithm for room-related effects in music and post
  - Over 1,200 factory presets, including classics from Lexicon's library
  - 768 user presets
  - Seamless automation and control via Ethernet or FireWire
  - Hardware Plug-In capability inside Mac VST and Audio Units production software
  - 32-bit floating point processing
  - Sample rates up to 96 kHz
  - Two channels XLR analog I/O
  - Two channels XLR digital AES/EBU I/O
  - External BNC Word Clock input
  - MIDI in, out, and thru
  - Compact Flash for additional preset storage
  - Can be divided into up to four virtual machines, each running its own algorithm
  - Standalone routing: Dual Super Mono, Super Stereo, Cascade Mono, Cascade Stereo, Mono to Stereo, Mono In/Combined Stereo Out
  - FireWire plug-in routing: Super Stereo, Dual Stereo, Super Mono, Quad Mono, Mono+Stereo
  - Infinite reverb switch on all reverbs
