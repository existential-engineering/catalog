details: |-
  The malletKAT Octave Expander adds one octave to your MalletKAT Pro, MalletKAT Grand or MalletKAT Express. The three octave malletKAT is expandable up to FIVE octaves. The two octave malletKAT Express is expandable up to FOUR octaves. Comes with expander cable and strapping bars. PLEASE PUT SERIAL NUMBER OF MAIN UNIT IN ORDER NOTES WHEN PLACING ORDER. PLEASE NOTE: ALL EXPANDERS ARE BUILT WITH A 3/8 INCH PAD HEIGHT . IF YOUR UNIT HAS ANY OTHER PAD HEIGHTS, THE EXPANDER WILL NOT MATCH. Unit dimensions: 15" X 11" X 2.5"

  Weight: 4 lbs.
