name: DLM8
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/loudspeakers/dlm-series/DLM8.html
description: '8" 2000W Powered Loudspeaker. Incredibly powerful, Mackie DLM
  Series loudspeakers deliver premium sound in the most compact, professional
  portable loudspeaker series ever.'
details: |-
  The Mackie DLM8 is an 8" powered loudspeaker featuring Mackie's TruSource technology with a vertically-aligned, common-magnet driver and TruSource DSP for unmatched fidelity. It delivers a staggering 2000 watts of power via ultra-efficient Class-D amplification in a compact, portable design.

  At the heart of the DLM8 is the DL2 integrated digital mixer, paired with an OLED screen for at-a-glance control. The DL2 offers two input channels with FX, 16 channel effects, a multi-band feedback destroyer, six speaker modes, alignment delay up to 300ms, and three memory locations for storing custom configurations.

  The DLM8 covers a frequency response of 65Hz–20kHz (-10dB) using an 8" LF woofer paired with a 1.75" HF compression driver. Its compact, professional portable enclosure is designed for live sound, mobile DJ, and installed applications, with pole mount, kickstand, and wall-mount options.
specs: |-
  - 2000W system power via ultra-efficient Class-D amplification
  - TruSource technology with vertically-aligned, common-magnet driver
  - 8" LF woofer / 1.75" HF compression driver
  - Frequency Response: 65Hz-20kHz (-10dB)
  - DL2 Integrated Digital Mixer with OLED screen
  - Two input channels with FX
  - 16 channel effects
  - Multi-band feedback destroyer
  - Six speaker modes
  - Alignment delay up to 300ms
  - Three memory locations
