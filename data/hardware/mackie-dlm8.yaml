description: Small yet powerful, the DLM8 2000W powered loudspeaker features a
  coaxial design for maximum output in a small cube form.
details: |-
  Featuring Mackie's TruSource vertically-aligned, common-magnet driver and TruSource DSP for unmatched fidelity and packed with cutting-edge technology to deliver a staggering 2000 watts of power in a groundbreaking design with an integrated digital mixer plus all the channel effects and system processing you've ever wanted.

  The Mackie DLM8 and DLM12 each deliver 2000 watts into the most compact, professional portable loudspeaker design ever. Featuring TruSource technology, the DLM loudspeakers are equipped with Mackie's TruSource driver that incorporates the high-output 8 inch woofer and 1.75 inch compression driver into an incredibly compact common-magnet design.

  These versatile loudspeakers feature the Mackie DL2 integrated digital mixer, providing a dual-channel mixing solution for a wide array of possible connections with channel features like 3-band EQ and 16 effects. Plus, system processing like a multi-band feedback destroyer, six speaker modes and Smart Protect technology provide the tools needed for professional applications.

  With configuration options that include pole and wall mounting and flying, the DLM loudspeakers are a solution for high-end installs. The ultra-compact form factor includes a rugged PC-ABS cabinet, powder-coated grille and integrated kickstand for personal monitor use.
specs: |-
  - 2000W system power via Class-D amplification (1000 watts rms, 2000 watts peak)
  - 8 in / 203 mm LF woofer with 2.0 in voice coil, 1.75 in / 44 mm HF compression driver
  - Frequency response 65 Hz - 20 kHz (-10 dB)
  - Max peak SPL 125 dB (calculated at 1 m)
  - Crossover point 1.6 kHz, 90 degree conical dispersion
  - DL2 integrated digital mixer with OLED screen, two input channels with FX
  - Per-channel 3-band EQ: low shelving +/-15 dB @ 80 Hz, mid peaking +/-15 dB @ 2.5 kHz, high shelving +/-15 dB @ 12 kHz
  - 16 channel effects presets including reverb, chorus and delay
  - Six speaker modes, multi-band feedback destroyer, alignment delay 0-300 ms
  - Three memory locations for venue setting recall and factory reset
  - Smart Protect DSP with peak and RMS limiting and thermal protection
  - Universal power: 100-120 VAC or 220-240 VAC, 50-60 Hz, 250W, 3-pin IEC connector
  - PC-ABS cabinet, powder-coated 20 gauge steel grille, three M10 x 17 mm fly points
  - Integrated kickstand gives a 50 degree monitor angle
  - Dimensions 12.3 x 12.1 x 11.9 in / 313 x 307 x 302 mm (H x W x D)
  - Weight 22 lb / 10 kg
