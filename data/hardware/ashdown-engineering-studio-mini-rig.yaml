description: The Studio Mini-Rig delivers 250 watts of solid-state Ashdown tone
  through a matched 2x10" cab in a compact, vintage-inspired design.
details: |-
  The Studio Mini-Rig pairs a compact solid-state head with a matched 2 x 10" cabinet rated at 4 Ohms, taking its feature set from the Studio 15. It offers a 5-band EQ, foot-switchable valve-emulated overdrive, an FX loop, an XLR DI and a headphone out. The instrument input has an active pad, and the repairable solid-state design is built for long-term reliability.
specs: |-
  - Power output: 250W into 4 ohms
  - Speaker configuration: 2 x 10"
  - Cabinet impedance: 4 Ohms
  - Controls: Pre Gain, Drive, Bass, Hi Bass, Middle, Hi Middle, Treble, Volume, Shape
  - Instrument input (with active pad)
  - FX loop (TRS jack)
  - Line In
  - Headphone output
  - Fully balanced DI output
  - Head H x W x D (mm): 170 x 400 x 300
  - Head weight: 7.74kg
  - Cabinet H x W x D (mm): 690 x 400 x 350
  - Cabinet weight: 18kg
