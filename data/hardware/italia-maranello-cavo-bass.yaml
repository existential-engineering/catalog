details: |-
  The Maranello Cavo is a short scale semi-hollow body 4-string bass that packs enormous punch in a very comfortable package. The Cavo features a chambered Mahogany body construction with Italia's signature f-hole design, resulting in a stunningly classic vintage look. The Cavo's light weight, and 30" scale length, make this a very comfortable instrument, and much easier to endure those marathon long sets or sessions without the need to visit a chiropractor. The Cavo has a super-tight, punchy, silky smooth tone. The Italia Toaster pickups were dialed in to deliver very tight low-mids and resonant highs, yet without sacrificing the rich juicy lows needed to hold down the rhythm. From the sound you'll hardly believe your playing a short scale bass, only reminded of this by how comfortable it is to play. We have once again swapped out the standard 3 position switch for our more tonally diversified 'blend' control knob. The blend control knob allows you to sweep through the entire range of combinations between neck and bridge pickups. You know your both pickups on once you hit the center detent position on the blend control. Why settle for close when you can have it exactly the way you want it.
