description: 5000 Series pedals are now fitted with more features and upgrades than ever before.
details: |-
  Developed in conjunction with Los Angeles-based educator Mike Packer, the Heel-Less 5000 is much more than just a 5000 pedal sans traditional heel plate.

  A unique baseplate with integrated Delta Ball-Bearing Hinge is smooth and steady. The slightly truncated footboard meets the ground to offer a completely new playing experience.

  Other features such as the Accelerator dual-chain drive cam and Dual Spring Rocker make this 5000 powerful and responsive.
specs: |-
  - Dual-Chain Accelerator Drive System
  - Side-Adjusting hoop clamp
  - Delta Ball-Bearing Hinge (U.S. Patent No. 5431081)
  - Dual-Bearing Spring Rocker
  - Heelless baseplate with truncated footboard
