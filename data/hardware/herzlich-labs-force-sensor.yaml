description: A passive force-sensing attenuator module that controls signal
  level via pressure applied to a squishy button, adding attack and decay
  characteristics.
details: |-
  Squish that button for me, would ya? There are many accepted ways to control audio equipment: knobs, faders, buttons and - yes, squish. This one is squish. The big red button? It's a little squishy. You take your finger and press that bad boy, and the signal at the Input passes to the Output relative to the intensity of your squish. Do nothing, and nothing happens. Give it all you got, and it all happens, all at once. Better yet, since it's squishy, you get a little bit of attack and decay on your signal! Squish in time with the beat! Practice rodent CPR! Make a sick reverb swell during your ambient live set by surrendering yourself to the squish . Listen, I know what you're thinking, and no: you cannot eat the big, red squishy button. Our ape brains are somehow hard-wired to see that thing and go, I'd definitely take a big bite out of that, and I have been informed by my legal counsel that I must inform you clearly and unequivocally that no, that's not gonna happen. No power, no space? No problem. The hybrid 1U/0hp format means you can easily install it as a 9hp 1U unit in a 1U rail, or take it on the go (or on the run) with a brass-threaded enclosure, allowing you to install and uninstall it at your leisure.
specs: |-
  - Accepts both CV and stereo audio signals
  - Control the intensity of LFOs, envelopes or even audio
  - Goes from wide open to fully closed
  - Passive design: no external power, no batteries
