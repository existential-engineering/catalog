details: |-
  The Fostex 6301NB is a compact active monitor speaker with a built-in amplifier, designed for audio monitoring and small-scale loudspeaker applications. It represents the latest iteration of the 6301 series, a speaker line used for over 30 years in broadcast facilities worldwide.

  The speaker features a 10 cm (4-inch) cone-type full-range driver paired with a 20 W rated Class-D (PWM) power amplifier, providing extended frequency bandwidth from 70 Hz to 15 kHz. The die-cast aluminum enclosure delivers a rigid, low-resonance cabinet suited to professional monitoring environments.

  Input is via a single unbalanced Φ6.3 mm (1/4") TS phone jack, which distinguishes the 6301NB from other models in the series (6301NX with transformer-balanced input, 6301NE with electronically balanced input, and 6301ND with AES/EBU digital input). When this input is engaged, signals to other input terminals are blocked.

  Power is supplied via an inlet-type AC cable accepting AC 100–230 V (50/60 Hz). A standby mode reduces consumption to 0.5 W or less. An optional EB-6301 wall mounting bracket is sold separately.
specs: |-
  - Enclosure: die-cast aluminum
  - Driver: 10 cm cone-type full-range unit (qty: 1)
  - Frequency response: 70 Hz to 15 kHz
  - Sound pressure level: 85 dB/W at 1 m; max 98 dB
  - Amplifier output: 20 W rated (Class-D PWM)
  - Input: Φ6.3 mm (1/4") TS phone, unbalanced
  - Input sensitivity: -14 dBV (0.2 Vrms)
  - Input impedance: 10 kΩ minimum
  - THD: 0.05% (1 kHz / 1 W output)
  - Residual noise: -70 dBV
  - External dimensions: 120 mm (W) x 189 mm (H) x 120 mm (D)
  - Weight: 2.22 kg
  - Power supply: AC 100-230 V (50/60 Hz)
  - Power consumption: 10 W operating, 0.5 W or less in standby
  - Operating temperature: -10°C to +50°C
  - Operating humidity: within 90%
  - Includes: AC power cable (2 m)
