description: The latest series of the 6301 compact active monitor speaker, which has been used for more than 30 years in broadcast facilities and small-scale loudspeakers. The 6301NB is equipped with unbalanced analog input.
details: |-
  The latest series of the 6301 compact active monitor speaker, which has been used for more than 30 years in broadcast facilities and small-scale loudspeakers. The lineup includes four models with different input specifications, and the 6301NB is the model equipped with unbalanced analog input.

  A monitor speaker with built-in amplifier for use in various audio monitoring and small-scale loudspeaker applications. Cone-type 10cm full-range speakers are used to achieve stable sound, and the built-in power amplifier with a rated output of 20W delivers stable sound even in a small package.

  All models are equipped with a Class-D (PWM) power amplifier. Compared to the previous model (6301B-H series), power consumption has been reduced while the rated output has been increased from 10W to 20W. The eco-friendly design includes a standby mode compliant with Europe's ErP Directive: power consumption is reduced to 0.5W or less after the input signal level remains below a certain level for about 25 minutes, and the unit instantly returns to normal mode when the input signal level exceeds a certain level.

  The playback frequency bandwidth is extended from 80 to 13,000 Hz in the previous model to 70 to 15,000 Hz. The power cable is an inlet type, and the robust die-cast aluminum enclosure keeps the same width and height as the previous 6301B-H series, allowing replacement without changing the installation location.

  Wall mounting and angle adjustment are possible by using the optional EB-6301 wall mounting angle. The product warranty is applicable only when the product is used in Japan.
specs: |-
  - Enclosure type: Closed type (Material: Aluminum die-casting)
  - Unit: Cone type 10cm full range unit x 1
  - Frequency response: 70Hz to 15kHz
  - Sound Pressure Level: 85dB/W (1m)
  - Maximum Sound Pressure Level: 98dB
  - Rated output: 20W
  - Analog input: Unbalanced 6.3mm (1/4") TS phone, input sensitivity -14dBV (0.2Vr.m.s.), input impedance 10k ohm min.
  - T.H.D.: 0.05% (at 1kHz/1W output)
  - Residual noise: -70dBV
  - Guaranteed operating temperature: -10 to +50 degrees C
  - Level of humidity: within 90%
  - External Dimensions: 120(W) x 189(H) x 120(D) mm including maximum projection
  - Weight: 2.22kg
  - Power requirement: AC100-230V (50/60Hz)
  - Power consumption: 10W (standby mode 0.5W or less, compliant with European ErP Directive)
  - Accessories: Power cable (2m)
  - Complies with the European RoHS Directive
