description: >-
  The Kilobyte is a lo-fi delay pedal combining an analog dry signal path with a
  +21dB boost/overdrive preamp that drives a low-fidelity digital delay chip
  sourced from karaoke machines and toys, delivering smeared, repeated glory
  ranging from crisp slapbacks to dirty, muted echoes.
details: |-
  The Kilobyte is Caroline Guitar Company's lo-fi delay pedal, built around a
  low-fidelity digital delay chip originally designed for karaoke machines and
  children's toys. The result is a deliberately degraded, characterful delay
  that captures a kind of retro digital grime reminiscent of early 1980s
  technology.

  At its core, the Kilobyte preserves the dry signal through a pure analog path
  while the wet signal passes through a +21dB boost/overdrive preamp before
  hitting the digital delay circuit. This preamp stage adds harmonic character
  and drive to the repeats independently of the dry tone.

  The Summation knob controls feedback and is capable of producing runaway
  oscillations, allowing the pedal to self-oscillate into swirling, chaotic
  textures. A subtle built-in modulation circuit sweetens the repeats with
  gentle pitch variation for a more organic, tape-like quality.

  The Havoc momentary footswitch triggers high-pass filtered oscillation,
  providing an expressive performance tool for dramatic swells and noise bursts
  that snap back to normal operation when released.

  Controls include Attack (delay time or effect character), Level (wet signal
  volume), and Summation (feedback), along with the main bypass footswitch and
  the Havoc switch.
specs: |-
  - +21dB boost/overdrive preamp driving the delay circuit
  - Low-fidelity digital delay chip (sourced from karaoke/toy applications)
  - Analog dry signal path
  - Summation knob with runaway oscillation capability
  - Havoc momentary footswitch with high-pass filtered oscillation
  - Built-in subtle modulation circuit
  - Attack and Level controls
