details: |-
  Echoes of Euphoria

  One of the most recurring things we hear from the TC Electronic community regarding our Flashback Delay pedals, is that they sound so good that they wish they could have several of the delay tones running at the same time. Well, we're here to tell you that you can stop dreaming folks! The FLASHBACK TRIPLE DELAY is here and it's ready to rock your delay-hungry socks off!     •    Up to 3 delays running at the same time     •    Seemingly endless subdivision options     •    TonePrint-Enabled  * In the United States, Flashback Triple Delay is available exclusively through Guitar Center

  The Sonic Multiverse

  Ever heard a tape echo run through a ping-pong delay and then into a reverse delay? No? Trust us, it sounds amazing. With the FLASHBACK TRIPLE DELAY you can go as crazy as your imagination allows and with the added function of running the delays in series or in parallel, you can go from lush divine delays to otherworldly soundscapes in an instant! Time and space have never been easier to manipulate.

  Trippin’ on Triplets
