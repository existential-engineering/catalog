description: >-
  The Ernie Ball Music Man Short Scale StingRay bass offers a big thumpy round
  sound in a convenient smaller package. A 30" scale allows for easier
  playability due to the shorter spacing between the frets. The passive
  humbucking pickup is equipped with higher-output neodymium magnets, and a
  3-way rotary switch offers parallel, true single-coil, and series modes.
details: |-
  The Short Scale StingRay condenses the iconic StingRay voice into a more compact, beginner- and small-hands-friendly form factor. A 30-inch scale length reduces the spacing between frets for easier playability while preserving the thumpy, articulate bottom end the StingRay is known for.

  A single Music Man humbucking pickup loaded with higher-output neodymium magnets has been redesigned specifically for the shorter scale. A passive 3-way rotary switch routes the pickup through parallel, true single-coil, and series modes, giving players three distinct voicings without an active preamp.

  The body is ash with a high gloss polyester finish; the select-maple neck features a sculpted 5-bolt joint and a gunstock oil and hand-rubbed wax finish for a broken-in feel. Twenty-two high-profile, wide stainless-steel frets sit on a 1-1/2 inch nut, with fretboard options in maple, rosewood, or ebony.

  Hardware mirrors the modern Music Man Special line: the vintage top-loaded chrome bridge, lightweight custom tuning machines with tapered string posts, and a wheel-style truss rod that adjusts without component or string removal.
specs: |-
  - Body: Ash; 12-3/8" wide, 1-5/8" thick, 40-7/8" long
  - Body finish: High gloss polyester
  - Neck: Select maple
  - Neck finish: Gunstock oil and hand-rubbed wax blend
  - Neck attachment: 5-bolt sculpted joint
  - Neck width: 1-1/2" at nut, 2-3/8" at last fret
  - Frets: 22 high-profile, wide stainless steel
  - Fret markers: 5/16" dot inlay
  - Scale length: 30" (76.2 cm)
  - Pickups: Single Music Man humbucking pickup with neodymium magnets
  - Controls: Passive 500k ohm volume, 100k ohm tone with 0.1uF tone cap
  - Switching: 3-way rotary pickup selector (parallel, single-coil, series)
  - Bridge: Vintage Music Man top-loaded chrome-plated steel with vintage nickel-plated saddles
  - Tuning machines: Lightweight custom Music Man
  - Truss rod: Adjustable without component or string removal
  - Strings: 45w-65w-85w-105w (Short Scale Regular Slinky Bass #2852)
