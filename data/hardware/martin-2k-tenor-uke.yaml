details: |-
  The 2K Tenor Uke features solid flamed Hawaiian koa for sweet, rich tone and striking looks. With premium appointments and classic Martin craftsmanship, it's a refined ukulele built for tone, beauty, and lasting performance.

  With a flamed koa top, back, and sides, it delivers a sweet, rich tone with impressive clarity and warmth—hallmarks of this coveted tonewood. The tenor body adds fullness and volume, while the satin finish brings out the koa's natural grain and offers a smooth, inviting feel.

  Refined details include antique white binding, a multi-stripe rosette, and an East Indian rosewood fingerboard and bridge. A genuine mahogany neck and applied dovetail joint ensure strength and stability, and nickel open-gear tuners keep tuning precise.
specs: |-
  - Body: Tenor ukulele
  - Top: Solid flamed koa
  - Back & Sides: Solid flamed koa
  - Bracing: Spruce, 1/4" size
  - Neck: Genuine mahogany with standard taper
  - Neck Join: 14th fret, applied dovetail
  - Fingerboard: East Indian rosewood, 17 frets
  - Nut: Black Tusq, 1 13/32" width
  - Bridge: East Indian rosewood with compensated black Tusq saddle
  - Bridge Spacing: 1 5/8"
  - Inlays: Mother-of-pearl 1/8" dots with white side dots
  - Tuning Machines: Nickel open-gear
  - Binding: Antique white
  - Rosette: Multi-stripe
  - Headstock: Solid koa with script old-style overlay logo
  - Finish: Satin
  - Case: Soft gig bag included
