description: Premium-grade supercardioid condenser vocal microphone delivering a
  detailed, full, and vivid sonic character with warm low end, natural midrange
  presence, and crisp high-frequency detail. The supercardioid pattern provides
  strong acoustic isolation and feedback rejection for live vocal performance.
details: >-
  The Electro-Voice RE520 is a handheld condenser vocal microphone built around
  a self-biased condenser element and tuned for live vocal performance and
  studio-grade reproduction on stage. Its supercardioid polar pattern tightens
  the on-axis pickup zone and rejects off-axis sound, yielding excellent
  isolation from monitors and stage bleed while maintaining strong
  gain-before-feedback for high-SPL vocal applications.


  A multi-stage pop filter, formed by two layers of foam separated by an air
  gap, minimizes plosives and breath noise at close working distances, while a
  vibration-absorbing internal shock mount isolates the capsule from handling
  noise. A selectable high-pass filter on the body switches between a flat
  response and a 150 Hz cutoff to tame stage rumble and proximity-effect buildup
  as needed.


  With a wide 40 Hz - 20 kHz frequency response, 150 dB max SPL (1% THD), and a
  balanced 3-pin XLR output requiring 48 V phantom power, the RE520 is
  engineered to perform in demanding live environments without sacrificing the
  openness and detail expected of a studio-grade condenser.
specs: >-
  - Element type: Self-biased condenser

  - Polar pattern: Supercardioid

  - Frequency response: 40 Hz - 20 kHz

  - Sensitivity: 5.6 mV/pascal (-45 dBV/Pa)

  - Maximum SPL: 150 dB (1% THD)

  - Self noise: 17 dB SPL A-weighted

  - Dynamic range: 133 dB

  - Signal-to-noise ratio: 77 dB

  - Output impedance: 200 ohms

  - Power requirements: 48 VDC phantom power

  - Connector: 3-pin XLR

  - Polarity: Positive pressure on diaphragm produces positive voltage on pin 2
  relative to pin 3

  - Selectable high-pass filter: flat or 150 Hz cutoff

  - Multi-stage pop filter (two foam layers with air separation)

  - Vibration-absorbing internal shock mount

  - Length: 7.6 in (192 mm)

  - Diameter: 1.95 in (49.5 mm)

  - Shank diameter: 0.96 in (24.3 mm)

  - Weight: 11.7 oz (332 g)
