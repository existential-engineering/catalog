id: sP0Sul6UA_uzdsF-guEh1
name: DR-05X
manufacturer: tascam
primaryCategory: audio-interface
categories:
  - digital
url: https://tascam.com/us/product/dr-05x
description: Compact 2-channel portable stereo field recorder and USB audio
  interface with built-in omnidirectional condenser microphones. Records WAV/BWF
  up to 96kHz/24-bit and MP3 to microSD cards, handles up to 125dB SPL, and
  doubles as a driverless 2-in/2-out USB audio interface for Mac, PC, and iOS.
  Features auto recording, 2-second pre-record buffer, overdubbing, chromatic
  tuner, six reverb presets, and up to 17.5 hours of battery life from two AA
  batteries.
details: |-
  Handheld portable stereo recorder. Built-in omnidirectional condenser stereo mics rated to 125dB SPL. Records to microSD/microSDHC/microSDXC (up to 128GB) as WAV/BWF (44.1/48/96kHz, 16/24-bit) or MP3 (32–320kbps). Functions as driverless 2-in/2-out USB audio interface (Micro-B, USB 2.0, 44.1/48kHz). External 3.5mm mini jack supports mic with plug-in power or line input. Built-in features: auto record, 2-second pre-record, punch-in overwrite, non-destructive overdub, speed control (0.5–2.0x), chromatic tuner (C1–B6), 6 reverb presets, low-cut filter (40/80/120Hz), 128×64 LCD, 1/4-inch tripod mount. Powered by 2× AA batteries (~17.5 hours) or USB bus power.
specs: |-
  - - Built-in mics: omnidirectional condenser, max SPL 125dB
  - External input: 3.5mm stereo mini jack, plug-in power; nominal -20dBV, max -4dBV
  - Headphone output: 3.5mm stereo mini jack; nominal -14dBV, max headphone 20mW+20mW (32Ω)
  - USB: Micro-B, USB 2.0 High Speed (mass storage + audio); audio: 2-in/2-out, 44.1/48kHz
  - Recording media: microSD/microSDHC/microSDXC up to 128GB
  - Formats: WAV/BWF 44.1/48/96kHz 16/24-bit; MP3 32–320kbps
  - S/N: ≥94dB; THD: ≤0.01%; freq response: 20Hz–20kHz ±1dB (44.1/48kHz)
  - Power: 2× AA batteries (~17.5h) or USB bus power; consumption: 1.7W max
  - Dimensions: 61(W) x 141(H) x 26(D) mm; weight: 116g
