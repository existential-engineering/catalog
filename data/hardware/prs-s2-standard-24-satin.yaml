details: |-
  With its solid build and versatile, vintage electronics platform, the S2 Standard 24 Satin is a true player’s guitar. The thin satin nitro finish gives this instrument a wonderful resonance and an open clarity that’s noticeable even unplugged. The subtle aesthetic of mahogany and vintage vibe of pickguard-mounted electronics give the S2 Standard 24 an understated look for players who prefer a stripped-down approach to their music.

  The solid mahogany body and set neck provide a distinctive resonance and powerful sustain, and when mahogany’s rich, round, warm tone meets the Maryland, USA-made PRS 58/15 LT pickups, there are plenty of clear highs and strong mids to be dialed in. Anchored by the PRS patented tremolo and PRS Phase III locking tuners with unplated brass shafts, the PRS S2 Standard 24 Satin is built for power and reliability night after night.
