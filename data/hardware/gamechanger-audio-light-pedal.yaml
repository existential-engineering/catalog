description: Analog optical spring reverb pedal that reads a three-spring tank
  with infrared optical sensors alongside its conventional pickup, giving
  classic spring tones plus optical sensor selection, sweep modulation, tremolo,
  lo-fi delay, self-oscillating feedback and added-harmonic modes, each with its
  own place in a three-way mix.
details: |-
  The LIGHT Pedal is an analog optical spring reverb system that uses infrared optical sensors. The system harvests the full timbral and harmonic range of a spring reverb tank, combining the features of a classic spring reverb with an optical sensor system and an effects section, which opens up reverb textures a mechanical tank alone cannot produce.

  Extremely sensitive optical sensors are directed at different points of the spring and detect very subtle movements on the spring's surface as sound waves travel through it. This picks up a much wider range of frequencies, overtones and textures that are otherwise lost in the mechanical reverberation process. The sensors also open the door to effects that are new to spring reverbs, such as tremolo, modulation, feedback and added harmonics, giving reverb sounds that range from classic to experimental.

  The extended signal mix section allows a precise balance between the dry signal, the classic reverb tone and the optical reverb signal. Effects can be stacked and controlled with playing dynamics or an expression pedal.

  The pedal's central component and main sound source is a traditional spring reverb tank, made up of three major elements: the input transducer (spring exciter), the springs and the output transducer (pickup). The spring's movement patterns during reverberation can be complex, especially near the input transducer, but spring elasticity means that by the time vibrations have reached the output transducer what is mostly heard is the spring's own resonant frequencies, which is why all spring reverbs have such a particular jangly, metallic sound. The spring output (the spring knob) offers a classic spring reverb sound, with the option to adjust the spring drip (the drive knob) and the tone of the output signal (the tone knob).

  To capture the full range of the spring's vibrations, the pedal uses multiple sets of infrared optical sensors that act as photoelectric pickups. Each set of IR sensors is directed at a different point on the moving spring's surface, and detects much finer movements than the output transducer does. That makes longer decays possible and gives a more detailed frequency response, including subharmonics and overtones. The pedal can also produce modulation and tremolo effects by scrolling through the optical sensors or by switching them on and off.
specs: |-
  - Sounds ranging from classic spring tank tones to colorful optical spring reverb tones with modulation and added harmonics
  - Separate level controls for the dry signal, spring and optical reverbs. The dry signal can be attenuated and boosted
  - 6 unique effects: optics (frequency and texture calibration), sweep (modulation), tremolo, reflect (delay), feedback and harmonic (added harmonics and octave tracking). Multiple effect stacking options
  - Drive knob for adjusting the signal level sent to the reverb tank, which affects the tank's behavior
  - Tone knob ranges from rumbling lows to piercing highs
  - One-knob envelope control produces either gated or ducking reverb
  - Effects parameters can be linked to playing dynamics
  - Switchable reverb tails in bypass mode
  - Switchable latching or momentary modes
  - Assignable expression pedal input
  - Adjustable shock sensor to control spring noise produced by sudden movements and mechanical impact
  - Color LEDs inside the spring tank give visual feedback on the reverb's output and input signal levels and on effect parameters such as modulation rate
  - High-quality buffered bypass
  - Controls: 3 mix controls, dry, spring (classic spring sound) and optical (optical spring reverb sound)
  - tone: shared between the spring and optical sounds, and does not apply to the instrument's dry signal
  - 6-way effect selector knob
  - ctrl: effect parameter control knob
  - drive: spring tank's input signal level
  - gate: primary function is gated and ducking reverb control, secondary function is ctrl knob envelope response control
  - tails: turns reverb tails on or off
  - latch: sets the pedal into latching mode (on) or into momentary mode (off)
  - shock sensor: shuts off the wet signal output when mechanical impact or a shaking motion is detected, with three levels of shock protection, off, soft and hard
  - soft footswitch: primary function is toggling bypass, secondary functions are effects stacking, adjusting the envelope control over the effects, and entering the footswitch assignment mode
  - optics: chooses a specific combination of optical sensors, each with a slightly different texture and timbral quality
  - sweep: a modulation mode that rhythmically scrolls back and forth through the different optical sensor pairs, where the differing frequency response of each sensor results in a modulation-style effect
  - trem: a tremolo effect produced by rhythmically switching the optical sensors on and off. It can be applied to the spring output together with the optical signal or separately
  - reflect: a lo-fi delay that sends the instrument's signal back into the reverb tank several times. Long delay times can create lengthy reverb decays
  - feedback: sets the spring tank into self-oscillation, for drones and wall-of-sound pads, with uses when paired with an expression pedal or when in momentary mode
  - harmonic: the spring tank is driven by a circuit designed to produce added overtones and harmonics naturally within the tank
  - All effects are controlled with the ctrl knob, which can be responsive to playing dynamics. The first three effects (optical, sweep, trem) can be stacked with one of the remaining three
  - Mono pedal with a 1/4 inch jack input and output
  - Expression input takes 1/4 inch TS and TRS jacks, is compatible with all expression pedal types and accepts CV signal (active range to 3.3 V). The expression pedal can be assigned to the ctrl, spring, optical, drive or gate knobs
  - Product dimensions WLH 105 x 190 x 40 mm (4.1 x 7.5 x 1.6 in)
  - Product weight 1060 g (2.3 lbs)
  - Spring tank: 3 springs type, 100 mm
  - Input impedance 1 MΩ
  - Max input level 6.8 dBu
  - Output impedance 100 Ω
  - Max output level 6.8 dBu
  - Peak power consumption 4 W
  - Mean power consumption 0.9 W
  - Power requirements: 500 mA minimum, 9 V DC center negative, 2.1 x 5.5 mm plug. The power supply is not included
