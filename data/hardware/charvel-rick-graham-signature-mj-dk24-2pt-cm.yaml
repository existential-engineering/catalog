description: The Rick Graham Signature MJ DK24 2PT CM pairs Charvel's
  high-performance Dinky platform with the precise feature set chosen by U.K.
  guitarist Rick Graham, whose playing ranges from delicate chordal passages to
  furious onslaughts of overdriven virtuosity.
details: |-
  Built around a basswood Dinky body finished in gloss Celeste, the MJ DK24 features a scalloped lower back bout and a sculpted shredder's cut heel for unimpeded upper-fret access. The bolt-on caramelized maple neck has graphite reinforcement, a satin back finish, and a Speed Neck profile with rolled fingerboard edges.

  A caramelized maple fingerboard with a 12"-16" compound radius hosts 24 jumbo stainless-steel frets, 4mm crème dot inlays, and Luminlay side dots. A Graph Tech TUSQ XL nut (1.6875") and 25.5" scale length round out the playing surface, with a heel-mount truss rod adjustment wheel for easy setup.

  Electronics center on a custom Rick Graham Bare Knuckle HSS set in white: a ceramic humbucker at the bridge with single-coils in the middle and neck, routed through a 5-position blade switch that delivers bridge humbucker, coil-split combinations, and neck single-coil voicings. Volume and tone controls use Stratocaster-style skirted knobs.

  Hardware includes a Gotoh Custom 510 recessed tremolo with Gotoh arm and Gotoh die-cast locking tuners in chrome, a beveled output jack, and a licensed Fender Stratocaster headstock. The instrument ships with .009-.042 nickel-plated steel strings and a Charvel Multi-Fit hardshell gig bag.
