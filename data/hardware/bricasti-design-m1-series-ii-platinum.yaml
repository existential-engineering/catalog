url: https://bricasti.com/en/consumer/m1s2_platinum.php
description: The Bricasti M1 Series II Platinum combines the M1 Series II DAC
  with the MDx Network Processor Board factory-installed. It adds Ethernet
  streaming and network playback while retaining the original discrete Class A
  balanced analog output stage. Handcrafted in Massachusetts, USA.
specs: |-
  - MDx Network Processor Board factory-installed
  - USB: up to 32-bit / 384kHz PCM, DSD64/128/256
  - AES/EBU, S/PDIF (BNC and RCA): up to 24-bit / 192kHz
  - Toslink: up to 24-bit / 96kHz
  - Discrete Class A balanced analog output stage
  - Balanced analog output: 4VRMS (XLR)
  - Unbalanced analog output: 2VRMS (RCA)
  - Output impedance: 100Ω (balanced), 50Ω (unbalanced)
  - THD+N: <0.001%
  - SNR: >118dB
  - Chassis: 2U rack-mount, 19-inch
  - Handcrafted in Massachusetts, USA
