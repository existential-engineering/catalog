description: The 802 D5 is engineered for reference-grade stereo listening and
  breathtaking home theatre experiences.
details: |-
  The 802 D5 is a three-way vented-box reference tower loudspeaker in the 800 Series Diamond D5 range. It delivers much of the quality of the flagship 801 D5 in a more affordable design, using the same Diamond dome tweeter housed in a Solid Body Tweeter-on-Top, as well as the decoupled Turbine Head for its Continuum cone FST midrange driver.

  Dual 8-inch Aerofoil bass drivers are rigidly mounted in the reverse-wrap cabinet for controlled and precise low-frequency performance. It is a passive design driven from an external amplifier, with a recommended amplifier power of 50W to 500W into 8 ohms and no mains connection of its own.

  Bowers & Wilkins describes the drive unit package as its most advanced: the Diamond dome tweeter pushes break-up frequency to 70kHz for clarity, precision and openness, while the Continuum cone delivers voices and instruments with lifelike detail.

  Every model in the new 800 Series Diamond range benefits from enhanced technology. An upgraded Matrix design reduces resonance and creates a more believable soundstage, while aluminium Space Frame Bracing and an all-new aluminium top section within the cabinet help deliver an even more spacious and immersive sound.

  The cabinet is formed from a single continuous curve locked in place by a solid aluminium spine, which the company says reduces cabinet reflections. Finishes are Stealth Black, Warm White, Light Walnut and Dark Walnut with matching Leather by Connolly trim; grilles are black on Stealth Black and Dark Walnut and grey on Warm White and Light Walnut. The speaker stands 1218mm tall including tweeter and plinth and weighs 91.4kg.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond dome tweeter, Solid body Tweeter-on-Top, Continuum cone FST midrange, Anti-Resonance plug, Biomimetic Suspension, Turbine Head, Matrix, Aerofoil bass cones, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 150mm (6in) Continuum cone FST midrange, 2x 200mm (8in) Aerofoil bass
  - Frequency range: -6dB 14Hz to 35kHz
  - Frequency response: 17Hz to 28kHz (+/-3dB)
  - Sensitivity: 90dB
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 70Hz to 20kHz, less than 0.3% 100Hz to 8kHz
  - Nominal impedance: 8 ohms (minimum 3.3 ohms)
  - Recommended amplifier power: 50W to 500W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 1218mm (48.0 in) including tweeter and plinth, Width 345mm (13.6 in) cabinet only or 413mm (16.2in) including plinth, Depth 556mm (21.9in) including grille and terminals or 589mm (23.2in) including plinth
  - Net weight: 91.4kg (201.4lbs)
  - Cabinet finishes: Stealth Black, Warm White, Dark Walnut, Light Walnut
  - Grille finishes: Black (Stealth Black and Dark Walnut), Grey (Warm White and Light Walnut)
