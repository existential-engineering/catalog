description: The 802 D5 is engineered for reference-grade stereo listening and
  breathtaking home theatre experiences.
details: |-
  Delivering much of the quality of the flagship 801 D5 in a more affordable design, 802 D5 uses the same Diamond dome tweeter housed in a Solid Body Tweeter-on-Top, as well as the decoupled Turbine Head for its Continuum cone FST midrange driver. Dual 8-inch bass drivers are rigidly mounted in its reverse-wrap cabinet, ensuring controlled and precise low-frequency performance. Available in Stealth Black, Warm White, Light Walnut, or Dark Walnut, with matching Leather by Connolly trim, the 802 D5 provides you with sound you wouldn't believe possible.

  Ultimate drive unit technology. Pairing the brand's most advanced and innovative drive unit technology, the 802 D5 delivers its purest sound ever. The Diamond dome tweeter pushes break-up frequency to 70kHz, delivering exceptional clarity, precision and openness, and the Continuum cone delivers voices and instruments with lifelike detail.

  Optimised for pure performance. Every model in the new 800 Series Diamond range benefits from enhanced technology. An upgraded Matrix design reduces resonance and creates a more believable soundstage, while aluminium Space Frame Bracing and an all-new aluminium top section within the cabinet help deliver an even more spacious and immersive sound.

  Crafted to be better by design. The 800 Series Diamond looks this way for a reason. Its shape is dictated by the science of sound. Bowers & Wilkins cabinets are formed from a single continuous curve, locked in place by a solid aluminium spine, so cabinet reflections are reduced. Complemented by the Tweeter-on-Top and Turbine Head, musical performance is always as precise as possible.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond dome tweeter, Solid body Tweeter-on-Top, Continuum cone FST midrange, Anti-Resonance plug, Biomimetic Suspension, Turbine Head, Matrix, Aerofoil bass cones, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 150mm (6in) Continuum cone FST midrange, 2x 200mm (8in) Aerofoil bass
  - Frequency range: -6dB 14Hz to 35kHz
  - Frequency response: 17Hz to 28kHz (+/-3dB)
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), <1% 70Hz to 20kHz, <0.3% 100Hz to 8kHz
  - Nominal impedance: 8 ohms (minimum 3.3 ohms)
  - Recommended amplifier power: 50W to 1000W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 1218mm (48.0 in) including tweeter and plinth, Width 345mm (13.6 in) cabinet only, 413mm (16.2in) including plinth, Depth 556mm (21.9in) including grille and terminals, 589mm (23.2in) including plinth
  - Net weight: 91.4kg (201.4lbs)
  - Cabinet finishes: Stealth Black, Warm White, Dark Walnut, Light Walnut
  - Grille finishes: Black (Stealth Black and Dark Walnut), Grey (Warm White and Light Walnut)
