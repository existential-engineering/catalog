description: The FX8 Mark II is a multi-effects pedalboard designed to deliver
  Fractal's signature quality in an effects-only floor unit. It runs up to eight
  simultaneous effects using the state-of-the-art algorithms made famous in the
  Axe-Fx II line of processors.
details: |-
  The FX8 Mark II is a multi-effects pedalboard built to deliver Fractal's signature quality without compromise in an effects-only floor unit. It runs up to eight simultaneous effects using the state-of-the-art algorithms made famous in the Axe-Fx II line of processors, housed in a rugged powder-coated steel chassis with aircraft aluminum end panels, a convenient top handle, eleven quiet solid state footswitches with no mechanical contacts to fail, 27 LEDs in three colors and five knobs beneath a bright display. The unit is designed for unity gain and offers true bypass, with a high quality signal path for ultra-low noise and pristine sound.

  Compared with the original FX8, the Mark II has an all-black aircraft aluminum bezel and end panels, an improved top-panel silkscreen design, an 18dB instrument input pad option and an even lower noise floor.

  Onboard preset memories hold 128 completely different pedalboards, and every effect in every preset can be run in series or parallel. Using the optional four cable setup, each effect can be placed PRE, between guitar and amp where pedals go, or POST, in the amp's send and return loop where rack effects are typically placed.

  Stompbox Mode handles traditional effect tap dance switching, while the eight scenes in each preset engage pre-defined effect combinations from a single switch, a kind of control similar to traditional loop switcher rigs. Many effects also offer XY switching for two completely different sets of settings, such as a single drive pedal with both Overdrive and Fuzz channels or a reverb with foot-selectable spring and hall sounds. The modifier system allows real-time control from MIDI, from up to two expression pedals such as the Fractal Audio EV-1, or from onboard controllers.

  Effects are placed as blocks, many of which can be configured as various effect types: the DRIVE block includes simulations of 34+ different fuzz, overdrive, distortion and boost pedals, and the DELAY block offers types for analog, digital, tape and more. A precision tuner, two global equalizers and a dedicated global 4-minute stereo looper are also built in, alongside dual TRS relays for amp switching, two switch or expression pedal jacks, MIDI and USB. FX8-Edit, a full-featured software editor, is included free, and the FX8 is fully compatible with Fractal-Bot for preset sharing, backup and restore, plus firmware updates as new features are added.
specs: |-
  - Advanced multi-effects processor for guitar, bass and other instruments
  - Powder-coated steel chassis with aircraft aluminum end panels and a top handle
  - Eleven quiet, durable solid state footswitches with no mechanical contacts to fail
  - 27 LEDs in three colors
  - 160x80 px display with 6 buttons and 5 knobs
  - 128 presets, each a completely different pedalboard
  - Up to eight simultaneous effects per preset
  - Each effect configurable Pre/Post and Series/Parallel
  - Stompbox Mode with traditional ON/OFF switching plus XY switching on press and hold
  - XY switching gives many effects two completely different sets of settings
  - Eight scenes per preset recall effect ON/OFF, X/Y, relay and MIDI combinations
  - Modifiers allow real-time control of many parameters via MIDI, pedals or onboard controllers
  - Support for up to two expression pedals, such as the Fractal Audio EV-1
  - Designed for unity gain both PRE and POST, with true bypass
  - High quality converters for ultra-low noise and pristine audio
  - Humbuster outputs help defeat ground hum when used with Humbuster cables
  - Two onboard TRS relays to control an amp's channel or effect switching
  - Two onboard pedal jacks for footswitches or expression pedals
  - MIDI IN and OUT/THRU ports to control or respond to other MIDI gear
  - Global IN and OUT volume, pedal-assignable, plus dual global 10-band graphic EQ
  - Built-in precision tuner
  - Dedicated global 4-minute stereo looper, 8 minutes in mono
  - DRIVE block includes simulations of 34+ fuzz, overdrive, distortion and boost pedals
  - DELAY block offers analog, digital and tape types
  - USB for connection to a Mac or PC for editing, backup and restore, and firmware updates
  - FX8-Edit free editor and librarian included
  - Compatible with Fractal-Bot for preset sharing, backup and restore, and firmware updates
  - Mark II adds an all-black aircraft aluminum bezel and end panels, improved top-panel silkscreen, an 18dB instrument input pad option and a lower noise floor
