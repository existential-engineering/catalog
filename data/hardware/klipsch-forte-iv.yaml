description: The Forte IV is a 3-way, 12" horn-loaded floorstanding loudspeaker
  from Klipsch's Heritage series, first introduced in 1985 and refined through
  four generations. Hand-assembled in Hope, Arkansas, it delivers
  high-efficiency performance with a titanium compression tweeter, polyimide
  midrange compression driver, and a rear-mounted 15" passive radiator for
  extended bass.
details: |-
  The Forte IV hosts a three-way design utilizing a 12" woofer and horn-loaded midrange and tweeter. It incorporates an all-new K-702 midrange compression driver featuring a polyimide diaphragm for exceptional detail and dynamics. The K-702 midrange is mated to a modified Tractrix horn with patented Mumps technology for even polar response of mid frequencies, giving consistent sound throughout the listening area.

  The titanium diaphragm high-frequency driver features an all-new wide dispersion phase plug for exceptionally even high-frequency dispersion and a wider, more accurate sweet spot.

  The Forte IV's well-extended bass comes from a rear-mounted passive radiator — a 15" (38 cm) sub-bass radiator that operates on acoustic pressure generated by the active woofer for greater bass output and extension.

  The crossover network has been completely revoiced from its predecessor, utilizing premium componentry in an all-new high-fidelity network that minimizes electrical degradation throughout the circuitry. The new network draws from the classic three-way steep slope design of the legendary Klipschorn and La Scala speakers.

  The premium aluminum input panel accommodates large, high-quality speaker cables with strong, versatile binding posts enabling bi-wiring or bi-amping. The enclosure is built from 3/4" MDF with book-matched wood veneer panels harvested from the same timber, and pairs are grain-matched with sequential serial numbers. Hand-assembled in Hope, Arkansas, USA.
