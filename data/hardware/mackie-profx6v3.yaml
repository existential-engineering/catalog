url: https://mackie.com/en/products/mixers/profxv3-series/ProFX6v3.html
description: "6-Channel Professional Analog Mixer with USB. Elevate your
  creations with a professional USB mixer from the best-selling Mackie ProFXv3
  series, featuring two award-winning Onyx preamps and a versatile GigFX engine
  supporting high-resolution recordings with sample rates up to 192 kHz."
specs: |-
  - 6-channel configuration with 2 mic inputs
  - Two award-winning Onyx microphone preamps (60dB gain)
  - GigFX engine with 24 included effects and customizable presets
  - 2-band EQ (80Hz and 120Hz) on channels 1-2
  - 100Hz low-cut filter on all channels
  - Switchable Hi-Z inputs for instruments
  - 48-volt phantom power
  - 2x4 192 kHz USB recording
  - Latency-free direct monitoring
  - Headphone output with independent volume control
  - Includes Waveform OEM DAW and DAW Essentials Collection (16 FX plug-ins)
