description: Designed for musicians and creators who want high-resolution audio,
  the Mackie ProFX6v3 is a professional analog USB mixer with award-winning Onyx
  mic preamps.
details: |-
  Designed for musicians and creators who want high-resolution audio, the Mackie ProFX6v3 is a professional analog USB mixer with award-winning Onyx mic preamps. Record podcasts, stream gameplay or produce the next hit, all with ultra-clean, transparent audio.

  The ProFX6v3 has a high-resolution GigFX effects engine to give your sound the perfect touch, whether you need to add a bit of reverb to a guitar track or give your podcast a creative edge. With 24 effects, you have everything you need to shape your sound.

  The mixer is optimized for USB recording at sample rates up to 192 kHz. The 2x4 I/O sends separate mixes from your computer to your headphones and the channel strip. Latency-free direct monitoring keeps overdubs workable, and a dedicated control blends between the DAW return and the channel inputs.

  Waveform OEM recording software is included, an unrestricted workstation with unlimited track count that runs on macOS, Windows and Linux, together with the DAW Essentials Collection of 16 plug-ins.
specs: |-
  - 6-channel USB mixer with two low-noise, high-headroom Onyx preamps that provide 60 dB of gain
  - 2-band EQ (80 Hz and 12 kHz) on channels 1 and 2
  - Dual stereo USB return for additional routing flexibility during performances
  - Latency-free direct monitoring for hassle-free overdub sessions
  - High-resolution recording with sample rates up to 192 kHz to Mac/PC via USB
  - 24 included effects, including reverbs, delays and choruses, delivered via GigFX effects engine
  - GigFX presets include bright room, warm lounge, small stage, warm theater, warm hall, concert hall, cathedral, small plate, large plate, chorus, delay, ping-pong delay, overdrive/distortion, spring reverb, early reflections, auto-wah, flange and slapback reverb
  - Switchable Hi-Z inputs for guitars, bass, and other instruments
  - 100 Hz low-cut filter and 48V phantom power on all mic channels
  - Headphone output with independent volume control
  - Solid steel chassis with ABS side protection
  - 12 VDC at 2A universal external power supply (100-240 VAC)
  - 7.5 x 8.4 x 2.9 in / 191 x 213 x 74 mm, 2.6 lb / 1.2 kg
