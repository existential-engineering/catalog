description: Float away with the liquid, swaying effects of this
  state-of-the-art stereo chorus pedal. Gemini Chorus offers three types of
  deep, hypnotic chorus.
details: |-
  Gemini Chorus is a state-of-the-art stereo chorus pedal offering liquid, swaying modulation. It features three distinct chorus algorithms selectable via center toggle: CLASSIC (single modulating voice), DUAL (two modulating voices), and QUAD (four modulating voices).

  Users can download additional phaser, flanger, and chorus algorithms via the Neuro software at no extra cost, greatly expanding the pedal's modulation palette.

  The pedal includes an envelope follower mode for pick-sensitive modulation control, similar to auto-wah effects.

  Gemini stores up to 6 effect presets (two banks of three) and offers Universal Bypass (true bypass relays or transparent buffers). It supports USB-MIDI, MIDI Clock sync, NeuroHub compatibility, and expression control.
specs: |-
  - Three chorus algorithms: CLASSIC, DUAL, QUAD
  - Downloadable phaser, flanger, and chorus algorithms via Neuro software
  - Envelope follower mode for pick-sensitive modulation
  - Stereo input/output
  - Stores up to 6 presets (two banks of three)
  - Universal Bypass (true bypass relays or transparent buffers)
  - USB-MIDI, MIDI Clock sync, NeuroHub compatible
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 2.75" x 2.2"
  - Weight: 0.625 lb
  - Power consumption: 165 mA
