description: >-
  The Kurzweil PC2R is a 1U rackmount sound module delivering the acclaimed PC2 series sound engine
  with 64-voice polyphony, exceptional piano tones, and KB3 tone wheel organ modeling.
details: |-
  The PC2R brought Kurzweil's professional-grade sound library into a compact single-rack-space
  format, making it an attractive option for gigging keyboardists and studio producers who needed
  high-quality sounds without a full keyboard. It shares the same sound engine as the popular PC2
  keyboard, renowned for its expressive and realistic instrument patches.

  At the heart of the PC2R is a 400-program preset library spanning acoustic pianos, brass
  sections, strings, organs, and percussion. The KB3 mode deserves special mention, as it provides
  convincing tone wheel organ emulation with real-time drawbar control. Dual effects processors
  offer over 150 effects algorithms and 30 reverb types, giving users extensive sound shaping
  without external processing.

  The module supports 16-part multitimbrality and can be expanded from 64 to 128 voices of
  polyphony. Four programmable front-panel knobs provide hands-on control, and a 40-character LCD
  display makes navigation and editing straightforward. A built-in arpeggiator with velocity,
  tempo, and sync controls adds further creative possibilities.
specs: |-
  - Polyphony: 64 voices (expandable to 128)
  - Multitimbral: 16 parts
  - Presets: 400 programs (256 regular, 128 Orchestral ROM, 16 KB3 programs)
  - Effects: Dual processors with 150+ effects and 30 reverbs
  - LFOs: 2
  - Filter: Multiple envelope types (Bass Env, EPno Env, Phunk Env, Trip, LFO Sweep)
  - Arpeggiator: Yes, with velocity, tempo, duration, and sync
  - Display: 40-character LCD
  - Controls: 4 programmable knobs
  - MIDI: In/Out/Thru
  - Format: 1U rackmount
releaseDate: "2001"
releaseDateYearOnly: true
