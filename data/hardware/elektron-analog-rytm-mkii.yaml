description: "Layer distinctive analog percussion with digital samples. Bring in the power of sequencing and performance controls. For rhythmic discoveries in the studio and on stage: the Analog Rytm MKII is a one-stop solution beat machine. A different drum."
details: |-
  Feel the depth of booming kick drums, the snarling bite of snares, the bellow of toms, and the airy shimmer of hi-hats. Pick from multiple uniquely crafted synthesis models (called machines) for varied percussive sounds. Tweak the sound-shaping parameters to make those models your own, and experience the exquisite character of an analog ride, kick, or cowbell. The dual VCO synth engine adds a charmingly chubby bass level to your compositions.

  What sets the Analog Rytm MKII apart is the addition of a digital sample layer. Choose the source, the inputs, any of the internal tracks, or the main outs, complete your recording, trim the sample, and that's that. Swiftly set the pitch, direction, looping or one-shot behavior, and bitrate. Sample and re-sample.

  When you have captured and edited your samples, carry on and tweak the analog and digital layers. Treat that combination to some analog filtering and overdrive on each track, then take a route through the analog distortion and compressor circuits while adding even more bells and whistles with the digital reverb and delay effects. Add movement to your sound using the multi-waveform LFO and its great number of destinations.

  Release your beats using the velocity-sensitive pads, or play your sounds and samples chromatically. The pads can also be used to activate up to 12 performance macros, making fine use of their pressure-sensitive nature. Individual audio outputs for each voice ensure this drum machine fits just as snugly in a vintage analog studio recording session as in a modern digital one.

  The full-featured step sequencer lets you control both structure and sound. Press a step and tweak any parameter change into it for ultra-fast and detailed sequencing. Add controlled randomness and logic with the variety-friendly trig conditions, then create a full-blown composition using the song editor. Euclidean sequencer mode offers an alternative way to build patterns at the twist of a knob.
specs: |-
  - Fully analog signal path, 8 drum voices
  - 1 specialized analog percussion sound generator and 1 sample playback engine per voice
  - 1 analog overdrive circuit and 1 2-pole analog multi-mode filter per voice
  - 1 panning VCA pair, filter envelope, amp envelope, assignable LFO and LFO fade envelope per voice
  - 2 individual effect sends per voice
  - 128 projects (+Drive), 128 kits, 128 patterns and 16 songs per project
  - 4096 sounds (+Drive sound library), 128 sounds and 127 samples per project
  - 1 GB +Drive sample storage
  - Sequencer: 12 drum tracks, 1 FX track, sequencer MIDI out
  - Up to 64 steps per pattern, individual length and scale per track
  - Parameter locks, trig conditions, micro timing, chromatic mode, scene mode
  - 1 Euclidean sequence generator per track, page loop
  - Send effects: delay, reverb. Master effects: analog stereo distortion, analog stereo compressor
  - 12 large velocity and pressure sensitive backlit pads
  - 128 x 64 pixel OLED screen
  - MIDI In/Out/Thru with DIN sync out
  - 2 x 1/4" impedance balanced audio out jacks
  - 1 x 1/4" stereo headphone jack
  - 8 x 1/4" impedance balanced individual track output jacks
  - 2 x 1/4" balanced audio in jacks
  - 2 x 1/4" ext in jacks
  - 2 x 1/4" CV/Expression inputs
  - 48 kHz, 24-bit D/A and A/D converters
  - USB 2.0 Hi-Speed port
  - Headphones out level: +15 dBu (55 ohm), main and individual outputs level: +15 dBu
  - Output impedance: 440 ohm unbalanced
  - Unbalanced external inputs: +15 dBu maximum, 9 kohm
  - Balanced audio inputs: +15 dBu maximum, 19 kohm
  - Digital S/N ratio: 110 dB (20 to 20000 Hz)
  - CV/Expression input voltage on tip: -5 V to +5 V, supplies +5 V on ring
  - Unit power consumption: 14 W typical, 20 W maximum
  - Recommended power supply: 12 V DC, 2 A
  - Aluminum enclosure, W385 x D225 x H82 mm (15.2 x 8.85 x 3.3")
  - Weight: approximately 2.4 kg (5.3 lbs)
  - Overbridge enabled, class-compliant USB audio
  - 3 year Elektron warranty
