name: Capt'n Big-O
manufacturer: cre8audio
primaryCategory: modular
url: https://www.cre8audio.com/captnbigo
prices:
  - amount: 199.99
    currency: USD
description: Capt'n Big-O is for people who like (or want to like) big massive
  analog sounds. It uses 100% analog components, no oscillator on a chip.
details: |-
  Capt'n Big-O is for people who like (or want to like) big massive analog sounds. 100% analog components, no oscillator on a chip here.

  The Capt'n was designed in partnership with Pittsburgh Modular Synthesizers. Cre8audio asked them to cram as much big analog waviness as possible into a voltage-controlled oscillator module, and Pittsburgh Modular contributed one of their wave folders and a newly-designed drive circuit.
specs: |-
  - Width = 14hp
  - Depth = 26mm
  - 100% analog, original design (not an oscillator on a chip)
  - Waveforms - sine, triangle, saw, and square
  - Wave folder/waveshaper - routed by default to sine but patchable to any waveform or external source
  - Drive circuit - essentially a 75x overdriven VCA (5V output)
  - Linear and exponential frequency modulation (FM)
  - Hard sync
  - Pulsewidth modulation
  - 120mA power draw when running +12V rail
  - 108mA power draw when running -12V rail
  - Input voltage range of oscillator = -10V to +10V
