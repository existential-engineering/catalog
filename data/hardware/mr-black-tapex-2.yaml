  - tape
url: https://www.mrblackpedals.com/products/tapex-2
description: The Tapex 2 is a compact analog-voiced tape-echo delay with 43 to
  808 ms of delay time, two tape modes, true-stereo I/O, preset save/recall, and
  optional expression and tap-tempo inputs.
details: |-
  Inspired by the old tape-echo devices of a time not forgotten, the Tapex 2
  packs a serious punch into a compact, pedalboard-friendly package, and it
  sounds like heaven doing it.

  The signal path uses pure analog pre-amps and output drivers feeding a
  complementary true-stereo I/O arrangement. The Left input is the delay input
  with a dry pass-through, and delay is present on both the Left and Right
  outputs; the Right input is a dry pass-through only, letting the Tapex 2 sit
  naturally in a stereo rig.

  Delay times span 43 ms to 808 ms with two selectable tape voicings, Choice and
  Damaged I, and repeats trail off naturally on bypass. A simple preset can be
  saved and recalled, and the pedal accepts an optional expression pedal that can
  be assigned to any control on the fly, plus an optional external tap-tempo
  input.

  It runs on industry-standard 9VDC power, is daisy-chain friendly, and draws
  under 70 mA.
specs: |-
  - Pure analog pre-amps and output drivers
  - Complementary True-Stereo inputs & outputs
  - Left Input: Delay input with Dry pass-through (Delay output on both Left and Right Outputs)
  - Right Input: Dry pass-through only
  - 43mS - 808mS delay time
  - Choice & Damaged I tape modes
  - Trailing repeats on bypass
  - Simple and easy to use preset Save/Recall
  - Optional expression control input assignable on the fly to any control
  - Optional Tap-tempo input
  - Industry Standard 9VDC pedal-board and daisy chain friendly power (<70mA draw)
