description: 11" W-membrane studio subwoofer (discontinued) extending 2.1
  monitoring systems down to 30 Hz with a 350 W class G amplifier.
specs: |-
  - Professional studio subwoofer (discontinued)
  - Driver: 11" W composite sandwich cone (27 cm)
  - Frequency response (±3 dB): 30 Hz – 250 Hz
  - Maximum SPL (peak @ 1 m): 116 dB
  - Amplifier: 350 W class G (BASH technology)
  - Inputs: Left, Right, LFE — XLR symmetrical 10 kΩ
  - Stereo high-pass crossover: 75 Hz – 100 Hz
  - Configurable low-pass filter with mono summation
  - Finishes: Black, Grey, Red
  - Local supply: 230 V or 115 V
  - Dimensions (H × W × D): 38 × 34.4 × 44 cm (15 × 13.5 × 17.3 in)
  - Weight: 23 kg (50.7 lb)
