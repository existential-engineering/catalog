details: |-
  The Sub6 professional subwoofer features an 11" (27 cm) "W" composite sandwich cone driver integrated into a large rear laminar port cabinet. This design guarantees bass linearity whatever the SPL level required. To fine-tune the power level, Focal engineers chose BASH technology, which offers the sound quality of class AB with the efficiency of class D amplifiers.

  Optimal integration: Sub6 has been developed for optimum acoustic coupling with Focal loudspeakers. It features a wide range of adjustments, including a stereo high-pass crossover (75 Hz - 100 Hz) dedicated to left and right speakers, a configurable low-pass filter with mono summation, a phase inverter, an adjustable phase, and a MUTE switch. A wealth of connectors allows 2.1, 2.2 and multichannel use via L/R inputs and outputs and an LFE input.

  Footswitch: the footswitch input allows you to plug in a pedal to cut the subwoofer and deactivate the high-pass crossover on the outputs feeding the monitors. This makes it possible to compare listening in 2.1 (Sub6 filtered plus monitors filtered by the Sub6) and 2.0 (subwoofer deactivated plus full-range monitors), instantly and without moving.

  The "W" cone, known as the sandwich cone, consists of two sheets of glass placed on either side of a central foam body, a construction that allows great control of lightness, rigidity and damping. This cone optimizes the frequency response curve and provides low distortion.
specs: |-
  - Product type: monitoring subwoofer
  - Loudspeaker: 11" W membrane
  - Frequency response (+/- 3dB): 30 Hz - 250 Hz
  - Maximum SPL (peak @ 1m): 116 dB
  - Amplifier: 350 W, class G (BASH technology)
  - Inputs: Left, Right, LFE; XLR symmetrical 10 kOhms
  - Stereo high-pass crossover: 75 Hz - 100 Hz
  - Configurable low-pass filter with mono summation
  - LEDs: power on, mute, hi-pass defeat
  - Indicators and controls: sub level (sensitivity) adjustment, low-pass frequency adjustment, phase adjustment, polarity switch, mute, 2.1 bypass (controlled by external footswitch), high-pass frequency selection, high-pass defeat
  - Local supply: 230 V (11.6AL fuse rating) or 115V (13.15AL fuse rating)
  - On/Off switch on the rear panel
  - Height: 38 cm / 15 in
  - Width: 34.4 cm / 13.5 in
  - Depth: 44 cm / 17.3 in
  - Weight: 23 kg / 50.7 lb
