description: The beauty of Eurorack is that you are not limited to a specific
  synthesizer form factor. This can vary anywhere from super-compact,
  specialized performance systems to huge studio installations. While we have
  many options available for the former, the latter was missing from our
  Eurorack case lineup and we have finally created the missing piece – a large
  Eurorack case that provides exceptional value for money.
details: |-
  The Erica Synths Megarack case is for those who take Eurorack seriously, a classically-shaped 8x126 HP all-aluminium case with side panels, featuring Erica Synths custom rails with threaded inserts providing 12A@+12V and 6A@-12V.

  This monolith provides ample housing for a module collection, all while retaining a sleek elegance not commonly found in cases of this size.

  In addition, it features 2 4-pole XLR connectors for gooseneck lamps, which are not included.

  Dimensions are 990mm x 670mm x 360mm at a net mass of 14.75kg. Module depth is 80mm in most rows, 60mm above the power distribution boards, and up to 120mm in the inclined rows.

  The case comes without modules installed. The complete system in the product photography is shown for illustration purposes only.
specs: |-
  - 8 rows of 126 HP
  - 12A@+12V, 6A@-12V
  - 2 x 4-pole XLR connectors for gooseneck lamps (lamps not included)
  - Custom rails with threaded inserts
  - All-aluminium construction with side panels
  - Dimensions: 990mm x 670mm x 360mm
  - Net mass: 14.75kg
  - Depth: 80mm for most modules, 60mm above power distribution boards, 120mm max in inclined rows
