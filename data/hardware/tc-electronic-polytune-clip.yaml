details: |-
  Sporting ultra-precise strobe, chromatic and polyphonic modes, the POLYTUNE CLIP is the reigning champion of all things tuning. The POLYTUNE CLIP’s discreet design provides stealthy tune-ups - on stage or in the studio - so you’re back to perfect pitch before anyone even notices you’re drifting. With the POLYTUNE CLIP, your performance will be legendary! State of the art clip-on tuner Polyphonic perfection: the best polyphonic tuner to date New strobe tuner with +/- 0.02 cent accuracy

  The Holy Tuning Trinity

  POLYTUNE CLIP is designed to be your trusty tuning companion, whether you're going for a quick onstage tune-up or an ultra-precise setup of your instrument. POLYTUNE CLIP sports three distinct tuning modes ranging from the game-changing polyphonic tuning mode that lets you tune all 6 strings at once, to your trusty chromatic tuner and all the way to an ultra-precise strobe tuner mode, which offers +/-0.02 cents of tuning precision. No matter what method you choose to use, the tuning trinity of POLYTUNE CLIP will always guide you to pitch perfection.

  Dressed To Impress

  Developed with a luthier-like attention to detail, POLYTUNE CLIP is the perfect combination of beauty and brains. With its carefully chosen high-quality components and stunning clean looks, POLYTUNE CLIP is designed to complement you and your instrument, while containing the most advanced tuning technology to date. Through a massive engineering feat we managed to condense our proprietary PolyTune algorithm, shrink key components and increase battery life all while creating a tuner more powerful than any PolyTune released before it. The new tuning standard has just been defined and its name is POLYTUNE CLIP!
