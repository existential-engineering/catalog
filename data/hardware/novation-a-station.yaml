description: >-
  Novation's A-Station is an 8-voice polyphonic rack synthesizer released in
  2001, bringing the virtual analog architecture of the SuperNova line into a
  compact 1U format with hands-on control via 25 knobs.
details: |-
  The A-Station takes the analog-modeled voice architecture from Novation's
  SuperNova synthesizers and packages it into an affordable, compact rack
  unit. It provides three oscillators per voice with a wide selection of
  waveforms including sawtooth, triangle, sine, square, and pulse width
  modulation, along with a simple FM synthesis engine for metallic and bell-
  like tones.

  Filtering is handled by a resonant low-pass filter with switchable 12dB
  and 24dB per octave slopes, paired with a programmable EQ section. Two
  ADSR envelopes and two LFOs with sample-and-hold capability offer
  extensive modulation options, and the LFOs can be synced to MIDI clock
  for tempo-locked effects.

  A built-in effects section includes distortion, stereo chorus, flanger,
  phaser, panning, delay, and reverb. The unit also features a 12-band
  vocoder for processing external audio sources, adding another layer of
  sound design potential.

  The arpeggiator supports up, down, and up-down modes across four octaves
  with a latch function, and its settings are stored per patch. With 400
  program locations across four banks and 200 factory sounds, there is
  plenty of room for both presets and user creations.

  Despite its strengths, the A-Station has a few notable limitations: there
  is no power switch on the unit, the display is a small 2-digit LED, and
  it is not multitimbral.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 3 per voice (Saw, Square, Triangle, Sine, Pulse, Double Saw, Double Tri, Double Sine)
  - Oscillator Features: Osc 1-2 sync, FM, external audio input (mono)
  - Filter: Resonant low-pass, switchable 12dB/24dB per octave
  - Envelopes: 2 ADSR plus FM attack/decay
  - LFOs: 2 (Triangle, Saw, Square, Sample-and-Hold)
  - Effects: Distortion, Chorus/Flanger/Phaser, Panning, Delay, Reverb, 12-band Vocoder
  - Arpeggiator: Up/Down/Up-Down, 4 octaves, latchable
  - Memory: 400 programs (4 banks, 200 factory)
  - Connections: MIDI In/Out/Thru
  - Form Factor: 1U rackmount
releaseDate: "2001"
