description: Studio Standard Reverb Effects Processor. Discontinued legacy
  mainframe digital reverb processor controlled by the LARC remote.
details: |-
  The Lexicon 480L is a legendary studio-standard digital reverb and effects processor housed in a rack-mount mainframe and controlled via the LARC (Lexicon Alphanumeric Remote Controller). For decades it set the benchmark for high-end reverberation in professional recording, mixing, and post-production studios worldwide.

  The 480L is operated through the LARC remote, which sits on the engineer's console and provides hands-on access to the unit's algorithms, parameters, and program library while the mainframe lives in the machine room. Programs are organized into 'Classic Carts' and the unit supports sample memory expansion for longer effects.
specs: |-
  - Studio-standard mainframe digital reverb and effects processor
  - LARC (Lexicon Alphanumeric Remote Controller) for tabletop control
  - Classic Cart program/preset architecture
  - Sample memory expansion supported
  - Software upgradeable (v3.0, v3.01, v4.0 releases documented)
