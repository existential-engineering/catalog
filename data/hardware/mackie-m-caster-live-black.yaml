  Looking to step up your audio game on your streams, podcast, or videos? M·Caster Live is the ultimate portable audio solution for mobile devices and Mac/PC.

  Plug in your mic, sweeten your sound, then go live. IT'S THAT SIMPLE.

  Connect directly to your smartphone's headphone jack to both send and receive audio.

  Sure, you can use your favorite professional microphone, but it doesn't stop there. M·Caster Live plays nicely with DSLR's, Headsets, and Smartphones too.
specs: |-
  - Connect directly to smartphone's headphone jack
  - Connect favorite mic, headset, and more
  - Selectable ContourFX Presets
  - StreamFX voice-changing effects
  - RGB LED strip with 7 user-selectable colors
  - USB connectivity for Mac/PC audio interface use
  - Automatic Mix Minus on smartphone input
