description: >-
  The JoMoX SunSyn is a true analog 8-voice polyphonic synthesizer featuring a
  modular-style routing system with 4,096 combinations per routing element.
  Housed in a classic desktop case with wood end-cheeks, it combines two analog
  VCOs per voice with digital Ramp Controlled Oscillators for hybrid sound
  generation. It was also available in 4-voice and 6-voice configurations and
  can be rack-mounted.
details: |-
  Released in 2000, the JoMoX SunSyn is the company's first major analog real-time synthesizer. It features 8 true analog voices housed in a classic desktop case with wood end-cheeks, 40 knobs, 42 buttons, and 85 LEDs. Four-voice and six-voice versions were also available, and the unit can be rack-mounted.

  Each voice features two analog VCOs with sawtooth, square, and pulse waveforms with pulse-width modulation, complemented by four Ramp Controlled Oscillators (RCOs) that follow the VCO characteristics while using digital sounds from four wavesets of 256 waveforms each. The digital waveforms receive analog treatment for warmer, fatter tones. Two LFOs per voice offer triangle, sawtooth up/down, rectangle, and random waveforms.

  The filter section employs a true analog 4-pole design with individually configurable highpass and lowpass switching for each pole, enabling morphing between classic Minimoog character and Roland TB-303 squelch. Filter settings can be stored in one of two scene memories with real-time morphing between scenes. JoMoX developed a clever routing system that turns the SunSyn into an 8-voice modular, with up to 4 routing elements per voice offering 4,096 possible combinations per element, providing signal routing flexibility traditionally found in large classic modular systems within an integrated desktop format.

  The SunSyn provides stereo outputs, 8 freely routable individual outputs, and a stereo input for external audio processing through its modulation system. Complete patch memory stores 350 single patches and 150 multi-patches with full multitimbral MIDI implementation. A PCMCIA card slot provides additional storage and waveset expansion.
specs: |-
  - Polyphony: 8 voices (4- and 6-voice models available)
  - Oscillators: 2 VCOs per voice (sawtooth, square, pulse with PWM) plus 4 RCOs per voice
  - RCO Wavesets: 4 wavesets of 256 waveforms each (expandable via PCMCIA)
  - LFO: 2 per voice (triangle, sawtooth up/down, rectangle, random)
  - Filter: 4-pole analog with HP/LP switching per pole, 2 scene memories with real-time morphing
  - Effects: None
  - Keyboard: None (desktop/rack module)
  - Memory: 350 single patches, 150 multi-patches
  - Storage: 1 PCMCIA card slot
  - Outputs: Stereo out, 8 individual outs, stereo input
  - Controls: 40 knobs, 42 buttons, 85 LEDs
  - Control: MIDI (multitimbral, most parameters externally controllable)
