details: |-
  The Martin D-28 Authentic 1937 Aged is part of Martin's Authentic Series, designed to faithfully recreate the look, feel, and tone of a pre-war 1937 D-28 Dreadnought. Each example is built with period-correct 1937 specifications, including hide glue construction and hand-scalloped forward-shifted X-bracing that replicate the craftsmanship of Martin's golden era.

  The top is Adirondack spruce treated with Martin's Vintage Tone System (VTS), a thermal aging process that simulates decades of natural aging to deliver a broken-in tone right out of the case. The back and sides are crafted from Guatemalan rosewood, paired with a genuine mahogany neck carved to the Authentic 1937 profile and an ebony fingerboard with 1937 diamonds and squares abalone inlay.

  A Vintage Gloss aged finish, complete with checking and character marks, gives the guitar the visual patina of a well-played pre-war instrument. Aged Waverly nickel open-back tuners, a bone nut and saddle, an ebony authentic belly bridge, and an aged tortoise-pattern pickguard round out the period-correct appointments.

  Factory-strung with Martin Authentic Acoustic Lifespan 2.0 Phosphor Bronze Medium strings and shipped in a hardshell case with brass/nickel plated hardware, the D-28 Authentic 1937 Aged is backed by Martin's Limited Lifetime Warranty. A left-handed configuration is available.
specs: |-
  - Body Size: Authentic D-14 Fret (Dreadnought)
  - Top: Adirondack Spruce with VTS
  - Back & Sides: Guatemalan Rosewood
  - Bracing: Authentic 1937 Forward-Shifted X-Brace (Scalloped)
  - Neck Joint: Dovetail
  - Construction: Hide Glue
  - Neck Shape: Authentic 1937
  - Neck Material: Genuine Mahogany
  - Scale Length: 25.4"
  - Fingerboard Material: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Total Frets: 20 (joins body at 14th fret)
  - Tuning Machines: Aged Waverly Nickel Open Back
  - Bridge: Ebony, Authentic Belly
  - Nut & Saddle: Bone
  - Inlay: 1937 Diamonds and Squares (Abalone)
  - Finish: Vintage Gloss - Aged (with checking and character marks)
  - Pickguard: Tortoise Pattern Aged
  - Electronics: None
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze (Medium)
  - Case: Hardshell with brass/nickel plated hardware
  - Warranty: Limited Lifetime Warranty
  - Left-handed Availability: Yes
