details: |-
  BeatBuddy 2 - the guitar pedal drum machine for live, responsive drums. Add fills, transitions, part changes, drum breaks, accent hits, intros/outros, double/half time, cowbell, and more — all in real time. Even navigate set lists hands-free. Includes 13 ultra-realistic drum kits and over 200 songs across 23 genres, with room for 320 drum sets and 3.2 million songs (download or create your own).
