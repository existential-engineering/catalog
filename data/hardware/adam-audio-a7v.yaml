description: The A7V from the A Series is a contemporary 2-way monitor that represents the evolution of ADAM Audio's award winning A7X.
details: |-
  The A7V is a contemporary 2-way monitor that represents the evolution of ADAM Audio's award winning A7X. It features a 7" Multi-Layer Mineral woofer and rotatable X-ART tweeter, which is made by hand in Berlin.

  DSP-based voicing, equalization and room correction options can be controlled remotely and in real time via the free-to-download A Control software, and updatable firmware allows for new filters and tunings to be implemented over the lifetime of the monitor.

  Made from a new glass fiber polymer compound, the HPS waveguide enables the X-ART tweeter to disperse sound in space with controlled consistency, with 120 degrees horizontal and 70 degrees vertical dispersion. The waveguide is rotatable for horizontal or vertical placement.

  The A Series combines the best of both digital and analog worlds. The A7V uses a PWM amplifier for the woofer and a Class A/B amplifier for the tweeter, with independent peak and thermal limiters for each driver.

  ADAM Audio partners with Sonarworks on an automated room correction solution that runs directly on the DSP of A Series monitors, alongside four bands of backplate room adaptation equalization (Bass, Desk, Presence and Treble) and extended correction via A Control.
specs: |-
  - 2-way active nearfield studio monitor
  - 7" Multi-Layer Mineral (MLM) woofer, 1.3" (33 mm) voice coil
  - Handmade X-ART tweeter with rotatable HPS waveguide, 4 inch² (2420 mm²) diaphragm area
  - Waveguide dispersion: 120° horizontal, 70° vertical
  - Frequency response @ -3 dB: 44 Hz – 41 kHz
  - Frequency response @ -6 dB: 40 Hz – 45 kHz
  - Crossover frequency: 2.8 kHz
  - Max. peak SPL per speaker at 1 m (sine bursts): 105 dB SPL
  - Max. peak SPL per speaker at 1 m (IEC-weighted noise): 113 dB SPL
  - Woofer amplifier: PWM, 110 W peak / 90 W RMS
  - Tweeter amplifier: Class A/B, 20 W peak / 15 W RMS
  - AD converter: 24-bit, internal sample rate 96 kHz
  - Delay range and resolution: 0 – 10 ms, 0.1 ms
  - Input impedance: 9 kOhm (XLR) / 3.3 kOhm (RCA)
  - Max. input level: +19 dBu
  - Input sensitivity: 0 dBu = 100 dB SPL at 1 m @ 0 dB level setting
  - Backplate controls: Level (-12 dB to +12 dB), input selection (balanced/unbalanced), voicings (Pure, UNR)
  - Room adaptation EQ: Bass (+2/0/-2/-4 dB), Desk (0/-2/-4 dB), Presence (+1/0/-1 dB), Treble (+1.5/0/-1.5 dB)
  - Advanced room adaptation via A Control: 6 x PEQ, level, delay
  - Networked control over Ethernet using OCA with standard IP data
  - A Control software available for Windows and macOS
  - Sonarworks SoundID Reference calibration profiles run on the monitor's DSP
  - Dual front ported bass reflex cabinet
  - Cabinet material: vinyl wrapped MDF with painted MDF front panel
  - Front panel multi-colour status LED
  - Mounting: threaded inserts on the bottom of the cabinet (4 x M8)
  - Power consumption (max, idle, sleep): 220 W, 10 W, 3.5 W
  - AC input voltage: 100 – 240 V, 50/60 Hz; power rating 300 W max.
  - Dimensions (H x W x D): 337 mm x 200 mm x 280 mm (13 1/4" x 7 7/8" x 11")
  - Weight: 8.7 kg (19 lb 3 oz)
  - Warranty: 5 years (2 years plus 3 years optional with product registration)
  - Delivery contents: A7V loudspeaker, power cable, Quick Start Guide
