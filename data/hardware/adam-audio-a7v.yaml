description: A contemporary 2-way nearfield monitor featuring a 7" Multi-Layer
  Mineral woofer and rotatable X-ART tweeter handmade in Berlin, representing
  the evolution of ADAM Audio's award-winning A7X.
details: |-
  The ADAM Audio A7V is a contemporary 2-way nearfield studio monitor and the evolution of the award-winning A7X. It pairs a newly developed 7" Multi-Layer Mineral (MLM) woofer with the latest generation X-ART tweeter, handmade in Berlin, to deliver precise, fatigue-free monitoring across long sessions.

  A standout feature of the A7V is its rotatable HPS (High-frequency Propagation System) waveguide, allowing engineers to orient the tweeter for horizontal or vertical placement without compromising imaging. The waveguide produces a controlled 120-degree horizontal and 70-degree vertical dispersion pattern that defines a wide, stable sweet spot.

  Each monitor is bi-amplified with 130 W of total peak amplifier power: a 110 W peak PWM amplifier drives the woofer and a 20 W peak Class A/B amplifier drives the tweeter. The dual front-ported bass reflex cabinet extends low-frequency response down to 44 Hz (-3 dB) while remaining placement-friendly near walls or desks.

  Backplate controls cover input sensitivity, level trim, input selection, voicings (Pure/UNR), and four room adaptation bands (Bass, Desk, Presence, Treble). For deeper integration, the A7V joins ADAM's networked A Control ecosystem via Ethernet, exposing 6 bands of parametric EQ, level, delay, and Sonarworks SoundID Reference compatibility for automated room correction.

  Internally the A7V uses a 24-bit AD converter and a 96 kHz internal sample rate, with independent peak and thermal limiters per driver. The cabinet is vinyl-wrapped MDF with a painted MDF front panel and four M8 threaded inserts on the bottom for mounting hardware.
specs: |-
  - 2-way active nearfield studio monitor
  - 7" Multi-Layer Mineral (MLM) cone woofer
  - X-ART tweeter with rotatable HPS waveguide (handmade in Berlin)
  - Dispersion: 120 degrees horizontal, 70 degrees vertical
  - Frequency response: 44 Hz - 41 kHz (-3 dB), 40 Hz - 45 kHz (-6 dB)
  - Crossover frequency: 2.8 kHz
  - Total peak amplifier power: 130 W
  - Woofer amplifier: PWM, 110 W peak / 90 W RMS @ 1% THD
  - Tweeter amplifier: Class A/B, 20 W peak / 15 W RMS @ 1% THD
  - Max peak SPL @ 1 m: 105 dB (sine bursts), 113 dB (IEC-weighted noise)
  - Dual front-ported bass reflex cabinet
  - 24-bit AD converter, 96 kHz internal sample rate
  - Delay range: 0-10 ms (0.1 ms resolution)
  - Input impedance: 9 kOhm (XLR), 3.3 kOhm (RCA)
  - Max input level: +19 dBu
  - Power consumption: 220 W max, 10 W idle, 3.5 W sleep
  - AC input: 100-240 V, 50/60 Hz
  - Backplate controls: input sensitivity, level (-12 to +12 dB), input selection, voicings (Pure/UNR), room adaptation (Bass, Desk, Presence, Treble)
  - Network control via A Control software (6-band PEQ, level, delay, Sonarworks SoundID Reference integration)
  - Independent peak and thermal limiters per driver
  - Front panel multi-color LED display
  - Dimensions (H x W x D): 337 x 200 x 280 mm (13.25 x 7.875 x 11 in)
  - Weight: 8.7 kg (19 lb 3 oz)
  - Cabinet: vinyl-wrapped MDF with painted MDF front panel
  - Mounting: 4 x M8 threaded inserts on cabinet bottom
  - Operating conditions: -10 degC to +40 degC, <75% RH non-condensing
  - Warranty: 5 years (2 years standard + 3 years optional with registration)
