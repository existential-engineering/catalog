  compound radius amaranth fingerboard. Equipped with dual Jackson high-output
  humbucking pickups and active three-band EQ.
specs: |-
  - Body: Poplar, Concert Bass shape, gloss finish
  - Neck: Bolt-on maple with graphite reinforcement and scarf joint, satin finish
  - Scale Length: 35"
  - Fretboard: Amaranth, 12"-16" compound radius
  - Frets: 24 jumbo
  - Nut Width: 1.75"
  - Inlays: Pearloid sharkfin
  - Pickups: Jackson covered high-output humbucking (neck & bridge)
  - Controls: Two volume knobs, active three-band EQ
  - Bridge: Jackson HiMass
  - Tuning Machines: Jackson sealed die-cast
  - Hardware Finish: Black
  - Strings: Nickel-plated steel (.045-.130)
  - Color: Metallic Blue Burst
