description: Brauner's first phantom-powered large-diaphragm FET microphone,
  built on the VM1 circuit and capsule with selectable omnidirectional,
  cardioid, and figure-eight polar patterns.
details: |-
  The Phantom V is a phantom-powered large diaphragm FET microphone developed from the VM1
  circuit design and capsule. It is the first of Brauner's phantom powered microphones,
  designed to offer maximum application flexibility across a wide range of recording
  scenarios.

  The Phantom V features selectable directional characteristics, offering omnidirectional,
  cardioid, and figure-eight polar patterns. This versatility makes it suitable for a broad
  range of recording applications from solo vocals to ensemble capture.

  Built upon the same circuit design and capsule as the acclaimed VM1, the Phantom V delivers
  the Brauner house sound in a more accessible phantom-powered format. The microphone is
  described as being in the best Brauner tradition, with its own unique character that allows
  sound events to fully unfold.

  The microphone supports 10 dB dynamic range expansion and operates on standard 48V phantom
  power, requiring no external power supply.
specs: |-
  - Equivalent Noise: < 11 dB A (IEC651)
  - Signal to Noise Ratio: > 83 dB (1 Pa/1 kHz, Cardioid)
  - Sensitivity: 28 mV/Pa (Cardioid)
  - Frequency Range: 20 Hz - 22 kHz
  - Maximum SPL: 142 dB SPL @ 0.3% THD
  - Power Supply: 48V phantom power
  - Polar Patterns: Omnidirectional, Cardioid, Figure-Eight
  - 10 dB dynamic range expansion
  - Large diaphragm FET design based on VM1 circuit and capsule
