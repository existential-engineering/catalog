description: >-
  The ARP Odyssey is a compact, affordable analog synthesizer released in 1972 that became
  ARP's best-selling instrument and a legendary alternative to the Minimoog.
details: |-
  The Odyssey was ARP's answer to the Minimoog's commercial success, offering a simplified hard-wired ARP 2600 in a much smaller and affordable package. As a 2-oscillator analog synth with duo-phonic capability, it delivers rich analog sounds through a resonant low-pass filter, ADSR envelopes, and LFO modulation. The instrument can generate nice analog basses, interesting leads, great effects and sweeping sounds.

  Three major Mark versions were produced between 1972-1981, each with distinct characteristics. Early Mk I models (1972-75) featured a 2-pole filter with either white or black front panels. The Mk II series (1975-78) introduced significant improvements including better VCO tracking, enhanced sample-and-hold, and the PPC pitch controller, along with a more robust 4-pole filter. The final Mk III iteration (1978-81) adopted an orange-and-black color scheme with steel chassis and XLR outputs.

  Filter evolution significantly impacted the Odyssey's desirability. Early Mk II models with the model 4035 Moog-like ladder filter are particularly sought after, while later versions using the model 4075 filter developed a well known bandwidth limit error around 12 to 14 kHz. This technical distinction has made certain versions more valuable among collectors and musicians.

  The synthesizer gained iconic status through use by legendary artists including Tangerine Dream, Gary Numan, Vangelis, and Herbie Hancock. Its combination of professional sound quality, intuitive interface, and historical significance continues to make it highly desirable in today's vintage synth market.
specs: |-
  - Polyphony: Monophonic/Duo-phonic
  - Oscillators: 2 VCOs with sawtooth, square, pulse, and PWM waveforms
  - Filter: Model 4023 (early), 4035 or 4075 (later) - four-pole resonant low-pass
  - High-pass filter available
  - LFO: Sine/Square waveforms with sample-and-hold
  - Envelope generators: AR and ADSR
  - Keyboard: 37 keys
  - Control: CV/Gate
  - Pitch bend: Rotary knob (Mk I) or PPC buttons (Mk II/III)
  - Ring modulator included
  - No patch memory
