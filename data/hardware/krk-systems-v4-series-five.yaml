description: The V4 Series Five is an active two-way bass reflex studio monitor
  with a 4-inch woven Kevlar aramid fibre woofer and a 1-inch silk dome tweeter.
  It takes a switchable analog or AES3 digital input and can be controlled
  wirelessly through KRK Mesh and the KRK Control App.
details: |-
  For 30+ years, the KRK Systems V SERIES near-field monitors have been the cornerstone of countless music productions for mix engineers and producers around the globe. Now in the fifth iteration, the V SERIES monitors continue their legacy of accuracy, precision and mix translation while introducing new tools and technologies for the modern studio.

  Wireless control of individual monitors, groups of monitors or full studios is available through KRK Mesh and the KRK Control App, including 49 preset boundary EQ combinations, seven parametric Pro EQs with delay, and three user presets with an A/B compare mode.
specs: |-
  - Low-frequency transducer: woofer, 4-inch, woven Kevlar aramid fibre cone
  - High-frequency transducer: tweeter, 1-inch, silk dome
  - Frequency response (+/- 3 dB): 63 Hz to 35 kHz
  - Frequency range (+3/-10 dB): 48 Hz to 40 kHz
  - Crossover frequency: 1.9 kHz
  - Max SPL: 113 dB
  - Coverage angles: 150 degrees horizontal x 114 degrees vertical
  - Product dimensions (H x W x D): 10.15 in (258 mm) x 6.54 in (166 mm) x 8.86 in (225 mm)
  - Packaged dimensions (H x W x D): 15.875 in (400.5 mm) x 9.5 in (240 mm) x 12.25 in (310 mm)
  - Product weight: 12 lb (5.4 kg)
  - Packaged weight: 15 lb (6.8 kg)
  - Configuration: 2-way bass reflex
  - System type: active studio monitor
  - Amplifier configuration: bi-amplified, Class D
  - HF amp power output: 175 W
  - LF amp power output: 280 W
  - Total power: 455 W
  - Input connector (analog/AES-3): balanced XLR / 1/4-inch TRS combo, analog or digital switchable
  - Signal to noise ratio: >100 dB
  - AC input voltage: 100 to 240 VAC (+/- 10%), 50/60 Hz
  - Fuse type: 5x20 mm T2.5AL 250 V
  - Enclosure construction: PVC vinyl-wrapped MDF
  - Baffle construction: die-cast aluminium
  - Optional accessories: mounting bracket and 35 mm mounting adapter
