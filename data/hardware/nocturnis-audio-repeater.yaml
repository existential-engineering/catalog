description: REPEATER is a compact Eurorack utility module that functions as a
  basic buffered mult, duplicating input signals such as control voltages,
  audio, or clock pulses to multiple buffered outputs. It has three input
  channels feeding a total of thirteen buffered output jacks, with unconnected
  channels normalled to the previous channel's signal.
details: |-
  REPEATER by Nocturnis Audio is a compact Eurorack utility module that works as a basic buffered mult. It has three input jacks for three separate channels, and each channel has a number of outputs, five each for channel A and B, and three for channel C. Each channel also sends its output to the next channel as input, which will be used if that channel does not have an input plugged in.
