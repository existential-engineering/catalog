id: TN8A6fsoewDAzna-k5JU9
name: AAA Five 15 BBH
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/aaa-five-15-bbh
description: The Five 15 Head is a feature-packed, affordable 220-watt bass head
  in the AAA range for players who prefer a head-plus-cab rig. It has High and
  Low impedance inputs, a 5-band EQ, tube-emulated drive, a line input, a
  transparent effects loop, a headphone output with speaker mute, an XLR DI, and
  an AppTek socket for iOS amp-sim integration.
details: |-
  220-watt AAA bass head for a head-plus-cab rig, pairing with a 1x15", 2x10" or 4x10" cabinet. High and Low impedance inputs suit active or passive basses. Tube-emulated drive control from clean to distortion. Five-band EQ (Bass 100Hz, Lo Mid 340Hz, Middle 660Hz, Hi Mid 1.6kHz, Treble 7kHz). Line input for an mp3 player, headphone connection with speaker mute, a DI output for recording or a mixer, and a transparent effects loop. AppTek socket (4-pole mini jack) for iOS amp-sim and FX apps, including Ashdown's ABM Pre App via Agile Partners Amp Kit.
specs: |-
  - Power output: 220 watts
  - Frequency response: -3dB at 22Hz and 25kHz
  - High instrument input: 3.9M Ohms, input range 150mV - 20V p-p
  - Low instrument input: 10k Ohms, input range 300mV - 40V p-p
  - Line input: yes, with mix control
  - DI output: XLR
  - EQ: Bass 100Hz, Lo Mid 340Hz, Middle 660Hz, Hi Mid 1.6kHz, Treble 7kHz (all +/-15dB)
  - Effects send and return
  - Distortion: less than 0.5% THD
  - AppTek socket (iOS amp-sim integration)
  - H x W x D: 100 x 390 x 290 mm
  - Weight: 28 kg
