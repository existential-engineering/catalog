description: The ANT is Ashdown's pedalboard bass amp, packing 250 watts of
  signature bass power into a compact, ultra-portable aluminium chassis.
  Designed for bassists who rely on pedals, modelers, and effects processors, it
  offers versatile tone sculpting with a 3-band EQ and Shape preset, plus a
  transformer-balanced XLR DI out and a headphone out for silent practice.
details: |-
  The ANT is Ashdown's pedalboard bass amp, delivering 250 watts of signature bass power from a chassis weighing just 900 grams and built entirely from aluminium. It is aimed at bassists who run pedals, modelers and effects processors, using a 3-band EQ and the Ashdown Shape control for a warm, articulate, dynamic sound. It auto-adjusts its power requirements from 110V to 240V for worldwide use, provides a transformer-balanced XLR DI output to the sound desk, a -10dB passive/active pad for high-output basses or signal processors, and an onboard headphone preamp for silent practice.
specs: |-
  - Power output: 250 Watts (bass)
  - EQ: 3-band plus Shape preset
  - DI output: transformer-balanced XLR
  - Pad: -10dB passive/active
  - Headphone output: onboard headphone preamp
  - Mains: auto 110V to 240V
  - Weight: 900 g
  - Construction: aluminium
