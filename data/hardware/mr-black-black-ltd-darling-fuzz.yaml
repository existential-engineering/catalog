description: A warm, sustaining fuzz pedal, produced as a limited black-finish run.
details: |-
  The Black LTD. Darling Fuzz is a warm, sustaining fuzz. Mr. Black describes it
  as that warm, fuzzy feeling you get when you hear a special someone's voice,
  sustaining you throughout the day and making your ears explode with delight.

  It is a Jack Deville original design, produced as a limited run of 50 pieces.
