description: >-
  Roland's XV-5050 is a 64-voice synthesizer that packs the flagship XV-5080 synth engine
  into a compact 1U rack module. It features over 1,000 preset patches, three independent
  effects processors, and two SRX expansion slots for up to 192 MB of additional waveform
  data. Designed for computer and MIDI studio integration, it includes USB connectivity
  and 24-bit D/A conversion across four analog outputs.
details: |-
  The XV-5050 brings the power of Roland's flagship XV-5080 synthesizer engine into a space-efficient 1U rack format. Each patch consists of four stereo tones with expressive Matrix Control capabilities, giving users deep sound design potential from a compact module. The unit ships with over one thousand presets covering a wide range of musical styles, plus selections from the newer Fantom-X series.

    Expansion is handled through two SRX-Series Wave Expansion Board slots, allowing users to add up to 192 MB of additional sounds. Roland's extensive SRX library covers orchestral, vintage analog, acoustic instruments, and more. The three independent effects processors deliver 24-bit reverb and chorus, plus 90 multi-effects types including COSM Guitar Amp Modeling.

    Connectivity is well-suited for modern studio environments, with a front-panel USB port for simplified MIDI connections to Mac or PC computers. Audio output options include four analog outputs with 24-bit D/A converters and S/PDIF digital output. The module is 16-part multitimbral, making it a capable sound source for complex MIDI arrangements.
specs: |-
  - Polyphony: 64 voices
    - Multitimbral: 16 parts
    - Wave Memory: 64 MB
    - Waveforms: 1,083
    - Preset Patches: 1,024 (128 x 8 Banks) + 256 GM2
    - Preset Rhythm Sets: 16 (2 x 8 Banks) + 9 GM2
    - Preset Performances: 64 (32 x 2 Banks)
    - User Patches: 128
    - User Rhythm Sets: 4
    - User Performances: 64
    - Effects: 90 Multi-Effects types, 3 Chorus types, 5 Reverb types
    - EQ: 2-band System EQ per output
    - Outputs: 4 analog (24-bit D/A), S/PDIF digital
    - MIDI: In/Out/Thru, USB
    - Expansion: 2 SRX slots (up to 192 MB total)
    - Format: 1U Rack
releaseDate: "2001"
