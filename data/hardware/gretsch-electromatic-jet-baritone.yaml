details: |-
  The Electromatic Baritone Jet captures essential Gretsch power and fidelity at sub-sonic levels. A mahogany body with carved maple top and an elongated 29.75" scale-length bolt-on maple neck combine for excellent resonance and colossal impact.

  The chambered mahogany body delivers acoustic balance and comfort, while the bolt-on maple neck with Performance "C" profile provides stability and player-friendly feel. A bound rosewood fingerboard enhances tone and playability, and a GraphTech NuBone nut ensures reliable tuning stability.

  PureVolt Twin Six humbucking pickups at both positions provide a versatile palette, paired with advanced electronics including master volume with treble-bleed, individual tone controls, a 3-position toggle and push-pull coil splits for expanded tonal shaping.
