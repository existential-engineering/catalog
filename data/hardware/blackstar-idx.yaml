description: Affordable, compact and amazing sounding practice amps for the
  beginner. Next-gen DSP modelling combo amps (ID:X 50 and ID:X 100) built for
  stage, studio and everything in between, delivering powerful tone, hands-on
  control, and deep connectivity.
details: |-
  ID:X is Blackstar's next-generation DSP modelling combo amp series, available as the 50W ID:X 50 and the 100W ID:X 100. The range pairs classic amp tone with the flexibility modern players need, with hands-on control and deep connectivity for stage, studio and home use.

  Six amplifier voices (Clean Warm, Clean Bright, Crunch, Super Crunch, OD1, OD2) cover crystal cleans through Blackstar's signature high-gain. A three-band EQ plus the patented Infinite Shape Feature (ISF) lets players dial in tones from British crunch to American punch.

  EL84, EL34 and 6L6 power-stage response models deliver authentic valve feel, and over 35 onboard effects (overdrives, distortions, modulations, delays and reverbs) can be edited in real time on the bright OLED display with built-in tuner.

  Connectivity includes USB-C recording, headphone output with CabRig IR-based DSP speaker simulation, aux input, balanced XLR out and MIDI in/thru (ID:X 100 only). Power reduction switches between full power, 10W and 1W modes. Up to 12 patches can be stored on the amp, with up to 99 via Blackstar's Architect software or a footcontroller.
specs: |-
  - ID:X 50 — 50W power output
  - ID:X 100 — 100W power output
  - ID:X 50 speaker: 1 x 12" Anthem 50
  - ID:X 100 speaker: 1 x 12" Anthem 100
  - 6 amp voices: Clean Warm, Clean Bright, Crunch, Super Crunch, OD1, OD2
  - Patented ISF (Infinite Shape Feature) with 3-band EQ
  - EL84, EL34 and 6L6 power-stage response settings
  - Over 35 onboard effects (overdrive, distortion, modulation, delay, reverb)
  - CabRig IR-based DSP speaker simulator output (both models)
  - Power reduction: 50W/10W/1W (ID:X 50), 100W/10W/1W (ID:X 100)
  - Balanced XLR output (ID:X 100 only)
  - MIDI in/thru (ID:X 100 only)
  - USB-C for recording
  - OLED display with built-in tuner
  - Stores 12 patches on amp, up to 99 via Architect software / footcontroller
  - Architect software editor support
  - ID:X 50 weight: 9.6 kg
  - ID:X 100 weight: 14.3 kg
  - ID:X 50 dimensions: 470 x 409 x 221 mm
  - ID:X 100 dimensions: 570 x 469 x 252 mm
