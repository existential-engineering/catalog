description: The EVH 5150III Hypersonic 6L6 1x12 combo amp uses massive digital
  processing power to create a faithful model of the EVH 5150III 6L6 tube combo.
  A high-performance digital power amp achieves the headroom and dynamic range
  of a real tube amp, and when paired with a Celestion speaker and plywood
  closed-back cabinetry, the result is EVH tone, volume and dynamics virtually
  indistinguishable from the all-tube original. These changes make the 5150III
  Hypersonic combo weigh substantially less than the all-tube version. Added
  concentric EQ controls for channels one and two, and independent noise gate
  controls for each channel, enhance the user experience. The included
  footswitch has also been updated to allow both reverb and effects loop
  selection. Other features include a power selector for full power and five
  attenuated settings, balanced XLR line output with impulse response (IR)
  cabinet simulations, and a mute switch for silent stage or recording use. The
  EVH 5150III Hypersonic amps are available in black or ivory vinyl covering.
