description: Shape 40 is the ideal answer for close monitoring. Thanks to exclusive Focal innovations, this professional work tool offers a wide frequency range in the bass and precise control, right down to the extreme treble.
details: |-
  Shape 40 is the ideal answer for close monitoring. Thanks to exclusive Focal innovations, this professional work tool offers a wide frequency range in the bass and precise control, right down to the extreme treble. Whether it is a room smaller than 10 m², or an installation where compactness is paramount, Shape 40 is the solution.

  Compact solution: made in France in Focal's workshops, Shape 40 is designed to meet the needs of nearfield listening from a distance of 60 cm. The loudspeaker combines a clever design with settings (adjustable bass/treble level and 160 Hz crossover, disengageable high-pass crossover) to match the acoustic characteristics of even the smallest workspaces.

  Exclusive technologies: the Flax diaphragm of the 4" woofer ensures a natural, uncolored, detailed sound in the low to upper midrange registers. The "M" profile tweeter delivers precise, powerful treble. Its very low directionality allows flexibility of listening position.

  Refined design: the MDF cabinet is covered on top and front with through-dyed real walnut veneer. Its compact size makes this loudspeaker a professional tool that is as discreet as it is elegant. Designed without a vent, but with a 10 cm double passive radiator, Shape 40 can easily be positioned close to a wall.

  Accessories: mounting inserts are provided on the rear and bottom of Shape line monitors, enabling installation on table stands, microphone stands, ceilings or walls (mounting accessories not included).
specs: |-
  - Product type: 2-way monitor
  - Woofer: 4" Flax membrane
  - Tweeter: 1" aluminium-magnesium M-shaped dome
  - Frequency response (+/- 3dB): 60 Hz - 35 kHz
  - Maximum SPL (peak @ 1m): 102 dB
  - High frequency amplifier: 25 W, class AB
  - Mid-range and low frequency amplifier: 25 W, class AB
  - Inputs: XLR symmetrical 10 kOhms, RCA asymmetrical 10 kOhms with compensated sensitivity
  - High-pass filter: full range, 80 Hz
  - Bass/midrange level (160 Hz): adjustable +/-3 dB
  - Bass level (>250Hz): adjustable +/-6dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: HPF, LF Shelv, LMF EQ, HF Shelv
  - Power On LED
  - Local supply: 220-240V (T500mAL / 250V fuse) or 100-120V (T1.6AL / 250V fuse)
  - On/Off switch on the rear panel
  - Double 10 cm passive radiator, ventless cabinet
  - Height: 25.7 cm / 10.1 in
  - Width: 16.1 cm / 6.3 in
  - Depth: 20 cm / 7.9 in
  - Weight: 5 kg
