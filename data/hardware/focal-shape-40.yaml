  - 2-way active studio monitor
  - Woofer: 4" Flax
  - Tweeter: 1" Aluminium-Magnesium M-shaped
  - Frequency response (±3 dB): 60 Hz – 35 kHz
  - Maximum SPL (peak @ 1 m): 102 dB
  - Power: 25 W class AB per channel
  - Dimensions (H × W × D): 25.7 × 16.1 × 20 cm
  - Weight: 5 kg (11 lb)
