details: |-
  The M3FX centre is a high-power loudspeaker designed for large film and TV post-production studios where the console sits up to 8 metres from the screen. Combined with Dynaudio Acoustics subwoofers and surround speakers, it forms an immersive monitoring system suitable for Dolby Atmos HE 7.1.4, 9.1.4, and full theatrical Atmos multi-channel formats.

  The M3FX system is supplied in left/right and centre versions; the centre cabinet uses a horizontal driver layout sized for under-screen placement (1300 x 900 x 515mm) and weighs 110kg.

  The bass section comprises four 300mm MSP (Magnesium Silicate Polymer) low-distortion drivers with 100mm ferrofluid-cooled voice coils. The midrange consists of two 170mm MSP drive units with 75mm voice coils and neodymium magnets. The high-frequency unit is the D260H 28mm soft-dome in a short waveguide, linked to the mids by an internal high-power passive crossover.

  Speakers are supplied as two-way active: the four low-frequency drivers are driven separately from the passively-crossed mid/high section. Recommended amplification is the Dynaudio Acoustics DA40/80 DSP series with onboard DSP, or the DCA800/1400 with built-in filters. Three channels of 500-1000W per speaker are recommended.

  Cabinets are finished in black textured paint, with optional hardwood finishes (oak, cherry, walnut, maple) and custom sizes available on request. All systems are made to order; price and delivery on application.
specs: |-
  - Status: Current
  - Segment: Pro
  - Series: Dynaudio Acoustics
  - Application: Post-production and music
  - Type: 3-way hybrid
  - Frequency response: 35Hz - 20kHz
  - Maximum SPL at 2 metres: 125dB stereo
  - Crossover frequencies: 250Hz and 3000Hz
  - Total harmonic distortion: 1% at 90dB
  - Recommended amplifier power: Three channels: 500-1000W/channel per speaker
  - High frequency driver: 28mm soft-dome in short waveguide (D260H)
  - Mid frequency driver: 2x 17cm MSP with 75mm voice coils and neodymium magnets
  - Low frequency driver: 4x 30cm MSP with 100mm ferrofluid-cooled voice coils
  - Amplifier recommendation: Dynaudio Acoustics DA40/80 DSP, DCA800/1400 (with filters)
  - Cabinet dimensions (H x W x D): 1300 x 900 x 515mm
  - Weight: 110 kg
  - Finish: Black textured paint
  - Optional hardwood cabinets: Oak, cherry, walnut, maple
  - Custom cabinet sizes: On request
