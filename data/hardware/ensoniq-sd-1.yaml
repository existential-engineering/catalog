description: >-
  The Ensoniq SD-1 is a wavetable workstation synthesizer featuring Transwave
  synthesis, a 24-track sequencer, 24-bit multi-effects, and polyphonic
  aftertouch, representing the evolution of Ensoniq's acclaimed ESQ/VFX line.
details: |-
  Released in 1990, the SD-1 stands as the culmination of Ensoniq's Transwave wavetable synthesis
  lineage, building on the foundations laid by the ESQ-1, SQ-80, VFX, and VFX-SD. Its approach to
  sound generation through additive synthesis and waveform modulation places it in the same
  conceptual territory as the PPG Wave and Waldorf Microwave, offering complex harmonic textures
  that pure sample-based instruments of the era could not achieve.

  The sound engine provides up to six oscillators per voice drawing from 168 ROM waveforms across
  3.5MB of ROM, encompassing multi-sampled acoustic instruments and rich harmonic structures. Dual
  multi-mode digital filters and three 11-stage envelopes per voice enable intricate sound design,
  while 24-bit dual VLSI multi-effects processing with reverb, chorus, flanging, and delay adds
  studio-quality polish. The acoustic piano sounds, built from over 1MB of dedicated 16-bit
  waveforms, were particularly acclaimed and influenced the "Perfect Piano" found in later Ensoniq
  products.

  As a complete workstation, the SD-1 integrates a 24-track sequencer with 25,000-note capacity
  expandable to 75,000 via the SQX-70 Expander, supporting both real-time and step entry across 60
  patterns and 20 songs. The 61-key keyboard with polyphonic aftertouch provides expressive control,
  and a 3.5-inch disk drive handles storage of programs, sequences, and MIDI SysEx data. A 32-voice
  variant, the SD-1/32, was also available for users needing additional polyphony.
specs: |-
  - Polyphony: 21 voices (32-voice SD-1/32 variant available)
  - Oscillators: 1-6 per voice; 168 ROM waveforms; 3.5MB ROM
  - Filters: Dual multi-mode digital
  - Envelopes: 3 x 11-stage per voice
  - LFO: 1
  - Effects: 24-bit dual VLSI (reverb, chorus, flanging, delay)
  - Sequencer: 24-track, 25,000 notes (expandable to 75,000), 60 patterns, 20 songs, 96 ppqn
  - Keyboard: 61 keys, velocity sensitive, polyphonic aftertouch
  - Multitimbral: 12 parts
  - Memory: 180 patches, 60 performances
  - Outputs: 4 x 16-bit DAC
  - Storage: 3.5" floppy disk drive
