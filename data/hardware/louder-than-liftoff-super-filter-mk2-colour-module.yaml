description: "Super Filter mk2 combines the best features from the original SUPER FILTER and FET FILTER modules into one new super powered module. It features high and low pass filters, a console-style midrange EQ, and a multi-stage saturation circuit — addressing the four sonic elements that give tape its character: subsonic roll-off, tape head bump, soft transient clipping, and harmonic generation."
details: |-
  Super Filter mk2 merges filtering and saturation capabilities for recording engineers seeking analog-inspired tonal characteristics. The high-pass filter offers four musically tuned frequencies (23, 50, 80, 120 Hz) at 12 dB/oct. The 23 Hz setting includes a tape-like resonant bump at 45 Hz, drawing direct inspiration from the MCI JH-110A 8-track deck. A vintage low-pass filter (6 dB/oct) adds top-end softening. A new console-style midrange EQ provides ±12 dB boost/cut at selectable frequencies (330 Hz, 500 Hz, 800 Hz, 1.6 kHz). The multi-stage saturation circuit achieves a rich harmonic spectrum while simultaneously soft-clipping the audio, adding 2nd and 3rd order harmonics for presence and punch. Jumper-selectable configurations allow individual bypass of the HPF, LPF, midrange EQ, and saturation circuits. Nine recommended preset configurations are included, ranging from 'Very Analog' to specialized applications for vocals, drums, and guitars. Compatible with Silver Bullet mk2, Chroma 500 Series, Chroma+, Mister Focus, and DIYRE Colour Palette.
