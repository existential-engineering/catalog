description: "Super Filter mk2 combines the best features from the original SUPER FILTER and FET FILTER modules into one new super powered module. It features high and low pass filters, a console-style midrange EQ, and a multi-stage saturation circuit — addressing the four sonic elements that give tape its character: subsonic roll-off, tape head bump, soft transient clipping, and harmonic generation."
details: |-
  Super Filter mk2 merges filtering and saturation capabilities for recording engineers seeking analog-inspired tonal characteristics. The high-pass filter offers four musically tuned frequencies (23, 50, 80, 120 Hz) at 12 dB/oct. The 23 Hz setting includes a tape-like resonant bump at 45 Hz, drawing direct inspiration from the MCI JH-110A 8-track deck. A vintage low-pass filter (6 dB/oct) adds top-end softening. A new console-style midrange EQ provides ±12 dB boost/cut at selectable frequencies (330 Hz, 500 Hz, 800 Hz, 1.6 kHz). The multi-stage saturation circuit achieves a rich harmonic spectrum while simultaneously soft-clipping the audio, adding 2nd and 3rd order harmonics for presence and punch. Jumper-selectable configurations allow individual bypass of the HPF, LPF, midrange EQ, and saturation circuits. Nine recommended preset configurations are included, ranging from 'Very Analog' to specialized applications for vocals, drums, and guitars. Compatible with Silver Bullet mk2, Chroma 500 Series, Chroma+, Mister Focus, and DIYRE Colour Palette.

specs: |-
  - A natural subsonic roll-off that tightens up the bottom end
  - Tape head bump in the 30-70 Hz range that enhances the size of drums and bass
  - Transient clipping that adds density and volume
  - Even and odd order harmonics generated by the record and playback process that yields a euphonic richness
  - Very Analog: HPF = 23 Hz, LPF = BYP, SAT = IN
  - Fat Bass: HPF = 23 Hz, LPF = IN, SAT = IN
  - Tight and Clean: HPF = 23 Hz, LPF = BYP, SAT = BYP
  - Kick / Snare / Toms: HPF = 23 Hz, LPF = IN, SAT = IN
  - Drum Overheads: HPF = 50 Hz, LPF = BYP, SAT = IN
  - Electric Guitars: HPF = 80 Hz, LPF = IN, SAT = IN
  - Vocals / Acoustic Guitars: HPF = 120 Hz, LPF = BYP, SAT = BYP
  - General Purpose Lo-Cut: HPF = 50 Hz, LPF = BYP, SAT = BYP
  - 12 dB/oct high pass filter: 23 Hz, 50 Hz, 80 Hz, 120 Hz - 23 Hz setting has tape-like "head bump" at 45 Hz
  - Set frequency by moving two jumpers
  - +/-12 dB variable midrange boost/cut EQ: 330 Hz, 500 Hz, 800 Hz, 1.6 kHz
  - VINTAGE low pass filter to soften extreme high end - 6 dB/oct
  - Derived from Silver Bullet design
  - Multi-stage saturation circuit - Provides tape-like transient softening
  - Adds 2nd and 3rd order harmonics for increased presence and punch
  - Individual jumper bypass for HPF, VINTAGE, SAT
  - Class-A biased audiophile grade op amps
  - Can be configured as: - Saturator
  - High pass filter
  - Mid boost EQ for warmth or presence
  - Mid cut EQ for clarity or resonance removal
  - Filtered distortion device
  - Analog plugin compatible with Chroma - C-MIX knob on Chroma allows high pass filter to vary from low shelving cut to high pass
  - C-MIX knob blends dry signal with saturated, filtered signal
  - Compatible with DIYRE Colour
