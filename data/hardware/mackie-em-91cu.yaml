description: "Large Diaphragm USB Condenser Microphone delivering studio-quality
  performance for streaming, podcasting, webinars, and content creation."
details: |-
  From going for a flawless run on your latest stream on Twitch to leading an online webinar or starting a podcast, the EM-91CU USB condenser microphone delivers the no nonsense, studio-quality performance you need to sound your best.

  The EM Series EM-91CU USB Condenser Microphone delivers on our legacy of immaculate sound reproduction and worry-free reliability. Built with low-noise circuitry and studio-grade components in a Built-Like-a-Tank construction, it is engineered to handle the rigors of daily creative work.

  With an effortless plug-and-play setup over USB, the EM-91CU is ready to capture vocals, voiceover, and music with a cardioid polar pattern that focuses on the source and rejects off-axis noise.
specs: |-
  - Large diaphragm USB condenser microphone
  - Cardioid polar pattern
  - USB 2.0 Type B connection
  - 16-bit / 48 kHz sample rate
  - Low-noise circuitry
  - Studio-grade components
  - Built-Like-a-Tank construction
  - Plug-and-play setup
  - Includes shock mount
