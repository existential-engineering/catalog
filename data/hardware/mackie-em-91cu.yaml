url: https://mackie.com/en/products/microphones/em-series-usb-microphones/EM_91CU.html
description: The Mackie EM-91CU large diaphragm USB condenser microphone is
  perfect for streaming, online meetings, and more.
details: |-
  The EM-91CU USB Condenser Microphone delivers immaculate sound reproduction and worry-free reliability every time. Whether the job is a remote meeting, recording a video, or tracking dialogue, the EM-91CU delivers with easy plug and play setup.

  When it comes to capturing focused vocals while minimizing background noise, a cardioid polar pattern is the optimal way to do it. EM-91CU picks up sound primarily from the front of the mic for an exceptionally clear and tight sound.

  Low-noise circuitry and studio-grade components sit inside a Built-Like-a-Tank construction, and the standard USB connection is plug-and-play with no driver needed.

  Waveform OEM professional software and plugin package is included. The DAW Essentials Bundle for Waveform OEM includes 16 plugins such as Equaliser, Compressor, Reverber8 and Limiter.
specs: |-
  - Element: black electret condenser
  - Polar pattern: cardioid (uni-directional)
  - Frequency response: 20 Hz - 17 kHz
  - Sensitivity: -34 dB +/-2 dB (0 dB = 1 V/Pa @ 1 kHz)
  - Load impedance: >=1000 ohm
  - Output impedance: 100 ohm +/-30% (@ 1 kHz)
  - Max SPL: 132 dB (@ 1 kHz <=1% THD)
  - Equivalent noise level: 16 dB A
  - Signal-to-noise ratio: 78 dB
  - Sample rate: 16-bit / 48 kHz
  - Connection: USB 2.0 Type B, plug and play, no drivers required
  - Bus powered over USB, no external power supply
  - No headphone output and no onboard gain control
  - Boom or stand mounting via the included shock mount
  - Size (H x W): 6.3 in x 1.7 in / 160 x 44 mm
  - Weight: 0.46 lb / 0.21 kg
  - Included accessories: shock mount, USB type B cable
  - Waveform OEM software and DAW Essentials plugin bundle included
