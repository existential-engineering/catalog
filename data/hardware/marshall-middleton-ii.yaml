description: Portable Bluetooth speaker with 30+ hours of playtime, an IP67
  rating and 360 degree True Stereophonic sound.
details: |-
  Put your playlist through its paces. Featuring 30+ hours of portable playtime and a durable build that is dust and waterproof, Middleton II prefers life on the road. With 360 degree sound thanks to True Stereophonic, you will hear the music from anywhere you stand. Adjusting the bass and treble is also simple thanks to the tactile controls on the top panel of your speaker and the Marshall Bluetooth app.

  30+ hours of portable playtime: some playlists deserve to go on tour. Middleton II can give you and your music over a day's performance without needing to stop. And when it is finally time to charge, you will be up and running again in 20 minutes.

  True Stereophonic: 360 degree True Stereophonic sound is a form of multidirectional audio that makes your music hit from all angles, designed to sound strong from wherever you are standing.

  Durable, dust and waterproof (IP67): dust, sand, dirt in the park and poolside splashes, Middleton II can handle it all. It has even been tested under 1 m of water for 30 minutes. Effortlessly navigate your playlist with the multidirectional control knob to play, pause and skip tracks, answer calls and adjust the volume.

  Charging bank and built-in microphone: use Middleton II to charge your phone whenever it needs a boost, and take calls completely hands-free through the built-in microphone. Authorised repair services and spare parts are offered for Middleton II through the Marshall website. Designed and engineered in Sweden. Made in China.
specs: |-
  - Driver type: Neodymium
  - Frequency range: 50 Hz to 20 kHz
  - Drivers: two 3 inch woofers, two 0.6 inch tweeters, two passive radiators
  - Power amplifiers: two 30 watt Class D amplifiers for the woofers, two 10 watt Class D amplifiers for the tweeters
  - Stereo/mono: Stereo
  - Maximum sound pressure level: 87 dB SPL at 1 m
  - Cabinet principle: Sealed with passive radiators
  - Wireless connectivity: Bluetooth 5.3
  - Wired connectivity: AUX 3.5 mm
  - Bluetooth range: 60 m / 200 ft
  - Codecs: SBC, AAC-mpeg 2 and LC3
  - Bluetooth Multipoint connectivity: Yes
  - Top panel controls: on/off, bass, treble, Bluetooth pairing
  - Microphone system: Yes, built-in microphone for hands-free calls
  - Weight: 1.8 kg / 3.9 lbs
  - Width: 230 mm / 9.05"
  - Height: 110 mm / 4.33"
  - Depth: 98 mm / 3.86"
  - Water resistance: IP67
  - Battery type: rechargeable, replaceable Li-ion battery, no mains inlet
  - Battery preservation: Yes
  - Play time: 30+ hours
  - Quick charging: 20 minutes gives 5 hours of playtime
  - Charging time: 3 hours to full recharge
  - Power input: USB-C 5 V / 9 V / 12 V / 20 V - 3 A
  - Charging bank: charge a phone from the speaker
  - Box contents: speaker, strap, USB-C charging cable, quick start guide, legal and safety information
  - Compatible app: Marshall Bluetooth app
