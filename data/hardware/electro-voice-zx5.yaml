id: qF6Berxozke3cxBtV-7FS
name: ZX5
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/zx5/
description: 15-inch two-way passive loudspeaker delivering 132 dB max SPL with
  switchable bi-amp/passive operation and a choice of 90 x 50 or 60 x 60 degree
  rotatable horns; wedge-shaped enclosure works as a main, fill, or floor
  monitor and is also offered in PI weatherized variants.
details: >-
  The ZX5 is Electro-Voice's flagship ZX-series two-way passive loudspeaker,
  built around a 15-inch DVX3150A woofer with forced-air cooling and a 2-inch
  ND2 titanium/neodymium HF compression driver. Internal switching allows
  operation as a passive full-range cabinet or in bi-amp mode for systems that
  drive the LF and HF sections separately.


  The cabinet is a high-impact polystyrene composite wedge with a
  polyester-powder-coated 18-gauge galvanized steel grille, available in black
  or white and shaped to double as a 45 or 55 degree stage monitor. Two horn
  options ship as separate SKUs - ZX5-90 with a 90 x 50 degree pattern and
  ZX5-60 with a 60 x 60 degree pattern - and PI versions of each (ZX5-90PI,
  ZX5-60PI) are weatherized for fixed outdoor installation.


  For rigging, the enclosure carries ten M8 inserts, supports up to five
  anchor-plate attachments, and is flying-capable; an integrated handle eases
  portable use. Connectivity is via two parallel-wired Neutrik NL4 Speakon jacks
  for input and loop-through, and the rated continuous program power is 600 W
  (2400 W peak) into 8 ohms.
specs: >-
  - Configuration: 2-way passive loudspeaker (switchable bi-amp / passive)

  - LF transducer: 15-inch DVX3150A woofer with forced-air cooling

  - HF transducer: 2-inch ND2 titanium/neodymium compression driver

  - Horn coverage (H x V, -6 dB): 90 x 50 degrees (ZX5-90) or 60 x 60 degrees
  (ZX5-60)

  - Crossover frequency: 1500 Hz

  - Frequency range (-10 dB): 39 Hz - 20 kHz

  - Frequency response (-3 dB): 58 Hz - 18 kHz

  - Recommended high-pass frequency: 36 Hz

  - Axial sensitivity (1 W / 1 m): 98 dB SPL

  - Maximum SPL @ 1 m: 132 dB

  - Power handling (passive): 600 W continuous / 2400 W peak

  - LF power handling: 500 W

  - HF power handling: 40 W

  - Nominal impedance (passive): 8 ohms

  - Minimum impedance: 6.5 ohms

  - LF nominal impedance (bi-amp): 8 ohms

  - HF nominal impedance (bi-amp): 8 ohms

  - Connectors: 2 x parallel Neutrik NL4 Speakon

  - Enclosure: High-impact polystyrene composite, wedge shape (45 / 55 degree
  monitor angles)

  - Grille: Polyester powder coated, 18-gauge galvanized steel

  - Rigging: 10 x M8 mounting inserts, up to 5 anchor-plate attachments, flying
  capable, integrated handle

  - Color: Black or white

  - Weatherized: Yes (PI variants)

  - Dimensions (H x W x D): 692 x 446 x 411 mm

  - Chassis size: 381 mm

  - Net weight: 22.2 kg
