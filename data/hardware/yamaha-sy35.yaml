description: >-
  The Yamaha SY35 is a vector synthesis keyboard combining FM and AWM sample
  playback voices to create sounds for virtually all musical genres. It
  represents a transitional instrument between Yamaha's FM synthesis era of the
  1980s and their AWM2 synthesis of the 1990s, featuring significantly expanded
  memory over its predecessor, the SY22.
details: |-
  The SY35 combines two distinct sound-generation approaches in a single instrument. It features FM operators and AWM digital acoustic sample playback oscillators that work together via a vector wheel to blend and morph between synthesis methods. This hybrid approach allows access to both the characteristic tones of FM synthesis and the realism of sampled acoustic instruments.

  Programming the SY35 requires patience, as all parameter adjustments are made through increment and decrement buttons rather than direct knob controls. Despite this limitation, the instrument produces high-quality sounds comparable to professional synthesizers of the era. The 8-part multitimbral mode facilitates complex, layered arrangements.

  The SY35 offers substantial sonic potential relative to its price point. Musicians can create atmospheric pads, deep bass sounds, screaming leads, and distinctive effects. It contains over 128 pre-loaded AWM sampled sounds and approximately 256 FM waves, though additional samples cannot be added to the fixed memory.
specs: |-
  - 16-voice polyphony with 8-part multitimbrality
  - 2 FM operators and 2 AWM digital acoustic sample playback oscillators
  - 4 LFOs
  - 4 volume-only envelopes (VCA)
  - 16 digital effects (delay, reverb, reverb/distortion combo, etc.)
  - 61 keys with velocity and aftertouch
  - 64 preset patches and 68 user patches, 16 performances
  - MIDI in/out/through
  - No onboard filter or sequencer
