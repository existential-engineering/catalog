description: >
  MiniFreak Vocoder is a special edition of the fearless polyphonic hybrid synth. The same dual digital engines, analog filters, modulation and sequencing power, now with a vocoder and gooseneck mic. Get creative with vocal or external input - from talkbox growls to spectral drones.
details: |-
  Minifreak vocoder edition is a special edition polyphonic hybrid synthesizer featuring dual digital engines with 31 oscillator modes, genuine analog filters, and comprehensive modulation architecture. This fearless white-orange synthesizer combines two independent sound engines that can be stacked, fm-linked, or routed through each other, all processed through polyphonic state-variable resonant filters for punch and warmth. The addition of a 16-band vocoder and included gooseneck microphone enables creative vocal processing and external audio manipulation, from talkbox growls to spectral drones.

  Engine 1 offers a diverse array of classic and cutting-edge oscillator modes including arturia's granular, sample, superwaves, karplus strong, wavetable, and audio in modes, alongside mutable instruments' open-source plaits modes like speech and modal, plus three modes designed with noise engineering. Engine 2 expands on this selection and can process engine 1's output with modes like comb filter, destroy, and ring mod. The vocoder fx provides four dedicated modes—clean, vintage, narrow, and gated—allowing transformation of vocal or external audio into robotic choirs, shimmering pads, and spectral textures, with three dedicated fx controls for sonic character adjustment.

  The synthesizer features a comprehensive modulation system with an adsr envelope offering four operational modes, a shape-adjustable cycling envelope capable of audio-rate modulation, and two lfos with custom shaping capabilities. A powerful modulation matrix with 7 sources and 13 potential destinations enables creation of complex modulation tapestries. Three digital fx engines provide 13 effects total, available in insert or send mode for beautiful or explosive stereo sound design.

  Control and performance features include a 37-note velocity-sensitive slim-key keybed with aftertouch, multi-functional touch strips for real-time parameter tweaking and sequence mutation via spice & dice, and a shift button providing access to secondary settings. The 64-step sequencer spans 4 pages of 16 steps with 4 lanes of automated modulation, while the performance arpeggiator offers ratchet, octave randomize, and mutation capabilities. An OLED display provides real-time visual feedback, and single-knob operation enables intuitive navigation of core settings and detailed customizations.

  Connectivity options include USB for computer integration, updates, and preset management, MIDI in/out/thru for hardware synchronization, analog clock in/out for gear sync, and audio in mode for processing external signals through the dual oscillators and 3 fx engines. The included minifreak v VST software mirrors the hardware's sound and architecture, enabling seamless workflow between physical and virtual instruments with preset compatibility. The package includes a 30 cm gooseneck microphone with stand and universal 12v 1a power supply.
specs: |-
  - 6-voice polyphonic hybrid synthesizer
  - 37-note velocity-sensitive slim-key keybed with aftertouch
  - 2 sound engines with 31 oscillator modes total
  - Engine 1 oscillator modes: granular, sample, superwaves, karplus strong, wavetable, audio in, speech, modal, and noise engineering modes
  - Engine 2 modes: comb filter, destroy, ring mod
  - 16-band vocoder
  - Polyphonic state-variable resonant filters with low-pass, band-pass, and high-pass modes
  - Self-oscillating filters
  - Adsr envelope with 4 modes: polyphonic, monophonic, paraphonic, unison
  - Shape-adjustable cycling envelope with run and loop modes
  - 2 lfos with custom shaper
  - Modulation matrix with 7 sources and 13 potential destinations
  - 3 digital fx slots in insert or send mode
  - 13 fx including ext vocoder and self vocoder fx
  - 64-step sequencer with 4 pages of 16 steps
  - 4 lanes of automated modulation
  - Performance arpeggiator with ratchet, octave randomize controls
  - Spice & dice randomization and mutation system
  - OLED display for real-time visual feedback
  - Single-knob operation for core settings and presets
  - Shift button for secondary settings
  - Touch strips for pitch bend, mod, and macro control tweaking
  - Sequencer and arpeggiator controls
  - Custom lfo curve editing pads
  - 30 cm gooseneck microphone included
  - USB connectivity for updates and preset management
  - Audio in mode for processing external signals
  - MIDI in/out/thru connectivity
  - Analog clock in/out for sync
  - Sustain input
  - Balanced stereo outputs
  - 244 user preset slots
  - Minifreak v VST software included with hardware/software sync capability
