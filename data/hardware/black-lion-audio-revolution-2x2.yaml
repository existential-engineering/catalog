description: USB 2-Channel Portable Recording Interface
details: |-
  Black Lion Audio have been revered as the "king of audio mods" for years, having modded countless recording interfaces. The Revolution 2x2 is their first proprietary interface, engineered after years of studying what makes professional equipment truly great. It delivers studio-grade sound quality in a portable, bus-powered format at an accessible price point.

  Revolution 2x2 uses Black Lion's new Macro-MMC clocking technology, derived from their acclaimed clocking products and modifications. This circuit implementation brings converters to new heights well beyond what has been seen in other recording interfaces, enabling the sound of large high-end converters that cost thousands of dollars in a hand-sized device.

  The interface also employs PG-i technology internally, based on Black Lion Audio's experience engineering their best-of-class power conditioners. All power rails are highly filtered in every active stage, and power is decoupled across the entire circuit — including the preamplifiers, converters, internal power, and even the clock — reducing noise contamination from connected equipment.

  Revolution 2x2 is built with high-end ICs and premium Vishay, Nichicon, and Wima capacitors throughout the entire circuit. All internal gain-staging has been optimized for the lowest signal-to-noise ratio, and all analog I/O is fully decoupled and balanced, right to the very core of the converter.

  Included with the Revolution 2x2 is the Revolution Software Suite: six months of Fender Studio Pro DAW, plus select plugins from iZotope (Nectar, Neutron, Ozone, and RX Elements), Brainworx, and Lindell.
