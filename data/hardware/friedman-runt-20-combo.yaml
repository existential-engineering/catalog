description: The Runt-20 Combo is a 20-watt, two-channel all-tube 1x12 inch
  combo driven by two EL84s. An internal load and a cabinet-simulated XLR output
  let it be played and recorded with no speaker cabinet connected.
details: |-
  The Runt delivers the tight bottom end and midrange typically found only in much higher-wattage amps, by using custom transformers and the cleanest signal path possible. The Runt-20 suits many styles of music, from blues and classic rock to heavy metal, by adjusting the gain and master controls.

  Plugging in reveals harmonically rich detailed chords and resonating single note lines, and the amp cleans up exceptionally well with the guitar's volume knob even on higher gain settings. A clean channel with volume and a bright switch sits alongside the overdrive channel, which carries volume, gain, a three-band EQ and a boost switch and takes the amp from classic rock to all-out assault.

  This is the first amp Dave Friedman has made with an internal load and a cab-simulated XLR output. Compared with intricate computer-based impulse responses, this analog circuit gives a direct output that can be sent to front of house or used in the studio, and the Runt can be played silently with no speaker cabinet connected. The XLR output includes ground lift, level, and center or edge of speaker cone simulation switches.

  At the heart of the Runt combo is a 16 ohm, 12 inch Celestion G12M-65 Creamback speaker that delivers the bass and mid response expected from a Friedman amp.

  The Runt was specifically designed to take pedals well, and works with boosts, overdrives, phasers, flangers, tremolos and wahs. The ultra-transparent, no tone loss, buffered series effects loop takes time-based effects pedals and rack units equally well, and it is the same FX loop Friedman uses on all its amplifiers including the BE-100. The cabinet features black Tolex over Baltic Birch construction and is built to withstand the rigors of the road.
specs: |-
  - 20-watt all-tube 1x12 inch combo
  - Two channels
  - 2 x EL84 power tubes
  - 3 x 12AX7 preamp tubes
  - Clean channel with volume and bright switch
  - Lead channel with volume, gain, three-band EQ and a boost switch
  - XLR cabinet simulated output with ground lift, axis and level switches
  - Internal load allows playing and recording with no speaker cabinet connected
  - Ultra transparent series FX loop
  - 8 and 16 ohm impedance selector
  - Single button footswitch
  - Celestion G12M Creamback 65w speaker
  - Black Tolex over Baltic Birch cabinet
  - Dimensions: 16.75 inches (H) x 18.75 inches (W) x 11.5 inches (D)
  - Weight: 41.5 lbs
