description: Immerse yourself in cinematic audio, then switch to your own
  playlist with Marshall's signature sound when the screen goes dark.
details: |-
  Feel every plot twist with Dolby Atmos three-dimensional sound that puts the action directly into your home. Experience perfectly tuned audio for movies, then keep your own soundtrack playing with electrifying Marshall signature sound when the screen is off. It also features a woven salt and pepper coloured fret with PU leather finish, inspired by the legendary amp design.

  Immersive sound for movies and music: Heston 120 delivers depth and clarity using object-based audio to place every sound with three-dimensional accuracy above and around you. Midwoofers optimised for lateral sound performance and up-firing tweeters enhance depth perception by projecting sound overhead, while precision-engineered side-firing drivers reflect sound off the walls for wider, multi-directional audio.

  Powerful bass: dual rear-facing subwoofers and four passive radiators deliver bass across the full low-frequency spectrum. Matching front drivers and real-time audio processing keep speech sharp and natural.

  Multi wireless connectivity and integrated services: connect over Wi-Fi with Google Cast, AirPlay, Spotify Connect or TIDAL Connect, or over Bluetooth including Auracast. Spotify, TIDAL and airable internet radio are integrated directly.

  Sound modes and tactile controls: choose Movie, Music, Night or Voice mode, and adjust bass, treble, source and presets with heritage amp-inspired knobs. The Marshall app adjusts EQ settings and runs room calibration. Compatible with the Heston 120 Wall Mount, sold separately. Designed and engineered in Sweden. Made in China.
specs: |-
  - Frequency range: 40 Hz to 20 kHz
  - Maximum sound pressure level: 95 dB
  - Power amplifiers: 11 Class D amplifiers, 2 x 50 W and 9 x 30 W
  - Total audio power output: 150 W (peak)
  - Configuration: 5.1.2
  - Subwoofers: 2 x 2" x 5"
  - Mid-woofers: 2 x 3"
  - Tweeters: 2 x 0.8"
  - Full range: 5 x 2"
  - Immersive audio formats supported: Dolby Atmos, DTS-X
  - Wireless connectivity: Bluetooth 5.3, Wi-Fi 6
  - Wired connectivity: HDMI eARC, HDMI IN (pass through), RCA Stereo, RCA Mono (Sub Out), USB-C, Ethernet
  - Top panel controls: 3 preset buttons, volume knob, bass/treble knob, source selection knob, sound mode toggle button
  - Codecs: SBC, LC3, AAC, Mpeg4, ALAC, FLAC, LPCM, Ogg, Vorbis, WMA, WMA9
  - Wi-Fi service integrations: AirPlay 2, Google Cast, Spotify Connect, TIDAL Connect
  - HDMI spec: HDMI 2.1 eARC, 4K 120 Hz, supports Dolby Vision, HDCP 1.4
  - USB spec: Type C, charge out 5 V, 0.5 A
  - Ethernet spec: 10/100 Mbit
  - Microphones: 2 used for room calibration
  - Weight: 7.04 kg / 15.52 lb
  - Width: 1100 mm / 43.31"
  - Height: 76 mm / 2.99"
  - Depth: 145 mm / 5.71"
  - Materials: PU leather, paper fret, metal, plastic
  - Repairability: fret, end-caps, drivers, PCBAs
  - Wall mount: yes, sold separately
  - Box contents: Heston 120 TV soundbar, quick start guide and legal and safety information, mains lead, HDMI cable
  - Compatible app: Marshall app
