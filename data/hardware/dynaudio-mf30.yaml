details: |-
  The MF30 is the dual LF version of the MF15, offering a higher SPL surround speaker designed for immersive audio applications. It's an ideal surround speaker for music and post-production – including larger Dolby Atmos configurations.

  As a passive speaker, the MF30 is incredibly easy to install and manage in larger rooms.

  It can be used in conjunction with all M-series enclosures according to the room requirements, as well as MS subs for bass management. The drivers complement our screen speakers to give seamless movement of sound around the theatre in Atmos applications.

  Custom configurations are available to suit varied installation needs.
specs: |-
  - Type: 2-way passive surround
  - Application: Music and post-production
  - Frequency response: 60Hz – 20kHz
  - Maximum SPL at 1 metre: 122dB
  - Crossover frequency: 2000Hz
  - Total harmonic distortion: 1% at 90dB
  - Sensitivity: 95dB/2.83v/1m
  - Impedance: 4 Ohms
  - Recommended amplifier power: 100-500 watts
  - High frequency driver: 28mm soft-dome
  - Low frequency drivers: 2x 24cm MSP
  - Amplifier recommendation: Dynaudio Acoustics Class D four channel DA20/40
  - Cabinet dimensions (H x W x D): 440 x 515 x 255mm
  - Weight: 15 kg
  - Fixing: 4x M8 threaded inserts in the back allow fixing to a range of brackets
  - Finish: Black textured paint
  - Optional: Hardwood cabinet (oak, cherry, walnut, maple)
  - Custom cabinet sizes: On request
