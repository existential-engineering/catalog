description: LOCi is a professional phonographic preamplifier and corrective
  equalizer for playing back and transferring legacy records, built on a true
  differentially balanced, transformerless phono path. It applies RIAA and
  archival compensation curves plus corrective filters so discs cut to pre-RIAA
  equalization can be replayed with the right playback curve.
details: |-
  LOCi is a phonograph playback and transfer system that combines a differentially balanced phono preamplifier with RIAA and archival compensation and a set of corrective filters. User definable compensation and cartridge loading parameters let it match the equalization a disc was cut with, and the factory stock phono input presents 47.5k ohms and 270 pF.

  The signal path is transformerless throughout. A pure Class A, all discrete J-FET true differential gain amplifier (IMA-01) handles the input stage and an all discrete 50V J-FET servo module (FSA-03) handles the equalizer stage. A Lundahl moving coil transformer option is included at no additional charge.

  Playback compensation offers six low frequency turnover points and six high frequency rolloff settings, each including an RIAA position and a user position. Six fixed low filter and six fixed high filter frequencies sit alongside them with plus or minus 10 dB of 21 step detented boost and cut, peak or shelf selection on four of the filters and bypass on all eight bands. Broadband noise measures better than -125 dBu EIN flat.

  The unit occupies 2U of rack space and uses gold relays, connectors and switches with hand machined aluminum cosmetics. It was developed under contract for the U.S. Library of Congress, which uses multiple units for national archiving, and its filter circuits are derived from the maker's NSEQ-2 mastering equalizer.
specs: |-
  - Input Amplifier Signal Path: All discrete J-FET true differential gain amplifier (IMA-01)
  - EQ Amplifier Signal Path: All discrete 50V J-FET servo (FSA-03)
  - Frequency Response (+/- 0.5 dB): 10 Hz to 100 kHz, comps and filters out, +45 dB gain
  - Common Mode Rejection Ratio: -75 dBu typical, 10 Hz to 50 kHz, 1.0V P/P CM
  - Maximum Input / Maximum Output: +23 dBu flat / +26 dBu RIAA in
  - Maximum System Gain: 60 dB nominal, higher upon request
  - Phono Input Impedance: User selectable, factory stock 47.5k ohms and 270 pF
  - Output Impedance: 49.9 ohms
  - Broadband Noise (no weighting filters): Better than -125 dBu EIN flat, -98 dBu EIN RIAA in
  - Three-pin XLR Polarity: Pin 2 positive polarity, Pin 1 ground
  - Maximum Filter Boost and Cut: +/- 10 dB, 21 step detented
  - Notch Filter Q: 1.0
  - Low Frequency Compensation: 200, 250, 300, 400, 500/RIAA, 700/USER Hz
  - High Frequency Compensation at 10 kHz: -5.0, -7.0, -9.5, -11.5, -13.7/RIAA, -16.0/USER dB
  - Low Filter Fixed Frequencies: 20, 35, 60, 100, 180, 260 Hz
  - High Filter Fixed Frequencies: 1.0, 2.0, 3.0, 5.0, 8.0, 12.0 kHz
  - Peak or Shelf Selection on All Filters: Yes (4)
  - Bypass Selection on All Bands: Yes (8)
  - Power Consumption: 60 watts nominal
  - Power Requirements: 100VAC to 240VAC, 50/60 Hz, user selectable
  - Fuses (external, 2 required): 2 x 1.0A with 100-120VAC mains (5x20mm), 2 x 500 mA with 200-240VAC mains (5x20mm)
  - Internal Power: +/-50VDC, +/-25VDC, +5VDC
  - Dimensions: 19.0 in W x 15.0 in D x 3.5 in H (2U rack mount)
  - Net Weight: approximately 26 pounds
