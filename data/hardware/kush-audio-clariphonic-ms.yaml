details: |-
  Everyone's favorite mix EQ now offers state-of-the-art Mid-Side processing, 41-step detented pots, and a Master Bypass switch. The new Cut mode on the Focus band softens overly aggressive midrange, while rear-panel mid-side inserts allow you to use any processor in your rack in Mid-Side mode before dusting the result with the Clariphonic's unique magic. Clariphonic MS is not only more flexible than the original, it also extends the functionality of every piece of gear in your rack.

  The original Clariphonic was the world's first two channel, fully parallel dual high-shelving equalizer. The Clariphonic gets its mojo from a series of routing tricks applied to equalization rather than compression, with all of the bussing and blending happening internally, so there are no multiple signal paths or latency issues to manage. It can subtly enhance or powerfully reshape the presence, sparkle and air frequencies from 800Hz to 38k.

  The Focus Engine packs two wide bells into two switches and a knob: Lift covers the mids (~800Hz) and up, Open covers the upper mids (~3kHz) and up, and a three-position switch selects Boost, Cut or bypass. In Cut mode the unit produces an effect not unlike analog tape, softening the most aggressive frequencies in the audible band and setting up more aggressive boosts from the Clarity band, much like the classic push-pull technique on vintage Pultec EQs.

  The Clarity Engine offers four upper bands: Presence (~4kHz and up), Sheen (~8kHz and up), Shimmer (~18kHz and up) and Silk (rising to ~34kHz and beyond), with a three-position select switch that routes to the lower or upper pair or bypasses the engine altogether.

  Mid-Side mode engages a built-in M/S encoder and decoder. The incoming stereo signal is converted to M/S, sent to the EQ, then converted back to stereo at the outputs, with the left Focus/Clarity pair handling the Mid signal and the right pair handling the Side signal. The rear-panel Mid and Side inserts take TRS insert cables and place any external processor in the rack into the pre-EQ Mid or Side path.
specs: |-
  - Mains powered, AC inlet type not documented by the maker
  - Two-channel fully parallel dual high-shelving equalizer
  - Focus Engine: Lift (mids ~800Hz and up) and Open (upper mids ~3kHz and up), with Boost, Cut and bypass
  - Focus maximum boost/cut: 16dB
  - Clarity Engine: Presence (~4kHz and up), Sheen (~8kHz and up), Shimmer (~18kHz and up), Silk (rising to ~34kHz and beyond)
  - Clarity maximum boost: 14-16dB depending on filter
  - Frequency range of enhancement: 800Hz to 38kHz
  - 41-step detented potentiometers
  - Master Bypass switch
  - Switchable Mid-Side mode with built-in M/S encoder and decoder
  - Rear-panel Mid and Side inserts on 1/4-inch TRS insert jacks for pre-EQ external processing
  - Balanced XLR/TRS combo inputs on channels 1 and 2
  - Balanced XLR outputs on channels 1 and 2
  - One year warranty, parts guaranteed for the life of the unit
