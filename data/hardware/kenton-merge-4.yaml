description: MIDI Merge boxes combine the data from a number of MIDI sources
  into a single output. See also Merge-8.
details: |-
  Merge-4 merges the data from up to four separate MIDI sources, such as master keyboards or controllers, into a single MIDI data stream that appears at both of its MIDI out sockets. All MIDI data is merged, including MIDI Clock, MIDI time code and SysEx.

  The four MIDI inputs are opto-isolated to eliminate ground loops and hum and to prevent electrical damage. Each of the two MIDI outputs carries the same merged data from all of the inputs.

  Certain message types are handled intelligently rather than simply passed along. For MIDI Clock, all clock messages are passed to the MIDI outs at power on, and the most recent input to receive a START command, or a Song Position Pointer of 0 followed by CONTINUE, becomes the clock master until another input satisfies the same condition.

  For Active Sensing, the first input to receive an Active Sensing message becomes the Active Sensing master and messages from other inputs are ignored. That input remains master until no further Active Sensing messages arrive at it for around five seconds, after which another input can take over. For SysEx, an input handling a SysEx message becomes the SysEx master and messages from all other inputs are locked out until the master's message finishes, terminated either by an End Of SysEx command (F7) or by any other status command.

  Latency is 0.4 ms to 1 ms depending on message type. A power and data indicator LED is fitted, and the unit is housed in an aluminium case finished in brushed aluminium with black screen print so it can withstand knocks.
specs: |-
  - 4 x opto-isolated 5 pin DIN MIDI In
  - 2 x 5 pin DIN MIDI Out, both delivering the same merged data
  - Merges all MIDI messages including Clock, SysEx and MTC
  - Intelligent handling of Clock, SysEx and Active Sensing
  - Latency 0.4 ms to 1 ms depending on message type
  - Power: 9 V DC regulated or unregulated, 2.1 mm centre-positive
  - Current draw: 60 mA
  - Dimensions: 110 mm x 80 mm x 35 mm
  - Weight: 150 g excluding power supply, 220 g including power supply
  - Power and data indicator LED
  - Aluminium case
  - Supplied with user manual and a 9 V multi-region switch mode power supply with four interchangeable heads
