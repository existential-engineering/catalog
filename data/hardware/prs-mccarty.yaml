details: |-
  Named after Ted McCarty, a pioneer of the electric guitar and musical instrument industry, the McCarty model embodies the most up-to-date findings from PRS and looks back to the golden age of the guitar. This vintage-appointed guitar features a bound, 22-fret Pattern neck and a slightly thicker back for enhanced tone and sustain. The PRS McCarty model is anchored by a stoptail bridge with brass inserts and non-locking PRS Phase III tuners with brass shafts for added resonance and sustain.

  The PRS McCarty is outfitted with McCarty III treble and bass pickups. McCarty III pickups were spec’d by Paul Reed Smith and the PRS New Products Engineering team. From our own hands-on research into coveted vintage pickup models to advancements in signal analyzation and “tuning” technology, these pickups incorporate every detail of pickup knowledge PRS has gained in recent years of R&D. PRS McCarty III pickups are vintage-inspired humbuckers that bring a vocal clarity to their full, warm tone. Paired with a push/pull tone control and a 3-way toggle pickup switch, these pickups provide a complete palette of tones.

  In the late 1980’s, Paul Reed Smith called on Ted McCarty to consult with him on guitar design and production techniques. He not only served as a mentor but became a great friend of Paul and everyone he met at PRS. In 1994, PRS released the first McCarty, an instrument that incorporated the full spectrum of techniques and knowledge Paul had gained from Ted as well as Paul’s own experiences as a guitar builder.
