details: |-
  40 Source Personal Mixer. ME-1 is probably the most sophisticated personal monitor mixer on the market, giving precision control over up to 40 channels to satisfy the most demanding ears.

  40 Sources — control up to 16 stereo/mono inputs or groups with level and pan controls for each input.

  OLED Screen — dimmable high-quality screen shows names, levels, pan, meters and more.

  16 User Presets — levels, pan and mutes can all be stored and recalled at the touch of a button; presets can be saved to USB and easily transferred to different ME-1s.

  Groups — sources can be grouped within the ME-1, so each performer can use different groups without consuming buses on the main console.

  Musician Friendly — the uncluttered top panel makes control quick, easy and intuitive; each key is assignable to a single mono or stereo source or to a group of channels (e.g. an entire drumkit). ME-1s connected to a dLive, Avantis or SQ mixer automatically pick up names from the console, and custom names can also be displayed.

  Powerful, Clear Sound — features 1/4" and 3.5mm mini-jack headphone outputs and will drive all popular headphone types and impedances, delivering enough power to hear the mix loud and clear through headphones or in-ears.

  Protect Your Ears — integrated limiter, adjustable from -24dB to 0dB, prevents unexpected loud signals from reaching headphones.

  Stage Ready — included headphone hanger and mic stand bracket keep everything within arm's reach; can be powered via PoE to reduce onstage cabling.

  Audio First — top-panel ambient mic keeps performers in touch with stage sound and lets them hear the audience and communicate without removing earpieces. Easy to use Master 3-band EQ and Limiter protects ears and fine-tunes overall tone to compensate for differences in headphones.

  3rd Party Compatibility — non Allen & Heath users can benefit from the ME Personal Mixing System via the ME-U hub, with MADI and Dante option cards allowing a digital feed of up to 40 sources from third-party systems. ME-1 and ME-500 can be used as drop-in replacements for older AVIOM A-16ii units.

  Features list: 40 Inputs With Level and Pan Control; Dimmable OLED Screen; 16 Assignable Keys; 3.5mm and 1/4" Headphone Outputs; Master 3-Band EQ and Limiter; Solo and Mute Keys; Aux Input for MP3 Players, Click Tracks etc; Built-in Signal Generator; Mains or PoE Powered; Daisy Chain or Use Standard PoE Ethernet Hubs; Mic Stand Bracket and Headphone Hanger Included.
