details: |-
  The TM1 Plus is a 6 mm pre-polarized condenser microphone used for test and measurement applications. The TM1 is known for its linearity, accurate response, consistency, ease of use, and affordability.

  Equipped with a uniformly controlled omnidirectional polar pattern, the TM1 condenser microphone is designed to capture acoustic measurements for room analysis software programs, real-time analyzers, and other sound control devices. With a flat frequency range of 20 Hz – 20 kHz, the TM1 is an excellent tool for sound engineers, sound companies, and recording enthusiasts.

  The TM1 omnidirectional test and measurement microphone is designed, machined, assembled, and tested by AUDIX in the USA.

  The TM1 Plus includes calibration data file* and sensitivity, threaded acoustic windscreen, and CA4231 machined calibration adapter.

  Model Variations
  TM1 – All brass 4-stage construction. Wide and linear response. Requires 18 – 52 V phantom power.

  *Bruel and Kjaer 4231 sound level calibrator or equivalent
specs: |-
  - Type: Test and measurement condenser microphone (calibrated)
  - Polar pattern: Omnidirectional
  - Frequency response: 20 Hz – 20 kHz
  - Capsule: 6 mm pre-polarized condenser
  - Phantom power: 18 – 52 V
  - Included: Calibration data file, threaded acoustic windscreen, CA4231 calibration adapter
