description: Black Lion Audio hot-rodded version of the CV-12 tube condenser
  microphone with redesigned circuit, Solen Fastcap coupler, CK-style 34mm
  edge-terminated capsule, and enhanced power supply with greater filtering and
  lower noise floor.
details: |-
  The CV-12 BLA is a collaborative effort between Avantone Pro and Black Lion
  Audio, the Chicago-based mod shop with over a decade of experience upgrading
  professional recording gear. The microphone features a Solen Fastcap coupler
  and a CK-style 34mm edge-terminated capsule paired with a mil-spec 6072A
  tube.

  The upgraded power supply provides regulated plate voltage, more filtering,
  a lower signal-to-noise ratio, and greater headroom compared to the standard
  CV-12. These modifications eliminate the slight upper midrange hump of the
  original, resulting in sweeter highs and more present lows with increased
  balance across the frequency range.

  The microphone offers nine selectable polar patterns via the included PS-12
  power supply, a high-pass filter at 80 Hz (6 dB/octave), and a -10 dB
  attenuation pad. Designed and assembled in the USA. Black Lion Audio's client
  work includes recordings by Alison Krauss, MGMT, Beyoncé, Metallica, and
  T-Pain.
specs: |-
  - Capsule: 34mm CK12-style edge-terminated
  - Polar Patterns: 9 selectable (via PS-12 power supply)
  - Frequency Response: 20Hz–20kHz ±3dB
  - Output Impedance: ≤250 Ohms (transformer isolated)
  - Maximum SPL: 136dB (0.5% THD @ 1kHz); 146dB with pad
  - Equivalent Noise: <17dB
  - S/N Ratio: 78dB
  - Sensitivity: -35dB
  - Output Connector: Male XLR 7-pin
  - Tube Type: 6072A (mil-spec)
  - High-Pass Filter: 80Hz @ 6dB/octave
  - Attenuation: -10dB switch
  - Dimensions: 237mm × 46mm
  - Weight: 0.8 kg (1.8 lbs)
  - Assembly: Designed and assembled in the USA
