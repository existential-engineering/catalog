description: A passive bidirectional adapter that splits a 3.5mm TRS stereo
  signal into separate mono Left and Right Eurorack signals, or combines two
  mono signals into a single stereo TRS output.
details: |-
  Tear apart at the seams, or join together at will

  There you stand, modular synthesist, Walkman in hand. Whereever shall your 3,5mm headphone plug go, you ask? Where o' where in your system shall you connect this darn TRS connector, and how shall you gain channel seperation? Your days of worrying are over. The 0hp Stereo Breakout from Herzlich Labs is your solution, your salvation from the damnation of signal integration. Insert your 3,5mm TRS plug from whatever device you have, and the signal is cleanly bisected into Eurorack-ready Left and Right mono channels. The inverse operation is also possible. Cleanly glue together a left and right mono signal into a single TRS stereo signal with ease, by inserting your desired mono inputs and taking out a clean stereo TRS. True bidirectional operation. You think we're done? Not at all. Insert only the Left channel signal, and it will be repeated on both channels of the Stereo output. No more Van Gogh situations where you only get signal on one channel. Even better? Insert a stereo TRS signal, and output only the Left channel, and you will get a mono mixdown of the stereo channels. It won't solve all your problems. Nothing will. But it will solve a very particular problem you might find yourself having when integrating your devices within and without your rack. No power, no space? No problem. The hybrid 1U/0hp format means you can easily install it as a 1U unit in a 1U rail, or take it on the go (or on the run) with a brass-threaded enclosure, allowing you to install and uninstall it at your leisure.
specs: |-
  - Bidirectionally transition between mono TS and stereo TRS with ease
  - Mix stereo inputs into a single mono input, or split them at will
  - Passive design: no external power, no batteries
