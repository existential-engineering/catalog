description: The AA-100 is a twin-channel 100 watt acoustic amplifier designed
  to be portable and lightweight for the acoustic player on the go. Both
  channels feature an input level control and two-band EQ (bass and treble). Hi
  and Low inputs plus an XLR balanced input with phantom power connect a variety
  of instruments or a microphone, while a Belton Block digital reverb offers
  four flavours and a notch filter tames feedback at higher volumes. A mini-jack
  input with level control lets the player play along to backing tracks, and a
  balanced XLR DI output links the amp to a PA. There is also a standard jack
  line out plus FX send and return. Tones are delivered via a custom 1x8" driver
  combined with a studio-quality horn, housed in a 12mm ply cabinet with a
  splatter finish and a top-mounted port that doubles as a carry handle.
details: |-
  The AA-100 is a twin channel 100 watt acoustic amplifier designed to be super portable and lightweight for the acoustic player on the go who needs it all. Both channels feature input level control and two band EQ (Bass and Treble). There are Hi and Low inputs plus an XLR balanced input with phantom power to connect a variety of instruments or a microphone with the minimum of fuss. Lush reverb comes in four flavours and a notch filter helps tame unwanted frequencies/feedback when playing at higher volume. A mini jack input with level control allows the user to play along to backing tracks and a balanced XLR DI output means the AA-100 can easily be linked to a PA if required. There is also a standard jack line out and FX send and return sockets. The stunning Acoustic tones are delivered via a custom 1x8" driver combined with a studio quality horn for a lucious full range tone. The cabinet is constructed from quality 12mm ply and is covered in a heavy duty splatter finish. The clever top mounted port also neatly doubles as a carry handle.
specs: |-
  - Compact and portable weighing only 12kg
  - 2 channels with independent input levels
  - 100 Watts
  - 2 x jack plus XLR input with phantom power
  - Belton Block digital reverb (four modes)
  - Balanced XLR DI output
  - MP3 mini-jack input with level control
  - FX send and return
  - 1x8" driver plus studio-quality horn
  - Frequency response -3dB @ 28Hz and 28kHz
  - Notch filter 70 to 350Hz, Q = 5
  - EQ Bass and Treble +/-15dB @ 100Hz and 10kHz
  - Distortion less than 0.8% THD
  - Signal to noise greater than 80dB (EQ flat)
  - Power requirement 115/230V, 120 Watts
  - Dimensions (H x W x D) 410 x 300 x 320 mm
  - Weight 12 kg
