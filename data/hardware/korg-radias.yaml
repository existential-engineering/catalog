description: >-
  The Korg Radias is a virtual analog synthesizer released in 2006, employing
  Korg's Multiple Modeling Technology (MMT) derived from the flagship OASYS. It
  features four-timbre multitimbral operation, a 16-band vocoder, built-in step
  sequencer, and is available as both a 49-key keyboard and a rack module
  (Radias-R).
details: |-
  The Radias uses Korg's MMT (Multiple Modeling Technology) synthesis engine, which was adapted from the OASYS workstation. Each of its two oscillators per timbre offers a wide range of waveforms including saw, square, sine, triangle, PCM, and formant types. Oscillator 1 provides nine waveforms with four modulation types and access to 64 synth and 128 drum PCM sounds, while Oscillator 2 offers four waveforms with two modulation types. Up to five waveforms can be stacked in Oscillator 1 using a single voice, and Unison mode can produce up to 25 detuned waveforms for massive sounds.

  The Radias is four-part multitimbral, allowing each of its four timbres to be assigned independently as a synthesizer, drum kit, or vocoder patch. Each timbre includes its own equalizer and two insert effects drawn from a pool of 33 effect types, including delays, chorus, flangers, compressors, a talking modulator, reverb, and the classic Polysix Ensemble effect. A master effect bus is also available.

  The built-in 16-band vocoder includes a Formant Motion recording function capable of capturing up to 7.5 seconds of external audio, which can then be triggered via the keyboard. The Radias also features a versatile arpeggiator with six patterns and up to 32 steps, plus two 32-step sequencers that can be combined into a single 64-step sequence with 8-voice polyphony per step.

  Available as both a 49-key velocity-sensitive keyboard and the Radias-R rack module, the instrument uses Korg's KKS (Korg Komponent System) design. The Radias-R can also connect to the Korg M3 Music Workstation. A software sound editor is available for both Windows and macOS.
specs: |-
  - 24-voice polyphony
  - 4-part multitimbral
  - 2 oscillators per timbre with noise generator
  - Waveforms: saw, square, sine, triangle, PCM (64 synth / 128 drum), formant, noise, audio input
  - 2 LFOs with 6 waveforms each
  - 2 filters per timbre (24dB/12dB low-pass, high-pass, band-pass, comb)
  - 3 envelope generators per timbre
  - 16-band vocoder with Formant Motion recording (7.5 seconds)
  - 33 built-in effects (delays, chorus, flangers, compressor, phaser, reverb, talk modulator, Polysix Ensemble)
  - 2 insert effects per timbre plus 1 master effect
  - Arpeggiator with 6 patterns, up to 32 steps
  - 2 x 32-step sequencers (combinable to 64 steps)
  - 49 velocity-sensitive keys (keyboard version)
  - 256 programs, 128 timbre templates, 128 insert effect templates, 128 master effect templates
  - MIDI In/Out/Thru, Keyboard In, USB
  - Software sound editor (Windows/macOS)
  - DWGS waveforms from Korg DW-8000
