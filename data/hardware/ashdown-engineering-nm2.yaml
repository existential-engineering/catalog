details: |-
  Designed from the ground up for Nate Mendel of the Foo Fighters, the NM2 is a unique professional dual distortion pedal capable of driving a stereo rig for huge walls of bass sound. Taking the signal from a bass, the NM2 splits internally to two outputs, each providing the original signal at input level plus its own individual mix of two separate and very different distortion types, one per output. Because the unaltered bass signal is fed from input to output and the distortion is added to it, the result is always full and dynamic. For a stereo rig, each output can feed a separate amplifier and the individually adjustable overdrive effects switched in or out for output 1, output 2 or both, and a 1+2 switch routes both effects to output 2 for single-amp use. An Ashdown VU meter with an input level knob helps set the sweet spot for active or passive basses. Built tough for the road with a metal casing, premium controls and switches, recessed knobs and kickguards, the NM2 features genuine true-bypass switching for zero colouration when not in use.
specs: |-
  - Type: Dual distortion / overdrive pedal for bass
  - Outputs: 2 (stereo rig), each carrying dry signal plus its own distortion
  - Routing: Effect switchable IN/OUT per output, plus 1+2 combine switch
  - Metering: Ashdown VU meter with input level control
  - Switching: True bypass
  - Suitable for: Active or passive bass
