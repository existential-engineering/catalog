description: Handheld dynamic vocal microphone with a cardioid polar pattern,
  built around a large-diaphragm dynamic capsule for crisp, clear, balanced
  vocal reproduction. A shock-mounted capsule and humbucking coil keep handling
  noise and AC hum out of the signal on loud stages.
details: >-
  The Electro-Voice ND76 is a handheld dynamic vocal microphone in EV's N/D
  series, designed as an all-around workhorse for lead and backing vocals on
  live stages and in the studio. Its cardioid polar pattern provides strong
  off-axis rejection for stable gain before feedback against monitors and bleed
  from nearby sources.


  A large-diaphragm dynamic capsule delivers a rich, detailed frequency response
  with crisp, clear, and balanced vocal presence, while a shock-mounted capsule
  minimizes handling noise and low-frequency thumps from the mic body. A
  built-in humbucking coil guards against AC line hum picked up near speaker
  cabinets and stage power, and the Memraflex grille resists denting and stands
  up to rough handling on the road.


  The body is built from die cast zinc with a black polyurethane finish for
  durability under stage and touring use. At 182.5 mm tall, 50.5 mm in diameter
  and 0.323 kg, it has the familiar weight and balance of a handheld stage mic.
  Output is via a standard 3-pin XLR connector, with a low-impedance balanced
  signal at 350 ohms suitable for any professional mixer or preamp. The
  microphone is passive and requires no phantom power.
