details: |-
  The RP-6000F II features a new, larger 90° x 90° silicone composite hybrid Tractrix horn that provides incredibly efficient transfer of high-frequency waves into the listening area for crisper, clearer sound. The phase plug and compression molded silicone face ensure smooth frequency response, and the second-generation design increases horn size for a larger soundstage and enhanced directivity.

  The exclusive 1" Linear Travel Suspension (LTS) titanium diaphragm tweeter minimizes distortion for enhanced, detailed performance. The vented tweeter housing further reduces standing waves that create unwanted harmonics, resulting in enhanced detail and clarity in high-frequency reproduction.

  Dual 6.5" Cerametallic woofers have been redesigned for the II series with new aluminum shorting rings (Faraday rings) to reduce distortion and increase power handling, while the new motor structure improves transient response with greater speed and accuracy.

  The bass reflex enclosure uses dual chamber rear-firing Tractrix ports with custom inner flares that reduce air turbulence for punchier, cleaner low frequencies. The MDF cabinet features additional internal bracing and a divided design to minimize resonance and vibration.

  Dual binding posts support bi-wiring and bi-amping configurations. Hidden rear connections allow easy integration of RP-500SA Dolby Atmos elevation speakers.
