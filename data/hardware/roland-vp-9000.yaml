description: >-
  The Roland VP-9000 VariPhrase Processor is a revolutionary sampler and vocal
  processor capable of elastic real-time manipulation of pitch, time, and
  formants via MIDI. It enables users to instantly synchronize drum loops to
  matching keys and tempos while maintaining sound quality through
  non-destructive processing. The unit features three large front-panel knobs
  for hands-on control and supports multiple sample formats including Roland
  S-700, Akai S1000, AIFF, and WAV.
details: |-
  The VP-9000 represents a significant innovation in sample manipulation technology. Users can instantly synchronize drum loops to matching keys and tempos, bend notes, change pitches, or apply harmonization effects — all executed in real-time with minimal artifacts. The device features three large front-panel knobs for hands-on control of pitch, time, formant, and groove parameters.

  The unit ships with 8MB of memory, expandable to 136MB via optional SIMMs. It includes six analog outputs plus both coaxial and optical digital I/O. Two SCSI ports accommodate hard drives, Zip drives, and CD-ROM connectivity. An internal 250MB Zip drive enables sample storage and file transfers to Mac and PC systems.

  Built-in effects include nine reverb algorithms, one chorus/flanger effect, and 40 multi-effects processors. The device features internal resampling capabilities for applying effects iteratively. It supports VP-9000, Roland S-700, Akai S1000, AIFF, and WAV format files for loading existing sample libraries.

  The optional V-Producer software package for Mac and PC provides graphical interfaces for phrase scope editing, drag-and-drop sample sequencing, 6-channel mixing, effects routing, MIDI Clock and MTC synchronization, and batch encoding of audio files.

  At $3,000 retail, the VP-9000 served primarily studio and touring musicians needing hands-on sample manipulation. Early OS versions had stability issues, though OS 1.12 resolved these problems. The device gained recognition through use by Fatboy Slim and became associated with the robotic vocal effect popularized by Daft Punk and R&B artists.
specs: |-
  - Polyphony: 6 voices
  - Multitimbrality: 6 parts
  - Sampler Memory: 8MB standard, expandable to 136MB with SIMMs
  - Maximum Sample Size: 8MB
  - Sample Capacity: Up to 1,024 samples
  - Sample Rates: 48kHz, 44.1kHz, 32kHz
  - Modulation Technology: VariPhrase (proprietary)
  - Effects: 9 reverbs, 1 chorus/flanger, 40 multi-effects
  - Storage: 250MB internal Zip drive
  - Audio Outputs: 6 analog outputs
  - Digital I/O: Coaxial and optical
  - Control Interfaces: MIDI (6-part), SCSI 25-pin, SCSI 50-pin
  - Display: Large icon-based graphic LCD
  - Compatible Formats: VP-9000, Roland S-700, Akai S1000, AIFF, WAV
  - Original Price: $3,000
