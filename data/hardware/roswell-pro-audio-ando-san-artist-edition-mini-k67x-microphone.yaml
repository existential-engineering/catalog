details: |-
  Introducing the Limited Edition "Ando San" Microphone

  Ando San is a musician, songwriter, and producer from Los Angeles. Ando San is endorsed by Cubase, Kiesel Guitars, and Roswell Pro Audio. Ando's vocal mic of choice is the Roswell Mini K67x, outfitted with a custom powdercoat finish and black chrome grille. "I am using the Mini K67x for the new album. This is the best my voice has ever sounded. The definition and clarity you get from this mic is incredible!"

  About the Mini K67x

  The mic is our reinterpretation of the vintage U67 tube mic. We've recreated the harmonic saturation of the tube circuit without the tube, resulting in a mic with rich tone that belies its small size. Each Mini K67x is assembled, wired, tested and tuned in California using the finest components in the world.
