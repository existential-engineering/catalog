description: A Eurorack CV/audio mixer with dual VCA sections, two CV mixer
  sections offering min/max/comparator/sum outputs, and LM13700-based VCAs with
  a near-linear response curve.
details: |-
  A CV/Audio Mixer with Dual VCA

  CV sections
  Blend has two CV sections each with:

  CV Mixer section
  Blend takes the outputs of the two CV sections and offers the following:

  VCA Sections
  There are two VCA sections that are also have a mix output. The CV input for each VCA is normalled to the output of a CV section. The VCA circuits are LM13700 based so they will slightly color the sound. The response curve is nearly linear but offers a slight exponential curve. User manual
specs: |-
  - Input (normalled to a +5V signal)
  - Attenuverter
  - Output
  - Min output
  - Max output
  - Comparator output (level brought down to 4.5V)
  - Sum output
  - The min and max sections do not attempt to be precision min/max measurements. They will be within two diode drops of the actual min or max voltage.
