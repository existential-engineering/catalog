description: High-power reference monitor designed for use in large control rooms
details: |-
  The M4 by Dynaudio Acoustics is a high quality, high-power loudspeaker system for use in large music studio monitoring applications. It's been designed to provide accurate, distortion-free monitoring at high power levels – maintaining exceptional quality at all times under all drive conditions.

  The bass section consists of four 300mm MSP (Magnesium Silicate Polymer) drivers with 100mm ferrofluid-cooled voice coils. The low-mid section uses two 170mm MSP drivers with 75mm voice coils and neodymium magnets. The upper-midrange driver is a 54mm critically doped fabric dome Esotar model that ensures low distortion and excellent transient response. And the high-frequency unit is the legendary Esotar 3, designed to reproduce distortion-free transients of up to 1000 watts. Both Esotar units are fitted with enhanced double-magnet motors, and a high-power passive crossover links the high-mid and tweeter.

  If you've a smaller room, you can also order a compact version of the system with two bass drivers.
specs: |-
  - Status: Current
  - Segment: Pro
  - Series: Dynaudio Acoustics
  - Application: Music recording and mixing
  - Type: 4-way hybrid
  - Frequency response: 35Hz – 20kHz
  - Maximum SPL at 2 metres: 130dB stereo
  - Crossover frequencies: 250Hz, 2kHz, 5kHz
  - Total harmonic distortion: 1% at 90dB
  - Recommended amplifier power: Four channels: 500-1000W/channel per speaker
  - Cabinet dimensions (H x W x D): 900 x 850 x 680mm
  - Weight: 145 kg
  - Finish: Black textured paint
  - High frequency driver: Esotar 3
  - High mid driver: 56mm soft dome
  - Low mid driver: 2x 17cm MSP
  - Low frequency driver: 4x 30cm MSP
  - Amplifier recommendation: Dynaudio Acoustics DA40/80 DSP, DCA800/1400
  - Optional hardwood cabinet: Oak, cherry, walnut, maple
  - Custom cabinet sizes: On request
