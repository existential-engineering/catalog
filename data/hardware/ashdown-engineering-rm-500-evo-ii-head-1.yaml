description: The Ashdown RM-500 EVO II is a compact bass head for those who
  demand Ashdown's signature tone, uncompromising power and reliability without
  the weight. At just 2.1kg it delivers 500 watts with an onboard headphone
  preamp, 5-band EQ, compressor and tube-emulated overdrive.
details: |-
  Weighing a mere 2.1kg, this compact head delivers 500 watts of power. An onboard headphone preamp turns it into a practice device for silent rehearsals. It accommodates both passive and active instruments through a pristine signal path to the input control, complete with Ashdown's trademark VU meter. The 5-band EQ, onboard compressor and tube-emulated overdrive give complete control over the sound, while the sub-harmonic controls add extra depth, and these can be foot-switched using the FS-2 footswitch (sold separately). A mute button illuminated in cool blue adds stage presence and the matte alloy front panel eliminates reflections. For added versatility the amp offers send and return sockets, a DI output for integration with PA systems, and a line input for rehearsing with backing tracks. Partner it with Ashdown's Rootmaster EVO cabinets for a perfect match.
specs: |-
  - Power Output: 500 Watts
  - Weight: 2.1 kg (4.6 lbs)
  - Instrument Input: passive and active compatible, with input level control and VU meter
  - EQ: 5-band
  - Onboard compressor
  - Tube-emulated overdrive
  - Sub-harmonic controls
  - Onboard headphone preamp
  - FS-2 footswitch compatible (sold separately)
