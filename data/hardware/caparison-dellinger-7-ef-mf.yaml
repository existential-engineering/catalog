details: |-
  The Dellinger 7 EF/MF is Caparison's innovative 7-string version of the classic Dellinger model, featuring a bolt-on, flat-top body design. The traditional Mahogany body has been replaced with Australian Blackwood, resulting in a sound that boasts a broad tonal range, rich sustain and a pronounced fundamental. To enhance the low-mid spectrum, Caparison has applied their unique "Pro.Black" finish to the headstock, which enhances frequencies that are essential for a 7-string guitar. The newly designed pickups, the PH7-nc and PH-7-bc, deliver a powerful, clean sound with a distinct sonic clarity and separation. Additionally, the Schaller "Megaswitch M" 5-way Lever Switch provides a versatile array of tonal options. The Caparison Dellinger 7 EF/MF is available with either an Ebony or Maple fingerboard and comes in Interstellar Black, Cobalt Blue or Tangerine Orange.
