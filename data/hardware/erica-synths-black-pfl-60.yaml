description: Erica Synths Black Pre-fade Listen Expander is a satellite module
  for Erica Synths Black Stereo Mixer.
details: |-
  The Black PFL Expander is designed to work with both the Erica Synths Black Stereo Mixer V2 and V3. The module does not have a PSU connector, so it cannot be used on its own.

  Since modular performances are often about uncertainty, unpredictability and sudden filter resonance screams that can damage loudspeakers, it helps to know what is about to be faded into a modular mix, and that is where the Black PFL Expander comes in. Each of the four Black Stereo Mixer inputs, or any combination of them, can be monitored before the mixer level knob takes effect.

  The panel carries four independent PFL ON switches, a stereo headphone output and headphone volume adjustment.

  Power consumption is 15mA on the +12V rail and 7mA on the -12V rail, drawn through the host mixer, and the module occupies 6HP at a depth of 25mm.
specs: |-
  - 4 independent PFL ON switches
  - Stereo headphone output
  - Headphone volume adjustment
  - Works with Black Stereo Mixer V2 and V3
  - No PSU connector, powered from the host mixer
  - Power consumption +15mA, -7mA
  - Module width 6HP
  - Module depth 25mm
