details: |-
  The PRS SE P20E is a parlor-sized acoustic with a big voice. The PRS P20E features all-mahogany construction, and has an organic, warm voice. Featuring PRS hybrid “X”/Classical bracing, which allows the top to freely vibrate, the SE P20E projects with even, bold tone. Its smaller size makes playing for hours fun and comfortable and allows for more convenient transport.

  Parlor-sized acoustics can be miscategorized because of their size but make no mistake this is a professional-grade instrument. Plugged in, the PRS-Voiced Fishman Presys VT pickup system delivers dynamic, organic tone and allows players to easily take this guitar from rehearsal to the stage. This electronics system features an undersaddle pickup and soundhole mounted preamp with easy-to-access volume and tone controls.

  Available in five satin finishes with herringbone rosettes and accents, PRS SE Parlor acoustics look as good as they sound. Other high-quality features include a solid mahogany top, ebony fretboard and bridge, bone nut and saddle, as well as PRS trademark bird inlays and headstock design. PRS SE Parlor acoustics come with a gig bag and are strung with 12-53 strings.
