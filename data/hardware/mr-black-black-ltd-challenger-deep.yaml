url: https://www.mrblackpedals.com/products/black-ltd-challenger-deep
description: A deep, oceanic reverb inspired by Challenger Deep, with fluid,
  shifting reflections that roll outward like slow underwater currents.
details: |-
  Named after Challenger Deep, the deepest known point on Earth, this reverb is
  drawn from the ocean rather than from outer space. It aims to capture that same
  sense of movement, pressure, and impossible scale: deep, fluid, and constantly
  shifting reflections that roll outward like slow underwater currents.

  At restrained settings, Challenger Deep adds a cool, dimensional wake behind
  your playing. Chords bloom naturally, single notes carry farther, and familiar
  sounds feel wider than the room around them. Push farther and the shoreline
  disappears into long, dark, rolling ambience, with reverb that rises, folds,
  and recedes with the patient movement of deep water. It can be haunting,
  beautiful, or genuinely enormous while remaining musical throughout.

  It is equally comfortable adding subtle depth to a clean passage, surrounding a
  melody with slow-moving atmosphere, or transforming an entire signal into a
  submerged landscape.

  The Black LTD. Challenger Deep is a Jack Deville original design, produced as a
  limited run of 59 pieces.
specs: |-
  - Oceanic reverb with fluid, shifting reflections
  - Subtle dimensional depth to vast rolling ambience
  - Input Impedance: ~470KOhm
  - Output Impedance: ~2KOhm
  - True-Bypass
  - Power: 9VDC, 2.1mm negative center-pin (>100mA regulated supply recommended), or internal 9V battery (not included)
  - Current draw: ~59mA @ 9VDC
  - Dimensions: 2.65in x 4.45in x 1.85in (67.3mm x 113mm x 47mm)
  - Weight: 9.0oz (255g)
  - Limited run of 59 pieces
