description: UK-built, Ice Blue, lightweight 500-watt kickback combo designed
  for powerful tone in a compact format. Featuring a premium Sica NEO 12"
  speaker, 5-band EQ, classic Shape circuit, FX Loop, and durable Charcoal Tweed
  with a Silver Weave grill, it delivers clean, reliable performance for
  rehearsals, gigs, and studio sessions, no separate head required.
details: |-
  The Ashdown UK-OBM-C112-500 is a self-contained bass combo designed for players who value clarity, reliability, and ease of use. Hand-built in the UK and finished in bold Ice Blue, it delivers a commanding 500 watts of output while integrating amp and speaker into one ultra-compact format. Central to the combo is a high-quality Sica NEO 12" speaker with tweeter, and the kickback cabinet design allows the combo to be angled upward for improved on-stage audibility. The control layout centres around a responsive 5-band EQ and the classic Shape contour, with an onboard FX Loop for external effects and a headphone output for silent practice.
specs: |-
  - Power output: 500 Watts
  - Power requirement: 115-230 Volts
  - Minimum impedance: 4 Ohms
  - Speaker configuration: 1 x 12" NEO + Tweeter
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 220Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.5kHz, Treble +/-15dB @ 7kHz
  - H x W x D: 470 x 606 x 381 mm
  - Net weight: 13.5 kg
