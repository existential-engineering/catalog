description: Ultra-miniature omnidirectional back-electret condenser lapel
  (lavalier) microphone terminated with a Switchcraft TA4F connector for use
  with Electro-Voice and Telex wireless bodypack transmitters.
details: >-
  The Electro-Voice RE97LTx is an ultra-miniature, omnidirectional,
  back-electret condenser microphone designed for applications that demand a
  high-quality microphone element that is practically invisible when worn by the
  speaker or performer. It is intended for spoken-word use in theatrical
  performance, fixed installations, corporate AV presentations, houses of
  worship, and any venue where a full-range, natural, and well-balanced sound is
  required from an inconspicuous, lightweight microphone.


  The output is clean and accurate, and the omnidirectional polar pattern
  ensures uniform output regardless of the microphone's angle relative to the
  sound source. The provided dual clothing clip anchors the microphone on a
  lapel, tie, or shirt collar, and the supplied long and short windscreens
  reduce wind and breath noise.


  The RE97LTx has a shielded 4-foot (1.22 m) cable terminated in a genuine
  Switchcraft TA4F connector, ready for use with standard EV and Telex bodypack
  transmitters including the EV REV-BP, BPU-2/CSB-1000, and Telex
  WT-500/WT-1000. The ultra-flexible body-pack lead may be easily concealed.
  With the optional TXA Phantom Power Adapter, the RE97LTx can be used in wired
  XLR applications. The microphone is available in black or beige finish.
specs: >-
  - Transducer: Condenser, back-electret

  - Polar pattern: Omnidirectional

  - Frequency response: 50 Hz - 15 kHz

  - Sensitivity (1 kHz): -48 dBV, 4.0 mV/Pascal

  - Maximum SPL: >120 dB SPL

  - Equivalent noise: 32 dBA

  - Dynamic range: 88 dB

  - Output impedance (1 kHz): 3000 ohms

  - Power requirement: +5 VDC (bias from bodypack)

  - Current consumption: 310 microamps

  - Polarity: Positive pressure on diaphragm produces a positive voltage on Pin
  2

  - Connector: Switchcraft TA4F (Pin 1 ground, Pin 2 audio, Pin 3 bias voltage,
  Pin 4 unused)

  - Cable: 4 ft (1.22 m) long, 0.052 in (1.30 mm) diameter, shielded

  - Capsule dimensions: 7.00 mm length x 3.00 mm diameter

  - Net microphone weight: 10.5 g (0.4 oz)

  - Clip-only weight: 2.1 g (0.08 oz)

  - Colors available: Black, Beige

  - Accessories furnished: Long and short windscreens, dual clothing clip, gig
  bag

  - Optional accessories: TXA Phantom Power Adapter (for wired XLR use)

  - Compatible transmitters: EV REV-BP, BPU-2 / CSB-1000, Telex WT-500 / WT-1000

  - Part numbers: F01U149502 (beige), F01U149504 (black)
