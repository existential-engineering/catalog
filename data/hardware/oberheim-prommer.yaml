description: >-
  An 8-bit EPROM programmer and sampler from Oberheim, designed to burn custom
  sound chips for use in the DMX drum machine and compatible vintage percussion
  instruments.
details: |-
  The Oberheim Prommer occupies a unique niche in the world of vintage music technology. Rather than functioning as a standalone instrument, it serves as a bridge between custom sound creation and the Oberheim DMX drum machine, allowing users to sample audio and burn it onto EPROM chips that can then be installed in the DMX or similar machines like Sequential's Drumtraks.

  The sampling capabilities are intentionally modest: monophonic, 8-bit resolution at variable sample rates. Editing tools include start point adjustment, decay time, reverse playback, ring modulation, stretch and squash functions, and various digital bit manipulation effects that can transform mundane samples into something altogether more interesting.

  MIDI SysEx dump support means samples can be transferred to external software editors such as WaveLab for more detailed processing before being loaded back and committed to EPROM. This workflow, while cumbersome by modern standards, opened up creative possibilities that were otherwise unavailable to DMX owners.

  The Prommer represents an era when customization required real hardware ingenuity. For collectors of vintage Oberheim gear, it remains an essential companion piece to the DMX.
specs: |-
  - Polyphony: Monophonic
  - Sampler: 8-bit, variable sample rates
  - Memory: EPROM chips, MIDI SysEx dump
  - Filter: None
  - Envelopes: Start point, decay time
  - Effects: Reverse, ring modulation, digital bit manipulation, stretch/squash
  - Control: MIDI, trigger
  - Keyboard: None
