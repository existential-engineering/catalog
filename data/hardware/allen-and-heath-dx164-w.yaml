url: https://www.allen-heath.com/hardware/everything-i-o/dx164-w/
description: The DX164-W is a wall mountable 16in / 4out 96kHz remote I/O
  expander that adds inputs and outputs to dLive, Avantis, SQ and 96kHz Qu
  mixers, or to AHM audio matrix processors.
details: |-
  16in / 4out 96kHz Expander. Wall-mountable remote I/O expander that adds inputs and outputs to dLive, Avantis, SQ and 96kHz Qu mixers, or to AHM audio matrix processors.

  16 Mic Preamps — +60dB of gain, Phantom Power indicators and -20dB pad for line level sources.

  4 Line Outs — Balanced, relay protected line outputs on XLR.

  Redundant and Cascade Modes — Redundant mode supports dual-cable connection to compatible hardware. Cascade mode allows daisy-chaining of up to 2 DX Expanders on each DX port.

  Plug-and-Play — No configuration required, just connect to your mixer and you're ready to go. Firmware updates are handled automatically by the mixer.

  Wall or Floor Mount — The reversible mounting frame allows for in-wall or on-wall mounting. With custom brackets, the unit can be fitted in a standard NEMA box, or mounted in a floor pocket for stage use.

  Maximum Flexibility — The DX164-W can be placed up to 100m away from the mixer for maximum flexibility of positioning. The expander connects via a single Cat5e cable to the mixer or upstream DX Expander via a secure EtherCon port. A second locking EtherCon port is provided for redundant connection to compatible hardware, or for daisy-chaining to a downstream DX Expander for additional remote I/O.

  Flexible Power Options — The IEC mains power inlet can be replaced with a gland module and screw terminals for fixed installation, and a DC 12V backup input is also provided.
