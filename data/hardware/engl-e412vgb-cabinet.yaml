name: E412VGB
manufacturer: engl
primaryCategory: speaker
url: https://www.engl-amps.com/shop/cabinets/engl-e412vgb-cabinet/
description: Straight-front 4 x 12 inch passive guitar speaker cabinet with a
  closed back, four Celestion Vintage 30 speakers, 240 W power handling and an 8
  ohm impedance, built from solid birch plywood.
details: |-
  The E412VGB is a classic representative of its craft: a straight 4 x 12 cabinet with the typical sound dispersion and a look that has been defining rock stages of the world for over 50 years.

  Equipped with four Celestion Vintage 30 speakers, this cab is a lesson in guitar tones you know and love: mid-oriented, complex distorted structures, and a solid bass foundation with silky highs are the order of the day.

  The housing, made of birch plywood, is built to last, and is 100% solid and roadworthy. The closed back is finished with a solid hand-welded metal grille.

  A parallel input and thru jack allow the cabinet to be daisy chained to a second cabinet. The cabinet handles 240 W at an impedance of 8 ohm.
specs: |-
  - Straight front
  - Closed back
  - Solid birch plywood construction
  - Parallel input and thru for daisy chaining
  - Solid hand-welded metal grille
  - Speaker: 4 x 12 inch Celestion Vintage 30, made in UK
  - Power handling: 240 W
  - Impedance: 8 ohm
  - Passive cabinet, no mains connection
  - Dimensions: 74 x 75 x 36 cm
  - Weight: 52 kg
