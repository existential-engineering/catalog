details: |-
  CD deck

  With the help of top DJs, the CDJ-500S has been specifically designed for today's professional club performers. It answers all their needs and concerns, so that they can focus 100% on what really matters: their performance and interaction with crowd. Now there is absolutely no excuse for failing to exploit all the advantages and creative possibilities for the CD Format.

  The compact CDJ-500S incorporates all the good points that made the CDJ-500II the reference for CD turntables, It offers revolutionary and innovative features which make it the new standard in clubland.
