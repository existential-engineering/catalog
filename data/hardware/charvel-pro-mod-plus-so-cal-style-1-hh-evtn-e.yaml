description: The Pro-Mod Plus So-Cal Style 1 HH EVTN E pairs a sleekly sculpted
  alder body with a bolt-on caramelized maple neck featuring a speed neck
  profile and graphite reinforcement for stable, comfortable shred-ready
  performance. An EverTune F6 bridge keeps the guitar locked in tune through
  aggressive playing and bends.
details: |-
  The Pro-Mod Plus So-Cal Style 1 HH EVTN E features a gloss-finished alder So-Cal body in Midnight Blue with a bolt-on caramelized maple neck (natural satin finish) reinforced with graphite. The 25.5" scale ebony fingerboard has a 12"-16" compound radius, 22 jumbo stainless steel frets, 4mm pearloid dot inlays, and Luminlay side dots. A Graph Tech TUSQ nut (1.6875" width) sits at the headstock.

  Electronics consist of a Seymour Duncan Nazgul humbucker in the bridge and a Seymour Duncan Sentient humbucker in the neck, routed through a 5-position blade switch with master volume and master tone.

  Hardware includes an EverTune F6 Model bridge, Charvel-branded die-cast locking tuning machines, dome-style control knobs, and a licensed Fender Stratocaster headstock, all in a black hardware finish. Ships with a Charvel Multi-Fit Gig Bag. Made in the United States of America.
