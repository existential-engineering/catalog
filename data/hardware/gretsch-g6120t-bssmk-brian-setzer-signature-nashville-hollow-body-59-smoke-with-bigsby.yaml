details: |-
  Honoring a pivotal rock 'n' roll legend, the G6120T-BSSMK Brian Setzer Signature Nashville Hollow Body '59 "Smoke" with Bigsby is a recreation of Brian's main stage guitar since retiring the famed "Stray Cat."

  The guitar features period-correct vintage '59 details and beneath its vintage cloak, "Smoke" is a true workhorse with features accumulated over a prolific span of Brian's career.

  Its laminated maple hollow body with 1959 trestle bracing pairs with a maple neck carved to a Vintage "V" profile, ebony fingerboard with Pearloid Neo-Classic thumbnail inlays, and a compound 9.5"-12" radius for comfortable playability across the neck.

  A pair of TV Jones Ray Butts Ful-Fidelity Filter'Tron pickups delivers Setzer's signature articulate, clear voice, controlled via dual volumes, a master volume, a 3-position pickup toggle and a 3-position tone switch. Gotoh locking tuners, a pinned Adjusto-Matic bridge and a Bigsby B6CGH tailpiece round out a workhorse stage instrument.
