description: >-
  The MC-909 is Roland's professional music production workstation that
  seamlessly integrates audio sampling, MIDI sequencing, and XV-series synthesis
  in a single groovebox. Built around a 64-voice polyphony engine with 16-bit
  sampling expandable up to 272MB of RAM, it features a 16-track sequencer with
  480 ticks-per-quarter-note resolution and a dance-oriented ROM sound library.
  It was designed for serious producers who need a self-contained production
  environment with sampling, synthesis, effects processing, and a built-in
  mastering compressor.
details: |-
  The MC-909 evolved beyond Roland's original Groovebox concept into a full-fledged production workstation. At its core is a powerful 4-Tone synthesis engine based on the XV-series, with stereo waveforms per Tone and 64-voice polyphony across 16 multitimbral parts. The internal ROM contains 693 all-new waveforms, 800 patches, and 64 rhythm sets, with a dance-oriented sound library featuring everything from house pianos and organs to edgy techno hoovers, the iconic JP-8000 SuperSaw waveform, and distorted TB-303 sounds.

  The sampling section records at 16-bit, 44.1 kHz in WAV and AIFF formats, with 16MB of standard sample memory expandable up to 272MB using optional DIMMs. Audio and MIDI can be integrated, synthesized, and sequenced together, with the MC-909 automatically synchronizing loops. The turntable emulation feature allows independent pitch and time adjustment of samples.

  The 16-track sequencer offers 480 ticks-per-quarter-note resolution with patterns up to 998 measures long. Recording modes include Realtime, TR-REC, and Step, with an improved version of Roland's popular TR recording method that enables piano-roll style editing across multiple notes using the pads and LCD. The arpeggiator provides 128 preset and 128 user patterns along with chord memory.

  Effects processing is comprehensive, featuring two independent multi-effects processors (MFX1 with 38 types, MFX2 with 47 types), 24-bit reverb applicable to each sequencer part, a dedicated compressor, and advanced filter algorithms including a 36dB filter and Step Filter. Additional effects include tempo-synced delay up to four seconds, phasing, distortion, Lo-Fi, Slicer, and COSM Amp Modeling. A 3-band mastering compressor/EQ enables final mix processing directly within the unit.
specs: |-
  - Polyphony: 64 voices, 16-part multitimbral
  - Synthesis: 4-Tone engine based on XV-series with stereo waveforms
  - Waveforms: 693 waves (32MB ROM)
  - Patches: 917 preset, 256 user, 256 card
  - Rhythm Sets: 89 preset, 128 user, 128 card
  - Sampler: 16-bit linear, 44.1 kHz (WAV/AIFF)
  - Sample Memory: 16MB standard (180 sec mono / 90 sec stereo), expandable to 272MB via DIMM
  - Sequencer: 16 tracks, 480 PPQN resolution
  - Patterns: 333 preset, 440 RPS, 200 user, 999 card
  - Pattern Length: Up to 998 measures
  - Songs: 50
  - Recording Modes: Realtime, TR-REC, Step
  - Arpeggiator: 128 preset / 128 user patterns
  - Chord Memory: 64 preset / 128 user
  - Filter: 1 per tone (max 4 per patch), 12/24/36 dB/oct with cutoff, resonance, ADSR
  - LFO: 2 per part, 8 waveforms
  - Effects MFX1: 38 types
  - Effects MFX2: 47 types
  - Reverb: 4 types (24-bit)
  - Mastering: 3-band compressor/EQ
  - Controller: 16 velocity-sensitive pads
  - Control: Twin D Beam infrared controllers
  - MIDI: In/Out, USB
  - Audio I/O: 6 analog outputs, stereo analog inputs, S/PDIF digital I/O
  - Expansion: 1 SRX Wave Expansion Board slot
  - Storage: SmartMedia card slot
  - Additional: V-LINK video integration
