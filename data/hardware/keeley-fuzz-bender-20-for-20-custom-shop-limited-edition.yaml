description: A Custom Shop run of the three-transistor Fuzz Bender hybrid fuzz
  in two 20 for 20 finishes, with silicon and germanium fuzz stages and active
  gyrator bass and treble controls.
details: |-
  This Custom Shop run of the Fuzz Bender was offered in two 20 for 20 colorways, each carrying the 20 for 20 Keeley Custom Shop insignia. Silver Rocket is a matte clear coat over a raw metal enclosure with black graphics, and Slime Green is a gloss green finish with pink, purple and blue graphics. Each colour was limited to 20 pedals.

  The Fuzz Bender itself is a five-knob, three-transistor fuzz that combines high-gain silicon with germanium. Two gyrators work as an active EQ, giving over 20 dB of boost or cut at 100 Hz and 10 kHz, which allows fuzz voicings that a typical square-wave circuit cannot reach.

  The circuit is built around vintage Japanese germanium transistors. A Bias control sets the attack and decay of each note, covering fat square waves, angular fuzz and glitchy, velcro-like attacks. Input and output jacks are top mounted and the bypass is true bypass.
