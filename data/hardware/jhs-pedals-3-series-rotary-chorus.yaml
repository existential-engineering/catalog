details: |-
  The rotary effect was one of the earliest modulation effects to hit the music scene. Originally designed for Hammond organs, the Leslie was a rotating speaker that created the recognizable Doppler effect. You've heard rotary effects on everything from 'It's Only Love' by the Beatles to 'Cold Shot' by Stevie Ray Vaughan.

  The JHS Pedals 3 Series Rotary Chorus brings you this classic, spinning chorus tone in an affordable, easy-to-use pedal format. Intensity determines the modulation depth. Speed lets you control how fast the simulated speaker spins. When you turn the Room toggle on (up position), it adds a roomy, reverb ambiance to the sound, much like the ambient room microphone sound when recording a real Leslie.
