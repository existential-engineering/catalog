description: >-
  The Elka Synthex is a lush-sounding 8-voice polyphonic analog synthesizer featuring dual
  DCOs per voice, a multimode Curtis filter, built-in chorus, and a four-track sequencer.
details: |-
  The Synthex stands as Elka's most celebrated instrument, an 8-voice polyphonic synthesizer that earned a devoted following for its rich, warm sound. With 30 knobs, 6 sliders, 80 switches, and a joystick replacing traditional pitch and modulation wheels, it offers an unusually hands-on interface for its era.

  Each of the eight voices features two digitally controlled oscillators with cross modulation of pulse width, feeding into Curtis chip multimode filters offering 24dB lowpass, 12dB highpass, and both 12dB and 6dB bandpass modes. ADSR envelopes shape the VCA, while dual LFOs controllable via the joystick provide real-time modulation of oscillators and filter parameters. A digital ring modulator and built-in chorus effect add further sonic depth.

  The Synthex includes dual and layer modes for sound stacking, plus a four-track sequencer capable of outputting MIDI data on two tracks. With 40 preset and 40 user memory slots, a 61-key keyboard, and MIDI connectivity, it bridges the gap between vintage analog warmth and modern workflow needs. Notable users include Jean Michel Jarre, Stevie Wonder, Nick Rhodes of Duran Duran, and Tangerine Dream.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 16 DCOs (2 per voice)
  - Filter: Curtis chips - 24dB lowpass, 12dB highpass, 12dB and 6dB bandpass
  - VCA: ADSR envelope
  - Effects: Chorus, digital ring modulator
  - Sequencer: 4-track
  - Keyboard: 61 keys
  - Memory: 40 preset / 40 user
  - Control: MIDI
releaseDate: "1981"
releaseDateYearOnly: true
