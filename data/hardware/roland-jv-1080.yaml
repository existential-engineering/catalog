description: >-
  A 64-voice polyphonic rack-mount synthesizer from 1994 with 16-part
  multitimbral capability and four expansion slots, widely adopted by film
  composers and electronic music producers.
details: |-
  The Roland JV-1080 became one of the most sought-after digital synthesizers of the 1990s, finding its way into the setups of film score composers, professional producers, and hobbyists alike. Its combination of high polyphony, flexible architecture, and exceptional expansion potential made it a studio staple for nearly a decade.

  The unit ships with 8MB of onboard samples and offers four expansion slots plus two data card memory slots, allowing users to expand the available sound content up to 42MB. Expansion cards span a wide range of genres including techno, world instruments, orchestral, and classic synthesizer emulations. Internal memory holds 640 patches and 128 performances.

  Sound design is powered by a sophisticated engine featuring two LFOs with multiple waveform options including sine, saw, square, triangle, trapezoid, sample-and-hold, random, and chaos modes. The time-variant filter offers low-pass, band-pass, high-pass, and peak modes with cutoff, resonance, key follow, and velocity sensitivity. A large LCD screen and extensive MIDI implementation facilitate deep editing.

  The JV-1080 was used by Faithless, Hardfloor, Vangelis, Scanner, Roni Size, LTJ Bukem, and Apollo 440, reflecting its broad appeal across electronic, ambient, and film scoring applications. External editors like MOTU's Unisyn simplified the otherwise intensive patch editing process.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Sample Memory: 8MB (expandable to 42MB)
  - LFO: 2 (sine, saw, square, triangle, trapezoid, S&H, random, chaos)
  - Filter: TVF (low-pass, band-pass, high-pass, peak)
  - Memory: 640 patches, 128 performances
  - Expansion: 4 slots, 2 data card slots
  - Control: MIDI
  - Form Factor: Rack-mount
releaseDate: "1994"
