details: |-
  The S-series samplers from Akai are most likely the best 16-bit samplers in the world. The most radical feature about these great samplers is that they are very synth-like. Aside from outstanding sampling specs such as 44.1kHz 16-bit stereo sampling with tons of RAM (8 to 32 MB) and extensive editing capability, the S3000 series have excellent synth-like filters with resonance, 32-voice polyphony, full digital onboard effects (delay, chorus, reverb, etc.) two LFOs, and complete MIDI implementation with MTC and SMPTE.

  The S3000XL has the same specs as the S3000. But it comes with most of the options already installed. That includes the built-in hard-disk recording option, added filters, SCSI interface, digital I/O, additional optional effects and a SMPTE reader/generator.

  The S3200 differs from the S3000 by coming with the added Digital filter expansion board and a magneto-optical storage drive option. Also, the Digital I/O, SCSI and SMPTE interfaces are standard features on the S3200.

  Some other models in the series include various options such as built in CD drives (S3000CD) or internal hard disks (S3000i). The S-series samplers are THE professional standard and are used by everybody in all styles of music, especially the sampling-intensive styles of music such as HipHop, Techno, Trance, House, Industrial and Ambient. S3000 series samplers are used by William Orbit, Moby, Apollo 440, Fluke, Hardfloor, Goldie, Plastikman, Olive, LTJ Bukem, Eat Static, Dave Holmes, Underworld, Fatboy Slim, Faithless, Future Sound of London, Sneaker Pimps, Pet Shop Boys, and A Guy Called Gerald.
specs: |-
  - Polyphony: 32 voices
  - Sampling: 16-bit, 44.1 or 22.05 kHz, up to 255 samples
  - Memory: 8 MB to 32 MB RAM
  - LFO: 2 LFOs
  - Filter: Digital moving low-pass filter (-12 dB/octave with resonance)
  - Envelope: 2 digital envelope generators
  - Effects: 50 effects (echo, delay, chorus, pitch shift, reverb)
  - Storage: 3.5-inch 2HD/2DD floppy disk
  - Optional: Hard disk recording, SCSI interface, magneto-optical drive, digital I/O, SMPTE reader/generator, EB-16 Multi Effector board
  - Control: MIDI with MTC and SMPTE
releaseDate: "1996"
