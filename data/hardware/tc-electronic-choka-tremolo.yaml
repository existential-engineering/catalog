details: |-
  Tremolo is one of the most subtle and easy-to-use modulation effects, and should be part of any good amp – but sadly, that’s not always the case. CHOKA TREMOLO’s brings this sweet vibe to your setup with an intuitive 3-knob layout that lets you crank out fast waves that can either cut deep or shallow furrows across your tone, or build slow tides that ebb and flow with just the right amount of white-capped, tube-laden goodness to produce the ultimately-sublime surf tone. Surf’s up, bro! Hang loose!    •    Vintage style tremolo pedal    •    All-analog circuitry    •    True Bypass

  CHOKA features an LFO knob that lets you seamlessly fine tune the waveform to your specific sound. You can either go totally triangle mode for classic California tube amp tone, or full-on square mode for dramatic chopping riffs. Of course, you can always choose the happy middle ground – and set your course to the exact spot between the waves where your sound lies.

  With true all-analog circuitry at its heart, CHOKA TREMOLO is as warm and organic sounding as a Southern California beach. The surf sounds of the sixties are easily within reach, but CHOKA is equally at home in more modern settings with plenty of hard chop on tap. With versatile controls over Speed and Depth and its low noise operation, CHOKA covers everything from surf to Motown to nu-metal and beyond.

  Built from solid metal, and strong enough to stand up to a tidal wave, CHOKA TREMOLO is one reliable dude. The inner workings are also made from high quality materials, with an all-analog circuit and true bypass technology won’t wipe out your tone when CHOKA is switched off.
