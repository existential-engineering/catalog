description: An 8hp Eurorack utility and audio mixer with four cascading
  channels offering CV/offset generation, attenuation, attenuversion, and visual
  LED feedback.
details: |-
  It's only utility (and audio) mixer you will ever need - but you may want more than one. Did you just yawn ? You think utilities are that boring? I disagree. Take a look at the Mixture. Four cascading channels, each offering precision CV and offset generation with long, smooth faders for attenuation and attenuversion, as well as LEDs for visual feedback. It's more than a precision mixer - in fact, you will probably find use for it in every patch. You can add CV, subtract signals, invert phases, create submixes, attenuate LFOs, have a four-to-one audio mixer or two independent two-to-one mixers, each channel can do entirely their own thing, or you can mix and match between all of the above. The Mixture is a truly flexible utility mixer that will prove useful in almost any patch you can think of, without taking up much space at all. If this was an ad on daytime television, this would be the part where I show you a housewife in a black and white sequence gathering up ten different kitchen appliances with frustration and sadness. That's you, right now, that's you with a bunch of different mixers, precision adders, inverters, attenuverter modules, all kinds of stuff. I want you to liberate yourself from all of those and replace them with this - all the same functions, in a whole lot less space, without compromise.
specs: |-
  - High-end components for precision mixing and CV generation
  - Excellent for both audio as well as CV
  - Immediate visual feedback through front panel LEDs
  - Cascading design makes for countless uses
