description: Erica Synths Black Double Bass is unique module that combines two
  transistor suboscillators (-1 and -2 octaves) and lowpass filter. It does not
  make sound on its own, but it will turn any VCO or beeper into massive bass
  sound with CV control over octave mix and cutoff frequency. Sync input that
