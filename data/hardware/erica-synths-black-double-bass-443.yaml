details: |-
  Erica Synths Black Double Bass is a module that combines two transistor suboscillators, at -1 and -2 octaves, with a lowpass filter. It does not make sound on its own, but it will turn any VCO or beeper into a massive bass sound with CV control over octave mix and cutoff frequency.

  A sync input that resets the suboscillators on an incoming pulse provides even more versatility in sound design. The module can also provide aggressive distortion when used with percussive sounds like bass drums.

  The Double Bass module is not an audio source by itself and needs an audio input.

  Fade between the two suboscillators is controlled manually and by CV, as is the lowpass VCF. Individual outputs of the suboscillators, a signal Thru output, CV level attenuators and a limiter on the output to avoid clipping round out the panel.

  Audio input level spans -5V to +5V and CV level covers -5V to +5V across the full sweep. The module is 10HP wide and 35mm deep, drawing +50mA and -39mA.
specs: |-
  - Two transistor based -1 and -2 octaves suboscillators
  - Manually and CV controlled fade between suboscillators
  - Manually and CV controlled lowpass VCF
  - Suboscillator synchronisation input
  - Individual outputs of suboscillators
  - Limiter on the output to avoid clipping
  - Signal Thru output
  - CV level attenuators
  - Audio input level -5V - +5V
  - CV level (full sweep) -5V - +5V
  - Power consumption +50mA, -39mA
  - Module width 10HP
  - Module depth 35mm
