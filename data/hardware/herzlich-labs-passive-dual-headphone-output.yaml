description: A passive Eurorack module that accepts mono or stereo input and
  splits it to two stereo TRS headphone outputs for shared listening.
details: |-
  The 0hp Headphone Output is a low-cost, no frills solution to a problem every beginner Eurorack enthusiast faces: how to get sound out of your machine in a manner that will not annihilate your hearing. The unit accepts both mono and stereo inputs, and outputs the signal to two stereo TRS headphone jacks, where you can simply plug your desired listening apparatus (apparatii?) in and listen. If you plug only a mono signal in (in the Left channel) the signal is normalized to both the left and right channel, so you won't only be listening to a left channel. It's still mono, but at least you can hear something! With new high quality potentiometers and hardware, this solution will appeal to anyone seeking to get some audio for themselves and a friend in a hurry, either as a 0hp module or a 1U device in your favourite Eurorack synthesizer.
