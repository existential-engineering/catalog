description: >-
  The Elka EM-44 is a digital FM-based synthesizer module released in 1986, featuring 18
  voices of polyphony and 8 oscillators. It is the desktop module version of the Elka
  EK-44 keyboard, produced by the Italian manufacturer Elka. The instrument was positioned
  as a competitor to the Yamaha DX7, with sound preset naming conventions that mirrored
  DX7 instruments.
details: |-
  The EM-44 was released in 1986 as a multi-timbral module succeeding the analog EK-22. Elka made the switch from analog to digital when expanding on the features inherited from the EK-22, and sound preset naming conventions mirrored DX7 instruments to market its FM synthesis capabilities.

  The module includes 8 oscillators that can either be adjusted separately or edited simultaneously. The front panel features Preset Bank and Preset Selector sections to the left of the LCD screen, with a Performance Registration section below it. Right-side controls manage volume and other parameters, while the rear panel provides stereo and headphone outputs, MIDI connectivity, and cartridge slots.

  The LCD display is fairly readable from most angles in well-lit environments but lacks backlighting, creating challenges in low-light conditions. Documentation scarcity compounds usability difficulties for new operators unfamiliar with the interface design.

  The module version of the synth sold for only slightly less than the keyboard version, which meant most users opted to pay the difference for the EK-44 keyboard. This has made the EM-44 comparatively rare on the used market today.
specs: |-
  - Polyphony: 18 voices
  - Multitimbral: 8 parts
  - Oscillators: 8
  - Waveforms: Sawtooth, Sinewave, Random, Square
  - LFO: 1 LFO with Saw Down, Sine, Square
  - Envelope: 1 with Attack, Decay, Sustain, Release, Rate 1, Level 1
  - Effects: Chorus
  - Connections: MIDI In/Out/Thru
