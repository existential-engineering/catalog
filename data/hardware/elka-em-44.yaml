description: >-
  The Elka EM-44 is a desktop module version of the EK-44 FM synthesizer, offering 18 voices of polyphony and 8-part multitimbrality in a compact rack-friendly format.
details: |-
  The EM-44 is Elka's desktop module take on their EK-44 keyboard synthesizer, sharing identical FM synthesis architecture in a more compact form factor. Released in 1986, it targets the same sonic territory as Yamaha's DX7, even adopting similar sound naming conventions for its factory presets.

  Under the hood, the EM-44 provides 18 voices of polyphony with 8-part multitimbral capability, driven by 8 oscillators generating sawtooth, sine, random, and square waveforms. An LFO with saw down, sine, and square shapes adds modulation, while an ADSR envelope shapes dynamics. A built-in chorus effect adds width to the sound.

  The front panel features an LCD display (without backlighting), preset bank selectors, and performance registration controls. MIDI In, Out, and Thru connections handle external communication. While the module version sold for less than its keyboard counterpart, users often note that the EK-44's keyboard was considered its best feature, and the module's lack of parameter documentation can make deep editing a challenge.
specs: |-
  - Polyphony: 18 voices
  - Multitimbral: 8 parts
  - Oscillators: 8
  - Waveforms: Sawtooth, Sine, Random, Square
  - LFO: 1 (Saw Down, Sine, Square)
  - Envelope: 1 ADSR
  - Effects: Chorus
  - Control: MIDI In/Out/Thru
