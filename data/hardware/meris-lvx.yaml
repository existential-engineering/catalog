description: Modular Delay System with pro audio heritage, advanced processing
  and high performance signal path.
details: |-
  LVX is a Modular Delay System which breaks the paradigm of pre-set delay types in favor of freedom and flexibility. A completely new UI and user experience has been designed from the ground up to make LVX immediately intuitive to navigate. The architecture of LVX allows ultimate creative freedom to design a custom delay. The pedal features discrete processing elements and control signal modifiers that can be connected as desired for nearly infinite flexibility in crafting custom sounds.

  LVX offers 2540mS of highly configurable dual delay via an advanced ARM processor, with configurable delay structures, types, and processing elements for extensive customization. New processing elements include Preamps, Granulize, Cassette, and Poly Pitch, alongside a true stereo 60-second looper, 99 preset locations in 33 banks, an instant-access tuner, and a deep modifier section that routes control signals to processing parameters.

  LVX provides stereo input and output with separate jacks for each, MIDI in and out over standard five-pin DIN jacks, a dedicated expression pedal jack, and a USB-C port for firmware updates and MIDI over USB. Switchable input and output headroom accommodates instrument or line/synth levels, and the unit runs on 9V DC power.
specs: |-
  - 2540mS of highly configurable dual delay
  - Conversion: 24-bit A/D and D/A
  - DSP: 32-bit floating point
  - Sample Rate: 48000 Hz
  - Input Impedance: 1 Meg Ohm
  - SNR: 115 dB Typical
  - Frequency Response: 20Hz-20kHz
  - Max Input Level: +9 dBu (instrument level setting), +12.5 dBu (line/synth level setting)
  - Power: 9V DC center-negative, 300mA, 2.1mm jack
  - Bypass: Selectable True Bypass (Relay) or Analog Buffered Bypass
  - Dimensions: 7.25" wide x 4.5" long x 2" tall
  - Weight: 24 ounces
