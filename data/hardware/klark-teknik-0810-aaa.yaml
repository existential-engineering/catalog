url: https://www.klarkteknik.com/en/products/0810-AAA
description: The DN 30T is a compact Dante audio transmitter that takes an
  analogue source and puts it on a Dante network, connecting to any Dante
  equipped receiver such as the Klark Teknik DN 30R. Its high headroom design
  and 96 kHz analogue to digital conversion are intended to carry sound quality
  from any audio source onto the network.
details: |-
  The DN 30T connects to any Dante equipped receiver, such as the Klark Teknik DN 30R, over a standard network cable.

  Balanced or unbalanced 1/4", RCA or stereo 1/8" cables can be used for connecting a smartphone, tablet, microphone or instrument.

  Input levels are adjusted with the level knob on the unit.
specs: |-
  - 96 kHz analogue to digital conversion
  - High headroom input design
  - Dante network audio transmitter
  - Accepts balanced or unbalanced 1/4", RCA and stereo 1/8" sources
  - Front-panel input level knob
