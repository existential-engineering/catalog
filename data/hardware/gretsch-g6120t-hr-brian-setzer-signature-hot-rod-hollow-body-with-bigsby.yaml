details: |-
  Without a doubt Brian Setzer is one of the most exciting and impressive musicians of our time, with an enduring legacy fronting the Stray Cats and the Brian Setzer Orchestra.

  Gretsch is thrilled to be a part of Setzer's pivotal legacy with the G6120T-HR Brian Setzer Signature Hot Rod Hollow Body with Bigsby, a truly rocking instrument boasting as much swagger as the man himself.

  The hollow body features 1959-style trestle bracing for enhanced resonance and articulation. A pair of TV Jones Brian Setzer Signature Filter'Tron pickups deliver the sound that defines Setzer's signature tone, paired with a streamlined master volume and 3-position pickup toggle. Gotoh locking tuners, a pinned Adjusto-Matic bridge and a Bigsby B6C tailpiece round out the stage-ready hardware package.
