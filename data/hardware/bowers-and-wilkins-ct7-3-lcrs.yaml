description: Experience home cinema as it was meant to be heard. The CT7.3 LCRS
  has a pair of 8in bass drive units along with a dedicated Aramid Fibre FST
  midrange for unparalleled intelligibility, clarity and definition.
details: |-
  CT7.3 LCRS is the largest of the three CT700 Series Custom Theater screen speakers, a three-way vented-box design carrying a 25mm (1in) cloth dome tweeter, a 150mm (6in) Aramid Fibre cone FST midrange driver and a pair of 200mm (8in) paper/Aramid Fibre bass drivers. LCRS means it is a single model usable for left, centre, right or surround duty anywhere in a home theater system, so a whole installation can be built from matched cabinets.

  It is a passive loudspeaker: there is no on-board amplifier and no mains connection, and it is driven from an external power amplifier or a channel of a distribution amplifier. Bowers & Wilkins quotes 50W to 200W into 8 ohms on unclipped programme, a nominal 8 ohm impedance with a 3.0 ohm minimum, and 92dB sensitivity at 2.83V and 1m.

  The speakers can be built into existing or custom-designed home theater cabinetry or wall mounted. Four adhesive rubber feet are supplied for cabinet installation, and the manual advises filling any gap wider than about 20mm around the cabinet with carefully cut upholstery or fire-rated acoustic foam, flush with the front panel, to improve the acoustic result. For wall mounting, four M6 tapped inserts in the back panel take the two supplied brackets (both must always be used, with two adhesive rubber spacers to cushion the cabinet against the wall), and four more M6 inserts in the underside accept ball-joint style brackets on 127mm x 69.9mm mounting hole centres.

  Positioning follows normal home theater practice: front left and right cabinets sit either side of the screen on the horizontal centre-line and within about 0.5m of its edges to keep the sound image in scale, the centre channel goes directly above or below the screen (or centrally behind an acoustically transparent one), and surround channels go above and to either side of, or behind, the listening position. The black fabric grille is magnetically attached and removable.

  The rear panel offers two ways in. A pair of binding post terminals takes stripped wire quickly, red for positive and black for negative, while a Neutrik SpeakOn socket gives a more secure locking connection using the +1 and -1 terminals; a SpeakOn plug is supplied. Two port plugs also ship in the carton: fitting the foam plugs in the Flowport tubes reduces bass volume where a room is reinforcing the low end. Maximum recommended cable impedance is 0.1 ohms, and a low-inductance cable is advised to avoid attenuating high frequencies.
specs: |-
  - 3-way vented-box system
  - Drive units: 1x ø25mm (1in) cloth dome tweeter, 1x ø150mm (6in) Aramid Fiber cone FST midrange driver, 2x ø200mm (8in) paper/Aramid Fiber bass drivers
  - Frequency range: -6dB at 36Hz and 28kHz
  - Frequency response: 42Hz to 22kHz +/-3dB on reference axis
  - Dispersion: within 2dB of reference response over a 60 degree horizontal arc and a 10 degree vertical arc
  - Sensitivity: 92dB SPL (2.83V, 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m) under 1% from 50Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Crossover frequencies: 350Hz and 4kHz
  - Recommended amplifier power: 50W to 200W into 8 ohms on unclipped programme
  - Maximum recommended cable impedance: 0.1 ohms
  - Dimensions: 360mm (14.2in) H x 606mm (23.9in) W x 265mm (10.5in) D cabinet depth; 288mm (11.3in) depth with grille
  - Net weight: 21.5kg (47.9lb)
  - Passive: no on-board amplifier and no mains inlet, driven from an external power amplifier
  - Rear panel connections: one pair of binding post terminals plus one Neutrik SpeakOn socket
  - Nautilus tube-loaded tweeter, FST midrange and Flowport bass loading
  - Magnetically attached removable black fabric grille
  - Wall mounting: 4x M6 inserts in the back panel for the two supplied brackets, 4x M6 inserts in the underside for ball-joint brackets on 127mm x 69.9mm (5in x 2.75in) centres
  - Supplied accessories: 4x adhesive rubber feet, 2x adhesive rubber spacers, 2x port plugs, 1x SpeakOn plug, 2x wall brackets, 4x M6 bolts
  - Stray magnetic field: keep magnetically sensitive items at least 0.5m (20in) away; LCD and plasma screens unaffected
  - Finish: Black
