details: |-
  BAD COMRADE PEDAL

  (Glitch, Pitch, Slice, and Dice)

  Is it a distortion pedal? Is it a ring modulator? Delay? Just call it the Bad Comrade, the world's first hand-wired glitch, pitch, slice, and dice pedal. For the adventurous guitarist (or anyone wielding a 1/4" jack) who craves unthinkable tones. The Bad Comrade lets you distort, modulate, glitch, and slice on the fly. Designed and assembled in Seattle, Washington. O perates on a standard 9Vdc Boss-style power supply (not included). Components and cosmetic details may vary based on availability. * Important: power up the Bad Comrade with Glitch and Time wide open. Bad Comrade manual

