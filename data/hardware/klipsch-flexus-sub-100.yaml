description: The Flexus Sub 100 is a compact 10" wireless subwoofer engineered
  to deliver powerful, musical bass in a small footprint. It is powered by Onkyo
  amplification and uses Klipsch transport technology for low-latency wireless
  connection to compatible Flexus soundbar systems.
details: |-
  The Flexus Sub 100 is part of Klipsch's Flexus home theater ecosystem, designed to pair with Flexus Core soundbars (Core 100, 200, and 300) and Flexus Surround speakers. Despite its compact size, the 10-inch driver is engineered to provide depth and musicality typically associated with larger subwoofers.

  The subwoofer is powered by Onkyo, combining Klipsch's acoustic engineering heritage with Onkyo's amplifier expertise. Wireless connectivity uses Klipsch's proprietary transport technology, which is engineered for low-latency performance suitable for home theater use.

  Users control the Sub 100 through the Klipsch Connect Plus app, which provides access to EQ presets, a custom EQ mixer, Night Mode, Dialogue Boost, and volume control. The subwoofer also supports dual-sub configurations to smooth out room bass peaks and nulls for more even bass distribution.
