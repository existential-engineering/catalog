name: PC100USB-HR2
manufacturer: fostex
primaryCategory: headphone-amp
url: https://www.fostex.jp/en/products/pc100usb-hr2/
description: USB bus-powered volume controller with a built-in high-resolution DAC, RCA line outputs for active speakers and a headphone output, giving fingertip control of PC audio at up to 24 bit/96 kHz.
details: |-
  More fun with PC audio, with easy control of high-resolution sound quality at your fingertips. The PC100USB-HR has undergone a model change and now shares the same design as the PC Hi-Res series, adopting a square form with a small black body and a large silver volume knob made of machined aluminum.

  Basic functions are the same as those of the PC100USB-HR, a 24 bit/96 kHz high-resolution version of the PC100USB, which became a standard PC gadget with convenient volume control at the user's fingertips.

  It is equipped with a DAC, RCA pin jacks (output) for connection to active speakers such as the PM series, and a PHONES jack for connecting headphones, so it can also be used as a headphone amplifier. When headphones are connected to the PHONES jack, audio is not output to the RCA pin jacks.

  USB bus-powered operation eliminates the need for a separate power source. It operates with the Windows and Mac OS standard USB audio drivers and cannot be used with playback software that requires a dedicated driver other than the OS standard USB Audio driver.

  One USB 2.0 cable (AB type, 1 m) and two RCA pin cables (1 m) are included so the unit can be connected to a PC and to active speakers without buying further cables. Operation may become unstable on some Macs with the M1 chip; connecting through a USB hub resolves the symptom.
specs: |-
  - USB terminal: USB connector B
  - Supported sampling frequency: 32, 44.1, 48, 88.2, 96 kHz
  - Quantization bit rate: 16/24 bit
  - Supported OS: Windows 7 or higher, Mac OS X V10.6 to macOS 10.12 Sierra
  - OUTPUT (L, R): RCA pin jacks, applicable load impedance 10 kohm or more, rated output level +6 dBV (0 dBFS)
  - PHONES jack: 3.5 mm stereo mini jack, applicable load impedance 32 ohm or more, maximum output 30 mW + 30 mW (32 ohm load, THD 0.5% or less)
  - External dimensions: 66 (W) x 44 (H) x 70 (D) mm (excluding feet)
  - Weight: approx. 210 g
  - Power supply: USB bus power (5 V, 500 mA)
  - Accessories: USB 2.0 cable (AB type, 1 m) x 1, RCA pin cable (1 m) x 2
  - Complies with the European RoHS Directive
