details: |-
  Altec Lansing HydraBlast 2.0 EVERYTHINGPROOF Speaker

  Take your music anywhere with the Altec Lansing HydraBlast 2.0 EVERYTHINGPROOF Speaker. Built for adventure, this rugged Bluetooth speaker is IP67 waterproof, dustproof, shockproof, and even floats in water. Mount it, clip it, or stick it to most metal surfaces using the included mount, carabiner, and built-in magnet. Enjoy up to 20 hours of playtime, vibrant HyperEdge LED light modes, and powerful wireless audio with a 100-foot Bluetooth range. Charge your phone on the go with the built-in USB-A charger or Qi wireless charging pad, and connect 100+ Hydra 2.0 speakers together with Party Sync for an epic sound experience. Features:

  Perfect for the beach, pool, camping, hiking, tailgates, and outdoor adventures.
