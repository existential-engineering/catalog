description: 4-channel mixer with FX send.
details: |-
  EDU DIY Output Mixer 2, the mixer for the EDU DIY Drum system, allows a 4-channel output mixer to be built and understood from scratch. On a breadboard the builder sets up an inverting summing amp, adds a send and return loop, diode distortion, and a headphone driver.

  The manual uses clear diagrams and analogies to explain every step, and the kit can then be assembled into a full Eurorack module using the included PCB and panel.

  The learning path covers mixing basics (op-amp summing, volume controls, per-channel sends, a clean return path), distortion design (diode soft-clipping and variable distortion) and headphone driver design (DC blocking, high-current output, driver stability).

  Once assembled, the finished Eurorack Output Mixer module offers 4 input channels with per-channel volume controls, a send and return loop with per-channel send controls and a return control, a variable distortion insert effect, and line and headphone outputs.

  The box holds all components for the breadboard build, the Eurorack panel and PCB for final assembly, a power cable, and a 40 plus page illustrated PDF manual as a digital download. A breadboard, jumpers and a dual supply are needed as well, or Labor, the purpose-built prototyping platform for these learning kits. Skill level is intermediate and basic electronics knowledge is needed. The kit is part of the mki x es.EDU Drums System lineup, a collaboration between Erica Synths and Moritz Klein.
specs: |-
  - 4 input channels with per-channel volume controls
  - Send/return loop with per-channel send controls and return control
  - Variable distortion insert effect
  - Line and Headphone outputs
  - Eurorack panel + PCB for final assembly
  - Power cable included
  - All components for the breadboard build
  - 40+ page illustrated PDF manual as digital download
  - Skill level: Intermediate
