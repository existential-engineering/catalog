id: I_JvBDWS71j8wJLFVhfsP
name: AXS Console
manufacturer: api-audio
primaryCategory: console
url: https://apiaudio.com/product/legacy-axs-console/
description: Large-format analog recording console with 32–80 expandable
  channels, full-complement 200-series and 500-series modules per channel, 24
  main buses, 5.1 surround monitoring, on-board patchbay, 2500C stereo bus
  compressor, and optional Final Touch Automation.
details: '32–80 channel analog console (expandable in 16-channel increments).
  Each 1.5-inch-wide channel includes 200-series modules (212 Mic Pre, 225
  Compressor, 235 Noise Gate, 215 HP/LP Filter, 205 DI) plus 500-series EQ slots
  (550A 3-band + 560 graphic). Dual-fader: 100 mm motorized main + 45 mm
  secondary. 24 main buses, 12 aux sends, 3 stereo buses, 6 stereo echo returns
  (automated faders). 2500C Stereo Bus Compressor standard. 5.1 surround
  monitoring. On-board patchbay (32/48-ch); remote patchbay for 64+ ch. Optional
  Final Touch Automation (self-contained, 7.5" touchscreen, motorized faders,
  unlimited mix restore, DAW control via unity-gain bypass). 5-year warranty.'
specs: |-
  - Channel configurations: 32–80 (expandable in 16-ch increments)
  - Channel width: 1.5"
  - Main fader: 100 mm motorized
  - Secondary fader: 45 mm
  - Main buses: 24
  - Aux sends: 12
  - Stereo buses: 3
  - Echo returns: 6 (automated faders)
  - 200-series modules: 212, 225, 235, 215, 205
  - 500-series EQ slots: 550A + 560
  - Monitor: 5.1 surround
  - Patchbay: on-board (32/48-ch), remote (64+ ch)
  - Warranty: 5 years
