details: |-
  The DN43 is an analog-to-Dante (or AES67) interface for the AUDIX M3 tri-element microphone, plus one additional analog microphone, featuring selectable pre-amp gain, low- and high-pass filters, and LED logic control.

  The DN43 microphone interface is a key part of the AUDIX Dante | AES67 Integrated Microphone System, the fast, trouble-free way to stream AUDIX audio performance through Ethernet networks. High-quality audio and all microphone functions – including on-off contact closure and LED status indicators – are available through a single Shielded CAT cable with RJ45 connections at both interface and microphone. This simple configuration eliminates wiring errors, accelerates installation, and reduces cost.

  The DN43 features one microphone input specifically designed for the AUDIX M3 tri-element microphone and one input for AUDIX RJ45-equipped, single-element microphones. It has two 5V logic outputs per port, with source/sink capability for LEDs that are controlled by network-connected DSPs. Low-pass and high-pass filter settings are available on each audio channel, as are eight selectable gain levels, with all settings configurable via software.

  Designed, assembled, and tested by AUDIX in the USA.
specs: |-
  - High-fidelity 24-bit, 48kHz audio
  - Balanced audio inputs with RFI filtering
  - 48V phantom power output
  - Each channel has selectable pre-amp gain, as well as low and high-pass filters
  - All channels controlled independently
  - Flash memory prevents loss of settings in the event of power loss
  - Compatible with the M3 tri-element microphone (DN43 only), the flush-mount, steerable M70WD ceiling microphone, and the M55WD ceiling microphone
  - Supports AES67 audio streams
  - Dante Domain Manager (DDM) ready
  - Dynamic or static IP address
  - Evaluated to the requirement of UL2043 and is suitable for use in above-ceiling applications
  - Operates on PoE from any IEEE 802.3af compliant equipment
