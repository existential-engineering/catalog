details: |-
  16 track production sampler

  The TORAIZ SP-16 sampler and step sequencer is the first in our line-up of music production tools for DJs and producers. We’ve partnered with the legendary synth creator Dave Smith to add his Prophet-6 analogue filters, so you can give your creations a rich, analogue warmth and presence. Use the TORAIZ SP-16’s simple layout and large touch screen for producing, or as a stand-alone unit in the DJ booth to enhance performances. You can load or record live samples, create patterns, add FX, loops, and manipulate their parameters to make the music your own.
