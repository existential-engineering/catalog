url: https://www.mrblackpedals.com/products/downward-spiral-unicorn-tears-special-edition
description: A modulated delay whose repeats pitch-shift ever downward into an
  endless, self-oscillating abyss, offered here as a limited "Unicorn Tears"
  rainbow special-edition finish of the standard Downward Spiral.
details: |-
  The Downward Spiral is a modulated delay in which each repeat is pitch-shifted downward, so echoes tumble endlessly toward a bottom that never arrives. As the feedback builds, the repeats cascade into a mesmerizing, perpetual self-oscillation, spinning down into the abyss where, as Mr. Black puts it, the echoes of infinity are reborn anew.

  The effect suits ambient and textural playing, drone beds and dramatic descending swells, taking a simple phrase and letting it spiral into an ever-deepening pool of sound.

  This "Unicorn Tears" edition is a limited-run rainbow finish of the standard Downward Spiral. The circuit and algorithm are unchanged from the regular model, and only the graphic finish differs.

  It runs on standard 9V pedalboard power or an internal battery and uses true-bypass switching.
specs: |-
  - Modulated delay with downward pitch-shifted repeats
  - Mesmerizing, endless self-oscillation
  - "Living" Time control
  - Input Impedance: ~500KΩ
  - Output Impedance: ~2KΩ
  - True-Bypass
  - 9VDC 2.1mm negative center-pin power or internal 9V battery (not included)
  - <60mA current draw (≥100mA recommended)
