description: >-
  An early professional keyboard sampler from Roland offering 12-bit sampling with 16-voice
  polyphony, external CRT monitor support for graphical waveform editing, and a 61-key
  velocity-sensitive keyboard.
details: |-
  Produced from 1986 to 1987, the Roland S-50 was part of Roland's first generation of
  dedicated sampling keyboards. While its 12-bit resolution and limited memory seem modest
  by modern standards, it represented a capable and musically useful instrument in the context
  of mid-1980s sampling technology.

  The S-50 provides 756 KB of sample memory supporting up to 28.8 seconds of total sample
  time at its 15 kHz sampling rate, with variable rates up to 30 kHz available at reduced
  sample duration. The 61-key keyboard responds to both velocity and aftertouch, and the
  instrument can operate in four-part multitimbral mode with four discrete audio outputs.

  One of the S-50's more distinctive features is its support for an external CRT monitor via
  the optional DT-100 Digitizer Tablet, allowing graphic waveform editing that was far more
  intuitive than navigating a small LCD display. The SYS-503 sequencer software added basic
  sequencing capability, while the built-in 3.5-inch disk drive handled sample and patch
  storage. Version 2.0 of the operating system expanded tone capacity from 16 to 32.

  The instrument features digital high-pass and low-pass filters for basic sound shaping.
  Notable users include Vangelis, Duran Duran, and Jimi Tenor. The S-50 sits alongside the
  rackmount S-550 and the more compact S-330 in Roland's S-series sampler lineup of this era.
specs: |-
  - Polyphony: 16 voices
  - Sample Resolution: 12-bit
  - Sampling Rate: 15-30 kHz variable
  - Memory: 756 KB (28.8 seconds at 15 kHz)
  - Multitimbral: 4 parts, 4 outputs
  - Filters: Digital high-pass and low-pass
  - Keyboard: 61 keys with velocity and aftertouch
  - Storage: Built-in 3.5-inch disk drive
  - Control: MIDI
releaseDate: "1986"
