description: >-
  Roland's budget-friendly digital drum machine from 1986, offering 16 PCM drum tones with a
  built-in pattern sequencer and solid MIDI implementation despite its no-frills feature set.
details: |-
  The TR-505 was Roland's entry-level answer to the demand for affordable drum machines in the mid-1980s. While it lacked the cachet of its bigger siblings like the TR-808 and TR-909, it carved out a niche as a capable and portable rhythm companion for bedroom producers and gigging musicians alike.

  Its 16 onboard drum tones are based on PCM samples covering the essentials: kick, snare, open and closed hi-hats, toms, cowbells, congas, and timbales. The sounds are straightforward and unmistakably of their era, with a character that has aged into something of a charm for producers seeking that late-80s digital flavor.

  The sequencer stores 48 user-programmable patterns alongside 48 presets, chainable into 6 songs. What it lacks in individual outputs and sound-editing depth, it makes up for with thorough MIDI support, making it a useful trigger source in larger setups.

  Artists like Vince Clarke and Aphex Twin have put the TR-505 to creative use, proving that limitations can be a springboard for innovation rather than a barrier.
specs: |-
  - Polyphony: 8 voices
  - Sound source: PCM samples
  - Drum tones: 16 (kick, snare, open/closed hi-hat, hi/mid/low tom, hi/low cowbell, conga, timbale, and more)
  - Patterns: 48 user, 48 preset
  - Songs: 6
  - Sequencer: Built-in pattern sequencer
  - Control: MIDI
  - Keyboard: None
