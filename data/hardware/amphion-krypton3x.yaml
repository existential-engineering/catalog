description: The Krypton3X is Amphion's flagship reference floorstanding
  loudspeaker — a 3-way design 25 years in the making, engineered to deliver
  full-range, realistic orchestral performances even in non-optimal listening
  environments.
details: |-
  The Krypton3X is a three-way vented floorstanding loudspeaker featuring a 1-inch titanium tweeter, two 8-inch papyrus midrange drivers, and a side-firing 10-inch aluminum woofer. The combined cone area of the tweeter and midrange units totals 950 cm², up to seven times larger than comparable competing products, enabling substantial air movement while preserving sonic nuance.

  A cardioid midrange design minimizes wall reflections by up to 20 dB, allowing the speaker to perform exceptionally well in small rooms or near large windows. The side-firing 10-inch woofer uses a rigid aluminum cone with extended excursion for controlled, powerful bass response.

  The Krypton3X covers a frequency range of 21–55,000 Hz (−3 dB), with crossover points set at 160 Hz and 1,600 Hz. The speaker presents a 4-ohm nominal impedance with 89 dB sensitivity, recommended for use with amplifiers delivering 100–300 watts.

  Each unit is handmade in Finland and available in three finishes: Walnut, Standard White, and Full Black. Dimensions are 1,400 × 330 × 480 mm, with a weight of 70 kg per speaker.

  The Krypton3X received a HiFi+ Highly Commended Award in 2025.
specs: |-
  - Operating Principle: Three-way, vented
  - Tweeter: 1" titanium
  - Midrange: 2×8" papyrus
  - Woofer: 10" aluminum (side-firing)
  - Crossover Points: 160 Hz / 1,600 Hz
  - Impedance: 4 Ω
  - Sensitivity: 89 dB
  - Frequency Response: 21–55,000 Hz (−3 dB)
  - Power Recommendation: 100–300 W
  - Dimensions (H×W×D): 1,400×330×480 mm
  - Weight: 70 kg (154.3 lbs)
  - Available Finishes: Walnut, Standard White, Full Black
  - Manufacturing: Handmade in Finland
