description: Carnaby HE2 is a 2U 19-inch rack stereo 3-band parametric EQ, an
  evolution of the Carnaby 500, featuring a HarmonicEQ circuit with harmonic
  saturation per channel.
details: |-
  Carnaby HE2 is a 2U 19-inch rack stereo 3-band parametric EQ, an evolution of the Carnaby 500. Each of its two channels runs through a unique HarmonicEQ circuit that adds harmonic saturation as the bands are driven, with the dynamic response increasing saturation and harmonics the harder the signal is pushed.

  The 3-band design pairs parametric LO and HI shelving bands (plus or minus 10dB cut/boost) with a parametric peaking MID band (plus or minus 10dB cut/boost, fixed Q), each independently bypassable. LED indicators show saturation levels for the LO, MID, and HI bands, and plus or minus 20dB input and output level controls are provided per channel.

  Beyond straightforward stereo operation, Carnaby HE2 offers Dual Mono and Mid/Side modes, bypassable Hi and Lo cut filters per channel, and a bypassable balanced 1/4-inch TRS insert per channel (positioned post M/S encoding and pre M/S decoding). True-bypass IN/OUT switching and stepped front-panel controls support precise recall of settings.

  Remote parameter control and preset save/recall are available via USB or the unit's Network (NET) port, using companion Carnaby HE2 Control software (VST3, AU, AAX) alongside onboard firmware.
specs: |-
  - Stereo 2U 19-inch rack-mount 3-band parametric analogue EQ
  - Unique HarmonicEQ circuit per channel with harmonic saturation
  - Parametric LO and HI shelving bands, plus or minus 10dB cut/boost
  - Parametric peaking MID band, plus or minus 10dB cut/boost, fixed Q
  - LED indicators for LO, MID, and HI saturation levels
  - Plus or minus 20dB input and output level controls per channel (1dB steps)
  - Stereo, Dual Mono, and Mid/Side operation modes
  - Bypassable Hi and Lo Cut filters per channel
  - Bypassable balanced 1/4-inch TRS insert per channel (post M/S encode, pre M/S decode)
  - True-bypass IN/OUT switching per channel
  - Stepped front-panel controls for precise recall
  - Remote parameter control and preset save/recall via USB or Network
  - Max input/output level +26.0 dBu (<0.003% THD)
  - Noise floor <-93 dBu with all bands bypassed
  - Input impedance 10 kOhms (Line), output impedance 150 Ohms (Line)
  - HI band: high shelf, 5 kHz - 25 kHz
  - MID band: peak filter, 200 Hz - 6.2 kHz
  - LO band: low shelf, 20 Hz - 420 Hz
  - Hi Cut: progressive slope low-pass, 8 kHz - 40 kHz, up to 3rd order
  - Lo Cut: progressive slope high-pass, 18 Hz - 180 Hz, up to 3rd order
  - Dimensions: 48.3 cm W x 8.9 cm H x 23.6 cm D, 6 kg
  - Carnaby HE2 Control software: VST3, AU, AAX plugin formats
