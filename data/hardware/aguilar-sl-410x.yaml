description: The SL 410x delivers the authority and depth of a classic 4x10 —
  with the balance, clarity, and portability that characterizes the SL Series.
  It features four custom 10" neodymium drivers optimized for tight lows,
  articulate mids, and smooth highs, plus a phenolic tweeter and variable
  tweeter control.
details: |-
  The SL 410x brings the power and authority of a traditional 4x10 configuration
  to the lightweight SL Series platform. Four custom 10" neodymium drivers deliver
  800 watts RMS handling with tight lows, articulate mids, and smooth highs —
  all at a fraction of the weight of conventional ceramic-driver 4x10 cabinets.

  A phenolic tweeter with integral phase plug and custom crossover with variable
  tweeter control allow precise high-frequency shaping. At 49 lbs, it is
  significantly lighter than comparable ceramic designs. Removable casters are
  included for easy transport. Covered by Aguilar's three-year limited warranty.
specs: |-
  - Power Handling: 800W RMS
  - Impedance: 4 ohms
  - Frequency Response: 44 Hz – 16 kHz
  - Sensitivity: 100.3 dB (1W/1M)
  - Drivers: Four 10" neodymium
  - Tweeter: Phenolic with integral phase plug
  - Crossover: Custom with variable tweeter control
  - Dimensions: 23 15/16" H × 21 15/16" W × 15 11/32" D
  - Weight: 49 lbs (22.23 kg)
  - Removable casters included
