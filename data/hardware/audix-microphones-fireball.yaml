details: |-
  The FireBall dynamic instrument microphone is designed for harmonicas (both diatonic and chromatic) and beatbox. Clear, accurate, and capable of handling SPLs in excess of 140 dB without distortion, the FireBall is ideally suited for both live stage and studio recording applications.

  The FireBall microphone has a smooth, uniform frequency response of 50 Hz – 16 kHz, and a cardioid pickup pattern for isolation and feedback control. It is lightweight, compact, and comfortable to hold. The FireBall is manufactured with a precision machined aluminum body, steel mesh grille, and a unique three-stage marbled anodized finish.

  Because the FireBall cardioid instrument microphone is a low impedance microphone, when using with a guitar amplifier, a quality, low-high impedance transformer (see T50k) is required.

  Designed, machined, assembled, and tested by AUDIX in the USA.
specs: |-
  - Type: Dynamic instrument microphone (harmonica / beatbox)
  - Polar pattern: Cardioid
  - Frequency response: 50 Hz - 16 kHz
  - Max SPL: >140 dB
  - Body: Precision-machined aluminum with steel mesh grille
  - Output: Low impedance, balanced XLR
