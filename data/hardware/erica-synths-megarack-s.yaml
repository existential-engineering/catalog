description: The Megarack S is the (slightly) smaller sibling of our Megarack –
  a large Eurorack case that provides exceptional value for money.
details: |-
  The Megarack S is a classically-shaped 6x126 HP all-aluminium case with side panels, featuring Erica Synths custom rails with threaded inserts providing 9A@+12V, 4.5A@-12V and 1A@+5V.

  This monolith provides ample housing for a module collection, all while retaining a sleek elegance not commonly found in cases of this size. It is the (slightly) smaller sibling of the Megarack.

  The case features 2 4-pole XLR connectors for gooseneck lamps, which are not included.

  Dimensions are 707mm x 670mm x 360mm at a net mass of 11.65 kg. Module depth is 80mm in most rows, 60mm above the power distribution boards, and up to 120mm in the inclined rows.

  The case comes without modules installed. The complete system in the product photography is shown for illustration purposes only.
specs: |-
  - 6 rows of 126 HP
  - 9A@+12V, 4.5A@-12V, 1A@+5V
  - Built-in +5V power supply
  - 2 x 4-pole XLR connectors for gooseneck lamps (lamps not included)
  - Custom rails with threaded inserts
  - All-aluminium construction with side panels
  - Dimensions: 707mm x 670mm x 360mm
  - Net mass: 11.65 kg
  - Depth: 80mm for most modules, 60mm above power distribution boards, 120mm max in inclined rows
