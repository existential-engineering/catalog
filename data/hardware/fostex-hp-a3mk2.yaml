name: HP-A3mk2
manufacturer: fostex
primaryCategory: audio-interface
categories:
  - headphone-amp
url: https://www.fostex.jp/en/products/hp-a3mk2/
description: Compact USB DAC and headphone amplifier that operates on USB bus
  power. Converts USB audio (up to 32-bit/192 kHz) and optical S/P DIF digital
  input to analog. Uses the ESS Technology ES9016K2M DAC chip. Provides a 6.3 mm
  stereo headphone output with switchable HI/LO gain, RCA line outputs, and an
  optical S/P DIF digital output. Successor to the HP-A3 with upgraded sampling
  support from 24-bit/96 kHz to 32-bit/192 kHz.
details: |-
  Features:
  - USB bus-powered compact USB DAC
  - Supports USB audio up to 32-bit/192 kHz
  - ESS Technology ES9016K2M DAC
  - Optical S/P DIF digital input (32 to 96 kHz)
  - 6.3 mm stereo headphone output with HI/LO gain switch (10 dB difference)
  - RCA analog line outputs
  - Optical S/P DIF digital output
  - 3-year warranty
  - VGP 2024 Winter Award (Headphone Amplifier, stationary, under 75,000 yen)

  Dimensions: 113 (W) x 34 (H, excluding feet) x 155 (D) mm

  Weight: Approx. 500 g

  Accessories: USB Type-A to Type-C cable (1 m), rubber feet x 4, user manual

  Compatibility: Windows 10; macOS Catalina (10.15) or later (Intel Mac users on macOS Sonoma should update to 14.1.1 or later)
