description: Compact USB DAC and headphone amplifier that operates on USB bus power. Converts USB audio (up to 32-bit/192 kHz) and optical S/P DIF digital input to analog. Uses the ESS Technology ES9016K2M DAC chip. Provides a 6.3 mm stereo headphone output with switchable HI/LO gain, RCA line outputs, and an optical S/P DIF digital output. Successor to the HP-A3 with upgraded sampling support from 24-bit/96 kHz to 32-bit/192 kHz.
details: |-
  This USB DAC operates on USB bus power and supports up to 32 bit/192 kHz. High-quality sound reproduction can be achieved by simply connecting a USB cable to a PC. USB audio and optical digital audio signals from a PC can be converted to analog signals and output from the line output terminal and headphone output terminal.

  When used as a USB DAC, it operates with the USB Audio 2.0 driver of the PC (Windows or macOS) and supports up to 32 bit/192 kHz. S/P DIF input is limited to a maximum of 96 kHz.

  The ES9016K2M from ESS Technology is used as the DAC chip. The supported sampling frequency has been greatly enhanced from the 24 bit/96 kHz of the HP-A3 to 32 bit/192 kHz. The analog circuitry has been newly designed to match the higher supported sampling frequency, improving THD and other performance figures.

  A gain switch accommodates various playback sources: the headphone output amplifier gain can be switched between HI and LO positions, with the HI position providing a 10 dB increase in volume over the LO position. The HI position is effective for low-level input signals.

  Each HP-A3mk2 is assembled at a factory in Japan and carries a 3-year warranty from the date of purchase. The HP-A3mk2 won in the Headphone Amplifier (stationary type, under 75,000 yen) category in the Lifestyle Subcommittee at the VGP 2024 Winter Audio Visual Awards.
specs: |-
  - USB input: USB Type-C connector, up to 192 kHz/32 bit, USB2.0 High Speed interface
  - Supported OS: Windows 10, Mac OS Catalina (OS 10.15) or later
  - Digital input: rectangular optical connector, S/P DIF (32 kHz to 96 kHz)
  - PHONES jack: standard 6.3 mm stereo phone jack, maximum output 100 mW (32 ohm load) / 20 mW (300 ohm load), applicable load impedance 16 ohm min., THD 0.03% or less, frequency response 20 Hz to 20 kHz +/-0.3 dB
  - Analog output (L, R): RCA pin jacks, output level 2 Vrms (0 dBFS VR MAX), applicable load impedance 10 kohm or more, THD 0.005% (1 kHz)
  - Digital output: rectangular optical connector, S/P DIF (output according to Fs of input signal)
  - Headphone amplifier gain switch: HI / LO (10 dB difference)
  - External dimensions: 113 mm (W) x 34 mm (H, excluding rubber feet) x 155 mm (D, including projections)
  - Weight: approx. 500 g
  - Power supply: DC 5 V supplied from the USB terminal (bus powered)
  - Power consumption: 2.5 W
  - Accessories: USB cable (Type-A to Type-C, 1 m) x 1, rubber feet x 4, user's manual x 1
