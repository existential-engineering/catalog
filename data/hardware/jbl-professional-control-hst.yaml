name: Control HST
manufacturer: jbl-professional
primaryCategory: speaker
url: https://jblpro.com/en-US/products/control-hst
description: >-
  Wide-coverage surface-mount installed speaker using HST Technology to position
  a 5-1/4" woofer toward the wall and cancel reflections while dual splayed
  tweeters deliver 180°H x 160°V coverage, with 70V/100V transformer taps and
  IP54 rating for commercial installations.
details: |-
  The JBL Control HST is a surface-mount installed speaker engineered around JBL's patent-pending HST (Horizontal Surface Transducer) Technology. The design deliberately faces the 5-1/4" woofer toward the mounting wall rather than the room, using controlled acoustic cancellation of wall reflections to produce a flatter frequency response and more consistent sound character throughout the listening area.

  The high-frequency section uses two aluminum-diaphragm tweeters with CMMD (Ceramic Metal Matrix Diaphragm) treatment, splayed at angles to achieve an exceptionally wide 180° horizontal by 160° vertical coverage pattern. Neodymium magnets keep weight low while fluid cooling allows sustained high-output operation with low distortion, and polyurethane surrounds provide humidity resistance suitable for challenging environments.

  An integrated multi-tap transformer makes the Control HST compatible with both 70V and 100V distributed audio systems, with selectable power taps at 60W, 30W, 15W, and 7.5W (70V) or 60W, 30W, and 15W (100V). It can also be driven directly at 8 ohms, with IEC power ratings of 100W continuous (400W peak).

  Connections are handled by a removable locking 4-pin euro-block connector accepting wire up to 12 AWG (2.5 mm²). Two pins carry the input signal and two parallel pins provide a loop-thru for daisy-chaining additional speakers without external splitters.

  The enclosure is fiberglass-reinforced ABS with an aluminum color-matched grille, rated IP54 per IEC529. An included zinc-rich powder-coated steel U-bracket provides four M6 mounting points, and an additional M6 insert accommodates a safety cable. Available in black (RAL9004) and white (RAL9016).
specs: |-
  - Frequency Range (-10 dB): 50 Hz – 20 kHz
  - Frequency Response (±3 dB): 68 Hz – 18 kHz
  - Coverage Angle: 180°H x 160°V
  - Sensitivity: 88 dB (avg. 80 Hz – 20 kHz, 1W/1m)
  - Max SPL (1m): 108 dB continuous / 114 dB peak (8Ω)
  - Impedance: 8 ohms
  - Power Rating (IEC): 100W continuous / 400W peak
  - Transformer Taps (70V): 60W, 30W, 15W, 7.5W
  - Transformer Taps (100V): 60W, 30W, 15W
  - LF Driver: 5-1/4" CMMD cone, 25 mm voice coil
  - HF Drivers: Dual splayed tweeters, aluminum CMMD diaphragm, neodymium
  - Connector: 4-pin removable locking euro-block, max 12 AWG (2.5 mm²)
  - IP Rating: IP54 (IEC529)
  - Dimensions: 362 x 256 x 184 mm (14.25 x 10.1 x 7.2 in)
  - Weight: 3.6 kg (8.0 lb) without bracket
  - Enclosure: Fiberglass-reinforced ABS
  - Colors: Black (RAL9004), White (RAL9016)
