description: The JM1 is Josh Meader's signature model, based on the 2010 Carvin
  SH445 with added features such as a pickguard and Lollar Imperial pickups.
  Standard options include a mahogany body, nickel frets and block inlays.
specs: |-
  - Model designation: JM1
  - Construction: set neck
  - Body: mahogany with plain maple top, natural top wood body binding, rear of body natural clear
  - Neck: tung-oiled mahogany with 2-way adjustable truss rod and dual carbon-fiber rods, thinner profile
  - Neck width: 1.69 in at nut, 0.75 in thick at 1st fret, 0.85 in thick at 12th fret
  - Fingerboard: ebony with 14 in radius
  - Frets: 22 regular nickel, .080 in wide x .043 in tall
  - Scale length: 25 in
  - Headstock: carved top with plain maple overlay
  - Bridge: Tune-O-Matic with stop piece, .4125 in (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Pickups: bezel-mounted chrome Lollar High Wind Imperial humbuckers
  - Electronics: 2 volume, 2 push/pull tone with coil splitter, 3-way pickup selector
  - Pickguard: black multi-layered
  - Inlays: white pearl blocks, black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Body dimensions: 39 in long, 1.85 in thick, 14.1 in wide
  - Weight: 7.5 lbs
  - Strings: Elixir Nanoweb 1046E
