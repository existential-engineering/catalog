description: Get close to your sounds—or not Jam on headphones or get a quick
  stereo output to the PA mixer or your DAW with the 1/4" TRS jack. Mono patch?
  No problem, the left input is normalled to the right.
details: |-
  This is a simple 1U module designed to allow the monitoring of a system using headphones. However, if your cat isn't easily scared, the headphone jack doubles as a TRS stereo line level output. Simply connect the signal that you want to monitor to the 1/8″ jacks, plug in your headphones, and adjust the volume as desired.

  Features include a low noise headphone amp capable of driving high impedance studio headphones, effectiveness as a line level stereo output, and a left Eurorack input that is normalled to right for dual mono or discrete stereo operation.
specs: |-
  - Width: 10HP
  - Depth: 32mm
  - Power consumption: 30mA @ +12V, 30mA @ -12V
  - Low noise headphone amp capable of driving high impedance studio headphones
  - Doubles as a line level stereo output
  - Left Eurorack input normalled to right for dual mono or discrete stereo operation
