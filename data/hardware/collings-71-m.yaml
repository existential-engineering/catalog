description: The 71 M is an offset solid body electric guitar emerging from a
  lineage of beloved offset instruments, elevated with unmistakable Collings
  craftsmanship. It features a solid ash body with a mortise & tenon set-neck
  construction, hard maple neck, rosewood fingerboard, and Lollar JM-style
  pickups. Expressive tone and resonance are at the forefront, complemented by a
  Mastery Offset bridge and vibrato tailpiece finished in antiqued
  nitrocellulose lacquer.
details: |-
  Emerging from a lineage of beloved offset instruments, the 71 Series elevates a classic design with unmistakable Collings craftsmanship. The 71 M features a solid ash body with mortise & tenon neck joint, a hard maple slab-sawn neck, and a rosewood fingerboard with 5mm non-tapered pearl dots and narrow-tall frets. Scale length is 25 1/2" with a 1 11/16" nut width and 10" fingerboard radius. Electronics include Lollar JM-style pickups (P90 bridge, Blademaster neck) with a 3-way blade selector, volume and tone controls, series/parallel wiring, 500K pots, and Jupiter Vintage Yellow capacitors. Hardware includes a Mastery Offset bridge, Mastery Offset Vibrato tailpiece, Kluson Supreme tuners, and a bone nut. Finished in antiqued nitrocellulose lacquer. Ships with D'Addario NYXL1149 strings and a deluxe hardshell case. Available in Antiqued Fiesta Red, Antiqued Jet Black, Antiqued Olympic White, Antiqued Sonic Blue, and Antiqued Watson Green.
specs: |-
  - Body: Solid ash
  - Body width: 13 1/4"
  - Body length: 17 7/16"
  - Body depth: 1 11/16"
  - Total length: 40"
  - Neck joint: Mortise & tenon (set neck)
  - Neck: Hard maple, slab-sawn
  - Fingerboard: Rosewood
  - Fingerboard radius: 10"
  - Scale length: 25 1/2"
  - Nut width: 1 11/16"
  - Nut: Bone
  - Frets: Narrow-tall, 18% nickel-silver
  - Inlays: 5mm non-tapered pearl dots
  - Neck profile: Soft V (~0.840" to ~0.921") or optional C (~0.854" to ~0.929")
  - Pickups: Lollar JM-style (P90 bridge, Blademaster neck)
  - Controls: 3-way blade selector, volume, tone
  - Wiring: Series/parallel
  - Pots: 500K
  - Capacitor: Jupiter Vintage Yellow
  - Knobs: Davies Radio
  - Bridge: Mastery Offset
  - Tailpiece: Mastery Offset Vibrato
  - Tuners: Kluson Supreme
  - Pickguard: Mint multi-ply (black/cream/black on Butterscotch Blonde)
  - Peghead veneer: Ebony with MOP Collings logo
  - Finish: Antiqued nitrocellulose lacquer
  - Strings: D'Addario NYXL1149 (.011"-.049")
  - Included: Deluxe hardshell case
