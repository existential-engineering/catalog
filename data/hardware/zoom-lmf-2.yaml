description: The LMF-2 lavalier mic is designed for capturing every nuance, with
  a screw-lockable mini-jack for a firm and secure connection.
details: |-
  The LMF-2 is a lavalier microphone on a captive cable, intended to be clipped to a speaker and run into a recorder rather than through a wireless beltpack. Zoom positions it for interviews, wedding vows and similar spoken-word capture where the microphone has to stay out of shot.

  The cable terminates in a screw-lockable mini-jack, so the plug threads onto the host input and cannot be pulled free by a moving subject or a snagged cable. It is sold alongside the F1 field recorder, which records the signal at high resolution to its own card.

  The microphone is sold on its own. A windscreen and a mic clip are explicitly called out as not included, which is a difference from the LMF-1 that ships inside the F1-LP package with its WSL-1 windscreen and MCL-1 clip.
specs: |-
  - Form factor: lavalier microphone on a captive cable
  - Connector: screw-lockable mini-jack
  - In the box: microphone only (windscreen and mic clip are not included)
