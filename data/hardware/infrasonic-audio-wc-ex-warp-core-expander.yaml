details: |-
  DISCONTINUED

  WC:EX is a 4hp expander for Warp Core which converts the oscillator into a full stereo voice by adding a controllable ADSR (shared decay/release) Envelope Generator and internal digital VCA. This module requires Warp Core - it cannot function independently. With nothing patched into GATE, Warp Core's outputs behave as they normally would, i.e. always outputting a signal. With a patch cable inserted into GATE, both of Warp Core's outputs are internally amplitude-modulated by an envelope generated in response to incoming gates at the GATE input. In other words, with just a pitch CV and gate input signal, you can directly play individual notes out of Warp Core – in Stereo! The envelope signal is also internally normalled to the WARP A and WARP B CV inputs on Warp Core for fast and easy timbral modulation. And the ENV output makes the envelope CV signal available to patch out to other things. There is also a dedicated VCA CV input which overrides the envelope as the CV source for the internal VCA, so you can use whatever 0-5V signal you want to modulate the amplitude of Warp Core's outputs. When using the VCA CV input, the GATE input and ENV output are still fully functional as an independent envelope generator and the internal normalling of the ENV to WARP A and WARP B CV inputs remains active. VIDEOS
