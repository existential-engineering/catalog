description: >-
  A monophonic analog synthesizer derived from the Prophet '08, featuring a fully
  analog signal path with two DCOs, two sub-oscillators, and the signature
  Curtis lowpass filter at an accessible price point.
details: |-
  The Mopho extracts a single voice from the mighty Prophet '08 and adds a sub-oscillator per DCO, delivering big analog sound in a compact and affordable package. Its fully analog signal path runs through Dave Smith Instruments' characteristic Curtis lowpass filter, which can also process external audio via the dedicated audio input. Stereo outputs provide a wide sound field despite the monophonic architecture.

  Extensive modulation capabilities set the Mopho apart from simpler monosynths. Four LFOs with multiple waveforms, three ADSR envelopes with delay, and a gated 16-step sequencer per program provide deep sound design potential. The filter is switchable between 24dB and 12dB per octave slopes, and 384 user memory slots offer generous patch storage.

  Two versions were produced: a desktop module with detented encoders for essential parameters, and a keyboard version featuring 32 semi-weighted keys with velocity and aftertouch sensitivity. Both include a proprietary Poly Chain socket for connecting to other DSI synthesizers to expand polyphony, bridging the gap between the Mopho's mono architecture and the multi-voice Prophet lineup.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 DCOs, 2 sub-oscillators
  - LFOs: 4 (multiple waveforms)
  - Filter: 24dB or 12dB/oct selectable lowpass with ADSR
  - Envelopes: 3 ADSR with delay
  - Sequencer: Gated 16-step (1 per program)
  - Memory: 384 user patterns
  - Keyboard: 32 keys with velocity and aftertouch (keyboard version)
  - Control: MIDI In, Out/Thru; USB (keyboard version)
releaseDate: "2008"
releaseDateYearOnly: true
