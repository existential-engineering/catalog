details: |-
  The Angelus-NH introduces exciting variations to the classic Caparison Angelus-M3B design. With updates including a Schaller Floyd Rose Tremolo system and Fishman Fluence Modern Humbucker Pickups, the Angelus-NH offers a stunning range of sonic potential to suit the recording and performance demands of the modern professional guitarist. This hand crafted guitar features a unique Mahogany-Maple-Mahogany (M3B) body with a beautiful 5A flamed maple top. The result is a warm mahogany timbre with extended brilliance, rich sustain, and tightened attack. An additional fullness and resonance is bolstered by a Set in Neck construction, with the aural nuances of the Angelus-NH extending far beyond the rock and metal genres it was designed for. A hand selected master grade flame maple top finished in transparent white gloss adds a sophisticated artistry to this guitar's elegant aesthetic. The maple fretboard features oval inlays which are part abalone and acrylic black, a mesmerising ornamental subtly to an element of visual function. The Fishman Fluence Modern Ceramic (Bridge) and Alnico (Neck) pickup combination offers players a plethora of options ranging from crisp, high output crunch and tight low end bridge voicing, to round, smooth, and articulate tones in the neck position. The Angelus-NH is the physical synergy of meticulous craft, quality components, and passionate design; sure to become a staple in the collections of serious players and enthusiasts alike. "I am humbled and honored to introduce the Angelus-NH as my signature model guitar. This instrument is the perfect amalgam of masterful craftsmanship, creative artistry, and sonic versatility. I am deeply grateful to Caparison Guitars and their team of skillful luthiers who have channeled their many lifetime's worth of knowledge and experience into this design. For me this hand crafted guitar is beautiful to behold, joyful to play, and delightful in its expansive tonal glory. It is a work of art engineered for professional utility. I look forward to championing its brilliance in the studio and across stages all over the world." – Nick Hipa
