description: The JHS Pedals 3 Series Tape Delay is a simplified and faithful
  throwback to classic tape delay units like the Roland RE-201 Space Echo,
  delivering warm degrading repeats and tape flutter simulation with Mix, Tape
  Speed, and Repeats controls plus a Flutter toggle.
details: |-
  Tape delay was invented in the late 1940s when Les Paul strung two Ampex Model 200A reel-to-reel tape recorders together. This was followed up by the Echoplex EP-1 in 1961 and the Space Echo from Roland in 1974.

  The JHS Pedals 3 Series Tape Delay is a simplified and faithful throwback to these classic units. The Mix control blends clean signal with the wet signal. Tape Speed acts as a simulation of the RE-201's tape motor speeding up and slowing down. The Repeats control goes from a single repeat to many, with loss of fidelity each time. When the Flutter toggle is turned on (up position), it replicates the wear and tear to the mechanical parts of a tape machine.
