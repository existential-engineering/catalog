name: DUAL WRECK PREAMP
manufacturer: tc-electronic
primaryCategory: preamp
url: https://tcelectronic.com/en/products/dual-wreck-preamp-001
description: Two-channel high-gain preamp pedal modeled on the legendary Dual Rectifier, with global Presence control for tonal flexibility, optional cab simulation, and dedicated outputs for direct recording and live rig integration.
details: |-
  The passionate engineering (and guitar-playing) team here at TC Electronic knew exactly what to aim for. Our goal went beyond technical measurements, as we also wanted to capture the authentic and genuine feel. We’re super-proud of DUAL WRECK because we believe we've hit that mark.   However, what truly matters is YOUR experience with DUAL WRECK. When you plug into this pedal, it evokes the same feelings and emotions as when you play through the original amp. That's how we know our mission is successfully accomplished!

  By incorporating a global PRESENCE knob on the rear panel, DUAL WRECK is able to adapt to any musical scenario you may encounter. Recognizing the likelihood of pairing this pedal with a diverse array of amplifiers, cabinets and pedals, we introduced this convenient and universal control, enabling you to establish the overall sonic direction.  If the default setting aligns perfectly with your sonic preferences, there is no need for further adjustments. However, if you desire a subtle touch of brilliance or a bit of additional warmth to match your personal tone desires, simply fine-tune the PRESENCE knob to your liking.  The global PRESENCE control empowers you to shape and refine your tone, seamlessly integrating with your equipment. It provides the flexibility to express your playing with zero compromises.

  When it comes to digital amp modeling, there are numerous approaches to choose from. However, our main objective was to achieve a seamless coupling of accuracy and simplicity. Instead of throwing hundreds of amp models and versions at you, we focused on replicating a single iconic amplifier with absolute perfection.  Our goal was to capture the very essence and sonic characteristics of this amp with ultimate precision. We also ensured that the control layout remained intuitive, allowing you to effortlessly navigate your tight and punchy high-gain tones. By eliminating unnecessary complexities, we enable you to fully concentrate on creating the exceptional sound you desire.  DUAL WRECK perfectly distills the essential elements you would expect from an authentic amplifier and presents them in a compact package with a small footprint, offering the perfect balance of accuracy and simplicity.

  Right out of the box, V550 is set to Dual Channel mode. This configuration keeps the pedal engaged at all times, granting instant access to each of these unique sonic profiles.  However, if you prefer a more traditional stompbox experience, we also incorporated a Bypass Mode. Entering this mode allows you to simply stomp the pedal on and off, allowing you to switch between bypass and the channel used before entering Bypass Mode.   Whether you opt for the versatile Dual Channel mode or prefer the familiar simplicity of the Bypass Mode, DUAL WRECK guarantees unwavering performance and power. The choice is yours - rock out whichever way you prefer!

  The original amplifier is renowned for its notable prominent low-end, delivering a satisfyingly robust punch that perfectly complements certain playing styles and music genres.  However, we understand that there may be instances where this characteristic might be excessive for your preferences. To address this, we've incorporated a TIGHT control, allowing you to fine-tune the balance between fatness and tightness to your taste.  If you want to maintain the original flavor, simply leave the TIGHT knob at 0 for a completely unaltered representation of the original amp's distinctive sound.
