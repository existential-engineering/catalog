description: >-
  MT-EX1 is an expander modules for the MEGA-TANG mixer which adds a mono line
  level input with level and send controls, two extra fixed inputs each with
  send controls and a fixed stereo input (useful for chaining multiple
  MEGA-TANGs). Note the MEGA-TANG only supports a single expander at any time.
details: |-
  The MT-EX1 is a 4HP input expander for ALM Busy Circuits' MEGA-TANG Eurorack mixer, extending its channel count and routing options. It adds a mono line-level input with its own level and effects-send controls, two additional fixed-level inputs each with a send control, and a fixed stereo input pair that is particularly useful for chaining multiple MEGA-TANGs together.

  It connects to and is powered by the MEGA-TANG's expander header. Only a single expander module can be attached to a MEGA-TANG at any one time, so the MT-EX1 and MT-EX2 cannot be used simultaneously.
specs: |-
  - Format: Eurorack, 4HP
  - Depth: 32mm
  - Power: +12V 25mA / -12V 25mA
  - 1× mono line-level input with level and send controls
  - 2× fixed-level inputs, each with a send control
  - 1× fixed stereo input pair (for chaining MEGA-TANGs)
  - Connects to and powered by the MEGA-TANG expander header
  - Only one MEGA-TANG expander supported at a time
  - Warranty: 2 years
