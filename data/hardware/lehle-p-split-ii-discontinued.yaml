details: |-
  The LEHLE P-SPLIT II combines passive splitting with maximum signal fidelity. Its core is the LEHLE TRANSFORMER HZ high-end transformer, which electrically isolates the two outputs, eliminating the possibility of ground loops. The LEHLE TRANSFORMER HZ was specially designed for use with high-impedance signals but also splits low-impedance signals with uncompromising sound quality.

  The signal can be picked off either symmetrically or asymmetrically from the ISO output. A phase inverter switch with gold-plated contacts permits reversal of input signal phase at the ISO output, preventing phase cancellations from impairing signal reproduction.

  The classical application for the LEHLE P-SPLIT II is splitting of an input signal to the two outputs, enabling you to connect your instrument to two devices, which may, for example, be two amplifiers, or an amp and a mixer or recording unit (PC/DAW). Thanks to the facility for also picking off the signal balanced on the ISO output, the LEHLE P-SPLIT II is eminently suitable for use as a high-quality compact DI Box for all types of signal.

  Another useful application for the Lehle P-Split II is as an effective suppressor for unwanted hum. Background noise occurs again and again, caused by ground loops, when two electronic devices are connected to each other, and the LEHLE P-SPLIT II provides a simple, but extremely effective, remedy, being installed between the two units. Using the ISO output, the two devices are electrically isolated, and this background noise becomes a thing of the past.
specs: |-
  - Fully passive, needs no separate power supply
  - Lehle Transformer HZ provides galvanic isolation on the ISO output
  - ISO output can be picked off balanced or unbalanced with a stereo (TRS) cable
  - Phase inverter switch with gold-plated contacts reverses input signal phase at the ISO output
  - 1/4 inch stereo jack sockets throughout
  - Designed for high-impedance signals, also splits low-impedance signals
