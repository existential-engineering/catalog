description: Handheld dynamic omnidirectional broadcast interview microphone,
  long established as an industry standard for ENG and field reporting. Built
  around Electro-Voice's Dyna-Damp shock mount and a four-stage pop filter for
  low handling noise and wind/plosive resistance in tough on-location
  conditions.
details: >-
  The Electro-Voice RE50B is a handheld dynamic interview microphone widely
  regarded as the industry standard for handheld broadcast interview work, used
  by news correspondents and broadcast television crews worldwide. Its
  omnidirectional polar pattern captures speech evenly without requiring precise
  mic placement, making it well suited to fast-moving field interviews where
  reporters are passing the mic between subjects.


  Internally the RE50B uses Electro-Voice's Dyna-Damp shock mount system to
  substantially reduce handling noise, and a four-stage pop filter to resist
  wind blasts and vocal plosives, which together address the two biggest enemies
  of handheld field audio. The dynamic element is fully passive (no power
  required) and is built to withstand high humidity, temperature extremes, and
  corrosive salt air, so it can be carried into outdoor and coastal reporting
  environments without special handling.


  The body is constructed from aluminum with a semi-gloss camera black finish to
  keep the microphone visually unobtrusive on camera. At 197 mm tall, 49 mm
  maximum diameter and 0.269 kg net weight, it has the familiar stick-mic
  balance that field reporters expect. Output is on a standard 3-pin XLR
  connector at 150 ohms low-impedance balanced, feeding any professional mixer,
  camera input, or portable recorder. With a 1.6 V open circuit voltage, output
  level is in line with other professional dynamic broadcast mics.
specs: >-
  - Element: Dynamic

  - Polar pattern: Omnidirectional

  - Frequency response: 80 Hz - 13,000 Hz (-3 dB)

  - Impedance (low-Z balanced): 150 ohms

  - Open circuit voltage: 1.6 V

  - Connector: 3-pin XLR

  - Form factor: Handheld

  - Wired/wireless: Wired

  - Powering: Passive (no power required)

  - Height: 197 mm

  - Maximum diameter: 49 mm

  - Net weight: 0.269 kg

  - Case material: Aluminum

  - Finish: Semi-gloss camera black

  - Shock mount: Dyna-Damp internal shock mount

  - Pop filter: Four-stage pop filter

  - Environmental: Withstands high humidity, temperature extremes, and corrosive
  salt air
