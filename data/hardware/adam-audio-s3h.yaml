description: The S3H builds on the successes of ADAM Audio's most popular studio
  monitors, the S3A and S3X-H, and sets new standards in terms of technical
  innovation.
details: |-
  The ADAM Audio S3H is a three-way active midfield studio monitor that builds on the legacy of the company's S3A and S3X-H predecessors. Conceived as a midfield reference, it also remains usable in compact control rooms, delivering a punchy yet musical voicing with crystal-clear reproduction of the all-important mid-range.

  The cabinet houses dual 7-inch HexaCone bass drivers reaching down to 30 Hz, a newly developed 4-inch DCH hybrid dome/cone midrange driver covering 250 Hz to 3 kHz, and the S-ART ribbon tweeter paired with the HPS waveguide for frequencies above 3 kHz. Combined, the drivers cover 30 Hz to 50 kHz at maximum SPL of at least 126 dB per pair at 1 m.

  Amplification is split across the bands: each bass driver is driven by a 500 W PWM Class D amp, the midrange by a dedicated 300 W PWM Class D amp, and the S-ART tweeter by a 50 W Class A/B amp, for 1350 W total RMS power. A custom DSP module handles the crossovers (at 250 Hz and 3 kHz), six parametric EQ bands, two shelving room-compensation filters, delay up to 5 ms, and five preset memories — including a factory preset that emulates the classic S3A response.

  Connectivity is comprehensive for a reference monitor: balanced analog input on XLR, AES3 digital input, and a USB control port for software setup and firmware updates. Maximum input level is +24 dBu with 48 kOhm input impedance, and the monitor draws up to 550 W from the mains.
specs: |-
  - Frequency response: 30 Hz – 50 kHz (-20 dB)
  - Max SPL per pair at 1 m: ≥126 dB
  - THD (>100 Hz): ≤0.4%
  - Woofers: 2 × 7" HexaCone, 1.5" voice coil
  - Midrange: 4" DCH hybrid dome/cone, 2.4" voice coil
  - Tweeter: S-ART ribbon, 4 sq in diaphragm (2420 mm²)
  - Woofer amplification: 2 × 500 W PWM Class D
  - Midrange amplification: 300 W PWM Class D
  - Tweeter amplification: 50 W Class A/B
  - Total RMS power: 1350 W
  - Crossover frequencies: 250 Hz, 3 kHz
  - Parametric EQs: 6
  - Room compensation EQs: 2 (high-shelf, low-shelf)
  - Preset memories: 5
  - Delay range: 0–5 ms
  - Input impedance: 48 kOhm
  - Max input level: +24 dBu
  - Max power consumption: 550 W
  - Dimensions (H × W × D): 280 × 585 × 380 mm (11.0" × 23.0" × 15.0")
  - Weight: 26.6 kg (58.6 lb)
  - Warranty: 5 years (2 years standard + 3 years with registration)
