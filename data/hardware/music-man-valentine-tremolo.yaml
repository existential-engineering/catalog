description: >-
  The James Valentine signature "Valentine" guitar in a tremolo configuration —
  slab ash body, two custom Music Man designed pickups (humbucker neck /
  single-coil bridge) with coil tap, Music Man Modern tremolo with vintage bent
  steel saddles, 25.5-inch scale, and an oil-and-wax-rubbed roasted maple neck
  with maple fingerboard.
details: |-
  The James Valentine signature guitar — tremolo configuration — pairs an ash slab body with a figured roasted maple neck and fingerboard for a fast, articulate playing surface.

  Electronics use a custom Music Man designed humbucker at the neck and a staggered pole-piece single coil at the bridge, routed through a 3-way lever switch. A custom Music Man active preamp with push/push volume engages a gain boost, while a 500k push/push passive tone with a 0.022µF cap enables custom split pickup configurations.

  The Music Man Modern tremolo with vintage bent steel saddles provides smooth pitch modulation while preserving tuning stability, paired with Schaller M6-IND locking tuners. A 5-bolt sculpted neck joint provides comfortable access to all 22 high-profile medium-width stainless steel frets.

  Available finishes include Maroon Burst Sparkle with black pickguard, Tobacco Sparkle with black pickguard, and Pink Champagne Sparkle with white pearl pickguard.
specs: |-
  - Body wood: Ash
  - Body finish: High gloss polyester
  - Body dimensions: 13-1/4" wide, 1-3/4" thick, 38-7/16" long
  - Neck wood: Figured roasted maple
  - Neck finish: Gunstock oil and hand-rubbed wax
  - Neck width: 1-5/8" at nut, 2-1/4" at last fret
  - Neck radius: 10"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Figured roasted maple
  - Fret markers: 1/4" black face dots
  - Frets: 22 high-profile, medium-width stainless steel
  - Scale length: 25-1/2"
  - Headstock length: 6-3/8"
  - Pickups: SH — Music Man custom-wound staggered pole single coil (bridge); humbucker with chrome or gold cover (neck)
  - Controls: Custom Music Man active preamp; push/push volume for gain boost; 500k push/push tone for custom split configurations (0.022µF cap)
  - Switching: 3-way lever pickup selector
  - Bridge: Music Man Modern tremolo with vintage bent steel saddles
  - Pickguard options: Black (Maroon Burst Sparkle, Tobacco Sparkle); White Pearl (Pink Champagne Sparkle)
  - Tuning machines: Schaller M6-IND locking
  - Electronic shielding: Graphite acrylic resin body cavity; aluminum control cover
  - Strings: 10p-13p-17p-26-36-46 (RPS 10 Slinkys #2240)
