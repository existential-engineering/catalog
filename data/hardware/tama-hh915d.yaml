details: |-
  Lever Glide: The idea of replacing the traditional pull mehanism with a lever design was a genuinely revolutionary concept. Our Speed Cobra version uses roller bearings at the lever fulcrum for even smoother footboard action while a super-strong Kevlar® strap connects the footboard and pull rod for even, noise-free action. (Kevlar® is a registered trademark of the Dupont Corporation)

  Quick-Set Hi-Hat Clutch (US.PAT.NO.9812101): With just one touch, the Quick-Set Clutch can be attached or removed - simply push the button on the side of the clutch. The clutch also allows the top hi-hat cymbal to float more freely, maximizing the natural resonance of the cymbals.

  Non-Loosening Tension Rod: Specially shaped plastic and metal nuts fit together perfectly to keep the cymbal rod from loosening while playing.

  Swivel Foot: Since the foot pedal can be rotated around the the dual leg base, the Swivel Foot feature greatly expands floor space and set-up flexibility.

  Footboard Angle Adjustment: The HH915D features the same long footboard as our Speed Cobra Bass Drum Pedal. Its core design is based on the Iron Cobra Hi-Hat Stand, widely recognized as one of the best performing hi-hat stands in the world. The longer footboard offers footwork flexibility, added control and sensitivity. The latest innovation on this stand, the new "Quick-Set Clutch", allows hi-hat cymbals to be quickly attached and removed. The Hinge Guard Block on the footboard holds the bearing more evenly, minimizing stress and maximizing smoothness.

  Tilt System: Not only do Tilt equipped stands offer more flexible set-ups, they also offer more expressive hi-hat work because you can tilt the hi-hat cymbal. Iron Cobra hi-hat stands can be tilted quickly and easily by loosening just one T-Bolt.
