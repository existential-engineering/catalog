details: |-
  The MicParts SDC is a small-diaphragm condenser based on the Schoeps CMC5. It is transformerless, with very low noise, very low distortion, and a fast, accurate transient response. Its voicing is slightly more open than the SDC-84, and its greater dynamic range gives it a slightly more punchy sound, though the effect is subtle.

  Small-diaphragm condensers generally hold a cardioid pattern over a wider frequency range than large-diaphragm mics, so they tend to sound less ambient, picking up less of the space around the instrument. For a snare-specific mic, see the MicParts Snare Mic.

  The MicParts SDC is hand-built in Roswell's California workshop.

  Matched pairs work beautifully as drum overheads. They omit the zipper pouch in favor of a robust flight case.
