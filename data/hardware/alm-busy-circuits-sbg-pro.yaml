description: >-
  The S.B.G-PRO is a versatile Eurorack utility module for integrating modular
  systems with professional audio equipment via full-size 6.35mm balanced stereo
  jacks with level matching and clipping indication. It provides manual and
  voltage-controlled equal power crossfading between dry and wet (returned)
  signals, with an expression input and included floating ring cable for safe CV
  control of external gear.
details: |-
  The S.B.G-PRO builds upon ALM's original S.B.G module by adding full-size stereo balanced jack connections via 6.35mm Neutrik jacks, supporting mono, stereo, balanced, and unbalanced audio. It is designed to bridge the gap between modular Eurorack systems and professional audio equipment such as rack effects processors, 500 Series modules, studio mixers, and guitar pedals.

  The core feature is an equal power crossfader that blends between the dry modular signal and the wet processed signal returned from external gear. This crossfade can be controlled manually via a panel knob or via CV for dynamic, patch-controlled wet/dry automation. The expression input—accessible via the included floating ring cable—allows CV signals to safely control expression-pedal inputs on external devices without risk of damage.
specs: |-
  - Width: 10HP
  - Depth: 32mm
  - +12V current draw: 60mA
  - -12V current draw: 55mA
  - External connections: 6.35mm balanced/unbalanced jacks (send/return, expression)
  - Modular connections: 3.5mm jacks (CV in, audio in/out)
  - Wet/dry crossfade: equal power, manual and CV-controlled
  - Return amplification: up to 32dB
  - Clipping indicator included
  - Includes floating ring cable
  - Made in England
