details: |-
  The DN70 was one of Klark Teknik's earliest digital delay processors, introduced in 1979 during the formative years of professional digital audio. As a pioneering DN-series digital signal processor it belongs to the same lineage as the DN780 reverb and the DN716 multi-output delay that built the maker's reputation in studio outboard.

  Released alongside the DN71 auxiliary effects unit, the DN70 was conceived for broadcast and live-sound time alignment as well as creative delay effects. Its delay topology and discrete digital signal path predate the integrated DSP era, and surviving units are sought after by collectors for their particular sonic character.

  Typical use today is vintage broadcast time processing, period-correct studio production, and archive or restoration work where an early-era digital delay is the tool being sought. The page frames it as a historical instrument rather than a current-specification utility.
specs: |-
  - Pioneering DN-series digital time processor, introduced 1979
  - Rackmount chassis
  - Balanced analogue input and output
  - Discrete digital signal path of the late-1970s era
  - Designed and built in the United Kingdom
