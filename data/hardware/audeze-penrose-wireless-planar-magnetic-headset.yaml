description: Low-latency wireless planar magnetic gaming headset with dual
  2.4GHz USB dongle and Bluetooth 5.0 connectivity and detachable
  broadcast-quality boom mic.
details: |-
  Audeze's patented planar magnetic driver technology sets the standard for audio clarity, with Fluxor magnet arrays and Fazor waveguides delivering precise, low-distortion sound.

  High performance dual wireless connection supports lossless, low latency 2.4GHz wireless using the included USB dongle, plus simultaneous Bluetooth 5.0 for connection to phones and other devices.

  A flexible and detachable broadcast quality boom microphone offers a max SPL of more than 140dB and built-in noise filters that reduce up to 20dB of background sound for clear team communication.
