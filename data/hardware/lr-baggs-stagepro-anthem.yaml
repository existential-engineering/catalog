details: |-
  The Stage Pro Anthem utilizes the same Element Pickup and TRU•MIC as the standard Anthem, and gives you even more control over your sound via the system’s side-mounted controls for EQ, blending, anti-feedback, and onboard tuning. In 2010, when the acoustic world was running to cold digital modeling, Baggs chose a different route. We believed a real mic would do a better job of being a mic. Leaning into pure analog physics, we bypassed the digital emulation idea to create our award-winning Anthem System. Our breakthrough moment came when we collaborated with Keith Sewell, who was searching for a mic solution while touring with Lyle Lovett to eliminate the harsh spikes of traditional pickups in their in-ears. Lloyd Baggs saw this as his challenge to create a hybrid mic-pickup system with a single, feather-weight preamp on the instrument and a new type of mic, packing it with more advanced circuitry than even our legendary Para DI. This system became a grand Anthem to those years of innovation.
specs: |-
  - Guitar-mounted hybrid system: Element undersaddle pickup + TRU-MIC internal microphone
  - Side-mounted preamp control panel
  - Active system, High-Grade FET input preamp
  - Controls: Volume, Mix, Phase Inversion, Mic Level, Bass and Treble EQ, Notch Filter, Full Chromatic Tuner, Battery Check
  - 9V battery with click-lock access
  - 1/4-inch endpin output jack
  - Requires professional installation
