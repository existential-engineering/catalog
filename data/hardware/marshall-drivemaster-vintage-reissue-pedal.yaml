description: Handcrafted vintage reissue of Marshall's classic Drivemaster
  overdrive pedal. Built in the UK with a robust mild steel chassis, the
  Drivemaster delivers crunchy, tube-style overdrive with adjustable gain, a
  full three-band EQ (bass, middle, treble), and master volume for sculpting
  tone from light edge-of-breakup to thick, driven rhythm and lead sounds.
  Engineered to faithfully reproduce the original's circuit and character while
  standing up to the rigours of stage use.
