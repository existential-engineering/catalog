description: Handcrafted vintage reissue of Marshall's classic Drivemaster overdrive pedal. Built in the UK with a robust mild steel chassis, the Drivemaster delivers crunchy, tube-style overdrive with adjustable gain, a full three-band EQ (bass, middle, treble), and master volume for sculpting tone from light edge-of-breakup to thick, driven rhythm and lead sounds. Engineered to faithfully reproduce the original's circuit and character while standing up to the rigours of stage use.
details: |-
  The Drivemaster Vintage Reissue Pedal is based on the original Guv'nor but takes things a stage further with a new tone and drive network. Its three-band tone network acts as if adding an extra amp to your set-up, with real Marshall tone and overdrive. The iconic look has also been accurately recreated, right down to the finish of the control knobs and unique shape. There are plenty of reasons the first edition is so heavily sought after today. This reissue takes everything that made the original so special and replicates it for today's player.

  Each Drivemaster reissue pedal has been handcrafted in the same factory as the originals, to match the original specifications. Encased in robust mild steel, this iconic pedal is constructed to endure the rigours of time and live performances.

  The Bass, Middle, and Treble controls on this pedal provide an extensive and nuanced approach to tone shaping, allowing you to finely tailor your sound. Whether you seek thunderous bass, a pronounced midrange punch or sparkling highs, these controls empower you to sculpt your tone with precision. Collectively, these features contribute to a pedal that's versatile enough to cover a broad spectrum of tones.

  With painstaking attention to detail, this faithful reproduction adheres to all the elements of the original pedals. Each element has been thoughtfully reconstructed to capture the essence and charm of the original model while ensuring it seamlessly meets the demands of contemporary guitarists. Designed and engineered in UK. Made in UK.
specs: |-
  - Handmade in the UK factory, housed in a mild steel chassis
  - Gain, Bass, Middle, Treble and Volume controls
  - Three-band tone network for detailed tone shaping
  - Inputs: 1 x 1/4 inch jack
  - Outputs: 1 x 1/4 inch jack
  - Powered by a 9V battery or a 9V DC power adaptor (adaptor not included)
  - Dimensions: 110 mm (4.33 in) wide, 67 mm (2.63 in) high, 147 mm (5.78 in) deep
  - Weight: 0.7 kg / 1.5 lbs (without battery)
