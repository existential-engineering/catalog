details: |-
  Softpop SP2 is a radical subtractive synthesizer combining modular analog circuitry with unconventional digital sequencing control. Developed through a decade-long collaboration between Casper Electronics (Peter Edwards) and Bastl Instruments (Václav Peloušek), it was inspired by the Benjolin synthesizer by Rob Hordijk.

  The instrument excels at basslines, chord progressions, distorted beats, and textural effects. It functions as both a standalone synthesizer and external audio processor with built-in filter, VCA, and overdrive stages. A 37-point patchbay provides extensive modular routing possibilities.

  The 8-step pattern sequencer offers 8 banks of 8 patterns (saved on-demand), 8 quantization scales, 8 playback modes, and 8 performance effects including ratchets, arpeggios, and noise. Per-step gate envelopes and portamento provide detailed sequence control.

  Built-in utilities include an XY crossfader, 4-way multiple, sample & hold random modulation, and an envelope follower. The unit is Eurorack-compatible via a 16-pin protected connector (requires 5V busboard) and powered by 5V Micro USB. Dimensions: 173 × 112 × 41 mm.
