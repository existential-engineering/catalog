description: An 11HP quad VCA mixer with cascading submix architecture,
  clickless muting, and two integrated envelope follower types. Four channels
  each have audio in, CV input with attenuverter, mute switch with LED, and
  individual output. Level faders with +6dB boost. A sidechain envelope follower
  (three response curves) tracks an external signal and can modulate all four
  VCAs simultaneously. A spectral follower switches between treble, mid, and
  bass focus, outputting CV. Daisy-chainable. DC-coupled channel I/O; AC-coupled
  mix output.
details: |-
  Aikido is an 11HP quad VCA mixer built around a cascading submix architecture. Each of the four channels has its own audio input, CV input with attenuverter, clickless mute switch with LED, and individual VCA output. Channels can cascade so each output feeds into the next channel's mix path, enabling flexible submix routing without extra patch cables. Channel inputs and individual outputs are DC coupled; the main mix output is AC coupled.

  Two integrated envelope follower types add dynamic control. The sidechain follower tracks a signal patched to the dedicated sidechain input (normalized to Channel A when unpatched), with three selectable response curves for fast, medium, or slow attack/release. The spectral follower analyzes frequency content and switches between treble, mid, and bass focus, outputting CV for frequency-reactive mixing.

  Level faders provide up to +6dB of boost above unity. Daisy-chainable via back-panel connectors for expanded mixing setups.
