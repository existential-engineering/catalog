description: >-
  The Studio Electronics SE-1 is an analog monophonic rackmount synthesizer module
  designed to recreate the classic Moog sound. It features three discrete
  voltage-controlled oscillators, dual filter types modeled after Moog and Oberheim
  circuits, and extensive MIDI control with deep preset storage.
details: |-
  The SE-1 was produced by Studio Electronics as a dedicated analog monophonic synthesizer module aimed at bringing the iconic Moog sound into a modern rackmount format. Its three discrete voltage-controlled analog oscillators are built to Minimoog specifications, offering triangle, sawtooth, reverse sawtooth, square, noise, and random waveforms. Oscillators 2 and 3 can sync to oscillator 1 for classic hard-sync timbres.

    The SE-1 features two distinct filter sections: a 24 dB lowpass voltage-controlled filter characteristic of Moog instruments and a 12 dB low-/band-pass filter emulating classic Oberheim synthesizer sounds. Four multi-stage ADSR envelope generators provide extensive sound-shaping capability, with the first fixed to filter frequency and the second to amplitude level, while the remaining two are freely assignable. Three LFOs with triangle, sawtooth, reverse sawtooth, square, noise, and random waveforms add further modulation depth. Ring modulation and glide/auto-glide effects round out the sound design toolkit.

    The front panel provides 24 knobs and 21 tactile switches for hands-on control, complemented by full MIDI parameter control and generous program storage with 4 ROM banks and 4 RAM banks of 396 locations each. An improved SE-1X version later added 198 new sounds, expanded modulation capabilities, enhanced MIDI specifications, updated front panel graphics, flash-ROM web-updateable operating software, smoother parameter tweaking, and an external audio input. Special limited editions known as "Red Eye" and "Angel Dust" replaced oscillator 2's triangle wave with a pure sine wave.

    The SE-1 found popularity in hip hop, R&B, and dance music production, with notable users including Fatboy Slim, Frontline Assembly, Dr. Dre, and Astral Projection.
specs: |-
  - Polyphony: Monophonic
    - Oscillators: 3 analog VCOs (oscillators 2 and 3 sync to oscillator 1)
    - Waveforms: Triangle, sawtooth, reverse sawtooth, square, noise, random
    - Filter 1: 24 dB lowpass (Moog-style)
    - Filter 2: 12 dB lowpass and bandpass (Oberheim-style)
    - Envelope Generators: 4 multi-stage ADSR
    - LFOs: 3 with triangle, sawtooth, reverse sawtooth, square, noise, and random waveforms
    - Memory: 4 ROM banks and 4 RAM banks (396 locations each)
    - Controls: 24 knobs, 21 tactile switches
    - MIDI: Full parameter control
    - Presets: 396 factory presets, 396 user patches
