description: >-
  The Korg Prophecy is a monophonic digital synthesizer released in 1995 that employs
  DSP-based synthesis originally developed for the Korg OASYS. It features Variable Phase
  Modulation (VPM) synthesis, physical modeling of brass, reed, and plucked string
  instruments, and analog modeling with traditional filter and envelope controls. The
  37-key keyboard includes extensive real-time performance features including a
  dual-action ribbon controller and six onboard effects processors.
details: |-
  The Korg Prophecy emerged in the mid-1990s as part of a wave of synthesizers addressing the growing demand for vintage analog-style sounds using modern digital technology. Released in 1995, it was designed to satisfy musicians pursuing electronica-style music who desired old-school vintage equipment characteristics with cutting-edge capabilities.

    At its core, the Prophecy employs DSP synthesis technology originally developed for the Korg OASYS platform. It offers multiple synthesis algorithms for producing realistic analog timbres, including VPM (Variable Phase Modulation) tone generation comparable to FM synthesis, physically modeled brass, reed, and plucked string instruments, and traditional analog modeling with resonant filters.

    The Prophecy provides extensive real-time control over traditional analog editing parameters like filter cutoff and resonance, envelopes, and a programmable arpeggiator. Performance controls include a pitch wheel, mod wheel, and an expressive dual-action ribbon controller. Four LFOs with 30 available waveforms and four envelope generators offer deep modulation possibilities, while six onboard effects processors round out the sound design toolkit.

    Notable users of the Prophecy include The Orb, Depeche Mode, Radiohead, The Prodigy, BT, Yes, and Rick Wakeman.
specs: |-
  - Polyphony: Monophonic (1 voice)
    - Synthesis: DSP-based (Physical Modeling, VPM, Analog Modeling)
    - Oscillators: Physical Modeling engine
    - LFOs: 4 LFOs with 30 waveforms, real-time modulation, 0-60Hz range
    - Filter: Voice filter with resonant Low Pass, High Pass, Band Pass, and Notch modes
    - Envelopes: 4 envelope generators
    - Keyboard: 37 keys with velocity and aftertouch
    - Arpeggiator: Programmable, MIDI clock syncable
    - Effects: 6 processors
    - Control: MIDI
    - Controllers: Pitch wheel, mod wheel, dual-action ribbon controller
