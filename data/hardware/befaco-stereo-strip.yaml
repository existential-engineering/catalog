description: The Befaco Stereo Strip is a 6HP Eurorack channel strip module
  designed in collaboration with Ben Wilson (DivKid), bringing studio mixing
  desk concepts into modular synthesis. It combines a 3-band EQ,
  voltage-controlled panning, stereo VCA level control, and a 3-way performance
  muting system into a compact format. A soft clipping limiter provides both
  protective limiting and intentional distortion, with switchable line-level
  adjustment for interfacing with external gear.
details: |-
  The Befaco Stereo Strip is a 6HP Eurorack channel strip module developed in collaboration with content creator and synthesist Ben Wilson, known as DivKid. It distills the core functions of a studio mixing console channel strip — EQ, panning, level control, and muting — into a compact and highly versatile Eurorack format, making it suitable for both mixing duties within a patch and as a performance tool.

  At its core, the Stereo Strip features a 3-band equalizer that allows tone-shaping of the stereo signal passing through it. The panning section can be operated manually via a dedicated knob or controlled via an external CV signal, enabling automated or modulation-driven stereo placement. The integrated VCA provides level control that similarly accepts both manual adjustment and CV input, allowing dynamic, patch-controlled volume automation.

  The module includes a 3-way muting switch offering on, off, and momentary modes, giving performers hands-on, expressive control over signal gating during live performance. A soft clipping limiter is built in, which serves double duty: at moderate settings it prevents harsh digital-style clipping and tames loud signals, while when pushed more aggressively it introduces musical distortion and harmonic saturation into the signal path.

  A line-level input/output adjustment switch makes the Stereo Strip compatible with both Eurorack-level signals and standard line-level equipment, simplifying integration with external mixers, audio interfaces, or studio outboard gear. The module is available both fully assembled and as a DIY kit, designed and manufactured in Barcelona.
