details: |-
  The JBL SUB18 is a high-output 18-inch studio subwoofer engineered for recording studios, broadcast facilities, and demanding professional listening environments where extreme low-frequency accuracy and dynamic range are essential.

  At its core is a single JBL 2269H 18-inch driver featuring dual voice coils, housed in an 18mm 11-ply Baltic Birch plywood enclosure finished in black lacquer. The enclosure design supports an in-room response extending below 18 Hz, with a -10 dB point at 20.6 Hz.

  The SUB18 is rated for 2,000W continuous (AES/2 Hr.) and 8,000W peak system input power, and is designed to work with external amplification rated 3,500–4,000W into 8Ω. Sensitivity is 92 dB at 1 meter, 2.83V, and maximum peak SPL reaches 137 dB.

  Connection is made via two push terminals accepting up to 12-gauge speaker wire, keeping integration straightforward with any professional power amplifier. The 8Ω rated impedance ensures compatibility with a wide range of amplifier outputs.

  The SUB18 is part of the JBL M2 Master Reference Monitor System ecosystem, intended to complement M2 main monitors in high-end studio and broadcast reference monitoring configurations.
specs: |-
  - Driver: One JBL 2269H 18-inch with dual voice coils
  - Rated Impedance: 8Ω
  - In-room Response: Below 18 Hz
  - Frequency Response (-10 dB): 20.6 Hz
  - Frequency Response (-6 dB): 23.1 Hz
  - Maximum Peak SPL: 137 dB
  - Sensitivity: 92 dB @ 1m, 2.83V
  - System Input Power (AES/2 Hr.): 2,000W continuous / 8,000W peak
  - Recommended Amplifier Power: 3,500–4,000W into 8Ω
  - Enclosure Material: 18mm 11-ply Baltic Birch Plywood
  - Finish: Black Lacquer
  - Dimensions (H×W×D): 685 × 762 × 620 mm (27 × 30 × 24 in)
  - Net Weight: 45 kg (100 lbs)
