description: 16 x 2 Analog Summing Mixer with Harmonic Distortion Generator, FET
  Limiter, Variable Stereo Transformers, and Stereo Insert
details: |-
  The 2-BUS+ is a redesigned analog summing mixer that Dangerous Music positions as the successor to their original 2-BUS, the product that invented the stand-alone analog summing mixer category in 1999. The redesigned summing circuit is built for unsurpassed imaging, dimensionality, punch, and headroom, taking 16 channels of DAW output back into the analog domain and combining them to a stereo mix.

  Beyond clean summing, the 2-BUS+ adds three switchable analog color circuits. Harmonics is an odd- and even-order distortion generator that runs in parallel with the unprocessed signal. Paralimit is a FET-style limiter inspired by the 1176's all-buttons-in trick, offering parallel compression in stereo. X-Former is a pair of custom-wound Cinemag output transformers with an exclusive core-overdrive circuit, engaged in series and driven to taste with a Saturate control.

  Harmonics and Paralimit can be assigned to the full mix bus or split off to stem pairs 13-14 or 15-16, with a Flip button to reorder them. A switchable stereo analog insert with true hardwire bypass sits after the color circuits, just before the output, for patching in outboard gear. A stepped output attenuator (not a potentiometer) provides -4dB to +6dB of trim with exact, repeatable recall.

  The unit is hand-assembled in the USA from audiophile-grade components and ships with a standard 90-day parts-and-labor warranty, extendable to 2 years with free online registration.
specs: |-
  - 16 input channels of active analog summing
  - Three analog color circuits: Harmonics, Paralimit, X-Former
  - Both XLR and D-Sub (DB25) input connectivity
  - Switchable stereo analog insert with true hardwire bypass
  - Stepped output gain/level trim control for exact recall
  - Max Input Level: > +28 dBu
  - THD+N @ +4dBu (1kHz, 22Hz-22kHz, unweighted): < 0.0048%
  - THD+N @ +22dBu: < 0.0026%
  - IMD @ +4dBu: < 0.0038%
  - IMD @ +22dBu: < 0.0021%
  - Crosstalk Rejection: > 108dB @ 1kHz
  - Noise at Unity Gain (22Hz-22kHz): < -86 dBu
  - Noise at Nominal Mix Setting (22Hz-22kHz): < -91 dBu
  - Frequency Response: flat within 0.1dB, 10Hz-50kHz
  - Input Impedance: 25K Ohms Balanced
  - Output Impedance: 50 Ohms Balanced
  - Hand-assembled in the USA
  - Warranty: 90 days standard (parts and labor); free 2-year extended warranty with online registration
