details: |-
  Klik is a compact synchronization device that converts audio line-level signals into modular clock, trigger, and gate signals. It bridges the gap between computers and hardware synthesizers by transforming standard audio outputs into the 0–5V pulse signals used by modular and semi-modular synthesizers.

  The device accepts a stereo TRS 3.5mm line-level input from a computer headphone output or audio interface. It produces two mono 3.5mm outputs — clock and reset — carrying 0 or 5V trigger/gate signals. A manual button on the reset channel allows hands-on gate triggering.

  Klik features overvoltage and polarity protection on all jacks, per-channel LED indication, and bonus bitcrushing audio effect capability. Available as a fully assembled unit or PCB-only kit.
