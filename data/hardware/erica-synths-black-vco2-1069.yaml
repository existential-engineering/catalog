description: Analog VCO with SAW waveshaper.
details: |-
  Erica Synths Black VCO2 is an analogue VCO with a built in SAW waveshaper and two modulation LFOs.

  It is all analogue, highly accurate and stable, with four simultaneous waveform outputs, a one octave down suboscillator and some unique features. Unlike harsh, logic divider based suboscillators, the transistor-based suboscillator in the Black VCO2 generates a distinct, rounded squarewave. Together with the Black VCO Expander waveform mixer it becomes a massive analogue sound source with plenty of patch points for modular use.

  Sine, triangle, saw and pulse waves leave the panel at once, tracking stays accurate and stable across eight octaves, the saw waveshaper and the pulse width take manual and CV control, and an exponential and linear FM input carries its own attenuator. A synchronization input, an octave switch covering seven octaves and a skiff-friendly build round out the module.

  Erica Black Series include high-end, unique functionality and superior quality modules. Only the best, highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Black Series consist of a range of modules that are needed to put together an entire synth.

  Audio output amplitude is 10Vptp over an octave range of C0 to C8. The panel is 12HP wide at a depth of 35mm, drawing 71mA from the +12V rail and 62mA from the -12V rail, rising to 102mA and 87mA with the expander fitted.
specs: |-
  - Simultaneous sine, triangle, saw and pulse wave outputs
  - -1 octave suboscillator
  - Highly accurate and stable tracking across 8 octaves
  - Saw waveshaper with manual and CV control
  - Manually adjustable and CV controlled pulse width
  - Exponential/Linear FM input with an attenuator
  - 2 built-in modulation LFOs
  - Synchronization input
  - Octave switch, 7 octaves
  - Skiff-friendly design
  - Audio output amplitude 10Vptp
  - Octave range C0 to C8
  - Panel width 12HP
  - Module depth 35mm
  - Power consumption 71mA@+12V, 62mA@-12V
  - Power consumption with Expander 102mA@+12V, 87mA@-12V
