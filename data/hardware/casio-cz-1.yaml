description: >-
  The Casio CZ-1 is a 61-note Phase Distortion digital synthesizer featuring a
  professional velocity and aftertouch-sensitive keyboard, competing with the
  CZ-5000 as one of the best all-around models in the CZ series.
details: |-
  The CZ-1 represents the most advanced keyboard in the Casio CZ synthesizer line, offering a full 61-note 5-octave keyboard with velocity and aftertouch sensitivity -- professional features uncommon in consumer Casio products. Essentially an enhanced CZ-3000 (equivalent to two CZ-1000s or CZ-101s combined), the instrument provides 8-stage envelopes, 2 oscillators per voice, and relatively intuitive programming capabilities.

  Its Phase Distortion synthesis technology offers DX-like sounds at a lower cost than comparable Yamaha models. While the CZ-5000 included an onboard 8-track real-time sequencer, the CZ-1 compensated with superior keyboard design and enhanced memory capabilities.

  The upgraded memory, MIDI functionality, and multitimbral features established the CZ-1 as an exceptional budget synthesizer from the consumer market, particularly suited for live performance applications.
specs: |-
  - Polyphony: 16 voices
  - Oscillators: 2 per voice
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 64 preset patches, 64 user patches, 64 external cartridge patches
  - Effects: Chorus
  - Arpeggiator/Sequencer: None
  - Filter: None
  - Control: MIDI
  - Date Produced: 1986
releaseDate: "1986"
