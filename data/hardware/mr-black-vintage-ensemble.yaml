description: The Vintage Ensemble recreates the classic 1976 Chorus Ensemble
  sound in a pedalboard-friendly enclosure, adding 9VDC power, true-bypass, a
  full wet/dry mix control and expanded rate limits.
details: |-
  The Vintage Ensemble is designed to replicate that original 1976 Chorus
  Ensemble sound, the lush, dimensional chorus that defined an era, with a
  handful of modern updates and upgrades.

  Rather than the big-box, two-button unit with an attached AC cord, the Vintage
  Ensemble puts that voice into a compact, pedalboard-friendly enclosure with
  9VDC power and true-bypass switching. A full wet/dry mix control and expanded
  speed and rate limits extend what the original offered, taking it from classic
  chorus into deeper vibrato territory.

  A Jack Deville original design, the Vintage Ensemble is proudly made in the
  U.S.A. and sold with all-sales-final terms.
specs: |-
  - Recreation of the classic 1976 Chorus Ensemble sound
  - Full wet/dry mix control
  - Expanded speed/rate limits (chorus into vibrato)
  - True-Bypass
  - Pedalboard-friendly 9VDC power
  - Jack Deville original design
  - Made in U.S.A.
