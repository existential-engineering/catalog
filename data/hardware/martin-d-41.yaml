description: A Standard Series dreadnought featuring a solid Sitka spruce top,
  East Indian rosewood back and sides, and elegant abalone appointments
  including hexagon fingerboard inlays and top-edge trim.
details: |-
  The Martin D-41 is part of the Standard Series and represents one of Martin's most refined dreadnought offerings, balancing premium tonewoods with classic Style 41 ornamentation.

  Built around a D-14 Fret Dreadnought body, the D-41 pairs a solid Sitka spruce top with East Indian rosewood back and sides for a powerful, balanced voice with deep bass response and clear highs. A genuine mahogany neck with a satin finish and GE Modified Low Oval profile with High-Performance Taper provides comfortable playability.

  Style 41 appointments include abalone pearl inlays around the rosette and along the top-edge trim, hexagon abalone fingerboard inlays, and antique white binding. An ebony fingerboard and ebony bridge with bone pins and a compensated saddle complete the upscale aesthetic.

  The guitar ships pre-strung with Martin Authentic Acoustic Lifespan 2.0 strings and includes a hardshell case. It carries Martin's Limited Lifetime Warranty.
specs: |-
  - Body Size: D-14 Fret Dreadnought
  - Top: Solid Sitka Spruce
  - Back & Sides: East Indian Rosewood
  - Scale Length: 25.4"
  - Fingerboard: Ebony
  - Nut Width: 1 3/4"
  - Neck Shape: GE Modified Low Oval with High-Performance Taper
  - Neck Material: Genuine Mahogany (satin finish)
  - Bridge: Ebony with bone pins, compensated saddle
  - Tuners: Gold Open Gear
  - Frets: 20 total, joins body at 14th fret
  - Binding: Antique White
  - Inlays: Abalone Hexagon
  - Rosette: Abalone
  - Finish: Gloss
  - Strings: Authentic Acoustic Lifespan 2.0
  - Case: Hardshell included
