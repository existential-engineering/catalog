description: The 1066D is a hand-wired mic-line preamp and equalizer featuring
  the same core design as the 1073, with expanded frequency options and a
  distinctive mid-range character. It includes a 3-band EQ, high-pass filter,
  phase reverse, and uses Carnhill (St. Ives) transformers throughout.
details: |-
  The BAE 1066D is a hand-wired microphone preamplifier and equalizer based on the classic 1073 design lineage, offering expanded frequency options that set it apart from the original 1066. Built with Carnhill (St. Ives) transformers and fully discrete electronics, the unit is hand-soldered with no printed circuit board shortcuts.

  The 3-band equalizer section provides high-frequency shelving at 10kHz, 12kHz, 16kHz, 20kHz, and 24kHz (±16dB); mid-range peaking at 700Hz, 1.2kHz, 2.4kHz, 3kHz, and 7kHz (±16dB); and low-frequency shelving at 35Hz, 60Hz, 110Hz, and 220Hz (±16dB). A switchable high-pass filter offers corner frequencies at 45Hz, 70Hz, 160Hz, and 360Hz.

  The unit features a gain range of 0–80 dB, a phase reverse switch, and an EQ in/out switch. It is particularly favored by guitarists for its distinctive mid-range character. The 1066D is available as both a standalone 19″ 1RU rackmount and as a 500-series-compatible module.

  The rackmount version measures 19″W × 1.75″H × 9″D and weighs 10 lbs (4.54 kg). The module measures 45mm W × 8.75″ H × 10.5″ D and weighs 6 lbs (2.72 kg). Both are available in standard or black faceplate finishes.
specs: |-
  - Frequency Response: 10Hz to -3dB at 55kHz
  - Gain Range: 0–80 dB
  - Mic Input Impedance: ≈1200/300 ohms
  - Line Input Impedance: 10k ohms
  - DI Input Impedance: ≈150k ohms
  - Output Impedance: 65 ohms
  - Max Output Level: +27.4 dBu @ 600Ω
  - CMRR: 100dB min @ 60Hz
  - Equivalent Input Noise: -110 dBu (unweighted, 300kHz BW)
  - Power Requirements: 115/230 VAC, 28W
  - HF Shelving EQ: ±16dB at 10kHz, 12kHz, 16kHz, 20kHz, 24kHz
  - MF Peaking EQ: ±16dB at 700Hz, 1.2kHz, 2.4kHz, 3kHz, 7kHz
  - LF Shelving EQ: ±16dB at 35Hz, 60Hz, 110Hz, 220Hz
  - High-Pass Filter: 45Hz, 70Hz, 160Hz, 360Hz
  - Transformers: Carnhill (St. Ives)
  - Construction: Hand-wired, fully discrete electronics
  - Rackmount Dimensions: 19″W × 1.75″H × 9″D, Weight: 10 lbs (4.54 kg)
  - Module Dimensions: 45mm W × 8.75″H × 10.5″D, Weight: 6 lbs (2.72 kg)
