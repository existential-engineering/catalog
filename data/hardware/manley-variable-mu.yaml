description: The Manley Variable Mu® uses all-tube remote cut-off compression
  and MANLEY transformers. Industry standard for mastering and mix bus
  applications.
details: |-
  Hand Assembled In: California
  Metering: Illuminated Sifam meters
  Factory Options: T-BAR mod (uses 6BA6 × 4 in variable gain stage)
  Introduced: 1994
specs: |-
  - Circuit Type: Fully differential all-tube, transformer-coupled
  - Io Impedance: Balanced inputs & outputs, 600 Ohms
  - Frequency Response: 20 Hz – 25 kHz (±0.1 dB)
  - Thd: <0.1% @ 1 kHz
  - Noise Floor: -85 dB typical
  - Max Output: +30 dBu (26 Vrms), 26 dB headroom
  - Maximum Gain: 35 dB
  - Compress Ratio: 1.5:1
  - Limit Ratio: 4:1 to 20:1
  - Attack: Variable, 25 ms – 70 ms
  - Recovery: 5 steps: 0.2 s, 0.4 s, 0.6 s, 4 s, 8 s
  - High Pass Side Chain: -3 dB @ 100 Hz
  - Threshold: Continuously variable
  - Bypass: Hardwire bypass switch
  - Stereo Link: Stereo link switch (multiple units linkable for surround, custom order)
  - Amplifying Tubes: 5751 or 12AX7 × 2
  - Variable Gain Tube: 5670 × 2 (standard) or 6BA6 × 4 (T-BAR mod)
  - Output Tubes: 12BH7 × 2 (current production since 4/2016); prior to MSLC94006 used 7044 or 5687 × 2
  - Side Chain Rectifier Diodes: 12AL5 × 2
  - Transformers: MANLEY input & output transformers with nickel laminations in mu-metal cases, flat 20 Hz – 25 kHz
  - Input Attenuator: Stepped switch (as of 10/2011); older units use silent dual-ganged potentiometer
  - Power Supplies: Independently regulated B+ and Heater supplies
  - Power Consumption: 80 W (120/240 VAC)
  - Mains Voltage: 100 V, 120 V, or 220–240 VAC (factory set; changeable via transformer switch and fuse change)
  - Mains Frequency: 50–60 Hz
  - Mains Fuse: MDA or MDL SLO-BLO time delay 1 1/4" x 1/4"; 1.25 A for 100–120 VAC; 0.6 A (600 mA) for 220–240 VAC (as of 10/2011)
  - Dimensions: 19" x 3.5" x 10" (chassis 2U; power transformer protrudes 3.5" out the back)
  - Shipping Weight: 23 lbs
