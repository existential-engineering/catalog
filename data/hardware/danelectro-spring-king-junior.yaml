url: https://danelectro.com/pedals/spring-king-junior/
description: Compact spring reverb pedal with a real spring tank. A
  smaller-format successor to Danelectro's original Spring King, designed to fit
  on a pedalboard while preserving authentic spring reverb tones. Features true
  bypass, soft switch, die cast case, and a kick pad for thunderous reverb
  sounds.
details: |-
  Twenty five years ago, Danelectro launched the Spring King, a reverb pedal with a real spring tank. Sales were huge but the pedal itself was huge too. The Spring King Junior delivers the same spring reverb tones with a real spring tank in a compact, pedalboard-friendly size.
specs: |-
  - True bypass
  - Soft switch
  - Die cast case
  - Real spring reverb tank
  - Kick pad (for thunderous verb sounds)
