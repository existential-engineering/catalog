description: BAE Audio offers 500 Series rack enclosures in 6-space and 11-space
  configurations, built with heavy-duty steel chassis and point-to-point wiring.
  Each rack features XLR inputs and outputs with a remote power supply to keep
  transformer interference away from modules.
details: |-
  BAE's 500 Series Racks are available in three configurations: a 6 Space Rack, a 6LB (6 Space Desktop Chassis), and an 11 Space Rack. All units are built with strong steel chassis — not aluminum — and feature shielded wires on individual connectors for serviceability with no PCBs, using point-to-point wiring throughout.

  The remote power supply design keeps the power transformer interference away from the modules for cleaner audio performance. Each rack provides ±16V bi-polar power to hosted 500-series modules via the standard edge-connector bus.

  A conversion kit is available (for units purchased after June 1, 2012) to add rack ears and convert the 6LB desktop chassis to a standard 19-inch rack-mount form factor.
specs: |-
  - 6 Space: ±16V @ 1.6A
  - 11 Space: ±16V @ 2.1A
  - Power Requirements: 115/230 VAC, 36W
  - 6 Space Dimensions: 9.25"W × 5.25"L × 10"D
  - 11 Space Dimensions: 19"W × 5.25"L × 10"D
  - Weight (empty, 6 Space): 8 lbs / 3.63 kg
  - Construction: Steel chassis, point-to-point wiring, no PCBs
