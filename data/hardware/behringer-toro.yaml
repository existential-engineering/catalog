description: Classic analog bass synthesizer in Eurorack format, an authentic
  recreation of the circuits from the legendary Taurus I, with 2 VCOs, a
  low-pass ladder filter and four presets. Its 5-octave range covers
  earth-shaking bass as well as searing lead sounds.
details: |-
  The TORO is an authentic recreation of the legendary Taurus I, the bass synthesizer made popular by Rush, Genesis, Dream Theater and Yes, rebuilt around the original's circuits in a far more accessible instrument.

  Faithful to the Original

  Being able to deliver massive detuned sounds thanks to its 2 VCOs allows the TORO to instantly produce that classic earth-shaking rumble of the original. The TORO isn't just great for getting great bass sounds. Thanks to its 5-octave range, you can also get some nice searing lead sounds.

  Modulation

  The TORO comes with 4 sound presets starting with the classic Toro, Tuba and Bass presets which have been carefully recreated to sound just like the original as well as Variable, which gives you access to all controls so you can shape and fine tune your sound.

  Made for Your Setup

  Each of the front panel controls on the TORO have remained faithful to the original such as Filter and Loudness knobs, a Tune control and the classic Beat knob. Also included are individual CV, Filter and Gate inputs as well as full MIDI implementation.

  Eurorack Ready

  The TORO is designed to fit into a standard Eurorack case. Just connect the power cables to the power supply and mount the module using the included screws. This allows for the TORO to be mixed with other synth modules for a truly unique set up.
specs: |-
  - Monophonic analog bass synthesizer, an authentic recreation of the circuits from the legendary Taurus I
  - Pure analog signal path based on authentic VCO, VCF and VCA designs
  - 2 VCOs for detuned sounds, with octave control for intervals
  - 5-octave range
  - VCO A and B mix fader for control of the internal balance
  - Classic low-pass ladder filter with Cut-off and Emphasis controls
  - Envelopes for filter cut-off and for amplitude
  - 4 presets: Toro, Tuba, Bass and Variable (Variable exposes all controls)
  - Glide with Amount slider and a dedicated On/Off button
  - Large Filter cutoff and Volume knobs, plus Tune and Beat controls, as on the original
  - CV, Filter cutoff and Gate inputs for external control
  - 16-unit Poly Chain for combining multiple synthesizers for up to 32 voice polyphony
  - Comprehensive MIDI implementation with MIDI channel and Voice Priority selection
  - 23 controls
  - Complete Eurorack solution: the main module can be transferred to a standard Eurorack case, mounting screws included
