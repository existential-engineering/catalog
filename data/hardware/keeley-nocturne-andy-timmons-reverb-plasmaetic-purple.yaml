details: |-
  The Nocturne Andy Timmons Reverb isolates the ambient half of Andy Timmons' HALO sound as a standalone effect. This is the Custom Shop Plasmaetic Purple edition. It was developed with Timmons and is built on the same reverberation that defined the HALO Dual Echo and HALO Core pedals, from subtle ambience to large cinematic space.

  Three reverb modes are offered, Nocturne, Spring and Plate, each with its own character. The four-knob layout of Tone, Level, Decay and Modulation covers everything from vintage echo-chamber warmth to a brighter modern wash. A preset switch stores and recalls a favourite setting, and an optional Trails mode lets the reverb fade naturally after the pedal is bypassed.

  The signal path offers true or buffered bypass, expression pedal control, and MIDI for up to 72 presets. The pedal runs mono or stereo, wet/dry, or fully wet for a parallel rig, and is built on the maker's Core architecture.

  The pedal is designed and hand-built in Oklahoma, USA. It won Premier Guitar's Premier Gear award.
specs: |-
  - Three reverb modes: Nocturne, Spring and Plate
  - Controls: Tone, Level, Decay and Modulation
  - Preset switch for storing and recalling a setting
  - Optional Trails mode keeps the reverb decaying when bypassed
  - True or buffered bypass
  - Expression pedal control
  - MIDI control for up to 72 presets
  - Mono, stereo, wet/dry or fully wet operation
  - Custom Shop Plasmaetic Purple finish
  - Designed and hand-built in Oklahoma, USA
