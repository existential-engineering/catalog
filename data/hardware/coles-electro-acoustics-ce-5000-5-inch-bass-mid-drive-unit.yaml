description: The CE 5000 is a versatile 5-inch drive unit from Coles
  Electroacoustics designed for bass/mid or mid-range applications in speaker
  systems, offering a usable frequency response of 60Hz to 10kHz and handling up
  to 40W RMS continuous power.
details: |-
  The CE 5000 is a 5-inch bass/mid or mid drive unit manufactured by Coles
  Electroacoustics, a British company with a long heritage in professional microphone
  and transducer design. This drive unit is suited for two-way or three-way loudspeaker
  system designs requiring a compact mid-range or bass/mid driver.

  The driver covers a frequency range of 40Hz to 12kHz, with a usable frequency response
  of 60Hz to 10kHz at +/-3dB. Its free air resonance is 50Hz, making it suitable for use
  in infinite baffle enclosures of 7 to 15 litres or reflex enclosures of 15 to 20 litres.

  Power handling is rated at 40W RMS continuous sine and 80W programme, with a sensitivity
  of 87dB at 1 watt measured at 1 metre. The nominal impedance is 8 ohms, with a DC
  resistance of 6 ohms. Non-standard impedance options are available upon request.

  The driver uses a 25mm aluminium/paper voice coil former and a paper cone, finished
  in self-colour black. Flux density is 10,000 Gauss.

  Overall dimensions are 135mm x 135mm with a depth of 60mm, and the unit weighs 1.134kg.
specs: |-
  - Frequency Range: 40Hz–12kHz
  - Usable Frequency Response: 60Hz–10kHz (+/-3dB)
  - Free Air Resonance: 50Hz
  - Nominal Impedance: 8 ohm
  - DC Resistance: 6 ohm
  - Max Continuous Sine Handling: 40W RMS
  - System Programme Rating: 80W
  - Flux Density: 10,000 Gauss
  - Sensitivity: 87dB (1W @ 1m)
  - Piston Diameter: 100mm
  - Coil Diameter: 25mm
  - Coil Former: Aluminium/Paper
  - Cone Material: Paper
  - Mounting Hole: 114mm
  - Dimensions: 135mm x 135mm x 60mm
  - Weight: 1.134kg
  - Recommended Enclosure (IB): 7–15 litres
  - Recommended Enclosure (Reflex): 15–20 litres
