description: A limited-edition electric guitar with a solid Swamp Ash body,
  German carve, and Ambra Burst finish with ivory checkerboard binding,
  featuring dual Rivolta P90 pickups.
details: |-
  The Combinata Deluxe-T LTD builds on the legacy of the Rivolta Combinata Deluxe , but with a few bold upgrades that make it unmistakably its own. Its solid Swamp Ash body delivers a rich, resonant tone with punchy lows and clear, sparkling highs, ready for anything from studio sessions to stage lights. The exclusive Ambra Burst finish, lifted from the best-selling Duocata , gives the guitar a warm, glowing presence, while the ivory checkerboard binding adds a touch of refined detail. With every curve and contour carefully considered, the Combinata Deluxe-T LTD combines modern playability with striking aesthetics: confident, distinctive, and designed to be noticed. Features and Specs
