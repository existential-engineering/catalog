details: |-
  The HM2EQ Hammer Dual Channel Tube EQ is a professional-grade dual-mono,
  three-band tube/hybrid equalizer from A-Designs Audio. It is no longer in
  production and has been replaced by the Hammer 2 EQ with enhanced features
  and flexibility.

  The unit features an innovative tube-harmonic filtering system that passes
  consonant and musical 2nd order tube harmonics while eliminating unwanted
  noise. This design philosophy results in a distinctly warm, musical character
  that has made it popular for mastering and high-end tracking applications.

  Each band offers continuously variable boost or cut of ±12dB with selectable
  frequencies ranging from 30Hz to 15kHz. A floating Q circuit self-adjusts
  based on both the gain setting and the program material, contributing to the
  unit's smooth, natural-sounding equalization across overlapping bands.

  The unit employs two transformer-less 12AT7 tubes and a custom toroidal
  power transformer. Build quality is emphasized through custom-milled brushed
  aluminum faceplates and control knobs, a heavy-duty Carling toggle power
  switch, and a blue jewel power indicator lamp.

  Additional features include a low-cut filter at 84Hz, a high-cut filter at
  8kHz, and per-channel EQ In/Out toggle switches for quick A/B comparison.
specs: |-
  - Three-band, dual-mono tube/hybrid equalizer
  - Continuously variable boost/cut: ±12dB per band
  - Selectable frequencies: 30Hz to 15kHz
  - Low-cut filter: 84Hz
  - High-cut filter: 8kHz
  - Floating Q — self-adjusts based on gain and program material
  - Two transformer-less 12AT7 tubes
  - Custom toroidal power transformer
  - EQ In/Out toggle switches per channel
  - Custom-milled brushed aluminum faceplate and control knobs
  - Heavy-duty Carling toggle power switch
  - Blue jewel power indicator lamp
