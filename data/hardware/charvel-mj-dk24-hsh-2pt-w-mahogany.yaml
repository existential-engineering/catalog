details: |-
  The MJ Series DK24 HSH 2PT W Mahogany harkens back to late 1980s Charvel guitars manufactured exclusively in Japan, blending the brand's legacy of high-performance design with premium features and meticulous Japanese craftsmanship. The MJ Series represents a return to Charvel's Japanese manufacturing roots from that era, combining historical authenticity with thoroughly modern specifications.

  Electronics center on a versatile HSH pickup configuration loaded with Seymour Duncan pickups: a Full Shred TB-10 in the bridge, a Custom Flat Strat SSL-6 in the middle, and a custom Alnico II Pro APH-1N at the neck. A 5-position blade switch with volume and tone controls unlocks a wide spectrum of tonal combinations, from crystalline single-coil chime to thick humbucker grind.

  Construction pairs a resonant mahogany body with a hand-rubbed oil-finished, graphite-reinforced Wenge neck. The Speed Neck profile features rolled fingerboard edges for player comfort and a broken-in feel right out of the case.

  Hardware and playability are anchored by a Gotoh Custom 510 Tremolo bridge, Charvel die-cast locking tuners, 24 jumbo stainless steel frets, and a Graph Tech TUSQ XL nut for tuning stability and effortless performance. Dunlop dual-locking strap buttons keep the instrument secure on stage.

  Core specifications include a 25.5" scale length, a 12"-16" compound radius Wenge fingerboard, and a 1.6875" nut width, delivering a modern playing platform built for both precision rhythm work and expressive lead playing.
