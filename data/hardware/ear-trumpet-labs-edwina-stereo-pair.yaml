description: A closely matched stereo pair of the flagship Edwina model. A pair
  of clean and versatile microphones for close-to-medium distance applications
  on stage and in studio.
details: |-
  The Edwina Stereo Pair is a closely matched stereo pair of Edwina, the flagship and most flexible Ear Trumpet Labs model, a versatile large-diaphragm condenser microphone with a smooth sound to match its distinctive but not dominating looks.

  The pair makes for a useful and flexible tool for applications in the studio and on the stage. In stereo, the two microphones make drum overheads and room mics. They can be used in x/y, spaced pair, or ORTF to capture stereo images of acoustic instruments or group performances, and the two also serve as separate vocal and instrument mics for a live performance.

  Ear Trumpet Labs suggests the pair on stage and in studio for vocals, close-miking acoustic instruments (guitar, mandolin, banjo, fiddle), drum overheads and electric guitar cabinets. The capsule and electronics are tuned for close vocal use on loud stages, with feedback rejection, and each microphone can be side or end addressed using its pivoting bracket.

  Each microphone uses transformerless FET fully balanced electronics, hand-wired with film caps, precision resistors and hand-tested, matched transistors, with component values tuned for the individual circuit. Internal shock dampers keep handling noise down, and an integral silk and mesh pop filter controls plosives without loss of clarity.
specs: |-
  - Hand-made microphone with unique appearance
  - Closely matched stereo pair of the flagship Edwina model
  - Side or end address, using pivoting bracket
  - Capsule and electronics tuned for close vocal use on the loudest of stages with excellent feedback rejection
  - Internal shock dampers for minimal handling noise
  - Integral silk and mesh pop filter, for effective control of plosives without loss of clarity
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000Hz, 94 dB): -41.9 dB (8 mV/Pa)
