description: The 812ce is a Grand Concert acoustic-electric from Taylor's 800
  Series, pairing Indian rosewood back and sides with a Sitka spruce top and
  V-Class bracing — delivering richly textured sound with lush overtones, crisp
  trebles, and warm low end, with ES2 electronics.
details: |-
  The 812ce combines Indian rosewood back and sides with a Sitka spruce top in a compact Grand Concert body. V-Class bracing provides increased volume, sustain, and improved intonation — a hallmark of Taylor's premium builds. The Venetian cutaway grants easy upper-register access.

  Expression System 2 behind-the-saddle electronics translate the guitar's acoustic voice faithfully to a PA or amplifier. Premium appointments include West African Crelicam Ebony fretboard and bridge, rock maple body binding, smoked nickel tuners, and a rosewood armrest for playing comfort.

  The gloss 4.5 body finish pairs with a satin neck for tactile playability. Element fretboard inlays add subtle visual detail. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Concert
  - Top: Sitka Spruce (solid, gloss)
  - Back/sides: Indian Rosewood (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Tropical Mahogany (satin)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Bridge pins: West African Ebony with Green Abalone Dots
  - Body binding: Rock Maple
  - Fretboard binding: Pale Non-Figured Maple
  - Armrest: Rosewood
  - Pickguard: Rosewood
  - Inlays: Element
  - Scale length: 24-7/8"
  - Tuners: Smoked Nickel
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
