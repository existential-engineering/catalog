details: |-
  The 8,000-Watt VSX218B is a direct radiating passive twin 18" subwoofer ideally suited for a broad range of speech and music sound reinforcement applications in both fixed, portable, and touring audio systems. A dual ported bass reflex system featuring dual high-powered 18" low frequency drivers that provide extended low frequency response to well below 30 Hz. Fast and accurate transient response enables the VSX218B to generate massive quantities of tight low end output that is virtually distortion-free. Integral M10 rigging points support multiple configurations; ergonomic carry handles are integrated into the cabinet sides for portable use. The cabinet is constructed of internally braced plywood with a semi-matt black powder-coated finish and a rugged perforated steel mesh grille backed with reticulated foam.
specs: |-
  - type: Passive dual 18" subwoofer
  - configuration: Dual ported bass reflex
  - drivers: 2x 18" low frequency drivers
  - powerHandlingContinuous: 2,000 W
  - powerHandlingPeak: 8,000 W
  - frequencyResponse: below 30 Hz (lower limit)
  - rigging: Integral M10 rigging points
  - enclosure: Internally braced plywood
  - finish: Semi-matt black powder coat
  - grille: Powder-coated perforated steel mesh with reticulated foam backing
  - connectors: 4-pole twist-lock speaker (Speakon) + barrier strip, input and link output
