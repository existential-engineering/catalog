details: |-
  Featuring the dark and mysterious Emerald Night metallic finish, this Penguin combines period-accurate features with modern twists. A mahogany body with vintage chambering and TV Jones Ray Butts pickups provide twang, growl, and power.

  Vintage Chambering: The chambered mahogany body enhances harmonic richness by letting air resonate between the top and body for livelier, more articulate tone.

  Ray Butts Filter'Tron Pickups: TV Jones Ray Butts Ful-Fidelity Filter'Tron pickups produce tighter bass with an open, three-dimensional sound that captures the classic Filter'Tron voice.

  Classic-Modern Appointments: Jeweled knobs, gold sparkle binding, Mother of Pearl thumbnail inlays and a Bigsby B3GP String-Thru vibrato blend vintage Penguin styling with modern playability.
