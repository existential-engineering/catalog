description: Compact, high quality audio mixer.
details: |-
  The Black Mixer V2 is a compact, high quality audio mixer for Eurorack, with three AC coupled inputs and three buffered outputs in 6HP.

  The buffered outputs allow the same signal to be sent to several signal processing devices simultaneously. Splitting the output to a low pass and a high pass VCF, for example, builds advanced bandpass and notch filters out of two filters that were not designed to be ganged.

  Input and output protection is fitted throughout, along with protection against a reversed PSU connection, and mixer gain is unity so the module sums without colouring the level.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. When designing the Black Series, Erica Synths did not economise on module width, putting design and usability first.

  Maximum input level runs between -10V and +10V, the panel is 6HP wide at a depth of 25mm, and power draw is 8mA on each of the positive and negative rails.
specs: |-
  - 3 AC coupled inputs
  - 3 buffered outputs
  - Input and output protection
  - Protection against reverse PSU connection
  - Max input level -10V - +10V
  - Mixer gain 1
  - Power consumption +8mA, -8mA
  - Module width 6HP
  - Module depth 25mm
