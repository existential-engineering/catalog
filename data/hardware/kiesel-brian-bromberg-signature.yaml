details: |-
  The Brian Bromberg-designed B24 is a fusion between "old school" and "new school". The flow of the body running analogous to that of the headstock and the traditional sound provided by its radiused Radium pickups is the perfect blend of the two styles.

  Compared to previous designs, the upper horn is further extended to align with the 12th fret, which, according to Bromberg in a 2011 interview, "means it balances… in playing position". The bottom horn keeps the same aesthetical vibe of the bass's design, but curves along the leg to create a natural balance while seated.

  As a whole, the bass offers an ergonomic flow that creates maximized comfort.
specs: |-
  - Construction: neck-through
  - Scale length: 34"
  - Frets: 24 medium-jumbo stainless steel frets, .103" wide x .048" tall
  - Fingerboard: ebony with 14" radius
  - Neck: tung-oiled maple with two high-strength carbon-fiber reinforcing rods and fully-adjustable dual action truss rod
  - Body: alder
  - Pickups: Kiesel Radium radiused single coils
  - Electronics: 18V active/passive electronics, master volume/push-pull active-passive switch, pickup blend, stacked concentric bass/treble
  - Bridge: Hipshot A-Style bridge, .748" (19mm) spacing
  - Tuners: Kiesel premium tuners, 20:1 ratio
  - Headstock: Bromberg signature headstock
  - Inlays: abalone Brian Bromberg signature inlays with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Strings: Dunlop Super Brights
  - Neck width options: 1.53", 1.76" or 2.02" wide at the nut, 0.77" thick at the 1st fret, 0.88" thick at the 12th fret
  - Dimensions: 45.75" long, 1.625" thick, 13.5" wide, or 46" long, 1.625" thick, 13.75" wide
  - Weight: 8.8 to 9 lbs
  - Active electronics run on internal batteries rather than an external power jack
  - Offered in several string counts, configured to order; the gallery shows 4-string and 5-string builds
  - Built to order with a choice of body, top, fingerboard and finish options
