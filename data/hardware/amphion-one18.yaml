details: |-
  The Amphion One18 is a two-way passive nearfield studio monitor featuring a 1" titanium tweeter and a 6½" aluminum woofer with a crossover point set at 1600 Hz. The passive design requires an external power amplifier (100–350 W recommended), allowing the user to choose amplification to suit their needs.

  Amphion's advanced acoustic design minimizes electric clutter. Electrical purity allows harnessing the full power of the latest signal processing devices, room-correction and other types of advanced software without introducing coloration from active electronics.

  The low crossover point allows the speakers to operate in a point-source manner, leading to industry-leading phase coherence and pinpoint imaging. Timing properties between drivers are improved as the waveguide aligns the voice coils of the tweeter and woofer to the same acoustic plane.

  Instead of reflex ports, the One18 uses a carefully tuned passive radiator for bass loading. This improves bass performance and energy transfer by loading the room more evenly and naturally compared to a typical ported design.

  The One18 is handmade in Finland and offers even dispersion suitable for multiple listening positions. It can be combined with Amphion's BaseTwo25 subwoofer for extended low-frequency response.
specs: |-
  - Operating Principle: Two-way, passive radiator
  - Tweeter: 1" titanium
  - Woofer: 6½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 8 Ω
  - Sensitivity: 85 dB @ 2.83V/1m
  - Frequency Response: 45–20,000 Hz ±3dB
  - Power Recommendation: 100–350 W
  - Dimensions (H×W×D): 380×190×305 mm
  - Weight: 10 kg (22 lbs)
  - Manufacturing: Handmade in Finland
