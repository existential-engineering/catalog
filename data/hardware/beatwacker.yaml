details: |-
  Analogue style drum machine with 16 synth voices. Beat wacker is a simple to
  use pocket sized beat making application, that has 16 analog-like synthesizers
  for its sound source.

  All the parameters of the synth voices are exposed for maximum flexibility and
  sound exploration. It's perfect for minimalistic beat and loop production and
  provides one with tons of fun while creating those sick sounds.

  And on top of everything, it can record unlimited high quality audio.
  Beatwacker is a free application.

  Tempo, swing and length parameters are saved per project. All parameters can
  be typed in.
specs: |-
  - 16 step sequencer
  - 16 separate synth voices
  - 4 patterns per project - upgradable to 16
  - Record high quality audio to .wav file
  - Tempo from 60 to 200 bpm
  - Select pattern length from 1 to 16 steps
  - 3 analog style waveforms for the main oscillator - sine, square and triangle
  - Noise generator
  - Frequency modulation
  - Sine wave oscillator
  - Low pass resonant filter
  - Trigger probability
  - Volume
  - Waveform selector
  - Attack time
  - Decay time
  - Sustain level
  - Pitch of the main oscillator
  - Envelope to pitch modulation amount
  - Noise level - cross-fade with the main oscillator
  - Cutoff frequency
  - Resonance
  - Pitch of the FM oscillator
  - FM amount
  - Randomize voice parameters
  - Copy voice
  - Copy pattern
  - Save and load unlimited number of projects
  - Shift button for switching between patterns
