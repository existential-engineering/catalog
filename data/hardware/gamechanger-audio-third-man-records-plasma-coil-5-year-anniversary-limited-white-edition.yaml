description: A white 5-Year Anniversary edition of the Plasma Coil high-voltage
  distortion pedal made with Third Man Records, with two-band EQ, a VOLTAGE
  control over the Plasma tube and an EFFECTS knob offering six harmonic modes.
details: |-
  Natural noise gate: as soon as the player stops playing, the electrical discharge within the gas-filled tube is interrupted and the pedal will not produce any output signal at all. It eliminates all of the in-between noises created by the instrument's pick-ups or by humming strings, which allows extreme contrasts between individual notes.

  Extremely wide EQ: the Plasma Coil loses the original dry input signal and creates a new signal from fluctuations in the electromagnetic field surrounding the gas-discharge tube. This allows for a very wide range of frequencies, and dedicated knobs boost and cut the lows and highs.

  Unique harmonic saturation: Plasma converts the instrument's signal into a rapid series of electric discharges, which results in a large amount of non-linear harmonic saturation. That causes extremely rich and responsive attacks and brings out screeching sharp overtones and harmonics. These harmonic artifacts, produced as a by-product of the high voltage discharge, are uncommon in traditional signal amplification.
specs: |-
  - Two EQ controls to boost or cut low and high frequencies
  - VOLTAGE knob adjusts the amount of electrical current sent to the Plasma tube
  - EFFECTS knob selects one of six effect types: a volume boost, two subharmonic modes an octave down, one upper harmonic mode an octave up, and two mixed modes combining upper and lower harmonics
  - Effects footswitch engages the Plasma Coil's effect circuit
  - Master VOLUME knob cuts or boosts the output signal level
  - Silent ON/OFF footswitch
  - Back-panel toggle configures the effects footswitch as a latching ON/OFF switch or as a momentary switch
