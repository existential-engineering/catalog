description: Discover the Model 330/12, designed with twelve strings and single
  coil pickups for a full-bodied acoustic tone.
details: |-
  The Rickenbacker Model 330/12 is essentially the twelve-string version of
  the iconic Model 330 semi-acoustic guitar. Careful acoustic research has
  resulted in the full, rich and warm sound that has made this model a
  long-standing favorite among players seeking a distinctive jangly
  twelve-string voice.

  Two single coil pickups are mounted on a full-size semi-acoustic body, which
  is accented by a traditionally shaped slash sound hole. The full double
  cutaway construction provides comfortable access to all twenty-one frets
  along the Rosewood fingerboard, which is punctuated by simple dot inlay fret
  markers.

  The maple body and maple-and-walnut set-in neck combine to deliver the
  chiming, articulate tone Rickenbacker twelve-strings are known for. Hardware
  includes Gotoh machine heads, a six-saddle bridge, and the signature 'R'
  tailpiece. Standard output is monaural through a single jack plate.
