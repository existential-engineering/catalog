description: >-
  The BOSS DR-220 Dr. Rhythm is a budget-priced digital drum machine released in
  1985, available in two versions with either acoustic or electronic drum
  samples.
details: |-
  The DR-220 Dr. Rhythm series represents an affordable entry into drum machines, building upon the earlier DR-110 design. Both models feature a non-backlit LCD matrix display panel, which limits usability in low-light conditions. The front panel includes 16 buttons and a 4x3 grid of velocity-less pads, complemented by a volume slider for easy level control.

  Capabilities include 6-channel polyphony with some channel-shared restrictions preventing simultaneous playback of certain sounds. The machines offer 32 built-in patterns plus 32 user-programmable slots, with enough memory for eight complete songs. Patterns can be entered either in real-time or step-by-step, with adjustable accent and volume per voice. The 12-bit drum sounds feature characteristic grit and hiss typical of mid-1980s technology.

  Connectivity options consist of headphones output, mono main output, and trigger I/O supporting pulse +5V signals. Power comes from either six AA batteries or an external 9V power supply. The compact design includes a padded silver-vinyl carrying case for protection while maintaining control access. Despite lacking MIDI and using only 128 KB ROM per voice, these machines remain compact and portable.
specs: |-
  - Polyphony: 6 voices
  - Memory: 32 preset patterns, 32 user slots
  - Song capacity: 8 songs
  - Tempo range: 40-250 BPM
  - Drum sound resolution: 12-bit
  - Pads: 12 (4x3 grid, velocity-less)
  - Control buttons: 16
  - Display: Non-backlit LCD matrix
  - Outputs: Headphones, mono main, trigger I/O (+5V)
  - Power: External 9V or 6 AA batteries
  - ROM per voice: 128 KB
releaseDate: "1985"
releaseDateYearOnly: true
