description: An active dynamic microphone combining studio clarity with stage
  durability. Features a handmade ODC50 capsule and 3D Pop Noise Diffuser for
  rich, detailed sound while reducing bleed, feedback, and plosives. Built-in
  active circuitry adds 6–8 dB output for enhanced presence on live stages.
details: |-
  The OD505 is an active dynamic vocal microphone built around Austrian Audio's handmade ODC50-SC capsule. Its dual-capsule design pairs an active front capsule with a passive polarity-rotated lower capsule, achieving supercardioid directionality with tight focus and strong off-axis rejection.

  The proprietary 3D Pop Noise Diffuser reduces plosives, bleed, and feedback — key concerns in live performance environments. Built-in active circuitry boosts output by 6–8 dB, requiring 48V phantom power.

  Designed and built in Vienna. Recognized as a Sound on Sound 2023 Nominee, PAM Recognition, and NAMM Tech Finalist 2023.
specs: |-
  - Directional Characteristic: Supercardioid
  - Frequency Range: 35 Hz – 16 kHz
  - Sensitivity: 4.4 mV/Pa
  - Maximum SPL: 154 dB
  - Low-cut filter: 120 Hz (2nd order)
  - Impedance: 275 Ω (symmetrical)
  - Load Impedance: > 1 kΩ
  - Supply Voltage: 48V phantom power (< 1 mA)
  - Connector: XLR 3-pin
  - Capsule: ODC50-SC (handmade)
  - Active circuitry boost: 6–8 dB
  - Dimensions: 194 × 53 × 53 mm
  - Weight: 340g
