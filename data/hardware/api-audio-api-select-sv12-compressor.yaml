description: 500-series compressor from API's value-tier Select line, based on
  the original ATI Paragon Console compressor circuit. Features THRUST® circuit,
  Hard/Soft knee, stereo link via true RMS summing, adaptive attack/release, and
  dual LED metering.
details: 500-series compressor based on the ATI Paragon Console compressor
  circuit, re-engineered for 500-series compatibility. THRUST® circuit for
  high-frequency protection. Hard/Soft knee switching. Stereo link with true RMS
  power summing. Adaptive attack (10–40 ms) and release (30–400 ms). Variable
  threshold (−40 to +15 dBu), ratio (1:1 to 10:1), and makeup gain (0 to +20
  dB). Dual LED metering for output level and gain reduction. VPR Alliance
  compliant.
specs: |-
  - Input impedance: >20 kΩ (balanced)
  - Bandwidth: ±0.5 dB (20 Hz–30 kHz)
  - THD+N @ 1 kHz: <0.03%
  - Max level: +24 dBu
  - S/N ratio: 112 dB
  - Threshold: −40 to +15 dBu
  - Ratio: 1:1 to 10:1
  - Makeup gain: 0 to +20 dB
  - Attack: 10–40 ms (adaptive)
  - Release: 30–400 ms (adaptive)
  - Power: ±16V DC @ 100 mA
  - Dimensions: 1.5″ × 5.25″ × 7.0″
  - Weight: 1.0 lb
