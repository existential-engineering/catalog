details: |-
  The 9S is an active studio subwoofer designed to complement Dynaudio's LYD line and other Pro studio monitors, including the classic BM range. With a compact double front baffle cabinet and a brand-new 9-inch long-throw MSP woofer, it targets mixing and mastering work where accurate, controlled low end matters more than raw output. In size it resembles the BM 9S II it replaces, but performance is closer to the larger BM 14S II.

  A 300W Class D amplifier module drives the long-throw 9-inch MSP driver, reproducing frequencies down to 22Hz with a maximum SPL of 106dB. The sealed cabinet, 37mm front baffle, and short voice-coil-in-long-gap motor design are engineered to keep distortion low across the operating band so the subwoofer integrates cleanly with the satellite monitors rather than colouring the mix.

  Connectivity covers stereo and surround workflows. Two XLR stereo inputs and a dedicated XLR LFE input feed the sub, while two XLR SAT outputs (with a defeatable high-pass filter at flat / 60Hz / 80Hz) pass signal back to the main monitors. An XLR Slave output allows daisy-chaining a second 9S for higher SPL or more even bass coverage. A continuously variable low-pass filter from 50Hz to 150Hz and a 0/180-degree phase switch handle crossover and room integration.

  The 9S is intended as a drop-in low-end extension for any Dynaudio Pro monitoring setup, whether stereo or multichannel. By taking the burden of sub-50Hz reproduction off the satellites, it frees the main monitors to focus on the midrange and upper bass where they perform best, letting engineers commit to low-end decisions with greater confidence.
