details: |-
  The PBR XLR 16F DSub is a studio-grade 16-point patchbay with 16 audiophile-grade gold-plated female XLR connections on its front panel, enabling easy access to microphone and line-level inputs in a single rack unit. The rear features two DB25 connectors that carry all 16 channels to a compatible mixer or audio interface, simplifying cable management. Built with a reinforced steel chassis and black-anodized aluminum faceplates.
specs: |-
