description: Stable is a standalone processing amplifier and glitch stabilizer
  for Composite/Component video. It provides control over contrast, brightness,
  hue and saturation while extracting and re-inserting synchronization to keep
  the output signal stable.
details: |-
  This listing is for the module + enclosure, making it standalone (no Eurorack case and power required). The module alone can be found here . Stable is a processing amplifier and glitch stabilizer. – Processing Amplifier

  The processing amplifier part gives control over contrast, brightness, hue and saturation of a Composite video signal, allowing for fine tuning of each of the parameters manually. In addition to manual controls, CV inputs and attenuverters on each of the parameters opens Stable to external modulation, from DC to video rate signals, so it can be easily integrated in the 1V video ecosystem. To make the integration with video generators even easier, a sync output at the back of Stable can be used to sync modules that requires it. Internal modulation is also possible, thanks to the two 1V jack outputs:

  – pre-processor output: unprocessed video input signal, resulting in a solarization effect when used to modulate contrast
  – post-processor output: processed video signal, creating feedback loops when patched into the processor parameters, which generate effects typical of analog video glitch

  Self modulation makes Stable really powerful on its own, and using other processing modules in the loop extends the possibilities further. It is also possible to process Y from Component video, however, only the black and white information will be processed (since the color information is contained in the Pb and Pr signals). In this case, the all-pass filter used for hue shift will act as an enhancer type of effect, with the saturation knob controlling the intensity of the enhance. The chroma filtering switch can be set to off to avoid unwanted filtering, which results in a sharper picture, especially in HD formats. – Glitch Stabilizer

  Composite video glitch processors can create very distinct effects, mainly because the black and white (Luma) and colors (Chroma) information are merged into a single video signal, which will affect each other when altered with such devices. However, one issue is that the synchronization signal is also embedded with Luma and Chroma, meaning that it is also altered, and if sync is too degraded, the receiving device (LCD monitor, video projector, capture card, etc…) may not be able to decode it properly, resulting in drops/blue screen. Stable solves that by extracting the synchronization from the clean signal present at the processor input, and later re-insert it to the glitched signal in the stabilizer part, along with adequate clipping and blanking, ensuring a stable signal in all instances. A similar technique is used in the processor part, meaning that both RCA outputs will provide a valid signal, regardless of what's happening to the video content. It is also possible to use the stabilizer part to process Composite/Component Y video with 1V compliant video modules, by connecting one of the processor outputs into such a module, and the output of the module back to the stabilizer jack input. It can also be processed with audio modules, however the bandwidth will probably be too limited, resulting in the color and finer details to be filtered. Then it's important to note that Stable isn't a TBC, so it needs a stable signal at the processor input, which means that it may not work properly with devices like VCRs or if the signal at the processor input is glitched/out of spec. Furthermore, the stabilizer part will correct hard glitch effects caused by invalid sync (ie: pictures bending horizontally, scrolling up/down/left/right), where a TBC may be able to display some of it. Since Stable signal path is purely analog, it won't "freeze" the picture or part of it as a TBC generally does with really distorted signals. Stable supports the following Composite (SD) & Component (SD/HD) formats:

  - 288p50
  - 240p59.94
  - 576i50 (PAL)
  - 480i59.94 (NTSC)
  - 576p50
  - 480p59.94
  - 720p50
  - 720p59.94
  - 720p60
  - 1080i50
  - 1080i59.94
  - 1080i60
  - 1080p23.98
  - 1080p24
  - 1080p25
  - 1080p29.97
  - 1080p30

  The format is detected and selected automatically. Assembled standalone, module comes into an enclosure with a +12V DC wall wart. Documentation
