description: >-
  An extraordinarily rare 64-oscillator additive synthesizer from Con Brio, with
  only two units ever built at $30,000 each, featuring dual manuals and a
  four-track sequencer.
details: |-
  The Con Brio ADS 200 stands as one of the rarest and most ambitious synthesizers ever produced. Released in 1980, only two units were manufactured, each carrying a price tag of $30,000. Wendy Carlos praised it as having "the most sensible human interface yet seen on a digital synth," a remarkable endorsement from one of electronic music's most discerning pioneers.

  The instrument packed 64 oscillators capable of additive synthesis, with an architecture expandable to 256 operators. Beyond pure additive work, it supported phase modulation similar to Casio's later CZ series, as well as FM synthesis with up to 256 operators. A 16-stage graphic envelope for both frequency and amplitude provided extraordinarily detailed control over timbral evolution, and a musical notation display offered an unusual visual feedback mechanism.

  The ADS 200 succeeded the even rarer ADS 100 from 1980, of which only one was built and never sold. That predecessor was a large system with a separate control cube and TV monitor for envelope display. The ADS 200 consolidated everything into a more practical dual-manual instrument with 61 keys per manual, 32 patches, 32 performances, and a four-track sequencer with CV/Gate outputs.

  In 1982, Con Brio released the ADS 200-R, a 32-voice rackmount version expandable to 64 voices with a 16-track polyphonic sequencer and 80,000-note storage at approximately $20,000. Only one was built and sold. The company ultimately closed as affordable digital synthesizers like the Yamaha DX7 transformed the market. One of the original ADS 200 units was used by the Moog Cookbook and is currently owned by synthesizer historian Brian Kehew.
specs: |-
  - Polyphony: 64 voices (upgradable to 256 oscillators)
  - Oscillators: 64
  - Synthesis: Additive, phase modulation, FM (up to 256 operators)
  - Envelope: 16-stage graphic envelope for frequency and amplitude
  - Keyboard: 2 manuals (61 keys each)
  - Memory: 32 patches; 32 performances
  - Sequencer: 4-track with CV/Gate
  - Arpeggiator: Various patterns
  - Effects: None
  - Display: Musical notation display
