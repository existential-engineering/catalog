details: |-
  A MIDI retrofit kit for the black and gold face ARP Odyssey Mk2. It adds MIDI control of note pitch, pitchbend, modulation, filter cutoff, sustain and slide or portamento, so the synthesiser can be played from a DAW, sequencer or other controller, without altering the Odyssey's own functionality.

  Control switches automatically between the synthesiser's keyboard and MIDI, and any of the sixteen MIDI channels can be selected. Notes cover MIDI note numbers 36 to 96 and can be transposed, and the pitchbend range is selectable between two semitones, a fifth or an octave. Aftertouch, velocity and pitchbend can each be routed to control volume and filter cutoff.

  Default controller assignments are CC#1 for the Odyssey's own LFO, CC#64 for sustain, CC#65 and CC#5 for portamento on or off and portamento time, and CC#16 for the low pass filter cutoff. The kit's own MIDI-syncable LFO is reached through CC#12 for sync, CC#13 for waveshape, CC#14 for speed, CC#15 for LFO to VCO amount and CC#17 for LFO to filter cutoff amount. All of these assignments can be moved to different controllers.

  The kit adds MIDI In and MIDI Thru DIN sockets and a push button for programming the MIDI setup, which is held in non-volatile EEPROM memory. The kit's own LFO can modulate the VCO and the filter cutoffs.

  The kit comprises a MIDI circuit board that fits inside the ARP Odyssey, a small pack of DIN sockets and mounting hardware, a large pack of cable assemblies, user instructions and step by step fitting instructions. All kits are checked and tested before despatch, and fitting is a job for a competent synthesiser service engineer.
specs: |-
  - Fits the ARP Odyssey Mk2 (black and gold face)
  - Adds MIDI In and MIDI Thru DIN sockets plus a programming push button
  - Any of the 16 MIDI channels can be selected
  - Note range: MIDI note numbers 36 to 96, transposable
  - Pitchbend range selectable: 2 semitones, a fifth or an octave
  - Controls note pitch, pitchbend, modulation, filter cutoff, sustain and portamento
  - Built in MIDI-syncable LFO that can modulate the VCO and filter cutoffs
  - Default assignments: CC#1 LFO, CC#64 sustain, CC#65 and CC#5 portamento, CC#16 filter cutoff
  - LFO parameters on CC#12 sync, CC#13 waveshape, CC#14 speed, CC#15 LFO to VCO, CC#17 LFO to filter
  - All controller assignments are remappable
  - Setup stored in non-volatile memory (EEPROM)
  - Powered from the host synthesiser, so the kit has no power input of its own
