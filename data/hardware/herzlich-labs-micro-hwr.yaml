description: A 2hp dual passive half-wave rectifier for extracting positive and
  negative half-waves from audio or CV signals.
details: |-
  The power to tear apart and re-assemble is in your hands. Sine waves think they're so cool and smart. One instant they're positive, the next, they're negative. Always with the back and forth they are, them and lots of other waveforms too, I might add. Now, I don't have anything in particular against waveforms, but they sure seem content with this whole wiggly business, don't they? Don't you think it was time someone showed those waveforms who's in charge around here, who gets to decide what's really up and what's down? Well, let me show you a little invention I call Micro HWR. A world of audio and CV mangling awaits you - go ahead, try removing half of a sine wave, you nothing's gonna happen? You're going to have instant harmonic distortion, and you didn't even have to do anything - sometimes, less is truly more.
specs: |-
  - Input a waveform to surgically extract positive and negative half-waves
  - Input two waveforms to create new, forbidden, combined waveforms
  - Processes both CV and audio with great results
  - You can even input them at different frequencies, or inverted
  - High quality components ensure minimal intrusion on your signal
  - Two-for-one passive design - two half-wave rectifiers in one module
  - Passive design - no power required
