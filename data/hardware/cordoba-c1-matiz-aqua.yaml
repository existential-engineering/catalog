details: |-
  Bring your music to life in full color with the Protege C1 Matiz! A fresh take on the traditional aesthetic of the nylon-string guitar, the Matiz series combines maple accents and traditional tone woods in 4 eye-catching colors: Aqua, Pale Sky, Classic Blue, and Coral. Spruce top and Mahogany back and sides provide the projection and warmth associated with a nylon string guitar, while the Maple head plate, bridge, and full-scale fretboard give the C1 Matiz an all-new look with a lively tonal response. A satin polyurethane finish provides a layer of protection against nicks and scratches. The ghost rosette, designed after Cordoba's traditional wood rosette, allows the eye-catching colored tops of the C1 Matiz to shine through and take center stage. Includes a color-matched gig bag made of recycled nylon so you can rest easy knowing your instrument is protected in a responsible and sustainable fashion.
