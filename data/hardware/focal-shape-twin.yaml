url: https://www.focal.com/products/shape-twin
description: 2.5-way d'Appolito monitor with dual 5" Flax woofers, dual 21 cm
  passive radiators, and an Aluminium-Magnesium M-shaped tweeter, designed for
  midfield monitoring with high SPL.
specs: |-
  - 2.5-way d'Appolito monitor
  - Woofers: 2 × 5" Flax membrane
  - Tweeter: 1" Aluminum-Magnesium M-shaped dome
  - Passive radiators: 2 × 21 cm
  - Frequency response (±3 dB): 40 Hz – 35 kHz
  - Maximum SPL (peak @ 1 m): 110.5 dB
  - High frequency amplifier: 50 W class AB
  - Mid/bass amplifiers: 2 × 80 W class AB
  - Bass/midrange level (160 Hz): adjustable ±3 dB
  - Bass level (>250 Hz): adjustable ±6 dB
  - Treble level (<4.5 kHz): adjustable ±3 dB
  - High-pass filter: Full range, 45 Hz, 60 Hz, 90 Hz
  - Dimensions (H × W × D): 47.8 × 21.1 × 27.9 cm (18.8 × 8.3 × 11 in)
  - Weight: 11 kg (24.3 lb)
