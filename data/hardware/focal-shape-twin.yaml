details: |-
  Shape Twin is the flagship of the Shape line. This monitoring loudspeaker features excellent readability across the entire audio spectrum, combined with extended low-frequency response and a high SPL (110.5 dB) for its size. Equipped with two 5" (13 cm) Flax cone woofers reproducing the 40 Hz - 2.5 kHz register, it shines in terms of performance and design.

  Reference monitor: Flax membranes on the woofers, an aluminium-magnesium "M" profile tweeter, three class AB amplifiers and two 21 cm passive radiators make Shape Twin a work tool with a vast and precise stereophonic image.

  Compact design: its compactness makes it easy to integrate, even in the smallest of spaces. Its 2.5-way d'Appolito design offers a decisive advantage in terms of bass and low-midrange register control, always critical in a small space. This monitor expresses its full potential from a listening distance of 1 m.

  Functional: XLR and RCA inputs, adjustable bass and treble levels, adaptable 160 Hz crossover and a disengageable high-pass crossover are among the functions and settings available.

  Style and discretion: alongside an MDF cabinet body partly covered with real walnut veneer, Shape Twin is very stylish. Compact, it is as discreet as it is flexible in its positioning, thanks to the mounting inserts.
specs: |-
  - Product type: 2.5-way monitor
  - Woofer: 2 x 5" Flax membrane
  - Tweeter: 1" aluminium-magnesium M-shaped dome
  - Frequency response (+/- 3dB): 40 Hz - 35 kHz
  - Maximum SPL (peak @ 1m): 110 dB
  - High frequency amplifier: 50 W, class AB
  - Mid-range and low frequency amplifier: 2 x 80 W, class AB
  - Inputs: XLR symmetrical 10 kOhms, RCA asymmetrical 10 kOhms with compensated sensitivity
  - High-pass filter: full range, 45 Hz, 60 Hz, 90 Hz
  - Bass/midrange level (160 Hz): adjustable +/-3 dB
  - Bass level (>250Hz): adjustable +/-6dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: HPF, LF Shelv, LMF EQ, HF Shelv
  - Power On LED
  - Local supply: 220-240V (T500mAL / 250V fuse) or 100-120V (T1.6AL / 250V fuse)
  - On/Off switch on the rear panel
  - Two 21 cm passive radiators, d'Appolito configuration
  - Height: 47.8 cm / 18.8 in
  - Width: 21.1 cm / 8.3 in
  - Depth: 27.9 cm / 11 in
  - Weight: 11 kg / 24 lb
