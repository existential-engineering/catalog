description: The Chandler Limited RS660 Compressor is a handmade, mono/linkable,
  transformer-balanced valve compressor and limiter. Building upon the historic
  EMI RS124 and Fairchild 660 compressors used at Abbey Road Studios in the
  1960s, it also features a THD mode for coloration without compression.
details: |-
  The Chandler Limited RS660 Compressor is a handmade, mono/linkable, transformer-balanced valve (vacuum tube) compressor and limiter in a dual rack space chassis with an internal power supply. Building upon advancements that began with the historic EMI RS124 and Fairchild 660 compressors used at EMI's Abbey Road Studios during the 1960s, the RS660 distills them into a refined and elegant compression circuit fashioned around a 6386 valve.

  For coloration without compression, the RS660's THD (Total Harmonic Distortion) mode produces overdrive and distortions including heavy to light harmonic distortion for signal coloration. Capable of controlling a multitude of dynamic sources from vocals to explosive drums and raucous guitars.

  Controls include Input (variable, stepped special order), Output Attenuator (variable, stepped special order), Time Constant (selectable, 7 settings), Compressor Modes (THD, Limit, Comp), Output Impedance (200/600 ohms, switchable), and Stereo Link (switchable). Standard units ship with variable controls; stepped versions available via special order.
