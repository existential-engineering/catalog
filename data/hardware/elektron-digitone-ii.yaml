description: >-
  Pull your sound through the prism and into a spectrum of dazzling tones and
  timbres. Digitone II unleashes layer upon layer of exciting sonic
  possibilities.
details: |-
  The Digitone II is a 16-voice FM synthesis instrument with 16 tracks and a 128-step sequencer featuring Euclidean sequencing. It offers four synth machines: Wavetone, Swarmer, FM Tone, and FM Drum, each providing different approaches to FM sound design.

  Filter options include Multi-Mode, Lowpass 4, Equalizer, Comb-, Comb+, and Legacy LP/HP types. The unit features chord mode, arpeggiator, and Song Mode for complete track creation. Overbridge integration enables tight DAW connectivity.

  Housed in a sturdy steel casing measuring 215 x 176 x 63 mm and weighing 1.48 kg, with a 128 x 64 pixel OLED display and DIN Sync output capability.
specs: |-
  - 16-voice polyphony, 16 tracks
  - 4 synth machines: Wavetone, Swarmer, FM Tone, FM Drum
  - 128-step sequencer with Euclidean sequencing
  - Filter types: Multi-Mode, Lowpass 4, Equalizer, Comb-, Comb+, Legacy
  - Chord mode and arpeggiator
  - Song Mode
  - Overbridge enabled for DAW integration
  - Class-compliant USB 2.0 Hi-Speed audio
  - 48 kHz, 24-bit converters
  - 128 x 64 pixel OLED display
  - Steel casing: 215 x 176 x 63 mm, 1.48 kg
