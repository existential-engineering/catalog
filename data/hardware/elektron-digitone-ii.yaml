description: Pull your sound through the prism and into a spectrum of dazzling tones and timbres. Digitone II unleashes layer upon layer of exciting sonic possibilities.
details: |-
  Digitone II is a multitimbral polyphonic synth framed in a modular workflow. Its 16 tracks can be used for any of its synth machines or for MIDI, with 16 voices available across those selectable synth machines. On top of this flexible flavor, there is also an abundance of filters, an expanded Elektron Sequencer, a powerful note editor, and a whole bunch more.

  Synth machines are your route to generating sound with Digitone II. Dive into Wavetone, a fresh take on the classic 2-oscillator synthesizer, morphing between oscillator shapes, adding phase distortion and oscillator modulation. Take the buzz to the next level with Swarmer, a super saw-in-origin cluster offering lots of waveform control across the swarm. FM Tone is the original Digitone FM synthesis engine, and FM Drum offers percussive flexibility and fine-tuning.

  Digitone II's augmented filters show how much depth is possible. Experiment with Comb- and Comb+, or try out Multi-mode, EQ, Lowpass 4, and Legacy LP/HP. The base width filter can be placed before the other filter or at the end of the audio track chain. There is a dedicated amp envelope for each voice, and three LFOs with many destinations and controls.

  There are more sound-refining options at the FX page. Immerse your sound in lush delay and reverb, shimmering or dissonant chorus, or brutal bit reduction, sample rate reduction, and overdrive that can be placed before or after the filter. Utilize the master compressor via the mixer page, opening up sidechaining, as well as the master overdrive.

  The Elektron sequencer's 128 steps offer heaps of Parameter Lock possibilities. Switch to Euclidean sequencer mode and combine two pulse generators to create mathematically-driven sequences. Chord Mode offers one-finger harmonizing power, Note edit gives editorial control over every single note of your chord, and the arpeggiator explores rhythmic and melodic ideas. Connect with ease to any gear via balanced stereo inputs and outputs, and all 16 tracks are MIDI-compatible.
specs: |-
  - 16 voice polyphony, multiple FM algorithms
  - 4 selectable SYN (synthesis) machines: Wavetone, Swarmer, FM Tone, FM Drum
  - 6 selectable FLTR machines: Multi-Mode, Lowpass 4, Equalizer, Comb-, Comb+, Legacy LP/HP
  - 16 synth or MIDI tracks
  - 1 digital base-width filter, 1 digital overdrive, 1 digital bit reduction and 1 digital sample rate reduction per voice
  - 1 overdrive master effect and 1 stereo compressor master effect
  - 3 assignable LFOs per voice
  - Modulation setup for pitch bend, velocity, key track, mod wheel, breath control, aftertouch
  - MIDI tracks: 16 note polyphony per step, 16 assignable CC controls, 2 assignable LFOs per track
  - 4 trig modes, keyboard mode with 36 different scales, song mode
  - 128 steps per pattern and track, arpeggiator per synth track, note edit per track
  - Polyphonic sequencing, sound per step change, individual pattern length and time scale per track
  - Parameter locks, trig conditions and trig chance, retrig, micro timing, page loop
  - 1 Euclidean sequence generator per track
  - Send effects: Saturator Delay, Supervoid Reverb, Panoramic Chorus
  - 128 x 64 pixel OLED screen
  - 2 x 1/4" impedance balanced audio out jacks
  - 2 x 1/4" balanced audio in jacks
  - 1 x 1/4" stereo headphone jack
  - 48 kHz, 24-bit D/A and A/D converters
  - Hi-Speed USB 2.0 port
  - MIDI In/Out/Thru with DIN Sync out
  - Sturdy steel casing, W215 x D176 x H63 mm (8.5" x 6.9" x 2.5")
  - Weight: approximately 1.48 kg (3.25 lbs)
  - 100 x 100 mm VESA mounting holes, M4 screws with a max length of 7 mm
  - Overbridge enabled, class compliant USB audio, external input mixer
  - 3 year Elektron warranty
