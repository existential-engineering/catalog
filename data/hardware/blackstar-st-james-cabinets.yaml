name: St. James Cabinets
manufacturer: blackstar
primaryCategory: amplifier
url: https://blackstaramps.com/st-james-cabinets/
description: The St. James range of cabinets offers the perfect fusion of
  ultra-lightweight portability and uncompromising tone and power, delivering
  premium performance wherever you go.
details: |-
  The St. James cabinet range is the matching speaker line for the St. James amp series, sharing the same ultra-lightweight philosophy. Available as the St. James 112 (1x12), St. James 412 (4x12), and the St. James 212VOC vertical 2x12 (in Black and Fawn finishes), the cabinets cover both compact stage rigs and full-size touring setups.

  Each cabinet uses Blackstar's exclusive Celestion Zephyr lightweight speakers, co-developed with Celestion. The Zephyr design strips back unnecessary weight while retaining a traditional ferrite magnet, giving classic Celestion tone in a far lighter package.

  Cabinets are constructed from Candlenut plywood for strength, lightness, and beneficial acoustic properties, producing a roadworthy enclosure that sounds great and is built to last.

  The St. James 112 is a compact cabinet built around a single 12" Celestion Zephyr speaker custom-designed and exclusive to Blackstar, safely handling a full 100 Watts at 16 Ohms, weighing just 12.8 kg / 28.2 lbs, and featuring an illuminating Blackstar St. James logo.

  The St. James 412 is a 4x12 cabinet loaded with Blackstar-exclusive Celestion Zephyr lightweight speakers, with 4 Ohm and 16 Ohm mono inputs or 8 Ohm stereo (left and right) operation, an illuminated Blackstar logo, and a total weight of just 26.8 kg. The St. James 212VOC is a vertical 2x12 cabinet with switchable open/closed back, loaded with two 8 Ohm Celestion G12Z-70 Zephyr speakers and offering 4 Ohm and 16 Ohm outputs.
specs: |-
  - Ultra-lightweight cabinets matched to the St. James amp range
  - Blackstar-exclusive Celestion Zephyr lightweight speakers (ferrite magnet)
  - Candlenut plywood construction for light weight and acoustic performance
  - Illuminated Blackstar St. James logo
  - St. James 112: 1x12" Celestion Zephyr, 100W handling, 16 Ohm input, 12.8 kg / 28.2 lbs
  - St. James 412: 4x12", 4 Ohm / 16 Ohm mono or 8 Ohm stereo (L/R), 26.8 kg, 759 x 755 x 360 mm
  - St. James 212VOC: vertical 2x12" with open/closed back, 2x 8 Ohm Celestion G12Z-70 Zephyr speakers, 4 Ohm and 16 Ohm outputs, 501 x 798 x 295 mm
  - St. James 212VOC available in Black and Fawn finishes
