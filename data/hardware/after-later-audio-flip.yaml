description: A 1U Intellijel format module based on the Mutable Instruments
  Branches that routes incoming gate or trigger signals to one of two outputs
  based on a probability coin flip.
details: |-
  Flip is a 1U Intellijel format module based on the Mutable Instruments Branches. It will take the incoming gate/trigger and route it to one of the two outputs based on a coin flip. You can control the probability of the coin flip with the knob and CV input. CH1 input normalled to CH2 input. The button toggles modes to a latch mode which will always keep one of the outputs high.
