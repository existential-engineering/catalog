description: Expressive 4x12" angled guitar speaker cabinet voiced for the Origin range. Loaded with four 12" Celestion G12E-60 speakers and finished in classic black-and-gold Marshall livery, the Origin412A is a 240W passive cabinet with a single 1/4-inch speaker input at 16Ω, designed to pair with Origin-series heads on stage.
details: |-
  Match your Origin amp with this vintage-inspired cabinet, perfect for completing your classic look. With four 12-inch Celestion G12E-60 speakers, these cabinets pack a serious punch. No matter where you are, you will be heard.

  This angled cabinet is perfect for projecting sound and is also available as a straight base cab, allowing you to create your own Marshall stack.

  The Celestion G12E-60 speakers give a great bass response and a punchy mid-range, with classic styling to match the vintage looks of the Origin range.

  Designed and engineered in UK. Made in Vietnam.
