description: >-
  The AX73 is a surprisingly good analog synthesizer that is still considered to
  be widely underrated and deserving of some recognition. It is a six-voice
  analog synth with nearly identical architecture to Akai's AX60, also available
  as the rack-mount VX90.
details: |-
  The AX73 is a six-voice analog synthesizer with nearly identical architecture to Akai's AX60 keyboard, also available as a rack-mount VX90. It features one oscillator per voice with three playing modes: Poly mode for six-voice polyphonic pads and chords, Dual-VCO mode for a thicker three-voice sound, and Unison mode stacking all six oscillators for monophonic leads.

  The AX73 has a simple 24 dB/oct VCF with an interesting feature allowing cutoff modulation by the VCO. It includes a flexible LFO with variable waveforms, chorus, portamento, and a standard ADSR VCA envelope generator.

  Despite being analog, this machine is MIDI-equipped for modern studio integration. The sounds are suitable for any music production style. It had special inputs for Akai samplers (S-612, S-900, S-950), allowing samples to run through the synthesizer's analog filters and envelopes.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 1 VCO per voice with saw, tri, pulse, saw+tri, and noise generator
  - Filter: 1 24dB/oct resonant 4-pole filter with highpass
  - VCA: ADSR
  - LFO: 1 with variable waveforms
  - Effects: Chorus, Pulse Width Oscillation, Detune
  - Memory: 100 patches
  - Keyboard: 73 keys with velocity
  - Arpeggiator/Sequencer: None
  - Control: MIDI
  - Date Produced: 1986
releaseDate: "1986"
