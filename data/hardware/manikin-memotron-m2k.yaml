description: >-
  The Manikin Memotron M2K is a digital recreation of the Mellotron M400, offering access
  to hundreds of classic tape-based sounds in a reliable, fully polyphonic 37-key
  keyboard. Released in 2007, it bridges the gap between software Mellotron emulations and
  the mechanical M4000, delivering iconic sounds used by Genesis, Pink Floyd, and The
  Beatles without the maintenance burden of original hardware.
details: |-
  Released in 2007, the Memotron was Manikin-Electronic's answer to the enduring demand for Mellotron sounds without the maintenance headaches of the original tape-based hardware. The original Mellotrons were notoriously unreliable and impractical, yet their distinctive sound remained essential for artists inspired by Genesis, Pink Floyd, The Beatles, and Tangerine Dream. The Memotron aimed to deliver that sound in a dependable modern package.

  The design closely follows the Mellotron M400, featuring a classy white enclosure and 37 lightweight, non-weighted plastic keys. The control panel replicates the M400's layout with knobs for volume, tone, pitch, and sound selection, adding a half-speed switch inspired by modifications some original Mellotrons received. A small LCD with contrast knob and data controller/selector handle additional parameters, with an Escape button for menu navigation. The rear panel provides headphone and stereo outputs, a volume pedal input, and full MIDI In/Out/Thru connectivity.

  The Memotron offers access to up to three sounds simultaneously, with approximately 700 preset sounds in internal memory. An SD card slot allows importing additional sounds, which load within seconds and can then be edited across multiple parameters. An internal adjustable effects processor adds reverb, delay, chorus, and flanging. Unlike the original Mellotron's eight-second tape length limitation, the Memotron is fully polyphonic with no time restrictions on note duration.

  Whether the Memotron justifies its existence depends on how much one values the Mellotron experience in a keyboard format. It faces competition from software solutions like M-Tron Pro and from the M4000 for those wanting a genuine mechanical Mellotron, but it occupies a practical middle ground that many keyboardists find appealing.
specs: |-
  - Polyphony: 111 reeds
  - Multitimbral: 3 parts
  - Oscillators: 1
  - Waveforms: ROM-based
  - Filter: 12 dB/oct low-pass with resonance
  - Envelopes: 1 VCA with attack, decay
  - Effects: Reverbs, delays, chorus, flanging
  - Keyboard: 37 keys, non-weighted, plastic
  - Memory: Approx. 700 preset sounds, SD card expandable
  - Control: MIDI In/Out/Thru
  - Outputs: Stereo outputs, headphone output
  - Inputs: Volume pedal input
  - Display: LCD with contrast control
