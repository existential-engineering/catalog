description: '12" 2000W Powered Loudspeaker featuring Mackie''s TruSource
  vertically-aligned, common-magnet driver and TruSource DSP, with an integrated
  DL2 digital mixer and 16 channel effects.'
details: |-
  Featuring Mackie's TruSource vertically-aligned, common-magnet driver and TruSource DSP for unmatched fidelity and packed with cutting-edge technology to deliver a staggering 2000 watts of power in a groundbreaking design with an integrated digital mixer plus all the channel effects and system processing you've ever wanted.

  The DLM12 delivers premium sound in one of the most compact, professional portable loudspeakers in its class. Targeted at bands, venues, and installations, it focuses on portability without sacrificing performance, and is described as roughly 1/3 smaller than a traditional 2-way design.

  An integrated DL2 digital mixer provides mixing, EQ, and 16 channel effects in addition to the 2000W Class-D amplification. Smart Protect DSP, an integrated feedback destroyer, alignment delay (up to 300ms), three memory locations, and six speaker modes round out the onboard processing.

  The cabinet is constructed from PC-ABS with a powder-coated 20-gauge steel grille. Stackable construction, an integrated kickstand, ergonomic carry handle, and multiple mounting options (tripod, pole, wall-mount via SWM300) make it flexible for a variety of deployments. M10 rigging hardware enables flyable configurations.
specs: |-
  - 2000W Class-D amplification
  - 12" LF woofer / 1.75" HF compression driver
  - Frequency response: 38Hz-20kHz (-10dB)
  - DL2 integrated digital mixer with 16 channel effects
  - Six speaker modes and three memory locations
  - Integrated feedback destroyer
  - Alignment delay up to 300ms
  - Smart Protect DSP
  - PC-ABS cabinet with powder-coated 20-gauge steel grille
  - Integrated kickstand and ergonomic carry handle
  - Flyable via M10 rigging hardware
  - Weight: 31 lb / 14 kg
