details: |-
  The VX 15HP is built around a single 380 mm (15") PowerDual driver mounted within a compact, rugged plywood cabinet, and renowned for its exceptional performance and versatility. The latest high power-handling version of Tannoy's exclusive point source, constant directivity PowerDual technology ensures high power output with high sensitivity and exceptional efficiency. The point source driver technology allows this unique configuration to deliver exceptionally smooth beam-width characteristics resulting in an even coverage pattern aiding predictable system design. Symmetrical dispersion characteristics enhance speaker placement flexibility, allowing vertical or horizontal mounting of single or multi-cabinet arrays without any compromise in sound quality. Suited for FOH, floor monitor, high SPL delay, installed performance sound reinforcement, and portable PA applications. Configurable for bi-amp operation.
specs: |-
  - frequencyResponse: 70 Hz – 25 kHz ±3 dB; 58 Hz – 30 kHz –10 dB
  - nominalDispersion: 75° conical @ –6 dB points
  - directivityFactorQ: 9.7
  - directivityIndexDI: 9.9
  - powerHandlingPassiveContinuous: 400 W
  - powerHandlingPassivePeak: 1,600 W
  - powerHandlingBiampLFContinuous: 400 W
  - powerHandlingBiampLFPeak: 1,600 W
  - powerHandlingBiampHFContinuous: 80 W
  - powerHandlingBiampHFPeak: 320 W
  - sensitivity: 99 dB (1 W @ 1 m)
  - maxSPLPassiveContinuous: 125 dB
  - maxSPLPassivePeak: 131 dB
  - impedancePassive: 8 Ω
  - impedanceBiampLF: 8 Ω
  - impedanceBiampHF: 8 Ω
  - crossoverType: Passive / Bi-amp switchable
  - components: 1 × 15" (380 mm) constant directivity PowerDual
  - connectors: 2 × 4-pole twist-lock speaker connectors (NL4 Speakon); 1 × barrier strip terminals
  - dimensionsHxWxD: 591 × 451 × 421 mm (23.3" × 17.8" × 16.6")
  - netWeight: 25.5 kg (56.2 lbs)
  - construction: 18 mm (3/4") plywood enclosure and front baffle, vented and internally braced
  - finish: Semi matt black paint (white optional)
  - grille: Powder coated perforated steel
  - flyingHardware: 8 × M10 flying inserts (portrait or landscape); M10 × 8 yoke bracket inserts; 2 × Intergrip carrying handles; blanking plate for optional VTH pole mount; M6 × 4 inserts; compatible with industry-standard brackets
