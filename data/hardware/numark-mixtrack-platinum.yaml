description: Mixtrack Platinum DJ Controller With Jog Wheel Display.
details: |-
  Mixtrack Platinum is a 4-channel DJ controller featuring dual 5-inch metal capacitive touch-sensitive jog wheels with built-in hi-res 1.75" LCD displays. The displays show BPM, needle position, time remaining, pitch, keylock, and deck selection.

  Each channel includes dedicated filter and gain knobs, and the controller features 16 multi-function backlit performance pads, 100mm pitch sliders, and a multi-function touch strip for effects and track search. It includes an integrated 24-bit, 44.1 kHz audio interface.

  The controller is class-compliant for Mac and PC (no drivers needed) and ships with Serato DJ Intro. It is also compatible with Virtual DJ, Traktor, and other MIDI-mappable software. A bundle of 6 Prime Loops sample packs (380+ premium loops, drum kits, and one-shots) is included.
