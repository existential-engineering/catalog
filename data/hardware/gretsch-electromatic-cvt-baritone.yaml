details: |-
  The Electromatic Baritone CVT captures essential Gretsch power and fidelity at sub-sonic levels. A low-strung take on a classic Gretsch design, the Baritone CVT features a solid mahogany body with beveled contours, an elongated 27" scale-length bolt-on maple neck, and Twin Six humbucking pickups that deliver gut-punching power with remarkable balance and articulation.

  The mahogany body with beveled contours provides comfort and a balanced acoustic foundation. Twin Six Alnico humbucking pickups deliver gut-punching power with remarkable balance and articulation, while a GraphTech NuBone nut ensures superior tuning stability.

  A bolt-on maple neck with Performance "C" profile and bound rosewood fingerboard rounds out a baritone built for bold, low-tuned playing.
