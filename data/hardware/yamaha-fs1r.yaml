description: >-
  The Yamaha FS1R is a rack-mount FM synthesis powerhouse that combines
  eight-operator FM with Formant Shaping technology, enabling uniquely vocal and
  speech-like timbres not possible on earlier FM instruments. Despite a
  notoriously difficult front-panel interface, it has achieved cult status for
  its extraordinary range of evolving pads, electric pianos, and experimental
  textures.
details: |-
  Released in 1998 after a lengthy gap in Yamaha's FM synthesizer lineup, the FS1R represented a dramatic leap forward from earlier instruments like the DX7. Its core engine features 16 operators arranged as eight voiced and eight unvoiced elements across 88 algorithms, enabling a complexity far beyond what previous six-operator designs could achieve.

  The standout feature is Formant Shaping Synthesis, which uses the unvoiced operators to model the resonant characteristics of the human vocal tract. This allows the FS1R to produce eerily realistic vowel sounds, whispered textures, and breathy timbres that remain unique among hardware synthesizers. The 96 onboard formant sequences can animate these vocal qualities over time.

  A physically modeled resonant filter borrowed from the AN1x provides 12, 18, and 24 dB per octave slopes in lowpass, bandpass, and highpass modes, giving the FS1R subtractive sculpting capabilities unusual for an FM synth. The four-part multitimbral architecture, generous effects section, and near-complete DX7 patch compatibility made it a versatile studio tool, though Yamaha discontinued it after roughly one year of production.

  Notable users include Squarepusher and Sin, both of whom leveraged the FS1R's unique formant capabilities in their work.
specs: |-
  - Polyphony: 32 voices (16 with filter engaged)
  - Oscillators: 16 operators (8 voiced, 8 unvoiced), 88 algorithms
  - Multitimbral: 4 parts
  - Filter: Physically modeled resonant 12/18/24 dB/oct low/band/highpass (AN1x type)
  - LFO: 2 LFOs
  - Effects: 15 reverb, 28 variation, 40 insertion types, plus equalizer
  - Memory: 1536 voices, 512 performances, 96 formant sequences
  - Keyboard: None (rack module)
  - Control: MIDI In/Out/Thru (16 channels)
