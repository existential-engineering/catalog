details: |-
  Revolution, Redefined. Updated for 2024, the new Rivolta Combinata Deluxe has been re-designed from the ground up by world renowned luthier & designer Dennis Fano ( Novo Guitars ). The Rivolta Combinata Deluxe LH (Left-Hand) features an ultra lightweight Simarouba solid body with German Carve, 1-piece set Roasted Maple neck with a satin finish for improved comfort and playability, hand rolled Ebony fretboard with our new oval Pearloid inlays, 24 medium jumbo frets and a Nashville T-O-M bridge and stoptail. Under the hood, the Rivolta Combinata Deluxe features our new Rivolta Custom P90's and familiar single Vol/Tone and 3-Way toggle set-up from previous Combinata models.
