description: Weighing just 15.5kg, the Studio-15 delivers 300 watts of signature
  Ashdown sound through a custom 15" NEO speaker, combining portability with
  uncompromising tone.
details: |-
  The Studio-15 is a 300-watt bass combo with a custom 15" NEO speaker and HF unit, a 5-band EQ, foot-switchable valve-emulated overdrive, an XLR DI, an FX loop, a Line In and a headphone out. A tweeter mute switch and lightweight poplar ply construction make it equally at home in practice, rehearsal or small-to-medium gigs.
specs: |-
  - Power output: 300W
  - Speaker: 1 x 15" Ashdown NEO + HF unit
  - Weight: 15.5kg (34.2lbs)
  - Size (mm): H-458 W-377 D-560
  - 5-band EQ: Bass, Low Mid, Middle, Hi-Mid, Treble
  - Pre shape
  - Tweeter mute switch
  - Valve-emulated drive
  - Line input
  - Headphone out
  - XLR DI output
  - Footswitchable drive
