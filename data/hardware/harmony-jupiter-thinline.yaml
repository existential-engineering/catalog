details: |-
  Experience the next chapter in Harmony innovation with the Jupiter Thinline. This semi-hollow electric blends the classic Jupiter shape with a lightweight, resonant mahogany body, a maple top and a smooth mahogany neck. Whether you're ripping through a solo or laying down rhythm, the Jupiter Thinline delivers in every situation. The unique combination of Harmony pickups - a gold foil mini humbucker at the neck and a gold foil humbucker at the bridge - create a versatile tonal palette that will inspire you to reach new heights. With the semi-hollow construction, you'll experience a perfect blend of full-bodied resonance and controlled feedback, bringing another dimension to your sound. The Harmony Jupiter Thinline combines exceptional craftsmanship, stunning aesthetics, and a versatile tone - all in one oustanding instrument. Make it yours and experience the Harmony difference.
