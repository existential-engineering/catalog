description: >-
  The Radikal Technologies Delta CEP A is a semi-modular digital synthesizer released in
  2018 by the German company Radikal Technologies. It features an eight-voice RT-311 Swarm
  Oscillator engine, a switchable digital and analog multi-mode filter, and an
  interpolator with snapshot morphing functionality. Available in both desktop and
  Eurorack formats.
details: |-
  The Delta CEP A builds its sound design capabilities around the RT-311 Swarm Oscillator, which provides eight oscillators that can be detuned, phase-shifted, and modulated against each other to create massive, evolving textures from a single voice. This swarm approach enables substantial sonic complexity without requiring multiple separate oscillator modules.

  The filter section offers switchable digital and analog multi-mode operation with 24dB (4-pole) slopes across band-pass, high-pass, and low-pass modes with resonance control. Modulation comes from a flexible LFO with sample and hold, saw down, sine, square, triangle, and clocked waveforms, alongside a full ADSR envelope and VCA.

  A distinguishing feature is the interpolator with snapshot morphing, which allows smooth transitions between stored parameter states for dynamic sound evolution during performance. The effects section provides time-based and modulation processing with feedback, dry/wet control, and selectable effect types.

  The desktop version includes stereo audio I/O, MIDI In/Out/Thru, and a 12V DC power connector in a solid metal enclosure. The Eurorack version occupies 68 HP. Both formats maintain the semi-modular architecture with a hardwired default signal path that can be overridden via patch points.
specs: |-
  - Polyphony: 2 voices
  - Oscillators: 8 (RT-311 Swarm Oscillator)
  - Filter: Multi-mode (band-pass, high-pass, low-pass), 24dB 4-pole, switchable digital/analog
  - LFO: 1 (sample and hold, saw down, sine, square, triangle, clocked)
  - VCA: 1 with ADSR envelope
  - Effects: Time/modulation processing with feedback, dry/wet, FX select
  - Interpolator: Snapshot morphing
  - MIDI: In/Out/Thru
  - Audio: Stereo I/O
  - Desktop dimensions: 352 x 135 x 97mm
  - Eurorack: 68 HP
  - Power: 12V DC (desktop)
releaseDate: "2018"
