name: Spock
manufacturer: intellijel
primaryCategory: modular
categories:
  - utility
  - digital
  - discontinued
url: https://intellijel.com/shop/legacy/spock/
description: CMOS boolean logic device in 4HP. Dual two input CMOS logic device
  with AND, OR and XOR outputs, plus a dual logic inverter.
details: |-
  The Spock module comprises two sets of CMOS based dual input logic gates with the following functions: AND, OR, XOR and NOT. The top and bottom half of the module are identical but can be combined together with patch cables to realise more complex logic functions.

  At low speeds this module can be used for creating gates/triggers based on logical combinations of pulse inputs. Since this is a discrete CMOS device it can operate at audio rates — feeding audio signals into the inputs will result in very interesting pulse based audio signals.

  All outputs are buffered, and each gate’s state is indicated by a dedicated LED. The NOT input is a separate input (not connected to the X and Y inputs) for the logic inverter; with nothing patched the inverter output sits at a constant logic high and can be used as a positive voltage source.
specs: |-
  - Width: 4HP
  - Max Depth: 67.5mm
  - Power: 12mA @ +12V, 0mA @ -12V
  - Dual two input CMOS logic device with AND, OR and XOR outputs
  - Dual logic inverter
  - All outputs buffered (0-8V)
  - Inputs: square or pulse waves ideally 0-5V (2V or greater reads as logic high); max voltage 10V
