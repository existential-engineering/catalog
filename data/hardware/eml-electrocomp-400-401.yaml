description: >-
  The EML ElectroComp 400/401 is a rare semi-modular analog synthesizer and sequencer
  combination produced from 1970 to 1984. The 401 synthesizer pairs with the 400 sequencer
  unit, featuring dual VCOs, a multimode resonant filter, and sophisticated analog
  sequencing with microtonal tuning support. Approximately 300 units were manufactured,
  making it a genuinely rare vintage instrument.
details: |-
  The EML 400/401 system emerged in 1970 as an innovative response to competition from Moog and ARP modular synthesizers of that era. Although production continued until 1984, the instrument remained scarce with approximately 300 units manufactured, making it a genuinely rare vintage synthesizer today.

  The 401 synthesizer component functions as a scaled-down cousin to the EML 500, maintaining the visual design aesthetic while omitting a built-in keyboard. It retains patch-cord signal patching characteristic of modular synthesizers alongside dedicated switches for editing and control. Two voltage-controlled oscillators generate monophonic analog tones, shaped by a multimode resonant voltage-controlled filter offering switchable low-pass, band-pass, and high-pass modes.

  The complementary 400 component comprises an analog sequencer featuring a sophisticated 12-tone diatonic sequencer with digitally controlled voltage quantizer, an advanced feature for the period. The quantizer supports variable steps-per-octave ranging from 5 to 60, enabling exploration of alternate and microtonal tunings. Additional capabilities include 16-stage voltage-controlled envelope generators for creating complex, programmable sequences and patterns.

  The system offered unique synthesis approaches that distinguished itself through innovative sequencing and tuning flexibility. Contemporary musicians and sound designers continue utilizing these instruments for their distinctive analog character and unusual capabilities.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (sawtooth, square, noise)
  - LFO: 6 waveform shapes
  - Filter: 12 dB/oct multimode resonant (low-pass, band-pass, high-pass)
  - VCA: 1 A/R envelope generator
  - Keyboard: None
  - Memory: None
  - Sequencer: 12-tone diatonic with voltage quantizer (5-60 steps per octave)
  - Effects: None
  - Control: CV/Gate
