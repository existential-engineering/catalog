description: >-
  The EML ElectroComp 400/401 is a rare semi-modular analog synthesizer paired with a sophisticated 12-tone diatonic sequencer, notable for its microtonal tuning capabilities.
details: |-
  The ElectroComp 400/401 is a two-component system consisting of the 401 synthesizer and the 400 analog sequencer. First appearing in 1970 and produced through 1984, only approximately 300 units were manufactured, making it one of the rarest instruments in the EML lineup.

  The 401 synthesizer section functions as a scaled-down version of the EML 500, sharing a similar color scheme and layout but lacking a built-in keyboard. Dual VCOs produce monophonic sound using sawtooth, square, and noise waveforms, shaped by a 12dB per octave multimode resonant filter with switchable highpass, lowpass, and bandpass modes. The envelope section is simpler than the 500, offering only attack and release controls. An LFO provides six waveform shapes for modulation.

  The 400 sequencer component is where the system truly distinguishes itself. Its 12-tone diatonic sequencer incorporates a digitally controlled voltage quantizer that allows variable steps per octave ranging from 5 to 60, making it exceptionally useful for exploring alternate and microtonal tunings. The sequencer also provides voltage-controlled envelope generators across 16 stages, a remarkably sophisticated feature for its time. Both components use CV/Gate for external control.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (sawtooth, square, noise)
  - LFO: 6 waveform shapes
  - Filter: 12dB/oct multimode resonant (lowpass, bandpass, highpass)
  - Envelope: 1 AR envelope generator
  - Sequencer: 12-tone diatonic with variable steps per octave (5-60)
  - Keyboard: None
  - Memory: None
  - Control: CV/Gate
releaseDate: "1970"
