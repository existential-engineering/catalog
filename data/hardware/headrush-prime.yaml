description: HeadRush Prime is a flagship guitar amp modeler and multi-effects
  processor for guitarists, bassists, vocalists, and live performers. Build
  complete stage and studio rigs using native Neural Amp Modeler support, direct
  TONE3000 access, amp cloning, premium guitar and vocal effects, impulse
  responses, looping, AutoTune, and an intuitive 7-inch touchscreen.
details: |-
  Prime is the flagship HeadRush floor processor, covering guitar, bass, keys and vocal processing in one unit. It carries over 600 amp, cab, microphone and effect models with advanced tone controls, alongside downloadable rigs and tone captures. Native Neural Amp Modeler support plays NAM captures, in both NAM A1 and NAM A2 formats, next to the built-in amp models, HeadRush Amp Cloner content, third-party IRs and tones downloaded through TONE3000.

  Two NAM A2 full captures can run at the same time, through stereo doubling, switch doubling or two separate NAM blocks. Switching the models to A2 lite allows four models in a single rig across two dedicated NAM blocks. Third-party cabinet impulse responses shape speaker, cabinet, microphone and recording character, and convolution reverb IRs, or C-verbs, add rooms and ambiences to a rig.

  The steel chassis is built for stage use. Twelve footswitches each carry a color-assignable LED and a customizable OLED scribble strip showing the current assignment and status for every rig. Setlists are built by drag and drop so rigs can be recalled per song without remembering preset names, and Scenes apply lead, rhythm or any custom combination of parameter changes with one switch. Stomp, Rig, Hybrid, Setlist and Song modes are reached by holding the top-right footswitch, and hands-free edit mode uses the onboard expression pedal to adjust a held block's parameters.

  Onboard Wi-Fi provides a secure, password-protected connection for editing rigs from a tablet or desktop browser with no software installation, and access to HeadRush Cloud for browsing, demoing and downloading rigs and clones from the HeadRush community, filtered by downloads, likes or genre. Integrated TONE3000 access opens a wider library of captures, presets and tones from the same screen.

  The built-in practice tool loads songs from Dropbox over Wi-Fi, loops and slows difficult sections and shifts pitch up or down in semitones, and the unit also plays audio from any Bluetooth device. The looper holds loops of up to 5 minutes and up to 20 minutes of layered audio, saves them as WAV files for export over USB transfer mode, imports WAV backing tracks and syncs to external MIDI devices. A multi-core processor handles gapless preset switching with reverb and delay tail spillover, and the USB connection doubles as a 24-bit 96 kHz audio interface for recording and reamping. Access to ReValver and its SuperClones library is included.
specs: |-
  - Over 600 amp, cab, microphone and effect models
  - Native Neural Amp Modeler support for NAM A1 and NAM A2 captures
  - Plays 2 NAM A2 full captures at once, or 4 A2 lite models across 2 NAM blocks
  - Direct TONE3000 access through HeadRush Cloud
  - HeadRush Amp Cloner content and ReValver SuperClone playback
  - Antares AutoTune vocal suite with harmony, doubler, distortion, delay and reverb
  - Third-party cabinet impulse response loading and convolution reverb IRs (C-verbs)
  - 7-inch touchscreen
  - 12 footswitches with color-assignable LEDs and customizable OLED scribble strips
  - Onboard expression pedal for hands-free editing
  - Looper with 5 minute maximum loop length and up to 20 minutes of layered audio
  - Looper WAV import and export, plus MIDI sync to external devices
  - 24-bit 96 kHz USB audio interface for recording and reamping
  - Gapless preset switching with reverb and delay tail spillover
  - Onboard Wi-Fi and Bluetooth audio streaming
  - Practice tool with Dropbox song loading, section looping, slow-down and semitone pitch shift
  - Combo XLR plus 1/4-inch input with switchable 48V phantom power
  - Dual XLR outputs with switchable ground lift
  - Dual TRS outputs with amp or line-level operation
  - Stereo FX loop with four-cable method support
  - Road-ready steel chassis
