details: |-
  The Panther Cub 500 is a true bucket brigade analog delay that is driven by the legendary MN3005 chipset. Smooth, dark, organic repeats join onboard modulation, EQ, tap tempo and expression pedal abilities. The Cub 500 is perfect for adding vintage slap to your vocals or instruments as well as creating huge ambient soundscapes in a mix.

  The features of the Panther Cub 500 make it a powerhouse in the studio for those considering adding a fully tweakable real analog delay.
