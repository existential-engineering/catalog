name: ETX-35P
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/etx-35p/
description: The ETX-35P is a 15-inch three-way powered loudspeaker for
  professional portable and installed sound. A 2000 W Class D amplifier with
  integrated FIR-Drive DSP drives a 15-inch SMX2151 woofer, a 6.5-inch EVS-6C
  mid-bass driver, and a DH3-B 1.25-inch titanium compression driver, producing
  up to 136 dB peak SPL with a 60 x 40 degree coverage pattern. The 18 mm
  plywood enclosure with EVCoat finish includes eight M10 suspension points for
  flexible rigging, a 16 AWG steel grille, and balanced XLR/TRS combo inputs
  with an XLR link output.
details: |-
  2000 W Class D power amplifier with integrated FIR-Drive DSP

  SMX2151 15-inch (380 mm) LF woofer

  EVS-6C 6.5-inch mid-bass driver

  DH3-B 1.25-inch titanium HF compression driver

  Maximum SPL of 136 dB peak

  Frequency response 48 Hz - 20 kHz (-3 dB), 38 Hz - 20 kHz (-10 dB)

  Coverage pattern 60 x 40 degrees with 700 Hz and 2.9 kHz crossovers

  Eight M10 threaded suspension points for flexible rigging

  18 mm plywood enclosure with EVCoat finish

  16 AWG steel grille with powdercoat

  Two XLR/TRS combo inputs with XLR link output

  Universal switching power supply (100 - 240 V, 50 - 60 Hz)
specs: |-
  - frequencyResponse: 48 Hz - 20 kHz (-3 dB)
