description: iOS DJ controller that transforms an iPad, iPhone, or iPod touch
  into a portable DJ system using large scratch wheels, a crossfader, and EQ.
details: |-
  The iDJ Live system harnesses the processing power of your iPad, iPod or iPhone and enables you to DJ parties using the music that is already on your iPod. The controller connects via a built-in dock connector and offers large scratch wheels for a natural scratch feel, a crossfader for mixing between songs, and bass and treble controls. It is plug-and-play compatible with iOS Core MIDI DJ software and primarily designed for use with Algoriddim's djay for iPad (and vjay for video mixing), with additional support for Sound Trends Mixr, FutureDecks DJ Pro, and PCDJ (each sold separately). An included iPad stand props the device for performance, and a headphone/speaker split cable enables separate cue and play audio. Performance time is up to six hours with an iPad 2 and three hours with an iPad 1.
