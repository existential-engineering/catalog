description: Boutique, single-ended valve tone in a stunningly simple 10w combo.
details: |-
  TV-10 A is a dynamic, studio ready valve amplifier that pays tribute to the classic American sounds of yesteryear. It embraces simplicity and sonic purity within a compact combo format. With its 6L6 power valve and boutique aesthetics, it promises authentic American tones and vintage styling.

  The 6L6 power valve is often revered as the tonal heartbeat of many well-known classic American vintage amplifiers. Their characteristic glassy clean tones, crunchy drives and smooth mid-range make these power valves the perfect match for the dynamic TV-10 A. The refined tone and response fully capture the magic of this Class A, single-ended valve power stage.

  Designed for an effortless plug-in-and-play experience, the TV-10 A ensures minimal fuss without compromising on tonal quality. TV-10 A's simple controls allow you to quickly access timeless American vintage amplifier tones, encapsulating everything from glassy cleans to low-gain crunch.

  With its compact form, the TV-10 A is perfect for the home, studio or smaller live performances. Professional features such as a custom-voiced reverb, footswitchable channels and an effects loop augment the sonic experience, making this valve amplifier fully equipped for today's exacting performance requirements.

  To capture the true sonic experience of the 6L6 power valves breaking up when driven, the Emulated Output is taken after the power stage. Every nuance of your sound can be easily recorded or run through a PA for larger venues. The TV-10 A combo features a classic 12-inch Celestion Seventy 80 speaker. A companion TV-10 AH head and TV-112 A cabinet are also available in the TV Series range.
specs: |-
  - Power: 10W
  - Valves: 1x ECC83, 1x 6L6
  - Speaker: 1x 12" Celestion Seventy-80
  - Boost/Drive Option: Drive
  - Controls: Gain, Tone, Reverb, Master, Drive Button
  - Emulated Output: Yes
  - Effects Loop: Yes (Series)
  - Speaker Outputs: 1 x 16 Ohm, 1 x 8 Ohm and 2 x 16 Ohm
  - Weight: 14.7kg
  - Dimensions: 473 x 421 x 251 (mm)
  - Class A, single-ended valve power stage
  - Custom-voiced digital reverb emulating warm valve spring reverbs
  - Footswitchable Drive channel
