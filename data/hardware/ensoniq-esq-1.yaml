description: >-
  The Ensoniq ESQ-1 is an 8-voice hybrid synthesizer combining digital oscillators with analog filters, offering three oscillators per voice, an 8-track sequencer, and a ring modulator.
details: |-
  Released in 1986, the ESQ-1 was Ensoniq's highly affordable yet impressively capable digital synthesizer. While the waveforms are digitally generated from a selection of 32, the filters are fully analog, giving the instrument a warmth and character that pure digital synths of the era often lacked. This hybrid approach, shared with Ensoniq's Mirage sampler, proved to be a winning combination.

  What sets the ESQ-1 apart is its voice architecture. Each of the eight voices provides three independent oscillators that can draw from analog-style waveforms, digital waveforms, or sampled waveforms in any combination. This flexibility, paired with analog features like a ring modulator, oscillator sync, and freely routable envelopes and LFOs, opens up a surprisingly broad sonic palette. Three LFOs per voice with triangle, sawtooth, square, and random shapes can be assigned to any DCO, VCA, or VCF target. The 4-pole analog resonant filter with a 6-stage envelope provides expressive sound shaping.

  An 8-track sequencer with capacity for 30 patterns and 10 songs rounds out the feature set, making the ESQ-1 a self-contained composition tool. Dynamic voice allocation manages the 8 voices efficiently across the 61-key velocity-sensitive keyboard. With 40 patch memories and MIDI with 8-part multitimbrality, the ESQ-1 attracted a diverse user base including Skinny Puppy, Jean-Michel Jarre, and Steve Roach. The ESQ-M rack version, released in 1987, is identical but omits the sequencer.
specs: |-
  - Polyphony: 8 voices (dynamic voice allocation)
  - Oscillators: 3 digital per voice; 32 waveforms
  - LFO: 3 per voice (triangle, sawtooth, square, random)
  - Filter: 4-pole analog resonant with 6-stage envelope
  - VCA: 4 VCA + 4 envelopes with 7 parameters per voice
  - Sequencer: 8-track (30 patterns, 10 songs with up to 99 patterns each)
  - Effects: None
  - Keyboard: 61 keys (velocity sensitive)
  - Memory: 40 patches
  - Control: MIDI (8-part multitimbral)
releaseDate: "1986"
