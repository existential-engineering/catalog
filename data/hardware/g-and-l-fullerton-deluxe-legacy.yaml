details: |-
  The Fullerton Deluxe Legacy bundles some of the most time-honored option combinations from the G&L Build To Order menu. These are G&L fan favorites from '60s vibes to '90s hits, supported by elegance that continues up the neck with the G&L Natural Satin finish.

  The G&L Legacy blends contemporary refinements from the Leo Fender-designed S•500 and Comanche models with classic Alnico V pickups and the P.T.B. system. For faithful Alnico single-coil tone with modern refinements and superb craftsmanship, the Legacy makes for an excellent choice.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: CLF-100 Alnico single coils
  - Body wood: Alder or Swamp Ash
  - Neck wood: Natural Satin Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato with forged brass saddles
  - Controls: 5-position pickup selector, volume, treble, bass (PTB system)
  - Includes: G&L Deluxe Gig Bag
  - Available in: Old School Tobacco over Swamp Ash, 3-ply parchment pickguard, Maple fingerboard
  - Available in: Tobacco over Swamp Ash, 3-ply parchment pickguard, Rosewood fingerboard
