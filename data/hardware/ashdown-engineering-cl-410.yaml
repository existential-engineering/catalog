description: CL cabs are designed to complement the wide tonal range and power
  of Ashdown's valve heads, delivering bold classic tone with authority. Rated
  at 1050W RMS at 8 ohms, the CL-410H is loaded with 4 x 10-inch custom Eminence
  speakers and a switchable HF horn (Off, High, Low) to tailor the top-end
  definition. Handmade in the UK from birch ply, it features dual Speakon/jack
  connectors, heavy-duty vinyl covering, and vintage red grilles.
details: |-
  Handmade in the UK from birch ply. Custom-spec Eminence drivers, switchable HF horn (Off, High, Low), dual Speakon/jack connectors, horn control switch, heavy-duty vinyl covering, and vintage red grilles.
specs: |-
  - Power handling: 1050 watts RMS
  - Speaker configuration: 4 x 10-inch custom Eminence
  - Frequency response: 41Hz - 4kHz
  - Impedance: 8 ohm
  - SPL: 94dB 1W @ 1m
  - Switchable HF horn (Off, High, Low)
  - Dimensions (H x W x D): 760 x 617 x 425 mm
  - Weight: 36 kg
