description: CV and audio processor.
details: |-
  Black CV Tools is a fully analogue CV and audio processor module designed for advanced manipulations with signals, including mixing, scaling, offsetting and wave-shaping.

  The module has several configurations achievable via jumpers on the back of the module.

  It carries a 2x3 channel audio and CV mixer with unity gain, two attenuverters and boosters with bipolar offset, a Min and Max function extractor, a +5V reference and LED bipolar level indicators.

  Mixer gain is unity, booster gain on the Scale control is adjustable up to 2, and offset covers plus and minus 10V. The module is 10HP wide and 35mm deep, drawing +42mA and -38mA.
specs: |-
  - 2x3 channel audio and CV mixer with unity gain
  - 2x attenuverters/boosters and bipolar offset
  - Min and Max function extractor
  - +5V reference
  - LED bipolar level indicators
  - Several configurations achievable via jumpers on the back of the module
  - Mixer gain 1 (unity)
  - Booster gain (Scale) adjustable up to 2
  - Offset +-10V
  - Power consumption +42mA, -38mA
  - Module width 10HP
  - Module depth 35mm
