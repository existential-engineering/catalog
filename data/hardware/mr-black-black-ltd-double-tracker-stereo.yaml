description: A true-stereo double-tracking pedal that generates a second,
  slightly detuned and delayed voice across two discrete signal paths, with SYNC
  and COMP modes, a preset, and an expression jack.
details: |-
  Double tracking is a recording technique from the 1950s: record a track twice
  and overlay the two nearly identical takes to add depth, character, and
  tonality. The DoubleTracker recreates that effect in real time, and the
  DoubleTracker Stereo expands on the popular 2023 compact model by adding
  true-stereo operation.

  On the primary/left channel it offers a doubled-signal delay ranging from 3ms
  to 178ms, and it can detune the second voice by up to plus or minus half a
  semitone. Two discrete, isolated signal paths (primary/left and
  secondary/right) create a rich, organic stereo spread that sounds great on
  guitar, bass, keys, and even vocals. Three controls dial in the intensity,
  latency, and variance of the doubled track. The effect is almost like chorus
  and almost like slap-back, yet is neither: it is double tracking.

  Two modes shape the stereo image. In SYNC mode (red LEDs) the second voices are
  matched in tune; in COMP mode (green LEDs) one voice rises in pitch as the
  other falls, dramatically widening the stereo field via the Haas Effect.

  A fast-action preset saves a favorite setting with one press of the SAVE button
  and toggles instantly via the PRESET footswitch. An EXP jack lets you assign
  any control to an external expression pedal on the fly by rotating that knob to
  its EXP marker. The pedal supports Mono-In/Mono-Out, Mono-In/Stereo-Out, and
  true-stereo-in/true-stereo-out configurations, with primary jacks marked by a
  single triangle and secondary jacks by a double triangle.

  The DoubleTracker Stereo is a Jack Deville original design.
specs: |-
  - True-stereo double tracking with two discrete, isolated channels
  - Mono-In/Mono-Out, Mono-In/Stereo-Out, and True-Stereo-In/True-Stereo-Out configurations
  - 2nd-voice time delay: 3mS - 178mS (primary channel)
  - Detune up to +/- 1/2 semitone
  - Two detune modes: SYNC and COMP
  - Instant on-board preset
  - Expression-pedal ready (EXP jack, tip=wiper, ring=high, sleeve=ground)
  - Full, lossless Wet/Dry mix (100% wet capable)
  - Very high input headroom (up to 3V peak-to-peak)
  - Input Impedance: ~495KOhm per channel
  - Output Impedance: ~2KOhm per channel
  - Buffered Bypass
  - Power: 9VDC, 2.1mm negative center-pin (>100mA regulated supply recommended)
  - Current draw: ~73mA @ 9VDC
