description: >-
  A stripped-down, no-nonsense dual-oscillator monosynth built around the
  classic Moog filter, prized for its punchy basses and aggressive lead tones.
details: |-
  Introduced in 1979, the Moog Prodigy was designed as an affordable entry point into the Moog family. Where the Minimoog offered three oscillators and a more elaborate signal path, the Prodigy simplified things to two oscillators and a more streamlined control set. What it sacrificed in flexibility, it gained in focus — this is an instrument built to do a few things exceptionally well.

  The two voltage-controlled oscillators produce sawtooth, triangle, and pulse waveforms, and can be synced together for harder, more harmonically complex tones. The signal passes through the same 24dB-per-octave lowpass filter topology that gave all Moog instruments their distinctive voice. An ADS envelope shapes both the filter and amplifier, and a simple LFO provides triangle or square wave modulation.

  The Prodigy deliberately omits features that might complicate its mission. There is no modulation matrix, no sequencer, no arpeggiator, and the 32-note keyboard lacks velocity sensitivity or aftertouch. This simplicity proved to be a strength rather than a limitation, particularly as electronic and dance music producers discovered its talent for delivering fat, driving basslines and cutting lead sounds without any fuss.

  The instrument found a devoted following in the techno, house, and electronic scenes of the late 1980s and 1990s. Artists such as Fatboy Slim, Depeche Mode, 808 State, and The Prodigy (a band whose name may well nod to this very machine) have all put it to work, cementing its reputation as one of the most effective bass synthesizers of the analog era.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (sawtooth, triangle, pulse)
  - LFO: Square or triangle waveforms
  - Filter: 24dB/oct lowpass with cutoff, emphasis, and ADS envelope
  - VCA: Attack/Decay/Sustain envelope
  - Keyboard: 32 keys (no velocity or aftertouch)
  - Memory: None
  - Control: CV/Gate
  - Produced: 1979–1984
