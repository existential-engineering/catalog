description: The SX-5C delivers 5 watts of authentic all-valve warmth through a
  12" Celestion speaker, powered by ECC83 and EL84 tubes. With digital reverb,
  an effects loop, and a speaker-emulated out for recording, this compact combo
  is perfect for rich, vintage-inspired tones at home, in the studio, or on
  stage.
details: |-
  The SX-5C is a 5-watt all-tube guitar combo, the flagship of Ashdown's SX range. A single-channel preamp with bass, middle, treble and master volume drives a 1x12" Celestion speaker via 1x ECC83 preamp and 1x EL84 output valve, delivering rich, warm, dynamic tone. A genuine Accutronics digital reverb block adds ambience and a series effects loop integrates pedals. A speaker-emulated recording out is filtered to replicate a Celestion Alnico speaker, a speaker mute switch enables silent recording, and a stealth switch reduces volume while activating speaker tone compensation for studio use.
specs: |-
  - Output power: up to 5 Watts (all-valve)
  - Preamp tube: 1 x JJ Electronics ECC83
  - Power tube: 1 x JJ Electronics EL84
  - Channels: single-channel preamp with master volume
  - EQ: Bass, Middle, Treble
  - Reverb: genuine Accutronics reverb block (digital)
  - Speaker: 1 x 12" Celestion
  - Speaker outputs: 16 Ohm and 8 Ohm for external cabs
  - Aux input for backing tracks / MP3
  - Effects loop: series
  - Recording out: speaker-emulated (Celestion Alnico response)
  - Speaker mute switch for silent recording
  - Stealth switch: reduces volume, activates speaker tone compensation
  - Cabinet: plywood, tolex-covered, classic styling
  - Height x Width x Depth: 470 x 440 x 240 mm
  - Net weight: 14.1 kg
