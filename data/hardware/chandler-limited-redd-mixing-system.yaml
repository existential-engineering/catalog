description: The REDD Mixing System is the first EMI recording console released
  in over 50 years, bringing the legendary sound of REDD, TG, and RS desks
  together in one fully modular, modern system. Developed over six years by
  Chandler Limited in collaboration with Abbey Road Studios.
details: |-
  The REDD Mixing System is the first EMI recording console in over 50 years, developed over six years by Chandler Limited in collaboration with Abbey Road Studios. The system is fully modular and cassette-based, allowing users to intermix tube (REDD EF86) and solid-state (TG germanium and Class A silicon) input cassettes freely. All units are transformer-balanced in and out. PCBs are hand-loaded and hand-soldered with no surface-mount components, no ribbon cables, and no PCB-mounted switches. Vintage-style custom EMI faders with LED backlighting are included on every channel.

  Input cassettes available: REDD tube (based on REDD.47 preamp from REDD.37/51 consoles), TG MKIV solid-state (Class A TG2-style preamp with four-band Curve Bender EQ), and TG MKI germanium (to be released Q4 2026, expanded three-band EQ).

  Buss cassettes available in TG solid-state (six Class A TG2 MKIV circuits, fully transformer-balanced) or RS tube (newly designed RS61 two-stage tube circuits) configurations, each providing two aux send amplifiers for four busses and four sends system-wide, with Wet/Dry mix, switchable insert point for stereo buss processing, and NAB/IEC stereo buss EQ (passive Pultec-style, four presets plus bypass).

  The Control Room section features discrete op-amp design for ultra-clean monitoring, up to seven user-configurable monitor sources, three sets of monitor speakers, talkback routing, and Mono/Dim/Mute/Phase functions.

  Initially available in the United States only, directly from Chandler Limited and through Vintage King. Expected to begin shipping August 2026.
