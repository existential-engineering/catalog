name: Sonicview 16XP
manufacturer: tascam
primaryCategory: console
categories:
  - digital
  - mixer
url: https://tascam.com/us/product/sonicview_16xp
description: Professional digital recording and mixing console featuring a
  54-bit floating-point FPGA mixing engine at 96 kHz, 44 input channels,
  built-in 64-channel Dante networking, a 32-track recorder, two 7-inch color
  touch panels, and 16+1 motorized 100mm faders.
details: |-
  The Sonicview 16XP is a professional 44-channel digital recording and mixing console built around a 54-bit floating-point FPGA mixing engine running natively at 96kHz with 20.8μs internal latency and 0.51ms analog-to-analog round-trip.

  Two 7-inch color multi-touch displays (800×480) and 16+1 motorized 100mm faders provide hands-on control across 7 custom fader layers and 8 DCA groups. Each channel includes delay, phase, HPF, gate/expander/de-esser, 4-band parametric EQ, and compressor/ducker. Bus processing adds 31-band graphic EQ and real-time analyzer.

  Built-in 64-channel Dante (primary and secondary redundancy, AES67 compatible) and a 32-in/32-out USB audio interface provide flexible connectivity. An integrated 32-track recorder (via IF-MTR32 preinstalled in Slot 1 on the US version) records to SDHC/SDXC at 48kHz or 96kHz. A second expansion slot supports IF-MA64/EX, IF-AE16, IF-AN16/OUT, IF-DA64, or IF-ST2110.

  Remote control is available via TASCAM Sonicview Control (macOS/Windows/iPadOS), Mixing Station app, Ember+, and SNMP.
specs: |-
  - - Input channels: 44 (40 mono + 2 stereo + 4 FX returns)
  - Output buses: 22 flexible + main L/R stereo
  - Mixing engine: 54-bit floating-point FPGA at 96kHz
  - ADC/DAC: 32-bit / 96kHz
  - Analog-to-analog latency (48kHz): 0.51ms
  - Internal mixing latency: 20.8 μs
  - EIN: -128 dBu or less; Dynamic range: 108 dB or more
  - THD+N: 0.002% or less; Crosstalk: 100 dB or more (1kHz)
  - Faders: 16+1 motorized 100mm; Fader layers: 7; DCA groups: 8
  - Displays: 2x 7-inch color touch (800×480)
  - Built-in Dante: 64-in/64-out (48kHz) with primary/secondary redundancy
  - USB audio: 32-in/32-out
  - Expansion slots: 2 (Slot 1 preloaded with IF-MTR32)
  - Power: 65W, AC 100–240V 50/60Hz
  - Dimensions: 472.0(W) x 228.1(H) x 554.4(D) mm
  - Weight: 13 kg; Operating temp: 0–40°C
