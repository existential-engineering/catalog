description: A bolt-on, flat-top electric guitar with an Australian Blackwood
  body, directly mounted pickups, and push-pull coil-splitting tone control.
details: |-
  Caparison's Dellinger standard model has undergone a complete redesign, and now features a bolt-on/flat top body construction. The body material has been upgraded to Australian blackwood, resulting in a tonality that delivers a rich full range with a clear and defined fundamental. The pickups have been directly mounted to the body to enhance resonance and improve the overall sound quality, providing a well-defined sound spectrum with a distinct character. The pickup configuration includes a high-power Caparison PH-bc for the bridge, a Caparison single-coil VS-IA for the center, and a single-sized humbucker SH-NC for the neck pickup. With the push-pull switching tone control, you can simultaneously split the coils of the neck and bridge pickups, giving you a wider selection of tone options. Choose between an ebony (EF) or maple (MF) fingerboard, and select from three striking colors: The new "Interstellar Black," "Cobalt Blue," and "Tangerine Orange."
