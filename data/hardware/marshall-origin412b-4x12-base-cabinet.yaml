description: Straight-fronted 4x12" passive guitar speaker cabinet voiced for
  the Origin range. Loaded with four Celestion G12E-60 speakers, the Origin 412B
  handles 240W into 16Ω via a single 1/4" jack input, forming the base half of
  an Origin full stack when paired with an Origin head and the angled 412A.
  Finished in Marshall's classic black-and-gold livery to match the rest of the
  Origin family.
details: |-
  This elegant yet understated cabinet fits perfectly under your Origin amplifier to complete your vintage aesthetic. These cabinets have four 12" Celestion G12E-60 speakers, so you will always be heard no matter where you are.

  This cabinet is also available as an angled cab, allowing you to create your own Marshall stack.

  The Celestion G12E-60 speakers give a great bass response and a punchy mid-range, with classic styling to match the vintage looks of the Origin range.

  Designed and engineered in UK. Made in Vietnam.
