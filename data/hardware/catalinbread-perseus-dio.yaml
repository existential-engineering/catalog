description: The Perseus DIO is a three-voice all-analog octave-down fuzz pedal
  that generates harmonically rich square waves and clean sub-octave tones. It
  features independent controls for one and two octaves down, each with a
  dedicated low-pass filter, plus a dry signal knob that produces light
  distortion capable of pushing an amplifier into overdrive. All three voices
  can be blended together for a wide range of bass-heavy and fuzz textures.
details: |-
  The Perseus DIO is a three-voice all-analog octave-down fuzz that generates independent -1 octave and -2 octave square wave signals, each with its own dedicated low-pass filter for tonal shaping.

  Down 1 controls the -1 octave voice level, optimized for fretboard tracking accuracy. Filter 1 sweeps from approximately 7kHz down to 280Hz. Down 2 controls the -2 octave voice level. Filter 2 sweeps from approximately 7kHz down to 140Hz (deeper bass content). The Dry knob blends in the dry signal with light distortion, capable of pushing an amplifier into overdrive. All three voices blend together freely.
