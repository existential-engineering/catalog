description: >-
  The Doepfer Drehbank is a programmable universal MIDI controller featuring 64
  rotary knobs, each capable of sending any MIDI message including Control
  Change, Pitch Bend, Aftertouch, Note On, and SysEx. Its two user banks and CV
  input options make it a versatile hands-on control surface for hardware and
  software alike.
details: |-
  Released in 1998, the Doepfer Drehbank addressed a growing need among electronic musicians for tactile, real-time control over increasingly complex MIDI setups. With 64 rotary knobs arranged in a clear grid layout, it provides immediate physical access to parameters that would otherwise require tedious menu diving on rack synths or software instruments.

  Each knob can be independently assigned to transmit virtually any MIDI message type, making the Drehbank adaptable to any MIDI-equipped device or application. The two user-defined banks effectively double the control count to 128 parameters per setup, and a snapshot function allows instant recall of knob positions. The MIDI input with merge capability means the Drehbank can be inserted into an existing MIDI chain without disrupting signal flow.

  Beyond pure MIDI control, the unit includes eight CV inputs: four accepting external control voltages from 0 to 5 volts and four configured for foot controllers. This bridging of analog and digital control protocols was particularly forward-thinking. The included Emagic SoundDiver software and eight factory presets, covering applications from ReBirth to General MIDI mixing, provided a solid starting point for new users. Notable user Squarepusher employed the Drehbank in his famously complex live setups.
specs: |-
  - Knobs: 64 rotary encoders
  - MIDI Messages: Control Change, Pitch Bend, Aftertouch, Note On, SysEx
  - Memory: 2 user banks of 64 knobs each
  - MIDI: Out, In (with merge)
  - CV Inputs: 8 (4 external CV 0-5V, 4 foot controller)
  - Factory Presets: 8 setups (ReBirth, Rmx1, GM mixer, etc.)
  - Software: Emagic SoundDiver (Mac/Win) included
  - Compatibility: Windows 3.1/95/NT, Macintosh
