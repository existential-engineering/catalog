description: >-
  The Kawai K1iir is the rack-mount version of the K1ii digital PCM synthesizer, combining up to
  four waveforms per sound from 256 digital samples for versatile sound creation, though without the
  keyboard version's built-in effects.
details: |-
  The K1ii was the first major update to Kawai's popular K1 digital PCM-waveform synthesizer line, released in 1989. It retained the same synthesis architecture as the original K1 while adding improved drum sounds to its library of 256 digital samples, 50 of which are derived from acoustic instruments. The K1iir is the rack-mount module version, identical to the keyboard version except that it lacks the built-in reverb effects processor.

  The synthesis approach combines up to four wave shapes per sound, allowing creation of convincing acoustic recreations, unique synth sounds, or complex noisy textures. The 16-voice polyphony and 8-part multitimbrality make it suitable for sequencing work in the studio, enabling multiple patches to play simultaneously.

  Despite lacking traditional filters, the K1ii series produces a wide range of sounds through its waveform layering approach. Standard ADSR envelopes shape the amplitude, and an LFO provides modulation. Memory holds 64 single patches or 32 combo patches.

  The K1 series gained popularity for its ability to produce sounds well beyond its modest specifications through creative waveform combinations. The K1iir offers the same sonic capabilities in a space-efficient rack format, though users seeking the built-in effects should look to the K1ii keyboard version instead.
specs: |-
  - Polyphony: 16 voices
  - Oscillators: 256 PCM waveforms (4 per sound)
  - LFO: 1
  - Filter: None
  - VCA: ADSR envelope
  - Effects: None (keyboard version has reverb)
  - Keyboard: None (rack-mount module)
  - Memory: 64 single patches or 32 combo patches
  - Control: MIDI
releaseDate: "1989"
