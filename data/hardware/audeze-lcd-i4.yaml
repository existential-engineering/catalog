description: Flagship in-ear headphones featuring the Nano-Scale Uniforce
  diaphragm and Fluxor magnet array, delivering one of the most responsive,
  detailed, and immersive in-ear listening experiences.
details: |-
  The LCDi4 represents the pinnacle of both audio quality and technological innovation. This groundbreaking in-ear headphone features the same Nano-Scale Uniforce diaphragm found in our LCD-4 and 4z, paired with our powerful Fluxor magnet array to offer one of the most responsive, detailed, engaging, and immersive listening experiences in the world.

  The i4 will transform everything you thought you knew about in-ear headphones as you hear your favorite music as though for the first time.

  Included with the LCDi4: a premium OCC braided cable (1.2m), nylon travel case, selection of ear hooks and tips, and a certificate of authenticity card.

  This is a legacy product and no longer available for sale.
specs: |-
  - Style: In-ear, semi open-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Nano-scale Uniforce
  - Transducer size: 30 mm
  - Maximum power handling: 500mW RMS
  - Maximum SPL: >130dB
  - Frequency response: 10Hz - 50kHz
  - THD: <0.1% @ 100dB
  - Impedance: 32 ohms
  - Sensitivity: 110 dB/1mW (at Drum Reference Point)
  - Minimum power requirement: >50mW
  - Weight: 23g/pair
  - Cable: Premium OCC braided cable (1.2m)
