details: |-
  AMP 20 is a remarkably powerful 12-channel amplifier and can be paired with AV 20 for an elite, reference-level home theater system. Rated at 200 watts per channel into 8 ohms and 400 watts per channel into 4 ohms and built on Marantz's exclusive HDAM and high-efficiency Class D amplification, it delivers clean, controlled power across complex multichannel speaker systems.

  AMP 20 combines very high-power output and high channel count to create a master reference-level amplifier for ultimate home theater performance. When paired with AV 20, the results are unforgettable.

  AMP 20's custom-developed Class D amplification and refined HDAM-SA2 technology create the most incredible theatrical experience possible in your home, and the Marantz Sound Master meticulously tuned it with careful parts selection.

  AMP 20 gives 12 channels of commanding power in a single enclosure, each rated at 200 watts to perform at extraordinarily high levels with no loss in fidelity. Key technologies include a copper plated chassis, SPK 1+ speaker terminals, BTL mode and Bi-Amp mode, and it is crafted in Shirakawa, Japan.
specs: |-
  - Number of power amps: 12
  - Power output (8 ohm, 1 kHz, 0.05%, 2ch drive), normal / BTL: 200W / 400W
  - Power output (4 ohm, 1 kHz, 0.7%, 2ch drive), normal: 400W
  - Power output (8 ohm, 1 kHz, 0.7%, 5ch drive), normal: 200W
  - Main amplifier in: balanced and unbalanced, 12ch (exclusive use by a selector switch)
  - Speaker terminal: SPKT-1+
  - Number of speaker terminals: 12
  - Bi-Amp drive / BTL drive: Yes / Yes
  - Exclusive HDAM with custom switching (Class D) amplifiers
  - Chassis: copper plated
  - Front display: level meter
  - Metal front panel: Yes
  - Auto power off: Yes
  - RS232 control: Yes
  - IR flasher in: Yes
  - Marantz Remote Bus: Yes
  - DC trigger input / output: 1 / 1
  - Power consumption: 400W
  - Power consumption, no sound: 110W
  - Standby consumption: 0.2W
  - Maximum dimensions (W x D x H): 17.4 x 17.4 x 7.5 in
  - Weight: 39.7 lbs
  - In the box: main unit, quick start guide, AC cord, amp control cable, remote control cable, SP terminal wrench
  - UPC code: 747192143930
  - Crafted in Shirakawa, Japan
