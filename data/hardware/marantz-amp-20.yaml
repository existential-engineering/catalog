id: NBhq6rKBSLDEztH0W3Kr7
name: AMP 20
manufacturer: marantz
primaryCategory: power-amp
url: https://www.marantz.com/en-us/product/power-amplifiers/amp-20/301027.html
description: A reference-level 12-channel power amplifier delivering 200 watts
  per channel, designed as the perfect partner to the AV 20 for elite home
  theater systems. Combines Marantz's exclusive HDAM technology with
  high-efficiency Class D amplification, and is crafted in Shirakawa, Japan.
details: |-
  The Marantz AMP 20 is a 12-channel reference power amplifier engineered to anchor elite, immersive home theater systems. Paired with the AV 20 AV 8K processor, it delivers clean, controlled power across complex multichannel speaker configurations.

  Each of the 12 channels is rated at 200 watts into 8 ohms, and can be reconfigured for 400 watts per channel into 4 ohms in BTL (bridged) mode. Inputs accept either balanced XLR or unbalanced RCA on a per-channel basis via selector switches, feeding SPKT-1+ speaker binding-post outputs. Selectable output modes enable Normal, Bi-Amp, and BTL configurations for flexible system architecture.

  A copper-plated chassis, premium metal front panel, and Marantz's signature illuminated level meter underscore the amp's reference pedigree, while hand assembly in Shirakawa, Japan ensures the highest standards of build quality. Integration features include RS232, IR flasher input, Marantz Remote Bus, and DC trigger I/O for seamless system control.
specs: |-
  - 12 channels of amplification
  - 200W per channel (8 ohms, 1 kHz)
  - 400W per channel (4 ohms, BTL mode)
  - Exclusive Marantz HDAM technology
  - Custom Class D switching amplifiers
  - Selectable output modes (Normal / Bi-Amp / BTL)
  - Per-channel balanced XLR or unbalanced RCA input selector
  - SPKT-1+ speaker binding posts (12)
  - Copper-plated chassis
  - Illuminated front-panel level meter
  - Premium metal front panel
  - Auto power off
  - Crafted in Shirakawa, Japan
  - Power consumption: 400W operational / 110W idle / 0.2W standby
  - Dimensions: 17.4" x 17.4" x 7.5"
  - Weight: 39.7 lbs
