description: SuperSpeed USB 3.0 audio converter for Mac and PC, adding 18 inputs
  and 20 outputs to a USB 3.0-equipped Mac, Windows computer or iPad with
  recording and playback up to 24-bit/192 kHz.
details: |-
  The UAC-8 is a rackmountable 18-in/20-out SuperSpeed USB 3.0 audio interface in a 1U metal housing, working with any USB 3.0-equipped Mac or Windows computer and with the Apple iPad through an Apple Camera Connection Kit or Lightning to USB Camera Adapter. It records and plays back at up to 24-bit/192 kHz.

  Eight front-panel combo XLR/TRS inputs accept mic and line level signals, each with its own gain control and clip LED, up to +60 dB of mic preamp gain, and switchable +48V phantom power in two banks (Inputs 1 to 4 and Inputs 5 to 8). Hi-Z switches on Inputs 1 and 2 allow an electric guitar or bass to be plugged in directly.

  Ten balanced TRS output jacks carry a Master L/R pair for monitors plus eight discrete line outputs for multichannel monitoring or connection to external effects devices. A large front-panel Output knob sets the monitoring level, and two independent 1/4-inch stereo headphone jacks each have a dedicated volume control.

  Digital I/O adds 8-channel ADAT optical in and out, stereo S/PDIF on RCA coaxial, word clock in and out on BNC, and MIDI In and Out on 5-pin DIN jacks for keyboards and drum machines. The SuperSpeed USB 3.0 transfer protocol runs a 2.0 ms roundtrip at 96 kHz and 32 samples, and its asynchronous transfer system is unaffected by computer jitter, so no external master clock source is required.

  Conversion uses an AKM AK5388 analog-to-digital converter and an AKM AK4413 digital-to-analog converter with 4x upsampling in both directions, so a session set to 44.1 kHz or 48 kHz is processed at 176.4 kHz or 192 kHz for less aliasing noise on the way in and more clarity on the way out. In standalone mode the UAC-8 works as an 8-channel mic preamp and A/D or D/A converter with no computer connected. The free UAC-8 MixEfx application for Mac and Windows adds an onscreen mixer with per-channel level, phase reversal and panning, free routing of any input to any output, reverb and echo effects, and three memory slots for instant recall.
specs: |-
  - 18-in/20-out SuperSpeed USB 3.0 audio interface, USB 3.0 / 2.0
  - Sampling frequencies: 192 / 176.4 / 96 / 88.2 / 48 / 44.1 kHz, 24-bit
  - Recording and playback channels at 44.1/48 kHz: 18 in (analog 8, S/PDIF 2, ADAT 8), 20 out (analog 10, S/PDIF 2, ADAT 8)
  - Recording and playback channels at 88.2/96 kHz: 14 in (analog 8, S/PDIF 2, ADAT 4), 16 out (analog 10, S/PDIF 2, ADAT 4)
  - Recording and playback channels at 176.4/192 kHz: 12 in (analog 8, S/PDIF 2, ADAT 2), 14 out (analog 10, S/PDIF 2, ADAT 2)
  - Class compliant mode at all supported rates: 8 recording channels (analog), 10 playback channels (analog)
  - Inputs 1 to 8: XLR/TRS combo jacks (XLR pin 2 hot, TRS tip hot), input gain 0 to 60 dB in 1 dB steps
  - Inputs 1 to 8: input impedance 5 kOhm, or 1 MOhm with IN1/IN2 Hi-Z on. Max input level +13 dBu (XLR) and +21 dBu (TRS) at 0 dBFS
  - Phantom power: +48V, switchable for Inputs 1 to 4 and Inputs 5 to 8
  - Master outputs L/R: balanced TRS jacks
  - Line outputs 1 to 8: max output level +14 dBu at 0 dBFS, output impedance 150 Ohm
  - Phones 1/2: standard stereo phone jacks, 20 mW x 2 into 32 Ohm, max output level +10 dBu, output impedance 33 Ohm
  - ADAT optical (lightpipe): 8 in/out at 44.1/48 kHz, 4 in/out at 88.2/96 kHz (S/MUX), 2 in/out at 176.4/192 kHz (S/MUX4)
  - S/PDIF: RCA coaxial, 2 in / 2 out, 44.1 to 192 kHz, up to 24-bit/192 kHz
  - Word clock: BNC in and out, 44.1 to 192 kHz, output impedance 75 Ohm
  - MIDI in/out: 5-pin DIN jacks
  - Frequency characteristics: -1.0 dB, 20 Hz to 20 kHz at 44.1 kHz. 20 Hz to 40 kHz at 96 kHz. 20 Hz to 60 kHz at 192 kHz
  - Input conversion noise: measured EIN -125 dB (IHF-A) at 60 dB gain, 150 Ohm input
  - Dynamic range: 120 dB typical (IHF-A) for both A/D and D/A
  - Converters: AKM AK5388 A/D and AKM AK4413 D/A, with 4x upsampling in both directions
  - USB 3.0 roundtrip latency: 2.0 ms at 96 kHz / 32 samples
  - Power supply: AD-19 DC12V 2A AC adapter
  - Rack-mountable, 1U space, robust metal housing
  - Dimensions: 6.2 in (D) x 19 in (W) x 1.8 in (H), 157.65 x 482.6 x 46.03 mm
  - Weight (main unit only): 4.4 lb / 2.02 kg
  - Included: operation manual, USB 3.0 cable (1m), Cubase LE download and startup guide
