details: |-
  The FG2 is a spin on the Delos, featuring some of Gambale's preferred specs and exclusive signature inlay. Standard specs include Frank Gambale Pearl Yellow, Beryllium bridge pickup, and a 14-inch fingerboard radius.

  Gambale customized the model to fulfill the role of an S-style guitar's sound while calling back to his signature color with the Pearl Yellow finish.

  The most important differentiation compared to the Delos is the unique dual push-push pots, allowing for unique pickup-switching based on Frank's preference. The FG2 accompanies the FG1 to assist in creating Gambale's notable, unique jazz style, sound, and tone.

  The body is alder with bolt-on construction and a radiused neck heel, a black multi-layered pickguard, a tung-oiled maple neck with a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability, and a GT-style inline headstock painted to match the body.

  Pickups are a Kiesel Beryllium bridge humbucker with dual Twinblade humbuckers in the middle and neck positions, wired to master volume and tone controls and a 5-way blade-style pickup selector, over a Gotoh 510 tremolo at .425 inch (10.8 mm) spacing.
specs: |-
  - Based on the Kiesel Delos, and sold alongside the FG1
  - Construction: bolt-on with radiused neck heel
  - Body: alder
  - Finish: Gambale Pearl Yellow metallic
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: ebony with 14 inch radius
  - Frets: 22 regular nickel, .080 inch wide x .043 inch tall
  - Scale length: 25.5 inch
  - Pickups: Kiesel Beryllium bridge humbucker, dual Twinblade humbuckers in the middle and neck positions
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector, dual push-push pots for the signature pickup switching
  - Bridge: Gotoh 510 tremolo, .425 inch (10.8 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: GT-style inline headstock painted to match body
  - Inlays: Frank Gambale signature inlays with standard black-ring Luminlay Super Blue side dots
  - Pickguard: black multi-layered
  - Truss rod cover: Frank Gambale signature
  - Hardware: black
  - Neck width: 1.69 inch wide at the nut, 0.78 inch thick at the 1st fret, 0.88 inch thick at the 12th fret
  - Body dimensions: 39.5 inch long, 1.65 inch thick, 12.5 inch wide
  - Weight: 8 lbs
  - Strings: Elixir Nanoweb 942E
