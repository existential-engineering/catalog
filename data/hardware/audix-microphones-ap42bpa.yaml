details: |-
  A value-packed diversity system featuring the versatile B60 bodypack transmitter. This bodypack may be used with any lavalier, head-worn, or instrument microphone in the AUDIX line, as well as guitar and bass.

  Included are a rack mount kit and BNC cables for front mounting antennas.
specs: |-
  - System: R42 dual-channel diversity receiver with B60 bodypack transmitter(s)
  - Rack mount kit and BNC antenna cables included
  - Frequency bands: A (522-554 MHz), B (554-586 MHz)
  - 106 pre-coordinated frequencies
