details: |-
  The dbx 240 is a discontinued DriveRack system processor designed for professional audio applications across installed, portable, and touring markets. The DriveRack series integrates multiple signal processing functions including equalization and crossover capabilities in a single rack unit.

  As a member of the DriveRack product family, the 240 was designed to work with the DriveWare PC software for configuration and control. Firmware updates were available through the DriveRack Updater utility.
