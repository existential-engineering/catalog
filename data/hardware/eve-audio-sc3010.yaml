description: The SC3010 is an active 3-way main studio monitor from EVE Audio
  for farfield use, with a 10" SilverCone woofer, a 5" SilverCone midrange and
  the large AMT RS6 tweeter, each driven by its own PWM amplifier for 1300 W in
  total. Crossovers at 240 Hz and 1800 Hz and a midrange and tweeter module that
  rotates by 90 degrees suit it to large control rooms, post-production and
  in-wall installations.
details: |-
  For large recording and mastering studios, film and television post-production facilities, cinema applications and in-wall installations, EVE Audio offers the SC3010 and SC3012 main monitors. The SC3010 systems feature a very powerful amplifier array, with one amplifier per driver. All drivers, and especially the proprietary AMT RS6 tweeter, are developed to deliver high sound pressure levels, extremely low distortion and an optimized directivity. Together with the ultra-stiff plywood front plate and a special inner construction to lower resonances, they offer a smooth directivity, highly defined mids, pristine high frequencies and a powerful, tight low end.

  The SC3010 systems are also built with in-wall installations in mind. In that case the filter controls are simply set to inwall, and a set of high-density foam is provided to close the backfiring bass ports. The silver module housing the midrange driver and the AMT RS6 tweeter can be rotated by 90 degrees, so the speakers can be set up either horizontally or vertically.

  One 10" double coated low resonance metal diaphragm bass woofer, with a long excursion, provides an extraordinarily clean low frequency reproduction down to 30 Hz (-3 dB) and easily reproduces all audio content, even at higher than usual sound pressure levels. The SC3010 also features a 5" midrange unit whose glass fibre layered Rohacel sandwich diaphragm delivers clear and detailed midrange reproduction. Both the 10" SilverCone woofer and the 5" SilverCone midrange are equipped with the EVE Audio low distortion copper cap magnet system.

  Exclusive to the SC3010 and its larger sibling the SC3012 is the large Air Motion Transformer AMT RS6. This AMT is 2.5 times bigger than the RS1, RS2 and RS3 Air Motion Transformer units, and it is a crucial part of the system because it helps couple the middle and high frequencies with great precision. EVE Audio engineered the RS6 to set its crossover frequency at 1800 Hz, a very important frequency for human hearing and, subsequently, for music production.

  Each driver is provided with its own separate PWM amplifier able to deliver a short-term output power of 250 W per tweeter and midrange channel and 800 W for the low-end driver, with a maximum output level of 114 dB SPL at 1 m. The SC3010 is a three-way system that combines powerful bass reproduction with a very transparent and present midrange and crystal clear high frequency reproduction. As with every other EVE Audio speaker, both balanced XLR inputs and unbalanced RCA inputs are provided.
specs: |-
  - Frequency range: 29 Hz - 21 kHz
  - Woofer size: 10"
  - Max. SPL: 126 dB
  - Dimensions: 380x580x440 mm (15x22.8x17.3 inches, WxHxD)
  - Output power: 1300 W per speaker
  - Cross-over frequency: 240 and 1800 Hz between drivers
  - Tweeter: AMT RS6
  - Output power tweeter: 250 W
  - Mid-driver: 5"
  - Output power mid-driver: 250 W
  - Output power woofer: 800 W
  - Max. output level: 114 dB SPL at 1 m
  - Weight: 37 kg (81.6 lb)
  - Input level dip switch: +7 dBu / +22 dBu
  - Power consumption: less than 1 W standby, 1000 VA maximum
