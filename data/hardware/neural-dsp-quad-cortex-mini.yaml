details: |-
  Quad Cortex Mini is a compact guitar and bass processing unit that delivers full Quad Cortex performance in a significantly smaller footprint. It provides a complete creative toolkit for musicians, offering professional-grade tone in a portable design that fits easily into pedalboards, modern rigs, and desktop setups.

  The device features Neural Capture technology, allowing users to create and play ultra-accurate digital replicas of real amps, cabinets, drive pedals, and compressors. It comes preloaded with over 2000 high-quality factory neural captures and supports both Neural Capture v1 (offline processing) and v2 (cloud-based high-resolution capturing).

  The Grid visual workspace enables intuitive signal chain creation, allowing users to place virtual device blocks, rearrange signal paths, and split signals with precision. The interface supports multiple control modes including preset, scene, stomp, and hybrid modes for flexible performance options.

  Quad Cortex Mini is designed for live performance, studio recording, and practice. It functions as a multichannel USB-C audio interface, supports wireless content downloads and firmware updates, and is part of a platform that continues to evolve through ongoing CorOS updates.

  The device integrates with Cortex Cloud and Cortex Control desktop app, allowing users to share neural captures, explore new sounds, and manage their device and content efficiently across different workflows.
