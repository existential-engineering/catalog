name: M32 LIVE
manufacturer: midas
primaryCategory: console
categories:
  - mixer
url: "https://www.midasconsoles.com/en/products/0603-AEO"
description: Mid-format digital mixing console featuring 32 Midas PRO Series
  microphone preamplifiers, 40-bit floating point audio processing, 25 motorised
  faders, a 7-inch colour TFT main display and 29 channel LCD scribble strips.
  Provides 32 input channels, 8 aux channels, 8 FX return channels, 16 mix
  buses, 6 matrices and main LRC, with 16 internal effects engines and 100 total
  recall scenes. Onboard I/O includes dual AES50 ports (Klark Teknik SuperMAC)
  for 48 channels per port, a 16-channel ULTRANET output for P16 personal
  monitoring, USB 2.0 for 32 x 32 channel recording, MIDI in/out, AES/EBU output
  and an expansion slot for DN32-USB, DN32-ADAT, DN32-MADI or DN32-DANTE cards.
details: |-
  The M32 LIVE is a mid-format digital mixing console built on the award-winning Midas PRO Series microphone preamplifier and custom Midas PRO motorised faders (rated for 1 million life cycles). It features a 40-bit floating point audio engine with 0.8 ms console latency, Cirrus Logic multi-channel 192 kHz A/D converters and 114 dB dynamic range. Signal processing covers 32 input channels, 8 aux channels and 8 FX return channels, routed to 16 mix buses, 6 matrices and main LRC, with 16 internal effects engines (true-stereo, studio-grade) running modelled classics including Sound Maximizer, Dimensional Chorus, Modulation Delay, multiple reverbs (Rich Plate, Room, Rich Chamber, Vintage Room, Plate, Hall, Vintage), Wave Designer, Stereo Precision Limiter, De-Esser, Flanger & Delay, Chorus & Chamber, plus LA/Ultimo/Fair compressors and Pultec-style XTEC EQs.

  The control surface presents a 7-inch day-viewable colour TFT main display, 29 programmable LCD scribble strips, context-sensitive tactile encoders, 11 strategically placed View buttons and 36 fully customisable Assign controls on three layers. Recall is handled via 100 internal total recall scenes and a 500-cue / 100-snippet show automation system.

  Local I/O includes 32 mic preamp XLR inputs, 16 XLR outputs, 6 aux 1/4-inch TRS balanced jacks (assignable as inputs or outputs), 2 RCA inputs and 2 RCA outputs, an XLR talkback mic input, an XLR AES/EBU output, dual 1/4-inch TRS stereo phones outputs, dual AES50 ports (Klark Teknik SuperMAC, 48 channels each), a 16-channel ULTRANET P-16 output, USB Type A (audio/data import/export), USB Type B (rear panel, remote control), RJ45 Ethernet (rear panel, remote control), MIDI In/Out (5-pin DIN), and a single 32-channel expansion card slot (pre-installed DN32-USB, swappable for DN32-ADAT, DN32-MADI or DN32-DANTE).

  Networked stage-box deployment uses Klark Teknik DL16 units (up to three daisy-chained per AES50 port) for a maximum of 96 inputs and 96 outputs. The console supports the M32-EDIT (PC/Mac/Linux) remote app, the M32 MIX iPad app (up to 10 simultaneous iPads) and the M32-Q personal monitoring app for iOS and Android. Power is supplied by an auto-ranging 100-240 VAC switch-mode supply at 120 W. Cabinet is 891 x 612 x 256 mm, 25 kg.
specs: |-
  - Input Processing Channels: 32 Input Channels, 8 Aux Channels, 8 FX Return Channels
  - Output Processing Channels: 16
  - Mix Buses: 16 aux buses, 6 matrices, main LRC
  - Internal Effects Engines (True Stereo / Mono): 16
  - Internal Total Recall Scenes: 100
  - Internal Show Automation (Cues / Snippets): 500 / 100
  - Signal Processing: 40-Bit Floating Point
  - A/D Conversion (8-channel, 96 kHz ready): 114 dB Dynamic Range (A-weighted)
  - D/A Conversion (stereo, 96 kHz ready): 120 dB Dynamic Range (A-weighted)
  - I/O Latency (Console Input to Output): 0.8 ms
  - Network Latency (Stage Box In > Console > Stage Box Out): 1.1 ms
  - Frequency Response @ 48 kHz Sample Rate: 0 dB to -1 dB (20 Hz-20 kHz)
  - Dynamic Range, Analogue In to Analogue Out: 106 dB (22 Hz-22 kHz, unweighted)
  - A/D Dynamic Range, Output (Typical): 109 dB (22 Hz-22 kHz, unweighted)
  - THD+N (+40 dB gain, 0 dBu to +20 dBu output): <0.03% (unweighted)
  - THD+N (0 dB gain, 0 dBu output): <0.01% (unweighted)
  - Crosstalk Rejection @ 1 kHz, Adjacent Channels: 100 dB
  - CMRR @ 40 dB Gain (Typical): >90 dB
  - Equivalent Input Noise @ +45 dB gain: -125 dB (22 Hz-22 kHz, unweighted)
  - Residual Noise Level, Out 1-16 XLR Connectors, Muted: -88 dBu 22 Hz-22 kHz unweighted
  - Residual Noise Level, Out 1-16 XLR Connectors, Unity Gain: -85 dBu 22 Hz-22 kHz unweighted
  - Residual Noise Level, TRS and Monitor out XLR Connector: -83 dBu 22 Hz-22 kHz unweighted
  - Non-Clip Maximum Input Level (XLR): +23 dBu
  - Non-Clip Maximum Input Level, TRS Connectors: +21 dBu
  - Output Level, XLR Connectors (Nominal / Maximum): +4 dBu / +21 dBu
  - Output Level, TRS (Nominal / Maximum): +4 dBu / +21 dBu
  - Output Impedance, XLR (Unbalanced / Balanced): 50 Ω / 50 Ω
  - Output Impedance, TRS (Unbalanced / Balanced): 50 Ω / 50 Ω
  - Input Impedance (Unbalanced / Balanced): 10 kΩ / 10 kΩ
  - Input Impedance, TRS Connectors (Unbalanced / Balanced): 20 kΩ / 40 kΩ
  - Phones Output Impedance / Maximum Output Level: 40 Ω / +21 dBu (Stereo)
  - Phantom Power (Switchable per Input): +48 V
  - Midas PRO Series Microphone Preamplifier (XLR): 32
  - XLR Outputs: 16
  - Aux Inputs/Outputs (1/4" TRS Balanced): 6
  - RCA Inputs / Outputs: 2
  - Talkback Microphone Input (XLR): 1
  - Phones Output (1/4" TRS): 2 (Stereo)
  - Digital AES/EBU Output (XLR): 1
  - AES50 Ports (Klark Teknik SuperMAC): 2
  - ULTRANET P-16 Connector (No Power Supplied): 1
  - USB Type A (Audio and Data Import / Export): 1
  - USB Type B, rear panel, for remote control: 1
  - Ethernet, RJ45, rear panel, for remote control: 1
  - MIDI Inputs / Outputs: 1
  - Expansion Card Interface: 32 Channel Audio Input / Output
  - Main Screen: 7" Day-viewable Colour TFT
  - Channel LCD Screen: 128 x 64 LCD with RGB Colour Backlight
  - Main Meter: 24 Segment (-57 dB to Clip)
  - Design: Midas PRO Series
  - Switch-Mode Power Supply: Auto-Ranging 100-240 VAC (50/60 Hz) ± 10%
  - Power Consumption: 120 W
  - Standard Operating Temperature Range: 5°C – 40°C (41°F – 104°F)
  - Dimensions: 891 x 612 x 256 mm (35.1 x 24.1 x 10.1")
  - Weight: 25 kg (55 lbs)
