description: Bring the power of MIDI to your Korg MS-10. The Kenton Korg MS-10
  Retrofit Kit gives you enhanced control over your MS-10 using MIDI, allowing
  you to control it from your DAW, sequencer or other controller. You can
  control notes, modulation, pitchbend, volume and the MS-10's LFO and filter
  cut-off.
details: |-
  A MIDI retrofit for the Korg MS-10 that adds MIDI control of the instrument without altering any of its original functionality. Once fitted, the synthesiser can be played from a DAW, a sequencer or any other MIDI controller, and control passes automatically between the keyboard and incoming MIDI.

  The retrofit responds on any of the 16 MIDI channels and covers note pitch, pitchbend, modulation, both the low pass and high pass filter cutoffs, volume, sustain and slide or portamento. Note range is MIDI 36 to 96 and is transposable, and pitchbend range can be set to two semitones, a fifth or an octave. Aftertouch, velocity and pitchbend can each be routed to volume or to either filter cutoff.

  It also carries an LFO of its own, which can be MIDI synced and routed to the VCO and to the low pass filter cutoff, with waveshape, speed and depth all reachable over MIDI. The default control assignments cover mod wheel to the MS-10's own LFO, CC 7 for volume, CC 64 for sustain, CC 65 and CC 5 for the retrofit's own portamento, and CC 12 to CC 17 for the retrofit LFO and filter cutoff, and every one of those parameters can be reassigned to a different controller number. Settings are held in non-volatile EEPROM.

  In hardware terms the kit adds MIDI In and MIDI Thru DIN sockets plus a push button used to program the MIDI setup. The kit comprises a circuit board that fits inside the MS-10, a small pack of DIN sockets and mounting hardware, a large pack of cable assemblies, user instructions and step by step fitting instructions.

  The retrofit is built to order and is currently offered only as a fully installed service at the maker's premises in Tadworth, outside London, rather than as a self-fit kit.
specs: |-
  - Adds MIDI to the Korg MS-10 without changing its original functionality
  - Switches automatically between keyboard and MIDI control
  - Any of the 16 MIDI channels selectable
  - Note range MIDI 36 to 96, transposable
  - Pitchbend range selectable: 2 semitones, a fifth or an octave
  - Controls note pitch, pitchbend, modulation, low pass and high pass filter cutoff, volume, sustain and portamento
  - Aftertouch, velocity and pitchbend assignable to volume and both filter cutoffs
  - Built in MIDI syncable LFO routable to VCO and low pass filter cutoff
  - All controller assignments are reassignable
  - Setup stored in non-volatile EEPROM
  - Adds MIDI In and MIDI Thru DIN sockets and a programming push button
