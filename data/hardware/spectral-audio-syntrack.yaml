description: >-
  The Spectral Audio Syntrack is a 1U rack-mount monophonic synthesizer that combines a
  digital wavetable oscillator with an analog cascade filter and analog distortion stage.
  Produced from 1998 to 2008, it offers 99 program memories, full MIDI implementation, and
  a knob-per-parameter design aimed at delivering simple but characterful synth sounds.
details: |-
  The Syntrack merges digital and analog synthesis in a compact, light-blue 1U rack module. Its digital wavetable oscillator provides 100 waveforms, expandable to 200 via an optional second chip, while the analog 24 dB Cascade Filter with resonance and self-oscillation delivers aggressive tonal shaping. An analog Distorter stage follows the filter for additional harmonic saturation.

  Designed as a modern mono-synth for contemporary studios, the Syntrack features a knob-per-parameter interface that avoids menu diving. It responds to velocity and aftertouch for expressive playing, and every parameter is accessible via MIDI continuous controllers, making it well-suited for sequencer-based workflows. An external audio input allows processing of outside sound sources through the filter and distortion stages.

  The unit stores 99 programs, with 29 factory presets and 70 user-programmable slots. Its full MIDI implementation includes In, Out, and Thru connections, enabling seamless integration into any MIDI-equipped studio setup.
specs: |-
  - Polyphony: Monophonic
  - Oscillator: Digital wavetable with 100 waves (expandable to 200)
  - LFO: Yes
  - Filter: Analog 24 dB Cascade Filter with resonance and self-oscillation
  - VCA: Release, Decay, Level, Distortion controls
  - Memory: 99 programs (29 presets, 70 user slots)
  - MIDI: In, Out, Thru
  - External Audio Input: Yes
  - Format: 1U rack mount
  - Production Period: 1998–2008
releaseDate: "1998"
