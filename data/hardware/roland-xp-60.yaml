description: >-
  The Roland XP-60 is a 64-voice polyphonic digital workstation synthesizer featuring 16MB
  of PCM ROM sounds expandable to 80MB via SR-JV80 expansion boards. It offers a 61-key
  velocity and aftertouch sensitive keyboard, a built-in MRC Pro sequencer, and
  high-quality multi-effects processing, making it a comprehensive all-in-one music
  production instrument. Its sound engine is virtually identical to the JV-1080, JV-2080,
  XP-80, and XP-50 synthesizers.
details: |-
  The Roland XP-60 was one of Roland's flagship digital workstation synthesizers of the mid-1990s. With extensive professional features, superb quality PCM sounds, sequencing, effects, and more, the XP-60 was designed to be a complete music production solution in a single instrument. It is almost identical to the XP-80, differing primarily in its standard 61-note keyboard compared to the XP-80's 76-note semi-weighted keyboard.

  The XP-60 employs a digital PCM subtractive synthesis engine with four oscillators per voice and 16MB of ROM, expandable to 80MB through four SR-JV80 expansion board slots. These expansion boards add Orchestral, Techno, Vintage Synths, World, Bass & Drums, and other instrument sets. While its strengths lie in the emulation of acoustic instruments, it can also create convincing synth-type sounds.

  Sound shaping is handled by resonant 4-pole digital filters offering 12dB/oct high-pass, low-pass, band-pass, and peak filtering modes. A ring modulator provides analog-synth type effects well-suited for dance and techno music. A modulation matrix provides up to two LFO effects for adding motion and life to sounds, and six sliders offer real-time control over parameters.

  The built-in MRC Pro sequencer provides a 60,000-note capacity with 100 patterns and 1 song position, along with grid, groove, and shuffle quantization options. A built-in disk drive allows for data storage, and a great arpeggiator rounds out the performance features. Three effects processors offer 40 effects types including reverbs, chorus, delays, and many multi-effects.
specs: |-
  - Polyphony: 64 voices
  - Oscillators: 4 per voice, digital PCM subtractive
  - Sound Memory: 16MB ROM (expandable to 80MB)
  - Keyboard: 61 keys with velocity and aftertouch
  - Preset Patches: 512 preset, 128 user
  - Performance Modes: 64 preset, 32 user
  - Drum Kits: 8 preset, 2 user
  - Filter: Resonant 4-pole, 12dB/oct (HP, LP, BP, Peak)
  - Effects Processors: 3 processors, 40 effects types
  - Reverb Types: 8
  - LFOs: 2 (via modulation matrix)
  - Real-Time Control Sliders: 6
  - Sequencer Capacity: 60,000 notes
  - Sequencer Patterns: 100
  - Sequencer Songs: 1
  - Quantization: Grid, Groove, Shuffle
  - MIDI: 16-part multitimbral
  - Expansion Slots: 4 (SR-JV80 series)
  - Storage: Built-in disk drive
