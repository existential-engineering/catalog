details: |-
  Monophonic analog synthesizer

  The second musical instrument in our TORAIZ range, the AS-1 is a monophonic analog synthesizer that brings new creative possibilities to the studio and the stage. Its intuitive controls include parameter knobs that let you make both subtle and dramatic changes to the tone of your music to create your own personalised sound. Plus you can use the touchpad-style keyboard and slider to manipulate sounds during performances. The TORAIZ AS-1 is driven by a fully programmable, true analogue synthesis engine based on the discrete analogue circuitry in Dave Smith Instruments’ Prophet-6 synthesizer. It also inherits 7 on-board effects from the Prophet-6 synth as well as a brand new digital distortion.
