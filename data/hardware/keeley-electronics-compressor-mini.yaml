description: A two-knob mini-enclosure compressor with automatic blending of the
  dry and compressed signal, an automatic tone recovery circuit, a built-in
  preamp and true bypass.
details: |-
  The Compressor Mini puts Keeley's compression in a half-size enclosure with an intuitive two-knob layout. It uses Manhattan-style compression, blending the dynamic and compressed signal automatically so that the subtlety and dynamics of a performance are retained without a dedicated blend control.

  A transient release time is set to suit both single coils and humbuckers, keeping either lively and expressive, and an automatic tone recovery circuit acts as a treble clarifier that keeps the highs clear even at high compression settings. The sustain range is wider than earlier designs, which allows for more subtle compression.

  The pedal carries a built-in preamp intended for pushing pedals and amplifiers, and it is true bypass. It runs on 9 volts with a 10mA current draw and is designed and built in the United States. The storefront lists it in a black neon finish. It won Premier Guitar's Premier Gear award.
