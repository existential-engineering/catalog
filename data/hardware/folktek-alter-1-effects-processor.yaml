description: Alter 1 is a Eurorack effects processor module with seven DSP
  effects including delay, granular delay, reverb, distortion, pitch delay and
  stutter glitch. This copper-finish version is electronically identical to the
  gold version but uses copper artwork and touch pads.
details: |-
  The Alter 1 is temporarily unavailable. It will be available for purchase again in late June. We apologize for the inconvenience. Alter 1 - Copper is an effects processor for eurorack format. The Copper version uses copper pours for the artwork and touch pads instead of gold, but is otherwise identical to the gold version. There are also two versions of the Alter which are visually identical except the names "Alter 1" and "Alter 2". This is Alter 1 - Copper version. Internally, 1 & 2 have an entirely different set of effects from the other. Each version features 7 unique and meticulously designed DSP effects. Note that copper oxidizes over time. The copper will tarnish and eventually turn green. Please keep this in mind before ordering the copper version. The Gold version will not tarnish. CONTROL

  - Controls for Mix, X, Y and Sift as well as clock. - All effects have a variation of a filter which may change effect to effect. - X and Y control various rates, feedback and time over the different effects (note that some of the images shows a prototype which says "rate" under two of the pots. The faceplate has been changed to X and Y). - Clock control adjusts the rate which controls the DSP which can drastically change the effect. In doing so it does slightly lower the quality of the output signal but the results are fantastic. This clock is not for synchronization. - Mix, X, Y and Sift all have CV control inputs. - Each control level or CV input is visualized on the control panel. INS AND OUTS

  - Stereo inputs with separate level/gain control for right and left channels. These levels can also act as mute as it can take the signal to 0. They can also add gain to a quiet signal. - Peak level indicator for clipping levels at the input
  - Mono input is made stereo within the DSP and outputs to both left and right channels
  - Stereo outputs for right and left channels

  EFFECTS

  The effect is selected by the hexagonal touch pad. The effects for Alter 1 are as follows:
  1 - long delay
  2 - notated granular delay
  3 - plate reverb
  4 - shimmering reverb
  5 - distortion multi-filter
  6 - pitch delay
  7 - stutter glitch

  SPECS

  includes printed manual
  +12V: 160mA
  -12V: 0mA
  +5V: 0mA
  16HP width
  25 mm Depth
  View on Modular Grid: https://www.modulargrid.net/e/folktek-alter-1

  SHIPPING, FULFILLMENT & DELIVERY

  We are a small company and strive to fulfill orders as quickly as possible. During busy times, please allow up to several business days for order fulfillment. International Shipments (delivery address outside the U.S.) may be subject to import duties, value added taxes (VAT), and long customs clearance times. Tariff rates vary from country to country. Folktek does not collect VAT on behalf of the customer. Folktek is not responsible for payment of import taxes. Please check with your local customs agency for rates and more information. **Note: There may be very tiny scratches or blemishes on the faceplates from the manufacturing process. Unfortunately, these scratches are unavoidable.
