description: Compact 2-channel Hi-End AD/DA converter offering first-class AD/DA
  conversion from/to SPDIF, AES and ADAT at up to 192 kHz. Combines SteadyClock
  FS clocking, High Power headphone output, and analog/digital format conversion
  modes in a half-rack 9.5" chassis.
details: |-
  The RME ADI-2 FS is a compact and extremely flexible 2-channel Hi-End AD/DA converter housed in a half-rack 9.5" chassis. It offers first-class AD/DA conversion to and from SPDIF, AES, and ADAT at up to 192 kHz, and its ability to handle all three digital formats provides outstanding compatibility with virtually any digital audio setup.

  Balanced analog inputs and outputs, monitoring via headphone output, SteadyClock FS for optimal conversion quality, 3-stage hardware input and output level control, and additional D-D and A-A operating modes turn the ADI-2 FS into a universal tool and a flexible problem solver. Its pro-class sound also qualifies it as an extension for other premium converters. Two servo-balanced analog line inputs are provided via XLR/TRS combo jacks, with simultaneously usable balanced XLR and unbalanced TRS outputs, an adjustable High Power headphone output on the front, an ADAT-compatible optical SPDIF I/O, and a coaxial SPDIF I/O (RCA, AES/EBU compatible).

  The analog inputs use the advanced circuit design of the highly acclaimed ADI-2 Pro, offering outstandingly low noise and distortion as well as extended frequency response. Three different settings for input and output levels (+4 dBu, +13 dBu, +19 dBu @ 0 dBFS) provide perfect compatibility in the analog domain. SteadyClock FS, RME's latest clock technology, delivers maximum jitter suppression and lowest self-jitter. The ADI-2 FS also uses the conversion technology of the ADI-2 Pro - the AK557x family and the AK4490 - offering 192 kHz sampling, lowest distortion, and a 120 dBA dynamic range.

  Beyond conversion, the ADI-2 FS offers unexpected versatility in format conversion. In DIG mode it operates as a digital format converter with simultaneous monitoring, supporting conversion between SPDIF coaxial (or AES) with Professional or Consumer status, and ADAT. The ANA output mode connects the analog output circuitry directly to the analog input circuitry while the AD converter continues to feed SPDIF and ADAT outputs, allowing the unit to function as an analog preamp (line level only) supporting levels up to +22 dBu and as a balanced-to-unbalanced converter.

  The High Power² headphone output is a down-scaled version of the ADI-2 Pro's Extreme Power stage, with up to 0.7 watts per channel, 0.1 ohm output impedance, a maximum output level of +19 dBu, and very low THD (-110 dB). Power is supplied via an included external switching PSU with lockable connector and a wide 9-15 V operating range, allowing battery or rechargeable battery operation for mobile use or galvanic isolation in measurement applications. The clear front-panel layout with status display, 6-LED level meter, and dedicated buttons makes the unit easy to operate out of the box.
specs: |-
  - AD SNR @ +19 dBu: 117 dB RMS unweighted, 121 dBA
  - AD Frequency Response @ 192 kHz: 2 Hz - 92.7 kHz (-1 dB)
  - AD THD @ -1 dBFS: -114 dB, 0.00015 %
  - AD THD+N @ -1 dBFS: -112 dB, 0.00025 %
  - AD Channel Separation: > 110 dB
  - AD Max Input Level: +19 dBu
  - AD Input: XLR or 1/4" TRS, electronically balanced
  - AD Input Impedance: Balanced 36 kOhm, unbalanced 18 kOhm
  - AD Input Sensitivity (switchable): +4 dBu, +13 dBu, +19 dBu @ 0 dBFS
  - DA SNR: 117 dB RMS unweighted, 120 dBA
  - DA Frequency Response @ 192 kHz: 3 Hz - 88 kHz (-1 dB)
  - DA THD @ -1 dBFS: -112 dB, 0.00025 %
  - DA THD+N @ -1 dBFS: -110 dB, 0.00032 %
  - DA Max Output Level: +19 dBu
  - DA Output: XLR balanced, 1/4" TRS unbalanced/balanced
  - DA Output Impedance: XLR balanced 150 Ohm, TS unbalanced 100 Ohm
  - DA Output Level (switchable): +4 dBu, +13 dBu, +19 dBu @ 0 dBFS
  - Phones Output: 6.3 mm stereo TRS, unbalanced
  - Phones Output Impedance: 0.1 Ohm
  - Phones Max Output @ 100 Ohm: +19 dBu (6.9 Vrms) @ 0 dBFS
  - Phones Max Power @ 32 Ohm: 0.7 W per channel
  - Mode ANA SNR @ +19 dBu: 123 dB RMS unweighted, 126 dBA
  - Mode ANA Frequency Response: 1 Hz - 120 kHz (-0.5 dB)
  - Mode ANA Max Input/Output: +22 dBu
  - Clocks: Internal, ADAT In, SPDIF In
  - Jitter Suppression: > 50 dB (2.4 kHz)
  - Internal Sample Rates: 32, 44.1, 48, 64, 88.2, 96, 176.4, 192 kHz
  - External Clock Range (SPDIF): 28 kHz - 200 kHz
  - External Clock Range (ADAT): 40 kHz - 49 kHz
  - Digital I/O Formats: Optical TOSLINK, RCA SPDIF (AES/EBU compatible)
  - ADAT: TOSLINK; 8ch @ 48 kHz, 4ch @ 96 kHz (S/MUX), 2ch @ 192 kHz (S/MUX4)
  - Power Supply: External switching PSU, 100-240 V AC, 24 W
  - Operating Voltage: 9 - 15 V DC
  - Idle Power Consumption: 5.2 W (430 mA @ 12 V)
  - Max Power Consumption: 10 W (830 mA @ 12 V)
  - Dimensions (WxHxD): 215 x 44 x 130 mm (8.5" x 1.73" x 5.1")
  - Weight: 900 g (2.0 lbs)
  - Temperature Range: +5 to +50 °C (41 to 122 °F)
