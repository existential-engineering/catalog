description: A stereo, fully analog multi-stage phaser pedal offering one to six
  stages of phase shifting, from classic swirls to ring-modulated frequency
  shifts and rotary-style warbles.
details: |-
  A Mesmerizing Array of Phasers The Moonbeam Phaser has landed. A stereo, multi-stage phaser like no other, the Moonbeam Phaser lets you completely reshape your sound by choosing between one and six stages of phase shifting for any modulation occasion. With its expansive range of controls, you can instantly explore everything from classic swirling movements to ultra-gooey bends, resonant filtered tremolos, and textures yet to be discovered. Take a trip through the world of tones from beyond the exosphere. Need some stereo cables? --> Details At its core, the Moonbeam Phaser houses two fully analog 6-stage phase shifter engines. You can tap into each stage individually and hear its unique movement as the display morphs through a spectrum of colors that mirror the sound. To unleash the full potential of this unique circuit, we supercharged the FREQ control far beyond the usual range. Drift slowly through 2-minute phase sweeps, dive into liquid swirls, or blast off into ring-modulated frequency shifts. Combined with the DEPTH control, the Moonbeam Phaser opens a vast spectrum of refracted phasing tones- from shimmering rotary-style warbles to deep, resonant bends. And if one phaser wasn’t enough, we’ve packed two phasers in one, letting you bring your guitar, bass, synth, or anything you can imagine into mesmerizing stereo with the click of a stomp. Part of Death By Audio’s Destroyer Series, the Moonbeam Phaser sports the line’s signature look: a compact footprint, glowing vintage-style LED display, and minimal controls that conceal a world of sonic madness. Each Destroyer pedal delivers a distinct, over-the-top effect in a smaller, stage-friendly box - together forming a family of beautifully chaotic tone machines in stereo. Key Features: Six Phasers In One - Each of the six phase stages has its own unique sound, from classic modulation to wild, otherworldly bends. Fully Analog Phaser - Real analog circuitry delivering extreme, organic modulation in a digital world. Full Stereo Modulation - True stereo operation expands your sound from mono to massive. Ultra-High Headroom - Handles the hottest signals without breaking up or losing depth. Super-Slow Phasing - Over two minutes of evolving, slow-motion phase sweeps. Hyper Speed To Ring Modulation - Crank the FREQ knob for blistering, ring-modulated chaos. Adjustable Depth - Unlike the phasers of yore, we leave the control in your hands so you can dial in anything from subtle shimmer to full-on resonance. Moving Light Indicator - Color-coded display shows the active stage and follows the LFO. Pedalboard-Friendly - A bite-sized package with a massive sound. Tour-Grade Build Quality - Rugged enclosure, quality components, hand-assembled, and built to last. Controls PHASE SELECTOR Selects the number of phaser stages. Ranges from one to six. 1 (RED) A sweeping high pass filter and tremolo. 2 (YELLOW) A sweeping notch filter with resonant peaks on each side. 3 (GREEN) A cross between a phaser and a harmonic tremolo. 4 (CYAN) The most famous, classic phaser sound you know and love. 5 (BLUE) Adds in more intense resonance and treble focus to the 4-phase sound. 6 (PURPLE) A full, bassy, and chewy-sounding phaser sound. FREQ Adjusts the speed of the phaser’s movement. Ranges from ultra-slow 0.006Hz harmonic drifts to lightning-fast 130Hz sweeps. DEPTH Controls the intensity and character of the phaser stages, shaping the depth of the sweep and the resonance of the effect. Internal Control Access this control by removing the backplate of the Moonbeam Phaser. INPUT CONFIGURATION SWITCH Switch between mono TS and stereo TRS input. MONO INPUT - Standard mono or mono-to-stereo operation. Lights up “M” on the faceplate when active. STEREO INPUT: Full stereo operation. Lights up “S” on the faceplate when active. Inputs and Outputs The Moonbeam Phaser features TRS stereo input and output for mono or stereo operation. Mono Use a TS cable for both INPUT and OUTPUT. Mono to Stereo Use a TS cable for INPUT and a TRS cable for OUTPUT. Note: Set internal switch to Mono Input. Stereo Use a TRS cable for both INPUT and OUTPUT. Note: Set internal switch to Stereo Input. Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel. We recommend Death By Audio’s RAW POWER power supply for optimal performance. Current Draw: 72 mA Physical Details Dimensions: 5.16" x 2.76" x 2.38" (including hardware) Weight: 10.3 oz. Sound Samples Guitar Warbly Stereo Blues Ramping Doom (with Fuzz War) Ramping Riff (with Germanium Filter) Stereo Ring Mod Stereo Leslie Stereo Bassy Modulation Synth Nasty Tremolo Warm Wobbles Bubbling Modulation Undulating Lead Formant Arpeggio Big Rotary Pad Bass Crazy Tremolo (with Bass War) Funky Riff Slow Ramp (with Bass War) Destroyer Series Trio ( Thee Treble Overload , Moonbeam Phaser , and Dream Station ) Psych Country Punk Riff Digital Manual
