details: |-
  The Majesty Premium Select represents the highest level of tone, precision, and versatility. The John Petrucci signature model is handcrafted in San Luis Obispo, California, available in 6-string, 7-string, and 8-string configurations.

  Built with a Honduran mahogany neck-through design with alder wings and a thick maple top, the Majesty Premium Select features an ebony fingerboard with Atlanté Majesty inlays, 24 medium-jumbo stainless steel frets, and a 25-1/2" scale length.

  Electronics include a DiMarzio Rainmaker neck pickup, a DiMarzio Dreamcatcher bridge pickup, and Fishman Powerbridge piezo saddles, paired with a custom Music Man active preamp featuring a 20+ dB gain boost.

  A custom floating tremolo bridge with piezo saddles, Schaller M6-IND locking tuners, and high-gloss polyester finishes (Carnelian Red, Ka'anapali Dream, Mystic Dream, Purple Nebula II, Strawberry Moon) round out the hardware.
specs: |-
  - Body wood: Honduran mahogany neck-through; alder wings; thick maple top
  - Body finish: High gloss polyester
  - Body dimensions: 12" wide, 1-3/4" thick, 37" long
  - Available finishes: Carnelian Red, Ka'anapali Dream, Mystic Dream, Purple Nebula II, Strawberry Moon
  - Neck wood: Honduran mahogany
  - Neck radius: 17"
  - Neck width: 1-11/16" at nut, 2-1/4" at last fret
  - Fingerboard: Ebony with Atlanté Majesty inlays
  - Frets: 24 medium-jumbo stainless steel
  - Scale length: 25-1/2"
  - Neck pickup: DiMarzio Rainmaker
  - Bridge pickup: DiMarzio Dreamcatcher
  - Piezo: Fishman Powerbridge saddles
  - Bridge: Custom floating tremolo with piezo saddles
  - Electronics: Custom Music Man active preamp with 20+ dB gain boost
  - Tuning machines: Schaller M6-IND locking
  - String configurations: 6-, 7-, and 8-string
  - Made in: San Luis Obispo, California
