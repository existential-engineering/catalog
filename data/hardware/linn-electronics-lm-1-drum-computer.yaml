description: >-
  The Linn LM-1 Drum Computer is the pioneering digital drum machine that launched the sample-based
  rhythm revolution, using recorded acoustic drum sounds instead of analog synthesis.
details: |-
  Created by guitarist Roger Linn and released in 1980, the LM-1 Drum Computer fundamentally changed the course of music production. It was the first commercially available drum machine to use digitally recorded samples of real acoustic drums, offering a dramatically more realistic alternative to the analog drum sounds that dominated the era. Only approximately 500 units were built before the LinnDrum succeeded it in 1982.

  The LM-1 contained twelve 28 kHz samples including snare, kick, three toms, open and closed hi-hats, tambourine, congas, handclaps, cowbell, and rimshot. Notably absent were ride and crash cymbals. Patterns could be created in both real-time and step-time modes, and the machine stored 100 memory patches across 8 songs.

  Among the LM-1's most influential innovations were its swing and quantize functions, which allowed programmers to inject rhythmic feel into patterns rather than locking everything to a rigid grid. These features became standard on virtually every drum machine and sequencer that followed.

  The LM-1's impact on popular music was enormous and immediate. Its distinctive sound defined the sonic landscape of early 1980s pop, new wave, and electronic music. Users included Phil Collins, Prince, Depeche Mode, The Human League, Stevie Wonder, Gary Numan, Jean-Michel Jarre, Vangelis, John Carpenter, Todd Rundgren, Thompson Twins, and The Art of Noise.
specs: |-
