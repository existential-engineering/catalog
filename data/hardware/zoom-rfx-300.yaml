description: The RFX-300 is a sophisticated multi-effect processor.
details: |-
  A total of 22 high-quality preset effects using a sampling frequency of 44.1 kHz and 18-bit A/D and D/A converters are built in. This includes reverb effects such as Hall, Room, Plate and Ambience, delay and modulation type effects, combination effects and mixdown effects for changing the overall mood of a song. The unit is designed to be especially useful for recording and mixdown on a multi-track recorder.

  The main parameters of preset effects can be adjusted directly with knobs on the top panel, which allows quick fine-tuning for optimum sound.

  Tap input lets you set time-based parameters simply by tapping a key in the desired interval, so the delay time or modulation rate can be matched to the tempo of a song.

  The inputs and outputs of the RFX-300 accommodate both standard phone plugs and RCA type phono plugs, so electronic instruments, multi-track recorders and various audio components can be connected. The phone jack input is equipped with a gain switch, allowing connection of microphones as well, so the RFX-300 can be used as a portable vocal effect device or as a microphone preamp for recording.

  The dual power supply design allows the unit to be powered from an AC adapter or six IEC R6 (size AA) batteries, which is convenient when using the unit on stage.
specs: |-
  - Number of effect programs: 11 x 2 banks, 22 effects total
  - Sampling frequency: 44.1 kHz
  - Analog/digital conversion: 18 bit, 64 times oversampling
  - Digital/analog conversion: 18 bit, 8 times oversampling
  - DSP: ZOOM original ZFx-2
  - Phone inputs L/MONO and R: standard monaural phone jacks, input impedance 22 kilohms, rated input level -10 dBm (line) or -56 dBm (mic)
  - Phono inputs L and R: RCA type phono jacks, input impedance 22 kilohms, rated input level -10 dBm
  - LINE/MIC switch selects the gain for the phone inputs, so a microphone can be connected directly
  - The phone jack inputs and the RCA phono inputs cannot be used at the same time
  - Outputs: L and R standard monaural phone jacks plus L and R RCA type phono jacks, output load impedance 100 ohms or more, maximum output +6 dBm
  - Power requirements: supplied AD-0006 AC adapter, 9 V DC centre negative, or six IEC R6 (size AA) batteries
  - Battery life: approximately 10 hours with alkaline batteries
  - Dimensions: 168 (W) x 170 (D) x 59 (H) mm
  - Weight: 550 g
  - Effect banks A and B, selected with the BANK keys and the EFFECT selector
  - VARIATION/TAP key gives two variations per effect and tap input of time-based parameters
