description: >-
  The Audity 2000 is a 1U rack-mount digital synthesizer from E-MU Systems featuring
  64-voice polyphony, a 32MB sound ROM, and 16 simultaneous arpeggiators. Designed for
  electronic groove music production, it utilizes a Modular PatchCord architecture for
  deep sound-sculpting and a 12-pole digital resonant filter for tonal shaping.
details: |-
  The Audity 2000 takes its name from the classic E-MU Audity synthesizer but shares more in common with the Proteus line, utilizing the same synthesis architecture. Originally released in 1998 with version 1.0 software, the instrument underwent subsequent upgrades including version 2.0, eventually influencing the development of the Xtreme Lead-1.

  As a digital synthesizer, the Audity 2000 emphasizes electronic music production with a focus on dance and trance sounds. The 12-pole digital resonant filter provides sound shaping capabilities, while the Modular PatchCord architecture enables extreme sound-sculpting possibilities through a flexible patch-based editing system.

  The instrument's 16-channel rhythmic pattern generator and arpeggiator is a standout feature, offering one arpeggiator per MIDI channel with MIDI synchronization capability. This makes it particularly well-suited for trance and techno production. Notable artists including ATB and The Crystal Method have utilized the Audity 2000 in their work.
specs: |-
  - Polyphony: 64 voices
  - Sound ROM: 32MB
  - Presets: 640 ROM, 256 user (4 layers per preset)
  - Filter: 12-pole digital resonant and modeling
  - Effects: 2 processors (reverbs, delay, chorus, phasers)
  - Arpeggiator: 16-channel rhythmic pattern generator with MIDI sync
  - Audio Outputs: 6 analog outputs, S/PDIF digital output
  - MIDI: 16-part multitimbral
  - Form Factor: 1U rack-mount
releaseDate: "1998"
