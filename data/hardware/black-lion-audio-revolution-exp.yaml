description: 8x8 AD/DA Converter and Word Clock with ADAT
details: |-
  Expand your studio connectivity by adding more inputs and outputs to your ADAT-compatible interface with the Revolution EXP. You get 16 analog TRS connections (8-in, 8-out), as well as 16 channels of ADAT I/O. Boutique component selection and proprietary Macro MMC clocking ensure that the Revolution EXP makes every device you connect to it sound its absolute best.

  The Revolution EXP features eight-stage metering on all inputs and outputs, giving you a clear view of signal levels. An optional -10dB pad is available on all analog inputs to accommodate a wide range of sources. The unit is rack-mountable and built with premium Nichicon, Vishay, and Wima components throughout.

  Macro MMC clocking technology, developed from Black Lion Audio's acclaimed word clock products, ensures that the Revolution EXP delivers world-class AD/DA conversion with the lowest possible jitter. The EXP connects to your existing ADAT-equipped interface to expand its analog I/O without compromising audio quality.
specs: |-
  - 8 analog TRS inputs, 8 analog TRS outputs
  - 16 channels ADAT I/O (2x ADAT in, 2x ADAT out at 44.1/48kHz)
  - Macro MMC clocking technology
  - Line Input — Input Impedance: 19.906kΩ, Maximum Input Level: 15.9dBu, THD+N: 0.00143%, Dynamic Range: 112.837dB
  - Line Output — Output Impedance: 200Ω, Max Output Level: 16dBu, THD+N: 0.00077%, Dynamic Range: 110.175dB
  - -10dB pad available on all analog inputs
  - Eight-stage metering on all inputs and outputs
  - Up to 192kHz sample rate
  - USB-C port for firmware updates
  - 1U rack-mount form factor
  - Premium Nichicon, Vishay, Wima capacitors
