description: An overdrive pedal using Mosfets as hard-clipping devices tied to
  voltage reference rather than ground, featuring a Class-A JFET input and
  switchable Enhanced Bypass or True-Bypass output buffering.
details: |-
  Fulltone OCD V2 The OCD has received many slight tweaks since its birth in 2004, often incorrectly identified as "version 2, Version 3, Version 4." In reality there has always been only one version…Version 1, with very slight variations in a couple of values after that making them V1.0 through V1.8. All OCDs serial 205811 and higher are the new, less compressed versions some refer to as "v2.01"

  What's stayed the same
  The OCD was the first pedal to use Mosfets as clipping devices. Another first was their configuration as "hard clippers connected to v-ref" instead of to ground, as was the norm. These things contribute greatly as to why the OCD has such touch-sensitivity...why they react so well when the strings are hit hard or soft, and why they sound & feel different than all other pedals out there, 90% of which are just slight tweaks of the Tube Screamer. NEW FEATURE output buffer (when pedal is turned on in True-Bypass mode, or always when in Enhanced Bypass mode) which eliminates it from being influenced by effects that came after it. Translation, your sound remains consistent regardless of placement in today's more complex signal-chains, loopers, and pedalboards. This buffer also had a positive effect on the sound, it reduced loading on the pedal's hard-clipping stage, allowing more sustain of both the sound and the overtones. NEW FEATURE Class A configured discrete 2N5457 JFET input section , raising the input impedance to 1 mega ohms (previously 330K) and increasing the dynamics…resulting in significantly better interaction with both single coil and humbuckers. NEW FEATURE Internal switch to choose between " Enhanced Bypass TM" & True-Bypass, and with no popping sound in either mode. No other company offers EB…I invented it. A downside to True-Bypass:
  True-Bypass (TB) switching was the ultimate way to achieve a clean signal path for many years. Everything's different now, most guitarists have elaborate pedalboards with 10 or more pedals being the norm, and tremendous potential for signal and tone loss with the many cables, connectors, and other pedals involved in the chain. There can be so much signal loss that it sounds nothing like the sound of a guitar with a cable straight into the front of a great tube amp. Uninspiring. What's the pedal industries' solution to this problem for the last 40 years? Unity-gain buffered bypass…i.e. a couple of Field effect Transistors (FETs) configured as unity-gain buffers ala Boss, Ibanez, etc, etc. What's the benefit to unity-gain FET buffered bypass? It reduces the loading effect that occurs using long lengths of cable, and you remove the loud "popping" sound when switching the device on and off. What's the issue with unity-gain FET buffered bypass? Although my ears always told me that it sounded "tinny" and that there was signal loss, with the help of a my favorite Electronic Engineer (using some very expensive test equipment) we recently documented that each unity-gain FET buffer actually cuts the gain somewhere between 0.3 to 0.6 dB . This loss of gain is in the low-Mids and Bass frequencies, resulting in that "tinny" sound now that the highs remained and some of the bass and mids are gone. Now factor in that there are two FETs per pedal required to couple the IN & OUT path, that's an obvious loss of between 1dB-2dB per pedal. What's an even bigger issue with this old style unity-gain FET bypass? It kills dynamic pick response , i.e. it kills the difference between picking soft and picking hard…Yes, when the pedal is in bypass! This to me is a deal-breaker, and while I've always felt this to be the case, it's great to be able to actually see it on the scope. What's the solution? Enhanced Bypass ! Configuring both of the switching FET's Class-A! By configuring a FET for gain (also referred to as wiring it "Class-A") all the dynamics return (and then some), even if you only configure it with the slightest amount of gain, in this case: 0.3 to .06 dB. People rave about old EP-3 Echoplexes and Ep-3 type boosters, and although they know that they love what it does to the guitar's sound, they can't explain why. It's because of the Class-A FET preamp! With a Class A FET the dynamics get amplified, allowing an even greater range of expression than if you were playing through a guitar and just one cable straight into your amp. The downside with EP-3 preamps is that they throw the signal OUT-of-phase, boost treble, and cut bass. Fulltone's EB the signal exits the pedal IN-phase and doesn't change the EQ at all. With OCD V2's Enhanced Bypass you get this benefit whether the pedal is turned ON or OFF. This means that just having the OCD turned off in your signal chain makes the whole rig sound alive, fresh, and more powerful again. Night & Day difference? You be the judge. Again I strongly suggest you try one at your favorite dealer, and then let me know what you think. They are at dealers now.
