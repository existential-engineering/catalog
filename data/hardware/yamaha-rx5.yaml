description: >-
  The Yamaha RX5 is a flagship digital drum machine released in 1986, offering
  24 built-in 12-bit PCM drum sounds with extensive sound customization
  including envelope controls, pitch bending, and accent functions. It features
  a powerful sequencer with 100 patterns and flexible time signatures, 12
  individual outputs plus stereo, and can be expanded with ROM and RAM
  cartridges for additional sounds and custom programming.
details: |-
  The RX5 was Yamaha's premier drum machine offering in 1986, though it has been somewhat overshadowed by competing models like the Roland R-8 and the resurgence of classic analog drum machines. The device distinguishes itself through several advanced sound manipulation tools not commonly found on competing equipment of that era.

  The instrument includes unique envelope capabilities with attack and decay controls for each sound, plus dual accent levels that allow performers to modify sound character substantially. A pitch envelope feature enables any sound to bend upward or downward across multiple octaves using Bend Amount and Bend Rate parameters. Additionally, reverse and damp functions permit within-pattern switching between reversed cymbals and normal hits, or simulate natural dampening effects on drums and cymbals.

  The sequencer supports 100 patterns with flexible time signatures ranging from 01/32 to 99/2, recordable in either real-time or step-time modes. Users can arrange patterns into up to 30 songs and chain songs together for complete performances. The machine features 12 individual outputs plus stereo output, full MIDI implementation, and supports external RAM cartridge or cassette storage for sequence and voice data.

  Yamaha shipped the RX5 with one supplementary cartridge and released three additional genre-focused cartridge options: WRC-02 Jazz/Fusion, WRC-03 Heavy Metal, and WRC-04 Effects, plus rare third-party cartridges containing classic TR-808 and TR-909 samples.
specs: |-
  - 16-voice polyphony
  - 24 internal 12-bit PCM samples
  - 28 additional sounds via ROM; 12 voices via RAM
  - Real-time and step-time sequencer
  - 100 patterns (up to 99 measures each)
  - 20 songs (up to 999 patterns per song)
  - Time signatures from 01/32 to 99/2
  - Quantization from 1/2 to 1/48 note resolution
  - 24 pads
  - Attack/Decay envelope per sound
  - Reverse, damp, pitch bend, and dual accent levels
  - 12 individual outputs plus stereo
  - RAM4 cartridge support for sequence and voice storage
  - MIDI In/Out/Thru
  - Clock In/Out
