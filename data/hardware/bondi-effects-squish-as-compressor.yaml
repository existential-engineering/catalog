description: The Squish As is a compressor pedal built around a Blackmer VCA and
  True RMS Detector, offering natural, high-fidelity dynamics processing with
  program-dependent attack, adjustable ratio, blend, output gain, and tone
  controls. It includes a gain reduction VU meter for visual feedback.
details: |-
  The Squish As is the compressor you can rely on to preserve all of the richness of your tone while bringing out nuance you might never have noticed before. At its core, the Squish As features a best-in-class Blackmer Voltage Controlled Amplifier (VCA) and True RMS Detector. Optical and JFET compressors are popular for their musical character; however, this character often comes with increased distortion, limited dynamic range, and a somewhat unpredictable transfer function. The high-end VCA and True RMS Detector deliver natural, high-fidelity dynamics processing. Use it to make notes sound more consistent, tame peaks, and boost subtleties; or add depth to your tone with parallel compression by setting the Ratio high and rolling back the Blend control. The Squish As is the perfect always-on compressor. Full audio frequency bandwidth and a Sensitivity range of -6.3dBu to -46.3dBu make the Squish As suitable for a variety of input signals including bass guitar , high output pedals (up to +12dBu), and synthesiser. The -96dBu noise floor is low enough that the Squish As can be used anywhere in the chain . The variable Ratio from 1:1 (no-compression) to ∞:1 (limiting) can take you from transparent smoothness to brick-wall limiting. Up to 20dB of makeup gain on the Output control and a tilt-style Tone control will ensure that nothing is lost along the way. The LEDs are not just for pretty colours. I've found that to understand what a compressor is actually doing, the most helpful thing is visual feedback. That's why I have added a gain reduction VU meter to the Squish As. The VU meter indicates the amount of gain reduction in decibels that is happening at any time. Squish As is the compressor you can actually understand . The Squish As Compressor's Attack rate is programme-dependent, meaning that the Attack is automatically set to a very musical rate based on the player's input. Put simply, the harder you play, the faster the attack . The mathematics behind this are fair