description: Packed with cutting-edge technology, the Mackie DRM215 is a 15-inch professional powered loudspeaker with 1600W of Class-D power and incredible sound for both mobile and permanent install.
details: |-
  The DRM215 represents decades of innovation in acoustic, DSP, and amplifier design. Combining extensive tuning, premium components, and cutting-edge DSP, the DRM215 delivers sound over a wide coverage area for both mobile and permanent install applications.

  Advanced Impulse™ DSP is not typical speaker processing. It removes the anomalies that loudspeakers and horns contribute to a signal, from “honkiness” or “squelch” to “mushy” low end, effectively making the drivers “invisible”. By more intelligently (and more thoroughly) employing the benefits of FIR filtering, it eliminates undesired acoustic anomalies across the entire dispersion zone (horizontal and vertical), as well as frequency range and time domain.

  This is accomplished by measuring the negative frequency response and time domain impacts that each transducer and horn in the system introduces, on axis as well as off, and reversing and correcting for those anomalies before the signal hits the speaker. The result is output that is fully corrected for flat, clear, time-aligned, and smooth sound throughout the entire time, space, and response domains.

  The DRM Control Dashboard™ starts with a big, bright, full-color display that is easy to read and offers visual feedback on levels, adjustments, and more. The default window keeps every critical setting visible at a glance, and big green level meters show clearly when there is signal and when it is clipping. A single knob handles all control: spin to select, push in, set it.
specs: |-
  - High-efficiency 1600W peak Class-D amplifier (LF 1220W peak, HF 380W peak)
  - 15" / 381 mm high-excursion woofer with ferrite magnet
  - 1.4" / 36 mm titanium dome compression driver
  - Frequency range (-10 dB): 43 Hz - 20 kHz
  - Frequency range (-3 dB): 47 Hz - 20 kHz
  - Maximum SPL peak: 135 dB
  - Horizontal coverage 90 degrees, vertical coverage 60 degrees
  - Electronic crossover: 24 dB/octave at 1.5 kHz
  - Advanced Impulse DSP module with FIR filtering, precision crossovers and transducer time-alignment
  - DRM Control Dashboard with full-color display and single-knob control
  - Voicing modes: Live, Monitor, Club and Speech plus independent Sub option with variable crossover (40 Hz - 160 Hz)
  - Adjustable 3-band parametric EQ (+/-12 dB low, mid and high)
  - Alignment delay 0 - 100 ms for delay stacks
  - Save and recall up to 6 user presets, system lock with 4-digit passcode
  - Dual independent inputs supporting mic, line and instrument signals plus dedicated 1/8" stereo aux input
  - XLR Direct Out per channel plus Mix Out
  - Universal power supply 100-240 VAC, 50-60 Hz, 110W with Power Factor Correction
  - Peak and RMS limiting, power supply and amplifier thermal protection
  - 15 mm plywood cabinet with black polyurea finish and powder-coated 16-18 gauge perforated steel grille
  - Asymmetrical cabinet with 50 degree monitor angle and dual angle pole-mount
  - Flyable: 8x M10 flypoints, vertical orientation only
  - Weight: 57.3 lb / 26.0 kg
