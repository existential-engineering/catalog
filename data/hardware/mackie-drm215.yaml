description: 15" 1600W Professional Powered Loudspeaker. The superior
  amplification and powerful proprietary acoustic processing of the Mackie
  DRM215 15-inch powered loudspeaker make it a highly efficient solution for
  venues and houses of worship that demand uncompromised performance.
details: |-
  The superior amplification and powerful proprietary acoustic processing of the Mackie DRM215 15-inch powered loudspeaker make it a highly efficient solution for venues and houses of worship that demand uncompromised performance.

  The DRM215 represents decades of innovation in acoustic, DSP, and amplifier design. Combining extensive tuning, premium components, and cutting-edge DSP, DRM215 delivers breathtaking sound over a wide coverage area for both mobile and permanent install applications.

  The DRM Series is available in multiple point source configurations, line array, plus companion powered subwoofer.
specs: |-
  - 1600W Class-D amplifier
  - 15" high-excursion woofer
  - 1.4" titanium diaphragm compression driver
  - Frequency response: 43 Hz - 20 kHz
  - Max SPL: 135 dB
  - Weight: 57.3 lb / 26.0 kg
  - Universal power supply (100-240 VAC) with Power Factor Correction
  - 15mm plywood construction
  - 8 x M10 flypoints (flyable configuration)
  - 3-band parametric EQ
  - Variable crossover
  - Alignment delay
  - Save/recall up to 6 user presets
