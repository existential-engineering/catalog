description: An ideal instrument for dazzling high-speed playing, the Pro-Mod
  San Dimas Style 1 HH FR E delivers scorching sound, stunning style and
  grin-inducing playing feel and performance. Part of the Pro-Mod series, it
  emphasizes innovative excellence in high-performance guitar design.
details: |-
  The Pro-Mod San Dimas Style 1 HH FR E pairs an alder San Dimas Style 1 solid body with a gloss finish. The bolt-on maple neck features graphite reinforcement (dual rods), a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. An ebony fingerboard with a 12"-16" compound radius hosts 22 jumbo frets with white dot inlays, anchored by a Floyd Rose 1000 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics center on a Seymour Duncan JB TB-4 humbucker in the bridge position and a Seymour Duncan '59 SH-1N humbucker in the neck position, both direct-mounted to the body. Controls include a push/pull volume knob for coil splitting, a no-load tone control, and a 3-position blade switch with coil-split functionality.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo with a locking tremolo arm, Charvel-branded die-cast tuning machines, a Floyd Rose retainer bar string tree, knurled flat-top control knobs, and a black switch tip in a black hardware finish. The licensed Fender Stratocaster headstock, 4-bolt serialized neck plate, and heel-mount truss rod adjustment wheel round out the build.
