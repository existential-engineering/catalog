url: https://www.tchelicon.com/en/products/0726-aaa
description: Two-button looper pedal for vocals and acoustic instruments, with
  one footswitch covering record, overdub, play and stop and a single knob for
  loop level. It provides up to five minutes of mono loop time with unlimited
  overdubs.
details: |-
  The Ditto Mic Looper applies the one-knob approach of the original Ditto guitar looper to the voice. A single footswitch handles record, overdub, play and stop, and one knob sets the loop level, so there are no menus, screens or hidden modes to work through on stage.

  The signal path is built around a microphone rather than an instrument. An XLR input with a mic preamp and phantom power takes a microphone directly, with no separate interface, and a dedicated mic-tone profile keeps the vocal sounding natural through repeated overdubs. A dry-through XLR output sends a clean signal to the PA at the same time as the looped signal plays.

  Loop time runs to five minutes in mono with unlimited overdubs, and true bypass leaves the dry signal untouched when the looper is off. The intended use is layering harmonies and rhythmic parts for buskers, worship singers and acoustic performers without a laptop in the setup.
specs: |-
  - Up to 5 minutes of mono loop time
  - Unlimited overdubs
  - XLR microphone input with mic preamp and phantom power
  - Dedicated mic-tone profile for the looped signal
  - Dry-through XLR output
  - Two footswitches with single-knob loop level control
  - True bypass
  - 9V DC power input
