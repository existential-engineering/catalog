description: The Duesenberg Fairytale Lapsteel Splitking Edition - The evolution continues
details: |-
  The Split/King Edition of the Fairytale Lapsteel keeps the model's Korina construction with a maple top on the headstock and a PUR lacquer finish. The instrument measures 94 x 19 x 4.2 cm (37" x 7.48" x 1.65"), with a black anodized aluminium fingerboard, a 648 mm / 25.5" scale length, 65 mm / 2.56" width at the nut and 54 mm / 2.13" string spacing.

  The edition's defining feature is a pair of Duesenberg SplitKing humbuckers. Rather than a conventional splittable humbucker, the design extends a full-size single coil into a complete humbucker with a separate, fine-tuned coil, so both a real single coil and a real humbucker voice are available at the flick of a switch. Duesenberg describes the result as four pickup sounds rather than two. Controls are one volume, one tone, a three-way pickup selector and two SplitKing mode switches, and the tone control is Duesenberg's speed pot, which works over a reduced 70 degree angle so tone swells can be made with a fingertip.

  The Duesenberg Multibender bridge system is a user-configurable string bending device for semitone and whole-tone bends up or down, worked with the heel of the hand while playing, which makes it possible to shift chords between minor and major or across other intervals. It accepts up to five individually configurable levers, with additional levers sold separately. A Duesenberg Roller Nut, Z-Tuners and nickel-finished hardware complete the instrument.

  An integrated Easy-Shift Capodaster runs on a rail inside the fretboard, so it cannot be lost or misplaced. Loosening the thumbscrew on top of the capo allows it to be placed anywhere on the fretboard and locked again, which simplifies key changes on a lap steel.

  The instrument ships with the handcrafted Duesenberg Custom Line Case as standard, along with all the allen keys required for setup.
specs: |-
  - Wood: Korina (+ Maple top on headstock)
  - Width at nut: 65 mm / 2.56"
  - Dimensions: 94 x 19 x 4.2 cm / 37" x 7.48" x 1.65"
  - Stringspacing: 54 mm / 2.13"
  - Fingerboard: Black anodized aluminum
  - Scale length: 648 mm / 25.5"
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Nut: Duesenberg Roller Nut
  - Bridge: Duesenberg Multibender
  - Plus: Duesenberg Easy Shift Capo
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 016/056 (016-018-026-036-046-056)
  - Pickup (neck): Duesenberg SplitKing Humbucker
  - Pickup (bridge): Duesenberg SplitKing Humbucker
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector, 2x SplitKing Mode Switch
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
