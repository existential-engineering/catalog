description: "Lightweight, heavy-duty tone. The SVT-7PRO is a 1,000-watt Class D
  bass amplifier head with a tube-driven preamp, switchmode power supply, and
  onboard compressor. It delivers signature fat and warm Ampeg Round Sound in a
  rack-mountable 15.5 lb chassis."
details: |-
  The Ampeg SVT line of pro-level amps is synonymous with power and durability, and with the SVT-7PRO, you can add light weight to the list. Thanks to its Class D power amp and switchmode power supply, the SVT-7PRO delivers a full kilowatt of ferocious, lightning-quick sound into a 4-ohm load at just 15.5 pounds.

  Like its stablemates in the SVT line, the SVT-7PRO offers extensive tone shaping. In addition to Ampeg's classic 5-position Midrange control, there are shelving bass and treble filters and Ultra-Hi and Ultra-Lo boost switches to beef up the extreme ends of the frequency spectrum.

  The SVT-7PRO delivers signature fat and warm Ampeg Round Sound, plus the precise transient response and clarity that a Class D power amp affords. It may not weigh much, but 1,000 watts on tap means it can drive any cabinet you desire, all the way up to the monster Heritage SVT-810E.

  Pro-level rack-mount design features a tube-driven balanced XLR output, an onboard compressor with variable ratio (1:1 to 10:1), Neutrik speakON speaker outputs, and removable rack ears for studio and live use.
specs: |-
  - 1,000 watts at 4 ohms / 600 watts at 8 ohms
  - Class D power amplifier
  - Tube-driven preamp with balanced XLR output
  - Switching (switchmode) power supply
  - Onboard compressor with variable ratio (1:1 to 10:1)
  - 5-position Midrange control with shelving bass and treble filters
  - Ultra-Hi and Ultra-Lo boost switches
  - Neutrik speakON speaker outputs
  - Stereo Aux input
  - Removable rack ears included
  - Weight: 15.5 lb (7.03 kg)
