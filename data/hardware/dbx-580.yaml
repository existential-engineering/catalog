name: "580"
manufacturer: dbx
primaryCategory: preamp
url: https://dbxpro.com/en/products/580
description: 500 Series microphone preamp delivering sonically-transparent gain
  with EQ, instrument input, and 60dB of headroom.
details: |-
  The dbx 580 Microphone Preamp delivers sonically-transparent gain to reveal the detail and audio signature of microphones. It transforms low-level microphone output signals to high-level, high-current output suitable for direct connection to line-level inputs on mixers, samplers, and recording equipment.

  With its modular 500 Series design, the 580 provides up to 60dB of gain and includes a variable-frequency Low-Cut Filter, Low and High Detail Equalization Controls, 20dB Pad, Polarity Invert, and +48V Phantom Power. Additional features include a Front Panel Instrument Input, VU Metering, and Peak Indicator.
specs: |-
  - Up to 60dB of clean gain
  - Variable-frequency Low-Cut Filter
  - Low and High Detail Equalization Controls
  - 20dB Pad
  - Polarity Invert
  - +48V Phantom Power
  - Front Panel Instrument Input (1/4" jack, 500kΩ)
  - VU Metering and Peak Indicator
  - Input: Electronically balanced/unbalanced, RF filtered, 1.7kΩ
  - Max Input Level: +15 dBu (PAD disabled), +35 dBu (PAD enabled)
  - Maximum Gain: 60dB
  - CMRR: >60 dB; typically >70 dB (20 Hz – 20 kHz)
  - Max Instrument Input Level: +21 dBu unbalanced
  - Output: Electronically balanced/unbalanced, RF filtered
  - Output Impedance: 30Ω balanced, 15Ω unbalanced
  - Max Output Level: +22dBu
  - Frequency Response: 20Hz - 20kHz, +0/-1dB
  - THD+Noise: <0.006% typical (20Hz - 20kHz)
  - Power Requirements: +/- 16V DC, 2.56 watts
  - Dimensions: 5.25" x 1.5" x 6"
  - Weight: 1.3 lbs
  - Rack Space: 1 Slot, 500 Series Compatible
