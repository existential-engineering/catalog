description: The D2H T is a Traditional Series dreadnought acoustic guitar
  voiced as a vintage-inspired tonal variation on the Collings sound, designed
  to showcase the most desirable characteristics of coveted pre-war instruments.
  Its voicing features warm, rounded highs and a present low midrange, while
  retaining quick attack and strong projection. It pairs East Indian rosewood
  back and sides with a Sitka spruce top and pre-war scalloped X-bracing for a
  full, resonant tone.
details: |-
  The D2H T is part of the Traditional Series, which brings a vintage-inspired approach to the classic Collings dreadnought. The instrument features a Sitka spruce top with a custom Traditional Series pre-war scalloped X-brace, East Indian rosewood back and sides, and a Honduran mahogany neck with an ebony fingerboard inlaid with gold mother-of-pearl long diamond and squares. The bridge is an ebony belly-style with 2 5/16" string spacing, and the nut is 1 3/4" wide on a 25 1/2" scale. Ivoroid binding with small brown herringbone purfling, a zipper backstrip, and an intricate rosette add visual distinction. Nickel Waverly tuners and a high gloss ultra-thin nitrocellulose lacquer body finish round out the appointments.
specs: |-
  - Body Style: Dreadnought
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard Inlays: Gold MOP long diamond & squares
  - Nut Width: 1 3/4"
  - Scale Length: 25 1/2"
  - Frets: Medium 18% nickel-silver
  - Bridge: Ebony belly-style, 2 5/16" spacing
  - Binding: Ivoroid with small brown herringbone purfling
  - Bracing: Custom Traditional Series pre-war scalloped X-brace
  - Tuners: Nickel Waverly
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Pickguard: Tortoise
  - Body Width: 15 5/8"
  - Body Length: 20"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/4"
