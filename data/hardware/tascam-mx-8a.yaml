id: jI_VVhLqlyKFwP_DF1Ggj
name: MX-8A
manufacturer: tascam
primaryCategory: mixer
categories:
  - rack-mount
  - digital
url: https://tascam.com/us/product/mx-8a
description: Compact 8-input/8-output matrix mixer with integrated DSP, designed
  for small to mid-scale audio installations such as stores, restaurants, and
  banquet rooms. Features 8 mic/line inputs with phantom power, 8 independent
  output zones, onboard DSP (compressor, parametric EQ, auto-leveling, ducking,
  ambient noise compensation), built-in 2-in/2-out USB audio interface, Ethernet
  and RS-232C/RS-485 control, and support for up to 50 scene presets. 1U
  rack-mountable.
details: |-
  1U rack-mount installation matrix mixer. 8 mic/line inputs with switchable +48V phantom power per channel via Euroblock (3.81mm pitch) connectors. 8 balanced line outputs for independent zone distribution via Euroblock. Built-in DSP: compressor, parametric EQ, auto-leveling, ducking, and ambient noise compensation. Up to 50 scene presets. USB 2.0 Type-B audio interface (2 in/2 out). Control via Ethernet (TCP/IP, 100BASE-TX), RS-232C (D-sub 9-pin female), and RS-485 via RJ-45 (max 200m) for up to 8 RC-W100 wall-mount controllers. TASCAM MX CONNECT (integrators) and EZ CONNECT (end-users) software. Included: power cord, 16 Euroblock plugs, cable management kit, rackmount screws.
specs: |-
  - - Inputs: 8x mic/line balanced Euroblock (3.81mm)
  - Input impedance: 2.2kΩ or more; mic range -77.5 to +26dBu; line max +24dBu; EIN -126dBu or less
  - Outputs: 8x line balanced Euroblock (3.81mm)
  - Output nominal: +4dBu; max +15 to +24dBu switchable; output impedance 200Ω or less
  - USB: 2.0 Type-B, 2 in/2 out, 44.1/48kHz, 16/24-bit, UAC2.0
  - RS-232C: D-sub 9-pin female; RS-485: RJ-45, max 200m
  - Ethernet: RJ-45, 100BASE-TX, TCP/IP
  - Frequency response: ±0.5dB (20Hz–20kHz)
  - THD+N: 0.005% or less; S/N ratio: 106dB or higher; Crosstalk: 106dB or higher
  - Power: AC 100–240V 50/60Hz, 21W
  - Dimensions: 483(W) x 45(H) x 304.1(D) mm; Weight: 3.0 kg
  - Operating temp: 0–40°C
