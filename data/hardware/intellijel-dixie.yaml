url: https://intellijel.com/shop/legacy/dixie/
description: Do not let the small size fool you, this is a very powerful full
  featured and precision VCO in a tiny package. The core is a completely new
  type of VCO design with a lot of potential.
details: |-
  Dixie is a triangle-core VCO/LFO packed into 4HP. The triangle core is described as superior for musical FM sounds. It covers a hi range (VCO) of 1Hz to 24kHz and a lo range (LFO) of 0.01Hz (100 seconds) to 240Hz, with precise tracking within 0.1% over 8 octaves.

  It offers 6 waveforms: triangle, sine, sawtooth, pulse (with PWM), square (50% duty cycle), and a unique 'zigzag' waveform. Sync is reversing, which can be made into soft sync with an external VCA or attenuator.

  A jumper on the PCB selects center- or edge-triggered PWM, and a header on the PCB allows connection of a master voice controller, e.g. for controlling multiple Dixies in a polyphonic configuration (see the companion DixieCTRL expander).
specs: |-
  - Width: 4HP
  - Max Depth: 55mm
  - Power: 50mA @+12V, 44mA @-12V
  - Range (VCO): 1Hz to 24kHz
  - Range (LFO): 0.01Hz (100 seconds) to 240Hz
  - Tracking: within 0.1% over 8 octaves
  - 6 waveforms: triangle, sine, sawtooth, pulse (PWM), square (50% duty cycle), zigzag
  - Reversing sync (soft sync possible with external VCA/attenuator)
  - PCB jumper selects center- or edge-triggered PWM
  - PCB header for master voice controller (polyphonic configuration)
