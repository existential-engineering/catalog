description: A 2-way powered reference monitor featuring the GAU-AMT tweeter,
  combining vintage near-field monitor characteristics with modern bandwidth
  capabilities — bi-amped Class D design with 120W LF and 60W HF amplification.
details: |-
  The Gauss 7 is a bi-amped, active two-way reference monitor designed to
  deliver accurate, full-range monitoring in near-field studio environments.
  Its 7-inch ferrite motor woofer uses a proprietary pressed cone made from a
  wood pulp and glass fiber blend, paired with a Japanese uni-directional
  styrene-butadiene rubber surround and a low-carbon 1008 steel motor structure
  for controlled, punchy low-end extension down to 30Hz.

  At the heart of the Gauss 7 is Avantone's custom GAU-AMT (Air Motion
  Transformer) tweeter, featuring a 65mm polyethylene terephthalate (PET) film
  folded membrane. This patented design delivers high-fidelity reproduction up
  to 22kHz with exceptional stereo imaging and a small vertical throw that
  reduces unwanted acoustic reflections in the listening environment.

  Amplification is handled by a Class D bi-amp design delivering 120W to the
  low-frequency driver and 60W to the high-frequency AMT tweeter, achieving a
  peak SPL of 103dB with THD of 0.5%. The cabinet is constructed from hybrid
  MDF with real wood veneer using a bass-reflex rear-firing port design.

  The Gauss 7 includes three onboard acoustic tuning controls: a three-position
  Acoustic Placement switch (0, -2, -4dB) for compensating wall or desk
  placement, a three-position High Trim switch (-2, 0, +2dB) for high-
  frequency voicing preference, and an individual Gain control per monitor
  offering ±6dB of adjustment.

  The Gauss 7 is sold as a stereo pair and accepts both balanced XLR and
  balanced 1/4" TRS inputs.
specs: |-
  - System Type: Active Full-Range Two-Way Stereo Pair
  - Frequency Response: 30Hz–22,000Hz
  - Cabinet: Bass Reflex, hybrid MDF with real wood veneer
  - LF Driver: 7" (178mm) Ferrite Motor
  - HF Driver: 2.5" (65mm) GAU-AMT
  - LF Amplifier Power: 120W
  - HF Amplifier Power: 60W
  - Amplifier Type: Bi-Amped Class D
  - SPL Peak: 103dB
  - THD: 0.5%
  - Inputs: Balanced TRS / XLR
  - Power: 110V–240V ~50/60Hz
  - Power Consumption Standby: <0.5W
  - Power Consumption Full Output: 250W
  - Dimensions: 381mm H × 235mm W × 212mm D (15" × 9.25" × 8.35")
  - Weight: 8.2kg / 18 lbs (each)
