details: |-
  The Tim Commerford Active StingRay Bass was developed in close collaboration with legendary bassist Tim Commerford (Rage Against the Machine, Audioslave, 7D7D). It combines Ernie Ball Music Man craftsmanship with Tim's performance-driven design preferences for a bold, balanced tone.

  Built for aggressive performance, the bass features a resonant ash body, roasted maple neck, and ebony fretboard. The active configuration is finished in Caliper Red or Natural Gloss with the option of a matching or painted headstock.

  Electronics center on a powerful neodymium humbucker, an 18-volt preamp, and a 3-band EQ (volume, treble, mid, bass) for aggressive tonal shaping with plenty of headroom.

  Custom hardware includes Tim's height-adjustable finger ramp, a black-plated strings-through-body bridge with red mute pads, custom lightweight tuners, and a 5-bolt sculpted neck joint providing full access to all 22 stainless steel frets.
specs: |-
  - Body wood: Ash
  - Body finish: Gloss polyester
  - Body dimensions: 13-1/2" wide, 1-5/8" thick, 44-7/8" long
  - Available finishes: Caliper Red, Natural Gloss
  - Headstock options: Matching or painted
  - Headstock length: 8-3/4"
  - Neck: Select roasted maple
  - Neck width: 1-11/16" at nut, 2-1/2" at last fret
  - Neck radius: 11"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Ebony
  - Fret markers: 5/16" dot inlay
  - Frets: 22 high-profile wide stainless steel
  - Scale length: 34"
  - Pickup: Single Music Man humbucking with neodymium magnets
  - Electronics: 18-volt 3-band active preamp (volume, treble, mid, bass)
  - Bridge: Black plated strings-through-body with steel saddles and adjustable mute pads
  - Tuning machines: Custom Music Man lightweight with tapered posts
  - Hardware: Black plated
  - Strings: 50w-70w-85w-105w (Regular Slinky Bass #2832)
