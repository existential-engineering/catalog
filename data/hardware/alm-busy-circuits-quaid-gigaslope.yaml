details: |-
  The QUAID GIGASLOPE is a four-channel multi-mode modulator where each channel outputs a variable staged slope that can act as a complex envelope, flexible LFO, or step sequence. Each slope can contain up to 13 stages, which may be independent or overlap with other stages.

  Slopes can be triggered or run freely, with both manual and CV control over each stage's level, duration, and curve. The output range of each slope can be set and optionally quantised to musical scales using one of 19 different scales.

  Trigger outputs are available at the end of each stage and at the completion of a slope, configurable as EOC (End of Cycle) or EOS (End of Stage) outputs. The module includes 4 freely assignable CV inputs, with support for 4 additional CV inputs via the AXON CV expander.

  The design encourages experimental use through overlapping slopes, self-modulation, and cross-channel interaction. All states are preserved across power cycles. USB-C port enables drag-and-drop firmware updates.
specs: |-
  - 52HP width, 32mm depth
  - +12V: 380mA, -12V: 30mA
  - 4 independent channels, up to 13 stages per slope
  - Selectable output ranges: ±5V, 0–5V, or 0–2.5V
  - Per-slope quantiser with 19 scales
  - 4 freely assignable CV inputs (4 more via AXON expander)
  - EOC/EOS trigger outputs per channel
  - USB-C for firmware updates
  - Reverse power protection
