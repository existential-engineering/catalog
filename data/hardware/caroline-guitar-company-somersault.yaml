description: >-
  The Somersault is a hybrid analog/digital lo-fi modulator capable of chorus,
  vibrato, and faux-rotary effects, ranging from gentle doubling and 1980s-style
  choruses to seasick wobbles and glitchy bleep-bloops.
details: |-
  The Somersault is Caroline Guitar Company's take on the chorus/vibrato/
  faux-rotary pedal, described as the device their customers had been requesting
  for years. It delivers a wide range of modulation sounds from subtle to
  experimental.

  The pedal uses a hybrid design: a digital chip handles the delayed wet signal,
  while the initial gain stage, dry signal, LFO, control set, and output mixing
  stage are entirely analog. The result is described as sounding rich and fat.

  Somersault applies a similar framework to Caroline's KILOBYTE and METEORE
  pedals. Users can dial in gentle, lagging vibrato, 1980s-style choruses,
  doubling effects, and more extreme sounds like seasick wobbles and glitchy
  bleep-bloops.

  The pedal is available in two versions: STANDARD and COLUMBIA FLAG. It has
  been one of Caroline Guitar Company's best-selling pedals in recent years.
