name: MAG C210T-300 EVO III
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
categories:
  - amplifier
url: https://ashdownmusic.com/products/mag-c210t-300-evo-iii
description: The MAG C210T-300 EVO III is a 300-watt bass combo with a pair of
  10" drivers and a high-frequency tweeter. Its feature-packed preamp offers
  rotary bass, middle and treble plus 15dB cut and boost at 220Hz and 1.6kHz,
  front-panel Bright and Deep push switches, the trademark Ashdown sub-harmonic
  generator, a built-in compressor and a tube-emulated drive control.
  Connections include active and passive instrument inputs, an effects send and
  return, a tuner/line output and a balanced DI output.
details: |-
  At the heart of the MAG C210T-300 EVO III combo is a feature-packed bass preamp with rotary bass, middle and treble controls plus supplementary rotary controls providing 15dB of cut and boost at 220Hz and 1.6kHz. Front panel push switches for Bright and Deep settings provide attacking and warm, rounded sounds respectively, and the trademark Ashdown sub-harmonic generator adds deep low-end. EVO III status adds a built-in compressor with precision sonic control plus a tube-emulated drive control. Fueled by a 300W power section, the combo delivers via a pair of 10" drivers supplemented by a high-frequency tweeter, with inputs for active and passive instruments, an effects send and return, a tuner/line output and a balanced DI output.
specs: |-
  - Power output: 300 watts
  - Power requirement: 230V
  - Speaker configuration: 2 x 10" plus HF tweeter
  - Speaker outputs: 2 x jack sockets
  - Impedance: 8 Ohm (minimum output impedance 4 Ohm)
  - Frequency response: -3dB at 17Hz and 30kHz
  - High instrument input impedance: 3.9M Ohms, input range 150mV - 20mV p-p
  - Low instrument input impedance: 10K Ohms, input range 300mV - 40V p-p
  - Line input impedance: 10K Ohms, input level 0dBu nominal
  - Tuner output impedance: 22K Ohms, level 0dBu nominal
  - DI output: 600 Ohms balanced, level -20dBu nominal
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 220Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz shelving
  - Effects send impedance: 22K Ohm, level 0dBu nominal
  - Effects return impedance: 22K Ohm, level 0dBu nominal
  - Distortion: less than 0.5% THD
  - Signal to noise: better than 80dB (EQ flat)
  - Dimensions (H x W x D): 581 x 610 x 355 mm
  - Weight: 35 kg
