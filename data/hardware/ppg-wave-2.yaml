description: >-
  The PPG Wave 2 is a German-made hybrid synthesizer that combines digital wavetable
  oscillators with analog VCF and VCA sections, first released in 1981. Developed with
  input from Tangerine Dream, it became renowned for its rich pads, brass, and bass
  sounds, and was used by artists including David Bowie, Depeche Mode, and Jean Michel
  Jarre.
details: |-
  The PPG Wave 2 series originated from the PPG Wave Computer 360, which debuted in 1978 but produced harsh, tinny sounds due to its purely digital signal path. In 1981, the Wave 2 was released, adding analog VCF and VCA filter and envelope sections to warm the digital wavetable sound. Tangerine Dream assisted in the synthesizer's development.

    The original Wave 2 featured one oscillator per voice, while the Wave 2.2 (1982) doubled this to two oscillators per voice, with the ability to generate over 2,000 different single-cycle 8-bit digital waveforms organized into 30 wavetables of 64 waves each. The Wave 2.3 (1984) further enhanced the design with 12-bit digital waveforms, Fourier analysis capabilities, and linear sample playback.

    The synthesizer features two distinct control panels: an Analog Control Panel with traditional knobs and a Digital Control Panel with keypad buttons and an LCD screen. An 8-track sequencer provides real-time automation of pitch, loudness, filter cutoff, and waveforms.

    Although PPG fell apart in the mid-late 1980s, their wavetable technology found its way into fellow German music company Waldorf, whose Microwave series represents the modern continuation of PPG's innovations.
specs: |-
  - 8-voice polyphony, 8-part multitimbral
    - 2 digital wavetable oscillators per voice (Wave 2.2/2.3; 1 on original Wave 2)
    - 30 wavetables with 64 waves per table
    - Analog 24 dB/octave lowpass VCF with ADSR envelope
    - Four Curtis ElectroMusic 3360 Dual VCA chips with ADSR envelopes (Wave 2.3)
    - 8-track sequencer with 6000 notes, 99 patterns, 99 songs, plus arpeggiator
    - 200 patch memory locations
    - 61-key keyboard with aftertouch sensitivity
    - MIDI plus PPG proprietary 8-bit parallel communication
    - 8-bit waveforms (Wave 2/2.2), 12-bit waveforms (Wave 2.3)
