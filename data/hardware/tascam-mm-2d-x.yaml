name: MM-2D-X
manufacturer: tascam
primaryCategory: mixer
categories:
  - rack-mount
  - digital
url: https://tascam.com/us/product/mm-2d-x
description: Compact half-rack 2-channel Dante mixing station for professional
  installation. Accepts two balanced XLR mic/line inputs with +48V phantom power
  and delivers two balanced XLR line outputs, while simultaneously exchanging 4
  channels in each direction over Dante. Features a built-in 6-in/4-out DSP
  matrix mixer with compressor, 4-band EQ, 10-band output EQ, ducking, ambient
  noise compensation, and up to 50 scene presets. Powered via PoE Class 0 or
  optional external adapter. North American and global XLR variant.
details: |-
  Half-rack Dante mixing station (214×44.45×136.1mm, 878g) with XLR connectors for North American and global markets. Two XLR-3-31 mic/line inputs (+48V phantom, adjustable gain -74 to +26 dBu, EIN -125 dBu). Two XLR-3-32 line outputs (nominal +4 dBu, max +15 to +24 dBu switchable). Built-in 6-in/4-out DSP matrix combines 2 local inputs + 4 Dante receive channels, outputs to 4 Dante send channels + 2 local outputs. Per-input DSP: compressor, 4-band EQ, high/low-pass filters, delay, ducking, ambient noise compensation, auto-level. Per-output: 10-band EQ + limiter. Up to 50 scene presets. Dual Dante RJ-45 for daisy-chaining. Controlled via DCP CONNECT or EZ CONNECT. Functionally identical to MM-2D-E (Euroblock variant).
specs: |-
  - - Analog inputs: 2× XLR-3-31, balanced mic/line; range -74 to +26 dBu; impedance ≥2kΩ; +48V phantom; EIN -125 dBu (150Ω)
  - Analog outputs: 2× XLR-3-32, balanced line; nominal +4 dBu; max +15 to +24 dBu (switchable); impedance ≤200Ω
  - Dante: 2× RJ-45 Gigabit Ethernet (1000BASE-T, Cat5e STP+); 4-in/4-out channels
  - Sample rates: 44.1/48/88.2/96kHz; bit depth: 16/24-bit
  - Freq response: ±0.5dB, 20Hz–20kHz (44.1/48kHz); 20Hz–40kHz (88.2/96kHz)
  - THD+N: 0.005%; S/N: 105dB; crosstalk: 100dB; dynamic range: 105dB
  - Power: PoE Class 0 (primary) or optional PS-P1220E DC adapter; consumption: 6W
  - Dimensions: 214(W) x 44.45(H) x 136.1(D) mm; weight: 878g
  - Operating temperature: 0–40°C
