name: FreePlay LIVE
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/battery-powered/live-sound/freeplay_live.html
description: "Personal PA with Bluetooth: a lightweight, battery-powered
  personal PA for music performance and speech presentations with wireless
  control from iOS and Android devices."
details: |-
  As a live musician, public presenter, or anyone else who's had to ensure their audience can hear them clearly, you've almost certainly run into the shortcomings of most portable live sound speaker systems. They're either too big and heavy to easily transport and set up, or they're small but don't offer the power, sound quality, and reliability you need for your most confident performances.

  FreePlay LIVE is the perfect personal PA for anyone who needs a lightweight and great-sounding solution for music performance and speech presentations with plenty of power on tap, built-in battery, and total wireless control from iOS and Android devices.

  With 150W of total power driving a 6" woofer and dual tweeters, plus up to 15 hours of continuous operation from the built-in rechargeable lithium-ion battery, FreePlay LIVE delivers full-range sound without compromise. A built-in digital mixer, durable molded enclosure with coated metal grille, and precision-tuned ported design ensure reliable performance anywhere you take it.

  The FreePlay Connect companion app provides remote control from your mobile device, and a second FreePlay speaker can be linked wirelessly for expanded coverage. An included mic stand adapter and pole cup make setup quick and flexible.
specs: |-
  - 150W total power
  - 6" woofer with dual tweeters
  - Up to 15 hours battery life (continuous operation)
  - Built-in rechargeable lithium-ion battery
  - Built-in digital mixer
  - Bluetooth audio streaming
  - FreePlay Connect companion app for iOS and Android
  - Wirelessly linkable with a second FreePlay speaker
  - Durable molded enclosure with coated metal grille
  - Precision-tuned ported enclosure
  - Included mic stand adapter and pole cup
  - Weight: 8.8 lbs / 4.0 kg
  - Dimensions: 7.75 x 14 x 7 in. / 19.7 x 35.6 x 17.8 cm
