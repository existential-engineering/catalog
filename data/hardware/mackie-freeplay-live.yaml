description: FreePlay LIVE is the ultra-portable, personal PA of your dreams.
  With tons of power, crystal clear sound, up to 15 hours of battery life, and
  much more, FreePlay LIVE is perfect for performers, buskers, presenters, and
  even for rocking out to your favorite playlist.
details: |-
  As a live musician, public presenter, or anyone else who's had to ensure their audience can hear them clearly, you've almost certainly run into the shortcomings of most portable live sound speaker systems. They're either too big and heavy to easily transport and set up, or they're small but don't offer the power, sound quality, and reliability you need for your most confident performances.

  Push those concerns aside. FreePlay LIVE is the perfect personal PA for anyone who needs a lightweight and great-sounding solution for music performance and speech presentations with plenty of power on tap, built-in battery, and total wireless control from iOS and Android devices.

  150W total power drives a high-output 6 inch woofer and dual tweeters for powerful, room-filling sound, with a built-in rechargeable lithium-ion battery for up to 15 hours of continuous operation.

  Download the free FreePlay Connect companion app and get complete control over levels, EQ, reverb, and more. Link to a second FreePlay Series speaker for even bigger, clearer stereo sound or split them up for an immersive multi-room music listening experience.
specs: |-
  - 150W total power drives a high-output 6" woofer and dual tweeters
  - Built-in rechargeable lithium-ion battery for up to 15 hours of continuous operation
  - Dual 1/4" / XLR combo inputs for connecting guitars, microphones, keyboards, and more
  - 1/4" balanced monitor out for sending your mix to another powered speaker or mixer
  - 1/8" aux input
  - Wireless Bluetooth streaming
  - Durable molded enclosure, coated metal grille, and robust internal construction
  - Precision-tuned ported enclosure
  - FreePlay Connect companion app for levels, EQ, reverb and more
  - Link to a second FreePlay Series speaker for stereo or multi-room playback
  - Included adapter allows for mounting on a standard microphone stand
  - Weight: 8.8 lb / 4.0 kg
  - Dimensions: 7.75 x 14 x 7 in. / 19.7 x 35.6 x 17.8 cm
