details: |-
  The DN300 is one of the most-cited references in the history of analogue equalisation. Across decades of touring, broadcast and fixed-installation work it defined what a graphic equaliser should sound like and how it should behave under the demands of professional use.

  30 bands of ISO-standard 1/3-octave equalisation, the Klark Teknik Proportional-Q response curve and a transparent British signal path combined to make the DN300 a fixture in monitor-engineering racks, broadcast post-production rooms and reference listening environments around the world.

  The Proportional-Q characteristic is wide and musical at small cuts and boosts and surgical as fader travel increases, which is the behaviour engineers learned, internalised and now seek to emulate in software.

  The DN300 is obsolete, superseded by modern digital platforms, but its sonic signature remains a reference. Legacy spares and service support are available through Music Tribe Care.
specs: |-
  - Single channel graphic equalisation
  - 30 bands of ISO-standard 1/3-octave equalisation
  - Proportional-Q filter response
