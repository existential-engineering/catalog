details: |-
  An Artist Series Custom Shop edition of the Realizer Reverberator, finished in a matte sparkle pink powder coat with gloss white knobs and carrying artwork by Luca of Pedal Partners plus an Artist Series bottom print. Artist Series pedals each carry their collaborator's artwork, and a portion of sales goes to that artist.

  The Realizer is a spatial pedal based on the left side of the Loomer Workstation, aimed at shoegaze and ambient guitarists who already have the fuzz tone they want, and it offers three distinct reverb modes.

  Soft Focus recreates the Soft Focus patch of the Yamaha FX500 multi-effects processor, a late-1980s rack unit behind many signature delay and modulation sounds of the early 1990s. In that mode the Decay control sets both reverb decay time and the feedback of the dual delay, while Depth sets the depth of all four chorus voices.

  Reverse is a reverse reverb drawing on the Yamaha SPX90 and Alesis Midiverb II, with Decay switching between eight fixed delay times from 150 ms up to half a second, plus an envelope-triggered vibrato imitating the pitch bend of a Jazzmaster tremolo bar; Depth sets how far that bar is pushed and Warmth behaves like a Jazzmaster rhythm-pickup tone control. Hall is a hall reverb whose output feeds an octave-up stage that returns to the reverb input, creating an endlessly ascending octave feedback loop whose prominence is set by Depth.
