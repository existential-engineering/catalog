details: |-
  The MJ Series San Dimas Style 1 HSH FR PF QM revives the late-1980s era when Charvel guitars were built exclusively in Japan. Attentively crafted in Japan, this San Dimas Style 1 pairs an alder body with a striking quilt maple top in a gloss finish, capturing the brand's signature blend of vintage attitude and modern performance.

  A bolt-on maple neck with graphite reinforcement carries a hand-rubbed oil finish for a smooth, broken-in feel. The Speed Neck profile features rolled fingerboard edges, sculpted 4-bolt heel and a heel-mount truss rod adjustment wheel for quick neck relief tweaks without removing the neck.

  The 12"-16" compound radius pau ferro fingerboard is fitted with 24 jumbo frets, white dot inlays and a Floyd Rose 1000 Series locking nut measuring 1.6875" wide, supporting precise rhythm work and expressive bends across the full range.

  Electronics are anchored by a versatile HSH pickup configuration: a Seymour Duncan JB TB-4 humbucker at the bridge, a Custom Seymour Duncan Flat Strat SSL-6 single-coil in the middle and a Seymour Duncan Jazz SH-2N humbucker at the neck. A 5-position blade switch with volume and tone controls delivers a wide tonal palette from sparkly single-coil chime to thick humbucker grind.

  Hardware includes a recessed Gotoh GE1996T Series double-locking tremolo, Gotoh die-cast tuning machines and chrome finish appointments. Dunlop dual-locking strap buttons and an included Charvel Multi-Fit hardshell gig bag round out a road-ready package built for serious players.
