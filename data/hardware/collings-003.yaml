description: The 003 is a 12-fret 00-sized acoustic guitar with 3-style
  appointments built on a body shape dating to the Civil War era. It delivers a
  typically balanced and precise tone suited for a wide range of playing styles,
  featuring East Indian rosewood back and sides, a Sitka spruce top, abalone
  rosette, chevron backstrip, and ivoroid binding throughout.
details: |-
  The 003 is the highest trim level in the 12-fret 00 series, featuring 3-style appointments: ivoroid body, fingerboard, and peghead binding with butt wedge, an abalone rosette, a chevron backstrip, Gold Waverly tuners, and ebony bridge pins with abalone dot. The fingerboard has no inlays. Built with a Sitka spruce top and East Indian rosewood back and sides, it combines vintage aesthetics with Collings' exacting construction standards.

  The 12-fret neck joint places the neck heel closer to the body for easier upper-register access while retaining the pre-war aesthetic. The Modified V neck profile and pre-war scalloped X-brace construction deliver the signature Collings voice with shimmery highs, punchy midrange, and tight low end.
specs: |-
  - Top: Sitka spruce
  - Back & sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony (no inlay)
  - Bridge: Ebony pyramid-style
  - Bridge pins/end pin: Ebony with abalone dot
  - Tuners: Gold Waverly
  - Nut: Bone, 1 13/16"
  - Saddle: Bone, drop-in
  - Frets: Medium 18% nickel-silver
  - Fingerboard radius: 14" - 26" compound
  - Neck profile: Modified V
  - Scale length: 24 7/8"
  - Body width: 14 1/4"
  - Body length: 19 3/8"
  - Body depth: 4"
  - Total length: 38"
  - Body binding: Ivoroid with b/w/b/w/b purfling
  - Rosette: Abalone
  - Backstrip: 3-style (Chevron)
  - Body finish: High gloss nitrocellulose lacquer
  - Neck finish: High gloss polyester resin
