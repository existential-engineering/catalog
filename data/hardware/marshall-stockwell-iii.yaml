description: Portable Bluetooth speaker with 40+ hours of playtime.
details: |-
  Grab the carrying strap and take powerful sound with you. With 40+ hours of portable playtime on a single charge, there is plenty of opportunity to set the tempo then change it up throughout the day. Wherever you are around the speaker, its powerful 360 degree sound brings the room to life. Built to handle everyday knocks and splashes, it keeps the music going outside without a second thought.

  True Stereophonic 360 degree sound: Marshall's unique form of multi-directional audio and custom tuning makes the speaker produce a sound much larger than its size, with the same quality and fullness as you move around it. Dynamic loudness raises bass and treble at lower volumes to keep the kick and the clarity, then levels the music out as you turn it up.

  Dust and water resistant: rated IP55, Stockwell III is protected from dust ingress and low-pressure water jets, so it braves splashes from all directions.

  Tactile controls: a standalone power button, an M-button and a media jog join the classic brass panel, giving instant access to presets and track skipping. The speaker also works as a charging bank, so a phone can be connected to the USB-C port and charged while the music keeps playing.

  Making products last longer: Stockwell III has a consumer-replaceable battery and enhanced app settings to preserve battery lifespan, with the silicone sleeve, strap, metal grille and battery available as spare parts. Designed and engineered in Sweden. Made in Thailand.
