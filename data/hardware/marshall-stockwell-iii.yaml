  - Battery type: rechargeable, replaceable and exchangeable Li-ion battery, with battery preservation
  - Play time: 40+ hours
  - Quick charging: 20 minutes of charge time gives 7 hours of playtime with a 30 W USB-C PD charger
  - Charging time: under 3 hours to full recharge with a 30 W USB-C PD charger
  - Power input: USB-C 9V/3A, 5V/3A (battery powered, charged via USB-C)
  - USB-C audio: accepts a digital audio source over USB-C once enabled in the Marshall Bluetooth app
  - Weight: 1.3 kg / 2.9 lb
