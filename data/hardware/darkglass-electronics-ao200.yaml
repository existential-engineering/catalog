name: Alpha·Omega 200
manufacturer: darkglass-electronics
primaryCategory: bass-amplifier
url: https://www.darkglass.com/products/ao200
description: The Alpha·Omega 200 is a slim, lightweight 200-watt bass amplifier
  head featuring the signature Alpha·Omega distortion voicing, a studio-quality
  4-band EQ, aux input, headphone output, and XLR DI.
details: |-
  The Alpha·Omega 200 is a compact 200-watt bass amplifier head designed for portability without compromising power. Slimmer and lighter than ever, it incorporates the signature Alpha·Omega distortion engine with switchable circuits, Alpha for punchy, defined tones and Omega for raw, brutal sounds, along with a studio-quality 4-band EQ.

  The amplifier includes an aux input for backing tracks and a headphone output with analog cabinet emulation for quiet practice. A ground lift control on the DI output helps eliminate ground noise, and an intuitive push-potentiometer master knob integrates mute functionality for convenient operation.

  Connectivity includes a 1/4-inch instrument input, a speakON combo speaker output, a balanced XLR DI output with ground lift, a 3.5 mm headphone output, and a 3.5 mm aux input. It runs on a universal 100-230 VAC, 50-60 Hz supply.
specs: |-
  - 200 W amplifier featuring the signature Alpha-Omega voicing
  - Slim, lightweight body
  - Studio-quality 4-band EQ
  - Switchable Alpha and Omega distortion circuits
  - Push-potentiometer master knob with mute
  - 3.5 mm headphone output with cabinet emulation and XLR DI output
  - Aux input for backing tracks
  - Universal power: 100-230 VAC, 50-60 Hz
