details: |-
  Expertly engineered with a deep passion for monster bass tones, the ZIO Analog Bass Preamp+DI packs massive punch and flexibility in a compact and easy-to-dial-in pedal. This ultra-low noise, all-analog tone shaping tool works equally well in front of your amplifier or as a preamp/direct box via its balanced XLR output. High-quality Burr-Brown Op-Amps and a straightforward yet versatile control panel deliver rich and dynamic tones with ample headroom.

  The BASS knob provides colossal low-end boost at around 100Hz while gently reducing muddy low-mids to retain clarity. The FOCUS knob sweeps the cut-off point of a high-pass filter to tame excessive sub bass and low bass frequencies. The TREBLE knob boosts or cuts the highs, and the OUTPUT knob offers up to +16dB of boost above unity gain or up to -6dB of cut.

  The GRIT toggle captures transformer-style breakup, adjustable via a set-it-and-forget-it GAIN control on the side of the pedal. The SCOOP toggle engages an EQ curve based on the famous "Pultec Trick" for a more polished sound, cutting low-mid mud, adding a gentle upper-midrange presence boost, and applying a natural high pass filter.

  ZIO's DIRECT OUT is a balanced XLR output with a ground LIFT switch, delivering a low-noise, amp-like signal for studio or stage. A standard 1/4 output allows a parallel signal running directly to a pedalboard or the front of a bass amp. The pedal uses a Burr Brown OPA1656 op-amp selected for pure tonality, dynamic range, and headroom.
specs: |-
  - Ultra-low noise and distortion all-analog preamp
  - +/- 12V high voltage internal rails for active and passive basses (runs on a 9V power supply)
  - Full tone-shaping control set with FOCUS high-pass filter
  - GRIT and SCOOP modes for added tonal character
  - OUTPUT knob: up to +16dB boost or -6dB cut
  - XLR Direct Output with optional ground lift
  - True Bypass
  - Headphone output for direct monitoring
  - Burr Brown OPA1656 op-amp
  - Power consumption: 200mA
  - Brushed anodized aluminum housing
  - Includes 9V power supply
  - Dimensions: L: 4 in. x W: 3 in. x H: 2.25 in. (including knobs)
  - Weight: 0.75 lb.
