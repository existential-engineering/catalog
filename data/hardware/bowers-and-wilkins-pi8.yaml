description: Reference in-ear True Wireless earbuds with 12mm Carbon Cone
  drivers, adaptive Active Noise Cancellation, aptX Lossless support, and a
  smart charging case with audio retransmission.
details: |-
  The Pi8 is Bowers & Wilkins' flagship True Wireless earbud, combining class-leading audio performance, bespoke adaptive ANC, and crystal-clear call quality with a highly considered ergonomic form factor and premium materials.

  At the heart of each earbud is a 12mm Carbon Cone drive unit. The Carbon Cone construction reduces distortion and captures high-frequency detail, paired with a high-performance DSP, dedicated amplifier, and DAC to deliver a true 24-bit audio connection.

  Wireless performance is handled by Bluetooth 5.4 with support for aptX Lossless, aptX Adaptive, aptX Classic, AAC, and SBC. Multipoint connectivity allows simultaneous pairing with two devices, while Apple MFi (Made for iPhone) support and the Bowers & Wilkins Music app round out the connected experience, including industry-first in-app headphone music streaming.

  Adaptive Active Noise Cancellation uses three microphones per earbud to optimise both ANC and call quality across changing environments. Listeners can tailor the sound via a 5-band customizable EQ and a TrueSound mode for the reference tuning.

  The smart charging case adds a unique retransmission feature: it can connect to a wired audio source via its 3.5mm jack input and stream that audio wirelessly to the earbuds. The case also supports USB-C and wireless charging, providing up to 13.5 hours of additional playback on top of the 6.5 hours from the earbuds with ANC enabled. A 15-minute quick charge yields 2 hours of playback.
specs: |-
  - Drive units: 2 x 12mm Carbon Cone
  - Bluetooth: 5.4
  - Supported codecs: aptX Lossless, aptX Adaptive, aptX Classic, AAC, SBC
  - Multipoint connectivity: Yes
  - Apple MFi (Made for iPhone): Yes
  - EQ: 5-band customizable EQ + TrueSound mode
  - Microphones: 3 per earbud (used for ANC and calls)
  - Active Noise Cancellation: Adaptive ANC
  - Battery life (earbuds): up to 6.5 hours with ANC enabled
  - Battery life (with case): additional 13.5 hours
  - Charge time: 2 hours full charge; 15-minute charge = 2 hours playback
  - Wireless charging: Yes (case)
  - Water resistance: IP54 (earbuds)
  - Weight (earbuds): 7g each
  - Weight (case): 46g
  - Case dimensions: 65mm (W) x 29mm (D) x 52mm (H)
  - Case audio inputs: USB-C, 3.5mm jack (retransmission)
  - Ear tip sizes included: XS, S, M, L
  - Included cables: 60cm USB-C to USB-C charging cable, 80cm 3.5mm to USB-C audio cable
  - Available colors: Anthracite Black, Dove White, Jade Green, Midnight Blue, Dark Burgundy, Pale Mauve
