description: Pi8. The new reference in earbuds. Class-leading audio performance,
  bespoke ANC and crystal-clear call quality with the comfort and elegance of a
  highly considered earbud design.
details: |-
  Pi8 is the flagship True Wireless earbud in the Bowers & Wilkins range, presented as the reference point for the category. Each earbud carries a 12mm Carbon Cone drive unit with its own DSP and amplifier/DAC, a diaphragm chosen to reduce distortion and improve high-frequency detail so that fine nuance survives into the ear.

  The wireless link is a true 24-bit connection, Bluetooth 5.4 with aptX Lossless, with aptX Adaptive, aptX Classic, AAC and SBC underneath it and multipoint connectivity for two devices at once. A five-band customisable EQ and a TrueSound mode allow the presentation to be adjusted in the app.

  Three microphones per earbud serve telephony and the Active Noise Cancellation system, which adapts automatically to the surroundings, so calls stay clear and the noise floor stays down as the environment changes. Four ear tip sizes and an ergonomic housing cover the fit side.

  The smart charging case adds wireless and USB-C charging, fast charging, and an audio retransmission feature: connect the case to a source and it re-broadcasts over aptX Adaptive to the earbuds, which is how a wired or analogue-only source reaches them. An 80cm 3.5mm jack to USB-C cable is supplied for that purpose alongside the 60cm USB-C charging cable.

  Earbuds weigh 7g each and are rated IP54; the case weighs 46g and measures 65 x 29 x 52mm. Battery life is up to 6.5 hours with ANC on plus a further 13.5 hours from the case, a full charge takes two hours, and a 15-minute charge returns two hours of playback. The Bowers & Wilkins Music app provides set-up, control and direct music streaming, and the design has taken an iF Design Award 2025 and a Red Dot Design Award 2025.
specs: |-
  - Wearing style: in-ear noise-cancelling True Wireless earbuds
  - Drive units: 12 mm Carbon Cone
  - Microphones: 3 per earbud for telephony and ANC
  - Technical features: high-performance DSP with dedicated DSP and amplifier/DAC, true 24-bit audio connection, 5-band customisable EQ plus TrueSound mode, Bluetooth 5.4 with aptX Lossless, multipoint connectivity, Active Noise Cancellation (ANC), audio retransmission from the charging case (aptX Adaptive), wireless and USB-C charging, fast charging support, Apple MFi Made for iPhone support
  - Bluetooth codecs: aptX Lossless, aptX Adaptive, aptX Classic, AAC, SBC
  - Audio inputs: earbuds via Bluetooth; charging case via USB-C and 3.5 mm analogue jack (wireless audio retransmission through the charging case)
  - Battery type: rechargeable lithium-ion (earbuds and charging case)
  - Battery life and charging: up to 6.5 hours for earbuds (with ANC on), additional 13.5 hours from the charging case, charge time 2 hours, 15-minute charge = 2 hours playback
  - Wireless charging support: yes
  - Water resistance: IP54 (earbuds)
  - Weight: earbuds 7g each, charging case 46g
  - Dimensions (charging case): 65 mm (w) x 29 mm (d) x 52 mm (h)
  - Accessories: extra small / small / medium / large ear tips, 60 cm USB-C to USB-C charging cable, 80 cm 3.5 mm jack to USB-C audio cable
  - Finishes: Anthracite Black, Dove White, Jade Green, Midnight Blue, Dark Burgundy, Pale Mauve
  - Awards: iF Design Award 2025, Red Dot Design Award 2025
