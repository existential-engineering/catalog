url: https://www.numark.com/product/ns6
description: 4-channel digital DJ controller and mixer with touch-sensitive
  platters, Strip Search needle-drop, dedicated iZotope effects controls, and a
  24-bit audio interface, designed in partnership with Serato.
details: |-
  NS6 is a four-channel digital DJ controller and mixer designed by Numark in partnership with Serato. It combines a rugged all-metal chassis with 140 hands-on controls (214 unique MIDI messages, 14-bit MIDI resolution) and a built-in 24-bit / 44.1 kHz audio interface, allowing it to function as both a software-controlling DJ surface and a standalone four-channel mixer.

  Each deck features a 6-inch dual-zone touch-sensitive metal platter with a rubberized outer ring and 3,600 ticks of rotational resolution, plus Strip Search virtual needle-drop strips with LED position indicators. Deck controls include key lock, pitch control, manual and instant looping, hot cues, beat grid editing, and dedicated iZotope effects controls. The mixer section includes a curve-adjustable CP-Pro crossfader, replaceable line faders, balanced XLR and unbalanced RCA master outputs, RCA booth outputs, and dual 1/4-inch and 1/8-inch headphone outputs.

  NS6 ships with Serato DJ and Serato ITCH for NS6, includes TSI mapping files for Traktor Pro 2 compatibility, and operates via standard MIDI for use with virtually any DJ software, including Virtual DJ.
