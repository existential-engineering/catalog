description: Mini overdrive carrying the Keeley Tube Screamer modifications,
  with four switch-selected drive modes.
details: |-
  Keeley's modifications for the TS9 Tube Screamer, introduced in 2001, became a standard set of around a dozen changes: increased bass response, a fine-tuned tone control, cleaner sounds at low settings and much higher gain when needed. That package became the Keeley Mod Plus and went unchanged for close to fourteen years.

  The Red Dirt appeared in 2012 and is essentially all of those modifications built into one pedal. It adds a JFET input buffer, which could not be retrofitted to the original screamers, and which makes the Red Dirt and Red Dirt Mini more open and dynamic.

  The Red Dirt Mini's four modes are new to it. The baseline voicing is set by removing the bottom plate and adjusting DIP switches, which change the clipping diodes between a more compressed sound and a more open, tube-amp-like one. The four drive styles are Distortion, Overdrive, Crunch and Amp. Distortion Mode is the highest gain setting, at two to three times the gain of a screamer, and the others are progressively cleaner, more open and bolder.

  The enclosure measures 1.5 by 3.6 inches and the pedal runs from a 9 volt negative-tip supply, drawing 7.5 mA.
