description: The MF15 is a compact surround speaker for immersive audio
  applications including music and post-production.
details: |-
  The MF15 is a compact surround speaker for immersive audio applications including music and post-production, ideally suited to Dolby Atmos HE 7.1.4 and 9.1.4 configurations.

  As a passive speaker, it's compact and really easy to install. The MF15's shallow enclosure makes it a perfect fit for Dolby Atmos systems in smaller control rooms with low ceilings.

  It can be used in conjunction with all M-series enclosures according to the room requirements, and MS subs for bass management. The drivers perfectly complement those in our screen speakers to give seamless sound movement around the theatre in Atmos applications.

  The MF15 is available in horizontal and vertical formats, or custom configurations to suit all applications.
specs: |-
  - Type: 2-way passive surround
  - Application: Music and post-production
  - Frequency response: 60Hz – 20kHz
  - Maximum SPL at 1 metre: 114dB
  - Crossover frequencies: 2000Hz
  - Total harmonic distortion: 1% at 90dB
  - Sensitivity: 90dB/2.83v/1m
  - Impedance: 4 Ohms
  - Recommended amplifier power: 100-500 watts
  - High frequency driver: 28mm soft-dome
  - Low frequency driver: 24cm MSP
  - Amplifier recommendation: Dynaudio Acoustics DA20 4-channel
  - Cabinet dimensions (H x W x D): 320 x 452 x 178mm
  - Weight: 10 kg
  - Fixing: 4x M8 threaded inserts in the back allow fixing to a range of brackets
  - Finish: Black textured paint
  - Optional: Hardwood cabinet (oak, cherry, walnut, maple)
  - Custom cabinet sizes: On request
