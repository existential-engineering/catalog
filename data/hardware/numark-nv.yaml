id: LfEGIxKRB5A_fQ2QlfxFJ
name: NV
manufacturer: numark
primaryCategory: midi-controller
categories:
  - control-surface
url: https://www.numark.com/product/nv
description: Intelligent dual-display controller for Serato DJ with integrated
  4.3-inch full-color screens providing real-time feedback of virtual decks,
  effects, cue points, and waveforms.
specs: |-
  - 4 decks of Serato DJ software control in a low-profile design
  - Integrated 4.3-inch full-color displays for 1:1 real-time visualization
  - Touch-activated capacitive knobs for filters, EQ, and effects
  - Dual 5-inch metal platters with adaptive learning technology
  - 16 velocity-sensitive trigger pads with RGB illumination
  - 10 pad modes (hot cues, loop slicing, sample triggering)
  - 12 iZotope effects with dedicated touch-activated controls
  - Professional crossfader with Fader Start
  - Mouseless library browsing
  - Sample Rate: 44.1 kHz
  - Bit Depth: 16-bit
  - Signal-to-Noise Ratio: -112 dB (100% Master Volume, A-weighted)
  - THD+N: 0.005% (100% Master Volume)
  - Dimensions: 21.6" x 13.4" x 2.1"
  - Weight: 7.0 lbs
  - Power: 12V DC, 2A center-positive
