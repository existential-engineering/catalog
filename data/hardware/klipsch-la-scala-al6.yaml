description: The La Scala AL6 is a three-way, fully horn-loaded loudspeaker
  hand-built to order in Hope, Arkansas, representing a modern update to the
  original 1963 design. It delivers high efficiency and exceptional acoustic
  power output with minimal wattage, featuring Tractrix and Mumps horn
  technology throughout.
details: |-
  The La Scala AL6 is part of Klipsch's Heritage Series and carries forward the legacy of Paul W. Klipsch's original 1963 design, condensing the classic Klipschorn magic into a slightly smaller but fully horn-loaded enclosure. Every cabinet is hand-built to order at the Klipsch factory in Hope, Arkansas, using premium real-wood veneer in American Walnut, American Auburn, or Black Ash finishes.

  The AL6 uses a three-way crossover system with all horn-loaded drivers. The tweeter is the K-771 compression driver featuring a patented extended phase plug for cleaner high-frequency dispersion and improved off-axis coverage. The midrange driver is the K1133 3-inch compression driver paired with the K-406M Tractrix horn, which incorporates Mumps technology — small bumps near the throat of the horn that improve horizontal coverage pattern consistency. The bass section uses a patent-pending horn-loaded, vented design for deep, controlled low-frequency output.

  The AL6 ships with a passive crossover network as standard but is fully compatible with the optional Heritage Active Crossover accessory, which adds DSP alignment and equalization by splitting the signal actively before amplification. A flexible I/O panel on the rear accommodates both passive and active input configurations, including binding posts for passive operation and additional inputs for bi- or tri-amping via the active crossover.

  With a 10-year warranty and a design philosophy rooted in horn-loading for maximum efficiency, the La Scala AL6 is engineered to deliver lifelike dynamics and natural timbre at low listening levels, making it suitable for both audiophile home listening rooms and studio reference monitoring.
