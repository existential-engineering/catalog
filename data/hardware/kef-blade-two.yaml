description: |-
  Sharing the same DNA as Blade One Meta, Blade Two Meta offers all the
  acoustic prowess and iconic design on a slightly smaller scale. Features
  Single Apparent Source technology with four 165mm (6.5 in.) force-cancelling
  bass drivers and 12th generation Uni-Q driver array with MAT.
specs: |-
  - Three-way bass reflex design with Single Apparent Source technology
  - 12th generation Uni-Q driver array with Metamaterial Absorption Technology (MAT)
  - HF: 25mm aluminium dome tweeter with MAT
  - MF: 125mm aluminium cone midrange
  - LF: 4 x 165mm aluminium cone bass drivers (force-cancelling configuration)
  - Frequency range (-6dB): 30Hz - 45kHz
  - Frequency response (±3dB): 33Hz - 35kHz
  - Crossover frequencies: 450Hz, 2.2kHz
  - Sensitivity: 86dB (2.83V/1m)
  - Nominal impedance: 4Ω (minimum 3.2Ω)
  - Recommended amplifier power: 50 - 400W
  - Maximum SPL: 116dB peak at 1m
  - Dimensions (H x W x D with plinth): 1461 x 338 x 475mm (57.5 x 13.3 x 18.7 in)
  - Weight: 35.5kg (77.8 lb) per speaker
