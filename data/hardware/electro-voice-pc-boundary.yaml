description: The PC Boundary is a low-profile multi-pattern PolarChoice
  surface-mount microphone designed for conferencing, boardroom, and
  installed-sound applications where unobtrusive area coverage is essential. A
  dual back-electret condenser capsule provides four switchable polar patterns -
  omnidirectional, cardioid, supercardioid, and figure-8 - all voiced for
  consistent tonal character so the operator can adapt to room geometry and
  talker placement without changing microphones. A programmable mute switch can
  be configured for latching on/off or momentary (push-to-talk / push-to-mute)
  operation, and the steel housing is finished in non-reflective camera black to
  blend into tabletops, lecterns, and broadcast sets. Balanced low-Z output is
  delivered via 3-pin XLR with standard 12 - 52 VDC phantom power and a 50 Hz -
  20,000 Hz (-3 dB) frequency response.
details: >-
  PolarChoice multi-pattern boundary layer microphone


  Four switchable polar patterns: omnidirectional, cardioid, supercardioid,
  figure-8


  Consistent voicing maintained across all four polar patterns


  Dual back-electret condenser element


  Programmable mute switch (latching on/off or momentary operation)


  Very low-profile design suitable for tabletop, podium, or surface mounting


  Steel case with non-reflective camera-black finish for low visual impact


  Balanced low-Z output via 3-pin XLR


  Phantom powered, 12 - 52 VDC


  Frequency response 50 Hz - 20,000 Hz (-3 dB)
