description: Ultra-Compact 20in / 8out Digital Mixer with Wi-Fi. Designed for
  life on the stage, CQ-20B is the highest channel-count mixer in the range and
  is controlled via the free CQ MixPad app.
details: |-
  CQ takes our renowned processing and effects, adds exciting new assistive mixing tools, and packages it all up into our smallest, and most affordable, digital mixer series yet.

  CQ draws on technology from our latest generation of live sound consoles to deliver audio quality previously unimaginable at this level of mixer. Pristine 96kHz audio is partnered with studio-grade onboard processing and an optimised suite of FX to set a new standard for what's possible with ultra-compact digital mixers.

  CQ's Feedback Assistant automatically detects and eliminates problem frequencies using up to 16 filters per output so you can mix with confidence – and forget about feedback.

  CQ makes it easy to handle multiple channels simultaneously with 4 DCAs, each capable of controlling the level of any combination of inputs, outputs, and FX, for simple single-fader control of multiple channels, such as a drum kit, without affecting their relative levels. There's also 4 Mute Groups, enabling you to mute and unmute multiple channels at once via a single button, perfect for muting all stage mics or monitor speakers.

  CQ packs in multiple recording and playback options to ensure you're always ready to capture the performance. An integrated USB audio interface enables easy multitrack recording, playback and streaming via your DAW, and an SD card slot is provided for reliable multitrack recording and playback on the go. You can record and playback stereo files via USB key, and you can even playback from your phone via the built-in Bluetooth functionality. The CQ-20B also includes an assignable Alt-Out – great for an engineer's IEM connection.

  Built-in dual band 2.4G/5G AC Wi-Fi with auto channel select means you can mix wirelessly from the CQ MixPad (engineer) and CQ4You (musician) apps without needing an external access point.
