description: The LCDi3 introduces superior resolution and refined acoustical
  tuning to the award-winning iSINE design. Featuring the design of the LCDi4
  together with the low impedance of the iSINE series, the LCDi3 can push up to
  130dB with zero audible distortion for a true audiophile in-ear experience.
details: |-
  The LCDi3 represents the next evolutionary step in the iSINE series, incorporating magnesium housing and grill design borrowed from the LCDi4 to reduce unwanted resonance and deliver superior resolution compared to earlier iSINE models. The open-back design provides greater transparency and deep, clean bass extension while maintaining the audiophile-grade performance standards.

  Featuring a cast magnesium housing with open-back architecture, the LCDi3 leverages patented Uniforce voice coil and Fluxor magnet technologies to achieve the highest dynamic range available in in-ear headphones. The low impedance driver can produce up to 130dB with no audible distortion, delivering a dynamic and engaging musical presentation.

  The new Ear Fins are ergonomically designed to provide secure, comfortable fit within the concha bowl, accommodating different ear shapes and sizes. For users preferring traditional styling, redesigned Ear Hooks curve inward along the back of the ear to ensure superior fit consistency.

  The package includes essential accessories for immediate use: a 1.5m auxiliary cable with 3.5mm connector, a nylon travel case with protective foam insert, multiple offset ear hooks and fins for fit customization, and a certificate of authenticity.

  This is a legacy product and no longer available for sale.
specs: |-
  - Style: In-ear, semi open-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-thin Uniforce
  - Transducer size: 30 mm
  - Maximum power handling: 500mW RMS
  - Maximum SPL: >130dB
  - Frequency response: 10Hz - 50kHz
  - THD: <0.1% @ 100dB
