details: |-
  こちらは受注後に組み立てするBuild to Orderの商品となっております。 お支払い確認後1〜2週間前後での納品となりますのでご了承ください。

  <商品説明>
  "LPG"はローパスゲート、MODEL 292Cの回路をユーロラックフォーマットで再現したモジュールです。 ローパスゲートの特徴である自然なパーカッション・サウンドからレゾナンスの効果を追加したことによるアグレッシブなサウンドまで幅広い音作りを可能にしています。 操作部のインターフェースはMODEL 208のLPGパートを踏襲しています。 バクトロール素子に現在入手が難しいExcelitas (旧Perkin Elmer)製のものを使用した貴重な一台となっています。

  特徴的な機能
  ・Low Pass Filter モード時にレゾナンス効果を追加
  ・LPFモード時に自己発振した状態でACC INにゲートシグナルを入力することでキックやタム、ボンゴのようなパーカッション・サウンドを提供します。
  ・ Excelitas (旧Perkin Elmer)製バクトロールを使用

  マニュアル(JP)
  MANUAL(EN)

  付属品:
  電源ケーブル
  交換用スペアパネル(ご注文いただいた色以外のパネルが付属いたします)
  マニュアル

  Width: 4HP
  Depth: 28mm
  Power: +12V 7mA / -12V 7mA

  Built by hand in Japan.

  <注意事項>

  ※電源を入れる前に電源の接続を再度ご確認ください。
  当製品の使用により直接または間接的に発生した人身事故、機器の損傷、使用不能について、一切の責任を負いません。

  基板製造に伴い発生してしまう印刷ムラやスレ、キズなどがある場合がございますのでご了承ください。
