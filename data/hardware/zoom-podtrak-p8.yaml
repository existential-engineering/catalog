description: The Zoom PodTrak P8 is easy to use and can handle the most
  ambitious podcasts. With all the functions you need to record, edit and mix,
  the PodTrak P8 is a complete podcast studio.
details: |-
  The PodTrak P8 is a six-input podcast recorder and mixer built around a 4.3 inch colour touchscreen. Monitoring, settings and onboard editing all run from the screen, and the display can be set to English, French, German, Spanish, Italian or Japanese. Inputs, outputs and controls are colour coded so each channel can be found at a glance.

  Six XLR mic inputs with up to 70 dB of gain and switchable +48 V phantom power handle demanding microphones such as the Shure SM7B and Heil PR 40. Each channel has its own preamp slider, mute button and ON AIR indicator, and per-channel processing covers a limiter, a low cut, a tone adjustment that makes a voice darker or brighter, and a combined compressor and de-esser. A Noise Reduction setting on the On Air screen turns down the mic levels of tracks that are not in use.

  Channel six is a dedicated remote-interview channel. It takes a phone over the TRRS smartphone jack, or over Bluetooth with the optional BTA-2 adapter, or it can be switched to USB mode to record a guest from a connected computer. All three routes use the mix-minus function, which prevents echo and feedback reaching the caller.

  Nine multi-coloured sound pads trigger sound effects, intro music, jingles and pre-recorded interviews while recording, with 13 pre-loaded sounds or user-loaded audio and four banks for a total of 36 clips. Onboard editing trims, splits and fades clips so a finished episode can be produced on the unit, and track files can also be transferred to a computer for a final mix.

  Six independent headphone outputs each have their own volume control, and balanced TRS speaker outputs feed studio monitors. Recording is 44.1 kHz 16-bit WAV to SD, SDHC or SDXC cards of up to 1 TB, with up to 13 tracks at once. A USB-C port makes the P8 a 6-in/2-out audio interface for recording and live streaming, with a class-compliant mode for iOS. Power comes from four AA batteries for up to 1.5 hours or from the supplied AD-14 AC adapter.
specs: |-
  - 4.3 inch (480 x 272) full-colour touchscreen LCD, selectable English, French, German, Italian, Spanish or Japanese
  - 6 mono mic inputs plus 1 stereo smartphone input, 2 output channels (6 headphone outputs and L/R speaker outputs)
  - Mic connectors: XLR jacks (2: HOT), input gain 0 to +70 dB, input impedance 3 kOhm, maximum input level +5 dBu at 0 dBFS
  - Phantom power: +48 V, optional
  - Smartphone connection jack: TRRS mini jack (4 contacts, TIP: L, RING 1: R, RING 2: GND, SLEEVE: MIC), input impedance 3 kOhm, maximum input level +2.5 dBu
  - Headphones: 3.5 mm stereo mini x 6, maximum output level 20 mW + 20 mW at 32 Ohm, output impedance 27 Ohm
  - Speaker output: balanced TRS jacks, maximum output level +5.5 dBu, output impedance 320 Ohm
  - USB: USB Type-C, audio interface and mass storage functions, USB bus power supported
  - Audio interface: 44.1 kHz, 16-bit, 6 in / 2 out, class-compliant mode for iOS
  - Record up to 13 tracks simultaneously
  - Recording format: WAV 44.1 kHz, 16-bit, mono or stereo
  - Recording media: SDHC cards 4 to 32 GB and SDXC cards 64 GB to 1 TB, class 10 or higher
  - Frequency response: minus 1.0 dB, 20 Hz to 20 kHz at 44.1 kHz
  - Equivalent input noise: EIN minus 124 dBu (IHF-A) at +70 dB, 150 Ohm input
  - Nine assignable sound pads across four banks, 13 pre-loaded sounds, user audio can be loaded
  - Onboard editing: trim, split and fade
  - Mix-minus on the remote-interview channel over TRRS, USB or the optional BTA-2 Bluetooth adapter
  - Power supply: 4 AA batteries (alkaline, lithium or rechargeable NiMH) or ZOOM AD-14 AC adapter, DC 5 V / 1 A, USB bus power supported
  - Battery life recording 44.1 kHz/16-bit/4ch to SD with phantom power off and 32 Ohm headphones: about 1.5 hours alkaline, about 3 hours NiMH 1900 mAh, about 5 hours lithium
  - Power consumption: 5 W
  - External dimensions: 295 mm (W) x 248 mm (D) x 61 mm (H)
  - Weight (unit only): 1.43 kg
  - Supplied with the AD-14 AC adapter and a quick guide
