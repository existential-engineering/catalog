description: iRig Mic Video is a universal digital shotgun microphone with a
  supercardioid polar pattern, gold-sputtered electret condenser capsule, and
  24-bit audio for recording on iPhone, iPad, Android, DSLR cameras, Mac, and PC.
details: |-
  iRig Mic Video features a gold-sputtered electret condenser capsule with a supercardioid polar pattern, providing focused audio capture ideal for video production, interviews, and vlogging. The built-in 24-bit A/D converter delivers high-quality digital audio directly to your device.

  The microphone includes a gain thumbwheel for real-time level adjustment, a direct monitor button, and a multicolor LED for status and audio level indication. A magnetic snap-on mount works with phone cases, while the included hot shoe mount attaches to DSLR cameras.

  Powered via USB when connected to a computer or mobile device. For DSLR use, a 3V CR1632 battery provides over 50 hours of operation. Includes Lightning, Micro-USB, USB-C, and DSLR cables plus a windscreen. Comes with iRig Recorder 3 LE for iPhone and iPad.
specs: |-
  - Condenser electret, 0.55" capsule
  - Polar pattern: supercardioid
  - Frequency response: 20 Hz - 20 kHz
  - Sensitivity: -40 dB, 10 mV/Pa
  - Maximum SPL: 125 dB
  - 24-bit A/D and D/A conversion
  - Sample rates: 44.1, 48, 88.2, 96 kHz
  - Gain range: adjustable over 47 dB
  - Headphone output: 1/8" TRS jack
  - DSLR camera output: 1/8" TRS jack
  - Power: USB powered; 3V CR1632 battery for DSLR (50+ hours)
  - Dimensions: 45 mm (1.77") x 130 mm (5.12") x 55 mm (2.17")
  - Weight: 65 g (2.29 oz)
