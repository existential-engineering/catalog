description: Artist Series edition of the Loomer fuzz and reverb workstation
  with artwork by Sarah Lipstate, carrying Hall, Reverse and Soft Focus reverb
  programs.
details: |-
  The Loomer pairs a heavy fuzz with a reverb section voiced for shoegaze textures, so the fuzz can be run under long washes of reverb from a single enclosure. A Blend control lets any of the reverbs run fully wet.

  Three reverb programs are on offer. Hall is a long ambient wash that can take octave regeneration in its feedback loop for an ascending shimmer. Reverse is modelled on the Yamaha SPX90 and Alesis MidiVerb II and is not a true reversed reverb: it reads through a delay line at successive points while rising in volume, and its Decay control steps through eight fixed times of 150, 200, 250, 300, 350, 400, 450 and 500 ms to set the rhythm at which notes return. Soft Focus approximates the Yamaha FX500 patch of the same name, a dense reverb with two parallel delays set to 250 ms and 380 ms.

  In Reverse mode the vibrato is envelope controlled over a range of 0 to 50 ms of time shift, and the tone control is modelled loosely on a Jazzmaster rhythm circuit, a low pass filter centred at 156.6 Hz. Playing hard produces a pitch bend in the manner of a Jazzmaster or Jaguar tremolo arm.

  This is the Artist Series edition made with Sarah Lipstate, who records as Noveller. The graphic is an augmented photo collage of hers, made by hand-painting 16mm film with India ink and acrylic paint, scanning it and reproducing it on Keeley's UV printers over a powder coated enclosure. Artist Series pedals also carry an Artist Series bottom print, and a portion of each sale goes to the artist.
specs: |-
  - Fuzz section plus three reverb programs: Hall, Reverse, Soft Focus
  - Hall reverb supports octave regeneration in the feedback loop
  - Reverse reverb modelled on the Yamaha SPX90 and Alesis MidiVerb II
  - Reverse Decay control steps through eight fixed times: 150, 200, 250, 300, 350, 400, 450 and 500 ms
  - Soft Focus is a dense reverb with two parallel delays at 250 ms and 380 ms
  - Envelope controlled vibrato in Reverse mode, 0 to 50 ms of time shift
  - Tone control is a low pass filter centred at 156.6 Hz
  - Blend control allows a fully wet reverb
  - Artist Series artwork by Sarah Lipstate, UV printed over a powder coated enclosure
  - Artist Series bottom print
