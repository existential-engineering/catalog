description: BopPad is a 10-inch four-zone MPE drum pad controller with Smart
  Fabric sensing and USB-C connectivity, sending MIDI note, velocity, pitch
  bend, pressure and continuous control from each zone.
details: |-
  BopPad is an electronic drum pad controller with accurate hit detection, velocity, continuous radius and pressure sensing. Four independently programmable zones output MIDI notes, velocity, pitch bend, pressure and location CCs, so samples, sound effects, pads and chords can be triggered from a drum set or a desk.

  A tuned elastomer surface covers a 10-inch circle of Smart Fabric sensor material, giving a traditional feel across a wide dynamic range, from light hand drumming to hard stick work. Sensitivity is user adjustable for playing with sticks, hands or fingers, and the pad can also be used as a conventional practice pad.

  The pad connects over USB-C and is supported on Windows and macOS. Control of 5-pin DIN MIDI hardware is possible with the optional KMI MIDI Expander, sold separately.
specs: |-
  - 10-inch 4-zone MPE electronic drum trigger pad
  - Each zone transmits MIDI note, velocity, pitch bend, pressure, and continuous control
  - Tuned elastomer surface over Smart Fabric sensor material
  - User adjustable sensitivity for sticks, hands, or fingers
  - USB-C connectivity
  - USB bus powered, no external power supply
  - Control of 5-pin DIN MIDI hardware with the optional KMI MIDI Expander (sold separately)
  - Supports Windows and macOS
