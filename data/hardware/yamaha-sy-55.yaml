description: >-
  The Yamaha SY-55 is a 16-voice digital workstation built on the AWM2
  sample-playback engine, marking one of Yamaha's first rompler workstations to
  move beyond the DX7-era FM synthesis.
details: |-
  Released in 1990, the SY-55 shared much of its architecture with the TG550 tone generator module,
  essentially adding a keyboard to that platform. It represented a significant shift for Yamaha,
  embracing 16-bit sample-based synthesis through the AWM2 system rather than the FM synthesis that
  had defined the company's synthesizers throughout the 1980s.

  The sound engine processes wave data at 32kHz and 48kHz with 24-bit internal processing and
  22-bit D/A converters, delivering audio quality that was competitive for its time. A library of
  74 individual ROM waveforms serves as the foundation for sound design, shaped through 12dB
  two-pole filters offering low-pass, high-pass, and band-pass modes with resonance.

  The voice architecture is notably deep, with four oscillators per voice, six envelope generators
  featuring delay and multiple rate/level parameters, and a versatile LFO with sample and hold
  capability. The 16-part multitimbral configuration supports complex arrangements, complemented by
  an 8-track sequencer with 8,000-note capacity across 8 songs.

  A built-in effects processor with 34 programmable programs covers reverb, delay, distortion, and
  more. The 61-key non-weighted keyboard responds to both velocity and aftertouch, and 128 patches
  (64 preset, 64 user) provide ample sound storage. MIDI In, Out, and Thru connections round out
  the connectivity.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 16 parts
  - Oscillators: 4 per voice
  - Sound Engine: AWM2 (16-bit, 32kHz/48kHz wave data)
  - Internal Processing: 24-bit
  - D/A Converters: 22-bit
  - Waveforms: 74 ROM waveforms
  - Filters: 12dB/octave (2-pole) low-pass, high-pass, band-pass with resonance
  - LFO: 1 with sample & hold and multiple waveshapes
  - Envelopes: 6 with delay and multi-stage rate/level
  - Sequencer: 8-track, 8,000 notes, 8 songs
  - Effects: 34 programmable programs (reverb, delay, distortion, etc.)
  - Memory: 64 preset, 64 user patches
  - Keyboard: 61 keys (non-weighted, velocity and aftertouch)
  - MIDI: In, Out, Thru
