description: >-
  The Kawai K5000 is a flagship digital synthesizer released in 1996, combining
  additive synthesis with PCM sampled waveforms and a unique 128-band formant
  filter. Featuring over 1,000 parameters per patch, a large LCD display, and
  real-time control knobs, it rivaled contemporaries like the Korg Trinity and
  Kurzweil K2500. Available as the K5000W workstation, K5000S keyboard, and
  K5000R rack module.
details: |-
  Released in 1996, the Kawai K5000 was the company's top-of-the-line music workstation digital synthesizer. Its bold, elegant design with a large LCD display and real-time controls rivaled contemporaries like the Korg Trinity and Kurzweil K2500. The K5000 combines additive synthesis using 64 harmonics per source with PCM sampled waveforms for layering and combining into a wide range of sounds.

  Despite having over 1,000 parameters per patch, programming is manageable once learned. The sound engine draws from 689 waveforms spanning synth, GM, and drum categories. A unique 128-band formant filter joins 24dB/octave lowpass and highpass filters for powerful sound shaping, complemented by extensive LFO modulation and envelope controls. On-board multi-effects with 4 algorithms and 32 different effects add final polish.

  The K5000S variant adds 12 dedicated knobs for hands-on control of filter, LFO, and envelope parameters, plus 4 user-definable knobs and 2 assignable switches. It also includes a 40-pattern arpeggiator with 8 user-definable patterns. The K5000W combines PCM and GM sound sets with additive synthesis and features a 40-track, 40,000-note sequencer. Notable users include Kraftwerk.

  A rack-mount version released in 1997 ships with the more stable OS 3.0 software and offers all the same power and flexibility as the keyboard models. The latest firmware version 4.03 is available as a free download from Kawai. Memory stores 200 patches and 64 performances.
specs: |-
  - Polyphony: 32 notes (K5000S/R additive only), 64 notes (K5000W: 32 additive + 32 PCM/GM)
  - Oscillators: Digital additive synthesis (64 harmonics per source) plus PCM samples
  - Waveforms: 689 total (123 synthesized, 341 GM, 225 drums)
  - Filter: 128-band formant filter, 24dB/oct low-pass and high-pass
  - LFO: 2 (1 dedicated to formant filter, 1 freely routable)
  - VCA: 1 ADSR per part with key scaling and velocity control
  - Effects: 4 algorithms, 32 effects
  - Sequencer: 40 tracks, 40,000-note capacity (K5000W only)
  - Arpeggiator: 40 patterns, 8 user-definable (K5000S/R)
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 200 patches, 64 performances
  - Multitimbral: 4 parts (K5000S/R), 32 parts (K5000W)
  - Control: MIDI
