id: WTVdnkYkG1FperRw0A55b
name: MF Deluxe
manufacturer: collings
primaryCategory: mandolin
url: https://collingsguitars.com/mandolins/mf-deluxe/
description: The MF Deluxe builds on the standard MF with upscale appointments
  including grained ivoroid neck and peghead binding, an ivoroid-bound ebony
  pickguard, and a gloss nitrocellulose lacquer top over a satin body finish. It
  features a fully-carved Adirondack spruce top and Eastern flamed maple back,
  sides, and neck.
details: |-
  The MF Deluxe is an F-style mandolin featuring an Adirondack spruce top with a gloss nitrocellulose lacquer finish on the top and satin finish on the back and sides, Eastern flamed maple back, sides, and neck, and premium appointments including ivoroid binding on the body, fingerboard, and peghead. It includes an ebony fingerboard with MOP dots, an ebony bridge with adjustable saddle, an ivoroid-bound ebony pickguard, and nickel Gotoh tuners with ivoroid buttons. The neck features a rounded V profile with a fully adjustable truss rod and compound fingerboard radius (5 1/2" to 11 5/8"). Ships with D'Addario EJ74 strings and a deluxe hardshell case.
specs: |-
  - Construction: F-style
  - Top: Adirondack spruce
  - Back/Sides/Neck: Eastern flamed maple
  - Soundhole: F-holes
  - Body Binding: Ivoroid (top)
  - Fingerboard Binding: Ivoroid
  - Peghead Binding: Ivoroid
  - Bracing: Tone bars
  - Bridge: Ebony with adjustable saddle
  - Fingerboard: Ebony with MOP dots
  - Nut Width: 1 1/8"
  - String Spacing: 1 9/16"
  - Neck Profile: Rounded V
  - Neck Joint: Dovetail
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Peghead Veneer: Ebony with MOP logo
  - Tuners: Nickel Gotoh with ivoroid buttons
  - Pickguard: Ebony with ivoroid binding
  - Tailpiece: Original tailpiece
  - Scale Length: 13 7/8"
  - Fingerboard Radius: 5 1/2" - 11 5/8" compound
  - Body Finish: Satin nitrocellulose lacquer with gloss top
  - Strings: D'Addario EJ74 (.011" - .040")
  - Case: Deluxe hardshell
  - Body Width: 9 15/16"
  - Body Length: 12 7/8"
  - Body Depth: 1 13/16"
  - Total Length: 27 7/16"
