description: >-
  Originally released in 1960 as 'The answer to every drummer's dream', the
  Super Ludwig series drums are reimagined for a new standard model. The Super
  model is chrome over brass shell while the Super Brass is a lacquered brass
  shell. Both models are trimmed in nickel hardware.
details: |-
  These two models fashion highly-collectible transition badge versions that were predecessors to the original standard 1960 models that featured chrome hardware. The revered tone of Ludwig seamless brass with a whole new look.
specs: |-
  - Seamless brass shell construction
  - Transition badge styling
  - Nickel-plated hardware
  - LB402BN — 6.5x14" Super Ludwig, chrome over brass (COB), nickel hardware
  - LB400BN — 5x14" Super Ludwig, chrome over brass (COB), nickel hardware
  - LB403 — 6.5x14" Super Brass, lacquered brass, nickel hardware
  - LB401 — 5x14" Super Brass, lacquered brass, nickel hardware
