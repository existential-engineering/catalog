details: |-
  The Gnat Deluxe was a significant upgrade to the original EDP Gnat, replacing the 25-key capacitive touch-sensitive keyboard with a standard 3-octave (37-key) keyboard. This addressed the most common playability complaint about the original design while retaining the same synthesis engine.

  The core sound generation remains identical to the original Gnat: a single digital oscillator with analog filter and envelope circuitry, lowpass resonant filtering with resonance, attack and decay envelope controls, and an LFO for pitch or filter modulation. EDP's proprietary digital control interface for linking to a Wasp or other EDP gear is retained.

  Designed by Chris Huggett, the Gnat Deluxe made the characterful analog bass and synth leads of the Gnat series more accessible to traditional keyboardists. MIDI retrofits are available.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 DCO (adjustable 2' to 32')
  - Waveforms: Ramp, square, enhance, noise (switchable)
  - LFO: 1 (sine, ramp, sawtooth, square, random)
  - Filter: 1 lowpass 12 dB/oct with resonance
  - Keyboard: 37 standard keys (3-octave)
  - Memory: None
  - Control: EDP proprietary digital socket, MIDI retrofits available
