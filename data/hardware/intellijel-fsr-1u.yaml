description: Add a pressure point to your modular The FSR (Force Sensing
  Resistor) senses touch and pressure to add another level of expression to your
  synth.
details: |-
  The FSR 1U is built around a custom fabricated FSR with an analog processing circuit. It allows you to generate a variable CV when you press on it (pressing harder generates a larger voltage) along with a corresponding gate signal.

  Guaranteed to add some fun, dynamic control over almost any kind of patch!
specs: |-
  - Width: 10HP
  - Depth: 23mm
  - Power consumption: 24mA @ +12V, 9mA @ -12V
  - Custom fabricated FSR (Force Sensing Resistor) pad
  - Outputs variable CV (proportional to pressure) plus a corresponding gate signal
