description: An enhanced take on the classic low-gain Marshall amplifier design,
  the Clean Little Secret features an overhauled tone stack with individual
  treble and bass controls replacing the original single tone knob. It delivers
  clean to edge-of-breakup tones with a refined op-amp output stage.
details: |-
  The Clean Little Secret is Catalinbread's refined take on the classic low-gain Marshall amplifier circuit, a foundational building block of the BB-style overdrive lineage. Where the original relied on a single tone knob, the Clean Little Secret introduces separate treble and bass controls that interact in a musically useful way: boosting both creates a mid-scoop character, while cutting both produces a mid-boost.

  The pedal covers a low-to-medium gain range, from near-clean operation through gritty edge-of-breakup tones. A Pre-Amp control governs the amount of overdrive fed into the circuit, while the Master volume sets the overall output level.

  Catalinbread selected a high-quality op-amp specifically chosen to remain clean and transparent at lower gain settings, breaking up in a natural, amp-like manner as the Pre-Amp control is advanced. This makes it equally useful as a clean boost, a light drive, or a platform for stacking with other pedals.
specs: |-
  - Power source: standard center-negative 9-18V DC power supply, very low current draw
  - Controls: Treble, Master, Bass, Pre-amp
  - Separate treble and bass bands in place of a single global tone control
