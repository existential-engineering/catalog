details: |-
  Eurorack PSU & Bus Board

  The Guru Gara Synth Eurorack PSU & Bus Board provides stable and reliable power distribution for Eurorack modular synthesizer systems. Designed to deliver regulated voltage rails and dependable performance, this power solution helps ensure the longevity and optimal operation of your modules. Key Features

  Power Distribution & Performance

  This Eurorack PSU & bus board delivers clean, regulated power to your modular system, helping modules perform consistently and reducing the risk of instability caused by insufficient or uneven power. With 1.25A available on both the +12V and -12V rails, it can support a substantial number of modules when properly planned. Please note that any current drawn from the +5V rail contributes to the total load on the +12V rail, and this should be considered when calculating overall system power requirements. Connectivity & Integration

  Nine standard 16-pin Eurorack ribbon cable connectors allow for easy connection of multiple modules, distributing both power and control signals (Gate and CV). The compact layout makes this PSU & bus board suitable for a variety of Eurorack case configurations. Build Quality & Requirements

  Each Guru Gara Synth Eurorack PSU & Bus Board is hand-built using quality components, ensuring reliable operation and attention to detail. This unit requires an external DC power adapter (not included). Please refer to the product images for supported input voltage and current requirements, and ensure the adapter can supply sufficient current for your full system load. Technical Specifications

  +12V: 1.25A

  -12V: 1.25A

  Important Note

  This product functions as a power distribution bus board with onboard regulation and requires a compatible external DC power adapter. Always calculate your system's total current draw carefully to avoid overloading the power rails and to protect your modules.
specs: |-
