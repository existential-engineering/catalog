description: >-
  The SX-240 is an eight-voice, fully programmable polyphonic analog synthesizer released
  in 1984 under the Teisco brand name in Japan, though manufactured by Kawai. Featuring
  two DCOs and a sub-oscillator per voice, it delivers a big, wide analog sound suited for
  leads, basses, brass, drones, pads, and strings. It competed with contemporaries like
  the Korg Polysix and Roland Juno 6/60 but received limited market attention as digital
  instruments gained prominence.
details: |-
  The SX-240 entered the market during a challenging period when digital instruments were gaining prominence, resulting in limited attention despite its considerable capabilities. It was manufactured by Kawai but released under the Teisco brand name in Japan, and features a very basic early MIDI implementation that receives on all channels.

    The synthesizer is driven by two DCOs and one sub-oscillator per voice, producing a big, wide, and full analog sound. It offers poly-8, poly-4, and mono modes, with mono mode enabling all 24 oscillators to stack into a single, extremely powerful sound. Eight SSM 2044 filter chips contribute to the instrument's powerful filter character, with the filter entering self-oscillation around values 98-99.

    An Ensemble effect functions as a chorus, making strings and pads especially warm and fluid, while a ring-modulation effect called Brass expands the sonic possibilities further. Split and Dual modes enable keyboard splits or layered patch combinations, and a built-in sequencer accommodates up to 1,500 notes across 8 memory slots. Both portamento and glissando effects are present, which was uncommon on synthesizers from this era.

    Patch editing uses a dedicated data-wheel with four scroll buttons for parameter selection, similar in approach to the Roland Alpha Juno or Moog Source. An LCD display supports alphanumeric patch naming, and LEDs indicate which parameter is being edited. Most units found second-hand have NI-Cad battery issues causing an inability to retain saved patches to memory, so battery replacement or Li-Ion conversion is recommended.
specs: |-
  - Polyphony: 8 voices
    - Multitimbral: Dual or Split modes
    - Oscillators: 2 DCOs and 1 sub-oscillator per voice
    - Waveforms: Saw, Sine, Pulse with PW and PWM
    - LFO: 1 LFO with 3 waveforms (saw, square, triangle); Speed, Delay, Reverse, and Depth controls; routes to DCOs, VCA, or VCF
    - Filter: 24 dB/oct four-pole lowpass (SSM 2044) with resonance, cutoff, envelope amount, and dedicated ADSR
    - Envelope: 1 VCA with HPF and ADSR envelope
    - Effects: Chorus, Hold, Portamento, Glissando
    - Sequencer: 1,500 note capacity with 8 memory slots
    - Keyboard: 61 keys
    - Memory: 48 tone patches
    - Control: MIDI In/Out/Thru
