description: The JS Series Dinky JS20 DKQ 2PT is an affordable electric guitar
  offering classic Jackson tone, looks, and playability at an accessible price
  point. It features a poplar body with quilted maple art grain top, a bolt-on
  maple neck with compound radius amaranth fretboard, and dual high-output
  humbucking pickups. The guitar is equipped with a 2-point fulcrum tremolo
  bridge and all-black hardware.
specs: |-
  - Body: Poplar with quilted maple art grain top, Dinky shape, gloss finish
  - Neck: Bolt-on maple with scarf joint and graphite reinforcement, satin finish
  - Scale Length: 25.5"
  - Fingerboard: Amaranth, 12"-16" compound radius
  - Frets: 24 jumbo
  - Inlays: Pearloid sharkfin
  - Nut: Black plastic, 1.6875" width
  - Headstock: Jackson pointed 6-in-line with white binding
  - Pickups: Jackson high-output humbuckers with ceramic magnets (HH)
