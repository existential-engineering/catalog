  - Bridge: 2-point fulcrum tremolo
  - Tuners: Jackson sealed die-cast
  - Hardware Finish: Black
  - Strings: Nickel-plated steel (.009-.042)
  - Available Colors: Transparent Blue, Transparent Black, Transparent Green, Tobacco Burst
