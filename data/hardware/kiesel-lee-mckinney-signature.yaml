description: A headless signature model for Lee McKinney of Born of Osiris,
  mixing the upper half of the Osiris with the lower half of the Zeus. The LM
  aims at the light weight of a headless instrument with the fuller sound of a
  typical guitar.
specs: |-
  - Model designation: LM
  - Construction: bolt-on with radiused neck heel, headless
  - Body: alder
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck widths: 1.69 in or 1.90 in at nut depending on configuration
  - Fingerboard: ebony with 20 in radius
  - Frets: 24 stainless steel jumbo, .110 in wide x .055 in tall
  - Scale length: 25.5 in
  - Bridge: Hipshot/Kiesel headless tremolo, .4125 in (10.5 mm) spacing
  - Pickups: direct-mount Kiesel Lee McKinney Illusionist bridge humbucker, Kiesel Lithium neck humbucker
  - Electronics: master volume control and 5-way blade selector
  - Inlays: Lee McKinney signature inlays, black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Body dimensions: 30.5 in long, 1.62 in thick, 12 in or 12.25 in wide
  - Weight: 5.25 lbs to 5.5 lbs
  - Strings: Elixir Nanoweb 1046E
