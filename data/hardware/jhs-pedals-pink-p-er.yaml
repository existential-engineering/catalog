description: A rare, discontinued compressor pedal built around a now-obsolete
  chipset, produced in a limited run of fewer than one hundred units.
details: |-
  We made less than one hundred of these and then stopped due to the chipset becoming obsolete. We would still make it but... we literally can't and that makes finding one on the used market about as awesome as striking oil in your front yard. They sell from $300 - $425 when we see them and we wish you the best of luck finding one.

  It runs at the standard 9v power like our other pedals and it loves long walks in the park.
