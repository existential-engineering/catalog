url: https://www.dangerousmusic.com/product/2bus-xt
description: 16-channel Active Analog Summing Mixer with X-Former and Coherence Processors
details: |-
  The totally re-engineered 2-BUS-XT delivers knock down kicks, vocals welded to the center, spacious sound stage, and an ultra high resolution depth of field that reveals everything, ultimately gluing your tracks together organically and effortlessly.

  Leveraging the summing circuitry of the 2-BUS+, it adds two unique custom color circuits designed by analog designer Chris Muth.

  The transformers were chosen to add a tasteful hit of 2nd order harmonics for lower midrange warmth while preserving top-end clarity.

  Coherence elevates the harmonic content of signals progressively by bringing up the detail as the levels are reduced, then allowing you to blend this result with the source mix, parallel compression style.

  Assign none, either or both to channels 15-16 or the mix buss all on true hard wired bypasses.
specs: |-
  - Channel Count: 16-channel active analog summing
  - Form Factor: Single rack space (1U), hand-built in USA
  - Frequency Response: ±0.1dB from 20Hz-50kHz
  - Total Harmonic Distortion: 0.004% in audio band
  - Intermodulation Distortion: 0.004% IMD60 4:1
  - Crosstalk @ 1kHz: -109 dB
  - Noise Floor: -82 dBu total energy in audio band
  - Max Level: >+27 dBu
  - Nominal Operating Level: +4 dBu
  - Input Impedance: 12 kOhm balanced
  - Output Impedance: 50 Ohm balanced (600 Ohm drive capable)
  - Power Consumption: 25 watts
  - Tone Circuits: X-FORMER III and COHERENCE, true hard-wired bypass
  - Expandable with other 2-BUS models and D-BOX+
