description: >-
  The Roland CMU-800 is a compact computer-controlled music unit featuring four-channel
  analog sound generation with preset voices for melody, bass, chords, and rhythm.
  Released in 1983, it connects to an Apple II or PC via a ribbon cable interface card,
  using sequencer software modeled after Roland's MC-8 and MC-4 to program compositions.
  The drum section draws from the TR-606 design while the bass voice mirrors the TB-303,
  making it a quirky and affordable source of classic Roland analog sounds.
details: |-
  The CMU-800 serves as a bridge between Roland's analog hardware legacy and the emerging world of computer-based music production. It provides separate outputs for melody, bass, chord, rhythm, and a mixed signal, with the chord section offering four-note polyphony alongside monophonic bass and melody voices. The unit's drum section borrows its sound design from the TR-606 Drumatik, while the bass voice is reminiscent of the TB-303 Bass Line, though sound adjustments are limited to software control.

    The front panel features knobs for portamento, sustain, and decay across the different voice sections, along with individual volume sliders for each instrument and a master volume control. Eight CV/gate outputs on the rear panel allow integration with external analog synthesizers and equipment, extending its capabilities beyond the built-in voices. The sequencer software employs a music programming method similar to Roland's professional MC-8 and MC-4 MicroComposers.

    While the CMU-800 is a limited instrument by modern standards, it holds a unique place in music technology history as an early example of computer-controlled music hardware. Its primary limitation today is the requirement for functioning vintage Apple II or compatible PC hardware with the correct software to operate. The unit has found fans among electronic musicians, notably being used by the psytrance act Astral Projection.
specs: |-
  - Polyphony: Monophonic to 4-voice polyphonic (chord section)
    - Sound sources: Poly-Chord, Mono Bass, Mono Melody, Analog Drum
    - VCA controls: Sustain and Decay
    - Front panel: Portamento, Sustain, and Decay knobs; individual volume sliders per voice; master volume
    - Outputs: Separate melody, bass, chord, rhythm, and mix outputs
    - CV/Gate: 8 CV/gate outputs for external analog equipment
    - Computer interface: Ribbon cable with attached interface card
    - Compatible computers: Apple II, PC
    - Sequencer software based on MC-8/MC-4 programming method
    - No built-in keyboard
    - No internal memory
