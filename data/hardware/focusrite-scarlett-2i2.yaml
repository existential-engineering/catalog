description: "The original studio-quality 2-in, 2-out interface, Focusrite
  Scarlett 2i2, has been remastered for the artist."
details: |-
  The Scarlett 2i2 is the original studio-quality 2-in, 2-out interface, remastered for the artist. It features two ultra-low-noise microphone preamps with front-panel combo inputs, supporting microphone, line, and instrument-level sources for direct connection of guitars and synthesizers. The interface delivers professional studio-grade sound with up to 120dB dynamic range on line outputs.

  The device includes automatic level management through Auto Gain and Clip Safe features, which prevent clipping and optimize recording levels without user intervention. Two Air preamp modes — Presence mode for high-end boost and Harmonic Drive mode for mid-range enhancement — provide console-quality sound shaping at the input stage.

  The package includes comprehensive software: Ableton Live Lite, Pro Tools Intro+, Cubase LE, and the Hitmaker Expansion bundle featuring instruments and effects from industry leaders like Native Instruments, Softube, and XLN Audio.
specs: |-
  - 24-bit / 192 kHz conversion
  - Two ultra-low-noise mic preamps with 69dB gain range
  - -127dBu EIN, 116dB dynamic range on preamps
  - 120dB dynamic range on line outputs
  - Auto Gain and Clip Safe for automatic level management
  - Air mode with Presence and Harmonic Drive options
  - 4 x 2 simultaneous I/O including Loopback
  - 48V phantom power
  - USB-C bus-powered (900mA)
