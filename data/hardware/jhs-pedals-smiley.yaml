description: A sonically faithful silicon Fuzz Face recreation from the JHS
  Legends of Fuzz series, inspired by first-era Arbiter silicon fuzz circuits
  with an added JHS Mode for high-gain gated fuzz.
details: |-
  Part of the 'Legends Of Fuzz' series — a collection of historic, rare, and sought-after fuzz circuits. The JHS Smiley is a sonically faithful recreation of first-era silicon Arbiter Fuzz Face circuits (post-1969). Several vintage units were analyzed to capture the magic of this era. The Smiley is clear and defined, straddling the line between distortion pedal and searing sustain, with low end and crisp mid-range bite. Like a vintage Fuzz Face, it cleans up effortlessly when the guitar's volume is rolled back. Controls are Volume (overall output level) and Fuzz (distortion amount). Side 'Mode' button engages JHS Mode — high gain / gated fuzz territory.
