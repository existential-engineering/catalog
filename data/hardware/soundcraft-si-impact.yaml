description: 80-input Digital Mixing Console and 32-in/32-out USB Interface and iPad Control
details: |-
  FREE Soundcraft Si Impact 2.0 Firmware Update Doubles Total Channels to Mix! In our continual quest to provide more value to Soundcraft customers, we are happy to announce an incredible free update to the Si Impact that doubles your total channels to mix from 40 to 80! The newest firmware— V2.0 Build 0012—optimizes performance with the free ViSi Remote iOS application and clarifies terminology when routing to or from stage boxes. Si Impact. Innovative digital mixing with uncompromised audio quality Drawing on over 40 years experience in live sound mixing, Si Impact brings the latest digital mix innovations together with the unrivalled sound quality of Soundcraft. Designed to be as simple as an analog mixer, but offer radical workflow enhancements such as the unique FaderGlow system, massive DSP power, and a pristine 32-in/32-out USB audio interface, Si Impact delivers digital live sound mixing and recording for those who refuse to compromise on audio quality. * USB Interface Compatibility: PC: Supports Windows 7, Windows 8 and Windows 10. Mac: Supports Mac OS 10.7.x Lion through 10.11.x El Capitan
