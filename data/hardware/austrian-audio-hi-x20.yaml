description: The Austrian Audio Hi-X20 are professional closed-back over-ear
  headphones delivering pro-level clarity in a compact, everyday design.
  Featuring Hi-Xcursion technology with a 44mm driver, a ring magnet system for
  superior airflow, and a copper-clad aluminum voice coil, the Hi-X20 produces
  tight lows, honest mids, and crisp highs with fast transients and minimal
  distortion.
details: |-
  The Hi-X20 uses Austrian Audio's Hi-Xcursion driver technology with a 44mm driver and ring magnet system designed for superior airflow around the voice coil. The copper-clad aluminum voice coil contributes to fast transient response and low distortion. Closed-back design provides passive isolation. Detachable 3m cable with 3.5mm connector. VGP Awards 2025 and 2026 winner.
specs: |-
