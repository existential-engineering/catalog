url: https://www.lehle.com/lehle-dual-expression
description: The LEHLE DUAL EXPRESSION is an active, wear-free expression pedal
  equipped with a precise magnetic sensor, with two outputs that control nearly
  all common devices with expression inputs.
details: |-
  Express yourself, twice. The LEHLE DUAL EXPRESSION is an active, wear-free expression pedal equipped with a precise magnetic sensor. Known from the LEHLE VOLUME pedals, this sensor uses the Hall effect, named after Edwin Hall, to measure the strength of magnetic fields. The Hall sensor is accurately calibrated to the built-in magnet and the control range of the pedal, where the pedal moves only the magnet, whose distance is measured by the Hall sensor.

  Two digital potentiometers, working with analogue voltages, are used for the precise and reliable generation of the expression data. This technology allows distinctly more accurate operation than is offered by conventional expression pedals with mechanical potentiometers. There is no mechanical wear, avoiding the need for maintenance or complicated adjustments.

  Both outputs can control nearly all common devices with expression inputs from 5k to 100k, regardless if TS, TRS or RTS, and the polarity can be switched and stored using the soft-push buttons. Alternatively, the 10k output can be set to work as a latching or momentary switch, if the pedal is pushed in fully toe position. The channel of an amp can then be changed or, connected to a switch-input of a digital device, any desired function can be controlled.

  Via the USB socket the LEHLE DUAL EXPRESSION can be calibrated, edited and updated with the free online editor LEHLE VERWALTER, and it sends MIDI data to a computer in order to control MIDI-compatible software or any hardware device offering a USB host.

  In use the pedal is extremely smooth and steady under foot, as it is equipped with low-friction bearings of a high-performance polymer. By means of an adjusting screw the mobility of the pedal can be modified with great precision. Compared to the LEHLE MONO VOLUME the weight was reduced by 50% and the size by 35%, with the same rugged stability, and it is 2 cm flatter while the pedal range stays the same.
specs: |-
  - Expression pedal with 2 outputs
  - Controls all common devices with expression inputs from 5k to 100k, TS, TRS or RTS
  - Magnetic Hall-effect sensor technology, without mechanical wear
  - Precise control from digital potentiometers
  - Switchable and storable polarity via soft-push buttons
  - 10k output can alternatively work as a latching or momentary switch in toe position
  - MIDI via USB
  - Calibration, editing and updates via the free online editor LEHLE VERWALTER
  - Input voltage rectified, filtered, stabilized and doubled to 18 V internally
  - Low-friction high-performance polymer bearings with an adjusting screw for pedal mobility
  - 50% lighter and 35% smaller than the LEHLE MONO VOLUME
