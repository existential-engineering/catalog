description: The CSIDMAN Ghost is a digital delay with a 100% analog dry path
  that skips, stutters and glitches like a scratched CD. It combines the
  original CSIDMAN's Latch and Cuts controls into a single knob and adds a Ghost
  control, a sample rate reducer that infects the repeats for spectral granular
  delay tones.
details: |-
  The CSIDMAN Ghost is a haunted revision of Catalinbread's CSIDMAN glitch delay. The Latch and Cuts controls of the original have been combined into one knob, and the new Ghost control introduces a sample rate reducer that infects the repeats for some truly spectral granular delay tones.

  The first thing to keep in mind about the CSIDMAN is that it completely embraces and makes no apologies for the fact that it is digital (though it does have a 100% analog dry path). Digital is the CSIDMAN's aesthetic: as a delay pedal, it strives to reproduce echoes as true to the input as possible without filtering. When you utilize its scratched-disc, stuttery, and glitchy behaviors, it is pseudo-random, yet gives you a certain amount of "control" over the randomness. The idea of an old skipping portable CD player is built into a digital delay pedal that not only does normal delay sounds (at CD quality) but can also skip, stutter, and glitch just like that old CD player.
specs: |-
  - Power source: negative-tip DC, 9 to 18 volts; does not run on batteries
  - Controls: Feed, Mix, Ghost, Cuts/Latch, Time
  - Max delay time: ~700ms
  - 100% analog dry path
  - Cuts/Latch combines the two controls of the original CSIDMAN into one knob
