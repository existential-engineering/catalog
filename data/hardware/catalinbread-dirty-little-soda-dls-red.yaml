description: The Dirty Little Soda (DLS Red) is a hotter take on Catalinbread's
  Marshall-voiced Dirty Little Secret foundation overdrive. A more refined set
  of gain stages cuts through the low-mids of the original, with more gain
  across both modes and a more hi-fi EQ section.
details: |-
  The Dirty Little Soda takes its theme from the carbonated-beverage-as-status-symbol, a tribute to the soda du jour. The same status applies to the pedal itself, an instant tonal punch that will elevate your standing in the band.

  If the classic Dirty Little Secret MKIII is a war-tested Marshall plexi sidearm, Catalinbread's DLS Red is a finely-tuned and well-oiled (figuratively, of course) gain machine distilled into a more potent and volatile formula.

  Featuring a more refined set of gain stages that cuts through the low-mids of the original and delivers an extended barrage of punch and clarity, the DLS Red calls shotgun in the truck that is your pedalboard's dirt section. Catalinbread's flagship DLS circuitry has been modified to give you more of everything you love about the original with a touch more blistering, amp-smashing gain across both modes, as well as a more hi-fi EQ section and a fully-balanced—yet still very much Marshall—tonal profile.
