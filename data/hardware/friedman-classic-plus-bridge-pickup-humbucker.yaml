details: |-
  The Friedman Classic+ is an extension of the Friedman Classic Pickup line. The Classic+ is wound hotter than the Classic humbucker, which gives the pickup a slightly crunchier tone in higher gain environments. The Classic+ features Alnico 5 magnets along with the Classic humbucker and Classic 90 models. The Friedman Classic+ humbucker is a perfect match for any guitarist looking for a higher output pickup while also achieving articulate tonal clarity.

  When Dave Friedman and Grover Jackson were designing the Friedman line of guitars, a lot of thought was put into every aspect of the build, especially the pickups. Inspired by both modern and vintage guitar tones, Dave wanted to make sure that the pickups used in all Friedman guitars delivered the exact tone he envisioned. With Dave's vision and Grover's unsurpassed skills, the Friedman Classic Pickup line was born.

  The Classic+ is offered in the bridge position and reads 8.2k, against 7.9k for the standard Classic bridge humbucker. It is four-conductor, so it can be wired for coil splitting, series or parallel operation as well as standard humbucking, and it is hand built in the USA by Grover Jackson in black, zebra or nickel.
specs: |-
  - DC resistance: 8.2k bridge
  - Alnico 5 magnets
  - 4 conductor lead wire
  - 80/20 wax potted
  - Custom voiced by Dave Friedman
  - Made in the USA by Grover Jackson
  - Cover colour options: black, zebra, nickel
