description: Legendary 100W all-valve guitar amplifier head, meticulously handwired at Marshall's Bletchley, England factory. The 1959 Handwired delivers the classic Marshall tone of the mid to late 1960s with the same overdrive and crunch as the originals, using authentic parts and methods. Two bridgeable channels with high and low sensitivity inputs each, a four-knob EQ (Treble, Middle, Bass, Presence) and dual volume controls drive its unmistakable high-gain distortion at high volume — built for spacious venues.
details: |-
  The 1959 Handwired head represents a direct connection to the celebrated era of the mid to late 1960s. This re-issue amp delivers that classic Marshall tone with the same overdrive and crunch, using the authentic parts and methods to construct it. The louder you play, the better it sounds.

  The 1959 Handwired has played a significant role in shaping the classic rock sound of the late 60s and early 70s. Many iconic rock recordings feature the Marshall Super Lead, contributing to its legendary status, and the amp offers the high gain distortion tones that have defined the rock music landscape for decades.

  This instantly recognisable, classic Marshall tone is driven by two ECC83 preamp valves, an ECC83 phase splitter and four EL34 valves in the power amp. Two bridgeable channels let you create your own sound by blending the two voices.

  Originally designed for high volume, the 1959 Handwired has retained this characteristic throughout the decades, so it suits spacious venues where presence has to carry.

  It is meticulously constructed and handwired at Marshall's Bletchley, England factory, built to stay true to the spirit of Marshall and its timeless design details.
