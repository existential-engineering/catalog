description: Legendary 100W all-valve guitar amplifier head, meticulously
  handwired at Marshall's Bletchley, England factory. The 1959 Handwired
  delivers the classic Marshall tone of the mid to late 1960s with the same
  overdrive and crunch as the originals, using authentic parts and methods. Two
  bridgeable channels with high and low sensitivity inputs each, a four-knob EQ
  (Treble, Middle, Bass, Presence) and dual volume controls drive its
  unmistakable high-gain distortion at high volume — built for spacious venues.
details: |-
  - Handwired in Bletchley, England
  - All-valve circuit (2 x ECC83 preamp, 1 x ECC83 phase splitter, 4 x EL34 power)
  - Two bridgeable channels (Normal and High Treble)
  - High and low sensitivity inputs on each channel
  - Classic four-knob EQ (Treble, Middle, Bass, Presence)
  - Two speaker outputs, selectable 16Ω / 8Ω / 4Ω load
  - Voltage selector on the back panel for international use
  - Reissue of the legendary mid-to-late-1960s Super Lead 100
specs: |-
  - Model: 1959HW
  - Range: Handwired
  - Output Wattage: 100W
  - Channels: 2, bridgeable
  - Technology: All-valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 4 x EL34
  - Controls: Volume I, Volume II, Treble, Middle, Bass, Presence
  - Effects: None
  - Effects Loop: No
  - Inputs: 4 x 1/4" jack instrument inputs (high/low sensitivity)
  - Outputs: 2 x 1/4" jack speaker outputs, selectable 16Ω / 8Ω / 4Ω load
  - Product Height: 305 mm / 12"
  - Product Width: 740 mm / 29.1"
  - Product Depth: 210 mm / 8.3"
  - Weight: 21.4 kg / 47 lb
  - Country Of Origin: Designed and engineered in UK. Made in UK.
