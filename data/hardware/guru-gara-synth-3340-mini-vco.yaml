details: |-
  3340 Mini VCO

  The 3340 Mini VCO Eurorack PCB and Front Panel Kit is a compact, feature-rich voltage-controlled oscillator designed around the legendary CEM3340 / AS3340 core. Offering classic analog waveforms in a space-saving 6HP format, this mini VCO delivers stable tuning and unmistakable vintage character while remaining affordable and approachable for experienced DIY builders. Designed as a streamlined alternative to full-featured 3340 oscillators, the Mini VCO focuses on essential functionality without sacrificing sound quality or modulation flexibility. Key Features

  Waveforms & Sound Character

  The 3340 Mini VCO provides two versatile waveform outputs:

  This flexible output configuration makes the module suitable for bass lines, leads, FM experiments, and modulation duties. Pulse Width & CV Control

  A dedicated Pulse Width (PW) potentiometer allows precise shaping of the square wave. When a control voltage is patched into the PW CV input, the PW knob functions as a CV amount control, enabling dynamic modulation from LFOs, envelopes, or sequencers for evolving and expressive sound design. Compact, Affordable & DIY-Friendly

  Designed with efficiency and accessibility in mind, the 3340 Mini VCO delivers the unmistakable sound of the 3340 oscillator in a smaller footprint and at a lower cost than full-sized designs—without compromising stability or musicality. This module is well suited for intermediate to advanced builders looking to expand their oscillator lineup with a reliable, classic analog voice. Need help with tuning and setup? Read the 3340 VCO Calibration Guide for step-by-step calibration instructions and tracking tips. Technical Specifications

  Skiff Friendly Module

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category.
