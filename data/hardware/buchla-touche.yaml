description: >-
  The Buchla Touche is an exceptionally rare hybrid synthesizer from 1978 featuring 8 voices of
  polyphony from 24 digital oscillators, a standard 61-key piano keyboard, and digital patch
  programming via Buchla's proprietary FOIL language, with only four units ever manufactured.
details: |-
  Built around 1978, the Buchla Touche stands as one of the rarest synthesizers ever produced,
  with only four units known to exist. It represents a significant departure from Don Buchla's
  usual design philosophy, featuring a conventional 61-note piano-style keyboard rather than the
  touch-plate controllers found on other Buchla instruments. This was a deliberate choice to
  appeal to performing musicians accustomed to traditional keyboard layouts.

  The Touche employed a hybrid architecture combining analog audio circuitry with digital computer
  control for programming and patch management. Its 24 digital oscillators, three per voice,
  provided stable tuning and a wide sonic range across eight voices of polyphony. The keyboard
  supported split and layering configurations, and a three-way touch-sensitive controller enabled
  expressive pitch bending and modulation during performance.

  Patch programming used Buchla's proprietary FOIL (Far Out Instrument Language), entered via the
  front panel but requiring an external monitor for display. Up to 32 patches could be stored for
  instant recall, with additional storage available via cassette tape. The instrument communicated
  via CV/Gate connections. Its extreme rarity and historical significance make it one of the most
  sought-after instruments in synthesizer collecting.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 24 digital (3 per voice)
  - Filter: Yes
  - Keyboard: 61 keys (piano-style with split/layering)
  - Controller: 3-way touch-sensitive pitch bend and modulation
  - Memory: 32 patches + external cassette tape storage
  - Programming: FOIL (Far Out Instrument Language), external monitor required
  - Effects: None
  - Connectivity: CV/Gate
  - Units produced: 4
  - Date produced: 1978
