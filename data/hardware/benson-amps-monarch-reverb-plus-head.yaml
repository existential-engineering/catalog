description: Head version of the 15-watt Monarch Reverb Plus with tube-driven
  power scaling and the full Chimera tone stack.
details: |-
  The Monarch Reverb Plus incorporates a novel tube-driven power scaling circuit
  powered by a 6L6 power tube configured as a voltage regulator. This allows plate
  resistance to remain in the power supply (despite the lack of a tube rectifier),
  delivering sag and harmonic richness at any volume. The maximum 15-watt setting
  bypasses the 6L6 for pure solid state rectification. Power ranges from 1/2 watt
  to 15 watts.

  Features the full Chimera tone stack instead of a voice switch. The reverb head
  fits the Benson 1x12 and horizontal 2x12 cabinets. Also available as a 1x12
  combo. Handmade in Portland, OR.
specs: |-
  - Power output: 1/2 watt to 15 watts (switchable via tube-driven power scaling)
  - Tubes: 2x JJ 6V6 (power), 2x JJ 12AX7 (preamp), 1x JJ 12DW7 (reverb driver), 1x JJ 6L6GC (voltage regulator)
  - Speaker outputs: 1x 8 ohm, 1x 16 ohm
  - Foot-switchable reverb
  - Chimera tone stack
  - Point-to-point construction on terminal strips
  - Custom Soursound transformers with wax-potted output transformer
  - Jupiter Yellow Capacitors
  - Dovetailed pine cabinet
  - Dimensions: 21"W x 11"H x 8.5"D, 21 lbs
