description: The HBS-40 is the official Hellfest portable Bluetooth speaker,
  powered by Ashdown. It is a compact 2.0 stereo speaker with two 3-inch
  full-range drivers delivering 2 x 20W, wireless audio for up to 8 devices with
  auto-reconnect, a 3.5mm AUX input, a USB player supporting MP3, WAV and FLAC,
  and True Wireless Stereo pairing to link two units. A rechargeable battery
  with USB-C charging keeps it portable, and it carries the iconic Ashdown VU
  meter, LED controls and Hellfest-inspired styling.
details: |-
  Official Hellfest portable Bluetooth speaker powered by Ashdown. 2.0 stereo audio system with independent left/right channels and two 3-inch full-range drivers. Output power 2 x 20W. Frequency response 65 Hz - 20 kHz. Bass control +/-12 dB at 100 Hz; treble control +/-12 dB at 4 kHz. Wireless audio connects up to 8 devices with auto-reconnect to the last source. 3.5mm AUX input for wired playback. USB player for MP3, WAV and FLAC with resume and repeat modes. TWS (True Wireless Stereo) pairs two speakers for expanded stereo. Rechargeable battery with charge-level and low-battery alerts. USB-C charging (5W minimum, up to 30W USB PD fast charging). Iconic Ashdown VU meter, intuitive LED controls, Hellfest-inspired design. Cabinet material MDF and metal (iron). Dimensions 26 x 19 x 15 cm (W x H x D). Net weight 4.0 kg.
specs: |-
  - Audio system: 2.0 stereo (independent left/right)
  - Speakers: two 3-inch full-range drivers
  - Output power: 2 x 20W
  - Frequency response: 65 Hz - 20 kHz
  - Bass control: +/-12 dB at 100 Hz
  - Treble control: +/-12 dB at 4 kHz
  - Bluetooth: connects up to 8 devices with auto-reconnect
  - AUX input: 3.5mm jack
  - USB player: MP3 / WAV / FLAC with resume and repeat
  - TWS (True Wireless Stereo) pairing of two units
  - Rechargeable battery with charge-level and low-battery alerts
  - USB-C charging (5W min, up to 30W USB PD)
  - Cabinet: MDF and metal (iron)
  - Dimensions: 26 x 19 x 15 cm (W x H x D)
  - Weight: 4.0 kg
