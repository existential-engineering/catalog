id: GORtVrYxkh7PdRPsevGtQ
name: Portico II 5022 Dual Mic Pre
manufacturer: rupert-neve-designs
primaryCategory: preamp
categories:
  - outboard
url: https://rupertneve.com/products/5022
description: The 5022 is a dual mic preamp module for the Rupert Neve Designs
  5088 console, featuring two class-A, electronically balanced mic preamps with
  variable high-pass filters, 48V phantom power, polarity reverse, and
  Silk/Texture controls for harmonic shaping. Designed to maximize the number of
  inputs available in a single 5088 Penthouse Module.
details: |-
  The 5022 is a Penthouse Module designed for the Rupert Neve Designs 5088 console. It provides two independent class-A mic preamps in a single module slot, giving the engineer the highest mic-pre density available in the 5088 format.

  Each channel features a 12-position rotary gain control in 6 dB steps plus a ±6 dB trim, a variable high-pass filter (20 Hz to 250 Hz), 48V phantom power, polarity reverse, MIC/LINE selection, and an 8-segment LED output meter.

  The Silk/Texture circuit lets the engineer accentuate the harmonic character of the custom output transformer. Red Silk emphasizes the mid and high frequencies, Blue Silk emphasizes the low and low-mid frequencies, and the continuously variable Texture control pushes saturation up to roughly 4-5% THD at maximum. A 5088 console can be populated with 5022 modules alone or mixed with other Penthouse Modules to dial in classic or modern tonal characteristics.
specs: |-
  - Mic Input Impedance: 2200 ohms
  - Mic Frequency Response: ±0.2 dB (below 5 Hz to 50 kHz @ 30 dB gain)
  - Mic Noise (22 Hz-22 kHz): -101 dBu @ unity, -94 dBu @ 30 dB gain, -61 dBu @ 66 dB gain
  - Mic EIN: -124 dBu @ 30 dB gain
  - Mic Max Input: +24 dBu @ 1 kHz
  - Mic THD+N: 0.002% typical @ 1 kHz
  - Line Input Impedance: 10 kOhm
  - Line Frequency Response: ±0.1 dB (16 Hz-34 kHz)
  - Line Max Input: +26.3 dBu @ 1 kHz
  - Dimensions: 1.75" W × 8.75" D × 9.4" H
  - Weight: 3.5 lbs
