description: Mixtrack II 2-Channel DJ Controller.
details: |-
  Start mixing today with a cutting-edge DJ system from the world's #1 DJ brand. From Numark, the world's leading creator of DJ technology, comes Mixtrack II—now with a streamlined design and an expanded layout of professional controls, including 16 backlit multifunction drum pads and illuminated touch-activated platters. Connect to your computer and start DJing today. Get your hands on Mixtrack II's extensive layout of DJ controls, which includes automatic beat sync, hot cues, and looping. Add effects like flanger, phaser, and echo, and experience your music like never before.

  Mixtrack II comes tailor-made for dynamic performance. Create loops, launch samples, and control hot cues with the 16 backlit rubber drum pads. Instantly switch between Loop Mode, Sample Mode, and Hot Cue Mode. Mixtrack II's new slimline low-profile design is made to be played with a complete mixer section, precise crossfader, 3-band EQ, and dedicated music library navigation controls. You'll be able to spend more time interacting with the music and less time staring at the computer screen. Pitch and Sync controls are onboard for seamless and easy mixing as well as 16 dedicated effects controls.

  Get precise control over every track and every transition with Mixtrack II's advanced low-profile platters. Both are capacitive and dual-zone, giving you the ability to scratch or stop a track simply by touching the top of the platter, while at the same time allowing you to adjust the pitch by manipulating the platter from the side.
specs: |-
  - 16 backlit rubber drum pads with Loop Mode, Sample Mode, and Hot Cue Mode
  - Touch-activated illuminated platters for precise scratching and control
  - Complete mixer section with a crossfader, 3-band EQ, and music library navigation controls
  - 16 dedicated effects controls to add and manipulate flanger, phaser, echo, and more
  - Pitch and Sync controls for seamless and easy mixing
  - Standard MIDI for use with most popular DJ software
  - Class-compliant with both Mac and PC; no drivers or updates required
  - USB-powered; no power adapter required
  - Dimensions: 10.4 x 18.3 x 2.0 inches
  - Weight: 4.5 lbs
  - Power: Bus powered (USB)
  - Communication Protocol: MIDI
