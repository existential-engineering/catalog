details: |-
  The Microtubes B3K V2 is a bass overdrive pedal combining brutality and clarity, drawing on the natural dynamics and organic compression of vintage tube amps and tape machines. This revision improves on the original with enhanced tonal control and midrange restoration.

  The Level control sets the volume of the overdriven signal, while the Drive control sets the amount of saturation. The Blend control mixes the clean input signal back in with the overdriven signal, preserving low-end definition.

  A Tone knob provides a variable low-pass filter from 3kHz to 8kHz (replacing the original's attack switch), and a Mid Boost gives a subtle 6dB boost from 300Hz to 1kHz to help you cut through a mix. The Grunt switch engages a massive low-end boost to thicken the sound.

  The pedal runs on a regulated 9V DC adapter with a center-negative plug.
specs: |-
  - Bass overdrive pedal with vintage tube and tape dynamics
  - Level control sets the volume of the overdrive signal
  - Drive control sets the amount of saturation
  - Blend control mixes the clean signal back in
  - Tone knob: variable low-pass filter, 3kHz to 8kHz
  - Mid Boost: subtle 6dB boost from 300Hz to 1kHz
  - Grunt switch: massive low-end boost
  - Dimensions: 75mm W x 111mm L x 43mm H, 250g
  - Power: regulated 9V DC, center-negative, 20mA
