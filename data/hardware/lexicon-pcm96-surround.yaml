description: Parallel Stereo and Surround Reverb/Effects Processor w/ Analog & Digital I/O.
details: |-
  The PCM96 Surround is Lexicon's reference-class stereo and surround reverb/effects processor, building on the PCM96 with additional presets, expanded configuration flexibility, and enhanced I/O. It delivers parallel stereo and surround reverb and effects processing for high-end music production, post-production, and live sound applications.

  The unit offers 32-bit floating-point processing at sample rates up to 96kHz, with more than 2,200 factory presets and 768 user preset locations. Internal storage is supplemented by a Compact Flash slot. A library of 50 algorithms covers both stereo/surround treatments (Room, Hall, Chamber, Random Delay, Classic, Plate, Dual Delay, Ambience, Resonant Chords, Chorus/Flange, Concert Hall, Pitch, Signal Generator) and dedicated mono variants (Chamber, Hall, Plate, Room, Chorus/Flange, Dual Delay, Random Delay, Random Hall, Resonant Chords, Pitch, Signal Generator).

  Two physical configurations are available. The standard PCM96 Surround ships with two DB25 connectors carrying 6-channel analog I/O plus one DB25 carrying 6-channel AES/EBU digital I/O, making it suitable for hybrid analog/digital surround rigs. A digital-only configuration is offered with six XLR pairs of AES/EBU I/O. Both variants share BNC word clock input, MIDI In/Out/Thru, and Ethernet for remote control via the PCM Native control software.

  The PCM96 Surround integrates with the bundled PCM Control & Plugin software (Mac OS X) and HiQnet System Architect (Windows) for remote configuration, preset management, and DAW automation.
specs: |-
  - 32-bit floating-point internal processing
  - Sample rates up to 96 kHz
  - Over 2,200 factory presets
  - 768 user preset locations
  - Compact Flash storage support
  - 50 reverb/effect algorithms (stereo, surround, and mono variants)
  - DB25 6-channel analog I/O (standard configuration)
  - DB25 6-channel AES/EBU digital I/O (standard configuration)
  - 6 XLR AES/EBU stereo pairs (digital-only configuration)
  - BNC word clock input
  - MIDI In / Out / Thru
  - Ethernet remote control
  - 1U rack-mountable chassis
  - PCM Control & Plugin software (Mac)
  - HiQnet System Architect support (Windows)
