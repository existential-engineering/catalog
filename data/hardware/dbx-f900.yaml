details: |-
  The dbx F900 is a feedback suppressor module designed for the dbx 900 Series modular rack system. It provides automatic feedback suppression for live sound applications.

  As part of the 900 Series, the F900 fits into a dbx 900 host chassis alongside other 900 Series modules for a fully customizable signal processing rack.

  Note: This product is discontinued.
