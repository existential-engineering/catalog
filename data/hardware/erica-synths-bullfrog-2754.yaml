description: Educational electronic music instrument.
details: |-
  Created by Erica Synths and Richie Hawtin, Bullfrog is an educational electronic music instrument designed to captivate and inspire both youth and professionals alike. It invites the player to unlock musicality while combining the thrill of electronic music production with a comprehensive learning experience.

  Bullfrog is a classical subtractive synthesizer. It consists of several modules for sound generation (VCO, noise generator) and treatment (VCF, VCA/delay), as well as modules that generate the control and modulation signals that drive them (envelope generators and sample and hold).

  The Bullfrog will not make a sound on its own unless it is patched, either with eurorack patch cables that interconnect the modules or by inserting voice cards that create internal connections between the modules in a specific way and add extra functionality such as sampler/looper, sequencer or groovebox. This approach helps the player understand the functionality of a subtractive synthesizer and the principles of sound design with instruments like these.

  The instrument ships with a universal 12VDC wall wart adapter, a user manual, 10 patch cables, three pre-patched voice cards (Sequencer, Acid Bassline, Sampler Looper) and three DIY voice cards. A comprehensive user manual accompanies the learning process, and further material is published on a designated Bullfrog website.
specs: |-
  - Fully analogue design
  - Highly accurate voltage controlled oscillator (VCO) that tracks over 8 octaves
  - Manually adjustable and voltage controlled waveshapes: sine-shark fin and pulse wave with pulse width modulation (PWM)
  - Zener diode-based noise generator
  - Resonant lowpass voltage controlled filter (VCF)
  - Voltage controlled amplifier (VCA) with adjustable offset
  - Delay effect with adjustable delay time and feedback amount
  - Two looping attack-sustain-release envelope generators (EG)
  - Sample & Hold circuit with an individual clock
  - Manual gate button
  - Voicecard slot
  - Built in speaker
  - DIN5 MIDI input
  - USB connector
  - Dimensions: 40 x 385 x 210 mm
  - Weight: 1.8 kg
