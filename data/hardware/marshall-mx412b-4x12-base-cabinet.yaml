description: Powerfully versatile 4x12" straight-front guitar speaker cabinet
  from Marshall's MX range. Loaded with four 12" Celestion G12E-60 speakers in a
  sealed straight (base) enclosure, the MX412B delivers 240W of power handling
  at 16Ω through a single 1/4-inch speaker input, making it a workhorse pairing
  for Marshall heads at the more affordable end of the line.
details: |-
  With four Celestion G12E-60 speakers that can handle any genre, these 240W 4x12s are incredibly powerful and of exceptional quality. They are compatible with the majority of Marshall heads. These cabinets, with their black fret, white piping, and white logo, mimic the classic yet understated Marshall design.

  This cabinet is also available as an angled cab, allowing you to create your own Marshall stack.

  Designed and engineered in UK. Made in Vietnam.
