details: |-
  The Robot is a low fidelity 8-bit pitch transposer with absolutely no feelings whatsoever. It is completely synthetic and transforms any input into a puree of resynthesized robot jargon. Features include bendable super lo-fi fuzz, octave up, octave down, and arpeggiation. All modes are controlled by the Control Knob, which sets the frequency the chip operates at, changing and warping the pitch shifting and aliasing effects.

  This cranky computer uses a voice transformation IC from 80s kids toys to calculate crazy pitch shifting, bit-crushing distortion, tunable octaves up and down, and ring modulation. There's also an insane arpeggiator for primitive digital sound mangling.

  The Control Knob, located on the right-hand side of the pedal, controls the pitch of the effect: turned fully clockwise it is at its highest pitch, and turning it counterclockwise lowers the pitch or the speed of the arpeggiator. Volume controls the output volume of the effect.

  The rotary selector sets the mode. Normal gives the same pitch with 8-bit digital conversion when the Control Knob is fully clockwise, bending the pitch lower as it turns down. Octave Down yields a nasty octave down sound fully clockwise, bending further downwards as it turns down. Octave Up yields a nasty octave up sound fully clockwise, bending the pitch lower as it turns down. Arpeggiator sequences the pitch, with the Control Knob adjusting the arpeggiator speed.
