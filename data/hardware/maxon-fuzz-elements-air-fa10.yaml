details: |-
  The FA10 Fuzz Elements Air accurately recreates the distinctive square wave clipping and octave harmonics of one of history's most desirable dirt boxes, the Super Fuzz. The original Super Fuzz was created by Shin-Ei, but saw later incarnations under brands such as Apollo, Shaftesbury, JAX, Tiesco, Memphis, and most famously, Univox. It was used on countless recordings in the late 60's & 70's, most notably the Who classic "Live at Leeds." Long out of production, the Super Fuzz saw resurgence in the 90's during the Grunge & Alternative Rock era, appearing on the Beastie Boys' "Gratitude", Mudhoney's "Big Muff Super Fuzz" album and Monster Magnet's stoner-rock classic, "Superjudge."

  The Super Fuzz used dual germanium diodes and a unique full-wave rectification circuit to produce sizzling upper octave harmonics as well as subtle lower harmonics that filled out the guitar sound. The FA10's analog circuitry nails the Super Fuzz's crushing, compressed tone with surgical precision, and includes the two position Tone switch to toggle between flat and scooped EQ curves. These settings produce wildly different sounds, offering stark contrast to one another and effectively making the FA10 two pedals in one. A unique aspect of the FA10 is its ability to reproduce rhythm or lead lines with equal clarity, yet without changing settings on the pedal. Featuring authentic Vintage tones and modern features, the Fuzz Elements Air is the perfect vehicle to make your playing soar. TECH TALK:

  The FA10 features mechanical true bypass switching, Effect LED Indicator, and 9-Volt DC Battery or external adaptor operation.
specs: |-
  - Fuzz engine designed to emulate vintage Shin-Ei / Univox Super Fuzz
  - Square Wave clipping with upper octave harmonic
  - Level and Expand controls
  - Dual position Tone switch (Fat & Scoop)
  - Mechanical True Bypass Switching
