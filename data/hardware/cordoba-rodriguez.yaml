description: Handmade in a boutique workshop in California, the Cordoba Rodriguez combines three generations of tradition with features that bring this guitar into the modern era.
details: |-
  Handmade in a boutique workshop in California, the Cordoba Rodriguez combines three generations of tradition with features that bring this guitar into the modern era. Cordoba's Rodriguez is built with a solid Canadian Cedar top, solid Indian Rosewood back and sides, and a fan bracing pattern with a transverse brace. This gives the guitar a distinctively "Spanish" sound, warm, lush, and round, with bouncing basses and fat, singing trebles. It offers instant responsiveness and a big, explosive attack at the beginning of every note.
