description: The Empress Drive is a tube-like overdrive with advanced tone
  control that lets you shape how gain behaves, not just how much of it there
  is. With pre-overdrive mid shaping, a sweepable midrange, clean blend, active
  bass and treble shelving, a footswitchable boost, and an adaptive noise gate,
  it spans edge-of-breakup push to saturated, harmonically rich drive.
details: |-
  Most overdrives are built around one particular character. The Empress Drive gives you the tools to shape your own. Instead of locking you into a single flavour of overdrive, it lets you shape the harmonic structure that determines how a drive sounds and responds.

  With pre-overdrive mid shaping, flexible boost routing, clean blend, and post-mix EQ, the Empress Drive can move from subtle edge-of-breakup push to saturated, harmonically rich drive, either enhancing the character of your guitar and amp or taking your sound somewhere entirely new.

  A sweepable midrange handles precise harmonic shaping, a mix control preserves your amp's natural breakup, active bass and treble shelving filters tune the output, and up to 30dB of footswitchable boost can be placed pre- or post-clipping. A built-in analog clipping meter with selectable LED colour and an adaptive noise gate round out the feature set.
specs: |-
  - Tube-like overdrive with advanced tone control
  - Sweepable midrange for precise harmonic shaping
  - Mix control to preserve the amp's natural breakup
  - Active bass and treble shelving filters
  - Up to 30dB footswitchable boost, pre- or post-clipping
  - Built-in analog clipping meter with selectable LED colour
  - Adaptive noise gate
  - Input impedance 1M Ohm, output impedance 100 Ohm
  - Frequency response (-3dB) 20Hz - 22kHz
  - THD+N (20Hz - 20kHz, 1Vrms) < 0.1%
  - Power 9V DC (center-negative), 2.1mm barrel connector, 250mA draw
  - Dimensions 4.8" (L) x 2.6" (W) x 2.5" (H), weight 1 lb
