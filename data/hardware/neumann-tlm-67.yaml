description: The TLM 67 captures the spirit of Neumann's classic U 67, which
  defined the sound of the 1960s. But instead of electron tubes the TLM 67
  relies on trouble free FET electronics with a special sound design for a
  gorgeous retro tone.
details: |-
  The sound of the 60s reimagined: classic capsule technology plus retro sound design.

  The TLM 67 is a large-diaphragm FET condenser microphone that recreates the sonic character of the legendary U 67 tube microphone using transformerless solid-state circuitry. It uses the same K 67 capsule as its predecessor (and the U 87 A) and offers three polar patterns (omni, cardioid, figure-8) plus switchable pad and low cut.

  Highlights:
  - Same capsule as the legendary U 67 microphone
  - Three polar patterns
  - Tube sound characteristics from reliable FET circuitry
  - Unique dual color retro look
  - Switchable low cut and pad
  - Very low self-noise

  Applications:
  - Vocals
  - Spoken word
  - Acoustic guitar
  - Electric guitar
  - Piano
  - Percussion
  - Drum overheads
  - Broadcast
  - Film, foley, voiceover
  - Live show / PA
  - Professional recording studio
  - Concert hall
specs: |-
  - Acoustical operating principle: Pressure gradient transducer
  - Frequency Range: 20 Hz ... 20 kHz
  - Directional Pattern: Omni/cardioid/figure-8
  - Sensitivity at 1 kHz into 1 kohm: 10/18/9 mV/Pa (Omni/cardioid/8)
  - Rated Impedance: 50 ohms
  - Rated load impedance: 1 kohms
  - Equivalent noise level, CCIR: 29/24/30 dB (Omni/cardioid/8)
  - Equivalent noise level, A-weighted: 16/11/17 dB-A (Omni/cardioid/8)
  - Typical SPL (tube characteristic) for K<0.5%: 110/105/111 dB (Omni/cardioid/8)
  - Typical SPL (tube characteristic) for K<5%: 130/125/131 dB (Omni/cardioid/8)
  - Signal-to-noise ratio, CCIR (re. 94 dB SPL): 65/70/64 dB
  - Signal-to-noise ratio, A-weighted (re. 94 dB SPL): 78/83/77 dB-A
  - Maximum output voltage: -1 dBu
  - Supply voltage ( P48, IEC 61938): P48
  - Current consumption ( P48, IEC 61938): 3 mA
  - Matching connector: XLR 3 F
  - Weight: 490 g
  - Diameter: 56 mm
  - Length: 200 mm
