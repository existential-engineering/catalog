details: |-
  2023 marks the 'Double Platinum' Anniversary for the Gretsch brand. To commemorate 140 years of unmistakable sound, we proudly present the Limited Edition G6136T-140 Falcon — a guitar that honors its inspired past while providing the power and voice for the next generation of visionary players.

  This Falcon pairs a solid Adirondack red spruce top with maple back and sides and ML bracing for substantial hollow-body resonance, finished in a striking 2-Tone Stone Platinum / Pure Platinum gloss nitrocellulose lacquer with silver sparkle binding. The 25.5" scale maple neck wears a 12" radius ebony fingerboard with 22 medium jumbo frets and mother-of-pearl humpblock inlays.

  FT-67 Filter'Tron humbucking pickups in both positions are routed through a flexible control layout — two pickup volumes plus master volume and a master tone with treble bleed — feeding a String-Thru Bigsby B6CP tailpiece and Adjusto-Matic bridge on an ebony base. Chrome hardware, Grover Imperial locking tuners and a commemorative 140th Anniversary headstock plaque complete the package, which ships in a G6242L deluxe hardshell case.
