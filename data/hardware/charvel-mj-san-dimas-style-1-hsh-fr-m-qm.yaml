description: The MJ San Dimas Style 1 HSH FR M QM revives the late-'80s era when
  Charvel guitars were built exclusively in Japan, delivering a premium
  Japanese-crafted instrument in the MJ Series lineup. Finished in Caribbean
  Burst, the gloss-finished San Dimas Style 1 body pairs an alder core with a
  figured quilt maple top for striking visual depth.
details: |-
  Made in Japan as part of the reintroduced MJ Series. Speed Neck profile with rolled fingerboard edges and hand-rubbed oil finish. Graphite-reinforced bolt-on maple neck with 4-bolt sculpted heel for unimpeded upper-fret access. Heel-mount truss rod adjustment wheel. Floyd Rose 1000 Series locking nut paired with a recessed Gotoh GE1996T double-locking tremolo. Licensed Fender Stratocaster headstock. Knurled flat-top control knobs and Dunlop dual-locking strap buttons.
