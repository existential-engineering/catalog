description: "Expander module for the Korgasmatron II: adds auxiliary inputs to
  each filter and VC of resonance"
details: |-
  The Korgasmatron II Expander is a 6HP, totally passive companion module for the Korgasmatron II. It adds CV control over the Q (resonance) of each of the Korgasmatron II's two filters via dedicated Q CV A and Q CV B jacks, each with its own level knob.

  It also adds an auxiliary input for each filter, Aux In A and Aux In B, each with its own independently selectable filter mode (AUX MODE A / AUX MODE B knobs) separate from the main filter type set on the Korgasmatron II itself. This lets a second signal pass through the same filter in a different mode than the primary input.

  The expander attaches to the Korgasmatron II via a single ribbon cable and draws no power of its own.
specs: |-
  - Width: 6HP (skiff friendly)
  - Power: 0mA (totally passive, connects only via ribbon cable to Korgasmatron II)
  - Adds VC control of Q (resonance) for filter A and filter B
  - Adds an auxiliary input per filter with independently selectable filter mode
  - Requires Korgasmatron II module (attaches via single ribbon cable)
