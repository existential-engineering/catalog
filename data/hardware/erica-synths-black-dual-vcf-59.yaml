description: Erica Synths Black Dual VCF is a dual multimode filter with CV
  control over cutoff and resonance for serious modular patches.
details: |-
  Erica Synths Black Dual VCF is a dual multimode filter with CV control over cutoff and resonance for serious modular patches.

  At the core of this VCF is a highly stable, custom multimode VCF chip, the AS3320, produced in Riga. The module can be used as two independent VCFs with simultaneous highpass, bandpass and lowpass outputs, the controls can be linked for stereo application, and both VCFs can be chained in series or in parallel to the summing output for ultimate modulations.

  A bonus feature is the 16 band spectrum analyser, which gives visual feedback on what happens on the summing output.

  CV level attenuverters and a link switch for controlling both VCFs with one cutoff or resonance knob are included, and the design is skiff-friendly.

  Audio output amplitude is 10V peak to peak and CV input covers 10V peak to peak across the full sweep. The panel is 18HP wide, the module 35mm deep, and power consumption is 40mA@+12V and 36mA@-12V.
specs: |-
  - Two identical multimode VCFs
  - Custom multimode VCF chip AS3320
  - Simultaneous HP, BP and LP outputs
  - Summing output
  - CV control over Cutoff and Resonance
  - CV level attenuverters
  - Link switch for controlling both VCFs with one cutoff or resonance knob
  - 16 band spectrum analyser
  - Skiff-friendly design
  - Audio output amplitude 10 Vptp
  - CV input (full sweep) 10 Vptp
  - Panel width 18HP
  - Module depth 35mm
  - Power consumption 40mA@+12V, 36mA@-12V
