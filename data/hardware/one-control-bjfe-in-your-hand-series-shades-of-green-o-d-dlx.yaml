details: |-
  Introduction

  Each unit is a tribute to the legendary BJFE pedals, meticulously handcrafted in Japan with exceptional care and precision. Every enclosure in this series faithfully reproduces the texture and character of the original BJFE models. Any slight irregularities or subtle variations in paint are a natural result of the hand-finishing process and serve as a mark of authenticity. About the BJFE in Your Hand Series

  The BJFE in Your Hand Series represents a collaboration between Swedish design and Japanese craftsmanship. Reconstructed under the direct supervision and approval of Bjorn Juhl, each pedal captures the tone, response, and appearance of the original BJFE designs while integrating the reliability and functional excellence associated with One Control. Each unit is handwired in Japan using One Control's original aluminum housing and high-quality audio components, including carbon film resistors and metal film capacitors. This approach preserves the warmth and dynamics of the original BJFE sound while ensuring the stability and consistency required by modern players. The circuit design and signal path are optimized for through-hole components, which minimizes noise and preserves clarity. The result is a balance of organic musicality, refined engineering, and dependable construction. Shades of Green O.D. Deluxe

  The Shades of Green O.D. Deluxe is not simply an overdrive pedal but a flexible tone-shaping device that moves effortlessly between clean boost, natural overdrive, and rich distortion. Its extensive range of controls allows you to tailor your sound to suit different amplifiers and guitars, offering tones that range from subtle sparkle to saturated drive. Originally conceived as a six-knob Tube Screamer concept, the design evolved into a dynamic distortion engine capable of preserving the natural response of various guitar pickups. This ensures that transient attack and detail remain intact even at higher gain levels. The 2K, 4K, and Treble controls are positioned after the distortion section to allow precise matching with different amplifiers. Because guitar amplifiers naturally emphasize treble frequencies in different ways, these controls let you fine-tune the high end so that brightness is preserved without harshness. The Lows control is placed before the distortion circuit and is centered at 70 Hz, just below the lowest string of a standard-tuned guitar. This adds fullness and depth to clean tones, body to overdrives, and power to distorted sounds. With this versatility, the Shades of Green O.D. Deluxe can enhance clean tones with added brilliance, push an amplifier into natural overdrive, or deliver rich distortion with excellent clarity. Control Overview

  Vol : Adjusts the overall output volume. Drive : Adjusts the level of distortion, from clean boost to heavy overdrive. Lows : Controls the low frequency response before distortion, centered at 70 Hz. 2K : Adjusts the upper-mid to low-treble frequencies around 2 kHz. 4K : Shapes the treble in the higher frequency range near 4 kHz. Treble : Controls the overall brightness and top-end character of the signal. Together, these six controls offer a wide range of tonal options, allowing for detailed balancing between warmth, clarity, and presence. Specifications

  Input impedance: 300k

  Output impedance: 25k

  Power supply: 9V DC, center negative

  Current consumption: 7.5 mA

  Dimensions:
  61 W x 113 D x 31 H mm (excluding protrusions)
  66 W x 113 D x 46 H mm (including protrusions)

  Battery: Not included

  Notes on Use

  Use only a regulated 9V center-negative power supply for optimal performance. Avoid exposing the pedal to excessive heat, humidity, or vibration. Minor variations in finish are part of the handcrafted process and not defects. Disconnect power when not in use for extended periods to prolong component life. Closing Words

  The BJFE in Your Hand Series represents the meeting of artistry and engineering. Each pedal is a union of tone, craftsmanship, and precision. The Shades of Green O.D. Deluxe carries forward the legacy of the BJFE sound, reimagined with modern refinement and built for players who value expressive, responsive tone. With this pedal, you hold not only an overdrive but a handcrafted instrument of sound—made to inspire every note you play. Björn's take:

  The back story of this model was an assignment to make a 6 knob tube screamer. To my mind, that is over done to an extent that it would be near impossible to make anything that would make any difference from those already available, but on the other hand if focus of design instead would be that this green box with six knobs could be made so that the green box could be used as mid boost, booster with sparkle and bottom, light overdrive, medium distortion of its own and overdriving distorted amplifiers with both humbucker guitars and single coil guitars and that through a variety of amplifiers, it would still be a near impossible mission albeit one that could make a difference. Of course this would require making a distortion engine that can handle the transients of different guitar pickups in a somewhat dynamic way and without feedthrough of transients above the clamping level. This pedal to me has multiple uses as it can partly make a clean sound more interesting by just adding sparkle or bottom; partly add drive to medium distortion, and it can overdrive distorted amplifiers so I would think of it as a tool to have in the guitar case. My opinion of this product is that this is the first of the number of TS derivatives I have made over the years that I am deeply connected to each time I plug it in and a product I wish would have existed 40 years ago. ・ BJFE in your hand series Shades Of Green O.D. DLX Manual.pdf

