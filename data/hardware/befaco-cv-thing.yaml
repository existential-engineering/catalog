description: A compact, fully mappable CV to MIDI converter housed in a 6HP
  Eurorack module. Based on the VCMC module, it is designed for small
  performance rigs and enables control of MIDI gear from modular synthesizers.
details: |-
  CV Thing is a compact 6HP Eurorack module that converts control voltages into MIDI messages, based on Befaco's larger VCMC module but optimized for smaller performance rigs. It provides eight CV inputs that can be freely mapped to any MIDI message type, including CC, Notes, Program Change, Clock, Start/Stop, and NRPN.

  The module outputs MIDI via both a class-compliant USB MIDI interface and a TRS MIDI connector (Type A). A TRS to DIN-5 adapter is included in the box, making it immediately compatible with standard 5-pin MIDI gear without additional adapters.

  Configurations are saved in the module's internal memory and can also be backed up and restored via SysEx, making it easy to transfer setups between units or archive configurations. A web-based configuration editor is available for detailed mapping setup.

  The module is available both as a fully assembled unit and as a DIY kit. The front panel is aluminium with heat treatment, manufactured in Barcelona. Depth is 25mm in assembled form, or 32mm in DIY configuration with power connector.
