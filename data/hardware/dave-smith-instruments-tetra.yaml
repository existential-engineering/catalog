description: >-
  The Tetra is a compact four-voice polyphonic analog synthesizer from Dave Smith
  Instruments that combines the analog circuitry of the Prophet '08 with the desktop form
  factor of the Mopho. It offers multitimbral capability with a 100% analog signal path,
  essentially packing four Mophos into one unit.
details: |-
  The Tetra employs the same acclaimed analog architecture found in the Prophet '08, featuring two digitally controlled analog oscillators per voice supplemented by sub-octave generators. Each voice includes a resonant Curtis lowpass filter with switchable 2- or 4-pole modes, three DADSR envelope generators, four LFOs, and an arpeggiator. The instrument provides over 20 different modulation sources and over 40 modulation destinations, plus a 16x4 analog-style step sequencer per voice.

  The front panel balances simplicity with functionality. Critical parameters like Filter Cutoff and Resonance use smooth potentiometers rather than stepped encoders, enabling smooth filter sweeps. Four assignable performance controls allow real-time manipulation of any patch parameters, and a "Push It!" button auditions patches and triggers sequences while LEDs indicate active voices.

  The Tetra operates in three modes: Program Mode provides four-voice polyphony with 512 programs across four banks; Combo Mode assigns different programs to each voice for layering or complex patches; Multi Mode functions as a multitimbral module supporting four MIDI channels with separate outputs.

  Comprehensive I/O includes four audio outputs, MIDI In/Out, USB 2.0, and a dedicated Poly Chain output for expanding polyphony by connecting multiple units. The instrument represents an affordable entry point for those seeking Prophet '08 capabilities without the full keyboard investment.
specs: |-
  - Polyphony: 4 voices
  - Multitimbral: 4 parts
  - Oscillators: 2 per voice (digitally controlled analog)
  - Sub-octave generators: 1 per voice (one and two octaves down)
  - Waveforms: Sawtooth, triangle, saw/triangle, square with variable pulse width
  - LFOs: 4 per voice
  - Filter: Curtis lowpass, switchable 2- or 4-pole, self-oscillating in 4-pole mode
  - Envelope generators: 3 ADSR per voice (Filter, VCA, Assignable)
  - VCA: Analog
  - Sequencer: 16x4 gated step sequencer per voice
  - Arpeggiator: Yes
  - Memory: 512 programs (4 banks of 128), 128 combos
  - Outputs: Mono, stereo, per-voice, and headphones
  - Control: MIDI In, MIDI Out/Thru, USB 2.0
  - Performance controls: 4 assignable per program
releaseDate: "2009"
releaseDateYearOnly: true
