description: The DN332 is a dual-channel, 2/3 octave graphic equaliser
  delivering the spectral coverage of a 15-band-per-channel design in a compact
  1U rack space. It is aimed at engineers who need useful EQ correction on two
  independent paths without the surgical density of a third-octave unit.
details: |-
  2/3 octave spacing was a deliberate engineering decision, broad enough that each fader change is heard as a tonal shift rather than a narrow notch, yet dense enough to address the dominant room and stage resonances a front-of-house or monitor engineer routinely encounters.

  Stereo programme equalisation, dual-mono monitor tuning and main-plus-fill scenarios are all served by the DN332's twin-channel layout. Each channel is fully independent, with separate input gain and bypass, and channel-matching tolerances in line with other Klark Teknik units.

  Designed and engineered at the UK facility in Kidderminster, the DN332 carries forward the DN-series approach of transparent signal-handling and predictable, repeatable performance.
specs: |-
  - Dual-channel graphic equaliser
  - 2/3 octave band spacing
  - 15 bands per channel
  - Separate input gain and bypass per channel
  - 1U rack space
