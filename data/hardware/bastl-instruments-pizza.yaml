url: https://bastl-instruments.com/eurorack/modules/pizza
description: A compact 8HP digital oscillator with powerful wave shaping applied
  to FM synthesis. Features three internal oscillators (Main, Octave, Ratio),
  phase modulation via external input, wave folding with two distinct flavors,
  and ring modulation. Assignable CTRL knob and CV, V/OCT with auto-calibration,
  optional built-in quantization, and firmware updates via micro USB. Free VCV
  Rack plugin available.
details: |-
  Pizza is a compact digital oscillator built around powerful wave shaping and FM synthesis techniques. At its core are three internal oscillators: a Main Oscillator, an Octave Oscillator, and a Ratio Oscillator.

  The Main Oscillator supports phase modulation via the EXT input, wave folding with two distinct folding flavors, and ring modulation. Its output passes through an onboard waveshaper before reaching Main Out.

  The Octave Oscillator runs at a fixed octave relationship to the main pitch with its own OSC Out jack and independent waveshaper. The Ratio Oscillator enables advanced FM synthesis with user-adjustable frequency ratios for classic and inharmonic tones.

  An assignable CTRL knob and CV input map to a wide range of internal parameters. V/OCT includes automatic calibration and optional built-in quantization for in-tune playing without external utilities. Firmware updateable via micro USB. Free VCV Rack plugin available.
