details: |-
  Incredible clarity and excellent versatility from this small-diaphragm condenser

  Our best-selling STC-1 is a small-diaphragm condenser mic, ideally suited to recording instruments of any kind and will deliver consistently outstanding results. Thanks to its three-stage filter and pad controls, the Sontronics STC-1 is one of the most flexible microphones in its class, regularly outperforming and outclassing pencil mics that cost many times more. Available in silver or black, the STC-1 makes an indispensable addition to any mic locker, thanks to its ability to capture stunning performances from woodwind, strings, percussion, brass, guitar and other strummed instruments. STC-1 has also become a go-to for field recording, foley/sound effects, video and film work. FEATURES

