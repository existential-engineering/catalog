specs: |-
  - Small-Diaphragm Condenser : Ideal for capturing detailed and accurate recordings of acoustic instruments, percussion, and more.
  - Interchangeable Capsules : Ships with Cardioid capsule and compatible with optional hypercardioid, and omnidirectional capsules, providing versatility for different recording needs.
  - Precise Frequency Response : Tailored for accurate reproduction of high-frequency content, making it perfect for strings, woodwinds, and cymbals.
  - Low-Cut Filter & Pad Switch : Features a switchable high-pass filter (75Hz, 150Hz) along with a -10dB and -20dB PAD, offering control over low-frequency rumble and handling loud sound sources.
  - Rugged Build Quality : Constructed from solid brass with a durable finish, ensuring long-term reliability in both studio and live environments.
  - Versatile Applications : Suitable for a wide range of uses, from instrument recording to overheads and room miking.
  - Smooth Off-Axis Response : Designed to maintain a consistent and natural sound even when capturing off-axis audio.
  - Low Self-Noise : Provides clean and noise-free recordings, making it ideal for critical recording situations.
  - Compact Design : Easy to position in tight spaces or complex setups, providing flexibility in microphone placement.
  - Popular Choice for Instrument Recording : Trusted by engineers and musicians for capturing the true essence of acoustic instruments with clarity and detail.
  - Acoustic Guitars
  - Violins / Violas
  - Pianos
  - Percussion
  - Strings and Woodwind
  - Drum Overhead
  - Room Ambience
  - Orchestral Recording
  - Choirs / Vocal Ensembles
  - Podcasting
  - Voiceover
  - Field Recording
  - Product type: Small-diaphragm condenser
  - Polar pattern: Cardioid (Optional Omnidirectional and Hypercardioid capsules are available)
  - Frequency response: 25Hz to 20kHz
  - Pad: 0dB, -10dB, -20dB
  - Filter: Linear, 75Hz, 150Hz
  - Sensitivity: 20mV/Pa
  - Impedance: ≤200 Ohms
  - Max. SPL: (for 0.5% THD @ 1kHz) 137dB
  - Equivalent noise level: 16dB (A-weighted)
  - Connector: 3-pin XLR
  - Power: Phantom power 48V required
  - Product weight: 0.27 kg
  - Packaged weight: 0.84 kg
  - Product dimensions: 162 x 24 x 24mm
  - NEW Packaged dimensions: 260 x 140 x 70mm
  - STC-1 Microphone
  - Mic Clip
  - Foam Windshield
  - Wooden box
