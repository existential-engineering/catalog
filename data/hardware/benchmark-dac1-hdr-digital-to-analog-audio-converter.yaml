description: The DAC1 HDR is a reference-quality 2-channel digital-to-analog
  converter featuring remote control capability, a motorized Alps volume
  control, and relay-selected analog inputs. Designed for professional studio,
  mastering, and audiophile applications.
details: |-
  The Benchmark DAC1 HDR is a reference-quality 2-channel digital-to-analog converter built for professional studio, mastering, and high-end audiophile use. Its HDR-VC™ High Dynamic Range Volume Control uses a motorized Alps potentiometer that can be driven by the included remote or manually, providing precise and repeatable level adjustments. Relay-selected analog inputs allow an analog source to pass through the volume control and be monitored alongside digital sources.

  The unit accepts three coaxial S/PDIF inputs, one optical (TosLink) input, and one USB Audio 1.1 input (supporting up to 24-bit/96 kHz via Benchmark's AdvancedUSB™ technology). UltraLock™ jitter-immune clock circuitry reclocks incoming digital signals to ensure clean conversion regardless of source quality.

  Analog output options include balanced XLR and unbalanced RCA outputs. The balanced outputs feature passive step attenuators at 0, -10, -20, and -30 dB, allowing direct connection to power amplifiers. The HPA2™ headphone amplifier section provides two front-panel 1/4-inch headphone outputs.

  The DAC1 HDR has been discontinued and replaced by the DAC2 series.
specs: |-
  - HDR-VC™ motorized Alps volume control with remote operation
  - HPA2™ headphone power amplifier with dual front-panel 1/4" outputs
  - UltraLock™ jitter-immune clock system
  - AdvancedUSB™ technology: 24-bit, 96 kHz native USB Audio 1.1
  - 3 coaxial S/PDIF inputs, 1 optical (TosLink) input
  - 1 stereo analog input (relay-selected, through motorized volume control)
  - Balanced XLR outputs with passive step attenuators (0, -10, -20, -30 dB)
  - Unbalanced RCA outputs
  - Remote control with Dim, Mute, and Standby functions
  - Available in silver or black; 110V or 220V power supply options
