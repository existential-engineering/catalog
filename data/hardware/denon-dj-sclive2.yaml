description: 2-Deck Standalone DJ System with WiFi for Music Streaming
details: |-
  The Denon DJ SC LIVE 2 is a 2-deck standalone DJ system with built-in Wi-Fi that lets DJs perform without a laptop. With direct integration for Apple Music and additional streaming services such as Amazon Music Unlimited, Beatport, Beatsource, SoundCloud GO+, and TIDAL, it provides access to over 100 million CD-quality songs straight from the unit.

  A 7-inch multi-gesture touchscreen drives library browsing, waveform display, and effects. The unit blends stored media and streaming sources, with three media slots (2 USB Type-A ports and an SD card slot supporting SD/SDHC/SDXC), plus Dropbox connectivity for accessing personal music libraries from the cloud.

  On-board internal FX include 13 BPM-synced effects and channel sweep FX, and 4 dual-layer Performance Pads per deck cover Hot Cue, Auto Loop, Manual Loop, and Roll modes; a Bank button expands access to 8 pad slots per deck. Built-in speakers with dedicated volume control allow monitoring and content creation without external monitors, and Bluetooth audio supports wireless playback.

  With Computer Mode enabled, the SC LIVE 2 doubles as a dedicated DJ software controller for Serato DJ (Pro license included) and is also compatible with Virtual DJ (additional license required). Engine Lighting integration enables automated DMX-driven light shows that respond to the track.
specs: |-
  - Bit Depth: 24 bit (44.1kHz Sample Rate)
  - Frequency Response: 20Hz - 20kHz, +/- 0.5dB
  - Dynamic Range: > 110dB, 1kHz @ 0dBFS, A-Weighted
  - Signal-to-Noise Ratio: > 92 dB Max Out (Dynamic Range)
  - Channel Separation: < 106dB, 1kHz @ 0dBFS
  - Microphone T.H.D.: < 0.0035%, 1kHz @ 0dBFS
  - Microphone Input: -40 dBV (unity), -60 dBV (minimum)
  - Master Output, Balanced: +18 dBu (maximum)
  - Master Output, Unbalanced: +15 dBu (maximum)
  - Headphone Output: < 452mW @ 32 ohms, 25mW @ 590 ohms
  - Speaker Frequency Response: 20Hz - 20kHz, +/- 1dB
  - Network: Wi-Fi
  - Power: External DC supply, Center Positive, 12.0 V 3.0 A
  - Input Voltage: 100-240 VAC, 50/60 Hz
  - Dimensions (W x D x H): 26.7" x 15.4" x 3.9"
  - Weight: 10.1 lbs
