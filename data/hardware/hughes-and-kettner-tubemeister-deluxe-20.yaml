description: TubeMeister Deluxe 20 makes your job as a guitar player better
  sounding, easier, and a whole load more fun.
details: |-
  The Tubemeister Deluxe 20 delivers the excellent boutique sounds in the popular small lunchbox format. With its two channels and onboard boost function, this compact 20-watt head covers everything from crystal-clear clean tones through to dynamic crunch and crazy high-gain sounds. The build in power soak reduces the power amp's output to as little as one watt. The amp also features the legendary Red Box AE speaker simulation, which makes this amp ideal for recording in the studio or connect it direct to the front of house. Of course an effects loop is also included. The optional footswitch allows the player to change between the two channels and turn the boost on or off.

  Whether you Rock on Stage, Play at Home or Record at Night, TubeMeister Deluxe 20 is the ideal amp. The real power soak lets you switch between the full 20 Watts of power, 5 Watts, 1 Watt, or even 0 Watts for truly silent recording at any time of day or night.
specs: |-
  - Channels: Clean, Lead + Boost
  - Power: 20 Watts
  - Pre Amp: 2 x 12AX7
  - Power Amp: 2 x EL84
  - TSC: Tube Safety Control
  - Power Soak: 20, 5, 1, 0 Watts
  - Dimensions: 355 x 155 x 150 mm, Weight 5 kg
  - Protective Cover: Softbag included
  - Speaker Out: 1 x 8-16 Ohm
  - Effects Loop: Serial
  - Red Box AE (Ambience Emulation) XLRm OUT
  - Footswitch: FS-2 (optional)
