details: |-
  The 000-28 Modern Deluxe is part of Martin's Modern Deluxe Series, blending vintage Martin tone with contemporary refinements. It pairs a 000-14 Fret (Auditorium) body with East Indian Rosewood back and sides and a spruce top treated with Martin's Vintage Tone System (VTS).

  Premium appointments include a Vintage Deluxe neck shape, an ebony fingerboard, GE-Scalloped Adirondack spruce X-bracing, and gold Waverly open-gear tuners. Liquidmetal bridge pins with red acrylic dots add a distinctive touch and consistent string seating.

  The 24.9-inch scale length and 1 3/4" nut width give the 000-28 Modern Deluxe a comfortable, responsive feel suited to fingerstyle and flatpicking alike. It ships in a ply hardshell case and is available in a left-handed configuration.
specs: |-
  - Body Size: 000-14 Fret (Auditorium)
  - Top: Spruce with VTS (Vintage Tone System)
  - Back and Sides: East Indian Rosewood
  - Scale Length: 24.9"
  - Fingerboard: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Neck Shape: Vintage Deluxe
  - Neck Material: Mahogany
  - Bracing: X-Brace, Adirondack Spruce, GE-Scalloped
  - Frets: 20 total, 14-fret neck joint
  - Tuners: Gold Open Gear (Waverly)
  - Bridge Pins: Liquidmetal with red acrylic dots
  - Electronics: None (optional add-ons available)
  - Case: Ply Hardshell
  - Left-handed availability: Yes
