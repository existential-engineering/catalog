details: |-
  If you don’t own an Intellijel case with built-in compatible ¼” jacks, you need a Stereo Line In Jacks 1U module. It connects via ribbon cable to the Stereo Line In 1U module to provide balanced ¼” TRS input jacks (labeled L and R) for interfacing with other studio or stage gear.
