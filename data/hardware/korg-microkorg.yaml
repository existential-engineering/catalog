description: >-
  The microKORG is a compact, battery-powered analog modeling synthesizer that houses the
  same DSP engine as Korg's MS2000 in a portable, retro-styled package. Featuring 37
  velocity-sensitive mini keys, dual oscillators with 71 waveforms, and an 8-band vocoder,
  it became one of the most popular affordable synthesizers of the 2000s.
details: |-
  The microKORG represents Korg's effort to bring professional synthesis capabilities into a travel-friendly format. Its design echoes vintage instruments like the Poly-800 and DW-8000, with wood end-cheeks and extensive labeling across the control surface. The 37 mini keys have a firm response and feel natural enough to play despite their compact size.

  At its core, the microKORG uses the identical synthesis engine found in the MS2000 and MS2000R, offering musicians professional-grade sound design capabilities in a portable form. The instrument includes 128 programs organized into eight categories: Trance, Techno/House, Electronica, DnB Breaks, HipHop/Vintage, Retro, SndFX/Hits, and Vocoder.

  The synthesis architecture includes dual oscillators with 71 waveforms combining seven analog modeling waves plus 64 DWGS waveforms derived from the classic DW-8000. A multi-mode resonant filter offers 12 or 24 dB/oct slopes, complemented by two ADSR envelopes and a 6-pattern arpeggiator. All knobs and buttons send and receive MIDI controller data, allowing extensive real-time control and integration with other equipment.

  Notable artists who have used the microKORG include Air, Beck, The Killers, LCD Soundsystem, Prodigy, Royksopp, and The Pet Shop Boys.
specs: |-
  - Polyphony: 4 voices
  - Oscillators: Dual oscillator system with 71 waveforms (7 analog modeling + 64 DWGS)
  - LFO: 2 LFOs with sample and hold
  - Filter: Multi-mode filter (-24dB/oct LPF, -12dB/oct LPF/BPF/HPF)
  - Effects: 3 modulation types, 3 delay types, 2-band EQ
  - Vocoder: 8-band vocoder with mic input
  - Arpeggiator: 6 patterns
  - Keyboard: 37 velocity-sensitive mini keys
  - Memory: 128 programs
  - MIDI: IN/OUT/THRU
  - Power: 6x AA batteries or AC adapter
