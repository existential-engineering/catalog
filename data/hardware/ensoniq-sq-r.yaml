description: >-
  The Ensoniq SQ-R is a rack-mounted version of the SQ-1 keyboard, offering 21 voices of
  polyphony with three digital oscillators per voice, Transwave wavetable support, and an
  8-zone MIDI controller function that transforms any connected keyboard into a
  multi-channel setup.
details: |-
  The SQ-R was part of Ensoniq's lower-cost SQ product line alongside the SQ-1 and SQ-2. As a rack unit, it omits the keyboard and sequencer but retains the full synthesis engine with its three digital oscillators per voice drawing from over 100 sampled waves plus nine Transwaves for wavetable-style timbral animation.

  A standout feature is the Smart Transmit function, which turns the SQ-R into an eight-zone MIDI controller when a keyboard is connected. Even basic single-channel MIDI keyboards gain independent control over volume, key range, MIDI channel, program change remapping, transpose, and sustain pedal per zone.

  The front panel provides a 32-character LCD display and controls organized across four operational modes: Sound Select, Sound Edit, Preset Select, and Track Editor. The onboard memory holds 100 ROM sounds and 80 RAM slots for custom patches, expandable by 160 additional sounds via optional RAM/ROM cards.

  The digital effects processor covers reverb, chorusing, flanging, distortion, delay, compression, and wah effects. A Plus/32 version was later released with 32 voices of polyphony, up from the original 21.
specs: |-
  - Polyphony: 21 voices (32 voices on Plus/32 version)
  - Multitimbral: 8 parts
  - Oscillators: 3 digital per voice
  - Waveforms: Wavetable with 9 Transwaves
  - Effects: Reverb, chorusing, flanging, distortion, delay, compression, wah
  - Display: 16-character 2-line LCD
  - Memory: 80 RAM patches, 100 ROM patches, up to 160 additional via cards
  - Control: MIDI In/Out/Thru
