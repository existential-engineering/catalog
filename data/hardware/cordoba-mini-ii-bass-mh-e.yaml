description: The Mini II Bass is a portable acoustic bass with an extended 580mm
  scale length, all-Mahogany construction, and an onboard pickup for plugging
  in.
details: |-
  The Mini II Bass is here to expand your horizons and your registers! Based on our popular travel-sized Mini, the Mini II Bass is slightly bigger and features an extended 580mm (22 7/8 inch) scale length so it tunes perfectly to Standard E. Keep it acoustic and the Mini II Bass's deeper body depth will provide a well-rounded tone; use its Cordoba MB103 pickup to plug it in and you'll be surprised by this portable bass's rich, robust tone. Built with all-Mahogany woods, the Mini II Bass MHE's unique voice is mellow, soft, and balanced. Strung with nylon core, phosphor-bronze strings, the Mini II Bass feels and sounds more like a full-size bass than its miniature bass counterparts. With the Mini II Bass MHE, you'll never have to leave the low-end behind!
