details: |-
  CCM382 is a passive two-way in-ceiling loudspeaker in the Bowers & Wilkins CI 300 range, the larger of the two in-ceiling models in the series. It is a shallow-form design for installations where the speaker should be heard and not seen.

  The two-way system pairs a 25mm (1in) soft dome tweeter with a 200mm (8in) polypropylene cone bass/midrange driver. CCM382 and the smaller CCM362 offer a choice of size depending on the output level required, are balanced for wide-angle listening in keeping with ceiling placement, and are both available with round or square aspect.

  The CI 300 models were specifically designed to cope with high-humidity environments such as shower rooms and indoor swimming pools, which are unsuited to some of the advanced driver materials used elsewhere in the Bowers & Wilkins range. That makes them a point of entry to areas of the home previously off-limits to high-quality installation loudspeakers.

  Frequency range is quoted as 45Hz to 30kHz (-6dB) with sensitivity of 90dB (2.83V, 1m), a nominal impedance of 8Ω (5.0Ω minimum) and power handling of 80W. The matching pre-mount kit is the PMK C8 and the matching back box is the BB 6C.

  Speaker cable connects to spring terminals on the side of the baffle, with the amplifier's positive terminal going to the red spring terminal on the frame. The speaker is supplied in a White finish.
