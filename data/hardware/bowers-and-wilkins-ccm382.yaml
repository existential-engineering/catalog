  and movies to life.
details: |-
  CCM382 is the larger of the two models in the Bowers & Wilkins CCM3 Series of shallow-form ceiling speakers, a passive two-way design pairing a 25mm soft dome tweeter with a 200mm polypropylene cone bass and midrange driver. Bowers & Wilkins describes it as a flexible two-way in-ceiling speaker, engineered to deliver precision sound in any environment for music and for film.

  The speaker is a single assembly: a baffle carrying the drive units, the crossover circuit and the connectors, plus a grille that is held on magnetically. The baffle is fixed into the ceiling aperture by four dog-clamps that swing outwards and tighten, driven with a Phillips screwdriver through access holes in the front of the speaker. A round grille is supplied and a square grille is available separately through a Bowers & Wilkins retailer.

  Installation is planned around a 253mm (9.9in) ceiling aperture with 85mm (3.4in) of height clearance behind it. A supplied template marks the cut line, and a supplied paint mask protects the speaker if the ceiling is painted afterwards. For new-build work a pre-mount kit defines the position and the cut before the plasterboard goes up, its moulding giving a 257mm (10.1in) internal cut guide, and a CI300 back-box can be fitted where fire regulations or a defined acoustic loading volume call for one, which needs at least 140mm of clearance from the outer joist plane.

  Connection is made at the spring terminals on the side of the baffle, with the amplifier's positive conductor going to the red terminal and its negative to the black. Bowers & Wilkins asks for high quality low-resistance speaker cable, particularly on runs longer than 5m, and for about 1.0m of slack left at the aperture, enough to make the connection comfortably but not so much that the cable buzzes against the ceiling when pushed back up.

  For positioning, corner locations are to be avoided because they emphasise low frequencies noticeably. A stereo pair should sit 3m (10ft) to 5m (16.5ft) apart and a similar distance in front of the listening area, with a similar acoustic environment around each speaker. In multi-channel systems the front and centre speakers go about 0.5m in front of the plane of the screen and the surrounds just behind and either side of the seats. The drive units create stray magnetic fields, so magnetically sensitive items should stay at least 0.5m (20in) away, although LCD and plasma screens are unaffected.
specs: |-
  - Two-way shallow-form in-ceiling speaker
  - Drive units: 1x ø25mm (1in) soft dome tweeter, 1x ø200mm (8in) Polypropylene cone bass/midrange driver
  - Passive: crossover circuit carried on the baffle, no on-board amplifier and no mains connection
  - Connection: red and black spring terminals on the side of the baffle
  - Ceiling aperture diameter: 253mm (9.9in)
  - Minimum height clearance: 85mm (3.4in)
  - Pre-mount kit cut guide diameter: 257mm (10.1in)
  - Back-box installation requires at least 140mm clearance from the outer joist plane to any rear obstruction
  - Fixing: four dog-clamps tightened through access holes in the front of the speaker
  - Magnetically secured round grille supplied; a square grille is available optionally
  - Carton contents: 2x CCM3 Series speakers, 2x grilles, 1x aperture template, 2x paint masks, quick start guide, warranty information
  - Stray magnetic field: keep magnetically sensitive items at least 0.5m (20in) away; LCD and plasma screens unaffected
  - Recommended stereo spacing: 3m (10ft) to 5m (16.5ft) apart
  - Finish: White
