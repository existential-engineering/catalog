description: >-
  The E-mu SP-12 is a legendary 12-bit sampling drum machine from 1985 that combined
  preset drum sounds with user sampling capability. It pioneered the workflow that would
  define the SP-1200 and influence the Akai MPC series.
details: |-
  The SP-12 is the classic drum machine and sampler combination that established the template for an entire category of instruments. Redesigned from E-mu's original Drumulator, it pairs a set of preset 12-bit drum sounds including kick, snare, hi-hats, toms, cymbals, handclap, and rimshot with built-in sampling capability, allowing producers to blend factory sounds with their own recordings.

  The built-in 12-bit sampler operates at 27.5kHz with 48KB of memory providing approximately 1.2 seconds of sampling time. The optional Turbo upgrade expands memory to 192KB for up to 5 seconds. While severely limited by modern standards, the lo-fi 12-bit sampling quality has become a sought-after sonic characteristic, particularly in lo-fi hip-hop and trip-hop production.

  The sequencer stores up to 100 patterns and 100 songs, programmed via 8 touch pads. Preset drum sounds can be mixed and edited using front panel sliders, and user samples integrate seamlessly into the same workflow. The unit provides mono and individual outputs but no stereo pair, along with MIDI and SMPTE synchronization.

  The SP-12 was quickly succeeded by the SP-1200 in 1987, which emphasized sampling by eliminating the preset drum sounds and was continuously reissued through 1997. While the SP-1200 achieved greater fame, the SP-12 remains a prized collector's piece. Notable users include Madlib, Large Professor, Chicago, and DJ Premier.
specs: |-
  - Polyphony: 8 voices
  - Sampler: 12-bit at 27.5kHz, 48KB memory for 1.2 seconds (Turbo: 192KB for 5 seconds)
  - Drums: 24 preset samples (kick, snares, toms, hi-hats, crash, ride, rim, clap, cowbell)
  - Patterns: 100
  - Songs: 100
  - Keyboard: 8 touch pads
  - Memory: 8 user
  - Control: MIDI, SMPTE
  - Outputs: Mono and individual (no stereo)
releaseDate: "1985"
