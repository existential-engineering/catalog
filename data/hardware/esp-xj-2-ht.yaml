  - Tuners: LTD Locking
  - Bridge: Hipshot w/ String Thru
  - Bridge PU: Fishman Fluence Modern 3-Voice Humbucker Ceramic Brushed Stainless *(Pull Volume for Voice 3)
  - Neck PU: Fishman Fluence Modern 3-Voice Humbucker Alnico Brushed Stainless *(Pull Volume for Voice 3)
  - Electronics Layout: Master Volume(Push/Pull)/Toggle Switch
  - Strings: D'Addario XL110 (.010/.013/.017/.026/.036/.046)
  - Case: XJ GUITAR FORM FIT CASE
