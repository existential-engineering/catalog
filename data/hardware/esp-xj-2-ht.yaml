details:
  - Designed for professional guitar players who require the versatile tones,
    smooth playability, and complete reliability for serious recording and
    touring needs. This guitar takes the offset, asymmetrical XJ body shape and
    provides it with the feature set designed for the modern musician.
  - Built with bolt-on construction at 25.5" scale, the XJ-2 HT has a resonant
    swamp ash body and a smooth, thin U-shaped three-piece roasted maple neck
    with Macassar ebony fingerboard, block pearloid inlays, 22 extra-jumbo
    stainless steel frets, and a matching reverse headstock.
  - Components on the XJ-2 HT include black hardware, a black bone nut, LTD
    locking tuners, a Hipshot hardtail bridge with string-thru-body, and a set
    of direct-mounted Fishman Fluence Modern 3-Voice Humbucker pickups — ceramic
    in the bridge, and alnico in the neck — with brushed stainless covers.
    Push-pull controls allow for selection of these innovative pickups' multiple
    voices.
specs: |-
