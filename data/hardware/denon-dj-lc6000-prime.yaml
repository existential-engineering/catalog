description: LC6000 PRIME Performance Expansion Controller | Denon DJ
details: |-
  Performance expansion controller designed to add a deck to standalone PRIME players (SC6000/SC6000M/SC5000/SC5000M) or laptop-based DJ setups

  8.5" (216 mm) capacitive jog wheel inspired by the SC6000

  3.5" (89 mm) high-resolution jog wheel display for track artwork and waveform feedback

  8 multi-function performance pads for cues, loops, rolls, and slicer

  100 mm smooth pitch fader for fine tempo control

  Rugged sub-chassis with grippy rubber buttons and a brushed aluminum top panel

  USB bus-powered with an included optional DC power supply for high-current scenarios

  Plug-and-play compatibility, no driver required

  Compatible with Engine DJ OS, Serato DJ Pro, Virtual DJ, and Algoriddim djay Pro
specs: |-
  - Jog Wheel Diameter: 8.5" / 216 mm
  - Jog Wheel Display Diameter: 3.5" / 89 mm
  - USB: Type-B port (for computer/media player connection)
  - Power: DC power adapter input 12.0 V, 2.0 A (optional); USB bus-powered
  - Performance Pads: 8 multi-function pads
  - Pitch Fader: 100 mm smooth fader
  - Dimensions (in): 14.2" x 12.6" x 4.7" (W x D x H)
  - Dimensions (mm): 359.5 x 319.5 x 119.5 (W x D x H)
  - Weight: 6.24 lb / 2.83 kg
