details: |-
  Story

  The Mondata Jr. Midnight LTD marks a new direction for Rivolta: a study in restraint, atmosphere, and purposeful simplicity. With the Midnight series, the goal was to distill the instrument down to its essentials, creating a unified visual identity centered around an all-black, monochromatic hardware aesthetic. Developed in response to years of player feedback, the Mondata Midnight introduces a 24 3/4" scale length to the Rivolta lineup for the very first time. The shorter scale delivers a subtly softer attack and looser feel, offering added warmth, effortless playability, and a distinctly familiar response while bringing a fresh dynamic to the Mondata platform. While classic Rivolta models lean into the brand's vintage-inspired character, the Mondata Midnight embraces a more minimal, modern sensibility, designed around feel, balance, and an understated visual approach that reveals its character most clearly when nothing unnecessary remains. Features and Specs

  LEFT-HAND OPTION AVAILABLE!
