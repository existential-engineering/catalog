description: Erica Synths Fusion Ring Modulator – a classic design ring
  modulator with germanium diode ring + vacuum tube to boost and shape audio and
  carrier signals.
details: |-
  A classic ring modulator design built around a germanium diode ring and a vacuum tube. The germanium diodes enrich the sound by adding extra harmonic content, while the vacuum tube adds an aggressive overdrive to both the audio and the carrier signal. The result is one of the most versatile ring modulators around.

  The panel carries a germanium diode ring, audio transformers, adjustable tube overdrive on both the audio and the carrier input, and a colour switch that selects between a brighter and a darker sound.

  All Fusion modules are by default configured to work with a regular eurorack PSU. The power supply is configurable: a standard eurorack +-12V connection, or eurorack +-12V plus the Erica Synths tube heater PSU.

  Because cold tube heaters have lower resistance, Fusion modules have a significant power consumption peak at startup, when consumption almost doubles for 1 to 2 seconds. This is not a problem with linear PSUs that have power inertia, but it may cause a switching PSU internal protection to turn the power supply off, so the PSU should have some headroom before multiple Fusion modules are installed.
specs: |-
  - Input signal level up to 20V ptp
  - Output signal level 10V ptp
  - Power supply bipolar +-12V, eurorack standard
  - Power consumption (eurorack PSU configuration): 160mA@+12V, 10mA@-12V
  - Module width 12HP
  - Module depth 25mm
