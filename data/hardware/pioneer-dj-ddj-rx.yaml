description: The DDJ-RX is one of the first native controllers for rekordbox dj
  , giving you the flexibility to prepare your tracks in rekordbox ™ and then
  get plug-and-play performance directly from your laptop. The controller
  mirrors the DJ software's layout precisely to enable intuitive and creative
  performances. Low latency jog wheels with On Jog Display, multi-coloured
  Performance Pads and a four-channel mixer deliver highly responsive, tactile
  control of all rekordbox dj’s performance features. Or you can use the DDJ-RX
  as a stand-alone mixer.
details: |-
  Professional 4-channel controller for rekordbox dj. The DDJ-RX is one of the first native controllers for rekordbox dj , giving you the flexibility to prepare your tracks in rekordbox ™ and then get plug-and-play performance directly from your laptop. The controller mirrors the DJ software's layout precisely to enable intuitive and creative performances. Low latency jog wheels with On Jog Display, multi-coloured Performance Pads and a four-channel mixer deliver highly responsive, tactile control of all rekordbox dj’s performance features. Or you can use the DDJ-RX as a stand-alone mixer.
