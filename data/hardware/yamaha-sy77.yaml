description: >-
  The Yamaha SY77 is a hybrid workstation combining a six-operator AFM (Advanced FM) synthesis engine with AWM2 sample playback, a 16-track sequencer, and four independent digital effects processors. It effectively merged the sound design depth of the DX7 with the realistic timbres of sample-based instruments in a single 61-key keyboard.
details: |-
  Released in 1989, the SY77 represented Yamaha's vision for the next generation of FM synthesis, moving beyond the pure digital waveforms of the DX series to incorporate sampled sounds alongside a dramatically enhanced FM engine. The Advanced FM section features six operators with 45 algorithms, three feedback loops, and 16 waveforms, offering far greater timbral complexity than the original DX7.

  The AWM2 (Advanced Wave Memory 2) side provides 16-bit sample ROM playback for realistic acoustic instrument timbres, and crucially, these two engines can be combined within a single patch. FM operators can modulate sampled waveforms and vice versa, opening up a vast territory of hybrid sounds that neither technology could achieve alone. Multi-stage time variant filters with resonance add subtractive shaping capabilities that were absent from earlier FM instruments.

  The built-in 16-track sequencer with 16,000-note capacity and 61 drum sounds made the SY77 a self-contained production workstation. Four independent digital effects processors handle reverb, delay, chorus, and panning simultaneously. A rack-mount version, the TG77, followed in 1990 for studio users who preferred a keyboard-less format. The 61-key keyboard with velocity and aftertouch provided expressive performance control over both synthesis engines.
specs: |-
  - Polyphony: 32 voices (16 AFM + 16 AWM2)
  - Oscillators: 6-operator AFM with 45 algorithms, 3 feedback loops, 16 waveforms; AWM2 16-bit sample ROM
  - Filter: Multi-stage time variant filters with resonance
  - Effects: 4 independent digital processors (reverb, delay, chorus, panning)
  - Sequencer: 16 tracks, 16,000 notes, 99 patterns, 1 song, 61 drum sounds
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 128 preset patches, 64 user patches, 16 preset multis, 16 user multis
  - Control: MIDI
