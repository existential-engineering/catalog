details: |-
  The 706 S3 is the larger stand-mount model in the third-generation Bowers & Wilkins 700 Series, delivering exceptional detail and insight into music with a substantial woofer suited for larger listening spaces.

  It is a 2-way vented-box system pairing a 25mm (1 in) Decoupled Carbon Dome tweeter with a 165mm (6.5 in) Continuum cone bass/midrange driver. The cabinet uses a curved baffle inspired by the 800 Series Diamond and incorporates Bowers & Wilkins' Flowport technology for low-port-noise bass tuning.

  Nominal impedance is 8 ohms (3.7 ohm minimum) with a sensitivity of 88dB and a recommended amplifier power range of 30W to 120W into 8 ohms.

  Available finishes are Gloss Black, Satin White, and Mocha.
specs: |-
  - 2-way vented-box system
  - High-frequency driver: 1x 25mm (1 in) Decoupled Carbon Dome
  - Bass/midrange driver: 1x 165mm (6.5 in) Continuum cone
  - Frequency range: 45Hz to 33kHz
  - Frequency response: 50Hz - 28kHz (±3dB)
  - Sensitivity: 88dB SPL (2.83Vrms at 1m)
  - Nominal impedance: 8Ω (minimum 3.7Ω)
  - Recommended amplifier power: 30W - 120W into 8Ω
  - Harmonic distortion: <1% (100Hz - 22kHz), <0.5% (150Hz - 20kHz)
  - Dimensions (H x W x D): 345 x 192 x 297mm (13.6 x 7.6 x 11.7 in) cabinet only
  - Net weight: 8.42kg (18.6 lb)
  - Available finishes: Gloss Black, Satin White, Mocha
