description: >-
  The Roland GR-500 is a guitar-controlled analog synthesizer released in 1977,
  representing Roland's first entry into guitar synthesis. It uses a modified guitar with
  a special pickup system connected to a synthesizer module via a proprietary 24-pin
  interface, predating MIDI. The system offers Bass, Solo Synth, and String sounds with
  adjustable VCO, VCF, VCA, and LFO sections, though it lacks any patch memory.
details: |-
  The GR-500 was Roland's first guitar synthesizer, released in 1977 as a pioneering instrument that allowed guitarists to control analog synthesis parameters directly from their instrument. The system consisted of two components: a specially modified guitar (the GS-500) fitted with a hexaphonic pickup and numerous control knobs, and a separate synthesizer module connected via Roland's proprietary 24-pin interface.

    The synthesizer module employed simple analog circuitry with preset sound categories derived from Roland's earlier orchestral and mono-synth designs. Players had access to Bass, Solo Synth, and String sounds, with plenty of sliders to adjust the VCO, VCF, VCA, and LFO sections. However, there was no memory to store edits, meaning all patches had to be dialed in manually each time.

    The guitar itself featured extensive modifications, including special magnets positioned beneath the surface to increase sustain and numerous control knobs mounted directly on the instrument body. Because the system predated MIDI, it relied entirely on CV/Gate signals transmitted through the 24-pin cable. Tracking accuracy was variable by modern standards, but the GR-500 was groundbreaking for its era and laid the foundation for Roland's long-running GR series of guitar synthesizers.
specs: |-
  - Polyphony: Monophonic (Solo Synth), Polyphonic (Strings/Bass)
    - Synthesis: Analog subtractive
    - Oscillators: VCO with adjustable parameters
    - Filter: Resonant low-pass VCF
    - Envelope: VCA with adjustable parameters
    - Modulation: LFO section
    - Sound Categories: Bass, Solo Synth, Strings
    - Memory: None
    - Effects: None
    - Arpeggiator/Sequencer: None
    - Control Interface: CV/Gate via Roland 24-pin proprietary interface
    - Controller: GS-500 modified guitar with hexaphonic pickup
    - Year: 1977
