description: Fully featured sequencer in 3hp.
details: |-
  Erica Synths Pico SEQ is a performance oriented 16 step CV and Gate sequencer that packs virtually every feature expected of a sequencer into 3HP.

  Despite the size it stays easy to program, and up to 16 patterns can be saved in memory and recalled instantly, each with all of its settings.

  Sequence length is selectable up to 16 steps, the CV output is quantized to one of nine scales, and gate length is adjustable per step from 0 to 100%. Steps can be switched off or merged into their neighbour, and a slide function can be set on selected steps.

  Five play modes, a transpose function and a random play function that stays within the selected scale cover the performance side. The CV output spans 0V to +8V, which is eight octaves.

  The panel is 3HP wide and the module is 35mm deep, part of the Pico Series brief Erica Synths set itself, to fit superior synth functionality into 3HP at an affordable price.
specs: |-
  - 16 step CV and Gate sequencer
  - Selectable sequence length up to 16 steps
  - Quantized CV output, 9 different scales
  - Adjustable Gate length for each step
  - Step off and step merge function
  - Slide function on selected steps
  - Transpose function
  - Random play function (within a scale)
  - 5 play modes
  - Sequence memory (16 sequences with all settings)
  - CV output 0V to +8V (8 octaves)
  - Gate length 0-100% (adjustable for each step)
  - Power consumption +55mA, -4mA
  - Module width 3HP
  - Module depth 35mm
