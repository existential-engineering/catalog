description: Generation Loss MKII is a stereo effects pedal from Chase Bliss. It is a study of tape in all its forms. All available for you to saturate, fail and flutter, until everything sits just right.
details: |-
  Generation Loss MKII is a study of tape in all its forms. We took apart VCRs, we analyzed anything we could find with a tape in it, from camcorders to cassette decks. All available for you to saturate, fail and flutter, until everything sits just right. And if you prefer the way it was before, you can do that too. In stereo.

  The Failure knob introduces unpredictability, a collection of the little things that can and do go wrong, for the moments of malfunction that break the cycle and give tape that living feel.

  Generation Loss MKII features true stereo I/O, with a unique failure-based stereo spread, plus individual Wow and Flutter knobs to blend for that familiar, wistful motion or use in isolation for randomized vibrato and quivering chorus.

  A Classic mode dip switch reverts to the original Generation Loss algorithm, in stereo. The pedal expands and integrates with MIDI, CV and Expression control, presets, and internal modulation of all its knobs, plus a companion MIDI Controller plugin.
specs: |-
  - Stereo I/O
  - 2 Presets
  - MIDI (Program Change, Control Change)
  - CV control
  - Expression control
  - AUX switch
  - Analog dry thru (mode dependent)
  - True bypass (mode dependent)
  - 9V Center Negative, ~250 mA
  - 2-in-1 magnetizer
  - Customizable Failure knob
  - Individual Wow and Flutter modulation knobs
  - Classic mode (original Generation Loss algorithm)
