description: Generation Loss MKII is a study of tape in all its forms — a VHS
  Duplicator effect pedal with stereo I/O, presets, MIDI, and CV control.
details: |-
  We decided to start from scratch this time and really explore what tape is all about. Get into those crinkles that make it so magical. We took apart VCRs, we analyzed anything we could find with a tape in it, from camcorders to cassette decks.

  The Failure knob is a collection of the little things that can and do go wrong — snags, drops and wrinkles, the moments of malfunction that break the cycle and give tape that living feel.

  Generation Loss MKII is the first stereo pedal in our classic format. Stereo in and out, mono in stereo out, and a unique Spread option that uses the Failure knob to create a malfunctioning stereo image.
specs: |-
  - Stereo I/O
  - 2 Presets
  - MIDI (Program Change, Control Change)
  - CV control
  - Expression control
  - AUX switch
  - Analog dry thru (mode dependent)
  - True bypass (mode dependent)
  - 9V Center Negative, ~250 mA power consumption
  - True stereo in/out capability
