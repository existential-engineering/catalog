description: Generation Loss MKII is a stereo effects pedal from Chase Bliss. It
  is a study of tape in all its forms. All available for you to saturate, fail
  and flutter, until everything sits just right.
details: |-
  Generation Loss MKII is a study of tape in all its forms. Chase Bliss started from scratch on this model, taking apart VCRs and analyzing anything they could find with a tape in it, from camcorders to cassette decks, to get into the crinkles and artifacts that make tape magical. Everything uncovered is available to saturate, fail and flutter, until it sits just right, and a Classic dip switch can flip back to the original Generation Loss sound at any time, now in stereo.

  The Model knob steps through a library of tape machines, each with its own unique EQ profile, drawn from VCRs, dictaphones, toys and more, all built through frequency-analysis of physical hardware. The Failure knob is a collection of the little things that can and do go wrong on tape, snags, drops and wrinkles, the moments of malfunction that break the cycle and give tape its living feel; individual elements can be turned off and customized to taste. Individual Wow and Flutter knobs get the warble just right, blended together for a familiar wistful motion or used in isolation for randomized vibrato and quivering chorus.

  Generation Loss MKII is the first stereo pedal in Chase Bliss's classic format. It runs stereo in and out, mono in with stereo out, and a unique Spread option that uses the Failure knob to create a malfunctioning stereo image.

  The pedal features MIDI, CV and Expression control, two onboard presets, and internal modulation of all its knobs.
specs: |-
  - Stereo I/O (stereo in/out, mono in to stereo out, Spread stereo imaging)
  - Library of tape machine models with unique EQ profiles per model
  - Failure knob with customizable malfunction elements (snags, drops, wrinkles)
  - Individual Wow and Flutter modulation knobs
  - Classic Mode dip switch recalls the original Generation Loss sound in stereo
  - 2 onboard presets
  - MIDI control (PC, CC)
  - CV control
  - Expression control
  - AUX switch
  - Analog dry thru (mode dependent)
  - True bypass (mode dependent)
  - Power: 9V DC center negative, ~250 mA
