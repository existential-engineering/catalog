description: 24-Channel 192 kHz bus-powered professional USB 2.0 audio
  interface. A high-end portable interface machined from a block of aluminum,
  featuring SteadyClock FS, improved mic preamps and headphone outputs over the
  original Babyface Pro.
details: |-
  Four years ago the Babyface Pro again demonstrated RME's absolute commitment to superior craftsmanship, not only in audio circuits and driver development, but also in mechanics. Created with the highest precision from a block of aluminum, this high-end portable interface incorporated newly designed analog and digital circuits. Its innovative energy saving technologies provided supreme fidelity with no compromises in level, noise or distortion.

  In the new Babyface Pro FS even more improvements were implemented: a +19 / +4 dBu switch on the bottom adds a direct way to reduce the output level, improving SNR for sensitive active monitors, avoiding distortion / overload, and helping keep TotalMix FX faders near 0 dB instead of high attenuations. The full SteadyClock FS circuit as in the ADI-2 Pro FS delivers lowest jitter and highest jitter immunity.

  The 3.5 mm TRS phones output power rises from 70 mW to 90 mW. THD of both phones outputs is improved by up to 10 dB and uses the same output op-amps as ADI-2 Pro. Output impedance of the 3.5 mm TRS is lowered from 2 Ohms to 0.1 Ohms. Mic input SNR is improved from 112.2 dB to 113.7 dB, and TRS Line input SNR from 114 dB to 116.3 dB (120 dBA), with THD on Line inputs improved by 8 dB.

  Six samples less latency on the AD side via a new ADC (5 samples AD, 7 samples DA). All of these improvements were achieved without raising the unit's power consumption. The unit also adds a K-slot for theft protection.

  Straight to the core without interference: the reference design of the Babyface Pro leaves nothing to be desired. The audio circuits have been improved to meet even highest gain levels with best dynamic range. The clever user interface is informative and clearly laid out, making access to every feature and configuration mode of the Babyface Pro intuitive and easy to use. Bundled software includes TotalMix FX, TotalMix Remote, and DigiCheck.
specs: |-
  - 24-Channel 192 kHz bus-powered USB 2.0 Audio Interface
  - Supported sample rates: 28 kHz up to 200 kHz
  - AD Mic/Line 1-2 Input: XLR, electronically balanced
  - AD Mic/Line 1-2 Input impedance balanced: 2 kOhm, 5.2 kOhm with PAD
  - AD Mic/Line 1-2 Input impedance unbalanced: 1 kOhm, 2.6 kOhm with PAD
  - AD Mic/Line 1-2 Signal to Noise ratio (SNR): 113.7 dB RMS unweighted, 117 dBA
  - AD Mic/Line 1-2 Frequency response @ 44.1 kHz, -0.1 dB: 18 Hz – 20.8 kHz
  - AD Mic/Line 1-2 Frequency response @ 96 kHz, -0.5 dB: 7 Hz – 45.8 kHz
  - AD Mic/Line 1-2 Frequency response @ 192 kHz, -1 dB: 5 Hz – 88 kHz
  - AD Mic/Line 1-2 THD: < -112 dB, < 0.00024 %
  - AD Mic/Line 1-2 THD+N: < -108 dB, < 0.00035 %
  - AD Mic/Line 1-2 THD @ 30 dB Gain: < -115 dB, < 0.00016 %
  - AD Mic/Line 1-2 THD+N @ 30 dB Gain: < -100 dB, < 0.001 %
  - AD Mic/Line 1-2 Channel separation: > 110 dB
  - AD Mic/Line 1-2 Gain range: -11 dB up to +65 dB
  - AD Mic/Line 1-2 Maximum input level XLR, Gain 0 dB: +8 dBu, PAD +19 dBu
  - AD Mic/Line 1-2 Maximum input level XLR, Gain 65 dB: -57 dBu, PAD -46 dBu
  - AD Line/Instrument In 3-4 Input: 6.3 mm TS jack, unbalanced
  - AD Line/Instrument In 3-4 Input impedance: 1 MOhm
  - AD Line/Instrument In 3-4 Signal to Noise ratio (SNR): 116 dB RMS unweighted, 120 dBA
  - AD Line/Instrument In 3-4 Frequency response @ 44.1 kHz, -0.1 dB: 5 Hz – 20.8 kHz
  - AD Line/Instrument In 3-4 Frequency response @ 96 kHz, -0.5 dB: < 3 Hz – 45.8 kHz
  - AD Line/Instrument In 3-4 Frequency response @ 192 kHz, -1 dB: < 2 Hz – 92 kHz
  - AD Line/Instrument In 3-4 Maximum input level @+4 dBu, Gain 0 dB: +13 dBu
  - AD Line/Instrument In 3-4 Maximum input level @-10 dBV, Gain 9 dB: -5 dBu
  - DA Line Out 1-2 Dynamic range (DR): 115 dB RMS unweighted, 118 dBA
  - DA Line Out 1-2 Frequency response @ 44.1 kHz, -0.5 dB: 0 Hz – 20.8 kHz
  - DA Line Out 1-2 Frequency response @ 96 kHz, -0.5 dB: 0 Hz – 45 kHz
  - DA Line Out 1-2 Frequency response @ 192 kHz, -1 dB: 0 Hz - 89 kHz
  - DA Line Out 1-2 THD: -106 dB, 0.0005 %
  - DA Line Out 1-2 THD+N: -102 dB, 0.0008 %
  - DA Line Out 1-2 Channel separation: > 110 dB
  - DA Line Out 1-2 Output: XLR balanced
  - DA Line Out 1-2 Output impedance: 300 Ohm balanced, 150 Ohm unbalanced
  - DA Line Out 1-2 Output level @ 0 dBFS: Balanced +19 / +4 dBu, unbalanced +13 / -2 dBu
  - DA Line Out 1-2 DC @ 0 dBFS: 6.35mm 4.8 V, 3.5mm 2.4 V, XLR bal. 9.6 V
  - DA Phones 3/4 (6.3 mm TRS) Output impedance: 10 Ohm
  - DA Phones 3/4 (6.3 mm TRS) Output level at 0 dBFS, 1 kOhm load: +13 dBu
  - DA Phones 3/4 (6.3 mm TRS) Max power @ 0.1% THD: 60 mW
  - DA Phones 3/4 (6.3 mm TRS) Signal to Noise ratio (SNR): 114.8 dB RMS unweighted, 118 dBA
  - DA Phones 3/4 (6.3 mm TRS) Noise level: -101.8 dBu
  - DA Phones 3/4 (3.5 mm TRS) Output impedance: 0.1 Ohm
  - DA Phones 3/4 (3.5 mm TRS) Output level at 0 dBFS, 1 kOhm load: +7 dBu
  - DA Phones 3/4 (3.5 mm TRS) Max power @ 0.1% THD: 90 mW
  - DA Phones 3/4 (3.5 mm TRS) Signal to Noise ratio (SNR): 114 dB RMS unweighted, 117 dBA
  - DA Phones 3/4 (3.5 mm TRS) Noise level: -107 dBu
  - MIDI: 1 x MIDI I/O via breakout cable with 2 x 5-pin DIN jacks
  - MIDI: Galvanically isolated by optocoupled input
  - MIDI: Hi-speed mode: Jitter and response time typically below 1 ms
  - MIDI: Separate 128 byte FIFOs for input and output
  - Clocks: Internal, ADAT In, SPDIF In
  - Jitter suppression of external clocks: > 50 dB (2.4 kHz)
  - Effective clock jitter influence on AD and DA conversion: near zero
  - PLL ensures zero dropout, even at more than 100 ns jitter
  - Digital Bitclock PLL for trouble-free varispeed ADAT operation
  - ADAT Optical Input: 1 x TOSLINK, 8 channels 24 bit up to 48 kHz
  - ADAT Optical Input Double Speed (S/MUX): 4 channels 24 bit 96 kHz
  - ADAT Optical Input Quad Speed (S/MUX4): 2 channels 24 bit 192 kHz
  - ADAT Lock Range: 31.5 kHz – 50 kHz
  - ADAT Jitter suppression: > 50 dB (2.4 kHz)
  - SPDIF optical Input: 1 x optical, according to IEC 60958, Consumer and Professional format
  - SPDIF optical Input Lock Range: 27 kHz – 200 kHz
  - ADAT optical Output: 1 x TOSLINK, 8 channels 24 bit up to 48 kHz
  - ADAT optical Output Double Speed (S/MUX): 4 channels 24 bit 96 kHz
  - ADAT optical Output Quad Speed (S/MUX4): 2 channels 24 bit 192 kHz
  - SPDIF optical Output: 1 x optical, according to IEC 60958, Consumer (SPDIF)
  - Power supply: USB bus power or external power supply
  - Idle power consumption: 2.8 Watts
  - Typical power consumption: 3.7 Watts
  - Max. power consumption: 5.4 Watts
  - Current at 5 V bus power operation: 700 mA (3.7 Watts)
  - Current at 12 V external power: 313 mA (3.7 Watts)
  - Dimensions (WxHxD): 108 x 35 x 181 mm (4.25" x 1.4" x 7.1")
  - Weight: 680 g (1.5 lbs)
  - Temperature range: +5° up to +50° Celsius (41° F up to 122° F)
  - Relative humidity: < 75%, non condensing
  - +19 / +4 dBu output level switch
  - Full SteadyClock FS circuit (as in ADI-2 Pro FS)
  - K-slot anti-theft protection
  - Bundled software: TotalMix FX, TotalMix Remote, DigiCheck
  - Class Compliant Mode (iOS compatible)
  - DC-coupled outputs
