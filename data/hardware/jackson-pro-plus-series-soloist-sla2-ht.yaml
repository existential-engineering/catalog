description: The Pro Plus Series Soloist SLA2 HT is the hardtail variant of the
  arched nyatoh Soloist SLA2, featuring a three-piece maple/walnut neck-through
  construction, bound ebony fingerboard, Seymour Duncan JB and '59 pickups, and
  a Jackson HT6 string-through hardtail bridge.
specs: |-
  - Body: Nyatoh, arched Soloist shape
  - Neck: 3-piece maple/walnut, neck-through-body
  - Scale Length: 25.5"
  - Fingerboard: Ebony, 12"-16" compound radius
  - Frets: 24 jumbo stainless steel
  - Inlays: Pearloid sharkfin
  - Bridge: Jackson HT6 string-through hardtail
  - Tuners: Jackson sealed die-cast
  - Pickups: Seymour Duncan JB (bridge), Seymour Duncan '59 (neck), HH
  - Controls: Volume, tone, 3-position blade switch
  - Strings: Nickel-plated steel (.009-.042)
