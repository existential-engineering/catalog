description: Custom Shop Hot Neon finish of the DDR, a dual-effect pedal with a
  crunch or lead drive channel and a delay or reverb wet channel, plus an
  effects loop, trails and true bypass.
details: |-
  This Custom Shop Hot Neon edition of the DDR combines drive and wet effects into one pedal. The drive section offers two overdrive styles: Crunch, a gritty British tube-amp combo sound, and Lead, a warm, dark, mid-pushed overdrive.

  The wet side covers delays and reverbs. A Vintage/Modern switch toggles between spring and plate reverb or analog and digital delay, and a centre toggle selects which family the wet channel runs, on Blend, Decay and Time controls.

  A built-in effects loop allows other pedals to be inserted between the drive and wet sections, or the pedal can run on its own. A side-mounted selector chooses true bypass or trails.
