details: |-
  The Charlie Brown V2 is a discontinued Marshall JTM45-style overdrive pedal from JHS Pedals. Version history: V1 = Larger enclosure; no Charlie icon. V2 = Changed to current enclosure size; diamond knob layout. V3 = Slightly different Drive Control and gain structure than V2. V4 = Color changed to yellow; added three-band tone stack; five controls total; U-shaped knob layout.
