description: Ziggurat is a 4 channel eurorack quantizer that turns control
  voltage and gate signals into melodies using note masks, ranges and offsets.
  It supports channel linking, per-note slew, and chained sequences with
  save/load of settings.
details: |-
  Ziggurat is a 4 channel quantizer designed to turn any combination of control voltage and gate signals into inspiring and unexpected melodies. Ziggurat provides a fresh way to explore harmonic relationships - wandering through different combinations of note masks, input signals, ranges and offsets until the music catches your ear - at which point all settings on the module can be easily saved for later reference
