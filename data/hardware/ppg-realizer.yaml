description: >-
  The final and most ambitious product from PPG, combining analog modeling, FM
  synthesis, wavetable synthesis, and sampling into a single all-digital
  workstation with a built-in monitor and graphical interface.
details: |-
  The Realizer was the last instrument PPG (Palm Products GmbH) ever produced, and very few units were completed before the company folded. It represented a remarkably forward-thinking attempt to combine sound production, emulation, processing, recording, sequencing, and mixing into one unified digital system.

  What made the Realizer truly unique was its approach to synthesis. It offered four distinct sound engines: an analog model, an FM model, wavetable synthesis, and a sampler. The built-in monitor displayed graphical representations of classic synthesizers like the Minimoog, allowing users to manipulate virtual knobs using the Realizer's physical controls. This concept of virtual instrument emulation was decades ahead of the software-based systems that would eventually make it commonplace.

  With a price tag of $65,000, the Realizer was never destined for mass-market success. Its extraordinary ambition ultimately contributed to PPG's demise, as the company went out of business shortly after the instrument's limited release in 1986. Today it stands as one of the rarest and most visionary synthesizers ever conceived.
