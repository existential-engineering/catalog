description: Let the sonic paint drip over your beats, melodies and sounds. The Analog Heat +FX is an all-around sound colouring and manipulation box, with a wide color palette of processing possibilities.
details: |-
  This is the heart and heat of this machine. Add warmth, depth and character with eight fully analog stereo distortion circuits, ranging from a subtle clean boost to complete annihilation. Each circuit offers its own unique way of processing sound: clean boost, saturation, enhance, mid-drive, crunch, distortion, harmonic fuzz, or high gain.

  Drift away when adding movement and texture with the worn-out warble effect, then continue that journey with a dash of chorus. Create rich, immersive soundscapes with the delay and reverb effects. Drip grit with a dash of bit and sample rate reduction. Squeeze or fine tune the dynamic range of your signal with the compressor, and let bass focus nail down the stereo field to mono at the chosen cross-over point.

  In the Flow page, you can quickly rearrange, mute and unmute the effects to find your own signal flow, with your own special timbres. Save your explorations in one of the 512 preset slots for instant recall. Shape and carve your material's frequency and overtone content using the resonant multi-mode filter, selecting from 7 filter types, then fine tune your lows and highs with the 2-band adaptable EQ before fracturing your sound using the noise gate.

  Enter the Mod page for a tool kit of modulation options, each with two destinations. Take the incoming sound and shape it into a modulation source using the envelope follower, which can be sent to parameters like the filter, drive, or bit reduction. Make parameters wobble and weave using any of the 3 multi-waveform LFOs with a wide speed range.

  You've got stereo in and stereo out plus two control inputs for control voltage, expression inputs, or foot switches. Full-sized MIDI in, out, and thru, with DIN sync support. USB is on board for easy connection to other class-compliant devices such as computers, phones, or tablets, and for a seamless computer integration with Overbridge. It can also double as a sound card.
specs: |-
  - 8 stereo analog distortion circuits
  - Stereo analog multi-mode filter (7 filter types)
  - 2-band adaptable stereo analog EQ
  - Noise gate, reverb, delay, chorus, warble, bits, compressor, bass focus
  - 1 assignable envelope generator/envelope follower with two destinations
  - 3 assignable LFOs with two destinations per LFO
  - 512 user preset slots
  - 128 x 64 pixel OLED screen
  - MIDI In/Out/Thru with DIN Sync out
  - 2 x 1/4" balanced audio out jacks
  - 2 x 1/4" balanced audio in jacks
  - 1 x 1/4" stereo headphones jack
  - 2 x 1/4" CV/Expression pedal input jacks
  - 48 kHz, 24-bit D/A and A/D converters
  - Hi-Speed USB 2.0 port
  - Headphones out level: +19 dBu peak, output impedance 36 ohm
  - Impedance balanced main outputs level: +19 dBu peak, impedance 440 ohm unbalanced
  - Balanced audio input level: +19 dBu peak, input impedance 39 kohm
  - Control input level: -5 V to +5 V, accepts CV, expression pedals, footswitches
  - Sturdy steel casing, W215 x D184 x H63 mm
  - Weight: approximately 1.5 kg
  - 100 x 100 mm VESA mounting holes
  - Overbridge enabled, class-compliant USB audio
  - 3 year Elektron warranty
