description: >-
  Let the sonic paint drip over your beats, melodies and sounds. The Analog Heat
  +FX is an all-around sound colouring and manipulation box, with a wide color
  palette of processing possibilities.
details: |-
  The Analog Heat +FX is a stereo analog effects processor featuring eight distinct distortion circuits ranging from subtle warmth to aggressive fuzz. Each circuit offers a unique character: Clean Boost, Saturation, Enhance, Mid-Drive, Crunch, Distortion, Harmonic Fuzz, and High Gain.

  Beyond distortion, the unit includes a stereo multi-mode analog filter with seven filter types, a 2-band adaptable stereo analog EQ, and a suite of digital effects including reverb, delay, chorus, and compressor. An envelope follower and three multi-waveform LFOs provide modulation capabilities.

  The Analog Heat +FX supports Overbridge integration for seamless DAW connectivity and class-compliant USB audio. It features 512 user preset slots, a 128x64 pixel OLED display, and VESA mounting compatibility. Housed in a sturdy steel casing measuring 215 x 184 x 63 mm.
specs: |-
  - 8 stereo analog distortion circuits
  - Stereo multi-mode analog filter (7 types)
  - 2-band adaptable stereo analog EQ
  - Digital effects: reverb, delay, chorus, compressor, noise gate
  - 1 envelope generator/follower, 3 multi-waveform LFOs
  - 512 user preset slots
  - 128 x 64 pixel OLED display
  - Overbridge enabled for DAW integration
  - Class-compliant USB 2.0 Hi-Speed audio
  - 48 kHz, 24-bit D/A and A/D converters
  - Audio I/O level: +19 dBu peak
  - 100 x 100 mm VESA mounting holes
  - Steel casing: 215 x 184 x 63 mm, ~1.5 kg
