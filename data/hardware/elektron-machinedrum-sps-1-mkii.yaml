url: https://www.elektron.se/legacy
description: Second generation of the Machinedrum with improved hardware,
  offering the same synthesis-based drum engine with enhanced processing and
  connectivity.
details: |-
  The Machinedrum SPS-1 MKII was the second hardware revision of the original Machinedrum drum machine, based on five original drum synthesis methods. With a razor sharp focus on percussion, it contained everything needed to create the perfect beat.

  The MKII revision improved the hardware design over the original MKI, including a switch from AC to DC power supply. It retained the same five drum synthesis engines and powerful step sequencer that made the original a classic.

  All Machinedrum variants share the same final firmware, OS 1.63, released May 2016. The SPS-1 MKII does not include the User Wave sampling engine found in the UW variants.
specs: |-
  - 5 drum synthesis methods
  - Step sequencer with parameter locks
  - 6 individual audio outputs (A/B balanced, C-F unbalanced)
  - 2 audio inputs
  - Power: 6 VDC, minimum 3A (PSU-2b)
  - Final firmware: OS 1.63 (May 2016)
