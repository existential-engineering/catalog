details: |-
  Dual Performance Filter - Rack Mount Edition

  This new Performance Filter is a dual stereo high-pass and low-pass filter, housed in a new 19" rack-mount version designed specifically for DJs and live performances. This powerful, 100% analog unit combines two stereo filters into a single, compact unit. Its unique Resonance Link feature allows you to control both frequency and resonance with a single knob, simplifying sound shaping and freeing up a hand during your performance

  Key Features:

  Dual Stereo Filters: Includes both high-pass and low-pass filters in one unit. Rackmount Design: Built for easy integration into your existing rack setup. Resonance Link: This dedicated control links the frequency and resonance. The higher you set the Resonance Link knob, the more the resonance is controlled by the main frequency knobs. This allows you to create dramatic filter effects and shape your sound with just one hand. Analog Purity: Experience the warmth and character of pure analog circuitry. Four-Pole, 24dB/octave Filters: Provides steep and precise filtering for both high-pass and low-pass functions. Versatile Connectivity: Compatible with various setups, including insert connections and direct connections between decks, mixers, and amplifiers. Note: This unit is not designed for send/return configurations. Handcrafted and Built to Order

  Each unit is meticulously hand-built to ensure exceptional quality and a unique aesthetic. Ordering and Payment

  The price shown is the full price, but please do not make a payment at this time . After we confirm the details of your order, you will receive an invoice to pay half of the total price . Once the unit is completed and ready to ship, you will be invoiced for the remaining balance and shipping costs.
