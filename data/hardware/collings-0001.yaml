details: |-
  The 0001 is a 12-fret 000-body guitar that, despite sharing the same body dimensions as the Collings OM, typically produces more bass and overall volume due to the longer 12-fret body configuration. It is designed for string-band purists and any guitarist seeking maximum power from a comfortably-sized instrument with an elegant, old-time appearance.

  The guitar features a Sitka spruce top with a pre-war scalloped X-brace pattern, paired with Honduran mahogany back, sides, and neck. The fingerboard and bridge are ebony, with the pyramid-style bridge offering 2 5/16" string spacing. The neck joint is a mortise and tenon hybrid.

  The 1-style trim package includes tortoise body binding with b/w/b/w top purfling, a walnut backstrip, dot fingerboard inlays, a simpler 1-style rosette, and nickel Waverly tuners. The body finish is high gloss nitrocellulose lacquer while the neck uses high gloss polyester resin.

  The 0001 comes standard with a deluxe hardshell case and D'Addario EJ-16 strings. Extensive customization is available, including alternative tonewoods, inlay styles, binding options, finishes, cutaway configurations, left-handed builds, and various bridge and saddle configurations.
specs: |-
  - Top: Sitka spruce
  - Back & sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony with MOP short dots
  - Bridge: Ebony pyramid-style, 2 5/16" string spacing
  - Scale length: 25 1/2"
  - Nut width: 1 13/16"
  - Body width: 15"
  - Body length: 20 1/4"
  - Body depth: 4"
