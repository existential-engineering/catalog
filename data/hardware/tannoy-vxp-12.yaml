url: https://www.tannoy.com/en/products/0312-aok
description: 1,600 Watt 12" Dual Concentric Powered Sound Reinforcement
  Loudspeaker with Integrated Lab Gruppen IDEEA Class-D Amplification.
details: |-
  1,600 Watt 12" Dual Concentric Powered Sound Reinforcement Loudspeaker with Integrated Lab Gruppen IDEEA Class-D Amplification. The VXP 12 delivers a compact, punchy, and sonically articulate solution for small-scale performance sound reinforcement, background music, and high-intelligibility speech applications. Its trapezoidal enclosure supports FOH, floor monitor, delay, and installed use. Compatible with Lake LM Series controllers.
specs: |-
  - amplification: Lab Gruppen IDEEA Class-D
  - powerOutput: 1,600 W
  - driver: 12" (305 mm) Dual Concentric
  - frequencyResponse: 70 Hz – 25 kHz ±3 dB; 58 Hz – 30 kHz –10 dB
  - nominalDispersion: 75° conical @ –6 dB points
  - directivityFactorQ: 9.7
  - directivityIndexDI: 9.9
  - sensitivity: 99 dB (1 W @ 1 m)
  - maxSPL_passive: 125 dB continuous, 131 dB peak
  - maxSPL_biamp: LF: 126 dB continuous, 132 dB peak; HF: 125 dB continuous, 131 dB peak
  - powerHandling_passive: 400 W continuous, 1,600 W peak
  - powerHandling_biamp: LF: 400 W continuous, 1,600 W peak; HF: 80 W continuous, 320 W peak
  - impedance_passive: 8 Ω
  - impedance_biamp: 8 Ω LF / 8 Ω HF
  - crossoverType: Passive / Bi-amp switchable
  - cabinetConstruction: 15 mm and 18 mm plywood, vented and internally braced
  - finish: Semi matt black paint (white optional)
  - grille: Powder coated perforated steel mesh
  - dimensions: 591 × 451 × 421 mm (H × W × D)
  - weight: 25.5 kg (56.2 lbs)
  - flyingHardware: M10 × 8 flying inserts (portrait or landscape), M10 × 8 yoke bracket inserts, 2× Intergrip carrying handles, blanking plate for optional VTH pole mount, compatible with industry-standard brackets M6 × 4 inserts
  - operatingModes: Manual (MAN) or Auto (AUTO)
  - filter: Full range (FR) or High pass filter (HPF) switchable
  - dsp: Compatible with Lake LM Series controllers; free DSP settings available for download
