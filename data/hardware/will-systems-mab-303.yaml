description: >-
  The MAB-303 is an analog half-rack desktop synthesizer module that emulates
  the classic Roland TB-303 bass synthesizer. It captures the iconic 303 sound
  through true analog circuitry, adding a pulse waveform alongside the
  traditional square and sawtooth waves. MIDI integration allows control of LFO,
  pitch modulation, pitch bending, velocity sensitivity, and auto-glide features
  for use with external sequencers.
details: |-
  The MAB-303 houses a complete analog VCO synthesizer engine in a half-rack module with controls mirroring the original TB-303. The front panel includes knobs for waveshape, VCF cutoff, resonance, envelope modulation, accent, and volume, providing an intuitive hands-on interface for sound design.

  The unit updates the classic 303 formula for modern studio use by introducing a pulse waveform alongside the traditional square and sawtooth waves. MIDI implementation allows control of LFO, pitch modulation, pitch bending, velocity sensitivity, and auto-glide features, though the physical front-panel controls are not MIDI-assignable.

  Sonically, the MAB-303 delivers a convincing 303 sound while its additional features and MIDI integration make it well-suited for use with external MIDI sequencers in contemporary production environments. Notable users include electronic music artists ATB and Acid Junkies.
specs: |-
  - Monophonic
  - 1 VCO with square, sawtooth, and pulse waveforms
  - 18 dB/octave low-pass filter with resonance and envelope modulation
  - LFO modulation
  - MIDI control (LFO, pitch modulation, pitch bend, velocity, auto-glide)
  - Half-rack desktop/rack-mount format
  - No internal memory
  - No keyboard (external MIDI control required)
releaseDate: "1996"
