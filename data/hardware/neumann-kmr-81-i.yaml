url: https://www.neumann.com/en-us/products/microphones/kmr-81-i-
description: The KMR 81 i is a shotgun microphone for medium distances, e.g. for
  film dialogue with a clear and focused sound while the microphone is placed
  outside the picture. The KMR 81 i offers high sensitivity with low power
  consumption and is lightweight for easy handling.
details: |-
  High directivity with 90° recording angle

  Excellent rejection of unwanted sound

  Natural sound without off-axis coloration

  Low cut and pad switches

  Lightweight (145 g)

  Low power consumption
specs: |-
  - Acoustical operating principle: Pressure gradient interference transducer
  - Directional Pattern: Supercardioid/lobe
  - Frequency Range: 20 Hz ... 20 kHz
  - Sensitivity at 1 kHz into 1 kohm: 18 mV/Pa ± 1 dB
  - Rated Impedance: 150 ohms
  - Rated load impedance: 1 kohms
  - Equivalent noise level, CCIR: 23 dB
  - Equivalent noise level, A-weighted: 12 dB-A
  - Maximum SPL for THD 0.5%: 128 dB
  - Maximum SPL for THD 0.5% with preattenuation: 138 dB
  - Signal-to-noise ratio, CCIR (re. 94 dB SPL): 71 dB
  - Signal-to-noise ratio, A-weighted (re. 94 dB SPL): 82 dB
  - Supply voltage ( P48, IEC 61938): 48 V ± 4 V
  - Current consumption ( P48, IEC 61938): 0.8 mA
  - Weight: 145 g
  - Diameter: 21 mm
  - Length: 213 mm
