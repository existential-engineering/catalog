description: Adds MIDI In, Out and Thru sockets to the early version of the Linn
  LM-1 (volume control top left), so the machine can be played and synchronised
  over MIDI and can send its own notes and clock. Later machines, with the
  volume control top centre, take a different kit.
details: |-
  A MIDI retrofit kit for the early version of the Linn LM-1 drum computer, identified by its volume control at the top left of the panel. Later machines, with the volume control top centre, take a different kit.

  On incoming MIDI the retrofit responds on any channel, default 10, and follows MIDI clock with start and stop. Any of the machine's sounds can be mapped to any MIDI note number, with defaults running from 36 to 46. Velocity control of note volume is available at two levels for Bass, Snare, Hihat, Tamb and Cabasa; the remaining sounds play at one level only.

  Outgoing MIDI works the same way round. The retrofit transmits on any channel, default 10, sends MIDI clock with start and stop, and generates notes from the same mapping table, giving velocity 64 for a low volume hit and 127 for a high volume one.

  In hardware terms the kit adds MIDI In, Out and Thru DIN sockets plus a push button for programming the MIDI setup, and setups are held in non-volatile EEPROM. The kit comprises a circuit board that fits inside the LM-1, a small pack of DIN sockets and mounting hardware, a large pack of cable assemblies, user instructions and step by step fitting instructions with diagrams.

  Installation is a skilled job and the kits are not meant to be fitted by the end user: they should be installed by an experienced synthesiser engineer, or fitted by the maker at its premises in Tadworth, outside London.
specs: |-
  - Fits the early Linn LM-1 with volume control at top left
  - Receives on any MIDI channel, default channel 10
  - Follows MIDI clock, start and stop
  - Any sound mappable to any MIDI note number, defaults 36 to 46
  - Two level velocity control of note volume for Bass, Snare, Hihat, Tamb and Cabasa; other sounds one level
  - Transmits on any MIDI channel, default channel 10
  - Sends MIDI clock, start and stop
  - Transmitted notes use velocity 64 for low volume and 127 for high volume
  - Adds MIDI In, Out and Thru DIN sockets and a programming push button
  - Setups stored in non-volatile EEPROM
