id: JCNT9ek96TgSHFS-Qv3Or
name: Micro Clock mkII
manufacturer: black-lion-audio
primaryCategory: rack-mount
url: https://blacklionaudio.com/en/products/micro-clock-mkii
description: Compact master word clock generator with 6 BNC outputs
details: |-
  The Micro Clock mkII is a master word clock generator designed to synchronize digital audio devices. Simple and unassuming in appearance, it features a rugged 3" x 4" chassis that provides optimum RF shielding with no lights or frequency display. It offers six selectable output frequencies from 44.1 kHz to 192 kHz, delivering approximately 5 volts peak-to-peak output level with jitter at the crystal oscillator of approximately 1 picosecond RMS and just under 10 picoseconds RMS at the output. Compatible with all modern digital devices equipped with 75 ohm BNC word clock inputs. Powered by a 9-volt DC wall adapter capable of accepting both 120 and 240 volts AC.
specs: |-
  - Output Frequencies: 44.1, 48, 88.2, 96, 176.4, 192 kHz (selectable)
  - Output Level: ~5V peak-to-peak
  - Jitter at Crystal Oscillator: ~1pS RMS
  - Jitter at Output: <10pS RMS
  - BNC Output Impedance: 75Ω
  - Power Supply: 9V DC wall adapter (accepts 120–240V AC)
