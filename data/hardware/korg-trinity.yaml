description: >-
  The Korg Trinity is a 32-voice digital music workstation released in 1995,
  featuring Korg's ACCESS (Advanced Combined Control Synthesis System) engine
  and a revolutionary 320x240 TouchView graphical interface. It offered 24 MB of
  PCM ROM with approximately 375 multi-samples and 258 drum sounds, along with
  comprehensive effects processing and a built-in 16-track sequencer. The
  Trinity line established the design language that Korg would carry forward
  into the Triton and subsequent workstation series.
details: |-
  The Trinity represented a major breakthrough for Korg when it debuted in 1995. Its TouchView graphical display was revolutionary for the era, combining intuitive sound programming with a sleek industrial design that set it apart visually and functionally from competing workstations. The 320x240 pixel touchscreen served as the heart of the instrument, making deep editing far more accessible than the button-and-knob interfaces of its contemporaries.

  At its core is the ACCESS (Advanced Combined Control Synthesis System) engine with 24 MB of PCM ROM containing 375 multi-samples and 258 drum samples. A digital multi-mode filter with high-pass, low-pass, band-pass, and band-reject modes with resonance provides versatile tone shaping. The effects section is comprehensive, offering two master effects plus eight simultaneous insert effects drawn from 110 algorithms.

  The built-in 16-track sequencer handles 80,000 notes across 20 songs and 100 patterns, making the Trinity a self-contained production environment. Real-time controllers include a joystick, ribbon controller, and two assignable knobs for expressive performance. Expansion options included a SCSI port, internal hard disk recording, an 8 MB Flash ROM sampler, and ADAT digital I/O.

  The Trinity was available in three keyboard configurations: the standard 61-note model, the 76-note Pro, and the 88-note ProX. A Plus variant arrived in 1996 adding sounds from the Korg Prophecy. The V3 series followed in 1998, integrating 128 sounds from Korg's Z1 physical modeling synthesizer via MOSS synthesis. A rackmount TR-Rack variant offered 32 MB of sound ROM in a compact form factor. Notable users include Juno Reactor, Depeche Mode, Duran Duran, and Vangelis.
specs: |-
  - Polyphony: 32 voices
  - Sound Source: ACCESS (Advanced Combined Control Synthesis System)
  - ROM: 24 MB PCM (375 multi-samples, 258 drum samples)
  - Filter: Digital multi-mode (high/low/band pass, band reject, resonance)
  - Effects: 2 master + 8 insert effects (110 algorithms)
  - Sequencer: 16-track, 80,000 notes, 20 songs, 100 patterns
  - Keyboard: 61-note (standard), 76-note (Pro), 88-note (ProX)
  - Display: 320x240 TouchView graphical touchscreen
  - Controllers: Joystick, ribbon controller, 2 assignable knobs
  - MIDI: 16-part multitimbral
  - Expansion: SCSI, 8 MB Flash ROM sampler, ADAT digital I/O
  - Production Years: 1995-1998
