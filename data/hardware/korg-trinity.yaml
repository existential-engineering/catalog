description: >-
  The Korg Trinity is a 32-voice digital workstation from 1995 featuring
  Korg's ACCESS synthesis system, a TouchView graphical interface, 24 MB of
  PCM ROM, and extensive effects processing.
details: |-
  The Trinity represented a major breakthrough for Korg when it debuted in 1995. Its TouchView graphical display was revolutionary, combining intuitive programming with a sleek industrial design that set it apart visually and functionally from competing workstations of the era.

  At its core is the ACCESS (Advanced Combined Control Synthesis System) engine with 24 MB of PCM ROM containing 375 multi-samples and 258 drum samples. The later V3 models added 128 sounds derived from Korg's Z1 physical modeling synthesizer. A digital multi-mode filter with high-pass, low-pass, band-pass, and band-reject modes with resonance provides versatile tone shaping.

  The effects section is comprehensive, offering two master effects plus eight simultaneous insert effects drawn from 110 algorithms. The 16-track sequencer handles 80,000 notes across 20 songs and 100 patterns. Real-time controllers include a joystick, ribbon controller, and two assignable knobs for expressive performance.

  The Trinity was available in three keyboard configurations: the standard 61-note model, the 76-note Pro, and the 88-note ProX. A Plus variant arrived in 1996, and the V3 series followed in 1998 with expanded sound content. The Trinity line established Korg's workstation design language that would carry forward into the Triton and beyond.
specs: |-
  - Polyphony: 32 voices
  - Sound Source: ACCESS synthesis system
  - ROM: 24 MB PCM (375 multi-samples, 258 drum samples)
  - Filter: Digital multi-mode (high/low/band pass, band reject, resonance)
  - Effects: 2 master + 8 insert effects (110 algorithms)
  - Sequencer: 16-track, 80,000 notes, 20 songs, 100 patterns
  - Keyboard: 61-note (standard), 76-note (Pro), 88-note (ProX)
  - Display: TouchView graphical interface
  - Controllers: Joystick, ribbon controller, 2 assignable knobs
  - MIDI: 16-part multitimbral
