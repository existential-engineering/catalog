details: |-
  The Charvel Pro-Mod So-Cal Style 1 HH HT MPL is a hardtail electric guitar built on Charvel's iconic So-Cal Style 1 platform. It pairs an ash body with a gloss finish and a bolt-on maple neck featuring graphite reinforcement and a hand-rubbed satin urethane back for fast, comfortable playability.

  The 12"-16" compound radius maple fingerboard hosts 22 jumbo frets with black dot inlays and is mated to a 25.5" scale length with a 1.6875" black plastic nut and heel-mount truss rod adjustment wheel for easy setup tweaks.

  The HH electronics layout is loaded with a Seymour Duncan Distortion TB-6 humbucker in the bridge and a Seymour Duncan Distortion SH-6N humbucker in the neck. A 3-position blade switch routes the pickups, while a push/pull volume knob delivers coil-split versatility alongside a master tone control.

  Hardware includes a Charvel HT6 string-through-body hardtail bridge and Charvel sealed die-cast locking tuners in black, paired with a 1-ply black pickguard, knurled flat-top knobs, and a licensed Fender Stratocaster headstock. Strung with .009-.042 nickel plated steel.
