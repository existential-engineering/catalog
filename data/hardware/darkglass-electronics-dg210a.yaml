description: Unleash 500 Watts of pure analog power and experience unparalleled
  flexibility with the Darkglass Microtubes 500 2x10 combo amp.
details: |-
  The Darkglass Microtubes 500 Combo 210 unleashes 500 Watts of pure analog power in a 2x10 combo format. Its all-analog preamp carries the signature VMT and B3K drive voices alongside a studio-grade compressor with automatic gain adjustment. A four-band ultra-quiet EQ with adjustable mid frequencies shapes the tone. The back panel provides Pre and Post XLR DI outputs with ground lift, a Line In and Line Out, an effects loop Send, a MIDI In, a USB port, and an external speaker jack.
specs: |-
  - 500W 2x10 analog combo amplifier
  - Analog preamp with signature VMT and B3K drives
  - Studio compressor with automatic gain adjustment
  - Four-band ultra quiet EQ with adjustable mid frequencies
  - Pre and Post XLR DI outputs with ground lift
  - Line In, Line Out, effects loop Send
  - MIDI In and USB
  - External speaker jack
