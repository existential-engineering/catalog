details: |-
  The T5z Pro is a thinline hollowbody hybrid that bridges the gap between electric and acoustic guitars. An integrated armrest on the upper body edge and rounded edges provide comfort for long playing sessions, equally at home on stage or in the studio.

  The three-pickup system — concealed neck humbucker, visible middle humbucker, and acoustic body sensor — is controlled by 5-way switching with active tone circuitry, spanning warm acoustic-like tones to full electric output.

  Built with a Big Leaf Maple top and Shamel Ash back and sides, with a Neo-Tropical Mahogany neck in Taylor's T5 Carve profile. The West African Crelicam Ebony fretboard features Faux Pearl/Silver Spire inlays, jumbo frets, and a 24-7/8" scale length.

  The Harbor Blue colorway features a Harbor Blue Shaded Edgeburst top with black back, sides, and neck in gloss finish. Ships with a deluxe hardshell case.
