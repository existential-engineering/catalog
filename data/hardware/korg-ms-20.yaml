description: >-
  A landmark portable analog monosynth from Korg featuring dual resonant filters, a semi-modular
  patch bay, and an aggressive sound character that has defined electronic music for decades.
details: |-
  Introduced in 1978, the Korg MS-20 quickly established itself as one of the most important analog synthesizers of its era. As the larger sibling to the MS-10, it offered a compelling combination of hard-wired signal routing and a patch panel that allowed players to override and reconfigure the default architecture — a design philosophy reminiscent of the ARP 2600. This flexibility made it equally at home producing conventional synth tones and experimental, boundary-pushing textures.

  The sonic heart of the MS-20 lies in its dual multimode voltage-controlled filters, capable of lowpass, highpass, notch, and band-reject configurations. These filters are famously aggressive when pushed into self-oscillation, producing screaming resonant sweeps that cut through any mix. Paired with two VCOs, a noise generator, sample-and-hold circuit, and an envelope follower, the MS-20 offers a surprisingly deep palette for a compact monosynth.

  One of its most creative features is the ability to route external audio through its filters and use a pitch-to-CV converter to trigger the synthesizer from outside sound sources. This opened up possibilities for processing guitars, vocals, and drum machines in ways that were unusual for affordable instruments of the period.

  The MS-20's legacy extends far beyond its original 1978–1983 production run. Artists including Aphex Twin, Daft Punk, Portishead, and Jean-Michel Jarre have relied on its raw, biting character. Korg acknowledged its enduring influence by releasing the MS-20 mini and MS-20 FS reissues, ensuring that its distinctive sound remains accessible to new generations of musicians.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs plus noise generator
  - LFO: 1 with multiple waveforms
  - Filter: 2 multimode VCFs (lowpass, highpass, notch, band-reject) with ADSR
  - VCA: 2 VCAs with ADSR and sample-and-hold with envelope follower
  - Keyboard: 37 keys
  - Control: CV/Gate, external audio input, pitch-to-CV converter
  - Patch Panel: Semi-modular with patch cord override
  - Date Produced: 1978–1983
