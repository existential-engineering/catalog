  modern construction.
details: |-
  The Pro-Mod DK24 HSS 2PT CM pairs a Dinky-shaped alder body in a satin finish with a bolt-on caramelized maple neck featuring graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges for a broken-in feel. The body includes a scalloped lower back bout and shredder's cut heel for unimpeded upper-fret access.

  A caramelized maple fingerboard with a 12" to 16" compound radius hosts 24 jumbo frets, 4mm pearloid dot inlays, and Luminlay side dots, all anchored by a 1.6875" Graph Tech TUSQ XL nut and a 25.5" scale length.

  Electronics are built around a versatile HSS configuration: a Seymour Duncan Full Shred TB-10 at the bridge paired with Seymour Duncan Custom Flat Strat SSL-6 (middle) and SSL-6 RWRP (neck) single-coils, routed through a 5-position blade switch. A 500K EVH Bourns Low Friction volume pot and a no-load tone control round out the wiring.

  Hardware includes a Gotoh Custom 510 tremolo with Gotoh tremolo arm, Charvel-branded die-cast locking tuning machines in chrome, Stratocaster-style skirt control knobs, and a beveled output jack. A heel-mount truss rod adjustment wheel completes a thoroughly modern high-performance platform.
