description: Great starter. Great expander. You're either looking to get started
  in eurorack or you're hooked and it's time to expand.
details: |-
  A Bento Box for Modules. These simple, stylish, cleverly designed Eurorack modular cases balance smart functionality with elegant form.

  Single row Eurorack module space (3U) with additional 1U row along the top for mounting all sorts of essential utility modules.

  Super strong extruded aluminum design with a highly resilient surface finish that has been anodized and sandblasted. Threaded inserts allow for modules to be mounted with standard M3 screws, no sliding nuts.

  Options to mount power entry and switch on the side cheek or in a 1U panel. All power configurations come with a high wattage, low noise, star power TPS series powered busboard and Meanwell AC/DC adapter.
specs: |-
  - 104HP width (variant tested)
  - 3U module row plus additional 1U utility row
  - Power options: No Power / 30W Side Entry Power+Switch / 1U Tile Entry Power+Switch
  - Extruded aluminum construction, anodized and sandblasted finish
  - TPS series powered busboard with Meanwell AC/DC adapter (powered configurations)
  - M3 threaded inserts for module mounting
