url: https://joranalogue.com/products/step-8
description: A sequential tracking/sampling register combining an analogue
  1-to-8 signal switch with eight high-stability track/sample-and-hold stages,
  usable as a sequencer, shift register, or voltage-controlled switch.
details: |-
  SEQUENTIAL TRACKING/SAMPLING REGISTER 16 HP | +12: 110 mA, −12: 45 mA | JORS8 User Manual (PDF) | ModularGrid Available exclusively through our authorised dealer network . Sequencers, sequential switches, counters, analogue shift registers... Modular synthesisers provide a wealth of creative sequential functions for controlling and processing signals. Choosing which of these to include in a system can be a bewildering task. Except when you don’t have to choose. Step 8 represents a new type of modular building block: a sequential tracking/sampling register, which can be configured to provide any of these functions, and many more. At its heart lies an analogue 1-to-8 signal switch feeding an octet of high-stability track/sample-and-hold stages. Each of these has its own analogue output with an attenuation slider, in addition to a gate output. LEDs visualise the status of each stage in real time. The switch can be controlled sequentially using the built-in 8-step counter, or addressed directly by an analogue control voltage (CV). Numerous advanced circuit techniques are used to avoid the issues that often plague analogue switching and memory modules. The result: totally transparent signal paths with low noise, distortion and voltage ‘droop’, yet high bandwidth and precision. Add to this the ability to ‘mute’ the inactive stages, pause the counter, reset it, change its direction or even shift the stages on each step, and the possibilities quickly become near-endless. A scanning output takes things even further, particularly making sequencer or addressed voltage source use easy and intuitive. For those who are feeling adventurous, there are always more applications to try: configurable voltage mapper, hocketing controller, clock divider, graphic waveshaper, multi-output analogue downsampler... Discover a new world of sequential synthesis with Step 8.
specs: |-
  - Analogue 1-to-8 voltage tracking or high-speed sampling register.
  - Precision circuitry to process any signal, including pitch CV, accurately.
  - Cycling or shifting sequential control modes.
  - 8 high-performance 'low droop' hold circuits with solo function.
  - Integrated sequential counter with step, pause, reset and reverse inputs, and step button.
  - Step trigger output for easy tempo synchronisation of additional modules.
  - Stage input to directly address the register via control voltage.
  - Impedance-compensated individual stage analogue outputs with LED-equipped attenuation sliders.
  - Scanning output for sequencer, addressed voltage source or waveshaper use.
  - Individual stage gate outputs with LEDs.
  - Bullet-proof design: polarised power header and MOSFET protection circuit.
  - Includes 16-to-10-pin Eurorack power ribbon cable.
  - Premium mounting hardware: black screws, black nylon washers and matching hex key.
  - High-quality components and assembly; designed and made in Belgium.
