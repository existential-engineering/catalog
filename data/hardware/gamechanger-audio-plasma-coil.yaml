description: A Third Man Records version of the PLASMA Pedal that amplifies the
  instrument signal to 3500 volts and discharges it through a xenon tube, taking
  its output from an antenna reading the electromagnetic field around the
  discharge. It adds six octave-style effect modes and a second footswitch,
  switchable between latching and momentary, to engage them.
details: |-
  Third Man Hardware and Gamechanger Audio announce the PLASMA Coil, a special version of the PLASMA Pedal created by Gamechanger Audio and Third Man Records. The PLASMA Coil is used by Jack White on the Raconteurs' album Help Us Stranger and on the subsequent tour.

  At its heart is Gamechanger's High Voltage Distortion technology, which expresses the audio signal as a series of electrical discharges. PLASMA Distortion is the first commercial musical device that literally amplifies the audio signal to 3500 volts, and the Coil takes that further by adding multiple octave-style circuits and an additional effects footswitch that can be toggled as latching or momentary. The expected life of the xenon tube is 10,000 to 70,000 hours of active playing.

  The tube acts as a natural noise gate. As soon as playing stops, the electrical discharge within the gas-filled tube is interrupted and the pedal produces no output signal at all, which removes the in-between noises created by an instrument's pickups or by humming strings and allows extreme contrasts between individual notes.

  The pedal loses the original dry input signal and creates a new one from fluctuations in the electromagnetic field surrounding the gas-discharge tube, which gives it a very wide frequency range, with dedicated knobs to boost and cut the lows and highs.

  Converting the instrument's signal into a rapid series of electric discharges produces a large amount of non-linear harmonic saturation. That causes rich and responsive attacks and brings out sharp overtones and harmonics, artifacts of the high voltage discharge that are uncommon in traditional signal amplification.
specs: |-
  - 2 EQ controls to boost or cut low and high frequencies
  - VOLTAGE knob adjusts the amount of electrical current sent to the PLASMA tube
  - EFFECTS knob selects 1 of 6 different effect types
  - Effect type: volume boost
  - Effect types: 2 subharmonic modes (bitcrush-style octave down)
  - Effect type: 1 upper harmonic mode (octafuzz-style octave up)
  - Effect types: 2 mixed modes (upper and lower harmonics combined)
  - Effects footswitch engages the PLASMA Coil's special effect circuit
  - Master VOLUME knob cuts or boosts the output signal level
  - ON/OFF silent footswitch
  - Effects footswitch toggle on the back panel configures the effects footswitch as a latching ON/OFF switch or as a momentary switch
  - Simplified signal chain: input, EQ, octave/effect, transformer to high voltage, xenon tube, antenna that picks up the electromagnetic vibrations surrounding the tube, output
  - Amplifies the audio signal to 3500 volts
  - Expected life of the xenon tube is 10,000 to 70,000 hours of active playing
  - Uses a standard 9V DC center-negative pedal power supply of at least 250 mA. The power supply is not included
  - Weight 1 kg
  - Dimensions 16 x 11 x 10 cm
