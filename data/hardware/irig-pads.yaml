description: iRig Pads is an ultra-portable MIDI pad controller with 16
  velocity-sensitive backlit pads, programmable knobs, buttons, slider, and
  rotary encoder for beat-making and groove production on iPhone, iPad, Mac,
  and PC.
details: |-
  iRig Pads features 16 velocity-sensitive backlit rubber pads that light in multiple colors depending on velocity and MIDI messages, plus two MIDI knobs, two pushbuttons, one slider, and a pushbutton rotary encoder -- all fully programmable. 16 user-programmable MIDI scenes provide instant recall of custom MIDI maps.

  Fully MIDI class-compliant and designed for beat-making, loop cueing, and DJing. Pre-programmed MIDI scenes for SampleTank are included. The expression/sustain pedal input adds hands-free control. USB port supplies power when connected to iOS devices.

  Includes SampleTank 4 SE for Mac/PC, SampleTank free for iPhone/iPad, and iRig Pads Editor for Mac/PC. In the box: iRig Pads unit, Lightning cable (60cm), and USB cable (60cm).
specs: |-
  - 16 velocity-sensitive pads with multicolor indicators
  - 2 programmable MIDI knobs
  - 2 programmable pushbuttons
  - 1 programmable slider
  - 1 pushbutton rotary encoder
  - 16 user-programmable MIDI scenes
  - Expression/sustain pedal input
  - Fully MIDI class-compliant
  - Bus powered (no batteries or AC adapter required)
  - Connectivity: Lightning and USB cables included
  - Dimensions: 190 mm (7.5") x 205 mm (8.1") x 23 mm (0.9")
  - Weight: 547 g (1.2 lb)
