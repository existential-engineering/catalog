description: >-
  The Hypersynth Xenophone is an analog semi-modular desktop synthesizer from 2015 with a 100%
  analog signal path, 88 status LEDs, and a modulation matrix for flexible routing beyond its
  hardwired connections.
details: |-
  The Hypersynth Xenophone, released in 2015, stands out as an original design rather than a recreation of an existing synthesizer. It features a 100% analog signal path where the oscillators, mixer, filter, VCAs, and distortion are all based on analog circuits. The only digital element is the optional digital effects section, which can be muted to maintain a pure analog signal.

  The synth engine features three oscillators, a mixer, a multi-mode filter, and a main section forming the audio group, complemented by a modulation group containing voice settings, three envelopes, three LFOs, an arpeggiator, a 16x4 step sequencer, and a modulation matrix. The semi-modular architecture provides hardwired connections for all important functions while the modulation matrix allows custom signal routing. The Xenophone supports both monophonic and duophonic operation.

  The compact desktop design packs 27 buttons and 26 encoders into a small footprint, eliminating the need for menu diving. The 88 LEDs are tied to virtually every function, providing instant visual feedback of the instrument's state, supplemented by a free-angle OLED display. The rigid aluminum case with vintage-style wooden side panel comes in both black and white models, with an optional acrylic stand for 30 or 60-degree tilting.

  The Xenophone responds to standard MIDI messages along with dedicated CC, NRPN, and SysEx commands, and shipped with a software editor for remote control and automation of every parameter. Four types of analog distortion and 24-bit stereo digital effects round out the sound shaping options.
specs: |-
  - Polyphony: 2 voices (duophonic)
  - Oscillators: 3
  - Waveforms: Pulse Variable, Saw Up, Square, Triangle, Pink Noise, White Noise
  - Filter: Multi-mode (6dB, 12dB, 18dB, 24dB slopes; LP, HP, BP, Notch) with resonance
  - LFO: 3 with S&H, Saw Up, Square, Triangle; key sync and phase control
  - Envelopes: 3 (Amplitude, Filter, Modulation)
  - Sequencer: 16x4 step sequencer
  - Arpeggiator: Yes, with gate adjustment, various spans, 15 clock divisions
  - Effects: 4 types analog distortion, 24-bit stereo digital FX
  - Control: MIDI In/Out
releaseDate: "2015"
