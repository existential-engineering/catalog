description: >-
  The Hypersynth Xenophone is a 100% analog semi-modular desktop synthesizer released in
  2015, featuring three oscillators, a multi-mode filter, and a modulation matrix for
  flexible signal routing. Its compact aluminum enclosure packs 27 buttons, 26 encoders,
  and 88 status LEDs, eliminating the need for menu diving. An optional 24-bit stereo
  digital effects section can be muted to preserve a pure analog signal path.
details: |-
  The Hypersynth Xenophone stands out as an original design rather than a recreation of an existing synthesizer. It features a 100% analog signal path where the oscillators, mixer, filter, VCAs, and distortion are all based on analog circuits. The only digital element is the optional digital effects section, which can be muted to maintain a pure analog signal.

  The synth engine is organized into two groups: an Audio group comprising three oscillators, a mixer, a multi-mode filter, and a main output section, and a Mod group containing voice settings, three envelopes (amplitude, filter, and modulation), three LFOs, an arpeggiator, a 16x4 step sequencer, and a modulation matrix. The semi-modular architecture provides hardwired connections for all primary functions while the modulation matrix allows custom signal routing beyond the defaults. The Xenophone supports both monophonic and duophonic operation.

  The compact desktop form factor packs 27 buttons and 26 encoders into a small footprint, eliminating the need for menu diving. All 88 LEDs are tied to virtually every function, providing instant visual feedback of the instrument's state, supplemented by a free-angle OLED display. The rigid aluminum case with vintage-style wooden side panels comes in both black and white models, with an optional acrylic stand offering 30 or 60-degree tilting angles.

  The Xenophone responds to standard MIDI messages along with dedicated CC, NRPN, and SysEx commands, and shipped with a software editor for remote control and automation of every parameter. Four types of analog distortion and 24-bit stereo digital effects round out the sound-shaping options.
specs: |-
  - Polyphony: 2 voices (duophonic)
  - Oscillators: 3
  - Waveforms: Pulse Variable, Saw Up, Square, Triangle, Pink Noise, White Noise
  - Filter: Multi-mode (6dB, 12dB, 18dB, 24dB slopes; Low Pass, High Pass, Band Pass, Notch) with resonance
  - LFO: 3 with Sample & Hold, Saw Up, Square, Triangle; key sync and phase control
  - Envelopes: 3 (Amplitude, Filter, Modulation)
  - Sequencer: 16x4 step sequencer
  - Arpeggiator: Yes, with gate adjustment, various spans, 15 clock divisions
  - Effects: 4 types analog distortion, 24-bit stereo digital FX
  - Controls: 27 buttons, 26 encoders
  - LEDs: 88 status LEDs
  - Display: Free-angle OLED
  - Case: Rigid aluminum with vintage-style wooden side panels
  - MIDI: In/Out with CC, NRPN, and SysEx support
