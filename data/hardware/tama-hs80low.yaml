description: TAMA's patented toothless Quick-Set Tilter marks another TAMA advancement in hardware. Relying on basic principles of physics, the Quick-Set Tilter holds its position using the friction of six smooth metal disc plates instead of traditional toothed gears, so you can adjust it to any desired angle.
details: |-
  Quick-Set Tilter (US. PAT.NO.7385127): TAMA's patented toothless Quick-Set Tilter marks another TAMA advancement in hardware. Relying on basic principles of physics, the Quick-Set Tilter holds its position using the friction of six smooth metal disc plates instead of traditional toothed gears, so you can adjust it to any desired angle. This mechanism also has a more durable structure than a conventional gear tilter.

  Escape Claw: TAMA’s Escape Claws rubber cushions allow the snare drum to float on the basket arms for improved resonance. In addition, they help reduce fatigue by softening the impact of snare drum playing on your arms and wrists.

  Low Position Setting Basket: The HS80LOW snare stand features a new snare basket which allows the snare drum to be positioned 100mm lower than the HS80W stand.

  Nylon Washers: By inserting nylon washers into the leg stand joints we have improved durability and made the leg action much smoother!

  Glide-Tite Grip Joint (US.PAT.NO.9631656): Our new Glide-Tite Grip Joint allows for a more secure attachment by using a metal-to-metal contact point. This provides an extremely solid anchor and complete isolation for a tom or cymbal. Because the stand does not move with the instrument, the natural resonance of that instrument is maximized.
