details: |-
  The PRS Studio model is a modern take on a traditional single-single-hum guitar, with PRS’s proprietary Narrowfield pickups in the middle and bass positions and a McCarty III humbucking treble pickup. McCarty III pickups were spec’d by Paul Reed Smith and the PRS New Products Engineering team after years of hands-on research with coveted vintage pickup models and advancements in signal analyzation and “tuning” technology. PRS McCarty III pickups are vintage-inspired humbuckers that bring a vocal clarity to their full, warm tone.

  The PRS Studio offers punchy singlecoils, vintage scooped tones, and the chunky kick of a treble humbucker screaming in one instrument. This whole new scope of sounds are only possible with a three-pickup guitar and are easily accessible in the Studio model thanks to the push/pull tone control and 5-way blade switch. With seven combinations in all, the PRS Studio covers classic tones but maintains a unique voice making it a perfect “desert island” guitar.

  Other specifications include a maple top, mahogany back and neck, and a rosewood, 22-fret, 25” scale length fretboard with PRS trademark bird inlays. The PRS Studio is anchored by PRS’s patented Gen III trem and Phase IIl Locking Tuners with Wing Buttons, both designed for excellent tuning stability while maximizing the transfer of the strings’ vibration through the instrument.
