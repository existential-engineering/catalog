details: |-
  The C4-CE Edge Burst nylon-string guitar's solid mahogany top, mahogany back and sides, and mahogany neck combine to produce a warm and rich tone with clear and bright highs. A soft cutaway makes it easy to reach the upper frets, and the comfortable C Shape neck profile and slightly narrower neck width than a classical guitar make it exceptionally easy to play. A rosewood fingerboard, headstock, and bridge complement the natural beauty of the wood and the open-pore satin Edge Burst finish, as do the abalone rosette, maple body and fingerboard binding, cream and black top purfling, and Pearloid Cordoba Arches logo. The C4-CE Edge Burst also boasts the Fishman Presys VT pickup and preamp system with soundhole-mounted volume and tone controls, which delivers a full and natural sound when the guitar is connected to an amplifier or a PA system or recorded directly. The affordable C4-CE Edge Burst puts the beauty of nylon-string acoustic guitar tone into the hands of nearly any player.
