description: A hand-crafted UK-built Foundation range 4x10 inch bass cabinet
  designed to complement the ABM-EVO IV heads. Built from FSC-approved 18mm
  birch ply and loaded with custom high-powered BlueLine Plus drivers developed
  with Italian speaker maker SICA, each cabinet is tuned to match the drivers
  for maximum SPL and longevity. A bespoke Ashdown HF unit reproduces the
  natural high frequencies of the bass guitar, and heavy-duty tilt-back casters
  plus a protective kick plate aid transport.
details: |-
  Hand-built in the UK, the ABM 410H UK is part of Ashdown's Foundation range, featuring 18mm FSC-approved birch ply and custom high-powered BlueLine Plus drivers developed with Italian speaker manufacturer SICA (lifetime warranty). Each cabinet is tuned to match the drivers for the highest possible SPL and driver longevity. A bespoke Ashdown HF unit reproduces the natural high frequencies of the bass guitar. Tilt-back heavy-duty casters, a protective kick plate, and T-nutted Allen-key-fitted grills and speakers ease transport and speaker replacement.
specs: |-
  - Power Handling: 650 Watts continuous / 1300 Watts peak
  - Speaker Configuration: 4 x 10
  - Speaker Outputs: 2 x Speakon combi jack with HF switch
  - Frequency Response: 30Hz to 20kHz
  - Impedance: 8 Ohms
  - SPL: 99dB - 1W @ 1m @ 200Hz
  - Weight: 37 kg
  - Dimensions (H x W x D): 660 x 609 x 441 mm (inc wheels)
  - Construction: 18mm FSC-approved birch ply, custom BlueLine Plus / SICA drivers
