description: The Empress Buffer+ is a compact, all-analog buffer and pedalboard
  I/O interface that preserves your guitar's signal over long cable runs. On top
  of the base Buffer, it adds a footswitchable clean boost, noise filters, an
  input pad, and variable input loading.
details: |-
  The Empress Buffer+ was designed to be the complete I/O interface for the pedalboard, while maintaining the highest fidelity to your guitar's signal. Signal loss due to long, un-buffered cable runs is an issue that has plagued guitar players for decades, and the primary goal of the Buffer+ is to eliminate this loss so your tone is unchanged by your cables.

  Additionally, all the connectivity of your pedalboard is consolidated to make setup quick and easy. The Buffer+ also adds a very handy set of features: a footswitchable clean boost of up to 30dB, tuner mute (hold the footswitch to mute the amp output for tuning), two selectable noise filters, an input pad, and variable input loading.

  The signal path is entirely analog and housed in a small die-cast aluminum enclosure measuring roughly 4.5" by 2.5" by 1.5".
specs: |-
  - All-analog signal path
  - Footswitchable clean boost up to 30dB
  - Tuner mute (hold footswitch to mute amp output)
  - Separate tuner output keeps the tuner out of the audio path
  - Two selectable noise filters
  - Input pad: pad or boost the input by 3dB
  - Variable input loading
  - Input impedance 10k - 1M Ohm, output impedance 510 Ohm
  - Frequency response (-3dB) 5Hz - 40kHz
  - Total harmonic distortion 0.02%
  - Signal to noise ratio 105.3dB
  - Headroom +9.4dBu
  - Power 9V DC (negative tip), 2.1mm barrel connector, 86mA draw
  - Die-cast aluminum enclosure
  - Dimensions 4.5" (L) x 2.5" (W) x 2" (H with controls), weight 0.5 lbs
