url: https://ashdownmusic.com/products/rm-420
description: Powered by a 420W digital amp, the RM420 is the lightest Rootmaster
  head at 4kg, the perfect choice for working bassists looking for power and
  features without the weight.
details: |-
  Dedicated to busy, hard-working bass players on a budget, Rootmaster heads, combos and cabinets deliver workhorse reliability, creative tone-shaping and comprehensive recording and performing facilities. Powered by a 420W digital amp, the RM420 is the lightest Rootmaster head at 4kg. It starts with an ultra-low-noise instrument input and Input Level control, five-band rotary tone controls and a Shape switch that dials in a classic ABM-derived tone. A simple one-knob compressor adds warmth and body, a footswitchable tube-emulated overdrive pushes the tone from warm grind to distorted filth, and the Sub-Harmonic Generator adds a footswitchable sub-octave. Send and return sockets on the back panel let you patch pedals or multi-effects, a DI output feeds a PA mixer or recording console, and a front-panel line input lets you jam along with a backing track. A combined Jack/Speakon socket with a minimum 4-ohm load partners with the Rootmaster cabinet range.
specs: |-
  - Power Output: 420 Watts
  - Power Requirement: 115 - 230V
  - Speaker Outputs: 2 x Jack sockets
  - Frequency Response: -3dB at 17Hz - 30kHz
  - High Instrument Input: Impedance 3.9M Ohms, input range 150mV - 20mV p-p
  - Low Instrument Input: Impedance 1M Ohms, input range 150mV - 10V p-p
  - Line Input: Impedance 10k Ohms, input range 300mV - 40V p-p
  - Tuner Output: Impedance 22k Ohms, Level 0dBu nominal
  - DI Output: 600 Ohms balanced, level -20dBu nominal
  - Impedance: Minimum 4 Ohm
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 220Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz shelving
  - Effects Send: Impedance 22k Ohm, level 0dBu nominal
  - Effects Return: Impedance 22k Ohm, level 0dBu nominal
  - Distortion: Less than 0.5% THD
  - Signal to Noise: Better than 80dB (EQ flat)
  - H x W x D: 78 x 313 x 225 mm
  - Weight: 4 kg
