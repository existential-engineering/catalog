capabilities:
  - filter
url: https://www.klarkteknik.com/en/products/0606-AAG
description: The SQ1S Square ONE Splitter is an eight-input, twenty-four-output
  active microphone splitter using preamplifiers derived from the MIDAS XL8
  console design. It addresses the FOH, monitor and recording split scenario in
  a compact 2U chassis with the headroom and noise figures expected from a
  flagship MIDAS preamplifier topology.
details: |-
  Each of the eight inputs feeds an XL8-derived microphone preamplifier with a rotary nine-position gain switch covering 0 dB to +40 dB in 5 dB steps, a 30 Hz high-pass filter with bypass, and +48 V phantom power switchable from the front panel or remotely. Mic equivalent input noise at +40 dB gain is less than -128 dBu, and the noise floor at unity gain is less than -100 dBu. Each input drives three outputs: two electronically balanced and one transformer-isolated for broadcast feeds.

  A dedicated 1:16 media-split function combines all eight inputs to a sixteen-way distribution for press conference and ENG feeds, with front and rear panel status indication.

  Applications include touring multi-console splits, broadcast outside-broadcast work, corporate AV, and any application that requires MIDAS-grade microphone preamplification combined with distribution to multiple destinations.
specs: |-
  - 8 inputs x 3 outputs (2 electronically balanced, 1 transformer-isolated)
  - MIDAS XL8-derived microphone preamplifiers
  - Rotary nine-position gain switch, 0 dB to +40 dB in 5 dB steps
  - Mic EIN less than -128 dBu at +40 dB gain
  - Noise floor less than -100 dBu at unity gain
  - 30 Hz high-pass filter with bypass per input
  - +48 V phantom power switchable from the front panel or remotely
  - 1:16 media-split mode for press feeds, with front and rear status indication
  - Solo bus with headphone amplifier
  - 4-segment LED metering per channel
  - 2 U rackmount
  - Auto-ranging universal switch-mode power supply
