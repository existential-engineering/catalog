description: Polyend Play+ is a 16-track sample and synth-based groovebox.
  Generate beats with unique synth engines (ACD, FAT, VAP, WTFM, PERC), stereo
  sample playback, and USB multi-track audio, including an advanced step
  sequencer, variations, full MIDI support, and performance effects.
details: |-
  The original Play set the standard for instant playability. Play+ takes Polyend's unique groovebox experience to new heights with an upgraded internal architecture, which enables a host of new features and enhancements while retaining the same sleek Play form factor. Immerse yourself in richer stereo sounds, delve into multitimbral polyphonic synthesis, and experience seamless audio over USB.

  As a multitimbral synthesizer, Play+ offers many synth engines, each with a unique character and an extensive library of professionally crafted presets. ACD recreates iconic single-oscillator monophonic analog synths for classic and innovative soundscapes. FAT hosts three virtual analog oscillators with drift and detune control and transistor ladder filter flavors for deep reese basses, pads, leads, and keys. VAP is a virtual analog polysynth with a dual-oscillator architecture, modulation matrix, multiple filter flavors, and pulse width modulation for evolving textures and lush pads.

  WTFM is a 2-operator FM engine using wavetable-based oscillators driven by a 3x feedback system, ranging from sine waves to harmonically rich metallic timbres. DIRT is a waveshaping and warping synth with 13 shaper modes, flexible pre/post-filter routing and gain-staging, and modulatable warp and shape amounts for thick bass, driven leads, smeared pads, and lo-fi textures. PERC is a drum synthesis engine spanning classic 808s and 909s to glitchy zaps, with kick, snare, open and closed hi-hats, cymbal, and perc drums, triggering five drum hits from a single synth engine voice.

  Play+ transitions from mono to stereo for a more expansive sonic canvas, and supports seamless audio over USB recording, sending 14 stereo tracks to a DAW separately for precision and flexibility in post-production. A redesigned patch editor with a new UI uses 9 endless encoders for quick access to each patch's parameters.
specs: |-
  - 16-track sample and synth-based groovebox
  - Multitimbral polyphonic synthesis
  - Synth engines: ACD, FAT, VAP, WTFM, DIRT, PERC
  - ACD: single-oscillator monophonic analog-style engine
  - FAT: three virtual analog oscillators with drift/detune and transistor ladder filters
  - VAP: dual-oscillator virtual analog polysynth with modulation matrix, multiple filters, PWM
  - WTFM: 2-operator FM engine with wavetable oscillators and 3x feedback system
  - DIRT: waveshaping/warping synth with 13 shaper modes and pre/post-filter routing
  - PERC: drum synthesis engine (kick, snare, open/closed hi-hats, cymbal, perc), 5 drum hits per voice
  - Stereo sample playback
  - USB multi-track audio: up to 14 stereo tracks sent to DAW separately
  - Advanced step sequencer with variations
  - Full MIDI support tools
  - Performance effects
  - New patch editor UI with 9 endless encoders
