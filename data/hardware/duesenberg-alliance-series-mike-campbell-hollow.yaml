description: The Alliance Series Mike Campbell Hollow is the big-body,
  all-hollow edition of Duesenberg's Mike Campbell signature instrument, fitted
  with two Domino P90 pickups and a "Destruct Knob" circuit housing an internal
  10db booster.
details: |-
  The Alliance Series Mike Campbell Hollow is the big-body member of the Mike Campbell range, and the only one of the three editions built without a centerblock. Duesenberg describes the all-hollow construction as giving a lot of moving air together with feedback control. The body is a hollow body without sustain block, with bent sides and an f-hole, a laminated spruce top and laminated maple back and sides, measuring 51.5 x 41 cm with sides 4.5 cm high. It is bound in cream with 5-layer purfling, finished in PUR lacquer with a matching colour headstock, and carries a nickel pickguard signed by Mike Campbell.

  The set neck is one-piece maple in a medium D shape, 42.5 mm at the nut and 52 mm at the twelfth fret, with an Indian rosewood fingerboard at a 305 mm / 12 inch radius, cream dot inlays, 22 jumbo frets, a steel dual-action trussrod and a 648 mm / 25.5 inch scale length. Duesenberg's Plek machine levels every fret to a hundredth of a millimetre, measuring and cutting each one individually, which the maker says is what allows an unusually low action without string buzz. The frets are then polished and the fretboard edges rounded off by hand.

  Unlike the two semi-hollow editions, this version takes a Duesenberg Domino P90 in both the neck and the bridge position, which Duesenberg describes as giving a pure and raw hollow tone. Wiring runs to one volume, one tone, a 3-way pickup selector and a Destruct Knob at the lower cutaway, which drives an active booster of up to +10db. Duesenberg states that the knob lets the player control distortion and feedback at any time, and that turning it down past its travel clicks the booster solidly out of the signal path altogether.

  Hardware is nickel finished, which Duesenberg prefers to chrome for its warmer sheen and because it ages naturally over time. The instrument carries Duesenberg Z-Tuners, which allow the cut string end to be hidden inside the tuner shaft, a Duesenberg Steel Saddle Bridge and a Duesenberg Trapeze Tailpiece in place of the vibrato system used on the semi-hollow editions. Strap pins are Duesenberg Multi-Lock, and the instrument is strung with Duesenberg Custom 10/46.

  The guitar ships with the Duesenberg Custom Line Case as standard, a handcrafted case Duesenberg describes as true flightcase quality, along with all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Matching body color
  - Body type: Hollow body without sustain block, bent sides, f-hole
  - Top: Laminated Spruce
  - Back, sides: Laminated Maple
  - Dimensions: 51.5 x 41 cm / 20.27" x 16"
  - Height (sides): 4.5 cm / 1.8"
  - Binding: Cream, 5-layer purfling
  - Pickguard: Nickel, signed by Mike Campbell
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Tailpiece: Duesenberg Trapeze Tailpiece
  - Strap pins: Duesenberg Multi-Lock
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 10/46 (010-013-017-026-036-046)
  - Pickup (neck): Duesenberg Domino P90
  - Pickup (bridge): Duesenberg Domino P90
  - Wiring: 1 volume, 1 tone, 1 Destruct Knob, 3-Way Pickup Selector
  - Special: Active Booster +10db (Destruct Knob)
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
