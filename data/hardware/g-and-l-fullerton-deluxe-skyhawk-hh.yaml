details: |-
  The Fullerton Deluxe Skyhawk HH delivers classic covered bucker tones kicked up a notch with a pairing of a G&L AS4255C in the neck position and AW4368C at the bridge. That is ASAT Deluxe territory, but Skyhawk HH adds G&L's P.T.B. System which allows bass roll-off, a big advantage in high gain situations like cranked fuzz pedals. Plus the push/pull coil tap serves up convincing single coil tones that further expand the potential of this versatile axe.

  The Fullerton Deluxe Skyhawk HH features a Leo Fender-designed Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm.

  P.T.B., Passive Treble and Bass controls: dramatically more effective than a standard tone control, treble and bass frequencies can be separately cut with this exclusive passive style circuitry via two separate tone knobs.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic CLF Research / G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Body wood: Swamp Ash and Alder
  - Neck wood: Natural Satin Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius and 1 11/16" nut-width
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato with forged brass saddles
  - Pickups: G&L AS4255 in neck position; AW4368C in bridge position
  - Controls: 3-position pickup selector, volume, treble, bass (PTB system), push/pull coil tap for both pickups
  - Includes: G&L Deluxe Gig Bag
  - Available in: Surf Green over Alder, 3-ply parchment pickguard, Rosewood fingerboard
  - Available in: Andromeda over Alder, 3-ply pearl pickguard, Rosewood fingerboard
  - Available in: Hugger Orange over Alder, 1-ply black pickguard, Maple fingerboard
  - Available in: Plum Metallic over Alder, 3-ply black pickguard, Maple fingerboard
