description: Erica Synths Perkons Voice is a eurorack incarnation of the
  percussion voices from the PERKONS HD-01 Drum machine. Like on the drum
  machine, the module has hybrid architecture, featuring a digital sound engine
  followed by an analogue multimode filter and overdrive. Users can select among
  13 sound generation algorithms and save up to 99 presets that can be recalled
  easily. Tune and Patch CV inputs are configurable for various CV settings and
  are tuned to 1V/oct. Module also features a 4-voice poly overlap mode and
  samples on the "Rompler" engine can be easily replaced.
details: |-
  Perkons Voice is a eurorack incarnation of the percussion voices from the PĒRKONS HD-01 drum machine. As on the drum machine, the module has a hybrid architecture, with a digital sound engine followed by an analogue multimode VCF and overdrive.

  13 sound design algorithms are available and up to 99 user presets can be saved and recalled easily. One of the engines is a Rompler, and the samples it plays can be easily replaced.

  The TUNE and PATCH CV inputs are configurable for various CV settings and track 1V/oct. A drone mode and a 4-note poly overlap mode extend the module beyond single percussion hits. The panel is 14HP wide and the module is 35mm deep.
specs: |-
  - Versatile digital sound engine followed by analogue multimode VCF and overdrive
  - 13 sound design algorithms
  - Up to 99 user presets
  - 1V/oct tuning on TUNE and PATCH CV inputs
  - Drone mode
  - 4-note poly overlap mode
  - Audio output 10Vptp
  - CV levels configurable -5V to +5V
  - Power consumption +59mA, -30mA
  - Module width 14HP
  - Module depth 35mm
