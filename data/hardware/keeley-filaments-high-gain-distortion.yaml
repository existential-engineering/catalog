description: An all-analogue high-gain distortion with three stacked gain stages
  and seven tone-shaping controls, including Bass, Body, Presence, Bright and
  Treble plus Boost and Crunch switches.
details: |-
  The Filaments is Keeley's high-gain distortion, aimed at the saturation of a high-gain valve amplifier. It layers three stages of gain and gives seven ways to shape the resulting tone, which the maker describes as more tone-shaping range than any other pedal in its line.

  Level and Gain set the amount of saturation. Bass and Body supply low-end weight and authority whatever the size of the cabinet: a 10-inch speaker can be filled out with them, while a 4x12 can be kept tight and focused by dialling the Body control back.

  The Boost and Crunch switches offer two different levels of gain and compression, which helps when an amplifier is hard to push. The Presence control works alongside the Bright control to suit any guitar and pickup combination, and the Treble control adds a further range of highs.

  The circuit is fully analogue and true bypass. It runs on 9 to 18V DC, centre-negative, drawing 10mA, is louder and more powerful at 18 volts, and requires a power supply rather than a battery. It is built in the United States.
