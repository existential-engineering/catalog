  and sides — a tonewood delivering a sweet, muscular voice combining rosewood's
  fidelity with mahogany's warmth — with V-Class bracing and ES2 electronics.
details: |-
  The 514ce is a Grand Auditorium acoustic-electric from the 500 Series featuring red ironbark back and sides — a tonewood with a sweet, muscular character combining rosewood's high-fidelity voice with mahogany's warm midrange punch. The torrefied Sitka spruce top adds resonance and aged-instrument responsiveness from the start.

  V-Class bracing provides enhanced volume, sustain, and improved intonation. The Venetian cutaway grants easy upper-fret access. Aerial-design fretboard inlays in Italian acrylic and abalone rosette add premium visual detail.

  Expression System 2 behind-the-saddle electronics capture the guitar's natural acoustic voice for amplified performance. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Torrefied Sitka Spruce (solid, gloss)
  - Back/sides: Red Ironbark (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Tropical Mahogany (satin)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Scale length: 25-1/2"
  - Tuners: Taylor Nickel
  - Binding: Tortoise
  - Pickguard: Tortoise
  - Inlays: Aerial (Italian Acrylic, Faux Pearl)
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
