description: 2x2x2 Desktop Recording Studio. Compact USB-powered I/O mixer that
  turns a PC or Mac into a 24-bit recording studio.
specs: |-
  - 2x2x2 desktop recording interface (dual-input, 2-bus, 2-output)
  - 24-bit recording
  - USB bus-powered (no external power supply required)
  - Balanced XLR mic input
  - High-impedance instrument input on front panel for guitar/bass
  - Two balanced TRS line inputs with RF filtering
  - Two balanced TRS line outputs with RF filtering
  - Headphone output with level control
  - Bundled with Steinberg Cubase LE 5 and Lexicon Pantheon VST reverb
