description: A Colour module that accepts any 2520-style discrete operational
  amplifier (DOA), allowing users to add the tone and saturation of various
  discrete opamps to their signal chain.
details: |-
  Add the sound of any discrete opamp to your Palette. Discrete opamps (DOAs), such as the API 2520, are at the heart of countless pieces of classic gear. Every DOA has it's own tone, from slow and dark to fast and clear. And DOAs are largely responsible for the recognizable sound of many consoles, preamps, etc. The DOA Colour allows you to plug any DOA into your Palette and tailor the amount of saturation you desire. You can purchase the DOA Colour on its own or bundled with the RED-25 DOA. Features

  Samples

  Resources
specs: |-
  - Compatible with the Colour format
  - Black PCB with gold-plated pads
  - Mill-Max DOA sockets
  - Designed by Eisen Audio for DIYRE
  - Accepts any 2520-style discrete operational amplifier, including:
  - API 2520
  - Melcor 1731
  - John Hardy 990
  - Schematic
  - Assembly Guide
