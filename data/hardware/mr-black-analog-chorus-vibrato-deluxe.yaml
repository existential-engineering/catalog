description: An all-analog BBD chorus and pitch vibrato with a tap-tempo LFO
  offering four waveforms, ranging from tight studio chorus to warm, murky
  vibrato.
details: |-
  Designed as an expansion of the extremely limited three-knob Analog
  Chorus/Vibrato, the Deluxe builds on that pedal's sound and fidelity with more
  options, controls, and tones, all quickly and intuitively tuned by the player.
  An all-new, precise digitally controlled pure-analog-output tap-tempo LFO
  offers four distinctive waveforms, selected by holding the Tap[Wave]
  footswitch, across a very wide range of speeds shown in real time on a
  dedicated tempo/wave LED.

  Alongside a full Wet/Dry Mix and traditional Width and Rate controls, the
  Deluxe adds Lag and Shine. Together the five knobs and the pure-analog LFO let
  the pedal morph from tight, crisp rack-style studio chorus to loose, dark,
  warm pitch vibrato, and every shade in between.

  At its extremes the pedal can turn deliberately unnatural: drunken auto-tune
  madness on the Glitch wave with a slow rate, broken-computer bleeps and bloops
  on the Square wave at higher rates, and smooth, tender pitch vibrato on the
  Sine wave. With all knobs at noon and the traditional Triangle wave, it
  returns to a classic, even-keeled voice.

  At heart it is a high-fidelity BBD-modulation pedal with generous headroom and
  dynamic range. Pure, clean, and natural describe its default tone, but it can
  get downright silly on demand. The Analog Chorus/Vibrato Deluxe is a Jack
  Deville original design.
specs: |-
  - 100% pure-analog BBD modulation with pure-analog signal path
  - Dry frequency response: 22KHz - 15Hz
  - Wet (BBD) frequency response: 11.6KHz - 16Hz
  - Very high headroom (18VDC capable)
  - Digitally controlled, true-analog-output waveform/modulation
  - Full Wet/Dry mix control
  - Lag control (base BBD delay: 4mS - 12mS)
  - Shine control (gentle BBD high-frequency roll-off)
  - Tap-tempo with real-time LED waveform/rate indicator
  - LFO speed range: 16.66Hz - 0.423Hz via rate knob; down to 0.076Hz via tap-tempo
  - Four analog waveforms: Triangle, Square, Sine, Glitch/Random
  - Input Impedance: ~500KOhm
  - Output Impedance: ~2KOhm
  - True-Bypass
  - Power: 9VDC - 18VDC, 2.1mm negative center-pin
  - Current draw: ~62mA (>=100mA recommended)
