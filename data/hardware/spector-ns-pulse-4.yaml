details: |-
  The NS Pulse features Spector's iconic curved body design and a selection of impressive features including a Swamp Ash body, a Roasted Maple neck with a Macassar Ebony fingerboard, EMG pickups and Spector's TonePump Jr. active pre-amp. The sandblasted finish perfectly accentuates the wood grain of the solid Swamp Ash body, resulting in a truly unique look. The NS Pulse represents the core of Spector's iconic design. The three-dimensionally carved body is a trademark of the Spector brand and provides a uniquely comfortable playing experience for all bassists. This NS Pulse model features a solid Swamp Ash body paired with a three-piece Roasted Maple bolt-on neck, complete with a Macassar Ebony fingerboard. The roasting process results in a neck that provides enhanced stability & resonance, while the Macassar Ebony fingerboard ensures clear note definition and projection. This model is also equipped with EMG active pickups and Spector's proprietary TonePump Jr. active pre-amp. This combination yields a range of impressive & aggressive noise-free tones. Perhaps the most striking feature of this bass is the sandblasted finish which highlights the unique grain pattern of each instrument. When paired with our Cinder Red or Charcoal Grey stain, the result is nothing short of stunning.
specs: |-
  - Powered by an onboard battery for the active electronics, no external power connector
