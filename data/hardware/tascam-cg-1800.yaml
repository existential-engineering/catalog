id: ul4sD8xLsVBGXgxFrv929
name: CG-1800
manufacturer: tascam
primaryCategory: outboard
categories:
  - rack-mount
  - digital
url: https://tascam.com/us/product/cg-1800
description: 1U rack-mount master clock generator built around a high-precision
  OCXO (±0.01ppm accuracy) for large professional audio and video systems.
  Distributes word clock, AES3/11, S/PDIF, and video sync (NTSC, PAL, HD
  Tri-level) across 12 BNC word clock outputs, 4 BNC video outputs, 2 AES XLR
  outputs, and 2 S/PDIF RCA outputs. Accepts 10MHz atomic/GPS reference for
  self-calibration.
details: |-
  1U rack-mount master clock generator. OCXO oscillator: ±0.01ppm accuracy, ±0.005ppm/day stability. Accepts video reference (NTSC, PAL, HD Tri-level), word clock (BNC, 32k–192kHz), AES3/11 (XLR, 32k–96kHz), and 10MHz atomic/GPS calibration input. Distributes via 12 BNC word clock outputs (1.0–3.5Vp-p adjustable; outputs 11–12 up to 256×Fs), 4 BNC video outputs, 2 AES3/11 XLR outputs, 2 S/PDIF RCA outputs, and an alarm output (6-pin Euroblock, open-collector). 128×64 OLED display, panel-lock switch, USB for firmware/preset management (4 presets, CSV export). AC 100–240V, 11.5W.
specs: |-
  - - Oscillator: OCXO; ±0.01ppm; ±0.005ppm/day
  - Video in: 2× BNC (NTSC/PAL/HD Tri-level); 75Ω
  - WC in: 2× BNC; 32k–192kHz; 75/50Ω selectable
  - 10MHz in: 1× BNC; 50Ω
  - AES3/11 in: 1× XLR; 110Ω; 32k–96kHz
  - Video out: 4× BNC; 75Ω
  - WC out: 12× BNC; 1.0–3.5Vp-p; 75Ω; up to 256×Fs (ch11–12)
  - AES3/11 out: 2× XLR; 2.5Vp-p; 110Ω
  - S/PDIF out: 2× RCA; 0.5Vp-p; 75Ω
  - Alarm: 6-pin Euroblock; open-collector; 35mA max
  - USB: Type-B for firmware/settings
  - Power: AC 100–240V; 11.5W
  - Dimensions: 483×45×310mm (1U); weight: 3.2kg
