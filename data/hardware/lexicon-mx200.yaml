description: Stereo dual reverb/effects processor with 32 legendary Lexicon
  algorithms in a single rack space, plus USB 'hardware plug-in' integration for
  VST and Audio Units hosts.
details: |-
  The MX200 packs two independent processors and 32 classic Lexicon reverb and effects algorithms into a single rack space, giving engineers instant access to plate, hall, room, chamber, delay, modulation and dynamics treatments from one front panel.

  A front-panel matrix display shows the active effect at a glance, while dedicated Input Level, Mix, Tempo and Bypass controls per processor make the unit equally at home in front-of-house live racks and project studios.

  Four routing modes — Dual Mono, Cascade, Dual Stereo Parallel and Mono Split — let the two processors be patched independently or in series for layered ambience and effects chains. 99 factory presets are paired with 99 user locations for recallable show or session settings.

  A USB port turns the MX200 into a 'hardware plug-in': cross-platform VST and Audio Units windows let the box be inserted on a DAW track and recalled with the session, bridging outboard hardware sound with in-the-box workflow.
specs: |-
  - Dual independent stereo reverb/effects processors in 1U
  - 32 legendary Lexicon reverb and effects algorithms
  - 99 Factory Programs + 99 User Programs
  - Four routing modes: Dual Mono, Cascade, Dual Stereo Parallel, Mono Split
  - Front-panel matrix display of active effects
  - Per-processor Input Level, Mix, Tempo and Bypass controls
  - Audition button with 5 digitally-recorded reference samples
  - USB 'hardware plug-in' integration with cross-platform VST and Audio Units plug-in windows
  - dbx dynamics processing included among the algorithms
  - Power: 9 VAC 1300 mA (adapter model PS0913B)
