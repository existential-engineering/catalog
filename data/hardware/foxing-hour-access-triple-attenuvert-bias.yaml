description: ACCESS is a Eurorack module providing attenuation/attenuversion and
  bias controls for three video or CV signals, usable with a full RGB set or
  three separate luma/control voltages. The topmost input normals to a 1 volt
  reference so the module can act as a bipolar control voltage source when
  unpatched.
details: |-
  ACCESS provides users with attenuation/attenuversion and bias controls for three video signals. It may be used with a full color RGB set or with three separate luma/control voltages. Using the Attenuvert knobs controls the input signal from -1 to +1 only. The Bias knobs apply an offset from -1volt CCW to +1volt CW. The top-most input is normalled to a 1 volt reference signal which allows the module to be used as a bipolar -1 volt to +1 volt control voltage when nothing is plugged into the inputs. All inputs are normalled as 1volt>R>G>B. Dimensions:
  8 HP
  41 mm deep

  Current Draw:

  30 mA +12V

  30 mA -12V

  0 mA 5V
