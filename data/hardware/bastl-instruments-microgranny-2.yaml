description: Monophonic granular sampler in a small standalone body. The 2nd
  generation reads WAV samples from a microSD card and applies granular
  algorithms for lo-fi sound manipulation.
details: |-
  The microGranny 2 is a monophonic granular sampler that reads WAV samples from a microSD card and applies granular algorithms for lo-fi sound manipulation. It supports 6 samples per preset with adjustable start, end, sample rate (tuned or free-run), bit crush, and amplitude envelope (attack/release).

  Granular parameters include grain size and shift speed (positive or negative). 60 presets are organized across 10 banks (6 per bank) and stored as .txt files on the microSD card. An 8-bit/22050 Hz recorder captures audio via line input or the onboard microphone.

  MIDI input responds to note, CC, and clock messages — enabling loop and grain synchronization, MIDI side chain envelope restart, and full parameter control via CC. Arduino-based and fully open source.

  Powered by 9V battery, 9V center-positive DC supply, or side pins. Dimensions: 140 × 75 × 55 mm. Succeeded by the microGranny Monolith.
