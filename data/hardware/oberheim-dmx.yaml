description: >-
  The Oberheim DMX is a classic digital drum machine featuring sampled recordings of actual
  instruments with 24 drum sounds, 8 separate outputs, swing function, and human-like feel
  effects that made it the original drum machine of hip hop and rap.
details: |-
  The DMX is a sophisticated classic drum machine whose sounds are sampled recordings of actual instruments. The machine has a number of human-like feel effects such as a great swing function, rolls, flams, and other time signatures and grooves. Best of all, it is easy to operate with 8 separate outputs for individual processing, 100 sequences, and 50 songs.

  The DMX was the original drum machine of hip hop and rap, and was used by artists such as Run DMC, Prince, Roni Size, Stevie Nicks, Mike Oldfield, David Hawk Wollinski, Phillipe Saisse, David Frank of The System, the Thompson Twins, and New Order on tracks like Blue Monday.
specs: |-
  - Polyphony: 8 drums
  - Sounds: 24 drums
  - Effects: Individual tuning control and Swing Function
  - Sequencer: 100 sequences, 50 songs
  - VCA: 8 level sliders
  - Keyboard: 24 pads
  - Control: Audio trigger or tape sync
releaseDate: "1980"
