details: |-
  Pulsing with power, the 5150III® EL34 2x12 Cabinet is the perfect companion to the 5150III® 50W EL34 Head with a matching black and gold motif.

  This 50-watt, 16 ohm straight-front 2x12 cabinet features rock-solid birch pine construction, renowned sound with two 12" Celestion® EVH G12H 30W Anniversary Series speakers, molded plastic strap handle with black powder coated caps, removable EVH pop-out casters, head-mounting mechanism and attached tilt-back legs.

  A high-quality fitted cover is available as an EVH accessory.
