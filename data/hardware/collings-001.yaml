description: A guitar shape first designed around the time of the Civil War, the
  001 is a 12-fret 00-size acoustic guitar with dimensions similar to classical
  guitars. It features a slotted headstock and small pyramid bridge. The tone is
  typically balanced and precise, suited for a wide range of playing styles from
  simple vocal accompaniment to ragtime solos.
