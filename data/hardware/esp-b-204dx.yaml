description: The B-204DX is an entry-level 4-string bass offering a bass that delivers far more than anyone would expect, given its modest price. It features bolt-on construction with a visually striking burled poplar top and includes quality components at an affordable price point.
details: |-
  The LTD B-204DX is a bass that delivers far more than anyone would expect, given its modest price. Built with bolt-on construction at 34” scale, the B-204DX offers a poplar body with an outstanding burled poplar top, where the wood’s natural knots and figured grain provide an eye-catching aesthetic. This bass also offers a smooth and comfortable roasted maple neck and a rosewood fingerboard with dot inlays and 24 extra-jumbo frets. Components on the B-204DX include black hardware, LTD tuners, an LTD DB-4 fixed bridge, controls for volume, balance, treble and bass EQ, and a set of excellent ESP SB-4 bridge and neck pickups.
