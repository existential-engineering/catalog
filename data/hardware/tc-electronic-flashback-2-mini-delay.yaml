details: |-
  Old school saturated tape echoes, warm, gritty analog delays, crispy clean digital repeats and everything in between.Sounds like a lot of gear to haul around, right?Wrong!Containing all of the superbly realistic and musical sounding delay tones from its larger siblings, FLASHBACK 2 MINI DELAY packs a mean punch in a lean stompbox.

  TonePrint means signature effects – and signature effects means truly creative tones.From classic innovators to the guys shaping the future of music, we’ve asked the coolest artists around to come up with their customized signature version of a TC Electronic effect – and make them available to you for free!

  You love tone, so do we, and our design philosophy testifies to that. So whatever route you wanna go, we got your back.With optimized headroom, True Bypass or Buffered Bypass switch and Kill-Dry on/off, this pedal guarantees optimal tonal integrity and zero loss of tone.And, no matter if the pedal is on or off your precious dry sound is always passed through the pedal unharmed in all it’s pure analog glory due to an Analog-Dry-Through.

  The extremely realistic algorithms are all painstakingly developed to deliver warm, lush, and responsive tones, echoing TC Electronic’s decades of delay experience.And if you need that little extra something to your sound, there’s a world of tone to explore under the surface thanks to TonePrint technology.Use the app to dive through cascading, shimmers of delay, modulated echo tails, or kaleidoscopic oscillating feedback – tailor your tone to your rig!Add to that the choice between tap tempo and the groundbreaking MASH footswitch that lets you phrase your delay like an expression pedal and you’ve got the pound-for-pound delay pedal champion!

  Famously wielded by such masters as the Edge, Brian May and David Gilmour to name a few, the big, bold, delay-driven riff is a higher art form.The way an already fat tone can be turned into a fearsome weapon of mass seduction by the right set of subdivisions and the right delay timbre – it’s a thing of beauty.FLASHBACK 2 MINI’s tap tempo lets you sync up your riffage to make sure those repeats are dead on.Just enable tap tempo in the TonePrint app, hold down the footswitch for a second until you see the red LED turn green, and show your drummer who’s the boss!
