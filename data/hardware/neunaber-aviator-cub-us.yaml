specs: |-
  - Tweed : Rich in mid-range and perfect for blues and rock.
  - Blonde : Bell-like cleans and a growling attack under gain.
  - Black : Scooped mid-range with velvety highs, ideal for jazz and country.
  - Three historical amp voices: Tweed, Blonde, and Black
  - 50 watts of power through a custom 12-inch Eminence speaker
  - Built-in limiter, 3-band EQ, and adjustable reverb
  - Effects loop, line output, and headphone output for versatile connectivity
  - Lightweight and portable design
  - Features - Up to 50 watts of tube-like power.
  - 3 classic voicings.
  - 3 band active EQ (Bass/Mid/Treble)
  - Reverb
  - Separate SPKR VOL and SIG OUT volumes. When playing on stage with PA reinforcement, work with the sound operator to establish a comfortable SIG OUT level, and then use the SPKR VOL to set your personal speaker level without changing the SIG OUT level.
  - Effects Loop
  - Controls - Primary Controls
  - 3 VOICE INPUTS allowing you to choose between 3 classic voices.
  - GAIN adjusts the distortion from clean to high overdrive.
  - LIMITER progressively brings down a "soft ceiling" that can keep overdrive to a "rolling boil" on soft settings, or increase sustain on higher settings.
  - 3-BAND ACTIVE EQ Boosts and cuts Bass, Mids, and Treble frequencies.
  - Effects Controls
  - EFFECTS LOOP send and return jacks.
  - REVERB
  - Volume Controls
  - SIG OUT controls the volumes of headphones and Line Out.
  - LINE OUT JACK.
  - HEADPHONE JACK.
  - SPKR VOL adjusts speaker power volume level.
