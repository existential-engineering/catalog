description: The Aviator Cub is a single-channel guitar combo amplifier
  delivering three classic American amp voices (Tweed, Blonde, Black) through a
  custom 12-inch Eminence speaker at up to 50 watts.
details: |-
  Experience the Golden Era of American Tone

  The Quilter Aviator Cub is the embodiment of classic American amplifier design, offering a seamless blend of vintage warmth and modern clarity. This advanced single-channel combo amplifier is your gateway to the iconic sounds of the '60s, providing three historical treasures: Tweed, Blonde, and Black. Whether you're seeking the mid-range power of a Tweed, the throaty growl of a Blonde, or the silky highs of a Blackface, the Aviator Cub delivers it all with ease. Designed for Performance

  Crafted for speed and efficiency, the Aviator Cub is as powerful as it is lightweight, making it an ideal choice for gigging musicians and home enthusiasts alike. In collaboration with Eminence, we've developed a super sonic 12-inch speaker that not only captures the charm of classic low-powered speakers but also handles 50 watts of power, ensuring your tone is always full and dynamic. Tonal Flexibility

  The Aviator Cub offers unparalleled tonal flexibility, allowing you to switch between the three distinct voices with just a plug-in:

  Control at Your Fingertips

  The Aviator Cub is equipped with a range of controls to fine-tune your sound, including a built-in limiter and a 3-band EQ. The effects loop with adjustable reverb ensures your effects are integrated seamlessly into your signal path. For silent practice or direct recording, the headphone output and line output provide the flexibility you need without compromising on tone. Compact and Convenient

  The Aviator Cub's compact design belies its extensive feature set. It's blissfully light at 21.5 pounds, making it a breeze to transport to gigs or sessions. Despite its size, it doesn't sacrifice power or performance, delivering cranked-amp tones at volumes suitable for any venue. Key Features:

  Your Sound, Amplified

  With the Quilter Aviator Cub, you're not just playing through an amp; you're channeling the spirit of an era. It's a testament to our commitment to quality, tone, and the musicians who rely on us to deliver their sound to the world. -
