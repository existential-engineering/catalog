description: >-
  The SoundMaster Stix ST-305 is an analog drum machine from 1981 that sits between the
  BOSS DR-55 and Roland TR-606 in terms of features and sophistication. It offers seven
  drum sounds including kick, snare, toms, hi-hats, and cymbal, with individual volume
  controls and separate audio outputs for each voice. Its subtly different character from
  contemporary machines like the TR-606 and Korg KPR-77 gives it a unique place among
  early affordable programmable drum machines.
details: |-
  When the BOSS DR-55 appeared, it was the first affordable drum machine featuring programmable patterns rather than presets. It soon had a competitor in the form of the SoundMaster SR-88, which was so similar in appearance and sound to the DR-55 that it might make you wonder why Roland didn't sue SoundMaster out of existence. The Stix ST-305 continued that lineage with expanded capabilities.

  In terms of features and sophistication the Stix is somewhere between the BOSS DR-55 and Roland TR-606, with programming like the DR-55 and individual volume controls for each instrument like the TR-606. The sound palette includes kick, snare, high tom, low tom, closed hi-hat, open hi-hat, and cymbal. There is also an accent function, which has its own level control and affects all instruments on each beat it is applied to.

  The Stix offers individual audio outputs for each sound. There is also a trigger input and two trigger outputs — one a constant clock pulse and the other programmable via the accent. Patterns are limited to six with sixteen steps per bar, and two with twelve steps per bar. Each pattern can be programmed as a single two-bar pattern (A and B) or as two one-bar patterns.

  Overall the Stix is a fun machine despite its limitations. It has a subtly different character to the contemporary Roland TR-606 and Korg KPR-77, while also benefiting from separate audio outputs as standard.
specs: |-
  - Polyphony: 6 tones
  - Sounds: Kick, snare, high tom, low tom, closed hi-hat, open hi-hat, cymbal
  - Sequencer: 16-step with fill-in and variation effects
  - Patterns: 8 programmable rhythm patterns (six 16-step, two 12-step)
  - Effects: Accent
  - Memory: 8 rhythm patterns
  - Control: Trigger input, two trigger outputs
  - Individual Outputs: Yes, one per voice
releaseDate: "1981"
