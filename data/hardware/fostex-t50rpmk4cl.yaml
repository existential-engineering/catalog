description: Closed-back RP stereo headphones for studio recording monitoring,
  carrying the 4th generation RP planar magnetic driver in a sealed version of
  the T50RPmk4 housing. It suppresses environmental sound leakage during vocal
  and instrument recording and mixing while keeping the accurate sound
  reproduction characteristic of RP drivers.
details: |-
  The T50RPmk4CL is the latest closed-back model of the RP technology headphones that have been adopted by professional music studios worldwide, continuing to evolve for over 50 years since their inception. The T50RPmk4, equipped with the 4th generation RP driver featuring Fostex's uniquely developed and manufactured planar magnetic driver, has been arranged as a long-awaited closed-back type. It achieves dense sound monitoring that suppresses environmental sound leakage during vocal and instrument studio recording and mixing.

  The closed-back housing is based on the semi-open T50RPmk4 housing, with careful sound insulation of each ventilation part and meticulous sound balance tuning. Because the internal shape of the housing is identical between the T50RPmk4CL and T50RPmk4, either the closed-back or semi-open type can be chosen according to the work and environment from recording to mixing without worrying about sound differences.

  The RP technology planar magnetic driver has undergone significant enhancements in its 4th generation. To expand and uniformize the vibration area of the planar diaphragm, the magnets sandwiching the diaphragm have been increased and the printed coil pattern has been redesigned. By renewing the magnetic circuit components and optimizing magnetic flux distribution, unwanted resonance of the diaphragm is suppressed, achieving sharp response in sound attack and decay. Consistent quality is ensured through integrated manufacturing at the company's own factory.

  Both the left and right housings are equipped with connectors for the supplied cable, so the cable can be connected to either side depending on the usage environment. The symmetrical housings eliminate the difference in sound characteristics usually caused by differing internal structures between sides. The connector is a 4-pole 3.5 mm type supporting balanced connections, and an optional 4.4 mm balanced cable (ET-RP4.4BL) is available.

  The thicker ear pads feature a low-resilience, around-ear type that provides a comfortable fit for long listening sessions. The angled design of the earpads enhances sound staging for a more immersive auditory experience.
specs: |-
  - Type: Closed, dynamic
  - Driver: RP planar magnetic
  - Impedance: 28 ohm
  - Sensitivity: 97 dB/mW
  - Maximum input: 3,000 mW
  - Frequency response: 10 to 40,000 Hz
  - Weight: Approx. 330 g (excluding the cable)
  - Cable connectors on both left and right housings, 4-pole 3.5 mm, balanced capable
  - Accessories: Unbalanced cable 3.5 mm (4-pole) to 3.5 mm (3-pole) 2 m x 1, conversion connector 3.5 mm to 6.3 mm x 1, safety precautions
  - Optional balanced cable: 4.4 mm ET-RP4.4BL
  - Passive wired headphones, no power supply required
  - Series: RP Series
