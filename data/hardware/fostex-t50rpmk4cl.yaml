name: T50RPmk4CL
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/t50rpmk4cl/
description: Closed-back RP stereo headphones for studio recording monitoring,
  featuring the 4th generation RP planar magnetic driver. Based on the semi-open
  T50RPmk4 housing with careful sound insulation of each ventilation part for
  dense sound monitoring that suppresses environmental sound leakage during
  vocal and instrument recording and mixing.
details: |-
  Configuration: Closed-back, around-ear, planar magnetic headphones with detachable bilateral cable connectors and balanced-capable 4-pole input

  Features:
  - T50RPmk4 series unified shape sealed housing with careful sound insulation of each ventilation part
  - 4th generation RP planar magnetic driver with redesigned printed coil pattern
  - Increased magnets sandwiching the diaphragm for expanded, uniform vibration area
  - Optimized magnetic flux distribution suppresses unwanted diaphragm resonance
  - Symmetrical left/right housings eliminate sound differences from internal structure
  - 4-pole 3.5mm connector on each cup supports balanced connections
  - High-quality OFC conductor cable included
  - Thicker low-resilience around-ear earpads with angled design using Ultrasuede
  - Optional 4.4mm balanced cable available (ET-RP4.4BL)
  - Integrated manufacturing at Fostex's own factory

  Series: RP Series
