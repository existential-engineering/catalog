description: Hi-res 24-bit/96kHz audio streamer. Bring your existing system
  right up to date with Formation Audio wireless audio streamer, access
  24-bit/96kHz hi-res audio on your hi-fi, include it in a multi-room set-up,
  even stream analog sources like turntables to Formation wireless speakers.
details: |-
  Bring your existing system right up to date with Formation Audio wireless audio streamer. Access 24-bit/96kHz hi-res audio on your hi-fi, include it in a multi-room set-up, even stream analog sources like turntables to Formation wireless speakers.

  New wireless options: love your system? Bring it up to date. Formation Audio allows you to stream 24-bit/96kHz hi-res audio to it, easily. Multi-room with ease: Formation Audio lets your existing hi-fi form part of your multi-room music experience, low-hassle set-up, hi-res sound.

  Analogue streaming: let analogue sources join in your wireless experience. Audio can stream any format you like to Formation speakers. Perfect conversion: Formation Audio flawlessly converts analog to digital, and digital to analog, so your music always sounds its best.

  Wireless revolution: Formation is the exclusive Bowers & Wilkins wireless technology, it guarantees a flawless listening experience, no matter how extensive your system. Using a robust, independent network, Formation wireless speakers deliver perfect room-to-room synchronisation and outstanding sound.

  Enjoy the music you love, instantly. Use the Bowers & Wilkins Music app to connect and control your devices and stream from a growing selection of compatible streaming services.
specs: |-
  - Description: Wireless Audio Hub
  - Apple AirPlay 2 technology
  - Spotify Connect
  - Roon Ready
  - Bluetooth In
  - High performance analogue-to-digital converter (ADC)
  - High performance digital-to-analogue converter (DAC)
  - Bluetooth v4.1, Class 2, with aptX HD, AAC and SBC codecs
  - Network: RJ45 Ethernet or Wi-Fi
  - AirPlay 2 compatibility: iPhone, iPad, and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Input voltage: 100V to 240V, 50/60Hz
  - Power consumption: below 6.8 Watts (sleep)
  - Dimensions: 44mm (1.7 in) height x 215mm (8.5 in) width x 263mm (10.4 in) depth
  - Net weight: 1.0kg (2.2 lb)
  - Cabinet finishes: Black
