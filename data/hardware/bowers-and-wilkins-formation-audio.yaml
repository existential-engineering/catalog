url: https://www.bowerswilkins.com/en-au/product/archive-wireless-speakers/formation-audio/FP39713P.html
description: Bring your existing system right up to date with Formation Audio
  wireless audio streamer. Access 24-bit/96kHz hi-res audio on your hi-fi,
  include it in a multi-room set-up, even stream analog sources like turntables
  to Formation wireless speakers.
details: |-
  Formation Audio is a wireless audio hub that brings an existing hi-fi system up to date. It lets a traditional passive system stream 24-bit/96kHz hi-res audio, and it works in the other direction too, taking analogue sources such as a CD player or a turntable and streaming them to Formation wireless speakers elsewhere in the home.

  A high performance analogue-to-digital converter ensures there is no lag or break in sound, even between rooms, while a high performance digital-to-analogue converter feeds the connected hi-fi. 24-bit/96kHz streaming is intended to maintain resolution end to end.

  Formation is the company's own wireless technology, running on a robust independent mesh network so that products stay in room-to-room synchronisation across an extensive system. Each product in the network dynamically chooses the optimal path to route audio data between products, and the range is certified for High Network Availability.

  The unit supports Apple AirPlay 2, Spotify Connect and Roon Ready, plus Bluetooth v4.1 Class 2 with aptX HD, AAC and SBC. Control and streaming are handled through the Bowers & Wilkins Music app.

  Connections are a Toslink digital audio input, a stereo RCA analogue input, a single RCA digital output, a stereo RCA analogue output, RJ45 Ethernet or Wi-Fi for the network, and a USB port for service use only. The unit measures 44 x 215 x 263mm (H x W x D) and weighs 1.0kg (2.2 lb).
specs: |-
  - Description: Wireless Audio Hub
  - Technical features: Apple AirPlay 2 technology, Spotify Connect, Roon Ready, Bluetooth In, high performance analogue-to-digital converter (ADC), high performance digital-to-analogue converter (DAC)
  - Streaming resolution: 24-bit/96kHz hi-res audio
  - Input voltage: 100V - 240V, 50/60Hz
  - Power consumption: below 6.8 Watts (sleep)
  - Connections: digital audio in (Toslink), analogue audio in (2 x RCA), digital audio out (1 x RCA), analogue audio out (2 x RCA), network (RJ45 Ethernet or Wi-Fi), USB (service only)
  - Bluetooth: Bluetooth v4.1, Class 2, aptX HD, AAC, SBC
  - AirPlay 2 compatibility: iPhone, iPad and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Dimensions: Height 44mm (1.7 in), Width 215mm (8.5 in), Depth 263mm (10.4 in)
  - Net weight: 1.0kg (2.2 lb)
  - Cabinet finish: Black
  - Certified for High Network Availability (HiNA) as part of the Formation mesh network
