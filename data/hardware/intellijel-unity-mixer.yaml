prices:
  - amount: 75
    currency: USD
description: Quick and Clean When you use more sources than your signal path
  will allow, you'll wish you had a mixer. Mix up to six sources into one or two
  channels, CV or Audio. It doesn't get much more compact than this.
details: |-
  Two common problems that are encountered in many eurorack systems are that signals need to be blended together and a lack of case space. The Unity Mixer can help solve the first problem while simplifying the second with its skinny 2HP size. It features two sections where three input signals can be summed into one output, and the top is normalled to the bottom allowing the mixing of six signals into one.

  NOTE: Version 2 of the Unity Mixer has two sets of jumpers on the main pcb. These allow the top and bottom sum to be set to -6dB attenuation instead of unity gain. This creates more headroom when summing higher amplitude sources like raw VCO signals.
specs: |-
  - Width: 2HP
  - Depth: 29mm
  - Power: 11mA @ +12V, 11mA @ -12V
  - Output of top mixer is normalled to the bottom mixer to give a 6:1 mix
  - Buffered inputs and outputs
  - Outputs are phase correct, so there is no inversion of the output signal
  - The input signals are neither boosted nor attenuated (unity mixing); their resultant sum is the output
  - Version 2 has jumpers for -6dB attenuation mode on top and bottom summing
