description: >-
  The Bumblebee is a noise machine and drone synthesizer created by Barcelona-based
  Plankton Electronics. Available as both a DIY kit and a fully assembled desktop unit, it
  generates aggressive, experimental sounds through three square-wave oscillators with
  patch bay capabilities.
details: |-
  The Bumblebee features a straightforward signal flow designed to appeal to DIY synthesizer beginners. At its core are three square-wave oscillators, each equipped with individual level knobs and dedicated outputs for separate mixing capabilities. Each oscillator includes two CV inputs with attenuation knobs for pitch modulation control.

  The instrument incorporates three LFOs, each with CV input and attenuation control, all producing square waves. These modulation sources feed into a pair of filters — a high-pass and low-pass design with 24dB slope characteristics and resonance control. The filtered signal passes through an amplifier before reaching the single mono audio output.

  While the square-wave-only oscillators limit tonal versatility compared to multi-waveform alternatives, this constraint pushes the Bumblebee toward experimental territory. The patch bay capabilities enable standalone sound design or integration with modular systems. Its characteristic sound has been described as sounding like a swarm of angry bees.
specs: |-
  - Polyphony: 1 voice (monophonic)
  - Multitimbral: 1 part
  - Oscillators: 3 square-wave oscillators with individual level knobs and dedicated outputs
  - LFOs: 3 square-wave LFOs with CV input and attenuation
  - Filters: High-pass and low-pass, 24dB/oct (4-pole) with resonance
  - CV inputs: 2 per oscillator with attenuation knobs
  - Output: Single mono audio output
  - Format: Desktop / DIY kit
releaseDate: "2014"
