description: "Simple and elegant, the 5211 is the natural evolution of what is
  arguably the most famous gear in audio recording history: Rupert Neve's
  microphone preamps. With two channels of the classic tone you know and love
  and the power of Mr. Rupert Neve's dual-tap transformers with variable Silk."
details: |-
  The 5211 is a 2-channel microphone preamplifier from Rupert Neve Designs, representing the natural evolution of Rupert Neve's legendary microphone preamp designs. It combines classic tone with modern features in a 1RU rack-mount form factor, making it a versatile addition to any professional studio or live recording setup.

  Each channel features a 12-way rotary gain switch providing 0-66 dB of gain in precise 6 dB increments, supplemented by a continuously variable trim of ±6 dB for a total range of 72 dB. The continuously variable high-pass filter sweeps from 20Hz to 250Hz, allowing precise tailoring of low-frequency content.

  The signature Silk/Texture circuit provides variable harmonic saturation derived from the output transformer stage. In Red Silk mode, the texture control allows users to dial in additional harmonic content, ranging from clean reproduction to rich, vintage-style coloration with predominantly 2nd harmonic distortion at maximum settings.

  Each channel features dual XLR outputs that operate simultaneously: a standard line-level XLR output and a separate -6dBu XLR output. This dual-output topology allows for parallel routing scenarios, simultaneous recording to multiple destinations, or driving outboard gear and converters at different reference levels.

  Additional features include 48V phantom power, polarity reverse, and an 8-segment LED bar-graph meter (-10 to +22 dBu) per channel. The electronically balanced input stage and custom RND output transformer deliver the warmth and character Rupert Neve Designs is known for. Made in the USA.
specs: |-
  - Gain: 0-66 dB in 6 dB steps via 12-way rotary switch
  - Trim: continuously variable ±6 dB
  - High-Pass Filter: continuously variable 20Hz-250Hz
  - Silk/Texture: variable harmonic saturation (Red Silk mode)
  - Phantom Power: 48V
  - Polarity Reverse: yes
  - Metering: 8-segment LED bar-graph (-10 to +22 dBu)
  - Maximum Input Level: +26 dBu @ 1 kHz
  - Equivalent Input Noise (EIN): -128 dBV, -126 dBu
  - Maximum Output Level: +26.5 dBu @ 1 kHz
  - Frequency Response: -0.2 dB @ 10Hz, -2.9 dB @ 120kHz
  - Dimensions: 19" W x 7.4" D x 1.75" H (48.3 x 18.8 x 4.5 cm), 1RU
  - Weight: 8 lbs (3.6 kg)
  - Made in the USA
