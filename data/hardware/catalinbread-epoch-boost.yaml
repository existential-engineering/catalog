details: |-
  The Epoch Boost is a standalone pedal built around the preamp circuit of the Maestro Echoplex EP-3 tape echo, one of the most revered tone-shaping circuits in guitar history. Catalinbread faithfully reproduced the early model EP-3 preamp, including NOS Orange Drop capacitors, to capture the same harmonic character that made countless recordings iconic.

  Unlike a typical clean boost, the Epoch Boost operates with its internal voltage boosted to 22 volts, matching the original EP-3's rail voltage. This headroom allows the pedal to remain remarkably transparent and open even at high gain settings, delivering up to 20dB of boost without harshness or unwanted compression.

  A key feature is the switchable hi-Z input buffer, which can be engaged to optimize the pedal's interaction with guitar pickups and long cable runs. The output mixer stage also functions as a frequency selector, giving players subtle tonal control over the final character of the boosted signal.

  Handmade in Portland, Oregon, the Epoch Boost carries Catalinbread's 3-year warranty and is designed to serve equally well as an always-on tone enhancer, a transparent boost for solos, or a preamp placed at the front of a signal chain.
