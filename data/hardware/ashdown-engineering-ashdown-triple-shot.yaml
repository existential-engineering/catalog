details: |-
  The Triple Shot delivers high-gain bass overdrive with three fully blendable distortion voices: Dark, Medium, and Light, letting you shape everything from fat, rumbling lows to snarling highs. With independent control for each band, it's like having three pedals in one, offering precision, versatility, and raw power. Whether you want subtle grit or full-on bass fury, the Triple Shot gives you total control over your drive tone.
