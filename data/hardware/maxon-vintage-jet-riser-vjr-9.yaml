description: A flanger pedal that combines an analog Bucket-Brigade flanger with
  a voltage-controlled white noise generator to simulate a jet-in-flight Doppler
  effect. VCA and VCF circuits react to playing dynamics, and the two effect
  sections can be used separately or together for a wide range of modulated
  sounds.
details: |-
  Best Guitar Flange Pedal

  Designed in homage to classic 70's distortion modulators such as the Flying Pan and Jetlyzer (both of which Maxon designed and built for Ibanez), the VJR-9 Vintage Jet Riser creates a Doppler jet effect so realistic you can almost feel the wind in your hair. Rather than sticking with the old-school Jet design of phase shifter into distortion, the VJR-9 features an analog Bucket-Brigade Flanger as the modulation source to add a more realistic depth of field to the effect. Speed and Width controls allow adjustment of the flanging from slow takeoff to sonic boom. In similar fashion, Maxon has forgone the use of a distortion circuit in favor of a voltage-controlled white noise generator to more accurately simulate the sound of a jet in flight. Featuring a combination of VCA and VCF circuits, the VJR-9's Jet effect reacts to playing dynamics within a range preset by the Sensitivity, Range and Jet controls. These two circuits can be used separately or in combination to create a wide variety of effects from subtle to extreme - classic chorus and flanging; tremolo-like auto-wah; massive sky-is-falling Jet sweeps; bizarre and other-worldly metallic tones bordering on ring-modulation – all these and more are possible with the VJR-9. The VJR-9 also features a jack to connect an external switch (bypass or momentary) for the Jet function, allowing the user to add the effect in against the Flange when desired to accentuate certain note, phrases, or song sections. The VJR-9's internal voltage-doubling circuitry provides maximum headroom to eliminate input distortion. The higher operating voltage also allows it to be used in an FX loop in order to place the effect post-gain. The Maxon VJR-9 Vintage Jet Riser – get ready for takeoff. The VJR-9 is an updated version of vintage FL-70 Jetlyzer with added features and superior performance. TECH TALK:

  The VJR-9 features Mechanical True Bypass switching via a Fujisoku 4PDT switch. NOTE ON POWERING THE VJR-9 - this pedal's voltage regulator IC requires a high inrush current of approximately 2000 mA upon startup. When using with a Power Brick such as the Voodoo Labs Pedal Power 2+, this pedal should be connected to a high current power jack when possible. If it is not possible to connect to a high current jack, you can power the VJR-9 by leaving a battery in the pedal. Upon initial start-up, unplug the external DC power input cable, engage the pedal, and then plug the DC power input cable back in – the pedal will now power up normally off the external power supply until you power down your pedalboard. Input Impedance : 500K Ohms

  Output Impedance : 10K Ohms or less

  Maximum Output Range : +12 dBu (400 Hz)

  Controls : RANGE, JET, SENSITIVITY, SPEED, WIDTH

  Switch : BYPASS/EFFECT (mechanical TBS)

  External Foot Switch Jack : Jet Sound on/off

  Delay Time : 1.0 mSec - 30.0 mSe

  Speed Frequency : 0.04 Hz - 12 Hz

  Residual Noise : -90 dBu or less (IHF-A)

  Indicator : Bypass / Effect LED

  Internal Circuit Voltage : 13 VDC (DC to DC Converter)

  Power Supply : 9 volt battery of Maxon AC adaptor

  Power Consumption : appox. 60 mA / 9 VDC

  Dimensions : 74 (W) x 124 (D) x 54 (H) mm

  Standard Accessory : AC adaptor AC2009, user's guide

  Weight : approx. 630 g (including battery, excluding adaptor)

  Battery : 9V battery (6LR61 or 6F22) x 1 or Maxon AC adaptor

  Battery life :
  Manganese - 50 minutes @ 25 degress C
  Alkaline - 3 hours @ 25 degrees C

  Option : Maxon AC adaptor

  * All specifications are subject to change for improvement without notice or obligation. All brand names and product names are trademarks or registered trademarks of their respective companies.
