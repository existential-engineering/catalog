details: |-
  The Harmony Foundation Series is one for the discerning musician, an inseparable companion to weave tales out of every path of the journey. The Terra FS Dreadnought comes in a natural gloss finish and blends crafting traditions with modern features for a premium playing experience. It pairs a solid spruce top with solid mahogany sides and back to deliver full-bodied tones that are balanced, warm, and complex. Mahogany ensures that the satin-finished neck stays straight and true over time, while the rosewood fretboard adds smoothness to the overall playing experience. Solid spruce X-bracing gives remarkable depth to sound projection, while the bone nut and saddle add to superior tone and resonance. Premium tonewoods ensure that the guitar only gets better with age. The Terra FS Dreadnought is strung with D'Addario EXP16 coated strings, which offer lasting brightness over many sessions of play. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
