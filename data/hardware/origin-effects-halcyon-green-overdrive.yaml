description: The Halcyon Green Overdrive is a classic low-gain drive pedal
  featuring proprietary Adaptive Circuitry that adapts its voicing in response
  to pick attack and volume changes. It is based on the same green pedal that
  has inspired countless clones, going beyond what the average overdrive has to
  offer.
details: |-
  The Halcyon Green Overdrive's party trick is its ADAPT switch, allowing the pedal's mid-forward voicing to gradually fade away as the pedal cleans up, giving classic TS808 tone with the guitar cranked but revealing the full spectrum of clean tone as the volume knob is rolled back.

  The DRY control adjusts the level of dry signal that makes up part of the classic drive tone, adding body and definition when boosting a low-gain amp sound; thanks to the ADAPT switch's more natural drive sounds, the pedal can also work well as a standalone drive into a clean amp.

  The VOICE switch selects either the classic TS808 mid hump (808) or a brighter, more focused presence peak (MOD) with a more resonant character, useful with neck humbuckers or for tightening up high-gain amp tones.
