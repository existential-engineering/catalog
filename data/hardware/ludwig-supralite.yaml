description: >-
  The Ludwig Supralite Snare Drums are designed with a mirrored, polished, 1mm
  beaded steel shell for bright, cutting attack, while providing a wide
  mid-range overtone. Fitted with chrome plated brass tube lugs, 2.3 mm chrome
  plated triple flange hoops, and brass snare wires. All snares feature a new
  and improved P88I throw-off and P33 butt-plate. Quality and versatility to fit
  any budget!
details: |-
  Budget-friendly steel-shell snare line built on a 1mm beaded steel shell with mirrored polished chrome finish. Shared hardware package across the series: chrome plated brass tube lugs, 2.3mm steel triple-flanged hoops, P88I throw-off, P33 butt-plate, and 20-strand brass coil snare wires.
specs: |-
  - 1 mm beaded steel shell
