description: High-power monitoring for large TV and film dubbing theatres
details: |-
  The M3FX is a high-power loudspeaker system for use in large film and TV post-production studios where the console is up to 8m from the screen. Combined with Dynaudio Acoustics subwoofers and surround speakers, it forms an ideal immersive monitoring system for formats including Dolby Atmos HE 7.1.4 and 9.1.4, and full Atmos theatrical multi-channel.

  The M3FX system is supplied in left/right and centre variants; the left/right cabinet uses a vertical driver layout (1300 x 720 x 600mm) and weighs 110kg.

  The bass section comprises four 300mm MSP (Magnesium Silicate Polymer) low-distortion drivers with 100mm ferrofluid-cooled voice coils. The midrange uses two 170mm MSP drive units with 75mm voice coils and neodymium magnets. The high-frequency component is a D260H 28mm soft-dome in a short waveguide. An internal high-power passive crossover links the mids and tweeter.

  Speakers are supplied as two-way active: the four low-frequency drivers are driven separately from the passively-crossed mid/high section. Recommended amplification is the Dynaudio Acoustics DA40/80 DSP series with onboard DSP, or the DCA800/1400 with built-in filters.

  Cabinets are finished in black textured paint, with optional hardwood finishes (oak, cherry, walnut, maple) and custom sizes available on request. All systems are made to order; price and delivery on application.
specs: |-
  - Status: Current
  - Segment: Pro
  - Series: Dynaudio Acoustics
  - Application: Post-production and music
  - Type: 3-way hybrid
  - Frequency response: 35Hz - 20kHz
  - Maximum SPL at 2 metres: 125dB stereo
  - Crossover frequencies: 250Hz and 3000Hz
  - Total harmonic distortion: 1% at 90dB
  - High frequency driver: 28mm soft-dome in short waveguide
  - Mid frequency driver: 2x 17cm MSP
  - Low frequency driver: 4x 30cm MSP
  - Amplifier recommendation: Dynaudio Acoustics DA40/80 DSP, DCA800/1400 (with filters)
  - Cabinet dimensions (H x W x D): 1300 x 720 x 600mm
  - Weight: 110 kg
  - Finish: Black textured paint
  - Optional hardwood cabinets: Oak, cherry, walnut, maple
  - Custom cabinet sizes: On request
