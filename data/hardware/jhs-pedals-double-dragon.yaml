description: An all-analog lo-fi octave device built on vintage analog octave
  divider technology, offering a sub-octave-down and octave-up distortion via
  two independent footswitches with Volume, Dry, Oct-, and Oct+ controls.
details: |-
  The Double Dragon Lo-Fi Octave Device is JHS Pedals' first-ever octave pedal, built on 40-50 year old analog octave divider technology inspired by the MXR Blue Box, DOD Octoplus, Boss OC-2, Ibanez OT10, and Electro Harmonix Micro-Synth. It is all-analog and monophonic. The lower octave (Oct-) is a thick analog sub-octave-down. The upper octave (Oct+) is an octave-up distortion that lands between an Octavia and Superfuzz with a mid-range cut. Controls: VOLUME (master output with extra boost headroom — with octaves off and dry full up it functions as a clean preamp), DRY (clean signal blend — fully wet mode yields glitchy vintage synth textures), OCT- (sub-octave mix), OCT+ (upper octave and distortion level). Two footswitches: left is ON/OFF for the main effect; right engages the OCT+ circuit independently. The main effect must be on for OCT+ to function by design. Uses silent buffered bypass switching.
