description: A high-gain distortion pedal with a tube amp style three band EQ
  and two switchable gain modes, voiced for cranked British amp sounds.
details: |-
  The Stahlhammer Distortion is a hard-hitting distortion pedal voiced for cranked British amp sounds, and the most aggressive drive in the Keeley range. It combines classic high-gain amp distortion with a tube amp style EQ, giving a wide spread of amp voices from familiar and easily dialled controls.

  The distortion is full and thick, using hard-clipping diodes to ground around an LM1458 op amp whose slow slew rate suits heavy clipping on a Strat or a Les Paul. Turned down to around nine o'clock it sits close to an amp just beginning to break up. The Volume control runs into a 3x make-up gain output buffer, so the pedal can drive an amp hard.

  Three tone controls, Bass, Middle and Treble, cover the amp tone stack. Two modes of operation, high gain and tube saturation, are selected by a switch mounted on the right hand side of the enclosure.
