details: |-
  The Kurt Cobain Jaguar is a signature model that recreates the battered 1965 Jaguar guitar used by Kurt Cobain during Nirvana's early-'90s era. It authentically reproduces the modified left-handed Jaguar that Cobain found secondhand and used during the height of the grunge rock movement.

  The guitar features a high-output pickup configuration with DiMarzio humbucking pickups, including a PAF 36th Anniversary neck pickup and a Super Distortion bridge pickup. It deviates from the traditional Jaguar design with a modified control layout, featuring three control knobs instead of the standard two-knob configuration.

  The instrument offers unique switching options with a lead circuit and rhythm circuit, allowing for versatile sound control. The pickup switching includes a 3-position toggle that enables selection between bridge pickup, combined bridge and neck pickups, and neck pickup.

  The guitar comes with special features including a black chrome Adjusto-Matic bridge, vintage-style floating tremolo tailpiece, and a tremolo lock button. Available in both right- and left-handed versions with a rosewood fingerboard and white binding.
specs: |-
  - Classic Jaguar dual-circuit lead/rhythm design
  - DiMarzio DP103 PAF 36th Anniversary neck pickup
  - DiMarzio DP100 Super Distortion bridge pickup
  - Three-way toggle pickup switch
  - Black chrome Adjusto-Matic bridge
  - Floating tremolo tailpiece with lock button
  - Rosewood fingerboard
  - 3-Color Sunburst finish
  - Right- and left-handed models
  - Engraved neck plate
