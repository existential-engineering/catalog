description: A digital audio workstation that brings together a hard disk
  recorder, drum machine, digital mixer, effects and a CD-R/RW drive.
details: |-
  The MRS-802 is a digital audio workstation built around a 3.5-inch E-IDE hard disk, divided into five sections: recorder, rhythm, mixer, effects and a CD-R/RW drive. It covers the whole chain from building rhythm tracks through multitrack recording and mixdown to burning an audio CD. The chassis measures 430 x 270 x 105 mm and weighs 5 kg with the CD-R/RW drive fitted, 4 kg without, running from the supplied AD-0009 12 V DC adaptor at about 20 W.

  The recorder provides eight mono tracks plus a stereo master track reserved for mixdown and for holding the material burnt to CD, with ten virtual takes on each of the eight tracks. Two tracks record at once and ten play back (eight audio plus the stereo drum channel), recorded as 16-bit linear data at roughly three hours per gigabyte of mono track. Editing covers copy, move, erase, exchange, trim, fade-in and fade-out, reverse, and time stretch and compression that changes the duration of a range without changing its pitch. A bounce function ping-pongs all eight tracks at once, and manual or automatic punch-in and punch-out are both available.

  A phrase loop function builds loops from recorded audio or from audio files read off a CD-ROM, programming the playback sequence and repeat count and then writing the result to any track or V-take as audio data. Importing WAV and AIFF files from a computer instead requires the optional UIB-01 or UIB-02 USB interface board.

  The ten-fader digital mixer handles the eight tracks plus the drum channel and a stereo master, with volume, panning, mute, 2-band EQ and send level per channel, selectable post-fader or pre-fader metering and stereo linking across tracks 1/2, 3/4, 5/6 and 7/8. Up to 100 mixer scenes per project can be recalled by hand or switched automatically at a mark point. The effect section runs an insert effect, placeable after the input jack, on a mixer channel or just before the master fader, across eight algorithms and 280 patches, alongside a two-module send and return effect with 40 patches carrying chorus, delay, doubling and hall and room reverbs.

  The rhythm section plays 511 rhythm patterns per project from a 16-bit linear PCM drum source with 43 drum kits of 24 sounds each, over 400 of those patterns preprogrammed at the factory. Patterns can be arranged into ten rhythm songs per project of up to 999 measures, entered by conventional step input or by Zoom's FAST input, at 40.0 to 250.0 BPM. The front-panel CONTROL IN jack takes the FS01 foot switch for transport and punch control or the FP01/FP02 expression pedal for effect parameters, and both MIDI connectors are fitted.
specs: |-
  - Physical tracks: 10 (8 mono audio plus the stereo master track), virtual tracks: 100 (10 V-takes
    per track), plus 1 stereo drum track
  - Simultaneous recording: 2 tracks, simultaneous playback: 10 tracks (8 audio plus stereo drum)
  - Recording data format: 16-bit linear, non-compressed
  - Maximum recording time: approx. 3 hours per gigabyte, referred to mono tracks
  - Projects: 1000, markers: 100 mark points per project
  - Locate function: hour/min/sec/mSec/meas/beat/tick
  - Track edit functions: copy, move, erase, exchange, trim, fade-in/out, reverse, time stretch/compression
  - Punch-in/out: manual and auto
  - Other functions: bounce, scrub/preview, A-B repeat, capture/swap, phrase loop
  - Mixer: 10 faders (1-8 mono, drum, stereo master), selectable post-fader/pre-fader metering, 100 scenes per project
  - Track EQ: HIGH 500 Hz to 18 kHz and LOW 40 Hz to 1.6 kHz, gain plus or minus 12 dB
  - Effect sends: chorus/delay and reverb. Stereo linking on tracks 1/2, 3/4, 5/6, 7/8
  - Effects: 8 algorithms (CLEAN, DIST, ACO/BASS SIM, BASS, MIC, DUAL MIC, LINE, MASTERING). 280 insert patches across 6 modules, 40 send/return patches across 2 modules
  - Tuner: chromatic auto tuner
  - Rhythm: 8 voices, 16-bit linear PCM source, 43 drum kits, 24 drum sounds per kit (8 x 3 banks)
  - Rhythm capacity: 511 patterns and 10 songs per project, 999 measures per song, 99 per pattern, approx. 20000 notes per song
  - Resolution: 48 PPQN, beat range 1/4 to 8/4, tempo 40.0 to 250.0 BPM
  - Hard disk: 3.5 inch E-IDE type
  - A/D converter: 24-bit, 64-times oversampling. D/A converter: 24-bit, 128-times oversampling
  - Sampling frequency: 44.1 kHz, signal processing: 24-bit
  - Frequency response: 20 Hz to 20 kHz plus or minus 1 dB into a 10-kilohm load
  - S/N ratio: 93 dB (IHF-A), dynamic range: 97 dB (IHF-A), THD+N: 0.02% at 400 Hz into a 10-kilohm load
  - Display: 66 x 52 mm custom LCD with backlight
  - Guitar/bass input: standard mono phone jack, input impedance 500 kilohms
  - Balanced/unbalanced inputs: XLR and standard phone combo jack, balanced input impedance 1 kilohm pin 2 hot, unbalanced 50 kilohms
  - Phantom power: 48 V with on/off switch, supplied to both INPUT 1 and INPUT 2
  - Input level: -50 dBm to +4 dBm, continuously variable
  - Master output: RCA phono jacks (L/R), output impedance 1 kilohm, rated output level -10 dBm
  - Headphone output: standard stereo phone jack, 50 mW into 32-ohm load
  - MIDI connectors: IN and OUT
  - Control input: FS01/FP02 combined
  - Expansion board slot: 1
  - Dimensions: 430 (W) x 270 (D) x 105 (H) mm
  - Weight: 5 kg with CD-R/RW drive, 4 kg without
  - Power supply: 12 V DC, 2 A from the supplied AD-0009 AC adapter. Power consumption 20 W (12 V, 1 A) typical
  - Optional accessories: FS01 Foot Switch, FP02 Expression Pedal, UIB-01/UIB-02 USB Interface Board, CD-01 CD-R/RW drive
