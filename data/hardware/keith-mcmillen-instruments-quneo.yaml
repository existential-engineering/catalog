details: |-
  QuNeo is a 4x4 pad controller built around 16 touch-sensitive pads that report velocity, pressure and x-y finger position. A Smart Fabric sensor layer sits under each pad and reads small shifts in velocity, pressure and finger position, and the playing surface has no moving parts.

  Alongside the pads are nine pressure-sensitive sliders that can be mapped to note on or CC messages, a long horizontal slider that supports multi-touch for width-based parameter control, and two pressure-sensitive rotary encoders that can be mapped to direction or to increment and decrement.

  MPE support is provided by the free QuNeo MPE application, which also carries control presets for several MPE instruments, including parameter integration with Modal's Skulpt, Argon and Cobalt synthesizers, and adds harmonic scales and modes to the 4x4 pad grid. Deeper configuration is handled with the QuNeo Editor and a development SDK.

  The controller communicates as a USB MIDI device and is compatible with macOS and Windows. Five-pin DIN MIDI in and out are available through the optional KMI MIDI Expander, sold separately. The enclosure is ABS polycarbonate.
specs: |-
  - 16 touch-sensitive pads detect velocity, pressure, and x-y position
  - 9 pressure-sensitive sliders mappable to note on and CC messages
  - Long horizontal slider supports multi-touch for width-based parameter control
  - 2 pressure-sensitive rotary encoders mappable to direction or increment/decrement
  - MPE support through the free QuNeo MPE application
  - Advanced configuration with the QuNeo Editor and development SDK
  - USB MIDI in and out
  - 5-pin DIN MIDI in and out through the optional KMI MIDI Expander (sold separately)
  - USB bus powered, no external power supply
  - ABS polycarbonate enclosure
  - Compatible with macOS and Windows
