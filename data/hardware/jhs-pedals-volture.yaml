description: A voltage sag utility pedal that sits between your power supply and
  a pedal, letting you dial in the dying-battery tone of vintage fuzz circuits
  by trimming the output voltage from 7.5V down to 1.25V.
details: |-
  Since the fuzz effect was invented in the early sixties, guitar players have gone to great lengths to achieve the perfect fuzz tone. One trick that always works: use a dying battery. Fuzz circuits are extremely sensitive to voltage changes, and a dying battery produces drastically different tones. The Volture was born from a guitarist's request for a practical solution.

  The Volture is a modern day device for vintage fuzz circuitry. Place it between your power supply and your pedal to precisely trim the input voltage and replicate the tone of a dying battery. Though developed specifically for vintage fuzz circuits, it will work on any fully analog pedal.

  Input voltage: 9, 12, or 18VDC center negative. Output voltage: adjustable from 1.25VDC to 7.5VDC center negative. The Volture uses 10mA in addition to the power consumed by the connected pedal. Should be used with pedals drawing less than 50mA. As voltage is turned down, the LED dims simultaneously.

  WARNING: The Volture should not be paired with any digital/logic circuitry-based pedal, as inadequate voltage risks potential damage.
