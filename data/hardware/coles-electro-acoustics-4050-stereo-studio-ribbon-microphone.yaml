description: The 4050 Stereo Studio Ribbon Microphone has been developed using
  the latest magnet technology, offering greater output and a wider frequency
  response than previous models. It features an exceptionally flat response from
  30 to 20,000 Hz and a bi-directional figure-of-eight polar pattern maintained
  consistently across the horizontal and vertical planes.
details: |-
  The 4050 Stereo Studio Ribbon Microphone represents Coles Electroacoustics' latest
  evolution of their studio ribbon microphone line, featuring a bold new look alongside
  technical improvements including greater output and a wider frequency response. These
  advances were made possible through the use of the latest magnet technology.

  The frequency response of the 4050 is exceptionally flat from 30 to 20,000 Hz, and
  throughout this range the shape of the bi-directional (figure-of-eight) polar response
  is maintained substantially constant both in the horizontal and vertical planes.

  The 4050 is a versatile microphone ideally suited to many critical recording
  applications. Its smooth frequency response characteristics and ability to capture
  fine detail make it an excellent choice for a wide variety of instruments. There is
  no discernible stray magnetic field from the microphone body.

  The 4050 microphones come with their own unique shock mount that magnetically attaches
  the microphones and enables them to be used as a stereo pair or individually. The
  microphones can be easily rotated through 360 degrees, making them very easy to mount
  in a Blumlein (crossed figure-of-eight) stereo configuration or any other configuration
  of choice.
specs: |-
  - Polar pattern: Bi-directional (figure-of-eight)
  - Frequency response: 30 to 20,000 Hz (exceptionally flat)
  - Polar response maintained substantially constant in horizontal and vertical planes
  - No discernible stray magnetic field
  - Includes unique magnetic shock mount
  - 360-degree rotation for flexible mounting configurations
  - Suitable for use as a stereo pair or single microphone
  - Supports Blumlein (crossed figure-of-eight) stereo configuration
