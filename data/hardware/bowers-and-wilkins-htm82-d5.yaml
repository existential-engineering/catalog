description: The HTM82 D5 delivers flagship Bowers & Wilkins centre channel
  performance on a smaller scale. Paired perfectly with the 803 D5 or the 804 D5
  loudspeakers, it adds beautiful clarity and precision to your movie-watching
  experience.
details: |-
  The HTM82 D5 is the more compact of the two centre-channel loudspeakers in the 800 Series Diamond D5 range, delivering flagship centre channel performance on a smaller scale and intended to pair with the 803 D5 or the 804 D5. It is a 3-way vented-box passive design driven from an external amplifier, with a recommended amplifier power of 50W to 200W into 8 ohms and no mains connection of its own.

  It carries the range's most advanced technology: the Diamond dome tweeter, Solid Body Tweeter-on-Top, a decoupled Continuum Cone midrange drive unit and twin Aerofoil bass cones. The listed technical feature set also covers the Anti-Resonance plug, Biomimetic Suspension, Matrix bracing and Flowport.

  Drive units are a 25mm (1in) Diamond dome high-frequency unit, a 130mm (5in) Continuum cone FST midrange and two 165mm (6.5in) Aerofoil bass cones. Frequency range runs from a -6dB point of 33Hz to 35kHz, response is 45Hz to 28kHz within +/-3dB of the reference axis, and sensitivity is 89dB on axis at 2.83Vrms at 1m.

  The cabinet stands 289mm (11.4in) high including the tweeter, 715mm (28.1in) wide and 363mm (14.3in) deep including grille and terminals, and weighs 26.1kg (57.5lbs). Nominal impedance is 8 ohms with a 3.0 ohm minimum and maximum recommended cable impedance is 0.1 ohms.

  Finishes are Stealth Black, Warm White and Dark Walnut, with black grilles on Stealth Black and Dark Walnut and grey grilles on Warm White. A stand is not included. The FS-HTM D5 centre-speaker stand, available in Black or Titanium, is the matching optional floorstand for the HTM81 D5 and HTM82 D5.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond dome tweeter, Solid body Tweeter-on-Top, Continuum cone FST midrange, Anti-Resonance plug, Biomimetic Suspension, Matrix, Aerofoil bass cones, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 130mm (5in) Continuum cone FST midrange, 2x 165mm (6.5in) Aerofoil bass
  - Frequency range: -6dB 33Hz to 35kHz
  - Frequency response: 45Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 89dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (89dB, 1m on axis), less than 1% 80Hz to 20kHz, less than 0.3% 100Hz to 8kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 200W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 289mm (11.4in) including tweeter, Width 715mm (28.1in) cabinet only, Depth 363mm (14.3in) including grille and terminals
  - Net weight: 26.1kg (57.5lbs)
  - Cabinet finishes: Stealth Black, Warm White, Dark Walnut
  - Grille finishes: Black (Stealth Black and Dark Walnut), Grey (Warm White)
  - Accessories: FS-HTM stand in Black or Titanium
