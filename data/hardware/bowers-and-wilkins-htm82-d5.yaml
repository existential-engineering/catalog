prices:
  - amount: 12000
    currency: USD
description: The HTM82 D5 delivers flagship Bowers & Wilkins centre channel
  performance on a smaller scale. Paired perfectly with the 803 D5 or the 804 D5 loudspeakers, it
  adds beautiful clarity and precision to your movie-watching experience.
details: |-
  Featuring the Bowers & Wilkins Diamond dome tweeter, Solid Body Tweeter-on-Top, a decoupled Continuum Cone midrange drive unit and twin Aerofoil bass cones, HTM82 D5 is engineered with the brand's most advanced technology to unveil even more detail from your favourite entertainment. Available in Stealth Black, Warm White and Dark Walnut with an optional matching floorstand for seamless installation.

  The speaker is a 3-way vented-box system using a 25mm (1in) Diamond dome high-frequency unit, a 130mm (5in) Continuum cone FST midrange and two 165mm (6.5in) Aerofoil bass drivers. Its listed technical features are the Diamond dome tweeter, Solid body Tweeter-on-Top, Continuum cone FST midrange, Anti-Resonance plug, Biomimetic Suspension, Matrix bracing, Aerofoil bass cones and Flowport.

  Frequency range runs from a -6dB point of 33Hz up to 35kHz, with a 45Hz to 28kHz response within +/-3dB of the reference axis and 89dB sensitivity measured on axis at 2.83Vrms at 1m. Nominal impedance is 8 ohms with a 3.0 ohm minimum, and the recommended amplifier power is 50W to 1000W into 8 ohms on unclipped programme. Harmonic distortion is quoted as below 1% from 80Hz to 20kHz and below 0.3% from 100Hz to 8kHz.

  The cabinet stands 289mm (11.4in) high including the tweeter, 715mm (28.1in) wide and 363mm (14.3in) deep including grille and terminals, and weighs 26.1kg (57.5lbs). Cabinet finishes are Stealth Black, Warm White and Dark Walnut, with black grilles on Stealth Black and Dark Walnut and grey grilles on Warm White. The matching FS-HTM floor stand is listed in Black and Titanium.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond dome tweeter, Solid body Tweeter-on-Top, Continuum cone FST midrange, Anti-Resonance plug, Biomimetic Suspension, Matrix, Aerofoil bass cones, Flowport
  - Drive units: 1x ø25mm (1in) Diamond dome high-frequency, 1x ø130mm (5in) Continuum cone FST midrange, 2x ø165mm (6.5in) Aerofoil bass
  - Frequency range: -6dB 33Hz to 35kHz
  - Frequency response: 45Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 89dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (89dB, 1m on axis), <1% 80Hz to 20kHz, <0.3% 100Hz to 8kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 1000W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 289mm (11.4in) including tweeter, Width 715mm (28.1in) cabinet only, Depth 363mm (14.3in) including grille and terminals
  - Net weight: 26.1kg (57.5lbs)
  - Cabinet finishes: Stealth Black, Warm White, Dark Walnut
  - Grille finishes: Black (Stealth Black and Dark Walnut), Grey (Warm White)
  - Accessories: FS-HTM stand in Black or Titanium
