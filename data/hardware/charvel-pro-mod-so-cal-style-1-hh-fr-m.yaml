details: |-
  The Pro-Mod So-Cal Style 1 HH FR M is a high-performance double-cutaway electric guitar pairing an alder body in a gloss finish with a bolt-on maple speed neck featuring graphite reinforcement, a hand-rubbed satin urethane finish, and rolled fingerboard edges for fast, fatigue-free playing.

  The 12"-16" compound radius maple fingerboard is fitted with 22 jumbo frets and black dot inlays, accommodating both rhythm chording at the nut and effortless string bends in the upper register.

  Electronics include a Seymour Duncan Distortion TB-6 humbucker in the bridge and a Seymour Duncan Distortion SH-6N humbucker in the neck, controlled by a single volume with push/pull coil split, a no-load tone control, and a 3-position blade switch for versatile tonal options.

  Hardware is anchored by a recessed Floyd Rose 1000 Series double-locking tremolo with matching locking nut and Charvel-branded die-cast tuning machines in a black finish throughout. A 1-ply black pickguard rounds out the aggressive, modern aesthetic.
specs: |-
  - Body: Alder, So-Cal Style 1 shape, gloss finish
  - Pickguard: 1-ply black
  - Neck: Bolt-on maple with graphite reinforcement, hand-rubbed satin urethane finish, speed neck shape with rolled fingerboard edges
  - Scale Length: 25.5" (648 mm)
  - Fingerboard: Maple, 12"-16" compound radius, black dot inlays
  - Frets: 22 jumbo
  - Nut: Floyd Rose 1000 Series locking, 1.6875" (42.86 mm) width
  - Bridge pickup: Seymour Duncan Distortion TB-6
  - Neck pickup: Seymour Duncan Distortion SH-6N
  - Pickup configuration: HH
  - Controls: Volume (push/pull coil split), no-load tone
  - Switching: 3-position blade with coil split capability
  - Bridge: Floyd Rose 1000 Series double-locking tremolo (recessed)
  - Tuners: Charvel-branded die-cast
  - Hardware finish: Black
  - Control knobs: Knurled flat-top
  - Headstock: Licensed Fender Stratocaster
  - Strings: Nickel-plated steel (.009-.042)
  - Strap buttons: Standard
  - Orientation: Right-hand
  - Series: Pro-Mod
  - Model Number: 2966001557
