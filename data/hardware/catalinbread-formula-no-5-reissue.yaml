description: The Formula No. 5 Reissue emulates reedy, touch-sensitive 1950s
  tones through tube-simulation circuitry. All controls are interactive, with
  Tone tied directly to Gain to emphasize certain frequencies across multiple
  sweet spots. The pedal delivers a healthy dose of gain that responds
  dynamically to your guitar's volume control, offering everything from light
  tube sag to clean tweed tones.
details: |-
  The Formula No. 5 Reissue is topologically similar to the Formula 55 but features a different gain structure inspired by 1950s tweed tube amplifiers. The single Tone knob is modeled after vintage amp tone stacks, applying a low-pass filter with a subtle mid scoop. The Gain control never makes the sound fully clean even when rolled all the way back, preserving the character of the tube-simulation circuit.

  All controls are interactive — Tone is tied directly to Gain to emphasize certain frequencies across the sweep. At lower gain settings the pedal produces light tube sag; at higher settings it delivers saturated overdrive. Accepts 9-18V center-negative DC power, with higher voltages increasing headroom.
