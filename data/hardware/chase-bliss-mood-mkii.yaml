description: MOOD MKII is a different kind of multi-effect. Its two channels are
  aware of each other and work together — one half samples and loops brief
  moments, the other is a collection of real-time spatial effects.
details: |-
  MOOD MKII is a different kind of multi-effect. Its two channels are aware of each other and work together. One half samples and loops brief moments, the other is a collection of real-time spatial effects. Together, they twist any sound into a sprawling texture that you can freeze, loop and scatter across the stereo field, for instant gratification and endless exploration.

  The micro-looping channel, designed in collaboration with Drolo FX, features an always-listening looper with overdubbing capability. It captures and expands any moment instantly, allowing you to stretch, slice, and dynamically control the ambience.

  The spatial effects channel, designed in collaboration with Old Blood Noise Endeavors, provides real-time ambient effects processing. The musical clock knob shifts both channels in harmonized steps, creating cohesive and evolving soundscapes.

  Freeze and refresh capabilities let you freeze the wet channel or transform the looper into a delay. Mix and mingle mode-based stereo motion adds depth and dimension to your sound.

  MOOD MKII includes MIDI support (note, program change, CC, clock sync), CV and expression control, two preset slots, internal modulation via ramping, and a Classic Mode that recalls the original MOOD's sound character.
specs: |-
  - Stereo I/O
  - 9V DC center negative power
  - Approximately 270 mA current draw
  - Analog dry thru
  - Buffered bypass with trails mode
  - MIDI control (note, program change, CC, clock sync)
  - CV / Expression input
  - 2 preset storage slots
  - Internal modulation (ramping)
  - Classic Mode for original MOOD sound character
  - Micro-looper designed by Drolo FX
  - Spatial effects designed by Old Blood Noise Endeavors
  - Dip switches for configuration
