description: MOOD MKII is a different kind of multi-effect from Chase Bliss. Its two channels are aware of each other and work together. One half samples and loops brief moments, the other is a collection of real-time spatial effects.
details: |-
  MOOD MKII is a different kind of multi-effect. Its two channels are aware of each other and work together: one half samples and loops brief moments, the other is a collection of real-time spatial effects. Twist any sound into a sprawling texture that you can freeze, loop and scatter across the stereo field, for instant gratification and endless exploration. It's a musical chemistry set: transfer, combine, and get lost.

  The Micro-Looper channel, designed with Drolo FX, is an always-listening looper. The channel continuously records until you turn it on, so you hear whatever was already happening the moment you engage it, now with overdubbing. The Wet Channel, designed with Old Blood Noise Endeavors, is a twist on the classic ambient palette, a collection of real-time effects that can process the micro-loops, the input signal, or both.

  The Clock knob controls the sample rate of both channels at once and shifts everything in harmonized steps, so a loop and the reverb processing it can be half-speeded together in one move. Each channel can also be frozen and reversed: the Wet Channel can be frozen into ambient pads or secondary loops, while the Micro-Looper can become a delay or a pseudo-live effect.

  What's new for MKII: stereo operation, overdubbing, freezing, syncing, fading, filtering, balancing, blending, and smoothing, plus polished sound quality with a Classic Mode for players who prefer the original MOOD's character. MIDI integration is deeper than before, including the ability to play MOOD MKII from a keyboard, clock sync, and control over every parameter, including hidden ones.

  MOOD MKII features advanced connectivity and customization including MIDI, CV and expression control, two presets, and internal modulation (ramping) of any or all of its knobs.
specs: |-
  - Two interconnected channels: Micro-Looper and Wet (spatial effects)
  - Stereo I/O (mono, stereo, or mono-to-stereo operation)
  - Always-listening Micro-Looper with overdubbing
  - Wet Channel real-time ambient/spatial effects, freezable
  - Musical Clock knob sets shared sample rate in harmonized steps
  - Classic Mode recalls original MOOD (MKI) sound character
  - MIDI (note, program change, CC, clock sync), requires Chase Bliss MIDIbox
  - MIDI jack also usable for external momentary footswitch control
  - CV control (0-5V range) and expression pedal input
  - 2 onboard presets
  - Internal modulation via Ramping and Bounce
  - Trails (Wet Channel fades out after bypass)
  - Analog dry thru
  - Buffered bypass
  - Dip-switch configuration (Customize and Control banks)
  - 9V DC center negative power, ~270 mA current draw
  - Designed in collaboration with Drolo FX (Micro-Looper) and Old Blood Noise Endeavors (Wet Channel)
