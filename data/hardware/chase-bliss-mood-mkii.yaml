description: MOOD MKII is a different kind of multi-effect from Chase Bliss. Its
  two channels are aware of each other and work together. One half samples and
  loops brief moments, the other is a collection of real-time spatial effects.
details: |-
  MOOD MKII is a different kind of multi-effect. Its two channels are aware of each other and work together: one half samples and loops brief moments, the other is a collection of real-time spatial effects. Twist any sound into a sprawling texture that can be frozen, looped, and scattered across the stereo field, for instant gratification and endless exploration.

  The Micro-Looper channel, designed with Drolo FX, is an always-listening looper. It continuously records until turned on, so it captures whatever was already happening the moment it's engaged, now with overdubbing. The Wet Channel, designed with Old Blood Noise Endeavors, is a twist on the classic ambient palette: a collection of real-time effects (Reverb, Delay, Slip) that can process the micro-loops, the input signal, or both.

  The Clock knob controls the sample rate of both channels at once and shifts everything in harmonized steps, so a loop and the reverb processing it can be half-speeded together in one move. Each channel can also be frozen: the Wet Channel freezes into ambient pads or secondary loops, while the Micro-Looper channel can act like a delay or a pseudo-live effect via the hidden No Dub option.

  What's new for MKII: stereo operation, overdubbing, freezing, syncing, fading, filtering, balancing, blending and smoothing, plus polished sound quality with a Classic Mode that recalls the original MOOD's noisier, more idiosyncratic character. MIDI integration is deeper than before, including the ability to play MOOD MKII from a keyboard, clock sync, and control over every parameter, including hidden options and dip switches.

  MOOD MKII supports mono, stereo, or mono-to-stereo (MISO) operation, CV and expression control (0-5V range), two onboard presets, and internal modulation (Ramping and Bounce) of any or all of its knobs.
specs: |-
  - Two interconnected channels: Micro-Looper and Wet (spatial effects)
  - Wet Channel modes: Reverb, Delay, Slip, each freezable
  - Micro-Looper modes: Env, Tape, Stretch, with overdubbing
  - Always-listening Micro-Looper (continuously records while bypassed)
  - Musical Clock knob sets shared sample rate for both channels in harmonized steps
  - Mono, stereo, or mono-to-stereo (MISO) operation
  - SPREAD dip switch creates/exaggerates a stereo image per mode
  - Classic Mode recalls the original MOOD (MKI) sound character
  - MIDI: note, program change, CC, and clock sync (requires Chase Bliss MIDIbox)
  - MIDI jack doubles as an external momentary footswitch input
  - CV control (0-5V range) and expression pedal input on a shared jack
  - 2 onboard presets
  - Internal modulation via Ramping (one-time) and Bounce (continuous)
  - Trails: Wet Channel fades out smoothly after bypass
  - Analog dry-thru signal path
  - Buffered bypass, with a true-bypass override option
  - Dip-switch Customize and Hidden Options banks, saved per preset
  - Power: 9V DC center negative, ~270 mA
  - Designed in collaboration with Drolo FX (Micro-Looper) and Old Blood Noise Endeavors (Wet Channel)
