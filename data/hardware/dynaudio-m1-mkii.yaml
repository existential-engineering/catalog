description: High-energy compact near-field monitor
details: |-
  The M1 MkII represents a compact dual low-frequency, two-way near-field monitoring solution. Development focused on analyzing essential requirements for audio engineers working at elevated volume levels over extended sessions.

  Every component meets reference-quality music reproduction standards with exceptional reliability. Drive units withstand 1000W transient peaks without signal degradation, delivering outstanding dynamic response capabilities.

  The system employs the latest Esotar 3 tweeter alongside proprietary MSP (Magnesium Silicate Polymer) low-frequency drivers to achieve highly accurate soundfield reproduction while minimizing listening fatigue.

  As a passive monitor, the M1 MkII is typically used with a stereo power amplifier such as the Dynaudio Acoustics DA2 or DCA800, and can be complemented by a sub-bass loudspeaker system for surround monitoring applications.
specs: |-
  - Status: Current
  - Segment: Pro
  - Series: Dynaudio Acoustics
  - Application: Music and post production
  - Type: 2-way passive
  - Frequency response: 50Hz - 20kHz
  - Maximum SPL at 2 metres: 122dB stereo
  - Crossover frequencies: 1650Hz
  - Total harmonic distortion: 1% at 90dB
  - Recommended amplifier power: 250-500W per channel
  - High frequency driver: Esotar 3
  - Low frequency driver: 2x 18cm MSP
  - Amplifier recommendation: Dynaudio Acoustics DA20, DA40, DCA800
  - Cabinet dimensions (H x W x D): 256 x 476 x 393mm
  - Weight: 14 kg
  - Finish: Black textured paint
  - Optional hardwood cabinets: Oak, cherry, walnut, maple
  - Custom cabinet sizes: On request
