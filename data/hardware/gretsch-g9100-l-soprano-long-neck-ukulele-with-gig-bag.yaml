details: |-
  Love soprano uke tone but finding that the shorter scale is cramping your style? The G9100-L Soprano Long-Neck is just what the uke doctor ordered.

  The instrument features a 15" scale and a 16-fret concert-size mahogany neck that joins the body at the 14th fret, offering all the space you need for higher-register playing. Additional features include mahogany top, back and sides, an ovangkol fingerboard and bridge, bone nut and saddle, open-back geared tuners, Aquila Nylgut strings and fitted gig bag. The finish is open-pore semi-gloss for an organic look and vibe.
