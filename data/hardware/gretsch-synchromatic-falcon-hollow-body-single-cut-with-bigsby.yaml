details: |-
  The Synchromatic Collection makes next-level Gretsch style and sound more accessible than ever before. Boasting upgraded materials and components, enhanced bracing, and authentic aesthetic features, Synchromatic guitars deliver the Gretsch experience you've been looking for.

  The Synchromatic Falcon brings the mystique and beauty of the venerable Falcon hollow body into a whole new realm. Featuring a 2.5" deep maple body with Semi-Arc bracing design, an ebony fingerboard, and Hi-Fidelity Filter'Tron pickups, the Synchromatic Falcon provides the comfort, playability, and timeless Gretsch sound that you need to fuel your sonic creations.

  The Synchromatic Falcon features a 2.5" deep maple body with Semi-Arc bracing. A modified version of the classic Gretsch Trestle Bracing design, this bracing pattern features two 'feet' under the bridge while eliminating the additional feet near the neck block that traditional Trestle Bracing has. This results in 'best of both worlds' tone that provides the huge, resonant tone of Parallel Bracing, with the classic 'snap' and feedback-busting sustain of 1959 Trestle Bracing.

  The direct-mounted Hi-Fidelity Filter'Tron pickups feature Alnico 5 magnets and deliver the sought after chime, articulation, and balance of vintage Filter'Trons. The maple neck features a comfortable Soft "C" shape with a beautiful ebony fingerboard, medium jumbo frets, a genuine bone nut, and pearloid Neo-Classic thumbnail inlays providing premium playability, sound, and looks.
