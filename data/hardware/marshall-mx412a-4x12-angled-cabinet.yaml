description: Versatile 4x12" angled-front guitar speaker cabinet from Marshall's affordable MX range. Loaded with four Celestion G12E-60 speakers for 240W of power handling at 16Ω, the MX412A delivers the classic Marshall angled-front voice in a more accessible package. Designed to form the top half of an angled full stack when paired with a matching MX412B base cabinet, and to partner with MX-series and other 16Ω-compatible Marshall heads.
details: |-
  With sheer power and fantastic quality, this 240W 4x12 is compatible with most Marshall heads and is fitted with four Celestion G12E-60 speakers that can handle any genre. The simple yet iconic Marshall style is emulated in these cabinets with white logos, white piping and black fret.

  This cabinet is also available as a straight base cab, allowing you to create your own Marshall stack.

  Designed and engineered in UK. Made in Vietnam.
