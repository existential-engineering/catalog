description: |-
  Road-tested in arenas around the world, the Wolfgang® Special is a purebred music-making machine, designed with stunning style, giant sound and high-speed playability.

  Built for the southpaws, the Wolfgang Special LH features a basswood body with an arched top and a robust graphite- reinforced bolt-on quartersawn maple neck, carved and rolled to Eddie Van Halen's exacting specifications and with a hand- rubbed urethane finish. Primed for energetic riffing and blazing leads, its 12"-16" compound radius ebony fingerboard has 22 jumbo frets and pearloid dot inlays. Truss rod adjustments have also never been easier thanks to a spoke wheel conveniently located at the base of the neck.
