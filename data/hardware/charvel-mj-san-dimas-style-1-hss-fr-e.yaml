description: Harkening back to the late '80s when Charvel guitars were
  manufactured exclusively in Japan, the MJ Series is an exciting lineup of
  instruments attentively crafted in Japan. The MJ San Dimas Style 1 HSS FR E
  delivers premium playability and classic Charvel performance with high-end
  appointments throughout.
details: |-
  The MJ San Dimas Style 1 HSS FR E pairs a San Dimas Style 1 alder body in a Satin Black finish with a bolt-on maple neck featuring graphite reinforcement and a hand-rubbed oil finish. The Speed Neck profile includes rolled fingerboard edges for a fast, broken-in feel, while a 4-bolt sculpted heel and heel-mount truss rod adjustment wheel round out the modern performance platform.

  An ebony fingerboard with a 12" to 16" compound radius hosts 24 jumbo frets with white dot inlays, anchored by a 25.5" scale length and a 1.6875" Floyd Rose 1000 Series locking nut.

  Electronics are built around a versatile HSS configuration: a Seymour Duncan JB TB-4 at the bridge paired with custom Seymour Duncan Flat Strat SSL-6 single-coils in the middle and neck positions, routed through a 5-position blade switch with volume and tone controls.

  Hardware includes a recessed Gotoh GE1996T Series double-locking tremolo with Gotoh tremolo arm for rock-solid tuning stability, along with Gotoh die-cast tuning machines and a gold hardware finish. Dunlop dual-locking strap buttons and a licensed Fender Stratocaster headstock complete the package, which ships with a Charvel multi-fit hardshell gig bag.
