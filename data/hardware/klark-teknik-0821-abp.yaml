description: The DN410 is the dual-channel sibling of the DN405, delivering two
  fully independent five-band parametric equaliser channels in a single 1U rack
  space. It is aimed at engineers working stereo programme material, dual-mono
  signal paths or main-plus-monitor configurations.
details: |-
  Each of the DN410's ten bands, five per channel, offers continuous control over centre frequency, Q and gain. The overlapping band ranges allow any filter shape from gentle tonal sculpting to narrow notch correction, and channel matching is tight by design so a stereo image stays coherent when both channels are working hard.

  The DN410 was developed for installations where transparent two-channel parametric correction is required, including mastering suites, broadcast continuity rooms and reference monitoring chains. Signal-to-noise and total harmonic distortion specifications reflect the aim of first-class audio across every signal path the unit touches.

  Designed and built at the Klark Teknik facility in Kidderminster, the DN410 is part of the DN-series legacy that defined professional equalisation for two generations of engineers.
specs: |-
  - Dual-channel fully parametric equaliser
  - Five bands per channel, ten bands total
  - Continuous centre frequency, Q and gain control per band
  - Overlapping band ranges
  - 1U rack space
