description: MP-460 In-Ear Monitors are the professional solution you need.
  These monitors are comfortable and offer quad-balanced sound and smooth
  resolution.
details: |-
  Balanced sound, enhanced detail resolution and smooth midrange is the name of the game with MP-460. With two drivers dedicated to high frequencies, the finest details come through without harshness.

  The quad balanced armature drivers are custom designed specifically for the MP Series, and a precision 3-way crossover keeps the response balanced across the entire frequency range.

  The ergonomically molded low-profile enclosure offers maximum comfort, sound isolation and bass response, with up to 40 dB of sound isolation and a clear enclosure for a streamlined onstage look.

  The shielded, braided cable is equipped with a detachable MMCX connector that swivels for increased comfort and durability, and the over-ear design keeps the cables behind the head. Four ear tip types in three sizes are included, along with a hard molded case, a gold-plated 1/8 inch to 1/4 inch adapter, an additional braided cable with in-line remote, a cleaning tool and a cleaning cloth.
specs: |-
  - Frequency Response: 20 Hz to 20 kHz
  - Impedance: 15.5 ohms +/-15%
  - Transducer Type: Quad Balanced Armature
  - Sensitivity: 118 dB +/-3 dB @ 1 mW at 1 kHz
  - Precision 3-way crossover
  - Knowles balanced armature drivers
  - Up to 40 dB of sound isolation
  - Detachable, swiveling MMCX cable connectors
  - Passive design, no power supply or battery required
