details: |-
  Live vocal microphone that combines retro design with class-leading sound quality

  For anyone serious about their live vocals, the Sontronics CORONA has been developed to sound as good as it looks. Ideal for stage use as well as live-streaming and home recording, the CORONA is a dynamic mic with a superbly honed supercardioid capsule that boasts a focused pickup, excellent side rejection and no need for any EQ or post-processing. Designed, developed and built in the UK, CORONA's superior output level is matched by incredible presence, depth and detail across the entire frequency range, which means every performance will be your best.
specs: |-
  - Dynamic Microphone: Specifically designed for live vocals and broadcasting, providing a focused and clear sound.
  - Supercardioid Polar Pattern: Offers excellent isolation, reducing background noise and ensuring your voice cuts through the mix.
  - Tailored Frequency Response: Optimised for vocals, delivering clarity and presence with a smooth, natural tone.
  - Vintage-Inspired Design: Features a distinctive retro look, combining style with modern performance.
  - Rugged Construction: Built to withstand the demands of live performances making it a reliable choice for on-the-road use.
  - Versatile Application: Suitable for live vocals, radio, podcasting, and other voice-based applications, offering flexibility for various settings.
  - Easy Setup: No need for external power or complicated setups—just plug in and start performing.
  - Excellent Feedback Rejection: The supercardioid pattern and internal design help prevent feedback issues, even in challenging environments.
  - Trusted by Professionals: Used by vocalists and broadcasters who need dependable, high-quality sound, ensuring professional results every time.
