details: |-
  The Bettermaker Bus Compressor is a 100% analog signal path stereo VCA compressor with digital control, offering the convenience of fast and precise recall and automation. It features both PEAK and RMS detection modes, a dry/wet mix control for parallel compression workflows, and an adjustable THD saturation circuit for adding harmonic richness to the signal.

  The unit includes a sidechain high-pass filter with a hardware insert point and preview function, allowing engineers to shape what the compressor reacts to. A/B comparison functionality lets users quickly switch between two sets of parameters for evaluation during a session.

  Control is handled via an LED matrix display with six encoders, and the unit connects to Mac or PC via USB for DAW automation and total recall. Threshold ranges from -35dB to +5dB, attack from 0.1 to 60ms, release from 10 to 2000ms, ratios available at 1.5, 2, 4, 6, and 10:1, and a sidechain HPF sweepable from off to 370Hz.

  Technical specifications include a frequency response of 10Hz to 22kHz (±0.2 dB), dynamic range of 106dB, S/N ratio of 87dB (A-weighted), and THD below 0.06% (2nd harmonic). The unit is housed in a 1U rack enclosure 230mm deep, weighs 5kg, and draws a maximum of 25W. It holds U.S. Patent No. 10,693,428 B2.
specs: |-
