description: Boom Chick is an analog drum machine with brand new analog
  percussion voices and an addictively fun sequencer.
details: |-
  Introducing Boom Chick, a revolutionary analog drum machine built on the warmth and character of Pittsburgh Modular's newly designed analog drum circuits. These powerful, expressive percussion voices are paired with an advanced sequencer designed for intuitive creativity and deep rhythmic exploration. Inspired by the hands-on performability of iconic analog drum machines, Boom Chick redefines analog percussion with exceptional flexibility and sonic precision, tailored for modern musicians and producers.

  Compact yet incredibly powerful, the Boom Chick ensures frustration-free jamming and tweaking through its intuitive knob-per-function layout and straightforward interface conventions. It's hands-on, immediate, and built for musicians who want a drum machine that feels alive.

  Created by the Pittsburgh Modular Synthesizers team, Boom Chick features five meticulously crafted drum voices, each designed for maximum flexibility and expressiveness. The electricity creating the analog sounds is directly shaped using the knob-per-function interface.

  Every voice has been meticulously engineered for maximum sonic impact, making Boom Chick a true drum synthesizer, not just a drum machine. Starting with a massive bottom end, the Kick drum sculpts a specialized sine-wave oscillator using gritty overdrive, pitch manipulation, and a precise, percussive envelope. The Snare drum showcases the power of modern analog with hits that can mimic a physical snare drum or venture into creative new territories. Drum channels 1 and 2 use two oscillators, wave shaping, frequency modulation, and noise to generate everything from subtle percussion to wild, expressive textures. Hats utilize a custom oscillator noise matrix to create crisp, bright metallic tones.

  Boom Chick is modular-friendly, MIDI-capable, and performance-ready, making it a perfect addition to any studio or live rig. Individual trigger inputs and individual drum outs allow each drum to be sent to a mixer or DAW separately for external processing or recording. MIDI in and out send and receive clock, trigger drums, or sequence external percussion, while analog clock in and out allow Boom Chick to easily integrate with Eurorack setups and other gear.
specs: |-
  - 5 Drum Voices: Kick, Snare, Drum 1, Drum 2, Hats
  - 6-Channel, 64-Step Sequencer with Step Mode and Live Mode
  - 64 Sequence Memory Slots, 16 Song Memory Slots
  - Per-Voice Polyrhythms with adjustable track lengths
  - Sequencer Effects: Step Shift, Roll, Chance, Clear, Pattern Length, Pattern Extend, Clock Division, Humanize, Swing, Quantize, Generate Sequence, Euclidean Pattern Generator, Tap Tempo
  - Full MIDI Implementation
  - Individual Drum Trigger Inputs and Individual Drum Outputs
  - Dimensions: 207mm x 138mm x 61mm
  - Weight: 826g
  - Eurorack Compatible: 40hp width, 30mm depth
  - Eurorack Power Draw: 250mA on +12V rail, 200mA on -12V rail
  - Includes carrying case for standalone use
  - Included in box: 1x Boom Chick, 1x wall-wart power supply, 1x 3.5mm-to-5-pin (Type A) MIDI DIN pigtail adapter
