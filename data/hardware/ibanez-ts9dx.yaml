description: Turbo Tube Screamer — same circuitry as the TS9, with a Mode switch
  adding three extra voicings (+, Hot, Turbo) for increased low end and crunch.
details: |-
  The Ibanez TS9DX Turbo Tube Screamer features the same circuitry as a TS9, with the addition of three new settings for increased low end crunch: +, Hot, and Turbo.

  Three controls (Drive, Tone, Level) and a four-position Mode switch (TS9, +, Hot, Turbo) make the TS9DX more versatile than the standard TS9 — useful for everything from classic Tube Screamer overdrive to thicker, more aggressive tones. Made in Japan.
specs: |-
  - Controls: Drive, Tone, Level
  - Modes: TS9, +, Hot, Turbo
  - Required Current: 8mA@9V
  - Power Supply: One 9 volt battery (006P) or external AC adapter (DC 9V, Center-negative)
  - Input on right side; output on left side
  - Made in Japan
