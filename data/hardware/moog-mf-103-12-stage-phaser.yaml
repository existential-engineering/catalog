description: >-
  The Moogerfooger MF-103 is a fully analog 6/12-stage phaser designed by Bob
  Moog, featuring a wide-range LFO, variable feedback resonance, and full
  CV/Gate control over all parameters.
details: |-
  Released in 1999 as part of the Moogerfooger effects line, the MF-103 was personally designed by
  Bob Moog to bring studio-quality analog phasing into a rugged pedal format. The unit offers
  switchable 6-stage and 12-stage phasing modes, with the 6-stage producing three frequency
  response dips and the 12-stage delivering six for a deeper, more pronounced effect.

  The wide-range LFO spans from 0.1Hz to an unusually fast 250Hz, enabling everything from slow
  sweeps to audio-rate modulation effects not typically available in phaser pedals. Four main knobs
  control LFO Rate, Amount, Phaser Sweep, and Resonance, with two additional smaller knobs for
  input and output levels. The input gain can be driven for overdrive effects, adding another
  dimension to the sound shaping possibilities.

  A variable feedback circuit increases resonance at the phaser's notch frequencies, allowing
  dramatic tonal sculpting from subtle movement to intense, resonant sweeping. The mono input feeds
  stereo outputs, making it suitable for wide stereo imaging in studio applications.

  All parameters are controllable via CV/Gate connections rather than MIDI, staying true to the
  Moog tradition and making the MF-103 particularly well-suited for integration with modular
  synthesizer systems. The unit is housed in a rugged black chassis with Minimoog-style knobs and
  wooden side panels.
specs: |-
  - Type: Analog phaser (6-stage / 12-stage switchable)
  - Input: Mono
  - Output: Stereo
  - LFO Range: 0.1Hz to 250Hz
  - Controls: LFO Rate, LFO Amount, Phaser Sweep, Resonance, Input Level, Output Level
  - Control Inputs: CV/Gate for LFO rate, amount, waveform, resonance, and sweep
  - No MIDI
