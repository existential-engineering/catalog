description: Mackie Thump210XT is a compact 10” 1400W loudspeaker featuring
  proven sound quality, Bluetooth, Feedback Eliminator, Music Ducking and
  powerful enhancements. Connect to two XLR/TRS inputs, stereo 1/8" aux
  connection or Bluetooth. Lightweight and Built-Like-A-Tank, Thump210XT is the
  ultimate compact loudspeaker for mobile PA systems, DJs, bars and more.
details: |-
  Thump210XT gives you powerful 1400W Class-D amplification in a compact loudspeaker that is perfect for gigging DJs and bands, venues and more. Packed with incredibly useful features, Thump210XT makes gigs run smoother with feedback elimination and music ducking built right in. And with dual TRS / XLR inputs plus a stereo 1/8” aux input, you can plug in all of your gear without odd cables and adapters.

  Stream music wirelessly to Thump210XT via Bluetooth so you can hear your mix from anywhere on the floor. The Thump Connect 2 app links two speakers wirelessly, and adjusts anything from system EQ and voicing modes to channel levels and application-specific presets.

  Four application-specific voicing modes optimise the speaker for how it is used: Music enhances pre-recorded music, Live is for general sound reinforcement, Club adds low end punch, and Monitor is for use as a floor wedge. An Outdoor Mode restores full sound when the speaker is set up outside.

  Hit the Feedback Eliminator button and the speaker deals with the squeal that comes from getting too close to the microphone. Music Ducking automatically turns channel 2 down whenever you speak into the mic on channel 1.
specs: |-
  - 1400W ultra-efficient Class-D amplifier
  - Frequency Range (-10 dB): 52 Hz – 23 kHz
  - Maximum SPL Peak: 127 dB
  - 10" high-performance woofer
  - 1" compression driver
  - Channel 1 features an XLR/TRS input that accepts mic or line signals
  - Channel 2 features an XLR/TRS line input plus stereo 1/8-inch input
  - Thru output contains audio from both input channels
  - Built-in Feedback Eliminator reduces squeals and out of control rumble
  - Music Ducking mode automatically reduces the level of channel 2 when channel 1 receives signal
  - Standard pole mount
  - Monitor wedge provides optimal angle for use as a floor monitor
  - Universal Power Supply (100-240VAC)
  - Size (H x W x D): 22.4 x 13.0 x 12.8 in / 569 x 330 x 325 mm
  - Bluetooth playback and control
  - 4 application-specific voicing modes: Music, Live, Club and Monitor
  - Indoor and outdoor settings
  - Thump Connect 2 app
  - Link wirelessly with a second Thump210XT speaker
  - Weight: 25.6 lb / 11.6 kg
