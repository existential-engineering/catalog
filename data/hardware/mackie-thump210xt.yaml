description: '10" 1400W Enhanced Powered Loudspeaker with feedback elimination,
  music ducking, and dual TRS/XLR inputs.'
details: |-
  Thump210XT gives you powerful 1400W Class-D amplification in a compact loudspeaker that's perfect for gigging DJs and bands, venues and more.

  Packed with incredibly useful features, Thump210XT makes gigs run smoother with feedback elimination and music ducking built right in.

  And with dual TRS / XLR inputs plus a stereo 1/8" aux input, you can plug in all of your gear without odd cables and adapters.
specs: |-
  - 1400W ultra-efficient Class-D amplifier
  - Frequency Range (-10 dB): 52 Hz - 23 kHz
  - Maximum SPL Peak: 127 dB
  - 10" high-performance woofer, 1" compression driver
  - Size: 22.4 x 13.0 x 12.8 in / 569 x 330 x 325 mm
  - Weight: 25.6 lb / 11.6 kg
  - Universal Power Supply (100-240VAC)
