description: The BF-22 VCF is a dual Hi/Low-pass filter inspired by the
  Sallen-Key filter from the early MS-20.
details: |-
  The BF-22 VCF is a dual Hi/Low-pass filter inspired by the Sallen-Key filter from the early MS-20. It features a dual-channel Sallen-Key architecture offering both high-pass and low-pass operation.

  The module delivers the characteristic dirty screams associated with early MS-20 designs. This filter intentionally inherits the MS-20's noise floor.

  Each channel provides two CV inputs, with the first CV input featuring a dedicated attenuverter for precise modulation control. Resonance is also CV-controllable, enabling expressive timbral shaping.

  A Link switch allows the first channel to be routed into the second channel, expanding the module's filtering possibilities.

  The module is available as a fully assembled unit or as a DIY kit. It is designed and assembled in Barcelona, Spain.
