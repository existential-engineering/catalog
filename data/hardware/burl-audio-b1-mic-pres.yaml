description: "500-series microphone preamplifier featuring proprietary BX3 input
  and BX2 (or BX4 on the B1D) output transformers, all-discrete class-A
  direct-coupled capacitor-free circuit path, and 70 dB of gain."
details: |-
  The B1 and B1D are 500-series microphone preamplifiers from Burl Audio, designed to complement the B2 Bomber ADC and B80 Mothership for multi-channel recording. Both units feature proprietary Burl Audio transformers: the BX3 on the input and either the BX2 nickel (B1) or BX4 all-iron (B1D) on the output. The B1D's all-iron transformer is voiced for a heavier, more aggressive rock character, while the B1 delivers warmth with depth and clarity.

  An all-discrete transistor, class-A, direct-coupled, capacitor-free circuit path is at the core of both units. Gain staging is handled by a stepped gain control combined with an independent output level control.

  The B1 includes a 1/4-inch instrument/DI input on the front panel for direct recording of guitars and basses. A transformer-coupled impedance select is included for optimal performance with ribbon microphones and other low-impedance sources.

  Additional features include a 30 dB pad, phantom power, and phase reverse. A tri-colored level LED provides signal monitoring.
specs: |-
  - Proprietary BURL Audio BX3 input transformer
  - Proprietary BURL Audio BX2 nickel output transformer (B1) or BX4 all-iron (B1D)
  - All-discrete, class-A, direct-coupled signal path — zero capacitors
  - Stepped gain control with independent output level control
  - 70 dB maximum gain
  - Transformer-coupled impedance select for ribbon/low-impedance mics
  - 1/4-inch front panel instrument/DI input
  - 30 dB pad
  - Phantom power (+48V)
  - Phase reverse
  - Tri-colored level LED
  - API 500-series form factor
