description: The Epoch4 represents the pinnacle of Grado's Lineage Series, a
  moving iron phono cartridge utilizing Grado's patented flux-bridger system
  with a sapphire cantilever, nude Shibata diamond, and Brazilian Ebony wood
  body. Available in stereo and mono configurations.
details: |-
  The Epoch4 sits at the top of Grado Labs' Lineage Series, employing the company's patented moving iron flux-bridger system to deliver performance characteristics typical of moving coil designs while retaining the stability and longevity associated with Grado cartridges.

  The cartridge features a sapphire cantilever fitted with a nude Shibata diamond stylus, OCC copper coils with gold plating, and a Brazilian Ebony wood body. Cryogenic treatment is applied during assembly and the internal structure is damped for resonance control. Available in stereo and mono configurations.
specs: |-
  - Output: 1.0mV @ 5 CMV (45 degrees)
  - Frequency Response: 5 Hz – 75 kHz
  - Channel Separation: ~30dB (10–30kHz)
  - Input Load: 10–47k ohms
  - Inductance: 8mH
  - Resistance: 95 ohms
  - Weight: 10.5 grams
  - Recommended Tracking Force: 1.6–1.9 grams
  - Compliance: 20 μm/mN
  - Stylus: Nude Shibata diamond
  - Cantilever: Sapphire
  - Body: Brazilian Ebony wood
  - Internal Wiring: OCC copper with gold plating
  - Cryogenically treated during assembly
