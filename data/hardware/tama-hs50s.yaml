description: Inspired by the vintage cymbal stands of the 1960s, we are proud to
  announce our new extremely lightweight and compact Classic Stands. These
  stands are not merely a rehash of old designs, but a beautiful blend of
  vintage style with the strength, adjustability, and reliability of modern
  construction.
details: |-
  Single Braced Tripod Legs: The snare stand was designed with regular tripod legs, not flat base legs because a snare stand needs flexibility of footprint to avoid interference from a drum pedal or hi-hat stand.

  Classic Style Basket: By simply loosening the T-nut, the length of one of the basket's arms can be adjusted to securely hold a 12" to 14" diameter snare drum (including S.L.P. Studio Maple snare drum). In additton, the other two arms can be folded for easy and compact transport.

  Double Braced Arms: The two double braced basket arms eliminate any wobbling without overly restricting the drum's resonance or sustain.

  Gearless Tilter: The Gearless Tilter securely holds its position using metal to metal contact, as opposed to traditional gears, allowing adjustments to any desired angle.
