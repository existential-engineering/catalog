  across multiple bands in a 1U rackmount format for studio and recording
  applications.
details: |-
  The 180 is dbx's vintage single-channel parametric equalizer, providing sweepable frequency, variable bandwidth (Q), and boost/cut gain controls for each band. Parametric equalization offers more precise tonal shaping than graphic equalizers, allowing the engineer to target specific frequency problems with surgical precision.

  Each band features fully variable frequency selection across a wide range, along with adjustable Q to control the width of the equalization curve from narrow notch filtering to broad shelving-like corrections. This makes the 180 suitable for corrective EQ in recording, as well as creative tonal shaping in mixing.

  An owner's manual (1.44MB) is available for download from the dbx product page. The 180 was used in professional recording studios and broadcast facilities requiring high-quality parametric equalization.
