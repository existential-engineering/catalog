id: NCwvxZiDGACg_YuSMzHMf
name: Series 208i
manufacturer: tascam
primaryCategory: audio-interface
categories:
  - analog
  - digital
  - midi
url: https://tascam.com/us/product/series_208i
description: 20-in/8-out USB audio/MIDI interface with four Ultra HDDA mic
  preamps (EIN −129dBu), dual optical S/MUX expansion ports for up to 16
  additional channels, eight balanced 1/4-inch line outputs, Word Clock I/O via
  BNC, dual independent headphone amplifiers, built-in DSP effects (reverb,
  compressor, 4-band EQ), and 24-bit/192kHz recording and playback.
details: |-
  Desktop USB 2.0 audio/MIDI interface. 4 Ultra HDDA mic preamps via XLR on rear panel (EIN −129dBu, gain 0–58dB, +48V phantom). 4 separate 1/4" TS instrument inputs on front panel (shared channel with XLR — non-combo, separate physical connectors). 8 balanced 1/4" TRS line outputs. 2× TOSLINK optical inputs (ADAT: 8ch at 44.1/48kHz; S/MUX: 4ch at 88.2/96kHz) = up to 16 optical input channels total. Word Clock I/O via BNC (switchable 75Ω termination on input). Dual headphone outputs (45mW+45mW at 32Ω). 8-bus DSP mixer with matrix routing, 4 aux buses, reverb/compressor/4-band EQ. TASCAM Control software. Bundled: Steinberg Cubase LE, IK Multimedia AmpliTube, T-RackS, iZotope Neutron Elements. DC 12V powered.
specs: |-
  - - Mic inputs: 4× XLR; EIN ≤−129dBu; +48V phantom; gain 0–58dB; 1.5kΩ; max +10dBu
  - Instrument inputs: 4× 1/4" TS; 1MΩ+; front panel
  - Line inputs: 4× 1/4" TRS; 10kΩ; max +24dBu
  - Line outputs: 8× 1/4" TRS balanced; 230Ω; nom +4dBu; max +20dBu
  - Headphone: 2× 1/4"; 45mW+45mW @ 32Ω; 16–600Ω working
  - Optical: 2× TOSLINK ADAT/S/MUX; 8ch each at 44.1/48kHz; 4ch at 88.2/96kHz
  - Word Clock: BNC In/Out; 75Ω switchable
  - USB: Type-B, USB 2.0 Hi-Speed
  - MIDI: 5-pin DIN IN + OUT
  - Sample rates: 44.1/48/88.2/96/176.4/192kHz; 16/24-bit
  - S/N: 109dB (mic/line in), 110dB (line out); THD: 0.0016% (mic)
  - Power: DC 12V, 14W (barrel)
  - Dimensions: 296(W) × 65(H) × 160(D) mm; weight: 1.6kg
