details: |-
  Yeti GX is a premium RGB gaming mic powered by LIGHTSYNC and designed specifically for streamers. Combining a custom dynamic capsule with advanced software, this USB microphone rejects noise and key clicks, improves your sound and ensures consistent high-quality audio while you stream.

  A dynamic mic capsule features a supercardioid pickup pattern for polished, broadcast-style sound that your chat will love. The mic is engineered for broadcast-quality sound and designed with a sleek, clean aesthetic to complement a gaming setup.

  Smart Audio Lock keeps levels under control on the device itself: an analog limiter adjusts gain to prevent clipping, while a downward expander reduces ambient background noise. Blue VO!CE software adds filters and effects with anti-clipping protection so you can focus on finding your sound.

  Two separate RGB zones are customizable with LIGHTSYNC for a fully immersive stream or gaming setup. Installing G HUB lets you control the Yeti GX alongside all other Logitech G gear, including gaming mice, keyboards and Litra lights, from one desktop window.

  The mic ships with a removable desktop stand plus an adapter for 5/8-inch and 3/8-inch boom arms and mic stands, and a 2 m USB-C to USB-A cable. A free trial of Streamlabs Ultra is included with purchase.
specs: |-
  - Transducer type: Dynamic
  - Polar pattern: Supercardioid
  - Frequency response: 60Hz - 18.5kHz
  - Sample rate: 24bit / 96KHz
  - Signal-to-noise: 78 dB
  - Max SPL: 135 dB (THD 1% kHz)
  - Connector: USB-C to USB-A (bus powered over USB, no separate power input)
  - Lighting: Dual zone RGB with LIGHTSYNC
  - Mounting: Included stand or any boom arm (required adapter included)
  - Dimensions: 6.69 in (170 mm) height x 3.94 in (100 mm) width x 3.94 in (100 mm) depth
  - Weight: 21.73 oz (616 g)
  - System requirements: A Windows or Mac system with an available USB 1.1 port (or higher)
  - Internet access required for optional software download
  - Warranty: 2-Year Limited Hardware Warranty
  - In the box: USB microphone, removable desktop stand, adapter for 5/8-inch and 3/8-inch boom arms and mic stands, 2 m USB-C to USB-A cable, user documentation, Streamlabs Ultra redeem code
  - Carbon footprint: 16.69 kg CO2e
