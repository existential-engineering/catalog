details: |-
  Yeti GX is a premium RGB gaming mic powered by LIGHTSYNC and designed specifically for streamers. Combining a custom dynamic capsule with advanced software, this USB microphone rejects noise and key clicks, improves your sound and ensures consistent high-quality audio while you stream.

  A dynamic mic capsule features a supercardioid pickup pattern for polished, broadcast-style sound that your chat will love. Engineered for broadcast-quality sound, it is designed with a sleek, clean aesthetic to complement your gaming setup.

  Smart Audio Lock keeps levels consistent without manual riding: an analog limiter adjusts gain to prevent clipping, and a downward expander reduces ambient background noise.

  Blue VO!CE software protects against clipping so you can focus on finding your sound, and two separate RGB zones can be customized with LIGHTSYNC for a fully immersive stream or gaming setup.

  Install G HUB to control your Yeti GX mic and all your Logitech G gear including gaming mice, keyboards, Litra lights and more, all in one easy-to-use desktop window.
