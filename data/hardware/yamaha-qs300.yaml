description: >-
  A mid-range 32-voice polyphonic workstation from 1995 built on Yamaha's AWM2
  synthesis engine, featuring a 16-track sequencer and hundreds of sounds
  including 22 drum kits.
details: |-
  The Yamaha QS300 emerged in 1995 as an accessible alternative to higher-end Yamaha workstations like the W7. It uses the AWM2 synthesis engine to generate its sounds, and the technology developed here was later passed on to the AN1x and CS1x, making it an important link in Yamaha's product lineage.

  Sound design capabilities are comprehensive, with 932 normal voices and 22 drum kits spanning GM and GS compatibility. Three parallel 24-bit effects processors offer over 60 effect types, providing substantial creative flexibility. The 61-key keyboard includes both velocity sensitivity and aftertouch for expressive playing.

  The 16-track onboard sequencer supports real-time and step-time recording at 96 clocks per quarter note, with a capacity of 88,000 notes across 10 songs. Additional features include swing effects, quantize functions, and XG compatibility. Disk drive storage enables saving and loading of both sounds and sequences.

  The QS300 found particular favor among ravers, techno, and trance producers of the mid-1990s. Its combination of a large LCD display, extensive effects, and deep MIDI implementation made it an impressive workstation for its price point.
specs: |-
  - Polyphony: 32 voices
  - Synthesis: AWM2
  - Voices: 932 normal voices, 22 drum kits
  - Effects: 3 parallel 24-bit processors, 60+ effect types
  - Sequencer: 16 tracks, 10 songs, 88,000 notes
  - Resolution: 96 clocks per quarter note
  - Keyboard: 61 keys with velocity and aftertouch
  - Compatibility: GM, GS, XG
  - Control: MIDI In/Out/Thru
