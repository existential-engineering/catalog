description: The BAE 500C is a 500-series FET compressor inspired by classic
  studio FET compressors of the 1960s and '70s. It features three 2520-style
  op-amps, transformer-coupled output, and a feedback-style peak limiter with
  six compression ratio options. Hand-wired in California with premium
  components.
details: |-
  Based on the design of studio staple FET compressors of the '60s and '70s heard on countless hit records, the BAE 500C delivers analog warmth and precise peak control suitable for drums, bass, and vocals.

  The 500C features FET gain reduction with three 2520-style op-amps and a transformer-coupled output for classic analog character. A sidechain high-pass filter (6 dB/octave at 125 Hz) helps prevent low-frequency content from triggering over-compression. A hard bypass switch is included.

  Compression ratios available: 2:1, 4:1, 8:1, 12:1, 20:1, and ABI (All Buttons In). The unit is fully enclosed and hand-wired in California.
specs: |-
  - Max Input Before Clip: +27 dBu
  - Noise: -82 dB (+4 dBu input, 1 kHz, A-weighted, GR off)
  - THD+N: 0.15% (+4 dBu input, 1 kHz, A-weighted, GR off)
  - Frequency Response: +0.3 dB / -0 dB (10–22 kHz)
  - Current Draw: Approx. 120 mA/Rail
  - Gain Reduction: FET
  - Op-amps: Three 2520-style
  - Output: Transformer-coupled
  - SC HPF: 6 dB/octave @ 125 Hz
  - Bypass: Hard bypass
  - Ratios: 2:1, 4:1, 8:1, 12:1, 20:1, ABI
