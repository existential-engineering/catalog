description: Two-in, two-out USB audio interface with a Tone Shaping preamp and
  32-bit, 192 kHz conversion.
details: |-
  Volt 1 Gen 2 is a bus-powered desktop USB audio interface built around a single Tone Shaping preamp with 60 dB of gain. Three character modes, Warmth, Focus and Shine, colour the input in the manner of classic analog mic preamps.

  A rear mic and line combo input pairs with a front-panel Hi-Z instrument input, so a voice and a guitar can be captured at the same time. Switchable 48V phantom power supports condenser microphones, and Clip Protection guards against peaks.

  The interface is class-compliant and USB bus-powered, so it runs from a computer, iPad or iPhone without an external supply. Built-in loopback serves podcasting and streaming, and the unit integrates with the UAD Console app and the LUNA digital audio workstation.
specs: |-
  - 2-in / 2-out USB audio interface
  - 32-bit / 192 kHz conversion
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - One Tone Shaping preamp, 60 dB available gain
  - Warmth, Focus and Shine character modes
  - Switchable 48V phantom power
  - Front-panel Hi-Z instrument input
  - Built-in loopback
  - USB bus-powered, 2.4W typical and 3.6W maximum at 5VDC
  - Class-compliant with Mac, Windows, iPad and iPhone
  - No on/off switch
