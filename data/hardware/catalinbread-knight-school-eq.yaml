details: |-
  The unsung hero of the guitar pedal world, the humble EQ is a powerful and indispensable part of any player's setup from the bedroom to the arena. The Knight School EQ is a simple, easily customizable active three-band tone stack coupled with a whistle-clean hefty boost that can push any amp---even your ultralinear Twin---into gooey breakup. Use it as a standalone device to color your clean tone and push your amp, or stack it behind a dirt box that lacks a sufficient EQ section and watch it roar to life. This device can run at 18 volts, so try powering it that way and sticking it in your amp's FX loop to get some extra toneshaping results.
specs: |-
  - Active three-band tone stack with a clean boost
  - Can run at 18 volts, including in an amp's effects loop
  - Sold as a DIY kit or fully assembled
