name: 8pre-Es
manufacturer: motu
primaryCategory: audio-interface
url: https://motu.com/en-us/products/audio-interfaces/
description: The 8pre-Es is a 52-channel thunderbolt/USB audio interface for
  mac, Windows and iOS featuring eight high-quality mic inputs in a single rack
  space, ess sabre32 dac technology on eight balanced outputs, ultra-low latency
  drivers, dsp mixing/effects and a feature set closely matching MOTU's recent
  ground-breaking 828es.
details: |-
  The 8pre-Es is a 52-channel thunderbolt/USB audio interface for mac, Windows
  and iOS featuring eight high-quality mic inputs in a single rack space, ess
  sabre32 dac technology on eight balanced outputs, ultra-low latency drivers,
  dsp mixing/effects and a feature set closely matching MOTU's recent
  ground-breaking 828es.

  Each mic input delivers -129 dbu ein, 118 db dynamic range and remote control
  for individual gain/pad/48v phantom power. Renowned ess sabre32 dac technology
  delivers 123 db dynamic range on eight balanced, dc-coupled quarter-inch (trs)
  outputs and the same proven, award-winning audio quality as motu's flagship
  1248.

  The 8pre-es delivers ultra-low round-trip latency (rtl) performance as low as
  1.6 ms at 96 khz over thunderbolt (and 1.9 ms over USB). Advanced features
  include word clock I/o, two banks of optical I/o (with one bank switchable to
  stereo toslink), two front-panel headphone jacks, USB audio class compliant
  firmware for connection to ios devices (with a standard camera adapter sold
  separately), new touch console web app control from any mobile device,
  flexible matrix-style routing and splitting, stand alone mixing with Wi-fi
  control and avb-tsn audio networking for system expansion.

  Flexible 48-input digital mixer with 7 stereo aux busses, 3 groups, access to
  32 network inputs, and dsp effects, including reverb, 4-band eq, gate and
  compression. The 8pre-es mixing and effects dsp engine delivers virtually
  unlimited headroom and the utmost in sound quality with modeled vintage
  effects processing including classic reverb, compression modeled after the
  legendary la-2a compressor, and eq modeled after british analog console eqs.

  Connect to your computer with thunderbolt, hi-speed USB 2.0 or avb/tsn
  Ethernet for up to 256 audio channels (128 in and 128 out). Two banks of
  optical I/o connect outboard digital processors, digital mixers or other gear
  with 16 channels of adat at 44.1/48 khz, 8 channels of smux at 88.2/96 khz or
  4 channels of toslink (optical s/pdif) up to 96 khz.
specs: |-
  - 52-channel thunderbolt/USB audio interface
  - Eight high-quality mic inputs
  - Ess sabre32 dac technology
  - Eight balanced outputs
  - Ultra-low latency drivers
  - Dsp mixing/effects
  - -129 dbu ein
  - 118 dB dynamic range (mic inputs)
  - 123 dB dynamic range (dac outputs)
  - Remote control for individual gain/pad/48v phantom power
  - Dc-coupled quarter-inch (TRS) outputs
  - Built-in talkback mic
  - A/b monitor select
  - Mute and sum-to-mono buttons
  - Ultra-low round-trip latency (rtl) 1.6 ms at 96 kHz over thunderbolt
  - 1.9 ms over USB
  - Word clock I/O
  - Two banks of optical I/O
  - Stereo toslink switchable
  - Two front-panel headphone jacks
  - USB audio class compliant firmware
  - iOS device compatibility
  - Touch console web app control
  - Matrix-style routing and splitting
  - Stand-alone mixing with Wi-fi control
  - Avb-tsn audio networking
  - Dual-LCD design
  - Full-color lcds with signal metering
  - 24 inputs and 28 outputs
  - Flexible 48-input digital mixer
  - 7 stereo aux busses
  - 3 groups
  - 32 network inputs access
  - 32-bit floating point processing
  - Reverb dsp effect
  - 4-band EQ
  - Gate dsp effect
  - Compression dsp effect
  - La-2a compressor modeling
  - British analog console EQ modeling
  - Precision digital trim
  - 1 dB increment adjustments
  - Adat 16 channels at 44.1/48 kHz
  - Smux 8 channels at 88.2/96 kHz
  - Toslink 4 channels up to 96 kHz
  - Smpte time code to MIDI time code conversion
  - Direct digital synthesis (dds)
  - Phase lock engine
  - Oscilloscope tool
  - Real-time fft
  - X-y plot
  - Graphic phase analysis
  - Audiodesk workstation software
  - 24-bit recording
  - Sample-accurate editing
  - 32-bit mixing and mastering
  - Mac compatibility
  - Windows compatibility
  - iOS compatibility
  - Thunderbolt 1/2/3 connectivity
  - USB 2/3 connectivity
  - Avb/tsn Ethernet connectivity
  - Up to 256 audio channels
  - 128 in and 128 out channels
  - Class-compliant firmware
  - Industry standard drivers
  - Ipad compatibility with camera connection kit
