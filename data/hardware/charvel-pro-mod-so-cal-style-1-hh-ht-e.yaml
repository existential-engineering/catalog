description: A So-Cal-shaped high-performance electric guitar pairing an alder
  body with a bolt-on maple neck, dual Seymour Duncan Distortion humbuckers, and
  a Charvel HT6 string-through-body hardtail bridge for solid tuning stability
  and versatile modern tone.
details: |-
  The Pro-Mod So-Cal Style 1 HH HT E features a So-Cal-shaped alder body with a satin finish, paired with a bolt-on maple neck reinforced with graphite and finished in hand-rubbed satin urethane. The neck has rolled fingerboard edges and no binding for a comfortable feel.

  An ebony fingerboard with a 12" to 16" compound radius hosts 22 jumbo frets and white dot position inlays with matching white side dots, anchored by a Graph Tech TUSQ XL nut (1.6875" width) and a 25.5" scale length.

  Electronics are an HH configuration: a Seymour Duncan Distortion TB-6 at the bridge and a Seymour Duncan Distortion SH-6N at the neck, controlled by a push/pull coil-split volume, a tone control, and a 3-way blade switch.

  Hardware includes a Charvel HT6 string-through-body hardtail bridge, Charvel sealed die-cast locking tuning machines, knurled flat-top control knobs, a black switch tip, and a 1-ply black pickguard, all in a black finish. The licensed Fender Stratocaster headstock carries a Charvel neck plate, and a heel-mount truss-rod adjustment wheel completes the modern playing platform. A saddle height wrench is included.
