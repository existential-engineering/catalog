description: The Chase Bliss Audio Midibox allows you to connect Chase Bliss Audio (or Empress) pedals to a standard MIDI cable.
details: |-
  MIDIbox allows you to connect Chase Bliss (or Empress) pedals to a standard MIDI cable. It converts the standard 5 pin MIDI cable to a simple TRS patch cable.

  Internal jumpers make any port compatible with Chase Bliss, Empress, or Meris products. The jumpers are ring active (instead of tip active) on the TRS jack.

  The MIDIbox requires external power to operate.
specs: |-
  - Converts standard 5-pin MIDI (DIN) to TRS patch cable format
  - MIDI In, MIDI Thru, and three independently jumper-configurable TRS output jacks
  - Internal jumpers select Chase Bliss, Empress, or Meris compatibility per port
  - Ring active TRS jack configuration
  - Requires external power (9V DC), not bus-powered
