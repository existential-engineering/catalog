description: The MIDIbox converts standard 5-pin DIN MIDI to a TRS patch cable,
  allowing you to connect Chase Bliss, Empress, or Meris pedals to standard MIDI
  controllers.
details: |-
  MIDIbox allows you to connect Chase Bliss (or Empress) pedals to a standard
  MIDI cable. More specifically, it converts the standard 5-pin MIDI cable to
  a simple TRS patch cable.

  Internal jumpers make any port you want compatible with Chase Bliss, Empress,
  or Meris products. The jumpers on this product are 'ring active' (instead of
  'tip active') on the TRS jack so that they interface to the Chase Bliss tap /
  MIDI jack with a common TRS patch cable.

  The MIDIbox requires external power to operate.
specs: |-
  - Converts standard 5-pin DIN MIDI to TRS patch cable
  - Internal jumpers for Chase Bliss, Empress, or Meris compatibility
  - Ring-active TRS configuration (not tip-active)
  - Requires external power
