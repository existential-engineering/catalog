description: The Chase Bliss Audio Midibox allows you to connect Chase Bliss Audio (or Empress) pedals to a standard MIDI cable.
details: |-
  MIDIbox allows you to connect Chase Bliss (or Empress) pedals to a standard MIDI cable. More specifically, it converts the standard 5 pin MIDI cable to a simple TRS patch cable.

  Internal jumpers make any port you want compatible with Chase Bliss, Empress, or Meris products. The jumpers on this product are "ring active" (instead of "tip active") on the TRS jack so that they interface to the Chase Bliss tap / MIDI jack with a common TRS patch cable.

  The MIDIbox requires external power to operate; it will not function if left unpowered.
specs: |-
  - Converts standard 5-pin MIDI cable to a TRS patch cable
  - Internal jumpers select Chase Bliss, Empress, or Meris compatibility
  - "Ring active" (not "tip active") TRS jack configuration
  - Requires external power to operate
