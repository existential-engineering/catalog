description: The SX-50H is a 50-watt all-valve head powered by three ECC83
  preamp valves and two EL34 power valves, delivering rich, dynamic tones with
  authentic warmth. Featuring three footswitchable channels, it offers classic
  tube character with the flexibility for studio sessions, live gigs, or home
  playing.
details: |-
  The SX-50H is a 50-watt all-valve head powered by three ECC83 preamp valves and two EL34 power valves, delivering the warmth and dynamic response that define true valve tone. Three footswitchable channels cover a pristine clean channel with independent EQ plus two overdrive channels that share an EQ section with dedicated gain and volume controls. Onboard digital reverb adds depth, a series effects loop with level control integrates pedals and multi-effects, and a speaker-emulated recording output captures the feel of a classic cabinet direct.
specs: |-
  - Output power: 50 Watts (all-valve)
  - Preamp tubes: 3 x ECC83
  - Power tubes: 2 x EL34
  - Channels: 3 footswitchable (Clean + 2 Overdrives)
  - Clean channel: independent EQ
  - Overdrive channels: shared EQ with dedicated Volume and Gain
  - Reverb: digital
  - Effects loop: series, with level control
  - Recording out: speaker-emulated output
  - Height: 230 mm
  - Width: 570 mm
  - Depth: 245 mm
  - Net weight: 13.5 kg
