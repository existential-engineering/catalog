description: Zenith And Vales is a digital distortion pedal that uses bit
  crushing, sample rate reduction, and aliasing to produce angular fuzz tones
  and heavily pixelated digital artifacts. It has two algorithm modes and two
  aliasing modes for varying degrees of digital destruction.
details: |-
  ZENITH AND VALES

  (Bit Crushing Digital Annihilation)

  Experience the future of sound manipulation with Zenith And Vales. Leave behind traditional silicon and germanium transistors and dive into the world of digital destruction, where binary code is transformed and distorted beyond recognition. Implement bit crushing, sample rate reduction, and aliasing to manipulate your sound source. The Zenith And Vales pedal produces unconventional, angular fuzz tones with intense digital distortion, resulting in wild peaks and valleys. Zenith And Vales has two algorithm modes that alternate between jagged, uneven distorted sounds that are mangled beyond recognition. Additionally, two aliasing modes toggle between light undersampling and heavily pixelated artifacts. Zenith And Vales distinguishes itself from other fuzz pedals by generating sharp, cutting textures and dramatic, exaggerated soundscapes. It is an essential sound-shaping tool, enabling you to create one-of-a-kind sounds and textures. Designed and assembled in Seattle, Washington. O perates on a standard 9Vdc Boss-style power supply (not included).
