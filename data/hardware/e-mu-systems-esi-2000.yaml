description: >-
  A professional 64-voice rack-mount sampler from E-mu with extensive DSP
  editing tools, 6-pole digital filters, and expandable memory up to 128 MB at a
  breakthrough price point.
details: |-
  The ESI-2000 positioned itself as a truly professional sampler at an accessible price, sitting between the ESI-32 and ESI-4000 in E-mu's lineup. With 64-voice polyphony and 4 MB of sampling memory expandable to 128 MB via standard 72-pin SIMMs, it offered substantial capability for its market segment. Sampling operates at 16-bit resolution with 22.05 kHz and 44.1 kHz analog rates, plus 32, 44.1, and 48 kHz digital rates through S/PDIF with 18-bit A/D conversion.

  The onboard DSP suite provides a comprehensive set of sample editing tools including time compression and expansion, parametric EQ, digital tuning, automatic and manual truncation, cross-fade looping, cut, copy, paste, normalization, and automatic correlation for seamless loop points. Ten programmable trigger buttons on the front panel allow instant firing of grooves and samples during performance.

  Four analog outputs can be upgraded to eight plus a stereo effects output and S/PDIF digital I/O with the optional Turbo Option Board. The 64 digital 6-pole filters offer 19 selectable types for extensive tonal shaping. Optional dual stereo effects processors add reverb, delay, chorus, flange, distortion, vibrato, doppler, and Aphex Aural Exciter processing. A built-in SCSI interface provides integration with computers, CD-ROMs, and external storage.
specs: |-
  - Polyphony: 64 voices
  - Sampling: 16-bit at 22.05/44.1 kHz (analog); 32/44.1/48 kHz (S/PDIF)
  - A/D Conversion: 18-bit
  - Memory: 4 MB (expandable to 128 MB via 72-pin SIMMs)
  - Filter: 64 digital 6-pole filters (19 types)
  - Effects: Optional dual stereo processors (reverb, delay, chorus, flange, distortion, vibrato)
  - Outputs: 4 analog (expandable to 8 + stereo effects + S/PDIF)
  - Control: MIDI, SCSI
  - Keyboard: None
releaseDate: "1999"
