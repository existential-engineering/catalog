details: |-
  The JHS Pedals 3 Series is a collection of pedals designed to give you affordability and simplicity without compromising quality. Each 3 Series pedal is made in Kansas City, MO, using high-quality parts, careful quality control, and attention to every detail. Each pedal has three simple controls and one toggle that offer a wide range of sounds, perfect for beginners and professionals alike.

  The 3 Series Bit Crusher was built from scratch to do two things with precision: reduce bit depth and reduce sample rate, with a filter to shape the result. The Crush knob controls bit depth, moving from full 24-bit resolution counterclockwise down to 1-bit clockwise, from unprocessed through grainy and textured, into square-wave aggression and gated digital distortion.

  The Sample Rate knob works counterclockwise from a clean 32.768 kHz down to 2.5 Hz, introducing aliasing and artifacts that range from subtle harmonic shifts to metallic, ring-mod-like chaos and full digital collapse. The Filter knob shapes both — fully clockwise is unfiltered, and turning counterclockwise sweeps the corner frequency and increases filtering.

  The Type toggle selects the filter character: down is a second-order low-pass with no resonant peak inspired by vintage synthesizers like Oberheim, full-bodied and well-suited to bass guitar. Toggle up is a high-pass and low-pass swept in succession, focusing a band of strong mid-range frequencies that evokes the small speaker sound of a handheld game console.

  Under the hood, this pedal applies a zero-hole filter — a theoretical signal processing concept that had never found a practical application until it became part of this circuit.
