description: The SoCo Deluxe is a semi-hollow electric guitar built on a
  Honduran mahogany body with a premium flamed maple carved top and a maple
  center block. It features grained ivoroid binding on the body, fingerboard,
  and peghead, along with Lollar Low Wind Imperial Humbuckers and CTS 500K pots
  with Jupiter Vintage Yellow capacitors. The 15-inch lower bout and 24 7/8"
  scale length offer a balanced, articulate voice with easy upper-fret access.
details: |-
  The SoCo Deluxe is Collings' premium semi-hollow electric, distinguished from the standard SoCo by its grained ivoroid binding on the body, fingerboard, and peghead, plus custom ivoroid knobs. The solid Honduran mahogany body incorporates a maple center block and carries a carved premium flamed maple top finished in high-gloss nitrocellulose lacquer. The mahogany neck features a rosewood fingerboard with mother-of-pearl long dot inlays, a 12" radius, and an extra-long mortise and tenon neck joint for enhanced sustain and stability. Electronics consist of Lollar Low Wind Imperial Humbuckers wired to CTS 500K pots and Jupiter Vintage Yellow capacitors. Hardware is nickel-plated throughout, with Gotoh tuners bearing the Collings logo, a Kluson ABR-1 bridge, and a Kluson stop tailpiece. Ships with a deluxe hardshell case and D'Addario NYXL1149 strings.
specs: |-
  - Body: Semi-hollow with maple center block
  - Body Wood: Honduran mahogany
  - Top: Premium flamed maple (carved)
  - Neck: Honduran mahogany
  - Fingerboard: Rosewood
  - Fingerboard Radius: 12"
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Frets: Medium 18% nickel-silver
  - Inlays: Mother-of-pearl long dots
  - Binding: Grained ivoroid (body, fingerboard, peghead)
  - Pickups: Lollar Low Wind Imperial Humbuckers
  - Controls: CTS 500K pots, Jupiter Vintage Yellow capacitors
  - Tuners: Nickel Gotoh with Collings logo
  - Bridge: Kluson ABR-1 (nickel-plated zinc)
  - Tailpiece: Kluson stop tailpiece
  - Hardware: Nickel-plated
  - Finish: High gloss nitrocellulose lacquer
  - Knobs: Custom grained ivoroid
  - Body Width: 15"
  - Body Length: 19"
  - Body Depth: 1 5/8"
  - Total Length: 40 1/4"
  - Strings: D'Addario NYXL1149 (.011"-.049")
  - Case: Deluxe hardshell case included
