name: Black LTD. Power Drive
manufacturer: mr-black
primaryCategory: pedal
categories:
  - overdrive
url: https://www.mrblackpedals.com/products/black-ltd-power-drive
description: An overdrive that generates its thick, raunchy saturation by
  pushing an actual power amplifier into overdrive. A Jack Deville original
  design, limited run of 40 pieces.
details: |-
  The Black LTD. Power Drive earns its name honestly: it generates thick, raunchy
  saturation by pushing an actual power amplifier into overdrive. The result has a
  thick, round low end, sweet highs and full, forward mids.

  Simple, intuitive Drive and Level controls deliver a wide range of output, from
  light grit to seriously saturated overdrive, while a traditional Tone control
  tunes the top-end response from dark and brooding to crisp and present. At nearly
  all drive settings the pedal cleans up gracefully from the guitar's volume
  control or a softer pick attack, accentuating the feel of connection between
  guitar and amplifier.

  It is hand-built with premium components, true-bypass switching and Mr. Black's
  tough powder-coat finish. Power comes from an internal 9V battery (not included)
  or industry-standard 9VDC pedal power, drawing only about 5mA at 9VDC. Jack
  Deville original design, limited run of 40 pieces.
specs: |-
  - Overdrives an actual power amplifier for saturation
  - Controls: Drive, Level, Tone
  - True-bypass switching
  - Cleans up via guitar volume and pick attack
  - ~5mA current draw at 9VDC
  - 9VDC pedal power or internal 9V battery (not included)
  - Limited run of 40 pieces
  - Jack Deville original design
