description: The dbx DriveRack 4820 is a 4-in/8-out loudspeaker management
  processor for permanent installations, operating at 96 kHz with analog and
  AES/EBU digital I/O, 32-bit floating-point DSP, and a tamper-proof front
  panel. It delivers comprehensive per-channel EQ, dynamics, feedback
  suppression, and crossover processing with HiQnet Ethernet networking.
details: |-
  The dbx DriveRack 4820 provides everything you need between the mixer and power amplifiers in a permanent installation context. Sharing the same 96 kHz DSP engine and 4-in/8-out configuration as the 4800, the 4820 is differentiated by its tamper-proof front panel, making it the preferred choice for venues and installations where unauthorized parameter changes must be prevented.

  Processing includes per-input 31-band graphic and 9-band parametric EQ, up to 682 ms of delay, and two selectable DSP insert blocks. Each output features a 6-band parametric EQ, up to 1365 ms of shared delay, and two selectable insert blocks — supporting noise gate, AutoWarmth, compressor, AGC, peak limiter, sub-harmonic synthesizer, and advanced feedback suppression. A 4-input mixer available at each output and 21 crossover configurations (1×1 through 4×8) with Bessel, Butterworth, and Linkwitz-Riley filter types provide total system design flexibility.

  HiQnet Ethernet networking, RS-232, and optional dbx ZC wall panel controllers provide complete remote control and monitoring. Optional Jensen transformer I/O is available. The 4820 received THX certification for cinema sound applications alongside the 4800.
specs: |-
  - Analog Inputs: 4 channels; female XLR, electronically balanced, RF filtered; >50 kΩ
  - Max Input Level: Selectable: +28 to +14 dBu
  - CMRR: >40 dB typical; >55 dB @ 1 kHz
  - Digital Inputs: 4 AES/EBU channels; transformer-isolated
  - Analog Outputs: 8 channels; male XLR; 30 Ω impedance
  - Max Output Level: Selectable: +24 to +4 dBu
  - Digital Outputs: 8 AES/EBU channels; transformer-isolated
  - RTA Mic Input: 1× female XLR; 10–50 dB gain (10 dB steps)
  - Sample Rate: 96 kHz
  - Word Length: 24-bit
  - Internal Processing: 32-bit floating point
  - A/D Dynamic Range: >114 dB unweighted; 116 dB A-weighted
  - Type IV Dynamic Range: 128 dB with transient material (A-weighted, 22 kHz BW)
  - D/A Dynamic Range: 112 dB unweighted; 115 dB A-weighted
  - THD+Noise: 0.004% typical at +4 dBu, 1 kHz
  - Frequency Response: 20 Hz – 40 kHz, ±0.5 dB
  - Interchannel Crosstalk: <-85 dB at 1 kHz
  - Input Delay: Up to 682 ms
  - Output Delay: Up to 1365 ms (shared)
  - Crossover Configurations: 21 configurations (1×1 through 4×8)
  - Dimensions: 3.5" H × 19" W × 12.15" D
  - Weight: 11 lbs
  - Power: 100–240 V, 50/60 Hz, 45 W
