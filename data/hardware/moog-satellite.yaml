description: >-
  The Moog Satellite is a single-VCO monophonic preset synthesizer from the early 1970s,
  housed in an attractive wood case. Shaped after organ-type synthesizers of its era, it
  offers a 37-note keyboard with preset sounds including brass, reeds, strings, bell, and
  an experimental "lunar sound." Left-hand controls provide modulation, pitch bend, and
  filter sweeps for expressive performance.
details: |-
  The Moog Satellite was designed as an accessible entry point to analog synthesis, offering a simplified preset-based approach rather than the full patch programming of larger Moog instruments. Its compact wooden enclosure and organ-style form factor made it approachable for musicians unfamiliar with synthesizers.

  Preset sounds are selected via flip-switches positioned directly below the keyboard, covering brass, reeds, strings, bell, and a unique "lunar sound" preset. Despite its limited sound palette, the left-hand performance controls for modulation, pitch bend, and filter sweeps allow for expressive playing beyond simple preset recall.

  Notably, composer Vangelis employed the Satellite in his work. While limited by modern standards, the instrument serves primarily as a collector's curiosity and a piece of Moog's history in bringing synthesis to a broader audience during the 1970s.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - LFO: Yes
  - Filter: Yes
  - VCA: Yes
  - Keyboard: 37 keys
  - Memory: None (preset sounds only)
  - Control: CV/Gate
  - Production years: 1973-1979
