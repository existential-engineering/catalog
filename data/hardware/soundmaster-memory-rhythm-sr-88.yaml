description: >-
  A budget-friendly programmable analog drum machine from 1981 featuring four
  sounds and step-based pattern programming, offering an affordable alternative
  to the Boss DR-55 Dr. Rhythm.
details: |-
  The SoundMaster Memory Rhythm SR-88 arrived in 1981 as an accessible entry point into programmable rhythm machines. Competing alongside the Boss DR-55, Clef Master Rhythm, and Amdek Rhythm Machine, it helped democratize drum machine access during an era when professional models commanded much higher prices.

  The SR-88 provides four analog drum voices — kick, snare, closed hi-hat, and cymbal — with a straightforward step-programming workflow. It offers six patterns of two 16-step bars and two patterns of two 12-step bars. Patterns can be played as bar A only, bar B only, A and B consecutively, or in a fill-in mode where bar B plays at the end of a cycle.

  Unlike the DR-55, the SR-88 features a fully programmable hi-hat, though it lacks a dedicated accent control. Some dynamic variation is possible by combining hi-hat and cymbal on the same step. The sounds carry the character of early analog drum machines — less punchy than later models but with genuine analog warmth.

  The SR-88 proved successful enough to go through multiple production runs. Early models featured a blue chassis, while later grey versions added clock and trigger output sockets. A common modification adds a clock input for slaving the unit to external devices. The Cocteau Twins were among its notable users.
specs: |-
  - Polyphony: 4 voices
  - Drum Sounds: Kick, Snare, Closed Hi-Hat, Cymbal
  - Patterns: Six 16-step patterns, two 12-step patterns
  - Programming: Step mode
  - I/O: Clock and trigger outputs (grey models)
  - Song Mode: None (patterns only)
