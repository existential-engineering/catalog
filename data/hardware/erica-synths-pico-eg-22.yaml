description: Erica Synths Pico Envelope Generator brings you a straightforward
  AR/ASR linear or logarithmic envelope generator and LFO in a 3HP module.
details: |-
  Pico Envelope Generator is a straightforward AR/ASR envelope generator and LFO in a 3HP module. AD and ASR modes are selectable, as are short, medium and long envelope times, and linear or logarithmic envelope shapes.

  An AR trigger mode makes the module behave as a triggered AR envelope even when it is fed long gates, so a sustained gate from a sequencer still produces a plucked shape. Switched into LFO mode it becomes a modulation source with variable waveshapes.

  An output signal control LED shows the envelope at a glance. The module is part of the Pico Series, Erica Synths' effort to fit substantial functionality into an affordable 3HP panel. It is 3HP wide and 35mm deep, drawing +22mA and -5mA from the bus.
specs: |-
  - Selectable AD or ASR modes
  - Selectable Short, Medium and Long envelope times
  - AR trigger mode (works as triggered AR envelope even with long gates)
  - Selectable linear or logarithmic envelope shapes
  - LFO mode with variable waveshapes
  - Output signal control LED
  - Power consumption +22mA, -5mA
  - Module width 3HP
  - Module depth 35mm
