description: Loaded with premium features, this Pro-Mod Plus Dinky® DK24 2PT HSS
  EB QM model features a sleek Dinky® body constructed from basswood with a
  quilt maple top, sculpted shredder's cut heel and scalloped lower back bout
  for seamless access to the upper registers.
details: |-
  The Pro-Mod Plus Dinky DK24 HSS 2PT EB QM pairs a basswood Dinky body with a quilt maple top finished in gloss Blue Curaçao. A sculpted shredder's cut heel and scalloped lower back bout deliver unobstructed access to the upper registers.

  The bolt-on caramelized maple neck is graphite-reinforced and shaped to a Speed Neck profile with rolled fingerboard edges and a natural satin finish for fast, friction-free play. A heel-mount truss rod adjustment wheel allows neck-relief tweaks without removing the neck.

  The ebony fingerboard carries a 12" to 16" compound radius, 24 jumbo stainless steel frets, 4mm pearloid dot inlays and Luminlay side dots for low-light visibility. A Graph Tech TUSQ XL nut sits 1.6875" wide at the headstock end of the 25.5" scale.

  Electronics are a versatile HSS layout: a Seymour Duncan Full Shred TB-10 humbucker at the bridge plus direct-mount Seymour Duncan Custom Flat Strat SSL-6 single-coils in the middle and neck (RWRP at the neck). A 5-position blade switch, no-load tone control and 500K EVH Bourns low-friction volume potentiometer cover everything from sparkly single-coil to focused humbucker tones.

  Hardware includes a Wilkinson WVS130-2P recessed tremolo with locking saddles and Wilkinson tremolo arm, Charvel-branded die-cast locking tuners and chrome appointments. The guitar ships strung with .009-.042 nickel-plated steel strings and includes a Charvel Deluxe Gig Bag.
