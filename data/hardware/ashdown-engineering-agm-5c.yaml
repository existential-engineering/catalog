description: The AGM-5C is a 5 watt all-valve guitar combo from Ashdown's Guitar
  Magnifier range, designed by British valve specialist Dave Green and built to
  order at Ashdown HQ in Essex, England. Aimed at players wanting British valve
  tone at home and studio volumes, it offers crisp, warm cleans and heavily
  overdriven touch-sensitive gain. Its 5 watts of all-valve power drive a
  Celestion 12" Creamback G12M-65 speaker, and a Stealth switch drops the output
  to around 1 watt while engaging Active Speaker Compensation to retain depth
  and bass at low volume. A speaker-mute switch activates an internal dummy load
  for silent playing via headphones, alongside a cabinet-emulated Record Out for
  direct recording. Accutronics studio-grade reverb and an FX loop complete the
  feature set.
details: |-
  Built to order from the UK factory. Designed by renowned British valve guru Dave Green, the AGM (Ashdown Guitar Magnifier) range has been carefully considered, designed and constructed for the modern world where portability, low power options and real valve tones are paramount. Each and every AGM is designed, engineered and lovingly constructed using only the finest hand selected components at the Ashdown HQ in Essex, England. The AGM-5C is designed for genuine tonal purists wanting luscious British valve driven guitar tones but at home/studio friendly volume levels combined with a host of modern player friendly features yet dripping in vintage tonality. The AGM-5C offers crisp and clear clean tones with real warmth, depth and sparkle, but dial up the gain and you will soon be in hard rock heaven with heavily overdriven touch sensitive sounds available. The AGM-5C produces 5 watts of all valve power which is delivered via a carefully chosen Celestion 12" Creamback G12M-65 premium speaker. However, the Stealth switch allows you to reduce the output to around 1 watt and also activates the ASC (Active Speaker Compensation) which helps to retain the tonal depth and bass response even at very low volume levels. For silent late night sessions the AGM-5C features a speaker mute switch which cuts power to the speaker whilst activating the internal dummy load, leaving the player safe to enjoy the amplifier silently via headphones as well as the cabinet emulated Record Out feature for direct recording. Accutronics studio grade reverb provides real depth to clean tones when required, and an FX Loop allows the player's favourite modulation/time based pedals to be hooked up straight to the power amp for optimal sonic clarity.
specs: |-
  - 5 watt all-valve 1 x 12" combo
  - Celestion 12" Creamback G12M-65 speaker
  - Stealth switch: ~1 watt output with Active Speaker Compensation (ASC)
  - Speaker mute switch with internal dummy load
  - Cabinet-emulated Record Out
  - Headphone output for silent playing
  - Accutronics studio-grade reverb
  - FX loop into the power amp
  - Built to order at Ashdown HQ in Essex, UK
