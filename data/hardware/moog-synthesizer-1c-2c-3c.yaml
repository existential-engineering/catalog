description: >-
  The Moog Synthesizer 1c/2c/3c are landmark modular analog synthesizers produced by Moog
  Music from 1964 to 1981. These configurable systems use patch cables to connect
  dedicated function modules housed in solid walnut cabinets for creating, shaping, and
  manipulating electronic sounds. The three pre-configured models offered increasing
  complexity, from the 1c for independent composers to the 3c for commercial studios.
details: |-
  Robert Moog is considered the father of analog synthesizers, not because he was the first to build such instruments, but because his brilliant circuit designs sounded amazing. The first prototype appeared in 1964, with orders accepted by 1965 and commercial availability by 1967. Moog Music continued to build and sell these analog music machines to universities, studios, and musicians throughout the sixties and seventies.

  The modular approach allowed full customization. As imposing as these systems may look, they are merely solid walnut cabinets housing smaller dedicated function modules which, when interconnected by patch cables, can be used to create, shape, and manipulate electronic sounds. Three pre-configured models were offered: the 1c (1967-73) provided limited complexity designed to satisfy the requirements of independent composers, the 2c (1967-73) offered moderately complex facilities suitable for use in electronic music courses or studios, and the 3c (1967-73) was a large and versatile system suitable for commercial studios.

  The 24 dB/oct lowpass filter, the 904A, became legendary. To this day, no one has come close to improving upon the original Moog filter and its patented ladder design. Notable users include Keith Emerson, Hans Zimmer, Mark Isham, Vangelis, John Cage, and famously Walter/Wendy Carlos, whose Switched on Bach album in 1968 brought the Moog synthesizer into the mainstream.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 3-10 per system, 0.1 Hz to 15 KHz range
  - Waveforms: Sine, triangle, rectangular (pulse), sawtooth
  - LFO: One VCO usable as LFO (0.1-15 KHz)
  - Filter: 24 dB/oct lowpass VCF; highpass VCF (20 Hz-30 KHz); parametric EQ
  - VCA: 1-5 modules per system
  - Envelope: ADSR envelope generators (2ms-10 seconds)
  - Effects: Spring reverb
  - Sequencer: 3 parts, 8 steps
  - Keyboard: 49-key duophonic or 61-key monophonic
  - Controllers: Ribbon controller, foot pedal, X-Y joystick
  - Memory: None
  - Control: CV/Gate (S-trigger logic)
