description: >-
  One of the first truly affordable programmable polysynths, the Korg PolySix delivers warm analog
  textures, lush built-in effects, and a straightforward interface that made serious synthesis
  accessible to working musicians in 1981.
details: |-
  Released in 1981 alongside the Roland Juno-6, the Korg PolySix represented a turning point for synthesizer accessibility. Before these instruments arrived, programmable polyphonic synthesizers were largely confined to professional studios and well-funded touring acts. The PolySix brought six voices of genuine analog warmth, 32 patch memories, and an inviting control surface to a price point that ordinary musicians could actually afford.

  The PolySix's sonic character is distinctly its own — warmer and brassier than its Roland contemporaries, with a softer edge that lends itself beautifully to pads, strings, and melodic leads. Each of the six voices features a single VCO generating sawtooth, pulse width, and PWM waveforms, bolstered by a sub-oscillator that adds body and low-end weight. The self-oscillating lowpass filter is musical across its entire range, from subtle tonal shaping to singing resonant peaks.

  The built-in effects section is a standout feature that punches well above what the price tag might suggest. The chorus mode produces lush, wide tones reminiscent of far more expensive instruments, while the ensemble effect generates instant Mellotron-like string washes that remain a favorite among ambient and synthwave producers. A phaser rounds out the effects options, adding motion and dimension to any patch.

  Beyond its sound engine, the PolySix includes a capable arpeggiator with up, down, and up-down patterns plus a latch mode, as well as a chord memory function for playing complex voicings from a single key. A unison mode stacks all six oscillators for massive monophonic leads. Artists including Tears for Fears, Keith Emerson, and Kitaro all put the PolySix to memorable use, and Korg later honored its legacy through the Korg Legacy Collection software recreation.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 1 VCO per voice (sawtooth, pulse width, PWM) plus 1 sub-oscillator per voice
  - LFO: 1, assignable to VCA, VCF, or VCO
  - Filter: Lowpass, self-oscillating at high resonance, with ADSR
  - VCA: Shared ADSR from filter envelope or gate mode
  - Effects: Built-in chorus, phaser, and ensemble
  - Keyboard: 61 keys
  - Memory: 32 patches
  - Arpeggiator: Up, down, up-down, and latch modes
  - Control: Chord memory, arpeggiator sync, CV filter cutoff input
  - Date Produced: 1981
releaseDate: "1981"
