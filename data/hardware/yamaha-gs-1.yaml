description: >-
  The Yamaha GS-1 was one of the first commercially produced synthesizers to utilize
  frequency modulation (FM) synthesis, released in the early 1980s. Designed to bring the
  sophistication of digital synthesis to musicians without requiring computer expertise,
  it featured 16-voice polyphony with eight operators per voice. It served as a precursor
  to the landmark DX7 synthesizer, though fewer than 100 units were sold due to its
  premium price.
details: |-
  The GS-1 emerged during the early 1980s as Yamaha's attempt to bring FM synthesis to the mainstream market. The instrument was created to provide the sophistication of digital synthesis to music-minded individuals without requiring computer expertise, resulting in a relatively straightforward interface for its time.

  The synthesizer featured 16-voice polyphony with eight operators per voice, though users could not select different algorithms. It included eight envelope generator/VCA pairs and one LFO, but notably lacked voltage-controlled filters. Performance controls consisted of velocity and aftertouch-sensitive keys, plus vibrato, tremolo, and damper pedals.

  The GS-1 utilized a magnetic card system for patch storage and loading. Despite its innovative FM technology, the synthesizer struggled commercially at its premium price point. Yamaha sold fewer than 100 units before releasing the more affordable GS2. Today, working examples remain expensive and are primarily collector's items.
specs: |-
  - 16-voice polyphony with 8 operators per voice
  - 2-part multitimbral
  - Digital FM synthesis
  - 1 LFO
  - 8 envelope generator/VCA pairs
  - Chorus effect
  - 88-key velocity and aftertouch-sensitive keyboard
  - 16 presets
  - Magnetic card library system for voice storage
  - Vibrato, tremolo, and damper pedals
