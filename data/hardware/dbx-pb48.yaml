details: |-
  The dbx PB48 is a 48-point patch bay featuring 1/4" jacks on both front and rear panels. It provides reliable signal routing and management for studio, tour, and portable audio systems.

  The PB48 is available in half-normalled and de-normalled configurations to suit different routing workflow requirements. It provides clear access to mixer and studio gear connections, reduces wear on device jacks by keeping frequently-changed connections at the patch bay, and enables quick signal rerouting without disturbing rear-panel connections.

  With 48 points on the front and 48 corresponding points on the rear, the PB48 accommodates a full rack of audio equipment routing needs in a single 1U rack space.
specs: |-
  - Jack Count: 48 points
  - Jack Type: 1/4"
  - Front Panel Points: 48
  - Rear Panel Points: 48
  - Configurations: Half-normalled or de-normalled
