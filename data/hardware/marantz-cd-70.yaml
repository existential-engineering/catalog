description: Combining decades of innovative, award-winning disc-player design
  with refined, modern mastery, the CD 70 is engineered for the contemporary
  music collector.
details: |-
  CD 70 pairs award-winning disc-player design with a new high-performance DAC, aimed at the contemporary music collector.

  The upgraded DAC is designed to extract more detail, clarity and depth from every recording, backed by a DAC master clock design, a toroidal power transformer, a symmetric circuit layout and an extra chassis strengthening plate.

  High-resolution playback via the front USB-A input supports FLAC, WAV, AIFF, ALAC and DSD, extending performance beyond physical discs.

  A fully discrete headphone amplifier built with HDAM-SA2 buffer circuitry provides selectable gain and headphone volume control.

  Two digital filters are selectable, a VFD display with dimmer and off is fitted, and the unit ships in Black with a metal front panel and the RC006PMCD remote.
specs: |-
  - CD compatibility: CD / CD-R/RW / WMA / MP3 (no SA-CD, no AAC)
  - Analogue out (Cinch): 2ch, gold plated
  - Digital optical in / out: 0 / 1
  - Digital coaxial in / out: 0 / 1
  - USB Audio (front): Yes
  - USB-A: FLAC / WAV / AIFF / ALAC / DSD
  - D-Bus: Yes
  - Headphone out with headphone volume control
  - HDAM version: HDAM / HDAM SA2
  - Power transformer: Toroidal
  - Headphone: buffer (HDAM-SA2)
  - Digital filter: selectable (CD)
  - Frequency response: 2 Hz - 20 kHz
  - Dynamic range: 100 dB
  - Signal to noise ratio: 110 dB
  - Total harmonic distortion: 0.0016%
  - Channel separation: 98 dB
  - Display: VFD with dimmer and off
  - Program play: 25 tracks
  - repeat and random play
  - Remote control: RC006PMCD
  - Power consumption: 32W, standby 0.3W, auto power off, detachable power cable
  - Maximum dimensions (W x D x H): 17.40 x 13.82 x 4.29 in
  - Weight: 14.3 lbs
  - Available colors: Black
