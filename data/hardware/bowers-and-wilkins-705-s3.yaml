description: 705 S3's Carbon Dome tweeter is housed in a Solid Body
  Tweeter-on-Top enclosure evolved from the latest generation of 800 Series
  Diamond. That joins a new and subtly curved baffle endowed with an all-new
  'pod' housing for its Continuum Cone bass/midrange driver.
details: |-
  705 S3 is the flagship stand-mount loudspeaker in the Bowers & Wilkins 700 Series, a two-way vented-box system pairing a 25mm Decoupled Carbon Dome high-frequency unit with a 165mm Continuum cone bass and midrange driver. Bowers & Wilkins positions it as an uncompromising two-way speaker that reveals subtle nuances others miss, and it is the only stand-mount in the range to carry the Solid Body Tweeter-on-Top housing borrowed from the 800 Series Diamond.

  That housing is the latest generation of the company's Tweeter-on-Top design: a more elongated form with a longer tube-loading system for a freer, more open high-frequency sound, carefully decoupled and milled from a single solid block of aluminium to resist resonance. The Carbon Dome tweeter inside it is purpose-built for the 700 Series and raises the breakup threshold to 47kHz. The Continuum cone's composite construction avoids the abrupt transitions in behaviour that impair a conventional drive unit, and the driver sits in an all-new pod housing on a subtly curved baffle.

  The speaker is entirely passive and carries no amplification, no mains inlet and no line-level input. The 700 Series 3 manual states that there are two linked pairs of terminals on the back of the speaker, labelled HF and LF. For conventional single-wire connection the terminal links stay in place as delivered and only one pair is connected to the amplifier; for bi-wiring or bi-amplification the links are removed and each pair is connected independently. The terminals accept 4mm banana plugs, 6mm and 8mm spades, or bare wire up to 4mm diameter, with the 4mm holes blocked by plastic pins on delivery to satisfy European CENELEC safety rules.

  Installation is stand-mount rather than floor-standing. Stands are not included. The manual states that the 705 S3, 706 S3 and 707 S3 are primarily designed to be mounted on the dedicated FS-700 S3 floor stand but may be placed on a shelf, noting that a shelf offers less flexibility to optimise performance and that the four self-adhesive rubber feet should be fitted to the underside if a shelf is used. In either case the tweeter should sit at about ear height at the usual listening position. For stereo the manual suggests 1.5m to 3m between speakers in an equilateral triangle with the listening position, at least 0.5m from the back and side walls, and for home theatre use within roughly 0.5m of the sides of the screen. The drive units create stray magnetic fields, so magnetically sensitive items should be kept 0.5m away.

  Low-frequency output can be tuned with the supplied two-piece foam port plugs, using either the outer piece alone for gentler attenuation or the complete assembly, which is the manual's specific recommendation for shelf placement. Performance changes during the initial listening period: the manual asks for up to a week for temperature effects to stabilise and about 15 hours of average use for the drive unit suspensions and damping compounds to reach their intended mechanical characteristics.
specs: |-
  - Description: 2-way vented-box system
  - Drive units: 1x 25mm (1 in) Decoupled Carbon Dome high-frequency, 1x 165mm (6.5 in) Continuum cone bass / midrange
  - Frequency range: 45Hz to 33kHz
  - Frequency response: 50Hz to 28kHz +/-3dB
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis)
  - Nominal impedance: 8 ohms (minimum 3.7 ohms)
  - Recommended amplifier power: 30W to 120W into 8 ohms on unclipped programme
  - Sensitivity: 88dB spl (2.83Vrms, 1m)
  - Max recommended cable impedance: 0.1 ohms
  - Technical features: Decoupled Carbon Dome tweeter, Solid Body Tweeter-on-Top, Continuum cone bass / midrange, Flowport
  - Passive: no on-board amplification and no mains connection. Two linked pairs of HF and LF terminals, single-wire as delivered, bi-wire or bi-amp with the links removed
  - Terminals accept 4mm banana plugs, 6mm and 8mm (1/4 in and 5/16 in) spades, or bare wire up to 4mm (5/32 in) diameter
  - Dimensions: height 345mm (13.6 in) cabinet only, 413mm (16.3 in) including tweeter; width 192mm (7.6 in) cabinet only; depth 297mm (11.7 in) cabinet only, 337mm (13.3 in) including grille and terminals
  - Net weight: 9.58kg (21.1lb)
  - Cabinet finishes: Gloss Black, Satin White, Mocha
  - Grille finishes: Black, Grey (Satin White only)
  - Stand-mount: designed for the FS-700 S3 floor stand or shelf placement, stands not included. Supplied with grille, two-piece foam plugs and self-adhesive rubber feet
