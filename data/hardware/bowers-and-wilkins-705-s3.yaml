description: High-performance 700 Series stand-mount speakers featuring a solid
  body Tweeter-on-Top design borrowed from the 800 Series Diamond.
details: |-
  The 705 S3 is a two-way stand-mount loudspeaker in the third-generation Bowers & Wilkins 700 Series. It features a solid body Tweeter-on-Top enclosure, a design borrowed from the flagship 800 Series Diamond, that isolates the high-frequency driver from cabinet vibration.

  The high-frequency driver is a 25mm Decoupled Carbon Dome tweeter, paired with a 165mm Continuum cone bass/midrange driver. Low-frequency tuning is handled by Bowers & Wilkins' Flowport technology to reduce port noise.

  The cabinet is a 2-way vented-box design available in Gloss Black, Satin White, and Mocha finishes. Nominal impedance is 8 ohms (3.7 ohm minimum) with a sensitivity of 88dB SPL and a recommended amplifier power range of 30W to 120W into 8 ohms. Bowers & Wilkins includes a 5-year warranty from the date of purchase.
specs: |-
  - 2-way vented-box system
  - High-frequency driver: 1x 25mm Decoupled Carbon Dome
  - Bass/midrange driver: 1x 165mm Continuum cone
  - Frequency range: 45Hz - 33kHz
  - Frequency response: 50Hz - 28kHz (±3dB)
  - Sensitivity: 88dB SPL (2.83Vrms, 1m)
  - Nominal impedance: 8Ω (minimum 3.7Ω)
  - Recommended amplifier power: 30W - 120W into 8Ω
  - Harmonic distortion: <1% (100Hz - 22kHz), <0.5% (150Hz - 20kHz)
  - Max recommended cable impedance: 0.1Ω
  - Height: 413mm (with tweeter)
  - Width: 192mm
  - Depth: 337mm (with grille/terminals)
  - Net weight: 9.58kg (21.1 lb)
  - Available finishes: Gloss Black, Satin White, Mocha
  - Warranty: 5 years from date of purchase
