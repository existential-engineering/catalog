description: The 854ce is an 800 Series 12-string Grand Auditorium
  acoustic-electric, pairing Indian rosewood back and sides with a solid Sitka
  spruce top and V-Class bracing — featuring a radius rosewood armrest for
  enhanced playing comfort and ES2 electronics.
details: |-
  The 854ce is a 12-string acoustic-electric from Taylor's flagship 800 Series featuring a Grand Auditorium body with Venetian cutaway. Solid Sitka spruce on top and Indian rosewood back and sides deliver balanced tone with warm lows, pristine trebles, and robust overtone response. V-Class bracing enhances volume, sustain, and intonation consistency.

  A built-in radius Indian rosewood armrest reduces forearm fatigue during extended playing sessions. The Neo-Tropical Mahogany neck with 1-7/8" nut width and West African Crelicam Ebony fretboard makes 12-string fretting approachable.

  Expression System 2 behind-the-saddle electronics provide natural amplified tone. Premium appointments include smoked nickel tuners, green abalone rosette, Mother-of-Pearl Element inlays, pale non-figured maple binding, and Crelicam Ebony bridge pins with green abalone dots. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Auditorium
  - Configuration: 12-string
  - Top: Sitka Spruce (solid, gloss)
  - Back/sides: Indian Rosewood (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany (satin)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Bridge pins: West African Crelicam Ebony with Green Abalone Dots
  - Body binding: Pale Non-Figured Maple
  - Armrest: Radius Indian Rosewood
  - Pickguard: Indian Rosewood
  - Rosette: Green Abalone Single Ring
  - Inlays: Mother-of-Pearl Element
  - Scale length: 25-1/2"
  - Nut width: 1-7/8"
  - Tuners: Taylor Smoked Nickel with Smoked Nickel Buttons
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.010-.047)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
