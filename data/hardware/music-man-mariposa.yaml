description: >-
  Developed with Mars Volta guitarist Omar Rodríguez-López, the Mariposa pairs
  an offset okoume body with custom Music Man humbuckers, a laser-etched
  pickguard with ornate floral design, and a Tethered Tone Circuit for natural
  high-end variation between dual volume pots.
details: |-
  The Mariposa delivers a perfect fusion of artistry and performance. Developed in collaboration with Omar Rodríguez-López — composer and guitarist for The Mars Volta and At the Drive-In — this offset, lightweight okoume body guitar features a roasted maple neck and ebony fingerboard with pearlescent Atlanté block inlays.

  Custom-wound Music Man humbucking pickups offer independent volume controls and a 3-way pickup selector. The unique Tethered Tone Circuit creates passive interaction between the dual volume pots, producing natural high-end variation as the controls are adjusted.

  The custom-designed offset angular body provides a unique appearance while retaining balance and comfort. A laser-etched pickguard with ornate floral design is coordinated to each finish.

  Available in Deluxe finishes with gold hardware — Imperial White, Galaxy Pearl, Sahara Sunset — and a Standard Dorado Green with chrome hardware. Left-handed models are available.
specs: |-
  - Body wood: Okoume
  - Body finish: High gloss polyester
  - Body dimensions: 11-7/8" wide, 1-5/8" thick, 37-1/2" long
  - Colors: Sahara Sunset, Galaxy Pearl, Imperial White, Dorado Green
  - Neck wood: Select roasted maple
  - Neck finish: Gunstock oil and hand-rubbed wax
  - Neck width: 1-5/8" at nut, 2-1/4" at last fret
  - Neck radius: 10"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Ebony with Atlanté block inlays
  - Frets: 22 high-profile, medium-width stainless steel
  - Scale length: 25-1/2"
  - Pickups: HH — 2 Music Man custom humbucking (gold or chrome covers)
  - Controls: 500k volume for each pickup
  - Switching: 3-way toggle pickup selector
  - Bridge: Music Man Modern tremolo with chevron cover and vintage bent steel saddles
  - Tuners: Schaller M6-IND locking (gold or chrome)
  - Pickguard options: Black, White, Torrid Maroon, Turbulent Green
  - Hardware: Gold (Deluxe) or chrome (Standard)
  - Strings: 10p-13p-17p-26-36-46 (RPS 10 Slinkys #2240)
