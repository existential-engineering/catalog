name: B22 ORCA
manufacturer: burl-audio
primaryCategory: outboard
categories:
  - rack-mount
url: "https://www.burlaudio.com/products/b22-orca"
description: "Control room monitor daughter card for the B16 and B80 Mothership,
  featuring 4 DAC channels with all-class-A BOPA14 discrete circuitry,
  switchable BX5 output transformers, 2 stereo speaker outputs, and a stereo
  headphone output."
details: |-
  The B22 ORCA Control Room Monitor is a daughter card designed for the B16 and B80 Mothership systems, building on the sonic reputation of the B26 ORCA. It utilizes the same analog, all-discrete circuit path philosophy as other Burl Audio products, with an emphasis on sonic transparency and 3D stereo imaging.

  Featuring BURL NextGen BOPA14 op-amps, the B22 delivers tight bass and high definition throughout the audio spectrum. The B22 ORCA employs 4 DAC channels: the first two are mix/mastering grade DAC channels with switchable BX5 output transformers, and the second two feed the main monitor section with two stereo speaker outputs and one stereo headphone output.

  Connectivity is handled via 8-channel DB25 (Tascam style), with an external meter output and Alps audiophile attenuator (or optional stepped 0.1% matched resistor attenuator).
specs: |-
  - 4-channel DAC
  - 8-channel DB25 connectivity (Tascam style)
  - All class-A, NextGen Analog BOPA14 or BOPA11 op-amps
  - 2 DAC channels with switchable BX5 output transformer
  - 2 DAC channels for monitoring (2 stereo speaker outputs, 1 stereo headphone output)
  - External meter output
  - Alps audiophile attenuator (standard)
  - Stepped 0.1% matched resistor attenuator (optional)
  - Avid delay matching
  - DAC filter select
  - Frequency response at 48 kHz: 10 Hz to 22 kHz, +/- 0.1 dB
  - 115 dB Dynamic Range
  - -96 dB THD+N, full scale output = +22 dBU
  - Made in USA
