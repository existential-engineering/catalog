description: Contemporary version of the synthesizer.
details: |-
  Erica Synths originated as a company developing DIY kits for Eurorack modular synthesizers, and alongside the mki x es.EDU DIY series it set out to develop a contemporary, DIY-friendly and extended version of the Elektor Formant synthesizer, originally published as a DIY kit in Elektor Magazine during the late 70s.

  In collaboration with Harald Antes of haraldswerk.de, a modular system was developed from the original Elektor Formant designs, with several modules added to take its functionality to the next level. The unique internal wiring of the modules was kept, so the system can also be played without patching, exactly as described in the original Elektor Formant manuals. The result is a monster system of 27 modules capable of original Elektor Formant sounds and much more.

  All modules are designed to be DIY friendly. They are just 35 mm deep and need no wiring beyond the original wiring between modules. Most modules are quite complex, so the system is intended for advanced DIYers with extensive experience in DIY electronics and the tools (multimeter, oscilloscope) needed for calibration and troubleshooting.

  Two kit options exist. The full kit includes all components to complete the system. The partial kit includes the enclosure, PSU, PCBs, panels, potentiometers, switches, jack sockets and custom parts to complete the modules, leaving the builder to source the generally available semiconductors and passive components from most retailers.
specs: |-
  - 27 modules
  - SEQ sequencer (new module, not found in the original system)
  - 3 x VCO
  - 12 dB/Oct VCF
  - 24 dB/Oct VCF
  - RFM formant filter module
  - FX module based on the DSP found on Erica Synths FX modules
  - COM updated output module
  - INTERFACE MIDI-CV module
  - EF/RING envelope follower and ringmodulator module
  - NOISE noise and random voltage generators
  - DIVIDER frequency divider module
  - WAVEPROC waveshaper
  - 2 x VCA
  - PHASER, an 8-stage optical phaser
  - 2 x MIXER
  - DISPATCH buffered gate and CV multiple
  - LFO
  - 2 x VC LFO
  - 2 x ADSR
  - ADSR CONTROLLER
  - DUAL S&H
  - PSU distribution board and external 12V@3.3A PSU
  - Enclosure with rails and threaded inserts
  - Modules are 35 mm deep
