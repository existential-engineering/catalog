name: TH616
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/th616/
description: Made in Japan limited edition open-back premium headphones released
  for Fostex's 50th anniversary, carved from solid black walnut in a design
  reminiscent of traditional Japanese woodwork. The BioDyna diaphragm driver
  uses ultra-fine bio-cellulose fiber material.
details: |-
  This product is a limited-quantity model released to commemorate the 50th anniversary of Fostex. It is made of solid black walnut, a high-grade wood, carved in a design reminiscent of traditional Japanese woodwork, and finished in an open-type housing. The headphones are carefully assembled one by one at a factory in Japan. At VGP 2024 Winter, one of the largest audiovisual awards in Japan, the TH616 won the Gold Award in the category of open-type overhead headphones between 100,000 yen and 150,000 yen in the Lifestyle Subcommittee.

  The housing is machined from solid black walnut and the open-type aperture is designed to resemble a glow of light shining through gaps in trees. This machined design reduces weight and ensures rigidity, and also avoids uniformity of the housing surface, reducing unwanted resonance by suppressing modal vibrations. All apertures are of different areas to suppress resonance at specific frequencies.

  The BioDyna diaphragm is made of ultra-fine bio-cellulose fiber material. Bio-cellulose fiber is blended with other fibers and materials under optimal conditions to realize low specific gravity, high Young's modulus and high internal loss. The free edge with its good linearity faithfully reproduces low mid-range frequencies with large amplitude.

  The magnetic circuit is equipped with a 50 mm driver unit with a magnetic flux density of 1 Tesla, providing low distortion and a wide dynamic range. Aluminum is used extensively for mechanical parts, and high specific gravity resin is used for the baffle plate to reduce resonance noise.

  The terminals on the cable side and the contact points on the headphone body side are rhodium-plated for hardness, abrasion resistance and corrosion resistance. The ET-H3.0N7BL replacement balanced cable, sold separately, can be used for balanced connections. High-performance pure copper HiFC cable is used for clear expression across the bandwidth, and the ear pads use soft high-grade artificial leather with a low-resilience cushion.
specs: |-
  - Type: Open-back dynamic
  - Driver: 50 mm neodymium magnet / BioDyna diaphragm
  - Impedance: 25 ohm
  - Sensitivity: 96 dB/mW
  - Maximum input: 1,800 mW
  - Frequency response: 5 to 45,000 Hz
  - Weight: Approx. 370 g (excluding cable)
  - Cable: 3 m Y-type, detachable connector terminal 2-pin, rhodium plated
  - Detachable terminal: 2-pin (rhodium-plated with gold-plated base)
  - Plug: 6.3 mm gold-plated stereo standard plug
  - Accessories: Leather pouch, instruction manual and warranty card
  - Optional balanced cable: ET-H3.0N7BL
  - Housing: Solid black walnut
  - Complies with the European RoHS Directive
  - Limited-quantity 50th anniversary model, assembled in Japan
  - Passive wired headphones, no power supply required
  - Series: TH Premium Series
