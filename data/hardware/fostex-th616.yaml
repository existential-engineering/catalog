description: Limited-edition open-back dynamic headphones released to
  commemorate the 50th anniversary of Fostex. Made of solid black walnut carved
  in a design reminiscent of traditional Japanese woodwork, with an open-type
  housing for solid acoustic performance. Carefully assembled one by one at a
  factory in Japan, combining a Japanese taste with excellent acoustic
  construction.
details: |-
  Form factor: Over-ear, open-back

  Housing: Solid black walnut wood

  Diaphragm: BioDyna ultra-fine bio-cellulose fiber

  Magnet: Neodymium, 1 Tesla magnetic flux density

  Mechanical components: Aluminum

  Ear pads: Soft artificial leather

  Cable: High-performance pure copper HiFC, 3m Y-type, detachable

  Made in: Japan

  Limited edition: 50th anniversary commemorative model
releaseDate: 2024-06-15
