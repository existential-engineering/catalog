url: https://lexiconpro.com/en-US/products/960llarc2
description: Configurable stereo/surround reverb processor and flying-fader
  LARC2 remote for music, broadcast, film, post-production and live sound, built
  around Lexicon's 3DPM 24-bit/96kHz algorithms.
details: |-
  For nearly thirty years, the world's most accomplished engineers and producers have relied upon Lexicon for their most critical music and sound productions. To satisfy these discriminating media professionals and to meet the new demands of today's increasingly complex sound content, Lexicon introduces a new generation of digital audio signal processing technology with the new 960L Multi-Channel Digital Effects System.

  The 960L is a configurable stereo and surround reverb processor designed for music, broadcast, film, post-production and live sound applications. It uses Lexicon's 3DPM (3D Perceptual Modeling) algorithms running at 24-bit/96kHz to deliver the realistic acoustic spaces the company is known for.

  The LARC2 (Lexicon Alphanumeric Remote Controller) provides hands-on control of the mainframe via eight 60mm motorized, touch-sensitive flying faders, a two-axis joystick for surround panning, 29 dedicated function keys (12 backlit) and 8 soft keys, and a 640x240 color LCD.
specs: |-
  - 24-bit/96kHz processing
  - Lexicon 3DPM algorithms
  - Configurable stereo and surround reverb processor
  - Sample rates: 44.1 / 48 / 88.2 / 96 kHz
  - More than 200 factory programs
  - Storage for up to 1,000 user registers
  - Frequency response: 20 Hz - 20 kHz (±1 dB @ 48 kHz); 20 Hz - 40 kHz (±1 dB @ 96 kHz)
  - Dynamic range: >110 dB (A/D and D/A); >107 dB (A/A)
  - THD: <0.002%
  - Eight XLR balanced analog inputs and eight XLR balanced analog outputs (50 kΩ, +24 dBu)
  - Four stereo pairs of 24-bit/96kHz AES/EBU digital I/O on XLR
  - BNC Word Clock input and output with loopthru
  - MIDI In / Out / Thru on 5-pin DIN
  - LARC2 remote with eight 60 mm motorized, touch-sensitive flying faders
  - Two-axis joystick for surround panning
  - 29 dedicated function keys (12 backlit) plus 8 soft keys
  - 640x240 256-color CCFL-backlit LCD display
