name: 525 Compressor
manufacturer: api-audio
primaryCategory: compressor
categories:
  - limiter
  - dynamics
  - rack-mount
url: https://apiaudio.com/product/525-compressor/
description: Exact reissue of API's original 525 feedback-type
  compressor/limiter from the early 1970s, with variable threshold, Ceiling
  control, de-ess function, four switchable auto-release modes, and illuminated
  VU meter.
details: |-
  500-series peak-detecting feedback compressor/limiter, exact reissue
  of the original 1970s API 525. Selectable 2:1 compression or 20:1 limiting
  ratio. 15-microsecond attack time. Four switchable auto-release modes: 0.1 s,
  0.5 s, 1.5 s, 2.0 s. Controls: variable Threshold, Output, Ceiling. De-ess
  function. Hardwire bypass. Transformer-balanced output.
specs: |-
  - Ratio: 2:1 (compression) or 20:1 (limit)
  - Attack: 15 µs
  - Release: 0.1 s / 0.5 s / 1.5 s / 2.0 s (switchable)
  - Max gain reduction: 25 dB
  - Input impedance: 60 kΩ (balanced)
  - Output impedance: 75 Ω (transformer coupled, balanced)
  - Max input: +27 dBu
  - Max output: +28 dBu
  - Frequency response: ±0.5 dB (20 Hz–40 kHz)
  - S/N ratio: 112 dB
  - Power: 3 W
