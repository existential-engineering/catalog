name: I-ONIX U82S
manufacturer: lexicon
primaryCategory: audio-interface
categories:
  - discontinued
  - legacy
url: https://lexiconpro.com/en-US/products/i-onix-u82s
description: 8x2 USB 2.0 desktop recording studio with 8 mic preamps, 2 Hi-Z
  instrument inputs, S/PDIF and MIDI I/O.
specs: |-
  - 8 microphone preamps with +48V phantom power
  - 10 simultaneous recording sources
  - Sample rates: 44.1, 48, 88.2, or 96 kHz
  - Max input gain: +55 dB
  - Dynamic range: 106-110 dB typical
  - Frequency response: +/-1.5 dB, 20 Hz - 20 kHz
  - 2 Hi-Z instrument inputs
  - S/PDIF digital I/O
  - MIDI I/O
  - USB 2.0 connection to host
