url: https://www.manley.com/products/legacy/pro/mid-frequency-eq
description: Mid Frequency EQ features passive bell-shaped peak/dip controls
  with 12AU7/12BH7 tube gain. Precise midrange shaping, MANLEY IRON®
  transformers. 116dB S/N.
details: |-
  Single-channel passive midrange equalizer with all-tube make-up gain amplification, hand-assembled in California.

  Combines passive inductor-based EQ networks with 12AU7/12BH7 tube gain stages for musical frequency contouring across the critical midrange spectrum, complementing classic Pultec-style program EQs.
specs: |-
  - Single-channel passive midrange EQ (1U)
  - Tube make-up gain: 1 x 12AU7, 1 x 12BH7 (or 6414 or 5965)
  - MANLEY IRON transformer-coupled balanced I/O
  - Peak & shelf controls with frequency select switches
  - Phase reverse switch and bypass with auto-mute
  - Adjustable feedback/gain (Unity +/- 5 dB)
  - Frequency Response: 10 Hz - 70 kHz
  - THD + Noise: < 0.01% @ 1 kHz
  - S/N Ratio: 116 dB
  - Max Output: +30 dBv
  - Input Impedance: 3K Ohm (XLR transformer), 5K Ohm (1/4" unbalanced)
  - Power Consumption: 18 watts
  - Mains Voltage: 100V, 120V, or 220-240VAC (purpose-built)
  - Dimensions: 19" x 1 3/4" x 10" (1U)
  - Shipping Weight: 12 lbs
