details: |-
  The COLLECTOR Series is a powerful and expressive dreadnought designed for players who want headroom, projection, and authority. Figured ovangkol combined with Adirondack spruce produces a bold, punchy voice with strong fundamentals and clear articulation under heavy attack. The Cinnamon Burst gloss finish adds visual warmth to a guitar built for stage, studio, and traditional flatpicking applications where volume and presence matter most. These are limited series of 5 total per shape.
