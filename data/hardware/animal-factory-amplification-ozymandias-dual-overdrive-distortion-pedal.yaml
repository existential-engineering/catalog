description: A dual overdrive/distortion pedal with two independent circuits
  (CROOK and FLAIL), each with gain, tone and volume controls plus clipping and
  range switches. It can run in series or parallel mode with separate
  input/output jacks per channel.
details: |-
  "My name is Ozymandias, King of Kings,

  Look, ye mighty, upon these works and despair!"

  Ozymandias is a stacked dual-overdrive/distortion pedal that offers a plethora of usage options, choices fit for the King of Kings. From a near-clean boost with unparalleled headroom to full bore bourbon-swilling crunch, this one rules them all. Features and Controls

  Ozymandias contains two independent overdrive circuits, with identical controls but marked differences in tone and voicing:

  The CROOK channel (left side, blue LED) boasts a full, fat thick sound and amp-like voicing. This channel is more articulate, grainy and has a huge low end. The FLAIL channel (right side, red LED) is voiced in the midrange, with more drive and compression. This high-mid voicing will cut through a mix on pretty much any instrument. Both channels have GAIN, TONE and VOLUME controls. For more textural control, each channel has three-way switches for hard (GRIND) and soft (GRIT) clipping, as well range (FULL/MID). Each channel of the Ozymandias has its own set of input and output jacks. This allows you to split the output from each channel into separate amplifiers or even process two different instruments independently. The mysterious square in the middle switches between two modes:

  Thanks to internal 22V operation, Ozymandias offers far greater headroom than most overdrive pedals from a regular 9V pedal power supply. Even with the gain dimed, this pedal is extremely reactive to playing dynamics and pick attack. Current Lead Time - 7-10 days
specs: |-
  - Series (Light off): FLAIL channel -&gt; CROOK channel -&gt; Output 2
  - Parallel (Light on): FLAIL channel -&gt; Output 1; CROOK channel -&gt; Output 2
