details: |-
  The One Plus is a premium tabletop Bluetooth speaker that channels the acoustics and classic design legacy of Paul W. Klipsch into a modern form. Built with luxury materials including real wood veneer and tactile switches and knobs, it blends heritage aesthetics with contemporary wireless audio technology.

  At its core is a biamplified 2.1 stereo system featuring two 2.25" full-range drivers and a 4.5" high-excursion woofer, engineered to deliver audiophile-grade resolution in a compact tabletop footprint.

  Wireless connectivity is provided by Bluetooth 5.3 with a range of up to 40 feet. A USB-C port enables both audio playback and reverse charging. The Klipsch Connect App provides EQ customization and firmware update access.

  Broadcast Mode allows up to 10 or more individual The One Plus speakers to be wirelessly linked together for whole-home audio coverage. Available in Walnut and Ebony finishes.
