details: |-
  Reproduction of piano sound is extremely challenging, particularly during live performances when other instruments are present. Ambient sounds near the piano often bleed into the piano microphones. To circumvent sound leakage, the piano is often played in the short-stick or closed-lid positions. The SCX25A large-diaphragm studio condenser microphone produces a highly transparent and remarkably accurate sound. This attribute combined with the SCX25A's low profile and phase-coherent reproduction makes the SCX25A the optimum piano microphone for live sound or broadcast environments.

  To further enhance the ease of placement, two DFLEX mounting clips accompany the SCX25A and can be easily attached directly to the piano rail, enabling the SCX25A to be securely placed anywhere on the soundboard.

  The SCX25A studio condenser microphone is undeniably the most compact, large-diaphragm microphone on the market. It boasts an innovative design and patented capsule system. This pack includes two high-quality, quad conductor microphone cables with braided shielding which helps reduce noise induction from external sources.
specs: |-
  - Type: Large-diaphragm studio condenser
  - Included: Pair of SCX25A condensers, two DFLEX mounting clips, two quad-conductor cables, aluminum flight case
