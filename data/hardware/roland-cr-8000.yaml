description: >-
  The Roland CR-8000 CompuRhythm is an analog drum machine released in 1981, continuing
  Roland's CompuRhythm line with classic electronic drum sounds reminiscent of the CR-78
  and TR-808. It features 13 analog drum voices, preset rhythm patterns in various styles,
  and 8 user-programmable pattern slots. Notable for its unique groove/swing control that
  adjusts both beat timing and drum timbre, it has been used by artists including Fluke,
  BT, Jimmy Edgar, and Blondie.
details: |-
  The CR-8000 represents Roland's continuation of their CompuRhythm line of drum machines, bridging the gap between the legendary CR-78 and the iconic TR-808. Its analog voice architecture produces 13 drum sounds including kick, snare, toms, open and closed hi-hats, cymbal, cowbell, and congas, all with a distinctly warm and punchy character.

  What sets the CR-8000 apart is its groove control feature, a unique parameter that changes not only the intervals between beats but also the timbre of the sounds. This is particularly evident in the hi-hat articulation, where the swing setting creates subtle tonal variations that give patterns an organic, human feel that is difficult to replicate with modern equipment.

  The machine offers both preset rhythm patterns covering a range of musical styles and the ability to program up to 8 custom patterns. While none of the sounds are individually editable and there is only a single mono audio output, the CR-8000 compensates with Roland DIN Sync connectivity for integration with other Roland gear of the era.

  Today the CR-8000 is primarily valued as a collector's item and a source for sampling vintage analog drum sounds. Its unique swing characteristics and distinctive voice circuits continue to attract producers seeking authentic early-1980s electronic percussion tones.
specs: |-
  - 10-note polyphony
  - 13 analog drum sounds (kick, snare, toms, open/closed hi-hats, cymbal, cowbell, congas)
  - Preset rhythm patterns in multiple styles
  - 8 user-programmable pattern storage slots
  - Adjustable groove/swing control affecting timing and timbre
  - Individual part level controls
  - Mono audio output
  - Roland DIN Sync for external synchronization
  - Start/stop and tempo controls
