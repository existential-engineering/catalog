description: The Orchestra CE is one of Cordoba's best selling Fusion guitars, with a solid Canadian cedar top and rosewood back and sides.
details: |-
  The Orchestra CE is one of our best selling Fusion guitars. Available with a solid Canadian cedar top and rosewood back and sides, this model's main feature is its slim neck profile (48mm nut width and 16 inch radius fingerboard) and only 12 frets to the body, which maximizes the amount of resonance and vibration across the soundboard. It's the perfect blend of classic Spanish designs with modern aesthetics, a hand-inlaid wooden rosette, elegant mahogany binding and a high gloss PU finish. Ready to plug in and play, the Orchestra CE comes equipped with the Fishman Presys Blend preamp.
specs: |-
  - Family: Cutaway & Electric
  - Style: Fusion
  - Body Top: Solid Canadian Cedar
  - Back and Sides Wood: Rosewood
  - Frets to Body: 12
  - Nut Width: 48mm (1 7/8")
  - Fingerboard Radius: 16 inch
  - Binding: Mahogany
  - Rosette: Hand-inlaid wood
  - Finish: High Gloss Polyurethane
  - Electronics: Fishman Presys Blend
  - Number of Strings: 6
  - Tuning: E-A-D-G-B-E
