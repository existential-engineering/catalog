description: The L12next combines the power of a digital mixer with analog-style
  operation. Three knobs per channel can deliver High/Mid/Low EQ control, and a
  simple switch also brings gain, pan and sends under hand for hands-on mixing,
  just like an analog console.
details: |-
  The LiveTrak L12next is a 12-channel digital mixer with a built-in multi-track recorder, laid out so that it is operated like an analog console. Eight mono XLR/TRS combo inputs are joined by two stereo pairs of TS line inputs on channels 9/10 and 11/12, and channels 1 and 2 carry Hi-Z switches for guitar and bass.

  Each channel has a 60 mm fader and three multi-function encoder knobs, selected in five banks, that cover gain, compression, low cut, high, mid and low EQ with variable mid frequency and Q, panning, the five monitor sends and the effect send. The preamps give up to +70 dB of gain with -128 dBu EIN, and PAD and +48 V phantom power are switchable. LED meters show both the level and the encoder position on every channel, and a Fader Position button recalls where the faders were saved.

  The recorder captures up to 12 individual tracks at 24-bit and 96 kHz plus a stereo mix, 14 tracks at once, to an SDHC or SDXC card of up to 1 TB. The master track is written in 32-bit float so the mix cannot clip, and a master compressor raises the level. Overdub Mode, Auto Punch In/Out, a Mix Down button and a File Select button that loads further tracks onto channels cover layering and re-recording.

  Five independent monitor outputs each carry their own mix. MONITOR OUT A to D switch between headphone output and balanced mono for a powered monitor, and the fifth, MONITOR OUT (PHONES), is for the engineer and can monitor the master, any of the five sends, or a solo. A built-in talkback mic routes onto channels 11/12 while its button is held. Ten scene memories store fader positions, EQ, pan, mutes and effects, and 16 send effects cover nine reverbs, three delays and four delay-plus-reverb vocal settings, each with two parameter knobs and tap tempo where a delay time applies.

  Over USB-C the L12next is a 14-in/4-out audio interface at up to 96 kHz in 24-bit or 32-bit float for Mac, Windows and mobile, recording to a computer and to the card at the same time, and it also works as a DAW control surface and sends MIDI. The rear panel adds a REMOTE connector for the optional BTA-1 Bluetooth adapter, which enables the L12next Control app for iPad, a CONTROL IN jack for the optional FS01 footswitch, a microSD card slot, a Kensington slot and the DC 12V input for the supplied AD-19 adapter. An optional RKL-12 adapter rack-mounts the unit.
specs: |-
  - Input channels: 8 mono MIC/LINE, 2 stereo LINE (12 channels total)
  - Output channels: 1 MASTER OUT, 5 MONITOR OUT
  - MIC/LINE connectors: XLR/TRS combo jacks (XLR: 2 HOT, TRS: TIP HOT)
  - MIC/LINE input gain: PAD off +16 to +60 dB, PAD on -10 to +34 dB, Hi-Z on 0 to +44 dB with gain boost off
  - MIC/LINE input impedance: XLR 4.6 kOhm or more. TRS 4.6 kOhm, or 1 MOhm with Hi-Z on
  - MIC/LINE maximum input level: PAD off -2 dBu at 0 dBFS, PAD on +24 dBu at 0 dBFS
  - Phantom power: +48 V, switchable for channels 1-4 and 5-8
  - PAD switches attenuate the input by 26 dB
  - Stereo LINE inputs: TS phone jacks (unbalanced), maximum input level +14 dBu
  - MASTER OUT: XLR jacks (balanced), maximum output level +14.5 dBu, output impedance 200 Ohm
  - MONITOR OUT: standard stereo phone jacks, maximum output level 42 mW + 42 mW at 60 Ohm, output impedance 55 Ohm
  - Buses: MASTER x 1, MONITOR x 5, SEND EFX x 1
  - Channel strip: COMP, LOCUT 40 to 600 Hz at 12 dB/OCT, PHASE invert
  - Channel strip EQ: HIGH 10 kHz shelving plus or minus 15 dB, MID 100 Hz to 8 kHz peaking plus or minus 15 dB with variable Q, LOW 100 Hz shelving plus or minus 15 dB
  - Level meters: 8 segments per channel
  - Send effects: 16 types (Hall 1, Hall 2, Room 1, Room 2, Plate, Church, DrumAmb, GateRev, Spring, Delay, Analog, P-P Dly, Vocal 1 to Vocal 4)
  - Maximum simultaneous recording tracks: 14, maximum simultaneous playback tracks: 12
  - Recording format, individual tracks: 44.1/48/96 kHz, 16/24-bit, mono or stereo WAV
  - Recording format, master track: 44.1/48/96 kHz, 16/24-bit or 32-bit float, mono or stereo WAV
  - Recording media: 4 to 32 GB SDHC cards and 64 GB to 1 TB SDXC cards, Class 10 or higher
  - Audio interface: 14 in / 4 out, 44.1/48/96 kHz, 24-bit or 32-bit float, USB 2.0
  - Card reader: mass storage class, USB 2.0 High Speed
  - Frequency response: 20 Hz to 20 kHz at -1.0 dB at 44.1 kHz, 20 Hz to 40 kHz at -3.0 dB at 96 kHz
  - Equivalent input noise: -128 dB EIN (IHF-A) at +60 dB / 150 Ohm input
  - Display: 128 x 64 OLED
  - Ten scene memories store fader positions, EQ, pan, mute and effect settings
  - Built-in talkback mic, routed onto channels 11/12 while the button is held
  - Metronome with tempo quantization of tap-set delay times
  - Power: ZOOM AD-19 AC adapter, DC 12V/2A
  - Power consumption: 16 W maximum
  - Dimensions: 445 mm (W) x 285 mm (D) x 73 mm (H)
  - Weight: 2.40 kg main unit only
  - Wireless control from an iPad with the L12next Control app requires the optional BTA-1 adapter, range up to 10 m in open spaces
  - Kensington Security Slot on the rear panel
