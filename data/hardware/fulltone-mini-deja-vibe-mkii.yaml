description: A compact analog Univibe-style pedal using 13 discrete transistors
  and glass-covered photocells for authentic vintage vibe modulation, with an
  expression pedal jack for external speed control.
details: |-
  CS-MDV mkII...the world's smallest (3.9" W x 4.1" L x 2.3" H ) yet biggest sounding "real vintage Univibe clone." It's the biggest sounding 'vibe we've ever made or heard, power it with our 18 volt DC power supply (included when bought direct from us) or power it by using 2 x 9CVDC outlets on your pedalboard multi-power supply while using the Voodoo Lab PPY "series voltage doubling cable." The mkII has an expression pedal out jack should you need it, and still with no ICs and using only full-size Capacitors throughout the entire audio path! It's 100% Analog, you can't get this sound out of the flavor-of-the-minute Digital pedals using a $3 DSP chip. You need 13 transistors, 4 x correct resistance and response photoresistor, a real & correct incandescent light bulb, and 30 years experience...you need the Fulltone CS-MDV mkII

  Features: • 30% smaller enclosure than older MDVs, still with top-mounted jacks for tight spaces. • Now has MUCH slower and MUCH faster available speeds (than all older Fulltone vibes) achieved by replacing the standard Speed pot with a Fulltone designed & custom-made Photoresistor, while retaining the original Univibe's unique Analog Oscillator circuit and 100% analog warble feel. • has a linear ramp up of the Speed knob (and external pedal).This is the bummer about older Deja'Vibes, other clones, and original Univibes: the speed controller has a spot where everything happens, making it hard to find the right speed. Problem-solved with the mkII. • it has an External Pedal jack allowing the use of virtually any expression pedal out there, whether it has a 10K, a 50K, 100K, etc potentiometer. As i mentioned previously. • It has twice the available volume as any vibe clone, assuring that you don't get bogged-down in the mix when you kick it on...without being bright and cold sounding, and a super-low output impedance so it is not affected by pedals that come after it and shines with the dirtiest of amps! • 100% correct Vintage Univibe analog circuit with no opamps in the Audio path, still using 13 discrete transistors, still the Fulltone Proprietary glass lens/ hermetically sealed photocells with correct incandescent bulb. • Includes the IPS-18 Noise-Free Power Supply
