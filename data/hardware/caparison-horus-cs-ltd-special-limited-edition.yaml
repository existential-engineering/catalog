details: |-
  Created to celebrate 30 years of Caparison Guitars, the Horus-CS-LTD is a special limited edition model inspired by the very first Horus released in 1995. Drawing closely from the pre-production guitar featured in Caparison ' s 1996 catalog, it captures the essence of the original while incorporating modern refinements for today ' s players. The guitar features the iconic Iris Violet finish, faithfully recreated by original designer Itaru Kanno, along with a first-generation Horus body shape, rosewood fingerboard, and a slightly slimmer neck profile true to the early models. A 2-piece centre-joined mahogany body delivers rich tonal character, while vintage-inspired details like the original headstock Horus inlay and simplified control layout—including a push-push volume switch for instant pickup selection—enhance its authenticity. Blending heritage with innovation, the Horus-CS-LTD is equipped with a 5-piece walnut/maple neck for added stability, luminlay side markers for visibility on dark stages, Gotoh HAP tuners with adjustable post height, and a deep heel cut for improved upper fret access. Custom-developed pickups complete the package: the PH-ba5 bridge pickup offers high output with clear, rich mids that complement the mahogany body, while the SH-27FC-A5 neck pickup is optimised for balance and articulation across all 27 frets. The result is an incredibly expressive instrument that honours Caparison ' s legacy while delivering razor sharp, modern performance. The Horus-CS-LTD stands as a refined evolution of a true classic.
