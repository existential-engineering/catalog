name: G Three Active Speaker
manufacturer: genelec
primaryCategory: speaker
url: https://www.genelec.com/g-three
description: "The G Three delivers the kind of detail and precision that has
  made Genelec the number one choice of music and film professionals the world
  over. Why not bring that same quality to your home?"
details: |-
  The G Three is a compact two-way active loudspeaker from Genelec's G Series of home audio speakers, derived from the company's professional studio monitor heritage. By integrating the amplifiers inside the cabinet, the G Three removes the need for external power amplifiers and delivers a complete, self-contained source-to-driver signal path tuned by Genelec.

  A 130 mm bass driver and 19 mm metal dome tweeter are each powered by their own 50 W Class D amplifier, with an active crossover at 3 kHz. The system reaches a short-term maximum SPL of 104 dB and a long-term SPL of 96 dB, with a frequency response of 47 Hz - 25 kHz (-6 dB) and ±2.5 dB accuracy from 54 Hz to 20 kHz.

  The Minimum Diffraction Enclosure (MDE) is die-cast aluminium with rounded edges and a reflex port for extended bass response. Genelec's Directivity Control Waveguide (DCW) sits around the tweeter to control dispersion and deliver consistent on- and off-axis response, while the included Iso-Pod stand decouples the speaker from its supporting surface and allows angled placement.

  Bass tilt, treble tilt, bass roll-off, and desktop compensation tone controls let the G Three adapt to placement against walls, on shelves, or on stands. Intelligent Signal Sensing (ISS) automatically drops the speaker into a low-power sleep state when no audio is present, with full-output power consumption of 60 W and ISS-active consumption below 0.5 W.

  Both balanced XLR and unbalanced RCA analog inputs are provided so the G Three can be paired with hi-fi sources, computers, streamers, or pro audio equipment. For deeper bass extension, the G Three can be combined with a Genelec F Series subwoofer to form a complete home audio system. The speaker is available in matte black, white, and raw aluminium finishes.
specs: |-
  - Two-way active loudspeaker
  - Short term maximum SPL: 104 dB
  - Long term maximum SPL: 96 dB
  - Frequency response: 47 Hz - 25 kHz (-6 dB)
  - Frequency response accuracy: +/- 2.5 dB (54 Hz - 20 kHz)
  - Bass amplifier: 50 W Class D
  - Treble amplifier: 50 W Class D
  - Bass driver: 130 mm cone
  - Treble driver: 19 mm metal dome
  - Crossover frequency: 3000 Hz
  - Self-generated noise: <= 5 dB SPL
  - Harmonic distortion: <= 2% (50-100 Hz), <= 0.5% (>100 Hz)
  - Analog input: XLR female, 10 kOhm
  - Analog input: RCA female, 10 kOhm
  - Power consumption (ISS active): <= 0.5 W
  - Power consumption (idle): <= 3 W
  - Power consumption (full output): 60 W
  - Mains voltage: 100-240 VAC 50/60 Hz
  - Dimensions: 299 x 189 x 178 mm (H x W x D) with Iso-Pod
  - Weight: 5 kg (11.0 lb)
  - Die-cast aluminium Minimum Diffraction Enclosure (MDE) with reflex port
  - Directivity Control Waveguide (DCW) technology
  - Iso-Pod vibration decoupling stand included
  - Intelligent Signal Sensing (ISS) auto power management
  - Tone controls: bass tilt, treble tilt, bass roll-off, desktop compensation
  - Available finishes: Matte Black, White, Raw aluminium
