description: Bright and exhilarating, the STAR Reserve Hand Hammered Aluminum
  snare drum shatters the traditional image of an aluminum snare with its
  innovative sound. The 3mm hand hammered shell delivers deep resonance,
  sensitivity, and control, while maintaining a bright and quick attack.
details: |-
  Brass Sound Arc Hoop: This inward curved 2.3mm brass hoop provides milder attack, more sustain and offers sensitivity, precise tuning, and control.

  Super Sensitive Hi-Carbon Snare Wire: In order to provide a crisper and more sensitive sound, we redesigned our snappy snare using new materials and customizing the shape of the plate and the wire coil's winding pattern. As a result of these modifications, the Super Sensitive Hi-Carbon Snappy Snare fits closer to the snare side head, providing greater sensitivity and a brighter, crisper sound.
