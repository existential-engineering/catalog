details: |-
  The BeatBuddy 10th Anniversary Edition is a limited-run, black-and-gold version of the original drum machine pedal. It delivers authentic, studio-quality drum beats across 220+ styles and 23 genres, all controlled by foot. Add fills, transitions, intros, and outros to bring your music to life. With 24-bit sound, expandable memory, and BeatBuddy Manager software, it's both a collector's item and a professional tool.
