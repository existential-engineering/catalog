details: |-
  The G6120RHH Reverend Horton Heat model is built to the Rev.'s own specs and rocks a distinctive combination of 1955-style Gretsch western motifs and 1958-style pickups and controls.

  Features include TV Jones Classic pickups, a pinned Adjusto-Matic bridge, Gotoh locking tuners, a clear pickguard, a "G" body brand and bound oversized F-holes.

  A stained maple headstock overlay pairs with multiple aged body bindings and aged fingerboard and headstock binding for true vintage feel.

  Distinctive western motif inlays featuring cactus, steer heads and fences nod to the 1955-style Gretsch lineage that inspired the design.
