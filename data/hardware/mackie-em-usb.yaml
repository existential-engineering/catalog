description: The Mackie EM-USB condenser microphone packs quality and
  convenience with the perfect blend of essential features.
details: |-
  The EM-USB USB condenser microphone sets the standard in pro-quality, affordable recording directly to a computer without using an audio interface. It suits a home studio, live streaming, podcasts and online content creation, with pristine sound, onboard control and ease of use.

  A headphone output with independent volume control offers a convenient monitoring solution, and the mute button switches off the mic while computer output is still audible through the headphones.

  The onboard gain knob optimises the microphone's output to the computer or DAW, and the cardioid polar pattern rejects peripheral noise to keep the performance clear.

  Waveform OEM professional software and plugin package is included. The DAW Essentials Bundle for Waveform OEM includes 16 plugins such as Equaliser, Compressor, Reverber8 and Limiter.
specs: |-
  - Element: 14 mm high-quality condenser capsule
  - Polar pattern: cardioid (uni-directional)
  - Frequency response: 30 Hz - 18 kHz
  - Sensitivity: -32 dB (0 dB = 1 V/Pa @ 1 kHz)
  - Max input SPL: 130 dB (@ 1 kHz, 1% THD)
  - Dynamic range: 89 dB (ADC) / 93 dB (DAC)
  - Signal-to-noise ratio: 89 dB (ADC) / 96 dB (DAC)
  - Stereo output power: 400 mW
  - Sample rate: 16-bit / 48 kHz
  - Connection: USB-C, class compliant, no driver needed
  - Bus powered over USB, no external power supply
  - Headphone output on 1/8 in connector with independent level control
  - Onboard gain control and mute switch
  - Boom or stand mounting via the included mic clip
  - Size (H x W): 7.1 in x 1.8 in / 180 x 46 mm
  - Weight: 0.87 lb / 0.39 kg
  - Included accessories: tripod stand, mic clip, USB-C cable
  - Waveform OEM software and DAW Essentials plugin bundle included
