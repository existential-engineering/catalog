description: "The Mackie EM-USB USB condenser microphone sets the standard in
  pro-quality, affordable recording directly to your computer without using an
  audio interface."
details: |-
  Whether you're looking for a great-sounding and convenient mic for your home studio, live streaming, podcasts, or online content creation, you'll love the EM-USB microphone's pristine sound, onboard control, and ease of use.

  The EM-USB features USB-C plug-and-play connectivity with no drivers required, a cardioid polar pattern for focused capture, and a built-in headphone output with independent volume control for zero-latency monitoring. Onboard gain control and a mute button put essential controls at your fingertips.

  Built-Like-a-Tank rugged construction ensures reliability, and the included tripod stand, mic clip, and USB-C cable get you up and running out of the box. The EM-USB also includes the Waveform OEM software bundle with the DAW Essentials Bundle of 16 plugins.
specs: |-
  - USB-C connectivity, plug-and-play, no driver needed
  - Cardioid polar pattern
  - Headphone output with independent volume control
  - Onboard gain control and mute button
  - Built-Like-a-Tank reliability
  - Sample rate: 16-Bit / 48kHz
  - Includes tripod stand, mic clip, USB-C cable
  - Waveform OEM software with DAW Essentials Bundle (16 plugins)
