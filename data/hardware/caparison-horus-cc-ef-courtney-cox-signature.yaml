details: |-
  Presenting the Caparison Horus CC EF, Courtney Cox Signature Guitar—a refreshed model tailored to Courtney's specifications for a deeper, darker tone and optimized for down tuning. This model is crafted for C# tuning (DR strings 010-052) and has been equipped with a mahogany body for rich resonance and an ebony fingerboard that enhances tonal range and smooth playability. The guitar features a new Caparison PH-Rm bridge pickup for a fuller, darker sound that supports down tuning, paired with a Caparison SH-27FC neck pickup that's exclusive to this 27-fret design. Built on the Horus 628mm scale platform, it boasts a sturdy 5-piece maple and walnut neck that provides both reliability and comfort. For exceptional sustain, the model is equipped with a Schaller S-FRT II tremolo bridge and an FU-Tone "Big" brass block, enhancing sustain and clarity in high frequencies. Additional FU-Tone upgrades include noiseless springs, titanium string lock inserts, and stainless steel saddle support screws for maximum performance and durability. Visually, the guitar stands out in a bold Metallic Green—a vivid, almost fluorescent color chosen by Courtney herself. Her "CC" logo is displayed on the headstock, and her signature is printed on the back control panel, marking this as an official signature model. The Courtney Cox Signature Guitar delivers high playability, powerful tone, and a striking look, making it an ideal choice for serious musicians. "Every artist searches for the instruments that bring out the best in them. An instrument that transforms their creations into life. As a guitarist, I have searched for and have found an instrument that brings out the best in my passion for music. That guitar is the Caparison Horus-M3 CC. From its full in your face tone that cuts through any stage to its fast five piece neck, I am confident in saying that this hand crafted masterpiece is the best guitar I have ever played hands down. It's an honor to be a part of the Caparison family, a relationship I will hold dear throughout my career as an artist." – Courtney Cox
