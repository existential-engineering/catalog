details: |-
  The M3 is an innovative, tri-element hanging ceiling microphone designed for applications where aesthetics, sound quality, and ease of installation are critical. The M3 is an ideal audio capture solution for video conferencing, distance learning, courtroom activities, and surgical procedures. It can also be used for ambient room miking and surveillance.

  The M3 ceiling microphone incorporates three phase-coherent hypercardioid capsules with tailored frequency response optimized for speech intelligibility. This is accomplished by minimizing frequencies caused by noise, vibration, paper shuffling, keyboard strokes, fans, and heating /air conditioning. Low noise preamp circuitry is employed for the highest possible signal to noise and studio-quality sound. A high-quality silicone jacketed microphone cable ensures a balanced, shielded signal and a very clean look. Electronics above the ceiling are housed within a plenum-rated junction box and cable connections are made via an RJ45 connector embedded within a proprietary brass housing for an airtight seal.
specs: |-
  - Capsules: three phase-coherent hypercardioid
  - Transducer type: condenser with low-noise preamp circuitry
  - Output: balanced, shielded analog signal
  - Connection: RJ45 connector in proprietary brass housing
  - Plenum-rated junction box
