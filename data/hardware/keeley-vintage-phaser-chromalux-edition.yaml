description: Custom Shop Chromalux colourway of the Vintage Phaser, an analog
  phaser with selectable two, four and six stage modes and Rate, Depth and
  feedback controls.
details: |-
  The Vintage Phaser puts the three most common phaser configurations in one pedal, with selectable two, four and six stage phasing. Phasing creates moving peaks and troughs across the frequency spectrum, and a low frequency oscillator moves them rhythmically for an analog, wave-like sweep that Keeley compares to the inflection of a human voice.

  Three controls shape the effect. Depth sets how pronounced the phasing is, Rate sets the speed of the oscillator, and FDBK feeds part of the signal back to the input for a more resonant, peaky character. The suggested starting point is all three controls at noon.

  This is the Chromalux edition, a limited 2024 Custom Shop colourway of the pedal.
specs: |-
  - Selectable two, four and six stage phasing
  - Controls: Rate, Depth, FDBK (feedback)
  - Analog low frequency oscillator
  - Chromalux Custom Shop colourway, limited 2024 run
