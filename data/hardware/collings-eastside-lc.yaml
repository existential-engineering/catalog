description: The Eastside LC is a fully-hollow laminate archtop electric guitar
  designed for professional jazz players seeking full, warm vintage tone. It
  features a 16" lower bout, 2 1/2" body depth, and a single Lollar Charlie
  Christian neck pickup. Construction includes a Honduran mahogany neck,
  rosewood fingerboard, and high gloss nitrocellulose lacquer finish.
details: |-
  The Eastside LC features fully-hollow parallel-braced construction with a maple laminate body and top, offering a 16" body width, 20 1/4" body length, and 2 1/2" body depth. The Honduran mahogany neck joins the body via an extra long mortise & tenon joint, topped with a rosewood fingerboard with mother-of-pearl long dots and a 12" radius. Scale length is 24 7/8" with a 1 11/16" nut width. Electronics consist of a single Lollar Charlie Christian neck pickup wired with CTS 500K pots and Jupiter Vintage Yellow capacitors. Hardware includes an adjustable ebony bridge, ebony tailpiece, ebony pickguard, and nickel Gotoh tuners with Collings logo. The S-hole design is unbound, while the body features non-grained ivoroid binding. Finished in high gloss nitrocellulose lacquer and ships with D'Addario NYXL1252W strings and a deluxe hardshell case.
specs: |-
  - Body: Maple laminate, fully hollow, parallel-braced
  - Body Width: 16"
  - Body Length: 20 1/4"
  - Body Depth: 2 1/2"
  - Top: Maple laminate
  - Neck: Honduran mahogany
  - Neck Joint: Extra long mortise & tenon
  - Fingerboard: Rosewood
  - Fingerboard Radius: 12"
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Inlays: Mother-of-pearl long dots
  - Frets: Medium 18% nickel-silver
  - Pickup: Single Lollar Charlie Christian (neck)
  - Controls: CTS 500K pots, Jupiter Vintage Yellow capacitors
  - Knobs: Amber or black top hat
  - Bridge: Adjustable ebony
  - Tailpiece: Ebony archtop style
  - Tuners: Nickel Gotoh with Collings logo
  - Pickguard: Ebony
  - Binding: Non-grained ivoroid (body)
  - Soundholes: S-hole (unbound)
  - Peghead Veneer: Ebony with mother-of-pearl Collings logo
  - Peghead Profile: Flared haircut
  - Finish: High gloss nitrocellulose lacquer
  - Total Length: 42 5/8"
  - Strings: D'Addario NYXL1252W
  - Case: Deluxe hardshell
