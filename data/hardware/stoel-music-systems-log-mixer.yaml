description: A Eurorack mixer with four inputs and one output, each input using
  a logarithmic (audio-tapered) level control best suited to mixing audio
  signals.
details: |-
  The Stoel Music Systems Log Mixer provides four inputs and one output, each with a logarithmic (audio-tapered) level control knob. The Log Mixer is best suited for mixing audio signals but can be used to mix control voltages as well. The only difference between the Linear Mixer and Log Mixer is the response pattern of the knobs. Technical Specifications

  Width
  6 HP

  Depth
  21 mm

  Current Draw
  +12V: 4mA, -12V: 4mA, +5V: 0mA
specs: |-
  - Best for mixing audio signals
  - Four inputs and one output
  - Each control has a logarithmic (audio) taper
  - The only difference between the Linear Mixer and Log Mixer is the response pattern of the knobs
