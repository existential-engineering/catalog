description: The perfect amp to meet you at home or on stage. The 1x12 combo
  pairs the Bellringer Reverb circuit with a Benson Custom 30 Ceramic speaker in
  a dovetailed pine cabinet.
details: |-
  Point-to-point construction on terminal strips (no circuit, eyelet, or turret
  board). Custom Sours transformer set including a wax-dipped output transformer.
  Jupiter Yellow Capacitors. Dovetailed pine speaker cabinet with a Benson
  Custom 30 Ceramic speaker.

  All-tube power scaling from a JJ 6L6GC configured as a voltage regulator.
  Handmade in Portland, OR.
specs: |-
  - Tubes: 2x JJ EL34, 2x JJ 12AX7, JJ 12DW7 (reverb driver), JJ 6L6GC (voltage regulator)
  - Power: 35 watts, scalable to 0.5 watts
  - Speaker: Benson Custom 30 Ceramic (12-inch)
  - Speaker outputs: 1x 8 ohm, 1x 16 ohm
  - Foot-switchable reverb
  - Dimensions: 23.5"W x 17.5"H x 10"D, 44 lbs
