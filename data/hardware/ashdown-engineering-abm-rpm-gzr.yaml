description: "The ABM-RPM-GZR is a custom bass preamplifier designed and built
  for Geezer Butler and Black Sabbath's farewell 'The End Tour'. Based on an
  original JE preamp, its two-way crossover was reworked into a custom
  transformer-derived crossover able to feed four outputs, driving two Ashdown
  APM-1000 power amps for the full-range signal into his 4x12 cabinets and a
  matching pair for the low-pass signal into his 2x15 cabinets. The onboard JJ
  ECC83/12AX7 tube was run at higher current for extra grit and harmonic
  distortion. It carries the standard ABM tone set (three rotary controls plus
  two pairs of EQ sliders, switchable in/out and flat/shaped by footswitch), a
  blended solid-state and dual-triode tube preamp, a footswitchable sub-harmonic
  generator, a balanced DI out, sub, tuner and FX loop connections, and a
  variable crossover for bi-amped rigs. Note: this was a one-off custom-shop
  build and is not for sale."
details: |-
  The Ashdown ABM-RPM-GZR is a Custom Bass Preamplifier specifically designed and made for Geezer Butler Black Sabbath's 'The End Tour', billed as the band's farewell tour. When designing the ABM-RPM-GZR, we took an original JE pre amp and came up with a few specific modifications. They needed to be able to split the signals to run 4 cabs for the full range signal into the 412's so we modified the existing two-way crossover to a custom transformer derived crossover able to power 4 outputs to feed the two APM-1000's that would drive his on stage 412's. This was also mimicked with an identical pre-amp and power amp configuration to power the Low pass signals for his 4 on stage 215's. Geezer also needed a little more grit in his tone so we increased the current to the pre-amps on board JJ-12-AX7 tube to give it much more of a rich harmonic distortion to suit his legendary tone. Three straightforward rotary tone controls provide 20dB of cut and boost at 60Hz, 660Hz and 5kHz, and are supplemented by two pairs of additional sliders giving 15dB cut and boost at 180Hz, 340Hz, 1.3kHz and 2.6kHz. The EQ can be switched in/out, and flat/shaped by footswitch. The ABM-RPM-GZR features a single input switchable for passive and active instruments with a blend of solid state and dual triode tube preamp stages selectable by footswitch. Also footswitchable is the Ashdown sub-harmonic generator which tracks the main signal and reproduces it an octave lower. The preamp features a balanced DI out with pre or post EQ switching, a sub-bass output, a tuner output, an FX loop and a line input. A high-precision crossover with variable frequency from 35Hz to 160Hz enables bi-amped systems, taken further for Geezer with four individual outputs patchable to Full, High or Low pass signal into two Ashdown Power 1000 watt power amps. NOTE: THIS PRODUCT IS NOT FOR SALE. IT WAS A CUSTOM SHOP ITEM BUILT ONLY FOR GEEZER BUTLER.
specs: |-
  - Custom-shop one-off bass preamplifier (built for Geezer Butler)
  - Power requirement 115/230V
  - Frequency response -3dB @ 17Hz and 30kHz
  - High instrument input impedance 3.9M Ohms, input range 150mV - 20mV p-p
  - Low instrument input impedance 10k Ohms, input range 300mV to 40V p-p
  - Line input impedance 22k Ohms, input level 0dBu nominal
  - Sub output impedance 1k Ohms, level 0dBu nominal
  - DI output 600 Ohms balanced, level 0dBu nominal
  - Tuner output impedance 22k Ohms, level 0dBu nominal
  - EQ: Bass +/-15dB @ 45Hz, Middle +/-15dB @ 660Hz, Treble @ 7kHz
  - Effects send/return impedance 22k Ohms, level 0dBu nominal
  - Custom transformer-derived crossover feeding four outputs
  - Higher-current JJ ECC83/12AX7 tube stage for added grit
  - Dimensions (H x W x D) 90 x 483 x 267 mm
  - Weight 6 kg
