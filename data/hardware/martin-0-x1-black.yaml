details: |-
  The 0-X1 Black is an affordable acoustic Concert model available in a striking all-black colorway. The body's top, back, and sides are made of high-pressure laminate (HPL), a durable material that doesn't sacrifice the classic Martin tone you know and love.

  This sleek, special addition to the X Series lineup includes playability enhancements like a thinner fingerboard with a gently beveled comfort edge and refined string spacing, and a modernized bridge contour for a smooth and comfortable playing experience.

  Concert models are the smallest full-sized guitars in the Martin lineup, providing clear, crisp trebles with delicate bass, perfect for fingerstyle playing and genres that require precise and clear note definition, while also being versatile enough to make for a great strummer.

  It also features chrome closed gear tuning machines, a birch laminate neck with Richlite fingerboard, and a herringbone pattern around the rosette. All X Series models come with a softshell case.

  This model is retired but may still be available at a dealer near you.
