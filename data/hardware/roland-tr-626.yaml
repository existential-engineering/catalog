description: >-
  The Roland TR-626 is a digital drum machine featuring 12-bit samples of 30 acoustic drum sounds with individual tuning,
  level control, and eight separate outputs, carrying forward the sequencing legacy of the TR-808 and TR-909.
details: |-
  Released in 1987, the TR-626 served as a digital evolution of Roland's classic TR-606 and TR-505 Rhythm Composers. While it inherited the straightforward programming workflow and visual pattern display from its predecessors, it moved to 12-bit sampled sounds rather than analog synthesis, placing it firmly in the digital camp of late-1980s drum machines.

  The sound palette consists of 30 standard drum sounds rendered as 12-bit samples. While the raw timbres tend toward straightforward acoustic drum emulations rather than the characterful electronic sounds of the TR-808 or TR-909, individual tuning and level controls for each sound allow meaningful customization. Eight individual outputs alongside a stereo pair provide flexible routing for external processing and mixing.

  The sequencer offers 48 preset patterns and 48 user-programmable patterns organized into six songs. A matrix display similar to the TR-505 provides clear visual feedback of the current pattern in a graphical grid layout. Step resolution is limited to sixteenth notes, keeping things simple but occasionally restrictive for more complex rhythmic programming.

  The TR-626 featured notably good MIDI implementation for its era, making it a capable trigger source for external sound modules. It found use with artists including Vangelis and Jimmy Edgar, who appreciated its solid timing and flexible output routing despite its somewhat utilitarian sound character.
specs: |-
  - Polyphony: 8 voices
  - 30 drum sounds (12-bit samples)
  - Individual tuning and level per sound
  - 48 preset patterns, 48 user patterns
  - 6 songs
  - Sequencer resolution: 1/16th note steps
  - 16 drum tone pads
  - 8 individual outputs + stereo output
  - MIDI
  - Tempo control
