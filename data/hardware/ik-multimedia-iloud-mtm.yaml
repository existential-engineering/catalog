description: "iLoud MTM MKII high-resolution compact studio monitor with more
  efficient drivers and twice the processing power to turn any space into the
  ideal mixing and mastering setup"
details: |-
  The iLoud MTM MKII is a 2-way, 3-speaker bi-amped studio monitor using an MTM (Midrange-Tweeter-Midrange) bass reflex design with Class D amplification and digital linear phase crossover at 2.8 kHz. More efficient drivers and twice the processing power of the original deliver exceptional accuracy in a compact format.

  Built-in ARC auto-calibration via USB analyzes and corrects room acoustics for accurate monitoring in any environment. Back panel switches provide manual control over LF extension, LF trim, HF trim, and desk position compensation.

  Each monitor includes a tilting isolation stand and threaded insert for flexible mounting options. Available in Black and White finishes.
specs: |-
  - 2-way/3-speaker MTM (Midrange-Tweeter-Midrange) bass reflex design
  - Class D bi-amplified with digital linear phase crossover at 2.8 kHz
  - Built-in ARC auto-calibration via USB
  - Back panel EQ switches: LF extension, LF trim, HF trim, desk position
  - Tilting isolation stand and threaded mounting insert included
  - Available as single unit, pair, or immersive bundle
