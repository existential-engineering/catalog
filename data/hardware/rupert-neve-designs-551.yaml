description: The 551 is the only 500 Series equalizer designed by Rupert Neve.
  It features three bands of EQ inspired by his most prized vintage designs,
  incorporating custom-wound inductors, transformers, and class-A gain blocks,
  bringing the thick, powerful lows and sweet highs characteristic of Rupert's
  classic designs to the compact 500-Series format.
details: |-
  The 551's 3-band, custom-tapped inductor EQ combines vintage inspiration with modern design. The low frequency band produces a creamy, resonant bass response similar to a vintage 1064 but functions as either a shelf or peak filter. The midrange band is based on the 1073, ideal for sweetening vocals and instruments. The high frequency band blends inductor circuitry with capacitor-based topologies for vintage tones with enhanced control.

  The High Frequency section offers 8 kHz or 16 kHz center frequencies with ±15 dB boost/cut and a HI PEAK switch toggling between shelf and bell-curve modes. The Midrange section features six selectable center frequencies (200 Hz, 350 Hz, 700 Hz, 1.5 kHz, 3 kHz, 6 kHz) with ±15 dB level and a MID HI Q switch for tighter Q. The Low Frequency section provides four selectable frequencies (35 Hz, 60 Hz, 100 Hz, 220 Hz) with ±15 dB level and a LO PEAK switch.

  A 12 dB/octave high-pass filter with an 80 Hz corner is included alongside the main EQ bands. Inductors are wires wound around a coil providing frequency-dependent resistance. When saturated, they produce beautifully musical harmonics. The 551 uses custom inductors rather than off-the-shelf components, allowing precise control of variables like winding and core materials to capture vintage design vitality.
specs: |-
  - Noise (EQ bypassed): better than -102 dBV (22 Hz–22 kHz, 40 Ω source impedance)
  - Frequency response (EQ bypassed): ±0.1 dBu from 20 Hz to 31.5 kHz, -1 dB @ 120 kHz
  - Maximum output level (EQ bypassed): 23.25 dBu
  - THD+N @ 1 kHz, +20 dBu (EQ bypassed): better than 0.0025%
  - Noise (EQ engaged): better than -94 dBV (22 Hz–22 kHz)
  - Frequency response (EQ engaged): ±0.25 dBu from 20 Hz to 45 kHz, -2 dB @ 120 kHz
  - Maximum output level (EQ engaged): 23 dBu
  - THD+N @ 1 kHz, +20 dBu (EQ engaged): better than 0.009%
  - High-pass filter: -2.7 dB @ 80 Hz, 12 dB/octave slope
  - Power: 120 mA on +16 VDC, 110 mA on -16 VDC
  - Dimensions: 1.5" W × 5.9" D × 5.25" H (3.8 × 15 × 13.3 cm)
  - Weight: 1.5 lbs (0.7 kg)
