details: |-
  The Baby Taylor BT1 is a 3/4-size acoustic in a compact Baby body shape, ideal for younger players, frequent travelers, and anyone who wants full-voiced tone in a smaller package. The torrefied spruce top offers improved resonance and a more open, responsive sound over standard spruce. Layered walnut back and sides contribute warm, balanced tone with excellent durability for travel.

  The 22-3/4" scale length reduces string tension compared to a full-size dreadnought, making it comfortable for smaller hands. Ebony bridge with Nubone nut and Micarta saddle provides smooth action and consistent tone transfer.

  Ships with a soft gig bag and D'Addario XS Coated Phosphor Bronze Light strings.
specs: |-
  - - Body style: Baby Taylor (3/4 size)
  - Top: Torrefied Spruce (solid, matte)
  - Back/sides: Walnut (layered, matte)
  - Neck: Mahogany
  - Fretboard: Ebony
  - Bridge: West African Crelicam Ebony
  - Scale length: 22-3/4"
  - Inlays: 4mm dots (Italian Acrylic)
  - Tuners: Die-Cast Chrome
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Soft gig bag included
