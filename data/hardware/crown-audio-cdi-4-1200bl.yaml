url: https://www.crownaudio.com/en-US/products/cdi-4-1200bl
description: Four-channel, 1200W per output channel professional power amplifier
  with analog and BLU link input, designed for large installations including
  cinema, houses of worship, hotels, and cruise lines. Features network control,
  high-level DSP, and pre-loaded JBL speaker tunings.
specs: |-
  - 4 channels
  - Dual mode @ 2Ω: 850W per channel
  - Dual mode @ 4Ω: 1200W per channel
  - Dual mode @ 8Ω: 1200W per channel
  - Dual mode @ 16Ω: 600W per channel
  - Dual mode 70Vrms: 1200W per channel
  - Dual mode 100Vrms: 1200W per channel
  - Bridge mono @ 4Ω: 1200W
  - Bridge mono @ 8Ω: 2400W
  - Bridge mono @ 16Ω: 2400W
  - Bridge mono 140Vrms: 2400W
  - Bridge mono 200Vrms: 2400W
  - Sensitivity: 0.7V RMS (full rated power at 8Ω)
  - Signal-to-Noise Ratio: >104dB
  - THD: 0.35%
  - Damping Factor: >1000
  - Frequency Response: ±0.25dB (8Ω, 20Hz-20kHz)
  - Input Impedance: 20kΩ balanced, 10kΩ unbalanced
  - BLU link networked digital audio
  - Dimensions: 19" W × 3.5" H × 14.71" D
  - Weight: 20.1 lbs (9.12 kg)
  - Power: 20A IEC, 100-240V
