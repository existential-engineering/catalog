url: https://dbxpro.com/en/products/131
description: Single 31-band graphic equalizer designed for sound reinforcement
  environments, featuring 1/3-octave frequency bands with switchable ±6dB or
  ±12dB boost/cut ranges.
details: |-
  The dbx 131 is a single-channel graphic equalizer built for demanding sound reinforcement applications. It offers 31 one-third octave bands with ISO frequency centers, selectable boost/cut ranges, and a 50Hz/12dB per octave low-cut filter. The unit features balanced XLR and 1/4" TRS connectors for flexible installation in studios, touring rigs, and installed sound venues.

  The 131 delivers impressive specifications including frequency response from below 10Hz to above 50kHz, dynamic range exceeding 108dB, and THD+Noise below 0.004%. An internal toroidal transformer ensures quiet operation with low noise floor. The front panel includes 20mm faders, a bypass switch, and 4-segment LED level monitoring for convenient gain adjustments.
specs: |-
  - Single 31-band, 1/3-octave Constant Q frequency bands
  - Switchable boost/cut ranges of ±6 or ±12dB
  - 12dB per octave, 3dB down @ 50Hz low-cut filter
  - Front panel bypass switch
  - ±12 dB input gain range
  - 4-segment LED ladders for output level monitoring
  - XLR and TRS inputs and outputs
  - Internal toroidal transformer
  - Frequency response: <10Hz to >50kHz (+0.5/-3dB)
  - Dynamic range: greater than 108dB
  - Signal to noise ratio: 90dB
  - THD+Noise: <0.004%
  - Interchannel crosstalk: <-80dB (20Hz to 20kHz)
  - Input impedance: Balanced 40k ohm, unbalanced 20k ohm
  - Output impedance: Balanced 100 ohm, unbalanced 50 ohm
  - Max input: >+21dBu balanced or unbalanced
  - Max output: >+21dBu balanced/unbalanced (2k ohm load)
  - CMRR: >40dB, typically >55dB at 1kHz
  - Operating voltage: 100VAC 50/60Hz; 120VAC 60Hz; 230VAC 50/60Hz
  - Power consumption: 12W
  - 20mm faders
  - Bandwidth: 20Hz to 20kHz, +0.5/-1dB
