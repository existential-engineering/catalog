description: The JCM800 Modified honours the original amp's iconic roots, while building on its legacy with modern features designed for today's guitarist. Seamlessly transition from smooth, warm breakup to commanding high-gain roars. A celebration of musicians and gear enthusiasts who customise their amps, this amp captures the essence of Marshall's storied legacy while integrating modern features tailored to push sonic boundaries. The legendary JCM800 tone, with new modifications.
details: |-
  The JCM800 Modified honours the original amp's iconic roots, while building on its legacy with modern features designed for today's guitarist. Seamlessly transition from smooth, warm breakup to commanding high-gain roars. Designed and engineered in UK. Made in UK.

  The JCM800 Modified's design is a celebration of musicians and gear enthusiasts who customise their amps. The iconic JCM800 has been revamped with modern features that help you carve out powerful tones, while capturing everything guitarists loved about the original.

  The gain boost switch provides extra gain and tonal flexibility for seamless transitions, while the mid-boost switch enhances mid-range frequencies, adding depth and clarity. The tight switch sharpens your tone by cutting low frequencies, ensuring every note rings out with clarity.

  Skillfully crafted in the Bletchley, England factory, this amp captures the essence of Marshall's storied legacy while integrating modern features tailored to push sonic boundaries.

  The JCM800 Modified took a NAMM Best in Show award, which honours the most innovative, impactful and exciting products unveiled at the NAMM trade show.
specs: |-
  - Channels: two (with shared EQ controls)
  - Technology: valve
  - Output wattage: 100W
  - Speaker outputs: 2 x 1/4-inch jack, selectable 16 ohm / 8 ohm / 4 ohm load
  - Inputs: 2 separate inputs
  - Valves: 2 x ECC83, 1 x ECC83 (phase splitter), and 4 x EL34
  - Controls: treble, middle, bass, and presence
  - Gain boost switch for an extra level of gain and expanded tonal flexibility
  - Mid-boost switch to enhance mid-range frequencies for extra warmth, depth and clarity
  - Tight switch to cut low frequencies for a clearer, more focused sound
  - Weight: 21 kg / 46.3 lb
  - Width: 741 mm / 29.2 inches
  - Height: 294 mm / 11.6 inches
  - Depth: 210 mm / 8.7 inches
  - Country of origin: designed and engineered in UK, made in UK
  - Colour: Black
