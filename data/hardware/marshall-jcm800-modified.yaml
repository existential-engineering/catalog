description: The JCM800 Modified honours the original amp's iconic roots, while
  building on its legacy with modern features designed for today's guitarist.
  Seamlessly transition from smooth, warm breakup to commanding high-gain roars.
  A celebration of musicians and gear enthusiasts who customise their amps, this
  amp captures the essence of Marshall's storied legacy while integrating modern
  features tailored to push sonic boundaries. The legendary JCM800 tone, with
  new modifications.
details: |-
  - Gain boost switch delivers an extra level of gain and expanded tonal flexibility
  - Mid-boost switch enhances mid-range frequencies, giving your tone extra warmth, depth, and clarity
  - Tight switch is expertly designed to cut low frequencies to produce a clearer, more focused sound
  - Handcrafted at the Bletchley, England factory

  Awards:
  - NAMM – Best in show (2025)
specs: |-
  - Output Wattage: 100W
  - Channels: Two (with shared EQ controls)
  - Technology: Valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter), and 4 x EL34
  - Controls: Treble, middle, bass, and presence
  - Outputs: 2 x 1/4" jack speaker outputs, selectable 16Ω / 8Ω / 4Ω load
  - Product Height: 294 mm / 11.6"
  - Product Width: 741 mm / 29.2"
  - Product Depth: 210 mm / 8.7"
  - Weight: 21 kg / 46.3 lb
  - Color: Black
  - Country Of Origin: Designed and engineered in UK. Made in UK.
