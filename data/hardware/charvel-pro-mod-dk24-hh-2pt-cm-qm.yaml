description: Charvel turns modern high performance on its head with the Pro-Mod
  DK24 HH 2PT CM QM, a brazen instrument for the progressive guitarist searching
  for an unparalleled spectrum of sound.
details: |-
  The Pro-Mod DK24 HH 2PT CM QM pairs a Dinky-shaped alder body with a quilt maple top in a gloss Chlorine Burst finish, mated to a bolt-on caramelized maple neck with graphite reinforcement, a hand-rubbed urethane finish, and a Speed Neck profile with rolled fingerboard edges. A sculpted shredder's cut heel and scalloped lower back bout open up unrestricted upper-fret access.

  A caramelized maple fingerboard with a 12" to 16" compound radius hosts 24 jumbo frets, 4mm pearloid dot inlays, and Luminlay side dots, all anchored by a 1.6875" Graph Tech TUSQ XL nut and a 25.5" scale length.

  Electronics are built around a versatile HH configuration: a direct-mount custom Seymour Duncan Full Shred TB-10 at the bridge and a direct-mount Seymour Duncan Alnico II Pro APH-1N at the neck, routed through a 5-position blade switch and a 2-position mini toggle for series/parallel switching across all positions. A 500K EVH Bourns Low Friction volume pot and no-load tone control round out the wiring.

  Hardware includes a recessed Gotoh Custom 510 Tremolo with Gotoh tremolo arm, Charvel-branded die-cast locking tuning machines in chrome, Strat-style skirt knobs, and a parchment switch tip. The licensed Fender Stratocaster headstock and heel-mount truss rod adjustment wheel complete the platform.
