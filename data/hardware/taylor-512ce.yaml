description: The 512ce is a Grand Concert acoustic-electric from Taylor's 500
  Series, featuring a torrefied Sitka spruce top with solid red ironbark back
  and sides, V-Class bracing, and ES2 electronics — delivering a warm,
  piano-like balance with rich low end and midrange clarity.
details: |-
  The 512ce is a Grand Concert acoustic-electric from the 500 Series built with solid red ironbark back and sides — a tonewood with a deep low end reminiscent of Indian rosewood combined with mahogany-like warmth. Paired with a torrefied Sitka spruce top, it delivers a warm, piano-like balance with the openness and complexity of an aged instrument.

  Taylor's V-Class bracing provides enhanced intonation and sustain while preserving the tonewoods' nuanced dynamics. The Venetian cutaway allows comfortable upper-fret access on the compact Grand Concert body. Aerial-design fretboard inlays and abalone rosette add premium detail.

  Expression System 2 behind-the-saddle electronics capture the natural acoustic sound for amplified performance. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Concert
  - Top: Torrefied Sitka Spruce (solid, gloss)
  - Back/sides: Red Ironbark (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Tropical Mahogany (satin)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Scale length: 24-7/8"
  - Tuners: Taylor Nickel
  - Binding: Tortoise
  - Pickguard: Tortoise
  - Inlays: Aerial (Italian acrylic, faux pearl)
  - Rosette: Single-ring abalone
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
