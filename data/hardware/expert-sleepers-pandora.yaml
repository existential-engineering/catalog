description: Pandora is a bandpass filter and distortion processor for Eurorack,
  based on an unusual combination of power MOSFET transistors and vactrols.
  Voltage control is provided over the two sides of the filter, the gain, the
  filter feedback and the wet/dry mix.
details: |-
  Pandora is a bandpass filter and distortion processor, based on an unusual combination of power MOSFET transistors and vactrols. Voltage control is provided over the two sides of the filter, the gain and the filter feedback.

  A wet/dry mixer is provided, also under voltage control, so the amount of processed signal in the output can be modulated along with the filter and the drive.

  A range switch drops the filter response several octaves, at which point the module becomes capable of synthesising percussion sounds when fed trigger pulses.

  The module is 100% analogue, and the vactrols used in it are compliant with RoHS legislation.
specs: |-
  - Panel width: 8HP
  - Module depth: 42mm
  - Current draw: 69mA on the +12V rail, 58mA on the -12V rail
  - Inputs: CV inputs for filter Alpha, filter Beta, gain, feedback and mix
  - Inputs: audio input
  - Outputs: audio output
  - Bandpass filter built from power MOSFET transistors and vactrols
  - Range switch drops the filter response several octaves for percussion synthesis
  - Vactrols compliant with RoHS legislation
  - 100% analogue
