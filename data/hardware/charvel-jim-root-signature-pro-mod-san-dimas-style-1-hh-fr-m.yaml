description: Jim Root's punishing six-string barrage has been synonymous with
  Iowa metal institution Slipknot for over 20 years, and Charvel is honored to
  present the towering guitarist with his own super-heavy sounding,
  high-performance signature model. The guitar features a mahogany body with
  scalloped lower back bout, bolt-on maple neck with graphite reinforcement, and
  compound radius maple fingerboard for upper-fret access and playability.
details: |-
  The Jim Root Signature Pro-Mod San Dimas Style 1 HH FR M pairs a mahogany San Dimas Style 1 body (with scalloped lower back bout) and a Satin Black finish. The bolt-on maple neck features graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. A maple fingerboard with a 12"-16" compound radius hosts 22 jumbo frets and black dot inlays with Luminlay side dots, anchored by a Floyd Rose 1500 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics center on a pair of zebra (black/white) EMG Jim Root Signature Daemonum open-coil active humbuckers in the bridge and neck positions, routed through a 3-position blade switch and a single volume control.

  Hardware includes a Floyd Rose 1500 Series double-locking tremolo with locking tremolo arm, Charvel-branded die-cast locking tuning machines, a Floyd Rose retainer bar string tree, Strat-style skirt control knobs, and a black switch tip in a black hardware finish. The licensed Fender Stratocaster headstock, 4-bolt serialized neck plate, and heel-mount truss rod adjustment wheel round out the build. A Charvel multi-fit hardshell gig bag is included.
