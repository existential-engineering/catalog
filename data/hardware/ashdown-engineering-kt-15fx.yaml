description: The KT-15FX delivers 15 watts of tube-inspired warmth in a compact
  guitar amp built for versatility at home. It adds a 16-way digital effects
  unit (reverbs, delays, modulations) to the KT-15's Clean and Overdrive
  channels, plus a line input for jamming and a headphone output for silent
  practice, making it a complete all-in-one practice solution.
details: |-
  Compact 15-watt solid-state guitar practice amp with a built-in 16-way digital effects unit (reverbs, delays, modulations and more). Voiced for tube-inspired warmth. Line input for jamming along to tracks. Headphone output for silent practice. All-in-one practice solution delivering consistent Killer Tone.
specs: |-
  - Power output: 15 watts (solid-state)
  - 16-way digital effects unit (reverbs, delays, modulations)
  - Line input for jamming with tracks
  - Headphone output for silent practice
