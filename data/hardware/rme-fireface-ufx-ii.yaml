description: 60-Channel 192 kHz high-end USB audio interface with SteadyClock
  FS. RME's USB premium flagship interface offers improved AD/DA conversion,
  DC-coupled analog outputs, PAD-free mic preamps with 75 dB gain range,
  low-impedance high-power headphone outputs, professional DSP effects and
  monitoring via TotalMix FX, DURec (Direct USB Recording) for stand-alone
  recording to USB drives up to 2 TB, ARC USB remote compatibility, Class
  Compliant Mode, and AutoSet digital gain control.
details: |-
  The Fireface UFX II is RME's USB premium flagship interface, offering 60 channels (30 in / 30 out) at up to 192 kHz. It features SteadyClock FS for ultra-low jitter timing, improved AD/DA conversion, and DC-coupled analog outputs. The four front-panel XLR/TRS combo inputs offer PAD-free mic preamps with +18 dBu max input and 75 dB of gain range, plus high-impedance instrument inputs. The two front-panel headphone outputs are low-impedance (2 Ohm), high-power (+19 dBu, 200 mW @ 32 Ohm). TotalMix FX provides unlimited routing/mixing with professional DSP effects (EQ, dynamics, reverb, echo). DURec (Direct USB Recording) enables stand-alone recording of all 60 channels to a USB drive up to 2 TB via the front USB host port. Class Compliant Mode allows iOS use. The unit is compatible with the ARC USB remote controller and includes AutoSet digital gain control.
specs: |-
  - 60 channels (30 in / 30 out) total
  - Sample rates: 28 kHz to 200 kHz (up to 192 kHz)
  - USB 2.0 interface
  - 8x balanced line inputs (1/4" TRS) on rear
  - 4x mic/instrument combo inputs (XLR/TRS) on front
  - 2x XLR balanced monitor outputs (channels 1-2)
  - 6x balanced line outputs (1/4" TRS, channels 3-8)
  - 2x stereo headphone outputs (1/4" TRS, channels 9-12)
  - AES/EBU I/O (XLR, transformer-balanced, galvanically isolated)
  - 2x ADAT I/O (TOSLINK) supporting S/MUX and S/MUX4
  - SPDIF optical I/O (ADAT2 port, switchable)
  - Word Clock I/O (BNC, 75 Ohm switchable termination)
  - 2x MIDI I/O (5-pin DIN, galvanically isolated)
  - SteadyClock FS technology
  - AD line in SNR @ LoGain: 116 dB (AES17), 118 dBA
  - Mic preamp SNR @ 0 dB Gain: 117 dB (AES17), 119.5 dBA
  - Mic gain range: 75 dB
  - Mic max input level @ 0 dB gain: +18 dBu (no PAD)
  - Instrument input: servo-balanced, 1 MOhm
  - DA line out dynamic range: 115 dB RMS unweighted, 118 dBA
  - Headphone output: 2 Ohm impedance, +19 dBu max, 200 mW @ 32 Ohm
  - Max analog output level: +24 dBu (XLR monitor 1-2)
  - DC-coupled analog outputs
  - Internal clock jitter: 800 ps
  - Jitter suppression: > 50 dB (> 1 Hz)
  - TotalMix FX with EQ, dynamics, reverb, echo
  - DURec (Direct USB Recording) up to 2 TB
  - ARC USB remote controller compatible
  - Class Compliant Mode
  - AutoSet Digital Gain Control
  - Internal switching PSU, 100-240 V AC, 36 W
  - Idle power consumption: 19 W
  - Typical power consumption: 22-25 W
  - Dimensions with rack ears (WxHxD): 483 x 44 x 210 mm (19" x 1.73" x 8.5")
  - Dimensions without rack ears (WxHxD): 440 x 44 x 210 mm
  - Total depth: 240 mm (9.4")
  - Weight: 3 kg (6.6 lbs)
  - Operating temperature: +5° to +50° C
