description: Studio-grade preamp, EQ, and distortion generator in pedal form
  inspired by Neve console circuitry, featuring a three-band EQ with shift
  controls, Hi/Lo headroom switch, XLR/instrument input, and 48V phantom power
  pass-through.
details: |-
  In 2012, JHS founder Josh Scott had a crazy idea for a tone shaping device that had never been done before in the world of guitar pedals — replicating the hard-to-achieve sounds of "direct-in" electric guitar recordings. In 2014, as the first demo videos were filmed at Abbey Road Studios in London, this idea evolved into the most unique product JHS had ever made: a full-fledged studio-grade preamplifier, EQ, and distortion generator with multi-instrument compatibility.

  The Colour Box V2 has all the same functionality of the V1 with many new and improved additions including expanded EQ controls, a Hi/Lo switch for massive clean headroom, and the ability to pass phantom power to condenser mics.

  The Gain section has three controls: Master, Pre-Vol, and Step. The Master volume controls the overall volume of the unit. The Pre-Vol controls the amount of gain between the two internal gain stages, acting as a drive or gain control. The Step control increases the gain of each preamp stage in five stages: +18dB, +23dB, +28dB, +33dB, and +39dB.

  Version history: V1 = Smaller enclosure; no "shift" EQ knobs; seven knobs total. V2 = Larger enclosure; ten knobs total; added Hi/Lo Toggle; passes phantom power; output transformer addition.
