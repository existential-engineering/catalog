description: >-
  The Roland Juno-D is a budget-oriented digital wavetable synthesizer that
  revives the Juno name while departing from its classic analog predecessors. It
  offers 64-voice polyphony, 61 velocity-sensitive keys, and a streamlined
  interface with five front-panel knobs and a D-Beam controller for real-time
  sound manipulation. A Limited Edition variant doubled the waveform memory to
  64MB and expanded the patch library to 706 patches.
details: |-
  The Juno-D represents Roland's effort to bring the Juno legacy into the digital era as an accessible, entry-level synthesizer. Rather than recreating the analog sound of the original Juno series, it ships with 32MB of onboard waveform memory containing Roland's stereo multi-sampled piano samples, vintage synth sounds, and GM2-compatible patches organized into intuitive categories like Piano, Guitar, and Orchestra.

  Sound design capabilities include digital resonant filters, LFOs, and multi-effects processors with 47 multi-effect types, 8 reverb types, and 8 chorus types. The interface prioritizes ease of use with five front-panel control knobs and Roland's D-Beam controller for real-time parameter manipulation. A Mac/PC editor provides deeper sound programming for users seeking customization beyond the factory presets.

  A Limited Edition variant was also released, doubling the waveform memory from 32MB to 64MB and expanding patch storage to 706 total patches with 66 new designs. The Limited Edition introduced additional sounds including a realistic piano based on 88-key stereo multi-sampled waves, a massive rock organ, 80s-era brass and electric piano, and vintage synth sounds.

  The Juno-D also features a built-in rhythm guide with 32 preset patterns, 342 arpeggiator phrase and arpeggio templates, and 473 style variations, making it a versatile tool for practice and performance despite its budget positioning.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Keyboard: 61 keys with velocity sensitivity
  - Waveform Memory: 32 MB (64 MB Limited Edition)
  - Original Tones: 686
  - Patches: 640 (706 Limited Edition)
  - Drum Kits: 20
  - Performances: 32
  - User Patches: 128
  - Rhythm Guide Patterns: 32 presets
  - Arpeggiator Templates: 342 phrase/arpeggio, 8 user
  - Styles/Variations: 473
  - Multi-Chord Memory: 16 presets, 8 user
  - Multi-Effects Types: 47
  - Reverb Types: 8
  - Chorus Types: 8
  - Controllers: 5 front-panel knobs, D-Beam
  - MIDI: In/Out
  - Compatibility: GM2
