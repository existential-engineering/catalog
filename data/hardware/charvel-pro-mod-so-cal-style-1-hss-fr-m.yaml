description: More comfortable than an overstuffed armchair, the So-Cal body is
  sleekly sculpted out of alder and paired with a rock-solid bolt-on maple neck
  with a pair of graphite-reinforcement rods to handle the ravages of the road
  and climate.
details: |-
  The Pro-Mod So-Cal Style 1 HSS FR M pairs a sleekly sculpted alder So-Cal body in Gloss Black with a 1-ply black anodized aluminum pickguard, mated to a bolt-on maple neck with graphite reinforcement rods, a hand-rubbed satin urethane finish, and a Speed Neck profile engineered for nimble playing. The maple fingerboard has a 12"-16" compound radius, 22 jumbo frets, black dot position inlays with black side dots, a Floyd Rose 1000 Series locking nut (1.6875" width), and a 25.5" scale length. A heel-mount spoke wheel truss rod adjustment allows rapid tweaks between songs.

  Electronics are an HSS configuration with a Seymour Duncan Distortion TB-6 humbucker in the bridge position and a pair of Seymour Duncan Custom Flat Strat SSL-6 single-coils in the middle and neck positions. Wiring runs through a push/pull volume control, a no-load tone control, and a 5-position blade selector with custom routing: Position 1 - bridge; Position 2 - bridge inner coil + middle; Position 3 - bridge inner coil + neck inner coil; Position 4 - neck outer coil + middle; Position 5 - neck.

  Hardware includes a Floyd Rose 1000 Series double-locking tremolo bridge and Charvel-branded die-cast tuning machines, all in a chrome finish.
