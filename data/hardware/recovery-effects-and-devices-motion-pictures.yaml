  can be controlled via knob, tap tempo, or CV for glitchy, pitch-bending
  rhythmic effects.
details: |-
  Motion Pictures

  (Delay And Reverb)

  Motion Pictures combines lush delay and reverb with intuitive, powerful controls within a 10HP module. Choose between a crisp digital delay or a warm analog delay and pair it with a spacious, large-hall stereo reverb. Delay and reverb levels can be adjusted independently, allowing you to use them separately or together. The delay time can be controlled using a knob, tap tempo, or CV. You can even send opposing CV signals to the tap tempo and delay time for glitchy, pitch-bending, rhythmic effects. Additionally, CV control extends to the feedback, delay, and reverb levels, providing greater flexibility. Motion Pictures offers rich ambient sounds in a compact design, combining delay and reverb in one module to optimize rack space while preserving sonic depth. Designed and assembled in Seattle, Washington. (Motion Pictures Eurorack Manual)

