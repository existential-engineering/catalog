details: |-
  Formes, french for shapes , is a triple wave shaper allowing to shape a triangle signal into the following wave forms: sine, antisine, exponential, logarithmic, trapezoid, antitrapezoid and asymmetric folding. It pairs well with oscillators and ramps, but can also be used on a RGB source for contrast processing. Specs:

  - 8HP
  - 175mA +12V
  - 0mA -12V
  - 0mA +5V
  - 42mm deep

  Can be powered through standard Eurorack 16pin connector or DC barrel connector. User Guide
