url: https://www.engl-amps.com/shop/heads/ironball-e606/
description: The Ironball E606 is a 20-watt, four-channel, all-valve guitar
  amplifier head in lunchbox format, with a power soak down to 1 watt, built-in
  reverb, a headphone output and a balanced line output offering pure-signal and
  cabinet-simulated feeds.
details: |-
  The Ironball fits a great deal into a compact lunchbox format. Twenty valve watts can still be powerful, so the Powersoak reduces the output power to 5 watts or 1 watt, or deactivates the speaker output completely, which suits practising with headphones or recording late at night.

  The balanced line output carries both a pure signal and a cabinet-simulated feed, so the amp can go straight to a desk or an interface. A headphone output works alongside it.

  The Master Volume Boost (M.V.B.) provides a footswitchable boost of the master volume, effectively a second master volume. A lead presence control and built-in reverb round out the sound, on stage or in the studio.

  Four channels cover Clean, Crunch, Soft Lead and Heavy Lead, with gain controls for the Clean and Lead channels, a shared 3-band EQ, reverb, lead presence, lead volume and master. The preamp runs four ENGL ECC83 / 12AX7 valves into two ENGL EL84 output valves for 20 watts, through a valve-buffered serial FX loop and an 8 to 16 Ohm power amp output.
specs: |-
  - 4 channels: Clean, Crunch, Soft Lead, Heavy Lead
  - All-valve head
  - Power soak: full power, 5 watts, 1 watt, speaker off
  - Headphone output
  - Valve-buffered serial FX loop
  - Master Volume Boost (M.V.B.), footswitchable
  - Balanced line output with pure-signal and cabinet-simulated feeds
  - Sound option: Gain Boost
  - Controls: Gain (Clean and Lead channels), 3-band EQ (shared), Reverb, Lead Presence, Lead Volume, Master
  - Power amp output: 8 to 16 Ohm
  - Footswitch support: Z4 (channels, M.V.B., reverb)
  - Preamp valves: 4 x ENGL ECC83 / 12AX7
  - Output valves: 2 x ENGL EL84
  - Output power: 20 W
  - Dimensions: 34 x 14 x 22 cm
  - Weight: 7 kg
