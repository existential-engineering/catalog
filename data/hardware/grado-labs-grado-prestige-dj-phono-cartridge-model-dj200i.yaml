details: |-
  Grado Labs released their DJ series of professional phono cartridges designed to meet the demanding needs of professional DJ musicians. These cartridges feature a specially engineered transmission line cantilever that allows for the ideal transfer of music signal and for safe and effective stylus back-cueing. The DJ series tracks from 2 to 5 grams and delivers the warm musical Grado sound refined over 50 years. They incorporate the newest Flux-Bridger generator systems for lower effective tip mass and lower electrical inductance. Each cartridge undergoes hand assembly to Grado's standards, ensuring consistent performance and reliability.

  The Prestige model DJ200i uses modified four piece OTL cantilever technology, oxygen free wire in the coils and a specially designed, high polished, diamond mounted in a brass bushing.
specs: |-
  - Output: 4mV @ 3.54 CMV (45 degrees)
  - Frequency Response: 10-55k Hz
  - Channel Separation: Avg. 25dB, 10-30k Hz
  - Stylus: Diamond
  - Input Load: 47k ohms
  - Inductance: 47mH
  - DC Resistance: 475 ohms
  - Pickup weight: 6 grams
  - Tracking Force: 2-5 grams
