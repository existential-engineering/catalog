description: Clear Mg Professional is an essential work tool for the most demanding sound engineers and producers. Its open design provides a perfect sense of spatialization and immersion, revealing the smallest details with excellent dynamics for smooth transitioning between monitoring speakers and headphones.
details: |-
  Clear Mg Professional is an essential work tool for the most demanding sound engineers and producers. Its open design provides a perfect sense of spatialization and immersion. With the ability to reveal the smallest details, it offers excellent dynamics for smooth transitioning between monitoring speakers and headphones.

  Extreme precision: the 40mm loudspeakers feature a magnesium diaphragm for extreme precision. The tonal balance is remarkable, as is the quality of audio transfer and bass articulation. The open-back grille inside the earcup follows the "M" profile of the membrane as closely as possible to optimize efficiency.

  Comfort and openness: the design of the headband offers a constant curvature, ideal for wearing on the head. The solid aluminium yoke lacks the traditional vertical rotation mechanism, which is offset within the headband for even greater comfort.

  Dynamics and speed: with a break-up at 28 kHz, high frequencies are extremely linear and transients are respected. The headphones disappear in favour of the audio signal, whose transfer quality is uncompromising and even faster.

  Refined finishes: the outside of the earcups features an elegant honeycomb pattern. This opening also enhances the feeling of spatialization and improves the image of the soundstage. The yoke is covered in structured black paint for a sleek, scratch-resistant design.
specs: |-
  - Product type: open-back headphones
  - 40mm magnesium "M"-shaped dome drivers
  - Frequency response (+/- 3dB): 5 Hz - 23 kHz
  - Harmonic distortion rate: 0.25% @ 1kHz / 100 dB SPL
  - Impedance: 55 Ohms
  - Sensitivity: 104dB SPL / 1mW @ 1kHz
  - Weight: 450 g / 0.99 lb
  - Carrying case included (240 x 120 x 250 mm)
  - Replacement pads included
  - Cables provided: 16.5 ft (5m) coiled asymmetric cable (1/4" - 6.35mm TRS jack), 3.94 ft (1.2m) straight asymmetric cable (1/8" - 3.5mm TRS jack)
