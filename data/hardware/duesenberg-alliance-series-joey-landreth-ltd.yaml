description: This edition of the Joey Landreth Alliance Series comes in a
  spectacular new colour, Manitoba Green, which blurs the line between a classy
  metallic and a flashy sparkle finish.
details: |-
  The Alliance Series Joey Landreth Limited is a solid alder guitar in a contoured body, 46 x 34 cm with sides 4.2 cm high, carrying multi-layer binding, a cream pickguard, a poly finish and a matching colour headstock. Duesenberg describes alder as a bright and versatile tonewood and the solid construction as delivering instant response with plenty of attack and sustain. This run is the Manitoba Green edition, a metallic sparkle finish offered for order in 2026 only.

  The set neck is one-piece maple in a medium D shape with an Indian rosewood fingerboard at a 305 mm / 12 inch radius, cream dot inlays, 22 jumbo frets, a steel dual-action trussrod and a 648 mm / 25.5 inch scale. Duesenberg's Plek process levels the frets, which the maker presents as the basis for its hand fret polishing and setup work.

  Three pickups cover a wide range. Duesenberg's own reading of the classic gold-foil single coil sits at the neck for transparency and clarity, a classically wound Alnico single coil sits in the middle, and a custom version of the Duesenberg Phonico Splitking duo-coil design sits at the bridge, voiced for extra output and bite. The Split/King coil design is able to deliver both real single coil and real humbucker tones.

  Wiring runs one volume, one tone, a 3-way pickup selector and two mini-toggle switches on the pickguard. The 3-way gives bridge humbucker, bridge humbucker with neck single coil, and neck single coil alone; the upper toggle switches the bridge pickup between humbucker and single coil modes, and the lower toggle adds the middle single coil in any position.

  Hardware is nickel finished, with half-open Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge, the short version of the Duesenberg Radiator Tremola vibrato, and Duesenberg Standard Straplock-compatible strap pins. The instrument is strung with Duesenberg Custom 19/56 and ships with the Duesenberg Custom Line Case and all required allen keys as standard.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream Dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Matching Color
  - Body type: Solid Body, Alder
  - Dimensions: 46 x 34 cm / 18" x 13.4"
  - Height (sides): 4.2 cm / 1.7"
  - Pickguard: Cream
  - Binding: Multi-layer binding
  - Finish: Poly finish
  - Tuners: Duesenberg Z-Tuners half open
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Radiator Tremola, short version
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware finish: Nickel
  - Strings: Duesenberg Custom 19/56 (019-022p-024w-032-044-056)
  - Pickup (neck): Duesenberg Gold-Foil
  - Pickup (middle): Duesenberg Alnico Singlecoil
  - Pickup (bridge): Duesenberg Phonico Splitking Custom
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector, 2 Mini-Toggle Switches
  - Case: Duesenberg Custom Line Case (included)
  - Tools: All required allen keys (included)
