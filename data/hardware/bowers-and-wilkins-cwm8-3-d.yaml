description: CWM8.3 D is a three-way in-wall loudspeaker, with a Diamond Dome
  tweeter, 5-in Continuum midrange driver and two 7-in Aerofoil bass drivers.
details: |-
  CWM8.3 D is a three-way in-wall loudspeaker in the Bowers & Wilkins Reference Series, conceived to offer the very best performance for a customer who wants great sound without seeing the source. It is a passive design driven from an external amplifier: there is no on-board amplification and no mains connection.

  It features a decoupled Diamond dome tweeter, a 5in Continuum FST midrange drive unit and two 7in Aerofoil low-frequency drivers. The tweeter is a 25mm Diamond Dome in a Nautilus tube-loaded housing, and the midrange carries an anti-resonance plug. For optimum discretion when installed, the Continuum cone is given a dark finish.

  The central aluminium mini baffle can be turned through 90 degrees, so CWM8.3 D can be used in either vertical or horizontal alignment. Other technical features listed by Bowers & Wilkins are Flowport, the FST midrange unit and carbon Aerofoil bass drivers.

  The speaker is quoted at 89dB sensitivity into a nominal 8 ohm load with a recommended amplifier power of 200W, and a frequency range of 30Hz to 35kHz at -6dB. The frame measures 880mm by 254mm with a 864mm by 238mm cut-out, the bezel protrudes 8mm from the wall, and the unit weighs 10.9kg.

  A matching back box, BB CWM8.3, is offered for the installation.
specs: |-
  - Description: 3-way in-wall loudspeaker
  - Technical features: aluminium mini baffle can be turned through 90 degrees, Diamond Dome Nautilus tube-loaded tweeter, anti-resonance plug, Flowport, FST midrange unit, carbon Aerofoil bass drivers
  - Drive units: 1x 25mm (1in) Diamond Dome Nautilus tube-loaded tweeter, 1x 130mm (5in) Continuum cone FST midrange driver, 2x 180mm (7in) Aerofoil bass drivers
  - Frequency range (-6dB): 30Hz to 35kHz
  - Recommended amplifier power: 200W
  - Sensitivity: 89dB
  - Nominal impedance: 8 ohms
  - Frame height: 880mm (34.6in)
  - Frame width: 254mm (10in)
  - Cut-out height: 864mm (34in)
  - Cut-out width: 238mm (9.4in)
  - Protrusion: 8mm (0.3in)
  - Net weight: 10.9kg
  - Matching back box: BB CWM8.3
  - Finish: White
