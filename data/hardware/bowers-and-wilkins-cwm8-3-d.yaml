details: |-
  CWM8.3 D is a three-way in-wall loudspeaker, conceived to offer the very best performance for a customer requiring great sound without seeing the source.

  It features a decoupled Diamond dome tweeter, a 5in Continuum FST midrange drive unit and two 7in Aerofoil low-frequency drivers.

  The central baffle is rotatable, so CWM8.3 D can be used in either vertical or horizontal alignment.

  For optimum discretion when installed, the Continuum cone is given a dark finish. Other technical features include a Diamond Dome Nautilus tube-loaded tweeter, an anti-resonance plug, Flowport and carbon Aerofoil bass drivers.

  The loudspeaker is designed to be used with the matching BB CWM8.3 back box.
specs: |-
