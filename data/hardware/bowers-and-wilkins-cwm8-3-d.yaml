  - Technical features: aluminium mini baffle can be turned through 90 degrees, Diamond Dome Nautilus tube-loaded tweeter, anti-resonance plug, Flowport, FST midrange unit, carbon Aerofoil bass drivers
  - Drive units: 1x ø25mm (1in) Diamond Dome, Nautilus tube-loaded tweeter
  - Drive units: 1x ø130mm (5in) Continuum midrange driver
  - Drive units: 2x ø180mm (7in) Aerofoil bass drivers
  - Frequency range (-6dB): 30Hz - 35kHz
  - Recommended amplifier power: 200W
