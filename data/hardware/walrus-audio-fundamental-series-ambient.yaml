details: |-
  For the Fundamental Series, we challenged ourselves to design a set of pedals with the tonal integrity that’s required to live on a professional’s pedalboard, but with simplified controls friendly enough for even the newest effect pedal users. Each Fundamental pedal has three faders for tweaking the sound and a three-way switch for changing pedal modes. The result is a line of pedals that will keep you covered from your first band practice all the way to a sold-out arena. Designed and assembled at Walrus Audio headquarters in OKC, OK. Fundamental Ambient The Fundamental Ambient provides three different atmospheric reverb algorithms to explore beautifully vast and lush soundscapes with plenty of decay time for pillowy soft pad-like decay. Decay: Control the amount of reverb decay time. Left is the minimum and right is the maximum amount of time. Tone: Shapes the overall tonality of the reverb. On Deep and Lush this controls the cutoff of a synth-style lowpass filter. On Haze this controls the width of a resonant bandpass filter, filtering both high and low end at the right, and allowing more high and low to pass through at the left. Mix: Control the mix of the effect and the original clean signal. All the way to the left outputs only the fully clean signal, and all the way to the right outputs only the affected Reverb signal. Slide Switch – The slide switch allows you to change between three distinct Reverb algorithms. Deep – A dark ambient reverb with an added low octave, perfect for creating murky, cavernous sustain or adding a touch of moody atmosphere. Lush – A breathy, expansive reverb featuring ultra-long sustain. Perfect for generating silky pads and immersive soundscapes with every note. Haze – A textured, lo-fi reverb featuring distortion, sample rate reduction, and a resonant bandpass tone control, great for vintage or experimental tones. Trails Modes – The Reverb comes with trails mode active by default, to disengage trails mode hold down the bypass stomp switch when applying power to the pedal. Once the LED flashes it indicates that trails mode is turned off. To re-engage trails mode, repeat the process, and wait for the LED to turn dark, indicating that trails mode is back on. With trails mode active, your reverb decay will fade off naturally after turning the pedal off. With trails mode inactive, the decay abruptly cuts off when you turn off the pedal.
