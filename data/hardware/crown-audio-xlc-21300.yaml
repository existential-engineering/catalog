url: https://www.crownaudio.com/en-US/products/xlc-21300
description: Two-channel 1,300W power amplifier purpose-built for professional
  cinema applications, delivering clean, reliable power in a compact, versatile
  package.
details: |-
  The XLC 21300 is a two-channel cinema power amplifier delivering 1,000W per channel at 8Ω and 1,300W per channel at 4Ω. It pairs directly with the JBL CPi2000 cinema processor for screen and surround channel duties, and supports third-party control systems via built-in diagnostics.

  Operating modes include stereo, bridged mono, and dual-input Y for flexible signal routing in fixed cinema installs. Front-panel LEDs report Power, Signal, Clip, Bridged Output, and Fault status, while a rear-panel volume control sets channel gain at install time.

  Forced-air cooling handles long-duration playback in projection booths, and HD-15 input plus 4-pin barrier strip outputs match standard cinema wiring practice.
specs: |-
  - 2 channels
  - 1,000W per channel @ 8Ω
  - 1,300W per channel @ 4Ω
  - Input modes: Input Y, dual
  - Output modes: stereo, bridged mono
  - Load impedance: 4-8Ω per channel (stereo); 8Ω bridged
  - Sensitivity: 1.4V @ 4Ω
  - Signal-to-Noise Ratio: >100 dB
  - THD: <0.5%, 20 Hz-20 kHz
  - Forced-air cooling
  - Front-panel LEDs: Power, Signal, Clip, Bridged Output, Fault
  - Rear-panel volume control
  - Compatible with JBL CPi2000 cinema processor
  - Built-in diagnostics for third-party control systems
