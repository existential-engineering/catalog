details: |-
  The Harmony H62 Reissue is a stunning guitar that seamlessly blends vintage aesthetics with modern playability. It features a spruce top and a flame maple hollow body with F-holes, delivering beautifully warm and articulate cleans. The body is elegantly finished in a 2 Tone Sunburst, accentuated by cream binding that adds a touch of elegance. The maple neck, with a 42mm width and a "C" profile, provides a familiar and easy-to-play feel. The rosewood fretboard, with a 12" radius and medium jumbo frets, ensures smooth and accurate fretting. Adding to its vintage charm, this guitar features pearloid block inlays on the fretboard. Equipped with the Harmony-designed pickups, the H62 Reissue deliver beautifully warm and articulate cleans. The controls include volume and tone knobs, supported by a 3-way toggle switch with a Diamond Dark Brown Tortoise Celluloid cover, adding a touch of style. The guitar comes with a TOM bridge with a rosewood base and a chrome Lyre trapeze tailpiece, ensuring excellent sustain and tuning stability. It comes strung with 12-53 gauge strings and features chrome "ButterBean" button vintage tuners for accurate and stable tuning. The hardware finish is nickel, complementing the overall vintage look. Completing the aesthetics of this guitar are black bakelite control knobs and a tortoise shell pickguard. Whether you're a beginner or a professional guitarist, the Harmony H62 Reissue offers a perfect blend of classic design and modern performance, making it an exceptional instrument for any player.
