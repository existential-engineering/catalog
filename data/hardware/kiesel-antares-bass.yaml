description: The Antares Bass follows the Antares guitar, a model created to
  rival the Aries, with defined upper cutaways, elongated sharp horns and a
  deeply offset body. With the Darkglass preamp and 5 string configuration, it
  is the companion to its guitar counterpart.
details: |-
  The Antares Bass comes off the heels of the Antares guitar, a model created to rival the Aries. The shape features defined upper cutaways, elongated, sharp horns, and a deeply offset body to maximize the metal aesthetic.

  Pickup configurations: the Antares bass is available with either two JVA single-coil pickups, providing a modern spin on J-Bass tones, or the JVA and humbucking HB, adding warm and fat tones.

  Alongside the Antares Bass launch is the bass version of the Kyber Headstock, a shape that became popular immediately on guitar after the 2025 launch.

  To offset any possible neck dive, the body features a 1.3 lb, removable counterweight made out of stainless steel.

  Flowing along the treble side of the Antares Bass is a pointed satin black pickguard, bolstering the overall bold, aggressive aesthetic.
specs: |-
  - Scale length: 34"
  - Body: alder
  - Construction: bolt-on with radiused neck heel
  - Body dimensions: 46.25" long, 1.75" thick, 15" wide
  - Bridge: Hipshot A-Style bridge, .748" (19mm) spacing
  - Neck: tung-oiled maple with a 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.76" at the nut, 0.77" thick at the 1st fret, 0.88" thick at the 12th fret
  - Fingerboard: ebony, available with a 14" or 20" radius
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Headstock: Kyber style bass headstock
  - Pickups: two Kiesel JVA single coil pickups, or a JVA with the humbucking HB
  - Electronics: Darkglass preamp, master volume with push-pull active/passive switch, pickup blend, stacked concentric bass/treble
  - Hardware: chrome
  - Pickguard: black satin
  - Strings: Dunlop Super Brights
  - Weight: 8 lbs
  - Body carries a 1.3 lb removable stainless steel counterweight
  - The active Darkglass preamp runs on an internal battery, so the bass carries no power input jack
