details: |-
  The Miktek CV3 is a large-diaphragm tube condenser ­microphone offering nine pick-up patterns. The CV3's sound is truly large and produces a musical response that will please artists, producers and most seasoned engineers alike. The bottom end is big, warm and tight, with mids that are present and even, along with a high frequency response that's sweet and airy. The CV3 is ideal for recording single vocalists, and perfect for acoustic instruments, groups of vocals, piano, string ensembles, winds, overheads on a drum kit or as ­ambient room mics. Specifications

