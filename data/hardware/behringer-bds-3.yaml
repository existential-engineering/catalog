url: https://www.behringer.com/en/products/0718-aca
description: Four-channel analog drum synthesizer reproducing the circuitry of a
  late-1970s original, where synthesized percussion is triggered from an audio
  signal so a mic'd drum plays a velocity-sensitive synth voice. It adds a
  special effects channel, four independent analog outputs, MIDI and USB
  triggering, and a main module that can be transferred to a standard Eurorack
  case.
details: |-
  Back in the late seventies, drum synthesis was opening new creative frontiers. Among the early pioneers, one machine stood out for its bold approach to percussive sound design. It allowed creators to trigger synth textures from any audio signal, transforming a simple mic'd drum into a powerful and expressive percussion instrument. Today, with the classic units long since turned into rare collector pieces, that philosophy lives on in the BDS-3 as a fresh and inspiring way to add synthesized percussion to your music.

  BDS-3 is an authentic reproduction of the original circuitry from the '70s, which means it has all the same quirks and characteristics that so many musicians loved with the original release, with some features updated to make it compatible with a wide range of modern setups.

  BDS-3 features 4 identical drum channels that have controls for adjusting different elements of a beat. You can add a click at the start of a sound (similar to a stick hitting a drum), adjust decay, bend a note up or down, change the pitch of a signal coming through as well as the range of LFO and effects from the Master/Effects section. The most fun way of triggering the channels is by mic-ing up a drum to each of the channels and just playing. The inputs are even velocity sensitive and responsive to your playing dynamics.

  The Master/Effects section of BDS-3 affects all four channels. Here you can adjust overall pitch, LFO rate, range, shape (between square or sine wave), Run Time and Output Level. Aside from triggering effects via mic input, you can also trigger BDS-3 via MIDI or USB. Combined, everything about BDS-3 allows you to give color and a lot of personality to your songs, making for an exciting playing and listening experience.

  Designed to handle the rigors of life on the road or in the studio, BDS-3 can easily be transferred to any standard Eurorack case for the perfect integration into your setup.
specs: |-
  - 4-channel analog drum synthesizer, authentic reproduction of the original circuitry of a classic 1970s polyphonic drum synthesizer
  - 4 identical drum channels with separate controls for click, decay, bend, pitch, noise and assignable decay kill
  - Special effects channel for sound modulation effects
  - Master/Effects section affecting all four channels, with overall pitch, LFO rate, LFO range, LFO shape (square or sine), Run Time and Output Level
  - Velocity-sensitive trigger inputs, responsive to playing dynamics, which can be fed directly from a microphone on a drum
  - Sounds can be triggered via analog control input, MIDI or USB
  - 4 independent analog outputs for external processing and recording
  - 57 controls for direct real-time access to all important parameters
  - Comprehensive MIDI implementation with MIDI channel, Velocity and Voice Priority selection
  - Eurorack format: the main module can be transferred to a standard Eurorack case
  - Editable with the SynthTribe app (Windows and macOS)
