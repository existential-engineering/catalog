details: |-
  The DW Collector's Series is a pinnacle in custom-made drums. Designed and handcrafted in the DW California custom shop, the Collector's Series offers quality, elegance, and performance fit for the touring or recording professional and the passionate player or collector.

  This DW Collector's Series Solid Maple snare drum features a shell crafted from a single piece of maple. This snare offers the full warm tonality of maple with classic fat attack.

  The drum is also fitted with the famed MAG throw-off, five-position butt plate, True-Tone Snare Wires, True-Hoops, and DW Heads by Remo U.S.A. It carries a hand-rubbed natural satin oil finish.
specs: |-
  - Solid North American Maple shell
  - MAG throw off
  - 5-position butt plate
  - True-Hoops
  - True-Tone snare wires
  - DW Heads by Remo U.S.A.
  - Hand-rubbed natural satin oil finish
  - Size: 5.5x14
