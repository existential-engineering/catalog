details: |-
  Producing a pure, well-rounded sonic footprint, Legacy Series revives the distinctive sound that set the standard for popular music throughout the 20th Century.

  Ludwig and Ludwig's 3-ply shell formula was unveiled in 1923; at the time touted as being built "...in accordance with the recognized correct principles used in the manufacture of airplanes." This classic construction evolved into a sound that captured the attention of generations of drummers.

  The key to Legacy's classic tone begins with a cross-laminated American Poplar center ply to lend focus to the warm rich low-end "woody" tones of inner/outer Mahogany plies. This unique shell combination is further stabilized by a specially rounded bearing edge with 1/4" solid maple reinforcement rings.

  Sound profile: Warm dark tones. Bold bottom end combined with soft mids and highs.
specs: |-
  - Shell construction: 3-ply (1/16" Mahogany outer ply, 1/8" Poplar core ply, 1/16" Mahogany inner ply)
  - Reinforcement: 1/4" Solid Maple reinforcement rings
  - Bearing edge: 30-degree inner cut with 1/4" radius round-over
  - Snare sizes: 14"x5", 14"x6.5"
  - Tom sizes: 10"x7", 12"x8", 13"x9", 14"x10"
  - Floor tom sizes: 14"x14", 16"x16", 18"x16"
  - Bass drum sizes: 18"x14", 20"x14", 22"x14", 24"x14", 26"x14"
  - Available finishes: Black Hybrid Sparkle, Copper Hybrid Sparkle, Moss Green, Black Oyster, Vintage Mahogany, White Marine, Classic Olive Pearl, Aged Onyx, Sky Blue, Vintage White Marine, Digital Black Sparkle, Blue Sparkle, Green Sparkle, Gold Sparkle, Red Sparkle, Silver Sparkle, Vintage Black Oyster, Vintage Blue Oyster, Mod Orange, Blue Olive Oyster, Olive Oyster, Citrus Mod, Vintage Pink Oyster
