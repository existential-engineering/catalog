description: A two-channel overdrive pedal built to be as lustrous and
  distinctive as the elusive DUMBLE amplifiers, pairing a clean-to-crunch Normal
  channel with a dedicated drive circuit module and an internal boost supply.
details: |-
  OVERDRIVELAND was born to be as lustrous and distinctive as the elusive DUMBLE amplifiers that are now hard to come by, so that players can express their own personalities through it. Free The Tone's founder and designer, Yuki Hayashi, spent more than twenty years maintaining and repairing DUMBLE amplifiers and owned several himself. Those amplifiers are known for harmonics that can make even a clean sound seem slightly distorted, and for a drive sound that responds to a player as though the amplifier had intentions of its own. Capturing that feel in a pedal-sized overdrive is what started the development.

  For the fundamental circuit, the Normal channel, the designer chose to use no clipping diodes and no LEDs, because they made the intended harmonic components hard to achieve. Raising the GAIN on the Normal channel brings in gradual distortion, and even below the twelve o'clock position the clean sound still carries rich harmonic content. After that basic circuit came a newly developed dedicated drive circuit module, built to respond finely to the signal coming out of the guitar; the standard version and the Custom Shop version use different modules to bring out their respective characters.

  The pedal is two sections. When the Normal channel is selected the signal passes through the Normal channel circuit, which contains the TONE circuit with its EQ ON/GLASS switch and the gain shaping of the ROCK/JAZZ switch. EQ ON activates the TONE circuit, while GLASS bypasses it for a glassy tone reminiscent of a Blackface Fender Vibroverb with the Bright switch engaged. ROCK raises gain while slightly reducing it in the low range so the amplifier's input stage is not overdriven by excessive low end; JAZZ lowers overall gain and brings out richness in the low frequencies.

  When the Drive channel is selected the Drive circuit is added in front of the Normal channel, so the signal order from the input is drive circuit, Normal channel circuit, output circuit. The Drive circuit carries a HI-CUT filter for setting high-frequency character, and the PUSH control sets how much signal the Drive circuit sends into the Normal channel input, which is what controls perceived volume. NOR LEVEL and DRV LEVEL set the volume of each channel independently.

  A power supply boost circuit can raise the voltage feeding the analogue circuit from DC9V to a maximum of DC19V, and the switch chooses between the external DC9V input and Int.PS, the internal boost at DC14.5V on this standard version. Changing that voltage moves the clipping point: lower voltage lowers the clipping level and gives long sustain, higher voltage raises it for a sound that cuts through. The HTS (Holistic Tonal Solution) circuit, unlike a traditional buffer, converts impedance while preserving the guitar's character, keeps sound quality intact when the effect is off, and keeps the output in phase with the input. Current consumption is 95 mA at DC9V, but a significant inrush current flows at power-on, so Free The Tone recommends a supply able to deliver 200 mA or more.
specs: |-
  - Input impedance: 500 kOhm or higher
  - Output load impedance: 10 kOhm or higher
  - Controls: NOR LEVEL, DRV LEVEL, TONE, GAIN, PUSH, HI CUT, DRIVE, EQ ON/GLASS switch, ROCK/JAZZ switch, DC9V/Int.PS switching switch
  - Connectors: 1/4-inch standard phone jacks (input, output), DC9V input jack (AC adapter jack)
  - Power supply: DC9V battery (9V type 006P) or AC adapter
  - Current consumption: DC9V 95 mA (use a power supply able to deliver 200 mA or more, because a significant inrush current flows at power-on)
  - Internal boost supply raises the analogue circuit voltage from DC9V to DC14.5V on the Int.PS setting
  - HTS (Holistic Tonal Solution) circuit, output in phase with the input
  - Size: 97D x 120W x 51H mm (including protrusions like footswitches and jacks)
  - Weight: approx. 350 g (excluding battery)
  - Accessories: warranty card, website access card, safety precaution, 4x rubber feet
