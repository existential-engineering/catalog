description: The flagship model of Free The Tone's ARC Series routing
  controller, reborn as the ARC-4 by greatly enhancing its predecessor's
  functions in order to handle systems that are growing increasingly more
  sophisticated. Eight effect loops, named banks and presets, a setlist mode,
  MIDI clock support and hands-on stereo loop, boost and phase invert functions.
details: |-
  The ARC-4 is the flagship of Free The Tone's ARC Series audio routing controllers, built out of its predecessor to handle increasingly sophisticated rigs. Banks and presets can now be named, a Setlist mode combines banks into setlists at will, and MIDI clock support and a Bank Select function make it straightforward to run in step with external sequencer software. Stereo Loop, Boost and Phase Invert round it out for concert and recording work.

  Tone quality rests on the maker's Holistic Tonal Solution, the HTS Circuit, placed at the signal input and output. With it the amplifier downstream always receives a signal at a constant impedance whatever combination of effects units is connected, and the effected and bypassed sounds keep the same sound quality. Durability was established through repeated testing in harsh environments, primarily at concert venues.

  The unit carries eight effect loops: seven series loops, of which five are monaural and two stereo, plus one separate loop. Memory runs to 200 banks of 10 presets, 2,000 in total, and presets, banks and MIDI channels can all be labelled, so tone names, tune titles and connected device names travel with the data.

  On the MIDI side, program change and control change numbers can be sent at the same time, with 16 parallel program change sends and 8 parallel control change sends. MIDI clock is both sent and received, reception being supported as MIDI THRU.

  Footswitches sit 80 mm apart, with the first and second rows staggered to keep the panel compact, and two dedicated displays cover presets and configuration with shallow edit menus. Each footswitch LED is covered by a lens so sweat cannot reach the internal circuits, a felt sheet protects the back of the display unit, and high-strength moulded plastic phone jacks are used throughout. The output level of OUT-A and OUT-B can be set individually by the boost function over a 0 to +14 dB range, a Lock function protects the panel buttons during performance, and a universal AC adapter accepting 100 to 240 VAC is included.
specs: |-
  - Number of effect loops: 8 [series loops 7 (monaural 5, stereo 2), separate loop 1]
  - Number of presets: 200 banks x 10 presets, 2,000 presets in total
  - Control terminals: 4 (latch or momentary operation switchable)
  - Input impedance: 1 Mohm (HTS-IN)
  - Output load impedance: min. 10 kohm (HTS-OUT / OUT-A / OUT-B)
  - Boost range: 0 to +14 dB
  - MIDI program change parallel sends: 16
  - MIDI control change parallel sends: 8
  - MIDI clock sending and receiving supported (receiving supported as MIDI THRU)
  - Power supply: dedicated AC to 12VDC adapter, universal 100 to 240 VAC input
  - Current consumption: approx. 750 mA
  - Dimensions: 386 (W) x 152 (D) x 81.5 (H) mm, including protuberances such as footswitches and jacks
  - Weight: approx. 2.1 kg (excluding accessories)
  - Footswitch spacing 80 mm, first and second rows staggered
  - HTS Circuit and Phase Invert function implemented
