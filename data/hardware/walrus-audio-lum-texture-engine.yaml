description: Lüm seeks to illuminate your path with three unique granular and
  textural reverb modes, momentary automation, and presets.
details: 'Lüm seeks to illuminate your path with three unique granular and
  textural reverb modes, momentary automation, and presets. Drawing on elements
  of the Slö Reverb, Lore Reverse Reverb, and Fable Granular Generator, Lüm
  takes your audio signal and fractures it into tiny "grains" wrapped in
  different washes of reverb to create sporadic and atmospheric textures.
  FEATURES Create immersive backdrops that move and shift with every note to
  blur the line between instrument and ambient sound design with three unique
  modes: Moment Control - Lüm allows you to automate any one of the five knobs
  by holding the Moment switch to glide to a defined target, adding dynamic,
  expressive motion in real time. Ramp - Holding Bypass and adjusting the Mode
  toggle allows you to adjust the automation glide time between 10 ms, 1000 ms,
  and 5000 ms. Stretch Engine - Globally shift the sample rate from 0.5x to 2x
  speed, stretching time, and interacting uniquely with grain size, reverb
  decay, and filter tone. Presets - Save and recall up to three onboard presets
  (Red, Green, Blue). Sounds fade seamlessly between presets for smooth live
  transitions. Bypass Modes - Choose between Trails for natural decay or Instant
  Cut for abrupt, rhythmic stops.'
specs: |-
  - Mode I - Grain Cloud: A granular texture built from dual taps reading from a feedback delay line. The X knob controls the grain size, or how frequently you’ll hear the “glitches” happen. Experiment stacking with other modulated or wet effects on your board to create all-new sounds.
  - Mode II - Grain Verb: A granular reverb built from dual taps reading from the delay memory of a reverb algorithm tank. The result is a dense, washed-out texture where grains are fully embedded in reverb. Almost as if the grains just took a bath in reverb. The X knob controls the grain size, or how frequently you’ll hear the “glitches” happen. Tip - Lüm is a treat to put before high-gain pedals in mode two.
  - Mode III - Forward / Reverse Verb: A forward reverb algorithm running into a reverse reverb algorithm. You’ll hear a playful rhythmic interaction between the forward and reverse reverbs. Use the Stretch knob to change how fast or slow this interaction is. The X knob controls the reverse reverb decay.
  - Buffered Bypass (Trails or Instant Cut selectable)
  - Input Impedance: 1M Ohms, Output Impedance: 100 Ohms
  - Power: 9V DC, 100mA minimum, center negative
  - Dimensions: 4.77" x 2.6" x 1.39"
