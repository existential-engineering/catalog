description: A germanium-based drive pedal combining a vintage console-style
  drive circuit with a versatile filter, spanning dirty boost to fuzz tones.
details: |-
  TRUE VINTAGE DISTORTION. The Germanium Filter is our love letter to sticking a pencil through your speaker. Start with a console-style drive circuit, made from obsolete germanium transistors, and finish it off with a super intense DBA-style filter, and BLAMO! You’ve got a sound heavy enough to crush and sharp enough to slice. The Filter control is extremely versatile - it’ll take you from bottomless, sub-woofered out lows to super searing and brittle highs, with a universe of tone in between. The Gain control starts with a dirty boost that then spans through saturated drive, spitting distortion, and a blistering fuzz tone. Get ready for your sound to be Germaniumized! Controls Filter Controls the frequency response of the pedal, featuring huge low end, scooped mids, and sharp, piercing highs. Gain Sweeps from mild overdrive to blasted-out fuzz. Very interactive with your guitar’s volume control. Volume (internal) Controls the overall output level of the pedal. Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 5 mA Physical Details Dimensions: 5" x 2.5" x 2.25" (including hardware) Weight: 10.6 oz. Sound Samples Mustang Guitar Clean Boost Thick N Low Pushed Amp Scoop All Out Blast Jazz Bass Pretty and Pushed Fuzzy Drive Dark Grind Console Overload
