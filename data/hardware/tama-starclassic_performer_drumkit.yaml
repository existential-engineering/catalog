description: Evolution of Sound, Undeniable Expression. Tama's Starclassic
  series has been constantly evolving since 1994 to provide discerning drummers
  with acoustic variation, rock-solid professional performance and sensible
  value.
details: |-
  MTH800 Double Tom Holder: TAMA's MTH800 Double tom holder features 10.5mm arms and ball/socket design for multi positioning and locked-in stability. Additional positioning is achieved through TAMA's unique single Swivel Wing, which rotates to provide exact ergonomic placement.

  EVANS® Heads: EVANSR G1 coated batter and TAMA clear single-ply Power Craft II resonant heads are equipped on the toms. Bass drums include EVANSR clear EQ4 batter heads, Tama resonant head with muffle ring. Snare drums are fitted with EVANSR G1 coated batter heads and EVANSR 300 snare-side head.

  Shells (Maple/Birch): TT/FT/SD: 6mm, 4ply Birch + 2 inner ply Maple BD: 7mm, 5ply Birch + 2 inner ply Maple The combination of maple/birch projects with the warmth of maple and the clarity of birch. Tones are clean, articulate and very well balanced.?The voice around the kit blends clearly, the die-cast hoops produce clear, punchy, full tones.

  Star-Cast Mounting System: The Star-Cast Mounting System has always provided maximum resonance and stability for TAMA's pro-drums. A streamlined design makes it easier to position toms closer together for greater ease and comfort.
