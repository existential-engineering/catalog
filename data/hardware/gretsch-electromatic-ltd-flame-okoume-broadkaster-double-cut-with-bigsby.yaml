details: |-
  Elegant and powerful, our Limited Edition Electromatic Broadkaster Center Block guitar delivers uncompromising Gretsch power and fidelity in stunning style. Featuring a beautiful flame okoume double-cutaway body, rosewood fingerboard, USA Full'Tron pickups, jeweled G-Arrow control knobs, and gold hardware, the elegant style and premium sound quality of this Limited Edition Broadkaster is sure to turn heads.

  Flame Okoume Body with Spruce Center Block: The Limited Edition Broadkaster Center Block guitar features a laminated flame okoume body with a chambered spruce center block. Offering lightweight comfort and excellent feedback rejection, the spruce center block provides an open and airy sound while still retaining clarity, snap, and attack.

  Thin "U" Mahogany Neck with Rosewood Fingerboard: The Thin "U" shaped mahogany neck provides exceptional feel and playability, and is topped with a 12" radius rosewood fingerboard that provides warm, rich tone and a smooth, comfortable feel.

  USA Full'Tron Pickups: In addition to classic Gretsch chime, balance, and brilliance, the U.S.-made Full'Tron humbucking pickups were designed by the famed Tim Shaw to deliver full-spectrum sonic range with a distinctive snarl, offering a slightly more pronounced mid concentration that brings even more tonal muscle to full-volume playing with overdrive and distortion.
