name: BloodMoon
manufacturer: mr-black
primaryCategory: pedal
categories:
  - reverb
url: https://www.mrblackpedals.com/products/bloodmoon
description: A lush ambient reverb built on the classic SuperMoon foundation,
  adding a full wet/dry mix and a thick, fluid reverb voicing. Made in the
  U.S.A.
details: |-
  The BloodMoon is built on the foundation of Mr. Black's classic SuperMoon
  reverb, but adds a full wet/dry mix and a fluid, thick reverb voicing that leans
  darker and moodier than its sibling.

  It produces stunning, lush reverb with dynamic, proprietary Sway modulation, and
  its lossless wet/dry mix is 100 percent wet capable. Reverb trails extend up to
  30 seconds, and the pedal is noted for pairing especially well with distortion.

  It is daisy-chain friendly and proudly made in the U.S.A. The pedal uses a
  standard stompbox layout with a 1/4-inch input and output and 9VDC pedal power or
  an internal battery.
specs: |-
  - Stunning, lush reverb
  - Dynamic, proprietary Sway modulation
  - Full, lossless wet/dry mix control (100% wet capable)
  - Up to 30 seconds of fluid reverb trails
  - Excellent with distortion
  - Daisy-chain friendly
  - Input Impedance: ~500KΩ
  - Output Impedance: ~2KΩ
  - Frequency Response: ~15.6Hz - ~22KHz
  - True-bypass
  - 9VDC 2.1mm negative center-pin power or internal 9V battery (not included)
  - Current Draw: <60mA
