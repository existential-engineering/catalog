description: A 500-series ribbon preamp and EQ with high-frequency and
  low-frequency shelving controls, 10KΩ input impedance, and AEA's signature
  high-gain, low-noise JFET topology optimized for passive ribbon microphones.
details: |-
  The AEA RPQ500 Ribbon Preamp and EQ provides one channel of high-output, high-impedance, and low-noise gain with a rich and natural sound that brings out the full potential of your microphones. Specifically designed for ribbon microphones, the RPQ500 excels at drawing out the warmth and lush sound that ribbons are uniquely known for.

  The RPQ500 features a musical EQ section with high-frequency and low-frequency shelving controls. The high-frequency filter boost enables you to add presence and air to your source — perfect for ribbons and 2-busses that often benefit from some extra top-end. The low-frequency control easily removes bass build-up in a fast and unobtrusive way.

  The RPQ500 boasts an extra high input impedance of 10KΩ. Preamps with an impedance of under 10K ohms will limit the lows, highs, and transients of your passive microphones. The RPQ500's high impedance will reveal your microphone's true nature — a thick low-end, open top-end, and articulate transient response.

  All AEA Ribbon Preamps share the same topology and sound — the differences between each unit come down to extra features and form factor.
specs: |-
  - 500-series (API-compatible) format module
  - One channel of mic preamplification with EQ
  - High input impedance: 10KΩ
  - High-frequency shelving EQ boost for presence and air
  - Low-frequency shelving EQ for bass control
  - Phantom power support
  - High-output, low-noise gain
  - Designed for ribbon and passive dynamic microphones
