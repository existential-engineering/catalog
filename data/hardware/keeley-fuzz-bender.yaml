description: A five-knob, three-transistor hybrid fuzz with silicon and
  germanium fuzz stages, active gyrator bass and treble controls, and a Bias
  control for note attack and decay.
details: |-
  The Fuzz Bender is a five-knob, three-transistor fuzz that combines high-gain silicon with germanium. Two gyrators work as an active EQ, giving over 20 dB of boost or cut at 100 Hz and 10 kHz, which allows fuzz voicings that a typical square-wave circuit cannot reach.

  The circuit is built around vintage Japanese germanium transistors. A Bias control sets the attack and decay of each note, covering fat square waves, angular fuzz and glitchy, velcro-like attacks.

  The pedal is intended for guitar and bass. Input and output jacks are top mounted, the bypass is true bypass, and the unit is designed and made in the USA.
