id: lo0wBqYdjJM8kbgvnyLxo
name: Alpha·Omega 900
manufacturer: darkglass-electronics
primaryCategory: bass-amplifier
url: https://www.darkglass.com/products/ao900
description: The Alpha·Omega 900 is a 900-watt solid-state bass amplifier head
  combining Darkglass' signature Alpha and Omega drive engines with a VCA
  compressor, 6-band EQ, IR cabinet simulation, and MIDI remote switching.
details: |-
  The Alpha·Omega 900 takes the best elements of Darkglass's most successful distortion preamplifier and combines them with state-of-the-art features to make a monstrous 900-watt amplifier with earth-shattering tone.

  Its acclaimed Alpha and Omega drive engines let players dial in harmonic richness and sonic girth, while a VCA compressor controls dynamics and fattens the tone. A 6-band EQ provides powerful tone-shaping, and memory for 3 IR cabinet simulations (uploadable via USB) feeds the direct and headphone outputs. A Passive/Active switch optimizes performance for passive or active bass pickups.

  Connectivity includes dual TS/speakON speaker outputs with 4-ohm or 2-ohm functionality, direct outputs for both pre- and post-processed signals, an aux input and headphone output for practicing along with a music player, and a MIDI input for remote switching.
specs: |-
  - 900-watt solid-state bass amplifier head
  - Dual TS/speakON speaker outputs, with 4-ohm or 2-ohm functionality
  - Direct outputs for both pre- and post-processed signals
  - Passive/Active switch optimizes performance for passive or active bass pickups
  - Aux input and headphone output for practice
  - Alpha and Omega drive engines for harmonic richness and sonic girth
  - VCA compressor for controlling dynamics
  - 6-band EQ for tone-shaping
  - Memory for 3 IR cabinet simulations, uploadable via USB
  - MIDI input for remote switching
