description: A premium high-performance Dinky-shaped electric guitar pairing a
  basswood body with a quilt maple top and a caramelized maple neck with
  graphite reinforcement, loaded with Seymour Duncan humbuckers and a Charvel
  HT6 string-through-body hardtail bridge.
details: |-
  The Pro-Mod Plus Dinky DK24 HH HT E QM combines sophisticated style with assertive tone. A Dinky-shaped basswood body wears a gloss-finished quilt maple top, with a sculpted shredder's cut heel and a scalloped lower back bout for unhindered upper-fret access.

  The bolt-on caramelized maple neck is reinforced with graphite and finished in natural satin. An ebony fingerboard with a 12"-16" compound radius hosts 24 stainless steel jumbo frets, 4mm pearloid dot inlays, and Luminlay side dots for low-light visibility. Rolled fingerboard edges and a Graph Tech TUSQ XL nut (1.6875" wide) complete the playing surface, all on a 25.5" scale length.

  Electronics are an HH configuration: a Seymour Duncan Full Shred TB-10 at the bridge and a Seymour Duncan Alnico Pro II APH-1N at the neck, both direct-mounted. Controls include a 500K EVH Bourns Low Friction volume pot, a no-load tone, a 5-position blade selector, and a 2-position mini toggle for series/parallel switching.

  Hardware comprises a Charvel HT6 string-through-body hardtail bridge and Charvel-branded die-cast locking tuners in chrome, topped by a licensed Fender Stratocaster headstock with a heel-mount truss rod adjustment wheel. A Charvel Deluxe Gig Bag is included.
