description: A passive dual stereo low-pass filter module in 2hp Eurorack
  format, useful for submixing, tone control and cutting high frequencies.
details: |-
  Let's talk about filters - not your usual, souped up, CV controlled stereo-enabled monstrosity, but just regular old filters for EQ'ing and smaller filtering duties. That's this, right here - but in stereo, with a wide range and with a highly useful slide pot. What's it useful for, you ask? Any task where you'd like to user a filter, but sacrificing an entire filter module might be overkill. Submixing and cutting out the highs of a signal, feedback, amplifying the lows in a bass drum, tone control - there are many reasons you would want a passive low pass filter. Two, even! Either one for your left and right input, or one for two different but linked mono inputs. Neat! This filter is fully passive, only 2hp and skiff friendly with a very shallow installation depth. It's also particularly good looking in black and gold.
specs: |-
  - Dual 1-pole passive filter units
  - Internal normalization allows use as mono 2-pole filter
  - Approximate frequency range (dependent on signal chain): 33 Hz to 33 kHz
  - High quality components and analog design
  - Passive design: no power required
