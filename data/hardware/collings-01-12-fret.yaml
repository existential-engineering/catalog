description: The 01 12-Fret is a Single-0 size acoustic guitar featuring softer
  contours and a longer body dimension that produce a balanced and full tone
  with slightly more bass and overall volume. Built with a comfortable short 24
  7/8" scale, it works well for both fingerstyle and strumming techniques and
  excels as a recording instrument.
details: |-
  The 01 12-Fret is a Single-0 (0-size) acoustic guitar where the 12-fret neck joint places the neck heel closer to the body for easier upper-register access while retaining the pre-war aesthetic and feel. The softer contours and longer body dimension of the Single-0 shape produce a balanced and full tone with slightly more bass and overall volume than the 00-size, making it well-suited for both fingerstyle and strumming.
specs: |-
  - Top: Sitka spruce
  - Back & sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony with MOP short dots
  - Bridge: Ebony pyramid-style
  - Nut: Bone
  - Saddle: Bone
  - Tuners: Nickel Waverly
  - Bridge pins/end pin: Ebony with MOP dot
  - Scale length: 24 7/8"
  - String spacing: 2 5/16"
  - Bracing: Pre-war scalloped X-brace (Sitka spruce)
  - Neck profile: Modified V
  - Body width: 13 3/4"
  - Body length: 19"
  - Body depth: 4"
  - Total length: 37 3/4"
  - Finish: High gloss nitrocellulose lacquer
