description: Constellation is an 8 channel eurorack pattern generator that
  combines multiple dense and sparse euclidean rhythms to create complex trigger
  and gate patterns. It offers CV control over rhythm parameters like clock
  division, rotation, burst, ratchet and probability.
details: |-
  Constellation is an 8 channel pattern generator that combines multiple dense and sparse euclidean rhythms to create longer, more complex and musically interesting trigger and gate patterns for your eurorack system. Since Euclidean rhythms are derived from numeric parameters and these parameters can be modulated with control voltage, constellation allows for CV control over all aspects of rhythm generation. These triggers and gates can be used with envelope generators, drum modules, CV sequencers and much more
