details: |-
  The TPS80W is a high power, super efficient and low noise studio grade power system for your Eurorack Modular. Intellijel carefully designed this power supply to perform optimally with even the most demanding, noisy and power hungry modules in your rig. The TPS80W is recommended for cases up to 6U x 104hp in size.

  It is built around an 80 Watt integrated switching power supply with low impedance star distribution on a 4 layer PCB, delivering +12V at 3000 mA, -12V at 3000 mA, and +5V at 1500 mA. A triple 120° phased controller keeps induced noise low, and the design includes output short circuit protection with foldback current limiting, output overvoltage protection from transient overshooting, soft start for controlled start up operation, and +/-1% output voltage accuracy.

  The board fits comfortably in an 84HP 3U case or 6U case and larger, measures 34cm wide by 8cm tall with a max height of 20mm, and its mounting holes can be used with 0.157" / 4mm PEM snaps for quick install.
specs: |-
  - 80 Watt integrated switching power supply
  - +12V output at 3000 mA (3A)
  - -12V output at 3000 mA (3A)
  - +5V output at 1500 mA (1.5A)
  - Recommended for cases up to 6U x 104hp
  - Low impedance star distribution due to 4 layer PCB
  - Triple 120° phased controller for low induced noise
  - Output short circuit protection and foldback current limiting
  - Output overvoltage protection from transient overshooting
  - Soft start for controlled start up operation
  - +/-1% output voltage accuracy
  - Fits comfortably in an 84HP 3U case or 6U case and larger
  - Dimensions: 34cm × 8cm × 20mm (max height)
  - Mounting holes usable with 0.157" / 4mm PEM snaps for quick install
