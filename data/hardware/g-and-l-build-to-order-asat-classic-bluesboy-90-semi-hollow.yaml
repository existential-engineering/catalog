description: The ASAT Classic Bluesboy 90 Semi-Hollow swaps the neck humbucker
  for a Fullerton-made G&L P-90 and adds G&L's twin voice chambers and f-hole to
  a swamp ash body. A single-coil Magnetic Field Design pickup sits in the
  bridge position.
details: |-
  The G&L ASAT Classic Bluesboy 90 is a fresh take on the Bluesboy vibe, swapping the neck humbucker for a G&L P-90 made in Fullerton, and the semi-hollow version takes it further with G&L's distinctive twin voice chambers and f-hole added to a beautiful swamp ash body. As with the original Bluesboy, the single-coil Magnetic Field Design bridge pickup created by Leo Fender delivers crisp attack with complex harmonics while individual brass saddles offer modern levels of intonation refinement. Flipping to the neck P-90 brings a whole lot of bluesy tone but with more harmonics than a humbucker gives. For ultimate jangle there is none better than the neck plus bridge combination on the Bluesboy 90 Semi-Hollow. The ASAT Classic Bluesboy 90 Semi-Hollow's hard-rock maple neck features an easy-playing satin finish, comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets for silky playability.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD single coil in bridge position, G&L P-90 in neck position
  - Body wood: Semi-Hollow Swamp Ash
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 3-position pickup selector, volume, tone
  - Includes: G&L Deluxe Gig Bag
