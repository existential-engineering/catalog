description: Large-diaphragm studio condenser microphone with a 34mm pure
  gold-coated aluminum diaphragm in a cardioid polar pattern. Operates on 48V
  phantom power with a switchable −10dB pad and low-cut filter. Designed for
  vocals, acoustic guitar, and wind instruments; ships with a suspension
  shockmount and hard and soft carrying cases.
details: |-
  Large-diaphragm cardioid condenser. 34mm gold-coated aluminum diaphragm. Sensitivity −35dB ±2dB (0dB=1V/Pa @ 1kHz), output impedance 200Ω, min load impedance 1kΩ, max SPL 130dB, S/N 79dB. Frequency response 20Hz–20kHz. Requires 48V phantom power. Switchable −10dB pad and low-cut filter. 3-pin XLR male connector at base. Body: φ50 × 190 mm, 420g. Includes suspension shockmount, hard case, soft case, 5/8"–3/8" thread adapter.
