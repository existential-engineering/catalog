details: |-
  Meet the new Rivolta Duocata Tenor Guitar —a bold reinterpretation of a classic format, reimagined for today's sonic adventurers. With four strings and endless possibilities, this short-scale wonder delivers a punchy, articulate tone that's perfect for cutting through a mix or standing confidently on its own. Whether you're exploring alternate tunings, adding texture to your recordings, or chasing vintage vibes with a fresh twist, the Rivolta Duocata Tenor Guitar is your secret weapon. Crafted with the signature Rivolta attention to detail—sleek contours, flawless finishes, and vintage-inspired elegance—this instrument is as inspiring to look at as it is to play. Features and Specs
