details: |-
  A year after releasing the original four Align Series pedals, we followed up with two additional and highly sought-after effects. The first of those was a Delay. The Align Delay expands your sonic profile for a multidimensional sound and feel. It features a tap button to set your desired tempo, along with an input for an optional external tap. The Tone control affects only the repeats, ranging from warm, analog vibes to clear, digital echo.
specs: |-
  - Delay control blends the delayed signal with the unaffected signal
  - Repeats control sets the number of repeats
  - Time control sets the delay time
  - Division control sets the delay to a dotted eighth note of the tempo
  - Tap button to manually set the delay tempo, plus an external tap input
  - Tone control sweeps the repeats from warm analog to clear digital
  - Engage footswitch for affected signal or true bypass
  - Powered by 9V battery or 9V DC supply
  - U.S. Patent D918,293
