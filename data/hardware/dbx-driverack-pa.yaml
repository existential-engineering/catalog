description: The dbx DriveRack PA is a complete equalization and loudspeaker
  management system integrating a 28-band graphic EQ, stereo compressor,
  feedback eliminator, subharmonic synthesizer, and six-channel output
  processing with Peak Plus limiters. Built on the legendary 480 DriveRack
  platform, it simplifies the signal chain between mixer and amplifiers.
details: |-
  The dbx DriveRack PA represents a complete integration of the key elements needed for optimal loudspeaker system management in PA-specific applications. Building upon the legendary 480 DriveRack technology, it delivers professional-grade loudspeaker management specifications in a single 1U rack unit.

  The DriveRack PA features two independent channels of processing power with a linkable 28-band graphic equalizer, an industry-standard dbx stereo compressor module, a feedback eliminator, and the 120A Subharmonic Synthesizer at the input stage. Six channels of output processing include parametric EQs and Peak Plus limiters for comprehensive speaker protection and alignment.

  A Wizard setup system guides users through initial configuration, making professional-level loudspeaker management accessible even to less experienced users. Alignment delay functionality allows precise time alignment between speaker clusters and subwoofers.
