details: |-
  The CCM682 is a high performance ceiling-mount speaker that features a 200mm (8in) Aramid Fibre cone bass/midrange driver and an aluminium dome tweeter in a neat circular die-cast chassis. Its 30mm coil and 100mm magnet ensure an incredibly efficient and reliable speaker with outstanding sound quality.

  The aluminium tweeter’s housing pivots for adjustable off-axis treble response. The speaker also has a three-position EQ switch for a better off-axis response. The bass/midrange driver’s die-cast chassis provides extra rigidity which results in a cleaner, faster bass.

  The blue Aramid Fibre cone means that the unit is well hidden behind the grille but still produces a remarkably clear and dynamic sound. Incorporating QuickDogs and plug-and-play functionality it is quick and easy to install.

  CCM6 Series ceiling mount speakers comprise a baffle carrying the speaker drivers and crossover, a mounting frame (with integrated bezel), and a magnetically secured grille. CCM682 requires a ceiling aperture diameter of 251mm (9.9in) and clear depth behind the sheetrock (plasterboard) of 140mm (5.51in).
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x ø25mm (1in) Nautilus swirl loaded aluminium dome tweeter
  - Drive units: 1x ø200mm (8in) blue Aramid Fibre cone bass/midrange
  - Frequency range (-6dB): 35Hz – 50kHz
  - Recommended amplifier power: 25 – 150W
  - Sensitivity SPL (2.83V, 1m): 89dB
  - Nominal impedance: 8Ω (minimum 4.5Ω)
  - Frame diameter: 290mm (11.4in)
  - Cut-out diameter: 250mm (9.8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C8
  - Back box: 6C
  - Ceiling aperture diameter: 251mm (9.9in)
  - Required clear depth behind plasterboard: 140mm (5.51in)
  - Pivoting tweeter housing and three-position EQ switch
  - Finish: White
