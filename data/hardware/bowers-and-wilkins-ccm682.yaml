description: The CCM682 is a high-performance ceiling-mount speaker that
  features a 200mm (8in) Aramid Fibre cone bass/midrange driver and an aluminium
  dome tweeter in a neat circular die-cast chassis. Its 30mm coil and 100mm
  magnet ensure an incredibly efficient and reliable speaker with outstanding
  sound quality.
details: |-
  CCM682 is a two-way passive in-ceiling speaker in the Bowers & Wilkins Performance Series and the largest of the CCM68x models, pairing a 25mm (1in) Nautilus swirl loaded aluminium dome tweeter with a 200mm (8in) blue Aramid Fibre cone bass/midrange driver in a circular die-cast chassis.

  The tweeter housing pivots, so treble can be aimed at the listening position and the off-axis response adjusted after the speaker is in the ceiling. A three-position EQ switch on the speaker gives a further off-axis correction, which is the usual answer to a ceiling speaker sitting well away from where people actually sit.

  Bowers & Wilkins attributes the model's efficiency and power handling to its motor system, quoting a 30mm coil and a 100mm magnet, and credits the die-cast chassis of the bass/midrange driver with the extra rigidity behind a cleaner, faster bass. The blue Aramid Fibre cone is described as keeping the driver visually hidden behind the grille while still producing a clear and dynamic sound.

  It is a passive loudspeaker driven from an external amplifier: 8 ohms nominal with a 4.5 ohm minimum, 89dB sensitivity measured at 2.83V and 1m, and a recommended amplifier power of 25W to 150W, the widest of the four CCM6xx models in this batch. Its quoted frequency range is 35Hz to 50kHz at -6dB.

  Installation uses the QuickDogs fixing system with plug-and-play wiring: a 290mm (11.4in) frame over a 250mm (9.8in) cut-out, 133mm (5.2in) of depth needed behind the surface, and a 4mm (0.2in) protrusion once fitted. The matching pre-mount kit is the C8 and the matching back box the 6C. The speaker is offered in White only.
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x 25mm (1in) Nautilus swirl loaded aluminium dome tweeter, 1x 200mm (8in) blue Aramid Fibre cone bass/midrange driver
  - Frequency range (-6dB): 35Hz to 50kHz
  - Recommended amplifier power: 25W to 150W
  - Sensitivity SPL: 89dB (2.83V, 1m)
  - Nominal impedance: 8 ohms (4.5 ohms minimum)
  - Frame diameter: 290mm (11.4in)
  - Cut-out diameter: 250mm (9.8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C8
  - Back box: 6C
  - Pivoting tweeter housing for adjustable off-axis treble response
  - Three-position EQ switch for a better off-axis response
  - Die-cast bass/midrange chassis, 30mm voice coil, 100mm magnet
  - QuickDogs fixing system with plug-and-play wiring
  - Passive: no on-board amplifier, no mains inlet, driven from an external amplifier
  - Finish: White
