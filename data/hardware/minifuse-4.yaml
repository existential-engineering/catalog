description: >
  Record your song, record your story, record you - record anything. MiniFuse 4 is a next-gen 4in/4out audio & MIDI interface designed to transform your ideas into your art. Capture crystal-clear recordings, refine with pro-grade creative software, and get your sound out there.
details: |-
  Minifuse 4 is a next-generation 4-in/4-out audio and MIDI interface designed to transform creative ideas into finished art. It captures crystal-clear recordings with studio-grade sound quality and includes a comprehensive software bundle for professional-level production. The interface is engineered for bands, producers, performers, podcasters, and content creators who need reliable, high-quality audio capture and processing.

  The interface features a single combo xlr/1/4 inch input with 48v phantom power support for condenser microphones, dual 1/4 inch trs balanced line outputs for studio monitors, and two 1/4 inch headphone outputs for group recording and mixing sessions. Backlit gain control knobs respond to input levels and turn red when signal is too high, while an instrument level switch allows seamless switching between line and instrument levels. A direct monitor switch enables real-time monitoring, and the stereo virtual loopback channel facilitates content creation with in-app or in-game audio capture.

  Audio specifications include a class-leading 110db dynamic range and -129db equivalent input noise for pristine recordings with rich dynamics and minimal noise floor. The microphone preamp delivers -100db thd+n at 1khz, while line and instrument inputs provide 56db gain range with frequency response of 20hz to 20khz. Output stages maintain -101db thd+n for speakers and support up to 137mw power at 33 ohms for headphones.

  Minifuse 4 connects via USB-c and includes a USB-a hub port for attaching MIDI controllers and other USB devices up to 250ma. The rugged aluminum casing and compact, lightweight design make it ideal for mobile producers, while the 5-year hardware warranty reflects arturia's confidence in durability and build quality. The interface is fully compatible with windows 10+ and macos 10.13+ systems with 4gb ram minimum and 64-bit processors.

  The included software bundle features ableton live lite for composition and production, analog lab intro with 500 vintage and modern keyboard presets, and arturia fx plugins including rev plate-140 reverb, pre 1973 vintage preamp, delay tape-201 echo, and chorus jun-6 analog chorus. Additional subscriptions include 3 months of auto-tune unlimited for vocal processing and 3 months of splice creator plan for royalty-free samples and tutorials. The minifuse control center app provides centralized monitoring of inputs, outputs, settings, and firmware updates.
