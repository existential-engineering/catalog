description: The limited edition DJ controller made in collaboration with
  Off-White™. As the founder of Off-White™, Virgil Abloh's desire to create the
  DJ equipment is sympathetic to the Pioneer DJ's passion for music drives us to
  explore the deep connections it makes and the unity and harmony it inspires.
  Virgil Abloh, now regarded as one of the most important men's artistic
  directors in the fashion scene, shared the desire to create Virgil's
  deliberate DJ equipment. Based on the concept of "SOUND ENGINEERING," Pioneer
  DJ and Off-White™ completed "DDJ-1000-OW" through repeated trial and error.
details: |-
  4-channel performance DJ controller for rekordbox. The limited edition DJ controller made in collaboration with Off-White™. As the founder of Off-White™, Virgil Abloh's desire to create the DJ equipment is sympathetic to the Pioneer DJ's passion for music drives us to explore the deep connections it makes and the unity and harmony it inspires. Virgil Abloh, now regarded as one of the most important men's artistic directors in the fashion scene, shared the desire to create Virgil's deliberate DJ equipment. Based on the concept of "SOUND ENGINEERING," Pioneer DJ and Off-White™ completed "DDJ-1000-OW" through repeated trial and error.
