details: |-
  Soundcraft’s Series 10s on-air and production console is designed for use in local and community radio stations. It is simple to use for the novice, but its fully modular design renders it versatile enough to integrate seamlessly into the professional broadcast environment. Frames with 12, 20 or 28 channels are available, selected from Mono, Stereo, Telco and Source Select.
