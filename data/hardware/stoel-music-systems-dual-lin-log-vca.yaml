description: A Eurorack module featuring two voltage-controlled amplifiers with
  switchable linear or logarithmic response for shaping audio or control voltage
  signals.
details: |-
  The Stoel Music Systems Dual Lin/Log VCA is a versatile module featuring two voltage-controlled amplifiers with a switchable response. The logarithmic setting is generally used for audio, and the linear response is more suited to modulating control signals. However, the responses can be interchanged to generate unique effects. All Stoel Music Systems modules feature aluminum front panels with a durable high-gloss white finish. For a crisp appearance and exceptional durability, the front panel markings are digitally printed at high-resolution with UV-cured ink. Mounting holes are plated to significantly reduce screw rash. The power connection features polarity protection to prevent accidental damage to the module if it is connected backward. Each module includes a 12" long 10-pin to 16-pin ribbon cable compatible with the Eurorack standard, M3 mounting screws, and a complimentary sticker. Technical Specifications

  Width
  8 HP

  Depth
  20 mm

  Current Draw
  +12V: 20mA, -12V: 20mA, +5V: 0mA
specs: |-
  - Two voltage controlled amplifers
  - Each VCA has two modes: linear or logarithmic
  - Can amplify CV or audio signals
  - Logarithmic setting is generally used for audio, and the linear response is more suited to modulating control signals
  - The responses can be interchanged to generate unique effects
