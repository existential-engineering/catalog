description: >-
  The Logan String Melody II is an Italian analog string synthesizer from 1977,
  an updated version of the 1973 original that added ensemble effect presets and
  helped establish Logan Electronics as a respected name in string machines.
details: |-
  The String Melody was first released by Italian manufacturer Logan Electronics
  in 1973. Initial sales were modest as the company was relatively unknown, but
  when the slightly updated Mark II model arrived in 1977, the instrument began
  to find commercial success and a growing reputation among keyboard players.

  The String Melody II offers three basic string voices — Violin, Viola, and
  Cello — split across upper and lower keyboard registers with independent
  volume control via drawbar sliders. Additional Bass and Perc (percussive
  sub-bass) voices extend its range beyond pure string ensemble duties.

  The Mark II's key improvement over the original was the addition of four
  ensemble effect presets that dramatically expanded its tonal palette. These
  range from a subtle chorus effect to an accordion-like dry sound, a vibrato
  and chorus hybrid for solo passages, and a phaser-like organ chorus that
  pushed the instrument into unexpected sonic territory.

  Built into a durable flight case with wood paneling and a protective cover,
  the String Melody II was designed for both studio use and live performance.
  Its simple attack/decay envelope and single mono output keep operation
  straightforward, with a volume pedal input providing the primary expression
  control.
specs: |-
  - Polyphony: Full (49 notes)
  - Keyboard: 49 keys
  - Voices: Violin, Viola, Cello, Bass, Perc
  - Envelope: Attack/Decay
  - Effects: 5 ensemble presets (Mark II)
  - Output: 1/4" mono
  - Control: Volume pedal input
  - Memory: None
