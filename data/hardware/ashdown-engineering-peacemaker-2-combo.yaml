description: A hand-built UK guitar combo delivering US and UK-inspired voicing
  from premium JJ Electronics ECC83 preamp tubes. A single-channel preamplifier
  with two voiced inputs and Dark & Light voicing spans vintage American cleans
  to classic British crunch. Bass, Middle, and Treble tone controls plus Gain
  and Volume give full command of the tone, driving up to 2 watts from a JJ
  Electronics 6V6 valve into a 12" UK-built Celestion Creamback speaker. Housed
  in a birch plywood cabinet wrapped in classic Tolex.
details: |-
  Hand-built in the UK, built to order. Single-channel preamp with two voiced inputs; Dark & Light voicing for US/UK-styled tones. 2 x JJ Electronics ECC83 preamp tubes. Bass, Middle, Treble, Gain, Volume controls. Up to 2W output from 1 x JJ Electronics 6V6 valve. 1 x 12" UK-built Celestion Creamback speaker. Birch plywood cabinet with Tolex covering.
specs: |-
  - Single-channel preamplifier with two voiced inputs
  - Dark & Light voicing (US/UK tones)
  - Preamp tubes: 2 x JJ Electronics ECC83
  - Power valve: 1 x JJ Electronics 6V6
  - Power output: up to 2 watts
  - Controls: Bass, Middle, Treble, Gain, Volume
  - Speaker: 1 x 12" UK-built Celestion Creamback
  - Cabinet: birch plywood, Tolex covered
