description: >-
  The Korg 707 is a compact digital FM synthesizer released in 1987, designed as an
  accessible entry-level instrument with 8-part multitimbral capabilities. Featuring a
  49-key velocity and aftertouch-sensitive keyboard, it shares its synth engine with the
  Korg DS-8 but lacks onboard effects. Its portable, strap-on form factor and
  distinctively lo-fi digital character have made it a cult favorite, notably used by
  techno pioneer Juan Atkins.
details: |-
  The Korg 707 is a digital FM-type synthesizer that shares its synthesis engine with the more fully featured Korg DS-8. While it lacks the DS-8's onboard effects processing, the 707 compensates with an unusually portable form factor—it can be worn across the shoulder like a guitar, making it suitable for live performance.

    The 707 offers 8-part multitimbral operation, allowing each of its 8 voices to independently play different patches. It is fully programmable via MIDI, and its simplified editing controls make it more approachable than many FM synthesizers of its era. The instrument stores up to 100 patches in memory.

    Though not intended for professional studio applications, the 707 has earned a following for its distinctively lo-fi and characteristically "cheesy" digital tones. Detroit techno pioneer Juan Atkins is among its notable users, lending the instrument credibility in electronic music circles.
