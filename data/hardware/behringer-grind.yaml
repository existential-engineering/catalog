description: Hybrid semi-modular synthesizer pairing a 24-engine digital
  oscillator, 15 of them Mutable Instruments Plaits engines, with a classic 24
  dB analog ladder filter. A 32-step sequencer, an arpeggiator, a fully analog
  LFO, a 22 x 12 patch matrix and 16-voice Poly Chain take it from percussion
  and searing leads to thunderous bass lines, drones and dreamy soundscapes.
details: |-
  This new hybrid synth is a jack of all trades and you’re going to be the master of all of them. The Behringer GRIND is an amazing sound powerhouse that can do anything from percussion, searing lead tones, thunderous bass lines, drones and dreamy soundscapes.

  Start Your Engines

  At the heart of GRIND is its digital oscillator with 24 engines, which include 15 Mutable Instruments Plaits engines that can be used to create several different sounds from ethereal pads, lush chords and some funky bass lines. Engines include Virtual Analog, Waveshaper, FM, Grains, Rain, Noise, Dust, DX7, TD-3 Bassline, Wave Generator and Vox.

  Versatile VCF

  GRIND’s classic 24 dB ladder filter lets you freely experiment with the Cutoff Frequency, Resonance and Modulation to dial in the perfect sound. The filter Mode switch can be set to either Lo- or Hi-pass for selecting the range of your choice.

  Onboard Sequencer and Arpeggiator

  GRIND’s sequencer allows you to program up to 32 steps of notes and rests and save them as a pattern. You can record, save and recall up to 64 patterns, all of which can be stored in the 8 banks, each holding up to 8 patterns. Your sequences can be played either in Keyboard mode, where you create and store the pattern, or Step mode, which allows you to interact while composing a pattern.

  Truly Analog LFO

  Thanks to its dedicated and fully analog Low Frequency Oscillator (LFO), GRIND lets you choose from either triangle or square waveforms and features an LED that provides visual feedback of the adjustable LFO Rate.
specs: |-
  - Hybrid synthesizer with a multi-engine digital oscillator and a classic analog filter
  - Digital oscillator with 24 engines, including 15 Mutable Instruments Plaits engines
  - Synthesis models designed for pitched sounds such as leads, chords and pads
  - 10 synth engines: Virtual Analog, Waveshaper, FM, Grains, Additive, Chords, Speech, Karplus, Hypersaw and Wavetable
  - 10 percussion and noise engines: Rain, Noise, Dust, Modal Strings, FM Drum, Bass, Snare, Hi Hat, Cowbell and Tom
  - 4 extended engines: DX7, TD-3 Bassline, Wave Generator and Vox
  - Multi-functional Timbre and Harmonics controls
  - Morph control to change the character of the selected sound sources
  - Classic 24 dB ladder filter with resonance, plus Cutoff Frequency and Modulation controls
  - Switchable low pass / high pass filter mode
  - 32-step sequencer with 64 onboard storage slots: 8 banks of 8 patterns
  - Sequencer Keyboard mode and Step mode
  - Arpeggiator with wide patterns
  - Dedicated, fully analog LFO with triangle and square waveforms, adjustable rate and a rate LED
  - 16-voice Poly Chain for combining multiple synthesizers up to 16-voice polyphony
  - Semi-modular design with default routings requires no patching for immediate performance
  - 22 x 12 I/O patch matrix (22 inputs, 12 outputs)
  - 50 controls
  - Comprehensive MIDI implementation with MIDI channel and Voice Priority selection
