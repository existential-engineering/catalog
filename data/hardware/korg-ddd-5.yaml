description: >-
  The Korg DDD-5 is a digital programmable drum machine released in 1987 as a more
  affordable alternative to the DDD-1. It features 18 sampled PCM drum sounds with
  editable tuning and decay parameters, 100 programmable patterns, and 24 song memory
  locations. The DDD-5 lacks the sampling capability of its bigger sibling but accepts
  DDD-1-compatible ROM cards for sound expansion.
details: |-
  The DDD-5 was Korg's mid-range entry in their digital drum machine lineup during the late 1980s. Positioned below the professional DDD-1, it offered solid drum programming functionality at a lower price point while sharing ROM card compatibility with its bigger sibling.

  The sound engine provides 18 PCM sampled sounds including two kicks, two snares, low/mid/high toms, rimshot, claps, crash, two open hi-hats, two closed hi-hats, ride, cowbell, tambourine, and cabasa. Up to 14 sounds can be active simultaneously with 12-voice polyphony. Each sound offers editable tuning and decay parameters, and Roll and Flam effects are available for adding rhythmic variation.

  Programming is straightforward with 100 patterns that can be linked or chained into songs across 24 song memory locations. The unit features seven velocity-sensitive pads for real-time input. Unlike the DDD-1, the DDD-5 does not include a sampling option, so users are limited to the built-in sounds and optional ROM card expansions.

  Today the DDD-5 serves as an affordable alternative to the DDD-1 and similar vintage drum machines like the Roland TR-707, prized more for its characteristic mid-eighties electronic drum sound than for modern production use.
specs: |-
  - Polyphony: 12 voices
  - Sounds: 18 sampled PCM sounds (2 kicks, 2 snares, low/mid/high toms, rimshot, claps, crash, 2 open hi-hats, 2 closed hi-hats, ride, cowbell, tambourine, cabasa)
  - Pads: 7 velocity-sensitive trigger buttons
  - Patterns: 100 programmable
  - Songs: 24 memory locations
  - Sound Parameters: Tuning, decay
  - Effects: Roll, Flam
  - Expansion: DDD-1 compatible ROM cards
  - MIDI: In/Out
  - Year: 1987
