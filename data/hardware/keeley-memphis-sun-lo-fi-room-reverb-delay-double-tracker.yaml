description: "- Memphis Sun - NeoVintage EchoVerb - SlapBack Double Tracking"
details: |-
  The Memphis Sun is a lo-fi reverb, echo and double-tracker aimed at 1950s studio sounds: small room reverb, slapback echo and automatic double tracking. Keeley calls it the second of its studio themed pedals, after the Keeley 30ms ADT, and describes the voicing as NeoVintage, deliberately low fidelity rather than clean.

  A toggle selects between three modes. Slapback 600 is the long echo mode, with delay times up to 666ms, filtered heavily at 1 kHz, compressed, then filtered at 1 kHz again, with second and third order harmonics added to simulate tape response and equipment distortion. Sun Mode is the automatic double tracking setting, creating a vintage-voiced double-track in mono, and stretching into slapback territory as the time is raised. Room is a one-knob studio reverb, and the Slapback 600 and Sun Mode settings each include it.

  The room reverb simulates a small 33 foot by 18 foot tiled room filled with enough sound that it compresses, including the frequency response of period microphones. An RCA 77 is loosely modelled by a group of filters with a 300 Hz high-pass and an 8 kHz low-pass, with artefacts and added second and third order harmonics.
specs: |-
  - Three modes: Slapback 600 echo, Sun Mode automatic double tracking, Room studio reverb
  - Slapback 600 Time: 30ms to 666ms
  - Slapback 600 Regen: up to about three repeats, occasionally six
  - Slapback 600 Reverb: room reverb amount
  - Sun Mode Time: 0 to 180ms of delay, marked at 0, 30, 60, 90, 120, 150 and 180ms, with 0 to 30ms for double tracking and 30 to 180ms for slapback
  - Sun Mode Regen: modulation amount for the double tracking, raising both rate and depth of tape modulation, off at minimum
  - Room Time: 0 to 150ms of pre-delay
  - Room Regen: tone control, an active filter of plus or minus 10dB centred around 1.1 kHz
  - Room Reverb: depth of the reverberation
  - Room reverb models a small tiled room with a 300 Hz high-pass and 8 kHz low-pass microphone response
