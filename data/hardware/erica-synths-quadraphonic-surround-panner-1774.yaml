details: |-
  The Quadraphonic Surround Panner is an expander row of modules for the Dada Noise System II. Integrated with that system it becomes a tool for film postproduction, installation work, game sound design and quadraphonic performance.

  The row is built from eight Erica Synths Black modules: two Black Joystick2 for hands-on placement of sources, two Black Mixer/Splitter for distributing and summing signals, two Black VCA2 for level control and two Black Stereo Delay for time-based treatment of the panned material.

  The row ships complete with side panels and an external PSU, so it can be set up beside a Dada Noise System II without further parts.
specs: |-
  - 2x Black Joystick2
  - 2x Black Mixer/Splitter
  - 2x Black VCA2
  - 2x Black Stereo Delay
  - Comes with side panels and an external PSU
  - Expander row for the Dada Noise System II
