description: Developed with James LoMenzo (Megadeth), the Mega Drive builds on
  the success of the HyperDrive with a redesigned circuit that delivers
  everything from rich harmonic distortion to razor-sharp modern drive. It
  features blendable clean and drive mixes, sweepable high-pass and low-pass
  filters, and true bypass switching, giving bassists total control over their
  tone in a road-ready 9V pedal.
details: |-
  James LoMenzo signature bass overdrive/distortion pedal, a redesigned successor to the LoMenzo HyperDrive. Redesigned circuit ranging from rich harmonic distortion to razor-sharp modern drive. Blendable clean and drive mixes let players balance the dry and driven signals. Sweepable high-pass and low-pass filters shape the drive band. True bypass switching. Built tough and road-ready. Powered by 9V.
specs: |-
  - Bass overdrive / distortion pedal
  - Blendable clean and drive mix
  - Sweepable high-pass and low-pass filters
  - True bypass switching
  - 9V power
