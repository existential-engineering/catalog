description: A classic DIY Eurorack modulation utility that samples an incoming
  signal on each clock pulse and holds that value, generating stepped control
  voltages. It includes a built-in white noise generator internally routed to
  the input, plus a buffered noise output and Depth control.
details: |-
  Sample and Hold

  The Sample and Hold Eurorack PCB and Front Panel Kit is a classic DIY modulation utility designed to generate stepped and staircase-style control voltages. By sampling an incoming signal at regular intervals and holding that value until the next clock event, the module introduces controlled randomness and rhythmic modulation into Eurorack patches. Key Features

  Sampling & Modulation

  The Sample and Hold circuit captures the voltage present at its input whenever a clock signal is received, holding that value until the next clock pulse. This creates a stepped output ideal for:

  The clock input defines the sampling rate, allowing anything from slow, evolving changes to fast, rhythmic modulation. Noise & Signal Routing

  A built-in white noise generator is internally routed to the input via a switched jack. When no external signal is connected, the module automatically samples the internal noise source, producing random voltages. The white noise signal is also available at a buffered noise output, allowing it to be used elsewhere in your patch while still feeding the Sample and Hold circuit. Output Control

  The Depth potentiometer controls the range of the output voltage, making it easy to tailor the modulation intensity for different destinations. The sampled voltage is available at the S&H output for routing to oscillators, filters, VCAs, or other modulation targets. DIY Build & Front Panel

  This beginner-level Eurorack DIY kit is easy to assemble and suitable for first-time builders. The circuit is based on a J112 transistor, providing reliable and musical performance. The front panel is constructed from durable PCB material and hand screen printed, ensuring a consistent look with other Guru Gara Synth modules. Technical Specifications

  Skiff Friendly Module

  View Document

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category.
