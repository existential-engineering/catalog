description: "The app-powered OnyxGO | Mic is the best way to record your voice
  directly to your smartphone with amazing sound quality, versatility, and
  ultra-compact size."
details: |-
  The OnyxGO | Mic is a completely self-contained wireless microphone system designed for use with smartphones. Clip it on, open the OnyxGO companion app, pair it via Bluetooth, and you're ready to record.

  The ultra-compact clip-on design pairs professional-quality mic capsules with Onyx preamp circuitry to deliver clean, intelligible voice capture. A headphone output enables real-time stereo monitoring while recording.

  The OnyxGO companion app (iOS and Android) provides recording, mixing, and video features along with audio enhancement tools including noise reduction, a 5-band EQ, reverb, and voice effects. Digital mixing combines the mic signal with Bluetooth audio for phone call recording and other use cases, with automatic lip sync for video.

  The package includes CR-Buds earphones for monitoring on the go.
specs: |-
  - Professional-quality built-in microphone
  - Bluetooth connectivity to smartphones
  - Ultra-compact clip-on design
  - Headphone output with real-time stereo monitoring
  - Onyx preamp circuitry
  - Phone call recording capability
  - Built-in noise reduction
  - Digital mixing (Bluetooth audio + mic signal)
  - Voice effects, 5-band EQ, and reverb
  - Automatic lip sync for video
  - Includes CR-Buds Earphones
