details: |-
  The app-powered OnyxGO Mic is a way to record your voice directly to your smartphone with sound quality, versatility, and ultra-compact size. Just clip it on, open the OnyxGO app, pair it, and you are ready for action. Whether you are recording a podcast, live streaming, or need to step up your quality for virtually any application, OnyxGO makes it easy to get clear, great-sounding audio into your devices.

  OnyxGO Mic is a completely self-contained wireless mic system for your smartphone, with no receiver or cables to deal with. Equipped with a headphone output, it enables you to monitor everything even if you are away from your phone, and it can be used as a wireless adapter for wired headphones or earbuds.

  Onyx preamp circuitry ensures vocal quality and low noise. With the OnyxGO app, you can record your voice from OnyxGO Mic as well as any incoming calls, record video with automatic lip sync, apply built-in noise reduction, and digitally mix Bluetooth audio with the mic signal.

  Beyond recording, OnyxGO Mic provides a suite of voice-enhancing tools including voice-changing effects, 5-band EQ, and reverb.
specs: |-
  - Professional-quality built-in microphone
  - Connects to your mobile device via Bluetooth
  - Ultra-compact clip-on design
  - Headphone output
  - Real-time stereo monitoring
  - Onyx preamp circuitry
  - Phone call recording
  - Noise reduction
  - Digitally mix Bluetooth audio and mic signal
  - Digital effects, 5 band EQ, reverb
  - Automatic lip sync
  - CR-Buds earphones included
  - OnyxGO companion app available for iOS and Android
