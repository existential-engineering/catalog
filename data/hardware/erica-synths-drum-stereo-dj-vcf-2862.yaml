description: As its name suggests, the Erica Synths DJ VCF STEREO module
  provides sound treatment functionality typically found on DJ decks – it is
  fully open when the cutoff knob is at 12:00. When turned counter-clockwise,
  lowpass filtering is applied and when turned clockwise, highpass filtering is
  initiated. Additionally, there is a nice-sounding, adjustable resonance
  parameter. This provides hands-on control over the sound during performances
  as well as unconventional timbre modulations that are hard to achieve with
  conventional state variable filters.
details: |-
  The Drum Stereo DJ VCF brings the sound treatment of a DJ mixer into the Erica Synths Drum series. The filter is fully open with the cutoff knob at twelve o'clock. Turning counter-clockwise applies lowpass filtering and turning clockwise brings in highpass filtering, so one knob sweeps the whole range.

  An adjustable resonance parameter sits alongside the cutoff. Together they give hands-on control during a performance and allow timbre modulations that are hard to reach with a conventional state variable filter.

  The signal path is fully analogue and stereo throughout, with a 24dB per octave filter slope. Audio level is rated at 10Vptp and CV level spans -10V to +10V.

  Two cutoff CV inputs are provided, one of them with an attenuverter so modulation depth and polarity can be set at the panel. The module is 8HP wide and 35mm deep, drawing 109mA from the positive rail and 101mA from the negative rail.
specs: |-
  - Fully analogue stereo DJ-style VCF
  - Manual cutoff and resonance control
  - Two cutoff CV inputs, one with an attenuverter
  - Filter slope 24dB/oct
  - Audio level 10Vptp
  - CV level -10V to +10V
  - Module width 8HP
  - Module depth 35mm
  - Power consumption +109mA, -101mA
