url: https://www.behringer.com/en/products/0718-aba
description: A classic polyphonic analog synthesizer inspired by iconic '70s
  designs, pairing two analog expander modules that carry 4 VCOs, 2 multi-mode
  VCFs, 2 LFOs and 4 envelope generators between them. The two voices play
  polyphonically, split or in 4-oscillator unison, and the main module can be
  transferred into a standard Eurorack case.
details: |-
  The original design consisted of two single-voice modules coupled together. With its 37-note keyboard, it was a considerable size but introduced a feature no other synth was capable of at the time: polyphony. The 2-XM combines all the features of the original with modern conveniences such as MIDI and USB implementation, stereo, and a large set of CV and gate ins and outs for transforming and shaping sounds.

  The 2-XM comes with 4 VCOs, 4 envelope generators, 2 LFOs and 2 multi-mode VCFs across two synthesizer expander modules. The two voices can be combined for two-voice polyphony, split, or run with all 4 oscillators in unison for intricate layering and rich vintage analog tones.

  Each VCO can be shaped through adjustable frequency, modulation and pulse width controls, and the oscillators can be synced for piercing lead sounds and more complex waveforms. A noise generator expands the available waveform palette further.

  The VCFs add Frequency, Modulation and Resonance controls alongside a multi-mode filter knob: turned fully left it selects the low-pass filter, turned the other way the high-pass filter, and set at 12 o'clock the notch filter. A switch places the VCF in band-pass mode.

  Four envelope generators with Attack, Decay and Sustain controls introduce subtle nuance or percussiveness, and a VCA switch toggles between envelope control and VCA, which overrides ENV 1. An external VCA control can be patched in. A 2-channel mixer section provides level and pan for each module, with a portamento function on both voices for pitch gliding effects.

  Each module carries a large complement of CV and gate ins and outs plus modulation from internal and external sources, so the 2-XM patches into an existing setup, and the main module can be transferred into a standard Eurorack case for integration into an existing system.
specs: |-
  - Pure analog signal path based on authentic VCO, VCF and VCA designs
  - 2 independent voices across two synthesizer expander modules, playable polyphonic, split or 4-oscillator unison
  - 4 Voltage Controlled Oscillators with adjustable frequency, modulation and pulse width
  - 2 variable oscillator shapes with adjustable pulse width
  - Oscillator sync
  - 2 multi-mode Voltage Controlled Filters with low-pass, high-pass, band-pass and notch modes, plus Frequency, Modulation and Resonance controls
  - 2 fully analog LFOs with sine waveform
  - 4 analog envelope generators with Attack, Decay and Sustain, controlling filters and amplifiers
  - VCA switch toggles between envelope control and VCA, overriding ENV 1, with external VCA control input
  - Noise generator
  - Extensive modulation from internal and external sources
  - 2-channel mixer section with level and pan controls per module
  - Portamento function applicable to both voices
  - 2 external audio inputs for processing external sound sources
  - Dedicated audio outputs plus a combined stereo output
  - 16-voice Poly Chain for combining multiple synthesizers up to 32 voice polyphony
  - Eurorack format: main module can be transferred to a standard Eurorack case
  - 67 controls for direct real-time access to parameters
  - MIDI and USB implementation with MIDI channel and Voice Priority selection
