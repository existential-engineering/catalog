description: >-
  The Clavia Nord Rack is a rackmount virtual analog synthesizer from 1995 that uses proprietary
  Virtual Sound Modeling technology to emulate classic analog synthesis, offering up to 12 voices
  of polyphony, 4-part multitimbrality, and comprehensive MIDI control.
details: |-
  Released in 1995, the Nord Rack brought Clavia's groundbreaking Virtual Sound Modeling
  technology into a rackmount format alongside the Nord Lead keyboard. Rather than using analog
  circuits or sample playback, it employed custom DSP to mathematically model the behavior of
  analog oscillators, filters, and envelopes, achieving convincing emulations of classics like
  the ARP 2600, Minimoog, and Roland Jupiter series.

  The synthesis architecture provides two oscillators per voice with triangle, sawtooth, and pulse
  waveforms plus a noise source. Dual LFOs with triangle, sawtooth, and random waveforms can
  modulate oscillators, filter, pulse width, and envelope parameters. The filter section offers
  both 2-pole (12dB) and 4-pole (24dB) configurations with lowpass, bandpass, and highpass modes,
  resonance, envelope amount, velocity sensitivity, and keyboard tracking.

  With 4 to 12 voices of polyphony depending on the configuration and 4-part multitimbrality,
  the Nord Rack proved versatile for both live performance and studio work. Features include
  portamento, legato mode, an arpeggiator, and Clavia's signature morphing capability for
  real-time sound interpolation. The unit was adopted by a wide range of artists including The
  Prodigy, Nine Inch Nails, Depeche Mode, Fatboy Slim, The Crystal Method, Dr. Dre, and Autechre.
specs: |-
  - Polyphony: 4-12 voices
  - Multitimbral: 4 parts
  - Oscillators: 2 VSM (triangle, sawtooth, pulse) + noise
  - LFOs: 2 (triangle, sawtooth, random)
  - Filter: 2-pole (12dB) or 4-pole (24dB); lowpass, bandpass, highpass
  - Filter controls: Cutoff, resonance, envelope amount, velocity, key tracking
  - Envelopes: ADSR for filter and amplifier
  - Features: Portamento, legato, arpeggiator, morphing, pitch bender
  - Memory: 59 preset programs, 40 user, 100 performances
  - Connectivity: Full MIDI implementation, all controls MIDI-mappable
  - Format: Rackmount module
releaseDate: "1995"
