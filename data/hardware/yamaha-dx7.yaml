description: >-
  Yamaha's groundbreaking FM synthesizer that redefined affordable digital synthesis in the 1980s,
  delivering complex harmonic textures through six-operator frequency modulation.
details: |-
  When the DX7 arrived in 1983, it fundamentally changed what musicians expected from a synthesizer. Yamaha had been developing frequency modulation synthesis technology licensed from Stanford researcher John Chowning, and the DX7 brought that research to market at a price point that undercut most analog competitors. The result was an instrument that sold hundreds of thousands of units and became arguably the best-selling synthesizer of all time.

  FM synthesis generates sound by modulating the frequency of one waveform with another, and the DX7 provides six operators that can be arranged in 32 different algorithms. This architecture produces timbres that analog synthesizers simply cannot replicate — crystalline electric pianos, shimmering bells, punchy basses, and glassy pads that became the defining sonic palette of mid-1980s pop, R&B, and new wave. The factory preset electric piano patch alone appeared on countless recordings of the era.

  The instrument offers 16-voice polyphony, a 61-key velocity-sensitive keyboard with aftertouch, and 32 patch memories — features that were remarkably generous for its time. It was also among the first commercially available synthesizers to ship with MIDI, helping establish that protocol as the industry standard. Programming new sounds from scratch proved notoriously challenging due to the abstract nature of FM parameters, which meant many players relied on presets or third-party cartridges.

  The DX7's influence stretches across virtually every genre of the 1980s and beyond. Artists ranging from Brian Eno and Kraftwerk to Stevie Wonder and Toto made it a centerpiece of their sound. Its characteristic tones remain instantly recognizable, and the instrument established FM synthesis as a permanent fixture in the electronic musician's toolkit.
specs: |-
  - Polyphony: 16 voices
  - Oscillators: 6-operator FM tone generator, 16-bit digital
  - Algorithms: 32 configurations
  - LFO: Sine, square, triangle, saw up, saw down, random
  - Envelopes: 6 envelope generators with 8 parameters each
  - Keyboard: 61 keys with velocity sensitivity and aftertouch
  - Memory: 32 patches
  - Control: MIDI
  - Produced: 1983–1987
