details: The PBR TT is a professional 96-point TT/Bantam patch bay in a single
  rack space. It features custom gold-plated TT jacks designed by Black Lion
  Audio, with per-module normalling switches (normal, half-normal, and
  non-normal) rated for 10,000+ operations. Twelve DB25 connectors on the rear
  are mounted to an internal steel backplate to prevent wear. The reinforced
  steel chassis has black-anodized aluminum faceplates. Includes custom patch
  labels and a license for PatchCAD BLA edition software.
specs: |-
  - TT Points: 96
  - Rear Connections: 12 × DB25
  - Normalling Modes: Normal, Half-normal, Non-normal (per module)
  - Switch Rating: 10,000+ operations
  - Front Connectors: Gold-plated TT/Bantam jacks
  - Chassis: Reinforced steel with black-anodized aluminum faceplates
  - Form Factor: 1U rack-mount
