description: 50 years of audio experience go into making the extraordinary Pi5
  S2 wireless earbuds. Banish distractions with advanced noise-cancelling, enjoy
  impeccable call quality, hear music the way the artist intended, with
  incredible aptX sound quality, and choose from one of four stylish colours
  available.
details: |-
  Pi5 S2 are premium in-ear noise-cancelling True Wireless earbuds, positioned below the flagship Pi7 S2 in the second-generation Bowers & Wilkins earbud range. The page headline set is True Wireless technology, Bluetooth 5.0 with aptX technology, Active Noise Cancelling, wireless and USB-C charging, and fast charging support.

  Each earbud carries a single 9.2mm dynamic drive unit and two microphones, used both for telephony and for the active noise cancellation system. Bluetooth 5.0 handles the wireless link, with aptX, AAC and SBC codecs and A2DP, AVRCP, HFP, HSP and BLE GATT profiles.

  The earbuds run up to 5 hours with noise cancellation off, and the rechargeable charging case adds a further 19 hours, for up to 24 hours of wireless media streaming from a full charge according to the owner's manual. A 15-minute charge returns 2 hours of playback. The case supports both wireless charging and USB-C charging.

  Power management is automatic: the earbuds are ready for use when removed from the case and enter standby and begin charging when replaced. Earbuds left out of the case and unused for 5 minutes enter a power-saving mode and are woken by tapping both earbuds. Configuration, including the noise cancellation and ambient pass-through modes, is handled through the Bowers & Wilkins Music app on iOS and Android.

  The earbuds weigh 6g each and are rated IP54. The charging case weighs 47g and measures 61 x 28 x 56mm. Only a USB-C to USB-C charging cable is supplied, and the specification sheet lists Bluetooth as the sole audio input, so unlike Pi7 S2 the case offers no wired audio retransmission. Finishes are Storm Grey, Cloud Grey, Spring Lilac and Sage Green.
specs: |-
  - Wearing style: in-ear noise cancelling True Wireless headphones
  - Drive units: 9.2 mm dynamic drive unit
  - Microphones: two per earbud for calls and ANC
  - Technical features: True Wireless technology, Bluetooth 5.0 with aptX technology, Active Noise Cancelling, wireless and USB-C charging, fast charging support
  - Bluetooth codecs: aptX, AAC, SBC
  - Bluetooth profiles: A2DP v1.3.1, AVRCP v1.6.1, HFP v1.7.1, HSP v1.2, BLE GATT
  - Frequency band: Tx 2402 MHz to 2480 MHz (ISM band), Rx 2402 MHz to 2480 MHz (ISM band)
  - Battery type: rechargeable lithium-ion (earbuds and charging case)
  - Battery life: up to 5 hours for earbuds (with ANC off), additional 19 hours from charging case
  - Fast charging: 15 minute charge = 2 hours playback
  - Wireless charging support: yes
  - Water resistance: IP54 (earbuds only)
  - Inputs: Bluetooth
  - In box accessories: 80 cm USB-C to USB-C charging cable, small / medium / large ear tips
  - Net weight: earbuds 6 g (each), charging case 47 g
  - Charging case dimensions: 61 mm (w) x 28 mm (d) x 56 mm (h)
  - Surface materials: metal, plastic
  - Finishes: Storm Grey, Cloud Grey, Spring Lilac, Sage Green
