description: 50 years of audio experience go into making the extraordinary Pi5
  S2 wireless earbuds. Banish distractions with advanced noise-cancelling, enjoy
  impeccable call quality, hear music the way the artist intended, with
  incredible aptX sound quality.
details: |-
  Pi5 S2 is Bowers & Wilkins' premium noise-cancelling True Wireless earbud set, presented as carrying 50 years of audio experience into a compact in-ear design with advanced noise cancelling, call quality and aptX sound quality, in a choice of four colours.

  Each earbud carries a single 9.2mm dynamic drive unit and two microphones, used both for voice calls and for the Active Noise Cancelling system. The wearing style is given as in-ear noise cancelling True Wireless headphones, and the earbuds are rated IP54 (earbuds only, not the case).

  The wireless link is Bluetooth 5.0 with aptX, AAC and SBC codecs, over A2DP v1.3.1, AVRCP v1.6.1, HFP v1.7.1, HSP v1.2 and BLE GATT profiles. Transmit and receive both run in the 2402MHz to 2480MHz ISM band at under 10.0 dBm RF output power. Bluetooth is the only audio input for the earbuds themselves.

  Power comes from rechargeable lithium-ion cells in both the earbuds and the charging case. The earbuds run up to 5 hours with ANC off, the case adds a further 19 hours, and a 15 minute charge gives 2 hours of playback. The case charges either wirelessly or over its USB-C port, and an 80cm USB-C to USB-C cable is supplied in the box along with small, medium and large ear tips.

  Each earbud weighs 6g and the charging case weighs 47g, with the case measuring 61mm wide by 28mm deep by 56mm high. Four finishes were offered: Cloud Grey, Sage Green, Spring Lilac and Storm Grey.
specs: |-
  - Wearing style: in-ear noise cancelling True Wireless headphones
  - Drive units: 9.2mm Dynamic Drive Unit
  - Microphones: two microphones per earbud for calls and ANC
  - Technical features: True Wireless technology, Bluetooth 5.0 with aptX technology, Active Noise Cancelling, Wireless and USB-C charging, Fast charging support
  - Bluetooth codecs: aptX, AAC, SBC
  - Bluetooth profiles: A2DP v1.3.1, AVRCP v1.6.1, HFP v1.7.1, HSP v1.2, BLE GATT (Generic Attribute Profile)
  - Frequency band: Tx mode 2402 MHz to 2480 MHz ISM Band, Rx mode 2402 MHz to 2480 MHz ISM Band
  - RF output power: below 10.0 dBm
  - Inputs: Bluetooth (wireless only, the earbuds have no wired audio input)
  - Battery type: rechargeable lithium-ion (earbuds and charging case)
  - Battery life and charging: up to 5 hours for earbuds with ANC off, additional 19 hours from charging case, 15 minute charge gives 2 hours playback
  - Wireless charging support: yes
  - Waterproof: IP54 (earbuds only)
  - Net weight: earbuds 6g each, charging case 47g
  - Dimensions (carry case): 61mm (w) x 28mm (d) x 56mm (h)
  - In box accessories: 80cm USB-C to USB-C charging cable, small / medium / large ear tips
  - Finishes: Cloud Grey, Sage Green, Spring Lilac, Storm Grey
