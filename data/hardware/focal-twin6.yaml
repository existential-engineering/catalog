details: |-
  Twin6 is at the service of reproduction, offering an uncompromising level of transparency and soundstage precision. Thanks to its innovative Focal technologies (Focus Mode, Beryllium inverted dome tweeter, "W" diaphragm), this studio monitor is a reliable and versatile tool that meets the needs of recording, mixing and mastering without the need for other monitors.

  Transparency: the "W" membrane of the loudspeakers optimizes the frequency response curve. Its lightness and rigidity allow control of signal transmission speed within the material. When listened to, it provides total sound transparency, very low distortion and excellent phase response.

  Focus Mode: thanks to Focus Mode, the loudspeaker converts into a full-range single-channel monitor, offering a different loudspeaker configuration at the touch of a pedal, as if a second pair of studio monitors were checking the mix's adaptability on smaller systems.

  Multiple performances: like Solo6 and Trio6, Twin6 incorporates a variable high-pass crossover and a 160 Hz parametric filter to reduce reflections from the console or desk. Its high-pass crossover and disengageable automatic standby mode offer a simple and essential option for loudspeaker control.

  Meticulous design: the ST6 cabinet design uses thick, sturdy MDF and internal bracing to achieve even greater rigidity and damping, and less vibration and distortion.
specs: |-
  - Product type: 2.5-way monitor
  - Woofer: 2 x 6.5" W membrane
  - Tweeter: 1" Beryllium inverted dome
  - Frequency response (+/- 3dB): 2-way mode 40 Hz - 40 kHz; 1-way Focus mode 110 Hz - 10 kHz
  - Maximum SPL (peak @ 1m): 112 dB
  - High frequency amplifier: 50 W, class AB
  - Mid-range and low frequency amplifier: 2 x 70 W, class G
  - Inputs: XLR symmetrical 10 kOhms
  - High-pass filter: full range, 45 Hz, 60 Hz, 90 Hz
  - Bass/midrange level (160 Hz): adjustable +/-3 dB
  - Bass level (>250Hz): adjustable +/-3 dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: sensitivity, auto standby, midrange driver selector (right/left), HPF, LF Shelv, LMF EQ, HF Shelv
  - LEDs: power on, Focus mode, clipping/default/stand-by
  - Local supply: ~100-120 V T2.5AL/250 V; ~220-240 V T1.25AL/250 V
  - On/Off switch on the rear panel
  - Height: 25 cm / 9.8 in
  - Width: 50 cm / 19.7 in
  - Depth: 34 cm / 13.4 in
  - Weight: 22 kg / 48.5 lb
