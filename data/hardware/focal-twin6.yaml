url: https://www.focal.com/products/twin6
description: 2.5-way studio monitor with dual 6.5" W cone woofers, a 1"
  Beryllium inverted dome tweeter, and Focus mode for switching between
  full-range and single-driver references.
specs: |-
  - 2.5-way monitor with Focus mode
  - Woofers: 2 × 6.5" W membrane
  - Tweeter: 1" Beryllium inverted dome
  - Frequency response (2-way mode, ±3 dB): 40 Hz – 40 kHz
  - Frequency response (1-way Focus): 110 Hz – 10 kHz
  - Maximum SPL (peak @ 1 m): 112 dB
  - High frequency amplifier: 50 W class AB
  - Mid-range/low frequency amplifier: 2 × 70 W class G
  - Bass/midrange level (160 Hz): adjustable ±3 dB
  - Bass level (>250 Hz): adjustable ±3 dB
  - Treble level (<4.5 kHz): adjustable ±3 dB
  - High-pass filter: Full range, 45 Hz, 60 Hz, 90 Hz
  - Midrange driver selector (right/left)
  - Dimensions (H × W × D): 25 × 50 × 34 cm (9.8 × 19.7 × 13.4 in)
  - Weight: 22 kg (48.5 lb)
