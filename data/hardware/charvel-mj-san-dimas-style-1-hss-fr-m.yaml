description: Harkening back to the late '80s when Charvel guitars were
  manufactured exclusively in Japan, the all-new MJ Series is an exciting lineup
  of instruments attentively crafted in Japan. The MJ San Dimas Style 1 HSS FR M
  pairs a classic San Dimas Style 1 alder body with a bolt-on maple neck and
  maple fingerboard, delivering the look, feel, and tone of a vintage-flavored
  super-strat built for modern performance.
details: |-
  The MJ San Dimas Style 1 HSS FR M features a gloss-finished alder San Dimas Style 1 body in Metallic Red, mated to a bolt-on maple neck with graphite reinforcement, a hand-rubbed oil finish, and a Speed Neck profile with rolled fingerboard edges. The maple fingerboard sports a 12"-16" compound radius, 24 jumbo frets, black dot position inlays, a Floyd Rose 1000 Series locking nut (1.6875" width), and a 25.5" scale length.

  Electronics are an HSS configuration featuring a Seymour Duncan JB TB-4 humbucker in the bridge position and a pair of Custom Seymour Duncan Flat Strat SSL-6 single-coils in the middle and neck positions, all in black. Wiring runs through master volume and tone controls and a 5-position blade switch with coil-split positions (position 1: bridge; position 2: bridge inner coil and middle; position 3: bridge outer coil and neck; position 4: middle and neck; position 5: neck).

  Hardware includes a recessed Gotoh GE1996T Series double-locking tremolo with Gotoh tremolo arm, Gotoh die-cast tuning machines, knurled flat-top control knobs, a black switch tip, and Dunlop dual-locking strap buttons, all in a chrome finish. The licensed Fender Stratocaster headstock and 4-bolt sculpted heel neck plate with heel-mount truss rod adjustment wheel round out the build. A Charvel multi-fit hardshell gig bag is included.
