description: The Carbon Premium USB Condenser Microphone delivers professional
  studio quality and versatility for content creators, gamers, musicians, and
  beyond. Featuring 5 selectable polar patterns, Carbon can be optimized for
  vocals, rooms, stereo, two person interviews, and more.
details: |-
  EM-Carbon is a premium USB condenser microphone built around Onyx mic preamp circuitry, which provides clear sound and ultra-low noise. It is aimed at live streaming, podcasting and musicians.

  Five selectable polar patterns, chosen with the pattern knob, cover stereo, cardioid, bi-directional (figure 8), super-cardioid and omni, so the mic can be optimised for vocals, rooms, stereo, two person interviews and more.

  Onboard controls cover gain, mute and headphone volume. The headphone output has independent volume control for monitoring, and the mute switch mutes only the mic input, so computer playback is still heard through the headphones.

  The onboard USB-C interface is class compliant and plugs straight into a computer with no driver needed. The mic ships on a desk stand and can be removed and hand-tightened onto a standard threaded mic stand mount.

  Waveform OEM professional software and plugin package is included. The DAW Essentials Bundle for Waveform OEM includes 16 plugins such as Equaliser, Compressor, Reverber8 and Limiter.
specs: |-
  - Onyx mic preamp circuitry
  - 5 selectable polar patterns: stereo, cardioid, bi-directional (figure 8), super-cardioid, omni
  - Sample rate: 16-bit / 48 kHz
  - Connection: USB-C, class compliant, no driver needed
  - Bus powered over USB, no external power supply
  - Headphone output on 1/8 in connector with independent phones level knob
  - Onboard gain knob, mute switch with red LED, pattern knob and phones knob
  - Mounting via built-in standard threaded mount, with included desk stand
  - Included accessories: mic stand, USB-C cable
  - Waveform OEM software and DAW Essentials plugin bundle included
