description: Custom Shop black and orange edition of the uncompressed Oxblood
  Germanium Overdrive, with a germanium transistor at the output, a Phat bass
  switch, a clipping switch and voltage doubling for headroom.
details: |-
  This is the Custom Shop black and orange edition of the Oxblood Germanium Overdrive. The circuit takes the compression out of the maker's original Oxblood and adds a germanium transistor at the output. With less compression the pedal is described as closer to a tube amplifier, with a flatter mid-range, and the germanium stage removes the hardness that came from the release of compression.

  The drive control runs from near-clean to heavy saturation, and two selectable sets of diodes offer two ways to clip and saturate the signal. The diodes differ from those in the standard Oxblood, chosen for bigger, more open amplifier tones with less compression.

  Five controls shape the result. A Phat switch cuts bass response for a Screamer-style or mid-shelved voice, a Clipping switch sets the amount of sustain and germanium character, a Tone control sets the highs, Volume is backed by voltage doubling for headroom, and Drive sets the gain. The page also credits the circuit's focused midrange as a sixth factor.

  The pedals are hand built, and the circuit was designed by Robert Keeley and Craighton Hale with input from Jack Orman.
specs: |-
  - Uncompressed overdrive circuit with a germanium transistor at the output
  - Custom Shop black and orange finish
  - Two selectable diode clipping sets
  - Phat switch cuts bass response for a mid-shelved voice
  - Clipping switch sets sustain and germanium character
  - Tone and Volume controls, with internal voltage doubling for headroom
  - Drive control runs from near-clean to saturated
  - Hand built
  - Circuit designed by Robert Keeley and Craighton Hale with input from Jack Orman
