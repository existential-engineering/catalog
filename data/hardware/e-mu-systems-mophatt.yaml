details: |-
  The Mo'Phatt is E-mu's upgraded take on their popular Planet Phatt module, designed specifically for urban dance and hip-hop production. As the name suggests, it delivers more of everything: polyphony doubled to 64 voices, a 32 MB Pure Phatt hip-hop sound set expandable to 128 MB via ROM cards, and the exclusive SuperBEATs performance mode for real-time beat creation.

  The sound engine features dynamic 12-pole resonant digital filters and up to 16 syncable arpeggiators, giving producers extensive tools for shaping grooves and textures. A 24-bit dual stereo effects processor provides 29 reverbs, 15 delays, 8 chorus types, 7 flange variations, and 5 distortion flavors. Twelve real-time MIDI controllers allow hands-on manipulation during performance.

  The Mo'Phatt was also available as the MK-6 Mo'Phatt Keys keyboard version and the MP-7 Command Station desktop sequencer module. With 512 preset and 512 user memory slots, plus expandability through orchestral, techno, and world sound ROM cards, the platform offered considerable versatility beyond its hip-hop roots.
specs: |-
  - Polyphony: 64 voices
  - Sound ROM: 32 MB (expandable to 128 MB)
  - Filter: Dynamic 12-pole resonant digital
  - Effects: 24-bit dual stereo processor (reverb, delay, chorus, flange, distortion)
  - Memory: 512 preset, 512 user
  - Control: MIDI (12 real-time parameters)
  - Keyboard: None
