description: A full-size Eurorack replica of the Mutable Instruments Tides tidal
  modulator, generating asymmetric variable-shape waveforms usable as an LFO,
  envelope generator, or audio-rate oscillator with four flexible outputs.
details: |-
  Tornado is a 1:1 full-size replica of the Mutable Instruments Tides 2018 tidal modulator, using the same circuit and firmware with identical functionality. Tides generates asymmetric, variable-shape waveforms usable as an LFO, envelope generator or audio-rate oscillator, with control over frequency, shape, slope and smoothness, and four outputs that can run in unison, as a phase-shifted quadrature set, as independent frequency-divided ramps, or as a four-stage envelope. Built by hand in California. With an anodized aluminum panel, real Alpha components and the same parts as the original, it is as close as you can come in a new build. Note: Doepfer power supplies can occasionally cause power-up issues with certain digital modules, a flaw Doepfer has acknowledged. Tornado is not recommended for use in Doepfer-powered cases. Manual: Mutable Instruments Tides documentation
specs: |-
  - 14hp, 25mm deep — skiff friendly
  - Same circuit and firmware as the original
  - Runs any alternative firmware the original can
  - Anodized matte black aluminum panel
  - Fully tested and calibrated before shipping
  - 2-year Calsynth warranty
