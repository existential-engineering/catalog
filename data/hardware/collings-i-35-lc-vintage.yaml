description: The I-35 LC Vintage is a semi-hollow electric guitar drawing
  inspiration from the best instruments of the 1960s, featuring a maple laminate
  body with a maple/spruce center block and Honduran mahogany neck. It is
  equipped with custom Throbak ESG-102B pickups, Luxe Bumblebee capacitors,
  50s-style wiring, and aged nitrocellulose lacquer finish for an exceptionally
  organic feel and vintage character.
details: |-
  The I-35 LC Vintage is Collings' vintage-voiced take on the semi-hollow electric, redesigned to capture the loose, resonant quality of prized 1960s instruments. The body is maple laminate with a maple/spruce center block, measuring 15" wide, 17 5/8" long, and 1 5/8" deep. The Honduran mahogany neck joins the body via an extra-long mortise & tenon joint and carries a rosewood fingerboard with a 12" radius, medium 18% nickel-silver frets, 1 11/16" nut width, and a 24 7/8" scale length. Mother-of-pearl long dots (5mm non-tapered) mark the positions. Electronics center on Throbak ESG-102B pickups wired in 50s style through CTS 500K pots and Luxe Bumblebee capacitors. Hardware includes a Kluson ABR-1 nickel-plated bridge with retaining wire, a Kluson stop tailpiece, and Gotoh tuners with the Collings logo. Non-grained ivoroid binding, unbound f-holes, an ebony peghead veneer with mother-of-pearl logo, and a haircut peghead profile complete the vintage aesthetic. The guitar ships with a high gloss aged nitrocellulose lacquer finish in Aged Blonde, Aged Faded Cherry, Aged Jet Black, or Aged Tobacco Sunburst. Includes a deluxe hardshell case.
specs: |-
  - Body: Semi-hollow, maple laminate with maple/spruce center block
  - Body Width: 15"
  - Body Length: 17 5/8"
  - Body Depth: 1 5/8"
  - Total Length: 40"
  - Neck: Honduran mahogany
  - Neck Joint: Extra long mortise & tenon
  - Fingerboard: Rosewood
  - Fingerboard Radius: 12"
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Frets: Medium 18% nickel-silver
  - Inlays: Mother-of-pearl long dots (5mm non-tapered)
  - Binding: Non-grained ivoroid (body and fingerboard)
  - Pickups: Throbak ESG-102B (neck & bridge)
  - Potentiometers: CTS 500K
  - Capacitors: Luxe Bumblebee
  - Wiring: 50s-style
  - Bridge: Kluson ABR-1 (nickel-plated zinc with retaining wire)
  - Tailpiece: Kluson Stop Tailpiece (nickel-plated zinc, steel studs)
  - Tuners: Gotoh with Collings logo (nickel)
  - Pickguard: Black/Cream/Black
  - Pickup Rings: Black
  - Knobs: Gold or Black Reflector Top Knobs
  - F-Holes: Unbound
  - Peghead Veneer: Ebony
  - Peghead Profile: Haircut
  - Peghead Inlay: Mother-of-pearl logo
  - Finish: High gloss aged nitrocellulose lacquer
  - Finish Options: Aged Blonde, Aged Faded Cherry, Aged Jet Black, Aged Tobacco Sunburst
  - Strings: D'Addario NYXL1046 (.010" - .046")
  - Case: Deluxe hardshell
