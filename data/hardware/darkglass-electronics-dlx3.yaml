description: The Vintage Deluxe V3 is an overdrive preamp pedal that delivers
  the natural dynamic response and organic compression of classic tube amps and
  tape machines in a compact form.
details: |-
  The Vintage Deluxe V3 is an overdrive preamp pedal that delivers the natural dynamic response and organic compression of classic tube amps and tape machines. This third-generation model adds low-mid and high-mid frequency selection switches for expanded EQ flexibility alongside its core Drive, Level, and Blend controls. The Grunt switch selects how much low-frequency content is saturated while the Attack switch does the same for high-frequency content, letting players tailor the character of the drive. A Blend control mixes the clean input with the effected overdrive signal, a Parallel Output passes the input through for parallel processing, and a balanced Direct Output feeds a PA or studio console. The pedal runs on a regulated 9V DC adapter with a center-negative plug (sold separately).
specs: |-
  - The natural dynamics and organic compression of vintage tube amps and tape machines
  - 3rd-generation enhancements include low-mid and high-mid frequency selection switches
  - Level control sets the volume of the overdrive signal
  - Drive control sets the amount of saturation in the overdrive signal
  - Grunt switch lets you select the amount of LF content to be saturated
  - Attack switch lets you select the amount of HF content to be saturated
  - Blend control mixes the clean input and effected overdrive signals
  - Parallel Output pass-through for easy parallel processing
  - Direct Output is a balanced version of 1/4" output for feeding a PA or studio console
  - Power requirements: regulated 9-volt DC adapter with center-negative plug (sold separately)
