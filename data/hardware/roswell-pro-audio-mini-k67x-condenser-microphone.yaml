details: |-
  Overview

  The Mini K67x is a unique large-diaphragm condenser microphone, designed to excel on vocals and guitars. The Mini K67x expands our promise of sonic diversity . The capsule voicing strikes a balance between neutrality and flattery, with tight bass and an open top end. The circuit enhances the source with harmonics. The mic retains the "point and shoot" simplicity of the Mini K lineup. Like all Roswell microphones, the Mini K67x is designed, soldered, assembled, tested, and tuned in California. Review Excerpt

  A pair of these mics should be on your shortlist. The Roswell Pro Audio Mini K67x is one of those rare affordable, mid-priced mic options with a unique sound that performs well beyond its price bracket. Paul Vnuk
  Recording Magazine
  (see full review here )

  Customer Feedback for the Mini K67x

  The mic is awesome. It's on par with my [$1700 tube mic]. It has u87 qualities, and the added colour is very flattering and natural. Almost no eq needed for vocals or acoustic guitar. The guitar player's lead tone was bad, so I had him send me DI solos to reamp. I tried my normal mic selection, as well as the Mini K67x. It won by a landslide. I have been using the K67x regularly on female and male R&B and Rock vocals and I am completely blown away. It sounds amazing and easily outperforms much more expensive mics we have in the school's locker. I really like the color and weight it has. The color doesn't take away from the clarity. It is definitely my favorite Mini K for vocals. We are loving the 67x. Put me down for three more! Since getting my new K67x it has earned a place in the centre of my studio. It lives on the boom stand on my desk and I have not unplugged it since it arrived. Spoken word, sung vocals, guitar, acoustic bass guitar, banjo, mandolin, percussion, it makes them all sparkle and shine. Description

  The mic's name, "K67x," refers both to the capsule design and circuit topology. The capsule is based on the K67, although we've built and voiced it with some proprietary tricks to create a sound unlike any other K67 capsule. The "x" in the model name refers to the transformer-coupled circuit, which gives the mic its trademark harmonic saturation. This combination introduces a new color to the Mini K product line. The mic is not overtly colored, like the Mini K47, nor is it quite as flat and neutral as the Mini K87. The sonic inspiration for this model was the workhorse tube mic of the 1960s, which offered wideband frequency response and harmonics. We kept those characteristics in this incarnation. Every Roswell microphone is subjected to a 24-hr "burn in" on our proprietary conditioning fixture, then tested extensively prior to shipping: polarity, noise, frequency response, sensitivity, and more. We perform an acoustic sweep test and listen to every microphone multiple times before it leaves our facility. The Mini K67x has a durable gray metallic paint finish. Each mic ships with our exclusive Cutaway shockmount, Roswell branded microfleece mic sock, and an upgraded flight case. Customize

