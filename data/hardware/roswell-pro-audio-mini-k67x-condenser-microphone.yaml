  Design and Component Details

  The Mini K67x introduces two unique new sounds to the Mini K product line: the capsule voicing, and the harmonic saturation of the circuit. The capsule is a 34mm (large diaphragm) design. As the mic's name suggests, the capsule is nominally a K67 type, but we invested two years' worth of research and development to create a proprietary, "Holy Grail" voicing: full bass without wooliness, slight attenuation in the sibilance range, neutral highs, and extended "air" above 10kHz. The circuit design borrows from our flagship Colares microphone; it is a single-stage JFET/transformer topology, built around a selected vintage European-made output capacitor, the best-sounding modern filter capacitors on the market, and a custom wound output transformer (which barely fits inside the mic body). The capacitor feeding the JFET is a critical component to the mic's sound. We've designed a custom bipolar electrolytic, with a special formulation of electrolyte that was initially developed for the legendary Black Gate line of capacitors. Internal gain staging is carefully set for each individual mic to produce harmonic saturation at moderate SPL. This allows the Mini K67x to evoke the sound of vintage tube microphones, creating harmonics to complement the source, although without adding noise or crushing transients the way some tube mics would. Tech Data

