description: Portal is a passive pass-through Eurorack module split across two
  compact 2HP panels, connected via an internal ribbon cable. Signals entering
  one panel pass through unchanged and emerge from the other panel, allowing
  patch cables to be routed without crossing the front of the system.
details: |-
  Portal is a passive pass-through module split across two compact 2HP panels, connected quietly inside the case. Signals enter on one side and emerge on the other, unchanged.
