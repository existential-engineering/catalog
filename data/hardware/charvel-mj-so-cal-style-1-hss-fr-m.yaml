description: Harkening back to the late '80s when Charvel guitars were
  manufactured exclusively in Japan, the all-new MJ Series is an exciting lineup
  of instruments attentively crafted in Japan. The MJ So-Cal Style 1 HSS FR M
  pairs a gloss-finished alder So-Cal Style 1 body with a bolt-on maple neck and
  maple fingerboard, blending Charvel's legacy of high-performance design with
  top-end features and a stunning Gloss Black finish.
details: |-
  The MJ So-Cal Style 1 HSS FR M features a gloss-finished alder So-Cal Style 1 body in Gloss Black with a 1-ply white pickguard, mated to a bolt-on maple neck with graphite reinforcement, a hand-rubbed oil finish, and a Speed Neck profile with rolled fingerboard edges. The maple fingerboard sports a 12"-16" compound radius, 24 jumbo frets, black dot position inlays, a Floyd Rose 1000 Series locking nut (1.6875" width), and a 25.5" scale length.

  Electronics are an HSS configuration featuring a Seymour Duncan JB TB-4 humbucker in the bridge position and a pair of Custom Seymour Duncan Flat Strat SSL-6 single-coils in the middle and neck positions, all in black. Wiring runs through master volume and tone controls and a 5-position blade switch.

  Hardware includes a recessed Gotoh GE1996T Series double-locking tremolo with Gotoh tremolo arm, Gotoh die-cast tuning machines, and Dunlop dual-locking strap buttons, all in a chrome finish. The licensed Fender Stratocaster headstock and 4-bolt sculpted heel neck plate with heel-mount truss rod adjustment wheel round out the build. A Charvel multi-fit hardshell gig bag is included.
