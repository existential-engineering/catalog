description: The Cali76 Stacked Compressor is a dual-stage compressor pedal,
  using two compressors cascaded in series for the ultimate compressed guitar
  tone. Incorporating all the latest improvements to Origin Effects' Cali76
  circuit, it gives super-squashed cleans, singing slide tones, and endlessly
  sustaining leads.
details: |-
  The Cali76 Stacked Compressor doubles up on studio-quality, tweakable compression. With two FET compression stages, each boasting its own set of controls, you can achieve a huge range of compressed tones. From gentle "always on" dynamic shaping to larger-than-life funk squish, all the way to never ending sustain for lead and slide tones.

  You can set each stage to provide its own flavour of compression. For example, setting Stage 1 with slow attack and fast release will exaggerate pick attack. Then use Stage 2 to fatten up the whole sound with a fast attack setting, giving you the best of both worlds - a punchy, percussive sound that's always right at the front of the mix.

  It wouldn't be a modern compressor pedal without a DRY control, allowing you to achieve parallel compression without the need for any extra gear. This gets you the perfect blend of presence, sustain and articulation.

  Great compression needs great headroom and this pedal has plenty. Voltages are increased internally to 24V from a standard 9VDC supply, meaning the Cali76 Stacked Compressor stays crystal-clear anywhere in your signal chain.

  Housed in a compact, brushed stainless enclosure and built in the UK from premium components, the Cali76 Stacked Compressor redefines the limits of pedal compression.
specs: |-
  - Dual-stage design for maximum compression
  - Independent controls for each stage
  - Dry level control for parallel compression
  - Individual LED gain reduction indicators for each compressor
  - Voltage increased internally to 24V for high headroom
  - Weight: 553 g (1.22 lb)
  - Dimensions: 124 x 64 x 58 mm (4.8 x 2.5 x 2.3 in.) L x W x H, includes knobs and switches
  - Input Impedance: 1 M ohm
  - Output Impedance: 1 k ohm
  - Current Draw: 200 mA
  - Power Supply: 9V DC, 2.1 mm centre-negative (mains adaptor only, no battery option)
