description: To add some space to your compositions and nuances in sound design
  Erica Synths Dual FX module brings you two identical sections of 8 custom
  effects with two adjustable and CV controllable parameters.
details: |-
  Dual FX brings two identical sections of 8 custom effects, each with two adjustable and CV controllable parameters, to add space to compositions and nuance to sound design.

  The module combines two Spin FV-1 chips, one per section, each filled with eight custom effect programs and an analogue dry/wet circuit. All parameter settings can be saved with the effect and recalled instantly during a performance.

  The output of the first FX section is normalised to the second input, so building large layers of effects takes no extra patching.

  Each section offers mono delay, stereo delay, hi-pass delay, big reverb, saturated reverb, stalker reverb, Ripper and a dual pitch shifter. Three controls per section keep it playable live: two apply to the selected algorithm and the third is Dry / Wet.

  Audio output level and CV level both span -5V to +5V. The panel is 10HP wide, the module is 45mm deep, and power draw is 118mA on the +12V rail and 61mA on the -12V rail.
specs: |-
  - Two Spin FV-1 chips, one per section
  - 8 custom effect programs per section
  - Two adjustable and CV controlled parameters per effect
  - Analogue dry/wet circuit
  - Parameter settings saved with the effect and instantly recallable
  - Output of the first FX section normalised to the second input
  - FX: mono delay, stereo delay, hi-pass delay, big reverb, saturated reverb, stalker reverb, Ripper, dual pitch shifter
  - Audio output level -5...+5V
  - CV level (full span) -5...+5V
  - Power consumption 118mA@+12V, 61mA@-12V
  - Module width 10HP
  - Module depth 45mm
