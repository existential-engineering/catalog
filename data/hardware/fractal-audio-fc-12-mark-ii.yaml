name: FC-12 Mark II
manufacturer: fractal-audio
primaryCategory: control-surface
url: https://www.fractalaudio.com/fc-controllers/
description: The FC-12 Mark II is a twelve-switch foot controller for the
  Fractal Audio Axe-Fx III, FM9 and FM3, with larger and easier-to-read
  footswitch mini-displays than the original version. One standard XLR cable
  carries FASLINK II two-way communication between the controller and the host
  processor.
details: |-
  The FC-12 Mark II is one of two Fractal Audio FC foot controllers for the Axe-Fx III, FM9 and FM3, carrying twelve footswitches where the FC-6 Mark II carries six. Aside from the number of switches, the two FC models are identical in capabilities. The controller does not process audio itself, it controls the host processor.

  The Mark II version is equipped with larger and easier-to-read footswitch mini-displays. The height of individual characters of text doubles from 4.6mm to 9.2mm and is presented in a bolder, more readable font, and each of the twelve mini-displays grows from 1.4 x 0.5 inches (36.0mm x 12.5mm) to 1.9 x 0.7 inches (50.0mm x 17.5mm). Overall product dimensions and weight remain the same as the original version.

  The unit is designed to be easy to use while granting extreme flexibility. For simplicity it is virtually plug-and-play, with the Master Layout Menu selecting from Layouts, pages of footswitches arranged in familiar and intuitive ways. On each layout the LED rings change color to show switch functions and statuses (on, off, dim) while smart LCD mini-displays give an automatic readout for each switch, removing the need for labels. EZ Mode modifies any switch in seconds to control presets, banks, scenes, effects, channels, tuner, tempo, looper and control switches, and any layout can be rebuilt with custom tap and hold functions, custom mini-display text, and per-preset overrides of individual footswitches.

  The unit is housed in a powdercoated 16-gauge steel chassis with durable protective endcaps that double as feet, and the SSS footswitches are quiet and durable with no mechanical contacts to fail. The LED rings and displays stay readable from darkness to full sunlight. FASLINK II carries two-way communication between the FC and the Axe-Fx III, FM9 or FM3 over one standard XLR cable, faster than MIDI and more rugged than Ethernet. A FASLINK thru port allows up to four FC units to be daisy-chained, and FASLINK II powers the first FC while an AC adapter is used for downstream units.

  Four jacks connect expression pedals such as the Fractal Audio EV, and another two jacks connect up to four external switches, which the Axe-Fx III, FM9 or FM3 can use for a range of global and modifier control options. Mirroring lets an on-stage and an off-stage FC imitate each other completely without dual programming, with any change on either reflected on both. FC firmware and settings are built into the host processor, so the controller does not normally need to be updated or backed up separately and can gain new features for years to come.
specs: |-
  - Twelve footswitches, each with a customizable LCD mini-display and a variable-color LED ring showing on, off or dim status
  - Larger Mark II mini-displays at 1.9 x 0.7 inches (50.0mm x 17.5mm), character height 9.2mm
  - 2x20 transflective main display shows preset, scene and more
  - Plug-and-play default settings or custom Layouts, switched on the fly or from the Master Layout Menu
  - EZ Mode assigns a switch to presets, banks, scenes, effects, channels, tuner, tempo, looper and control switches
  - Per-preset overrides of individual footswitch functions
  - Mirroring between an on-stage and an off-stage FC, with both units acting as master
  - Daisy-chain up to four FC units
  - FASLINK II port for connecting to an Axe-Fx III, FM9 or FM3, plus a FASLINK II thru port for other FC units
  - Powered over FASLINK II as the first unit in the chain, with an AC adapter used for downstream units
  - Four expression pedal jacks plus two jacks for up to four external switches
  - No MIDI port of its own: the FC can trigger the Axe-Fx III, FM9 or FM3 to transmit MIDI from the host's own MIDI out
  - Firmware and settings are stored in the host processor
  - Powdercoated 16-gauge steel chassis with protective endcaps that double as feet
  - SSS footswitches with no mechanical switch contacts
  - Dimensions: 20.2 x 9.2 x 3.5 inches (512mm x 233mm x 88mm)
  - Weight: 11 lbs (5 kg)
