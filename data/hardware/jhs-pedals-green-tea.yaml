description: A three-in-one bass utility pedal combining a compressor/enhancer,
  a parallel effects blender with tuner out, and a clean boost in a single
  enclosure.
details: |-
  The Green Tea is a three-footswitch bass utility pedal. The right footswitch activates the Lime Aid Compressor/Enhancer. The middle footswitch is a Blender that places drives or fuzzes in a parallel loop and blends the affected signal with clean signal; it can also be used as a tuner out or simple effects loop to activate multiple pedals for a preset tone. The left footswitch is a Mini Bomb Boost for rising above the mix or fattening up tone.
