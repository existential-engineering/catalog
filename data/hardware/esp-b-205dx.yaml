description: The LTD B-205DX is a 5-string bass that delivers far more than
  anyone would expect, given its modest price. Built with bolt-on construction
  at 34" scale, it offers a poplar body with an outstanding burled poplar top,
  where the wood's natural knots and figured grain provide an eye-catching
  aesthetic. This bass also offers a smooth and comfortable roasted maple neck
  and a rosewood fingerboard with dot inlays and 24 extra-jumbo frets.
  Components include black hardware, LTD tuners, an LTD DB-5 fixed bridge,
  controls for volume, balance, treble and bass EQ, and a set of excellent ESP
  SB-5 bridge and neck pickups.
