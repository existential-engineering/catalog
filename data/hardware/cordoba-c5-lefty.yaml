details: |-
  The C5 is one of Cordoba's flagship models and a top seller worldwide. Perfect as a first nylon-string guitar, this lightweight model is built with a solid Canadian Cedar top and Mahogany back and sides to produce a warm, well-rounded tone with beautiful sustain. Handmade in the traditional Spanish style, the C5's carved headstock, hand-inlaid wood rosette, Indian Rosewood binding, Savarez strings, and glossy PU finish result in a guitar that truly stands out from all other entry-level options. A lightweight adjustable truss rod is built into the neck for stability.
