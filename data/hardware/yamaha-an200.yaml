description: >-
  A compact desktop physical modeling analog synthesizer from Yamaha featuring a built-in
  16-step pattern sequencer and AWM2 drum sounds, designed as an all-in-one groove production
  tool for dance and electronic music.
details: |-
  Released in 2001, the Yamaha AN200 packages the analog modeling synthesis engine from the
  well-regarded AN1x keyboard into a tabletop format with integrated sequencing and rhythm
  capabilities. The result is a self-contained groove machine that can produce complete musical
  patterns combining synthesizer lines, bass parts, and drum beats without requiring any
  external equipment.

  The synthesis section offers five-voice polyphony with two modeled VCOs per voice generating
  sawtooth, variable pulse, multi-saw, oscillator sync, and FM waveforms. A resonant multimode
  filter provides 12, 18, and 24 dB per octave low-pass slopes alongside 12 dB high-pass,
  band-pass, and band-reject modes. The drum section runs on Yamaha's AWM2 sample playback
  engine with 32-voice polyphony, giving the rhythm sounds a quality that stands up well
  alongside the modeled analog tones.

  The 16-step sequencer supports four parts with 256 preset and 128 user patterns, plus a song
  mode for chaining patterns into arrangements. A Scene Memory function lets performers store
  two parameter snapshots per pattern and morph between them in real time, enabling dramatic
  timbral shifts during live performance. Fifteen quick-access knobs provide hands-on control
  over synthesis parameters.

  Built-in multi-effects processing includes delay, flanger, phaser, overdrive, amp simulation,
  distortion, and EQ. MIDI connectivity allows integration with larger production setups, and
  a bundled software editor provides deeper editing access from Mac or PC.
specs: |-
  - Polyphony: 5 voices (synth), 32 voices (AWM2 drums)
  - Oscillators: 2 VCO per voice (sawtooth, variable pulse, multi-saw, sync, FM, noise)
  - Filter: Multimode resonant (12/18/24 dB low-pass, 12 dB high-pass, band-pass, band-reject)
  - LFO: 1 with 21 waveforms
  - Envelopes: 2x ADSR (amp), 1x AD (pitch)
  - Sequencer: 16-step x 4 parts; 256 preset/128 user patterns; 10 songs
  - Scene Memory: 2 per pattern with real-time morphing
  - Effects: Delay, flanger, phaser, overdrive, distortion, EQ
  - Control: MIDI IN/OUT
  - Keyboard: 16 rubber pads
