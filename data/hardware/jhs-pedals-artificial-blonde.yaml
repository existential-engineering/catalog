description: Madison Cunningham's signature dual-preset true pitch vibrato pedal
  with stereo outputs and an active tilt EQ, offering two switchable speed/depth
  settings for live performance.
details: |-
  Madison Cunningham's signature pedal, the Artificial Blonde is a simplistic approach to her signature sound: a never-off, always-on, slightly 3D pitch vibrato. Developed from her use of the JHS Emperor Chorus/Vibrato, the pedal offers two easy-to-access presets switchable via a secondary footswitch for live use. Controls include VOLUME (overall output), EQ (active tilt EQ — left boosts lows/cuts highs, right boosts highs/cuts lows), SPEED (vibrato rate), and DEPTH (vibrato intensity). The left footswitch is true bypass, and when off, both outputs pass dry signal via buffered bypass. The right footswitch switches between Preset A and B (default on power-up is Preset B). Use the MONO output for mono or both outputs for a 3D stereo soundscape.
