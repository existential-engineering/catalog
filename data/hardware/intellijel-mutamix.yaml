description: Beyond Mixing Blending signals and mixing audio is what patching is
  all about. Consider mixing up to six audio or CV signals down to three
  separate busses. Now take it a step beyond by sequencing or toggling mute
  states on the incoming signals with CV from a clock source, sequencer or even
  a random source.
details: |-
  The Mutamix is a mixer that has been mutated to offer unique and powerful functionality. Up to six channels of audio or CV signals can be mixed and routed to the three selectable Bus outputs. Channels can be muted or soloed using buttons, but also muted using trigger or gate signals. Muting arrangements can be saved as presets for quick recall, and in X-Mode these presets can be step sequenced and randomized to inject life into your patches.

  Jumpers on the back allow the Mutamix faders to send a five volt range while an input is not connected, creating step sequencing functionality while in X-Mode. A Linix module can also be connected using a ribbon cable to normal the two together.

  This flexible configuration means that the Mutamix can function as an audio and CV mixer, sequential switcher, voice allocator, step sequencer, and complex modulation distributor.

  Blending signals and mixing audio is what patching is all about. Consider mixing up to six audio or CV signals down to three separate busses. Now take it a step beyond by sequencing or toggling mute states on the incoming signals with CV from a clock source, sequencer or even a random source.
specs: |-
  - Width: 18HP
  - Depth: 38mm
  - Current Draw: 58mA @ +12V, 44mA @ -12V
  - Six-channel CV/audio mixer with three selectable Bus outputs (A/B/C)
  - Attenuation on Bus Outputs A and C
  - Preset saving/loading of mute arrangements; X-Mode step sequencing, inversion, and randomization
  - +5V jumper enables step-sequencer-style operation without an input connected
  - Firmware updateable via Intellijel USB ISP or other AVR programmer
