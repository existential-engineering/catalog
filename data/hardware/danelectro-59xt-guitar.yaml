url: https://danelectro.com/guitars/59xt-guitar/
description: Double cutaway Shorthorn semi-hollow electric guitar with a
  high-output single coil neck pickup and dual humbucking Lipstick bridge pickup
  (coil-tap via push-pull tone). Features a Wilkinson vibrato bridge, 25-inch
  scale maple bolt-on neck, and rosewood fretboard.
details: |-
  Meet my other X: High output single coil in neck. Lipstick Humbucker pair in bridge. Coil tap the Humbucker pair with a pull on the tone knob. Body features outstanding resonance. Wilkinson tremolo provides perfect bar tension (adjustable) and excellent tune retention. Die cast chrome knobs. You and the other X... a match made in heaven!
specs: |-
  - Double cutaway Shorthorn shape
  - Semi-hollow body with center block
  - Composite/Plywood construction
  - Scale length: 25"
  - Fretboard Radius: 14"
  - Neck Shape: C
  - Nut: 1.65"
  - Neck Joint: Bolt-on
  - Neck Wood: Maple with double acting truss rod
  - Fretboard: Rosewood
  - Number of frets: 21
  - Wilkinson vibrato bridge
  - Tuners: 3 on a side
  - Hardware: Nickel
  - 1 dual humbucking Lipstick bridge pickup
  - 1 vintage style large housing single coil neck pickup
  - 1 master volume
  - 1 master tone (with push pull switch to split bridge pickup)
  - 3 way pickup switch
  - Finishes: Silver, Burgundy, Aqua, Black
