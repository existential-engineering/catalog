description: Chase Bliss's first true multi-effect pedal, a collection of 12 rare and strange effect modes that can be blended in countless ways, offering a full spectrum of textures inspired by effects that have captivated and perplexed over the years.
details: |-
  Lost + Found is Chase Bliss's first true multi-effect, a little museum of the rare and strange for you to wander around. Tour through 12 modes that can be blended in countless ways, a full spectrum of textures inspired by the effects that have captivated and perplexed over the years, from a phasing resonator to a distant synth to swelling octaves melting in the sun.

  The pedal contains a complete set of special spices, designed to bring new energy to a player's music and offer something for every situation. Its left and right channels can each select from 12 effect modes (Slow-verb, Useful Ambience, Orchestral Swell, Pitch Repeater, Pinging Phaser, Spectral Modulator, Tape Echo, Grain Tumbler, Impulse Synthesizer, Sympathetic Resonator, Ensemble Expander, and Gen Lite), explored via 144 possible blend combinations in series or parallel using the BLEND and routing controls.

  Additional features include Glue, a bonus compressor/saturator hidden behind the BLEND knob that adds a finished quality or overload character to the signal chain; Spill, for routing the dry input into the second effect in a series chain; independent per-channel EQ; and dip switches (MISO, SPREAD, LATCH, L/R SWAP, UNSYNC, TRAILS, BANK) for further customization, internal modulation, and alternate behaviors. It stores 4 internal presets and can access up to 122 more via MIDI.

  Lost + Found is a true stereo device usable in mono, stereo, or mono-to-stereo, and can be controlled via MIDI, CV, expression, or external footswitches. It now ships with Lost + Found 2.0 firmware, which restores the overdriven voicing for the Sympathetic Resonator (mode 5B) heard in early demos, selectable via a toggle combination; owners of the prior (2025) unit can update via the Bliss Programmer.

  Lost + Found is the second pedal in Chase Bliss's Small Batch Bliss collection: a made-to-order line of special edition pedals with no unit limit, built to order for anyone who orders within a month-long preorder period.
specs: |-
  - 12 effect modes across two channels, with 144 possible blend combinations
  - Blend: series or parallel routing between channels
  - Glue: end-of-chain compressor/saturator
  - Spill: routes dry input into the second effect in series
  - Independent per-channel EQ
  - 4 internal presets, up to 122 accessible via MIDI
  - MIDI: program change, control change, clock sync
  - CV control (0-5V range)
  - Expression control
  - Tap tempo
  - Trails
  - True bypass (mode dependent)
  - Dip switches: MISO, SPREAD, LATCH, L SWAP, R SWAP, UNSYNC, TRAILS, BANK
  - Ramping/bounce automation of knob parameters
  - Includes Lost + Found 2.0 firmware
  - Power: 9V DC Center Negative, ~200 mA
