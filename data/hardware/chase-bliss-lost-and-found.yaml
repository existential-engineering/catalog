description: Chase Bliss's first true multi-effect pedal, a collection of 12
  rare and strange effect modes that can be blended in countless ways, offering
  a full spectrum of textures inspired by effects that have captivated and
  perplexed over the years.
details: |-
  Lost + Found is Chase Bliss's first true multi-effect, a little museum of the rare and strange for you to wander around. Tour through 12 modes that can be blended in countless ways, a full spectrum of textures inspired by the effects that have captivated and perplexed over the years.

  Lost + Found is not bread and butter. Chase Bliss set out to create a multi-effect that would bring new energy to your music, while still offering a little something for every occasion. A complete set of special spices. Use it to shake up your sound, as a creative starting point into the world of effects, or as a fresh start.

  The pedal features 12 distinct effect modes including an Impulse Synthesizer and Sympathetic Resonator, with 144 possible mode combinations available by blending two modes simultaneously. It supports tap tempo, trails, and true bypass (mode dependent).

  Lost + Found includes stereo audio I/O, MIDI support with program change, control change, and clock sync, CV control, expression control, and 4 internal presets with up to 122 accessible via MIDI. Rear-panel dip switches provide further customization options.
specs: |-
  - 12 effect modes with 144 possible combinations
  - Stereo I/O
  - Tap tempo
  - Trails mode
  - True bypass (mode dependent)
  - 4 internal presets, 122 via MIDI
  - MIDI: PC, CC, clock sync
  - CV control
  - Expression control
  - Dip switches for customization
  - Power: 9V DC Center Negative, ~200 mA
