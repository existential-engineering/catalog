description: Chase Bliss's first true multi-effect pedal, a collection of 12
  rare and strange effect modes that can be blended in countless ways, offering
  a full spectrum of textures inspired by effects that have captivated and
  perplexed over the years.
details: |-
  Lost + Found is a collection of curiosities. It's Chase Bliss's first true multi-effect, a little museum of the rare and strange for you to wander around and try out. Inside you will find twelve modes that can be blended and combined in countless ways, a full spectrum of sounds inspired by the effects that have captivated and perplexed the makers over the years.

  The left and right channels each choose from 12 effect modes: Slow-verb, Useful Ambience, Orchestral Swell, Pitch Repeater, Pinging Phaser, Spectral Modulator, Tape Echo, Grain Tumbler, Impulse Synthesizer, Sympathetic Resonator, Ensemble Expander, and Gen Lite, explored through 144 possible combinations via Blend (series or parallel routing) and Swap (which lets either channel borrow the other channel's mode set).

  Additional processing includes Glue, a compressor/saturator hidden behind the BLEND knob for a finished quality or overloaded character; Spill, which routes the dry input into the second effect in a series chain; and independent EQ per channel for shaping and separating parallel effects. Four presets are stored internally, with up to 122 more accessible via MIDI.

  Lost + Found is a true stereo device usable in mono, stereo, or mono-to-stereo, and can be controlled via MIDI, CV, expression, or an external footswitch. Dip switches (MISO, SPREAD, LATCH, L SWAP, R SWAP, UNSYNC, TRAILS, BANK) unlock further customization, alternate behaviors, and internal modulation via Ramping/Bounce.

  Lost + Found now ships with 2.0 firmware, which restores the overdriven voicing for the Sympathetic Resonator (mode 5B) heard in early demos; 2025 units can update via the Bliss Programmer. It is the second pedal in Chase Bliss's Small Batch Bliss collection, a made-to-order line built during a month-long preorder window with no unit limit.
specs: |-
  - 12 effect modes across two channels, with 144 possible blend combinations
  - Blend: series or parallel routing between channels
  - Swap: replace one channel's modes with the other channel's modes
  - Glue: end-of-chain compressor/saturator
  - Spill: routes dry input into the second effect in series
  - Independent per-channel EQ
  - 4 internal presets, up to 122 accessible via MIDI
  - Stereo I/O (mono, stereo, or mono-to-stereo compatible)
  - MIDI (program change, control change, clock sync)
  - CV control (0-5V range)
  - Expression control
  - Tap tempo
  - Trails
  - True bypass (mode dependent)
  - Dip switches: MISO, SPREAD, LATCH, L SWAP, R SWAP, UNSYNC, TRAILS, BANK
  - Ramping/Bounce automation of knob parameters
  - Ships with Lost + Found 2.0 firmware
  - Power: 9V DC Center Negative, ~200 mA
