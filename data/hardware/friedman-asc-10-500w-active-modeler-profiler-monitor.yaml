details: |-
  The Friedman ASC-10 powered monitor was designed and voiced for use with today's guitar amp modelers and profilers including Fractal Audio Axe-Fx, Kemper Profiler, Line 6 HD Series, Synergy and others. The ASC-10 delivers rich authentic tones, letting players get the most out of these systems in live use and playback applications.

  The ASC-10 active monitor is an ultra-compact onstage modeling solution. It combines a high-end 1 x 10 inch speaker cabinet with 500 watts of clean, analog power in a familiar and elegant design, pushing the tone of a favourite modeler through the air while blending seamlessly with the rest of the rig. Thanks to the cabinet's tilt-back floor monitor design, every nuance of a performance is easy to hear as clearly as possible.

  With the ASC-10, the cabinet can be positioned anywhere onstage while every note still reaches the player. Its tilt back design allows it to be placed comfortably out front, delivering sound directly to the player's ears, or behind in the traditional location for amplifiers, where its guitar-cabinet look blends right in with the rest of the backline.

  The heart of the ASC-10 is its all-analog, bi-amped Class G power section, built with materials chosen for reliability and sonic clarity. At 500 non-digital watts it carries a warmth and detail that leave PA-style monitoring far behind, with plenty of power for any performance.

  The back panel carries straightforward control for tailoring the ASC-10 to any situation: a level control and a Low Cut switch keep frequencies and volume balanced, and both balanced XLR and 1/4 inch inputs offer the hookup flexibility needed. Every unit is inspected and tested before shipping.
specs: |-
  - 10 inch two-way active stage monitor for use with modelers and profilers
  - All-analog, bi-amped Class G power section
  - Power output LF 270 W rms Class G, HF 80 W rms Class AB+B
  - Maximum total burst power 500 W
  - Low frequency transducer: Celestion 10 inch TF1025E woofer
  - High frequency transducer: Celestion PETP film compression driver with 1 inch voice coil
  - Frequency range 50 Hz to 20 kHz
  - Frequency response 58 Hz to 18 kHz
  - High frequency dispersion by optical wave guide
  - Maximum peak SPL 129 dB
  - Input impedance 20 kohm balanced, 10 kohm unbalanced
  - Input sensitivity 775 mV (0 dBu)
  - Electronic crossover 4th order
  - Switchable low cut filter, 3rd order Butterworth at 100 Hz, controls frequencies below 100 Hz
  - Controls: level knob, low-cut filter switch, ground lift switch
  - Power switch, AC fuse, 115/230 V switch
  - Indicators: Power, Protect
  - Convection cooling
  - Amplifier protection: short circuit, clip-limiter, overheat mute, SOA output stage, driver DC protection, subsonic filter, turn-on mute and soft ramp, turn-on inrush current limiting
  - Power consumption 1.7 A at 115 Vac, 0.85 A at 230 Vac, 150 VA at one eighth power pink noise
  - Connectors: balanced 1/4 inch input, balanced male XLR link output
  - Enclosure: black texture painted Baltic birch plywood construction
  - Hardware: strap handle, rubber feet and rubber strips
  - Tilt-back design for optimal onstage placement, looks like a traditional cabinet when placed vertical
  - Made in USA using premium worldwide components
  - Weight 34 lbs
