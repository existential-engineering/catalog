details:
  - Microcosm is a granular effects pedal that rearranges and reinterprets sound using sampling, pitch-shifting, delay, and looping techniques. It offers cascading micro-loops that can be locked into tap-tempo synced rhythms, transformed into ambient textures, or woven into hypnotic drones.
  - 'The pedal features 11 unique granular and looping effects across four effect banks: micro loop (3 effects), granules (3 effects), glitch (3 effects), and multidelay (2 effects). Each effect bank contains 4 preset variations, providing a total of 44 distinct sound manipulation options.'
  - Key effect types include mosaic (overlapping loops at different speeds), seq (rhythmic sample rearrangement), glide (pitch-shifting loops), haze (micro-loop sound wash), tunnel (hypnotic drones), strum (pointillistic textures), and various glitch and delay manipulations.
  - Advanced features include real-time effect playback control, forward/reverse effect switching, pitch modulation from subtle vibrato to extreme warble, and a 60-second phrase looper with infinite overdubbing, reverse playback, and fade capabilities.
  - Users can control the internal clock via tap tempo, MIDI, or manual tempo control, and save favorite effects, settings, configurations, and recorded loops for later recall.
