description: Crafted in partnership with McLaren, the Pi8 McLaren Edition
  combines the unrivalled performance of the flagship Bowers & Wilkins True
  Wireless earbuds with
  iconic McLaren-inspired design.
details: |-
  Pi8 McLaren Edition is a special-edition version of the Bowers & Wilkins flagship True Wireless earbud, made under licence from McLaren Automotive and tied to the partnership with the McLaren Formula 1 Team. It is finished in Galvanic Grey with Papaya details drawn from McLaren's supercars and the 2024 Constructors' Championship-winning MCL38.

  The acoustic package is the flagship one. Each earbud carries a 12mm Carbon Cone drive unit with its own DSP and amplifier/DAC, chosen to cut distortion and recover high-frequency detail that softer diaphragms miss, fed by a true 24-bit audio connection over Bluetooth 5.4 with aptX Lossless.

  Three microphones per earbud serve telephony and the Active Noise Cancellation system, which adapts automatically to the surroundings, so calls and listening hold up in changing environments. Multipoint connectivity keeps two devices paired at once, and a five-band customisable EQ plus a TrueSound mode sit in the app for tuning.

  The smart charging case is the other half of the system. It charges wirelessly on any pad or over USB-C, supports fast charging, and can retransmit audio: connect the case to a source and it re-broadcasts the signal to the earbuds over aptX Adaptive, which is how an analogue or wired-only source reaches them. An 80cm 3.5mm jack to USB-C cable is supplied for exactly that.

  The Bowers & Wilkins Music app handles set-up, control and its own direct music streaming. Earbuds weigh 7g each, are rated IP54, and run up to 6.5 hours with ANC on plus a further 13.5 hours from the case; a 15-minute charge returns two hours of playback.
specs: |-
  - Wearing style: in-ear noise-cancelling True Wireless earbuds
  - Drive units: 12 mm Carbon Cone
  - Microphones: 3 per earbud for telephony and ANC
  - Technical features: high-performance DSP with dedicated DSP and amplifier/DAC, true 24-bit audio connection, 5-band customisable EQ plus TrueSound mode, Bluetooth 5.4 with aptX Lossless, multipoint connectivity, Active Noise Cancellation (ANC), audio retransmission from the charging case (aptX Adaptive), wireless and USB-C charging, fast charging support, Apple MFi Made for iPhone support
  - Bluetooth codecs: aptX Lossless, aptX Adaptive, aptX Classic, AAC, SBC
  - Audio inputs: earbuds via Bluetooth; charging case via its USB-C socket, taking analogue sources through the supplied 3.5 mm jack to USB-C cable (wireless audio retransmission through the charging case)
  - Battery type: rechargeable lithium-ion (earbuds and charging case)
  - Battery life and charging: up to 6.5 hours for earbuds (with ANC on), additional 13.5 hours from the charging case, charge time 2 hours, 15-minute charge = 2 hours playback
  - Wireless charging support: yes
  - Water resistance: IP54 (earbuds)
  - Weight: earbuds 7g each, charging case 46g
  - Dimensions (charging case): 65 mm (w) x 29 mm (d) x 52 mm (h)
  - Accessories: extra small / small / medium / large ear tips, 60 cm USB-C to USB-C charging cable, 80 cm 3.5 mm jack to USB-C audio cable
  - Finish: Galvanic Grey / Papaya
  - Manufactured under licence from McLaren Automotive Limited
