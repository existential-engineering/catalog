details: |-
  The Pi8 McLaren Edition represents a collaboration between Bowers & Wilkins, McLaren Automotive, and McLaren Racing, merging high-performance wireless audio with McLaren-inspired aesthetics. The earbuds are finished in Galvanic Grey with Papaya details inspired by McLaren's supercars and the 2024 Formula 1 Constructors' Championship-winning MCL38.

  Engineered for true high-resolution audio performance with a 24-bit connection, the Pi8 McLaren Edition uses 12mm Carbon Cone drive units to deliver music with outstanding precision and accuracy. The earbuds support a full suite of advanced Bluetooth codecs including aptX Lossless, aptX Adaptive, aptX Classic, AAC and SBC over Bluetooth 5.4.

  Advanced active noise cancellation automatically adapts to your surroundings, while three microphones per earbud provide clarity on calls. A 5-band customizable EQ and TrueSound mode let you tailor the sound to your preference via the Bowers & Wilkins Music app, which also provides industry-first headphone music streaming directly to the earbuds.

  The matching McLaren-branded wireless charging case delivers an additional 13.5 hours of playback on top of the earbuds' 6.5 hours with ANC enabled, and supports audio retransmission via aptX Adaptive from a wired source using its 3.5mm jack input — handy for in-flight entertainment systems. Multipoint connectivity, MFi certification, and IP54 water resistance round out the feature set.
specs: |-
  - 12mm Carbon Cone drive units
  - Bluetooth 5.4
  - Codecs: aptX Lossless, aptX Adaptive, aptX Classic, AAC, SBC
  - 24-bit high-resolution audio connection
  - Active Noise Cancellation with adaptive technology
  - 3 microphones per earbud
  - 5-band customizable EQ + TrueSound mode
  - Battery life: up to 6.5 hours (earbuds, ANC on)
  - Charging case provides additional 13.5 hours
  - Charge time: 2 hours; 15-minute quick charge = 2 hours playback
  - Wireless charging and USB-C charging support
  - Audio retransmission via charging case (aptX Adaptive)
  - Multipoint connectivity
  - MFi (Apple Made for iPhone) certified
  - IP54 water/dust resistance (earbuds only)
  - Earbud weight: 7g each
  - Charging case weight: 46g
  - Charging case dimensions: 65mm (W) x 29mm (D) x 52mm (H)
  - In the box: Extra Small/Small/Medium/Large ear tips, 60cm USB-C to USB-C charging cable, 80cm 3.5mm jack to USB-C audio cable, wireless charging case
