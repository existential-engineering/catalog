description: "The 20-watt PF-20T is a lower-wattage version of the PF-50T. Like
  its more powerful sibling, the PF-20T features a versatile EQ section, a
  transformer-balanced DI circuit, and a user-adjustable Bias control. It
  delivers the same legendary all-tube tone, just at lower volumes."
details: |-
  The PF-20T is the lower-wattage sibling of the PF-50T, offering the same versatile EQ section, transformer-balanced DI circuit, and user-adjustable Bias control in a 20-watt all-tube package.

  Easily accessible tubes simplify maintenance and tube swaps, and the head does not require a speaker connection to operate, making silent recording and DI sessions possible.
specs: |-
  - 20 Watts power output
  - All-tube design
  - Easily accessible tubes
  - User-adjustable Bias control
  - Transformer-balanced DI output
  - Versatile EQ section
  - Weight: 15.2 lb / 6.9 kg
