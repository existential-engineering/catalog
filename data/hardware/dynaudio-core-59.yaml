details: |-
  Core 59 is the flagship of Dynaudio's Core professional reference monitor series — a three-way design intended to span near-field, mid-field, and main monitoring duties in a single cabinet. Like every Core monitor, it is hand-crafted in Denmark using in-house drivers and is individually calibrated at the factory before shipping.

  The system pairs a 1.1-inch Esotar Pro soft-dome tweeter with Hexis inner-dome technology, a 4-inch MSP midrange, and a 9-inch MSP woofer. Class-D Pascal amplification drives each section independently, with onboard DSP running at 192kHz internal sample rate. A rotatable Orbit baffle lets the cabinet be placed either horizontally or vertically without altering driver alignment.

  Positioning filters and the Sound Balance tonal adjustment let the monitor be tuned to the listening environment, with three acoustic-environment presets (Anechoic, Desk, Soffit) plus boundary-frequency correction. Inputs include balanced analogue (XLR), AES3 digital with downstream pass-through, and a word-clock reference input for syncing across systems.

  Core 59 is intended for music recording, mastering, post-production, broadcast, game audio, and immersive (Dolby Atmos) production — anywhere a single reference monitor needs to cover multiple distances and roles with consistent tonal character.
specs: |-
  - Type: Three-way reference monitor (near-field, mid-field, main)
  - Box principle: Front-loaded bass reflex
  - Crossover type: 3-way DSP-based
  - Tweeter: 1.1" Esotar Pro soft dome with Hexis
  - Midrange: 4" MSP
  - Woofer: 9" MSP
  - Amplification: Class-D Pascal
  - DSP: 192 kHz internal sample rate, 64-bit processing
  - Positioning: Rotatable Orbit baffle (horizontal or vertical placement)
  - Acoustic environment presets: Anechoic, Desk, Soffit
  - Room correction: Positioning filters and Sound Balance tonal adjustment
  - Inputs: Analog (XLR), AES3 digital, AES3 pass-through, word clock
  - AC power input: 100-240V 50/60Hz
  - Finish: Dark Grey
