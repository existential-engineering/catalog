description: Floor-standing 3-way vented-box loudspeaker from Bowers & Wilkins'
  800 Series Diamond, delivering much of the flagship 801 D4's performance in a
  more compact and accessible form. Combines a Diamond dome tweeter, Continuum
  cone FST midrange in an isolated Turbine Head, and twin Aerofoil bass cones in
  a Matrix-braced cabinet.
details: |-
  The 802 D4 sits one step below the flagship 801 D4 in Bowers & Wilkins' reference 800 Series Diamond range, retaining the same core driver and cabinet technologies in a slightly smaller form factor. It is intended for high-end stereo listening rooms and reference-grade home theater installations where minimal coloration and accurate reproduction of the recorded signal are the primary goals.

  The 25mm Diamond dome tweeter is mounted in a Solid body Tweeter-on-Top housing, decoupling it from the main cabinet and allowing it to extend cleanly to 35kHz. The 150mm Continuum cone FST midrange sits in a dedicated Turbine Head enclosure with Biomimetic Suspension, isolating the midrange driver from the bass cabinet and the cabinet from the midrange's own back-radiation.

  Bass is handled by twin 200mm Aerofoil cone drivers with Anti-Resonance Plugs, loaded by a Flowport-tuned, Matrix-braced cabinet. The aluminum top-plate trimmed with Connolly leather and the curved cabinet construction reflect the visual and mechanical engineering language of the 800 Series.

  Electrically the 802 D4 presents a nominal 8Ω load (minimum 3.0Ω) with 90dB sensitivity, and is rated for 50-500W amplifiers on unclipped programme. Frequency response is quoted as 17Hz-28kHz (±3dB on reference axis) with usable extension from 14Hz to 35kHz.
specs: |-
  - Type: 3-way vented-box floor-standing loudspeaker
  - Tweeter: 1x 25mm (1 in) Diamond dome, Solid body Tweeter-on-Top
  - Midrange: 1x 150mm (6 in) Continuum cone FST with Biomimetic Suspension, Turbine Head enclosure
  - Bass: 2x 200mm (8 in) Aerofoil cone with Anti-Resonance Plugs
  - Frequency range: 14Hz - 35kHz
  - Frequency response: 17Hz - 28kHz (±3dB from reference axis)
  - Sensitivity: 90dB (on-axis at 2.83Vrms at 1m)
  - Harmonic distortion: <1% (70Hz-20kHz), <0.3% (100Hz-20kHz)
  - Nominal impedance: 8Ω (minimum 3.0Ω)
  - Recommended amplifier power: 50W - 500W into 8Ω on unclipped programme
  - Maximum recommended cable impedance: 0.1Ω
  - Cabinet bracing: Matrix internal bracing
  - Bass loading: Flowport
  - Top-plate: Aluminum with Connolly leather trim
  - Finishes: Gloss Black, White, Satin Rosenut, Satin Walnut
  - Grille options: Black or grey
  - Height: 1218mm (48 in)
  - Width: 413mm (16.3 in)
  - Depth: 602mm (23.7 in)
  - Net weight: 88.10kg (194.2 lbs)
