description: Built to similar proportions as the flagship 801 D4, the 802 D4
  offers much of the performance of its sibling, including the same Turbine Head
  enclosure for its midrange drive unit, yet is more affordable overall.
details: |-
  The 802 D4 is a three-way vented-box tower loudspeaker in the 800 Series Diamond range, built to similar proportions to the flagship 801 D4 but with 200mm rather than 250mm bass cones. It is a passive design driven from an external amplifier, with a recommended amplifier power of 50W to 500W into 8 ohms and no mains connection of its own.

  Bowers & Wilkins presents its proportions and painted or real-wood-veneer finishes as suited to a living room without compromising performance, and calls it perfect for reference-grade stereo listening and an excellent choice in home theatre applications.

  The Aerofoil bass cone combines low mass and high stiffness through a carbon-fibre skin over a variable-profile foam core, now paired with a foam Anti-Resonance Plug for lower distortion and cleaner bass. Every stereo model in the range has an upgraded cabinet with an aluminium top-plate, which also mounts the Leather by Connolly trim, black leather on dark cabinets and light grey on lighter finishes.

  The midrange uses three Bowers & Wilkins technologies together: the Continuum cone, Biomimetic Suspension and midrange decoupling, the last of these keeping interference from the bass drivers to a minimum. The midrange sits in the same all-aluminium Turbine Head enclosure used by the flagship.

  Each cabinet stands 1218mm tall, is 413mm wide and 602mm deep, and weighs 88.10kg. Finishes are Gloss Black, White, Satin Rosenut and Satin Walnut, with black and grey grille options. The company notes that only one model in the range can best it, the flagship 801 D4 with its 250mm bass cones in a more substantial low-frequency enclosure.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond tweeter, Solid body Tweeter-on-Top, Continuum cone FST, Matrix, Anti-Resonance plug, Biomimetic Suspension, Turbine Head, Aerofoil cone bass units, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 150mm (6in) Continuum cone FST midrange, 2x 200mm (8in) Aerofoil cone bass units
  - Frequency range: 14Hz to 35kHz
  - Frequency response: 17Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 70Hz to 20kHz, less than 0.3% 100Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 500W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Speaker terminals: two pairs per cabinet for bi-wiring, accepting 4mm banana plugs, 6mm and 8mm (1/4in and 5/16in) spades, or bare wire up to 4mm (5/32in)
  - Dimensions: Height 1218mm (48in), Width 413mm (16.3in), Depth 602mm (23.7in)
  - Net weight: 88.10kg (194.2lb)
  - Cabinet finishes: Gloss Black, White, Satin Rosenut, Satin Walnut
  - Grille finishes: Black, Grey
