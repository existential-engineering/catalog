description: >-
  The Oberheim Echoplex Digital Pro is a 16-bit digital delay and loop recorder
  designed for performing artists, offering real-time recording, overdubbing,
  and looping with up to 200 seconds of expandable RAM-based memory and full
  MIDI control.
details: |-
  The Echoplex Digital Pro is a digital delay designed for the performing artist. It features 16-bit digital 44.1 kHz recording and sampling to RAM with 50 seconds of memory, expandable to 200 seconds using standard RAM SIMM chips.

  Users can play anything into it in real-time, including loops, guitar, and keyboards. As soon as recording stops, the sampled material begins looping and additional overdubs can be layered to build arrangements on the fly. The Echoplex can store up to 9 separate loop arrangements.

  An EFC-7 foot controller allows punch in and out of loops without using hands. The Echoplex is fully MIDI capable with all controls sending and receiving MIDI data. Loops can be saved and loaded via MIDI, and MIDI sync ensures loops can be locked to the tempo of external MIDI sequencers.

  Other functions include reverse for backwards loops and a multiplay feature which repeats loops a user-defined number of times. Unfortunately there are no robust effects available such as filtering, time stretching, pitch shifting, stereo effects, or resampling. The unit was later reissued by Gibson in 2001, with a slightly upgraded Digital Pro Plus version following in 2003.

  The Echoplex Digital Pro has been used by Brian Eno, U2, and Crystal Distortion.
specs: |-
  - Type: Digital delay/loop recorder
  - Sampler: 16-bit, 44.1 kHz
  - Memory: RAM-based, 50 seconds (expandable to 200 seconds)
  - Loops: Unlimited overdubs per loop, up to 9 loops storable
  - Effects: Loop Reverse, Multiplay
  - Keyboard: None
  - Control: MIDI, EFC-7 foot controller
