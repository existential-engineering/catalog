details: |-
  Take care of your utility mixing needs with the Active Mixer, a dual active averaging mixer in 2hp that functions as either two 3-to-1 and a 6-to-1 averaging mixer, letting you mix audio and CV in a highly efficient package. No knobs and no buttons, just pure mixing joy to help you sort out your patches with no wasted space. Not much else to say about this tiny wonder of technology, except to say it does what it says. Money well spent thanks to Herzlich Labs, once again.
