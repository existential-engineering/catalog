description: A relatively large 2-way active nearfield studio monitor comprising
  a 240mm (10") woofer, a special version of the Dynaudio ESOTEC soft dome
  tweeter, and an electronic phase-aligned crossover feeding built-in dual
  high-performance discrete MOSFET amplifiers.
details: |-
  A relatively large 2-way active system comprising of a large 240mm (10") woofer, a special version of the Dynaudio ESOTEC soft dome tweeter and an electronic phase-aligned crossover, which feeds the build-in dual, high performance discrete MOSFET amplifiers.

  The ESOTEC HF has a dynamic headroom of 1000W, and the 240mm (10") bass driver is world-renowned for its 100mm (4") aluminium alloy voice coil.

  The BM15A monitor is front ported for powerful and extended low frequency response, and the elegant matte cabinet has radius edges on the front baffle to reduce boundary effects and improve the overall sound quality.
specs: |-
  - Type: Nearfield Monitor
  - Box principle: Front-loaded bass reflex
  - Crossover type: 2-way
  - Crossover frequency: 1800 Hz
  - Tweeter: ESOTEC soft dome
  - Woofer: 10" MSP
  - Amplifier power (woofer): 200W
  - Amplifier power (tweeter): 100W
  - Maximum SPL (1m, pair): 124 dB
  - Lower cutoff (-3dB @ 85dB): 40 Hz
  - Upper cutoff (-3dB @ 85dB): 21 kHz
  - AC power input: 100-240V 50/60Hz
  - Max power consumption: 300W
  - Weight: 18.6 kg (41 lbs)
  - Dimensions (W x H x D): 290 x 454 x 388 mm (11 3/8" x 17 7/8" x 15 2/8")
