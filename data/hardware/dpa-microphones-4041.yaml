details: |-
  This large diaphragm omnidirectional microphone capsule can be used with the Solid State Phantom Power. The diaphragm and housing are both made from stainless steel. This gives the capsule a unique immunity against ambient temperature variations. The precision-made back plate is placed in a quartz insulator for maximum electrical stability.

  This large diaphragm omnidirectional condenser microphone capsule can be used with the Solid State Phantom Power. The diaphragm and housing are both made from stainless steel. This gives the capsule a unique immunity against ambient temperature variations. The precision-made back plate is placed in a quartz insulator for maximum electrical stability.

  The 4041 Large Diaphragm Condenser Microphone has a frequency response from 10 Hz to 20 kHz with a 4-6 dB soft boost around 8 kHz. Furthermore, it has an extremely low self-noise of 8 dB(A). It also has enhanced SPL handling capability of up to 134 dB SPL before clipping occurs.

  This omnidirectional condenser microphone is designed to work in a standard 48 V phantom power environment. It features the MMC4041 Large Diaphragm Capsule so the mic offers superior sound quality.

  The diaphragm and housing are both made from stainless steel. This gives the capsule a unique immunity against ambient temperature variations. The precision-made back plate is placed in a quartz insulator for maximum electrical stability. This gives the 4041 Large Diaphragm Condenser Microphone a unique sensitivity of up to 90 mV/Pa.

  The MMC4041 Large Diaphragm Microphone Capsule can be unscrewed from the MMP4000-SP preamplifier, which allows you to exchange the preamp.
specs: |-
  - Directional pattern: Omnidirectional
  - Principle of operation: Pressure
  - Cartridge type: Condenser w. stainless steel diaphragm
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range ±2 dB: 20 Hz - 20 kHz with 4 - 6 dB soft boost at 8 kHz
  - Sensitivity, nominal, ±2 dB at 250 Hz: 70 mV/Pa; -23 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Max. 8 dB(A) re. 20 µPa
  - Equivalent noise level, ITU-R BS.468-4: Max. 20 dB
  - Distortion, THD < 1%: 123 dB SPL RMS, 126 dB SPL peak
  - Dynamic range: Typ. 118 dB
  - Max. SPL, THD 10%: 134 dB SPL peak
  - Rated output impedance: < 200 Ω
  - Cable drive capability: 100 m (328 ft)
  - Power supply (for full performance): Via external Power supply
  - Current consumption: 2.20 mA
  - Connector: 3-pin XLR-M
  - Weight: 190 g (6.7 oz)
  - Capsule diameter: 24 mm (1 in)
  - Microphone length: 170 mm (6.7 in)
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Features: Handles high sound pressure levels with no distortion; Natural and transparent sound
