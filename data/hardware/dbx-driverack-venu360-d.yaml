description: Complete 3-input, 6-output loudspeaker management system with Dante
  audio networking, improved AutoEQ and AFS algorithms, and Ethernet control via
  mobile devices.
details: |-
  The DriveRack VENU360-D is a 3-input, 6-output loudspeaker management processor featuring Dante audio networking via two RJ-45 connectors. It provides comprehensive processing between mixer and amplifiers to optimize and protect loudspeakers with improved AutoEQ and AFS algorithms.

  Dante networking supports up to 100m cable runs on Cat 5/5e/6 cable with configurable latency from 0.15 ms to 5.0 ms. Ethernet control via Android, iOS, Mac, and Windows allows remote system configuration and monitoring.

  The unit features 24-bit A/D and D/A converters with dbx Type IV Conversion System, 32-bit floating point internal processing, and operates at 48 or 96 kHz sample rates. Three inputs include two selectable between analog and AES digital. Up to 1000 ms of alignment delay is available per output channel. The Type IV dynamic range reaches 129 dB A-weighted with transient material.
specs: |-
  - Input Connectors: (3) female XLRs (2 selectable analog/AES), (1) female XLR RTA mic
  - Input Impedance: >30 kΩ, balanced
  - Max Input Level: >+28 dBu, balanced, ≤1% THD
  - CMRR: >50 dB @ 1 kHz
  - Phantom Power: +48 VDC
  - Output Connectors: (6) male XLR line outputs
  - Max Output Level: +22 dBu, balanced, ≤1% THD
  - Dante Connectors: 2 x RJ-45
  - Dante Max Cable Length: 100m/328ft (Cat 5/5e/6)
  - Dante Latency: 0.15 ms – 5.0 ms
  - Alignment Delay: Up to 1000 ms per output channel
  - A/D Converter: 24-bit with dbx Type IV Conversion System
  - A/D Dynamic Range: 117 dB A-weighted, 114 dB unweighted, 22 kHz BW
  - Type IV Dynamic Range: 129 dB transient material A-weighted
  - D/A Converter: 24-bit
  - D/A Dynamic Range: 116 dB A-weighted, 113 dB unweighted
  - Internal Processing: 32-bit floating point
  - Sample Rates: 48/96 kHz (32-192 kHz using sample rate conversion)
  - System Dynamic Range: 114 dB A-weighted; 110 dB unweighted
  - THD+Noise: 0.0025% typical at +4 dBu, 1 kHz
  - Frequency Response: 20 Hz – 20 kHz, +0 / -0.5 dB
  - Crosstalk: <-97 dB, -105 dB typical 20-20 kHz
  - Latency (Analog): 2.57 ms (48 kHz), 2.28 ms (96 kHz)
  - Latency (AES): 2.31 ms (48 kHz), 2.15 ms (96 kHz)
  - Operating Voltage: 100-240 VAC 50/60 Hz
  - Power Consumption: 18 W
  - Weight: 5.48 lbs (2.49 kg)
  - Dimensions: 1.75" H x 8.0" D x 19" W
