details: |-
  The G&L ASAT Classic Bluesboy 'Lefty' is a factory-modded version of Leo's final word on the traditional single-cutaway bolt-on axe. For players looking for the unmistakable warmth of a classic humbucker in the neck position, the Bluesboy delivers with a well-balanced pairing of a G&L Alnico humbucker and a single-coil G&L Magnetic Field Design bridge pickup designed by Leo Fender.

  Framed in a classic boxed-steel bridge, the single-coil MFD bridge pickup delivers crisp attack with complex harmonics while individual brass saddles offer modern levels of intonation refinement. Flipping to the neck humbucker reveals all the charismatic warmth a player could ask for. Together the two pickups open up the limits of this guitar's surprising versatility.

  The Tribute Series ASAT Classic Bluesboy is dripping with mojo at a price attainable for every working musician.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: G&L AS4255C Alnico neck humbucker, Leo Fender-designed G&L MFD single coil bridge pickup
  - Body wood: Swamp Ash top on Poplar
  - Neck wood: Hard-Rock Maple with Rosewood fingerboard
  - Neck width at nut: 1 5/8"
  - Neck radius: 9-1/2"
  - Neck profile: medium C
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: 18:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 3-position pickup selector, volume, tone
  - Available in: Tobacco Sunburst over Swamp Ash top on Poplar, tortoise pickguard, Rosewood fingerboard
