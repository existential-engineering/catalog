details: |-
  Hexmix System is a six channel performance mixer specially designed for Eurorack. The system has two separate modules: the core mixer (Hexmix) and the Hexpander expander that adds three auxiliary sends per channel, PFL, individual outputs, and balanced output.

  The mixer draws strong inspiration from classical DJ mixers, providing sharp EQs for enhanced performance. Each of the six channels features a three-band EQ with sharp 12dB cuts designed for aggressive frequency shaping in the style of classic DJ mixers. Vactrol-based mutes provide clickless operation with a natural decay rather than a sharp cut. Switches have both latch and momentary positions for performative unmuting.

  Inputs for every channel are located at the left side of the Hexmix. Each jack is normalized to a VCA Expander connection on the back, so a Hexmix VCA will route each VCA output to each channel input automatically; plugging a jack into any input disconnects the VCA signal. Gain is set to unity, so the module acts as an attenuator of the input signal.

  The master section includes its own softer EQ (6dB) and volume control over the final mix. A rear switch selects between line and modular (synth) output levels, useful when combined with the Hexpander for simultaneous modular-level and line-level balanced outputs. The system is designed to be placed in 6U rather than the traditional 3U Eurorack paradigm, with all per-channel controls arranged vertically like a conventional tabletop mixing deck.
