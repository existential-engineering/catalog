details: |-
  The Numark iDJ3 is a portable DJ system that combines a hardware DJ controller with a built-in dock for iPhone or iPod playback. It features the classic two-turntables-and-mixer layout, with large touch-sensitive platters for scratching and song cueing, lighted deck controls that indicate software status, and integration with the user's iTunes library. The unit can record DJ performances directly to a docked iPod or iPhone and ships with MixVibes Cross LE DJ software, which supports MP3, AAC/M4A, AIFF, WAV, FLAC, and OGG audio formats. The controller is also compatible with virtually all DJ software.
