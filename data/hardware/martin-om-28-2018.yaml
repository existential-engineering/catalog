details: |-
  The Martin OM-28 (2018) is a compact auditorium-sized (000-14 fret) acoustic guitar built for versatile playing styles. Its scalloped X-bracing pattern delivers a balanced, responsive tone that excels at fingerpicking, strumming, and soloing alike.

  The instrument pairs an East Indian rosewood back and sides with a spruce top finished in aging toner for a vintage look. Bold herringbone trim, ebony appointments, and traditional Martin styling reinforce the classic aesthetic that has defined the OM-28 platform.

  The neck features a Modified Low Oval shape with Martin's High-Performance Taper, joined to the body at the 14th fret via a traditional dovetail joint. A 25.4-inch scale length and 1¾-inch nut width provide comfortable spacing for fingerstyle technique.

  Hardware includes a bone compensated nut, ebony bridge with modern belly and drop-in saddle, nickel open-gear tuners, and a tortoise-pattern pickguard. The guitar is Pleked at the factory for consistent fret leveling and intonation, and ships in a molded hardshell case.

  This 2018 OM-28 has been retired from Martin's active lineup and replaced by an updated OM-28 model. Remaining inventory may still be available through Martin dealers.
specs: |-
  - Body Size: 000-14 Fret (Auditorium / Orchestra Model)
  - Top: Spruce with Aging Toner finish
  - Back/Sides: East Indian Rosewood
  - Bracing: X-Brace, Scalloped
  - Neck Joint: Dovetail
  - Neck Shape: Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Scale Length: 25.4"
  - Fingerboard: Ebony
  - Fingerboard Width at Nut: 1¾"
  - Frets: 20 total, joins body at 14th fret
  - Bridge: Ebony with modern belly and drop-in saddle
  - Nut: Bone, compensated
  - Tuning Machines: Nickel open gear
  - Pickguard: Tortoise pattern
  - Trim: Bold herringbone
  - Pleked: Yes
  - Left-handed availability: Yes
  - Electronics: Optional
  - Case: Molded hardshell included
