details: |-
  Product Overview

  The Heil PR 31 BW (Bob Workman model) is a highly versatile, compact dynamic microphone designed to deliver the exact full-range sound quality, high-frequency articulation, and diaphragm response of the legendary Heil PR 30 in a shortened, 4-inch chassis. Engineered specifically to solve tight placement challenges on stage and in the studio, the PR 31 BW allows sound engineers to position a world-class large-diaphragm dynamic element under cymbals, inside speaker cabinets, and between congested drum setups without sacrificing audio quality.

  Featuring an extraordinary -40 dB of rear and side audio rejection at 180° off-axis , the PR 31 BW virtually eliminates bleed from adjacent instruments, stage monitors, and room reflections. Capable of handling high sound pressure levels up to 146 dB SPL, this short-barrel dynamic mic excels across a wide variety of demanding applications, including guitar speaker cabinets, tom drums, snare, brass, Leslie speakers, acoustic piano, and live vocals.
specs: |-
  - Full PR 30 Sound in a 4-Inch Body: Incorporates the identical large dynamic element and internal acoustic design of the flagship PR 30 into a shortened form factor for tight-space miking.
  - Exceptional Rear Noise Rejection (-40 dB): Industry-leading off-axis rejection at 180° suppresses stage bleed, monitor bleed, and cymbal spill in loud live environments.
  - High SPL Handling (146 dB Max SPL): Handles extreme acoustic pressure without clipping, distortion, or overload, making it ideal for loud guitar amps and percussion.
  - Versatile Multi-Instrument Compatibility: Excel across a diverse range of applications including drum kit toms, guitar cabs, horns, Leslie speakers, pianos, and vocals.
  - Compact & Lightweight Housing: Weighs only 5.5 oz, reducing mechanical strain on boom arms, drum rim mounts, and right-angle XLR stage connections.
  - Internal Shock Mounting: Built-in capsule isolation protects against floor vibration, mechanical stand rumbles, and stage thuds.
  - Passive Dynamic Operation: Operates via standard 3-pin XLR connection; requires no phantom power or inline preamp boosters.
  - Element Type: Dynamic.
  - Frequency Response: 40 Hz – 18 kHz.
  - Polar Pattern: Supercardioid.
  - Rear Rejection (@ 180° off-axis): -40 dB.
  - Impedance: 370 ohms balanced.
  - Output Level (@ 1 kHz): -52.9 dB.
  - Max SPL: 146 dB.
  - Length / Dimensions: 4 inches (101.6 mm).
  - Weight: 5.5 oz (155.9 g).
  - Output Connection: 3-pin XLR.
