description: A Eurorack module offering textured white noise with three noise
  types, a texture modulator (LFO or sample and hold), a resonance switch, and
  an independent sample and hold section with external trigger input.
details: |-
  TEXTURED NOISE / S&H / FILTER

  An unconventional texturised white noise module that will open new paths on the use of white noise in your modular system. Chaotic screeches and unexpected crackles that will brings your patch to another level of filthy sonic immorality. External input, and three types of Noise: Clean, Notch, Band Pass White Noise, you can select which texture to modulate the NP and BP signal with the TXR push button switch and select between two internal types of textures (Squared LFO or Sample and Hold) and change the texture rate using the potentiometer, a Resonance push button switch will allow you to add harmonics and more movement to the signal. There is also an independent Sample and Hold section that samples the white noise and can be fed with an external trigger signal. All the features can be used in tandem or singularly. ENG Manual Download

  *Please allow us 1/2 weeks for the order to be processed
