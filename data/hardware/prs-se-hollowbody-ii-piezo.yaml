details: |-
  The SE Hollowbody II Piezo combines the balanced, clear, resonant tone of a hollowbody instrument with the power and stability of a solid-body electric guitar. Constructed with a maple back and top with mahogany sides, the SE Hollowbody II Piezo offers a light shimmer and snap in an attractive package. The 58/15 LT “S” pickups deliver clarity and balance that sound big and musical in a hollowbody platform. Boasting an LR Baggs/PRS Piezo system, the SE Hollowbody II Piezo provides musicians with the versatility of wielding both acoustic and electric tones in one instrument.
