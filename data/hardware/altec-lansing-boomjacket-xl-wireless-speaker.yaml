details: |-
  Take your music anywhere with the BoomJacket XL wireless speaker—built tough for every adventure. With an IPX7 waterproof rating, this speaker isn't just resistant to water—it floats—making it perfect for the pool, beach, or boat. Designed for total portability, the BoomJacket XL includes versatile mounting options with its #MountIT, #ClipIT, and #StickIT features: use the included speaker mount, attach it with the carabiner, or stick it to most metal surfaces using the built-in magnet. A carry strap is also included, so you can keep your speaker close whether you're hiking, biking, or exploring the outdoors. Enjoy up to 20 hours of powerful, uninterrupted sound on a single charge, and get back to the music faster with USB-C quick charging. For an even bigger audio experience, connect two BoomJacket XL speakers using True Wireless Pairing to create rich, room-filling stereo sound. With a 100-foot Bluetooth wireless range, your music stays connected while you stay on the move. Rugged, reliable, and ready for anything, the BoomJacket XL is your go-to speaker for epic sound in any environment.
