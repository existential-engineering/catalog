description: The flagship center-channel speaker features a Carbon Dome drive
  unit housed in a Tweeter-On-Top enclosure, a 130mm (5in) Continuum Cone FST
  midrange driver, particularly important for clarity with dialogue, and twin
  Aerofoil Profile bass cones. It's the perfect partner for the 705 S3, 703 S3
  and 702 S3.
details: |-
  HTM71 S3 is the flagship centre channel loudspeaker of the third-generation Bowers & Wilkins 700 Series, a 3-way vented-box design carrying one 25mm Decoupled Carbon Dome high-frequency unit, one 130mm Continuum cone FST midrange and two 130mm Aerofoil Profile bass cones. Bowers & Wilkins presents it as the partner for the 705 S3, 703 S3 and 702 S3, and this generation adds Tweeter-on-Top so that it integrates properly with the similarly equipped 700 Series models in a surround system.

  The tweeter sits in the latest generation of the Solid Body Tweeter-on-Top housing, milled from a single solid block of aluminium and carefully decoupled to resist resonance. Its more elongated form incorporates a longer tube-loading system, which the company says produces an even more free and open high-frequency sound. The Carbon Dome unit itself is purpose-built for the 700 Series and raises the breakup threshold to 47kHz for pinpoint imaging accuracy and detail.

  The dedicated midrange is the part that carries dialogue. It combines four Bowers & Wilkins technologies, the Continuum cone, FST, Biomimetic Suspension and midrange decoupling, the last of these keeping interference from the bass drivers to a minimum. The Continuum cone's composite construction avoids the abrupt transitions in behaviour that can impair a conventional drive unit, while the two Aerofoil Profile bass cones, developed with computer modelling, vary in thickness to provide stiffness where it is most needed.

  The cabinet is entirely passive, with no on-board amplification, no mains inlet and no line-level input. The 700 Series 3 manual states that there are two linked pairs of terminals on the back of the speaker, labelled HF and LF. For conventional connection the terminal links stay in place as delivered and only one pair is connected to the amplifier; for bi-wiring or bi-amplification the links are removed and each pair is connected independently. The terminals take 4mm banana plugs, 6mm and 8mm spades, or bare wire up to 4mm diameter, with the 4mm holes blocked by plastic pins to satisfy European CENELEC rules.

  Installation follows the manual's centre-channel guidance: behind the centre of an acoustically transparent projection screen where one is used, or directly above or below the screen on a floor stand, furniture unit or wall shelf, as close to ear height as possible. Four self-adhesive rubber feet are supplied to fit to the base for vibration isolation when the speaker shares a shelf or rack with other AV equipment, and a foam port plug is supplied for trimming low-frequency output when the speaker sits close to a wall. The tweeter assembly is a decoupled component and may feel loose when first unpacked, which the manual notes is an inherent feature of the design rather than a fault.
specs: |-
  - Description: 3-way vented-box system
  - Drive units: 1x 25mm (1 in) Decoupled Carbon Dome high-frequency, 1x 130mm (5 in) Continuum cone FST midrange, 2x 130mm (5 in) Aerofoil Profile bass
  - Frequency range: 45Hz to 33kHz
  - Frequency response: 50Hz to 28kHz +/-3dB
  - Sensitivity: 89dB spl (2.83Vrms, 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 90Hz to 22kHz, less than 0.5% 120Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 3.1 ohms)
  - Recommended amplifier power: 30W to 200W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Technical features: Decoupled Carbon Dome tweeter, Solid Body Tweeter-on-Top, Continuum cone FST midrange, Aerofoil Profile bass cones, Flowport
  - Passive: no on-board amplification and no mains connection. Two linked pairs of HF and LF terminals, single-wire as delivered, bi-wire or bi-amp with the links removed
  - Terminals accept 4mm banana plugs, 6mm and 8mm (1/4 in and 5/16 in) spades, or bare wire up to 4mm (5/32 in) diameter
  - Dimensions: height 165mm (6.5in) cabinet only, 233mm (9.2in) including tweeter; width 628mm (24.7in) cabinet only; depth 318mm (12.5in) cabinet only, 356mm (14.0in) including grille and terminals
  - Net weight: 17.45kg (38.5lb)
  - Cabinet finishes: Gloss Black, Satin White, Mocha
  - Grille finishes: Black, Grey (Satin White only)
  - Supplied with grille, foam port plug and four self-adhesive rubber feet
