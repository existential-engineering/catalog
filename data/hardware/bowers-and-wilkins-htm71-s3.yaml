details: |-
  The HTM71 S3 is a high-performance center channel speaker from the third-generation Bowers & Wilkins 700 Series, designed to anchor the front soundstage of a home cinema with the dialogue clarity and tonal balance of B&W's flagship architecture.

  It is a 3-way vented-box design pairing a 25mm Decoupled Carbon Dome high-frequency unit, mounted in a Solid Body Tweeter-on-Top enclosure to isolate it from cabinet vibration, with a dedicated 130mm Continuum cone FST midrange that handles vocal range frequencies independently of the bass drivers. Two 130mm Aerofoil Profile bass cones flank the midrange to provide deep, articulate low-frequency output, supported by a Flowport vent.

  The HTM71 S3 is voiced to match the 705 S3, 703 S3, and 702 S3 loudspeakers, making it the natural center channel for a 700 Series home theater system. It is available in Gloss Black, Satin White, and Mocha finishes, with Black grilles standard and Grey grilles offered on the Satin White finish.
specs: |-
  - Drive units: 1x 25mm (1 in) Decoupled Carbon Dome high-frequency, 1x 130mm (5 in) Continuum cone FST midrange, 2x 130mm (5 in) Aerofoil Profile bass
  - Configuration: 3-way vented-box system
  - Frequency range: 45Hz to 33kHz
  - Frequency response: 50Hz - 28kHz (+/-3dB)
  - Sensitivity: 89dB spl (2.83Vrms, 1m)
  - Harmonic distortion (90dB/1m on axis): <1% 90Hz - 22kHz, <0.5% 120Hz - 20kHz
  - Nominal impedance: 8 ohms (minimum 3.1 ohms)
  - Recommended amplifier power: 30W - 200W into 8 ohms
  - Max recommended cable impedance: 0.1 ohms
  - Height: 165mm cabinet only; 233mm including tweeter
  - Width: 628mm cabinet only
  - Depth: 318mm cabinet only; 356mm including grille and terminals
  - Net weight: 17.45kg (38.5 lb)
  - Finishes: Gloss Black, Satin White, Mocha
