description: The MG30GFX is a 30W solid-state guitar combo amplifier from
  Marshall's MG Gold range, built around a 10" custom speaker. It offers four
  channels — Clean, Crunch, OD1, and OD2 — covering clean and gentle tones
  through gutsy 'in your face' overdrive, with a shared three-band EQ for tone
  shaping. The amplifier includes a built-in digital effects section, a
  programmable channel/effect storage so settings can be recalled, an MP3/line
  input for jamming along to backing tracks, and an emulated headphone output
  for silent practice and direct recording.
details: |-
  The MG30FX has it all, from clean and gentle tones to gutsy, 'in your face' overdrive. The 10" speaker offers a big sound that is sure to bring rehearsals to life and shine on stage.

  With clean, crunch, and two overdrive channels, store your tone for easy recall. Also fitted with an emulated headphone output to make silent practice easier than ever.

  Whether you're feeling inspired and want to record directly from the amplifier or perfecting your sound and need to practise silently, the MG30FX has got you covered. With its emulated speaker output, both direct recording and silent practice have never been easier. Additionally, the MP3/line input feature provides the opportunity to jam along with your favourite songs.

  The MG30FX boasts built-in digital FX so you can immediately start crafting your own sound. It has also been intentionally designed for the use of external FX pedals so that you can expand your sonic palette even further.

  Featuring four versatile channels, the MG30FX guarantees a diverse range of tones. Whether you seek a crystal-clear clean sound, a raw and gritty crunch, or the high-powered overdrive delivered by the OD1 and OD2 channels, this amplifier spans a broad sonic spectrum, amplified by a three-band EQ. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Model: MG30FX, MG Gold range
  - Output wattage: 30W
  - Technology: solid state
  - Channels: 4 (store and recall) - clean, crunch, OD1, OD2
  - Effects: reverb, chorus, phaser, flanger, delay, octave
  - Controls: gain, clean/crunch select, bass, OD1/OD2 select, middle, treble, reverb, volume, tuner, tap, store, FX select, master volume
  - Speaker configuration: 1x10"
  - Speaker model: custom speaker (4 ohm, 30W)
  - Unit impedance: 4 ohm
  - Inputs: 1 x 1/4" jack instrument input, 1 x 3.5 mm aux in
  - Outputs: 1 x 3.5 mm jack headphone out
  - Emulated headphone / speaker output for direct recording and silent practice
  - Weight: 10.8 kg / 24 lb
  - Width: 480 mm / 18.9"
  - Height: 420 mm / 16.5"
  - Depth: 225 mm / 8.9"
  - Colour: black and gold
  - Country of origin: designed and engineered in UK, made in Vietnam
