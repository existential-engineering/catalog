details: |-
  The Double Down Custom Shop Edition is a Custom Shop finish on the Caverns Delay Reverb v2, with a double UV-printed graphic and clear 1900 style knobs. Each unit in the run is hand signed by Robert Keeley, and the run began shipping in January 2022.

  The Caverns Delay Reverb v2 is a compact dual-effect pedal that pairs a delay with a reverb. It offers 650ms of analog-style tape delay with modulation options alongside spring, shimmer or modulated reverb, and it can be set either to true bypass or to trails, which lets the delay and reverb ring out after the pedal is switched off. The small enclosure suits a fly rig or a board with tight space requirements.

  The reverb side carries three voices: a blackface amp style spring reverb with F style tremolo, a choral modulation mode for a larger cavernous space, and a shimmer mode emphasising octave-up voices in the trails. The delay side uses Keeley's Magnetic Echo circuit, designed to emulate analog tape delay lines, with three-way switchable modulation that adds wow and flutter to the repeats.

  The v2 layout leaves more space between the footswitches than the original Caverns, and jacks are top-mounted for a compact pedalboard layout. The input and output double as TRS insert points, so two TRS breakout cables allow effects patching or use with a switching system. The pedal is built in the United States.
specs: |-
  - Spring Mode – Blackface Amp style spring reverb with F Style Tremolo
  - Modulation Mode – Choral modulation to the reverb for a huge, cavernous space
  - Shimmer Mode – Reverb with emphasis on octave-up voices in the reverb trails
  - 650ms of delay time, Magnetic Echo analog-style tape delay circuit
  - Three-way switchable delay modulation for wow and flutter
  - Switchable true bypass or trails, with buffered output
  - Top-mounted jacks
  - Input and output double as TRS inserts, for use with two TRS breakout cables
  - Double UV-printed graphic, clear 1900 knobs, hand signed by Robert Keeley
  - Built in the United States
