description: The Drive Plus is a distortion pedal tailored for modern bassists,
  applying distortion to the high and low frequency bands of the bass signal
  independently so players can dirty the top end while keeping the low end
  cleaner, or vice versa. Drive, Distortion Tone and Distortion Level controls
  shape the effect, and an Ashdown VU meter with an input level knob helps find
  the sweet spot. It features true bypass switching in a tough metal casing.
details: |-
  The Drive Plus is a distortion pedal designed for modern bassists. It can take a bass sound from a slight grunge through to high-gain meltdown, and lets the player add distortion to the high and low frequency components of the bass signal individually, so the top end can be fuzzed while the low end stays cleaner, or vice versa, preserving the core tones needed to fit in a mix. Different distortion types are used for the different frequency bands. The Drive control sets the amount of distortion, Distortion Tone adjusts its character and Distortion Level balances the effect against the clean bass signal. An Ashdown VU meter combined with the input level knob helps find the sweet spot for both active and passive basses. The output level control balances the effect against the true-bypass level, and the pedal is built tough with a metal casing, premium controls, recessed knobs and kickguards.
specs: |-
  - HF Drive filter frequency: 180Hz, roll-off 12dB/octave
  - LF Drive filter frequency: 600Hz, roll-off 12dB/octave
  - Composite crossover point: 250Hz
  - HF gain: 0 to 60dB
  - LF gain: 0 to 30dB
  - Input impedance: 470k ohms, signal level -10dBv to 0dBv
  - Output impedance: 10k ohms, variable signal level -10dBv to 0dBv
  - Controls: Drive, Distortion Tone, Distortion Level, Input level, Output level
  - Ashdown VU meter
  - True bypass switching
  - Power: internal 9V battery or external 9V DC adaptor (centre pin negative)
