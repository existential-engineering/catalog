details: |-
  The Silver Bullet Fuzz is the lower-priced sister to Keeley's Black Glass series of Bender-style fuzz pedals. This edition carries artwork commissioned from Erin Lofties, the artist behind the Psi Fuzz, and is fitted with a NOS Soviet germanium transistor; the Cowgirl scheme was limited to 30 pieces.

  At the heart of the circuit is that NOS Soviet germanium transistor, drawn from Robert Keeley's own stock, which is what keeps the run short. It is matched with a duo of silicon transistors for a fat, spongy tone in the manner of the finest Tone Benders. The tone knob behaves more like a voice control, so the pedal's character can be matched to the guitar's pickups.

  Unlike many old-school germanium fuzzes, the Silver Bullet runs on standard 9 volt centre-negative power, so it drops into a conventional pedalboard. It uses true bypass switching and is made by hand in Oklahoma, USA.
