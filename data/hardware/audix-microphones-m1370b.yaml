details: |-
  The M1370B is a retrofit kit designed to adapt an existing wired Audix Microboom System for wireless operation. It contains the M1370B cardioid microphone designed to operate on 4.5 – 5.5 v bias power supplied by AUDIX, Shure and other popular body pack transmitters (not included) It also includes the cabling and hardware to attach a wireless body pack transmitter to a standard mic stand.
