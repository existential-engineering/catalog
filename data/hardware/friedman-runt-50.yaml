description: The Runt-50 is a 50-watt, two-channel all-tube head driven by two
  EL34s, with a cabinet-simulated XLR output for front of house or studio use.
details: |-
  The Runt delivers the tight bottom end and midrange typically found only in much higher-wattage amps, by using custom transformers and the cleanest signal path possible. The Runt suits many styles of music, from blues and classic rock to heavy metal, by adjusting the gain and master controls.

  Plugging in reveals harmonically rich detailed chords and resonating single note lines, and the amp cleans up exceptionally well with the guitar's volume knob even on higher gain settings. The clean channel carries volume, bass, treble and a bright switch, while the overdrive channel adds gain, a three-band EQ and a boost switch and takes the amp from classic rock to all-out assault.

  This is the first amp Dave Friedman has made with a cab-simulated XLR output. Compared with intricate computer-based impulse responses, this analog circuit gives a direct output that can be sent to front of house or used in the studio. The XLR output includes ground lift, level, and center or edge of speaker cone simulation switches.

  This Runt was designed to take pedals well and works with boosts, overdrives, phasers, flangers, tremolos and wahs. The ultra-transparent, no tone loss, buffered series effects loop takes time-based effects pedals and rack units equally well. The head cabinet features black Tolex over Baltic Birch construction and is built to withstand the rigors of the road.
specs: |-
  - 50-watt all-tube head
  - Two channels
  - 2 x EL34 power tubes
  - 4 x 12AX7 preamp tubes
  - Clean channel with volume, bass, treble and bright switch
  - Lead channel with volume, gain, three-band EQ and a boost switch
  - XLR cabinet simulated output with ground lift, axis and level switches
  - Ultra transparent series FX loop
  - 4, 8 and 16 ohm impedance selector
  - Single button footswitch
  - Black Tolex over Baltic Birch cabinet
  - Dimensions: 22.5 inches (W) x 9.5 inches (D) x 9.25 inches (H)
  - Weight: 31 lbs
