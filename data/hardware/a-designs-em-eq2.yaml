description: A dual-mono, three-band Pultec-style solid-state equalizer in a 2U
  rackmount chassis, faithfully preserving the EQ section design and musicality
  of the original Pultec with a proprietary nickel-core CineMag output
  transformer and custom-wound tapped inductor.
details: |-
  The EM-EQ2 faithfully preserves the EQ section design, control layout, and
  wonderfully smooth musicality of the original Pultec. It also has the same
  frequency settings and inductors that made the Pultec a must-have for
  accurately capturing and shaping the sound spectrum, especially the bottom
  end.

  Operating as a dual-mono unit, the EM-EQ2 effectively gives you two Pultecs
  for a fraction of the price of one. Both channels are housed in a rugged,
  metal 2U chassis with a custom-milled faceplate and brushed-aluminum knobs.

  The three-band passive equalization topology features low band boost/
  attenuation at 20Hz, 30Hz, 60Hz, and 100Hz; mid-to-high band at 3k, 4k,
  5k, 6k, 10k, 12k, and 16kHz; and high band attenuation at 5k, 10k, and
  20kHz. Gain range is 0dB to +10dB boost and 0dB to -10dB attenuation.

  Key components include a proprietary nickel-core CineMag output transformer,
  a custom-wound tapped inductor by Cinemag, and Wima capacitors. The unit
  features a modern solid-state makeup amplifier, true hard bypass, and a
  heavy-duty Carling toggle power switch with jewel indicator lamp.
  Handmade in the USA with a 1-year warranty.
specs: |-
  - Dual-mono operation in 2U rackmount chassis
  - Three-band passive equalization topology
  - Low band frequencies: 20Hz, 30Hz, 60Hz, 100Hz
  - Mid-to-high band frequencies: 3k, 4k, 5k, 6k, 10k, 12k, 16kHz
  - High band attenuation: 5k, 10k, 20kHz
  - Gain range: 0dB to +10dB boost, 0dB to -10dB attenuation
  - Fully balanced, noise-free performance
  - True hard bypass
  - Proprietary nickel-core CineMag output transformer
  - Custom-wound tapped inductor (Cinemag)
  - Wima capacitors
  - Modern solid-state makeup amplifier
  - Custom-milled faceplate with brushed-aluminum knobs
  - Heavy-duty Carling toggle power switch with jewel indicator lamp
  - Handmade in USA
  - 1-year warranty
