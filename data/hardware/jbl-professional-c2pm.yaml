details: |-
  The JBL Control 2P Master (C2PM) is a compact, self-powered 2-way studio monitor designed for professional recording, video production, AV presentations, and electronic instrument monitoring. It is the active unit in the Control 2P system, housing a 35-watt internal power amplifier.

  The C2PM features a 135mm (5.25") low-frequency driver paired with a 19mm (0.75") polycarbonate dome tweeter, crossed over at 4.2 kHz, delivering a frequency range of 80 Hz to 20 kHz. The system achieves a maximum SPL of 111 dB at 1 meter with a wide 120° x 120° horizontal and vertical coverage angle.

  Connectivity is versatile: a balanced Neutrik Combo XLR/1/4" TRS input accepts professional line-level signals at +4 dBu, while an unbalanced RCA input accommodates consumer sources at 0 dBu. A 3.5mm stereo headphone output enables private monitoring directly from the speaker.

  The enclosure is constructed from polypropylene structural foam and is magnetically shielded for use adjacent to CRT monitors and other magnetically sensitive equipment. An internal peak limiter and overload protection circuit safeguard the drivers.

  The companion passive satellite is a separate SKU. Cabinet ships with snap-on pedestals for desktop placement and is compatible with the optional MTC-2P wall-mount kit.
specs: |-
  - LF Driver: 135mm (5.25")
  - HF Driver: 19mm (0.75") polycarbonate dome tweeter
  - Amplifier Power: 35 Watts
  - Frequency Range: 80 Hz – 20 kHz
  - Frequency Response (±3dB): 100 Hz – 18 kHz
  - Maximum SPL: 111 dB (at 1m)
  - Crossover Frequency: 4.2 kHz
  - Input Sensitivity: +4 dBu (XLR/TRS); 0 dBu (RCA)
  - Coverage Angle: 120° H × 120° V
  - Magnetically shielded
  - Internal peak limiter and overload protection
  - Dimensions: 235 × 159 × 143 mm (9.3 × 6.3 × 5.6 in)
  - Weight: 2.6 kg (5.5 lb)
