description: Compact guitar headphone amp with built-in amp/cab/mic modeling,
  effects, Bluetooth playback and a companion BEAM mobile app for endless tonal
  possibilities.
details: |-
  The BEAM SOLO redefines the headphone amp experience, delivering immersive, pro-level tones for electric, bass and acoustic guitar in a compact, intuitive design. The dynamic Light Beam display, SpeedDial control, and XpressFX ensure effortless tone shaping, whether directly on the unit or via the user-friendly mobile app.

  Beam Solo unlocks an expanding world of amplifiers, cabinets, mics and pedals within the companion BEAM app — 8+ amps, 9+ cabinet/mic combinations, 9+ room environments and 35+ effects. Blackstar's patented ISF (Infinite Shape Feature) control sweeps tones from classic American to modern British and all points in-between.

  Blackstar's IR-based CabRig speaker simulator with 'In The Room' technology brings the immersive feel of standing in front of a real amplifier directly into your headphones. A unique 3.5mm headphone jack doubles as a headset mic input with a studio-quality preamp and reverb, enabling guitar and vocal recording on the go.

  An integrated folding 1/4-inch jack plugs the unit directly into the guitar, while USB-C handles charging and multi-channel direct recording into a DAW. Bluetooth connectivity lets players stream backing tracks and music to jam along with.

  The BEAM mobile app (iOS and Android) opens up patch save/recall, integrated lessons, backing tracks, a built-in tuner and an online community for sharing patches with friends and downloading artist signature tones. XpressFX and the SpeedDial make on-unit tweaking fast even without the app.
specs: |-
  - 8+ amplifier models
  - 35+ effects
  - 9+ cabinet and microphone combinations
  - 9+ room environment combinations
  - IR-based CabRig speaker simulator with In The Room technology
  - ISF (patented Infinite Shape Feature) control
  - Dynamic Light Beam display
  - XPressFX quick parameter changes using SpeedDial
  - Integrated folding 1/4" instrument jack
  - 3.5mm headphone jack with headset mic input (studio-quality preamp and reverb)
  - USB-C for charging and multi-channel direct recording
  - Bluetooth connectivity for music playback
  - Built-in tuner
  - Save and recall patches
  - Share patches via online community and socials
  - BEAM mobile app for iOS and Android
  - Integrated lessons and backing tracks (via BEAM mobile app)
  - Approximate battery life: 5 hours+ (charged via USB-C)
