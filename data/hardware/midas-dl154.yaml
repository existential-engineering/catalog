url: "https://www.midasconsoles.com/en/products/0606-ABR"
description: '8 Input, 16 Output Stage Box with 8 Midas Microphone
  Preamplifiers. A 2U 19" rack-mounted I/O unit designed as a digital snake
  connection interface between front-of-house mixing consoles and stage
  equipment, featuring award-winning Midas microphone preamplifiers, dual AES50
  redundancy, and SuperMAC (AES50-compliant) digital audio networking.'
details: |-
  The Midas DL154 is a 2U 19" rack-mounted stage box providing 8 microphone/line inputs and 16 line-level outputs over AES50 SuperMAC digital audio networking. It features award-winning Midas microphone preamplifiers with 2.5 dB analogue gain steps and +48V phantom power per channel. Outputs are servo-balanced with high output current capability for long cable runs, and feature individual LED indicators per output connector and automatic mute facility when muted from console. Dual AES50 ports provide network redundancy, and an Ethernet control port enables remote configuration. A front panel LCD display with menu navigation allows local control. LED status indicators are provided for power rails, network connections, phantom power, and output mutes. Compatible with Midas PRO and M32 Series consoles. Housed in a rugged steel 2U rackmount enclosure for touring applications.
specs: |-
  - Inputs: 8 Microphone/Line Level inputs on XLR connectors
  - Outputs: 16 Line Level outputs on XLR connectors (servo-balanced)
  - Microphone Preamp Gain: 2.5 dB analogue gain steps
  - Phantom Power: +48V per channel
  - Network: 2x AES50 ports (dual redundancy), SuperMAC (AES50-2011 compliant)
  - Control: 1x Ethernet control port
  - Sample Rates: 48 kHz or 96 kHz
  - Dimensions: 483 mm (W) x 376 mm (D) x 88 mm (H) / 19.0" x 14.8" x 3.5"
  - Weight: 6.9 kg (15.2 lbs)
  - Power Supply: Auto-ranging universal switch-mode, 100-240 VAC, 50-60 Hz
  - Rack Format: 2U 19" rackmount chassis
  - Network Standard: 100 Megabit Ethernet, AES50-2011 compliant
