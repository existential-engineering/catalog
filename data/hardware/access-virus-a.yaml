description: >-
  The Access Virus is a German-made desktop synth module that quickly became a
  popular favorite with its aggressive, punchy virtual-analog sounds capable of
  everything from deep sub-bass to overdriven 303-style leads.
details: |-
  The Virus uses physical modeling to digitally recreate analog sounds. German engineering delivers an incredibly punchy and clean analog character capable of producing everything from deep sub-bass frequencies to overdriven 303-style lead lines.

  The module features an intuitive layout appealing to both modern and traditional synthesists. It includes 32 knobs and 27 buttons for real-time parameter manipulation. With 12-note polyphony and 16 multitimbral parts, users can create complete electronic music compositions.

  The instrument offers basic analog waveforms including sawtooth and pulse with PWM, dual oscillators per voice, dual filters, two LFOs with sample-and-hold functionality, and built-in arpeggiators. It can convincingly emulate TB-303, SH-101, and other classic bass and lead sounds plus analog drum and percussion synthesis. Advanced ADSTR envelopes and effects including chorus, flange, delays, and vocoder are included. Every parameter responds to MIDI control.

  Access released subsequent generations: the Virus B in 1999, followed by KB (keyboard), Indigo (roadster), and Rack versions. The C series launched in 2002, featuring the Virus C, KC, Indigo 2, and Rack XL. A 2000 variant called Virus TDM was developed for Pro Tools users, with an Indigo TDM version following in 2002. Artists including Astral Projection, BT, The Crystal Method, Cosmosis, and Nine Inch Nails have used Virus synthesizers.
specs: |-
  - Polyphony: 12 voices
  - Oscillators: 2 per voice plus 1 Sub-Osc with sine, tri, saw, variable width pulse, oscillator sync; 64 digital FM spectral waveforms
  - LFO: 2 per voice with tri, saw down, square, sample/hold, sample/glide
  - Filter: 2 independent resonant filters (lowpass, highpass, bandpass, band reject, parallel, split, 2 serial modes) with up to 36dB/voice (6-poles), overdrive/saturation
  - VCA: 2 ADSTR envelopes per voice
  - Mod Matrix: 3 sources, 6 destinations
  - Effects: Up to 22 simultaneous effects (4 chorus effects, global reverb/delay, vocoder)
  - Keyboard: None (desktop module)
  - Memory: 256 ROM patches, 256 RAM patches, 128 multi RAM patches
  - Control: MIDI (16 multitimbral parts)
