description: The TS110 is an active 10 inch subwoofer from EVE Audio's
  ThunderStorm range, with a 400 W PWM amplifier driving a proprietary 10 inch
  woofer for a response from 28 Hz to 300 Hz and a maximum 108 dB SPL at 1 m. A
  passive radiator takes the place of a bass reflex tube, and balanced XLR
  inputs and outputs let the TS110 sit between the source and the satellite
  monitors.
details: |-
  EVE Audio's ThunderStorm range of subwoofers is built to give precise control over the bass frequencies in a room without low-port noise distortion, because every model uses a passive radiator rather than a reflex tube. The intent is a system that sounds as a whole rather than a sum of parts, and each ThunderStorm carries detailed controls, including switchable satellite filters (full range and 80 Hz), a phase switch (0 and 180 degrees) and a variable subwoofer filter frequency between 60 Hz and 140 Hz, so the unit can be tailored to a specific room.

  The TS110 features a very efficient 400 W PWM amplifier that drives a proprietary 10 inch woofer. That combination gives a frequency response reaching down to 28 Hz and up to 300 Hz, for a maximum output of 108 dB SPL at 1 m, with plenty of power for most needs.

  As with every other EVE Audio subwoofer, the TS110 provides balanced XLR inputs and outputs (stereo in and out, LFE in, LFE and sub out).

  The DSP section uses a high resolution Burr-Brown converter and affects only the bass driver operation. The signal path to the satellite speakers is kept purely analog with no A/D/A conversion, which is why the Pure Satellite function, when activated, bypasses the subwoofer and the DSP filter section completely and leaves only the satellite volume adjustable. The included remote control sets the subwoofer volume and the volume of the complete stereo system from the listening position.

  The passive radiator that replaces the common bass reflex tube removes all audible noise caused by air turbulence and eliminates the pipe resonances that a two-sided pipe opening makes unavoidable. Its suspension has a restoring force underneath the tuning frequency and so reduces inaudible excursions in the subsonic range, which in turn reduces intermodulation distortion in the working range. The design also allows a particularly low tuning or lower cut-off frequency in a very compact cabinet.
specs: |-
  - Frequency range: 28 - 300 Hz
  - Woofer size: 10"
  - Max. SPL: 108 dB
  - Frequency range measured at -3 dB, 1 m distance
  - Output power: 400 W
  - Output power woofer: 400 W
  - Passive radiator: 10" diameter
  - Protection limiter: Yes
  - Phase inversion: 0 / 180 degrees
  - Switchable satellite filter: flat / 80 Hz
  - Variable subwoofer filter: 60 to 140 Hz + LFE
  - Remote control: Included
  - Dimensions: 330 x 485 x 430 mm (13 x 19.1 x 16.9 inches, WxHxD)
  - Weight: 19,6 kg (43.2 lb)
  - Power consumption: < 1 W standby, 410 VA maximum
