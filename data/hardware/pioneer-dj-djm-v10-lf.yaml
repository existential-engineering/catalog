description: The DJM-V10-LF features new, longer channel faders with optimized curves and a new custom-designed curve preset to enable you to perform smooth and accurate mixes. The 60 mm shaft slide faders enable you to control the volume of the audio source from each channel precisely. What’s more, a brand-new fader curve setting has been added to the unit and the faders have been appropriately weighted to enhance the potential offered by their elongated range.
details: |-
  Creative style 6-channel professional DJ mixer with long fader.

  The DJM-V10-LF features new, longer channel faders with optimized curves and a new custom-designed curve preset to enable you to perform smooth and accurate mixes. The 60 mm shaft slide faders enable you to control the volume of the audio source from each channel precisely. What’s more, a brand-new fader curve setting has been added to the unit and the faders have been appropriately weighted to enhance the potential offered by their elongated range. All the other features and specifications of the DJM-V10-LF are the same as the DJM-V10 , which has become popular with the most creative DJs since its release in early 2020. The 6-channel unit is loaded with unique features and produces warm audio with energy and presence.

  60 mm shaft slide faders. If you like to perform smooth, detailed mixes, you can enjoy a high level of control with the DJM-V10-LF. The crossfader from the DJM-V10 has been removed and brand-new 60 mm shaft slide faders have replaced the 45 mm ones on the channels.

  Unique fader curve. The unit includes two classic fader curves from its predecessor – optimized to make the most of the extra length – plus an all-new curve preset that enables you to make fine adjustments to the volume of each channel and precisely control the output sound.

  Elite sound quality. Feel the warmth of natural sound and hear every detail. Studio-quality 64-bit mixing and dithering processing, 32-bit high-quality A/D and D/A converters, a low-jitter clock circuit, and many other components all work to produce a full low-end, vibrant mids, and precise highs.

  6 channels with a wide range of inputs. You’re free to create your perfect setup with 6 channels and a host of different input types.

  4-BAND EQ and compressor. Take full control of your mix with the newly developed 4-band EQ. A built-in compressor enables further adjustment of the loudness of your tracks.

  Effects for more creative expression. The expanded send/return section enables you to add external FX, or even combine them with built-in FX. Create unique sounds; the possibilities are nearly limitless
