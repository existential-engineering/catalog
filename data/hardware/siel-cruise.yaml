description: >-
  A hybrid Italian analog synthesizer combining a polyphonic orchestral string
  section with a monophonic synthesizer in a single splittable 49-key
  instrument, also marketed by Sequential Circuits as the Fugue.
details: |-
  Released in 1981 by Italian organ manufacturer Siel, the Cruise was designed to offer
  keyboardists both polyphonic string textures and monophonic synthesizer capabilities without
  needing two separate instruments. The keyboard splits at the midpoint, allowing the left hand
  to play bass lines on the mono synth section while the right hand covers chords and pads on
  the polyphonic orchestra section.

  The monophonic synthesizer side features a single DCO (Digitally Controlled Oscillator)
  generating sawtooth waveforms at 32, 16, 8, and 4-foot settings alongside square waves at
  16, 8, and 4-foot. A dedicated VCF with cutoff and resonance controls shapes the tone, driven
  by a full ADSR envelope. The polyphonic section provides its own brass cutoff and resonance
  controls with separate attack and decay parameters for both brass and string timbres.

  Additional sound-shaping features include vibrato derived from a sine-wave LFO, portamento
  on the mono section, and an Animator effect that applies chorus-like thickening and tremolo
  modulation. The instrument has no patch memory, so all sounds must be dialed in manually.

  The Cruise had an interesting distribution history. Sequential Circuits rebranded and sold
  it in North America as the Fugue, while the polyphonic orchestra section alone was also
  released by ARP as the Quartet. Production continued through 1986, giving it a relatively
  long manufacturing run for a mid-tier analog instrument of the early 1980s.
specs: |-
  - Polyphony: Monophonic synth / 49-note polyphonic strings
  - Oscillators: 1 DCO (sawtooth 32'/16'/8'/4', square 16'/8'/4')
  - Filter: Mono VCF with cutoff and resonance; Poly brass cutoff and resonance
  - Envelopes: Mono ADSR; Poly brass attack, strings attack/decay
  - LFO: Sine vibrato
  - Effects: Portamento, Animator (chorus/tremolo/LFO)
  - Keyboard: 49 keys, splittable
  - Memory: None
  - Control: Volume and expression pedal inputs
releaseDate: "1981"
