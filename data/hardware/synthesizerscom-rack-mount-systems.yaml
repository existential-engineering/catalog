description: >-
  Synthesizers.com Rack Mount Systems are contemporary analog modular synthesizers offered
  in pre-configured rack configurations compatible with Moog modular standards. The QSR8
  is an 8.75-inch frame accommodating eight single-width modules, while the QSR24 consists
  of three stacked QSR8 units in a wooden enclosure. These systems feature
  hyper-modularity allowing any module to be placed anywhere without rewiring, including
  power modules.
details: |-
  Synthesizers.com manufactures classic-styled custom analog modular systems sold online from the USA. Their rack mount systems emphasize accessibility to modular synthesis without requiring vintage equipment restoration. The QSR8 serves as the entry-level unit, while the QSR24 provides expanded capability with three stacked QSR8 frames.

  The systems employ hyper-modularity, allowing any module to be placed anywhere without rewiring, including power modules. The upgraded power distribution represents a significant improvement over classic Moog designs. Compatibility exists both ways: Synthesizers.com modules integrate into vintage Moog systems, and signal levels remain compatible.

  The modules deliver raw analog sound featuring stable oscillators spanning multiple octaves, ladder filters, state-variable filters, and fixed-filter banks. The 24-step sequencers offer daisy-chaining capability and unique control features. Interface design prioritizes intuitive patching through reversible attenuators and integrated mixers, minimizing cable clutter while maintaining traditional modular workflow.

  Optional integration includes the QKB15S keyboard, a 5-octave MIDI-to-CV/Gate converter supporting monophonic and duophonic operation. Custom configuration allows selecting preferred modules for professional installation.
specs: |-
  - Monophonic (polyphonic with optional keyboard)
  - Q106 oscillators with sine, triangle, saw, ramp, and pulse waveforms
  - Q110 noise source
  - Q107 state-variable filter (12dB/oct low/band/high pass, 6dB/oct notch)
  - Q116 ring modulator
  - Q108 amplifier with multiple inputs
  - Q109 ADSR envelope generator
  - Q104 MIDI interface with pitch CV, gate, trigger, and velocity outputs
  - 24-step analog sequencer with daisy-chaining
  - Moog-compatible module format
  - QKB15S optional 5-octave MIDI keyboard controller
