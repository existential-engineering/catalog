description: A 4HP attenuverter/mixer module offering 4 channels for
  attenuating, polarizing, or generating voltage, with cascade mixing and
  daisy-chain capability across the GOMA family.
details: |-
  GOMA II is our new take on the classic attenuvertermixer

  concept. It stands for Generator, Offset, Mixer,

  Attenuverter. Featuring 4 channels within a 4HP width, GOMA II pushes

  the boundaries of space efficiency, maintaining intuitive

  operation and high-end components for max precision

  (low tolerance resistors, low noise/distortion opamps). GOMA II offers 4 channels to attenuate or polarize

  (attenuverter) any audio or CV signal. Additionally, each

  channel can act as a high precision voltage generator

  (–5V to +5V) to offset another channel or control external

  parameters. The 4 channels can be processed separately or summed

  through cascade mixing, which can extend further than a

  single module since all the GOMA family (I, II, Pro) can be

  daisy chained to unlock virtually infinite mixing.
