description: |-
  The Pro-Mod Plus So-Cal Style 1 HH HT E is a modernized take on Charvel's classic So-Cal shred machine, designed to take fast playing to the next level with a cutting-edge feature set. The alder So-Cal Style 1 body wears a gloss finish complemented by a 1-ply black anodized aluminum pickguard and dome-style control knobs.

  A bolt-on caramelized maple neck with graphite reinforcement is finished in hand-rubbed satin urethane and features rolled fingerboard edges in place of binding. The 25.5" scale ebony fingerboard has a 12"-16" compound radius, 22 jumbo frets, 4mm pearloid dot inlays, Luminlay side dots, and a Graph Tech TUSQ XL nut at 1.6875" wide. The neck attaches via a 4-bolt plate with recessed screws and is topped with a licensed Fender Stratocaster headstock.

  Electronics pair a Seymour Duncan Distortion TB-6 humbucker in the bridge with a Seymour Duncan Distortion SH-6N humbucker in the neck, routed through master volume and tone controls and a 5-position blade switch offering bridge, bridge outer coil/neck inner coil, bridge and neck, bridge inner coil/neck outer coil, and neck positions. A Charvel Hardtail bridge and Charvel sealed die-cast locking tuners in black hardware round out the package, with .009-.042 nickel-plated steel strings and a Charvel multi-fit gig bag included.
details: |-
  Modernized take on the classic So-Cal shred machine in the new Pro-Mod Plus series. Dual Seymour Duncan Distortion humbuckers with a 5-position blade switch enabling coil-split combinations. Caramelized maple neck with rolled fingerboard edges, ebony board, and 12"-16" compound radius. Charvel Hardtail bridge with locking tuners. Black hardware on a Racing Red gloss alder body. Licensed Fender Stratocaster headstock. Available in Racing Red (2965852339) and Black (2966851368).
