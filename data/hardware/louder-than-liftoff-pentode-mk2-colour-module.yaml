description: Tone Sculpting Tube Gigantifier for Chroma, Mister Focus, & DIYRE Colour. A tube saturation Colour Module featuring a NOS Raytheon 6418 subminiature pentode tube running near maximum plate voltage, with two selectable bias settings (Rich and Fat) and a 2-band Baxandall EQ inspired by a vintage 1960s tube mixer.
details: |-
  Pentode Mk2 increases the perceived loudness of your source by saturating the transients. As the ratio of RMS to peak energy grows by turning up the Colour host's Drive knob, sonic density is magnified, volume is increased, and the sound becomes gigantic. No starved plates here — this NOS subminiature tube is running near its max plate voltage courtesy of a dedicated 32V high voltage supply.

  Pentode Mk2 intensifies vibrant color in the source by adding musical 2nd and 3rd order harmonic distortion. The user may select between one of two tube bias settings to fine-tune the harmonic spectra. The RICH setting presents a lively blend of both even and odd order harmonics, which enhances presence and pulls the sound forward in a mix. The FAT bias setting configures the tube for mostly 2nd order harmonics — deep, thick, pure, round, and fat — evoking a more vintage vibe associated with classic tube equipment using triodes.

  The new 2-band Baxandall EQ follows the tube stage. Inspired by an obscure 1960's tube mixer, the Bass and Treble curves can be individually bypassed via jumper and their EQ gain is adjustable via trimpots (+/-8 dB). Whether used to add a signature frequency contour to the tube saturation, or employed as a variable Bass or Treble EQ in Chroma or Mister Focus, the Baxandall EQ makes Pentode Mk2 one of the most potent Colour modules available.

  Fully assembled, calibrated, and tested by Louder Than Liftoff. Chroma, Mister Focus, or DIYRE Colour Palette must be purchased separately.

  Note: There is a real vacuum tube in this thing. Due to the vibration sensitive nature of the 6418 tube, some units may experience a low-level ringing for a few seconds when the unit is bumped or the front panel bypass switch is pushed.
