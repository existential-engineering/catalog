description: The 1066DL is a hand-wired 500 Series mic/line preamplifier and
  3-band equalizer based on the classic 1066 design, sharing the same mic-line
  pre-amplification stage as the 1073 but with different EQ frequency selections
  particularly suited to guitar applications.
details: |-
  The 1066DL is based on the classic 1066 design, which features the same mic-line pre-amplification stage as the 1073 but with different frequency selections in its EQ for a whole new sonic palette. The available frequencies on the 1066 are especially well suited to guitar applications because of its unique midrange.

  The 1066DL is completely hand-wired using Carnhill (St. Ives) transformers and features the same mic-line pre-amp as the 1073, with the addition of a few different frequency options. This unit is popular among guitarists for its unique mid-range character.

  The original 1066 only had a 10kHz shelving option, but the 1066DL offers additional high frequency options: 10kHz, 12kHz, 16kHz, 20kHz, and 24kHz. A 3-band equalizer with high-pass filter and phase inversion round out the feature set.

  The unit includes a DI input with approximately 150k ohm impedance in addition to standard mic and line inputs, making it versatile for direct instrument tracking.
specs: |-
  - Frequency Response: 10Hz to -3dB at 55kHz
  - Gain Range: 0 to 80 dB
  - High Frequency EQ: ±16dB shelving at 10kHz, 12kHz, 16kHz, 20kHz, 24kHz
  - Low Frequency EQ: ±16dB shelving at 35Hz, 60Hz, 110Hz, 220Hz
  - Mid Frequency EQ: ±16dB peaking at 700Hz, 1.2kHz, 2.4kHz, 3kHz, 7kHz
  - High Pass Filter: 18dB/octave at 45Hz, 70Hz, 160Hz, 360Hz
  - Mic Input Impedance: ~1200/300 ohms
  - Line Input Impedance: 10k ohms
  - DI Input Impedance: ~150k ohms
  - Output Impedance: 65 ohms
  - Common Mode Rejection Ratio: 100dB min @ 60Hz
  - Maximum Output Level: +27.4 dBu @ 600Ω
  - Equivalent Input Noise: -110 dBu (unweighted, 300kHz bandwidth)
  - Power Requirements: 115/230 VAC, 28W
  - Weight: 6 lbs / 2.72 kg
  - Dimensions: 45mm W × 8.75 in H × 10.5 in D
  - Hand-wired construction with Carnhill (St. Ives) transformers
