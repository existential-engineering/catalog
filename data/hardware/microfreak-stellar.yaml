description: >
  MicroFreak Stellar is a limited edition of an acclaimed experimental synth that combines digital oscillators with an analog filter, boundless modulation with musical expression, and a sleek black finish with quirky space-age graphics - primed for your interplanetary sonic voyage.
details: |-
  Microfreak stellar is a limited edition experimental hybrid synth that combines digital oscillators with an analog filter, offering boundless modulation capabilities and musical expression. The synth features a distinctive all-black exterior decorated with detailed space-age graphics reflecting its controls, creating a unique visual identity. It represents the next chapter in the microfreak evolution, continuing to inspire with every firmware update and refusing to stop evolving.

  The synth features a hugely powerful digital oscillator with 21 different modes ranging from virtual analog to wavetable, sample playback, granular processing, and speech synthesis, incorporating algorithms from mutable instruments and noise engineering. A tasty state-variable analog filter offers low pass, band pass, and high pass modes with 12db/octave response and self-oscillation capability. The deceptively simple but powerful lfo and envelope generators, combined with a flexible cycling modulator that can act as either an envelope or lfo with variable rise and fall times, provide dynamic control over sound shaping.

  The 25-key capacitive keybed with polyphonic aftertouch sensitivity enables super-expressive playing, allowing users to switch from dirty bass ranges to screaming high-pitched leads with ease using transpose buttons. A polyphonic sequencer with 4 assignable modulation tracks, powerful arpeggiator with multiple modes (up, order, random, pattern), and spice & dice randomizers add creative sequencing possibilities. The assignable modulation matrix virtually wires 5 modulation sources to 7 destinations with 3 user-defined points, enabling complex sound design.

  The synth offers 512 preset slots with 320 factory presets providing a fantastic mix of traditional and experimental sounds, with plenty of space to save custom creations. A crisp OLED display provides crystal clarity for navigating settings and preset values. The firmware update introduces user sample import, a sampler engine, and 3 granular engines, expanding sonic possibilities.

  Connectivity options include 3.5mm headphone output (trrs-compatible for microphone and audio input for the vocoder engine), 6.35mm master output for balanced line-level output, 3.5mm clock input/output with configurable clock types (24 ppq, 48 ppq, 2 ppq, or single pulse per step), MIDI in/out with included breakout cables, and CV/gate/pressure outputs for integration with vintage synths and eurorack gear. The synth can be powered by either the included psu or USB, eliminating the need for volt-hungry analog oscillators.
