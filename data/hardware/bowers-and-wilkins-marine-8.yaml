details: |-
  Marine 8 is a two-way loudspeaker with a 25mm (1-in) tweeter and a 200mm (8-in) polypropylene bass/midrange driver. It boasts an IP66 rating for incredible ruggedness when installed, and although it is the larger of the Marine loudspeakers it fits into a shallow depth of 93mm (3.7-in) with a cut-out of 249mm (9.8-in).

  Strength and power. Marine 8 is designed to survive almost anything, and its big 20cm mid/bass driver ensures a powerful, weighty sound.

  Easy installation. A shallow 93mm mounting depth means Marine 8 fits almost anywhere.

  The marine environment is unforgiving. Any equipment has to survive extremes of temperature, salt spray and hosing down. It’s little wonder then that most speakers designed for marine applications sacrifice sound quality for ruggedness.

  Of course, any Bowers & Wilkins speaker must sound brilliant. So these marine speakers were first designed to match exacting sound quality standards, then the necessary toughness to survive the harsh marine environment was added. Both models boast IP66 ratings when properly installed, and the metal grille and all screws are marine-grade stainless steel. The driver chassis uses a non-corroding rigid polymer and the tweeter dome has a rear support to prevent permanent deformation when hosed down.
specs: |-
  - Description: 2-way system
  - Drive units: 1x ⌀25mm (1-in) soft dome tweeter, 1x ⌀200mm (8-in) polypropylene cone bass/midrange
  - Frequency range: 36Hz to 26kHz
  - Sensitivity: 90dB (2.83V, 1m)
  - Nominal impedance: 8 ohms
  - Recommended amplifier power: 20W to 80W
  - Cut-out diameter: 249mm (9.8in)
  - Mounting depth: 93mm (3.7in)
  - Outer diameter: ⌀292mm (11.5in)
  - Protrusion: 8mm (0.3in)
  - Net weight: 1.7kg (3.8lb)
  - IP66 rated when properly installed
  - Marine-grade stainless steel chassis and grille, non-corroding rigid polymer driver chassis, tweeter dome with rear support
  - Pre-mount kit: C8
  - Back box: 6C (not suitable for marine applications)
  - Passive design, requires an external power amplifier
  - Finishes: Black, White
