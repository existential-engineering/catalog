description: Marine 8 is a two-way loudspeaker with a 25mm (1-in) tweeter and a
  200mm (8-in) polypropylene bass/midrange driver. It boasts an IP66 rating for
  incredible ruggedness when installed, and although it is the larger of the
  Marine loudspeakers it fits into a shallow depth of 93mm (3.7-in) with a
  cut-out of 249mm (9.8-in).
details: |-
  Marine 8 is the larger of the two Bowers & Wilkins Marine flush-mount loudspeakers, a two-way design pairing a 25mm (1in) soft dome tweeter with a 200mm (8in) polypropylene cone bass/midrange driver. Despite the bigger driver it keeps a shallow 93mm (3.7in) mounting depth behind a 249mm (9.8in) cut-out.

  Bowers & Wilkins says the Marine 8 is designed to survive almost anything, that its big 20cm mid/bass driver ensures a powerful, weighty sound, and that its shallow 93mm mounting depth lets it fit almost anywhere. The speaker carries an IP66 rating when properly installed and uses a marine-grade stainless steel chassis and grille with polypropylene drivers.

  The Marine 8 is a passive loudspeaker and needs an external power amplifier. Nominal impedance is 8 ohms, sensitivity is 90dB (2.83V, 1m), frequency range is 36Hz to 26kHz and Bowers & Wilkins recommends 20W to 80W of amplifier power. There is no on-board amplification and no mains connection of any kind.

  Installation is custom-install oriented and handled through Bowers & Wilkins custom installation experts, and the specifications name a C8 pre-mount kit and a 6C back box, with the back box explicitly noted as not suitable for marine applications. The shared Marine 6 and Marine 8 quick start guide dimensions the Marine 8 at a 249mm (9.8in) cut-out inside a 253mm (10in) aperture, a 93mm (3.7in) recess behind the baffle, 8mm (0.3in) of protrusion and a 292mm (11.5in) outer diameter.

  Two finishes are offered, Black and White.
specs: |-
  - Description: 2-way system
  - Drive units: 1x 25mm (1in) soft dome tweeter, 1x 200mm (8in) polypropylene cone bass/midrange
  - Frequency range: 36Hz to 26kHz
  - Recommended amplifier power: 20W to 80W
  - Sensitivity: 90dB (2.83V, 1m)
  - Nominal impedance: 8 ohms
  - Pre-mount kit: C8
  - Back box: 6C (not suitable for marine applications)
  - IP66 rated when properly installed
  - Marine-grade stainless steel chassis and grille, polypropylene drivers
  - Mounting depth: 93mm (3.7in)
  - Cut-out diameter: 249mm (9.8in)
  - Outer diameter: 292mm (11.5in) (quick start guide)
  - Protrusion: 8mm (0.3in) (quick start guide)
  - Finishes: Black, White
  - Passive loudspeaker: no on-board amplification and no mains connection
