description: >-
  The Roland JV-1010 is a compact half-rackspace sound module that delivers the full sound
  set of the professional JV-1080 and JV-2080 modules in a miniature format. It features
  64-voice polyphony, 640 preset patches, and all 255 sounds from the Session wave
  expansion board. Its expansion slot accepts JV-80 Series boards, enabling access to over
  1,200 patches when fully expanded.
details: |-
  The JV-1010 represents Roland's approach to packing professional-grade synthesis into a diminutive half-rack form factor. It contains the complete sound set of the larger JV-1080 and JV-2080 modules, along with 640 preset patches, 128 user-programmable patches, and all 255 sounds from the Session wave expansion board, providing an extensive sonic palette ranging from acoustic instruments to synthesized textures.

  The module is a 16-part multitimbral unit capable of responding to MIDI data across multiple channels simultaneously. An expansion slot accepts JV-80 Series boards in categories such as Asian, Orchestral, Hip Hop, Techno, Bass & Drums, Vocal, Country, and World sounds, ultimately enabling access to over 1,200 patches when expanded.

  Sound navigation is handled through category-based organization and a dedicated Category/Bank Select knob. A Phrase Preview function plays back the selected tone in a short musical phrase, allowing users to audition sounds in context. The module also includes sound editing software for Mac and PC, used in conjunction with its rear-panel computer serial interface for deep patch customization.

  The JV-1010 is well suited for both studio and live performance applications where rack space is limited. Its General MIDI compatibility makes it a practical choice for computer-based music production, while its compact design and affordable price point make it accessible to a wide range of musicians.
specs: |-
  - 64-voice polyphony
  - Digital synthesis with 8 MB sample ROM
  - 640 preset patches, 128 user patches
  - 32 performances, 18 rhythm kits
  - 16-part multitimbral
  - 8 reverb types, 1 chorus, 40 multi-effects
  - 1 JV-80 Series expansion slot
  - MIDI In/Out/Thru
  - Serial computer host port
  - Half-rackspace format
