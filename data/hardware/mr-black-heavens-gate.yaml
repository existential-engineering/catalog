name: Heaven's Gate
manufacturer: mr-black
primaryCategory: pedal
categories:
  - reverb
url: https://www.mrblackpedals.com/products/heavens-gate
description: A dynamic reverb that lets ambience bloom while you play and
  instantly clears the moment you stop or mute, so reflections appear and
  disappear at your command.
details: |-
  Heaven's Gate is a reverb pedal built around dynamic, playing-responsive control of the reverb tail. It operates much like a standard reverb, but adds instantaneous control over all the ambience you create: stop playing or mute your notes and the reverb quickly and smoothly departs, returning you to a crisp, dry signal as though no reverb had ever been applied.

  This makes it a specialist rather than an everyday reverb. Deliberate, nuanced control of attack and note length rewards the player with textures that would otherwise require constant simultaneous adjustment of multiple reverb parameters. Three intuitive controls handle setup, letting you match the effect to your tempo, riff and playing style and bring explosive ambience in and out automatically.

  Mr. Black recommends placing Heaven's Gate after dynamically controlled effects such as overdrive, distortion, fuzz, envelope filters and compressors, and potentially before delay or echo devices.

  It ships as a standard stompbox with a single input and output.
specs: |-
  - Dynamic reverb with instant, playing-responsive tail control
  - Reverb appears while playing and clears on stop/mute
  - Three intuitive controls
  - Recommended after dynamic effects, before delay/echo
