description: Six-channel analogue DJ mixer with rotary controls, balanced
  connections, and separate House and Booth outputs.
details: |-
  With six channels and flexible routing, the 1620LE has more than enough connectivity to handle sophisticated system configurations or installations. And when the dancefloor is packed, you'll love the instant, spontaneous and intuitive feel of the 1620LE's controls. One look at the feature set will tell you that the 1620LE is all about the music. Classic rotary level & balance controls, great source flexibility, separate House and Booth outputs, a beautifully elegant headphone section and true balanced connections put performance where it really counts. For more information, please visit the UREI website at www.ureidj.com
