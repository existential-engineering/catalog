description: An ultra-transparent stereo active DI box with a Fred Forssell JFET
  circuit and Lehle step-down transformer, delivering high-quality direct
  injection with ten-megohm input impedance and a ground-lift switch for
  noise-free performance.
details: |-
  The TDI and TDI Duo's active circuitry delivers top-grade sound quality while minimizing distortion and noise interference and maximizing your signal over long cable runs. A ground-lift switch eliminates any remaining hum or noise that can arise from grounding loops.

  Though designed for instrument-level signals generated by passive pickups, the TDI and TDI Duo are perfect for line-level signals from drum machines, samplers, and synths.

  The TDI and TDI Duo are built to last with a rugged steel chassis, ideal for tours, stage backlines, and years of rigorous studio use.

  You can also mount three TDI Duos onto a standard 19" universal rack tray to create a six-channel 1U DI station.

  NAMM TEC Award 2026 winner for outstanding technical achievement in audio engineering.
specs: |-
  - Phantom-powered stereo DI box with active circuitry
  - Ultra-low-noise JFET buffer driving a Lehle step-down transformer
  - Ten megohm input impedance
  - -20 dB pad for speaker-level signals and active instruments
  - Ground-lift switch
  - Rugged steel chassis
  - Three units mountable on a standard 19" rack tray for six-channel 1U DI
  - Designed by Fred Forssell
  - Made in the U.S.A.
