url: https://www.klipsch.com/products/cornwall-iv-floorstanding-speaker
description: The Cornwall IV is a three-way, 15" horn-loaded floorstanding
  loudspeaker from Klipsch's Heritage Series, handcrafted in Hope, Arkansas with
  book-matched wood veneer. It is the largest of Klipsch's compact Heritage
  speakers, delivering high-efficiency, high-sensitivity performance suited to
  low-powered amplifiers.
details: |-
  Originally introduced in 1959, the Cornwall was designed as a larger, full-range center-channel alternative to the Heresy, making it likely the world's second commercially produced center-channel speaker. The Cornwall IV is the fourth generation of this iconic design.

  The Cornwall IV features an updated mid-frequency driver paired with a new midrange Tractrix horn for improved clarity and detail retrieval. New ports expand low-frequency extension and clarity. The three-way, fully horn-loaded design uses a 15" woofer, a midrange compression driver on a Tractrix horn, and a 1" titanium tweeter on a 90×90° Tractrix horn.

  Cabinetry is handcrafted and assembled in Hope, Arkansas, with book-matched wood veneer panels sourced from the same timber cuts. Available finishes include American Walnut, American Auburn, and Black Ash. The design features a matte black riser for a floating appearance and a brushed-metal premium input panel. A new scripted logo completes the updated aesthetic.

  The Cornwall IV carries a 10-year warranty, reflecting Klipsch's Heritage Series commitment to longevity. It is sensitive enough to be driven by low-wattage tube amplifiers while also capable of handling substantial solid-state power.
