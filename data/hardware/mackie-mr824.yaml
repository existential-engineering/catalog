description: '8" Powered Studio Monitor delivering unmatched accuracy and
  clarity for a clean stereo image in any room, so you can create professional
  mixes that sound great anywhere.'
details: |-
  The MR824 delivers professional mixing capabilities with a proven logarithmic waveguide design that creates ultra-wide dispersion for enhanced stereo imaging and a wider listening sweet spot. Precise acoustic alignment across the frequency spectrum lets you trust what you hear when crafting a mix.

  A 1" silk dome tweeter provides fast transient response for detailed high end and vocal clarity, while an 8" polypropylene woofer delivers responsive, dynamic low-frequency response. 85 watts of bi-amplified Class A/B amplification drives the system with headroom to spare.

  Adjustable acoustic space filters and an HF filter (with boost or cut options) allow the MR824 to be optimized for a wide variety of room configurations and placements. Flexible inputs allow simple connection to almost any audio source.

  The all-wood cabinet incorporates custom internal bracing to reduce distortion and resonance, contributing to the monitor's clean, accurate reproduction.
specs: |-
  - 8" polypropylene woofer
  - 1" silk dome tweeter
  - 85W bi-amplified Class A/B amplification
  - Frequency response: 35 Hz – 20 kHz
  - Logarithmic waveguide for ultra-wide dispersion
  - Adjustable acoustic space filters
  - HF filter with boost or cut options
  - All-wood cabinet with custom internal bracing
