name: SC6000 PRIME
manufacturer: denon-dj
primaryCategory: console
categories:
  - control-surface
url: https://www.denondj.com/sc6000-prime.html
description: The SC6000 PRIME is a professional DJ Media Player with 10.1"
  Touchscreen and WiFi Music Streaming for the Ultimate in Creativity, Workflow
  and Performance
details: |-
  10.1" HD multi-touch display for navigating libraries, crates, and waveforms

  Dual-layer playback enables two tracks simultaneously from a single SC6000

  8.5" motorized jog wheel with adjustable tension and 2.2" platter display

  8 RGB performance trigger pads for cues, loops, rolls, and slicer

  Harmonic mixing with key shift and instant key match

  Best-in-class timestretch for artifact-free audio at extreme tempo changes

  Built-in WiFi and Ethernet for streaming Beatport LINK, Beatsource LINK, SoundCloud GO+, TIDAL, and Dropbox

  Internal 2.5" SATA drive bay plus SD card and four USB ports for media

  Controller mode compatibility with Serato DJ Pro and VirtualDJ

  Bluetooth audio in/out for wireless source streaming and monitoring

  Engine OS standalone operation requires no laptop tethering
specs: |-
  - Analog Output: 2.0 Vrms (0 dBFS, 1 kHz)
  - Signal-to-Noise Ratio: 116 dB
  - Distortion (THD+N): < 0.0015%
  - Frequency Range: 22 Hz to 22 kHz
  - Digital Output: 96 kHz / 24-bit
  - Platter: 8.5" / 216 mm metal platter with touch-capacitive display
  - Main Display: 10.1" / 257 mm diagonal, full-color LED-backlit touchscreen
  - Platter Display: 2.2" / 56 mm full-color LED-backlit display
  - Power Connection: Locking IEC
  - Power Input: 110-240 VAC, 50/60 Hz
  - Dimensions: 319.5 mm x 463.3 mm x 151.17 mm (12.6" x 18.2" x 6")
  - Weight: 5.8 kg / 12.76 lbs (without USB and power cable)
  - Supported File Systems: exFAT, FAT32
  - Supported Audio Formats: AAC/M4A, AIF/AIFF, ALAC, FLAC, MP3, MP4, Ogg Vorbis, WAV
