details: |-
  Gretsch presents a darkly alluring take on its classic acoustic model with the G5013CE Rancher Jr. With its slick, elegant appointments and onboard electronics, it's a cool and classic performer with a distinctive Gretsch personality all its own.

  The G5013CE has a single-cutaway, 4.5"-deep Rancher Jr. body featuring a spruce top with scalloped "X"-bracing, arched mahogany back and mahogany sides for excellent tonal character, projection and balance. The bound mahogany neck is topped by a 21-fret laurel fingerboard with pearloid Neo-Classic thumbnail position inlays.

  Other features include the classic Rancher triangular soundhole, a "red shell" pickguard with the Gretsch logo, multiply body binding, laurel bridge with compensated synthetic bone saddle, deluxe tuners and a Fishman Isys pickup/preamp system with under-saddle pickup, onboard tuner, master volume, treble and bass controls, and phase control.
