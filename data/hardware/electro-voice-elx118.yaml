name: ELX118
manufacturer: electro-voice
primaryCategory: subwoofer
categories:
  - speaker
url: https://products.electrovoice.com/na/en/elx118/
description: 18-inch passive subwoofer from Electro-Voice's Live X series,
  engineered to add supplemental low-frequency extension to ELX112 and ELX115
  full-range cabinets. A single EVS-18K 18-inch woofer in an internally braced
  15 mm plywood enclosure delivers 134 dB peak SPL with omnidirectional low-end
  coverage for portable sound reinforcement.
details: >-
  Companion subwoofer to the ELX112 and ELX115 in the Live X family, optimized
  to add bass extension to those full-range tops in portable PA, DJ, and
  small-format live setups.


  Built around the EVS-18K 18-inch woofer in a bass-reflex enclosure, with a
  recommended 30 Hz high-pass filter to protect the driver at high output
  levels.


  Cabinet uses 9-ply 15 mm plywood with internal bracing and a textured paint
  finish. The front is fronted by an 18 GA steel grille with black powder coat;
  dual NL4 Speakon jacks support a parallel input/through wiring scheme.
specs: |-
  - Configuration: passive subwoofer, bass-reflex
  - LF transducer: EVS-18K 18 in (457 mm) woofer
  - Power handling (continuous / peak): 400 W / 1600 W
  - Frequency response (-3 dB): 50 Hz - 100 Hz
  - Frequency range (-10 dB): 35 Hz - 200 Hz
  - Maximum SPL: 134 dB
  - Axial sensitivity: 96 dB
  - Nominal impedance: 8 ohms
  - Minimum impedance: 6.7 ohms
  - Coverage pattern: omnidirectional
  - Recommended high-pass filter: 30 Hz
  - Input connectors: 2 x NL4 Speakon (parallel in/through)
  - Cabinet material: 9-ply 15 mm plywood, internally braced, textured paint
  - Grille: 18 GA steel with black powder coat
  - Dimensions (H x W x D): 661 x 507 x 574 mm (26.02 x 19.98 x 22.60 in)
  - Net weight: 30.6 kg (67.4 lb)
  - Shipping weight: 37.2 kg (81.9 lb)
