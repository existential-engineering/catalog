id: JNGXaTIYrgMHJy75mG7aE
name: 205L Direct Input
manufacturer: api-audio
primaryCategory: di-box
categories:
  - rack-mount
url: https://apiaudio.com/product/205l-direct-input/
description: 200-Series DI module with high-impedance instrument input for
  guitar and bass. Features tone shaping (Thin/Fat), Bright switch, 20 dB pad,
  and transformer-coupled output capable of reaching professional line levels.
details: 200 Series module compatible with Legacy/Vision Series Consoles and
  L200 Rack. All-discrete circuit design with transformer-coupled balanced
  output. Features wide-range gain control, Hi-Z input emulating tube amp
  loading, Thin/Fat tone control, Bright switch, 20 dB pad, 100K load switch,
  and 5-segment LED output meter.
specs: |-
  - Format: 200 Series
  - Input impedance: >470K Ohms (unbalanced)
  - Output impedance: 85 Ohms (transformer-coupled, balanced)
  - Frequency response: 30–20 kHz (±0.3 dB)
  - Noise floor: 98 dB below +10 dBm output
  - THD: 0.02% at +4 dB (2 kHz)
  - Power: ±16V DC, 80mA max
  - Dimensions: 1.25" × 2.65" × 6.5" deep
  - Weight: 0.61 lb
