description: Erica Synths Black HADSR Envelope generator is a feature-rich yet
  easily operated five stage envelope generator. If you wish to add more
  versatility, you can use it with the Black CV Expander.
details: |-
  The Black HADSR Envelope Generator is a feature-rich yet easily operated five stage envelope generator. A hold stage joins the familiar attack, decay, sustain and release, and the module runs in either HADSR or AHDSR mode, so the adjustable hold time can sit before or after the attack.

  Looping covers both the full ADSR shape and a simpler AR shape, and the trigger input retriggers the envelope at any stage. An inverted output sits alongside the direct one. Used together with the Black EG CV Expander, each parameter can be adjusted by CV.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. When designing the Black Series, Erica Synths did not economise on module width, putting design and usability first, and big knobs are assigned to the functions that make a difference in sound. Together the Erica Black series are a range of modules that make an entire synthesizer.

  The panel is 12HP wide at a depth of 25mm. Sustain reaches +10V, hold and attack run to 2 seconds, decay to half a second and release to 5 seconds. Power draw is 25mA on the positive rail against 15mA on the negative one, and diode protection guards against a reversed power supply.
specs: |-
  - Sustain level 0 - +10V
  - Hold time 0 - 2''
  - Attack time 0 - 2''
  - Decay time 0 - 0,5''
  - Release time 0 - 5''
  - Power consumption +25mA, -15mA
  - Module width 12HP
  - Module depth 25mm
  - Full ADSR envelope looping
  - AR envelope looping
  - HADSR and AHDSR modes
  - Retrigger envelope at any stage with trigger input
  - Adjust each parameter with CV (if used with EG CV Expander)
  - Inverted output
  - Adjustable hold time before or after attack
  - Diode protection on reversed power supply
