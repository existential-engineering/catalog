name: CINEMA 40
manufacturer: marantz
primaryCategory: amplifier
url: https://www.marantz.com/en-us/product/av-receivers/cinema-40/300615.html
description: |-
  A reference-level AV receiver, CINEMA 40 is a statement piece engineered with the latest immersive audio formats, poised to deliver rich, spacious, and enveloping Marantz sound. It offers powerful multichannel amplification and advanced connectivity to support immersive speaker layouts and next-generation sources in premium home theaters.

  Crafted in Shirakawa, Japan, the CINEMA 40 is a Reference 9.4 Channel AV Receiver powered by HEOS, delivering 125 watts per channel with discrete Class A/B current-feedback amplification. It supports Dolby Atmos, DTS:X, IMAX Enhanced, Auro-3D, and 360 Reality Audio, with seven 8K HDMI inputs, three HDMI outputs (one with eARC), and Audyssey MultEQ XT32 room correction with Dirac Live upgradability. Backed by a 5-year warranty.
details: |-
  A reference-level AV receiver, CINEMA 40 is a statement piece engineered with the latest immersive audio formats, poised to deliver rich, spacious, and enveloping Marantz sound. It offers powerful multichannel amplification and advanced connectivity to support immersive speaker layouts and next-generation sources in premium home theaters.

  Crafted in Shirakawa, Japan, the CINEMA 40 features 9 powered channels at 125W each with discrete Class A/B current-feedback amplification, plus bi-amp capability. It supports the latest immersive audio formats including Dolby Atmos (with Height Virtualization), DTS:X, DTS Neural:X, DTS Virtual:X, IMAX Enhanced, Auro-3D, 360 Reality Audio, and MPEG-H, processing up to 11.4 channels.

  Video connectivity includes 7 HDMI inputs and 3 HDMI outputs (one with eARC), all supporting 8K @ 60Hz and 4K @ 120Hz with HDR10+, Dolby Vision, HLG, and Dynamic HDR. Gaming features include ALLM pass-through, VRR, and QFT. Audyssey MultEQ XT32 room correction with Dynamic EQ/Volume and LFC is included, with Dirac Live upgradability available.

  Networking and streaming features include HEOS Built-in for multi-room playback (3 zones), AirPlay 2, Bluetooth, Wi-Fi, Ethernet, and support for Spotify Connect, TIDAL, Amazon Music HD, Deezer, Pandora, SiriusXM, and Roon (tested). Voice control via Alexa, Google Assistant, and Apple HomePod. The receiver decodes lossless audio up to 192/24 FLAC/WAV/ALAC and DSD 2.8/5.6MHz with gapless playback. Backed by a 5-year warranty.
specs: |-
  - 9 powered channels, 125W per channel (8 ohm, 20Hz-20kHz, 0.05% THD, 2ch drive)
  - 165W per channel (6 ohm, 1kHz, 0.7% THD, 2ch drive)
  - 235W per channel (6 ohm, 1kHz, 10% THD, 1ch drive)
  - Class A/B discrete power amplifier with current feedback topology
  - Bi-amp capability
  - Up to 11.4 processing channels
  - Dolby Atmos, Dolby TrueHD, Dolby Atmos Height Virtualization, Dolby Surround
  - DTS:X, DTS-HD Master Audio, DTS Neural:X, DTS Virtual:X
  - IMAX Enhanced, Auro-3D, 360 Reality Audio, MPEG-H
  - Audyssey MultEQ XT32 room correction with Dynamic EQ, Dynamic Volume, and LFC
  - Dirac Live upgradable
  - Variable crossover, optimized bass redirection, bass sync
  - 7 HDMI inputs (all 8K-capable) and 3 HDMI outputs (1 with eARC/ARC)
  - HDCP 2.3, 8K @ 60Hz and 4K @ 120Hz max
  - HDR10+, Dolby Vision, HLG, Dynamic HDR pass-through
  - ALLM, VRR, QFT for gaming; HDMI pass-through in standby; CEC
  - DSD audio over HDMI; auto lip-sync
  - Hi-res audio: FLAC HD 192/24, WAV 192/24, ALAC 192/24, DSD 2.8/5.6MHz
  - MP3, WMA, AAC; gapless playback (FLAC, WAV, ALAC, DSD); MDAX2
  - HEOS Built-in multi-room and streaming (3 zones)
  - AirPlay 2, Bluetooth, Wi-Fi, Ethernet
  - Streaming: Spotify Connect, TIDAL, Amazon Music HD, Deezer, Pandora, SiriusXM, iHeartRadio, Napster, SoundCloud, Mood Mix, TuneIn; Roon tested
  - Voice control: Amazon Alexa, Google Assistant, Apple HomePod
  - Marantz AVR Remote App and HEOS app
  - IP/RS232/Web/App control; 3 DC trigger outputs; IR flasher input; Marantz remote bus
  - 5 analog RCA audio inputs, MM phono input, 2 coaxial S/PDIF inputs, 2 optical TOSLINK inputs
  - Front-panel USB-A input (USB audio)
  - 4 independent subwoofer RCA outputs
  - 2 multi-room analog outputs (RCA)
  - 11 speaker terminals; Speaker A/B assignable; gold-plated RCA terminals
  - AM/FM tuner with 2 external detachable antennas
  - Metal front panel with 2-line FLD + port hole OLED display
  - 9 GUI languages; firmware updates via network/USB
  - Power consumption: 710W operating; 65W (ECO on) / 110W (ECO off) no-sound; 0.2W standby; 0.5W CEC standby; <2.0W network standby
  - Dimensions (without antenna): 17.3" W x 15.8" D x 7.3" H
  - Weight: 33.3 lbs
  - Available colors: Black, Silver-Gold
  - Crafted in Shirakawa, Japan
  - 5-year warranty
  - Included: main unit, RC048SR remote with batteries, wire labels, quick start guide, Audyssey microphone with stand, 2 detachable antennas, AC cord
