    currency: USD
description: |-
  A reference-level AV receiver, CINEMA 40 is a statement piece engineered with the latest immersive audio formats, poised to deliver rich, spacious, and enveloping Marantz sound. It offers powerful multichannel amplification and advanced connectivity to support immersive speaker layouts and next-generation sources in premium home theaters.

  Crafted in Shirakawa, Japan, the CINEMA 40 is a Reference 9.4 Channel AV Receiver powered by HEOS, delivering 125 watts per channel with discrete Class A/B current-feedback amplification. It supports Dolby Atmos, DTS:X, IMAX Enhanced, Auro-3D, and 360 Reality Audio, with seven 8K HDMI inputs, three HDMI outputs (one with eARC), and Audyssey MultEQ XT32 room correction with Dirac Live upgradability. Backed by a 5-year warranty.
details: |-
  A reference-level AV receiver, CINEMA 40 is a statement piece engineered with the latest immersive audio formats, poised to deliver rich, spacious, and enveloping Marantz sound. With 9.4 channels at 125 watts per channel and seven 8K HDMI inputs, it offers powerful multichannel amplification and advanced connectivity to support immersive speaker layouts and next-generation sources.

  A modern expression of timeless design principles, CINEMA 40 features the iconic Marantz porthole, premium materials, and subtle sidelights that illuminate the front panel.

  Immersive spaciousness, warm and rich tone, extraordinary detail and lifelike dynamics are legendary hallmarks of Marantz sound, and the Marantz Sound Master tuned CINEMA 40 with careful parts selection.

  CINEMA 40 comes complete with the latest immersive audio formats, 8K video, room optimization and streaming. Eleven speaker terminals, an 11.4-channel pre-out with four independent subwoofer outputs and three multi-room zones cover large and flexible installations.
specs: |-
  - 9 powered channels, 125 W per channel (8 ohm, 20 Hz - 20 kHz, 0.05% THD, 2ch driven)
  - 165 W per channel (6 ohm, 1 kHz, 0.7% THD, 2ch driven), 235 W (6 ohm, 1 kHz, 10% THD, 1ch driven)
  - 11.4 processing channels with 11.4-channel pre-out and four independent subwoofer outputs
  - Class A/B discrete power amplifier with current feedback topology, assignable bi-amp drive
  - Eleven speaker terminals, 4-16 ohm impedance
  - Seven 8K HDMI inputs and three HDMI outputs (ARC and eARC), HDCP 2.3, 8K/60Hz and 4K/120Hz
  - Dolby Atmos, Dolby Atmos Height Virtualization, Dolby Surround, DTS-HD Master, DTS:X, DTS Neural:X, DTS Virtual:X, Auro-3D, IMAX Enhanced, 360 Reality Audio, MPEG-H
  - Audyssey MultEQ XT32 with Dynamic EQ, Dynamic Volume and LFC
  - Dirac Live upgradable
  - HEOS built-in, AirPlay 2, Spotify Connect, Roon tested, Bluetooth with headphone retransmit
  - Three multi-room zones, 3 DC triggers, RS-232C, IR flasher in and Marantz Remote Bus
  - Power consumption 710 W, standby 0.2 W, weight 33.3 lbs., 17.3 x 15.8 x 7.3 in. without antenna
