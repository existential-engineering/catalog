description: The A32pro is a 1U converter with 32 x 32 balanced analog inputs
  and outputs on D-Sub 25 connectors, a stereo main out and sample rates up to
  192 kHz, carrying both ADAT (32 x 32 channels) and MADI (64 x 64 channels). A
  routing matrix makes it a digital format converter as well as a converter, for
  integrating existing and future MADI and ADAT devices.
details: |-
  The A32pro is built on a modular hardware platform and is fully equipped with the most widely used analog and digital interfaces. Beside the 32 x 32 balanced analog inputs and outputs in studio quality and the stereo main out up to 192 kHz, it offers both ADAT (32 x 32 channels) and MADI (64 x 64 channels).

  The highly integrated converter sits in a compact 1U chassis and carries 32 x 32 balanced analog channels, brought out over eight D-Sub 25 connectors. They deliver studio levels up to +20 dBu, adjustable individually in 1 dB steps.

  The design pairs the latest generation of ESS converters with a temperature-compensated clock and a jitter-reduction PLL, for crystal-clear sound up to 192 kHz. Thanks to its flexibility and a routing matrix, the A32pro is not only a converter but also a digital format converter for integrating existing and future MADI and ADAT devices.

  Two SFP slots take MADI modules of 64 x 64 channels each, with automatic redundant slot switching if one module loses signal. Two independent high-end headphone outputs run through a monitoring matrix, and a balanced 1/4-inch TRS stereo output mirrors the source feeding the red headphone output.

  A GPIO port with four I/Os handles external alarm monitoring and preset switching, preset management covers eight renameable presets, and nearly all analog and digital inputs and outputs can be routed in groups of eight channels. The unit ships with one multimode optical MADI SFP module.
specs: |-
  - 32 x 32 balanced analog I/O channels on D-Sub 25 connectors, with a maximum I/O level of +20 dBu
  - Individually adjustable input gain and output level on every analog I/O
  - 2 SFP slots for two MADI modules, 64 x 64 digital MADI channels each
  - Automatic redundant slot switching when an SFP module loses signal
  - 32 x 32 ADAT I/O channels on TOSLINK connectors
  - Two independent high-end headphone outputs with a monitoring matrix
  - Balanced 1/4-inch TRS stereo output mirroring the output source of the red headphone output
  - 1 multimode optical MADI SFP module included as the standard module
  - GPIO port with 4 I/Os for external alarm monitoring and preset switching
  - Preset management with eight renameable presets
  - Nearly all analog and digital inputs and outputs can be routed in groups of 8 channels
  - Sample rates up to 192 kHz
  - Compact 1U chassis
  - Shipping weight 5 kg
  - Shipping dimensions 27 x 48 x 44 cm
