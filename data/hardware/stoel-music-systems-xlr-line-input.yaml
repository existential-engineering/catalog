description: A Eurorack module providing a balanced XLR line-level input, using
  a Burr-Brown balanced line receiver to interface professional balanced sources
  with Eurorack systems, with an 1/8-inch level-controlled output and LED
  metering.
details: |-
  The Stoel Music Systems XLR Line Input provides a balanced XLR input for line-level applications like mixers, outboard effects, and computer audio interfaces. The heart of this module is a specialized balanced line receiver by Burr-Brown, providing exceptional audio performance and proper interfacing between professional balanced outputs and Eurorack systems. The 1/8" output level is controlled by the knob, and LED metering is provided for a visual assurance of signal activity. A trimmer is also provided on the module to adjust the input sensitivity. This module is beneficial when Eurorack systems are used in the studio as external effects processors or when outboard studio equipment like effects processors, EQs, or compressors are interfaced with Eurorack signals. It is also helpful for playing back samples or receiving signals from a mixing console during a live performance. This module is not designed for use as a microphone input. It does not provide enough gain or the correct impedance for most microphones, so the signal may be weak or inaudible if a microphone is plugged in without a preamp. Also, it does not provide the phantom power required for most condenser microphones. Technical Specifications

