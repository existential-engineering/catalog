id: BRczxMW7Y-sU0vZlVqBPN
name: 550B 4-Band EQ
manufacturer: api-audio
primaryCategory: eq
categories:
  - rack-mount
url: https://apiaudio.com/product/550b-4-band-eq/
description: Classic 4-band proportional Q EQ adding a fourth band to the 550A.
  Features 7 frequency centers per band, ±12 dB boost/cut, shelf/peak switching
  on outer bands, and the API 2520 op-amp.
details: |-
  500-series 4-band proportional Q equalizer. Low:
  30/40/50/100/200/300/400 Hz (peak/shelf). Low-Mid: 75/150/180/240/500/700/1k
  Hz (peaking). Mid-High: 800/1.5k/3k/5k/8k/10k/12.5k Hz (peaking). High:
  2.5k/5k/7k/10k/12.5k/15k/20k Hz (peak/shelf). ±12 dB boost/cut. Proportional
  Q. 12 dB/octave filter slope. +30 dBu clip level. 15-position .156″ edge
  connector.
specs: |-
  - Input impedance: 18.5 kΩ (+4 in) / 7.5 kΩ (−2 in)
  - Output impedance: <75 Ω (transformer balanced)
  - Nominal levels: −15 to +15 dBu
  - Clipping level: +30 dBu @ ±16V
  - Frequency response: +0, −0.3 dB (30 Hz–20 kHz)
  - Noise: <−98 dBu (20–20 kHz, unweighted)
  - THD: 0.07% max @ +18 dBu
  - Power: ±12/18V DC @ 40 mA
  - Dimensions: 1.5″ H × 5.25″ W × 7.5″ D
  - Weight: 2.02 lb
