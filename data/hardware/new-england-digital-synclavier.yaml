description: >-
  The Synclavier is a pioneering digital synthesizer and workstation developed by New
  England Digital, first introduced in the late 1970s. Combining FM synthesis, additive
  synthesis, and high-fidelity sampling with a built-in sequencer, it became one of the
  most powerful and expensive music production systems of its era. Used by artists
  including Michael Jackson, Sting, Kraftwerk, and Depeche Mode, the Synclavier set the
  standard for professional digital music workstations.
details: |-
  The original Synclavier appeared in 1977/78, but was quickly superseded by the Synclavier II in 1980. The Synclavier II introduced partial timbre sound editing with harmonic tweaking, built-in FM and additive synthesis, sampling capabilities, 64-voice polyphony, and 32MB of waveform RAM expandable to 768MB, along with 32 outputs and music notation printing.

    A third generation model was introduced in 1984, featuring a weighted 76-note keyboard with velocity and aftertouch, replacing the previous plastic keyboard. This version offered 128-voice polyphony and optional DSP effects including time compression and expansion.

    The typical Synclavier system consists of a durable 76-note keyboard with 132 illuminated buttons and a single control knob, connected to a rack-mounted CPU running NED's proprietary 16-bit ABLE operating system. Storage options included 5.25-inch diskettes, hard disks, or magneto-optical drives.

    The system featured a built-in arpeggiator, a robust sequencer with up to 200 tracks, and a sampler capable of recording and outputting at up to 100 kHz. However, numerous hardware sub-revisions meant capabilities varied significantly between units, making used purchases unpredictable.

    After New England Digital closed in 1992, support continued through third-party providers including DEMAS, Synhouse, and Synclavier European Services. The Synclavier remains one of the most iconic and sought-after digital instruments in synthesizer history.
specs: |-
  - Polyphony: 64 voices (128 stereo FM or sampling on later models)
    - Sampler: 16-bit, variable sampling rate up to 100 kHz
    - Synthesis: FM synthesis, additive synthesis, resynthesis
    - Keyboard: 76 weighted keys with velocity and aftertouch
    - Memory: 32MB RAM expandable to 768MB
    - Storage: External hard disk, 5.25-inch diskettes, magneto-optical drives
    - Sequencer: Up to 200 tracks
    - Recording: 16 tracks at 50 kHz
    - Outputs: Up to 32
    - Control: MIDI (16-part), CV, VITC, SMPTE, Trigger
    - Operating System: NED proprietary 16-bit ABLE OS
    - Original price: $25,000 to $200,000
