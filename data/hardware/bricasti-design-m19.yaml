url: https://bricasti.com/en/consumer/m19.php
description: The Bricasti M19 is an SACD/CD transport designed around simplicity
  and uncompromising performance, intentionally omitting upsampling, DACs, and
  digital inputs. Features dual independent linear power supplies with
  medical-grade toroidal transformers and a milled aluminum chassis. Handcrafted
  in Massachusetts, USA.
specs: |-
  - SACD and CD transport (no upsampling, no DAC, no digital inputs)
  - Digital outputs: XLR AES/EBU, RCA S/PDIF, BNC S/PDIF, I2S via Ethernet connector
  - Dual independent linear power supplies with medical-grade toroidal transformers
  - Milled aluminum chassis
  - Trigger input: TRS 1/4-inch (5V on ring)
  - Handcrafted in Massachusetts, USA
