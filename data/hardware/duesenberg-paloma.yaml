description: The Paloma is for those who seek ultimate flexibility. The three
  pickup layout featuring the GrandVintage Humbucker and two matched Duesenberg
  Singlecoils, Pearlito and AlnicoBlade, offer a wide variety of sounds for any
  situation.
details: |-
  The Paloma is a solid-body electric guitar with a contoured body made from alder, a tone-wood Duesenberg describes as known for its bright voice and versatility. The solid-body construction is intended to deliver instant response, attack and sustain along with feedback resistance. The body measures 46 x 34 cm (18" x 13.4") with sides 4.2 cm (1.7") high, carries cream binding and a black pickguard, and is finished in PUR lacquer with trans-black back and sides.

  The neck is a set-in, one-piece maple neck in a Medium D shape, 42.5 mm (1.67") at the nut and 52 mm (2.05") at the 12th fret, with a steel dual-action trussrod and a black headstock. The Indian rosewood fingerboard has a 305 mm (12") radius, pearloid diamond inlays and 22 jumbo frets (2.8 x 1.0 mm) over a 648 mm (25.5") scale. Duesenberg's Plek process levels the frets as the basis for multi-step fret polishing and setup work carried out by hand, and each instrument is signed inside by the luthier responsible for it.

  Electronics are a three pickup layout: a Duesenberg GrandVintage humbucker at the bridge with a Duesenberg Pearlito singlecoil in the middle and a Duesenberg Alnico Blade singlecoil at the neck. Four pickup combinations are selected through a 4-way rotary switch, with one volume and one tone control.

  Hardware is nickel finished and includes Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge and the Duesenberg Diamond Deluxe Tremola vibrato in its short version. The Diamond Deluxe is described as lightweight, with heavy duty needle and nylon bearings, an arm that turns freely through 360 degrees and can be adjusted for angle and length, and strings guided through holes in the bar beneath the arm axis. The Z-Tuners allow the cut-off string end to be hidden inside the tuner shaft. Strings are Duesenberg Custom 010/050 (010-013-017-028-042-050).

  A Duesenberg Custom Line Bag is included, with high impact internal padding, a black plush lining, external storage pockets, tuck-away shoulder straps, a padded handle and an adjustable neck pillow. A Duesenberg Custom Line Case for Paloma is available separately, and all required allen keys are included.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Pearloid diamonds
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Solidbody, Alder
  - Body dimensions: 46 x 34 cm / 18" x 13.4"
  - Body height (sides): 4.2 cm / 1.7"
  - Binding: Cream
  - Pickguard: Black
  - Finish: PUR lacquer. Back and sides Trans-Black.
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Diamond Deluxe Tremola, short version
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 010/050 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Alnico Blade Singlecoil
  - Pickup (middle): Duesenberg Pearlito Singlecoil
  - Pickup (bridge): Duesenberg GrandVintage Humbucker
  - Wiring: 1 Volume, 1 Tone, 4-Way Rotary Switch
  - Lefthand: Only Red Sparkle and Narvik Blue
  - Bag: Duesenberg Custom Line Bag (included)
  - Case: Duesenberg Custom Line Case for Paloma (available separately)
  - Tools: All required allen keys included
