description: The Klipsch Jubilee is the final project of founder Paul W. Klipsch
  — a 2-way fully horn-loaded floorstanding loudspeaker designed to satisfy the
  most ardent audiophiles. It incorporates a patented horn-loaded vented low
  frequency enclosure, an all-new axiperiodic compression driver, and an
  external active DSP crossover network, hand-assembled in Hope, Arkansas.
details: |-
  The Klipsch Jubilee is the final project that founder Paul W. Klipsch (PWK) worked on. It was his dream to create a fully horn-loaded speaker that would satisfy the most ardent audiophiles. Originally intended to be the successor to the Klipschorn, PWK soon realized it was much more than that. Twenty-first century advancements in engineering and technology have allowed Klipsch to make his dream a reality.

  The Jubilee features an external active DSP crossover network that adjusts the phase and time delay of each acoustic component to eliminate acoustic phase cancellations and maximize output in the crossover region. The DSP network also provides necessary EQ and gain adjustment to blend the two acoustic components seamlessly. The active crossover features adjustable low frequency and high frequency trim levels for room and personal taste customization.

  The patented low frequency enclosure leverages the efficiencies of both horn-loaded and vented systems, making the Jubilee 10 to 20 times more efficient than a conventional loudspeaker. The high frequency section uses an all-new large format compression driver with a 7" axiperiodic Titanium diaphragm, providing very wide bandwidth performance and eliminating the need for a mid-range driver — consistent with Paul Klipsch's original Jubilee design.

  Klipsch uses book-matched wood veneers for the Heritage series, with veneer leaves kept in order as they are sliced from the timber and precisely arranged to provide a mirror image at the splice joint. Every pair is grain-matched using panels from the same timber, with each cabinet carefully matched so the pair is practically indistinguishable. Speakers are inspected and labeled with sequential serial numbers, ensuring each Heritage series pair leaves the factory as a meticulously crafted set.

  The enclosure is made in the USA by craftsmen in Hope, Arkansas, assembled using only the highest-grade adhesives and fasteners. Available in Satin Black Ash and American Walnut finishes with Salt and Pepper Cloth grille.
