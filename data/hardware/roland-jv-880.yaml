description: >-
  The JV-880 is Roland's 1U rack-mount version of the JV-80 keyboard, offering powerful
  multitimbral capabilities with 28-voice polyphony and extensive sound editing features.
  As the immediate forerunner to the popular JV-1080/2080, it delivers the same
  high-quality sample-based sounds the JV line became known for.
details: |-
  The JV-880 packs Roland's acclaimed JV synthesis engine into a compact 1U rackmount module. It features 4 MB of onboard sampled waveforms with 28-voice polyphony and 4 oscillators per voice, providing a rich palette of sounds across 192 patches and 48 performances.

  Sound design is handled through digital TVF filters with cutoff and resonance, TVA amplifier sections, micro-tuning capabilities, and two LFOs routable to pitch, TVA, or TVF parameters. An onboard effects processor offers various types of chorus, reverb, and delay to polish the output.

  The unit supports 8-part multitimbral operation via MIDI, making it well-suited for studio sequencing and live performance racks. Editing is accomplished through a rotary encoder that allows quick parameter selection and value adjustment, with an audition button for previewing sounds. The waveform memory is expandable via SR-JV80 expansion boards and SO-PCM1 wave expansion cards.
specs: |-
  - Polyphony: 28 voices
  - Oscillators: 4 per voice, digital
  - Waveform ROM: 4 MB (expandable via expansion boards)
  - Filter: Digital TVF with cutoff and resonance
  - LFO: 2, routable to pitch, TVA, or TVF
  - Effects: Reverb, chorus, delay
  - Memory: 192 patches (64 user), 48 performances (16 user)
  - Multitimbral: 8 parts
  - Keyboard: None (1U rackmount module)
  - Control: MIDI In/Out/Thru
  - Expansion: SR-JV80 boards, SO-PCM1 cards
releaseDate: "1992"
