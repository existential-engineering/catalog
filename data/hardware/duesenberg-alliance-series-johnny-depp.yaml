description: A chambered solid body with big sound chambers for enhanced tone
  and weight reduction, fitted with a single custom tapped JD-63 P90 pickup in
  the bridge position.
details: |-
  The Alliance Series Johnny Depp is built on a solid American alder body with sound chambers and a flat top, a construction Duesenberg describes as sitting tonally between a solid and a semi-hollow instrument while reducing weight. The body measures 41 x 32.5 cm with sides 4.5 cm high, is bound in cream and finished in PUR lacquer with a black headstock. Its pickguard is an aluminium plate carrying tattoo artwork, the design idea being to tell the artist's story through the tattoos that mark events in his life.

  The set neck is one-piece maple in a medium D shape with an Indian rosewood fingerboard at a 305 mm / 12 inch radius, cream dot inlays, 22 jumbo frets, a steel dual-action trussrod and a 648 mm / 25.5 inch scale. Every Duesenberg is Plek processed for level frets and buzz-free playability, then hand finished and set up by a luthier who signs the instrument internally.

  A single Duesenberg JD-63 tapped single coil sits at the bridge, developed for this model to meet the characteristics of a classic open-sounding P90. A small switch adds 1963 turns of pickup wire to the signal, a reference to the artist's year of birth, giving a warmer and crunchier tone. Controls are one volume and one coil tap switch.

  Hardware is nickel finished. Duesenberg Z-Tuners are designed for smooth, precise tuning and allow the cut-off string end to be hidden inside the tuner shaft. The bridge is the short Diamond Deluxe Tremola, Duesenberg's vibrato running on heavy duty needle and nylon bearings with an arm that rotates freely through 360 degrees and adjusts for angle and length, the strings passing through holes in the bar beneath the arm axis. Strap pins are Duesenberg Standard and Straplock compatible, and the guitar is strung with Duesenberg Custom 10/50.

  The guitar ships with the Duesenberg Custom Line Case as standard, a handcrafted flightcase-quality case, together with all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Solid American Alder with sound chambers
  - Top: flat
  - Dimensions: 41 x 32.5 cm / 16.14" x 12.6"
  - Height (sides): 4.5 cm / 1.8"
  - Binding: Cream
  - Pickguard: Aluminium plate with Johnny Depp tattoo artwork
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Diamond Deluxe Tremola Short
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware colour: Nickel
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup: Duesenberg JD-63 tapped single coil
  - Wiring: 1 Volume, 1 Coil Tap Switch
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
