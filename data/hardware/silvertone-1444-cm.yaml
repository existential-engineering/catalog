details: |-
  The Root Note of it All

  The original Silvertone 1444 bass was the very first 4-string electric bass offered by Sears back in 1959. It featured a "U" style body with a rounded neck cutaway and aluminum cavity cover. This model 1444 held down the bottom end for Silvertone for 7 strong years, ending production in 1966. The new Silvertone 1444 reissue bass is a modified version of the original Silvertone 1444. It has been redesigned for the modern bassist and can easily produce vintage and modern tones. The Reissue 1444 features a 24 fret 30" short scale rock maple neck with rosewood fingerboard and a solid mahogany body. We modified the bass by adding a bridge position lipstick pickup for added versatility, and a fully adjustable bridge. The electronics are two Silvertone lipstick pickups with Volume, Volume, and Tone controls. Unlike the original 1444, the new reissue also features a fully adjustable dual expanding truss rod. Specs:

  Body

