description: A MIDI-to-CV converter in Intellijel 1U format based on Mutable
  Instruments Yarns, retaining all four-voice functionality with 3.5mm MIDI
  input/output jacks and a case power connector.
details: |-
  All of the goodness of Mutable Instruments Yarns, but in an Intellijel 1U format. All four voices of functionality are retained, with 3.5mm jacks for the MIDI input/output. There is also a connector on the back to connect to the Intellijel case jacks. Summary of Yarns capabilities:

  Yarns QUICK START Guide

  To connect to the Intellijel case use the 4x2 pin header with the 10p-10p included cable. Line up the red line on the cable with the 4x2 header (the non-red line side of the cable/connector will have two pins not connected). Then connect the other side to the case (following the red line indication). Please note that Threads does not support USB-MIDI. It only supports MIDI-DIN.
specs: |-
  - Single voice (note, velocity, modulation, aftertouch, gate, trigger, and clock reset output), two voice, and four voice modes.
  - Monophonic and polyphonic configurations
  - SH-101 style sequencer with up to 64 notes.
  - Microtuning
  - Transform the CV outputs into digital oscillators.
