description: Hand-built in the UK in rugged marine-grade birch ply, the CTM-100
  delivers 100 watts of all-valve power via a five-valve preamp and dual KT88s,
  ideal for small to medium gigs. It covers a wide tonal range, from smooth '60s
  warmth to snarling '70s growl and thick modern punch, with Deep, Mid Shift,
  and Bright switches alongside highly interactive passive tone controls. A
  user-adjustable bias via a dual-function VU meter, individually fused valves,
  a tube-driven DI, and a front-mounted valve FX loop combine vintage character
  with modern durability.
details: |-
  All-valve bass amplifier head, hand-built in the UK in marine-grade birch ply. Made to order (approx. 20-day lead time). Five-valve preamp with dual KT88 output valves. Deep, Mid Shift, and Bright switches with passive tone controls. User-adjustable bias via a dual-function VU meter, individually fused valves, tube-driven DI, and a front-mounted valve FX loop.
specs: |-
  - Power output: 100 watts (all valve)
  - Preamp tubes: 2 x ECC832, 2 x ECC82
  - Output tubes: 2 x KT88
  - Power requirement: 115 - 240 volts
  - Minimum impedance: 2 ohm
  - Speaker outputs: 3 x jack (8/4/2 ohm)
  - EQ: passive Bass, Middle, Treble with Shape push buttons
  - Tube-driven transformer-derived DI output
  - Valve-driven FX loop (send and return)
  - Dimensions (H x W x D): 279 x 590 x 254 mm
  - Weight: 18.8 kg
