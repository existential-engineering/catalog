details: |-
  The Antares is one of the latest Kiesel instruments to push the bounds of innovation. The defined upper horns, elongated, sharp horns, and deeply offset body lend the model an extreme appearance, though, as with any Kiesel instrument, it can be customized for a wide range of tastes and aesthetics. Both drastic and fine touches adorn the model with customizable features.

  The Antares is available in two fret counts. A 24-fret count is standard, though a 27-fret count, seen only on this guitar among the Kiesel lineup, is also available. Four different bridge types are available on the model to appeal to a wide range of players. These include the EverTune, original Floyd Rose, Kiesel-Hipshot Trem, and the Hipshot Fixed bridge.

  To offset any possible neck dive, an optional ~1 lb, removable counterweight is inserted into the electronics cavity, thereby eliminating the need for an extra cover on the rear of the body. The flush-mount jack complements the sleek aesthetics while enhancing the jack's stability and reliability, and the feature is counter-sunk to accommodate the body shape.

  Though the 6-string scale length is standard in 25.5", it can be extended to 26.5". The 7-string is similar, with a standard length of 25.5" and an option of 27". Similar to Kyber and Aero, the top strap button is positioned on the rear of the body for a sleek appearance and optimal balance while standing, however the bottom remains in a traditional position.
specs: |-
  - Construction: bolt-on with radiused neck heel
  - Fret count options: 24 frets standard, 27 frets available, which is unique to this model in the Kiesel lineup
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Scale length: 25.5" standard on the 6-string with a 26.5" extended option, 25.5" standard on the 7-string with a 27" option, plus multiscale options of 25.5" to 26.5", 25.5" to 27" and 26" to 27.5"
  - Fingerboard: ebony with 14" or 20" radius
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability
  - Neck width options from 1.69" to 2.42" wide at the nut
  - Body: alder
  - Bridge pickup: direct-mount passive Kiesel Thorium humbucker
  - Neck pickup: direct-mount passive Kiesel Empyrean humbucker
  - Electronics: master volume control with push-pull coil splitting, 5-way blade pickup selector
  - Output jack: recessed, counter-sunk flush mount output jack
  - Bridge options: four types, the EverTune, original Floyd Rose, Kiesel-Hipshot Trem and Hipshot Fixed bridge, with the spec table listing the Hipshot fixed bridge and Hipshot Solo Saddle bridge at .4125" (10.5mm) spacing
  - Optional removable counterweight of about 1 lb, inserted into the electronics cavity to offset neck dive
  - Rear-mounted top strap button, with the bottom strap button in a traditional position
  - Tuners: premium Kiesel locking tuners, 19:1 ratio with black synthetic buttons
  - Headstock: Kyber headstock
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Strings: Elixir Nanoweb 1046E
  - Body dimensions: 38.5" to 40" long, 1.475" to 1.75" thick, 13.5" to 13.6" wide depending on configuration
  - Weight: 6.4 to 6.8 lbs
  - Offered in 6-string and 7-string counts and in standard or multiscale layouts, configured to order
  - Built to order with a choice of body, top, fingerboard and finish options
