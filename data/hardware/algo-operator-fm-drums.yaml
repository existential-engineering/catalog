  friend..."
details: >-
  Algo/operator is a sample pack featuring 250 percussive one shot samples
  created with fm synths, designed for drum synthesis. The kit focuses on
  abstract micro sounds, pure tones, sharp transients, and percussion simulacra
  with a twist, rather than typical analogue-like drum samples.


  This kit was created using mainly a yamaha tx81-z rackmount synth from 1987,
  supplemented with modern gear including an alesis bitrman and waldorf blofeld,
  with 12bit converters and a gritty sound character. Some well-known fm sounds
  from the 80s are included.


  Samples are categorized by type (kicks, snares, hats, cymbals, percs & fx) for
  convenience. The pro kit includes 250 samples in 48khz-24-bit stereo wav
  files, while the free kit includes 55 samples in 44.1khz-16-bit mono wav
  files. A pro kit + kontakt version is also available with nki kit format.
