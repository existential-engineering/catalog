description: The dbx CT-3 is an advanced two-piece cable tester supporting up to
  8-pin cables across a wide variety of connector formats including RJ45, RJ11,
  XLR, TRS, DMX, MIDI, BNC, and more. Its split Sender/Receiver chassis enables
  testing of pre-installed and long cables in the field.
details: |-
  The dbx CT-3 is an advanced cable testing unit designed to evaluate a large variety of cables with ease. Its two-piece chassis — Sender and Receiver units — enables testing of cables that are already installed or that are too long to loop back to a single tester, making it ideal for installed sound, staging, and touring environments.

  The CT-3 supports testing for RJ45, RJ11, MIDI (5-pin DIN), Speaker Twist, XLR, RCA Phono, BNC, DMX (5-pin), 1/4" TRS/TS, 1/8" TRS/TS, and Banana connectors — covering virtually every connector type used in professional audio and AV. A built-in test tone generator and LED/beeper continuity tester allow thorough evaluation of cable integrity.

  Superior rugged construction ensures durability in demanding professional environments. Both units are powered by 9V batteries (not included), providing completely portable, mains-free operation.
specs: |-
  - Power: 2× 9V batteries (not included)
  - Dimensions: 3.5" W × 5.5" L × 1.5" H (8.9 × 14 × 3.7 cm)
  - Chassis: 2-piece: Sender and Receiver
  - Max Cable Test: Up to 8-pin cables
  - Supported Connectors: RJ45, RJ11, MIDI 5-pin, Speaker Twist, XLR, RCA Phono, BNC, DMX 5-pin, 1/4" TRS/TS, 1/8" TRS/TS, Banana
