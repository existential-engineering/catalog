description: The Buxom Boost is a clean boost pedal voiced after the Friedman
  Buxom Betty amp head. An active three band EQ, a Tight control and an EQ
  Bypass switch let it shape a solo tone or stay completely transparent.
details: |-
  The Friedman Buxom Boost may be the most powerful tonal solution to put on a pedalboard. Like its namesake amp head, this pedal pushes a pure, clean signal to conjure the absolute most from a tone. Turning the boost control is a ticket to volume increase, pushing the front of an amp for thick harmonic overdrive, or balancing between two guitars with varying output.

  Whether the goal is a tone tailored by the active mid, treble and bass controls or total transparency, thanks to the onboard EQ Bypass switch, it is all in there. A useful tight control reins in a tube amp's bottom end when boosted. Every Buxom Boost pedal is crafted with the attention to detail and fine ear for tone that comes with Dave Friedman's name.

  Just like the Friedman Buxom Betty amp head, the Buxom Boost sings with a completely clean tone that makes every nuance of a performance shine through. Flipping the onboard EQ Bypass switch gives a completely transparent signal, adding muscle to the guitar without ever changing its fundamental character.

  Though the Buxom Boost can be tonally invisible, its active three band EQ and powerful Tight control enable it to be anything but. With a stomp of a switch it balances the voice and output of two different guitars, or pushes certain frequencies for a solo tone that cuts. Its high-quality components also work well for fine tuning the plugged-in voice of an acoustic-electric guitar.
specs: |-
  - Clean boost with plenty of headroom for getting above a mix or driving the front end of an amp
  - Active three band EQ with boost bass and mid controls and a boost and cut treble control
  - EQ Bypass switch removes the three band EQ from the signal for a truly transparent tone
  - Tight control tames a boosted amp's low end
  - High-quality circuit quiet enough for use with acoustic-electric instruments
  - Accepts 9 V or 18 V power for higher-headroom performance
  - Built in the USA
  - Weight 1 lb
