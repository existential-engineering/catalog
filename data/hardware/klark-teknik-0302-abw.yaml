name: QFLEX ISOLATOR
manufacturer: klark-teknik
primaryCategory: routing
categories:
  - utility
url: https://www.klarkteknik.com/en/products/0302-ABW
description: The QFLEX ISOLATOR is designed to resolve issues that arise when
  large VNET systems are put into operation. It is advised where mains earth
  potentials exceeding plus or minus 15 V may exist between network nodes, where
  electrical noise, interference or wiring faults may be present on the network
  cables, where the installer wants a large star topology, or where the network
  uses screw terminal terminations.
specs: |-
  - Isolates network nodes where mains earth potentials exceed plus or minus 15 V
  - Addresses electrical noise, interference and wiring faults on network cables
  - Allows networks with a large star topology
  - Suited to networks using screw terminal terminations
