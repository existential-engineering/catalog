description: UK-built, Ice Blue 100-watt 1x10" bass combo designed for
  exceptional portability and modern clarity. Featuring a premium Sica NEO 10"
  speaker, smooth Overdrive, FX Loop, Balanced DI, and Headphone Out, it is
  wrapped in Charcoal Tweed with a Silver Weave grill. The perfect compact amp
  for practice, rehearsal, and small acoustic sessions.
details: |-
  The Ashdown UK-SBM-110-100 is a compact bass combo created for players who want excellent tone in the smallest, most manageable format possible. Hand-built in the UK and finished in Ice Blue, it delivers 100 watts through a high-quality Sica NEO 10" speaker, providing clear, punchy response for practice, rehearsals, small acoustic gigs, and home recording. A carefully tuned 1x10" cabinet delivers tight low-end control and articulate midrange detail. Inspired by Ashdown's Studio range, it features a smooth, versatile Overdrive circuit that introduces warmth or textured grit as required, alongside an FX Loop, a balanced DI output, and a headphone output for silent practice.
specs: |-
  - Power output: 100 Watts
  - Speaker: 1 x Sica NEO 10"
  - Balanced DI output
  - FX Loop
  - Headphone output
  - Overdrive circuit
  - Finished in Charcoal Tweed with Silver Weave grille
  - Weight: 19.04 kg
