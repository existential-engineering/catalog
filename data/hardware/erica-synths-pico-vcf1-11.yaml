description: Polivoks based VCF.
details: |-
  Erica Synths Pico VCF1 is a younger brother to the Erica Black Polivoks VCF, designed on a similar topology using rare Russian opamps. The module gives a filter for acid basslines, screaming resonance sweeps and deep wobbles.

  Lowpass and bandpass modes are both available, and the filter self oscillates when the resonance is pushed, so it can be played as a sound source in its own right rather than only as a processor.

  The Pico Series set Erica Synths the challenge of fitting superior functionality into a 3HP panel at an affordable price, and the VCF1 is one of the answers. The inputs are protected against overvoltage, and the module is 3HP wide and 35mm deep.
specs: |-
  - Lowpass and bandpass modes
  - Self oscillation
  - Rare Russian opamps used
  - Input protection against overvoltage
  - Power consumption +12mA, -11mA
  - Module width 3HP
  - Module depth 35mm
