description: The OM-42 delivers balanced tone, elegant pearl appointments, and
  long-scale projection, combining premium tonewoods with Golden Era bracing in
  Martin's Standard Series Orchestra Model.
details: |-
  The Martin OM-42 is part of the refreshed Standard Series, pairing a solid Sitka spruce top with solid East Indian rosewood back and sides for a balanced, articulate voice with rich harmonic complexity. The Orchestra Model (000-14 Fret) body shape provides a comfortable playing experience, while the 25.4" long scale length lends increased projection and clarity.

  Golden Era styling runs throughout, with GE-scalloped 1/4" spruce X-bracing for an open, responsive top, abalone Style 45 snowflake fingerboard inlays, and an abalone rosette accented with multi-stripe purfling. Antique white binding with multi-stripe accents frames the body, and a faux tortoise pickguard completes the classic appointments.

  The genuine mahogany neck features a GE Modified Low Oval profile with a High-Performance Taper, joined to the body via a traditional dovetail joint. An ebony fingerboard and ebony bridge with bone saddle and bridge pins round out the premium tonewood package. Gold open-gear tuning machines with butterbean knobs add a refined vintage touch.

  This 2025 update introduces refreshed GE top bracing, a reimagined neck profile, and a thinner fingerboard for improved playability while preserving the classic Style 42 aesthetic. The OM-42 ships strung with Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light strings and includes a hardshell case with plush laminated wood shell.
specs: |-
  - Body Size: 000-14 Fret (Auditorium)
  - Top: Solid Sitka Spruce with Aging Toner, Gloss
  - Back & Sides: Solid East Indian Rosewood, Gloss
  - Neck: Genuine Mahogany, GE Modified Low Oval with High-Performance Taper
  - Fingerboard: Ebony
  - Bridge: Ebony with bone saddle and bridge pins
  - Scale Length: 25.4"
  - Bracing: GE-Scalloped X-Brace, spruce, 1/4"
  - Neck Joint: Dovetail
  - Frets: 20 total, 14 clear of body
  - Nut Width: 1 3/4"
  - String Spacing at Bridge: 2 1/8" at 12th fret
  - Nut: Bone
  - Inlays: Abalone Style 45 Snowflake
  - Rosette: Abalone with Multi-Stripe
  - Binding: Antique White with Multi-Stripe Accents
  - Tuners: Gold Open Gear with Butterbean Knobs
  - Pickguard: Faux Tortoise
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light
  - Case: Hardshell with plush laminated wood shell
  - Warranty: Limited Lifetime
