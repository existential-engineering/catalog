details: |-
  The Grado Signature S550 brings the core values of the Signature Line into a more streamlined and approachable form. Designed for listeners who value musical engagement as much as technical performance, the S550 delivers clarity, balance, and energy in a headphone built for long, immersive listening sessions.

  At its heart, the S550 is tuned to preserve the immediacy and openness Grado is known for, while offering a refined presentation that remains natural and fatigue-free. From subtle acoustic details to dynamic passages, the S550 is engineered to connect you more directly to the music — not just the sound.

  Hand-assembled in Brooklyn, the S550 uses a 50mm dynamic driver in an open-air design with a detachable Signature Silver cable terminated at the headphone in a 4-pin balanced mini XLR. Source-side termination options include 3.5mm (with 6.3mm adapter), 4.4mm balanced, and 4-pin balanced XLR, with multiple cable lengths available.

  The S550 ships with the standard B cushion and is compatible with Grado's S, F, L, and G cushion alternatives for personalized fit and tonal character.
