name: TYPE 05 A-CORE EDITION X
manufacturer: hedd
primaryCategory: studio-monitor
url: https://hedd.audio/products/type-05-edition-x
description: A limited edition of 100 pairs celebrating 10 years of HEDD Audio
  and Klaus Heinz's 40-year legacy, the TYPE 05 A-CORE EDITION X combines pure
  analog precision with 18-karat gold-plated components and hand-built
  craftsmanship.
details: |-
  Developed to celebrate HEDD Audio's 10th anniversary and Klaus Heinz's 40 years of loudspeaker innovation, the TYPE 05 A-CORE EDITION X is restricted to just 100 pairs worldwide. It combines pure analog signal architecture with bespoke materials and craftsmanship, hand-built in Berlin and finished with Italian-made 18-karat gold-plated components including the backplate, screws, and tweeter grille.

  The speaker's sonic foundation is a custom Air Motion Transformer tweeter paired with a 5-inch honeycomb woofer, delivering high-definition clarity across the frequency spectrum. Its refined analog circuitry features a custom ENIG-finished PCB designed to maximize signal purity and ensure stable, low-latency performance without digital conversion.

  Practical features retain the A-CORE philosophy of elegant simplicity: continuously variable high and low shelving EQ (±6 dB) for room tuning, flexible connectivity, and a physical front-panel standby switch. The monitor is mounting-ready for Atmos installations.

  Handcrafted in Germany, each EDITION X arrives with a five-year warranty, a 30-day satisfaction guarantee, free shipping, and a unique engraved serial number marking ownership of this finite production run.
specs: |-
  - Configuration: 2-way active nearfield monitor, pure analog signal path
  - Woofer: 5" custom honeycomb compound
  - Tweeter: HEDD Air Motion Transformer (hand-built in Berlin)
  - Crossover frequency: 2,500 Hz
  - Frequency response: 43 Hz - 50 kHz
  - Maximum SPL: 112 dB per pair at 1 m
  - Amplification: 2 x 100 W ICEpower Class D
  - Shelving EQ: hi/low, ±6 dB continuous
  - Special: 18-karat gold-plated backplate, screws and tweeter grille; ENIG-finished PCB; limited to 100 pairs
  - Cabinet: heavy-duty MDF, black satin finish
  - Dimensions: 308 x 180 x 245 mm
  - Weight: 6.2 kg (net) per unit
