description: DJ2 is a compact MIDI controller optimized for Native Instruments
  Traktor DJ Studio, laid out like a DJ mixer with a crossfader, 2 line faders,
  6 EQ pots and cue/monitor control. A joystick handles FX control and 2
  multifunctional encoders cover track select/load, seek/scratch, gain and
  pitch.
details: |-
  DJ2 is a special DJ controller from the Faderfox micromodul line, optimized for Native Instruments Traktor DJ Studio. Setup files for Traktor DJ Studio as of version 2.1 and for Ableton Live as of version 4.1 are shipped with the controller. Because it communicates over a MIDI interface, it is independent of operating system and computer type (PC or Mac) and needs no driver.

  The control surface follows a DJ-mixer layout: a crossfader, 2 line faders, 6 EQ pots and cue/monitor control. A joystick provides FX control across 2 groups (FX1/FX2), with additional FX control available through switchable double functions on the EQ pots. Two multifunctional encoders select and load tracks and cover seek/scratch, gain and pitch functions, and 20 freely reassignable double-function buttons handle transport, pitch bend, FX and kill duties for each deck. Holding the instrument's SHIFT button activates fadermute for all controls.

  Power is independent: 3 x AA standard or rechargeable cells give a lifetime of about 80 hours, an LED battery indicator reports state, and a socket accepts an external power adaptor (4.5-6V DC, min. 50 mA). A MIDI-merge function and MIDI chaining let the unit be expanded by other micromodul controllers.

  The casing is a very compact black plastic desktop format measuring 180 x 105 x 70 mm and weighing 450 g, fitted with a silver aluminium front plate with an abrasion-resistant anodised coating and inscriptions. Eleven LEDs in different colors display various information, with a low basic light level on all LEDs for better orientation in a dark club atmosphere. Faders, pots and encoders are high-quality ALPS parts.

  The DJ2 is compatible with the 1st micromodul line, using the same CC and note numbers as the DJ1. The product page marks it as discontinued / sold out.
specs: |-
  - Special DJ controller optimized for Native Instruments Traktor DJ Studio
  - Setup files for Traktor DJ Studio as of version 2.1 and Ableton Live as of version 4.1 shipped with the controller
  - Independent of operating system and computer type (PC or Mac) due to the MIDI interface, no driver necessary
  - DJ-mixer layout: crossfader, 2 line faders, 6 EQ pots and cue/monitor control
  - Joystick for FX control across 2 groups (FX1/FX2)
  - Additional FX control by switchable double functions on the EQ pots
  - 2 multifunctional encoders for select/load track, seek/scratch, gain and pitch
  - 20 freely reassignable double-function buttons (transport, pitch bend, FX and kill buttons for each deck)
  - Fadermute for all controls by holding down the SHIFT button
  - Independent power supply by 3 x AA standard or rechargeable cells, lifetime about 80 hours
  - LED battery control
  - Socket for an external power adaptor (4.5-6V DC, min. 50 mA)
  - MIDI-merge function
  - Compact black plastic desktop casing, 180 x 105 x 70 mm, 450 g
  - Silver aluminium front plate with anodised, abrasion-resistant coating and inscriptions
  - 11 LEDs in different colors, with low basic lighting of all LEDs for orientation in dark club conditions
  - High-quality faders, pots and encoders from ALPS
  - Expandable system by other micromodul controllers, chained by MIDI connections
  - Compatible with the 1st micromodul line (same CC/note numbers as DJ1)
  - System requirements: PC or Mac with a free USB port (1.0 or higher) or any USB hub
  - System requirements: Native Instruments Traktor DJ Studio (as of version 2.1), Ableton Live (as of version 4.1) or software allowing user assignment of continuous controllers (CC) and note commands
