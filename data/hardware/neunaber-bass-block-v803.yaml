description: The Bass Block V803 is an 800-watt Class-D bass amplifier head
  offering three selectable amp voicings (Modern, Warm, Q-Tube), a 3-band EQ
  with sweepable mid, dual inputs, an effects loop, and an XLR line out.
details: |-
  The Quilter Labs Bass Block V803 is a powerful and versatile bass amplifier that combines modern Class-D amplification with the warmth of vintage tube sounds. A robust 800W output ensures exceptional performance across various speaker setups, supported by a quiet, variable-speed fan for reliable, heavy-duty use. Key Features:

  · Power and Performance: Delivers over 800W to handle any speaker with ease. A high-current Class-D power section that combines old-school dynamic warmth with the efficiency of modern technology. · Three Unique Amp Modes : The Voice switch provides three distinct amplifier profiles - MODERN (same system as prior 800 and 802 models, with tight solid-state output and "bottomless" limiter), WARM (tube-type output impedance with the same bottomless limiter) and Q-TUBE (tube-type output impedance with classic tube clipping) - each delivering a unique dynamic response ranging from tight, controlled solid-state performance to lush, vintage tube warmth and overdrive. · Tone Shaping: A 3-band EQ with four controls (Bass, Midrange with sweepable frequency, and Treble) offers precise tonal adjustments. · Connectivity and Controls: Includes two high impedance inputs (Flat and Scoop), FX Loop, headphone output with cab-sim, and an XLR Line Out with integral cab-sim and grounding switch. The GAIN control adjusts drive and sensitivity, while the MASTER control matches the output power to various speaker ratings. · Additional Features: The rear panel offers dual Speakon Combo connectors for speaker compatibility, a locking AC cord for reliable power connection, and universal AC power support for use worldwide. The XLR Line Out pre-MASTER for consistent signal level regardless of where you set stage power. · User Convenience: Features a MUTE-ACTIVE-PASSIVE switch with a bright LED indicator, and an FX Return that can be used as a stealth input for backing tracks. The headphone output automatically switches from FRFR on MODERN to cab-sim on WARM and Q-TUBE settings. The Bass Block V803 is designed to meet the demands of professional musicians, providing robust performance and flexibility. Whether seeking the precision of modern amplification or the nostalgic tone of vintage tube amps, this amplifier provides high-quality sound and reliable operation in a compact, modern package. Fits in our Block Case 2.0 ! -
