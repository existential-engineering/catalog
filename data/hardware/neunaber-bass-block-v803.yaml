specs: |-
  - Features - TWO INPUT JACKS: 2meg, Flat and Scoop, 4V peak
  - INPUT SWITCH: Mute, Active, Passive
  - GAIN
  - AMP VOICE SWITCH: Modern, Warm & Q-Tube profiles
  - 4-KNOB EQ: Bass +/- 15dB at 100Hz, Mid +/- 15dB with 250-1K Freq Sweep. Treble +/-15dB at 1kHz.
  - EFFECTS LOOP: Buffered, 1K Send, 47K Return, 1V peak signal level
  - XLR LINE OUT: 1.4V (+4dBu), 600 ohms balanced
  - XLR GROUND LIFT: Ground, Lift Auto
  - OUTPUT POWER: Up to 450W at 8 ohms, 800 watts at 4 ohms, 25Hz-15kHz
  - Controls - Primary Controls - 3 VOICE SWITCH
  - INPUT SWITCH
  - 3-BAND ACTIVE EQ Boosts and cuts Bass, Mids, and Treble frequencies.
  - Volume Controls - MASTER adjusts speaker power volume level. (0-800 watts)
  - GAIN regulates the overall input volume to the preamp.
