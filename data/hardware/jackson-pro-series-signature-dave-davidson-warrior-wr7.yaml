description: The Pro Series Signature Dave Davidson Warrior WR7 is a 7-string
  signature guitar for Revocation guitarist Dave Davidson, built around
  Jackson's angular Warrior body shape with mahogany and ash top, neck-through
  maple construction, ebony fingerboard, DiMarzio Dave Davidson Signature
  Imperium 7 humbuckers with coil split, and a recessed Floyd Rose 1000 Series
  tremolo.
specs: |-
  - Body: Mahogany with ash top, Warrior shape, satin finish, black binding
  - Neck: One-piece through-body maple with graphite reinforcement, scarf joint
  - Scale Length: 25.5"
  - Nut Width: 1.875"
  - Fingerboard: Ebony, 12"-16" compound radius
  - Frets: 24 jumbo
  - Strings: 7-string
  - Inlays: Pearloid piranha tooth
  - Nut: Floyd Rose locking
  - Bridge: Floyd Rose 1000 Series double-locking tremolo (recessed)
  - Tuners: Jackson sealed die-cast
  - Pickups: DiMarzio Dave Davidson Signature Imperium 7 (bridge + neck), HH
  - Controls: Volume (push/pull coil split), tone, 3-way toggle switch
  - Hardware Finish: Black
  - Strap Buttons: Dunlop dual-locking
  - Headstock: Jackson pointed 7-in-line with black binding
