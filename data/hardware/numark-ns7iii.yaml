description: A premier four-deck controller for Serato DJ featuring motorized
  turntables and three color displays.
details: |-
  The Numark NS7III is a premier four-deck controller for Serato DJ. It features dual 7-inch motorized direct-drive platters with high-resolution MIDI (3600 ticks per revolution) and three 4.3-inch full-color LCD screens with stackable waveform display capability.

  The controller includes 29 capacitive touch-sensitive knobs for filters, gain, EQ, and effects, plus 16 velocity-sensitive Akai Professional MPC pads with RGB illumination. A built-in 4-channel audio mixer allows standalone operation without a computer.

  Additional features include 3-way touch-activated filter knobs per channel, Slip Mode, Master FX and BPM metering, a user-replaceable CP-Pro crossfader, and a high/low torque switch for platter resistance adjustment. The unit ships with 2 vinyl records, felt slipmats, and accessories.
