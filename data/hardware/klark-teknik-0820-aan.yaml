details: |-
  The DN780 is the Klark Teknik digital reverb introduced in 1986 and one of the most influential British digital reverbs of its decade. Its dense, characterful tail and unusual programme architecture, the Infinite Room program among it, earned it a lasting place on records of the era and a continuing place in mixing rooms looking for that particular character.

  The unit uses 16-bit quantisation, with a frequency response of 20 Hz to 12 kHz, a dynamic range of 85 dB and THD below 0.03%. It is mono in and stereo out, a topology typical of mid-1980s digital reverbs, driving the wet signal as a stereo image from a single source. The electronics are distributed across six printed circuit boards in a semi-modular configuration, which removes unreliable edge connectors while keeping servicing tractable.

  Fifty rewritable memory locations store user programs, and a sequence function recalls up to 16 factory or user memories in a user-defined order, intended for programme changes between songs in live use. The programme library spans straight delay, varied echo effects, chorused and modulated reverbs, sound-reverse and the sustained tail of the Infinite Room. An optional remote control unit selects the chosen setting through the sequence key and then modifies it with parameter sliders.

  Typical applications are studio reverb on vocals, drums and programme material where the DN780 character is the effect being sought, live front-of-house in tour racks where sequence recall supports rapid programme changes, and broadcast effects work for documentary and feature production wanting a 1980s digital reverb signature.
specs: |-
  - 16-bit digital reverberator and processor, introduced 1986
  - Frequency response: 20 Hz to 12 kHz
  - Dynamic range: 85 dB
  - THD: below 0.03%
  - Mono in, stereo out
  - 50 rewritable memory locations with 16-step sequence recall
  - Programme library including Infinite Room, reverse and echo effects
  - Semi-modular six-board construction
  - Optional sliding remote control unit
  - 2U rackmount
