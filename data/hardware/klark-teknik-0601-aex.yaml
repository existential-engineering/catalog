id: 3VPl_KqCaxyYwhPVE-YDA
name: DN1248PLS-DP
manufacturer: klark-teknik
primaryCategory: routing
categories:
  - preamp
  - rack-mount
  - outboard
url: https://www.klarkteknik.com/en/products/0601-AEX
description: The DN1248PLS-DP is a 12-channel microphone signal splitter for
  high level concert touring and outside broadcast, providing a four-way output
  split from each of its 12 input channels. Each channel carries a Midas
  Heritage microphone preamplifier with +48 V phantom power and independent gain
  switching, with two electronically balanced outputs for front of house and
  monitor consoles and two transformer-balanced outputs for recording and
  outside broadcast equipment, and dual redundant power supplies are fitted as
  standard.
details: |-
  The Midas microphone preamplifier is considered by live sound and recording engineers to be the essence of the Midas sound, combining decades of design experience with premium-grade components for warmth and depth, bringing out subtle ambience and maintaining spatial positioning. The DN1248PLS-DP uses Midas HERITAGE microphone preamplifiers at the first point where the signal enters the chain. Transparent sound, low noise and high common-mode rejection are hallmarks of the design, and the overload-tolerant topology takes on a different character when driven hard, giving a combination of harmonics described as warm and organic.

  A console-style solo bus allows monitoring of the incoming signals at source using the integrated headphone monitoring amplifier. The solo bus also features both input and output connectors, allowing the bus to be cascaded between multiple units so that all channels can be monitored from a single unit's headphone amplifier. Each channel has an illuminated solo switch with two modes of operation, additive or exclusive, and a 6-segment LED bar graph meter indicates the channel or channels being monitored. A level control is provided for the headphone amplifier.

  In addition to the dual-mode solo switch, each input channel features illuminated switches for +48 V phantom power and earth lift for status display at a glance, even at wide distances and viewing angles. Independent +30 dB and -15 dB gain switches are provided for each channel and may be used in combination for +15 dB gain. Each channel also has individual LED metering for signal present and clipping indication.

  The unit is configured for the requirements of both PA rental companies and outside broadcasters, with front and rear panel connections designed for each. The rear panel connections meet the cable looming requirements of rental companies and feature a duplicate set of the input connections plus two electronically-balanced splitter outputs for front of house and monitor consoles; these outputs are servo-balanced with high-drive capability to cope with long cable runs. One set of electronically-balanced outputs is also duplicated on the front panel, and two sets of transformer-balanced outputs are provided on the front panel to suit outside broadcasters, especially when connecting to units whose rear panel connections are already in use. All internal rear panel loom connections are made to spring-loaded terminal connectors so that soldering is not required.

  A rugged steel 3U rackmount enclosure and industry-standard connectors are used for the rigours of live concert touring. The dual-redundant power supplies are auto-voltage sensing for worldwide use and provide seamless switchover in the event of a loss of one supply.
specs: |-
  - 12 input channels, four-way output split per channel
  - Two electronically balanced outputs and two transformer-balanced outputs per channel
  - Midas HERITAGE microphone preamplifier per channel
  - Independent +30 dB and -15 dB gain switches, combinable for +15 dB gain
  - Switchable +48 V phantom power per channel
  - Earth lift per channel
  - Illuminated solo switch per channel with additive or exclusive modes
  - Solo bus with input and output connectors for cascading between units
  - Integrated headphone amplifier with rotary level control
  - 6-segment LED bargraph for the soloed signal
  - Individual LED metering per channel for signal present and clipping
  - Audio connections on 3-pin XLR style connectors
  - Inputs on two parallel-connected female XLRs per channel, one front and one rear
  - Transformer outputs on front panel male XLRs
  - Electronic outputs: one output on front and rear male XLRs, one output on a rear male XLR only
  - Rear panel connectors mounted on three removable plates
  - All inputs and outputs available internally on PCB-mounted terminal strips for alternative rear panel connector configurations
  - Two auto-ranging universal switch-mode power supplies with dual redundancy
  - Power requirements 100 to 240 V AC, 50 to 60 Hz
  - 3 U 19-inch rackmount chassis
  - 483 mm wide x 319 mm deep x 132 mm high (19.0 x 12.6 x 5.2 inches)
  - Nominal weight 7.4 kg (16.3 lbs)
