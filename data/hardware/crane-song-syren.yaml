name: Syren
manufacturer: crane-song
primaryCategory: preamp
url: http://cranesong.com/SYREN.html
description: Syren is a classic-sounding tube preamp in a 500 series package,
  built around a dual triode circuit with a 12AX7 tube. It offers a dual gain
  stage with overdrive capability and a switchable negative-feedback path that
  shifts the tone between an accurate, wide-frequency-response sound and a more
  open, warmer character.
details: |-
  Syren is a classic sounding tube preamp in a 500 series package, using a dual triode circuit with a 12AX7 tube.

  Syren features a dual gain stage circuit and allows overdrive effects. A switch selectable HI-Z input is included. The low cut filter is at 90 Hz and is 24 dB/octave. The pad has -15 dB and -25 dB settings to allow a wide input range of signals.

  The audio path color is changed by modifying the second stage tube circuit so it has negative feedback or does not have negative feedback. This changes the interaction between the tube stages and thus the sound of the pre-amp. With negative feedback it is a more accurate audio path with wider frequency response, and without negative feedback it has a more open, warmer sound.
specs: |-
  - Dual triode circuit with 12AX7 tube
  - Dual gain stage circuit with overdrive capability
  - Switch-selectable HI-Z input
  - Low cut filter at 90 Hz, 24 dB/octave
  - Pad with -15 dB and -25 dB settings
  - Switchable negative feedback for audio path tone shaping
