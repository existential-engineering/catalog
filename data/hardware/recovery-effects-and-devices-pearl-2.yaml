details: |-
  PEARL

  (Heavy Low-End Vintage Fuzz)

  The Pearl sinks its teeth into the low end and doesn't let go. Its modified vintage circuit delivers a heavy bass fuzz tone with versatile controls to work with your music. This pedal was created for bass, but you can also plug your guitar into it to make your low-end dreams come true! At the heart of the pedal is an all-analog silicon design that sounds great with any pickup type. We use hand-picked, new-old-stock "oil can" BC109 transistors that add a classic, vintage tone to this modern fuzz. The user interface includes a range of controls including intensity, tonality, compression, output level, and a high/low switch that affects the amount of bottom end. The Pearl is a compact, simple-to-use, player-friendly pedal with a monster, low-end tone. In short, it is a force to be reckoned with. Designed and assembled in Seattle, Washington. O perates on a standard 9Vdc Boss-style power supply (not included), but can also run at 18vdc for additional headroom. . Enclosure size: 4.77" x 2.6" x 1.39"

  . Pearl pedal manual

  Named after our badass cat, Pearl, who lives life to the fullest, despite having a neurological condition called Cerebellar Hypoplasia along with Epilepsy. . Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
