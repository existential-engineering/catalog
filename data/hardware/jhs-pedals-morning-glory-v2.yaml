details: |-
  The Morning Glory V2 introduced the smaller current enclosure format in gold powder coat, replacing the larger white V1 enclosure. Like the V1, the V2 has no bright-cut switch (that was added in V3). The Morning Glory is JHS Pedals' most celebrated overdrive — transparent, touch-responsive, and capable of adding tube-like character to any amp.
