details: |-
  The Little Milkman that Delivers

  ABOUT

  I design amps based on my own experience and needs, and when it came time to design the Creamer, I wanted to find a balance between a perfectly voiced guitar tone with a fair amount of power and portability. Everyone loves low power vintage amplifiers, but sometimes I need a bit more power, reliability, and headroom on the gig. In studio, the Creamer is virtually silent when idle. Its the ultimate refinement and alternative to the vintage small format amplifier. I wanted the Creamer to be very versatile so I included a cathode bias circuit so that the user can easily substitute 6L6 or 6V6 output tubes with no need to rebias the output tubes. I have added a rear mounted switch to maintain an 8ohm speaker output regardless of which tube type used. With 6V6 the Creamer puts out about 20 watts into 8ohms and has sweet breakup. Put a pair of 6L6s in, flip the switch on the rear panel and you get a bit of more low end, subtler mids, and a touch more headroom. The tremolo circuit in the Creamer is unique and sounds outstanding. It is harmonically rich, deep, and has a very useful range of speed. Three speaker options help tailor the Creamer to your unique style:

  Jupiter Large Ceramic 12" is a transparent sounding speaker. Bright, Lively, and very efficient. Its got a great bottom end even at low volume. This speaker will not break up no matter how hard you push the amp. Jupiter Alnico 12" has a classic American alnico magnet sound. A bit less transparent in the upper midrange, this speaker adds a "woody" tone to the Creamer. Its still lively on top, and a bit more focused in the bass response than its ceramic magnet brother. The speaker starts to break up and add alnico character as the amp is pushed. Fane A60 12" takes the Creamer into a totally new direction. This speaker is very mid forward with little midrange scoop. The top is smooth and bright, and the bass response is the tightest out of the three options. This speaker starts to compress when the amp is driven hard, adding a unique midrange boost as you push it giving off "polished studio tone" vibes

  Like all Milkman amplifiers, the Creamer is built using the finest possible components such as bespoke Soursound transformers and Jupiter capacitors. It is hand wired onto a turret board with cloth covered wire. WATTAGE

  18-22W Class AB

  SPEAKER

  12" Large Ceramic Jupiter Speaker, 8 ohm

  12" Alnico Jupiter Speaker, 8 ohm

  12" Fane A60, 8ohm

  EFFECTS

  Tube tremolo and spring reverb
  Includes handwired original design detachable footswitch and 15' cable

  DIMENSIONS & WEIGHT

  19-7/8" W x 16" H x 9-1/2" D 32lbs

  Demo

  20w Creamer Demo by Josh Smith

  Josh Smith takes the Creamer for a long drive. Ceramic speaker installed. SOUNDS

  Listen

  Reviews

  John Mayer

  Los Angeles, CA

  www.johnmayer.com

  I just plugged in the Creamer amp, and I have to tell you I absolutely love it. The Creamer is EQ'd perfectly

  Scotty Murray

  Nashville, TN

  www.andersoneast.com

  The Creamer is amazing on any size stage. It keeps the low end in tact and the tone funky at any volume! Grant Siemens

  Winnipeg, Canada

  www.corblund.com

  This amp is just amazing. You nailed it. It is reverb drenched pychedalic love child of a tweed deluxe and a princeton reverb. It has the chime and spank of a princeton and the low end bark of a tweed. You somehow married my two favourite things into one tight amazing little package.
