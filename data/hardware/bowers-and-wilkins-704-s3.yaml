description: The slimmest tower loudspeaker Bowers & Wilkins makes, 704 S3 still
  packs a mighty punch. Its twin Aerofoil Profile bass drivers ensure ample
  extension and scale, while its decoupled Continuum cone FST driver delivers
  crystal clear midrange performance.
details: |-
  704 S3 is the slimmest floor-standing loudspeaker Bowers & Wilkins makes, positioned as the tower for smaller rooms. It is a three-way vented-box system with a 25mm Decoupled Carbon Dome high-frequency unit, a 130mm Continuum cone FST midrange driver and two 130mm Aerofoil Profile bass cones, in a cabinet 165mm wide and 925mm tall before the plinth.

  Unlike the 702 S3 and 703 S3 above it in the range, the 704 S3 does not carry the Solid Body Tweeter-on-Top housing: its technical features list the Decoupled Carbon Dome tweeter without it, and the manual's note about a tweeter assembly that feels loose on unpacking names the 702 S3, 703 S3, 705 S3 and HTM71 S3 but not this model. The Carbon Dome tweeter is purpose-built for the 700 Series and raises the breakup threshold to 47kHz. The midrange combines the Continuum cone, FST, Biomimetic Suspension and midrange decoupling, the last of which keeps the bass drivers' operation from interfering with it, while the Aerofoil Profile bass cone uses a computer-modelled variable thickness to place stiffness where it is needed.

  The speaker is entirely passive and carries no amplification, no mains inlet and no line-level input. The 700 Series 3 manual states that there are two linked pairs of terminals on the back of the speaker, labelled HF and LF. For conventional single-wire connection the terminal links stay in place as delivered and only one pair is connected to the amplifier; for bi-wiring or bi-amplification the links are removed and each pair is connected independently. The terminals accept 4mm banana plugs, 6mm and 8mm spades, or bare wire up to 4mm diameter, with the 4mm holes blocked by plastic pins on delivery to satisfy European CENELEC safety rules.

  Installation is floor-standing only. The supplied plinth must always be fitted, with the spike or rubber feet inserted into the plinth rather than directly into the cabinet. For stereo the manual suggests 1.5m to 3m between speakers in an equilateral triangle with the listening position, at least 0.5m from the back and side walls, and for home theatre use within roughly 0.5m of the sides of the screen. The drive units create stray magnetic fields, so magnetically sensitive items should be kept 0.5m away.

  Low-frequency output can be tuned with the supplied two-piece foam port plugs, using either the outer piece alone for gentler attenuation or the complete assembly, which is the intended remedy when the speaker cannot be moved further from a wall. Performance changes during the initial listening period: the manual asks for up to a week for temperature effects to stabilise and about 15 hours of average use for the drive unit suspensions and damping compounds to reach their intended mechanical characteristics.
specs: |-
  - Description: 3-way vented-box system
  - Drive units: 1x 25mm (1 in) Decoupled Carbon Dome high-frequency, 1x 130mm (5 in) Continuum cone FST midrange, 2x 130mm (5 in) Aerofoil Profile bass
  - Frequency range: 43Hz to 33kHz
  - Frequency response: 48Hz to 28kHz +/-3dB
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 100Hz to 22kHz, less than 0.5% 300Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 3.1 ohms)
  - Recommended amplifier power: 30W to 150W into 8 ohms on unclipped programme
  - Sensitivity: 88dB spl (2.83Vrms, 1m)
  - Max recommended cable impedance: 0.1 ohms
  - Technical features: Decoupled Carbon Dome tweeter, Continuum cone FST midrange, decoupled midrange, Aerofoil Profile bass cones, Flowport
  - Passive: no on-board amplification and no mains connection. Two linked pairs of HF and LF terminals, single-wire as delivered, bi-wire or bi-amp with the links removed
  - Terminals accept 4mm banana plugs, 6mm and 8mm (1/4 in and 5/16 in) spades, or bare wire up to 4mm (5/32 in) diameter
  - Dimensions: height 925mm (36.4in) cabinet only, 964mm (38.0in) including tweeter and plinth; width 165mm (6.5in) cabinet only, 252mm (9.9in) including plinth; depth 263mm (10.4in) cabinet only, 300mm (11.8in) including grille and terminals, 321mm (12.6in) including plinth
  - Net weight: 20.53kg
  - Cabinet finishes: Gloss Black, Satin White, Mocha, Rosenut (APAC only)
  - Grille finishes: Black, Grey (Satin White only)
  - Supplied with plinth, spike feet, rubber feet and two-piece foam port plugs
