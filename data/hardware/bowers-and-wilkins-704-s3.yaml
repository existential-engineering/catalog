description: The slimmest tower loudspeaker Bowers & Wilkins makes. A
  high-performance floor-standing speaker in the 700 Series, the 704 S3 uses
  twin bass drivers and a decoupled Continuum cone FST midrange for clear,
  room-filling performance from a narrow cabinet.
details: |-
  The 704 S3 is the slimmest floor-standing loudspeaker in the third-generation Bowers & Wilkins 700 Series. It is a three-way vented-box design that pairs a 25mm Decoupled Carbon Dome tweeter with a 130mm Continuum cone FST midrange and twin 130mm Aerofoil profile bass drivers.

  The Decoupled Carbon Dome tweeter is mounted in a tweeter-on-top housing isolated from the main cabinet, intended to deliver extended, low-distortion high frequencies. The Continuum cone FST midrange uses a fixed suspension to reduce resonance and provide a more neutral midband, while the Aerofoil bass cones combine variable thickness with a stiff, low-mass profile for controlled low-frequency output. A Flowport vent reduces port noise at high output levels.

  Available finishes include Gloss Black, Satin White, and Mocha (with Rosenut available in APAC). The Satin White finish ships with a grey grille; the other finishes ship with a black grille. The speaker is sold as a pair.
specs: |-
  - Drive units: 1x 25mm Decoupled Carbon Dome tweeter, 1x 130mm Continuum cone FST midrange, 2x 130mm Aerofoil profile bass
  - Configuration: 3-way vented-box system
  - Frequency range: 43Hz - 33kHz
  - Frequency response: 48Hz - 28kHz (+/-3dB)
  - Sensitivity: 88dB SPL (2.83Vrms at 1m)
  - Harmonic distortion: <1% (100Hz - 22kHz), <0.5% (300Hz - 20kHz)
  - Nominal impedance: 8 ohms (minimum 3.1 ohms)
  - Recommended amplifier power: 30W - 150W into 8 ohms
  - Max recommended cable impedance: 0.1 ohms
  - Height: 925mm (cabinet), 964mm (with tweeter and plinth)
  - Width: 165mm (cabinet), 252mm (with plinth)
  - Depth: 263mm (cabinet), 300mm (with grille and terminals), 321mm (with plinth)
  - Net weight: 20.53kg
  - Finishes: Gloss Black, Satin White, Mocha, Rosenut (APAC only)
