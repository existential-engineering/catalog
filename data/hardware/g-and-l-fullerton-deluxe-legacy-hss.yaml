details: |-
  The Fullerton Deluxe Legacy HSS bundles some of the most time-honored option combinations from the G&L Option Order menu. These are G&L fan favorites from '60s vibes to '90s hits, supported by elegance that continues up the neck with the G&L Natural Satin finish.

  The Fullerton Deluxe G&L Legacy HSS fattens things up with a G&L AW4470 alnico bridge humbucker to complement the vintage alnico G&L CLF-100 single coils in the neck and middle positions. Masterminded by G&L VP Engineering Paul Gagon, the Fullerton Deluxe Legacy HSS has that ideal balance that will let it play well in a variety of settings, and its splittable bridge humbucker does a convincing job as a single coil with rich, ringing harmonics.

  The Legacy HSS brings all of the Legacy features, starting with Leo's PTB (Passive Treble and Bass) system which functions on all three pickups for dramatically more variety than the vintage setup, and a split coil switch for the bridge pickup. The Legacy HSS also features a Leo Fender-designed Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm. The Legacy HSS's hard-rock maple neck features an easy-playing satin finish, comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets for silky playability.

  The G&L Legacy HSS blends contemporary refinements from the Leo Fender-designed S•500 and Comanche models with classic Alnico V pickups. For faithful Alnico single-coil tone with modern refinements and superb craftsmanship, the Legacy makes for an excellent choice.

  P.T.B., Passive Treble and Bass controls: dramatically more effective than a standard tone control, treble and bass frequencies can be separately cut with this exclusive passive style circuitry via two separate tone knobs.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
