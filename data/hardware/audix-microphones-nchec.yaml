details: |-
  The NCHEC is a complete single-channel Novacore digital wireless system for vocalists and presenters — everything needed to go from box to stage in a single purchase. It pairs the NCR1 Single-Channel Digital Receiver with the NCHH Digital Handheld Transmitter and NCEC Extended Cardioid Wireless Capsule, delivering the natural vocal clarity and transient response AUDIX microphones are known for on a professional AES-256 encrypted UHF digital wireless platform.

  The NCEC extended cardioid capsule provides balanced, even-sounding vocal coverage across a wide dynamic range — ideal for lead vocalists, worship leaders, and presenters who move during performance. The NCHH transmitter and NCR1 receiver are pre-matched on the Novacore RF platform and pair via one-touch IR sync. The compact, half-rack NCR1 fits standard rack infrastructure or deploys as a standalone unit with the included power supply.

  The system operates across a 48 MHz UHF tuning range with less than 3 ms latency and 9+ hours of transmitter battery life on 2× AA alkaline or 1× NCLB rechargeable lithium-ion. USB-C charging is built into the NCHH transmitter body. The NCEC capsule is interchangeable — upgrade or swap to an NCTH Tight Hypercardioid at any time using the same "S" thread mount with no tools required . The system is fully expandable within the Novacore ecosystem by adding channels, transmitters, or receivers as needs grow .
specs: |-
  - System: NCR1 single-channel receiver + NCHH handheld transmitter + NCEC extended cardioid capsule
  - Receiver output: balanced XLR, line level
  - Receiver control ports: dual RJ11 (frequency coordination)
  - Tuning range: 48 MHz UHF
  - Latency: <3 ms
  - Encryption: AES-256
  - Transmitter power: 2x AA alkaline or 1x NCLB Li-ion, 9+ hours, USB-C charging
