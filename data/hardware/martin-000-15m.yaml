description: The 000-15M pairs Martin's Auditorium body with all-solid mahogany
  construction for a warm, focused sound.
details:
  - The Martin 000-15M is part of Martin's 15 Series, combining the comfortable
    Auditorium (000-14 Fret) body shape with all-solid mahogany construction.
    The result is a guitar with a warm, focused tone and an understated
    aesthetic defined by a satin finish.
  - Top, back, and sides are all crafted from solid mahogany, supported by
    non-scalloped spruce X-bracing. The combination yields a midrange-forward
    voice with strong note definition — well suited to fingerstyle, blues, and
    singer-songwriter applications.
  - The neck is built from select hardwood with a Modified Low Oval profile and
    Standard Taper, joined to an East Indian rosewood fingerboard. A 25.4" scale
    length and 1 11/16" nut width keep the playing feel familiar to traditional
    Martin players.
  - Hardware includes an East Indian rosewood bridge with a modern belly drop-in
    saddle and Ping nickel open-gear tuners with black knobs. The 000-15M ships
    acoustic-only from the factory, with optional pickup systems available (L.R.
    Baggs Anthem, Fishman Gold+Plus Natural, Fishman Matrix Infinity).
  - A softshell case is included.
specs: |-
  - Body: 000-14 Fret (Auditorium)
  - Top: Solid Mahogany (Dark Mahogany)
  - Back & Sides: Solid Mahogany (Dark Mahogany)
  - Bracing: Non-scalloped Spruce X-Bracing
  - Neck: Select Hardwood
  - Neck Shape: Modified Low Oval with Standard Taper
  - Fingerboard: East Indian Rosewood
  - Scale Length: 25.4"
  - Nut Width: 1 11/16"
  - Frets: 20 total (14-fret body)
  - Bridge: East Indian Rosewood with Modern Belly Drop-in Saddle
  - Tuners: Ping Nickel Open Gear with Black Knobs
  - Finish: Satin
  - Electronics: None (optional L.R. Baggs Anthem, Fishman Gold+Plus Natural, or Fishman Matrix Infinity)
  - Case: Softshell included
