description: Professional, stage-ready acoustic amps designed to provide the
  most natural possible response for your voice and acoustic instrument.
details: |-
  Sonnet faithfully amplifies the natural response of your acoustic instrument capturing every nuance of its tone and your performance.

  Sonnet has a wide dynamic range and has been carefully designed to reproduce the full frequency range produced by an acoustic instrument. From the extended sub response required for percussive styles, to the ultra-high frequency territory covered by many piezo pickups, Sonnet gives you full control over everything.

  The High Pass Filter (HPF) and Brilliance controls allow you to adjust the crucial body resonance and piezo high-end of your acoustic instrument.

  Each model has two independent channels, microphone and instrument, with their own EQ and reverb level settings. With additional line-in and Bluetooth connections, all four inputs can be used simultaneously.

  The Sonnet 60 and Sonnet 120 are available in classic, sleek black covering with black grill and control panel or stunning cream covering with copper grill and matching control panel.
specs: |-
  - Two independent channels (microphone and instrument) with EQ and reverb level per channel
  - Line-in and Bluetooth connections allow all four inputs to be used simultaneously
  - High Pass Filter (HPF) and Brilliance controls for fine-tuning acoustic instrument frequencies
  - Acoustically ported cabinets for studio-monitor-class bass response and control
  - Low-latency USB audio out plus mix D.I. XLR for recording and mixer connections
  - Optional SA-2 stand adaptor for mounting on a standard 35mm PA stand
  - Compatible with FS-17 two-way footswitch for reverb on/off and mute toggle
  - Packaged in recycled materials
  - Available in black covering with black grill or cream covering with copper grill
