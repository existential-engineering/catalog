description: >-
  The TS-10 and TS-12 were the culmination of Ensoniq's workstation lineage from
  the ESQ-1 through the SD-1, combining 32-voice polyphony, four synthesis
  technologies including Transwave and Hyperwave, sample loading from EPS/ASR
  formats, and a powerful 24-track sequencer. Widely considered the best of
  Ensoniq's workstations, the TS-12 features a 76-note hammer-action Fatar
  keyboard while the TS-10 offers a 61-note synth-action keyboard with
  polyphonic aftertouch. A later TS-10 Plus model added a conventional LCD
  screen, SCSI interface, and fully loaded RAM as standard.
details: |-
  Introduced in 1993, the TS series represented Ensoniq's most advanced workstation platform, evolving from the ESQ-1, SQ-80, VFX, VFX-SD, SD-1, and SD-1/32. The TS-10 featured a 61-note synth-action keyboard with velocity and polyphonic aftertouch, while the TS-12 offered 76 hammer-action Fatar keys with channel aftertouch. Both shared an identical sound engine and feature set. No rack-module version was produced.

  The synthesizer employed four distinct synthesis methods. Standard wavetable synthesis provided three envelopes, dual multi-mode filters (without resonance), and an LFO per voice. Transwave synthesis enabled real-time timbral modulation through 128 single-cycle waves with modifiable loop points. Hyperwave technology offered wave sequencing similar to the Korg Wavestation with up to 16 steps per list, enabling impressive textures and rhythmic patterns. Additionally, samples from EPS, EPS-16+, and ASR-10/88 instruments could be loaded via 3.5-inch floppy disk or optional SCSI.

  The effects section derived from Ensoniq's acclaimed DP-4 processor, providing 73 preset algorithms with up to 10 variations each for a total of 692 effects combinations. Up to three simultaneous effects could process each sound, covering reverbs, delays, choruses, flangers, phasers, distortions, speaker cabinet simulations, and rotary speaker emulations.

  The 24-track sequencer split between 12 non-linear tracks for pattern-based composition and 12 linear tracks, with full quantization, event editing, and controller filtering. Sound memory included 180 preset and 120 user sound patches plus an equal number of performance presets. Optional sample banks allowed up to 10 sampled sounds, potentially doubled with RAM expansion.

  Users widely consider the TS series to be the best of Ensoniq's workstations, as successor KT and MR/ZR series models lost many of the TS's features. Notable limitations include the lack of filter resonance and incompatibility with anything other than Ensoniq's own sampler formats—the instruments cannot load .mid files, .wav sounds, or standard DOS-formatted disks.
specs: |-
  - Polyphony: 32 voices
  - Multitimbral: 12 parts
  - Oscillators: Up to 6 per sound
  - Waveforms: 6 MB ROM samples, Transwaves, Hyperwave sequences
  - Sampler: 2 MB expandable to 8 MB (EPS/ASR format compatible via 3.5-inch floppy or optional SCSI)
  - LFO: 1 per voice
  - Filter: 2 DCFs per voice (non-resonant)
  - Envelopes: 3 per voice
  - Effects: 692 preset variations (73 algorithms x up to 10 variations), up to 3 simultaneous
  - Sequencer: 24-track (12 non-linear, 12 linear), 60 songs, 30,000 notes (expandable to 97,000)
  - Keyboard: TS-10: 61 keys synth-action with velocity and poly aftertouch; TS-12: 76 hammer-action Fatar with channel aftertouch
  - Memory: 180 preset / 120 user sounds; 180 preset / 120 user performances
  - Control: MIDI In/Out/Thru
  - Date produced: 1993-1996
