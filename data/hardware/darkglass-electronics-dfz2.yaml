details: |-
  The Duality is a unique fuzz pedal that contains two discrete fuzz circuits, a gated saw-tooth wave and a raunchy high-gain sound, which can be mixed together to yield a vast selection of distinct sonic textures. The two parallel fuzz voices are combined through internal Filter and Blend controls, letting players dial in anything from a tight gated square wave to a thick, aggressive high-gain roar. The concentric Level and Duality knobs on the top panel govern output volume and the balance between the two circuits. Housed in a compact, reliable pedal form factor, the Duality runs on standard 9V DC (center-negative) power.
specs: |-
  - Unique fuzz pedal comprised of two parallel fuzzes
  - Straightforward design in a reliable form factor
  - Concentric Level and Duality control knobs
  - Internal Filter and Blend controls with easy access
  - Input impedance 1 MΩ, output impedance 100 kΩ
  - Standard 9V DC pedal power (center-negative plug)
