name: PT01 Touring
manufacturer: numark
primaryCategory: turntable
url: https://www.numark.com/product/pt01-touring
description: Classically styled portable suitcase turntable playing 33 1/3, 45,
  and 78 RPM records, with built-in stereo speakers, a rechargeable battery, RCA
  outputs, and USB for digitizing vinyl.
details: |-
  The Numark PT Touring turntable is a classically-styled suitcase unit that recalls the popular portable turntables from the past. PT Touring has a rugged case with a handle so you can carry it anywhere. It plays all your 33 1/3, 45 and 78 RPM records, comes with a 45 RPM adapter, and it has built-in stereo speakers for convenient listening without needing to connect external speakers. In addition, it has RCA outputs for simple connection to home audio equipment and a convenient Auto-Stop feature kicks in when it reaches the end of the record. Plus with its USB port, included USB cable and downloadable EZ Vinyl/Tape Converter software, converting analog records into digital files for archiving on your computer is a snap.

  PT Touring far surpasses the old suitcase turntables in versatility, however. It can also operate on its own built-in rechargeable battery—which means you can enjoy your records even if you're not near a wall plug.
specs: |-
  - 3-speeds (33 1/3, 45 and 78 RPM)
  - Built-in stereo speakers
  - 1/8" headphone jack
  - 1/8" Aux input
  - Built-in rechargeable Li-On battery
  - Line level RCA outputs
  - EZ Vinyl/Tape Converter software converts records to digital files via USB
  - Self-contained design with built-in speakers
  - 45 RPM adapter included
  - Portable suitcase-style design with handle
  - Auto-Stop feature at end of record
