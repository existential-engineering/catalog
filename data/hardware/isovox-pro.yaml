details: |-
  ISOVOX PRO is the flagship portable vocal booth engineered for professional artists, producers, and voice specialists who require reference-grade studio sound in any environment. Designed in Sweden, it features a complete acoustic redesign with patent-pending Acoustic Gills that allow you to capture hit-making, crystal-clear vocals without the interference of room acoustics or low-frequency buildup. Unlike traditional vocal setups, the ISOVOX PRO offers 20% more internal space for natural movement and features a silent active ventilation system developed with Noctua, ensuring maximum comfort and professional results whether you are recording at home or on the road.
