description: The Hors d'Oeuvre? is an active feedback loop pedal that enables
  bipolar feedback routing of external signal processing devices and mixing of
  input and effect return signals.
details: |-
  The Hors d'Oeuvre? is an active feedback loop device that provides different
  opportunities to create and listen to: bipolar feedback of any combination of
  sound processing devices, and signal difference of input and return signals.
  It enables routing of external effects (reverb, fuzz, phaser, and more) into a
  feedback loop with independent WET and DRY signal mixing.

  The FEED control sets the feedback amount; caution should be exercised with FEED
  settings above minimum as strong oscillations will occur. The SEND/RETURN effects
  loop connects external processing devices that are brought into the feedback path.
  It is intentionally designed as an introduction to feedback-based sound design.
specs: |-
  - Active feedback loop
  - SEND/RETURN effects loop
  - Independent WET/DRY mix
  - FEED (feedback) control
  - Power supply: 9 VDC centre-negative
  - Made in Hull, Québec
