description: Versatile hi-fi stereo reverb with freeze.
details: |-
  The Erica Synths Black Reverb is a versatile hi-fi stereo FX module with lots of unique features, based on a custom Erica Synths DSP engine. The reverb sources are selectable Tape, BBD and dirty BBD emulations, each with three modes, Room, Hall and Cathedral.

  Delicate room size control along with feedback, tone and stereo spin controls allow extremely delicate reverberation effects to be designed. CV control over various parameters and storage for up to 10 presets make this module an integral part of a performance rack, and FREEZE can be engaged manually or by trigger.

  The module runs on new Erica Synths DSP hardware, and the effects are developed in collaboration with the Dutch company 112dB.

  Erica Black Series include high-end, unique functionality and superior quality modules. Only the best, highest-quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Black Series consist of a range of modules that are needed to put together an entire synth.

  Maximum audio input level before clipping is 16Vptp and the CV input range spans -5V to +5V. Sampling runs at 48kHz and 24bit, and the module occupies 12HP at a depth of 35mm.
specs: |-
  - Reverb based on Tape, BBD and digital delay lines
  - Three room sizes
  - Manual and triggered FREEZE
  - 10 preset patches
  - CV control over size, feedback, tone and preset selection
  - Adjustable stereo spin
  - Max audio input level before clipping 16Vptp
  - CV input range (full span) -5V to +5V
  - Sampling frequency 48kHz, 24bit
  - Audio codecs -108 dynamic range, -98dB THD+N
  - Power consumption 120mA@+12V, 39mA@-12V
  - Module width 12HP
  - Module depth 35mm
