description: Compact Bluetooth speaker delivering room-filling sound.
details: |-
  As the most compact speaker in the home line-up, Acton III fits in anywhere, with sound that really stands out. Easily connect to your speaker from your device using Bluetooth or the 3.5 mm input and get straight to listening. Built-in Dynamic Loudness adjusts the tonal balance of the sound, ensuring your music sounds brilliant at every volume.

  Re-engineered wider stereo soundstage: this generation in the home lineup features an even wider acoustic footprint than before, with Marshall's characteristic surround sound that has been redesigned to give you a more immersive experience. Generation III speakers carry outward-angled treble and updated waveguides to deliver solid sound that's so wide it reaches anywhere in the room.

  Pair, play and turn it up: these speakers are straight to business, so you can just pair and play without the hassle of a complex set-up. You'll find everything you need right there on the unit, including the Bluetooth pairing button, power switch, bass and treble controls and the control knob so you can easily control your music without ever picking up your device.

  Connect and control: with next-generation Bluetooth 5.2 and the 3.5 mm input, connecting to your speaker and listening to your music has never been so effortless. Download and connect to the Marshall Bluetooth app to access advanced settings and Over-the-Air (OTA) updates. While you can control the bass and treble on top of each speaker, you'll also find additional controls in the app.

  Designed and engineered in Sweden. Made in Thailand.
specs: |-
  - Frequency range: 45 to 20,000 Hz
  - Stereo/mono: Stereo
  - Maximum sound pressure level: 95 dB at 1 m
  - Cabinet principle: Bass-reflex
  - One 30 Watt Class D amplifier for the woofer
  - Two 15 Watt Class D amplifiers for the tweeters
  - Adjustable bass and treble controls via analogue controls on the speaker
  - Wireless connectivity: Bluetooth 5.2, ready for Bluetooth LE Audio
  - Bluetooth range: 10 m / 30 ft
  - Wired connectivity: 3.5 mm input
  - Top panel controls: source button, volume control knob, bass control knob, treble control knob, play/pause button, skip backward/forward control knob, power switch
  - Wi-Fi: No
  - Microphone system: No
  - Voice command: No
  - Mains input voltage: 100 to 240 V
  - Mains frequency: 50 to 60 Hz
  - Weight: 2.85 kg / 6.28 lb
  - Width: 170 mm / 6.69"
  - Height: 150 mm / 5.91"
  - Depth: 260 mm / 10.24"
  - Water resistance: No
  - Box contents: Acton III speaker, user manual and legal and safety information, mains lead
  - Compatible app: Marshall Bluetooth app (iOS and Android), with over-the-air software updates
