description: >-
  The Oberheim DSX is a pre-MIDI digital polyphonic sequencer designed to
  interface directly with Oberheim synthesizers via the proprietary Parallel
  Buss, with additional CV/Gate outputs for controlling other analog gear.
details: |-
  Released in 1981, the DSX was a key component of Oberheim's proprietary Parallel Buss system, unveiled in the early 1980s as a way to tightly integrate their instruments before the MIDI standard existed. It served as a dedicated sequencing controller that could communicate directly with Oberheim synthesizers including the OB-8, OB-Xa, OB-SX, and OB-X.

  The sequencer offers 10 polyphonic tracks per sequence with a generous 6,000-note capacity, supporting up to 10 sequences or songs. Recording happens in real time, capturing both notes and patch changes for dynamic, evolving performances. Post-recording, users can quantize, loop, edit, transpose, and merge sequences for refined arrangements.

  Beyond the Oberheim ecosystem, the DSX provides 8 CV and Gate outputs capable of controlling up to 8 additional analog synthesizers from other manufacturers. This made it a versatile sequencing hub in mixed-gear studios of the early 1980s, bridging the gap between Oberheim's proprietary system and the broader analog synth world.

  As a pre-MIDI device, the DSX represents an important chapter in the evolution of electronic music production, when manufacturers were developing their own interconnection standards before the industry settled on a universal protocol.
specs: |-
  - Tracks: 10 polyphonic per sequence
  - Note Capacity: 6,000 notes
  - Sequences/Songs: 10 maximum
  - Recording: Real-time (notes and patch changes)
  - Editing: Quantize, loop, edit, transpose, merge
  - Connections: Oberheim Parallel Buss, 8 CV/Gate ins/outs
  - Compatible Synths: OB-8, OB-Xa, OB-SX, OB-X
  - Sounds: None (controller only)
