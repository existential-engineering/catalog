description: Single-channel mic/line preamp with induction EQ and Cinemag transformers
details: The Eighteen is a single-channel mic/DI channel strip featuring a
  vintage-inspired solid state preamplifier with Cinemag input transformer and
  custom BLA1831 discrete op-amp, paired with a passive inductor-based program
  equalizer developed in partnership with Cinemag. It combines a creamy, punchy
  preamp response with a 2-band passive induction EQ, 80Hz highpass filter,
  10kHz lowpass filter, and output drive control for pushing the analog stages
  into harmonic saturation. Designed, engineered, assembled, and tested in the
  USA. 2U rackmount form factor.
specs: |-
  - Preamp Type: Solid State with passive induction EQ
  - Transformer: Cinemag (input)
  - Op-amp: Custom BLA1831 discrete
  - Number of Channels: 1
  - Phantom Power: Yes (48V)
  - Polarity Switch: Yes
  - EQ: 2-band passive induction EQ (Cinemag inductor), 80Hz highpass, 10kHz lowpass
  - Analog Inputs: 1 x XLR (mic/line)
  - Analog Outputs: 1 x XLR
  - Form factor: 2U rackmount
  - Power Source: IEC AC cable
  - Dimensions: 19" W x 3.5" H x 6" D
  - Weight: 14.5 lbs.
  - Made in USA
