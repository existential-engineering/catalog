description: 15" 1400W Enhanced Powered Loudspeaker.
details: |-
  Experience the legendary Thump Series in all its wall-shaking glory with Thump215XT. With wireless control from your phone, its incredibly easy to dial in the sound just right, and it doesn't end there.

  Application-specific voicing modes, indoor/outdoor modes, and more make it simple to optimize the loudspeaker to wherever you put them. Of course it's got all the power you need so when it's time to really get the dance floor moving, Thump has your back.

  From DJs to bands to houses of worship, the powerful Thump215XT is ready to enhance your performance.
specs: |-
  - 1400W ultra-efficient Class-D amplifier
  - Frequency response: 40 Hz - 23 kHz
  - Max SPL: 129 dB
  - 15" high-performance woofer
  - 1" compression driver
  - 4 Application-specific voicing modes (Music, Live, Club, Monitor)
  - Outdoor mode
  - Bluetooth connectivity
  - Built-in Feedback Eliminator
  - Music Ducking mode
  - Front LED On/Off switch
  - Universal Power Supply (100-240VAC)
  - Standard pole mount, M10 flypoints, Monitor wedge
  - Weight: 35.1 lb / 15.9 kg
  - Dimensions: 27 x 17.4 x 14 in / 686 x 442 x 356 mm (HxWxD)
