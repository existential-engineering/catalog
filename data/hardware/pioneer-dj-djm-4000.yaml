details: |-
  4-channel rack mountable DJ mixer.

  The DJM-4000 4-channel mixer boasts several standout innovations that place a premium on DJ dynamism, usability and professional style . The built-in USB soundcard allows you to connect a laptop without any drop in sound quality. It allows you to play music stored on a computer and directly record your DJ mixes at the same time. * Only available in Africa, Asia and South America.

  Crossover frequencies. The crossover frequencies of the master and subwoofer output can be adjusted with a single knob, enabling optimum bass balance between the speakers and subwoofers at any venue.

  MIC inputs. The MIC inputs, together with some mic effects, give you meticulous control over MCs, party hosts and karaoke singers. Plus the Auto Talkover function automatically reduces the volume of the master output, making it easy to hear what is being said or sung in the microphone.

  Total control. A dedicated Master/Zone output facility allows one DJ to manage two separate outputs across two different locations.
specs: |-
  - 4-channel rack mountable DJ mixer
  - Crossover frequencies
  - MIC inputs
  - Total control
