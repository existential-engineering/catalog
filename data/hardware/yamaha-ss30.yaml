description: >-
  A fully polyphonic string synthesizer from Yamaha that used divide-down organ-style architecture
  to produce lush, layered string and ensemble tones with two oscillators per note.
details: |-
  The Yamaha SS30 arrived in 1977 as part of the wave of string synthesizers that defined the late 1970s keyboard landscape. Housed in a handsome full-wood case, it employed a divide-down tone generation architecture similar to electric organs, giving it full polyphony across its 49-key keyboard.

  What set the SS30 apart from competitors like the ARP Solina was its richer tonal character. With two oscillators per note and individual VCA envelope control for each key, it could produce lush, evolving timbres that had more depth and movement than many of its contemporaries. Onboard chorus and vibrato effects added further dimension to the sound.

  The instrument was relatively simple in terms of controls, offering preset sound selections with modest tweaking capabilities. It lacked filters, dedicated LFOs, and any form of patch memory. The keyboard was not velocity-sensitive, keeping the playing experience straightforward. Despite these limitations, artists like Ultravox and Midge Ure found its warm, enveloping string tones useful in both studio and live contexts.
specs: |-
  - Polyphony: Full 49 voices (divide-down architecture)
  - Oscillators: 2 per voice
  - Keyboard: 49 keys (4 octaves), non-velocity sensitive
  - LFO: None
  - Filter: None
  - Effects: Chorus and vibrato
  - Memory: None
  - Control: Minimal preset sound selection
