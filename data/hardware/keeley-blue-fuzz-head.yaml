description: Germanium fuzz and overdrive with a blend between the two voices,
  in a translucent blue finish. Legacy stock.
details: |-
  This listing covers a batch of hand-built Fuzz Heads in translucent blue, recovered from a warehouse in November 2017 and sold directly. The units were built between 2011 and 2013 and had been untouched since, and each was reboxed, tested, voltage-aligned where needed and signed. The construction is hand built and hand wired, with a panel-mounted DC jack, open-frame Switchcraft jacks and through-hole parts. Eight blue units and eighteen red were offered, the red ones hand silk-screened; this listing is for the blue finish.

  The Fuzz Head was Robert Keeley's first fuzz-drive design. The goal was a fuzz-type sound that was smoother, with the breakup and dynamics of a driven tube amplifier. A treble booster was modified for full-range response and a transistor stage was designed for it to overdrive, keeping the dynamics of a germanium booster while using it to push an amplifier stage into rounded, smooth overdrive.

  The pedal blends an overdrive and a fuzz. It is designed to work in the way players use Fuzz Face pedals as a lead boost, but without the muddiness, weak note definition, excess bass and lack of sustain that can come with that circuit, and without an overdrive's tendency to be too smooth, so it gives a cutting edge for lead playing.

  It is transparent and dynamic, taking qualities from both germanium fuzz and overdrive designs, and rolling back a guitar's volume gives clean sounds and a range of textures between the two voices.
