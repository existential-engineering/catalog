description: Active speakers with built-in Bluetooth and USB DAC for enjoying subscription music and video streaming with high-quality sound, carrying a MUSIC/VOICE mode switch and DSP sound adjustment.
details: |-
  Bluetooth and USB connectivity, a new innovation in desktop speakers. Active speakers with built-in Bluetooth and USB-DAC for enjoying subscription music and video streaming with high-quality sound. A MUSIC/VOICE mode switching function allows the user to switch sound quality according to the application, such as listening to PC audio or monitoring video streaming, while the DSP provides precise adjustment.

  The MUSIC mode is suitable for PC audio, listening with smartphones and DTM; the VOICE mode is suitable for monitoring mainly voice, such as narration on internet distribution. Input sources are digital (Bluetooth / USB) and analog (AUX), switchable between Bluetooth for smartphones, USB for PCs and analog for audio interfaces.

  Newly designed 75 mm woofer and 19 mm soft dome tweeter. The glass fiber diaphragm woofer and silk dome tweeter, combined with precise sound quality adjustment by DSP, provide high-quality sound compatible with high-resolution sound sources.

  The enclosure is made of wood for natural resonance. The active speaker (right side) separates the enclosure from the amplifier section to isolate unnecessary air vibration of circuit components and bring out the full performance of the 15 W + 15 W digital amplifier. The passive speaker (left side) uses the same separation structure so that both enclosures have the same volume.

  Volume control and input source selection are on the front panel. A dedicated terminal is provided for easy connection of an active subwoofer such as the PM-SUBmini2. UL Energy Verified certification recognises the energy-saving performance: a power saving mode reduces power consumption after 15 minutes of silence and can be switched on and off on the rear panel. An optional 3 m one-touch speaker cable (ET-PM3.0SP) is available when the supplied 1.5 m cable is not long enough.
specs: |-
  - Enclosure type: 2-way bass reflex
  - Units: 75 mm cone woofer, 19 mm soft dome tweeter
  - Amplifier output: 15 W + 15 W
  - Frequency response: 100 Hz to 40 kHz
  - External dimensions: 110 mm (W) x 212 mm (H) x 133 mm (D)
  - Weight: 3.4 kg (1 pair)
  - Bluetooth: standard Ver. 5.0, Power Class 1, approx. 10 m communication distance, 2.4 GHz band, A2DP profile, SBC and AAC codecs, SCMS-T content protection, 20 Hz to 20 kHz transmission bandwidth
  - USB: USB type C port, USB2.0 High Speed, 44.1/48.0/88.2/96.0 kHz, 16/24 bit
  - AUX terminal: stereo mini jack, input sensitivity 500 mVrms, maximum input 2 Vrms
  - SUB-OUT (LR mix): RCA pin jack, output linked to front panel volume
  - Power supply / AC power adapter: input AC 100 V to 240 V (50/60 Hz), output DC 15 V 3.2 A
  - MUSIC / VOICE mode switch with DSP adjustment
  - Power saving mode after 15 minutes of silence, switchable on the rear panel
  - Accessories: AC power adapter, one-touch speaker cable (1.5 m), USB cable (Type-A to Type-C, 1 m), stereo mini to RCA pin x 2 cable (1 m), safety precautions, user manual
