description: Active speakers with built-in Bluetooth and USB-DAC for enjoying
  subscription music and video streaming with high-quality sound. The speakers
  are equipped with a MUSIC/VOICE mode switching function that allows the user
  to switch sound quality according to the application, such as listening to PC
  audio or monitoring video streaming, while the DSP provides precise
  adjustment.
details: |-
  The Fostex PM0.3BD is a compact 2-way bass-reflex active speaker system that combines Bluetooth 5.0 wireless, USB-C audio, and analog AUX input in a small desktop footprint. It is positioned as a do-it-all personal monitor for PC audio, streaming, light DTM work, and casual listening.

  A switchable MUSIC/VOICE mode reshapes the DSP tuning for the content being played. MUSIC mode is tuned for PC audio, smartphone playback, and music production; VOICE mode flattens the response for narration and video monitoring. Input source selection and volume are handled by knobs on the front panel of the active (right) speaker.

  Drivers are a newly designed 75mm glass-fiber-cone woofer and a 19mm silk soft-dome tweeter, driven by a 15W + 15W digital amplifier. The wooden enclosure separates the cabinet from the amplifier section to isolate circuit components from internal air pressure, and the passive (left) speaker matches the active speaker's internal volume so left/right tonal balance is preserved.

  Rear-panel I/O includes USB Type-C (USB 2.0 High Speed, up to 96 kHz / 24-bit), a stereo mini AUX input, and a dedicated RCA SUB-OUT (LR mix) that follows the front-panel volume — designed to feed an active subwoofer such as the Fostex PM-SUBmini2. The system also carries UL Energy Verified certification with a defeatable 15-minute power-saving auto-off.
specs: |-
  - Enclosure: 2-way bass reflex
  - Woofer: 75mm cone (glass fiber)
  - Tweeter: 19mm soft dome (silk)
  - Amplifier output: 15W + 15W digital
  - Frequency response: 100 Hz – 40 kHz
  - USB: Type-C, USB 2.0 High Speed, 44.1/48/88.2/96 kHz, 16/24-bit
  - Bluetooth: 5.0, Power Class 1, ~10m range, A2DP, SBC/AAC, SCMS-T
  - AUX: stereo mini jack, 500 mVrms input sensitivity, 2 Vrms max
  - SUB-OUT: RCA pin jacks, LR mix, volume-linked
  - Power: AC adapter (AC 100–240V, 50/60Hz → DC 15V 3.2A)
  - Dimensions: 110 (W) x 212 (H) x 133 (D) mm
  - Weight: 3.4 kg (pair)
  - MUSIC / VOICE DSP mode switch
  - UL Energy Verified, 15-minute auto power-save
  - Includes: AC adapter, one-touch speaker cable (1.5 m), USB Type-A to Type-C cable (1 m), 3.5mm to RCA cable (1 m)
