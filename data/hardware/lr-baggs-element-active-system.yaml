description: The Element is the pickup system that we stripped down to bare essentials.
details: |-
  The Element is the pickup system that we stripped down to bare essentials. By removing every physical obstacle between the guitar and its film sensor, we built this system to correct a design flaw in most traditional undersaddle pickups, which depend on direct string pressure to compress the sensor. This is what leads to the notorious “quack” that acoustic guitarists constantly try to avoid. Lloyd Baggs invented the Element with a beautifully minimalist design. The Element rejects spiky string attack, allowing it to mirror the actual movement and resonance of your guitar’s soundboard and capture the nuances of your instrument. With an all-discrete, Class A endpin preamp, it delivers a warm, “un-quackable” tone that cuts through a loud band mix.
specs: |-
  - All-discrete, Class-A endpin preamp
  - Pre-attached Element undersaddle film pickup
  - Fits both 3/32" and 1/8" saddle slots
  - Soundhole-mounted volume control
  - Single 9V battery, approximately 1,000 hours of battery life
  - Nylon-string model available
  - Requires professional installation
