details: |-
  DESCRIPTION

  The Combinata Classico Baritone is the latest offering from Rivolta Guitars and the mind of Dennis Fano. Following the incredible success of our Mondata Baritone VII model, we felt we also needed to give the Combinata some low end treatment. Featuring a slightly shorter 27" scale and 14-68 gauge strings, the Combinata Baritone offers a comfortable playing experience while retaining excellent string tension. The chambered all mahogany construction keeps the instrument extremely lightweight and paired with 2 x double black Mondo Humbuckers, the Combinata Baritone's depth and resonance really shines.
