description: Take your shredding to the next level with the all-new Pro-Mod Plus
  San Dimas from Charvel. This modernized take on the classic San Dimas shred
  machine packs even more cutting-edge features for lightning-fast playing. The
  alder body provides rich, dynamic tone, complemented by a matching painted
  headstock, hand-shake heel design, and recessed neck screws.
details: |-
  The Pro-Mod Plus San Dimas Style 1 HH FR E pairs an alder San Dimas body finished in satin Scorched Earth with a bolt-on caramelized maple neck featuring graphite reinforcement and a hand-rubbed urethane finish. An ebony fingerboard with a 12"-16" compound radius hosts 22 jumbo frets with 4mm pearloid dot inlays and Luminlay side dots, anchored by a Floyd Rose 1500 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics center on a Seymour Duncan JB TB-4 in the bridge and a Seymour Duncan '59 SH-1N in the neck, routed through a 5-position blade switch with a Bourns low-friction volume pot and a no-load tone control.

  Hardware includes a Floyd Rose 1500 Series double-locking tremolo with locking tremolo arm, Charvel sealed die-cast locking tuning machines, dome-style control knobs, and a licensed Fender Stratocaster headstock, all in a black hardware finish. Ships with an included Charvel Multi-Fit Gig Bag (p/n 299-1414-006).
