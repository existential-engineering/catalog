description: >-
  Korg's 6-voice analog polysynth released in 1982 as the successor to the Polysix, featuring
  dual DCOs per voice for improved tuning stability and a built-in arpeggiator.
details: |-
  The Poly-61 arrived as a meaningful evolution from the beloved Polysix, trading VCOs for two DCOs per voice to provide much better tuning reliability while retaining an analog signal path. The dual oscillators give it a thicker sound foundation capable of gritty basses, lush pads, and trippy analog effects.

  A Korg joystick handles modulation duties, routing to either the VCO or VCF as needed. The lowpass filter features a 7-step resonance control that, while less dramatically fat than the Polysix's filter, still delivers characterful analog filtering with a dedicated ADSR envelope. The built-in arpeggiator carries over from its predecessor and supports external sync for integration with other gear.

  Patch memory stores 64 sounds using a numeric entry system similar to the Poly-800 and Yamaha DX-7. Early models lacked MIDI, but the Poly-61M revision introduced in 1984 added full MIDI implementation. The synth has been used by artists including FM Static and The Faint.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 DCOs per voice (DCO1: sawtooth, pulse, square; DCO2: sawtooth, square)
  - LFO: 1 (modulates DCOs or filter)
  - Filter: 1 lowpass with ADSR, 7-step resonance
  - VCA: ADSR envelope
  - Keyboard: 61 keys
  - Arpeggiator: Yes, with external sync
  - Effects: Chorus
  - Memory: 64 patches
  - Control: MIDI (Poly-61M models only)
releaseDate: "1982"
releaseDateYearOnly: true
