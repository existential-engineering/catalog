description: >-
  The Waldorf KB37 is a keyboard controller that combines a 37-key velocity and aftertouch
  sensitive MIDI keyboard with an integrated Eurorack module housing capable of
  accommodating up to 107HP of modules. Introduced in 2016, it features a high-resolution
  16-bit CV interface, built-in arpeggiator, and pitch and modulation wheels, making it a
  versatile performance platform for modular synthesizer enthusiasts.
details: |-
  The KB37 features a straightforward design with dedicated space for Eurorack modules positioned above a full-sized 37-key keyboard. The instrument accommodates modules with depths up to 65mm, making it compatible with most standard Eurorack gear. The keyboard itself includes velocity sensitivity and aftertouch capability, providing expressive real-time control.

    Built-in features enhance usability for both studio and live performance contexts. An octave transposition switch extends the playable range across seven octaves, while a dedicated glide knob shapes the pitch control voltage. The device incorporates a functional arpeggiator for pattern generation.

    The KB37 distinguishes itself through a high-resolution and temperature stable 16-bit CV interface that ensures precise module control. Additional control elements include pitch and modulation wheels for real-time expression. Waldorf's reputation for solid construction extends to this device, which incorporates an internal power supply.

    This instrument represents a niche solution for modular enthusiasts who want live performance flexibility without converting to traditional keyboard synthesis. MIDI In, Out, and Thru connections along with USB connectivity ensure broad integration with other studio equipment.
specs: |-
  - 37 full-size keys with velocity and aftertouch
    - 1 voice polyphony
    - 107HP Eurorack module capacity
    - Module depth up to 65mm
    - 16-bit CV interface
    - Pitch wheel and modulation wheel
    - Octave transposition across 7 octaves
    - Glide knob
    - Built-in arpeggiator
    - MIDI In/Out/Thru
    - USB connectivity
    - Internal power supply
