description: >-
  The Liberation was Moog's keytar-style portable performance synthesizer, featuring a
  dual-oscillator monophonic analog engine with the classic Moog 24dB/octave lowpass
  filter. Designed to be worn like a guitar, it gave performers authentic Moog sound with
  full stage mobility, and included a built-in ribbon controller for expressive pitch
  bending and modulation.
details: |-
  The Liberation is a performance-oriented analog synthesizer designed to be worn like a guitar. Its keytar format made it popular among electronic music acts and rock bands seeking authentic analog synthesis with the freedom to move around the stage. Notable users include 808 State, Apollo 440, Devo, and Kool and The Gang.

    The synthesizer employs two voltage-controlled oscillators with independent waveform selection. VCO 1 offers sawtooth, triangle, and rectangle waveforms across 32', 16', and 8' ranges, while VCO 2 provides sawtooth, triangle, and square waveforms across 16', 8', and 4' ranges. Additional sound-shaping features include ring modulation, noise generation, and VCO synchronization.

    Sound is shaped through the classic Moog 24dB/octave lowpass filter with dedicated cutoff, resonance (emphasis), and envelope amount controls. Both filter and amplitude envelopes provide attack, decay/release, and sustain parameters. A ribbon controller embedded in the hand-grip section enables intuitive pitch bending and real-time modulation. The Liberation also includes a 10-voice polyphonic organ section for harmonic accompaniment, setting it apart from strictly monophonic instruments of the era.
specs: |-
  - Polyphony: Monophonic (plus 10-voice polyphonic organ section)
    - Oscillators: 2 VCOs with independent waveform selection
    - VCO 1: Sawtooth, Triangle, Rectangle; 32', 16', 8' ranges
    - VCO 2: Sawtooth, Triangle, Square; 16', 8', 4' ranges
    - Filter: 24dB/octave lowpass with cutoff, emphasis, and envelope amount
    - Envelopes: Attack, Decay/Release, Sustain (filter and VCA)
    - Keyboard: 44 keys
    - Ribbon controller for pitch bend and modulation
    - Ring modulation, noise generator, VCO sync
    - Control: CV/Gate
    - Memory: None
