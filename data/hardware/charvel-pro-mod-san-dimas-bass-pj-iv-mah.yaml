description: The Charvel Pro-Mod San Dimas Bass PJ IV MAH pairs the sleek
  late-1970s San Dimas body shape with a mahogany body, a caramelized maple
  Speed Neck, and a versatile PJ pickup configuration for a high-performance
  4-string built around modern playability and aggressive tone shaping.
details: |-
  The Pro-Mod San Dimas Bass PJ IV MAH features a mahogany San Dimas Bass body in a satin finish with the deeper cutaway access of the original late-1970s design. A bolt-on caramelized maple Charvel Speed Neck with graphite reinforcement, a hand-rubbed satin urethane finish, and rolled fingerboard edges delivers a broken-in feel, with a heel-mount truss rod adjustment wheel for quick setup.

  A caramelized maple fingerboard with a 12"-16" compound radius hosts 20 jumbo frets, cream dot inlays, and Luminlay side dots, anchored by a 1.5" Graph Tech TUSQ XL nut and a 34" scale length.

  Electronics combine a DiMarzio Model P DP122 middle pickup and a DiMarzio Model J DP123 bridge pickup in cream covers, routed through a master volume with push/pull active/passive selector, a pickup blend control, and a 3-band active EQ (bass, middle, treble) that can be bypassed for passive operation without a battery.

  Hardware includes a Charvel HiMass bridge, Charvel open-gear tuning machines in chrome, dome-style control knobs, vintage-style disc string trees, and a 4-bolt neck plate. A licensed Fender Precision Bass headstock rounds out the package.
