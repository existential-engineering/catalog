description: Kali Audio's MV-BT lets you use your Bluetooth devices with
  professional speakers, mixers, controllers, and interfaces. Just pair your
  device by pressing the Kali logo on the front, and use your preferred balanced
  connector to connect to your system.
details: |-
  Bluetooth in, balanced audio out. The MV-BT turns any professional speaker into a Bluetooth speaker, so Bluetooth devices can be used with professional speakers, mixers, controllers, and interfaces without adapters.

  Pairing is done from the front panel: press the Kali logo to pair. An LED display uses a blue light to indicate volume level.

  High resolution codecs are supported, with AAC for iOS devices and CD-quality aptX for most others.

  TRS and XLR outputs let you pick the out that works for you, and connect to speakers, mixers, controllers, or interfaces with whatever cables you already use. A 3.5 mm aux input jack is provided for a wired source.

  A weighted knob gives precise control over the volume level. Volume control is independent, so the volume on the connected device can be left at full.
