description: Based on guitars first introduced around the same time as the OM,
  the C10 is a parlor-style acoustic with a narrow waist and small upper bout
  that delivers a precise, focused response. Its C-shape neck profile makes it a
  natural choice for electric guitarists transitioning to acoustic. The guitar
  is built with a Sitka spruce top and Honduran mahogany back, sides, and neck,
  finished in high gloss nitrocellulose lacquer.
details: |-
  The C10 is a parlor acoustic guitar modeled after instruments from the early twentieth century. Its narrow waist and small upper bout produce a precise, focused tone that sits well in a mix and rewards a lighter touch. The body is built with a Sitka spruce top braced with a pre-war scalloped X-brace pattern and Honduran mahogany back and sides, delivering warm midrange with clear articulation. The Honduran mahogany neck is joined to the body via a mortise & tenon hybrid joint and carries a C-shape profile that many players find comfortable, especially those coming from electric guitars. The ebony fingerboard features mother-of-pearl long dot inlays and a 14"-26" compound radius. Hardware includes nickel Waverly tuners, an ebony straight-style bridge with 2 3/16" spacing, and bone nut and saddle.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Bridge: Ebony straight-style, 2 3/16" spacing
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Tuners: Nickel Waverly
  - Bridge Pins/End Pin: Ebony with mother-of-pearl dot
  - Frets: Medium 18% nickel-silver
  - Fingerboard Inlays: Mother-of-pearl long dots
  - Body Binding: Ivoroid with black/white/black purfling
  - Rosette: Ivoroid with black/white purfling
  - Backstrip: 1-style (Walnut)
  - Brace Material: Sitka spruce
  - Brace Pattern: Pre-war scalloped X-brace
  - Neck Joint: Mortise & tenon hybrid
  - Neck Profile: C-shape
  - Peghead Profile: Haircut
  - Peghead Veneer: Ebony with mother-of-pearl Collings logo
  - Truss Rod: Fully adjustable
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Scale Length: 25 1/2"
  - Fingerboard Radius: 14" - 26" compound
  - Body Width: 14 3/4"
  - Body Length: 19 1/4"
  - Body Depth: 4 1/4"
  - Total Length: 40"
  - Strings: D'Addario EJ-16 (.012" - .053")
