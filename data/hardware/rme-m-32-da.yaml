url: https://rme-audio.de/m-32-m-16-da.html
description: 32-channel MADI/ADAT to analog converter in a 19-inch, 2U
  enclosure, combining excellent analog circuit design with the latest converter
  chips and RME's SteadyClock.
details: |-
  The M-32 DA combines excellent analog circuit design with the latest converter chips and RME's superior SteadyClock to deliver 32 channels of high-quality digital-to-analog conversion from MADI and ADAT sources in a 19-inch, 2U enclosure.

  Two 32-channel MADI inputs (optical and coaxial) and four ADAT optical inputs feed the converter section, with sample rates up to 192 kHz. At 96 kHz, MADI carries 32 channels and ADAT carries 16; at 192 kHz, MADI carries 16 channels and ADAT carries 8.

  Three hardware reference levels (+24 dBu, +19 dBu, +13 dBu @ 0 dBFS) are selectable globally. Each analog channel is available simultaneously on a servo-balanced 1/4" TRS jack (up to +21 dBu) and on a balanced 25-pin D-sub connector (up to +24 dBu).

  SteadyClock provides RME's renowned jitter suppression, while SyncCheck continuously verifies that all clock sources are in sync. Automatic Delay Compensation keeps multiple stacked M-32 DA units sample-accurate. Front-panel level meters use six LEDs per channel, and all settings can be controlled remotely over MIDI.
specs: |-
  - Channels: 32 analog outputs
  - Form factor: 19-inch, 2U
  - Dimensions (W x H x D): 483 x 88 x 200 mm
  - Power supply: internal switching mode, 100 V - 240 V AC, 60 W
  - Sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz, variable (Sync/Word Clock)
  - Reference levels (0 dBFS): +24 dBu, +19 dBu, +13 dBu
  - Output 1/4" TRS: servo balanced, up to +21 dBu
  - Output 25-pin D-sub: balanced, up to +24 dBu
  - Dynamic range (SNR): 114 dB RMS unweighted, 118 dBA
  - THD: < -104 dB (< 0.00063%)
  - THD+N: < -100 dB (< 0.001%)
  - Channel separation (crosstalk): > 110 dB
  - Frequency response @ 48 kHz, -0.5 dB: 5 Hz - 22 kHz
  - Frequency response @ 96 kHz, -0.5 dB: < 5 Hz - 34 kHz
  - Frequency response @ 192 kHz, -1 dB: < 5 Hz - 50 kHz
  - Jitter (internal, Word Clock, ADAT, MADI): typical < 1 ns
  - Jitter suppression: > 30 dB @ 2.4 kHz
  - Jitter sensitivity: all PLLs error-free at 100 ns
  - MADI: 32 channels @ 96 kHz, 16 channels @ 192 kHz
  - ADAT: 16 channels @ 96 kHz (S/MUX), 8 channels @ 192 kHz (S/MUX4)
  - Digital inputs: MADI optical, MADI coaxial, 4 x ADAT optical
  - Word Clock: BNC I/O
  - Remote control: MIDI I/O
  - Level meters: 32 x 6-LED per channel
  - Features: SteadyClock, SyncCheck, Automatic Delay Compensation when stacking units, noise suppression on power cycling, permanent settings storage
