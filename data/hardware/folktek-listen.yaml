name: Listen
manufacturer: folktek
primaryCategory: preamp
categories:
  - modular
  - microphone
url: https://folktek.com/products/listen
description: Listen is a Eurorack module offering two independent microphone
  amplifiers to boost low-level signals such as mics or contact mics to Eurorack
  standard audio level.
details: |-
  A simple module which offers two individual mic amplifiers with 3.5mm input, 3.5mm output and level control with power light. Use this to amplify mics, contact mics or boost lower level signals. Pairing with Synesthesia adds a new level of tactility and performance. LEVELS

  - Accepts low level signal and amplifies them to 5v peak to peak Eurorack standard audio output. SPECS

  +12V: 15mA -12V: 15mA +5V: 0mA
  4HP width
  25mm depth
  View on modular grid: https://www.modulargrid.net/e/folktek-listen
