details: |-
  Building on our studio monitor legacy, MC-350 Professional Closed-Back Headphones offer stunning stereo imaging, vocal clarity, and present but not harsh high end.

  The precision-tuned, closed-back design features reference-quality 50mm drivers for excellent isolation and distortion-free audio.

  With an emphasis on stereo imaging, midrange clarity, and accurate low frequency reproduction, MC-350 is perfect for mixing, reference, and audiophile listening.
