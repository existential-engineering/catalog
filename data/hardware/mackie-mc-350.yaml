details: |-
  Stunning clarity and depth

  Building on the Mackie studio monitor legacy, MC-350 Professional Closed-Back Headphones offer stereo imaging, vocal clarity, and present but not harsh high end. The precision-tuned, closed-back design features reference-quality 50mm drivers for excellent isolation and distortion-free audio. With an emphasis on stereo imaging, midrange clarity, and accurate low frequency reproduction, MC-350 is suited to mixing, reference, and audiophile listening.

  High-Performance Monitoring Headphones

  High-headroom, reference-quality 50mm transducers provide an accurate reproduction of your mix and your music, and the precision-tuned enclosure delivers punchy bass and enhanced high frequency detail for an ultra-wide soundstage.

  Professional Design

  A premium real leather adjustable headband and conforming ear pads provide an ergonomic fit for hours of comfort while ensuring optimal low-end and sound isolation. The rugged design is built to last and meet the demands of professionals in the studio or on location.

  Cables and Accessories

  Premium cables with locking bayonet connectors are included: a 9.8 ft fabric-jacketed straight cable, a 4 ft coiled cable, and a 4 ft straight cable with phone control and mic, along with a gold-plated 1/4-inch adapter and a premium protective case.
