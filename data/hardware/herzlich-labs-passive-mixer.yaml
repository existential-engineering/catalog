description: A passive averaging mixer that accepts up to three inputs of audio,
  CV, envelopes, clock, or triggers. It succeeds the Herzlich Labs Plenum with
  the same function in a nicer enclosure.
details: |-
  The art of mixing

  Mixing, the adding together of stuff, is very important in music and in life, but mostly in music. The 0hp Passive Mixer succeeds the beloved Herzlich Labs Plenum by doing exactly the same thing, but enclosed in a much nicer box. The 0hp Passive Mixer is designed to be fully non-judgmental in terms of your input: this is a safe space for audio signals, CV, envelopes, clock, triggers, or all at once, if for some reason that is your inmost desire. It also works very well as a solution to the question: "how do I mix together these Pocket Operators and Volcas so I can jam out in my local coffee roastery?" - just keep it in your headphones, pal.
specs: |-
  - Accepts both CV and audio signals
  - Up to three input passive mixing
  - Passive design: no external power, no batteries
