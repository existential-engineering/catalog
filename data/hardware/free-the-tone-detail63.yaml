description: The SILKY GROOVE SG-1C is a compressor pedal for guitar and bass
  with a dry mix circuit, based on the SILKY COMP from Free The Tone's Custom
  Series.
details: |-
  The SILKY GROOVE is a compressor in Free The Tone's standard product line. It is based on the SILKY COMP from the maker's Custom Series, inheriting that unit's sound while adding functions and ease of use, and it newly incorporates a dry mix circuit that guitarists and bassists had asked for.

  The dry mix circuit was designed with the phase relationship between the effect and dry signals in mind, so that the two sounds are not heard separately when mixed together. The mix range runs from a heavily compressed effect sound with no dry signal at all through to a fast, strong signal made up of the dry sound alone.

  Compressors can be difficult to set, so the compression circuit's controls were optimised to make adjustment easier. The ATTACK knob sets the strength of the incoming sound and the SUSTAIN knob varies the depth of compression to control sustain, and both have a gentle curve that prevents rapid changes, so a setting can be found quickly.

  The maker's stated aim is silky-smooth and natural compression that does not impair the true sound characteristics of the guitar or bass or the subtle nuance of plucking and picking, for uses such as precise arpeggios, sharp rhythm tone, solo tones, articulated bass bottom end and slaps.

  The HTS (Holistic Tonal Solution) circuit performs impedance conversion while bringing out the instrument's sound characteristics, and prevents degradation of the guitar or bass timbre even when the effect is switched off. The output signal is in the same phase as the input signal, so there is no phase reversal to allow for.
specs: |-
  - Input impedance: min. 500k Ohm
  - Output load impedance: min. 10k Ohm
  - Controls: SUSTAIN, ATTACK, DRY MIX, LEVEL
  - Terminals: 2 x 1/4 inch standard phone jacks (input, output), DC9V input jack (for AC adapter connection)
  - Power supply: 9-volt PP3 battery, or 9V DC center negative polarity
  - Current consumption: 7 mA
  - Dimensions (W x D x H): 72 x 115 x 50 mm including protuberances such as footswitches and jacks
  - Weight: approx. 230 g excluding accessories
  - Output signal in the same phase as the input signal
