description: The 9303 has a contoured basket to accommodate smaller 10″ to 12″ snare drums.
details: |-
  The 9300 Series Snare Stands are the only stands designed with double pedal set-ups in mind. The offset basket allows optimal snare positioning while remaining balanced. The 9303 has a contoured basket to accommodate smaller 10″ to 12″ snare drums.

  The snare basket knob can be easily reversed, allowing the basket to be in a more closed position for holding smaller drums, and the basket can be removed from the tilter for quick snare changes. The snare drum angle adjustment locks firmly with the Large Reset Handle and double locks with TechLock.

  Plastic tube insulators inside the heavy gauge tubing avoid rattling when drum mics are placed close to the stand, and hinged memory locks at the tube joints and tripod leg assemblies guarantee repeatable height settings.

  Trusted by today's best drummers, DW's flagship hardware line is loaded with cutting-edge innovations for superb performance and durability. The 9000 Series sets the standard for drummers who demand the best.
specs: |-
  - Contoured basket for 10″ to 12″ snare drums
  - Offset basket designed for double pedal set-ups
  - Reversible snare basket knob for a more closed basket position
  - Large Reset Handle with TechLock double locking angle adjustment
  - Removable snare basket for quick snare changes
  - Plastic tube insulators inside the heavy gauge tubing to avoid rattling
  - Hinged memory locks at tube joints, cymbal arms and tripod leg assemblies
