name: BASS 08
manufacturer: hedd
primaryCategory: subwoofer
url: https://hedd.audio/products/bass-08
description: An ultra-compact DSP subwoofer with an 8-inch driver, offering
  remarkable low-frequency performance and extensive DSP tuning as an entry
  point into professional audio.
details: |-
  The BASS 08 is a compact DSP subwoofer designed as an ideal entry point into the professional audio world, with remarkable low-frequency performance and a host of DSP-enabled features for greater control and adaptability to any space. It is conceived as a complement to HEDD's TYPE 05 and TYPE 07 2-way monitors and slots easily into any satellite-subwoofer system or as an enhancement to an audiophile home system.

  A high-end 32-bit SHARC DSP processor enables comprehensive tuning. Users can leverage the HEDD CTRL software for advanced system management and achieve a complete linear-phase setup with MK2 monitors. The subwoofer includes satellite offset control for positioning compensation, adaptive crossover filters with a Home Cinema Low Frequency Extension mode, and extended bass response down to 19 Hz in LFE mode.

  Core features include the HEDD Lineariser, Closed or Ported (CoP) operation, Group Delay Compensation (GDC), LFE mode, and variable phase and crossover controls.
specs: |-
  - Main features: HEDD Lineariser, CoP, GDC, LFE, variable phase and crossover
  - DSP: custom high-resolution 96 kHz / 32-bit AD/DA converter
  - Driver: 8-inch woofer with 2-inch voice coil
  - Amplification: 300 W ICEpower (85-264 V input)
  - Frequency range: 24 Hz to 200 Hz (LFE mode: 19 Hz to 200 Hz)
  - Maximum SPL: 105 dB at 1 meter
  - Dimensions: 392 x 290 x 400 mm
  - Weight: 17 kg
  - Inputs: analog XLR (22 kOhm) and digital 2-channel AES (XLR)
  - Outputs: filtered analog XLR (22 kOhm) and digital AES pass-through
  - Power: universal 85-264 V (IEC connector)
  - Warranty: 5 years (with registration)
