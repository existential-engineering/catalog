description: Clean design. Dirty tone. Stripped-down, yet surprisingly
  versatile. The single SPLIT/KING pickup at the bridge delivers three totally
  different tonal options. Raw tone has never been better.
details: |-
  The Senior is a single pickup electric guitar built around a chambered body, described as focusing on a raw and punchy rock tone. The body is solid mahogany with large sound chambers under a carved solid maple top, which Duesenberg says makes for a lighter and more resonant guitar than a regular solidbody construction. It measures 44 x 32.5 cm (17.32" x 12.6") with sides 4.5 cm (1.8") high, carries cream binding and is finished in PUR lacquer.

  The neck is a set-in, one-piece mahogany neck in a Medium D shape, 42.5 mm (1.67") at the nut and 52 mm (2.05") at the 12th fret, with a steel dual-action trussrod and a rosewood headstock. The Indian rosewood fingerboard has a 305 mm (12") radius, cream dot inlays and 22 jumbo frets (2.8 x 1.0 mm) over a 648 mm (25.5") scale. Duesenberg's Plek process is applied to the fretboard as the basis for the hand setup work.

  Electronics are a single Duesenberg SplitKing humbucker at the bridge under a "Phonico" pickup cover, with one volume control and a 3-way rotary switch. The Split/King is not a splittable humbucker: it houses a real singlecoil that a second, specially designed coil extends to a full humbucker, so the switch selects true singlecoil, true humbucker, or a third in-between mode where both coils are mixed. The mode selector sits at the cutaway. There is no neck pickup.

  Hardware is nickel finished and includes Duesenberg Z-Tuners, a Duesenberg Wraparound Bridge and Duesenberg Standard strap pins that are Straplock compatible. Strings are Duesenberg Custom 10/50 (010-013-017-028-042-050). The guitar is offered in two finishes, all-over Blonde or all-over high-gloss Black.

  A Duesenberg Custom Line Bag is included, with high impact internal padding, a black plush lining, external storage pockets, tuck-away shoulder straps, a padded handle and an adjustable neck pillow. A Duesenberg Custom Line Case for Senior is available separately, and all required allen keys are included.
