description: >-
  The Ensoniq Mirage was one of the first affordable sampler workstations and Ensoniq's
  debut commercial product, combining 8-bit sampling with analog filters and a built-in
  sequencer in a package that originally listed under $1,700.
details: |-
  Introduced in 1984 as the DSK-8, the Mirage preceded the EPS and EPS-16+ in Ensoniq's sampler lineup. Its 8-bit sampling engine maxed out at 32 kHz with 128 KB of RAM, yielding lo-fi but characterful results. A built-in 3.5-inch disk drive handled loading and storing samples, sequences, and even the operating system, with each disk holding up to six samples and eight sequences.

  What set the Mirage apart from pure digital samplers was its analog signal path. A true analog VCF provided lowpass filtering with keyboard tracking, complemented by five-stage envelopes for both VCA and VCF plus an LFO. The keyboard split into two independent halves for upper and lower sounds, though sample editing required working with hexadecimal codes.

  The original DSK-8 had a black steel chassis and weighted Pratt-Reed keyboard, later updated with a Fatar keyboard and gray chassis. Despite its limited specs, the Mirage's sample library has proven enduringly useful, and its analog filters give it a warmth that purely digital samplers lack. It has been used by Skinny Puppy, Vangelis, Jimmy Edgar, and Jimmy Jam and Terry Lewis.
specs: |-
  - Polyphony: 8 voices
  - Sampler: 8-bit, up to 32 kHz (6.5 seconds at 10 kHz)
  - Filter: Analog lowpass with 5-stage envelope
  - VCA: 5-stage digital envelope
  - Keyboard: 61 keys with velocity (weighted Pratt-Read/Fatar)
  - Memory: 16 internal patches, 128 KB sampler RAM, 3.5-inch diskette
  - Sequencer: 333-note capacity
  - Outputs: Mono
  - Control: MIDI
  - Date produced: 1984-1988
