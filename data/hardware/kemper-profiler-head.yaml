name: PROFILER Head
manufacturer: kemper
primaryCategory: amp-sim
categories:
  - guitar-amplifier
  - modeling
  - multi-effect
  - digital
url: https://www.kemper-amps.com/shop/profiler-head-b.html
prices:
  - amount: 1498
    currency: USD
description: The all-in-one solution for playing live, at home or in the studio
  – now in its second generation.
specs: |-
  - Dimensions: H 21.7 cm (8.54 in) × W 37.8 cm (14.88 in) × D 17.3 cm (6.81 in)
  - Weight: 5.32 kg (11.73 lbs)
  - Front INPUT: 1/4-inch TS unbalanced, dynamic range 127 dB, impedance 1 megohm
  - ALTERNATIVE INPUT: 1/4-inch TRS balanced with ground lift, dynamic range 111 dB, impedance 825 kohms
  - RETURN: XLR balanced, 1/4-inch balanced with ground lift, dynamic range ≥105 dB, impedance 825 kohms
  - MAIN OUTPUT L and R: XLR balanced + 1/4-inch TS unbalanced with ground lift, output level: XLR +4 dBu, TS +4 dBu
  - MONITOR OUTPUT: 1/4-inch TS unbalanced with ground lift, output level: +4 dBu
  - DIRECT OUTPUT/SEND: 1/4-inch TS unbalanced with ground lift, output level: +4 dBu, dynamic range >108 dB
  - HEADPHONE Output: 1/4-inch TRS stereo, 32–600 ohms, 330 mW @ 32 ohms, 220 mW @ 600 ohms
  - S/PDIF Input/Output: 44.1/48/88.2/96 kHz (24-bit), master and slave, RCA connectors
  - USB audio: 8 channels (MK 2) or 4 channels (MK 1) with Windows/macOS at 44.1 kHz
  - USB: USB 2.0 (FS) device, USB-A and USB-B connectors
  - SWITCH/PEDAL: two 1/4-inch TRS, each for mono/stereo switch or expression pedal (10 kohm min, 100 kohm max)
  - MIDI IN/OUT/THRU: 5-pin DIN connectors
  - Network: RJ45 connector (for PROFILER Remote connection)
  - Line Voltage: 90–275 V AC, max. 0.5 A
  - Frequency: 50 Hz to 60 Hz, single phase
  - Operating Temperature: 5° to 45° C (41° to 113° F)
