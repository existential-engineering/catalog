details: |-
  The PRS S2 Standard 22 is an all-mahogany workhorse guitar for gigging musicians. With vintage sweetness, warmth, and full tone, the S2 Standard 22 excels both plugged straight into an amp and with a modern pedalboard.

  The S2 Standard 22’s solid mahogany body and set neck give this guitar a distinctive resonance and powerful sustain, and when mahogany’s rich, round tone meets the Maryland, USA-made PRS 58/15 LT pickups, there are plenty of clear highs and strong mids to be dialed in. Accentuate your playing without going out of tune with the PRS patented tremolo, and explore an array of tones with the 5-way blade pickup switch.

  For the first-time player or the serious musician who wants to cover a lot of ground with their music, the S2 Standard 22 is a perfect choice.
