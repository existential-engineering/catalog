details: |-
  VEIL is a three layer subtractive compositor allowing users to stack luma signals and create the effect of perceived depth. The opacity of top layers may be adjusted to obstruct or reveal lower layers. Each knob at the CW position will result in its respective layer appearing to sit on top of the lower layers without "white-blowout" while CCW will approach the function of a typical additive mixer. VEIL is best used with gradients and can be used in series or parallel with other VEIL modules for a multitude of expandable capabilities. Using two or more VEIL modules in series increases the number of stackable layers and using three VEIL modules in parallel allows users to stack and control the opacity of multiple full-color RGB video sources.
