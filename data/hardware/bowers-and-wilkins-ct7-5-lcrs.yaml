description: The entry-level speaker in the range, the CT7.5 LCRS delivers
  outstanding spaciousness, imaging and definition through its single 7in Aramid
  Fibre CT700 Series bass/midrange drive unit.
details: |-
  The CT7.5 LCRS is a two-way vented-box Custom Theatre loudspeaker and the entry-level model in the Bowers & Wilkins CT700 Series. It is a passive design intended to be installed inside home theatre cabinetry and driven from an external power amplifier or from a channel of a distribution amplifier such as the CDA series.

  Bowers & Wilkins describes the Custom Theatre 700 Series as bringing 700 Series technology and craftsmanship to a home cinema set-up at a cost-effective mid-range price. The three models in the range integrate seamlessly with home theatre cabinetry and can each be positioned as left, centre, right or surround speakers, which is what the LCRS suffix denotes.

  Each speaker in the series uses a high-sensitivity Nautilus tube-loaded tweeter designed specifically for the reproduction of movie soundtracks, together with a first-order tweeter crossover filter for minimal signal degradation. Combined with the Aramid Fibre drive units, Bowers & Wilkins states the result is life-like, dynamic movie sound quality.

  The CT7.5 LCRS pairs a 25mm (1in) cloth dome high-frequency unit with a single 180mm (7in) woven Kevlar (Aramid Fibre) bass/midrange cone, loaded by a Flowport vented enclosure. Sensitivity is 92dB spl (2.83V, 1m) and nominal impedance is 8 ohms with a 4.6 ohm minimum, so Bowers & Wilkins recommends 50W to 120W of amplifier power into 8 ohms on unclipped programme.

  The grille is magnetically attached. The cabinet is finished in black paint with a black cloth grille, and this is the only finish offered.
specs: |-
  - Description: 2-way vented-box system
  - Drive units: 1x 25mm (1in) cloth dome high-frequency; 1x 180mm (7in) woven Kevlar (Aramid Fibre) cone bass/midrange
  - Technical features: Nautilus tube-loaded tweeter, Aramid Fibre bass/midrange cone, Flowport, magnetically attached grille
  - Frequency range: -6dB at 48Hz and 28kHz
  - Frequency response: 55Hz - 22kHz +/-3dB on reference axis
  - Dispersion (within 2dB of reference response): horizontal over 60 degree arc, vertical over 10 degree arc
  - Sensitivity: 92dB spl (2.83V, 1m)
  - Harmonic distortion (2nd and 3rd harmonics, 90dB, 1m): <1% 100Hz - 20kHz
  - Nominal impedance: 8 ohms (minimum 4.6 ohms)
  - Crossover frequency: 4kHz
  - Recommended amplifier power: 50W - 120W into 8 ohms on unclipped programme
  - Max. recommended cable impedance: 0.1 ohms
  - Dimensions: height 305mm (12in), width 444mm (17.5in), depth 265mm (10.5in), depth with grille 288mm (11.3in)
  - Net weight: 11.6kg (25.6 lb)
  - Finishes: cabinet black painted, grille black cloth
  - Passive: no on-board amplifier and no mains inlet, driven from an external power amplifier
  - Rear panel connections: one pair of binding post terminals and one Neutrik speakON socket (speakON plug supplied)
  - Shares its owner's manual with the CT7.3 LCRS and CT7.4 LCRS
