description: The entry-level speaker in the range, the CT7.5 LCRS delivers
  outstanding spaciousness, imaging and definition through its single 7in Aramid
  Fibre CT700 Series bass/midrange drive unit.
details: |-
  The CT7.5 LCRS is the entry-level model in the Custom Theater 700 Series, a two-way vented-box speaker built around a single 180mm (7in) Aramid Fibre bass/midrange drive unit and a 25mm (1in) cloth dome tweeter. The product page lists it as a Custom Theater two-way vented-box speaker in a Black finish.

  The information sheet describes the range as a way to experience home cinema as it was meant to be heard, bringing 700 Series technology and craftsmanship to a home cinema set-up at a cost-effective mid-range price.

  The three models in the range integrate seamlessly with home theatre cabinetry and can each be positioned as left, centre, right or surround speakers. Each speaker uses a high sensitivity Nautilus tube-loaded tweeter designed specifically for the reproduction of movie soundtracks, along with first-order tweeter crossover filters for minimal signal degradation. Combined with the Aramid Fibre drive units, the result is life-like, dynamic movie sound quality.

  CT700 Series speakers carry a pair of binding post connection terminals and one Neutrik Speakon connection socket on their rear panels. The binding post terminals provide quick and easy connection of stripped wires, while the Speakon socket provides a more secure and reliable connection method. On the Speakon plug the positive cable goes to the terminal marked +1 and the negative cable to the terminal marked -1. Foam plugs can be fitted in the Flowport tubes to reduce the volume of bass.
specs: |-
  - Description: 2-way vented-box system
  - Technical features: Nautilus tube loaded tweeter, Aramid Fibre bass/midrange cone, Flowport, magnetically attached grille
  - Drive units: 1x ø25mm (1in) cloth dome tweeter
  - Drive units: 1x ø180mm (7in) Aramid Fibre cone bass/midrange driver
  - Frequency range: -6dB at 48Hz and 28kHz
  - Frequency response: 55Hz to 22kHz ±3dB on reference axis
  - Dispersion (within 2dB of reference response): horizontal over 60° arc, vertical over 10° arc
  - Sensitivity: 92dB spl (2.83V, 1m)
  - Harmonic distortion (2nd and 3rd harmonics, 90dB, 1m): <1% 100Hz to 20kHz
  - Nominal impedance: 8Ω (minimum 4.6Ω)
  - Crossover frequency: 4kHz
  - Recommended amplifier power: 50W to 120W into 8Ω on unclipped programme
  - Max. recommended cable impedance: 0.1Ω
  - Dimensions: Height 305mm (12in), Width 444mm (17.5in), Depth 265mm (10.5in), Depth with grille 288mm (11.3in)
  - Net weight: 11.6kg (25.6lb)
  - Connections: pair of binding post terminals plus one Neutrik Speakon socket on the rear panel
  - Finishes: Cabinet Black painted, Grille Black cloth
