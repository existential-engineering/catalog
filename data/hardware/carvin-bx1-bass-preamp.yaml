specs: |-
  - Overview
  - Specifications
  - Video/Review
  - The BX1 Bass Preamp offers classic, natural bass tone with unprecedented tonal control and extended headroom. The BX1 begins with a boutique flat response, then we add extensive tone control allowing you to carve out your signature sound. Harmonic content increases as you turn up the INPUT GAIN control, producing the rich harmonics you desire from your preamp. Lightweight, compact design, bullet-proof construction and a list of indispensable features assure the BX1 will be the heart of your tone for years to come.
  - BX1 FEATURES: » Preamp GAIN and master VOLUME controls » BLEND control adjusts the EQ/dry mix » Mid sweep semi-parametric EQ » COMPRESSOR: Threshold and Strength controls » Effects Loop » True Bypass » Switchable MUTE » DIRECT OUT balanced XLR and 1/4-inch » Switchable Ground Lift for AC ground isolation » THRU/TUNER output jack independent of MUTE switch » -12dB attenuation switch » Solid metal shaft controls with threaded metal bushings mounted to top panel » 9V Power supply included. 90-230VAC, 50-60Hz » Battery compartment for 9V battery operation BX1 SPECIFICATIONS: » Frequency Response: 25Hz-18kHz » Input Gain: 13dB » Input Impedance: 2.2M » Maximum Input: -6dB » Maximum Output: MAIN + 6dB, EFF SND/RTN + 4dB THRU/TUNER -6dB » Tone controls: +/-10dB BASS (25Hz-100Hz), MID (semi parametric sweep 100Hz-2.5kHz), TREBLE (3kHz-18kHz) » Power requirement: 9VDC/50mA. Polarity: Center Negative Plug » 9V Power supply included. 90-230VAC, 50-60Hz » Dimensions: 6"W x 5.5"D x 2.5" H Wt. 2lbs.
