details: |-
  The Microtubes B1K is a compact mini bass distortion pedal that brings Darkglass Electronics' legendary Microtubes distortion circuit into a portable and functional form factor. The first of its kind in an all-new lineup, it offers the classic Microtubes sound in a small and straightforward pedal suitable for boards with limited space.

  The pedal features an intuitive front-panel layout with concentric Level and Drive controls, while housing secondary tone-shaping parameters internally. These hidden controls, Tone and Blend, plus internal switches for Grunt and Mid Boost, allow musicians to fine-tune their sound without cluttering the pedal's surface. The Grunt switch adds low-end thickening, while the Mid Boost provides a presence peak to cut through dense mixes.

  Built to professional standards with attention to durability, the B1K emphasizes straightforward functionality and reliability. It runs on standard 9V DC center-negative pedal power (30 mA draw).
specs: |-
  - The Microtubes distortion tone in a mini pedal
  - Straightforward design in a reliable form factor
  - Concentric Level and Drive control knobs
  - Internal Tone and Blend controls with easy access
  - Internal switches for Mid Boost and Grunt with easy access
  - Standard 9V DC center-negative pedal power (30 mA)
