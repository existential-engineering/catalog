description: An 8-step CV sequencer module with adjustable CV per step, reset
  functionality including reset on power-up, and a buffered output.
details: |-
  An updated version of the SEQ8.2 sequencer module - functionally the same as its predecessors but now quite a bit cheaper. As one of my 'high turnover' modules (ie. I sell a lot of 'em) the bulk of the assembly is now handled by the board fabricators with the final assembly and testing taking place 'in house'. There are several advantages to this: first, I can take advantage of the fact that parts from the fabricator are very cheap (economies of scale etc.) and second, I spend far less time faffing around with surface-mount components, leaving me to do final fitting of any through-hole parts plus any testing. 8-step, adjustable CV on each step and reset functionality, with reset on power-up as standard and 6HP wide. This is an updated version of the original module - it now has a buffered output which should prevent impedance mismatches with certain CV mixers. Both clock and reset will trigger on the rising edge of an incoming signal - furthermore, the sequencer will be held at step 1 for as long as the reset signal is high. Counting will not resume until the reset signal goes low again. NOTE: If you want a module with micro-knobs rather than the larger 10mm knobs shown in the first photos, let me know and I'll endeavour to accomodate you. 6HP wide.
