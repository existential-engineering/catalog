description: "- Limited Run - The Definitive Clean Boost - Our Best Katana EVER"
details: |-
  This is the reissued Keeley Katana Clean Boost, offered for a limited time in a black colorway. The circuit returns to the original JFETs and component values of the first Katana, with the boost mode reworked for a more robust and clearer sound that keeps bass notes defined. The build uses modern construction methods and an aluminium control knob meant to be adjusted on the fly with a foot.

  The pedal has two modes, Pure Clean and High Gain, selected by the control knob. Pushed in, the knob acts as a volume control with a large amount of headroom on tap. Pulled out, the pedal becomes a fat, harmonically rich cutting boost with some gain, which the maker describes as not quite an overdrive but closer to overdriven tube grit. It can be left on permanently to push an amp harder or used as an occasional lead boost.

  Dual FETs provide the tube-like character in a transistor design, and an internal charge pump nearly doubles the operating voltage from the 9V supply for high headroom. The input is 9 VDC maximum, since the doubler works from that rail.

  The Katana circuit is Robert Keeley's first guitar effect design. It began as part of the Time Machine Boost before becoming an independent product after the original Keeley Compressor.
specs: |-
  - Two modes, Pure Clean and High Gain, selected by pushing or pulling the control knob
  - Knob pushed in: volume control with a large amount of boost available
  - Knob pulled out: cutting boost with added gain and tube-like grit
  - Dual Class A JFET circuit
  - Internal charge pump nearly doubles the operating voltage
  - Power: 9 VDC maximum input voltage
  - Aluminium control knob designed for foot adjustment
  - Limited run in a black colorway
