details: |-
  The Pino Palladino Signature StingRay Bass captures the iconic tone and feel of one of the most influential bass players of all time. Inspired by Pino's original 1979 fretless StingRay, this signature model is available in both fretted and fretless versions, each designed to deliver his unmistakable tone and playability.

  It features a poplar body finished in '79 Burst, a dark-tinted maple neck with a thin rosewood fingerboard, and a unique asymmetrical neck carve that mirrors the shape of Pino's original bass. The custom pickup, built to a late-70s recipe with shorter pole pieces, pairs with a preamp voiced to replicate the warmth and character of Pino's aged circuit.

  Brass saddles, a GraphTech NuBone nut, and artist-series neck plates round out the period-correct details. The fretted model is strung with Pino Signature Smoothie Flats for a rich, thumpy tone, while the fretless version uses custom-gauge Ernie Ball Slinky Nickel Wound strings for smooth, expressive slides. Each bass ships in a Mono Case.
specs: |-
  - Body wood: Poplar
  - Body finish: High gloss polyester
  - Body color: '79 Burst
  - Neck wood: Maple
  - Neck finish: Polyester (dark orange tint)
  - Neck width: 1.686" at nut, 2.458" at heel
  - Neck radius: 7.5"
  - Neck attachment: 3-bolt, Pino Palladino signature neck plate
  - Fingerboard: Rosewood
  - Fret markers: White dot (fretted) / unlined (fretless)
  - Frets: Nickel (fretted) / fretless option available
  - Scale length: 34"
  - Truss rod: Traditional bullet nut at headstock; walnut skunk stripe on back of neck
  - Pickup: Late-'70s voiced Music Man humbucker with flush-sitting pole pieces
  - Controls: 2-band active preamp; 25k volume, 500k treble, 100k bass
  - Bridge: Pre-EB geometry Music Man chrome-plated steel plate with brass saddles and stainless steel spring mutes
  - Pickguard: 3-ply black/white/black
  - Tuning machines: Schaller bass
  - Strings (fretted): 38w-54w-68w-98w Extra Light Pino Palladino Smoothie Flats
  - Strings (fretless): 36w, 55w, 65w, 90w custom-gauge Ernie Ball Slinky Nickel Wound
  - Case: Mono
