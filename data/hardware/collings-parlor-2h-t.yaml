description: The Parlor 2H T is a Traditional Series 12-fret acoustic guitar
  drawing inspiration from some of the earliest steel string guitar designs that
  form the roots of the modern acoustic guitar family tree. Originally
  popularized in the late 19th century, this parlor-sized instrument offers
  exceptional tonal balance and responsiveness along with portability and a
  comfortable feel. It pairs a Sitka spruce top with East Indian rosewood back
  and sides, featuring vintage-inspired appointments including ivoroid binding
  with herringbone purfling, a slotted peghead, and Waverly engraved bronze
  tuners.
details: |-
  The Parlor 2H T belongs to the Traditional Series, which applies pre-war build techniques and voicing to a compact parlor body shape. The guitar features a Sitka spruce top braced with a custom Traditional Series pre-war scalloped X-brace with an abbreviated soundboard graft (tongue brace), paired with East Indian rosewood back and sides. The Honduran mahogany neck has a Modified V profile and joins the body at the 12th fret via a mortise and tenon hybrid neck joint. The 14" to 26" compound radius ebony fingerboard is inlaid with gold mother-of-pearl short diamond and squares. A tapered slotted square peghead with volute carries Waverly engraved bronze 3-on-a-plate tuners with ivoroid buttons. Appointments include ivoroid body binding with small brown herringbone purfling, a 2-style zipper backstrip, a custom wood rosette, bone nut and drop-in bone saddle, and an ebony pyramid-style bridge with 2 5/16" petite string spacing.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Construction: Traditional Series Build and Voicing
  - Scale Length: 24 7/16"
  - Nut: Bone, 1 3/4"
  - Saddle: Bone, drop-in
  - Neck Profile: Modified V
  - Fingerboard: Ebony, 14" - 26" compound radius
  - Fingerboard Inlays: Gold MOP short diamond & squares
  - Frets: Medium 18% nickel-silver
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Brace Material: Sitka spruce
  - Brace Pattern: Custom Traditional Series pre-war scalloped X-brace (abbreviated soundboard graft / tongue brace)
  - Bridge: Ebony pyramid-style, 2 5/16" spacing
  - Bridge Pins/End Pin: Ivoroid with black dot
  - Tuners: Waverly Engraved Bronze 3-on-a-plate with ivoroid buttons
  - Peghead Profile: Tapered slotted square with volute
  - Peghead Veneer: Stained exotic ebony with gold MOP Collings logo
  - Body Binding: Ivoroid with small brown herringbone purfling
  - Backstrip: 2-style (Zipper)
  - Rosette: Custom wood rosette
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 12 1/4"
  - Body Length: 18 5/16"
  - Body Depth: 4"
  - Total Length: 37 1/4"
  - Strings: D'Addario EJ-26 (.011"-.052")
