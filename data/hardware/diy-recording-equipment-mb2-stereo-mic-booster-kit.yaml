description: A two-channel inline mic booster kit that provides 26dB of extra
  clean gain for ribbon and dynamic microphones, with high input impedance and
  phantom power protection.
details: |-
  Get the most out of your ribbon and dynamic mics in the studio or for your podcast. The MB2 is a two-channel inline mic booster with better performance than more expensive competitors. Boosted performance. Sometimes ribbon and dynamic mics need a little more gain than a typical mic preamp can provide. In these cases the MB2 provides 26dB of extra gain with ultra-low noise and distortion. The MB2's high input impedance is optimized to capture the full audio spectrum of ribbon mics without damping the ribbon. And MB2's buffered, low-impedance outputs are great for driving long cable runs without noise or gain loss. Superior specs. Don't be fooled by the low price—the MB2's premium parts and no-compromise design make for better specs than the leading inline mic boosters. ($150/channel)
