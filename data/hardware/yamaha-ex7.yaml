description: >-
  The Yamaha EX7 is a 61-key synthesizer built around Yamaha's Extended
  Synthesis system, combining AWM sampling, AN analog physical modeling, and
  FDSP digital sound processing in a single instrument. It features 64-voice
  polyphony, an integrated sampler with up to 65 MB of expandable memory, and a
  built-in 16-track sequencer. The EX7 also includes a 4-track arpeggiator,
  extensive effects processing, and a rich set of performance controllers
  including six assignable knobs and a ribbon controller.
details: |-
  The EX7 incorporates multiple synthesis engines working in tandem. AWM (Advanced Wave Memory) Synthesis uses sampled waveforms with comprehensive control via envelope generators, filters, and modulation. AN (Analog Physical Modeling) Synthesis delivers classic analog synth characteristics with digital stability. FDSP (Formulated Digital Sound Processing) adds note-dependent effect processing for dynamic, responsive sounds.

  Each voice combines up to four independent wave elements from various tone generators, enabling complex timbral layering. The sampling system features 1 MB of sample memory, expandable to 65 MB via SIMMs, with mic or line input. Samples support WAV, AIFF, and AKAI formats, saveable to floppy disk or external SCSI storage.

  Performance capabilities include a 16-part Performance mode with up to 16 keyboard zones, two sequencers (a 16-track Song sequencer with 30,000 note capacity and an 8-track Pattern sequencer), and a 4-track arpeggiator with 50 preset and user patterns. The instrument provides six assignable controller knobs, pitch and modulation wheels, and a ribbon controller for expressive real-time control.

  Effects processing includes system effects with 12 reverb and 17 chorus variations, plus 79 insertion effects available through two independent processing units.
specs: |-
  - 64-voice polyphony
  - 61-key keyboard with 16 assignable zones
  - AWM, AN, and FDSP synthesis engines
  - 512 preset voices (256 preset + 256 internal)
  - 128 performance setups
  - 1 MB sampler memory, expandable to 65 MB via SIMMs
  - Optional 8 MB Flash Memory Boards
  - 16-track Song sequencer with 30,000 note capacity
  - 8-track Pattern sequencer
  - 4-track arpeggiator with 50 preset and user patterns
  - System reverb/chorus plus 79 insertion effects
  - 2 MIDI IN, 2 MIDI OUT, 1 MIDI Thru
  - 16-part multitimbral
  - Six assignable controller knobs, pitch wheel, two mod wheels, ribbon controller
  - WAV, AIFF, and AKAI sample format support
