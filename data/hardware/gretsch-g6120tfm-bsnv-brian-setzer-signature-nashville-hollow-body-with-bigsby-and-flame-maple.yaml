description: Gretsch is thrilled to be a part of Brian Setzer's pivotal legacy
  with the G6120TFM Brian Setzer Signature Nashville Hollow Body, a
  single-cutaway hollow body featuring tiger flame maple arched top, back and
  sides with 1959 trestle bracing and oversized F-holes.
details: |-
  By spearheading the rockabilly revival with the Stray Cats and jump-starting Big Band Swing with the Brian Setzer Orchestra, Brian Setzer has created a remarkable and lasting legacy. Gretsch is thrilled to be a part of Setzer's pivotal legacy with the G6120TFM Brian Setzer Signature Nashville Hollow Body.

  The single-cutaway hollow body features tiger flame maple arched top, back and sides with 1959 trestle bracing and oversized F-holes. Other performance-enhancing features include period-correct control locations with a three-position pickup toggle switch.
