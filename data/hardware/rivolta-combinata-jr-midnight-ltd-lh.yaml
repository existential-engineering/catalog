details: |-
  Story

  The Combinata Jr. Midnight LTD represents a deliberate shift in design philosophy: an exploration of Rivolta's darker, more stripped-back side. With Midnight, we focused on removing anything non-essential, committing to a single, cohesive visual language built around a monochrome, blackout hardware platform. For the first time on a Rivolta, and as a direct response to years of customer requests, the Combinata Midnight features a comfortable 24 3/4" scale length. The slightly shorter scale brings a subtly different feel and response to the instrument, adding a familiar slinkiness and warmth while opening up a new playing experience within the Rivolta lineup. Where our traditional models reflect Rivolta's heritage, the Combinata Midnight explores a more understated, contemporary side, built around focus, feel, and a stripped-back aesthetic that comes into its own when distractions fall away. Features and Specs

  Case Fit
