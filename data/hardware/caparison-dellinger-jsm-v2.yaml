details: |-
  The Dellinger-JSM-V2 model exudes a classic 'old school' meets the 'new school' flavour, with a new set of features that elevates it into an instant classic. The pickguard mounted Fishman single-coil neck pickup and coil tappable KsE signature bridge humbucker enables a wide range of tones from classic vintage to modern metal. The traditional control plate layout is practical and intuitive, and offers a deceptively wide range of options. Featuring a unique "WB" body structure, with a Walnut top and Australian blackwood back, the V2 model ensures a clear and focused mid-low range tone with enhanced note separation and a crystal clear, harmonically rich top end. A fast and smooth walnut/maple 5-piece neck ensures fatigue free playability and stability. A re-designed Caparison Fixed Bridge, with a more comfortable palm mute ergonomic, provides impeccable clarity, solidity and balance, while the Gotoh locking tuners and Graph-Tech nut ensure consistent and stable tuning. The Dellinger JSM V2 is available in Tobacco Sunburst and Vintage White, perfectly complementing the traditional aesthetic of this stunning instrument. "This new incarnation of the Dellinger JSM is a truly amazing guitar, and feels like a natural evolution from the previous model! It is capable of the same crushing metal and rock tones, but the single coil in the neck position and push/pull options open up a new world possibilities for clean tones. I absolutely love the looks of this guitar as well! It's a perfect blend of classic and modern stylings that only Caparison could pull off so effortlessly! Many thanks Itaru, Gabriel and everyone at Caparison for making another dream guitar of mine a reality!!! I hope anyone that gets their hands on one loves it as much as I do!!!" - Joel Stroetzel
