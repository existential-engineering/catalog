description: Denon DJ PRIME GO - Portable DJ Set, Smart DJ Console with 2 Decks,
  WIFI Streaming, 7-Inch HD Touchscreen and Rechargeable Battery
details: |-
  The Denon DJ PRIME GO is an ultra-portable, rechargeable standalone 2-deck DJ console offering up to 4 hours of internal battery runtime. It features a 7" HD multi-touch touchscreen for library navigation and waveform viewing, dual FX engines with assignable beat effects and sweep filters, dual independent microphone inputs with flexible monitoring, and built-in Wi-Fi for streaming directly from Beatport LINK, Beatsource LINK, SoundCloud GO+, TIDAL, and Dropbox. Onboard recording is supported to USB or SD media, the 2-channel mixer includes 3-band EQ, and 16 multifunction performance pads (8 per deck, dual banks) cover Hot Cue, Loop, Roll, and Slicer. The unit also offers timestretch / key shift, StagelinQ integration with lighting and video software, and integration with Engine DJ Desktop for library preparation.
specs: |-
  - Audio resolution: 24-bit / 44.1 kHz
  - Frequency response: 20 Hz - 20 kHz (+/-1 dB)
  - Dynamic range: >109 dB (A-weighted)
  - Signal-to-noise ratio: >92 dB (A-weighted)
  - Channel separation: <-88 dB
  - Output headroom (Master): >15 dB
  - Output headroom (Mic): >20 dB
  - Output headroom (Aux): >15 dB
  - Display: 7" HD multi-touch touchscreen
  - Decks: 2
  - Mixer: 2-channel with 3-band EQ
  - Performance pads: 16 (8 per deck, dual bank)
  - Microphone inputs: 2 independent level-controlled channels
  - Battery: rechargeable internal lithium-ion, up to 4 hours runtime
  - Power adapter: DC, Center Positive, 19V 3.42A
  - Power consumption: 30W maximum
  - Dimensions: 411mm W x 274mm D x 53mm H (16.2" x 10.8" x 2.1")
  - Weight: 3.68 kg (8.11 lbs, without USB / power cable)
