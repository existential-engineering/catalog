details: |-
  This is a Signature Edition reissue of the Keeley two knob vintage compressor, named for the face markings in Robert Keeley's own handwriting. The run was limited to 45 units sold direct and a further 50 through dealers.

  The two knob compressor is one of the pedals credited with starting the boutique pedal movement, and Keeley presents it as the standard other compressors are judged against. Its squishy compression became popular with country, blues and rock players, and the pedal is aimed at players after a very sustained sound.

  The compressor is made in the USA and took Guitar Player magazine's Editor's Pick award along with other awards across fourteen years in production. Keeley describes it as an audiophile and studio-grade compressor with rack mount quality in a stompbox enclosure.

  Switching is true bypass through a triple pole double throw switch, giving a clean unaffected signal in bypass, with an LED for effect indication. This was the first effect pedal to use a blue LED. It runs from a 9V battery or a standard 9V DC adapter at a 5mA current draw.
