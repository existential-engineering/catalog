url: https://products.electrovoice.com/na/en/ekx-15sp/
description: The EKX-15SP is a 15-inch powered subwoofer designed for portable
  sound applications. A 1300 W Class D amplifier drives an EVS-15C 15-inch
  woofer in a slot-ported, EVCoat-finished plywood enclosure delivering up to
  133 dB peak SPL with low-frequency extension to 40 Hz. QuickSmartDSP provides
  single-knob LCD-menu control over presets, EQ, and an adjustable low-pass
  filter (80/100/120/150 Hz), while Cardioid Control Technology enables
  directional output steering with up to 35 dB on-stage reduction when multiple
  units are deployed. The cabinet includes an M20 threaded pole mount plate,
  all-metal handles, and intelligent variable-speed thermal management.
details: >-
  Class D power amplifier rated at 1300 W


  EVS-15C 15-inch (381 mm) woofer


  QuickSmartDSP with single-knob LCD menu interface


  Cardioid Control Technology for directional output (up to 35 dB on-stage
  reduction with multi-unit deployment)


  Maximum SPL of 133 dB peak


  Frequency response 45 Hz - 150 Hz (-3 dB), 40 Hz - 180 Hz (-10 dB)


  Adjustable low-pass crossover: 80 / 100 / 120 / 150 Hz


  Intelligent thermal management with variable-speed fan


  Large slot ports for low distortion


  15 mm plywood enclosure with EVCoat finish and 18 AWG steel grille


  Metal grille with reinforcement bar


  M20 threaded pole mount plate for satellite-on-sub configurations
specs: |-
