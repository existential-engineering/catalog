description: A compact tube preamp collaboration between Milkman Sound and
  Benson Amps, featuring the signature preamp from Benson's Chimera and Monarch
  models. It can drive a speaker cabinet and route signal to a balanced XLR
  direct output with switchable cab sim and an internal headphone amplifier,
