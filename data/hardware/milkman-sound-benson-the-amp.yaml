details: |-
  Benson in a box

  ABOUT

  This collaboration between Milkman Sound and Benson Amps has been years in the making. We are so excited to present Benson The Amp which places the signature preamp from Chris' Chimera and Monarch amplifier models into a grab and go format. Similar to other models of The Amp, Benson The Amp can both drive a speaker cabinet and route instrument signals to a variety of of direct outputs including a balanced XLR output with switchable cab sim and the powerful internal headphone amplifier. Besides the Benson designed tube preamp, the cab sim has also been voiced by Chris Benson to sound nearly identical to his ceramic speakers. We added a Room control to simulate early reflections that you would get when playing a guitar amplifier in a room. This feature can be used out of the direct outputs but it also comes out of the speaker which can add room like presence to silent stages where cabinets are close mic'd in small isolation rooms. Stunning clean tones, saturated edge of breakup tones and all out tube amp overdrive can all be attained inside the box with simple adjustments of the top panel controls or by turning on the internal boost. Benson The Amp delivers the world of Benson into the convenient form factor of The Amp. Like all Milkman products, Benson The Amp is built by hand in California with the finest components available. WATTAGE

  50W 16ohm Output

  100W 8ohm Output

  200W 4ohm Output

  FOOTSWITCHES

  REVERB turns the internal reverb effect on and off

  BOOST turns on the internal 24dB boost circuit for extra midrange and drive

  DIMENSIONS & WEIGHT

  8-1/2" W x 3" H x 6-1/2" D 2.5lbs

  Benson The Amp Manual

  Demo

  Introducing Benson The Amp

  Chris and Tim explain the nuances of Benson The Amp
