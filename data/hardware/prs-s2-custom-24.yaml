details: |-
  The Custom 24 is the original PRS. Since its introduction, it has offered a unique option for serious players and defined PRS tone and playability. The S2 Custom 24 takes the original PRS guitar, the Custom 24, and re-imagines it with stripped-down features and a new aesthetic.

  Retaining the classic maple top/mahogany back combination with our classic body shape and an asymmetrical beveled top, this guitar has a resonant, powerful voice. Its versatility comes from its Maryland, USA-wound PRS 85/15 pickups and 5-way blade switch, offering all the same sounds as the flagship Custom 24. The PRS S2 Custom 24 now comes with PRS Phase III tuners, featuring a handsome open-back design, unplated brass shafts, and highly-usable gear ratio. Familiar for PRS players of old, and a fresh take for players of all types.
