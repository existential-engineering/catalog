details: |-
  The Gretsch G9126 A.C.E is the performance version of the popular G9126 Guitar-Ukulele, offering beautifully lilting ukulele tones to guitarists everywhere. With six strings tuned "A" to "A" in standard guitar intervals, the G9126 A.C.E. is perfect for extended-range uke arrangements.

  Its features include a 17" scale and convenient cutaway, Fishman Kula pickup/preamp system, solid quartersawn mahogany top, mahogany back and sides, one-piece mahogany neck, 19-fret ovangkol fingerboard with "snowflake" position markers and bone nut, ovangkol bridge with bone saddle, Grover Sta-Tite tuners and a deluxe fitted gig bag.

  The G9126 is available in Honey Mahogany Stain with an "open pore" semi-gloss finish.
