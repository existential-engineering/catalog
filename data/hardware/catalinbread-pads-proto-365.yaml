details: |-
  The Pads Proto 365 is a Proto Club release combining smeared reverb with four-voice chorus and square-wave tremolo, inspired by the pad-like vocal effect on Tame Impala's 'One More Year.'

  The long-decay reverb feeds into a four-voice chorus where each voice is tuned to soften a different harmonic element of the signal, creating a smeared, granular texture. A square-wave tremolo follows, with an adjustable duty cycle knob controlling the 'on time.' Lower duty cycle settings produce subtle rhythmic blips; the highest setting creates an intense stutter effect.
