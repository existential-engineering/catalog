details: |-
  The SE Custom 24 is the quintessential SE instrument, designed to faithfully reflect the PRS model that started it all. The SE Custom 24 Lefty

  brings classic PRS playability, reliability, and vibrant tone to the left-handed players of the world. Gig and studio ready, this model keeps all of the same foundational specifications as the SE Custom 24: maple top, mahogany back, wide thin maple neck, 24 frets, 25” scale length, the PRS patented tremolo, and dual 85/15 “S” pickups with a 3-way blade pickup switch and push/pull tone control for coil splitting.
specs: |-
  - Body Construction: Solidbody
  - Top Wood: Maple
  - Veneer: Flame Maple
  - Back Wood: Mahogany
  - Top Carve: Shallow Violin
  - Number of Frets: 24
  - Neck Wood: Maple
  - Neck Construction: Multi-Ply
  - Truss Rod: PRS Double-Acting
  - Neck Shape: Wide Thin
  - Fretboard Wood: Rosewood
  - Fretboard Inlay: Birds
  - Bridge: PRS Patented Tremolo
  - Tuners: PRS Designed Tuners
  - Hardware Type: Nickel
  - Nut: PRS
  - Treble Pickup: 85/15 “S”
  - Bass Pickup: 85/15 “S”
  - Gig Bag: Controls
