url: https://brauner-microphones.de/en/products/phanthera/
description: A fixed-cardioid phantom-powered condenser delivering tube-like
  sonic character in a solid-state design, with exceptional vocal intensity and
  superior transient response for instrumental recording.
details: |-
  The Phanthera is the impressive proof that a phantom powered non-tube microphone can sound
  amazingly close to a real tube microphone. It delivers vocal recordings with exceptional
  intensity and liveliness, providing a subtle sonic highlighting that never becomes
  obtrusive.

  For narration work, the Phanthera offers clear proximity and plasticity in sonic
  characteristics, with finely detailed and nuanced results that suit the demands of
  professional voiceover and broadcast recording.

  For instrumental recording, the Phanthera features enormous detail resolution and superior
  transient response, making it a versatile choice across a wide range of sources.

  The Phanthera was nominated for a TEC Award in 2008, recognizing its technical achievement
  as a phantom-powered condenser microphone that rivals the sonic character of tube designs.
specs: |-
  - Equivalent Noise: < 11 dB A (IEC651)
  - Signal to Noise Ratio: > 83 dB (1 Pa / 1 kHz, Cardioid)
  - Sensitivity: 28 mV / Pa (Cardioid)
  - Polar Pattern: Cardioid
  - Frequency Range: 20 Hz - 22 kHz
  - Maximum SPL: 142 dB SPL @ 0.3% THD
  - Power Supply: 48V phantom power
  - TEC Award Nominee 2008
