description: The M-EQ DRIVER is a Mid Booster & Drive pedal based on a vintage
  Pultec studio EQ. These legendary passive EQs from the 1950s are still sought
  after today for their highly musical, versatile EQ curves and the ability to
  overdrive their push-pull output stage, here reimagined as a guitar-oriented
  compact pedal.
details: |-
  Craft the perfect mid boost, add studio-inspired saturation, or push the pedal's valve-like output stage into fierce 'cocked wah' distortion. The M-EQ DRIVER lets players choose between 0.8, 1.0 and 1.3 KCS mid-boost frequencies. Equipped with a transformer, the circuit adds harmonic richness while faithfully recreating the sonic footprint of an original vintage Pultec.

  The MID knob works in conjunction with DRIVE to balance mid boost with overdrive. Origin Effects' Adaptive Circuitry is applied to the CUT control (based on the Pultec's High Frequency Attenuation band): with ADAPT engaged, high-end roll-off is progressively reduced as the pedal cleans up, for a smooth transition from warm overdrive to bright clean tones via guitar volume or playing dynamics.
specs: |-
