  - Dimensions: 124 x 58 x 64 mm (4.8 x 2.5 x 2.3 in.), L x W x H including knobs and switches
  - Input Impedance: 1 M ohm
  - Output Impedance: 1 k ohm
  - Current Draw: 80 mA
  - Power Supply: 9V DC 2.1mm centre-negative (mains adaptor only, minimum 80mA)
