details: |-
  The Alter 2 is temporarily unavailable. It will be available for purchase again in late June. We apologize for the inconvenience. Alter 2 - Copper is an effects processor for Eurorack format. The Copper version uses copper for the artwork and touch pads instead of gold, but is otherwise identical to the gold version. There are also two versions of the Alter which are visually identical except the names "Alter 1" and "Alter 2". This is Alter 2 - Copper version. Internally, 1 & 2 have an entirely different set of effects from the other. Each version features 7 unique and meticulously designed DSP effects. Note that copper oxidizes over time. The copper will tarnish and eventually turn green. Please keep this in mind before ordering the copper version. The Gold version will not tarnish. CONTROL

  - Controls for mix, X, Y and filter as well as clock. - All effects have a variation of a filter which may change effect to effect. - X and Y control various rates, feedback and time over the different effects. (note that some of the images shows a prototype which says "rate" under two of the pots. The faceplate has been changed to X and Y.)
  - Clock control adjusts the rate which controls the DSP which can drastically change the effect. In doing so it does slightly lower the quality of the output signal but the results are fantastic. This clock is not for synchronization. - Mix, X, Y and filter all have CV control inputs. - Each control level or CV input is visualized on the control panel. INS AND OUTS

  - stereo inputs with separate level/gain control for right and left channels. These levels can also act as mute as it can take the signal to 0. They can also add gain to a quiet signal. - peak level indicator for clipping levels at the input. - mono input is made stereo within the DSP and outputs to both left and right channels. - stereo outputs for right and left channels. EFFECTS

  The effect is selected by the hexagonal touch pad. The effects for Alter 2 - Copper are as follows:
  1 - Analog delay
  2 - Reverb with infinite capture and LP + HP filters
  3 - Choral reverb
  4 - Palindrome reverse delay - backward/forward repeat
  5 - Time stretch
  6 - Pitch shift (notated semi-tones)
  7 - Time stretch glitch

  SPECS

  includes printed manual
  +12V: 160mA
  -12V: 0mA
  +5V: 0mA
  16HP width
  25 mm Depth
  View on Modular Grid: https://www.modulargrid.net/e/folktek-alter-2

  SHIPPING, FULFILLMENT & DELIVERY

  We are a small company and strive to fulfill orders as quickly as possible. During busy times, please allow up to several business days for order fulfillment. International Shipments (delivery address outside the U.S.) may be subject to import duties, value added taxes (VAT), and long customs clearance times. Tariff rates vary from country to country. Folktek does not collect VAT on behalf of the customer. Folktek is not responsible for payment of import taxes. Please check with your local customs agency for rates and more information. **Note: There may be tiny scratches or blemishes on the faceplates from the manufacturing process. These scratches are unavoidable.
