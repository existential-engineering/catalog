description: >-
  The Roland XP-30 is a 64-voice expandable synthesizer released in 1999 that delivers the
  acclaimed XP-series sound architecture at a more affordable price point than previous models.
  It retains all waveforms from the XP-80 workstation plus sounds from the Session, Orchestral,
  and Techno expansion cards, offering 1,406 patches and 28 rhythm kits through a 61-key
  velocity and aftertouch sensitive keyboard.
details: |-
  The Roland XP-30 was designed to make the renowned XP-series synthesis capabilities accessible to musicians at any level. By reducing the keyboard to a standard 61 keys, eliminating the onboard sequencer, and providing fewer expansion card slots compared to the XP-80, Roland was able to offer the full XP experience at a significantly lower price point.

  The sound engine features four oscillators per voice powered by 32-bit custom RISC chips for digital acoustic simulation, with 512 onboard waveforms. The XP-30 comes loaded with all the world-renowned sound sets from the XP-80 workstation, plus the complete waveform content from the Session, Orchestral, and Techno wave expansion cards, totaling 1,406 patches and 28 rhythm kits right out of the box.

  Sound shaping is handled by a TVF filter offering lowpass, bandpass, and highpass modes with cutoff, resonance, key follow, and velocity sensitivity controls. Two MIDI-syncable LFOs provide modulation capabilities, while effects processing includes reverb, chorus, and 40 multi-effects types. An advanced arpeggiator derived from the XP-60/80 adds performance flexibility.

  The XP-30 accepts two SR-JV80-Series expansion boards for additional sound content, and a SmartMedia card slot provides supplementary storage. Four assignable Sound Palette sliders enable real-time parameter control, while the Patch Finder and Phrase Preview functions streamline sound selection during performance. The 61-key keyboard responds to both velocity and aftertouch for expressive playing.
specs: |-
  - Polyphony: 64 voices
  - Oscillators: 4 per voice, 32-bit custom RISC chips, 512 onboard waveforms
  - LFO: 2 MIDI-syncable LFOs
  - Filter: TVF (lowpass, bandpass, highpass) with cutoff, resonance, key follow, velocity
  - Effects: Reverb, Chorus, 40 multi-effects
  - Memory: 1,406 patches, 28 rhythm kits
  - Keyboard: 61 keys with velocity and aftertouch
  - Arpeggiator: Advanced (derived from XP-60/80)
  - Control: MIDI In/Out/Thru (16-part multitimbral)
  - Expansion: 2 SR-JV80-Series slots, SmartMedia card slot
  - Controllers: 4 assignable Sound Palette sliders, Patch Finder, Phrase Preview
  - Date Produced: 1999-2002
