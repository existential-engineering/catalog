description: Fusion Orchestra CE Teardrop Burst combines classic Spanish design and tone with modern features for a stage-ready nylon string acoustic guitar.
details: |-
  The Cordoba Fusion Orchestra CE Teardrop Burst combines classic Spanish design and tone with modern features for a stage-ready nylon string acoustic guitar. Built with a solid Canadian Cedar top and Rosewood back and sides for a deep, warm tone, the Fusion Orchestra CE features a slim neck profile (48mm nut width) and a 16 inch radius Ebony fingerboard for a comfortable playing experience that is comparable to that of a steel string guitar. Additional appointments include a hand-inlaid wooden rosette, elegant Mahogany binding, soft cutaway for easy access to upper frets and a high gloss PU finish. The Fusion Orchestra CE comes equipped with a built-in Fishman Presys Blend preamp so it's ready to plug in and play on any stage.
