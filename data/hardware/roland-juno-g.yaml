description: >-
  The Roland Juno-G is a full-sized 61-key digital workstation keyboard
  featuring the same high-powered processor and sound engine as Roland's
  Fantom-X series. It combines up to 128 voices of polyphony with an onboard
  16-track MIDI sequencer and 4-track audio recorder, putting a studio's worth
  of sound, sequencing, and recording into one complete instrument.
details: |-
  The Juno-G shares the same high-powered processor as Roland's Fantom-X series but packages it in a synth reminiscent of the classic Juno line, with many controls placed directly at the player's fingertips. It features Roland's powerful Fantom-X sound engine with up to 128 voices of polyphony, a quantum leap from the 6 voices offered by the original Junos.

  The sounds are purely digital, though many analog-modeled sounds are available. The Juno-G includes Roland's 88-note multi-sampled grand piano alongside a wide range of sounds spanning from classical to cutting-edge. An on-board arpeggiator, chord memory, and built-in multi-effects round out the performance features.

  For recording and sequencing, the Juno-G contains an onboard audio/MIDI recorder for programming and recording music sequences. The 16-part MIDI sequencer includes dedicated transport controls and a mixer, complemented by four companion stereo audio tracks. The interface features a large backlit LCD display, clearly labeled buttons, six knobs for sound modification, five sliders for the audio section, a data wheel, a D-Beam controller, and a pitch/mod lever. Connectivity includes MIDI in/out as well as USB for interfacing with computers.
specs: |-
  - Polyphony: 128 voices
  - Multitimbral: 16 parts
  - Oscillators: 64 MB waveform memory
  - Keyboard: 61 keys, velocity sensitive
  - MIDI Sequencer: 16 tracks, 400,000 note capacity, 9,998 measures
  - MIDI Recording: Realtime and step recording
  - Audio Sequencer: 4 stereo tracks, 16-bit linear, 44.1 kHz
  - Audio Recording Time: Approx. 23.5 seconds stereo (4 MB), up to 51 minutes stereo (516 MB fully expanded)
  - Arpeggiator: 128 preset, 128 user
  - Rhythm Patterns: 256 preset (32 groups), 256 user (32 groups)
  - Chord Memory: 64 preset, 64 user
  - Multi-Effects: 3 systems, 78 types
  - Reverb: 5 types
  - Chorus: 3 types
  - Mastering Effects: 3-band compressor
  - Input Effects: 6 types
  - Preset Patches: 768 + 256 (GM2)
  - Rhythm Sets: 36 + 9 (GM2)
  - Performances: 64 preset
  - User Patches: 256
  - User Rhythm Sets: 36
  - User Performances: 64
  - Storage: PC Card slot (CompactFlash or SmartMedia via adapter)
  - Connectivity: MIDI In/Out, USB (file transfer and MIDI)
