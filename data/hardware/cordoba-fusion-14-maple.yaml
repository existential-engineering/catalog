details: |-
  The Fusion 14 Maple is a nylon-string guitar designed for comfort and playability, featuring a comfortable, slim steel-string style neck (48mm nut width) with a 16" radius fingerboard. Built with a solid European spruce top and flamed maple back and sides, it delivers a bright, articulate voice with crisp highs and a quick, snappy response.

  Available with 14 frets to the body, the Maple offers a familiar feel and enhanced upper fret access, with its design placing the bridge for optimal resonance and clarity. Striking flame maple visuals and refined appointments make this model as eye-catching as it is practical, ready for the stage with its built-in Fishman Presys Blend preamp.
