description: MD-002 Gin is a Eurorack expansion module for the MD-001 Juniper
  that adds eight additional CV inputs, a potentiometer for knob recording and
  modulation, and dedicated recorder controls for recording, playback,
  overdubbing and stopping time-quantized recordings.
details: |-
  MD-002 Gin is a 4HP expansion module for MD-001 Juniper . It adds additional 8x CV inputs, a potentiometer for knob recording and parameter modulating, as well as dedicated recorder controls that allow Juniper to intuitively Record, Playback, Overdub and Stop time quantized recordings. With Juniper + Gin its never been easier to perform live CV recordings and simultaneously create complex modulations for your patches. FEATURES
specs: |-
  - 8x 12-bit bipolar (-5V to +5V) CV inputs
  - 1x Potentiometer
  - Dedicated recording controls
  - Firmware updates via Juniper's SD Card
  - Powered by MD-001 Juniper through the supplied 4-pin cable, no separate power connector
  - Power draw 15mA at +12V, 5mA at -12V
