details: |-
  The AEA N28 is a compact active stereo ribbon microphone consisting of two matched bidirectional (figure-of-8) ribbon transducers in a fixed Blumlein configuration. The N28 offers an effortless way to capture natural stereo, providing an authentic representation of a performance in its environment.

  Distinguishing itself from other AEA Stereo Ribbon Mics, the N28 is compact, maneuverable, and easy to use, making it ideal for a wide range of applications without the need for a multi-mic setup. Whether for drum overheads, room ambience, or close-miked stringed instruments, the N28 delivers a phase-coherent, accurate response.

  Its mid-forward frequency response, tamed proximity effect, and quick transient response make it versatile across various sources. The N28 excels on darker sources and is a practical solution for capturing a stereo image without drawing attention to the mic itself. Ideal for medium distances of 8 inches to 3 feet.

  The N28 operates on standard 48V phantom power, allowing you to choose a preamp based on sound rather than gain or input impedance. From desktop USB interfaces to boutique preamps, the N28's active circuitry ensures a good signal from even the quietest sources.

  Featuring an all-new motor design with 1.13-inch long ribbons, a 1:89 Lehle transformer, and dual buffer amp topology, the N28 captures every nuance with exceptional clarity and depth. Handmade in Pasadena, CA. NAMM TEC Award 2026 winner.
specs: |-
  - Transducer type: Active ribbon
  - Polar pattern: Two Figure-8 (Blumlein Configuration, 90 degrees)
  - Ribbon length: 1.13 inches
  - Transformer: 1:89 Lehle
  - Topology: Dual buffer amp
  - Power requirement: 48V phantom power
  - Mid-forward frequency response with tamed proximity effect
  - Ideal for medium distances (8 inches to 3 feet)
  - Includes: XLR breakout cable, storage case, shock mount clip, custom windscreen, protective mic sleeve, user manual
  - Made in the U.S.A. (Pasadena, CA)
