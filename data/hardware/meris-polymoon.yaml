description: Super-Modulated Delay inspired by cascaded rack gear.
details: |-
  Tidal soundscapes and super-modulated repeat trails lead to new inspiration with every note played. Guitar, synthesizer or any instrument takes on new shapes and forms with Polymoon's massive algorithmic flow.

  The delay combines a tempo-syncable stereo Barberpole phaser and a multimode stereo dynamic flanger with feedback, along with a dimension control for smearing reflections and a unique feedback topology.

  Polymoon provides stereo input and output, with switchable input/output headroom level for guitar, synthesizer or line levels. The multi-function EXP jack supports MIDI in/out via a compatible MIDI-to-TRS conversion box, preset switching, an expression pedal, or a tap switch, and presets are available via an external 4-preset switch or MIDI, with MIDI beat clock synchronization.
specs: |-
  - 1200mS real-time selectable multiple-tap delay line
  - 6 custom tuned LFOs with adjustable waveforms for subtle to aggressive pitch shifting effects
  - Adjustable Tilt EQ filter in delay feedback
  - Tempo syncable stereo Barberpole Phaser
  - Multimode stereo Dynamic Flanger with feedback
  - Dimension control for smearing reflections
  - Selectable quarter or dotted-eighth-note tap tempo
  - Conversion: 24-bit A/D and D/A
  - DSP: 32-bit floating point
  - Bypass: Selectable True Bypass (Relay) or Analog Buffered Bypass
  - Current draw: < 150 mA
  - Dimensions: 4.25" wide x 4.5" long x 2" tall
