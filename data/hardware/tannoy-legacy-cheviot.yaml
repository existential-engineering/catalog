details: |-
  The Legacy Series CHEVIOT is a floor-standing 12" Dual Concentric Hi-Fi loudspeaker elevating the HPD heritage with upscaled drivers. The 500-Watt 12" Dual Concentric driver delivers breathtaking dynamics and point-source imaging. Features a 2-band front-mounted energy control panel, heavy-duty 24-carat gold-plated binding posts (including a fifth RF-ground post), DMT (Differential Materials Technology) internal bracing, and a handcrafted MDF cabinet assembled in Poland and UK.
