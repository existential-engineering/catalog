details: |-
  Thou Shalt Pass Indeed

  We recognize that you probably won’t engage INFINITE when punching out those hard rock riffs or during solos but rather use it for dreamy interludes or to ‘glue together’ two songs. So, since it’s not your typical always-on pedal, it will likely be in bypass mode quite a bit. But don’t worry, we made sure that your original guitar signal is preserved thanks to the Analog-Dry-Thru design. It shall indeed pass completely unaltered to the next pedal or your amp, regardless of whether INFINTE is engaged or bypassed.

  Meet INFINITE SAMPLE SUSTAINER

  The name says it all. With INFINITE on your board, you’ll be able to capture and sustain a moment in audio. If DITTO LOOPER is like the camera on your phone where you can loop a video sequence, INFINTE is like the Polaroid for sound, allowing you to build amazing soundscapes and captivating moods whenever and wherever between now and forever. Instant sound snapshots so to speak!

  Lay Down Sally. Over and Over.
