description: Core of the famous Polivoks VCF in stereo.
details: |-
  Erica Synths Acidbox III brings the core of the famous Polivoks VCF in a stereo version, with a unique audio signal overdrive circuit, a built in LFO and an envelope follower, housed in a compact full aluminium case.

  The Acidbox III has adjustable input gain, so it works with various sound sources including guitars, units with line level signals such as synthesizers and grooveboxes, and modular synths. A configurable control input allows a bypass footswitch, an expression pedal, an external cutoff control voltage source or an LFO synchronization trigger to be connected, which makes the Acidbox suited to production and live performance setups alike.

  The filter is a stereo lowpass and bandpass design built on the original programmable opamps, with manual and CV control over cutoff frequency, a master modulation control and an envelope follower carrying a modulation level attenuverter. The syncable LFO offers 8 waveforms and a tap tempo button.

  Input signal level is up to 20V peak to peak with up to +20dB of input amplification, modulation CV level reaches 20V peak to peak and the LFO synchronization trigger level is 0 to +5V. The unit measures 185x140x55mm, weighs 0.7kg and runs from a universal mains adapter.
specs: |-
  - Polivoks core stereo lowpass/bandpass VCF with the original programmable opamps
  - Unique audio overdrive circuit
  - Versatile syncable LFO with 8 waveforms
  - Tap tempo button
  - Envelope follower with modulation level attenuverter
  - Master modulation control
  - Manual and CV control over cutoff frequency
  - Configurable control input for footswitch, expression pedal and external LFO/cutoff control
  - Adjustable input gain
  - Input signal level up to 20V ptp
  - Input signal amplification up to +20dB
  - Modulation CV level up to 20Vptp
  - LFO synchronization trigger level 0 to +5V
  - Power supply: universal mains adapter 110-220V
  - Mass 0.7kg
  - Dimensions 185x140x55mm
