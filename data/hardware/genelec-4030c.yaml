description: "The compact 4030C offers crystal clear sound and round-the-clock
  reliability, making it the natural choice for small to medium-sized commercial
  installations."
details: |-
  The 4030C is a compact active installation loudspeaker from Genelec's 4000 series, engineered for round-the-clock reliability in small to medium-sized commercial venues. It carries Genelec's trademark precision and clarity into spaces such as clubs, bars, restaurants, boardrooms, museums, and theatres, where intelligible, non-fatiguing audio at any playback level is the baseline expectation rather than a stretch goal.

  Drive comes from a 130 mm bass cone and a 19 mm metal-dome tweeter, each fed by its own 50 W Class D amplifier with a 3 kHz crossover. The system delivers a peak SPL of at least 110 dB and a short-term maximum of at least 104 dB, with a frequency response of 54 Hz - 20 kHz (+/- 2 dB) and low cutoff extending to 47 Hz at -6 dB. Self-generated noise stays at or below 5 dB SPL (A-weighted at 1 m), keeping the system out of the way during quiet program material.

  The active design eliminates the need for bulky external power amplifiers - amplification, crossover filtering, and protection circuitry all live inside the die-cast aluminium enclosure. Connectivity is intentionally minimal for install work: a single Euroblock balanced audio input (10 kOhm) handles signal, and the universal 100-240 VAC mains supply allows deployment anywhere worldwide without rewiring.

  Acoustic adaptation to the room is handled by rear-panel switches that engage Genelec's room compensation, allowing the installer to dial in the directivity-controlled response for the boundary conditions of the install (wall-mount, corner placement, soffit, etc.). The Directivity Control Waveguide (DCW) keeps coverage consistent and intelligibility high across the listening area, while Intelligent Signal Sensing (ISS) drops idle power draw to 0.5 W or less when no audio is detected, supporting 24/7 deployment without burning energy overnight.

  Finish options run from standard white (4030CW) and black through 120 custom RAL colours and a raw unfinished option, making the cabinet easy to specify into branded interior environments. Mounting accessories cover the full range of install scenarios - wall brackets, ceiling mounts, VESA adapters, and floor or table stands - all sold separately as part of the 8000-series mounting accessory line.
specs: |-
  - Two-way active installation loudspeaker
  - Peak SPL >= 110 dB
  - Short-term maximum SPL >= 104 dB
  - Long-term maximum SPL >= 96 dB
  - Frequency response: 54 Hz - 20 kHz (+/- 2 dB)
  - Low cutoff (-6 dB): 47 Hz
  - High cutoff (-6 dB): 25 kHz
  - Self-generated noise: <= 5 dB SPL (A-weighted at 1 m)
  - Bass driver: 130 mm cone
  - Treble driver: 19 mm metal dome
  - Bass amplifier: 50 W Class D
  - Treble amplifier: 50 W Class D
  - Crossover frequency: 3000 Hz
  - Harmonic distortion (50-100 Hz): <= 2%
  - Harmonic distortion (>100 Hz): <= 0.5%
  - Analog input: 1x Euroblock balanced, 10 kOhm
  - Mains voltage: 100-240 VAC 50/60 Hz
  - Power consumption (ISS active): <= 0.5 W
  - Power consumption (idle): <= 3 W
  - Power consumption (full output): 60 W
  - Dimensions (H x W x D): 285 x 189 x 178 mm
  - Weight: 4.9 kg (10.8 lb)
  - Enclosure: die-cast aluminium, reflex port
  - Rear-panel room compensation switches
  - Directivity Control Waveguide (DCW)
  - Intelligent Signal Sensing (ISS) auto power management
  - Includes 1.8 m mains cable
