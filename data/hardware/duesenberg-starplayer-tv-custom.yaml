details: |-
  The Starplayer TV Custom is a semi-hollow electric guitar built with a sustain block, bent sides and an f-hole. Duesenberg describes the semi-hollow construction as delivering an open response that a solid-body instrument cannot match, with the company's own specialised construction blocking most feedback even at high gain levels. The body measures 46 x 34 cm with sides 4.5 cm deep, pairing a laminated Spruce top with laminated Maple back and sides, cream 5-layer purfling binding, a black Custom pickguard and a PUR lacquer finish. Flamed Maple on the back is finished under the same modern PUR clearcoat, which Duesenberg presents as easy to maintain.

  The neck is a set, one-piece Maple neck in a Medium D shape, 42.5 mm at the nut and 52 mm at the twelfth fret, carrying an Indian Rosewood fingerboard with a 305 mm radius, cream dot inlays and 22 jumbo frets on a 648 mm scale. A steel dual-action truss rod sits inside and the headstock is finished in black. Every fretboard goes through Duesenberg's Plek process for perfectly level frets, which the company describes as the basis for its multi-step hand fret polishing and setup work.

  Electronics are three Duesenberg D-Tron Humbuckers, pickups Duesenberg tunes for an open and transparent tone with sparkling trebles not usually associated with humbucking designs. The wiring runs one volume, one Multi-Tone control and a 3-way pickup selector. The Multi-Tone pot works from a tactile middle stop: turned one way it acts as a conventional tone control, and turned the other way it blends the middle pickup into the mix in any selector position.

  Hardware is gold throughout, with Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge, Duesenberg Standard strap pins that accept Straplocks and Duesenberg Custom 10/50 strings. The vibrato is Duesenberg's own Diamond Deluxe Tremola in gold, which the company positions as the pinnacle of years of work on the original 1950s design, citing high quality German bearings for tuning stability, straightforward stringing and adjustable arm action.

  The instrument ships with the Duesenberg Custom Line Case as standard, a handcrafted flightcase-quality case Duesenberg describes as built to endure transport in a car, train or airplane, along with all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
