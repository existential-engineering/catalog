description: A high-gain British amp-in-a-box overdrive/distortion pedal that
  emulates JCM800 Marshall tones with a 3-band tone stack and Drive/Volume
  controls.
details: |-
  The Angry Charlie has become a staple of the JHS line over the years, and it's a force to be reckoned with in the high-gain pedal territory. Its ability to convincingly and accurately breathe JCM800 tones into any rig has made it a popular choice for guitarists of all genres. And unlike many other British amp-in-a-box pedals, the Angry Charlie V3 sports a 3-band tone stack, just like the Marshalls, helping nail those warm yet searing tones and boundless sustain.

  FURIOUS-SOUNDING AMP IN A BOX
  Turn the Drive control down, and you might be surprised how bluesy and vintage-like this pedal sounds.
  - Turns any amp into a screaming Marshall stack
  - Go from bluesy Hendrix-like breakup to high-gain Brit tones with a twist of the Drive knob
  - Drive and Volume control interact the same as a master volume amp head
  - Back off your guitar's volume to control your gain levels without losing clarity

  MARSHALL-STYLE TONE STACK
  After a couple of extremely well-received versions of the Angry Charlie, we realized that to really nail the ultimate Marshall-style tone, we had to add Marshall-style control, so we gave you a finely tuned Marshall-style 3-band EQ.
  - Fine-tune your tone with controls for Bass, Middle, and Treble
  - Active controls boost and cut their selected frequencies

  VERSION HISTORY:
  V1 = Larger enclosure and three controls; no Presence Control.
  V2 = Changed to current production size enclosure; diamond knob layout; Presence Control added.
  V3 = Color change to red; added three-band tone stack; five controls total; U-shaped knob layout.
