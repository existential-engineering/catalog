description: Designed for wall-mounted left, centre and right speaker positions
  in a discreet home cinema system, CWM7.4 S2 can also be mounted beside, above
  or below the screen. Its 2.5-way configuration features a single Carbon Dome
  tweeter, twin 100mm (4in) Continuum cone midrange units and twin 100mm (4in)
