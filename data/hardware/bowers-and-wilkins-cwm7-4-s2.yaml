details: |-
  CWM7.4 S2 is the 2.5-way in-wall model in the Bowers & Wilkins Reference Series, laid out as a slim vertical array for the left, centre and right channels of a discreet home cinema system. It can be mounted beside the screen or above and below it, so a whole front stage can be built from matched cabinets.

  The array is a single 25mm (1in) Carbon Dome tweeter flanked by twin 100mm (4in) Continuum cone midrange units and twin 100mm (4in) Aramid Fibre/paper bass cones. The 2.5-way arrangement means the midrange pair runs full range while the bass pair rolls off above the bass region, which keeps dialogue focused on the tweeter axis.

  Installation uses the Bowers & Wilkins QuickDogs fixing method, which clamps the frame to the plasterboard without tools. The frame is 625mm (24.6in) high by 175mm (6.9in) wide, needs a 599mm by 149mm cut-out, sits 92.5mm (3.64in) behind the wall surface and protrudes 8mm (0.3in). Net weight is 6.2kg (13.73lb) and the matching pre-mount kit is the PMK CWMC7.

  It is a passive loudspeaker: no on-board amplifier and no mains connection, driven from an external power amplifier rated 25W to 150W into 8 ohms on unclipped programme. Bowers & Wilkins quotes -6dB points at 43Hz and 33kHz, a 45Hz to 28kHz +/-3dB response, 86dB sensitivity at 2.83Vrms and 1m, and a nominal 8 ohm impedance with a 4.9 ohm minimum.

  The grille is finished in White, the only finish offered.
specs: |-
  - 2.5-way in-wall system
  - Drive units: 1x ø25mm (1in) Carbon Dome tweeter, 2x ø100mm (4in) Continuum cone midrange drivers, 2x ø100mm (4in) Aramid Fibre/Paper bass drivers
  - Technical features: Carbon Dome tweeter, Continuum midrange, Aramid Fibre/Paper bass cones
  - Frequency range: -6dB at 43Hz and 33kHz
  - Frequency response: 45Hz to 28kHz +/-3dB (-3dB)
  - Sensitivity: 86dB SPL (2.83Vrms, 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m) under 1% from 80Hz to 33kHz, under 0.5% from 120Hz to 33kHz
  - Nominal impedance: 8 ohms (minimum 4.9 ohms)
  - Recommended amplifier power: 25W to 150W into 8 ohms on unclipped programme
  - Frame: 625mm (24.6in) high x 175mm (6.9in) wide
  - Depth behind surface: 92.5mm (3.64in)
  - Cut-out: 599mm (23.6in) high x 149mm (5.9in) wide
  - Protrusion: 8mm (0.3in)
  - Pre-mount kit: PMK CWMC7
  - Net weight: 6.2kg (13.73lb)
  - QuickDogs tool-free fixing method
  - Passive: no on-board amplifier and no mains inlet, driven from an external power amplifier
  - Finish: grille White
