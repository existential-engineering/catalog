details: |-
  The CWM7.4 S2 is the Reference Series 2.5-way in-wall speaker, listed on the product page as a Reference 2.5-way in-wall speaker in a White finish. The page describes it as a 2.5-way in-wall speaker that is perfect for left, right, or center home theater channels.

  Designed for wall-mounted left, centre and right speaker positions in a discreet home cinema system, CWM7.4 S2 can also be mounted beside, above or below the screen, ensuring crystal-clear dialogue and dramatic special effects.

  Thanks to Bowers & Wilkins unique QuickDogs fixing method, installation is simple, requiring no tools.

  Its 2.5-way configuration features a single Carbon Dome tweeter, twin 100mm (4in) Continuum cone midrange units and twin 100mm (4in) Aramid Fibre/paper bass cones. The page's own Technical details block lists the drive units as one 25mm Carbon Dome tweeter, two 100mm Continuum cone midrange drivers and two 100mm Aramid Fibre/Paper bass drivers.
specs: |-
  - Description: 2½-way in-wall system
  - Technical features: Carbon Dome tweeter, Continuum midrange, Aramid Fibre/Paper bass cones
  - Drive units: 1x ø25mm (1in) Carbon Dome high-frequency
  - Drive units: 2x ø100mm (4in) Continuum cone mid/bass
  - Drive units: 2x ø100mm (4in) Aramid Fibre/Paper profile bass
  - Frequency range (-6dB): 43Hz – 33kHz
  - Frequency response: 45Hz – 28kHz ±3dB (-3dB)
  - Sensitivity: 86dB SPL (2.83Vrms, 1m)
  - Harmonic distortion (2nd and 3rd harmonics, 90dB, 1m): <1% 80Hz – 33kHz, <0.5% 120Hz – 33kHz
  - Nominal impedance: 8Ω (minimum 4.9Ω)
  - Recommended amplifier power: 25W – 150W into 8Ω on unclipped programme
  - Frame height: 625mm (24.6in)
  - Frame width: 175mm (6.9in)
  - Depth behind surface: 92.5mm (3.64in)
  - Cut-out height: 599mm (23.6in)
  - Cut-out width: 149mm (5.9in)
  - Protrusion: 8mm (0.3in)
  - Pre-mount kit: PMK CWMC7
  - Net weight: 6.2kg (13.73lb)
  - Finishes: Grille White
