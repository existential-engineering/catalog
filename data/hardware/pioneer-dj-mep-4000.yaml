details: |-
  Multi-entertainment player

  With digital music in mind, the MEP-4000 offers great versatility and flexibility. It inherits the basic functions and features of our CDJ range, supporting playback of popular music formats from your CD collection and USB storage devices.

  Thanks to rekordbox music management software, you can prepare your sets at home and save them to a USB device. This way, you can easily trigger cues and loops, or browse and select tracks by genre, album name or artist name. Plus, when no DJ is present, the MEP-4000 allows you to mix and playback music automatically using playlists.

  * Only available in Africa, Asia and South America.
