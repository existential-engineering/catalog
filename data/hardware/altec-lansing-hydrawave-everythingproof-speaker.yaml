details: |-
  Altec Lansing HydraWave EVERYTHINGPROOF Speaker

  Take your music wherever you go with the Altec Lansing HydraWave EVERYTHINGPROOF Speaker. Built for adventure, this rugged Bluetooth speaker features an IP67 waterproof and dustproof design that even floats in water, making it perfect for the beach, pool, camping, hiking, and outdoor activities. Enjoy up to 12 hours of playtime and reliable wireless audio with a 100-foot Bluetooth range. The included speaker mount, carabiner clip, and bungee cord make it easy to attach, carry, and enjoy your music wherever life takes you. Connect 100+ Hydra 2.0 speakers together with Party Sync technology for a bigger and more immersive sound experience.
