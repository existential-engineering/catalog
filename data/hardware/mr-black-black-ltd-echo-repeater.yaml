description: A limited black-finish edition of the Echo Repeater, a
  straightforward, perfectly voiced echo with trails on bypass and wild
  self-oscillation.
details: |-
  The Black LTD. Echo Repeater is a limited black-finish run of the Echo
  Repeater: an absolutely beautiful, straightforward, and perfectly voiced echo.
  It has trails on bypass and wild self-oscillation at high Feed Back settings,
  with echo times ranging from 45mS to 450mS.

  As Mr. Black puts it, there is something in this pedal that pulls songs out of
  you.

  It is a Jack Deville original design, produced as a limited run of 52 pieces.
specs: |-
  - Straightforward, perfectly voiced echo
  - Echo times: 45mS - 450mS
  - Trails on bypass
  - Wild self-oscillation at high Feed Back settings
  - Limited run of 52 pieces
