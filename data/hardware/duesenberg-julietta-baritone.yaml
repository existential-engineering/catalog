description: A harmonic entry into the expansive world of Duesenberg. Julietta
  is packed with all the features you would expect from a Duesenberg, yet it is
  the most affordable instrument in our line up so far.
details: |-
  The Julietta Baritone is the long-scale version of Duesenberg's Julietta, a solid-body alder guitar with a bolt-on neck that Duesenberg describes as reduced to the basics. The baritone is built to a 28" / 710 mm scale length and comes fitted with Duesenberg Custom 14/70 strings tuned down to B. It is offered in two forms, a Catalina Black model with a stop tailpiece and a Catalina Red Tremolo edition.

  The neck is a bolt-on, 1-piece maple neck in a medium D shape, 42.5 mm / 1.67" wide at the nut and 52 mm / 2.05" at the twelfth fret, and 21 mm / 0.8" to 24 mm / 0.95" thick over the same span. The fingerboard is Indian rosewood with a 305 mm / 12" radius and cream dot inlays, and carries 22 jumbo frets of 2.8 x 1.0 mm over a steel dual-action truss rod, with a black headstock. Every Julietta is Plek processed for level frets, then hand-finished and set up by one of Duesenberg's luthiers, who signs the instrument inside.

  The body is solid alder, 43 x 32 cm / 16.9" x 12.6" and 4.0 cm / 1.6" deep, under a PUR lacquer finish, with a 3-ply white or 3-ply black pickguard. Duesenberg pairs its Domino P90 at the neck with a GrandVintage humbucker at the bridge, both in trapeze housings, wired to one volume, one tone and a 5-way pickup selector. The alder body and maple neck are credited with quick attack, sparkling trebles and long sustain.

  Hardware is Duesenberg's own and finished in nickel: Z-Tuners, a Steel Saddle Bridge, and Straplock-compatible Duesenberg Standard strap pins. Non-tremolo models carry the Duesenberg Aluminum Stop Tailpiece, while the tremolo models are fitted with the Duesenberg Diamond Deluxe Tremola instead.

  The instrument ships with the Duesenberg Custom Line Bag, a lightweight gig bag with high-impact internal padding, a black plush lining, external storage pockets, a padded handle, backpack straps that can be tucked away so the bag can be carried like a case, and an adjustable neck pillow. All required allen keys are included.
specs: |-
  - Neck type: Bolt-on Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5" (Baritone: 710 mm / 28")
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Solid Body, Alder
  - Body dimensions: 43 x 32 cm / 16.9" x 12.6"
  - Body height: 4.0 cm / 1.6"
  - Pickguard: 3-ply white or 3-ply black
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Tailpiece: Duesenberg Aluminum Stop Tailpiece (non-trem models only)
  - Vibrato System: Duesenberg Diamond Deluxe Tremola (trem models only)
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware finish: Nickel
  - Strings Baritone: Duesenberg Custom 14/70 (014-018-026-044-056-070)
  - Pickup (neck): Duesenberg Domino P90 (Trapeze Housing)
  - Pickup (bridge): Duesenberg GrandVintage Humbucker (Trapeze Housing)
  - Wiring: 1 Volume, 1 Tone, 5-Way Pickup Selector
  - Bag: Duesenberg Custom Line Bag (included)
  - Tools: All required allen keys (included)
