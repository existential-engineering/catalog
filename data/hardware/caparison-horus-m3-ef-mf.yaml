details: |-
  The classic Caparison Horus has been reimagined to fit the modern guitarist. Built for ultimate comfort and legendary playability, it features a sleek five-piece Maple and Walnut neck with ivory-coloured binding across the fingerboard and headstock. The Caparison Horus-M3 is topped with 27 jumbo frets with an asymmetrical body with a deep lower cut, offering extreme access to the higher frets, which is sure to meet the needs of the most demanding player. With the choice of a Maple (MF) or Ebony (EF) fingerboard and available in six stunning hand painted sponge finishes (Amethyst, Carnelian, Lapis-lazuli, Moon Stone, Obsidian and Tiger's Eye), each one being a unique example. It is complete with a matt black headstock and "Wadjet Eye" logo. The M3 style body construction is composed of a central Maple section perfectly accompanied by two Mahogany wings with the neck bolted directly to the Maple midsection. The result is a balanced sound with focused low end and rich sustain. Complete your tone with iconic Caparison PH-R and SH27-F pickups to provide distinct character, clarity, and precise attack developed with the player in mind.
