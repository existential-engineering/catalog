details: |-
  2-channel touch-screen scratch mixer.

  Boasting the most comprehensive effects available in a 2-channel unit and astonishing sound quality, the DJM-909 takes DJs outside the existing boundaries of performance to stand alone as the ultimate battle mixer. The DJM-909 is an amazing unit that boasts precise cross fader and fader curve control technology . Using the independent fader adjustments , DJs can go beyond the symmetrical type of curve adjustment available on conventional mixers. Uniquely, this unit supports the use of an optional foot pedal as an effects controller for almost limitless flexibility. Even more impressively, either channel can be set to reproduce the audio of the other, so that 2 effects can be applied simultaneously to 1 track. The DJM-909 also includes an Auto BPM Counter that lets you see an instant readout of a song's tempo on-screen – no matter how complex the musical style – and continue your mix without losing momentum. Using the integrated touch-sensitive screen , you can access 50 different BPM sync’d effects on each channel. The screen can also be used for quick access to 9 pre-selected effects, or to assign the fader effect function to the cross fader or either volume fader. The DJM-909 truly boasts the widest variety of effects in a 2-channel unit and gives you the extra edge to showcase all of your DJ skills and stretch your musical boundaries.
