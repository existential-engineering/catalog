description: 12x6 digital zone processor with Ethernet control for commercial
  audio applications, providing comprehensive signal processing and routing.
details: |-
  The ZonePRO 1261 is a professional-grade digital zone processor featuring 12 inputs and 6 outputs designed for commercial audio installations. It delivers comprehensive signal processing capabilities including advanced feedback suppression, parametric EQ, compression, limiting, and noise gating on inputs, plus sophisticated output processing with crossovers, bandpass filters, and the proprietary AutoWarmth function.

  The device offers multiple control options through wall panel Zone Controllers, RS-232 connectivity, and Ethernet access for remote management. A built-in real-time clock enables programmable system changes throughout the day or week. The ZonePRO Designer software provides an intuitive interface with a configuration wizard for setup and editing of all system parameters.

  Connectors include Euroblock connectors for balanced signals, RCA connectors for consumer equipment, and S/PDIF digital input. The unit achieves exceptional audio quality with over 110 dB dynamic range and features routing modules for source selection, ducking for paging, and priority override functionality.
specs: |-
  - 12 inputs (2 switchable mic/line Euroblock, 8 RCA, 1 S/PDIF)
  - 6 analog outputs with Euroblock connectors
  - Mic preamp gain: 30–60 dB
  - Mic preamp EIN: <−118 dB
  - Max input: +20 dBu (mic/line), +12 dBu (RCA)
  - Max output: +20 dBu
  - CMRR: >40 dB typical (>55 dB @ 1 kHz)
  - Sample rate: 48 kHz
  - Dynamic range: >110 dB A-weighted
  - THD+Noise: 0.003% typical @ +4 dBu, 1 kHz, 0 dB gain
  - Frequency response: 20 Hz–20 kHz, ±0.5 dB
  - Propagation delay: 0.6 msec
  - Operating voltage: 100–240 VAC, 50/60 Hz
  - Power consumption: 27 W
  - Dimensions: 1.75″ H × 5.75″ D × 19″ W
  - Weight: 6.8 lbs (3.1 kg)
  - Advanced Feedback Suppression (AFS)
  - AutoWarmth patent-pending technology
  - Parametric EQ and notch filtering
  - Bandpass and crossover filters
  - Noise gate, compressor, and limiter
  - Delay for system optimization
  - Security lockout feature
