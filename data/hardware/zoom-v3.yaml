description: Whether you're streaming, recording, or collaborating online, the
  V3 is packed with effects, harmonizing options, pitch correction and more.
details: |-
  The V3 is a desktop vocal processor aimed at streaming, recording and online collaboration. A single XLR microphone input with switchable +48 V phantom power feeds a chain of 16 voice-changing effects plus dedicated compression, reverb, delay and enhance stages, and the processed voice leaves over a pair of unbalanced 1/4-inch line outputs, a headphone jack and USB.

  Harmony is the headline feature. Up to two extra voices can be added to build 3-part harmonies across a full octave, in both major and minor keys, with a Harmony Selection control for the intervals and a Key Select knob that sets the key used by both the harmoniser and the pitch correction.

  The 16 creative effects are selected from dedicated buttons and fine-tuned with a single parameter knob. They are Telephone, Deep, Talk Box, Child, Beat Box, Octave, Vocoder, Harmony, Chorus, Whistle, Distortion, Robot, Pitch Correction and Unison, and five effects can run at once. A separate Formant Character button alters vocal characteristics without changing the pitch.

  A professional quality preamp sits in front of the effects, and the Enhance function automatically optimises the performance of whatever microphone is connected, with a built-in Enhancer for added clarity. Zoom offers the optional SGV-6 super-cardioid microphone, which suppresses ambient noise so the V3 can track the voice more accurately.

  Over USB the V3 becomes a 2-in/2-out USB 2.0 Full Speed audio interface for a computer or mobile device, recording at 44.1 kHz and 16, 24 or 32-bit. Power comes from a 9 V DC adapter (Zoom AD-16), from four AA batteries for about 3.5 hours, or over the USB port. A CONTROL IN jack takes the optional FS01 footswitch or FP02M expression pedal for hands-free control, and the unit sits on a tabletop or mounts to a mic stand with the HRM-7 or HRM-11.
specs: |-
  - Effects: 16 types, 5 concurrent effects
  - Sampling frequency: 44.1 kHz
  - A/D conversion: 24-bit 128x oversampling
  - D/A conversion: 24-bit 128x oversampling
  - Signal processing: 32-bit
  - Frequency response: 20 Hz to 20 kHz (+1 dB/-3 dB, 10 kohm load)
  - MIC IN: XLR jack, input gain +3 to +40 dB, maximum input level +4 dBu, input impedance 3 kohms or higher (1 kHz)
  - Phantom power: +48 V, switchable
  - AUX IN: stereo mini jack, rated input level -10 dBu, input impedance (line) 22 kohms
  - L/R OUT: unbalanced TS jacks, maximum output level +6 dBu, output impedance 100 ohms
  - PHONES: stereo mini jack, maximum output level 20 mW + 20 mW (into 32 ohm load)
  - Equivalent input noise (phantom power off): -125 dBu or less (A-weighted, 150 ohm input, +40 dB input gain)
  - Noise floor (residual noise): -75 dBu
  - Control input: FS01/FP02M input
  - USB connector: Micro USB
  - Audio interface operation: 2-in/2-out, USB 2.0 Full Speed, 44.1 kHz, 16/24/32-bit
  - Power: AC adapter (9 V DC 500 mA, centre negative, Zoom AD-16), 4 AA batteries (about 3.5 hours continuous with alkaline batteries), or USB bus power
  - A cable designed only for power disables the other USB functions
  - External dimensions: 150 mm (D) x 190 mm (W) x 50 mm (H)
  - Weight: 0.59 kg (excluding batteries)
  - Add up to two voices to create 3-part harmonies across a full octave, in major and minor keys
  - Independent compression, reverb and delay control knobs
  - Built-in Enhancer for increased sound clarity
  - Formant Character button alters vocal characteristics without changing the pitch
  - Line outputs for connecting to PA systems or mixing consoles
  - Headphone output with dedicated volume control
  - Optional FS01 footswitch or FP02M expression pedal connect to CONTROL IN
  - Mounts to a mic stand with the Zoom HRM-7 (7-inch) or HRM-11 (11-inch) Handy Recorder Mount
  - In the box: V3 Multi-Effects Vocal Processor, V3 Operation Manual
