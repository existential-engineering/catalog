description: A eurorack friendly, utility packed case with an integrated
  full-sized 49key synth-action MIDI controller keyboard. NiftyKEYZ offers
  keyboard & MIDI control over 4 CV + Gate outs.
details: |-
  NiftyKEYZ combines a full-sized 49-key synth-action keybed (with aftertouch) with 112hp of useable eurorack case space and an integrated power supply (+12V 1500mA, -12V 1000mA, +5V 1000mA), so users can fill it with whatever eurorack format modules they want.

  NiftyKEYZ can split the keyboard into up to 4 zones and assign any combination of its 4 CV + Gate outputs to them, enabling polysynth, 4-voice monosynth, or duophonic configurations. A multi-mode arpeggiator syncs to an external MIDI clock or NiftyKEYZ's own internal clock, which can also divide incoming clock and output its own pulse via a dedicated clock jack.

  The modwheel can send a constant control voltage or be switched into LFO mode, where it controls the depth of a clock-synced LFO with 5 selectable waveform shapes. Additional CV outputs cover velocity, aftertouch, pitch bend, and expression, and 2 buffered mults let users duplicate any of these signals to multiple destinations.

  All of NiftyKEYZ's I/O can be controlled via external MIDI through its 5-pin DIN MIDI In and/or its class-compliant USB MIDI connection, requiring no drivers. It also functions as a full MIDI controller keyboard for a DAW or other MIDI gear, and with Local Off enabled it becomes a dedicated multichannel MIDI-to-CV converter.
specs: |-
  - Full-size 49-key synth-action keybed with aftertouch
  - 4x CV + Gate outputs, assignable by keyboard zone, polyphonic or monophonic (1-4 voice modes)
  - 112hp of useable eurorack module space
  - Integrated power supply: +12V 1500mA, -12V 1000mA, +5V 1000mA
  - 2x buffered mults
  - Multi-mode arpeggiator with internal or external MIDI clock sync
  - Clock output with divider; Reset output (Clock or Key mode)
  - Auto-chord function (up to 32 notes learned, first 4 sent to CV/Gate)
  - Modwheel: manual CV output or multi-shape (triangle, ramp, saw, square, random) clock-synced LFO
  - Glide control with Glide and Legato modes
  - Keyboard splitting into up to 2 zones
  - USB MIDI class-compliant, no drivers required
  - MIDI In via 5-pin DIN and USB; MIDI Out/Thru via 5-pin DIN and USB
  - Dimensions: 70cm (W) x 36cm (D) x 13cm (H)
