description: "Manley Snapper® mono-block: 100W EL34 tube power in fully
  differential topology with 19-layer MANLEY IRON® transformers. Balanced &
  unbalanced inputs!"
specs: |-
  - All-tube fully differential push-pull topology
  - Power Output: 110W @ 5 Ohms (1.5% THD); 100W @ 10 Hz
  - Tubes: 4 x Tungsol EL34B (output), 1 x 12AT7 (input) per monoblock
  - Frequency Response: 15 Hz – 40 kHz (flat at 110W)
  - S/N Ratio: 90 dB A-weighted (referenced to 1W)
  - Output Impedance: 1.5 Ohms (optimized for 5 Ohm loads)
  - Balanced XLR input: switchable 15 kOhm or 600 Ohm impedance
  - 19-layer MANLEY IRON® output transformers
  - Dimensions: 13″ W × 15″ D × 8.75″ H
