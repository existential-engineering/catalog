description: KRK's first limited-edition artist signature monitor, developed
  with producer Scott Storch. It is a Classic 8 with a gold chrome electroplated
  front baffle carrying Scott Storch's signature, and a Scott Storch logo and
  signature on the rear panel.
details: |-
  KRK's first limited-edition artist signature model is a collaboration with producer Scott Storch, who has used the KRK Classic 8 monitors extensively throughout his career. The KRK Scott Storch Classic 8ss Studio Monitor features a distinctive gold chrome electroplated front baffle with Scott Storch's signature. A Scott Storch logo and signature are also featured on the rear panel.

  All of the Classic 8 features have been retained. Borrowing concepts from previous ROKIT lines, the Scott Storch Classic 8ss defaults to a flat frequency response aimed at critical listening, for more accurate mixes. With the optional ability to engage the +2 dB KRK Bass Boost, it can also provide an enhanced bass response.

  The Scott Storch Classic 8ss is an active (self-powered) two-way studio monitor that utilizes a 1-inch textile soft dome tweeter paired with an 8-inch glass aramid woofer. The built-in power amplifiers provide a total of 100 watts of power, with a 75-watt amp driving the woofer and a 25-watt amp for the tweeter.
specs: |-
  - Configuration: 2-way
  - System type: active studio monitor
  - Low-frequency transducer: 8-inch glass aramid woofer
  - High-frequency transducer: 1-inch textile soft dome tweeter
  - Frequency response (+/- 3 dB): 42.5 Hz to 28 kHz
  - Frequency range (-10 dB): 35 Hz to 35 kHz
  - Crossover frequency: 2.0 kHz
  - Average beamwidth (horizontal): 144 degrees (900 Hz to 9 kHz)
  - Average beamwidth (vertical): 120 degrees (900 Hz to 9 kHz)
  - Max peak SPL (with limiter): 106 dB
  - Max average SPL (with limiter): 103 dB
  - Max calculated SPL: 106 dB
  - Amplifiers: Class A-B, custom bi-amped
  - High frequency power output: 25 W
  - Low frequency power output: 75 W
  - Signal to noise ratio: >100 dB
  - Controls: system volume -30 dB to +6 dB
  - LF level adjust: -2 dB, -1 dB, flat, +2 dB below 200 Hz
  - HF level adjust: -2 dB, -1 dB, flat, +1 dB above 2.0 kHz
  - Indicators: power
  - Input connectors: RCA, balanced 1/4-inch TRS, balanced XLR
  - Output connectors: none
  - AC fuse (slow blow / time lag): 120 VAC T2AL 250 V, 240 VAC T1AL 250 V
  - Idle (mute) AC power consumption: 10 W
  - Maximum AC power consumption: 184 W
  - Enclosure construction: 15 mm MDF / high impact polystyrene
  - Finish: black vinyl wrap, gold chrome electroplated front baffle
  - Hardware: foam isolation pads
  - Front-firing port
  - System-optimized auto-limiter
  - Product dimensions (H x W x D): 15.60 in (396 mm) x 10.82 in (275 mm) x 12.40 in (315 mm)
  - Product weight: 24.6 lb (11.16 kg)
