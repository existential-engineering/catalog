details: |-
  The Aria Compressor Drive combines a compressor and an overdrive in one dual-footswitch pedal. The overdrive is Keeley's most flexible to date, and the compressor carries the tone and blend features of the Compressor Plus. The order of the two halves can be swapped, giving two different drive responses.

  The overdrive has two modes: soft clipping, and a transparent boost to midrange frequencies. The compressor has a clean blend, so any amount of dry signal can be mixed back in for punchier chord work, and a tone control to brighten the highs.

  Compressors and overdrives are both staples of recorded and live guitar. Running compression before overdrive reduces idle noise and gives a consistent gain level, while running the compressor after the overdrive gives a warmer, rounder, smoother tone with more sustain, so the Aria's order switching covers both. Each half provides enough volume to boost and push an amplifier, and each has its own tone shaping controls.

  The pedal has TRS insert jacks that divide it into two separate units, so other effects can be placed between the compressor and the drive, and it can be connected to a pedal switcher with TRS cables so each side is controlled independently.
