description: The DSS-17 Whiskey Sunset blends vintage style with warm, powerful
  tone in a slope-shoulder Dreadnought.
details: |-
  The Martin DSS-17 Whiskey Sunset pairs vintage aesthetics with a warm, powerful voice in a slope-shoulder Dreadnought body. A solid spruce top paired with mahogany back and sides delivers bold lows with reduced high frequencies for a balanced, expressive sound.

  The slope-shoulder D-14 fret design combines elegant curves with a narrower waist for comfortable play, while scalloped X-bracing supports a dynamic response across dynamics. The 25.4-inch scale length contributes to clarity and sustain, and the 1 3/4-inch nut paired with the Modified Low Oval neck profile and High-Performance Taper makes the neck welcoming for a wide range of players.

  Finished in Whiskey Sunset Burst with a satin top finish and antique white binding, the DSS-17 features an East Indian rosewood fingerboard with 1955 Style 18 mother-of-pearl inlays, a Script Authentic 1933 headplate overlay, and aged nickel Ping tuners. A modern straightline rosewood bridge with a drop-in compensated bone saddle rounds out the appointments.

  The instrument is Pleked at the factory, available left-handed, and ships with a waterproof soft gig bag featuring backpack straps and internal padding.
specs: |-
  - Body size: D-14 Fret Slope Shoulder Dreadnought
  - Top: Solid Spruce, satin finish, Whiskey Sunset Burst
  - Back and sides: Mahogany, satin finish, Dark Mahogany color
  - Bracing: X-Brace, Scalloped
  - Scale length: 25.4"
  - Nut width: 1 3/4"
  - Fingerboard width at 12th fret: 2 1/8"
  - Fingerboard: East Indian Rosewood
  - Fingerboard inlay: 1955 Style 18 Mother-of-Pearl
  - Neck material: Select Hardwood
  - Neck shape: Modified Low Oval
  - Neck taper: High-Performance Taper
  - Neck finish: Satin
  - Total frets: 20
  - Neck joins body at 14th fret
  - Headstock: Solid with Square Taper
  - Headplate logo: Script Authentic 1933 Overlay
  - Tuning machines: Ping Aged Nickel
  - Bridge: Rosewood, Modern Straightline with drop-in saddle
  - Saddle: Compensated Bone
  - Binding: Antique White
  - Pickguard: Tortoise Pattern or Black
  - Side dots: Yellow
  - Electronics: None
  - Construction: Simple Dovetail Neck Joint
  - Pleked: Yes
  - Left-handed available: Yes
  - Case included: Soft Gig Bag (waterproof, backpack straps, internal padding)
