details: |-
  Four Button Wallplate Controller. IP4 is a simple programmable wallplate, giving the non-technical user convenient, easy control via 4 illuminated buttons.

  US and EU/UK Versions — available in two form factors for the US and EU/UK markets; the IP4 is compatible with Decora and MK Elements faceplates.

  Simple to Use — designed with the non-technical user in mind; can control zone level, source selection, mutes, level adjustment, scene/preset recall, and more.

  Low Maintenance — automatically matches firmware with connected devices for easy install and system maintenance.

  Mix and Match — multiple IP Controllers can be connected to an AHM system to provide control exactly where needed. Use IP controllers of different flavors to suit the needs of your end users, even letting one controller change what other controllers are doing to reflect changes in the space.

  Simple to Set Up — interfaces with the AHM system via standard TCP/IP network connections, and can be networked with other controllers, computers and third party devices using a standard Ethernet infrastructure.

  Configure — IP4's controls and functions are configured using AHM System Manager.

  Features: four illuminated configurable buttons for source selection, mutes, level control, or preset recall; TCP/IP & PoE compliant; two form variants (US Decora-compatible and EU/UK MK Elements-compatible); face plate not included (can be ordered separately for EU variant).
