description: Dial in all flavors of chewy, swirling phase modulation with the
  Lunar Phaser. Choose from a Uni-Vibe effect, a lively 4-stage phaser, and a
  cascading 8-stage phaser.
details: |-
  The Lunar Phaser dials in all flavors of chewy, swirling phase modulation. It offers three distinct phaser effects selectable via center toggle: CLASSIC (4-stage), VIBE (Uni-Vibe), and MULTI (cascading 8-stage).

  Users can download additional phaser, flanger, and chorus algorithms through the Neuro software platform at no cost, expanding the pedal's modulation range.

  An envelope follower mode enables pick-sensitive, auto-wah-style modulation control.

  Lunar stores 6 presets (two banks of three slots) and offers stereo I/O with multiple signal routing options. Universal Bypass provides true bypass relay or transparent buffer, and the pedal supports USB-MIDI, MIDI Clock sync, and TRS expression control via the Neuro Hub.
specs: |-
  - Three phaser effects: CLASSIC (4-stage), VIBE (Uni-Vibe), MULTI (8-stage)
  - Downloadable phaser, flanger, chorus algorithms via Neuro software
  - Envelope follower mode for pick-sensitive modulation
  - Stereo I/O with multiple signal routing options
  - Stores 6 presets (two banks of three)
  - Universal Bypass (true bypass relay or transparent buffer)
  - USB-MIDI and MIDI Clock sync
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 2.75" x 2.2"
  - Weight: 0.625 lb
  - Power consumption: 165 mA
