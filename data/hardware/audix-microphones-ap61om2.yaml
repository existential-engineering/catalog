details: |-
  A professional true diversity handheld wireless system featuring the AUDIX OM2.
  The OM2, our best-selling vocal microphone, has slight bass proximity, a tailored mid-range, and a full-bodied sound. Ideally optimized for small to mid-size PA systems, the OM2 is a workhorse microphone known for its excellent isolation on stage, outstanding feedback rejection, and ability to handle high sound pressure levels without distortion. A single space rackmount kit with BNC cables for front mounting antennas is included. Optional accessories include a rackmount kit for mounting two systems in one rack space, active directional antennas, and an antenna distribution system for up to four systems (4 channels).

  Frequency Range
  522 MHz – 586 MHz
specs: |-
  - Mic: OM2 handheld dynamic vocal capsule (H60 transmitter)
  - System: R61 single-channel true diversity receiver with H60/OM2 handheld transmitter
  - Frequency range: 522 MHz – 586 MHz
  - 207 pre-coordinated frequencies
  - Single-space rackmount kit with BNC antenna cables included
