description: UHF wireless handheld vocal system pairing the RE3-HHT handheld
  transmitter fitted with the RE520 supercardioid condenser microphone head and
  an RE3-RX half-rack diversity receiver, intended for vocal performance and
  presentations.
details: >-
  The RE3-RE520 is the handheld/condenser configuration of Electro-Voice's RE3
  UHF wireless series. The set bundles the RE3-RX half-rack diversity receiver,
  the RE3-HHT handheld transmitter, and the RE520-RC3 supercardioid condenser
  microphone head (a thread-on capsule using the standard EV handheld coupling),
  targeted at vocal performance, public speaking, and presentation applications
  that benefit from a brighter, more detailed condenser response.


  The RE520 capsule delivers a tight low end, natural midrange, and detailed
  highs with a supercardioid polar pattern for excellent acoustic isolation and
  feedback rejection. It includes a built-in multi-stage pop filter and
  high-pass filter to control plosives and handling/stage noise.


  The RE3-RX receiver provides true antenna diversity reception to minimize
  dropouts, with a built-in frequency scan, an LCD display, and an IR-based Sync
  function that transfers receiver settings to the transmitter in one step.
  Depending on band, the receiver offers up to 36 MHz of tuning bandwidth and as
  many as 1,440 selectable frequencies. Two detachable BNC antennas mount on the
  rear, along with a balanced XLR and unbalanced 1/4-inch audio output and a DC
  barrel jack fed from the supplied universal power supply. Rack-mount hardware
  ships in the box.


  The RE3-HHT handheld transmitter has selectable low/high RF output power
  (band-specific, typically 10/50 mW), runs on two AA batteries, and accepts
  interchangeable EV microphone heads via a standard thread-on coupling.
specs: >-
  - System type: UHF wireless handheld vocal system with condenser capsule

  - Receiver: RE3-RX half-rack diversity receiver

  - Transmitter: RE3-HHT handheld

  - Microphone head: RE520-RC3 supercardioid condenser

  - Element type: Condenser

  - Polar pattern: Supercardioid

  - Capsule features: Multi-stage pop filter, high-pass filter

  - Tuning bandwidth: 10-36 MHz (band-specific)

  - Selectable frequencies: 120-1440 (band-specific)

  - Frequency band 5L: 488-524 MHz

  - Frequency band 5H: 560-596 MHz

  - Frequency band 6M: 653-663 MHz

  - Frequency band 8M: 823-832 / 863-865 MHz

  - Frequency band T: 803-806 MHz

  - Transmitter output power: 10-50 mW (band-specific)

  - Diversity: True antenna diversity

  - Sync: IR-based one-step transmitter setup

  - Frequency scanning: Yes (receiver scans for clean channel)

  - Receiver display: LCD

  - Transmitter battery: 2 x AA

  - Microphone head connection: Thread-on (standard EV handheld coupling)

  - Included: RE3-RX receiver, RE3-HHT handheld transmitter, RE520-RC3
  microphone head, two receiver antennas, microphone stand adapter, universal
  power supply, two AA batteries, rack-mount hardware, owner's manual and
  documentation
