description: Limited edition flagship headphone featuring staggered Fluxor
  magnetic structure and nano-scale diaphragms for vibrant midrange, powerful
  bass, and treble extension.
details: |-
  The LCD-24 incorporates the resolution and power of Audeze's staggered Fluxor magnetic structure together with the lightning-fast transient response of Nano-scale diaphragms. The result delivers a robust and refined sound featuring the vibrant midrange, powerful bass, and treble extension iconic to Audeze's Flagship headphones.

  The LCD-24 achieves astonishing transparency through a special Fluxor version of the staggered magnetic circuit that offsets the placement of magnets on each side of the driver, thereby improving the linearity of airflow for enhanced resolution and transparency.

  The device uses 0.5 micron Nano-scale diaphragms that articulate music with such detail and nuance, capturing transient information that more conventional drivers miss entirely.

  Listed as a legacy product no longer available for sale. Originally released as a limited edition, made-to-order headphone available only for a limited time.
specs: |-
