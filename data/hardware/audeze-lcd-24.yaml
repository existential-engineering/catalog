  - Diaphragm type: Nano-Scale
  - Transducer size: 106 mm
  - Maximum power handling: 5W RMS
  - Maximum SPL: >130dB
  - Frequency response: 5Hz - 50kHz
  - THD: <0.1% @ 100dB
  - Impedance: 15 ohms
