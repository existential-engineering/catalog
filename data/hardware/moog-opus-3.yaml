description: >-
  A polyphonic analog synthesizer from 1980 with three dedicated instrument sections for strings,
  brass, and organ, each with independent filtering and panning controls.
details: |-
  The Moog Opus-3 is a polyphonic analog synthesizer designed by Herbert A. Deutsch, the Hofstra
  University professor who originally encouraged Robert Moog to build synthesizers and later directed
  Moog Music's sales and marketing division. Released in 1980, the Opus-3 takes a straightforward
  approach to analog synthesis with three clearly separated instrument sections.

  The strings, brass, and organ sections each feature dedicated sliders and independent level and
  panning controls, with separate VCF sections for the strings and brass voices. The organ section
  operates without filtering. The dual output design enables early stereo effects through independent
  panning of each instrument section, creating spatial separation between the three sound sources
  that adds dimension to the overall output.

  The 49-key keyboard and clearly laid out front panel make the Opus-3 one of the more approachable
  instruments in the Moog lineup, delivering the classic Moog analog sound quality without the
  complexity of their modular or monophonic instruments. The instrument excels particularly at string
  pads and lower octave organ tones with a techno-flavored character.

  The Opus-3 lacks patch memory and sequencing capabilities, keeping its focus purely on real-time
  performance. Notable users include Stereolab, Kraftwerk, 808 State, and The Rentals.
specs: |-
  - Polyphony: Polyphonic
  - Sections: Strings, brass, organ (independent)
  - Filter: 2 VCFs (strings and brass) with high-pass, low-pass, band-pass
  - VCA: Level and panning per section
  - Keyboard: 49 keys
  - Memory: None
  - Outputs: Dual (stereo panning)
  - Arpeggiator/Sequencer: None
  - Control: None
releaseDate: "1980"
