  - input_aux_link: Mini Jack, 10 kΩ
  - output_aux_link: Mini Jack
  - hf_eq_settings: -1.5 dB HF Cut / Neutral / +1.5 dB HF Boost
  - crossover_frequency: 1.8 kHz
  - low_frequency_alignment: Optimized Front Port
  - dimensions_inches: 15.4 x 10.0 x 11.8 (H x W x D)
  - dimensions_mm: 390 x 254 x 300 (H x W x D)
