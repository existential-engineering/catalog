details: |-
  The Tannoy REVEAL 802 is a 140W bi-amplified 8" studio reference monitor featuring a tuned front-firing bass port, custom woofer/tweeter drivers, and active crossover filters designed by Dr. Paul Mills. It delivers an ultra-wide sweet spot with XLR and 1/4" inputs plus an Aux Link for mobile device connectivity.
