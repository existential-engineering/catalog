details: |-
  The JHS Pedals Emperor V1, released in 2014, is a 100% Analog Chorus/Vibrato with Tap Tempo. It features a bucket brigade chipset for warm analog modulation. The V1 used a passive Tone control (later upgraded to an active EQ Tilt in the V2). Controls include Volume, Tone, Speed, and Depth. It is the predecessor to the Emperor V2.
