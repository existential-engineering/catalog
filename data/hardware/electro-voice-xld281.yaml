name: XLD281
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/xld281/
description: The XLD281 is a full-bandwidth, three-way compact line array
  element with 120-degree horizontal coverage, designed for medium- to
  large-scale touring and permanent installation applications. Each module pairs
  two 8-inch DVN2080 low-frequency neodymium woofers with two ND2S-8
  high-frequency neodymium compression drivers in a constant-curvature,
  line-array-coupled geometry, leveraging Electro-Voice's Coverage Control
  Technology (CCT) for predictable wavefront behavior across the array. The
  XLD281 covers 75 Hz to 18 kHz (-3 dB) and produces up to 137 dB continuous /
  143 dB peak SPL when arrayed in groups of four. It supports bi-amp or tri-amp
  operation with EV DSP presets (DN9848, IRIS, DX38/RACE, FIR-Drive) and
  integrates with subwoofers via the XLVC coupler. The 13-ply birch enclosure
  with EVCoat finish is rated IEC 529 IP24 and MIL-STD 810 for outdoor use, and
  the fully captive aluminum rigging supports flown arrays of up to 16 elements
  with an 8:1 safety factor at 1-degree splay increments. Array design is
  supported in EV LAPS II aiming and flying software.
details: >-
  Full-bandwidth, three-way compact line array element with 120-degree
  horizontal coverage


  Frequency range of 60 Hz to 20 kHz (-10 dB); 75 Hz to 18 kHz (-3 dB) measured
  in a four-element array


  Two 8-inch DVN2080 neodymium LF transducers (16 ohms each) and two ND2S-8
  neodymium HF compression drivers (16 ohms)


  Max calculated SPL of 137 dB continuous / 143 dB peak (four-element array, HF
  section, 1 m)


  LF power handling 200 W continuous / 800 W peak per LF section; HF 80 W / 320
  W


  LF-to-HF crossover at 1760 Hz; subwoofer-coupler bandpass 50-250 Hz with EV
  DSP


  Coverage Control Technology (CCT) waveguide for predictable array combining


  Bi-amp or tri-amp operation with EV DSP presets (DN9848, IRIS, DX38/RACE,
  FIR-Drive)


  Subwoofer integration via XLVC coupler accessory


  Vertical coverage is array-dependent and definable in LAPS II software


  Fully captive aluminum rigging with 1-degree splay increments; up to 16
  elements per array at 8:1 safety factor


  13-ply birch plywood enclosure with EVCoat finish; galvannealed steel grille
  with powder coat


  Outdoor-rated to IEC 529 IP24 and MIL-STD 810


  Two NL8 (Speakon-type) connectors for input and pass-through
