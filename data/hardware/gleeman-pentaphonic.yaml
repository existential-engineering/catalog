description: >-
  An extremely rare five-voice polyphonic analog synthesizer designed by brothers Al and Bob
  Gleeman, featuring three VCOs per voice, a built-in sequencer, and optional transparent
  plexiglass casing, with roughly 50 units ever produced.
details: |-
  The Gleeman Pentaphonic occupies a unique niche in synthesizer history as one of the rarest
  commercially produced analog polysynths. Designed by brothers Al and Bob Gleeman and
  released in 1982, only approximately 30 standard units and 20 Clear models were manufactured
  before production ceased in 1983, making surviving examples highly prized collectors items.

  The synthesis architecture is notably generous for its compact form factor. Each of the five
  voices contains three VCOs, giving the instrument 15 oscillators total for a rich, full
  analog sound. A 4-pole low-pass resonant filter with its own ADSR envelope shapes the
  timbre, while a separate ADSR envelope controls the VCA. A single LFO with sine wave output
  can be routed to the VCO, VCF, or VCA for modulation effects, and built-in chorusing in slow
  or fast modes adds further dimension.

  Despite its small 37-key, three-octave keyboard, the Pentaphonic includes a surprisingly
  capable 300-note real-time sketch-pad sequencer. An optional Presetter unit adds 100 patch
  memories and eight digital waveforms, significantly expanding the instrument's versatility
  beyond its default no-memory configuration.

  The Pentaphonic Clear variant, with its transparent plexiglass enclosure, was designed to
  be worn with a guitar strap for stage performance. Standard models featured a black case
  with a built-in speaker. The Audities Foundation has since restored and built additional
  units, keeping this obscure instrument from fading entirely into obscurity. Notable users
  include Moog Cookbook, Imperial Drag, and Alabama.
specs: |-
  - Polyphony: 5 voices
  - Oscillators: 3 VCOs per voice (15 total)
  - Filter: 4-pole low-pass resonant with ADSR envelope
  - VCA: ADSR envelope
  - LFO: 1 sine wave (routable to VCO, VCF, VCA)
  - Effects: Built-in chorus (slow/fast)
  - Sequencer: 300-note real-time
  - Keyboard: 37 keys
  - Memory: None (optional Presetter: 100 patches, 8 digital waveforms)
releaseDate: "1982"
releaseDateYearOnly: true
