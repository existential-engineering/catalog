details: |-
  The PRS S2 Standard 22 Satin is a workhorse guitar for gigging musicians. With an all-mahogany body and 22-fret set mahogany neck, this guitar is warm and sweet, making it toneful enough to stand up plugged straight into an amplifier and solid enough to serve as a great platform for even the most modern pedal board set up. The S2 Standard 22’s thin satin nitro finish gives this instrument a wonderful resonance and an open clarity, and when mahogany’s rich, round, warm tone meets the Maryland, USA-made PRS 58/15 LT pickups, there are plenty of clear highs and strong mids to be dialed in.

  The PRS S2 Standard 22 Satin is outfitted with the PRS patented tremolo and PRS Phase III tuners, featuring a handsome open-back design, unplated brass shafts, and highly-usable gear ratio. For the player who wants to cover a lot of ground with their music, the S2 Standard 22 Satin is a perfect choice.
