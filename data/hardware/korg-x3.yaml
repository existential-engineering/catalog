description: >-
  The Korg X3 is a 32-voice workstation synthesizer from 1993 that served as the
  successor to the legendary M1, featuring 6 MB of 16-bit PCM multi-samples, a
  16-track sequencer, and 47 digital multi-effects. Its solid bread-and-butter
  sounds and capable sequencing made it a popular mid-range production tool
  throughout the 1990s.
details: |-
  Launched in 1993, the Korg X3 built upon the foundation laid by the enormously successful M1 workstation. While it did not attempt to revolutionize the formula, it expanded and refined nearly every aspect, offering improved sample quality from its 6 MB 16-bit PCM ROM, greater polyphony at 32 voices, and a more flexible effects section with 47 digital multi-effects types.

  The X3 excelled as a practical workstation for songwriting and production. Its string, bass, and pad sounds were particularly well-regarded, and the 16-part multitimbral capability with velocity-sensitive and aftertouch-equipped 61-key keyboard made it a capable live performance instrument as well. The keyboard supports multi, layer, and split modes for combining patches in real time.

  The onboard 16-track sequencer with 10,000-note capacity and support for 9 songs provided enough recording power for complete arrangements. The digital lowpass filter, while non-resonant and velocity-sensitive, offered basic tonal shaping, and the 4-stage ADSR envelope generators handled amplitude and pitch contouring. With 200 user program and 200 user combi slots, there was ample storage for custom sounds. Vangelis is among the notable artists associated with the X3.
specs: |-
  - Polyphony: 32 voices
  - Multitimbral: 16 parts
  - Oscillators: 32, drawing from 6 MB 16-bit PCM waveform ROM
  - Filter: Digital lowpass (non-resonant), velocity sensitive
  - Envelopes: 4-stage ADSR
  - Effects: 47 digital multi-effects (reverb, delay, overdrive, EQ, chorus, rotary speaker)
  - Sequencer: 16 tracks, 10,000 notes, 9 songs
  - Keyboard: 61 keys with velocity and aftertouch (multi, layer, split modes)
  - Memory: 200 user programs, 200 user combis
  - Control: MIDI In/Out/Thru (16 parts)
