description: Duesenberg joins forces with The Bros. Landreth for a pair of
  matched instruments, Joey's Guitar, a unique interpretation of the Paloma
  fine-tuned for a slide player, and Dave's Bass, based on the Starplayer Bass
  design.
details: |-
  The Alliance Series Bros. Landreth is a collaboration between Duesenberg and the Winnipeg band The Bros. Landreth, covering two matched instruments. Joey's Guitar is a reinterpretation of Duesenberg's Paloma, fine-tuned for Joey Landreth's slide playing, while Dave's Bass is based on the Starplayer Bass design and built to supply a mellow but defined low end. Duesenberg describes the pair as geared to each other, the guitar's solid Alder body giving quick attack and long sustain and the bass using a semi-hollow maple and spruce construction.

  Joey's Guitar has a solid Alder body of 46 x 34 cm / 18" x 13.4" with 4.2 cm / 1.7" sides, multi-layer binding, a cream pickguard and a poly finish. The neck is a set one-piece Maple neck with a Medium D shape, an Indian Rosewood fingerboard of 305 mm / 12" radius, cream dot inlays, 22 jumbo frets, a steel dual-action trussrod and a 648 mm / 25.5" scale length, with the headstock finished to match the body.

  The pickup set is Duesenberg's own interpretation of a classic Gold-Foil singlecoil at the neck for transparency and clarity, a classically wound Duesenberg Alnico singlecoil in the middle, and a custom version of the Duesenberg Split/King duo-coil design, listed as the Phonico Splitking Custom, at the bridge. That bridge pickup can produce both genuine singlecoil and genuine humbucker tones through its coil design and was rewound for more output and bite.

  Wiring is one volume, one tone, a 3-way pickup selector and two mini-toggle switches on the pickguard. The 3-way positions give bridge humbucker, bridge humbucker with neck singlecoil, and neck singlecoil; the upper toggle switches the bridge pickup between humbucker and singlecoil modes, and the lower toggle adds the middle singlecoil in any position.

  Hardware is nickel finished and includes Duesenberg Z-Tuners in the half-open style, a Duesenberg Steel Saddle Bridge, the Duesenberg Radiator Tremola vibrato in its short version and Straplock-compatible Duesenberg Standard strap pins, with Duesenberg Custom 19/56 strings. Every fingerboard passes through Duesenberg's Plek process so the frets are level, which the maker treats as the basis for its hand fret polishing and setup work, and the instrument includes a Duesenberg Custom Line Case and all required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream Dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Matching Color
  - Body type: Solid Body, Alder
  - Body dimensions: 46 x 34 cm / 18" x 13.4"
  - Height (sides): 4.2 cm / 1.7"
  - Pickguard: Cream
  - Binding: Multi-layer binding
  - Finish: Poly finish
  - Tuners: Duesenberg Z-Tuners half open
  - Bridge: Duesenberg Steel Saddle Bridge
  - Vibrato System: Duesenberg Radiator Tremola, short version
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware finish: Nickel
  - Strings: Duesenberg Custom 19/56 (019-022p-024w-032-044-056)
  - Pickup (neck): Duesenberg Gold-Foil
  - Pickup (middle): Duesenberg Alnico Singlecoil
  - Pickup (bridge): Duesenberg Phonico Splitking Custom
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector, 2 Mini-Toggle Switches
  - Case: Duesenberg Custom Line Case (included)
  - Tools: All required allen keys (included)
