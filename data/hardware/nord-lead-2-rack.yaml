description: >-
  The Nord Lead 2 Rack is a rack-mount version of Clavia's acclaimed Nord Lead 2 virtual
  analog synthesizer, offering 16-voice polyphony and dual oscillators with versatile
  waveforms. It builds on the original Nord Lead's proven synthesis engine while adding a
  ring modulator, expanded LFO and arpeggiator options, and filter distortion with
  dedicated individual outputs.
details: |-
  The Nord Lead 2 Rack delivers the same synthesis architecture and sonic character as the keyboard version in a compact rack-mount format. It features two VSM oscillators per voice with sine, triangle, sawtooth, pulse, and noise waveforms, paired with dual filters offering both 12 dB/oct 2-pole lowpass and 24 dB/oct 4-pole modes with lowpass, bandpass, and highpass options.

  Key enhancements over the original Nord Lead include a ring modulator, additional LFO waveforms, expanded arpeggiator functionality, and filter distortion. Two LFOs provide triangle, sawtooth, and random waveforms for rich modulation possibilities. The unit supports 99 patches, 99 performances, and 10 drum kits, with full MIDI implementation across four parts.

  The Nord Lead 2 Rack has been embraced by a wide range of professional artists including The Crystal Method, Fatboy Slim, Nine Inch Nails, The Prodigy, Depeche Mode, Jean Michel Jarre, Underworld, and Skinny Puppy, cementing its reputation as a versatile and reliable virtual analog synthesizer for studio and live use.
specs: |-
  - 16-voice polyphony
  - 2 VSM oscillators per voice (sine, triangle, sawtooth, pulse, noise)
  - 2 LFOs with triangle, sawtooth, and random waveforms
  - Ring modulator
  - Dual filters: 12 dB/oct 2-pole lowpass and 24 dB/oct 4-pole (lowpass/bandpass/highpass)
  - Filter distortion
  - 99 patches (59 preset, 40 user)
  - 99 performances
  - 10 drum kits
  - 4-part multitimbral via MIDI
  - Dedicated individual outputs
  - Rack-mount format
releaseDate: "1997"
