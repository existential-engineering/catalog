details: |-
  Powered mixers fulfil a widespread need for simple integrated tools that remove much of the hassle involved in setting up a sound system, whether it be a permanent or temporary installation. The inclusion of amplification means that you can plug speakers straight into the mixer, without worrying about finding an external power amp. But a live mixer will also often include additional features that are usually performed by external processors - such as reverb and delay processing, or graphics EQ.

  This integrated approach offers several advantages. Most importantly, the mixer and amplifier have been designed to complement each other electronically, so there's no possibility of mismatching between mixer and amp. When time is tight, setting up for a club gig, having everything in one box can mean peace of mind. There are fewer leads to unpack and connect, and fewer boxes to set up, leaving more precious minutes to soundcheck and prepare for a performance. In a permanent installation, there are advantages - a powered mixer is much more compact than separate units, saving valuable space. And if you're setting up an installation from scratch, it's easier to choose a well-designed powered mixer than to pick out several separate boxes to perform the same task. Applications:
