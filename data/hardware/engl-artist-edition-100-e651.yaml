url: https://www.engl-amps.com/shop/heads/artist-edition-100-e651/
description: Four-channel 100 W all-valve guitar amplifier head based on the
  E650 Ritchie Blackmore design, with EL34 power valves, a valve-buffered FX
  loop, noise gate and dual master volumes.
details: |-
  This amp has a very special history. It is our hidden gem, the secret prototype that became legendary as it passed between the iconic studios of Los Angeles. Based on the E650 Ritchie Blackmore amps, we designed an amp for Doug Aldrich back in 2005. It was supposed to feature a few modifications, such as EL34 tubes in the power amp stage; increased dynamics and unmatched tone was the mission. The concept was clear: easy handling, practical features and peak performance. But somehow, this amp never saw the light of day, and never got released.

  Instead, it ended up in our showroom in Los Angeles. From there, it made the rounds through various studios in the music metropolis, and was played by renowned greats like Jimmy Page, Ken Hammer, Vivian Campbell, Paul Stanley and Scott Gorham. And, finally, and due to the great response from these world-class players, we have decided to raise this model from the prototype stage to the status of an official ENGL amp.

  The E651 is an all-valve head delivering 100 watts from four EL34 output valves and four ECC83 (12AX7) preamp valves, across four channels: Clean, Crunch, Soft Lead and Heavy Lead. Each channel has its own gain control and a shared three-band EQ, with Bright, Shape and Gain Lo/Hi voicing switches plus Lead Presence and Lead Volume.

  A valve-buffered FX loop with a balance control, a noise gate, switchable Master A and Master B volumes and a power valve monitor round out the feature set. Channel and feature switching is available over the dual footswitch jack for the ENGL Z4 or over the S.A.C. (Serial Amp Control) port for the ENGL Z9.
specs: |-
  - 4 channels: Clean, Crunch, Soft Lead, Heavy Lead
  - All-valve head
  - Valve-buffered FX loop with balance control
  - Noise gate
  - Master A/B
  - Power valve monitor
  - S.A.C.: Serial Amp Control
  - Sound options: Bright, Shape, Gain Lo/Hi
  - Controls: Gain (per channel), 3-band EQ, Lead Presence, Lead Volume, Master A, Master B, FX Loop Balance
  - Poweramp output: 1 x 4 ohm, 1 x 8 ohm, 1 x 16 ohm, 2 x 8 ohm parallel, 2 x 16 ohm parallel
  - Footswitch: Z4 or Z9 (channels, Master A/B, Shape, FX loop, noise gate)
  - Preamp valves: 4 x ENGL ECC83 / 12AX7
  - Output valves: 4 x ENGL EL34
  - Output power: 100 W
  - Dimensions: 71 x 27 x 29 cm
  - Weight: 20.5 kg
