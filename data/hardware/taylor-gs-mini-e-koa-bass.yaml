details: |-
  The GS Mini-e Koa Bass brings Hawaiian koa character to Taylor's compact GS Mini bass platform. The solid Hawaiian koa top delivers warm, snappy bass tone with beautiful visual character, while the layered koa back and sides reinforce that sonic signature and provide durability for travel and everyday use.

  The 23-1/2" scale length and nylon-core bass strings formulated specifically for this instrument by D'Addario give it a relaxed, approachable feel. The ebony fretboard and bridge complement the tonal warmth of the koa body, while Nubone nut and Micarta saddle contribute to clear note definition.

  Built-in ES-B electronics include a digital chromatic tuner, making the GS Mini-e Koa Bass stage-ready without additional equipment. Matte finish on top and back/sides. Each guitar ships with a padded gig bag.
specs: |-
  - - Body Shape: GS Mini
  - Top: Solid Hawaiian Koa (matte)
  - Back & Sides: Layered Koa, 2-piece (matte)
  - Neck: Tropical Mahogany
  - Fretboard: Ebony
  - Fretboard Inlay: 4mm Dot Italian Acrylic
  - Bridge: Ebony
  - Nut: Nubone
  - Saddle: Micarta
  - Scale Length: 23-1/2"
  - Electronics: ES-B with built-in digital chromatic tuner
  - Strings: D'Addario Coated Phosphor Bronze Bass (.037-.090)
  - Tuners: Die-Cast Chrome
  - Finish: Matte
  - Case: Padded gig bag included
