details: |-
  Introducing the One Control Beth Reverb: Tomo Fujita's Signature Pedal for Maximum Expression

  The Beth Reverb is a result of an extraordinary collaboration between One Control and world-renowned guitarist and Berklee College of Music professor, Tomo Fujita. Fujita, a guitarist celebrated for his versatile playing across funk, blues, rock, and jazz, has long relied on One Control's PRUSSIAN BLUE REVERB and BJF-S100 amplifiers for his signature sound. This latest innovation—the Beth Reverb—has been meticulously crafted to offer the depth and versatility that Fujita demands, enabling players to navigate a vast range of styles with a single pedal. A Dual-Reverb Pedal Designed for Sonic Flexibility

  The Beth Reverb expands on One Control's highly regarded PRUSSIAN BLUE REVERB by integrating two distinct reverb types that can be accessed seamlessly with a footswitch. This unique dual-mode capability allows players to shift instantly between reverb settings, making it a versatile solution for a range of musical contexts and genres. Reverb A : This setting channels the classic sound of the PRUSSIAN BLUE REVERB that Fujita has relied on for years. Known for its ideal reverb tone, Reverb A combines spacious sound diffusion with a dynamic range that enhances your guitar's natural qualities without overwhelming it. With Reverb A, the decay time is subtly modulated for a spatial effect, creating a reverb that feels organic and immersive. It's designed to be used as a "always-on" effect that provides a rich sonic foundation across different musical styles. Controls include:

  • Decay: Adjusts the length of the reverb tail. • Tone: Controls the brightness or darkness of the reverb effect. • Level: Adjusts the volume of the reverb, allowing it to blend seamlessly with the dry signal. Reverb B : Inspired by classic plate reverb, Reverb B introduces a more pronounced and enveloping effect, ideal for atmospheric or introspective passages. This setting enhances the depth and richness of the reverb, delivering a "fantasy" ambiance that surrounds each note. The original guitar tone is subtly reinforced in this mode, providing added body and warmth without muddying the clarity. Reverb B's controls allow precise adjustments:

  • Decay: Sets the reverb tail's length for more control over sustain. • Intensity: Adjusts the reverb's strength, providing either a subtle background or a prominent spatial presence. • Level: Balances the reverb volume in the mix. Streamlined Switching and Professional-Grade Sound

  The Beth Reverb is designed for ease of use. A straightforward A/B switch lets you alternate between Reverb A and Reverb B on the fly. Additionally, a dedicated on/off switch allows players to engage or bypass the effect as needed. The pedal has built-in muting during reverb switching and effect engagement to prevent any noise or signal interference, delivering a pristine, noise-free performance that stands up to professional demands on stage and in the studio. Crafted to Match Tomo Fujita's Vision

  Tomo Fujita's journey with the Beth Reverb began with his search for a reverb pedal that could complement the various amplifiers he uses, each of which produces unique reverb characteristics. Upon discovering One Control's PRUSSIAN BLUE REVERB, Fujita appreciated its compact size, high sound quality, and intuitive design. Recognizing that his wide-ranging style required even greater tonal flexibility, Fujita and One Control began developing the Beth Reverb, refining its features through extensive prototyping. "My playing moves from fast, funky rhythm cuts to slow, melodic originals," Fujita explains. "I wanted a reverb that could handle both subtle background and more intense, atmospheric reverb. After countless adjustments, One Control and I finally created my ideal reverb pedal—the Beth Reverb. It's truly the best reverb pedal I've ever used."

  Technical Specifications and Features

  The Beth Reverb's compact size and lightweight design make it easy to integrate into any pedalboard setup without sacrificing functionality. It's powered by a standard 9V DC adapter (center-minus), ensuring compatibility with most setups, and provides a clean signal path that maintains the integrity of the original tone. • Input Impedance: 500K
  • Output Impedance: 2K
  • Current Consumption: 60mA
  • Signal-to-Noise Ratio: -96dBm
  • Dimensions: 80W x 120D x 30H mm (without protrusions), 85W x 120D x 48H mm (with protrusions)
  • Weight: 390g

  Explore the Beth Reverb

  The Beth Reverb stands out as a versatile and finely tuned pedal, perfect for guitarists seeking a reverb effect that adapts to multiple genres and styles. Whether you're chasing atmospheric soundscapes, subtle ambience, or a rich foundational tone, the Beth Reverb provides intuitive controls, premium quality, and the tonal flexibility you need to make each performance memorable. Tomo Fujita: Renowned Guitarist, Instructor, and Master of Groove

  Tomo Fujita is a globally acclaimed Japanese guitarist and educator known for his expertise in blues, funk, and jazz. An Assistant Professor in the Guitar Department at Berklee College of Music in the United States, Fujita's classes are immensely popular, often filling up within hours of registration. His teaching has influenced many top-tier musicians, including John Mayer and Eric Krasno of Soulive, and his innovative approach to groove and feel is highly respected worldwide. Beyond Berklee, Fujita offers private and online lessons, including lessons for Japanese students, where he emphasizes his unique "groove-first" philosophy. His instructional materials have become long-time bestsellers with over 155,000 copies sold in total. In addition to teaching, Fujita is an accomplished performer, known for his improvisational style rooted in blues. His live performances, which have taken him across the globe, are celebrated for their groove-rich, expressive character, reflecting his dedication to musicality and depth. Through both his instructional and performance work, Tomo Fujita has become a major influence on guitarists around the world. ・ Beth Reverb Manual.pdf

