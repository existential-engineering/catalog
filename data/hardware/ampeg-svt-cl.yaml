description: "The SVT-CL is Ampeg's modernized version of its legendary 300-watt
  all-tube bass amplifier head, descended directly from the original late-'60s
  SVT but updated with a balanced output and Neutrik speakON jack for
  contemporary stage and studio use."
details: |-
  There is perhaps no amp more mimicked on earth than the Ampeg SVT. When it burst onto the scene in the late '60s, it not only revolutionized the instrument — it forever changed music. Finally, bass players had an amp that could compete with the screaming guitars and thunderous drums that were coming to define rock music.

  Fast-forward 50 years and not much has changed. There still is no other amp out there that delivers the durability, sonic flexibility, and beautifully textured, harmonically rich sound of the SVT. The SVT-CL is a direct descendant of the early models, carrying forward the all-tube architecture and unmistakable tonal character that made the original a studio and touring staple.

  The SVT-CL adds a few modern touches — like a balanced output and a Neutrik speakON jack — that bring it into the 21st century without compromising the classic sound. Its 300 watts of all-tube power, plug-and-play operation, and harmonically rich tone keep it relevant for bassists who want the original SVT experience with modern connectivity.

  Player-focused features include a user-adjustable bias circuit for fine-tuning the output tubes and a flexible 5-way midrange frequency selector. At 80 lb (36.3 kg), it retains the substantial build of the original.
specs: |-
  - 300 Watts
  - All-tube design
  - Plug-and-play operation
  - User adjustable Bias circuit
  - Flexible 5-way midrange frequency selector
  - Balanced output
  - Neutrik speakON jack
  - Weight: 80 lb (36.3 kg)
