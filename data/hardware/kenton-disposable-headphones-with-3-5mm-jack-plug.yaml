details: |-
  Low cost headphones of the over the head type rather than in-ear, intended for situations where a pair is handed out and not expected back.

  The drivers are 27mm mylar transducers with an impedance of 32 ohms, a maximum power input of 100mW and a quoted frequency range of 40Hz to 20kHz. The whole pair weighs 40 grams.

  The captive cable is 1.15 metres long and terminates in a 3.5mm stereo jack plug. Bulk quantities are available, and can be supplied with a 3.5mm to 1/4 inch adaptor for a small extra charge.
