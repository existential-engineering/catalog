details: |-
  Designed as an intermediate Drum Set, the Ludwig Element Evolution is everything an aspiring drummer needs to excel. The Evolution Series Outfit comes with double braced hardware, and Remo Pinstripe Drum Heads to make this great for drummers of any age who are ready to take the next step.

  The Evolution Series is offered in three standard outfits: a 20-inch five-piece outfit, a 22-inch five-piece outfit, and a 22-inch six-piece outfit. Each configuration ships as a complete shell pack with matching hardware.

  Finishes available include Caramel Sparkle, Crimson Sparkle, Atlantic Sparkle, and Prosecco Sparkle, giving players a range of visual options across the line.
specs: |-
  - Intermediate-level drum set
  - Double braced hardware included
  - Remo Pinstripe drum heads
  - Standard outfits: 20" 5-piece, 22" 5-piece, 22" 6-piece
  - Finishes: Caramel Sparkle, Crimson Sparkle, Atlantic Sparkle, Prosecco Sparkle
