description: Reference 800 Series Signature stand-mount loudspeaker featuring a
  Diamond Dome tweeter in a Solid Body Tweeter-on-Top housing paired with a
  Continuum cone bass/midrange driver, in a 2-way vented-box cabinet with Matrix
  bracing.
details: |-
  The 805 D4 Signature is the latest evolution of Bowers & Wilkins' reference stand-mount loudspeaker, sitting at the top of the 800 Series Signature line. It is a compact two-way design built around a 25 mm Diamond Dome high-frequency tweeter and a 165 mm Continuum cone bass/midrange driver in a vented-box cabinet.

  The tweeter is housed in a Solid Body Tweeter-on-Top assembly machined from a single piece of aluminium, decoupled from the main cabinet to minimise resonance and coloration. The Continuum cone bass/midrange driver provides controlled, neutral midrange behaviour that has become characteristic of the 800 Series.

  Cabinet construction uses Matrix internal bracing for rigidity, with a Flowport bass-reflex port and an Anti-Resonance plug to reduce internal standing waves. The cabinet is offered in California Burl Gloss and Midnight Blue Metallic finishes unique to the Signature series.

  Electrically, the 805 D4 Signature presents a nominal 8 ohm load (minimum 4.6 ohm) with 88 dB SPL sensitivity, and is rated for amplifiers delivering 50 W to 120 W into 8 ohms. Frequency response extends from 42 Hz to 28 kHz (±3 dB), with a quoted frequency range of 34 Hz to 35 kHz (−6 dB).

  Dedicated FS-805 D4 floor stands are available separately to position the speaker at the correct listening height.
specs: |-
  - Configuration: 2-way vented-box system
  - High-frequency driver: 1x 25 mm (1 in) Diamond Dome tweeter
  - Bass/midrange driver: 1x 165 mm (6.5 in) Continuum cone
  - Frequency range: 34 Hz – 35 kHz (-6 dB)
  - Frequency response: 42 Hz – 28 kHz (±3 dB)
  - Sensitivity: 88 dB SPL (2.83 Vrms, 1 m)
  - Harmonic distortion: <1% (90 Hz–20 kHz), <0.3% (120 Hz–20 kHz) at 90 dB, 1 m on-axis
  - Nominal impedance: 8 Ω (minimum 4.6 Ω)
  - Recommended amplifier power: 50 W – 120 W into 8 Ω
  - Maximum recommended cable impedance: 0.1 Ω
  - Cabinet technologies: Matrix bracing, Anti-Resonance plug, Flowport, Solid Body Tweeter-on-Top
  - Height: 440 mm (17.3 in)
  - Width: 240 mm (9.4 in)
  - Depth: 373 mm (14.7 in)
  - Net weight: 15.55 kg (34.3 lb)
  - Finishes: California Burl Gloss, Midnight Blue Metallic
