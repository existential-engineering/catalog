description: "Compact power and precision: the 805 D4 Signature stand-mount
  speaker pairs a Diamond Dome tweeter and an upgraded crossover with a
  Continuum cone bass/midrange driver."
details: |-
  The 805 D4 Signature is a compact and powerful two-way vented-box stand-mount loudspeaker at the top of the 800 Series Signature line. It features fully optimised technologies including the Diamond Dome tweeter and the Solid Body Tweeter-on-Top housing, and is a passive design rated for amplifiers of 50W to 120W into 8 ohms with no mains connection of its own.

  Bowers & Wilkins describes the Diamond Dome tweeter as one of its most significant accomplishments of the past two decades: an ultra-stiff, supremely accurate dome combining low mass, exceptional stiffness and outstanding accuracy. Fifteen years after introducing it, the company says it has not found a better tweeter dome technology.

  The Solid Body Tweeter-on-Top housing has an elongated form with a longer tube-loading system and an all-new design of tweeter grille, producing an even more free and open sound at high frequencies.

  The 805 D4 Signature uses an upgraded rear-mounted crossover mounted on stiff aluminium spines. This isolates the sensitive capacitors from the unwanted effects of air pressure within the enclosure and acts as an effective heatsink for optimum performance in use.

  Bass and midrange come from a single 165mm Continuum cone driver, whose composite construction avoids the abrupt transitions in behaviour that can impair a conventional drive unit, for a more open and neutral performance. The cabinet measures 440mm high by 240mm wide by 373mm deep, weighs 15.55kg, and is offered in California Burl Gloss and Midnight Blue Metallic finishes unique to the Signature series. Dedicated FS-805 D4 stands are sold separately.
specs: |-
  - Description: 2-way vented-box system
  - Technical features: Diamond tweeter, Solid Body Tweeter-on-Top, Continuum cone bass/midrange, Matrix, Anti-Resonance plug, Flowport
  - Drive units: 1x 25mm (1in) Diamond Dome high-frequency, 1x 165mm (6.5in) Continuum cone bass/midrange
  - Frequency range: -6dB 34Hz to 35kHz
  - Frequency response: 42Hz to 28kHz (+/-3dB)
  - Sensitivity: 88dB spl (2.83Vrms, 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis)
  - Nominal impedance: 8 ohms (minimum 4.6 ohms)
  - Recommended amplifier power: 50W to 120W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 440mm (17.3in), Width 240mm (9.4in), Depth 373mm (14.7in)
  - Net weight: 15.55kg (34.3 lb)
  - Cabinet finishes: California Burl Gloss, Midnight Blue Metallic
  - Grille finishes: Black
