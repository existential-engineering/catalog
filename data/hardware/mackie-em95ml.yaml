details: |-
  Pro Look. Pro Sound. On Your Smartphone.

  The EM-95ML features a clip-on in-line amplifier that maintains audio quality while boosting output for broadcast-worthy recordings. It includes a built-in rechargeable battery, real-time monitoring via headphone connection, and adjustable gain control. The omnidirectional condenser lavalier mic captures vocal detail and includes a foam windscreen.
specs: |-
  - Premium lavalier with in-line amplifier
  - Omnidirectional condenser design
  - Clip-on in-line amplifier with high-level output
  - Adjustable gain control
  - Compatible with smartphones and DSLRs
  - Includes foam windscreen
  - USB-C rechargeable with included cable
