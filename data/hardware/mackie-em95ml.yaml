description: Mackie EM-95ML lavalier microphone with in-line amplifier for smartphones.
details: |-
  The EM-95ML features its own in-line amplifier. This clip-on in-line amplifier keeps your audio clean while boosting output for clear, broadcast-worthy recordings. And with a built-in rechargeable battery, you can use it all day with no worries.

  If you need real time monitoring, you can connect a pair of headphones directly to the amplifier. Adjustable gain provides precise level control for your mic allowing you to dial it in just right. Using an omnidirectional condenser design, the included lavalier mic is designed to capture all the rich detail from your voice.

  When it comes to consistent sound for a single subject, a lavalier mic is often your best bet. Not only does it offer great sound, it is small and discrete, perfect when on camera. From cooking videos to mobile journalism, the EM-95ML is a mobile lavalier microphone setup for content creators.
specs: |-
  - Premium lavalier microphone with in-line amplifier provides clear, high-output audio
  - Omnidirectional condenser design delivers detail and warmth
  - Clip-on in-line amplifier provides high level output for higher quality audio and less noise
  - Adjustable gain on the amplifier allows for precise level control
  - Suited to both smartphones and DSLRs
  - Includes a foam windscreen
  - Recharges via USB-C with included cable
