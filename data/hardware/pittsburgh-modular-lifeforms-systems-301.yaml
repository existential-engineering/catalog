description: >-
  The Lifeforms Systems 301 is a complete analog modular synthesizer system by
  Pittsburgh Modular featuring the Lifeforms SV-1 dual oscillator synthesizer
  voice and the Lifeforms KB-1 pressure-sensitive keyboard controller. It
  functions as a stand-alone synthesizer with a hardwired signal path while
  remaining fully patchable for advanced sound design. The powered case provides
  112hp of additional Eurorack space for expansion modules.
details: |-
  The System 301 targets users interested in Eurorack format synthesis without requiring purchase of multiple individual modules. It combines the Lifeforms SV-1 analog synthesizer voice with the Lifeforms KB-1 keyboard controller in a single powered enclosure, providing an immediate playing experience out of the box.

  The analog synthesizer engine includes two full-range voltage-controlled oscillators covering classic waveforms including sine, triangle, sawtooth, pulse, and square. Oscillator 1 features an exclusive "blade wave," and both oscillators include two sub-octave generators. The signature Pittsburgh Modular filter provides voltage control across the entire frequency range with separate highpass, lowpass, and bandpass outputs.

  Modulation tools include a dedicated analog LFO with sample-and-hold, noise generator, and a clock-syncable digital LFO. Oscillator 2 can function as a voltage-controllable low-frequency oscillator for FM synthesis capabilities. An attenuverter provides precise frequency modulation control with optional input inversion.

  The Lifeforms KB-1 keyboard controller offers arpeggios, a 64-step sequencer, triggers, and voltage memory functions. Users can override internal audio and CV signal paths via patch points, enabling deep modular patching while retaining the convenience of a hardwired default routing.
specs: |-
  - Polyphony: 1 voice
  - Oscillators: 2 analog VCOs
  - Waveforms: Sine, triangle, sawtooth, pulse, square, blade wave
  - Sub-oscillators: 2 sub-octave generators per oscillator
  - Filter: Multi-mode with highpass, lowpass, and bandpass outputs
  - LFO: 1 analog LFO with sample-and-hold, plus 1 clock-syncable digital LFO
  - VCA: 1 VCA with decay, sustain, and release
  - Sequencer: 64-step sequencer
  - Arpeggiator: Multi-mode arpeggiator
  - Control: MIDI in, CV in, CV out, gate out
  - Expansion: 112hp available for additional Eurorack modules
  - Format: Eurorack
