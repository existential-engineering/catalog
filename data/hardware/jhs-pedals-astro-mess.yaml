details: |-
  The Astro Mess is a Silicon Fuzz design that blends vintage and modern fuzz character. Born from Switchfoot's Drew Shirley's request and Josh Scott's knowledge of fuzz, it tips its hat to classic circuits like the Ampeg Scrambler, Kay Fuzztone, and Octavia with its massive gain and volume. Features a volume knob, fuzz knob, and a gate toggle that — when activated — makes every note crush beneath your picking technique. Heard on Switchfoot's 'Mess of Me' and 'The Sound'.
