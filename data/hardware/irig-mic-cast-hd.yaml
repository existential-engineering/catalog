details: |-
  The iRig Mic Cast HD is a dual-sided digital condenser microphone featuring 2x 0.55" gold-sputtered electret condenser capsules. Three selectable polar patterns (Cardioid front, Cardioid rear, and Figure-of-8 using both capsules) cover solo recording, interviews, and conference scenarios. Gain is adjustable over a 48 dB range.

  Controls include gain buttons, a capsule selector, and a direct monitor switch, with a built-in multicolor LED for status and audio level indication. The snap-on magnetic mounting system with included ferromagnetic plates enables quick attachment to devices and surfaces.

  Compatible with iOS (iPhone 5+), iPad, Mac (macOS 10.6+), Windows (with ASIO driver), and Android (5.0+ with USB digital audio). Includes Lightning to micro-USB cable, USB-C adapter, micro-USB OTG cable, windshield, and iRig Recorder 3 LE software.
