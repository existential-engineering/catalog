description: A replica of a 1973 MKIII Tonebender fuzz pedal featuring three
  silicon transistors that capture the touch and response of vintage germanium,
  with Volume, Tone, and Attack controls plus a JHS Mode switch for extra gain
  and a mid-frequency boost.
details: |-
  The "Legends Of Fuzz" series is a collection of the world's most historic, rare, and sought after circuits. The JHS Bender is a recreation of a 1973 MK3 Silver/Orange "Onomatopoeia" Tonebender. This version has three very special germanium transistors in the original, but the JHS version uses carefully chosen modern silicon transistors to capture the touch, feel, and response of the vintage germanium fuzz with accuracy and consistency. The controls are Volume, Tone, and Attack. Volume sets the overall output level. Tone sweeps between bright and dark tones. Attack is the distortion control — the more you turn it clockwise, the more fuzz you create. A "Mode" button on the side gives access to JHS Mode for more gain and a mid frequency boost. If you love the fuzz sounds of Led Zeppelin, Jeff Beck, The Beatles, Mick Ronson (David Bowie), and My Bloody Valentine, then the Bender is for you.
