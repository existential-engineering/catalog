url: "https://www.burlaudio.com/products/b4-mic-pre"
description: "4-channel MIC/LINE input daughter card for the B80 and B16
  MOTHERSHIP chassis featuring the new BX6 input transformer, class-A NextGen
  Analog BOPA14 circuitry, and the same ADC as the BAD8 — delivering up to 40
  channels of audiophile MIC/LINE inputs per B80 chassis."
details: |-
  The B4 is a 4-channel MIC/LINE input daughter card designed for the B80 and B16 MOTHERSHIP chassis. BURL Audio introduced the new BX6 input transformer specifically for the B4, engineered to handle true MIC/LINE input impedance without compromise.

  The B4 maintains an all class-A, no-compromise analog signal path using NextGen Analog BOPA14 op-amps, followed by the same high-quality ADC used in the BAD8. A single B80 chassis can host up to 10 B4 daughter cards, providing a total of 40 MIC/LINE input channels.

  Combined with SoundGrid or Dante digital control, the B80 MOTHERSHIP with B4 cards becomes a studio-grade stage box suitable for professional recording and live sound applications.
specs: |-
  - 4-channel MIC/LINE ADC
  - 4 XLR inputs on front panel
  - All class-A, NextGen Analog BOPA14 op-amps
  - BX6 input transformers
  - Up to 40 total MIC/LINE input channels per B80 chassis
  - Avid delay matching
  - ADC filter select
  - Fully balanced signal path for extremely low noise floor
  - Frequency Response (LINE, 0 dB gain): -0.03 dB @ 10 Hz, -1.5 dB @ 30 kHz
  - Frequency Response (full gain, 59 dB): -0.03 dB @ 10 Hz, -2.5 dB @ 30 kHz
  - Input Impedance LINE: 10k Ohms
  - Input Impedance MIC: 2.5k Ohms
