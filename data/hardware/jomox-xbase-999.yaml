description: >-
  A nine-voice analog drum synthesizer from 2006 combining four discrete analog
  circuits with five sample-based voices, a 64-pattern step sequencer, and a
  rugged metal enclosure.
details: |-
  The JoMoX Xbase 999 is a hybrid analog drum synthesizer released in 2006 that combines advanced
  discrete analog circuitry with sample-based sound generation. Four of its nine instruments use
  fully analog discrete circuits for authentic analog drum synthesis, while the remaining five employ
  short 8-bit samples processed through analog VCA envelopes, blending the best of both approaches.

  The front panel is dominated by buttons, knobs, and LEDs arranged in a logical layout with a 2x24
  character LCD display. A stereo filter section provides independent control over cutoff, resonance,
  and Q parameters. Two operational modes separate performance and sound design: Master mode handles
  pattern selection and playback, while Edit mode gives access to all synthesis parameters.

  The classic step sequencer features LED indicators and supports 64 patterns organized across four
  banks with 16 A/B patterns each. Four programmable MIDI tracks enable sequencing of external
  instruments alongside the internal voices, expanding the Xbase 999 into a complete rhythm
  production hub. Two LFOs with multiple waveforms including clocked and free-running modes add
  rhythmic modulation possibilities.

  Housed in a sturdy metal steel enclosure with wooden end cheeks, the Xbase 999 was built for
  serious production use. It was discontinued around 2013.
specs: |-
  - Polyphony: 9 voices
  - Multitimbral: 9 parts
  - Sound Sources: 4 analog discrete circuits, 5 sample-based with analog VCA
  - Waveforms: Pulse, pulse variable, ROM
  - LFO: 2 (sawtooth up/down, square, triangle, clocked, free-run)
  - Envelopes: Attack and decay per voice
  - Filter: Stereo with independent cutoff, Q, resonance
  - Sequencer: 64-pattern step sequencer plus 4 MIDI tracks
  - Display: 2x24 character LCD
  - Control: MIDI In/Out/Thru
