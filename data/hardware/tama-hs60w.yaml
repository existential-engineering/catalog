description: The HS60W is a sturdy, double-braced snare drum stand. It features
  the Quick-Set tilter which allows easy position of the snare drum at virtually
  any angle.
details: |-
  Quick-Set Tilter (US. PAT.NO.7385127): TAMA's patented toothless Quick-Set Tilter marks another TAMA advancement in hardware. Relying on basic principles of physics, the Quick-Set Tilter holds its position using the friction of six smooth metal disc plates instead of traditional toothed gears, so you can adjust it to any desired angle. This mechanism also has a more durable structure than a conventional gear tilter.

  Escape Claw: TAMA’s Escape Claws rubber cushions allow the snare drum to float on the basket arms for improved resonance. In addition, they help reduce fatigue by softening the impact of snare drum playing on your arms and wrists.

  Swiveling Basket: Asymmetrically spaced basket arms allow an 8 or 10 lug drum to be held without interference with its strainer, butt or lugs. Since the basket rotates independently from the stand, you can place the strainer in any position needed.

  Nylon Washers: By inserting nylon washers into the leg stand joints we have improved durability and made the leg action much smoother!
