description: Performance and studio-ready analog stereo filterbank.
details: |-
  The Desktop Resonant Filterbank is a performance and studio production friendly FX unit, an analog stereo filterbank. It has a set of ten bandpass filters with hands-on control over each band's boost or cut, plus complex control configurations that turn it into an unconventional multimode filter with an envelope follower, an instrument in its own right when played with various resonance settings, or even an experimental sound generator for no-input mixer style setups.

  It suits synthesizers, drum machines and modular setups, and thanks to an analogue GAIN STAGE that boosts incoming signals up to +24dB it also takes guitars and pretty much any other instrument. This is a tool for discovering entirely new sounds from instruments you thought you knew inside out.

  Beyond the filterbank itself there are a multimode filter mode, a spectral analyzer mode and a dynamic spectral compressor mode, with 20 independent LFOs and 20 independent envelope followers available for modulation, and configurable resonance feedback loops. Band boost and cut, resonance and event synchronisation to MIDI clock are all controllable over MIDI CC.

  User snapshots (presets) fill 128 slots with discrete or morphing changes between them, and MIDI control covers all parameters. A sleek aluminium case matches the rest of the compact desktop line, making the Resonant Filterbank an integral part of studio and live performance setups.
specs: |-
  - Analog 10-band stereo filterbank
  - Filter frequencies: 29 Hz, 61 Hz, 115 Hz, 218 Hz, 411 Hz, 777 Hz, 1.5 kHz, 2.8 kHz, 5.2 kHz, 11 kHz
  - Filter slope: 17 dB/decade
  - High quality film capacitors in the bandpass filters
  - Manual and MIDI CC controlled band boost and cut
  - Configurable resonance feedback loops
  - Manual and MIDI CC controlled resonance
  - MIDI clock synchronization of events
  - Multimode filter mode
  - Spectral analyzer mode
  - Dynamic spectral compressor mode
  - 20 independent LFOs
  - 20 independent envelope followers
  - User snapshot (preset) memory with 128 slots
  - Discrete and morphing snapshot change
  - Gain stage boosts incoming signals up to +24dB
  - 6.3mm balanced stereo inputs and outputs
  - Configurable footswitch input
  - DIN 5 MIDI IN and MIDI OUT
  - Dimensions: 25,8 x 17,6 x 7 cm (including knobs)
  - Mass: 1,1 kg
