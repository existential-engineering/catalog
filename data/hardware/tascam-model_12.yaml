id: VKpEfqz3KKGpHnv221Eql
name: Model 12
manufacturer: tascam
primaryCategory: mixer
categories:
  - digital
  - analog
  - midi
url: https://tascam.com/us/product/model_12
description: 12-track integrated recording mixer, multitrack recorder, and
  12-in/10-out USB audio interface with DAW control. Features 8 Ultra HDDA mic
  preamps (EIN -128 dBu) via XLR/TRS combo jacks, 12-track simultaneous SD
  recording, 1-knob compressor and 3-band EQ per channel, 16 built-in effects,
  Bluetooth 5.0 for wireless playback, and HUI/MCU DAW control over USB.
  Suitable for music production, content creation, and live performance.
details: |-
  12-channel integrated mixer/recorder/USB interface. CH1–8: XLR/TRS combo jacks with Ultra HDDA preamps (EIN -128 dBu, gain 0–50dB, +48V phantom); CH1–6 switchable to Hi-Z instrument input. CH9/10: dedicated TRS line stereo pair. Inserts on CH1–2 (TRS). 3.5mm TRRS smartphone input feeds CH9/10. Main outputs: balanced XLR L/R (+22 dBu max). Sub/Aux: 3× stereo TRS pairs (+16 dBu max). Click: mono TS 1/4-inch. Two headphone outputs (45mW+45mW @ 32Ω). SD/SDHC/SDXC up to 512GB (Class 10+); 12 tracks in / 10 tracks out. USB-C: 12-in/10-out audio class 2.0. MIDI DIN 5-pin In/Out. HUI/MCU DAW control. Bluetooth 5.0 (A2DP, built-in) for wireless audio playback. Footswitch jack (RC-1F compatible).
specs: |-
  - - Mic inputs: 8× XLR/TRS combo, Ultra HDDA; EIN -128 dBu; gain 0–50dB; +48V phantom
  - Line inputs: CH1–10 TRS (+22 dBu max, +4 dBu nominal, 22kΩ); Hi-Z CH1–6 (1MΩ)
  - Main out: 2× balanced XLR; +22 dBu max, +4 dBu nominal, 200Ω
  - Sub/Aux out: 3× stereo TRS pair; +16 dBu max; headphones: 45mW+45mW (32Ω)
  - USB-C: USB 2.0 Hi-Speed, Audio Class 2.0; 12-in/10-out
  - Recording: SD/SDHC/SDXC up to 512GB; WAV/BWF 44.1/48kHz 16/24-bit; 12 simultaneous tracks
  - MIDI: 5-pin DIN in/out; DAW control: HUI/MCU over USB
  - Bluetooth: 5.0 Class 2, A2DP, SBC/AAC (built-in, no connector)
  - S/N: 103dB; THD: 0.003%; freq response: 20Hz–20kHz
  - Power: AC 100–240V 50/60Hz; consumption: 16W
  - Dimensions: 343(W) x 98.8(H) x 360(D) mm; weight: 4.3 kg
