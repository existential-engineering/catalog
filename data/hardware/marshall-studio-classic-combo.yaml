description: Compact 20W all-valve guitar combo built in the UK. A modern
  interpretation of the iconic JCM800 in a single-channel, cathode-biased 1x10
  cabinet, taking the amp from clean to barking overdrive and soaring solos.
  Features a power reduction switch from 20W to 5W, master volume, series
  effects loop, and a Celestion VT-Junior speaker. Hand-soldered at Marshall's
  Bletchley, England factory as part of the Studio series.
details: |-
  - All-valve, single-channel design
  - Power reduction switch (20W / 5W)
  - Cathode-biased power valves (no biasing required when replaced)
  - Series switchable FX loop
  - Master volume and full EQ (Treble, Middle, Bass, Presence)
  - Celestion VT-Junior 10" speaker
  - Hand-soldered, built in Bletchley, England
specs: |-
  - Model: SC20C
  - Range: Studio
  - Output Wattage: 20W (with power reduction option to 5W)
  - Channels: 1
  - Technology: Valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x EL34
  - Speaker: 1 x 10" Celestion VT-Junior (16Ω, 50W)
  - Controls: Preamp Volume, Master Volume, Treble, Middle, Bass, Presence
  - Effects: None
  - Effects Loop: Yes, 1 x series switchable
  - Inputs: 2 x 1/4" jack instrument inputs (high/low sensitivity)
  - Outputs: Speaker outputs: 5 x 1/4" jack sockets (16Ω / 8Ω / 4Ω load), DI (1/4" jack)
  - Product Height: 460 mm / 18.1"
  - Product Width: 510 mm / 20.1"
  - Product Depth: 255 mm / 10"
  - Weight: 14.55 kg / 32 lb
  - Country Of Origin: Designed and engineered in UK. Made in UK.
