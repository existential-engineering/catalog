description: Compact 20W all-valve guitar combo built in the UK. A modern interpretation of the iconic JCM800 in a single-channel, cathode-biased 1x10 cabinet, taking the amp from clean to barking overdrive and soaring solos. Features a power reduction switch from 20W to 5W, master volume, series effects loop, and a Celestion VT-Junior speaker. Hand-soldered at Marshall's Bletchley, England factory as part of the Studio series.
details: |-
  Get the legendary tone of the JCM800 at lower volumes with this portable combo. With the option to reduce the power down to 5W, you can own that genre-defining hard rock sound in the comfort of your own home.

  Pick your power. Choose between 20W and 5W power output at the flick of a switch. Transition perfectly between your rehearsal room, home and back again.

  A portable replica of the classic JCM800 which was originally introduced in the 80s. It offered more gain, taking you from clean to barking overdrive and soaring solos. The original is played by some of the greatest rock musicians of all time, so you are sure to get amazing tones out of its smaller brother.

  Similar to its larger V-Type counterpart, the Celestion VT-Junior speaker provides a harmonious and well-balanced sound. Its compact 10-inch size delivers a powerful low mid punch, a sparkling high end as well as extreme responsiveness that allows you to stay engaged with your music.

  The Studio Classic Combo is built on tradition. Constructed at Marshall's factory in Bletchley, England, it channels that classic Marshall spirit and is fine-tuned with iconic detailing. The studio series has a similar circuit design to its larger, older brothers and even features some hand-soldering. Designed and engineered in UK. Made in UK.
specs: |-
  - Model: SC20C
  - Range: Studio
  - Technology: All-valve
  - Channels: Single channel
  - Output wattage: 20W (with power reduction option to 5W)
  - Outputs: Speaker outputs 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), DI (1/4" jack)
  - Inputs: 2 x 1/4" jack instrument inputs (high/low sensitivity)
  - Controls: Preamp volume, master volume, treble, middle, bass, presence
  - Effects: None
  - Effects loop: Yes, 1 x series switchable
  - Speaker configuration: 1x10"
  - Speaker model: Celestion VT-Junior (16Ω, 50W)
  - Unit impedance: 16Ω
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 14.55 kg / 32 lb
  - Width: 510 mm / 20.1"
  - Height: 460 mm / 18.1"
  - Depth: 255 mm / 10"
  - Colour: Black
  - Box contents: Detachable power cable included
  - Country of origin: Designed and engineered in UK. Made in UK.
