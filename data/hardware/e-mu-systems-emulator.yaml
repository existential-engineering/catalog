description: >-
  The E-mu Emulator is a pioneering 8-bit keyboard sampler from 1981 that brought sampling
  technology to a broader market, offering 8-voice polyphony and real-time looping at a
  fraction of the Fairlight CMI's price.
details: |-
  The Emulator holds a special place in music technology history as the first truly affordable compact sampler when it launched in 1981. Designed after E-mu's unsuccessful Audity analog polysynth project, it drew loose inspiration from the Fairlight CMI but came in at a fraction of the cost, initially priced at $10,000 and dropping to $8,000 within a year.

  Built by the same team responsible for the Apple II computer, the Emulator offered 8-voice polyphony with 8-bit sampling at 27kHz. Its 128KB of memory provided approximately two seconds of sampling time, severely limiting what could be captured but forcing creative approaches that defined the instrument's character. Sound editing was primitive, limited to real-time looping and trimming.

  The instrument relied on 5-inch floppy diskettes for sound storage and loading, and while some units were later retrofitted with MIDI, the original design predated that standard. A real-time digital sequencer was added to models produced from 1982 onward, and an optional JL Cooper retrofit kit provided simple VCF filtering capabilities.

  Despite its limitations, the Emulator was directly responsible for E-mu's longevity and commercial success. Stevie Wonder purchased the very first unit, and its user list reads like a who's who of 1980s music, including David Bowie, Depeche Mode, Herbie Hancock, Genesis, and New Order. The Emulator II succeeded it with improved controls, display, and expanded memory.
specs: |-
  - Polyphony: 8 voices (rare 4-voice models exist)
  - Sampler: 27kHz, 8-bit
  - LFO: Vibrato
  - Filter: Simple VCF (via JL Cooper retrofit kit)
  - Sequencer: Real-time digital sequencer (from 1982 onward)
  - Keyboard: 49 keys
  - Memory: 128KB (approximately 2 seconds)
  - Control: MIDI (on some models via retrofit)
releaseDate: "1981"
