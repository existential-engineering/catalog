description: >-
  The Moog MF-104 Analog Delay is a limited-edition Moogerfooger effects
  processor that delivers warm, authentic analog delay with times ranging from
  40 milliseconds to 800 milliseconds. Built using the last available analog
  delay chips, approximately 1,000 units were manufactured, making it a highly
  sought-after collector's piece. Each of its primary parameters can be
  externally controlled via control voltage or expression pedal for dynamic
  real-time manipulation.
details: |-
  The Moogerfooger MF-104 Analog Delay represents a collaboration between Bob Moog and Big Briar (now Moog Music). This device uses the last available analog delay chips, making it a truly limited production run with approximately 1,000 units manufactured. The warm, organic character of its analog circuitry distinguishes it from digital alternatives, providing superior tonal qualities prized by musicians seeking vintage aesthetics.

  The device features three primary controls for delay time, feedback, and wet/dry mix, each externally controllable via control voltage or expression pedal for dynamic real-time manipulation. Additional parameters include Drive (input gain), Loop Gain (external feedback loop control), and Output Level adjustment. Its compact tabletop format makes it suitable for both studio and performance applications. Notable users include the electronic bands Stereolab and Air.
specs: |-
  - Mono input/output analog delay
  - Delay time: 40 to 800 milliseconds
  - Expression pedal or CV control for Time, Mix, and Feedback
  - Additional controls: Drive, Loop Gain, Output Level
  - Desktop/tabletop format
  - Limited edition: approximately 1,000 units produced
