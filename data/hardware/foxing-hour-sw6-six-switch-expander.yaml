description: SW6 is a passive Eurorack expander module with six DPDT switches
  that let users toggle reverse-side module functions without removing the
  module or manually flipping jumpers.
details: |-
  SW6 is a passive expander module used to easily toggle reverse-side module functions that are typically only available by removing the module and toggling jumpers. This module features six DPDT switches with pin headers that can be connected to other modules with reverse-side jumpers. SW6 is recommended for use with DAISY but may be used with any other Do-It-Yourself module that features reverse-side jumpers. Dimensions:

  4 HP

  20 mm deep

  Current Draw:

  Module does not draw current
