description: Dual-channel compressor/limiter/gate (discontinued).
details: |-
  The dbx 266A is a discontinued dual-channel compressor/limiter with gate from dbx Professional Audio. As the successor to the 266 in the 266-series dynamics processor family, it provided improved compression, limiting, and gating capabilities for professional audio recording and live sound applications.

  This unit has been discontinued and superseded by the 266XL and 266XS in the dbx lineup. Documentation is available through the owner's manual.
