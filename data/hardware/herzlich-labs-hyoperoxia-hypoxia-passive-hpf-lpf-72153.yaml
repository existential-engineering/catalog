url: https://www.herzlichlabs.com/products/hyoperoxia-hypoxia-passive-hpf-lpf-72153
description: A passive hybrid 0hp/1U module offering two independent 1-pole
  filters, HPF and LPF, that can also be used together as a 2-pole bandpass
  filter.
details: |-
  HPF? LPF? BPF? 10hp? 0hp? Yes. The Hyperoxia + Hypoxia combines the two popular namesake filters into one unit, giving you access to two independent 1-pole filters (HPF and LPF) or one single 2-pole bandpass filter. Incidentally, this was also the first module I designed in the hybrid 0hp / 1U format, based on previous 0hp designs. If you own one of the old 0hp designs it's probably going to be worth at least $10 on Reverb. But don't let that dissuade you, maybe one day I will discontinue this one and it will become valuable, too!
specs: |-
  - Two independent passive filter units, HPF and LPF
  - Internal normalization gives you immediate access to the BPF output
  - Install in your 1U rail, or use it externally as a 0hp module
  - Approximate frequency range (dependent on signal chain): 33 Hz to 33 kHz
  - High quality capacitors from Wera
  - Passive design: no power required
