description: The 803 D5 is the most compact 800 Series Diamond model to feature
  the iconic Turbine Head configuration. Thanks to its smaller proportions, it
  delivers reference-quality Bowers & Wilkins audio performance across a wider
  range of living and listening spaces.
details: |-
  The 803 D5 is a three-way vented-box reference tower loudspeaker and the most compact model in the 800 Series Diamond range to use the Turbine Head midrange enclosure. It is a passive design driven from an external amplifier, with a recommended amplifier power of 50W to 500W into 8 ohms and no mains connection of its own.

  As well as the Diamond dome tweeter and Solid Body Tweeter-on-Top, 803 D5 introduces an enhanced Matrix cabinet bracing with aluminium Space Frame Bracing and an aluminium top plate with a damping collar. Bowers & Wilkins describes these as delivering the most precise and compelling sound possible from the cabinet.

  Drive units are a 25mm Diamond dome high-frequency unit, a 130mm Continuum cone FST midrange and two 180mm Aerofoil bass cones, supported by an anti-resonance plug, Biomimetic Suspension and Flowport. The company quotes a break-up frequency of 70kHz for the Diamond dome tweeter.

  The cabinet is formed from a single continuous curve locked in place by a solid aluminium spine, which Bowers & Wilkins says reduces cabinet reflections. The speaker stands 1165mm tall including the tweeter and plinth, is 359mm wide across the plinth and 499mm deep including the plinth, and weighs 63.7kg.

  Finishes are Stealth Black, Warm White, Light Walnut and Dark Walnut with matching Leather by Connolly trim; grilles are black on Stealth Black and Dark Walnut and grey on Warm White and Light Walnut. Bowers & Wilkins lists the FS-805 D5 and FS-HTM D5 stands alongside the model as 800 Series accessories for other models in the range, not for the 803 D5 itself.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond dome tweeter, Solid Body Tweeter-on-Top, Continuum cone FST midrange, anti-resonance plug, Biomimetic Suspension, Turbine Head, Matrix, Aerofoil bass cones, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 130mm (5in) Continuum cone FST midrange, 2x 180mm (7in) Aerofoil bass
  - Frequency range: -6dB 16Hz to 35kHz
  - Frequency response: 19Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 80Hz to 20kHz, less than 0.3% 100Hz to 8kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 500W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 1165mm (45.8in) including tweeter and plinth, Width 301mm (11.9in) cabinet only or 359mm (14.1in) including plinth, Depth 473mm (18.6in) including grille and terminals or 499mm (19.6in) including plinth
  - Net weight: 63.7kg (140.3lbs)
  - Cabinet finishes: Stealth Black, Warm White, Light Walnut, Dark Walnut
  - Grille finishes: Black (Stealth Black and Dark Walnut), Grey (Warm White and Light Walnut)
