description: The 803 D5 is the most compact 800 Series Diamond model to feature
  the iconic Turbine Head configuration. Thanks to its smaller proportions, it
  delivers reference-quality Bowers & Wilkins audio performance across a wider
  range of living and listening spaces.
details: |-
  As well as the Bowers & Wilkins Diamond dome tweeter and Solid Body Tweeter-on-Top, 803 D5 features new innovations, including enhanced Matrix with Space Frame Bracing and an Aluminium Top Plate with damping collar, ensuring the most precise and compelling sound possible. Available in Stealth Black, Warm White, Light Walnut, and Dark Walnut, with matching Leather by Connolly trim, the 803 D5 is uncompromising in both performance and design.

  Ultimate drive unit technology. Pairing the brand's most advanced and innovative drive unit technology, the 803 D5 delivers its purest sound ever. The Diamond dome tweeter pushes break-up frequency to 70kHz, delivering exceptional clarity, precision and openness, and the Continuum cone delivers voices and instruments with lifelike detail.

  Optimised for pure performance. Every model in the new 800 Series Diamond range benefits from enhanced technology. An upgraded Matrix design reduces resonance and creates a more believable soundstage, while aluminium Space Frame Bracing and an all-new aluminium top section within the cabinet help deliver an even more spacious and immersive sound.

  Crafted to be better by design. The 800 Series Diamond looks this way for a reason. Its shape is dictated by the science of sound. Bowers & Wilkins cabinets are formed from a single continuous curve, locked in place by a solid aluminium spine, so cabinet reflections are reduced. Complemented by the Tweeter-on-Top and Turbine Head, musical performance is always as precise as possible.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond dome tweeter, Solid body Tweeter-on-Top, Continuum cone FST midrange, Anti-Resonance plug, Biomimetic Suspension, Turbine Head, Matrix, Aerofoil bass cones, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 130mm (5in) Continuum cone FST midrange, 2x 180mm (7in) Aerofoil bass
  - Frequency range: -6dB 16Hz to 35kHz
  - Frequency response: 19Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 90dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), <1% 80Hz to 20kHz, <0.3% 100Hz to 8kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 1000W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 1165mm (45.8in) including tweeter and plinth, Width 301mm (11.9in) cabinet only, 359mm (14.1in) including plinth, Depth 473mm (18.6in) including grille and terminals, 499mm (19.6in) including plinth
  - Net weight: 63.7kg (140.3lbs)
  - Cabinet finishes: Stealth Black, Warm White, Dark Walnut, Light Walnut
  - Grille finishes: Black (Stealth Black and Dark Walnut), Grey (Warm White and Light Walnut)
