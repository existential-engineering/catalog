description: Light weight 1×12 guitar speaker cabinet housing the KEMPER Kone
  with Imprint technology, enabling emulation of 19 classic guitar speakers when
  connected to the Kemper Profiler.
details: |-
  The KEMPER Kabinet is a 1×12 passive guitar speaker cabinet housing the KEMPER Kone — a 12-inch full-range speaker developed in collaboration with Celestion. It features KEMPER's Imprint technology, which uses DSP-based Speaker Imprints to emulate 19 classic guitar speakers (Celestion, Jensen, EV, JBL, Eminence, and others) when connected to a Kemper Profiler running firmware 7.2 or later.

  It can also operate in Full-Range mode as a traditional monitor. The cabinet features a Sweetening parameter (±6 dB bass/treble adjustment in Full-Range mode), Directivity control for off-axis response shaping, and a Bass Boost function.

  Finished in green tolex with brown leather trim and handles. The KEMPER Kone NEO speaker is also sold separately as a replacement driver for users who want to install it in their own cabinet.
specs: |-
  - Speaker: 12-inch KEMPER Kone (full-range), 200W RMS, 4 ohms
  - 19 classic guitar speaker imprints available
  - Dimensions: H 43 cm (16.93 in) × W 51.6 cm (20.31 in) × D 23.5 cm (9.25 in)
  - Weight: 10.5 kg (23.1 lbs)
  - Finish: Green tolex with brown leather trim
  - Requires Kemper Profiler OS 7.2 or later for Imprint features
  - Two 1/4-inch jacks (input + link output for daisy-chaining)
