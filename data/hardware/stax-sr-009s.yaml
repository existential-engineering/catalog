id: Z1GJNNs66_q8VImJ2ZU9C
name: SR-009S
manufacturer: stax
primaryCategory: headphones
description: A push-pull electrostatic earspeaker featuring refined fixed
  electrodes with improved sound permeability and reduced vibration through gold
  plating and after-etching processing. The solid aluminum chassis and
  redesigned guard mesh enhance clarity and resolution while maintaining an
  open-air design for natural sound reproduction.
specs: |-
  - Type: Push-pull electrostatic large circular sound element, open-air type enclosure
  - Frequency response: 5 – 42,000 Hz
  - Electrostatic capacitance: 110 pF (including cable)
  - Impedance: 145 kΩ (including cable, at 10 kHz)
  - Sound pressure sensitivity: 101 dB / input 100 Vr.m.s. / 1 kHz
  - Bias voltage: DC 580 V
  - Right/left channel indication: Golden solid line (left) and dotted line (right) on the cable
  - Earpad: Genuine leather (skin touching portion), high-quality artificial leather (surrounding portion)
  - Cable: Silver-coated 6N (99.9999%) OFC parallel 6-strand, low-capacity special wide cable, 2.5 m full length
  - Weight: 583 g (including cable), 441 g (without cable)
io:
  - name: Captive cable (Pro Bias)
