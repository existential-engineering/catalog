details: |-
  The Dellinger II-WB-FX is a formidable twin humbucker guitar, boasting a fast and ergonomic 648mm neck scale and 24 jumbo stainless-steel frets, enhancing its tonal clarity and definition. Featuring a specially designed 'Fixed Bridge 6' by Caparison, this model significantly boosts dynamics, stability, and sustain, elevating playability and tuning versatility. Its walnut top paired with an Australian Blackwood back not only delivers a full and rich sound spectrum but also enhances the guitar's significant visual appeal. Equipped with high-output Caparison "PH-F" and "PH-R" pickups, the Dellinger II-WB-FX offers a wide array of tonal possibilities, from screaming leads through to rich and bell like cleans. The control setup includes a master volume, 3-way pickup selector, and a push-pull tone pot for coil-splitting, further broadening the sound options. Players can select between an ebony or maple fingerboard, with body colour options of "Trans Charcoal Black," "Natural," and "Trans White", with each accentuating the wood's natural beauty.
