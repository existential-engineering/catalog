description: >-
  The Modal 001 is a 2-voice analog/digital hybrid synthesizer from Modal Electronics,
  featuring numerically controlled oscillators fed through a pure analog signal path.
  Released in 2015, it offers over 50 waveforms, a built-in 32-step sequencer, and
  extensive CV connectivity in a premium 37-key semi-weighted keyboard format.
details: |-
  The Modal 001 combines analog and digital technologies using numerically controlled oscillators (NCOs) for stable, high-resolution pitch tracking while maintaining a pure analog signal path from the oscillators onward with no digital conversion. Each voice provides two main oscillators and two sub-oscillators, effectively delivering four oscillators per voice, with access to over 50 different waveforms spanning classic analog shapes and unique digital waveshapes.

    Modulation is handled by two LFOs—one per voice plus a global LFO—both with MIDI sync capability. The VCF and VCA each have dedicated ADSR envelope generators with extensive modulation routing options. An XY joystick allows assignment of any control parameter to either axis for expressive real-time performance.

    The interface centers on a high-quality 4.3-inch touchscreen with a wide viewing angle, providing context-sensitive parameter display. A built-in 2-track, 12-row, 32-step sequencer with MIDI sync and a 6-mode arpeggiator round out the performance features. Connectivity includes 4 CV inputs, 4 CV outputs, two audio inputs for external audio processing from the VCF onward, full MIDI I/O, and an Ethernet port for firmware updates and cloud features.
specs: |-
  - 2-voice duophonic, bitimbral architecture
    - 4 oscillators per voice (2 main + 2 sub) with NCO technology
    - Over 50 waveforms available
    - 24dB/oct (4-pole) low-pass filter with resonance
    - VCA and VCF ADSR envelope generators
    - 2 LFOs with MIDI sync (per-voice and global)
    - 37-key FATAR semi-weighted keyboard with aftertouch
    - 4.3-inch touchscreen display
    - 32-step sequencer (2-track, 12-row) with MIDI sync
    - 6-mode arpeggiator
    - 4 CV inputs and 4 CV outputs
    - 2 audio inputs for external signal processing
    - MIDI In, Out, and Thru
    - Ethernet port for updates and cloud access
    - Up to 100 banks of quick recalls (6 slots per bank)
    - XY joystick for parameter control
