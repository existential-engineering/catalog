description: IP1 is a simple yet powerful programmable wallplate, giving the
  non-technical user convenient, easy control via a single push-and-turn rotary.
details:
  - One Rotary Wallplate Controller. IP1 is a simple yet powerful programmable
    wallplate, giving the non-technical user convenient, easy control via a
    single push-and-turn rotary.
  - US and EU/UK Versions — available in two form factors for the US and EU/UK
    markets; the IP1 is compatible with Decora and MK Elements faceplates.
  - Simple to Use — designed with the non-technical user in mind; can control
    zone level, source selection or scene/preset recall via a single rotary
    control.
  - Visual Feedback — the colour LCD screen gives the user a clear indication of
    the parameter they are controlling.
  - Low Maintenance — automatically matches firmware with connected devices for
    easy install and system maintenance.
  - Mix and Match — multiple IP Controllers can be connected to an AHM, dLive or
    Avantis system to provide control exactly where needed. Use IP controllers
    of different flavors to suit the needs of your end users, even letting one
    controller change what other controllers are doing to reflect changes in the
    space.
  - Simple to Set Up — connects to the AHM, Avantis or dLive mixing system via
    standard TCP/IP network connections, and can be networked with other
    controllers, computers and third party devices using standard Ethernet
    infrastructure.
  - Configure — the IP1's controls and functions are configured using AHM System
    Manager, Avantis Director or dLive Director software (PC or Mac), or via an
    Avantis mixer or dLive Surface.
  - "Features: music source selection, level control, or preset recall;
    dual-function rotary encoder; LCD display; two form variants (US
    Decora-compatible and EU/UK MK Elements-compatible); TCP/IP & PoE compliant;
    face plate not included (can be ordered separately for EU variant)."
