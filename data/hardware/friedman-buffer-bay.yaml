description: The Friedman Buffer Bay is a pedalboard patch bay with a switchable
  transparent buffer. It carries five 1/4 inch TRS pass-through connections, a
  buffered TS connection and a MIDI thru, and mounts on any pedal board or into
  a Friedman branded one.
details: |-
  The Friedman Buffer Bay is a simple solution that incorporates Dave Friedman's wealth of experience and knowledge, providing players an innovative tool which can be easily implemented on any pedal board or easily mounted into any Friedman branded pedal board.

  The Buffer Bay 6 includes five identical 1/4 inch TRS (tip, ring, sleeve) in and out connections and a buffered TS (tip, sleeve) connection that can be turned on and off via a switch. It also provides a 7 pin MIDI thru connection. The Buffer Bay 6 can be used for a wide variety of connection schemes. Once it is configured on a board, the guitar and amp simply plug in and the first and last pedals no longer need fighting with. Using an extra patch cable it is easy to go from using an amp with an effects loop to using one without.

  First, it is an ultra transparent, natural and musical sounding buffer, which can be turned on or off using the provided switch. The buffer solves the fundamental problem of loading loss caused by interconnected cables and some pedals. That loss siphons a guitar of fidelity, tone and volume level. The problem occurs even if all the pedals used are true bypass, and the more pedals and the longer the cable runs, the greater the losses. The Buffer Bay 6 circuitry, when engaged, sounds identical to the guitar straight into the amp. The buffer is accessed using the buffer IN connector on one side of the Buffer Bay and Buffer Out on the other side.

  Second, it is a patch bay, which cleans up all of the connections on a pedal board and keeps the pedal chain permanently connected.
specs: |-
  - Ultra transparent, natural and musical sounding buffer, switchable on and off
  - 5 identical 1/4 inch TRS (tip, ring, sleeve) in and out connections
  - Buffered TS (tip, sleeve) connection, switchable on and off
  - 7 pin MIDI thru connection
  - Mounts on any pedal board, or into any Friedman branded pedal board
  - Cleans up all of the connections on a pedal board
  - Allows tighter pedal placement, since the jacks on certain pedals no longer need to be reached
  - Keeps every cable from the board in one location for neater cable runs on stage
  - Keeps the pedal chain permanently connected, making setup and takedown quick
  - Saves the life of the jacks on pedals by avoiding repeated plugging in
  - Lets an input or output be configured in hard to reach places
  - Dimensions 5.5 in x 5 in x 2.25 in
  - Weight 2 lbs
