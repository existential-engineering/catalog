  the sacred 4558 chipset.
details: |-
  After many requests to produce a single-unit version of the JHS-808 found in their Double Barrel and Sweet Tea pedals, JHS released the standalone JHS 808. Based on the original Ibanez/Maxon TS808 Tubescreamer Overdrive, this is an exact replica made with high-grade components, true bypass switching, and the sacred 4558 chipset. The only difference from its dual-pedal counterparts is the ability to run at 18V. Features a custom 3-way gain toggle: stock (down), boost (middle), and crunch (up).
