description: "Exponent 500 is a new concept Darkglass calls a Powered Platform:
  a clean amplifier that, once connected, turns into a multi-effect with fully
  programmable and presettable signal chains."
details: |-
  Exponent 500 is a new concept Darkglass calls a Powered Platform: a clean amplifier that, once connected, turns into a multi-effect with fully programmable and presettable signal chains carrying all the components a professional bassist requires. It pairs an ultra-clean analog amplifier with powerful digital modeling, offering assignable effects, preamps, and cabinet simulation. With its audio-over-USB interface capabilities and 500W of ultra-clean power, Exponent 500 is a capable solution for every context, packed in a compact, light housing for maximum portability. The rear panel provides a SpeakON combo speaker output, an effects loop (Send and Return), a 1/4" stereo headphone output, a balanced XLR direct output with ground lift, a MIDI In on a standard DIN connector (7-pin and 5-pin compatible), and a USB-C port for audio interface, updates, and USB MIDI. A 1/4" instrument input sits on the front panel.
specs: |-
  - 500 watt hybrid bass amplifier head
  - Ultra clean analog amplifier with powerful digital modeling
  - Assignable effects, preamps, and cabinet simulation
  - Audio over USB (USB-C)
  - Full MIDI control (7-pin and 5-pin DIN compatible)
  - Effects loop (Send/Return)
  - SpeakON combo speaker output and 1/4" stereo headphone output
  - Balanced XLR direct output with ground lift
