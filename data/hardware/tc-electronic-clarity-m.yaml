description: Stereo and 5.1 audio loudness meter for broadcast and studio
  environments, measuring loudness according to international standards.
details: |-
  The CLARITY M provides a comprehensive set of precision tools essential to the success of any audio producer. Ideally suited to stereo and 5.1 mixing, mastering and post-production, CLARITY M’s 7" high-resolution LCD display provides a wealth of monitoring information at-a-glance via a single screen. Metering options include; the legendary LM6 Loudness Radar Meter; a state-of-the-art true peak meter; downmix compliance; stereo/surround correlation meters; and a RTA (Real Time Analyzer). Source inputs come in a vast array of options including: USB for hassle-free VST *, Audio Units * and AAX * plug-in metering; 6 channels of unbalanced AES3 digital audio on 75 Ohm BNC connectors for broadcast-grade 5.1 metering; and stereo optical for maximum fl exibility. CLARITY M is fully compliant with all major broadcast standards including ITU BS.1770-4, ATSC A/85, EBU R128, TR-B32 and OP-59, and is recommended for all studio environments.

  Audio Toolbox

  CLARITY M provides a veritable toolbox of meter types to help you make the right mix and mastering decisions for truly professional recordings.RTAThe high accuracy RTA with 1/3 octave resolution and individual band zoom provides a great overview of the spectral distribution of your mix.True-Peak Based on TC Electronic’s highly acclaimed True-Peak Technology, the CLARITY M is your guard against otherwise unpredictable clipping.Loudness RadarThe Loudness Radar is essential when it comes to monitoring the loudness of your mix. With the loudness history overview on the scope, the radar helps get the levels just right, while the momentary loudness in the outer ring keeps an eye on your instant loudness level.Loudness Measures Loudness statistics not only keep you compliant with loudness standards, they also provide crucial information on other important aspects of your mix, such as micro dynamics and macro dynamics.Downmix Deviation The Deviation meter is a fundamental tool to ensure your mix sounds great whether played back in 5.1, stereo or mono. This downmix compatibility meter is based on TC Electronic’s Loudness Technology, and provides the best means for determining the status of your mix fold down.Correlation Whether you mix in 5.1 surround or stereo, the correlation meter helps identify phasing issues and other anomalies that are easy to miss when relying solely on your ears.

  Merging Hardware with Plug-ins
