description: The SL 112 is a compact 12" neodymium bass cabinet offering
  musical, balanced tone with a slightly scooped midrange. Its deeper enclosure
  enhances resonance and projection while remaining highly portable at just 25
  lbs.
details: |-
  The SL 112 is part of Aguilar's SL (Super Light) series, designed to deliver
  professional-quality bass reinforcement in an exceptionally lightweight package
  weighing just 25 lbs (11.34 kg). Despite its compact footprint, the cabinet
  handles up to 250 watts RMS and operates at 8 ohms impedance.

  The cabinet features a 12-inch neodymium driver paired with a phenolic tweeter
  with an integral phase plug. A custom crossover network manages signal
  distribution between the woofer and tweeter, while a variable tweeter control
  allows players to tailor the high-frequency response to their preference and
  venue.

  The SL 112 delivers a frequency response of 37 Hz to 16 kHz with a sensitivity
  rating of 99.9 dB at 1W/1M, making it highly efficient and capable of producing
  significant volume with modest amplifier power. The deeper enclosure design
  enhances resonance and low-end projection.

  Physical dimensions are 14 7/8" (H) x 19" (W) x 18" (D), making it suitable
  for a wide range of performance settings from small clubs to larger venues.

  Aguilar backs the SL 112 with a three-year limited warranty against
  manufacturing defects.
specs: |-
  - Power Handling: 250 watts RMS
  - Impedance: 8 ohms
  - Frequency Response: 37 Hz – 16 kHz
  - Sensitivity: 99.9 dB 1W/1M
  - Driver: 12" Neodymium
  - Tweeter: Phenolic with integral phase plug
  - Crossover: Custom with variable tweeter control
  - Height: 14 7/8"
  - Width: 19"
  - Depth: 18"
  - Weight: 25 lbs (11.34 kg)
