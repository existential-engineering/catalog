details: |-
  This is a full kit for a passive diode fuzz Eurorack module with switches for changing which diodes are included in the circuit. It's based on the simple passive fuzz designs that others have come up with (eg: Yan's Patchpals), but we added the switching for more fuzz fun. This kit includes everything you need, including the PCB, front panel, all the components and a build guide. The design uses 2 different kinds of diodes and it comes with a selection of different types to choose from, including some Soviet military germanium diodes. веселье! This is an easy and fun beginner's project. You will, of course, need a soldering iron and basic soldering skills. A complete build guide / user's manual can be found in the Downloads section of this site. Kit Contents:

  1 x PCB

  1 x FR4 Front Panel (width: 4hp)

  5 x DPDT Toggle Switches

  1 x 10K 9mm Alpha Potentiometer*

  2 x 3.5mm Jacks

  1 x 180 Ohm Resistor

  1 x 3mm Red LED

  1 x Assortment of diodes (the module requires 4 of one kind and 4 of another)

  2 x Stainless M3 x 0.5mm x 6mm Mounting Screws

  * The included potentiometer is the plastic trimmer type. If you want to put a fancy knob on your finished module, you'll want to replace this pot with a different one. Note: This is a passive module. It may or may not cooperate with your other modules. It will not compete with your favorite distortion module. Some people think passive modules don't belong in a proper Eurorack setup. Others are the type that are known to eat ice cream in bed and put black tape over the warning light on their car's dashboard. You'll have to decide if it's right for you. SKU: XD005
