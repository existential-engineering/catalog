description: "Mackie EM-91CU+ large diaphragm USB condenser microphone with
  cardioid capsule, up to 16-Bit / 96kHz recording, headphone output, and
  onboard mute switch for podcasting, streaming, and virtual meetings."
details: |-
  Love the EM-91CU but want a bit of a step up? This is the mic for you. A great microphone is the most essential piece when starting a podcast or live stream and EM-91CU+ makes it easy.

  The Mackie EM-91CU+ large diaphragm USB condenser microphone has some choice features that make it even easier to capture clear audio. Equipped with a great-sounding cardioid capsule and up to 16-Bit / 96kHz recording quality, the EM-91CU+ delivers studio-quality audio to online meetings, virtual music lessons and more.

  It also boasts a headphone output and mute switch, making it easier to monitor and control your audio.
specs: |-
  - Cardioid polar pattern
  - Large diaphragm USB condenser
  - Up to 16-Bit / 96kHz recording quality
  - USB-C connection
  - Headphone output with level control
  - Onboard mute switch
  - Low-noise circuitry
  - Shock mount included
  - USB cable included
