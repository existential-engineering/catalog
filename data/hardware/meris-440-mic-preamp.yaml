details: |-
  The 440 is a guitar recording staple, designed as the ultimate mic preamp for recording guitar. Installed into a 500 series lunchbox, with post effects pedals connected to its loop, it brings big studio console sound to any track.

  Installing a 440 into any 500 series compatible chassis delivers legendary tone and lets players integrate post effects pedals into their signal chain with ease, interfacing with pedals at levels that won't clip.

  From the legendary Cinemag input and output transformers to the high performance hybrid-discrete opamps, every design decision was made with the highest sonic performance in mind, delivering classic American console sound.
specs: |-
  - Legendary Cinemag Input and Output transformers for classic American mic pre tone
  - Hybrid-Discrete opamps receiving and driving each respective transformer section
  - Pedal friendly post effects loop interfaces with pedals at levels that won't clip
  - High Pass Filter selectable between 80Hz and 200Hz
  - Custom 7kHz or 4kHz High Shelf filter optimized for achieving a finished tone when recording guitar
  - 20dB Pad, Phase Reverse and Phantom Power toggles
  - Premium components throughout the all analog signal path
  - Designed and Built in California, U.S.A.
  - Up to 60dB of gain at the input section
  - Output trim -27dB to +12dB (occurs pre-output transformer to preserve output transformer secondary impedance)
  - 12dB/octave High-Pass: 80Hz or 200Hz corner frequency
  - High-Shelf boost: +3dB at 4kHz or 7kHz corner frequency
  - 20Hz to 20kHz flat frequency response (+/-0.3 dB) with all filters disengaged
  - -130dBu EIN (A-weighted)
  - 1Meg Ohm input impedance at Return/D.I. input
