details: |-
  Revitalizing the best elements from the past, the G2604T Streamliner Rally 2 Center Block Double-Cut with Bigsby is a modern take on a Gretsch cult classic.

  The guitar features Super Hilo'Tron humbucking pickups delivering clarity and chime with enhanced presence. A chambered mahogany center block reduces feedback while supporting stage performance.

  Traditional controls include individual neck and bridge pickup volumes, master tone and volume controls, plus three-way pickup switching. The instrument combines vintage aesthetics with modern playability for guitarists demanding quality craftsmanship.
