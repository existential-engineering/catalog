description: The DN9340E Helix is a dual channel digital graphic equaliser
  carrying two independent 31-band graphic equaliser channels alongside
  parametric filters, threshold-dependent equalisation, a full-function delay
  line and Classic KT emulation modes that recreate the behaviour of the
  analogue DN300, DN360 and DN3600. Remote control over Ethernet allows multiple
  units to be addressed from front-of-house.
details: |-
  The DN9340E Helix represents the point at which Klark Teknik translated four decades of analogue Proportional-Q expertise into the digital domain. Two independent 31-band graphic equaliser channels combine with parametric filters, threshold-dependent equalisation, a full-function delay line and Classic KT emulation modes that recreate the behaviour of the DN300, DN360 and DN3600 analogue references.

  Threshold-dependent equalisation is the signature feature: each filter band can engage only when the input signal exceeds a defined threshold, providing dynamic equalisation that addresses problems as they occur, such as feedback suppression, vocal de-essing and instrument tone-shaping, without affecting signal below the threshold.

  The full-function delay line per channel handles loudspeaker time-alignment without requiring a separate processor in the rack.

  Remote control over Ethernet allows the engineer to address multiple units from front-of-house, supporting complex multi-zone systems with centralised parameter recall and scene management.

  The DN9340E is now obsolete, with functionality carried forward by modern integrated DSP platforms and service support continuing through Music Tribe Care.
specs: |-
  - Dual channel digital graphic equalisation, 31 bands per channel
  - Proportional-Q response curve
  - Parametric filter bands per channel
  - Threshold-dependent (dynamic) equalisation per filter band
  - Full-function delay line per channel for loudspeaker time-alignment
  - Classic KT emulation modes for DN300, DN360 and DN3600
  - Remote control over Ethernet with centralised parameter recall and scene management
