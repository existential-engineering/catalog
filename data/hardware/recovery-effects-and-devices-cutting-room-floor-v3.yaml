details: |-
  CUTTING ROOM FLOOR V3 EURORACK MODULE

  . (Vintage Reel-to-Reel Tape, Echo, and Stutter)

  . The Cutting Room Floor was designed to emulate the sound and functionality of vintage reel-to-reel tape overdrive and echo. This eurorack module reaches into the 21st century with customized features that traverse the world of modulation and delay. Imagine an abandoned factory with a fluttering tape machine left on repeat. The Cutting Room Floor provides beautifully marred saturated tape tone, and ethereal repeats in a streamlined 6hp interface. Other features include a freeze button that traps any tone while still playing and CV control for time. Designed and assembled in Seattle, Washington. (Cutting Room Floor V3 manual)

  6hp, 43mm deep, 150ma current draw. . Most of our devices are made to order. For information on our current lead time, please visit our FAQ page.
