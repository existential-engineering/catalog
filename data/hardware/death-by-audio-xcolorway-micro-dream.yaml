description: A compact lo-fi delay pedal offering up to one second of decayed
  delay with a gain stage suited for slapback and pseudo-looping effects.
details: |-
  BEAUTIFUL LO-FI DELAY Similar to the thick and gooey sound of the Echo Dream 2, the MICRO DREAM is a streamlined and compact version that still retains the beautiful, decayed delay sound that made the Echo Dream famous. Push the delay past its limits by increasing the delay time to a full second, introducing lofi chirps and noise as the circuit protests. Additionally, a gain stage on the delay line makes the Micro Dream perfect for pseudo looping or just an incredible slapback. Details Playing the fifteen-minute-power-nap to the Echo Dream 2’s full-on Rip Van Winkle, the Micro Dream is a bite-sized echo snack for the modern musician on the go. This tasty lo-fi delay pedal takes the gooey, ectoplasmic sound of the Echo Dream 2 and packs it into a compact enclosure to deliver vivid slapback tones, chewy psychedelic echoes, and up to one full second of kaleidoscopic delay that’ll turn even your wildest echo dreams lucid. At shorter delay times, the Micro Dream dishes out vibrant, bouncy repeats tight enough to use as an always-on double-tracking effect to thicken up single note runs and some light riffage. As you increase the TIME control, the Micro Dream opens up a higher level of consciousness with grainier repeats and a more sinister vibe as the longer times push the delay chip past its limit, introducing stretched, smeared, pseudo-looping delays so psych’d out you’ll be hearing colors and tasting music. The Micro Dream’s F BACK control adjusts the delay repeats from a single repeat right through hazy atmospheric dreaminess all the way to demented self-oscillating feedback. This control covers a wide range of sounds, so we’ve included an INTERNAL F BACK TRIMPOT to adjust exactly where on the potentiometer self-oscillation happens and help you dial in the proper ambience for your musical sojourn to the untapped outer reaches of the unconscious mind. If you’re the kind who forgets your dreams, turn ‘em up! The DELAY knob controls the level of the repeats and is equipped with enough output to make the delay louder than the clean signal for rich, thick echoes that bulk up your sound and stand up in even the busiest mix. Now wake up and start playing! Controls F Back Controls the feedback of the delays, from slapback to wild runaway oscillation Time Controls the delay time (Numbers shown in milliseconds) Delay Sets the volume of the delayed signal Internal Trimpot Sets the point at which the Fback knob will cause the delay to oscillate Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 28 mA Physical Details Dimensions: 4.95" x 2.61" x 2.34" (including hardware) Weight: 11 oz.
