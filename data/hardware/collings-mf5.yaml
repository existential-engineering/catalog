id: ytOW-7Is7jXnZBy3H4yIn
name: MF5
manufacturer: collings
primaryCategory: mandolin
url: https://collingsguitars.com/mandolins/mf5/
description: The MF5 is a highly-appointed F-model mandolin with a carved,
  seasoned Adirondack (Red) spruce top and premium maple back and sides. With
  superb tone, elegant stylings, and unmatched playability, it is built to
  please the most discerning players.
details: |-
  Full gloss F-style mandolin featuring a carved Adirondack spruce top with Eastern flamed maple back, sides, and neck. Appointed with ebony fingerboard and bridge, ivoroid binding with black/white purfling on body, fingerboard, and peghead, and a dovetail neck joint. Tone bar bracing, fully adjustable truss rod, nickel Gotoh tuners with ivoroid buttons, and the Collings original tailpiece round out the specification. Finished in high gloss nitrocellulose lacquer and ships with D'Addario EJ74 strings and a deluxe hardshell case.
specs: |-
  - Style: F-style
  - Top: Adirondack spruce
  - Back/Sides/Neck: Eastern flamed maple
  - Soundhole: F-holes
  - Body Binding: Ivoroid with b/w side purfling
  - Fingerboard Binding: Ivoroid with b/w side purfling
  - Peghead Binding: Ivoroid with b/w side purfling
  - Bracing: Tone bars
  - Bridge: Ebony with adjustable saddle
  - Fingerboard: Ebony with MOP dots
  - Nut Width: 1 1/8"
  - String Spacing: 1 9/16"
  - Neck Profile: Rounded V
  - Neck Joint: Dovetail
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Peghead Veneer: Ebony with MOP logo and flourish
  - Tuners: Nickel Gotoh with ivoroid buttons
  - Tailpiece: Original tailpiece
  - Pickguard: None
  - Scale Length: 13 7/8"
  - Fingerboard Radius: 5 1/2" - 11 5/8" compound
  - Body Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario EJ74 (.011" - .040")
  - Case: Deluxe hardshell
  - Body Width: 9 15/16"
  - Body Length: 12 7/8"
  - Body Depth: 1 13/16"
  - Total Length: 27 7/16"
