description: The ND44 is a large-diaphragm dynamic instrument microphone built
  for drums and other rhythm-section sources. A tight cardioid polar pattern
  delivers strong off-axis rejection for close-mic'd snare, toms, and hi-hat,
  while a low-profile pivoting head and integrated mount geometry simplify
  placement in crowded kits. A humbucking coil reduces line hum near amplifiers
  and lighting rigs, the Memraflex grille resists denting from stick strikes,
  and the included DRC-2 drum rim clamp with finger-loop design secures the mic
  to rims without tools. Frequency response of 80 Hz - 16,500 Hz, max SPL
  greater than 140 dB, and balanced low-Z output via 3-pin XLR.
details: |-
  Large-diaphragm dynamic capsule tuned for drums and rhythm section

  Tight cardioid polar pattern for strong off-axis rejection

  Low-profile pivoting head for flexible placement on tight kits

  Humbucking coil reduces line hum near amps and lighting rigs

  Memraflex grille resists denting from stick strikes

  Frequency response 80 Hz - 16,500 Hz

  Maximum SPL greater than 140 dB

  Passive design - no phantom power required

  Die-cast zinc handle with ABS polycarbonate head and black polyurethane finish

  Includes DRC-2 drum rim clamp with finger-loop design
