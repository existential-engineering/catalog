name: 506 Power Mk2
manufacturer: lindell-audio
primaryCategory: rack-mount
categories:
  - utility
  - analog
url: https://lindellaudio.com/en/products/506-power-mkii
description: The 506 Power chassis holds up to six 500-series modules in a
  compact yet rugged unit. An external no-noise power supply delivers the power
  to run the modules.
details: |-
  The 506 Power chassis holds up to six 500-series modules in a compact yet rugged unit. An external no-noise power supply delivers the power to run the modules.

  The lightweight aluminium chassis has a small footprint that fits in any studio, and holds six 500-series processors in a single easy-to-transport unit, so preamps, EQs and effects can be arranged in any order.

  A feed switch lets one channel be mixed into another without cables, and the chassis carries both gold plated XLR and D-Sub I/O.
specs: |-
  - 6-slot chassis for 500-series modules
  - Lightweight aluminium enclosure
  - Gold plated XLR I/O
  - D-Sub I/O
  - Feed switch mixes one channel into another without cables
  - No-noise, high-frequency switching power supply
  - Overload and short-circuit protection
  - 400mA per slot
  - Includes protective neoprene bag
