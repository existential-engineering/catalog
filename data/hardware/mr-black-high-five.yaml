description: An instant power-chord generator that adds an octave and a natural
  fifth to a single note, turning single-note lines into full power chords with
  three simple controls.
details: |-
  The High-Five is an instant power-chord generator. From a single note it synthesizes an octave and a natural fifth, so one note becomes a full power chord. Three intuitive controls set the level of the dry signal, the octave (either high or low), and the fifth (either five notes above or four notes below).

  Each added voice runs from -∞dB up to +3dB, with a subtle, gentle flutter that recreates the natural resonance and intermodulation of a real, strongly-struck power chord. Dial in the dry level, then rotate the 5th and Oct controls (counter-clockwise for below, clockwise for above) to place the transposed notes. The effect is especially strong with distortion and for lead lines.

  This standard production High-Five uses the exact circuit as the super-limited Black LTD. High-Five (a 53-piece run), now offered with an updated high-gloss graphic on a chrome powder-coat finish.

  Like all Mr. Black pedals it is hand-built one at a time with premium components and true-bypass switching, and it runs on an internal 9V battery or standard 9VDC pedal power at roughly 59mA. Original design by Jack Deville.
specs: |-
  - Instant power-chord generator (adds octave + fifth to a single note)
  - Octave control: high or low
  - Fifth control: 5 notes above or 4 notes below
  - Output levels: -∞dB to +3dB per voice
  - Subtle flutter recreating natural power-chord intermodulation
  - True-bypass switching
  - Power: internal 9V battery or standard 9VDC pedal power
  - ~59mA current draw @ 9VDC
  - Jack Deville original design
