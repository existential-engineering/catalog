details: |-
  The Friedman Triple D Humbucker is a modern high-output pickup, originally designed for the Friedman NoHo 24 guitar. It features a carefully sculpted, open voice that gives the tone improved clarity and response. Its increased output and midrange focus cut through any mix without sounding honky or nasally, and it is now available separately for other guitars.

  When Dave Friedman and Grover Jackson were designing the Friedman line of guitars, a lot of thought was put into every aspect of the build, especially the pickups. Inspired by both modern and vintage guitar tones, Dave wanted to make sure that the pickups used in all Friedman guitars delivered the exact tone he envisioned. With Dave's vision and Grover's skills, the Friedman Classic Pickup line was born.

  This is the bridge-position version, wound to a DC resistance of 16k, built on Alnico 5 magnets with four-conductor lead wire for coil splitting and series or parallel wiring, and 80/20 wax potted against squeal. Buyers choose the cover finish at the point of order, in Black, Zebra or Nickel.
specs: |-
  - Bridge position humbucker
  - DC resistance: 16k
  - Alnico 5 magnets
  - 4 conductor lead wire
  - 80/20 wax potted
  - Custom voiced by Dave Friedman
  - Cover finish options at order: Black, Zebra, Nickel
  - Originally designed for the Friedman NoHo 24 guitar
