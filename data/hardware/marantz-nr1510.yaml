description: Enjoy the most musical sonic performance from a compact, slim
  chassis. At half the height of a traditional AV receiver, the Marantz NR1510
  delivers elevated surround sound and warm, rich high-fidelity audio.
details: |-
  Enjoy the most musical sonic performance from a compact, slim chassis. At half the height of a traditional AV receiver, the Marantz NR1510 delivers elevated surround sound and warm, rich high-fidelity audio.

  With simple connectivity and a slim chassis, the NR1510 drives elevated audio with incredible ease. Five discrete power amplifier channels deliver 85 W each into 6 ohms at 1 kHz.

  Bluetooth headphone transmission connects any pair of Bluetooth headphones to the receiver for music or movie sound, with or without the speakers turned on.

  Dolby Vision support brings enhanced picture quality, from vivid colors to darker shadows, across a wider and more diverse color gamut. Six HDMI inputs, five on the rear and one on the front, pass 4K video with HDCP 2.3 and eARC on the single monitor output.

  HEOS is built in for multi-room playback and high-resolution streaming, with AirPlay 2, Spotify Connect, TuneIn internet radio, Wi-Fi, Bluetooth and Ethernet, and Audyssey MultEQ room correction with Dynamic EQ and Dynamic Volume.
specs: |-
  - 5.1 processing channels, five discrete power amplifier channels
  - 85 W per channel (6 ohm, 1 kHz, 1% THD, 1ch driven), 100 W (6 ohm, 1 kHz, 10% THD, 1ch driven)
  - 2.2-channel pre-out with two subwoofer outputs
  - Five speaker terminals, 4-16 ohm impedance
  - Six HDMI inputs (five rear, one front) and one HDMI output with ARC and eARC, HDCP 2.3
  - 4K pass-through, HLG and Dolby Vision, HDMI pass-through in standby
  - Dolby TrueHD, Dolby Pro Logic II, DTS-HD Master Audio and multichannel stereo
  - Audyssey MultEQ with Dynamic EQ and Dynamic Volume
  - Compressed audio enhancer MDAX2, Pure Direct mode
  - HEOS built-in, AirPlay 2, Spotify Connect, TuneIn, Bluetooth headphone transmission
  - Phono (MM) input, three analog stereo inputs, coaxial and optical digital inputs, FM tuner with RDS
  - Slimline chassis 440 x 368 x 105 mm without antenna, weight 8.2 kg
  - Power consumption 210 W, standby 0.2 W
