description: >-
  The Cheetah MS-6 is a 6-voice polyphonic and multitimbral analog synthesizer
  in a single-unit rack module. It features 12 digitally controlled oscillators
  and uses the same CEM 3396 sound chips found in the Oberheim Matrix 6/6R and
  Matrix 1000, delivering a warm and rich analog sound.
details: |-
  Released in 1988 by British company Cheetah, the MS-6 is widely regarded as the company's finest achievement. It utilizes the CEM 3396 sound chips, the same chips found in the Oberheim Matrix 6/6R and Matrix 1000, but distinguishes itself through full multitimbral capability across six MIDI parts.

  The MS-6 offers a comprehensive analog architecture with two DCOs per voice, six 24 dB/octave resonant low-pass filters, and 12 velocity and pressure sensitive envelopes. Its multitimbral design allows creative layering of patches, making it well suited for ensembles and electronic music production.

  While front panel programming is possible, it is quite tedious given the compact rack format, making editor software essential for practical deep editing. The unit ships with 320 ROM sounds and provides 96 RAM slots and 64 user presets for custom patch storage.

  The MS-6 has been used by notable artists including OMD and Rick Wakeman. Despite Cheetah's relatively obscure status compared to major Japanese and American synth manufacturers, the MS-6 has earned a cult following among analog enthusiasts looking for affordable multitimbral analog rack synthesis.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 12 DCOs (2 per voice) with PWM, noise, and sync
  - Filter: Six 24 dB/octave resonant low-pass filters
  - LFO: Yes
  - VCA: 12 velocity and pressure sensitive envelopes
  - Keyboard: None (rack module)
  - Memory: 320 ROM sounds, 96 RAM sounds, 64 user presets
  - Control: MIDI (6-part multitimbral)
