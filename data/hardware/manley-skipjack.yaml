url: https://www.manley.com/products/legacy/hifi/skipjack
description: The SKIPJACK features dual relay contacts, point-to-point silver
  wiring, and 116dB channel separation. 4-into-1 or 3-into-2 switching. Silent
  transitions.
details: |-
  Hand-wired point-to-point topology with zero PCB audio paths

  Dual-contact NAIS relays ensuring silent, artifact-free switching

  Wired remote control for A/B/C/D comparison from listening position

  Professional-grade input switching with measurable transparency

  Over 90 dual-contact NAIS relays per channel

  Silver core point-to-point hand-wiring (no PCB traces in audio path)

  Software-controlled make-before-break relay switching for silent transitions

  Heavy-gauge steel chassis with internal ballast weighting to resist cable torque

  Reversible operation: 4-into-1 source selector or 1-into-4 distribution

  Included 25-foot wired remote 'pickle switch' for A/B/C/D selection

  Unbalanced RCA only (no balanced XLR version available)
specs: |-
  - Frequency Response: DC - 200 kHz (+/-0.1 dB)
  - Channel Separation: 116 dB (22 Hz - 22 kHz)
  - Signal Loss: < 1/10 dB (0.045 dB)
  - Power: 9VDC external supply
  - Switching: Dual-contact NAIS relays, software-controlled make-before-break
  - Audio Path: Hand-wired point-to-point with silver core wire
  - Remote: 25-foot wired 'pickle switch'
