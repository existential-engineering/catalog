details: |-
  The Aguilar Filter Twin is a dual envelope filter pedal designed specifically
  for bass guitar. Its defining characteristic is a pair of identical filters
  operating simultaneously — one sweeping upward in frequency, the other
  sweeping downward — producing a rich, layered filter effect that goes well
  beyond what a single-filter design can achieve.

  The dual-filter architecture gives the Filter Twin a more organic, vocal
  quality. When both filters interact, they create complex, evolving tones
  reminiscent of classic 1970s funk bass — think deep, quacking envelope
  sounds — while also opening up entirely new and original filter textures
  not possible with conventional pedals.

  The BLEND control lets players dial in the mix between the two filters.
  The THRESHOLD control governs how responsive the pedal is to playing
  dynamics. Separate VELOCITY controls for the upward and downward filters
  independently set the speed of each sweep.

  Backed by Aguilar's three-year limited warranty.
specs: |-
  - Controls: BLEND (up/down filter mix), THRESHOLD (envelope sensitivity),
    VELOCITY Up (upward sweep speed), VELOCITY Down (downward sweep speed)
  - Power: 9V DC (not included)
  - Input: One 1/4-inch instrument jack
  - Output: One 1/4-inch instrument jack
