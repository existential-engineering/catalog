id: PaYTJqukB-shbIWz-cGQn
name: DL8
manufacturer: midas
primaryCategory: rack-mount
categories:
  - other
url: "https://www.midasconsoles.com/en/products/0606-ACX"
description: "Digital stage box providing an 8 x 8 signal distribution solution
  for live performance and studio applications. Features 8 award-winning Midas
  PRO microphone preamplifiers with switchable +48 V phantom power on balanced
  XLR/TRS combo inputs, 8 electronically balanced low-impedance XLR line
  outputs, dual AES50 SuperMAC ports for connection to a FOH console via a
  single shielded CAT5 cable (with daisy-chaining of up to three DL8s for 48
  channels in/out), and an integrated ULTRANET distribution hub with two powered
  RJ45 outputs for Behringer P16-M personal monitor mixers or Turbosound speaker
  systems. A type-B USB port provides system updates. 24-bit @ 44.1/48 kHz
  A/D-D/A conversion with 114 dB dynamic range and 1.1 ms networked I/O latency.
  Occupies two rack spaces."
details: |-
  8 x 8 signal distribution solution with remote-controllable Midas PRO microphone preamplifiers and Klark Teknik AES50 SuperMAC connectivity. ULTRANET technology delivers 16 channels of 24-bit audio over standard CAT5 cable up to 75 m, powering Behringer P16-M personal monitor mixers and connecting Turbosound speaker systems. Dual AES50 ports allow daisy-chaining of up to three DL8s for 48 channels in and 48 out to the stage via a single shielded CAT5 cable. Built tough for road use in a compact two-rack-unit chassis. Type-B USB port for system updates.
specs: |-
  - A/D-D/A Conversion: 24-bit @ 44.1 / 48 kHz, 114 dB dynamic range (A-weighted)
  - Networked I/O Latency: 1.1 ms (stagebox in > console processing > stagebox out)
  - Microphone Preamps: 8 programmable Midas-designed preamps, balanced XLR/TRS combo
  - Line Outputs: 8 balanced XLR
  - ULTRANET Outputs: 2 RJ45 (power supplied for Behringer P16-M personal mixers)
  - AES50 Ports: 2 SuperMAC networking, industry-standard RJ-45
  - USB Port: 1 type B (for system updates)
  - Mic Input Impedance (XLR jack, unbal. / bal.): 5 kΩ / 10 kΩ
  - Phantom Power: +48 V, switchable per input
  - Equivalent Input Noise Level (XLR, input shorted): -125 dBu, unweighted
  - Frequency Response @ 48 kHz: 10 Hz - 22 kHz, 0 dB to -1 dB
  - Dynamic Range (analog mic in to analog out, typical): 106 dB, 22 Hz to 22 kHz, unweighted
  - A/D Dynamic Range (mic preamp to converter, typical): 109 dB, 22 Hz to 22 kHz, unweighted
  - D/A Dynamic Range (converter and output): 108 dB, 22 Hz to 22 kHz, unweighted
  - Crosstalk Rejection @ 1 kHz (adjacent channels): 100 dB
  - Non-Clip Maximum Input Level (XLR): +23 dBu
  - Line Input Impedance (TRS jack, unbal. / bal.): 5 kΩ / 10 kΩ
  - Non-Clip Maximum Input Level (TRS): +23 dBu
  - Output Impedance (XLR, unbal. / bal.): 50 Ω / 100 Ω
  - Output Level (XLR, nom. / max.): +21 dBu
  - Residual Noise Level (XLR): -88 dBu, 22 Hz to 22 kHz, unweighted
  - AES50 SuperMAC Networking: 2 x 48 channels bidirectional @ 48 or 44.1 kHz, 24-bit PCM
  - AES50 Cable Length: < 80 m recommended (shielded CAT5)
  - ULTRANET Networking: 2 outputs @ 48 or 44.1 kHz, 22-bit PCM
  - ULTRANET Phantom Power for P16-M: 2 powered outputs
  - Daisy-Chain: Up to 3 DL8s for 48 channels in / 48 out
  - Rack Space: 2U
