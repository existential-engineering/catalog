description: A synthesizer like no other, MicroFreak is a peculiar, exceptional
  instrument that rewards the curious musician. It blends wavetable and digital
  oscillators with analog filters. It features a unique poly-aftertouch flat
  keyboard. It adds controlled randomness to sequences. This isn’t a revolution,
  it’s a mutiny.
details: |-
  This out-there little music machine features a versatile digital oscillator so you can create rare and interesting sounds with ease. Modes like wavetable, karplus-strong, harmonic osc, and 3 granular engines give adventurous musicians the chance to explore totally new, unheard possibilities.

  Microfreak features 17 awesome oscillator modes, including 7 bespoke arturia engines, 7 modes from mutable instruments, and 3 oscillator modes designed with noise engineering. Will it let you be expressive? Of course, its not only pressure sensitive, but also offers poly-aftertouch. This means each key can control parameters in a different way depending on how much you touch.

  Inspired by the trailblazing 12-db sem filter, you can make microfreak's filter scream or whisper to taste. The filter is state-variable, and can even auto-oscillate! You can use this in any way you like, from taking the edge of the razor-sharp wavetable sounds, or automating the cutoff by modulating it with keyboard pressure or the in-built sequencer.

  Record up to four automations, edit notes per step or use the innovative spice and dice sequencer functions to find happy accidents. Add randomization to create evolving, original patterns, and virtually rewire and reconfigure its signal chain and controls with the 5x7 modulation matrix.
specs: |-
  - 21 digital oscillator modes
  - Wavetable synthesis
  - Karplus-strong
  - Harmonic osc
  - 3 granular engines
  - Mutable instruments engines
  - Noise engineering engines
  - Vocoder mode
  - Analog state variable filter
  - 12db/octave
  - Low pass filter
  - Band pass filter
  - High pass filter
  - Self-oscillating filter
  - LFO with sync
  - Sine, triangle, sawtooth, square, random, slew waveforms
  - Cycling envelope
  - 25-key capacitive keybed
  - Polyphonic aftertouch
  - Capacitive touch strip
  - Poly-aftertouch sensitivity
  - Monophonic mode
  - Paraphonic mode
  - Unison mode
  - Up to 4 voices
  - Chord mode
  - Scale quantize
  - Polyphonic sequencer
  - 4 modulation tracks
  - Spice & dice gate randomizers
  - 2 patterns per preset
  - 4 automation tracks per preset
  - Modulation matrix
  - 5 modulation sources
  - 7 destinations
  - 3 user-defined points
  - 512 preset slots
  - 320 factory presets
  - OLED display
  - Up, order, random, pattern sequencer modes
  - 3.5mm headphone output
  - Trrs-compatible headphone output
  - Microphone input for vocoder engine
  - 6.35mm master output
  - Balanced line-level output
  - 3.5mm clock input
  - 3.5mm clock output
  - Clock configuration: 24 ppq, 48 ppq, 2 ppq, single pulse per step
  - MIDI in
  - MIDI out
  - 3.5mm MIDI connections
  - MIDI breakout cables included
  - CV outputs
  - Gate outputs
  - Pressure outputs
  - USB power
  - Psu included
  - Size: 55 x 311 x 233 mm
  - Size: 2.17 x 12.24 x 9.17 inches
  - Weight: 1.02 kg
  - Weight: 2.25 lb
  - Pcb keyboard
  - Transpose buttons
  - Arpeggiator
  - Assignable mod matrix
  - Physical modeling
  - Virtual analog synthesis
  - Sample playback
  - Speech synthesis
