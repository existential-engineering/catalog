description: A high-gain fuzz pedal with a multi-curve active tone control that
  shapes the sound from deep bass sludge to screaming lead tones.
details: |-
  THE FUZZ OF ALL FUZZES Call in the Army, the Navy, Scotland Yard, your mom, and the Mario Brothers! You'll need all the help you can get to stop this endless wall of fuzz from raging! This kill-all circuit explodes the meanest, nastiest, most insane distortion to make you the ruler of the fuzz universe. Details If love is a battlefield, then the Fuzz War is your ticket to victorious sustaining fuzz tone. When there’s nothing between you and the audience except an amp, the Fuzz War, and your axe, crank the Fuzz control all the way up and blow 'em away with the raunchiest fuzz tone in modern history. Or dial back the Fuzz for kinder, gentler overdrives and boosts but without volume limits! The Fuzz War’s specially designed active multi-curve Tone control lets you set your sights on creating glorious music by changing the timbre from a deep sludge-bass rumble to screamin’ top-end lead tones that slice through the mix with a whole bunch of useful sounds in-between. Note: When the Fuzz is turned all the way down, the Tone control acts as a frequency shifter – try it for parked-wah and sick filtered effects! And it wouldn’t be a Death By Audio fuzz pedal without enough output to make even the highest headroom amp beg for reinforcements, which is why there’s a handy Volume control to adjust the output level. Each Death By Audio Fuzz War has sick spray-painted graphix covering up meaty components and sound, giving you a high-tech fuzz mutilator that sounds as good as it looks. Achieve a multitude of ultimate fuzz, boost, overdrive, and distortion sounds with the simple turn of a dial. Listen for yourself and you will see, this is the thickest sounding sustaining fuzz pedal we have ever heard. Controls VOLUME Controls the output volume of the effect. FUZZ Controls the gain of the fuzz circuit. At its lowest setting the pedal just acts as a tone shifter. As the fuzz knob is turned up it sweeps from a booster to an overdrive to a thick distortion to a full on blown out war of fuzz. TONE A specially designed multi-curve shaping filter which changes the timbre of the pedal from super deep bass sludge to screaming highs. Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 1 mA Physical Details Dimensions: 5.87" x 4.72" x 2.5" (including hardware) Weight: 18 oz. Sound Samples Mustang Classic Fuzz Thick Punk Crushed Riffs Filter-Sweep Fuzz Dark Tones --> VOX Bass Big Bossman Hairy Chug Break-Up Filter-Sweep Fuzz Chunky Riffs -->
