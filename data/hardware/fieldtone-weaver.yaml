description: The Weaver is a handheld single-knob audio sampler that uses
  randomisation and chance to turn any captured sound into rhythmical loops and
  evolving textures. It can be synced externally via control voltage clock and
  outputs in stereo.
details: |-
  With exploration, randomisation and chance at its core, the Weaver takes any sound and immediately produces rhythmical loops and evolving textures. There is no undo switch, there is no going back. The only other control is the ability to switch between a textural or rhythmic output. Sample time is fixed at two seconds. The amount of rhythms, loops and possible outcomes of that two seconds is infinite - every time you move the knob the parameters are randomised and a new loop presents itself. Sounds can be captured by either the built in microphone or the 3.5mm line input. I n Rhythm mode the Weaver can be externally synced as a slave device via control voltage clock. The Weaver is looking for a sync CV of +5v supplied via 3.5mm jack (standard modular patch cable). The Weaver outputs as stereo, with plenty of spatial movement in its character. The 3.5mm jack output is able to supply headphones directly for portability as well as plugged into line level inputs. The device is powered by 9v centre negative (standard boss pedal style) DC power supply (not included) or by a 9v battery for use in the field. An alkaline battery will give around 2.5 hours of continuous usage, a rechargeable lithium-ion battery 3-4 hours. Please use rechargeable batteries where possible. Available in Forest Green and Dusty Pink

  PLEASE NOTE:

  Tax / Tariffs / Import Duty - we only collect tax on sales to customers in the UK. Any orders placed from outside of the UK will be subject to whatever local import tax rates or tariffs and associated charges are in place in those countries
