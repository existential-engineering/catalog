details: |-
  The AUDIX ADS48 is a wide range UHF antenna distribution system that combines up to four wireless systems to be able to run off a single pair of antennas and power supply. The ADS48 has an internal switching power supply which eliminates the need for the individual DC power supplies normally needed for each receiver. RF signals are internally amplified in order to compensate for any loss that may result from splitting the signal.
  When used in conjunction with the AP42 or AP62 two-channel systems, the ADS48 is able to run 8 channels of wireless on a single pair of antennas and the power supply takes up only 5 rack spaces.
specs: |-
  - Type: UHF antenna distribution system
  - Band: UHF
  - Rack spaces: 5U (including power supply)
  - Capacity: up to four wireless systems on one antenna pair; 8 channels with AP42/AP62
  - Internal switching power supply
  - RF signals internally amplified to compensate splitting loss
  - Antenna connectors: BNC
