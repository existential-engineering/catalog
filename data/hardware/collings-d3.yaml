description: The D3 is a 14-fret dreadnought acoustic guitar featuring a Sitka
  spruce top and East Indian rosewood back and sides. It combines tonal clarity
  with the warmth and depth characteristic of large-bodied dreadnoughts, making
  it well-suited for vocal accompaniment and bluegrass flatpicking. The guitar
  features a pre-war scalloped X-brace, ebony belly-style bridge, and gold
  Waverly tuners.
details: |-
  The D3 is the 3-style dreadnought, featuring a Sitka spruce top with pre-war scalloped X-brace construction over East Indian rosewood back and sides, delivering a blend of tonal clarity, warmth, and depth ideal for bluegrass flatpicking and vocal accompaniment. The neck is Honduran mahogany with a modified V profile, joined to the body via a mortise and tenon hybrid joint. A compound fingerboard radius (14" to 26") and fully adjustable truss rod offer modern playability. The guitar distinguishes itself with ivoroid binding on the body, fingerboard, and peghead, an abalone rosette, a chevron backstrip, and no fingerboard inlays. The bridge and pins are ebony with abalone dots.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Neck Profile: Modified V
  - Fingerboard: Ebony (no inlay)
  - Fingerboard Radius: 14" - 26" compound
  - Scale Length: 25 1/2"
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Bridge: Ebony belly-style
  - Bridge Pins/End Pin: Ebony with abalone dot
  - Tuners: Gold Waverly
  - Frets: Medium 18% nickel-silver
  - Brace Pattern: Pre-war scalloped X-brace
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Body Binding: Ivoroid with b/w/b/w/b purfling
  - Fingerboard Binding: .060" ivoroid
  - Peghead Binding: .100" ivoroid with b/w purfling
  - Rosette: Abalone
  - Backstrip: 3-style (Chevron)
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 15 5/8"
  - Body Length: 20"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/4"
  - Strings: D'Addario EJ-17 (.013" - .056")
