description: >-
  Yamaha's flagship Extended Synthesis workstation combining AWM2 sample
  playback, analog physical modeling, FDSP formant synthesis, and VL virtual
  acoustic synthesis into a single 76-key instrument with onboard sampling and
  sequencing.
details: |-
  The EX5 represented Yamaha's most ambitious synthesizer project of the late 1990s, integrating four distinct synthesis engines into one platform. Its unique Four-Element Voice architecture allowed users to layer and combine AWM2 sample-based sounds with AN analog physical modeling, FDSP formant-based processing, and VL virtual acoustic synthesis, offering an unprecedented range of tonal possibilities in a single keyboard.

  The onboard sampling section, while modest at 1 MB stock, could be expanded to 65 MB via standard SIMMs and supported WAV, AIFF, and AKAI format import. This made the EX5 a self-contained production environment when paired with its 16-track song sequencer and 8-track pattern sequencer, complete with a four-track arpeggiator offering 50 preset and user-definable patterns.

  The EX5 featured a generous complement of real-time controllers including six assignable knobs, dual mod wheels, a ribbon controller, and pitch bend. Effects processing was equally robust with system-level reverb and chorus plus 79 insertion effects available through two independent processing units. A 76-key velocity and aftertouch sensitive keyboard with 16 assignable zones made it a formidable performance instrument.

  Despite its deep capabilities, the EX5 was considered complex to program and was overshadowed by competing workstations of the era. It was produced from 1998 to 2000 and also available in rackmount (EX5R) and 61-key (EX5S) versions, giving users flexibility in how they deployed its powerful synthesis engine.
specs: |-
  - Polyphony: 128 voices maximum
  - Synthesis: AWM2, AN (Analog Physical Modeling), FDSP, VL
  - Keyboard: 76 keys with velocity and aftertouch, 16 assignable zones
  - Sampler: 1 MB expandable to 65 MB (SIMMs); WAV, AIFF, AKAI format support
  - Memory: 512 voices (256 preset + 256 internal), 128 performances
  - Sequencer: 16-track song, 8-track pattern; 30,000 note capacity
  - Arpeggiator: 4-track with 50 preset and user patterns
  - Effects: System reverb (12 types), chorus (17 types), 79 insertion effects
  - Controllers: 6 assignable knobs, pitch wheel, 2 mod wheels, ribbon controller
  - MIDI: 2 In, 2 Out, 1 Thru; 16-part multitimbral
