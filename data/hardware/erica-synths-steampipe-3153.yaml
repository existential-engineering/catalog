description: True physical modeling synthesizer.
details: |-
  The Steampipe is an 8-voice polyphonic synthesizer, but it has no conventional oscillators. Instead, it mimics the way sound is created in wind and string instruments and it is fine-tuned to create a wide range of sounds. The Steampipe is optimized for performance with wind MIDI controllers and it works great with any MIDI keyboard. The overtones the Steampipe produces are very organic and rich, and it comes with great-sounding presets.

  The Steampipe is quite versatile and allows for nuanced sonic exploration, conjuring sonic imagery ranging from wisps of cloud to fairground band organs, then to industrial horns of the railroad and finally to massive, otherworldly ambiences. Due to detailed controls over multiple physical modeling parameters, the Steampipe is capable of generating very organic emulations of real instruments, but it goes well beyond the conventional pitch and dynamic ranges they can produce, so a flute or a clarinet can be heard at C1 or C7.

  The physical modeling engine carries 32 adjustable parameters, five assignable LFOs with delay and sync, and an extensive modulation matrix with MIDI controller specific configurations. Every parameter is controllable over MIDI CC.

  Memory holds 64 factory presets and 192 user presets, and presets can be exported and imported over USB. Connections are a DIN5 MIDI input, a MIDI Thru/Out, a stereo line level output and a headphone output. The instrument measures 45.5cm x 27cm x 7cm and weighs 3kg.
specs: |-
  - 8-voice polyphony
  - Physical modeling engine with 32 adjustable parameters
  - 5 assignable LFOs with delay and sync
  - Extensive modulation matrix with MIDI controller-specific configurations
  - 64 factory presets and 192 user preset memory
  - Preset export and import via USB
  - All parameters are MIDI CC controllable
  - Dimensions: 45.5cm x 27cm x 7cm
  - Weight: 3kg
