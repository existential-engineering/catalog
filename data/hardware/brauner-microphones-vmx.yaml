url: https://brauner-microphones.de/en/products/vmx/
description: A large-diaphragm tube condenser with a distinctive full character
  and silky top end, delivering highest detailed resolution with a
  well-balanced tonal appearance suited to vocals and narration.
details: |-
  Whereas the VM1 represents the natural sounding part of the VMA (which combines two
  microphones in one), the VMX offers the full character sound of the VMA in a single
  microphone and yields highest detailed resolution with a soft and silky top end.

  Slight accentuation of the low mid and bottom end as well as a soft upper mid range grant
  this reference quality tube microphone a unique and completely charming sonic character.

  The VMX excels in vocal and narration recordings through its well-balanced tonal appearance
  and pleasant proximity. It adds its own character without recognizably tainting the sound
  source.

  The VMX is also eminently suitable for instrumental recordings, through the reproduction of
  the finest details; giving string instruments for example the noticeable appearance of
  vicinity and warmth.
specs: |-
  - Equivalent Noise: < 11 dB A (IEC651)
  - Signal to Noise Ratio: > 83 dB (1 Pa/1 kHz-Cardioid)
  - Sensitivity: 28 mV / Pa-Cardioid
  - Polar Pattern: All patterns, infinitely variable
  - Frequency Range: 20 Hz - 20 kHz
  - Maximum SPL: 142 dB SPL @ 0.3% THD
  - Power Supply: 115 V or 230 V
