description: Mindphaser is a next generation complex dual oscillator for the
  Eurorack modular synthesizer format. Its dual oscillator architecture builds
  on and advances principles developed decades ago, by pioneers of electronic
  music synthesis.
details: |-
  Mindphaser is a complex dual oscillator for the eurorack format, with an architecture that builds on principles developed decades ago by the pioneers of electronic music synthesis.

  Sound is generated by two VCO cores, the Carrier and the Modulator. Beyond those cores, a palette of intermodulation is offered through the Modulation Bus (ModBus) and a separate, supplementary through-zero phase modulation (TZ-PM) bus.

  The result is sculpted further by a final set of tools contained in the Waveshaper before it reaches the output.

  The module is a reissue redesigned by Erica Synths in close collaboration with Hexinverter. Minor alterations were made to the mechanical assembly and the digital controls to suit Erica Synths manufacturing routines and chip shortages, while the analogue signal path is identical to the original version.

  In September 2022 Stacy Gaudreau, the founder of Hexinverter Électronique, announced the closing of its operations. Erica Synths, in cooperation with Hexinverter Électronique, took over the manufacturing, sales and support of several of those modules, retaining all functionality while redesigning the hardware, with support provided for the reissue modules only.
specs: |-
  - Dual VCO cores (Carrier and Modulator)
  - Modulation Bus (ModBus)
  - Through-zero phase modulation (TZ-PM) bus
  - Waveshaper section
  - Width 30HP
  - Depth 24mm
  - Current draw +188mA, -107mA
