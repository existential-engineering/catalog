description: >-
  The Sequential Circuits TOM is a fully programmable drum machine from 1985 featuring
  digitally recorded drum sounds with extensive tuning and layering capabilities. It
  offers eight built-in drum kit sounds expandable via EPROM cartridges, along with a
  sophisticated sequencer supporting both real-time and step-time recording. Notable
  features include the Improv Factor for automatic fill generation, a Human Factor for
  natural-sounding variations, and full MIDI implementation.
details: |-
  The TOM was introduced in 1985 as one of Sequential Circuits' most sophisticated drum machines, building on the foundation laid by the earlier DrumTraks. It features eight basic drum kit sounds — kick, snare, toms 1 and 2, open and closed hi-hat, clap, and crash — each with individual control over tuning, pan position, and volume.

    A standout feature is the extensive tuning control available on each drum sound, which goes far beyond what competing drum machines of the era offered. This flexibility allows users to transform sounds dramatically; for example, cymbals can be converted into gongs. All sounds can be layered together, creating possibilities for chord-like drum tones, tom rolls, and other creative textures. Sounds can also be played in reverse for additional sonic variety.

    Additional drum tones can be added via EPROM cartridges, allowing up to eight extra sounds beyond the factory set. The machine is fully MIDI equipped, capable of transmitting and receiving controller information including volume and tuning data.

    The sequencer allows both real-time and step-time pattern recording, storing up to 99 patterns with each pattern supporting up to 99 measures. As many as 99 patterns can be linked together to form complete songs. The default sequencer memory holds 2,300 notes, though factory updates were available to expand this to either 5,000 or 10,000 notes.

    The TOM includes several innovative performance features. The Improv Factor function generates drum fills with pattern variation, while the Human Factor allows programming of minor tuning and volume variations to create a more natural, humanized feel. A Reframe function enables users to shift the downbeat location within a pattern without re-recording. Programs are backed up by an internal battery with a 5-year lifespan and can also be saved and loaded via cassette tape.
specs: |-
  - Polyphony: 4 sounds
  - Drum Sounds: 8 (kick, snare, toms 1 and 2, open/closed hi-hat, clap, crash)
  - Sound Expansion: Up to 8 additional sounds via EPROM cartridges
  - Sequencer Patterns: 99
  - Pattern Length: Up to 99 measures per pattern
  - Songs: Up to 99 patterns linkable
  - Sequencer Memory: 2,300 notes (expandable to 5,000 or 10,000)
  - Recording Modes: Real-time and step-time
  - Sound Features: Individual tuning, panning, volume, layering, reverse playback
  - Special Features: Improv Factor, Human Factor, Reframe function
  - MIDI: Full transmit/receive with volume and tuning controller data
  - Memory Backup: Internal battery (5-year lifespan)
  - Program Storage: Cassette tape save/load
