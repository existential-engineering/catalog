details: |-
  The 35T-CE tenor uke features all solid Acacia for the top, back, and sides which give it a clear, bright tone, and distinctive figured appearance. It includes a beautiful Rosewood bridge, binding, and fingerboard. The 35T-CE also features a soft cutaway and the L.R. Baggs Five O pickup, a small, lightweight pickup specifically engineered for the ukulele’s unique size and voice. The styling is refined and sleek, using Abalone for the inlaid rosette and Rosewood for the binding, capped off with Cordoba’s signature elevated headstock with a figured Acacia overlay. The finish is a gloss polyurethane, applied as thinly as possible for maximum resonance. Other features include a black TUSQ nut and saddle, chrome Grover tuners, and a Cordoba polyfoam case.
