details: |-
  The Studio 10 is a 60-watt bass combo with a custom 10" Ashdown speaker, a 5-band EQ, valve-emulated overdrive and a headphone out for silent practice. Built from lightweight poplar ply with rugged tolex and chrome corners, it is versatile enough for home, rehearsal or stage.
