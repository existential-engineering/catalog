description: "Ooey-gooey-analog goodness: an analog vibrato/chorus pedal that
  simulates the effect of a warped vinyl record, though that is only scratching
  the surface of what it can do. The signal path is fully analog, but every knob
  is connected to a little digital brain that opens up effects never before
  heard in an analog stompbox."
details: |-
  Warped Vinyl is an analog vibrato/chorus pedal and Chase Bliss Audio's first product. At its core it simulates the effect of a warped vinyl record, but that is only scratching the surface: the pedal features an analog signal path in which the guitar signal stays analog the entire time and never gets digitally processed, while every knob is connected to a little digital brain (a microprocessor) that interfaces with the analog effect, opening up effects that had never been heard in an analog stompbox.

  The Depth and Warp knobs and two wave-shape toggles comprise the ModuShape engine. Depth controls how wide the vibrato goes, Warp sets the center point of the modulation for asymmetric ramp-up/ramp-down waves, and each toggle independently selects sine, triangle, or square for its half of the modulation wave. The Mix knob dials in anything from 100% dry to 100% wet vibrato, with middle settings giving a smooth chorus, and RPM controls the vibrato rate, which can be overridden by the tap tempo stomp with 1-2-4 (or 3-6-8) tap divisions.

  The Ramp knob can modulate or ramp-and-hold any of the five parameters (volume, mix, RPM, depth, warp) individually or simultaneously, configured via a bank of dip switches on the back of the pedal that also provides bounce, Lo-Fi, momentary-bypass, tap-control, tap-division, and sweep-range options. Two onboard preset slots are recalled with the lower toggle, and the pedal is true bypass via a relay.

  Connectivity comprises mono 1/4-inch input and output jacks, a 1/4-inch TRS expression jack (Mission EP-1 or EP-25k recommended) that can also accept 0-5V CV control on the tip, and a 1/4-inch TRS tap jack that works as a tap input or output and can carry MIDI via Chase Bliss's Midibox adapter TRS cable and an Empress Effects Midibox — enabling MIDI clock sync, preset recall, bypass, and ramp reset on the pedal's fixed MIDI channel 5. The pedal consumes about 25mA from an alkaline 9V battery or a standard 2.1mm center-negative 9V DC adapter, with 1M input impedance, 1k output impedance, and an internal voltage doubler running the boost circuitry at 18V.

  Warped Vinyl was listed as sold out on Chase Bliss's site by March 2015, by which time the Warped Vinyl MkII had taken its place in the product lineup; the company now lists the original as "Warped Vinyl MKI" in the discontinued section of its website.
specs: |-
  - All-analog signal path with digital (microprocessor) control
  - Analog vibrato/chorus with fully wet-to-dry mix control
  - ModuShape engine: independent sine/triangle/square wave shapes for each half of the modulation wave
  - Warp knob for asymmetric modulation waveforms
  - Ramp knob modulates or ramp-and-holds volume, mix, RPM, depth, and warp
  - Tap tempo with 1-2-4 or 3-6-8 divisions
  - Two onboard preset slots
  - Expression pedal input (Mission EP-1/EP-25k recommended) or 0-5V CV control
  - MIDI via TRS adapter cable and Empress Midibox: clock sync, preset recall, bypass, ramp reset (MIDI channel 5)
  - Rear dip switches: ramp/expression parameter assignment, bounce, Lo-Fi, momentary bypass, tap control, tap division, sweep range
  - True bypass via relay
  - 18V boost circuitry via internal voltage doubler
  - Input impedance 1M, output impedance 1k
  - ~25mA current draw; 9V battery or 2.1mm center-negative 9V DC adapter
