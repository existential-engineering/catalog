description: The DJ4 is a compact DJ controller with MIDI remote functionality,
  offered as the successor of the DJ3 and optimised for Native Instruments
  Traktor Pro.
details: |-
  DJ4 as successor of the DJ3 is a controller for each DJ application with MIDI remote functionality, described by Faderfox as probably the smallest DJ controller on the market.

  The device is optimized for NI Traktor Pro and has 8 centered pots for EQ and filter, 3 faders, 4 push-encoders to control FX, deck and global functions, and various colored buttons and LEDs. Compared with its predecessor it adds MIDI ports, 4 additional buttons (filter and kill) and better encoder knobs, and the new colored controls make it easier to find the right button in dark club situations.

  The behaviour of the controls is programmable so the device can be adapted to other applications, and four internal setups store individual settings. The factory settings plus the enclosed setup files for Traktor Pro and Ableton Live are intended to control both out of the box.

  Three switchable MIDI routings make the unit more flexible for complex MIDI setups. Simultaneous control of external gear and computer software is possible thanks to the available USB and MIDI ports, and further MIDI controllers can be chained through the MIDI ports.
specs: |-
  - Special controller for DJ software (optimised for Native Instruments Traktor Pro)
  - iPad compatible with camera connection kit
  - Setup files for Traktor Pro and Ableton Live are shipped with the controller
  - USB interface, class compliant, no driver necessary
  - MIDI in and out ports with routing and merge functionality
  - Controls up to four decks, easy switching between deck A-C and B-D on the fly
  - Four FX slots available
  - 4 multifunctional push encoders with detents switchable to 7 groups
  - 24 colored buttons
  - All controls with double function by holding down the shift button
  - 22 LEDs in different colors to display feedback informations
  - 4 internal setups with various programmable functions
  - 8 centered pots for EQ and filter, 3 faders
  - USB bus powering, consumption less than 500mW / 100mA
  - Very compact design in a black, plastic casing (desktop format)
  - Size 180 x 105 x 70 mm, weight 350 g
  - High-quality faders, pots and encoders from ALPS
  - New rubber knobs for best tactile feeling
  - Requires PC or Mac with a free USB port (1.0 or higher) or a USB hub, or an iPad with iOS 5 or higher via Apple's camera connection kit
  - Connects to MIDI gear with a standard 5-pin DIN MIDI port by optional adapter cable
  - USB power adapter (5V min 200mA) needed if you want to control MIDI gear only
  - Works with Traktor Pro 2 (2.10 or higher), Ableton Live (8.42 or higher) or any software allowing user assignments of continuous CC parameters
