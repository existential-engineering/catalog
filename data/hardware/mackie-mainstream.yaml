description: Complete Live Streaming and Video Capture Interface With
  Programmable Control Keys.
details: |-
  Mackie MainStream is the easiest way to start a pro quality live stream by bringing together your video, audio and stream control into a single, powerful device, so you can focus on connecting with your audience.

  Mackie MainStream is the all-in-one solution that streamlines your desktop setup by integrating your game feed with your mic/headset, cameras, and other sources, allowing you to control your live stream from one powerful device. MainStream acts as a capture card for Switch, Xbox, PlayStation and other gaming consoles. Just connect your console to HDMI in and the HDMI passthrough to your television.

  Run a professional live streaming battlestation through Mackie MainStream, including a high-end DSLR camera through the HDMI, USB webcam for an extra angle, plus a high-quality XLR broadcast mic and headphones. It all connects to your PC with one USB-C cable. The flexibility of Mackie MainStream makes it the perfect interface for any type of stream.

  The free Matrix Software is entirely optional, but extremely powerful. Add up to 6 virtual inputs (like Discord or Spotify) and 4 hardware inputs and route them all to your live stream. Add vocal effects, tweak your mix and create and trigger samples with 24 virtual pads.

  When you're streaming live, the last thing you want is to end up menu diving on your computer. MainStream gives you tactile control over levels, plus a row of 6 programmable keys for triggering samples and transitions.
specs: |-
  - XLR/TRS Combo Mic Input (+48V) (60dB)
  - Headset Mic & Return
  - Aux Input
  - 1/4" Headphone Out
  - 1/4" Monitor Outs
  - HDMI Input (1080p x 60fps capture)
  - HDMI Passthrough (4k x 60fps)
  - Dual USB-C Input Hub
  - Single USB-C Interface (Bus Powered)
  - 6 Multifunction Keys
  - Mic Level Control
  - PC Audio Return Level Control
  - HDMI Audio Level Control
  - Mic & Aux Mutes
  - Headphone & Monitor Level Control
  - HDMI Audio Mute
  - Headphone/Monitor Mute
  - Direct Monitoring On/Off
  - Level Indicator
  - Stereo Output Metering
