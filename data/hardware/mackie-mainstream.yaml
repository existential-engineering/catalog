description: MainStream Complete Live Streaming and Video Capture Interface with
  Programmable Control Keys, Matrix Software, HDMI Capture and Thru, USB-C Hub,
  Bus Powered.
details: |-
  MainStream brings video, audio and stream control together in a single device. It integrates a game feed with a mic or headset, cameras and other sources so a whole live stream can be run from one place.

  An HDMI input carries a video capture card at 1080p60 and a separate HDMI passthrough feeds a monitor or television at up to 4K60, so a console or camera can be streamed and watched at full resolution at the same time.

  Two USB-C inputs act as a hub for extra cameras, USB microphones, thumb drives and other USB devices, all reaching the computer over the single USB-C output. That same USB-C port carries every audio, video and data feed as an independent source, and is MainStream's only source of power.

  Analog connections include the main XLR/TRS combo mic input with 48V phantom power and up to 60 dB of gain, a 1/8 inch TRRS headset jack, a 1/8 inch smartphone jack with built-in Mix Minus for call-in guests, a 1/4 inch headphone output and 1/4 inch stereo monitor outputs.

  A row of six multifunction keys on the top panel is programmable for triggering samples and transitions, alongside level controls and mutes for mic, aux, HDMI audio, PC return, headphones and monitors. The free Matrix software adds a virtual streaming mixer with six virtual inputs, four outputs, vocal processing, effects and 24 virtual pads.
specs: |-
  - XLR/TRS combo mic input with 48V phantom power, up to +60 dBu gain
  - 1/8 inch TRRS headset jack with mono mic input and stereo headphone return, plus 5V plug-in power (no phantom power)
  - 1/8 inch TRRS smartphone jack (channel 2) with Mix Minus return
  - Direct monitoring on/off for zero-latency analog input monitoring
  - 1/4 inch TRS headphone output
  - 1/4 inch balanced stereo monitor outputs
  - HDMI Type A 2.0 input, 1080p60 capture, 4Kp60 passthrough resolution
  - HDMI Type A 2.0 passthrough jack, up to 4Kp60
  - Dual USB-C input hub for cameras, USB mics and drives (inputs only, not a power source)
  - Single 2x2 USB-C interface port, bus powered from the computer, requires a certified USB-C 3.1 or higher cable
  - USB audio format: 24-bit, 48 kHz
  - 6 multifunction programmable control keys
  - Mic, aux, HDMI audio and headphone/monitor mute buttons with stereo output metering
  - Channel 1 XLR input takes precedence over the 1/8 inch headset jack; they do not work simultaneously
