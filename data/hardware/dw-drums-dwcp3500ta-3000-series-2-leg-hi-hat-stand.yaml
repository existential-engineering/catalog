details: |-
  The DW 3000 Series Hardware has been completely redesigned from the ground up. Smooth and responsive, this medium-weight, double-braced 2-leg stand is an excellent choice for working drummers that play double pedal set-ups.

  A spring-loaded tension adjustment mechanism is precise and easy to use, while a lateral cymbal seat angle adjustment and folding baseplate with non-skid rubber grip and integrated spurs are player-friendly must-haves.

  One-Touch Clutch: adjust your hi-hat tension quickly and easily with one hand. The tube joint with integrated memory lock slides the tension lever into place, then locks with a standard drum key.

  The 3000 Series is engineered for drummers of all levels, with sturdy double-braced hardware providing stability and durability during intense performances, smooth memory locks for seamless adjustment, and a sleek design that complements any drum kit.
