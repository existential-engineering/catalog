details: |-
  Clap is Erica Synths' take on analogue clap circuits adapted for modular systems, developed together with the French company e-licktronic. The sound is sharp and punchy, and accent together with CV control over tone make the module distinctively expressive in the studio and in live performance.

  Tone and decay are set by knobs on the panel, with decay reaching from 120ms to 1100ms. Tone can be voltage controlled through an attenuated CV input, and a manual trigger button fires the voice without a patch cable.

  The accent input raises the level of a hit for better expression, taking up to 10V, while the trigger input responds to a 5V pulse of about 1ms. The audio output swings between -5V and +5V, and CV inputs take a full span of -5V to +5V.

  The module is 6HP wide and 35mm deep and draws 24mA from the +12V rail and 20mA from the -12V rail. Erica Synths notes that on this run of modules the pitch and decay CV inputs are inverted, so rising CV decreases pitch and falling CV increases it.
specs: |-
  - Tone and Decay controls
  - CV control with an attenuator over Tone
  - Manual trigger
  - Accent for better expression
  - Decay range: 120ms to 1100ms
  - Audio output level: -5V to +5V
  - CV level (full span): -5V to +5V
  - Trigger level: 5V
  - Trigger time: 1ms
  - Accent CV level: 10V
  - Power consumption: 24mA@+12V, 20mA@-12V
  - Module width: 6HP
  - Module depth: 35mm
