details: |-
  Our gorgeous ribbon microphone offers a vintage vibe in both look and sound

  Sontronics SIGMA 2, along with its siblings DELTA 2 and APOLLO 2 , sit at the very pinnacle of ribbon microphone technology and represents the best of British engineering. Our original SIGMA was one of the first phantom-powered (active) ribbon microphones in the world. Offering high sensitivity, low self-noise and plug-and-play compatibility with any audio interface, preamp or mixer, SIGMA and its V2 successor (released in 2018) have become must-haves in top studios and venues worldwide. As you'd expect from a ribbon mic, SIGMA 2 delivers an intimate, natural reproduction and is beautifully suited to vocals, solo wind and string instruments as well as (if used with care) guitar amps and percussion too. Used on its own or in pairs, SIGMA 2 gives absolutely stunning and perfectly accurate results that you will fall in love with! FEATURES

