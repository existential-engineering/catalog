specs: |-
  - Phantom-Powered Ribbon Microphone : Utilises a highly sensitive ribbon element with the added advantage of phantom power, providing a stronger output signal while maintaining the classic ribbon mic sound.
  - Smooth, Warm Sound : Delivers the signature warm, natural, and smooth sound associated with ribbon microphones, making it ideal for vocals, strings, brass, and woodwind instruments.
  - Superb Sensitivity : Captures the subtle nuances of any performance with exceptional sensitivity, offering detailed and natural recordings even at lower sound levels.
  - Figure-8 Polar Pattern : Features a true figure-of-8 polar pattern, capturing sound equally from the front and rear while rejecting noise from the sides, ideal for stereo recordings and close-miking.
  - Low Self-Noise : Engineered with ultra-low self-noise circuitry, ensuring that even the quietest details of a performance are captured without unwanted noise.
  - Hand-Built in the UK : Each Sigma 2 is meticulously hand-built in the UK, ensuring the highest quality and consistency in every microphone.
  - Retro-Style Design : Features a classic, elegant design with a durable, all-metal body that reflects the vintage charm of traditional ribbon microphones.
  - Versatile Studio Use : Ideal for studio applications, whether you're recording vocals, acoustic instruments, or orchestral performances, offering a rich and natural sound.
  - Vocals
  - Spoken Word
  - Solo Woodwind
  - Solo Strings
  - Piano
  - Acoustic Guitars
  - Microphone type: Ribbon
  - Polar pattern: Figure-of-eight
  - Frequency response: 20Hz to 15kHz
  - Sensitivity: 24mV/Pa
