details: |-
  Dan Briggs is best-known as the bassist of prog-metal pioneers Between the Buried & Me. His work with BTBAM over the years as propelled the band to the forefront of modern metal with his eclectic approach and unmistakable style. This instrument is based on the very first Spector Dan ever owned when he was a high school music student. His search for a 5-string, 24 fret instrument led him to the NS-2000 and it has remained his main bass to this very day. Dan's model is accentuated with a custom inlay and a figured poplar burl, but the construction remains very similar to that of a classic Spector. The body wings are fully carved from solid Maple for a precise and vibrant tone. The 3-piece Maple neck is glued directly to the body wings, completing the neck-thru construction. The Pau Ferro fingerboard features 24 frets, with a custom inlay designed by Ben Tuttle on the 12th fret. The NS-2000/5 Dan Briggs is equipped with a pair of EMG humbuckers and a TonePump Jr. active circuit. Together, these electronics deliver a powerful range of tones, perfect for cutting through the mix or laying back on the groove. Whether you're a fan of Between the Buried and Me or a virtuoso bassist yourself looking for a reliable instrument, Dan's signature Spector is an excellent choice for your next 5-string.
