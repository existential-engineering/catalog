details: |-
  For 65 years the Gretsch Jet has fueled stages and studios producing some of the greatest sounds in rock 'n' roll history.

  Like its forebears, the Jet FT begins with a select mahogany body with maple top that produces the signature strong, punchy response that has made the Jet famous.

  A pair of High Sensitive Filter'Tron pickups complements the Jet FT's chambered body to produce a wide, balanced and transparent tone.

  The Jet FT features a lowered neck set that greatly improves fret-hand mobility while also giving the picking hand a closer approach.
