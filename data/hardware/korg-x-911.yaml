description: >-
  The Korg X-911 is a monophonic analog guitar synthesizer and signal processor from 1980
  that accepts standard audio input and processes it through two oscillator sections and a
  voltage-controlled filter. Originally designed for guitar, it has gained appreciation as
  a versatile all-analog effects processor for any monophonic audio source.
details: |-
  Originally marketed as a guitar synthesizer, the Korg X-911 has earned recognition as a versatile analog signal processor capable of transforming any monophonic audio source. It accepts standard quarter-inch jack input from guitars, microphones, or other instruments, processing the signal through its analog circuitry one note at a time.

  The architecture features two sections that can be blended via a central balance slider. The Instrument section offers six preset patches including electric bass, tuba, trumpet, distorted guitar, violin, and flute, each with adjustable parameters. The Synthe section provides variable synthesis with graphical waveform icons for pulse, ramp, and square waves, along with envelope controls for attack and decay. Both sections can be overlaid for combined tones.

  A voltage-controlled filter with tone and cutoff controls shapes the processed signal, while a VCA with attack and decay controls handles amplitude dynamics. A distortion circuit adds harmonic content. Velocity response and touch sensitivity are selectable via a three-way switch, and portamento control adds expressive glide between notes.

  Extensive patching options via CV/Hz in/out, trigger in/out, FM input, VCF input, and four effects inputs make the X-911 surprisingly flexible for integration with other analog and modular equipment. Foot-switchable inputs enable control of portamento, interval, and hold functions during performance.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 (Instrument and Synthe sections)
  - Filter: 1 VCF with tone and cutoff
  - VCA: 1 with attack and decay
  - LFO: None
  - Effects: Distortion
  - Presets: 6 instrument patches (Electric Bass, Tuba, Trumpet, Dist. Guitar, Violin, Flute)
  - Synthe Waveforms: Pulse, Ramp, Square
  - Input: 1/4-inch jack (guitar, mic, or instrument)
  - Control: CV/Hz in/out, trigger in/out, FM in, VCF in, 4 effects inputs
  - Foot Control: Portamento, interval, hold
  - Touch Sensitivity: 3-way selectable switch
  - Memory: 6 preset patches
  - Keyboard: None (external audio input only)
