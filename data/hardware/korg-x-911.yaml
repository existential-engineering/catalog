description: >-
  The Korg X-911 is a monophonic analog guitar synthesizer and signal
  processor from 1980 that accepts standard audio input and processes it
  through two oscillator sections and a voltage-controlled filter.
details: |-
  Originally marketed as a guitar synthesizer, the Korg X-911 has earned recognition as a versatile analog signal processor capable of transforming any monophonic audio source. It accepts standard quarter-inch jack input from guitars, microphones, or other instruments, processing the signal through its analog circuitry one note at a time.

  The architecture features two sections that can be blended via a central balance slider. The Instrument section offers six preset patches including electric bass, tuba, trumpet, distorted guitar, violin, and flute. The Synthe section provides variable synthesis with more hands-on control. Both sections can be overlaid for combined tones.

  A voltage-controlled filter with tone and cutoff controls shapes the processed signal, while a VCA with attack and decay controls handles amplitude dynamics. A distortion circuit adds harmonic content. The X-911 lacks an LFO, keeping the modulation capabilities simple but the signal path direct.

  Extensive patching options via CV/Hz in/out, trigger in/out, FM input, VCF input, and four effects inputs make the X-911 surprisingly flexible for integration with other analog equipment. While underestimated in its time, the X-911 has found appreciation among musicians who value its unique analog signal processing character.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 (Instrument and Synthe sections)
  - Filter: 1 VCF with tone and cutoff
  - VCA: 1 with attack and decay
  - Effects: Distortion
  - Presets: 6 instrument patches (Electric Bass, Tuba, Trumpet, Dist. Guitar, Violin, Flute)
  - Input: 1/4" jack (guitar, mic, or instrument)
  - Control: CV/Hz in/out, trigger in/out, FM in, VCF in, 4 effects inputs
  - LFO: None
  - Memory: 6 preset patches
releaseDate: "1980"
releaseDateYearOnly: true
