description: The LTD EX Series gets a bit bigger with the EXL-200… literally. The EXL-200 offers set-neck construction at 24.75” scale for smooth access to the highest frets, with a mahogany body, three-piece maple neck, and rosewood fingerboard with 22 extra-jumbo frets.
details: |-
  The LTD EX Series gets a bit bigger with the EXL-200… literally. We modified the body size of our angular EX Series to be slightly larger and more bold, and the results speak for themselves — this is a beast of a guitar! The EXL-200 offers set-neck construction at 24.75” scale for smooth access to the highest frets, with a mahogany body, three-piece maple neck, and rosewood fingerboard with 22 extra-jumbo frets. Components on this guitar include a TOM-style bridge and tailpiece, and a set of ESP’s powerful LH-301 passive pickups.
