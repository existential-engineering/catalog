details: >-
  Ace-3 is a re-creation of the ace-tone rhythm ace fr-3 analogue drum machine
  from the 1960s.


  All the internal sounds have been carefully sampled and the rhythms
  re-created.


  Some of the rhythms on the fr-3 feature accented beats which have been
  accurately reproduced on the ace-3.


  The built-in MIDI file recorder makes exporting the built-in rhythms and
  playing them back from a DAW easy and gives predictable playback from anywhere
  in the song.
specs: |-
  - MIDI file recorder
  - Accented beats reproduction
  - Sampled internal sounds
  - Rhythm recreation
