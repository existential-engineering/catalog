description: Walnut has long been favored by furniture makers for both its
  beauty and durability. As a drum shell material, Walnut's naturally EQ'ed tone
  has been praised by the drum community for both the stage and the studio. The
  new STAR Walnut shells project booming low end with enough cut to be heard
  through any mix.
details: |-
  Walnut Shells (STAR Drum): All Walnut Shell: 6ply, 6mm (except ASCS, AGJB, ASBJ, AIJB, LIC, RSC & AWC) *Satin Charcoal Japanese Sen (ASCS), Garnet Japanese Sen Burst (AGJB), Satin Black Japanese Sen Burst (ASBJ) & Indigo Japanese Sen Burst (AIJB) Walnut + 2 outer ply Japanese Sen: 6ply, 6mm *Light Indigo Japanese Chestnut (LIC), Roasted Japanese Chestnut (RSC) & Antique White Japanese Chestnut (AWC) Walnut + 1 outer ply Japanese Chestnut : 6ply, 6mm Generation of furniture makers have favored Walnut for its reliable solidness and long-term stability. As a drum shell material, Walnut's distinctive warm, fat sound has long been subject of rumor among drum tone aficionados, and STAR WALNUT are doubtlessly about to rekindle that discussion.

  Air Hole: STAR snare drums have 3 air holes around the shell, instead of just 1 like on the tom toms, floor toms, and bass drums. These extra air holes lend a brighter, dryer sound to the snare drums and results in even projection in all directions.

  Super Sensitive Hi-Carbon Snare Wire: The Super Sensitive Hi-Carbon snappy snare features a specialized plate and winding pattern for the wire coils, and is made of hi-carbon steel. This results in a very crisp, sensitive snare sound on all STAR snare drums.

  "Linear-Drive" Strainer (US. PAT.NO.8017846) (MLS50A): The "Linear-Drive" strainer is designed for greater control of the lever adjustment arm and more precise control of the strainer's deployment motion. The strainer movement works in a true linear motion. Even if the strainer is engaged rapidly, you will not hear the typical "slap" of the snare wires hitting the bottom drumhead. To prevent the snare wires from loosening, this strainer also has a ratchet system on its tension adjustment mechanism. Single click adjustments offer a vertical pull of 0.083mm in wire motion, which allows for ultra-sensitive micro adjustments.

  Newly Designed One-Piece Lug: STAR snare drum lugs were designed with a clean look and bridge construction for minimum shell contact. They are just one piece to reduce the overall weight of the drum. In addition, both 13" and 14" diameter snare drums have just 8 lugs, instead of 10. This reduces the weight of the snare drum even further and offers in a more open, resonant tone.

  Snappy Bed: The shape of the snare beds is an important factor in any snare drum's sound. In particular, the sustain and sensitivity of the snare wires are heavily affected by the shape of the snare beds. STAR snare drums employ a different snare bed than TAMA's traditional shape. The goal was to create snare drums that have the same rich resonance as the rest of the STAR drums, but that are also very crisp and articulate. To achieve this, STAR snare drums have a flat bottom that provides even and consistent contact with each snare coil.
