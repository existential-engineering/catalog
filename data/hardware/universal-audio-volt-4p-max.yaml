description: Twelve-in, six-out desktop USB audio interface with four Tone
  Shaping preamps and Max compression.
details: |-
  Volt 4P Max is a desktop USB audio interface with four Tone Shaping preamps, each offering 60 dB of gain across the Warmth, Focus and Shine harmonic character modes, for tracking up to four sources at once.

  Max Processing adds onboard realtime compression with six musical presets for vocals, guitars and bass, modelled on classics such as the LA-2A and the 1176. Pairing the Tone and Max stages yields over eighteen character combinations.

  Four mic and line combo inputs join two front-panel Hi-Z instrument inputs and additional line outputs. Speaker switching selects between main and alt monitor pairs. An ADAT or S/PDIF optical input, MIDI In and Out, an onboard USB hub, a built-in talkback microphone and two headphone outputs sharing one cue mix complete the unit.
specs: |-
  - 12-in / 6-out desktop USB audio interface
  - 32-bit / 192 kHz conversion
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Four Tone Shaping preamps, 60 dB available gain each
  - Warmth, Focus and Shine harmonic character modes
  - Max Processing realtime compression with six presets
  - Four mic and line inputs for tracking four sources at once
  - Speaker switching between main and alt monitor pairs
  - ADAT or S/PDIF optical input, 8 channels at 44.1 and 48 kHz
  - MIDI In and Out on 1/8-inch TRS, MIDI Type A
  - Built-in talkback microphone
  - Two headphone outputs sharing one cue mix
  - Full-colour Smart Display with gain-reduction metering
  - Auto-Gain and Clip Protection
  - External USB power input requiring 5VDC at 2A minimum, 3A supplied
