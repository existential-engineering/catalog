description: The Academy 12e is an acoustic-electric Grand Concert guitar from
  Taylor's Academy Series, featuring a solid torrefied spruce top, layered
  walnut back and sides, ES-B electronics with built-in chromatic tuner, and an
  integrated armrest for comfortable playability.
details: |-
  The Academy 12e is built around a Grand Concert body delivering focused, articulate sound with good projection. The solid torrefied spruce top has been heat-treated to simulate aged tonewood character, lending warmth and sweetness. Layered walnut back and sides add bold character while keeping the instrument durable and accessible.

  A slender neck profile and 24-7/8" scale length make fretting easier and reduce fatigue for developing players. An integrated armrest on the body edge improves playing comfort significantly. Eucalyptus fretboard with dot inlays provides a smooth playing surface.

  ES-B electronics with a built-in digital chromatic tuner make the guitar immediately stage-ready. Ships with a padded gig bag.
specs: |-
  - - Body shape: Grand Concert
  - Top: Torrefied Spruce (solid, matte)
  - Back/sides: Walnut (layered, matte)
  - Bracing: X
  - Neck: Mahogany
  - Fretboard: Eucalyptus
  - Inlays: 4mm dots (Italian Acrylic)
  - Armrest: Integrated
  - Scale length: 24-7/8"
  - Tuners: Chrome
  - Pickguard: Tortoiseshell
  - Electronics: ES-B with built-in digital chromatic tuner
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Padded gig bag included
