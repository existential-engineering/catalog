description: 2+1 channel all-analogue DJ mixer with the classic Xone:VCF filter,
  mini innoFADER crossfader, 3-band isolator EQ, RIAA Phono/Line preamps and a
  Master Insert FX loop.
details:
  - Essential Tools. Professional Sound — whether you're spinning vinyl, playing
    from digital media players, or simply looking for high-quality analogue
    performance, Xone:24 offers club-grade sound in an easy-to-use package.
  - Built for smaller spaces, home setups, or mobile rigs, Xone:24 delivers the
    same core tools found in flagship Xone mixers — including the Xone filter
    and mini innoFADER — in a compact and accessible format.
  - The Sound of Analogue — at the heart of the Xone:24 is a meticulously
    engineered all-analogue signal path, designed to deliver the clarity, warmth
    and punch that define the Xone sound.
  - A pair of high-gain, low-noise RIAA preamps ensures faithful reproduction of
    vinyl sources, while the matched Phono/Line inputs allow seamless switching
    between decks and digital players without compromising gain structure.
  - The 3-band isolator EQ offers precise, creative control for sculpting your
    mix, from swapping bass lines to expressive transitions.
  - Underpinning it all is carefully tuned, pure analogue summing that delivers
    deep, powerful low end and open, detailed highs.
  - Legendary Xone Filter — incorporating a filter design inspired by Allen &
    Heath's flagship Xone mixers, the Xone:24 includes an iconic Xone:VCF for
    creative and precise sound shaping, offering low-pass and high-pass modes,
    frequency sweep, and the renowned mild-to-wild resonance control.
  - Built to Perform — Xone:24 features the Mini innoFADER crossfader, trusted
    by DJs worldwide for its smooth response and durability. Backlit switches,
    responsive metering, and comprehensive I/O round out a mixer built to
    deliver reliable performances.
  - Flexible Effects Integration — the Xone:24 introduces a Master Insert FX
    loop, offering easy integration with external effects via rear-panel
    send/return connections, making it simple to integrate the most popular
    effects hardware into your mixes. For venues, the Master Insert can be
    connected to dynamic processors, offering control over the main output for
    environmental or system management needs.
  - "Features: low-noise, high-gain RIAA preamp; 3-band isolator EQ; warm pure
    analogue summing; matched Phono/Line inputs; classic Xone:VCF (Voltage
    Controlled Filter); mini innoFADER crossfader; Master insert / FX with
    switch; tactile illuminated switches with backlight; latching/non-latching
    Cue modes; RGB chromatic channel meters."
