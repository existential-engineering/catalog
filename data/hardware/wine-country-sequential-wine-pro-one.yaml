description: >-
  The Wine Country Sequential Pro One is a software synthesizer that faithfully
  recreates the sound of the classic 1981 Sequential Circuits Pro One monosynth.
  Designed as a digital preservation of the original's analog character, it runs
  exclusively on Creamware's Pulsar/Luna DSP cards and adds modern features like
  polyphony, program memory, and full MIDI control.
details: |-
  Wine Country Sequential, a company specializing in preserving and servicing vintage Sequential Circuits equipment, collaborated with John Bowen (formerly of Sequential's Prophet Team) to create this digital emulation. The Pro One was developed specifically for Creamware's Pulsar/Luna DSP hardware, leveraging the card's processing power to achieve accurate analog modeling.

  The software meticulously recreates the Pro One's interface, with every knob and switch faithfully reproduced, eliminating the maintenance issues plaguing vintage analog gear like sticky switches and degraded potentiometers. The implementation preserves the distinctive sonic character of the original monosynth while introducing enhancements impossible on the 1981 hardware.

  Notable additions include unlimited polyphony (CPU-dependent), program memory, an enhanced arpeggiator and sequencer, and comprehensive MIDI control. At $99 for existing Creamware card owners or $452 bundled with a Luna DSP card, the Pro One offered serious sonic preservation with practical modern workflow improvements, though its hardware dependency limited adoption compared to universal plugin formats.
specs: |-
  - VCO A with saw and pulse waveforms
  - VCO B with saw, triangle, and pulse waveforms
  - Noise generator
  - Low-pass filter with cutoff, resonance, ADSR envelope, and keyboard tracking
  - LFO with saw, triangle, and pulse waveforms
  - VCA with ADSR envelope
  - Unlimited polyphony (CPU-dependent)
  - Arpeggiator with UP and UP/DOWN patterns
  - Sequencer with 2 pitch-only patterns
  - Unlimited program storage
  - Full MIDI implementation
  - Requires Creamware Pulsar/Luna I/O cards
