details: |-
  Offering impressive sound coupled with exciting built-in lighting effects, the N-Wave 580L is a compact self-powered 2-way monitor speaker system that is ideal for almost any situation. Designed as compact powered near-field monitors for home DJ setups, the N-Wave 580L delivers detailed, powerful sound through a 1" silk dome tweeter and 5 ¼" woofer.

  The woofer and tweeter feature brilliant multi-color LED illumination with 3-Stage Color Command (Pulsate, Slow Cycle, Off), adding visual flair to any setup. A convenient front panel volume control puts level adjustment within easy reach.

  High-output 2-channel amplification provides 40 watts total system dynamic power, with a single amplification system mounted in the Right speaker only. Smooth, radial-edge front baffles minimize audible edge diffraction, magnetically shielded drivers prevent interference with nearby equipment, and a concave oval high-frequency waveguide ensures a wide listening area. An electronic bass-boost circuit enhances low-end response.
