details: |-
  Mike Kroeger is best-known for his work with the multi-platinum and arena-filling rock band Nickelback. Mike has relied on Spector to provide the foundation for his sound throughout his career in one of the world's biggest acts. The MK-5 Pro is Mike's stripped down approach to the coveted Spector NS design. His model features a fully carved solid maple body for a bright, responsive, and cutting sound. The 3-piece neck runs the entire length of the instrument and is paired with a 24 fret pau ferro fingerboard. When it comes to electronics, Mike prefers a completely passive EMG set-up to allow the true tone of his bass to shine through. The MK-5 Pro also features pro-quality die-cast hardware that will stand up to years of use on the road. The finishing touches include solid black matte finish and custom 3 rd & 12 th fret inlays for a unique, understated look that lets your playing do the talking.
