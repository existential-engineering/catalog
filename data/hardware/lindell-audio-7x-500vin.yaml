description: The 7X-500VIN "Vintage Edition" compressor packages the sound of
  one of the most popular compressors of all time into a convenient and
  remarkably affordable 500 Series rack module. This late '60s-style FET
  compressor/limiter may be small, but it still manages to pack all of the
  useful functionality you could ask for inside.
details: |-
  The 7X-500VIN "Vintage Edition" compressor packages the sound of one of the most popular compressors of all time into a 500 Series rack module. There is a highpass sidechain filter in the 7X-500VIN, which lets you focus its response, and a mix knob lets you blend its wet and dry signals to taste.

  Instead of burdening you with knobs, you set the 7X-500VIN's attack, release, and ratio with simple yet effective 3-way switches. Whether you're trying to punch up a bass track or mellow out some vocals, the 7X-500VIN is the right tool for the job.

  The mix control allows you to beef up your compression and then blend in the dry signal to bring back some of the original dynamics, so you can set the 7X-500VIN to its 100:1 "all-in" mode and still recover the transients you need.

  The onboard highpass sidechain filter has three settings to choose from (off, 100Hz and 300Hz), making it easy to block out lows and reclaim dynamics control without needing to patch an external signal into the unit.
specs: |-
  - A powerful, affordable, and musical 500 Series format compressor
  - FET-based technology sounds eerily reminiscent of classic compressors from the late '60s
  - Variable mix control lets you blend compressed and uncompressed signal in parallel for maximum compression without losing transients
  - 3-step switched attack and release times make dialing in the perfect dynamics easy
  - 3-mode (off, 100Hz, and 300Hz) highpass sidechain filter lets you focus your dynamics
  - Choose from mild 4:1, heavy 12:1, and "all-in" 100:1 compression ratios
  - True-bypass hardware preserves your sound when bypassed
  - 20-LED gain-reduction metering lets you keep an eye on the mix
  - 2x Vintage OPA1731
