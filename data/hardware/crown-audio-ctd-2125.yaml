url: https://www.crownaudio.com/en-US/products/ctd-2125
description: Two-channel, 125W/ch. power sharing amplifier with built-in DSP and
  Dante networking. Compact 1RU half-rack installation amplifier featuring
  asymmetrical power sharing, WebUI configuration, and Lo-Z/Hi-Z switchable
  outputs.
specs: |-
  - 2 channels
  - All channels driven Low-Z: 125W per channel
  - All channels driven Hi-Z: 125W per channel
  - Single channel driven (power sharing) Low-Z: 250W
  - Single channel driven (power sharing) Hi-Z: 250W
  - Dante inputs and outputs
  - Built-in DSP for room and speaker tuning
  - Asymmetrical power sharing
  - Web UI configuration
  - Lo-Z/Hi-Z switchable outputs
  - 1RU, 1/2 rack width form factor
  - Factory JBL SpeakerTunings included
  - Pilot tone and load monitoring
  - Source priority switching
  - GPIO interface
  - HControl protocol support
