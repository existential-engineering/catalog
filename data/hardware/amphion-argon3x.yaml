details: |-
  The Argon3X is a benchmark bookshelf loudspeaker from Amphion, designed to bring studio-quality monitoring performance to both professional and home listening environments.

  At the heart of the Argon3X is a new 1-inch titanium tweeter driver sourced from Amphion's flagship Krypton3X speaker, paired with a revised crossover network that ensures improved driver integration and tonal balance.

  The 6½-inch aluminum woofer delivers deep, controlled bass with a seamless transition into the midrange, crossing over at 1600 Hz. The passive radiator design contributes to the speaker's low-end extension, reaching down to 38 Hz at -6 dB.

  Amphion's 5th generation waveguide enables a low crossover point, seamless driver integration, and room-independent performance — making placement easier without sacrificing imaging precision.

  The Argon3X is available in four finishes — Black, Walnut, Standard White, and Full White — and won the HiFi+ 2021 Award. Handmade in Finland.
specs: |-
  - Operating Principle: Two-way, passive radiator
  - Tweeter: 1" titanium
  - Woofer: 6½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 8 Ω
  - Sensitivity: 87 dB
  - Frequency Response: 38–55,000 Hz (-6dB)
  - Power Recommendation: 50–250 W
  - Dimensions (H×W×D): 380×190×305 mm
  - Weight: 10 kg (22 lbs)
  - Manufacturing: Handmade in Finland
