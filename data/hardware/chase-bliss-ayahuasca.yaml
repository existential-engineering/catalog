description: Ayahuasca is a fuzz pedal and a tremolo pedal — the fuzz can be
  used independently or together with the tremolo. Described by Chase Bliss as
  their trippiest pedal, it can also produce ring-mod-like oscillation at high
  Rate speeds and vibe-like sounds when the tremolo is set to Harmonic mode.
details: |-
  Ayahuasca is a fuzz pedal and a tremolo pedal in one. The fuzz can be used independently or together with the tremolo, and cutting down the Input knob can partially clean up the sound to use the tremolo semi-independently, though it remains lo-fi and dirty by design. At high Rate speeds the pedal produces ring-mod-like oscillation, and setting the tremolo to Harmonic mode yields vibe-like sounds. It was created by Joel Korte of Chase Bliss Audio for Abracadabra Audio, with a visual history written by collaborator Gabriel Tanaka.

  The tremolo grew out of a one-off modded Gravitas that Joel Korte built with a choppier square wave and very fast Rate speeds. Unlike Gravitas, Ayahuasca's circuit uses two NOS vactrols in tandem for an ultra-choppy analog tremolo sound when the waveform is set to Square — the goal was to make the trem as choppy as possible while retaining a 100% analog signal path, a hallmark of Chase Bliss Audio designs.

  The fuzz circuit traces its lineage to Cláudio César Dias Baptista's Regulus VIII (the "Mutantes Fuzz" built for Os Mutantes), which the late Chris Bradford of El Músico Loco reinterpreted as the Wee Beaver Fuzz with a heavily modified Big Muff Pi-style tone stack. Joel Korte then reinterpreted that circuit for Ayahuasca, adding an input gain knob for a wider range of fuzz saturation and further modifying the tone control, labeled "Color" in reference to the wide palette of textures available from the single knob.

  Ayahuasca was released in limited, individually numbered batches of ten, each with unique artwork: hand-painted batches by Hannah M. Haugberg (Jungle, Shipibo, Cielo, Vision Quest), Andy Dolan (Ceremony), and Fiona Carlone (AYA), plus acid-etched batches by Dropping Acid Pedal Etching, including three Spirit Molecule designs by Carl Sandusky, covering serials #1-100. A final batch, "The Clearing" (serials #101-200), featuring all-new UV-printed art by Carl Sandusky, marked the limited 2020 return of the pedal and was billed as the last batch of Ayahuasca ever.
specs: |-
  - Analog fuzz and tremolo circuits, usable independently or together
  - Tremolo uses two NOS vactrols in tandem for an ultra-choppy square-wave sound
  - 100% analog signal path
  - Square and Harmonic tremolo waveform modes
  - Ring-mod-like oscillation at high Rate speeds
  - Input knob adjusts fuzz input gain for a wide range of saturation
  - Color knob: heavily modified Big Muff Pi-style tone stack
  - Dip switches (abbreviated labels on hand-painted versions, full-text labels on etched versions)
  - Released in limited numbered batches of 10 with hand-painted, acid-etched, or UV-printed artwork
