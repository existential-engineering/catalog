description: An 8-point passive patchbay in a compact pedalboard-friendly form
  factor, allowing you to rearrange your signal chain on the fly and patch in
  1/8" CV and modular sources.
details: |-
  PB & J provides 8 fully normalled 1/8" patch points in two rows of 4, arranged
  top and bottom. Passive and true bypass with no power required. Useful for
  rearranging pedal order on the fly, introducing CV modulators, and making
  creative routing mistakes.

  Requires eurorack-style mini patch cables (sold separately). Enclosure dimensions
  match the Either/Or form factor.
specs: |-
  - 8 x 1/8" (3.5mm) patch points
  - Passive, no power required
  - True bypass
  - Enclosure dimensions: 2.7" x 4.4"
  - Made in Hull, Québec
