details: |-
  The SB-246 is the hip-hop oriented model in Zoom's Street Boxx line, a drum machine whose sound set and pattern library are built around hip-hop, R&B and related styles. The preset drum kits are filed under the headings HIPHOP CULTURE, OLD SCHOOL, DIRTY SOUTH, EAST COAST, WEST COAST, ETHNIC, FUTURE and KANGISH.

  Sound memory holds 128 drum kits, numbered 0 to 127, of which 0 to 79 are presets in those eight categories and 80 to 127 are user slots. Alongside them sit 24 bass programs, from plain sine and sub tones through acoustic, slap, octave, sawtooth and square bass to pad, string and sitar voices, each mapped to a list of program change numbers. The instrument list is organised in eight banks: KICK, SNARE, CLAPZ, CYMBALS, BEATBOX, HITZ, XTRAS and PERCUSSION, with vocal beatbox sounds and turntable, scratch and sound-effect hits sitting beside conventional drum samples.

  The pattern library runs to more than two hundred entries, each listed with the drum kit, bass program and recommended tempo it was written for, at tempos from 62 to 128 BPM. It is split into three sets: a general pattern bank, a run of patterns written for song use as intro, verse, fill, break and ending sections, and a further set written for groove play, so patterns can be chained into songs or triggered live.
specs: |-
  - 128 drum kits: presets 0 to 79 in the categories HIPHOP CULTURE, OLD SCHOOL, DIRTY SOUTH, EAST COAST, WEST COAST, ETHNIC, FUTURE and KANGISH, plus user kits 80 to 127
  - 24 bass programs (0 to 23), each with its own program change number assignments
  - Instrument list in eight banks: KICK, SNARE, CLAPZ, CYMBALS, BEATBOX, HITZ, XTRAS and PERCUSSION
  - Over 200 patterns listed with the drum kit, bass program and recommended BPM each was written for, from 62 to 128 BPM
  - Pattern library split into general patterns, patterns written for song sections (intro, verse, fill, break, ending) and patterns written for groove play
  - Sounds addressable over MIDI program change (the sound lists give PC numbers per kit and bass program)
