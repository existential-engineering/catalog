description: 2U rack-mount Class A/B studio reference power amplifier with 200W
  per channel into 8Ω, toroidal transformer linear power supply, convection
  cooling (fanless), Speakon and binding post outputs, and
  Stereo/Parallel/Bridged Mono operation modes.
details: |-
  The Avantone Pro CLA-200 Studio Reference Amplifier is a classically designed
  Class A/B amplifier built in the traditional studio style, with generous watt
  meters, high quality Japanese components, and a toroidal transformer linear
  power supply. In a 2U rack mount chassis, it delivers over 200 watts per
  channel into an 8 ohm load.

  The CLA-200 is convection cooled with no fan, so it can be used in the same
  room as the monitors. It was designed to be paired with large format studio
  monitors, but is suitable for any demanding speaker load. Very low distortion,
  steady performance under harsh conditions, and an open and transparent sound
  make this an obvious choice for discerning studios.

  Supports Stereo, Parallel, and Bridged Mono (500W into 8Ω) operation modes.
  The rear panel features balanced XLR/TRS combo inputs with link outputs,
  Speakon and binding post speaker outputs, a ground lift switch, and an
  IEC320 mains inlet with 115V/230V voltage selector.
specs: |-
  - Amplifier Class: Class A/B
  - Output Power (8Ω Stereo, 1kHz): 200W
  - Output Power (4Ω Stereo, 1kHz): 300W
  - Output Power (8Ω Bridged, 1kHz): 500W
  - Frequency Response: 20Hz–20kHz ±0.5dB
  - Total Harmonic Distortion (1kHz): <0.1%
  - Signal-to-Noise Ratio (A-weighted): >103dB
  - Input Impedance (Balanced): 20kΩ
  - Input Impedance (Unbalanced): 10kΩ
  - Input Sensitivity (1kHz): 0.775V (0 dBU)
  - Damping Factor (100Hz, 8Ω): 250
  - Crosstalk: -70dB
  - Cooling: Convection (fanless)
  - Power Supply: Toroidal transformer linear
  - AC Mains: 115V/230V selectable
  - Rack Height: 2U
  - Dimensions: 270mm W × 89mm H × 385mm D
  - Weight: 20 kg (44 lbs)
