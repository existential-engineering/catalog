url: https://bastl-instruments.com/eurorack/modules/citadel-fx-wizard
description: "A 16HP stereo multi-effects Eurorack module with MIDI, reimagining
  the Kastle 2 FX Wizard desktop device. Nine stereo effect modes across three
  families: Delay FX (stereo delay up to 1.15s, flanger, freezer), Amplitude FX
  (autopanner, crusher, slicer), and Pitch-Shifting FX (pitcher, replayer,
  shifter). Extensive CV modulation matrix, TRS MIDI input, USB-C for USB MIDI
  and firmware updates. Reversible panel (FX Wizard / Wave Bard). Open-source."
details: |-
  The Citadel FX Wizard is a 16HP stereo multi-effects module designed for deep sound exploration and live performance. It processes stereo audio at 44kHz/16-bit and offers nine distinct effect modes across three families: Delay FX (stereo delay up to 1.15s, flanger, freezer), Amplitude FX (autopanner, crusher, slicer), and Pitch-Shifting FX (pitcher, replayer, shifter).

  The module features a reversible panel — one side operates as the FX Wizard, the other as the Wave Bard — making it a dual-purpose module. This design originates from the Kastle 2 desktop device, reimagined in Eurorack format.

  Extensive CV modulation matrix with LFO mod, FX mode selection, feedback, amount, trigger, note, and clock inputs. CV outputs include an envelope follower, LFO waveforms (triangle and pulse), clock, and general CV. MIDI via TRS input and USB-C (USB MIDI in/out and firmware updates). The FX Wizard Chamber web app allows customization of rhythm patterns. Headphone output: 2Vpp, 250Ω capable. Open-source firmware on GitHub.
