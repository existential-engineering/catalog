url: https://baggs.co/products/voiceprint-di
description: Since the beginning of acoustic amplification, musicians have been
  forced to sacrifice the complex sound of their prized guitars to play at
  louder volumes. You could use a mic to capture detail and suffer feedback, or
  use a pickup for higher volumes at the expense of your guitar’s true voice.
details: |-
  Since the beginning of acoustic amplification, musicians have been forced to sacrifice the complex sound of their prized guitars to play at louder volumes. You could use a mic to capture detail and suffer feedback, or use a pickup for higher volumes at the expense of your guitar’s true voice. To bridge this gap, we spent nearly three years in intensive research collaborating with acoustic scientists and digital signal processing experts, including Dr. Jonathan Abel, co-founder of Universal Audio. This breakthrough is our patented Voiceprint technology. Our proprietary Impulse Response technology leverages the processing power of your smartphone, measuring the acoustic response of your guitar in your hands to create a custom digital Voiceprint representing the true voice of your instrument. Your Voiceprint can then be saved into a preset that you can further modify with EQ, anti-feedback, and level controls for a full toolkit of live performance features.
specs: |-
  - Patented Voiceprint impulse-response (convolution) technology
  - 96kHz processing
  - Up to 99 instrument presets
  - Master Volume level control
  - Voice control blends the custom Voiceprint with the pickup signal
  - Anti-FB applies an anti-feedback profile
  - Pad attenuates input by 0dB, -3dB, -6dB, or -9dB
  - Series FX loop with separate send/return jacks
  - Ground lift switch, mute/bypass footswitches
  - 9V DC (500mA power supply included)
  - Requires the AcousticLive companion app for preset creation
