url: https://zoomcorp.com/en/us/digital-mixer-multi-track-recorders/multi-track-recorders/mrs-1266/
description: "The MRS-1266 provides all the functionality you need for
  professional music production: hard disk recorder, drum/bass machine, digital
  mixer, effects, CD-R/RW drive and more."
details: |-
  The recorder section provides eight mono tracks and a stereo track, for a total of ten tracks. In addition, a master track (stereo) for mixdown is also provided. Because each track has ten virtual tracks (V-takes), you can record multiple takes for important parts such as vocals or guitar solos and select the best take later. A full range of editing functions is also provided, allowing you to copy or move audio data, and special functions include reversing of data and time stretch/compression.

  10 different types of inputs on the rear panel and front panel feed a total of six channels. Synthesizers, dynamic microphones, condenser microphones, guitar/bass and many other kinds of instruments are supported, including high-impedance sources. In normal operation, two inputs are selected for recording on the audio tracks, and a special 6TR REC mode allows simultaneous recording on six channels. The output array includes analog and digital (optical) stereo out connectors, a phones output, and a stereo sub-out that can carry the signal from a specified input, track or drum/bass channel.

  The rhythm section provides more than 400 types of accompaniment patterns from the internal drum and bass sound generator. You can also create original patterns with real-time or step input, which can be used as an independent guide rhythm or in synchronization with the recorder. Chords or pattern playback order can be programmed to create the rhythm accompaniment for an entire song, and alongside conventional step input the MRS-1266 features a concept called FAST developed by ZOOM which lets you quickly build songs with various repeated patterns.

  The internal digital mixer can handle 10 tracks plus the drum and bass channels. The level, panning and EQ settings of each channel can be saved as separate scenes. A saved scene can be recalled manually at any time, or can be switched automatically at a desired point in a song.

  The MRS-1266 provides an insert effect that can be inserted into a specified signal route, and send/return effects that are used via the mixer send/return loop. The effects can be used in a variety of ways, from modifying the tone while recording a track, to spatial processing or mastering during mixdown. Once a mixdown has been created on the master track, it can be burned onto a CD-R or CD-RW disc using the built-in drive.
specs: |-
  - Recorder: 12 physical tracks, 120 virtual tracks (10 V-takes per track), 1 stereo drum track and 1 mono bass track
  - 6 tracks can be recorded simultaneously in 6TR REC mode
  - Recording data format: 16-bit linear, non-compressed
  - Maximum recording time: approximately 3 hours per gigabyte, referred to mono tracks
  - Track edit functions: copy, move, paste, erase, exchange, trim, fade-in/out, reverse, time stretch/compression
  - Other recorder functions: bounce, scrub/preview, A-B repeat, capture/swap, phrase loop, manual and auto punch-in/out, 100 mark points per project
  - Mixer: 13 simultaneous playback tracks (10 audio plus stereo drum and mono bass), 12 faders, per-channel EQ (HIGH 500 Hz to 18 kHz and LOW 40 Hz to 1.6 kHz, gain +/-12 dB), chorus/delay and reverb sends, 100 scenes per project
  - Effects: 5 algorithms (dual, guitar/bass, mic, line, mastering) using VAMS (Variable Architecture Modeling System), 280 patches, 4 insert modules (compressor, preamp/drive, equalizer, modulation/delay), 2 send/return modules (chorus/delay, reverb) with 40 patches
  - Chromatic auto tuner, calibration 435 to 445 Hz in 1 Hz steps
  - Rhythm section: 30 voices, 16-bit linear PCM, 127 drum kits, 36 drum sounds per kit, 26 bass sounds, 12 velocity-sensing pads, 48 PPQN, over 400 preset patterns, tempo 40.0 to 250.0
  - Hard disk: 3.5 inch E-IDE type, maximum 1000 projects
  - A/D converter: 24-bit, 64 times oversampling. D/A converter: 24-bit, 8 times oversampling
  - Sampling frequency: 44.1 kHz, 24-bit signal processing
  - Frequency response: 20 Hz to 20 kHz +/-1 dB into a 10-kilohm load, S/N ratio 93 dB (IHF-A), dynamic range 97 dB (IHF-A), THD+N 0.02% at 400 Hz
  - Display: 96 x 63 mm custom LCD with backlight
  - Guitar/bass (Hi-Z) inputs: 2 standard mono phone jacks, input impedance 500 kilohms
  - Unbalanced inputs: 6 standard mono phone jacks, input impedance 50 kilohms or more
  - Balanced inputs: 2 XLR-3-31 type, input impedance 1 kilohm balanced, pin 2 hot, with switchable 48 V phantom power
  - Input level: -50 dBm to +4 dBm, continuously variable
  - Master output: RCA type phono jacks (L/R), output impedance 1 kilohm, rated output level -10 dBm
  - Headphone output and sub output: standard stereo phone jacks, 50 mW into a 32-ohm load
  - Digital output: S/PDIF optical, 20-bit
  - MIDI connectors: IN and OUT
  - Control inputs: FP02 connector and FS01 connector
  - One optional board slot (UIB-01 USB interface board)
  - Built-in CD-R/RW drive for burning audio CDs and data backup. The version without the internal drive accepts the optional CD-01 drive
  - Dimensions: 480 (W) x 310 (D) x 115 (H) mm
  - Weight: 6.8 kg with drive, 5.8 kg without drive
  - Power supply: 12 V DC 2.5 A from the supplied AD-0010 universal AC adapter, 30 W typical consumption
  - Optional accessories: FS01 foot switch, FP02 expression pedal, UIB-01 USB interface board
