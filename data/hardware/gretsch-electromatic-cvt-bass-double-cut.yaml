details: |-
  Crafted with essential Gretsch style and playability, the Electromatic CVT Bass is designed to take your sound to the next level. The instrument represents a retro-refined take on a classic Gretsch design, featuring a solid mahogany body with beveled contours and a 32" scale length.

  The neck is a bolt-on mahogany construction with a comfortable Performance "C" shape, complemented by Low Down Alnico Bass single-coil and humbucking pickups that deliver gut-punching low-end power with excellent balance and clarity.

  The mahogany body's beveled contours not only add to the distinctive look but also provide a sleek and comfortable playing experience. The dual-pickup configuration combines a Low Down Alnico Humbucker in the neck position and a Low Down Alnico Single-Coil pickup in the bridge position, capable of producing everything from thick and thunderous, to clear and punchy with ease.
