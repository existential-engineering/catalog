description: A classic analog 8-voice polyphonic synthesizer module with 2 VCOs
  per voice, one VCF, an arpeggiator and a 2-track sequencer. Based on the
  Prophet 600, it pairs a fully analog signal path with modern conveniences such
  as MIDI control and 400 onboard program memories, in a standard Eurorack
  format.
details: |-
  The Behringer PRO-800 is a classic analog 8-voice polyphonic synthesizer with 2 VCOs, 1 VCF, an arpeggiator and sequencer. Based on the classic Prophet 600, this synth captures the vintage sounds of the original coupled with some modern features like MIDI and onboard memory for storing up to 400 patches to truly make the PRO-800 a great choice for the modern musician.

  In keeping with the classic feel, the PRO-800 sports a pure analog signal based on authentic VCO, VCF and VCA designs that have made original synths like the Prophet 600 so sought after by many electronic musicians and enthusiasts. Each of the 8 voices also contains 2 VCOs for some massive, detuned sounds.

  Unison mode on the PRO-800 also allows you to create some nice fat 16 oscillator lead and bass sounds. Combine that with the ability to use up to 6 separately tweakable oscillator shapes (OSC A and B: saw, triangle and pulse) simultaneously and you can create some ultra-sizzly solos or ginormous bass tones. The "POLY MOD" function even allows OSC B to modulate OSC A.

  Up to 400 patches can be stored on the PRO-800. Simply enter the program number with the keypad and the patch is ready for action.

  The PRO-800 is designed to fit into a standard Eurorack case. Just connect the power cables to the power supply and mount the module using the included screws. This allows for the PRO-800 to be mixed with other synth modules for a truly unique set up.
specs: |-
  - Polyphony: 8 voices
  - Signal path: fully analog, based on authentic VCO, VCF and VCA designs
  - Oscillators: 2 VCOs per voice
  - Unison mode: up to 16 oscillators
  - Oscillator waveforms: up to 6 simultaneous shapes (OSC A saw, triangle, pulse; OSC B saw, triangle, pulse)
  - Pulse width: manual pulse width control plus PWM from the global LFO
  - Filter: classic 4-pole design with self-resonance capability
  - Modulation: POLY MOD routes OSC B and the filter envelope to OSC A frequency and filter cutoff
  - LFO: 1 dedicated LFO with 6 waveform shapes, to pulse width, OSC A and OSC B pitch and filter cutoff
  - Envelopes: 2 ADSR generators (VCF and VCA)
  - Arpeggiator: up/down and key-assign modes
  - Sequencer: polyphonic 2-track
  - Program memory: 400 user programs
  - Noise generator: additional generator as found in the ultra-rare Japanese MMI 6E3.1 version
  - Glide: polyphonic, from subtle portamento to extreme settings
  - Chord memory: transposes a stored chord across the keyboard
  - MIDI: comprehensive implementation including NRPN/CC control of all parameters and bulk load/save
  - Format: Eurorack module, bus-powered from the case power supply via the supplied power cables; mounting screws included
