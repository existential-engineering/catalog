description: Galaxy 64 Synergy Core is a high-end recording system that connects
  your entire studio within a 2U rack space while providing high-fidelity audio
  and onboard effects processing for your most demanding projects.
details: |-
  Galaxy 64 Synergy Core is a 64-channel Dante, HDX, and Thunderbolt 3 audio interface with onboard DSP, housed in a 2U rack chassis. Designed as a hub for high-end studios, live events, broadcast, and enterprise rooms, it consolidates 64 analog inputs and 64 analog outputs over eight DB25 (TASCAM standard) connectors with AC/DC coupling, plus a dedicated stereo monitor pair and headphone output, into a single device.

  Four HDX ports interface to two HDX cards simultaneously for a primary/secondary recording setup or a full 128-channel array. Two Thunderbolt 3 ports support PC/Mac connection, with the left port doubling as USB-C remote-control connection to a secondary computer. Dual Dante ports (primary and secondary) provide 64 channels of networked audio, and dual optical MADI on SC connectors allows daisy-chaining to additional interfaces when more channels are needed.

  Synchronization options include one word clock input and six outputs for distributing the internal clock to other digital gear, two loop-sync ports to eliminate sync repatching in HD/HDX setups, and a 10M atomic reference input for locking to an Antelope 10MX or third-party atomic clock. Antelope's 64-bit Acoustically Focused Clocking and Jitter Management technology underpins the entire signal path.

  Galaxy 64 Synergy Core ships with a library of 37 real-time effects running on its onboard FPGA/DSP, including software emulations of vintage analog gear (EQs, compressors, limiters, preamps and channel strips, plus reverb, de-esser, tremolo, autowah, and tuner). The library is expandable, and the unit is Atmos-ready with compatibility for 23+ immersive audio formats.
specs: |-
  - 64-channel audio interface with Dante, HDX, and Thunderbolt 3 connectivity
  - 2U rack chassis
  - 64-bit Acoustically Focused Clocking and Jitter Management
  - D/A dynamic range: 128 dB
  - A/D dynamic range: 121 dB
  - Monitor converter dynamic range: 130 dB
  - 37 real-time onboard effects included (expandable library)
  - Atmos-ready, compatible with 23+ immersive audio formats
  - 8x DB25 line inputs (64 channels at 24-bit, 192kHz) with AC/DC coupling switch (TASCAM standard)
  - 8x DB25 line outputs (64 channels at 24-bit, 192kHz)
  - 1x Stereo headphone output on TRS jack (24-bit, 192kHz), 122dB headroom
  - 1x Stereo monitor output pair on 1/4-inch TRS (24-bit, 192kHz), 130dB headroom
  - 2x Dante ports (64 channels at 24-bit, 48kHz) — primary and secondary on RJ-45
  - 4x HDX ports (128 channels at 24-bit, 192kHz)
  - 2x Thunderbolt 3 ports (64 channels at 24-bit, 192kHz); left port supports USB-C remote control
  - 2x Optical MADI ports on SC connectors (64 channels at 24-bit, 48kHz)
  - 2x AES/EBU ports on XLR (2 channels at 24-bit, 192kHz)
  - 2x S/PDIF ports on RCA (input and output, 2 channels at 24-bit, 192kHz)
  - 1x Word clock input
  - 6x Word clock outputs
  - 2x Loop sync (input and output)
  - 1x 10M atomic reference input
