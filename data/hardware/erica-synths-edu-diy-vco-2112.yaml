description: Build a real VCO from scratch!
details: |-
  Ever wondered how synthesizers actually work? This kit is a chance to find out by building a real VCO from scratch.

  Using just a handful of components and a breadboard, the builder creates a fully functional analog oscillator, the core building block of any synth voice. Along the way it covers basic electronic concepts like voltage, current and resistance, and how they come together to create oscillation, control pitch and shape waveforms.

  No background in electronics is needed. The manual walks through the process step by step, from plugging in the first component to tuning the finished circuit. Every idea is explained in plain language, with clear diagrams and intuitive visuals.

  The finished build is a working analog VCO with saw and pulse outputs, 1V/oct tracking, temperature compensation, FM and PWM inputs, plus the option to turn it into a proper Eurorack module using the included PCB and panel. The box holds all components for the breadboard build, the eurorack panel and PCB for final assembly, a power cable and a 40 or more page illustrated manual as a PDF download. A breadboard, jumper wires and a dual power supply (or two 9V batteries with clip connectors) are needed alongside it.

  This is the first kit in the mki x es.EDU series, a collaboration between Erica Synths and Moritz Klein to make analog synth design accessible to everyone.
specs: |-
  - Saw and pulse outputs
  - 1V/oct tracking
  - Temperature compensation
  - FM and PWM inputs
  - Eurorack panel and PCB included for final assembly
  - Power cable included
  - 40+ page illustrated manual as a PDF download
  - Requires a breadboard, jumper wires and a dual power supply or two 9V batteries
