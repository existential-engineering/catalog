details: |-
  The Friedman JEL 1x12 is a closed-back cabinet which uses tongue and groove Baltic Birch construction to deliver the bass, mid response and sound expected of a Friedman cab. The JEL 112 Cab features red tolex, white piping and black grille cloth, so it cosmetically matches the Friedman Signature Jake E Lee 20 head.

  At the heart of the cab is a Celestion G12M-65 Creamback 16 ohm speaker, perhaps the definitive vintage Celestion ceramic magnet guitar speaker. Developed in the mid-sixties, the Creamback was quickly adopted by players like Hendrix, Beck and Page, who typified the louder and more aggressive blues-rock playing styles that came to characterize that era.

  The higher power handling of the G12M-65 used in the JEL 1x12 produces that familiar woody tone, making the cab ideally suited when both vintage and modern tones are wanted. The increased power handling brings low-end grunt with it, complementing the warm and vocal mid-range, crunchy upper mids and sweet, refined highs.

  As with all Friedman cabinets, oversized 12-gauge speaker wire is soldered between the speaker and terminal, so every ounce of valuable tone is captured. This compact little monster excels in the studio and is also a complement for any stereo or wet/dry/wet rig. The Friedman JEL 112 is handcrafted in the U.S.A. and designed to withstand the rigors of the road.
