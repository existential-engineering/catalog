description: Adding 18S to your monitors will open up a new world of performance
  that lets you mix and master with painstaking accuracy.
details: |-
  The 18S is a professional active subwoofer designed to match seamlessly with Dynaudio studio monitors. Adding 18S to a two-way monitor pair opens up a new world of low-end performance, letting engineers mix and master with painstaking accuracy and ensuring tracks translate beautifully to any playback system.

  At the heart of the 18S is advanced DSP modelling technology that acoustically matches the subwoofer to any Dynaudio Pro studio monitor from BM Classic, LYD and upwards — effectively turning two-way systems into three-way set-ups. Custom performance maps for popular high-end Dynaudio studio speakers are stored onboard, and firmware updates add support for new monitor models over time.

  Users select their specific Dynaudio speakers via the front-panel display and menu system, and the 18S tailors its roll-off characteristics to match. The unit includes a 3-band parametric EQ, adjustable high-pass filter, 0/180-degree phase switching, distance-based time alignment, and master/slave daisy-chaining for multi-sub configurations.

  Driving the cabinet are two custom 9-inch MSP+ Hybrid Drive woofers — a brand-new driver design using aluminium construction with paper backing and an MSP dust-cap, specifically engineered for subwoofer requirements balancing stiffness, lightness and damping. A 500W Class D amplifier powers the sealed enclosure, delivering frequency response from 16 Hz to 230 Hz and a maximum SPL of 110 dB.
specs: |-
  - Amplifier power: 500W Class D
  - Woofers: 2x 9" MSP Hybrid Drive
  - Frequency range (85 dB ±3 dB): 16–230 Hz
  - Maximum SPL: 110 dB
  - Box principle: Sealed
  - Analog inputs: 2x balanced XLR, 2x unbalanced RCA
  - Analog outputs: 2x balanced XLR, 2x unbalanced RCA
  - Phase adjustment: 0/180 degrees
  - Crossover filters: Preset speaker options + adjustable
  - High-pass filter: Adjustable
  - EQ: 3-band parametric
  - Time alignment: Yes (distance-based auto-adjustment)
  - Master/Slave: Yes (daisy-chain capable)
  - Max power consumption: 490W
  - Standby power: 0.5W
  - AC power input: 100–120V / 200–240V, 50/60 Hz
  - Auto on/off: Yes
  - Dimensions (W x H x D): 447 x 300 x 268 mm (17 5/8" x 11 5/8" x 10 1/2")
  - Weight: 22.1 kg (48.7 lbs)
  - Packaging dimensions: 600 x 450 x 400 mm
