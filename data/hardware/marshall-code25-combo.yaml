description: The CODE25 is a 25-watt digital modelling combo amplifier with a
  single 10-inch custom speaker (4Ω, 25W). It combines Marshall's classic and
  modern amp voicings with 100 editable presets and 24 built-in digital effects
  (five usable simultaneously), all driven by Marshall's MST (Marshall-Softube
  Tube) preamp, power-amp, and speaker-cabinet modelling. Bluetooth lets players
  stream audio from a phone and control the amp from the Marshall Gateway app on
  iOS or Android. Front-panel controls cover gain, volume, bass, middle, treble,
  and preset/effect navigation, with deeper editing exposed through the app. A
  community Code Presets platform (codepresets.marshall.com) lets users share
  and download user-created tones.
