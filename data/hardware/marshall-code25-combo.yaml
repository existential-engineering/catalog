description: The CODE25 is a 25-watt digital modelling combo amplifier with a single 10-inch custom speaker (4Ω, 25W). It combines Marshall's classic and modern amp voicings with 100 editable presets and 24 built-in digital effects (five usable simultaneously), all driven by Marshall's MST (Marshall-Softube Tube) preamp, power-amp, and speaker-cabinet modelling. Bluetooth lets players stream audio from a phone and control the amp from the Marshall Gateway app on iOS or Android. Front-panel controls cover gain, volume, bass, middle, treble, and preset/effect navigation, with deeper editing exposed through the app. A community Code Presets platform (codepresets.marshall.com) lets users share and download user-created tones.
details: |-
  Pre-loaded with 100 presets, the CODE25 Combo has all you need to find your sound at home. Its 25W means that it's even powerful enough to start gigging with. Fully programmable with your phone and online, CODE25 Combo is the amp for on the go.

  More is more with CODE25. Featuring an extensive array of 24 effects and a versatile selection of 100 editable presets, the CODE25 opens a vast realm of sonic possibilities. This expansive palette allows you to experiment and fine-tune your sound with an unprecedented level of control and customisation. The only right sound, is your sound.

  Reach new sonic heights in just a few clicks. With the straightforward CODE Presets platform you can seamlessly upload and download from a global library of user presets. This innovative feature enables you to access a vast library of tones created by fellow musicians worldwide. With the ability to contribute and explore, this community amplifies the creative potential of your CODE25.

  Connect via Bluetooth to control the CODE25 and stream music from your iOS or Android device using the Gateway app. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Digital 25W combo, CODE range
  - 1 x 10 inch custom speaker (4 ohm, 25W), unit impedance 4 ohm
  - 100 built-in editable presets
  - 24 different built-in effects, 5 usable simultaneously
  - Controls: bass, middle, treble, gain, volume, pre-FX, amplifier models, modulation effects, delay effects, reverb, power amplifier models, speaker cabinet models
  - Additional controls available via the Marshall Gateway app for iOS and Android devices
  - Bluetooth control and audio streaming from the Gateway app
  - No extension cabinet outputs
  - No effects loop
  - Inputs: 1 x instrument jack, 1 x Aux In (3.5 mm jack)
  - Outputs: 1 x 3.5 mm jack headphone out
  - Dimensions: 350 mm (13.8 in) wide, 340 mm (13.4 in) high, 215 mm (8.5 in) deep
  - Weight: 6.1 kg / 13 lb
  - Detachable power cable included
