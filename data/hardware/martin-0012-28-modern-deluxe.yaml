details: |-
  The 0012-28 Modern Deluxe combines vintage warmth with modern refinement in a twelve-fret design. Built on Martin's iconic 00-12 Fret (Grand Concert) body shape, it pairs traditional small-body charm with carefully chosen modern materials for enhanced response, tone, and playability.

  The top is Sitka spruce treated with Martin's Vintage Tone System (VTS), supported by Golden Era-scalloped Adirondack spruce X-bracing with natural protein glue and a carbon-fiber bridge plate. East Indian rosewood back and sides deliver rich harmonic complexity, while European flamed-maple binding and a Style 28 multi-stripe rosette accent the instrument's deluxe appointments.

  The genuine mahogany neck features a Vintage Deluxe shape with a High-Performance Taper, joined to the body at the 12th fret via a traditional dovetail joint. The 24.9-inch scale length and 1 13/16-inch nut width make it comfortable for fingerstyle and chord-melody playing. EVO gold frets are Pleked for accuracy, and the ebony fingerboard is inlaid with abalone Diamonds and Squares in the long pattern.

  Deluxe touches include a slotted headstock with East Indian rosewood headplate, stylized script logo, Waverly gold side-mount tuners with butterbean knobs, Liquidmetal bridge pins with red acrylic dots, a compensated bone saddle, and a bone nut. The guitar ships pre-strung with Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light strings and includes a ply hardshell case with brass/nickel-plated hardware.
specs: |-
  - Body size: 00-12 Fret (Grand Concert)
  - Top: Sitka spruce with VTS, gloss finish
  - Bracing: X-Brace, GE-Scalloped, Adirondack spruce with VTS, 1/4" size
  - Back and sides: East Indian rosewood, gloss finish
  - Purfling: Zig-Zag Authentic
  - Neck: Genuine mahogany, Vintage Deluxe shape, High-Performance Taper, dark mahogany color
  - Neck joint: Dovetail at 12th fret
  - Scale length: 24.9"
  - Fingerboard: Ebony with Diamonds and Squares Long Pattern abalone inlay
  - Nut width: 1 13/16"
  - Fingerboard width at 12th fret: 2 1/4"
  - Total frets: 20 (EVO gold, Pleked)
  - Nut: Bone
  - Bridge: Ebony, Pyramid with drop-in saddle, 2 1/4" string spacing
  - Bridge pins: Liquidmetal with red acrylic dots
  - Saddle: Compensated bone, 16" radius
  - Tuners: Waverly gold side mount with butterbean knobs
  - Binding: European flamed maple
  - Rosette: Style 28 multi-stripe
  - Headstock: Slotted with square taper and diamond, East Indian rosewood headplate, stylized script inlay
  - Finish: Gloss
  - Special features: VTS top, carbon-fiber bridge plate, natural protein glue
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze - Light
  - Case: Ply hardshell with brass/nickel-plated hardware
