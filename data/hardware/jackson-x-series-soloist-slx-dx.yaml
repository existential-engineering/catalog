  - Scale Length: 25.5"
  - Fingerboard: Laurel, 12"-16" compound radius
  - Frets: 24 jumbo
  - Inlays: Pearloid sharkfin
  - Nut: Floyd Rose Special locking, 1.6875" width
  - Bridge: Floyd Rose Special double-locking tremolo (recessed)
