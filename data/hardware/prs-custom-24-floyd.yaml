details: |-
  The Custom 24 "Floyd"

  is equipped with the time-tested Floyd Rose "Original" tremolo system and PRS's \ m / (metal) pickups. The Floyd Rose "Original" tremolo and locking nut tuning system is a double-locking design precision-made from high quality steel. This design combination allows players to lock the string at the nut and at the bridge to keep the guitar in tune even during the heaviest dive-bombing sessions.

  The Custom 24 is the quintessential PRS guitar. This iconic instrument was the first model that Paul Reed Smith brought to the public at PRS Guitars’ first Winter NAMM show in 1985 and has been a top seller ever since.
