name: MT 48
manufacturer: neumann
primaryCategory: audio-interface
url: https://www.neumann.com/en-us/products/audiointerfaces/mt-48
description: Class-leading AD/DA converters with enormous dynamic range.
  Intuitive touchscreen user interface. DSP processing (EQ, dynamics, reverb). 4
  independent mixers with integrated talkback. USB, ADAT and AES67 connectivity.
details: |-
  The new benchmark

  The MT 48 is an audio interface without compromise. With its huge dynamic range, superior converters, preamps and headphone amplifiers, it sets new standards in sound quality. Internal DSP power allows for monitor mixes with sophisticated EQ and dynamics processing - all intuitively controlled via touchscreen.

  Highlights:
  - Class-leading AD-converter resolution with a dynamic range of 136 dB
  - 2 premium-quality mic/line preamps, 2 pristine line/instrument inputs
  - 4 line/monitor outputs
  - 2 ultra-low impedance headphone outputs with adjustable crossfeed
  - ADAT / S/PDIF optical I/O, MIDI/GPIO, RAVENNA/AES67, Dante Ready
  - Two driver outputs per input channel for pre-FX and/or post-FX recording
  - Intuitive touchscreen user interface
specs: |-
  - Mic Inputs 1-2 Dynamic Range: 136 dB-A
  - Mic Inputs 1-2 Equivalent Input Noise (150 Ohm): -128 dBu-A
  - Mic Inputs 1-2 Input Impedance: 10 kΩ
  - Mic Inputs 1-2 Gain Range: 12…+78 dB in 0.5 dB steps or 0.1 dB (fine)
  - Mic Inputs 1-2 Pad: 12 dB/24 dB
  - Mic Inputs 1-2 Max. Input Level: 0 /+12/+24 dBu (without Pad/with Pad)
  - Mic Inputs 1-2 THD+ N Preamp + ADC @ 1 kHz, 0 dBFS: < -110 dB (0.0003%)
  - Line Inputs 1-2 Dynamic Range: 138.5 dB-A
  - Line Inputs 1-2 Input Impedance: 10 kΩ
  - Line Inputs 1-2 Gain Range: 0…+66 dB
  - Line Inputs 1-2 Sensitivity: +24 dBu…-42 dBu
  - Line Inputs 1-2 Max. Input Level: +24 dBu
  - Line Inputs 1-2 THD+ N Preamp + ADC @ 1 kHz, 0 dBFS: < -105 dB (0.0006%)
  - Instrument/ Line Inputs 3-4 Dynamic Range: 135 dB-A
  - Instrument/ Line Inputs 3-4 Input Impedance: 2 MΩ (balanced) / 1 MΩ (unbalanced)
  - Instrument/ Line Inputs 3-4 Gain Range: 0…+66 dB
  - Instrument/ Line Inputs 3-4 Sensitivity: +18 dBu … -48 dBu
  - Instrument/ Line Inputs 3-4 Max. Input Level: +18 dBu
  - Instrument/ Line Inputs 3-4 THD+ N Preamp + ADC @ 1 kHz, 0 dBFS: < -112 dB (0.0003%)
  - Line/ Monitor Outputs Output Impedance: < 70 Ω
  - Line/ Monitor Outputs THD+ N @ 1 kHz, 0 dBFS: < -110 dB (0.0003%)
  - Line/ Monitor Outputs Dynamic Range: 123 dB-A
  - Line/ Monitor Outputs Max. Output Level: +24 dBu
  - Headphone Outputs Output Impedance: 0.035 Ω
  - Headphone Outputs Dynamic Range: 122 dB-A (high) / 117 dB (low)
  - Headphone Outputs Max. Output Level: +16 dBu (high) / +8 dBu (low)
  - A E S67/ Ravenna: Standard RJ-45 Gigabit Ethernet connection
  - Expansion Connectivity: ADAT/S/PDIF optical I/O, MIDI I/O via 1/4" jack (DIN5 adapter set available from Neumann: Cat. No. 700261)
  - Computer Interface: USB-C, 2.0 High Speed (480 MB/s) or higher
  - Power Consumption: <25 W
  - Product Dimensions: 200 x 128 x 40 mm
