description: >-
  The Farfisa Soundmaker is a rare Italian multi-section keyboard from 1979 combining a monophonic
  synthesizer with 12 presets, a polyphonic preset piano/brass section, and a string section, all
  controlled through a 61-key keyboard with polyphonic aftertouch.
details: |-
  Built between 1979 and 1981, the Soundmaker divided its functionality across three distinct
  sections. The monophonic synth section offered 12 preset instrument voices including tuba,
  trombone, trumpet, sax, clarinet, oboe, flute, piccolo, violin, accordion, electric bass, and
  electric guitar, plus a free patch mode for creating custom sounds using the filter, ADSR
  envelope, and LFO controls.

  The polyphonic preset section provided four piano-type sounds: piano, electric piano, honky tonk,
  and brass, each with volume and brightness controls. The string section offered two preset
  string voicings at 8-foot and 4-foot footage with volume, brightness, attack, and sustain
  controls.

  The 61-key keyboard could be split at middle F, with strings and polyphonic synth sections
  assigned to the left hand and the monophonic synth to the right. Polyphonic aftertouch could
  control mono synth brilliance, oscillator vibrato, synth glide, or brass brilliance. The string
  and polyphonic sections could also be switched to monophonic operation.

  Weighing 27 kg, the Soundmaker was a substantial instrument. While not considered the finest
  string machine of its era, its rarity and the combination of three sound sections in one
  keyboard give it notable vintage appeal.
specs: |-
  - Polyphony: Polyphonic and monophonic sections
  - Oscillators: 1
  - LFO: 1
  - Filter: 1 with ADSR envelope
  - VCA: 1 ADSR
  - Keyboard: 61 keys with polyphonic aftertouch
  - Memory: Preset sounds + 1 user preset
  - Control: None
  - Date produced: 1979-1981
