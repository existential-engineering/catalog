description: A limited-run version of the Dark Side workstation with an OC75
  germanium output stage on the fuzz, combining analog fuzz with a multi-head
  tape delay and four modulation effects.
details: |-
  This limited run of the Dark Side uses an OC75 germanium transistor as the output amplifier for the fuzz side and raises the available gain. Germanium output stages round the tone slightly, which Keeley uses here to finish an op-amp style big-fuzz circuit. The run was limited to 25 units, each hand signed and numbered.

  The Dark Side is built from three parts: fuzz, delay and modulation. The fuzz is a big-fuzz style distortion based on a 1977 op-amp design, revoiced to be more transparent than the Psi Fuzz it resembles and to retain the character of single-coil or humbucker pickups. The delay side offers 12 syncopated, rhythmic delay settings voiced after spinning-drum tape machines, with filtering for the feel of the originals and enough range for feedback oscillation and expression-pedal control over the number of repeats.

  The modulation side holds four effects: a flanger, a rotary speaker cabinet, a U-Vibe and a four-stage phaser. The flanger and rotary cabinet can be blended into each other, as can the opto-coupler based U-Vibe and the phaser. Keeley states these algorithms differ from the equivalents in the Monterey and Bubble Tron.

  At the centre of the pedal is a hand-built board carrying the analog fuzz alongside a 24-bit DSP engine, with the DSP section hand assembled and soldered. A TRS expression pedal input is provided and Keeley recommends using one. Current units carry a push-button switch to change the order of the fuzz and the delay or modulation sections; earlier units instead have a TRS insert at that point, which can be used to patch another pedal between the two halves.
