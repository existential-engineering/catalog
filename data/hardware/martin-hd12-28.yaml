description: A 12-string Standard Series Dreadnought with solid Sitka spruce top
  and East Indian rosewood back and sides, delivering bold projection, rich
  overtones, and the chime of an extra octave of strings.
details: |-
  The HD12-28 is designed for players seeking the lush, layered sounds that only a 12-string guitar can deliver. Its Dreadnought body produces a bold, projective tone with strong bass, clear trebles, and rich overtones, perfectly complemented by the chime and texture of the extra octave strings.

  Construction pairs a solid Sitka spruce top with solid East Indian rosewood back and sides, offering a resonant voice that's balanced for all playing styles, whether you're fingerpicking or strumming. The shorter 24.9" scale length and GE Modified Low Oval neck profile with High-Performance Taper deliver comfortable playability under the additional string tension.

  Appointments include antique white binding, bold herringbone inlay on the top, an ebony fingerboard adorned with abalone diamond and square inlays, an ebony GE Modern Belly-12 String bridge with drop-in saddle, and chrome enclosed gear tuners with butterbean knobs.

  For 2025, the Standard Series introduces Sitka spruce GE top bracing for vintage-inspired tone, alongside refinements to the neck profile, a thinner fingerboard, and a refined bridge and heel that enhance playability. The guitar ships in a molded hardshell case and is pre-strung with Authentic Acoustic Lifespan 2.0 Extra Light 12-string phosphor bronze strings.
specs: |-
  - Body size: D-14 Fret (Dreadnought)
  - Top: Solid Sitka spruce with Aging Toner finish
  - Back and sides: Solid East Indian rosewood
  - Neck: Select hardwood (dark mahogany)
  - Neck shape: GE Modified Low Oval with High-Performance Taper
  - Fingerboard: Ebony with abalone diamond and square inlays
  - Scale length: 24.9"
  - Nut width: 1 13/16"
  - Fingerboard width at 12th fret: 2 1/4"
  - Frets: 20 total, joins body at 14th fret
  - Bridge: Ebony, GE Modern Belly-12 String with drop-in saddle
  - Saddle: Compensated bone, 16" radius
  - Tuners: Chrome enclosed gear with butterbean knobs
  - Bracing: Sitka spruce GE top bracing
  - Binding: Antique white
  - Top inlay: Bold herringbone
  - Finish: Gloss top, back, and sides; satin neck
  - Strings: Authentic Acoustic Lifespan 2.0 Extra Light 12-string phosphor bronze
  - Electronics: None
  - Case: Molded hardshell included
