description: The M4 MicTrak is the first portable recorder equipped with 32-bit
  float recording and built-in timecode generator, giving filmmakers and
  musicians everything they need to capture outstanding audio.
details: |-
  The M4 MicTrak is the first portable recorder equipped with 32-bit float recording and a built-in timecode generator, giving filmmakers and musicians everything they need to capture outstanding audio. Recording in 32-bit float means audio can be captured in any situation without the need to set gain, so a take never comes back clipped or faint.

  Four tracks record simultaneously: the two built-in X/Y microphones plus two external XLR/TRS inputs. Filmmakers can use the two XLR inputs for dialogue while the X/Y mics capture ambience, and recordings sync to video in post thanks to the onboard timecode generator, which has professional grade 0.2 ppm accuracy. For music videos, audio from the on-board X/Y mics combines with two additional external microphones for studio-quality sound in any environment.

  All four tracks can be watched on the M4's full-colour LCD with a real-time waveform display. The recorder was engineered to be quiet in the hand: its X/Y mic design and glossy finish significantly reduce handling noise.

  The two XLR/TRS inputs carry the same professional grade, low-noise preamps found in the flagship F-Series recorders. The line output connects to a camera to record a backup or sync track, and recordings can be monitored on the headphone output or played back through the built-in speaker for quick reference.

  The onboard NORMALIZE function automatically raises or lowers the volume of a recording to the optimal level without compressing the audio, and PRERECORD captures the six seconds of audio before RECORD is pressed. The M4 runs on 4 AA batteries, accepts the RC2, RC4, RCH-5 or RCH-6 remote, and doubles as a 32-bit float, 4-in/2-out USB audio interface that can record to the microSD card at the same time.
specs: |-
  - Channels: 2 (built-in X/Y mic) + 2 (XLR/TRS inputs)
  - Built-in mic: unidirectional, sensitivity -42 dB, 1 kHz at 1 Pa. Input gain adjustment unnecessary (dual AD converter circuits)
  - Maximum sound pressure input: 135 dB SPL
  - EXT MIC input: 1/8-inch stereo mini jack, input impedance 2 kohm or more
  - XLR/TRS inputs: XLR (2: HOT)/TRS combo jacks, input impedance 3 kohm or more (mic and line), maximum input level mic +4 dBu / line +24 dBu
  - Phantom power: +24/+48 V, 10 mA maximum per channel
  - Equivalent input noise: -127 dBu or less (IHF-A)
  - LINE OUT: 1/8-inch stereo mini jack, maximum output level +1 dBu
  - Headphone out: 1/8-inch stereo mini jack, 20 mW + 20 mW into 32 ohm load
  - Built-in speaker: 500 mW/8 ohm mono
  - Recording media: microSDHC 4-32 GB, microSDXC 64 GB-1 TB
  - Recording formats: WAV 44.1/47.952/48/48.048/96/192 kHz, 32-bit float, mono or stereo, BWF and iXML
  - Maximum simultaneous recording tracks: 4 (2 built-in X/Y mic + 2 XLR/TRS inputs)
  - Timecode: 1/8-inch stereo mini jack (Tip: IN, Ring: OUT), modes Off, Int Free Run, Int Record Run, Int RTC Run, Ext
  - Timecode frame rates: 23.976ND, 24ND, 25ND, 29.97ND, 29.97D, 30ND, 30D
  - Timecode precision: plus or minus 0.2 ppm. Supported input levels 0.2-5.0 Vpp, input impedance 4.6 kohm. Output level 3.3 Vpp, output impedance 50 ohm or less
  - Power: 4 AA batteries, USB bus power, or ZOOM AD-17 AC adapter (DC 5 V/1 A)
  - Estimated continuous battery operation: about 18 hours (alkaline, 48 kHz/32-bit float, 2-channel recording to microSDHC)
  - Display: 1.54-inch full colour LCD, 240 x 240
  - Remote input: RC2/RC4/RCH-5/RCH-6
  - USB: USB Type-C connector. Mass storage USB 2.0 High Speed. Audio interface with rec USB 2.0 High Speed, 48 kHz, 24-bit/32-bit float, 4 in/2 out
  - Included: quick guide, windscreen
