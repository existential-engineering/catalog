description: The 01 12-Fret T is a vintage-inspired 0-size acoustic guitar from
  Collings' Traditional Series, designed to showcase the most desirable
  characteristics of coveted pre-war instruments. Its construction emphasizes
  warm, rounded highs and a present low midrange, with a quick attack and strong
  projection. The ultra-thin nitrocellulose lacquer finish and 12-fret neck
  joint preserve the vintage small-body acoustic tradition.
details: |-
  The 01 12-Fret T is part of the Traditional Series, featuring vintage-inspired construction with Honduran mahogany back and sides, tortoise body binding with custom wood purflings, custom wood rosette, and Gold MOP short dot fingerboard inlays. The ultra-thin nitrocellulose lacquer finish allows the wood to resonate more freely for added nuance and responsiveness.

  The Traditional neck profile and pre-war scalloped X-brace construction with abbreviated soundboard graft (tongue brace) contribute to a looser, more broken-in feel and tone with rounder highs and fuller low midrange compared to the standard series.
specs: |-
  - Top: Sitka spruce
  - Back & sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Neck profile: Traditional
  - Fingerboard: Ebony
  - Fingerboard inlays: Gold MOP short dots
  - Bridge: Ebony pyramid-style, 2 5/16" spacing
  - Nut: Bone, 1 3/4"
  - Scale length: 24 7/8"
  - Tuners: Nickel Waverly
  - Strings: D'Addario EJ-16 (.012"-.053")
  - Body width: 13 3/4"
  - Body length: 19"
  - Body depth: 4"
  - Total length: 37 7/8"
  - Body finish: High gloss ultra-thin nitrocellulose lacquer
  - Body binding: Tortoise with custom wood purflings
  - Rosette: Custom wood rosette
  - Bracing: Pre-war scalloped X-brace
