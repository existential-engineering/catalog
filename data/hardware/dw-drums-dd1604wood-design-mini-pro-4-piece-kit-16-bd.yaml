description: The Design Series features 100% North American maple shells that offer warm punch and hearty resonance.
details: |-
  The DW Design Series raised the bar for DW and made custom-style drums available to more drummers than ever before. This Design Series Mini Pro kit is a high-quality kit for beginners and gigging players. This setup features 100% North American 8-ply maple shells constructed with HVLT grain orientation technology that deliver warm punch and satisfying resonance.

  The chrome hardware features low-mass mini-turret lugs, triple-flange hoops, STM (Suspension Tom Mount) for reduced tension on mounted toms, and a MAG throw-off.

  This shell pack offers a 6.5x10″ mounted tom, 9x13″ floor tom, a 14x16″ kick drum, and a 5x12″ snare drum. Cymbals and hardware sold separately. Includes two-piece bass drum pillow set (DSCPBDP2W).
specs: |-
  - North American maple shells
  - Mini-turret lugs
  - STM (Suspension Tom Mount)
  - MAG Throw-Off
  - 8-ply HVLT shells
  - Triple-flange hoops
  - Sizes: 6.5x10″ mounted tom, 9x13″ floor tom, 14x16″ kick drum, 5x12″ snare drum
  - Series: Design Series
  - Finish options: Black Satin, Tobacco Burst
  - Cymbals and hardware sold separately
  - Includes two-piece bass drum pillow set (DSCPBDP2W)
