details: |-
  The Walrus Audio Floral Series has once again sprouted up from our pedal garden. A long-time fan favorite, the Floral Series returns with a fresh new bouquet of patterns and prints to dress up your pedal board with all the life-giving visual perks that plants can bring, but without all the allergic side effects. Would you like to command all of existence with the authority of one guitar strike? The Kangra Filter Fuzz is a true bypass, two-in-one pedal that provides a thick and spatty octave fuzz, and a psychedelic filter thats great for sweeps, frequency boost or even envelope filter sounds. The filter can run independently, or with the fuzz feeding into it. This is no rhythm player’s fuzz. Dig in and play dirty with aggressive fuzz lead lines that’ll rip time and space apart at the seams. SNL Guitarist and fuzz fanatic, Jared Scharff, approached us about doing a modern filtered and fuzz inspired by his favorite vintage fuzz pedal, the Kay Fuzz Tone. Working together through hundreds of texts, calls, emails and mailing prototypes back and forth, the Kangra came to life with plenty of grit, teeth and vintage vibe, as well as pronounced modern features. FUZZ Get two different styles of fuzz with the M/V Switch. In the modern position (M), you notice a more forgiving fuzz with longer and tighter sustain, while the Vintage position (V) feels starved with spatty breakup and grittier, shorter sustain. FILTER The Kangra also has a versatile filter with Resonance, Sensitivity, Frequency and Envelope Filter controls. Use the filter on its own to add a unique shape to your sound, or flip the Envelope Filter switch and open up funky sixties style tones. “On the filter, I wanted to go for that vintage mpc 3000 low pass type of thing…Or similar to doing a low pass plug-in for a track, or like a dj would do without it being too “wah pedal” like, and this achieved that.” - Jared Scharff
specs: |-
  - True Bypass
  - Two-in-one: octave fuzz + filter (filter can run independently or fed by fuzz)
  - M/V (Modern/Vintage) fuzz voicing switch
  - Filter controls: Resonance, Sensitivity, Frequency, Envelope Filter
  - Power: 9V DC, 100mA minimum, center negative
  - Dimensions: 4.77" x 2.6" x 1.39"
