description: >-
  The Oberheim Matrix 12 is a legendary 12-voice analog synthesizer from the
  mid-1980s, widely regarded as one of the fattest and most programmable analog
  synthesizers ever made. It features Matrix Modulation for extensive virtual
  patching, 15 types of LFOs and VCAs per voice, and a 61-key velocity- and
  aftertouch-sensitive keyboard. Notable users include The Orb, Vangelis,
  Technotronic, and Depeche Mode.
details: |-
  The Matrix 12 sits at the pinnacle of Oberheim's analog synthesizer lineup, building upon the architecture of the Xpander and Matrix 6 but delivering a significantly fatter and more programmable instrument. Each of its 12 voices features a pair of oscillators routed through Oberheim's sophisticated Matrix Modulation system, which allows virtually any control source to modulate any destination parameter.

  The depth of modulation capabilities is extraordinary for its era. Each voice includes 15 types of LFOs and VCAs, enabling complex evolving textures and sounds that remain difficult to replicate on other instruments. The front panel includes detailed signal routing diagrams to help navigate the extensive programming environment, though the Matrix 12 is decidedly not a beginner's instrument.

  Operating modes include single, split, and multitimbral configurations across its 100 patch memories. The 61-key keyboard with velocity and aftertouch sensitivity provides expressive performance control. MIDI connectivity was standard, placing the Matrix 12 at the forefront of studio integration during its production period.

  The Matrix 12 is closely related to the Xpander, which shares much of the same voice architecture but in a keyboardless six-voice format. It has been used by The Orb, Gravity Kills, Vangelis, Technotronic, and Depeche Mode.
specs: |-
  - Polyphony: 12 voices
  - Oscillators: 24 (2 per voice)
  - Layers: Single / Split / Multitimbral
  - Memory: 100 patches
  - LFO: 15 types per voice
  - Keyboard: 61 keys with velocity and aftertouch
  - Arpeggiator/Sequencer: None
  - Control: MIDI
  - Production Period: 1985-1988
releaseDate: "1985"
