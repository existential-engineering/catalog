details: |-
  The MIDI Maestro Gold Edition is a next-gen foot controller with silent switches, six built-in screens, and mobile-app customization. Designed for total stage or studio control, it switches presets, FX, and pedal settings with ease. Pre-loaded modes give hands-free control over the BeatBuddy and Aeros, from tempo changes and accent hits to undo/redo and track mute. Compact, powerful, and intuitive, it's the most versatile MIDI controller for your rig.
