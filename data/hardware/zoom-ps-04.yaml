description: Weighing 160 grams, the PS-04 Palmtop Studio combines a SmartMedia
  recorder, mixer, multi-effect device, and drum/bass machine in a single
  pocket-size body.
details: |-
  The PS-04 Palmtop Studio packs a SmartMedia recorder, a mixer, a multi-effect device and a drum and bass machine into a pocket-size body of 85 x 133 x 36 mm weighing 160 g without batteries. It runs from the AD-0006 9 V DC centre-minus adaptor or four AA cells, giving about seven hours with the display backlight on and ten with it off.

  The recorder has four physical tracks, each carrying ten virtual takes for 40 in total. Two tracks record at once and seven play back simultaneously (four audio plus the stereo drum track and the bass track). Recording goes to a 3.3 V SmartMedia card of 16 to 128 MB, giving roughly 7 minutes of HI-FI mono on 16 MB up to 67 minutes on 128 MB, with LONG mode roughly doubling each figure, and up to 100 projects. A bounce function folds all four tracks onto two empty V-takes, and editing covers copying, erasing and trimming a specified range plus V-take level operations, alongside manual and automatic punch-in and punch-out, a precount and A-B repeat.

  The four-fader mixer sets level, Hi and Lo EQ, panning and effect send level for the audio tracks and the drum and bass tracks, with stereo linking across tracks 1 and 2 or 3 and 4, and the input signal can be routed straight into the stereo mix.

  Two effect streams run at once. The insert effect spans five algorithms (GUITAR/BASS, MIC, DUAL, LINE and MASTERING) built from five modules, with 87 types and 170 patches, and the DUAL algorithm processes two separate sources such as a vocal and a guitar with independent left and right chains. The MASTERING algorithm adds a three-band multiband compressor, a normalizer and a dimension stage for the stereo mix. A one-module send and return effect with six types and 40 patches supplies hall, room, spring and plate reverbs, chorus and up to one second of delay.

  The rhythm section plays realistic PCM drum and bass sounds across more than 500 patterns, with five drum voices and one bass voice, seven drum kits and five bass programs, at 40 to 250 BPM and 48 PPQN. One song per project can run to 999 measures and about 10000 events, entered by step input or by Zoom's FAST input and carrying its own chord progression, which the bass line follows. The built-in tuner handles chromatic, guitar, bass, open A, D, E and G and D modal tunings, and the manual notes it also covers unconventional cases such as 7-string guitar and 5-string bass.
specs: |-
  - Physical tracks: 4, virtual takes: 40 (10 V-takes per track)
  - Simultaneous recording: 2 tracks, simultaneous playback: 7 (4 audio plus stereo drum and bass)
  - Recording media: SmartMedia card, 3.3 V, 16 to 128 MB
  - Max. recording time converted to a single monaural track: 16 MB 7 min HI-FI / 15 min LONG, 32 MB 16 / 32 min, 64 MB 33 / 67 min, 128 MB 67 / 134 min
  - Projects: 100
  - Mixer: 4 faders. Track parameters EQ, effect send, pan (balance). Stereo linking track 1 + 2 or 3 + 4
  - Effect algorithms: 5 (GUITAR/BASS, MIC, DUAL, LINE, MASTERING)
  - Effect modules: insert effect 5, send/return effect 1
  - Effect types: insert effect 87, send/return effect 6
  - Effect patches: insert effect 170, send/return effect 40
  - Tuner modes: chromatic, guitar, bass, open A/D/E/G, D modal
  - Rhythm voices: 5 drum, 1 bass. Drum kits: 7, bass programs: 5
  - Resolution: 48 PPQN, tempo 40 to 250 BPM, beat 1/4 to 8/4
  - Rhythm pattern: 511 per project, 99 measures per pattern
  - Rhythm song: 1 per project, 999 measures per song, approx. 10000 notes/events per song
  - A/D conversion: 20 bit, 64 times oversampling. D/A conversion: 20 bit, 8 times oversampling
  - Sampling frequency: 31.25 kHz
  - Display: 42 x 26 mm original LCD with backlight
  - Guitar/microphone input: standard mono phone jack, rated input level -50 to +4 dBm variable, input impedance 16 kilohms to 1 megaohm variable
  - Line input: miniature stereo phone jack, rated input level -20 dBm, input impedance 10 kilohms
  - Master output: standard stereo phone jack, rated output level +3 dBm, output load impedance 10 kilohms or more
  - Headphones output: miniature stereo phone jack, 50 mW into 32-ohm load
  - Power supply: AC adaptor DC 9 V centre minus 300 mA (Zoom AD-0006)
  - Battery: 4 x IEC R6 (size AA), approx. battery life 7 hours with display backlight on, 10 hours with it off
  - Dimensions: 85 (W) x 133 (D) x 36 (H) mm
  - Weight: 160 g without batteries
  - Supplied accessory: SmartMedia card
