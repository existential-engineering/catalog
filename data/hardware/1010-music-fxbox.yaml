description: Fxbox is a 26 HP Eurorack performance effects module with a touch
  screen interface, combining up to 16 realtime effects across two independent
  stereo effects chains per preset, with an XY pad and internal step sequencer
  for live remixing. It has been discontinued; fxbox functionality is now
  available by purchasing a bitbox mk2 and downloading the fxbox firmware from
  the 1010music forum.
details: |-
  Fxbox is the performance effects module for Eurorack. Fxbox combines up to 16 realtime effects in each of two effects chains with controls from the touch screen, continuous knobs, and external modulators. Use the XY pad to control two different aspects of the sound at once. Use the internal step sequencer to create tricked out, remix style effects. Create complex layers and builds using the touch screen to isolate the individual effects.

  Fxbox is great for breathing life into pads and tones as well as introducing alternate timing and variety to rhythmic parts. It relies on an external clock signal or MIDI to perform in time with your music. Fxbox comes with 50 factory presets and an unlimited number of user presets.

  16 effects: pitch shift, distortion, bitcrusher, filter, chorus, phaser, flanger, ring modulator, freeze, loop, reverse, vinyl, gater, panner, delay, reverb.

  What is Included: a Series 1 eurorack module with an fxbox faceplate, a microSD card with fxbox firmware loaded on it, a eurorack power cable, an fxbox Quick Start guide, a MIDI Adapter.

  Series 1 Module Firmware Switching: Because fxbox is a Series 1 module, you can swap out the fxbox firmware for other Series 1 module firmware (bitbox or synthbox) by signing up at forum.1010music.com, downloading the new firmware and following the instructions on the forum. You can also download the latest fxbox firmware to get new features and updates.

  Discontinuation notice (on page): "We are no longer selling fxbox directly. You can get fxbox functionality by purchasing a bitbox mk2 and downloading the fxbox firmware from our forum. You must register for the forum in order to access firmware downloads."
specs: |-
  - 26 HP
  - Power: +12V 350mA, -12V 0mA, 5V 0mA
  - Weight: 0.78 lbs
  - Dimensions: 6.75 x 6.25 x 2.125 in (WooCommerce package dimensions; panel depth not separately stated)
  - SKU: 002
  - 16 realtime effects per chain, 2 effects chains per preset (pitch shift, distortion, bitcrusher, filter, chorus, phaser, flanger, ring modulator, freeze, loop, reverse, vinyl, gater, panner, delay, reverb)
  - 50 factory presets, unlimited user presets
  - 8 total 1/8-inch (3.5mm) I/O jacks: MIDI In, Clock In, In 1, In 2, FX 1, FX 2, Out 1, Out 2
  - MicroSD card slot for firmware storage
