description: The dbx 172 is a discontinued dual-channel noise reduction unit
  using dbx's encode/decode noise reduction process to reduce tape hiss and
  noise in recording and playback systems. It was designed for use with tape
  recorders and other analog recording media.
details: |-
  The 172 is a dual-channel dbx Type I or Type II noise reduction system, designed for use in professional recording environments to reduce tape noise and hiss. The encode mode compresses audio before recording to tape, while decode mode expands it on playback, resulting in dramatically reduced noise levels.

  dbx noise reduction operates over the full audio frequency range, providing noise reduction on the order of 30dB or more when both encode and decode modes are used in a matched pair. Unlike some noise reduction systems, dbx operates without audible pumping or breathing artifacts on most program material.

  The 172's dual-channel design allows processing of stereo program material simultaneously. An owner's manual (1.28MB) is available for download from the dbx product page.
