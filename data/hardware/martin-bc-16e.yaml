  - Scale Length: 34"
  - Fingerboard Material: Ebony
  - Fingerboard Width at Nut: 1.58"
  - Fingerboard Width at 12th Fret: 2.18"
  - Neck Shape: Bass Profile with Standard Taper
  - Total Frets: 23
  - Frets to Body: 17
  - Bracing: Forward-Shifted X-Brace, Scalloped Spruce 5/16"
  - Bridge: Ebony, Modern Belly with Drop-In Saddle
  - Saddle: Compensated White Tusq, 16" Radius
  - Nut: Bone
  - Tuning Machines: Black Enclosed Gear Bass Tuners
  - Electronics: Martin E1 (chromatic tuner, volume, tone, phase)
  - Case: Waterproof Softshell with Backpack Straps
  - Strings: Martin Authentic Acoustic SP Bass Strings (Light)
