details: |-
  The Martin BC-16E is a full-scale acoustic-electric bass guitar built around an M-14 Fret Cutaway body (the Grand Auditorium-equivalent shape adapted for bass). It is handcrafted in Martin's Nazareth, Pennsylvania factory as part of the 16 Series lineup.

  A solid spruce top is paired with East Indian rosewood back and sides, both in satin finish, to deliver the powerful projection and articulate low end the bass guitar is designed for. Forward-shifted scalloped spruce X-bracing (5/16") supports the top's resonance, while the cutaway gives players easy access to the upper frets along the 34" scale.

  The neck uses a bass profile with standard taper, capped by an ebony fingerboard measuring 1.58" at the nut and 2.18" at the 12th fret. The bass carries 23 frets in total and joins the body at the 17th fret. A bone nut, compensated white Tusq saddle (16" radius), ebony belly bridge with drop-in saddle design, and black enclosed gear bass tuners complete the hardware appointments.

  Onboard Martin E1 electronics let players sculpt their sound with volume, tone, and phase controls, and a built-in chromatic tuner keeps the instrument in pitch on stage. The output is delivered through a standard 1/4-inch endpin jack.

  The BC-16E ships in a waterproof softshell case with backpack straps, strung with Martin Authentic Acoustic SP Bass Strings (Light gauge), and is backed by Martin's Limited Lifetime Warranty.
specs: |-
  - Body Size: M-14 Fret Cutaway (0000-14 Fret Cutaway)
  - Top Wood: Spruce
  - Back/Sides: East Indian Rosewood
  - Top Finish: Satin
