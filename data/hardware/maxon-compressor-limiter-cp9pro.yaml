description: A studio-grade compressor pedal featuring a DBX-style VCA
  compression circuit with variable ratio up to infinity:1 and up to +30dB of
  clean gain, delivering smooth, transparent compression with a low noise floor.
details: |-
  The CP-9 Pro+ is that rarity of rarities – a compressor with tons of squash that does not color your guitar tone or create excessive noise. The CP-9 circuit provides a very smooth, transparent, almost "glassy" compression with an extremely low noise floor, even at maximum settings. Your guitar sounds like your guitar, only with a smoother, more balanced dynamic response - Notes jump off the fretboard with stunning clarity and limitless yet controlled sustain. The CP-9's internal voltage doubler provides massive headroom with full-range frequency reproduction. It can be used with any instrument and for a variety of applications – send into an amp's front end, place in a loop, or use as an outboard processor for home recordings. With up to +30 dB of clean Gain, the CP-9 Pro+ can also be used as a straight clean booster or as a volume attenuator to clean up an already dirty amp by reducing input level. The CP-9 Pro+ provides studio-grade compression in a portable stompbox format – you'll wonder how you ever played without it! TECH TALK:

  When re-designing the CP-9, Maxon looked at every type of compressor on the market and came to one conclusion – standard-grade components and traditional guitar compressor designs simply would not do. The CP-9 Pro+ runs off of a dual power supply (converted from a single 9V+) giving the pedal twice the headroom and ability to handle compressing/expanding a signal without clipping. The pedal starts by splitting the input signal into 2 circuits - control and effected. The control stream makes its way into a THAT2252 chip, a precision RMS level detector (by the "THAT Corporation," a Silicon Valley manufacturer of high-end precision analog chips) which measures the input signal and provides a precise trigger signal for the VCA. After the RMS chip we head into a series of 4 Op Amps that are used to control the Threshold, Shape, and Gain of the trigger signal. The affected trigger signal is then routed into a THAT2150 VCA which follows the unity gain amplifier in the effected circuit. The THAT2150 is a Voltage Controlled Amplifier based on the "Blackmer Gain Cell" developed by David Blackmer, the founder of DBX - This VCA structure is the granddaddy of them all and was instrumental in the early DBX designs. After the 2150 VCA the signal is amplified again by another Op Amp and then out through the true bypass switch. The CP-9 Pro+ features Mechanical True Bypass switching using a Fujisoku 4PDT switch. NOTE ON POWERING THE CP-9 Pro+ - this pedal's voltage regulator IC requires a high inrush current of approximately 2000 mA upon startup. When using with a Power Brick such as the Voodoo Labs Pedal Power 2+, this pedal should be connected to a high current power jack when possible. If it is not possible to connect to a high current jack, you can power the CP-9 Pro+ by leaving a battery in the pedal. Upon initial start-up, unplug the external DC power input cable, engage the pedal, and then plug the DC power input cable back in – the pedal will now power up normally off the external power supply until you power down your pedalboard. Input Impedance : 500K Ohms

