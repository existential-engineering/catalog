name: SR-009D
manufacturer: stax
primaryCategory: headphones
description: An electrostatic circular earspeaker reissue of the legendary
  SR-009 that pioneered STAX's high-end models. The SR-009D adopts a detachable
  cable structure for enhanced usability and easy maintenance, while preserving
  the original MLER multi-layer electrode technology.
details: |-
  The SR-009, the origin of STAX's current high-end models. Equipped with a large circular sound unit featuring innovative fixed electrodes, this model led the high-end headphone culture for a long time. Production had ceased with the arrival of the new flagship model, but now, in response to numerous requests from fans worldwide, it makes the comeback. With changes to the body color, cable material, and unit case, it is now available at a more accessible price than at its original launch.

  MLER (Multi-Layer Electrode): The SR-009 (released in 2011) was the catalyst for the current high-end models SR-X9000 and SR-009S. The key technology for high-end models, MLER (Multi-Layer Electrode), originated with this model. Using thermal diffusion bonding technology, which unifies photo-etched metal plates at the atomic level under vacuum conditions, this new fixed electrode achieves exceptional planarity, low resonance, and high sound wave transmission. The SR-009D remains the most affordable option for experiencing the sound of current STAX high-end models.

  Replaceable Cable Design: SR-009D adopts the replaceable cable structure which is now standard across the current lineup. This enhances usability of the earspeakers by enabling future compatibility with high-quality cables and easy maintenance in case of unexpected cable breakage.
specs: |-
  - Type: Push-pull electrostatic circular sound element, open-air type enclosure
  - Frequency response: 5 – 42,000 Hz
  - Electrostatic capacitance: 110 pF (including cable)
  - Impedance: 145 kΩ (including cable, at 10 kHz)
  - Sound pressure sensitivity: 101 dB / input 100 Vr.m.s. / 1 kHz
  - Maximum sound pressure level: 118 dB / 400 Hz
  - Bias voltage: DC 580 V
  - Earpad: Real leather (skin touching portion), high-quality artificial leather (surrounding portion)
  - Cable: OFC parallel 6-strand, low-capacity special wide cable, 2.5 m full length
  - Weight: 594 g (including cable), 452 g (without cable)
