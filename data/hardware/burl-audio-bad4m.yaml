description: "Mastering-grade 4-channel ADC daughter card for the B80 and B16
  MOTHERSHIP, featuring switchable BX1 input transformers, NextGen Analog BOPA14
  op-amps, and a stepped attenuator. Designed for mixing and mastering with
  switchable ADC filter and Avid delay matching."
details: |-
  The BAD4M is the result of over 25 years of R&D experience in pro audio digital and analog design. Following on the success of the B2 BOMBER ADC and the BAD8 for the MOTHERSHIP, the BAD4M utilizes BURL Audio's NextGen Analog technology with the same BX1 transformer coupled circuit path as the BAD8 and a transformerless analog front end using BOPA14. The BAD4M allows you to switch between the BAD8 style analog front end and the newly developed, BOPA14 based, transformerless analog front end.

  The new BOPA14 with BURL NextGen Analog boasts stunning clarity and definition and raises the bar of excellence in pro audio analog electronics fidelity. The BAD4M transformerless analog front end is perfect for situations where you want a pure capture of a mix or mastering chain where the signal is already warm and peak limited.

  On the digital side, the BAD4M employs a switchable ADC filter and AVID delay matching, allowing you to perfectly match the input delay of an AVID IO for hardware inserts.
specs: |-
  - 4-channel MIX / MASTERING ADC
  - 4-channel XLR connectivity
  - All class-A, NextGen Analog BOPA14 or BOPA11 op-amps
  - Switchable BX1 input transformers
  - B2 ADC style stepped attenuator
  - Avid delay matching
  - ADC filter select
  - 115 dB Dynamic Range
  - -96 dB THD+N, full scale output = +22 dBU
  - Frequency response at 48 kHz: 10 Hz to 22 kHz, +/- 0.1 dB
  - Frequency response at 96 kHz: 10 Hz to 30 kHz, +/- 0.1 dB, -0.3 dB @ 40 kHz
  - Frequency response at 192 kHz: 10 Hz to 30 kHz, +/- 0.1 dB, -1.5 dB @ 90 kHz
