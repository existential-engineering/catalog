description: The SoCo LC Deluxe is a semi-hollow electric guitar named after the
  South Congress district of Austin, TX. Its single cutaway body features a
  maple laminate construction with a maple center block, delivering a drier,
  woodier, mid-forward tone characteristic of classic semi-hollow guitars. The
  Deluxe model distinguishes itself with grained ivoroid binding on the body,
  fingerboard, and peghead, along with premium ivoroid appointments throughout.
details: |-
  The SoCo LC Deluxe merges heritage semi-hollow design with modern refinement. The 15" lower bout provides comfort and balance with exceptional note articulation, while the single cutaway construction delivers robust low-end response through an extra-long mortise and tenon neck joint. The Honduran mahogany neck features a rosewood fingerboard with a 12" radius, mother-of-pearl long dot inlays, and medium 18% nickel-silver frets. Electronics consist of Lollar Low Wind Imperial Humbuckers wired in 50s-style through CTS 500K potentiometers and Jupiter Vintage Yellow capacitors. Hardware includes a Kluson ABR-1 bridge, Kluson stop tailpiece, and nickel Gotoh tuners with Collings logo. The high gloss nitrocellulose lacquer finish is available in a wide range of colors. Custom options include alternative pickup configurations, Bigsby vibrato, left-handed configuration, alternate inlay patterns, and various binding and knob materials. Comes with D'Addario NYXL1149 strings and a deluxe hardshell case.
specs: |-
  - Body: Semi-hollow, maple laminate with maple center block
  - Body Width: 15"
  - Body Length: 19"
  - Body Depth: 1 5/8"
  - Total Length: 40 1/4"
  - Neck: Honduran mahogany
  - Fingerboard: Rosewood
  - Fingerboard Radius: 12"
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Frets: Medium 18% nickel-silver
  - Inlays: Mother-of-pearl long dots
  - Binding: Grained ivoroid (body, fingerboard, peghead)
  - Neck Joint: Extra-long mortise and tenon
  - Pickups: Lollar Low Wind Imperial Humbuckers
  - Wiring: 50s-style
  - Potentiometers: CTS 500K
  - Capacitors: Jupiter Vintage Yellow
  - Knobs: Custom grained ivoroid top hat
  - Bridge: Kluson ABR-1 (nickel-plated zinc with retaining wire)
  - Tailpiece: Kluson stop tailpiece (nickel-plated zinc, steel studs)
  - Tuners: Nickel Gotoh with Collings logo
  - Peghead Veneer: Ebony with MOP Collings logo
  - Peghead Profile: Haircut
  - Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1149 (.011"-.049")
  - Case: Deluxe hardshell included
