details: |-
  The L•1000 brings back the best of the iconic passive G&L bass from 1980. Fans of the vintage G&L "wunkay" know.

  It's that rounded, fast shape of the neck combined with the slick feel of an old gloss finish. It's the clean, modern aesthetic of the original CLF/G&L headstock.

  It's the tactile delight of those beautiful CLF Research knobs shimmering from an elegant chrome control plate. And of course, there's the legendary punch of the L•1000's MFD humbucker in OMG mode.

  Now take all that goodness and pack it into the slimmer mid-90s L-Series body shape for added comfort and lower weight, and a 3 hour gig passes with tone and style to spare.

  On the road, the neck is more stable than those beloved vintage wunkays, with a modern dual-action truss rod and twin graphite stiffening rods. Add it all up and it is the best of the vintage CLF vibe with the best of modern G&L elements.

  In the late 1970s, Clarence Leo Fender was looking forward to launching his G&L brand featuring his latest innovations including Magnetic Field Design pickups and the Saddle Lock bridge. Leo developed these technologies at his CLF Research company, and production of the G&L instruments took place in the CLF Research factory on Fender Avenue in Fullerton, California, where G&L production continues today.

  The L•1000 is a fully modern "wunkay" that pays homage to its roots with classic details including the early CLF/G&L headstock and neck profile, beautifully reproduced CLF knobs and control plate, and red-capped mini toggle switch.
specs: |-
  - Pickups: G&L Magnetic Field humbucking pickup
  - Body wood: Swamp Ash and Alder
  - Neck wood: Natural Satin Hard Rock Maple with Maple fingerboard or Rosewood fingerboard
  - Neck profile: CLF/G&L 1 5/8" slim C with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L Ultra-Lite with aluminum tapered string posts
  - Bridge: Leo Fender-designed G&L Saddle Lock with chrome-plated brass saddles
  - Electronics: 3-position mini toggle for parallel/split/OMG pickup modes, volume, treble, bass
  - Includes: G&L Deluxe Gig Bag
