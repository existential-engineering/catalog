description: The Graphic Resonant Filterbank (FB) is a ten-band analogue
  filterbank with digital control over each bands’ boost or cut. Each band can
  be controlled individually via CV or manually, while complex control
  configurations turn the filterbank into an unconventional multimode filter and
  even an instrument in its own right when played with various resonance
  settings. The Expander module (works exclusively with the Graphic Resonant
  Filterbank and is available separately) provides hands-on adjustment of boost
  and cut for all bands.
details: |-
  The Graphic Resonant Filterbank is a ten band analogue filterbank with digital control over each band's boost or cut. Each band can be set individually by CV or by hand, and complex control configurations turn the filterbank into an unconventional multimode filter, or into an instrument in its own right when played with various resonance settings.

  The ten bandpass filters sit at 29Hz, 61Hz, 115Hz, 218Hz, 411Hz, 777Hz, 1.5kHz, 2.8kHz, 5.2kHz and 11kHz, within 10%. Main, even and odd outputs are provided, so odd and even bands can be taken out separately as well as summed.

  Beyond the filterbank proper there are a multimode filter mode, a spectral analyzer mode and a dynamic spectral compressor mode. Resonance feedback loops are configurable, with manual and voltage controlled resonance, and 128 presets cover the filterbank, the filter modes, the dynamic EQ and the resonance settings. Pattern changes can be discrete or morphing.

  A clock input synchronises events with a master clock source, the CV inputs are configurable, and the design is skiff friendly. The separately available expander module gives immediate access to the band levels.
specs: |-
  - Analogue 10 band filterbank
  - Audio signal amplitude 10Vptp
  - Bandpass filter frequencies 29Hz, 61Hz, 115Hz, 218Hz, 411Hz, 777Hz, 1.5kHz, 2.8kHz, 5.2kHz, 11kHz +-10%
  - CV input amplitude (configurable) -10V to +10V
  - Number of presets 128
  - Main, even and odd outputs
  - Manual and voltage-controlled band boost/cut
  - Configurable resonance feedback loops
  - Manual and voltage-controlled resonance
  - Clock input for synchronization with a master clock source
  - Multimode filter mode
  - Spectral analyzer mode
  - Dynamic spectral compressor mode
  - Discrete and morphing pattern change
  - Skiff-friendly design
  - Panel width 20HP
  - Module depth 30mm
  - Power consumption (with EXP) 138(145)mA@+12V, 50mA@-12V
