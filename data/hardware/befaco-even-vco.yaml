details: |-
  The EVEN VCO is a voltage-controlled oscillator that offers stability and high precision tuning over 10 octaves. A redesigned temperature compensation circuit maintains the oscillator stable against voltage and temperature drops.

  The module features five waveform outputs — Triangle, Ramp, Sine, PWM, and Even — along with a 10-position octave selector and 1 cent precision tracking across the full octave range.

  Control inputs include two V/Oct inputs, a Linear FM input, a PWM CV input, and a Hard Sync input, making it highly versatile for complex patch configurations.

  The Even VCO is available both as a fully assembled module and as a DIY kit, and is designed, prepared, and assembled in Barcelona.
