description: A fuzz pedal inspired by the 1968/1969 Kay Fuzz Tone F1, part of
  the JHS Legends of Fuzz series, featuring a Frequency knob with optional
  expression pedal control for a variable filter sweep.
details: |-
  At JHS, fuzz pedals have been in our lineup for over a decade. The 'Legends Of Fuzz' series is our tribute to the most important fuzz circuits ever made. Kay Musical Instruments was founded by Henry 'Kay' Kuhrmeyer on July 1, 1931. The Kay Fuzz Tone was most likely released in late 1968/early 1969. Initially designed as a low-cost-version of the Shin-ei/Univox Superfuzz, this fuzz is one of the Edge's go-to pedals. Fifty-four years later, JHS is releasing our spin on the Kay Fuzz Tone: the Mary-K. We've even added knobs and an expression pedal output for those who want to use it as it was originally intended.

  Rather than using a treadle chassis, we allow Mary-K users the option to control the Frequency knob with an expression pedal. We recommend the Nektar NX-P and Roland EV-5 expression pedals, but many other expression pedals should also work.
