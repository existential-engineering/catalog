details: |-
  Meet Major IV, the iconic headphones from Marshall with 80+ solid hours of wireless playtime, wireless charging and a new, improved ergonomic design. Custom-tuned dynamic drivers deliver roaring bass, smooth mids and brilliant treble for a rich, unrivalled sound that you'll never want to turn off. Designed and engineered in Sweden. Made in China.

  Iconic and foldable design: Major IV combines enhanced usability with classic Marshall elements. The new fold clip means Major IV folds away into an even more compact size, and the ear caps are protected from excessive wear and tear. It features the tactile and efficient control knob, textured black vinyl and Marshall script, as well as the rugged durability that's necessary for the anarchy of everyday life.

  80+ hours of wireless playtime: with over two full days of power, you can stop worrying about your headphones dying on you when you need them. If you do ever find yourself caught out without power, just plug your 3.5 mm cord into your device to keep listening. Major IV also has a quick-charge capability, so only 15 minutes of charging will give you 15 hours of listening.

  Multi-directional control knob: play, pause, skip and adjust the volume of your device, as well as power your headphones on or off. Phone functionality is also included so you can answer, reject or end a call with a few simple clicks.

  Wireless charging and music sharing: Major IV can be charged wirelessly, so it is easier than ever to charge and go. As well as allowing you to plug in and play when you're low on power, Major IV's 3.5 mm socket also allows a friend to enjoy your music.
