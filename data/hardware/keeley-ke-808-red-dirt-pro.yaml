details: |-
  The Red Dirt Overdrive line began from a search for a classic drive sound that also offered more sonic versatility, so it would suit a wider range of musical styles.

  The limited run KE-808 is a blend of the hotter sounds of the Red Dirt Germanium and the full, bold Red Dirt Professional Limited Edition. It carries the parallel branches of gain used in the Red Dirt Germanium, which produce a large gain response and, in Keeley's description, the fullest sounding pedal of this type the company has built. It also takes the fat tube tone of the Red Dirt Pro models by using LEDs for clipping.

  A Keeley-designed FET input stage gives the overdrive a genuinely tube-like breakup, intended to make leads sing and rhythm playing sound more dynamic and expressive. The result is a dynamic overdrive with enough crispness and clarity to cut through a dense mix while retaining a full midrange. It is hand built in the USA with premium components.
