description: >-
  The Micromoog is a compact, single-oscillator monophonic synthesizer designed
  by Moog as an affordable alternative to the Minimoog. Despite its budget
  positioning, it features a filter virtually identical to the Minimoog's
  legendary 24 dB/oct lowpass and can process external audio, making it valuable
  as both a synthesizer and a standalone filter processor.
details: |-
  The Micromoog represents Moog's effort to create an economical entry point into their synthesizer lineup during the mid-1970s. While it employs only one voltage-controlled oscillator compared to the Minimoog's three, it compensates with comprehensive sound-shaping capabilities including sample and hold, ring modulation, and a ribbon controller for pitch manipulation.

  The instrument's filter is its standout feature, being virtually identical to the Minimoog's celebrated 24 dB/oct lowpass design. This allows the Micromoog to function effectively as an external audio processor, a use case that has kept it relevant well beyond its production years. The synth also features Moog's 'Open System' architecture, providing a degree of modularity unusual for an instrument at its price point.

  Notable musicians who employed the Micromoog include Kraftwerk, Chick Corea, Herbie Hancock, Jimmy Edgar, Richard Barbieri, and Apollo 440. While reviewers note that its construction feels somewhat less substantial than Moog's premium offerings, its distinctive sound character and filter quality have maintained its reputation among analog synthesizer enthusiasts.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - Filter: 24 dB/oct lowpass with ring modulation
  - VCA: 1 VCA with ADSR envelope
  - Keyboard: 32 keys
  - Control: Ribbon controller, Moog 'Open System'
  - Features: Sample & Hold, external audio input
  - Memory: None
