details: |-
  The Harbeth Monitor 30.3 is a high-performance loudspeaker designed for audiophiles seeking uncompromising sound quality. With its advanced RADIAL4 driver technology, the Monitor 30.3 offers an immersive listening experience that reproduces music as it was intended to be heard.

  At the core of the M30.3 XD2 is Harbeth's RADIAL4 cone technology, an innovation that ensures exceptional detail. Through pioneering work in the development of loudspeaker diaphragm material science, Harbeth set a new benchmark with the acclaimed RADIAL4 cone, a revolution in clarity and detail from a loudspeaker drive unit.

  Each speaker in the XD2 series incorporates a newly refined crossover design. The result is a speaker that excels in tonal accuracy and is more open and clear, immersing listeners in a more lifelike musical experience.

  The cabinets are handmade from carefully selected high-quality veneers, each one sourced and inspected so that the speaker performs to standard and also suits the room it sits in. Veneers vary in colour, shade and grain structure, and not all finishes are available in every country.

  Harbeth has been building loudspeakers since 1977, using current test equipment to explore every aspect of loudspeaker design, with production technicians testing each part. The M30.3 XD2 is designed and handmade in the UK.
specs: |-
  - Description: stand-mount loudspeaker
  - Drive unit: 200mm Harbeth-made RADIAL bass/mid drive unit
  - Tweeter: 25mm ferrofluid-cooled
  - Frequency range: 50Hz to 20kHz, plus or minus 3dB free-space, grille on, smooth off-axis response
  - Impedance: 6 ohms
  - Sensitivity: 85dB/2.83V/1m axial
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 25W per channel
  - Power handling: 150W programme
  - Connectors: 4mm Harbeth-branded binding posts
  - Space needs: overall response optimised for use away from walls
  - Stands: optimally to bring ears level with tweeters (tweeter 320mm up from cabinet base)
  - Dimensions: 460mm high, 277mm wide, 275mm deep (plus 12mm for grille and binding posts)
  - Packing: single speaker per protective carton
