details: |-
  An optional WASP / KADI port for installation into the Pro-2000. The port adds a KADI output to the converter, which drives a Wasp or Gnat synthesiser through a 15 pin high density D connection.

  This version of the option is supplied with a Wasp cable, a 15 pin high density D plug to 7 pin DIN plug lead. The same port is also sold with a KADI cable instead, under its own listing.
specs: |-
  - Optional port fitted into a Pro-2000 converter
  - KADI port on a 15 pin high density D connector
  - Supplied with a Wasp cable, 15 pin high density D plug to 7 pin DIN plug
  - Also available supplied with a KADI cable
  - No power connection of its own: the port is fitted inside the host converter
