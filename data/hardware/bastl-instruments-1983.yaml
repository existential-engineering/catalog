description: "A polyphonic MIDI to CV interface with creative voice allocation
  and automatic tuning via oscillator feedback. Four channels of CV and gate
  output with six layout modes: 4-voice polyphony, 3+1 voice, velocity,
  quantizer, 8 gates, and 8 CC channels. Each channel has a LISTEN input for
  automatic tuning calibration. TRANSPOSE and PORTAMENTO CV inputs, WINDOW and
  UPDATE jacks for creative note allocation. Full MIDI support: Note On/Off, CC,
  Velocity, Pitch Bend, Clock, Aftertouch. Microtuning (µTune) for per-semitone
  scale editing within an octave."
details: |-
  The 1983 is a polyphonic MIDI to CV interface designed for Eurorack systems, offering creative voice allocation and automatic tuning capabilities.

  The module provides four independent CV and gate output channels, configurable across multiple layout modes: 4-voice polyphony, 3+1 voice (fourth channel handles velocity or other data), velocity-as-CV modes, quantizer mode, 8 gates mode, and 8 CC channels mode.

  Automatic tuning is a standout feature — each channel has a dedicated LISTEN input that accepts audio from the connected oscillator. The module listens to the oscillator pitch and adjusts the CV to keep it perfectly in tune, removing the need for manual calibration.

  The WINDOW and UPDATE jacks provide hands-on control over the voice allocation algorithm, allowing performers to shape how incoming MIDI notes are distributed across the four voices in real time.

  Microtuning (µTune) allows per-semitone scale editing within an octave, making the module suitable for alternative tuning systems and microtonal work. Full MIDI response includes Note On/Off, CC, Velocity, Pitch Bend, MIDI Clock, and Aftertouch.
