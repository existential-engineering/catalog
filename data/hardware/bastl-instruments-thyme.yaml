description: A sequenceable digital tape machine and audio effects processor
  featuring modulation sources called Robots. Explore time-based effects
  including delay, phaser, reverb, chorus, pitch shifter, multi-tap delay, tape
  delay, tremolo, vibrato, and compressor in stereo. Each of the 9 parameters
  has a dedicated Robot modulation source, and a 32-step sequencer with 4
  patterns allows for dynamic parameter automation.
details: |-
  Thyme is a sequenceable digital tape machine and audio effects processor by Bastl Instruments. At its core, Thyme simulates a tape-based signal path with continuously variable tape speed and delay time, enabling a wide range of time-based effects: delay, phaser, reverb, chorus, pitch shifter, multi-tap delay, tape delay, tremolo, vibrato, and compressor — all in stereo.

  The device features 9 parameters — Tape Speed, Delay Coarse, Delay Fine, Feedback, Filter, Spacing, Levels, Dry/Wet Mix, and Volume — each with a dedicated modulation source called a Robot. Robots can be set to oscillate, randomize, or follow sequences, providing dynamic, evolving textures without external modulation.

  A 32-step sequencer with 4 patterns allows parameter values to be recorded and played back step-by-step. Up to 64 presets are organized across 8 banks. The Freeze button captures and loops the current tape buffer, while Tap Tempo lets users sync delay time by feel.

  The analog audio input supports switchable stereo/mono operation with up to +20dB of gain. A stereo headphone output with independent volume control makes Thyme suitable for monitoring and performance use.

  External control is available via MIDI In/Out (5-pin DIN), analog clock input (0–5V), volt-per-octave CV input (controls Tape Speed/Delay), and a footswitch jack. Discontinued and succeeded by the Thyme+.
