description: >-
  A rack-mount sample playback module from 1997 dedicated to authentic Latin music sounds, featuring
  640 presets and an interactive Beats Mode for instant loop-based performance.
details: |-
  The E-mu Carnaval is a specialized sound module in E-mu's lineup of genre-focused rompler units,
  succeeding the Orbit 9090 and Planet Phatt. Released in 1997, it focuses exclusively on Latin
  music styles including Salsa, Samba, Tejano, Merengue, and Afro-Cuban genres, drawing from 8MB of
  ROM samples to deliver 640 preset sounds.

  The Beats Mode provides 100 pre-programmed Latin loops that can be played, tweaked, and combined
  interactively, making it a practical tool for both live performance and studio production. The
  module supports 32-voice polyphony with 32 sixth-order digital filters, two LFO sources with 42
  modulation destinations, and full MIDI control for deep parameter manipulation.

  Six analog outputs provide flexible routing options for mixing and processing individual sounds
  externally. The dual AHDSR envelope generators and extensive modulation matrix give the Carnaval
  more sound-shaping capability than its preset-focused design might suggest, allowing users to
  customize tones well beyond the factory programming.

  The unit also includes a simple song mode with capacity for 28 songs, enabling basic arrangement
  work directly from the module without external sequencing.
specs: |-
  - Polyphony: 32 voices
  - Sound Source: 8 MB ROM samples
  - Presets: 640 patches, 100 beats, 28 songs
  - LFO: 2 sources, 42 modulation destinations plus MIDI control
  - Filter: 32 digital 6th-order filters
  - Envelopes: 2 AHDSR
  - Outputs: 6 analog, stereo main
  - Control: MIDI In/Out/Thru
releaseDate: "1997"
releaseDateYearOnly: true
