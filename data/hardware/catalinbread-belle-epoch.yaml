details: |-
  The Catalinbread Belle Epoch is a faithful sonic recreation of the Maestro Echoplex EP-3, widely regarded as one of the most famous tape delays ever made. Eric Johnson has called it "the closest thing to a real EP-3 that I've ever played."

  Rather than simply applying filtering to repeats, Catalinbread implemented all of the subtle and not-so-subtle traits of the Echoplex, including the preamp character, self-oscillation behavior, the ability to control the record level of the signal hitting "tape," wow and flutter, and the characteristic way repeats decay.

  The pedal captures how the original Echoplex circuit interfaces with amps and other pedals, preserving the quality that made the EP-3 a musical instrument in its own right rather than just an effect.

  The Belle Epoch delivers authentic tape echo sounds in a compact, maintenance-free pedal format, eliminating the reliability concerns of owning and maintaining actual tape echo hardware.
