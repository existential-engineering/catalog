name: Thump215
manufacturer: mackie
primaryCategory: speaker
url: https://mackie.com/en/products/loudspeakers/thump-series-2022/thump215.html
description: '15" 1400W Powered Loudspeaker with built-in 2-channel mixer,
  Feedback Eliminator, and Music Ducking for DJs, bands, clubs, and live
  events.'
details: |-
  The Thump215 delivers powerful performance for DJs, bands, clubs, and live events. This unit features a 1400W ultra-efficient Class-D amplifier paired with a 15" high-performance woofer and 1" compression driver. Built-like-a-tank construction ensures durability while maintaining lightweight portability for easy transport between gigs.

  The speaker includes practical features for live performance. A built-in 2-channel mixer on the rear panel accommodates two combo input jacks plus a 1/8" stereo line input for smartphones and media players. This eliminates the need for external adapters when connecting guitars, microphones, keyboards, or DJ mixers.

  Performance-enhancing tools include a Feedback Eliminator that reduces unwanted squeals and rumble, plus Music Ducking that automatically lowers channel 2 levels when channel 1 receives microphone input. The standard pole mount and wedge design provide flexibility for both main speaker and floor monitor applications.
specs: |-
  - 1400W ultra-efficient Class-D amplifier
  - Frequency response: 40 Hz – 23kHz
  - Max SPL: 129 dB
  - 15" high-performance woofer
  - 1" compression driver
  - Built-in Feedback Eliminator
  - Music Ducking mode
  - Standard pole mount with monitor wedge design
  - Universal Power Supply (100-240VAC)
  - Weight: 32.6 lb / 14.8 kg
  - Dimensions: 27 x 17.4 x 14 in / 686 x 442 x 356 mm (HxWxD)
