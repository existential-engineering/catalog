description: A two-in-one collaboration with JHS Pedals pairing a Morning Glory
  overdrive with a high gain toggle and a three knob Keeley compressor, with a
  switch to reorder the two circuits.
details: |-
  Steak and Eggs is a collaboration between Keeley Electronics and JHS Pedals that puts two modified classic circuits, an overdrive and a compressor, in one enclosure. The batch sold from Keeley's own site was 25 units, hand signed by Robert Keeley and Josh Scott.

  The left side is JHS Pedals' Morning Glory circuit with an added high-gain setting. The toggle is a new take on a higher gain Morning Glory, with more power, punch and dirt, and the familiar internal bright cut is still present. Controls are Volume, Drive and Tone, plus the high gain toggle.

  The right side is a three knob version of Keeley Electronics' classic compressor. A blend control mixes the original signal back in for punchy tones, which helps humbucker guitars where over-compression dulls the tone. A new mid and treble emphasis circuit sits behind the bright toggle, pushing a chosen frequency range for a jangly tone. The release time is fast, retaining the warmth and sustain of earlier Keeley designs while keeping note definition, and an internal DIP switch returns the spongier, tube-like classic Keeley compression. As with the vintage Keeley OTA compressors, the Sustain control is a bias control and makes a swoosh or crackle as it is rotated, which does not affect playing.

  A toggle in the centre selects the order of the two effects: to the right the compressor comes first, to the left the Morning Glory comes first.
