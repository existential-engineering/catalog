description: Two-button remote footswitch for the Octa Psi, connected over a
  single cable so the pedal can be operated from elsewhere on a pedalboard.
details: |-
  The Octa Psi Remote Switcher is a compact two-button remote footswitch made for the Octa Psi Transfigurating Fuzz. It lets the pedal's two footswitches be operated from another position on a pedalboard, so the pedal itself does not have to be within reach.

  Connected with a TRS cable to the Remote jack on the back of the Octa Psi, the remote operates both of that pedal's footswitches. Connected with a TS cable to the Octa Psi Control jack instead, it gives instant effect-order switching between fuzz into octave and octave into fuzz, removing the one-second wait, at the cost of being unable to use an expression pedal at the same time.

  The unit is described as lightweight but rugged, sized to take up little pedalboard space, and plug and play with the Octa Psi. The connecting cable is not included.
specs: |-
  - Two-button remote footswitch for the Octa Psi
  - Connects to the Octa Psi Remote jack with a TRS cable to operate both of its footswitches
  - Connects to the Octa Psi Control jack with a TS cable for instant effect-order switching
  - Effect-order switching over the Control jack precludes simultaneous use of an expression pedal
  - Cable not included
