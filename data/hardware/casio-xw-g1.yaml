description: >-
  The Casio XW-G1 is a groove synthesizer keyboard released in 2014, designed
  specifically for DJ and club performers. It combines three sound engines —
  solo synths, PCM tones, and a sampler — with an interactive step sequencer and
  sample looper for live electronic music production.
details: |-
  Casio released the XW-G1 in 2014 as a specialized instrument targeting the DJ and club performance market. The design reflects a clear focus on live performance capabilities, distinguishing it from traditional studio synthesizers by prioritizing real-time control, rhythmic sequencing, and sample looping tools.

  The instrument features three integrated sound engines that provide significant sonic flexibility. Users can select between solo synths for monophonic synthesis, PCM sounds for traditional instrument emulation, and sampled sounds from external sources, allowing performers to layer different sound sources during live sets.

  The front panel layout divides functional areas logically: the left section handles tone editing with assignable controls, the center manages performance modes and sequencing, and the right side provides selection and real-time pitch manipulation buttons. This organization prioritizes accessibility during performance situations.

  Compared to the XW-P1, the XW-G1 represents a more DJ-focused alternative despite their similar physical designs, emphasizing club performance and groove-oriented workflows over general musical applications.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Oscillators: 6
  - Waveforms: Pulse, ROM, Saw Up, Sine, Square
  - VCF: 24dB Slope (4-pole), Low Pass, Resonance
  - LFO: 2 LFOs with Sine
  - Envelopes: 4 VCA with ADSR
  - Controls: MIDI In/Out/Thru
  - Sequencer: 16-step sequencer
  - Arpeggiator: Phrase measure and note quantize
  - Patterns: 100 preset, 100 user
  - Effects: 10 reverbs, 5 chorus
  - Keyboard: 61 non-weighted keys
  - Sampler: 16-bit, 42 kHz; 5s stereo, 10s mono 42 kHz, 20s mono 21 kHz
