description: Random harmony generator with pitch up and pitch down modes, built
  as a deliberately broken-sounding noise pedal.
details: |-
  The Absolüte Würst is a deliberately broken-sounding harmony pedal, released on 1 April and aimed at experimentalists and noise players rather than conventional players. Keeley presents it as a joke that is nonetheless a real product, and compares its sound to the DOD Gonkulator.

  It offers three modes. Random is a random harmony generator. Pitch Up produces an upward harmony described as chorus-like, and Pitch Down produces low synth-like sounds and unexpected throbbing.

  Four controls shape the result. The upper left control blends the original signal from dry to fully wet. The upper right control sets speed in Random mode and the pitch range in the Up and Down modes. The lower left Proximity control sets how close the harmony sits to the original note, and the lower right control sets gain.

  The pedal has simple on or off bypass switching and no battery compartment, so it must be run from an external supply.
