name: MIC BOOSTER CM-1
manufacturer: klark-teknik
primaryCategory: preamp
categories:
  - gain
url: https://www.klarkteknik.com/en/products/0838-AAT
description: The MIC BOOSTER CM-1 is a phantom-powered mic booster with up to
  +25 dB of gain for dynamic and passive ribbon microphones. It sits between the
  microphone and a mixer, preamp or interface, adding gain boost for a strong,
  clear signal.
details: |-
  The CM-1 sits between a dynamic or passive ribbon microphone and a mixer, preamp or interface, lifting a quiet mic before it reaches the desk with a significant gain boost for a strong, clear signal.

  Power comes from the channel it feeds: engage phantom power on the receiving mixer or interface and the CM-1 runs on that 48 V. The channel gain then needs checking, because the level runs far above typical mic signals.

  The booster fits inline with one limit. It has a balanced XLR input and a balanced XLR output and a body measuring 38 x 39 x 85 mm, but it does not pass phantom power on, so condenser microphones should not be used with it.
specs: |-
  - Up to +25 dB of gain
  - For dynamic and passive ribbon microphones
  - Balanced XLR input and balanced XLR output
  - Runs on 48 V phantom power from the receiving mixer or interface, no external power supply
  - Does not pass phantom power on, so not suitable for condenser microphones
  - Dimensions: 38 x 39 x 85 mm
