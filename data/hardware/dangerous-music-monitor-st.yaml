  input sources, speaker switching, cue, talkback and headphone needs, all in a
  1U package with crystal clarity.
details: |-
  An audiophile-grade, multi-purpose monitor controller for tracking, mixing and mastering that won't color your sound. The MONITOR-ST handles all input sources, speaker switching, cue, talkback and headphone needs, all in a 1U package with crystal clarity. With its stepped attenuator, five input sources, three speaker outputs, programmable I/O levels, dedicated subwoofer out and more, all accessed via the remote control, users won't leave the sweet spot while handling all studio routing.

  The MONITOR-ST's volume control is a relay-actuated stepped analog attenuator made from audiophile-grade components. From the remote's knob users get crystal-clear sonics with dead-accurate volume level recalls and better than 0.01dB gain tracking between channels.

  As the centerpiece of the studio, the MONITOR-ST handles complex routing elegantly: four analog inputs, three speaker outputs, plus a stereo subwoofer output with programmable level offset. The onboard talkback mic, slate output and 20W/channel headphone amplifier round out the routing needs.

  The system is expandable: adding a MONITOR-SR module allows monitoring in 5.1, 7.1, 10.2 or ATMOS, and pairing with the Dangerous Music CONVERT-2 lets the ST's remote control additional switching functions.
specs: |-
  - Gain Tracking Accuracy: Better than 0.05dB for 6 channels
  - THD+N: 0.002%
  - IMD: 0.003%
  - Frequency Response: 1Hz-100kHz -0.1dB
  - Crosstalk Rejection: >95dB
  - Nominal Input Level: +4dBu or -10dBV
  - Dynamic Range: 110dB
  - Maximum Level: +25dBu
  - 20W/channel headphone amplifier
  - Five customizable analog input sources (4 main + Aux)
  - Three speaker sets plus dedicated stereo subwoofer output
  - Expandable via MONITOR-SR modules for 5.1/7.1/10.2/ATMOS monitoring
