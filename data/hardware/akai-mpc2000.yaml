description: >-
  The MPC2000 is a professional 64-track sampler-sequencer workstation released by Akai in
  1997, featuring 32-voice polyphony, 16-bit sampling at 44.1 kHz, and 16
  velocity-sensitive pads.
details: |-
  The MPC2000 is a professional-grade production center designed for music creators. Its sampling engine matches the S-2000 with 2 MB of base memory expandable to 32 MB, supporting CD-quality 16-bit audio at 44.1 kHz in both stereo and mono formats. The device includes comprehensive sample editing tools covering pitch adjustment, time-stretching, truncation, loop creation, key mapping, and velocity modifications.

  The sequencing functionality emphasizes intuitive workflow with support for rapid note entry (32nd notes), dual recording modes (real-time and step-time), and multiple editing capabilities. Musicians can apply swing and quantization to refine timing, while individual track muting enables live performance modifications. The device transmits MIDI and sync data, facilitating integration within larger studio setups.

  The MPC2000 established itself as a foundational workstation for hip-hop and trip-hop production. Its architecture accommodates 32 voices of polyphony, complete MIDI compatibility, integrated disk storage, and SCSI connectivity. Notable artists employing this equipment included Kanye West, DJ Premier, DJ Shadow, and Dr. Dre, confirming its significance within professional hip-hop production.

  Expansion options substantially augmented the base system, with optional boards providing eight outputs, digital I/O, multi-effects processors, enhanced filters, expanded ROM storage, SMPTE synchronization, and specialized sound libraries.
specs: |-
  - 32 voices of polyphony
  - 44.1 kHz, 16-bit sampling
  - 2 MB sample memory (expandable to 32 MB)
  - 300,000-note sequencer capacity
  - Real-time and step-time recording modes
  - 2 LFOs
  - 12 dB resonant filter
  - Up to 4 effects processors
  - 16 velocity-sensitive pads
  - Built-in floppy disk drive
  - SCSI interface
  - Full MIDI implementation with clock and MTC
