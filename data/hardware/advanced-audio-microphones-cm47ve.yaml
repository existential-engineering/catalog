details: |-
  CM47ve

  The Advanced Audio CM47ve is a large dual-diaphragm, multi-pattern, tube condenser microphone inspired by the famous Neumann U-47. The CM47ve is a great choice for vocals, horns, acoustic instruments, and excels in front of bass and guitar amps. The CM47ve provides response within +or - 1.5dB of a U47 microphone made after 1958. Dan Wilson using the CM47ve on acoustic guitar. Capsule:

  The Advanced Audio CM47ve features our AK47 capsule. The AK47 is an exact reproduction of the early Neumann K47. The AK47 is a 32mm capsule with single back-plate, random drill pattern and is skinned with 6 micron mylar and a brass surround like the 1959 k47. The CM47ve yields a more vintage, 'darker' response curve than our CM47 above 10kHz but has a very present sound with a slightly wider proximity effect than the CM47. Circuit:

  The circuit is based on the very hifi 6072 tube optimized with a state of the art two-stage Class "A" CCDA design. This circuit provides a much lower output impedance with more headroom than the circuit used in the original U47. The lower output impedance provides a faster damping factor when driving the BV8 type transformer, delivering a better transient response than the original design. Selected 6072a tubes are some of the quietest tubes made, and are much less susceptible to microphonics than the metal-clad vf14 tubes used in the original U47 tube microphone. The dual-bobbin output transformer with its hum bucking configuration and our optimized circuit will deliver > +14dBu with less than 1% distortion. The output transformer is driven with a 2.2 ufd metal-film capacitor to take advantage of the transformer's response down below 20Hz. Specifications:
specs: |-
  - 1.0" (32mm) Ak47 single back plate, 6-micron skinned mylar capsule
  - Capsule polarization 60v on the back-plate
  - 9 selectable pickup patterns remotely switched from the power supply
  - Dual bobbin BV8 (6.5:1 ratio) output transformer
  - Selected 6072a tube Class A dual stage (CCDA)
  - Frequency response: 20Hz to 20kHz +/–3dB
  - Noise: <15dB (A-weighted)
  - Impedance: < 200 ohm (load impedance <1.2K)
  - Distortion: < 0.5% @128dB
  - Maximum Output: > +14dBu with less than 1% distortion
  - Robust shock mount that threads onto microphone body
  - Flight case.
