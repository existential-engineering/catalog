description: VU001B is a video distribution amplifier used to distribute a
  Composite video signal to multiple monitors or capture devices, or to
  distribute sync across multiple modular systems.
details: |-
  Updated version of VU001, retain the same features as the previous version with smaller depth. No more sync termination jumper as the rear RCA input is now buffered, a single jumper is used to either:

  Ideal to distribute a Composite video signal to multiple monitors/capture devices, or sync signal across multiple modular systems. Inputs:

  - 75 ohm, RCA (front)
  - 75 ohm, RCA (back)

  Outputs:

  - 75 ohm, RCA (front)
  - 75 ohm, RCA (back)

  Specs:

  - 4HP
  - 51mA +12V
  - 15mA -12V
  - 0mA +5V
  - 20mm deep

  Documentation
specs: |-
  - distribute the signal at the front RCA input to the 4 front RCA outputs and rear RCA output
  - distribute the signal at the rear RCA input to the 4 front RCA outputs as well as the rear RCA output.
