description: A Eurorack module with two fuzz channels based on the fuzz face
  circuit and a built-in pickup simulator for interfacing Eurorack signals as
  guitar-like input.
details: |-
  Two fuzz channels based on the fuzz face circuit with a built-in pickup simulator. Tips - Experiment with the pickup simulator and buffered signal. Use the PS.Level to keep the signal low, borderline on cutting out. You find lots of joy in the gnarly section by keeping this level at the edge.
specs: |-
  - Gnarly is a 7 knob beast that will destroy whatever you throw at it. It has many dead zones in the pots that will adjust based on the position of other pots. It's all about finding the sweet spots and living on those fine edges. The transistor pairs on this section are replaceable.
  - Oomph is a 5 knob bass friendly take on the fuzz face and compliments the upper harmonics of the Gnarly section.
  - Pickup simulator - Fuzz circuits offer unique sound when paired with the inductance of the pickup coils in a guitar. This why it is often suggested to have fuzz pedals as your first in a pedal chain. So we've built-in a coil to simulate your eurorack signal being emitted by a guitar pickup. We've also included a pickup simulator output so you can use it to interface with other fuzz instruments (pedals, modules, etc.).
  - As an added oddness - you can also input your guitar into the pickup sim output (just don't plug anything into the normal input). This will still get you Eurorack level output. Please don't input Eurorack levels into the pickup sim output.
