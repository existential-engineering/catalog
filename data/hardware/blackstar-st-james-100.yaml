description: The valve amplifier redefined and brought into the 21st century.
  Combining real valve tone with modern convenience, connectivity and
  portability, the St. James 100 sets a new benchmark for valve amplifiers.
details: |-
  The St. James 100 is an ultra-lightweight 100W valve amplifier available as a head and a 2x12 combo. It is equipped with two distinct power valve types (6L6 and EL34) that can be toggled between in 50-Watt mode or combined for a 100-Watt experience that harnesses the qualities of both valve types.

  Continuously variable power reduction down to 5% preserves valve tone, feel, distortion and compression at any volume. A built-in class-leading reactive load box accurately replicates speaker drive and breakup, and the integrated CabRig IR-based speaker simulator provides a library of classic cabinet and mic combinations editable via Blackstar Architect.

  Pro connectivity includes USB audio output, XLR D.I. with CabRig for direct-to-FOH or recording, and a 1/4 inch headphone output. The flexible effects loop switches between +4dBu and -10dBV levels and between series and parallel routing, and the entire feature set is MIDI controllable.

  Four footswitchable channels, six footswitchable voices, a footswitchable digital reverb and a footswitchable Solo Boost are all controllable via the included FS-23 6-way footcontroller. A patent-applied-for three-position 'Cut' selector shapes high-end frequencies on the rear panel.

  Blackstar collaborated with Celestion to develop the lightweight Zephyr G12Z-70 speaker used in the 2x12 combo, and uses candlenut plywood for the cabinet construction. The amp also uses modern SMPS technology for universal voltage compatibility with the response of traditional iron-core transformers.
specs: |-
  - Ultra-lightweight 100 Watt valve amplifier
  - Switchable/mixable power valve configurations
  - 3x ECC83, 2x 6L6, 2x EL34
  - Four footswitchable channels
  - Six footswitchable voices
  - Continuously variable power reduction down to 5%
  - Footswitchable digital reverb
  - Footswitchable Solo Boost (+2dB to +6dB, set via rear potentiometer)
  - Effects loop with +4dBu / -10dBV level switch and series/parallel switch
  - USB audio output
  - CabRig advanced DSP cabinet simulator
  - XLR D.I. output
  - Patent-applied-for three-position 'Cut' selector
  - MIDI compatible
  - 6-way FS-23 footcontroller included
  - Combo: 2x12" Celestion G12Z-70 'Zephyr' speakers, 16.8kg
  - Stunning boutique look including illuminated logo
