details: |-
  The asp8024: heritage edition comes with a brand new look as well as an array
  of added enhancements 'under the hood', giving the renowned console renewed
  vigour ahead of the company's 20th anniversary. Asp8024-he features the all
  new variable mix bus technology retro iron, utilising an all-discrete and warm
  sounding output amplifier with carnhill output transformers adding punch and
  'vibe' to the consoles' mix output.

  When engaged, the retro iron output card also provides subtle low bump and
  high lift mix eq's - inspired by classic mastering equalisers of yesteryear -
  these can be switched individually, allowing for wider, more spacious mix bus
  tones. The main mix bus has also been upgraded with john hardy co. 990c
  discrete amplifiers as standard for superior and even quieter, muscular
  performance.

  The classic vca mix bus compressor now has smoother make-up gain circuitry,
  includes a gain reduction meter and a high pass filter in the compressor's
  sidechain: bass expand. This little tool tightens up mixes and adds punch
  without destroying the low end, particularly useful for bass heavy
  productions.

  There also smaller additions such as the addition of a monitoring grade
  headphone amplifier; latching footswitch triggers for remote hands-free
  talkback; alps blue velvet main monitor pot with custom aluminium knob for
  that solid "everyday" feel; an improved faderlinktm plug-in (now 64-bit AAX,
  AU & VST compatible) controlling 8 channels of patchable DAW integrated vca
  automation for the dual layer control (dlc) module and an improved,
  whisper-quiet power supply.

  Of course the asp8024-he retains all the familiar hallmarks of its predecessor
  including: fully featured in-line architecture; simple, intuitive design;
  flexible, powerful four-band eq; renowned class-a mic pres (used across the
  entire product range); comprehensive monitor control and a range of modular
  options including dlc, integrated 24 / 36 / 48-ch patchbays or producers'
  desks.
specs: |-
  - Retro iron variable mix bus technology
  - All-discrete output amplifier
  - Carnhill output transformers
  - Low bump and high lift mix EQ
  - John hardy co. 990c discrete amplifiers
  - VCA mix bus compressor
  - Gain reduction meter
  - High pass filter in compressor sidechain (bass expand)
  - Monitoring grade headphone amplifier
  - Latching footswitch triggers for talkback
  - Alps blue velvet main monitor pot
  - Faderlinktm plug-in (64-bit AAX, AU & VST compatible)
  - 8 channels of patchable DAW integrated VCA automation
  - Dual layer control (dlc) module
  - Fully featured in-line architecture
  - Four-band EQ
  - Class-a mic preamps
  - Comprehensive monitor control
  - Modular options: dlc, integrated 24/36/48-ch patchbays, producers' desks
