details: |-
  The Euro4 LX offers all of the features that have made the Spector name famous around the globe. Inspired by the iconic NS-2, the Euro4 LX features an extremely comfortable, fully carved body, neck-thru construction, and professional appointments. Each bass is crafted using premium materials including European Alder, North American Maple, and uniquely figured Poplar Burl. The Euro4 LX features a 3-piece Maple neck combined with a Rosewood fingerboard for strength, stability and sustain. These basses are then outfitted with a lightweight, zinc brass alloy bridge for spot-on, reliable intonation. As for electronics, premium pickups from EMG provide the exceptional clarity, attack, and silent operation that Spector is known for. Spector's coveted Tone Pump active tone circuit is included in every Euro LX bass, giving you the power to cut through any mix with the turn of a knob. With these professional features and expert craftsmanship, Euro4 LX basses are the ideal choice for pro players.
specs: |-
  - Powered by an onboard battery for the active electronics, no external power connector
