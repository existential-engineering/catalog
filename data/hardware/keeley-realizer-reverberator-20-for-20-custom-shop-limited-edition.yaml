details: |-
  A Custom Shop finish of the Realizer Reverberator, part of the 20 for 20 series of 20 colorways carrying a 20 for 20 insignia, each run limited to 20 units. This one is a gleaming matte sparkle white metallic enclosure with chrome aluminium knobs and minimal 20 for 20 graphics.

  The Realizer is a spatial pedal based on the left side of the Loomer Workstation, aimed at shoegaze and ambient guitarists who already have the drive or fuzz tone they want. It offers three distinct reverb modes selected on the pedal.

  Soft Focus recreates the Soft Focus patch of the Yamaha FX500 multi-effects processor, a late-1980s rack unit behind many signature delay and modulation sounds of the early 1990s. In that mode the Decay control sets both reverb decay time and the feedback of the dual delay, while Depth sets the depth of all four chorus voices.

  Reverse is a reverse reverb taking its cue from the Yamaha SPX90 and Alesis Midiverb II, with Decay switching between eight fixed delay times from 150 ms up to half a second, plus an envelope-triggered vibrato that imitates the pitch bend of a Jazzmaster tremolo bar; Depth sets how far that bar is pushed and Warmth behaves like a Jazzmaster rhythm-pickup tone control. Hall is a hall reverb whose output feeds an octave-up stage that returns to the reverb input, creating an endlessly ascending octave feedback loop whose prominence is set by Depth.
