details: |-
  Bring your perfect studio guitar sound onstage with the new AmpliTube X-DRIVE
  distortion pedal. This boutique pedal features 16 all-new overdrive and
  distortion effects leveraging ik's latest amplitube technologies, accompanied
  by an exclusive virtual x-gear version of the exact same effects.

  Amplitube x-drive includes a matching virtual version for mac/pc and a copy of
  amplitube 5 se. Open any version of amplitube 5 and you'll find your virtual
  x-drive pedal available as a stomp for use within the program. Adjust any of
  your pedal settings with the convenience of amplitube's award-winning workflow
  and save them as presets.

  The x-gear preset manager lets you move presets between x-gear pedals and
  amplitube and easily reorganize them on the hardware pedal. You can store up
  to 300 presets per pedal.

  State-of-the-art dsp in a road-worthy anodized aluminum chassis. USB port for
  preset management and use as a recording interface. Full MIDI implementation
  including control over amplitube 5.

  Designed and made in italy for a lifetime of playing and gigging.
specs: |-
  - 16 overdrive and distortion effects
  - State-of-the-art dsp
  - Anodized aluminum chassis
  - 16 different algorithms
  - 50 factory presets
  - 300 storable presets
  - Distortion
  - Overdrive
  - Fuzz
  - Compressor
  - Cab emulation
  - USB port
  - MIDI implementation
  - Mac/pc compatibility
  - Amplitube 5 se included
