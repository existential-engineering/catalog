description: Accomplished yet compact in-wall design with Diamond Dome tweeter
  and 7-in Continuum mid/bass driver.
details: |-
  CWM8.5 D is a two-way in-wall loudspeaker in the Bowers & Wilkins Reference Series that offers exceptionally high performance from a compact cabinet-free form. It is a passive design driven from an external amplifier, with no on-board amplification and no mains connection.

  It features a decoupled Diamond dome tweeter, a 25mm Diamond Dome in a Nautilus tube-loaded housing, and a single 7in Continuum cone bass/midrange driver fitted with an anti-resonance plug. For optimum discretion when installed, the Continuum cone is given a dark finish. Flowport is the third technical feature Bowers & Wilkins lists for the model.

  The speaker is quoted at 89dB sensitivity into a nominal 8 ohm load with a recommended amplifier power of 120W, and a frequency range of 35Hz to 35kHz at -6dB.

  Installation is into a 395mm by 231mm cut-out behind a 411mm by 247mm frame, with the bezel protruding 8mm from the wall surface. Net weight is 3.5kg, and a matching back box, BB CWM8.5, is offered.

  CWM8.5 D sits below the three-way CWM8.3 D in the same Reference Series.
specs: |-
  - Description: 2-way in-wall loudspeaker
  - Technical features: Diamond Dome Nautilus tube-loaded tweeter, anti-resonance plug, Flowport
  - Drive units: 1x 25mm (1in) Diamond Dome Nautilus tube-loaded tweeter, 1x 180mm (7in) Continuum cone bass/midrange driver with anti-resonance plug
  - Frequency range (-6dB): 35Hz to 35kHz
  - Recommended amplifier power: 120W
  - Sensitivity: 89dB
  - Nominal impedance: 8 ohms
  - Frame height: 411mm (16.2in)
  - Frame width: 247mm (9.7in)
  - Cut-out height: 395mm (15.5in)
  - Cut-out width: 231mm (9.1in)
  - Protrusion: 8mm (0.3in)
  - Net weight: 3.5kg
  - Matching back box: BB CWM8.5
  - Finish: White
