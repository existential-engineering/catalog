description: Accomplished yet compact in-wall design with Diamond Dome tweeter
  and 7-in Continuum mid/bass driver.
details: |-
  CWM8.5 D is a two-way in-wall loudspeaker. It offers exceptionally high performance from a compact loudspeaker.

  It features a decoupled Diamond dome tweeter and a single 7inch bass/mid Continuum driver with anti-resonance plug.

  For optimum discretion when installed, the Continuum cone is given a dark finish.

  Other technical features include a Diamond Dome Nautilus tube-loaded tweeter, an anti-resonance plug and Flowport.

  The loudspeaker is designed to be used with the matching BB CWM8.5 back box.
specs: |-
  - Description: 2-way in-wall loudspeaker
  - Technical features: Diamond Dome Nautilus tube-loaded tweeter, anti-resonance plug, Flowport
  - Drive units: 1x ø25mm (1in) Diamond Dome, Nautilus tube-loaded tweeter
  - Drive units: 1x ø180mm (7in) Continuum cone bass/midrange driver with anti-resonance plug
  - Frequency range (-6dB): 35Hz - 35kHz
  - Recommended amplifier power: 120W
  - Sensitivity: 89dB
  - Nominal impedance: 8Ω
  - Frame height: 411mm (16.2in)
  - Frame width: 247mm (9.7in)
  - Cut-out height: 395mm (15.5in)
  - Cut-out width: 231mm (9.1in)
  - Protrusion: 8mm (0.3in)
  - Net weight: 3.5kg
  - Back box: BB CWM8.5
  - Finish: White
