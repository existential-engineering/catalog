details: |-
  An exciting new addition to the Streamliner Collection, the G2210 Streamliner Junior Jet Club is a stripped-down workhorse that's built to take a beating. With aggressive attack and quick response, the sleek Junior Jet Club is designed for the down and dirty guitarist who demands no-nonsense tone at an affordable price.

  Broad'Tron humbucking pickups deliver robust lows and a throaty midrange, controlled via master volume and tone controls with three-way pickup switching. A compensated wrap-around bridge keeps things simple, while the bound nato body, thin 'U' profile neck, and 12"-radius laurel fingerboard with 22 medium jumbo frets make for easy playing.
