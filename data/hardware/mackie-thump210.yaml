details: |-
  Thump210 gives you powerful 1400W Class-D amplification in a compact loudspeaker that's perfect for gigging DJs and bands, venues and more. Packed with incredibly useful features, Thump210 makes gigs run smoother with feedback elimination and music ducking built right in. And with dual TRS / XLR inputs plus a stereo 1/8" aux input, you can plug in all of your gear without odd cables and adapters.

  Mackie Thump210 offers astounding power for its size. Combining Class-D amplification, 1" compression driver and 10" woofer, this loudspeaker offers the room-filling performance that makes Mackie a legendary name in live sound.

  Gigging DJs and musicians feel every extra ounce of weight, and venue owners have to account for each square inch of precious space on the floor. Mackie Thump210 delivers the volume you need while staying conveniently small and lightweight for a professional loudspeaker.
specs: |-
  - 1400W ultra-efficient Class-D amplifier
  - Built-Like-A-Tank to conquer every gig while lightweight for easy loading
  - 10" high-performance woofer
  - 1" compression driver
  - Feedback Eliminator
  - Music Ducking
  - Standard Pole Mount + Wedge Design for Floor Monitor Use
  - Frequency Range (-10 dB): 52 Hz - 23 kHz
  - Maximum SPL Peak: 127 dB
  - Built-in Feedback Eliminator reduces squeals and out of control rumble
  - Music Ducking mode automatically reduces level of Ch.2 when Ch.1 receives signal
  - Monitor wedge provides optimal angle for use as floor monitor
  - Universal Power Supply (100-240VAC)
  - Size (H x W x D): 22.4 x 13.0 x 12.8 in / 569 x 330 x 325 mm
  - Weight: 25.4 lb / 11.5 kg
