description: Mackie Thump210 is a compact 10” 1400W powered loudspeaker
  featuring proven sound quality with built-in Feedback Eliminator and Music
  Ducking mode. Lightweight and Built-Like-A-Tank, Thump210 is the ultimate
  compact loudspeaker for mobile PA systems, DJs, bars, and more.
details: |-
  Thump210 gives you powerful 1400W Class-D amplification in a compact loudspeaker that is perfect for gigging DJs and bands, venues and more. Packed with incredibly useful features, Thump210 makes gigs run smoother with feedback elimination and music ducking built right in. And with dual TRS / XLR inputs plus a stereo 1/8” aux input, you can plug in all of your gear without odd cables and adapters.

  Mackie Thump210 offers astounding power for its size. Combining Class-D amplification, a 1" compression driver and a 10” woofer, this loudspeaker offers the room-filling performance that makes Mackie a legendary name in live sound.

  Hit the Feedback Eliminator button and the speaker deals with the squeal that comes from getting too close to the microphone. Music Ducking automatically turns channel 2 down whenever you speak into the mic on channel 1, so announcements do not need level changes.

  The built-in 2-channel mixer on the rear panel combines the combo input jacks and the 1/8" line in, letting you mix multiple sources in a single speaker. The mixed signal is also available from the XLR thru output for sending to another speaker.
specs: |-
  - 1400W ultra-efficient Class-D amplifier
  - Frequency Range (-10 dB): 52 Hz – 23 kHz
  - Maximum SPL Peak: 127 dB
  - 10" high-performance woofer
  - 1" compression driver
  - Channel 1 features an XLR/TRS input that accepts mic or line signals
  - Channel 2 features an XLR/TRS line input plus stereo 1/8-inch input
  - Thru output contains audio from both input channels
  - Built-in Feedback Eliminator reduces squeals and out of control rumble
  - Music Ducking mode automatically reduces the level of channel 2 when channel 1 receives signal
  - Standard pole mount
  - Monitor wedge provides optimal angle for use as a floor monitor
  - Universal Power Supply (100-240VAC)
  - Size (H x W x D): 22.4 x 13.0 x 12.8 in / 569 x 330 x 325 mm
  - Weight: 25.4 lb / 11.5 kg
