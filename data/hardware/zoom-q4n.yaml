description: With its 10 advanced lighting presets, the Q4n captures Zoom's
  highest-quality video, from bright daylight to a low-lit club to striking
  sunset, paired with Zoom audio quality for a combination no other camera can
  match.
details: |-
  The Q4n Handy Video Recorder pairs a 160 degree wide-angle lens with Zoom's stereo microphones, recording video and audio together in MOV format or audio alone in WAV and AAC. Ten Scene options cover lighting from bright daylight to a low-lit club, with five steps of digital zoom and a self-timer.

  Video is captured in MPEG-4 AVC/H.264 across five HD modes up to 3M HD (2304 x 1296) at 30 fps and 24 Mbps, with 720p available at 60 fps, plus two WVGA modes. A 2.0 inch full-colour rotating touchscreen LCD handles framing and playback, and a micro HDMI output feeds an HDTV with NTSC or PAL selectable.

  The built-in stereo microphones can be set to A/B or X/Y and handle up to 140 dB SPL, with analog-style level control, onscreen metering and three Auto Gain presets. A stereo mini jack takes an external source with plug-in power, and a combined line and headphone jack plus a built-in speaker cover monitoring. A windscreen and a low-cut filter are supplied for wind and rumble.

  Over USB the Q4n works as a webcam and USB microphone with low-latency direct monitoring, as a 44.1 kHz 16-bit audio interface and as mass storage, including with an iPad through the Apple Camera Connection Kit. Recording goes to SD, SDHC and SDXC cards up to 128 GB, and the rechargeable lithium-ion battery runs more than three hours and charges over USB or from the optional AD-17 adapter.
specs: |-
  - Recording media: SD/SDHC/SDXC cards (Class 10 or higher, up to 128 GB)
  - Image sensor: 1/3-inch 3-megapixel CMOS sensor
  - Lens: fixed focus (36 cm to infinity), F2.0, focal distance approx. 16.6 mm (35 mm equivalent), 160 degree field of view
  - Video format: MPEG-4 AVC/H.264 (MOV)
  - Video resolutions: 3M HD (2304 x 1296) 30 fps 24 Mbps, HD1080p 30 fps 24 Mbps, HD1080p 30 fps 16 Mbps, HD720p 60 fps 15 Mbps, HD720p 30 fps 8 Mbps, WVGA 60 fps 8 Mbps, WVGA 30 fps 5 Mbps
  - Audio formats: WAV (16/24-bit, 44.1/48/96 kHz), AAC (64 to 320 kbps, 48 kHz)
  - Audio functions: lo-cut filter, auto gain
  - Image functions: digital zoom (x0.75/x0.85/x1.00/x1.30/x1.50), scene selection (Auto, Concert Lighting, Night, Concert-Low Light, Dance Club, Jazz Club, Concert Hall, Rehearsal-Studio, Garage, Outdoor, Sunset)
  - Self-timer: off, 3 sec, 5 sec, 10 sec
  - Display: 2.0 inch full-color touchscreen LCD
  - Built-in mic: 120 degree A/B and 120 degree X/Y stereo, maximum sound pressure input 140 dB SPL, input gain -30 to +44 dB
  - External input: stereo mini jack, input gain minus infinity to +26 dB, input impedance 2 kohm or more, supports plug-in power
  - Outputs: combined line/headphones stereo mini jack, micro HDMI Type D connector, built-in 400 mW 8 ohm mono speaker
  - USB mass storage: USB 2.0 High Speed
  - USB audio interface: USB 2.0 Full Speed, 44.1 kHz sampling rate, 16-bit
  - USB webcam: WVGA/720p video size, 48 kHz 16-bit audio
  - Audio interface and mass storage operation with iPad is supported
  - USB bus power supported
  - Power supply: lithium-ion battery, DC 4.2 V maximum, DC 3.7 V nominal, 1,050 mAh. ZOOM AD-17 AC adapter sold separately, DC 5 V / 1 A
  - Recharging times: about 3 hours using USB, about 2 hours using ZOOM AD-17
  - Battery operation time: about 3 hours or more (recording 720p/30 fps video with LCD closed)
  - External dimensions: 119 x 51 x 62 mm with mic stored, 119 x 39 x 86 mm with mic extended
  - Weight: 178.6 g with battery, 155.9 g without battery
