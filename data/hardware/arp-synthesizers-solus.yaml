description: >-
  A portable monophonic analog synthesizer from ARP positioned between the Axxe
  and Odyssey, featuring dual oscillators, pulse-width modulation, and a digital
  ring modulator.
details: |-
  The ARP Solus was designed specifically for portability, shipping in a well-built road case for musicians who needed a capable synthesizer on the go. Positioned between ARP's simpler Axxe and the more complex Odyssey, it offered a practical middle ground for synthesists seeking versatility without excessive bulk.

  Two VCOs produce sawtooth and pulse waveforms, routed through ARP's characteristic 4-pole low-pass filter with cutoff, resonance, and modulation from LFO, ADSR, or keyboard tracking. The single LFO can modulate the filter, envelope, or pulse width, while an ADSR envelope shapes the VCA output. Pitch control uses a knob rather than a traditional wheel, reflecting the instrument's streamlined design philosophy.

  A distinctive feature is the FM slider that allows an external sound source to be ring-modulated through VCO 1, effectively transforming the Solus into an analog ring modulator capable of producing unusual and experimental timbres. This dual functionality expanded its utility well beyond conventional synthesis tasks.

  The Solus gained notable recognition through professional use by Tangerine Dream, establishing its credentials in progressive electronic music. CV/Gate output enables connection to other analog gear for expanded performance setups.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCO (sawtooth, pulse)
  - LFO: 1 (modulates filter, envelope, or pulse width)
  - Filter: 4-pole low-pass with cutoff, resonance
  - VCA: 1 ADSR envelope
  - Keyboard: 37 keys
  - Control: CV/Gate output
  - Memory: None
releaseDate: "1980"
