description: >-
  The Roland JX-8P is a 6-voice analog polysynth from 1985 featuring two DCOs
  per voice, a 61-note velocity and aftertouch sensitive keyboard, and 64 patch
  memory locations. While its digitally controlled oscillators provide excellent
  tuning stability, the trade-off is a somewhat thinner and brighter sound
  compared to fully analog designs. The optional PG-800 programmer gives
  hands-on access to all synthesis parameters, compensating for the main panel's
  single data slider editing approach.
details: |-
  The JX-8P was Roland's mid-1980s answer to the demand for affordable polyphonic analog synthesizers with modern MIDI control. It uses digitally controlled oscillators (DCOs) rather than traditional VCOs, providing rock-solid tuning stability while retaining an analog signal path through its voltage-controlled filters and amplifiers.

  Programming is handled via a parameter-select and data-slider system on the front panel, which sacrifices immediate hands-on tweaking for a cleaner layout. For deeper editing, the optional PG-800 programmer connects to provide dedicated knobs and sliders for every synthesis parameter, making it a much more expressive instrument.

  The JX-8P features a comprehensive MIDI implementation with In, Out, and Thru connections, and supports external memory cartridges for expanding beyond its internal 64-patch storage. It has been used by notable artists including Biosphere, 808 State, Tangerine Dream, The Shamen, Depeche Mode, and The Cure.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 DCOs per voice (12 total)
  - Filter: VCF (voltage-controlled filter)
  - Envelope: ADSR
  - Effects: Portamento
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 64 patches plus external cartridge support
  - MIDI: In, Out, Thru
