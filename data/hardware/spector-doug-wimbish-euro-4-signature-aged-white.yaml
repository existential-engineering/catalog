details: |-
  Tap deeper into Doug Wimbish ' s Spector arsenal with the DW Euro 4 Aged White Signature Model. In 2025, we launched the new and improved Doug Wimbish line of Euro basses, featuring a first for Spector — an aged Amber Stain option. This year, we ' re excited to continue the DW aged line with the all-new Doug Wimbish Euro 4 Aged White Signature Model. This time, we ' re diving into Doug ' s incredible arsenal of vintage Spector ' s to recreate one of his lesser-known basses: his white NS-2. The Doug Wimbish Euro 4 Aged White Signature Model features a lightly aged nitro white finish for a beautifully broken-in look and feel. Additional specifications include maple body wings, the slim DW neck carve with a narrow 1.5" nut width, a rosewood fingerboard with mother-of-pearl crown inlays, and gold Spector hardware. The electronics package features a rarity for our Euro line — an EMG Jazz configuration — paired with our recently developed Legacy Preamp (made in collaboration with Darkglass Electronics), which offers the classic, 1980s-inspired 2-band EQ.
specs: |-
  - Light Aged White Finish
  - 34 " Scale
  - Slim Doug Wimbish Neck Carve
  - 1.5" Nut
