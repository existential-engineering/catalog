details: |-
  4-channel digital mixer.

  The DJM-850 combines future-proof technology with all your favourite features. Primed and ready for you to plug and play with software on your PC/laptop, it boasts studio-quality FX for endless creative possibilities and an unrivalled DJing experience. The mixer’s Beat Colour FX uses side-chaining to add another layer of manipulation to the Sound Colour FX. An integrated, high-performance, 4-stereo-channel sound card and simultaneous input and output ensures there is no deterioration of sound quality. Plus 3 sampling rates enable music recording, production and DJing.

  USB sound card. A built-in USB sound card allows simultaneous input/output of stereo signals from 4 ins and 4 outs, while 96 kHz/24-bit high-sampling processing ensures the audio quality. Connect the unit to your laptop or computer via USB and the settings utility tool will automatically open, allowing you to configure the mixer, sound card and audio routing to suit your preferences.

  Multi-layered FX. Trigger one of 13 enhanced Beat FX then hit the BEAT button to manipulate the level/depth parameters depending on how fast you twist the dial. Or take Sound Color FX to a new level with Beat Color FX, which adds new parameters in time with the beat.

  rekordbox dvs. When you use our rekordbox dj software, you can buy the rekordbox dvs Plus Pack to get low latency scratch control with music from your rekordbox library.

  Scratch it. Plug a laptop or CDJ directly into the mixer for DVS (Digital Vinyl System) control of supported software. * Doesn't support Serato SCRATCH LIVE™
