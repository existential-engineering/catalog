description: The EXO 28 is the largest monitor of the EVE Audio EXO Series, an
  active 2-way studio monitor with an 8" coated aluminium woofer, the Precision
  AirMotion Tweeter and the GDC waveguide. It covers 37 Hz to 24 kHz at 120 dB
  maximum SPL in full space, with Ethernet access to the EVE Origin control
  software and a rear OLED display with a SMART Control Knob.
details: |-
  The EXO 28 is the largest monitor of the EXO Series, a 2-way monitor with the presence of a full-sized system. EVE Audio positions it for large studios, immersive productions and high-end mastering suites, and its controlled dispersion characteristics also suit immersive setups such as Dolby Atmos. Four M6 threaded mounting points on the underside of the enclosure simplify mounting.

  The specially developed EXO Precision AirMotion Tweeter, combined with the GDC Waveguide (Guided Directivity Control), gives clean, wide-ranging dispersion and stable imaging even at high listening levels and in acoustically complex environments, improving stereo imaging and spatial coherence in immersive formats like Dolby Atmos. The ultra-lightweight polyamide AMT delivers a very fast transient response, high efficiency and clear high-frequency reproduction with minimal distortion.

  The 8" CAL woofer (Coated Aluminium) delivers deep bass, strong transient response and high dynamics, controlled by the monitor's DSP. Its lightweight aluminium cone, resonance-damped dust cap and refined magnet system keep playback accurate and dynamic with low distortion.

  The airflow-optimized LDE enclosure (Low Diffraction Enclosure) minimizes unwanted edge reflections and supports a neutral, spatially detailed soundstage for mixing and mastering work. Optimized rear-facing bass reflex ports improve airflow for extended low-frequency response while reducing port noise.

  A rear-mounted OLED display with an integrated SMART Control Knob presents the critical system parameters and allows precise adjustment of output level, room adaptation filters and input source selection. The Ethernet connection gives access to the EVE Origin control software, calibration and firmware updates, and Wake-on-Signal and Wake-on-LAN bring the monitor out of standby. On the front panel the illuminated eve audio logo acts as a multi-color status indicator for overload protection, firmware update progress and other system states, glowing warm white in normal operation, with customizable brightness.
specs: |-
  - Frequency range (-3 dB at 1 m, full space): 37 Hz - 24 kHz
  - Woofer diameter: 8"
  - Max. SPL (full space, above 100 Hz): 120 dB
  - Max. SPL (half space, above 100 Hz): 126 dB
  - Cross-over frequency: 2200 Hz
  - Output power per speaker: 280 W
  - Tweeter: Precision AirMotion Tweeter (PAMT)
  - Waveguide technology: Guided Directivity Control (GDC)
  - Tweeter output power: 140 W / 1%
  - Woofer output power: 140 W / 1%
  - Woofer diaphragm material: Coated aluminum
  - Woofer voice coil: Air Stream Optimized Voice Coil Design
  - Dimensions: 276 x 401 x 331 mm (10.9 x 15.8 x 13 inch)
  - Weight: 11.6 kg (25.6 lb)
  - Protection limiter: Yes
  - User interface: Rear OLED display with SMART Control Knob
  - Volume: minus infinity to +10 dB
  - High-shelf filter (-5 dB to +3 dB): above 3 kHz
  - Mid EQ (-3 dB to +3 dB): 2.2 kHz
  - Desk filter cut (-5 dB to 0 dB): 400 Hz
  - Low-shelf filter (-5 dB to +3 dB): below 300 Hz
  - Max. input level: -10 dBV (max. 16.5 dBu) / +4 dBu (max. 20 dBu)
  - Input select: Balanced, Unbalanced, S/PDIF L/R/Mono
  - Standby mode: 15 min / 30 min / 60 min / off
  - Mounting point: Bottom side M6 mounting hole pattern of 50.8 x 107.9 mm
  - Standby power consumption: below 1 W
  - Idle power consumption: 7 W
  - Peak power consumption: 400 W
