details: |-
  The JHS Pedals 3 Series is a collection of pedals designed to give you affordability and simplicity without compromising quality. Each 3 Series pedal is made in Kansas City, MO, using high-quality parts, quality control, and attention to every detail.

  The JHS Pedals 3 Series Compressor is a simple and powerful compressor that will give you everything from subtle tone smoothing to a super squashed sound. The Attack and Sustain knobs allow you to dial in the compression's overall feel and response to your playing, while the Volume knob enables you to set the overall volume at unity or boosted.

  The Bright toggle engages a brighter EQ so that your tone doesn't get lost in certain situations.
