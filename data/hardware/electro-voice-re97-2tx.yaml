details: >-
  The Electro-Voice RE97-2Tx is the two-eared (dual-hook) variant of the RE97
  micro-headworn condenser microphone family. It pairs the same
  ultra-low-profile, back-electret omnidirectional capsule used in the
  single-ear RE97Tx with a wraparound design that hooks over both ears and is
  held in place by an adjustable band behind the head, giving the microphone
  meaningfully better stability during energetic movement than a single-hook
  fitness or theater headworn would offer.


  The back-electret condenser element uses an omnidirectional polar pattern,
  which delivers a full-range, natural, well balanced sound and tolerates head
  movement without dramatic level changes. The boom is interchangeable, so the
  capsule can be positioned at the corner of either the left or the right side
  of the mouth depending on the performer's preference, and the ear hooks fold
  flat for compact storage and transport.


  The cable is terminated with a TA4F (4-pin mini-XLR) connector that mates
  directly with EV wireless bodypack transmitters. The same TA4F termination can
  also be paired with the Electro-Voice TXA preamp adapter to convert the
  headworn microphone for wired phantom-powered XLR use, which makes the
  RE97-2Tx usable in fixed-installation rooms that have not migrated to
  wireless. The design is moisture resistant for live performance and
  fitness-style applications.
specs: |-
  - Mic type: Headworn (two-eared / dual hook)
  - Element: Back-electret condenser
  - Polar pattern: Omnidirectional
  - Connector: TA4F (mini-XLR, 4-pin female)
  - Wired/wireless: Wireless (compatible with all EV bodypack transmitters)
  - Mounting: Two ear hooks with adjustable behind-the-head band
  - Boom: Interchangeable left/right side placement
  - Hooks: Fold flat for storage
  - Construction: Lightweight, durable, moisture resistant
  - Compatible with TXA preamp adapter for wired XLR (phantom-powered) use
