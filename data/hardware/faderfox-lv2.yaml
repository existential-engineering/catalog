description: Special controller for sequencer software (optimized for Ableton
  Live). Setup files for Ableton Live as of version 4.1 are shipped with the
  controller.
details: |-
  LV2 is a special controller for sequencer software, optimized for Ableton Live. Setup files for Ableton Live as of version 4.1 are shipped with the controller, and the Live internal control surface 'LV2_LX2_LC2_LD2' can be taken to have all controls automapped, so the setting files are no longer necessary.

  The surface carries 6 track faders, switchable between 2 fader groups (1-6, 7-12), and 4 push-encoders for jump-free control of track-dependent and track-independent parameters, a total of 144 parameters. A main function gives fast encoder access to important functions like trackselect, slot and scene-scroll, mastervolume and clip and scene-launch. A joystick controls track-dependent and track-independent parameters, a further 30 parameters, and 2 button rows with 6 buttons and LEDs each are programmable independently in 6 keymodes for scene-launch, fx-control, mute and solo.

  Parameter feedback of LIVE button statuses is indicated by LEDs (Mute, FX). Holding down the instrument's SHIFT button gives fadermute for all controls and a faderposition view by LEDs, while a play-LED shows the beat speed. 51 LEDs in different colors display various information, with low basic lights of all LEDs for better orientation in dark club atmosphere.

  Power comes from an independent supply of 3 x AA standard or rechargeable cells with a lifetime of about 30 to 60 hours, with LED battery control, a powersave mode after 10 minutes of the last movement, and a socket for an external power adaptor (4.5-6V DC, min. 50 mA). The very compact design is a black plastic casing in desktop format (180x105x70 mm, 450 g) with a silver aluminium front plate, anodised and abrasion resistant, carrying the inscriptions. The faders, encoders and joystick are high-quality ALPS parts.

  The controller is independent of operating system and computer type (PC or Mac) due to the midi interface, so no driver is necessary, and it connects over MIDI to the computer's sound card or MIDI interface (a USB MIDI interface when the computer has none). A midi-merge function is included, the system is expandable by other micromodul controllers with easy chaining by midi connections, and it is compatible to the 1st and 2nd micromodul line, using the same cc and note numbers as the LV1, LX1, LX2, LC2 and LD2.
specs: |-
  - Special controller for sequencer software (optimized for Ableton Live)
  - Setup files for Ableton Live as of version 4.1 shipped with the controller
  - Live internal control surface 'LV2_LX2_LC2_LD2' automaps all controls
  - Independent of operating system and computer type (PC or Mac) due to the midi interface, no driver necessary
  - 6 track faders, switchable between 2 fader groups (1-6, 7-12)
  - 4 push-encoders for jump-free control of track-dependent and track-independent parameters (total of 144 parameters)
  - Main function for fast encoder access to trackselect, slot and scene-scroll, mastervolume, clip and scene-launch
  - Joystick to control track-dependent and track-independent parameters (total of 30 parameters)
  - 2 button rows with 6 buttons and LEDs each, programmable independently in 6 keymodes (scene-launch, fx-control, mute, solo)
  - Parameter feedback of LIVE button statuses indicated by LEDs (Mute, FX)
  - Fadermute for all controls by holding down the SHIFT button
  - Faderposition view by LEDs while holding down the SHIFT button
  - Play-LED to show the beat speed
  - Independent power supply by standard or rechargeable batteries, 3 x AA cell, lifetime about 30 to 60 hours
  - Powersave mode after 10 minutes of the last movement (running light)
  - LED battery control
  - Socket for an external power adaptor (4.5-6V DC, min. 50 mA)
  - Midi-merge function
  - Very compact design in a black plastic casing, desktop format 180x105x70 mm, 450 g
  - Silver aluminium front plate with anodised coating (abrasion resistant) and inscriptions
  - 51 LEDs in different colors to display various information, with low basic lights of all LEDs
  - High-quality faders, encoders and joystick from ALPS
  - Expandable system by other micromodul controllers (easy chaining by midi connections)
  - Compatible to the 1st and 2nd micromodul line (same cc and note numbers as LV1, LX1, LX2, LC2, LD2)
  - Connects over MIDI to the computer's sound card or MIDI interface (a USB MIDI interface when the computer has none)
  - Requires Ableton Live (as of version 4.1) or software which allows user assignments of continuous parameters (CC) and note commands
