description: A tribute to the legendary King of Tone overdrive, created in
  collaboration with Analog Man. Takes the coveted circuit and provides advanced
  control with changeable modes, previously hidden parameters, a bonus treble
  booster circuit, and full external control via expression, MIDI, or CV.
details: |-
  The Brothers AM is an expanded edition of Analog Man's King of Tone circuit. Rather than cloning the hand-made design, Chase Bliss created a counterpart with advanced controls, changeable modes, access to previously hidden parameters, a bonus treble booster circuit, and full external control via expression, MIDI, and CV. All settings are preset-saveable.

  Described as "simple and satisfying," the pedal features two identical multi-mode gain channels that can be stacked or combined. Each channel offers boost, overdrive, or distortion modes with adjustable gain and tone controls, delivering transparent and timeless tone.

  The bonus treble booster circuit, inspired by Analog Man's Beano Boost, enables bright and charged textures for pushing amps to new heights.

  The pedal includes 4 internal presets plus 122 via MIDI, a 100% analog signal path, true bypass, and DIP switch customization on the rear panel for further tonal fine-tuning.
specs: |-
  - Two identical multi-mode gain channels (boost, overdrive, distortion)
  - Bonus treble booster circuit (Beano Boost-inspired)
  - 4 internal presets + 122 via MIDI
  - 100% analog signal path
  - True bypass (momentary or latching)
  - MIDI control (PC, CC)
  - CV control
  - Expression control
  - DIP switch customization (rear panel)
  - 9V DC Center Negative (~200 mA)
  - Mono input/output
