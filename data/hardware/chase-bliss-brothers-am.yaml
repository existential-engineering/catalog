description: Made in collaboration with Analog Man, Brothers AM is a tribute to the legendary King of Tone overdrive. It takes that coveted circuit and adds advanced control and a couple of bonus features without changing what made it sound so good in the first place.
details: |-
  Brothers AM is an expanded edition of Analog Man's King of Tone circuit, created in collaboration with Analog Man himself. Rather than trying to clone the hand-made original, Chase Bliss built a counterpart that lets players enjoy the coveted circuit in a new way: modes and previously hidden parameters become adjustable controls that can be changed on the fly, and every aspect can be controlled externally via expression, MIDI, or CV, with everything preset-saveable.

  At its heart are two identical, multi-mode gain channels that can be stacked, combined, or switched between. Each channel offers boost, overdrive, or distortion modes with independent gain and tone controls, and a second volume knob can be turned into a master volume via a rear DIP switch. The pedal ships with four internal presets, including a recreation of Analog Man's own preferred King of Tone settings, with a second bank of two more presets accessible via DIP switch for a total of four onboard.

  A bonus treble booster circuit, inspired by Analog Man's Beano Boost, sits at the very front of the signal chain and is linked to and engaged by Channel 1, allowing a triple stack of gain circuits for bright, cutting textures.

  External control runs through two combined jacks on top of the pedal: MIDI/EXT (a 1/4-inch TRS jack that accepts a Chase Bliss MIDIbox for full MIDI control over every parameter and up to 122 presets, or a normally-open momentary footswitch to bypass Channel 2) and EXP/CV (a 1/4-inch TRS jack accepting an expression pedal or 0-5V control voltage). Rear DIP switches assign CV/expression control to any combination of knobs, set rise/fall sweep direction and range, engage HI GAIN, MOTOBYP (momentary bypass), and PRES LINK (links TONE and PRESENCE).
specs: |-
  - Mono input/output
  - Two identical multi-mode gain channels (boost, overdrive, distortion)
  - Bonus two-voice treble booster circuit (Beano Boost-inspired), engaged via Channel 1
  - 4 internal presets (2 banks of 2), 122 presets via MIDI
  - MIDI control (PC, CC) via 1/4-inch TRS MIDI/EXT jack (requires Chase Bliss MIDIbox)
  - CV control (0-5V range) via EXP/CV jack
  - Expression control via EXP/CV jack
  - Momentary or latching bypass (MOTOBYP DIP switch)
  - Rear DIP switches: HI GAIN, MOTOBYP, PRES LINK, MASTER, BANK
  - Three internal trim pots for treble booster (input impedance, output, bias)
  - 100% analog signal path
  - True bypass
  - Power: 9V DC, center negative, ~200 mA
