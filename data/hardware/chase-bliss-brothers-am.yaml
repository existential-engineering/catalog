description: Brothers AM is a tribute to the legendary King of Tone overdrive,
  made by Chase Bliss with Analog Man himself. It takes that coveted circuit,
  gives you advanced control, and tosses in a couple of bonus features without
  changing what made it sound so good in the first place.
details: |-
  Made in collaboration with Analog Man, Brothers AM is a tribute to the legendary King of Tone overdrive. Analog Man's level of hand-made care is unmatched, with each King of Tone made entirely by hand from near-unobtainable parts, so rather than trying to clone the circuit, Chase Bliss worked with Analog Man to create an expanded counterpart that lets players enjoy it in a new way.

  The modes, hidden settings, and preset options from the King of Tone are available as adjustable controls that can be changed on the fly. At its heart are two identical, multi-mode gain channels that can be stacked, combined, and switched between boost, overdrive, or distortion modes, each with independent gain and tone controls. The second volume knob can be turned into a master volume, and presence and tone controls can be linked, via internal dip switches.

  Brothers AM includes a bonus circuit: a treble booster inspired by Analog Man's Beano Boost, sitting at the very front of the signal chain and engaged by Channel 1, enabling a triple stack of gain circuits.

  The pedal ships with four internal presets (two banks of two), including a recreation of Analog Man's own preferred King of Tone settings. Every control, including the dip switches, can be saved to a preset, and everything can also be controlled externally via MIDI, CV, or expression.
specs: |-
  - Mono I/O
  - Two identical multi-mode gain channels (boost, overdrive, distortion modes)
  - Independent gain and tone controls per channel
  - Bonus treble booster circuit (Beano Boost-inspired), engaged via Channel 1
  - 4 internal presets (2 banks of 2), 122 presets via MIDI
  - MIDI control (Program Change, Control Change) via MIDI/EXT jack
  - CV control (0-5V) over every knob
  - Expression control over every knob
  - Internal dip switches: HI GAIN, MOTOBYP, PRES LINK, MASTER, BANK
  - Three internal trim pots for treble booster (input impedance, output, bias)
  - Momentary or latching bypass
  - 100% analog signal path
  - True bypass
  - Power: 9V DC, center negative, ~200 mA
