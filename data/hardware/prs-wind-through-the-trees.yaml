details: |-
  The PRS Wind Through the Trees dual analog flanger pedal is best described as two flangers fighting each other, resulting in a sound reminiscent of the wind whipping through the trees. With Manual, Depth, and Rate controls per flanger as well as global Regeneration and Added Highs, Wind Through the Trees offers nearly endless tonal possibilities. Bottom line, Wind Through the Trees offers hours of fun for any player. PRS pedals were created to be high-end pieces of audio gear. Designed by PRS Guitars in Stevensville, MD, USA.
