description: The Vader Bass was the first Kiesel bass to take advantage of a
  headless construction's multiple benefits, as seen in the compact body that
  capitalizes on every detail. A 30" scale length is available to complement the
  modest size as opposed to the standard 34" scale length, and modern features
  such as the tapering top bevel run throughout the design.
details: |-
  The VADER BASS was the first Kiesel bass to take advantage of a headless construction's multiple benefits, as seen in the compact body that capitalizes on every detail.

  A 30" scale length is available to complement the modest size as opposed to the standard 34" scale length.

  Modern features are littered throughout the design, such as the tapering top bevel.
specs: |-
  - Headless construction
  - Construction: neck-through
  - Scale length: 34" standard, with a 30" short scale available and multiscale options of 33.5" to 35"
  - Frets: 24 medium-jumbo stainless steel frets, .103" wide x .048" tall
  - Fingerboard: ebony with 14" radius
  - Neck: tung-oiled maple with two high-strength carbon-fiber reinforcing rods and fully-adjustable dual action truss rod
  - Body: alder
  - Pickups: Kiesel Radium KRH Radius humbuckers
  - Electronics: 18V active/passive electronics, master volume with push-pull active/passive switch, pickup blend, mid cut or boost with sweep control, stacked concentric bass/treble cut or boost
  - Bridge options: Hipshot A-Style bridge at .748" (19mm) or .64" (16.25mm) spacing, or Hipshot multiscale headless bridge at .748" (19mm) or .64" (16.25mm) spacing
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: black
  - Strings: Dunlop Super Brights
  - Neck width options: 1.53", 1.76" or 2.02" wide at the nut
  - Dimensions: 38.25" to 38.75" long, 1.625" to 1.7" thick, 13.625" to 13.925" wide depending on configuration
  - Weight: 8 to 8.75 lbs
  - Active electronics run on internal batteries rather than an external power jack
  - Offered in several string counts and in standard or multiscale layouts, configured to order; the gallery shows 4-string, 5-string and 5-string multiscale builds
  - Built to order with a choice of body, top, fingerboard and finish options
