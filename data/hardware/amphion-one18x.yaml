details: |-
  One18X is the next evolutionary stage of the revered One18 — the trusted 'modern workhorse' model. A state-of-the-art tweeter and newly engineered crossover enhance its clarity, resolution, and transient precision. Now benefiting from a highly linear, ultra-low distortion tweeter, the One18X not only preserves its previous iconic status as a well translating modern nearfield, it raises the benchmark of a trusted studio monitor even further.

  Reflex ports are the cheapest way to get bass out of a small cabinet. Using a carefully tuned passive radiator improves bass performance and energy transfer by loading the room more evenly and naturally.

  The crossover operates at 1600 Hz, allowing the speakers to function in point-source manner, which leads to industry-leading phase coherence and pinpoint imaging. Timing properties between drivers are further improved as the waveguide aligns the voice coils of the tweeter and woofer to the same level.

  Amphion's DSP-free acoustic design minimizes electrical complexity, allowing users to harness the full power of the latest signal processing devices without interference from additional processing in the monitor signal path.

  The One18X delivers clear and memorable sound even at lower listening volumes with even dispersion that extends the sweet spot beyond a single listening position.
specs: |-
  - Operating Principle: Two-way, passive radiator
  - Tweeter: 1" titanium
  - Woofer: 6½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 8 Ω
  - Sensitivity: 85 dB @ 2.83V/1m
  - Frequency Response: 45–55,000 Hz ±3dB
  - Power Recommendation: 100–350 W
  - Dimensions (H×W×D): 380×190×305 mm
  - Weight: 10 kg (22 lbs)
  - Manufacturing: Handmade in Finland
