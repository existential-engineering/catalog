details: |-
  blooper is a performance looper with additive sound design. The dream of blooper was to merge high-fidelity looping with creative manipulation, allowing you to steer recordings to new and extraordinary places. Sync, loop and layer, then edit your creation with two channels of immediate, hands-on modifiers. Save, come back later, and keep going.

  In Additive mode, any modifications made to a loop are recorded into the overdubs, like live editing. This includes knob movements: if you hear it, so does blooper. Cook up radical breaks and transitions in real-time, or loops that continuously evolve. The Layers control can be used at any time to jump back to where you began, offering 8 levels of undo/redo mapped to a single knob.

  blooper has two channels of modifiers that can be used simultaneously to contort and reimagine loops: Smooth Speed, Dropper, Trimmer, Stepped Speed, Scrambler, a dual-mode Filter, Swapper, Stutter, Speed Trimmer, Stretcher, Stopper, and Pitcher, each bending time, silence, pitch, or continuity in a different way. A Stability control ages and analog-izes loops, gradually introducing wow, flutter, noise, and filtering reminiscent of an old tape reel.

  blooper can save and recall up to 16 loops with their layers preserved. It features advanced connectivity and customization options including MIDI, CV and expression control, external footswitch control, syncing, and internal modulation (ramping) of any or all of its knobs, plus a USB connection to the BLIP web interface for downloading loops and customizing modifier behavior.
specs: |-
  - Mono I/O
  - Loop saving (16)
  - Internal modulation (Ramping)
  - MIDI (PC, CC and Clock)
  - CV (control and sync)
  - Expression control
  - External footswitch control
  - USB customization
  - Analog dry thru
  - Buffered bypass
  - 9V Center Negative ~150 mA
