description: Performance looper with additive sound design. Merges high-fidelity
  looping with creative manipulation, allowing you to steer recordings to new
  and extraordinary places with two channels of hands-on modifiers.
details: |-
  Blooper is a performance looper with additive sound design from Chase Bliss. It merges high-fidelity looping with creative manipulation, allowing you to steer recordings to new and extraordinary places.

  Sync, loop and layer, then edit your creation with two channels of immediate, hands-on modifiers. Additive mode lets you record modifiers directly into your loop, building up layers of sonic transformation.

  The pedal features 8 layers of undo/redo for time jumps, letting you move freely through your creative decisions. You can save and transfer up to 16 loops for later recall.

  Age and analog-ize your loops with the Stability control, adding lo-fi character and unpredictability to your recordings. Internal ramping provides automated modulation of parameters.

  Blooper supports MIDI (Program Change, Control Change, and Clock), CV control and sync, expression pedal input, and external footswitch control. USB connectivity allows for deeper customization.
specs: |-
  - Mono I/O
  - 16 loop save slots
  - 8 layers of undo/redo
  - Internal modulation (Ramping)
  - MIDI support (PC, CC, Clock)
  - CV control and sync
  - Expression control
  - External footswitch control
  - USB customization
  - Analog dry thru
  - Buffered bypass
  - Power: 9V Center Negative, ~150 mA
