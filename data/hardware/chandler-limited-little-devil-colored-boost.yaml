description: Wade called this pedal a Colored Boost for a reason! It's not a
  clean boost, though it's not a fuzz either. The Little Devil Colored Boost can
  gently color your Fender or drive your old Marshall into oblivion.
details: |-
  The Little Devil Colored Boost is a unique guitar pedal that occupies the space between a clean boost and a fuzz. Designed by Wade Goeke of Chandler Limited, it can gently color the tone of a Fender-style amplifier or drive a vintage Marshall into full saturation.

  At the heart of the Little Devil Colored Boost is a Class A amplifier design paired with a selectable Feedback/Bias control. This six-position switch offers presets ranging from slightly fuzzy to an aggressive in-your-face Plexi sound, each producing its own style of harmonic distortion and clipping.

  The Feedback/Bias control delivers soft clipping, hard clipping, clipping on the top, bottom, or both sides of a sine wave, along with significant changes in frequency response with each click. Capable of up to 39 dB of boost, the pedal can range from gentle sustain to screaming vintage tones.

  Additional controls include a Highs knob and a Boost Range selector, all complemented by true bypass switching. The circuit is solid-state, using silicon transistors.

  The pedal has been used on recordings by Avett Brothers, Green Day, Blink-182, and Jason Mraz, with endorsement from engineers including Ryan Hewitt and Joe Chiccarelli.
