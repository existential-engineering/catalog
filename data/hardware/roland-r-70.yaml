description: >-
  The Roland R-70 is a full-sized digital drum machine with 210 sample-playback sounds, extensive
  pattern sequencing, built-in effects, and a unique positional pad for expressive performance.
details: |-
  Released in 1992, the Roland R-70 Human Rhythm Composer arrived as a comprehensive drum machine
  aimed at musicians seeking realistic and versatile percussion programming. Its 210 sounds drawn
  from sample-playback ROM deliver convincing acoustic drum kits alongside electronic percussion,
  covering a broad range of musical styles from pop and rock to hip-hop and electronic music.

  The sequencer section provides 100 programmable patterns with both real-time and step input modes,
  chainable into up to 20 songs. A standout feature is the positional pad, which allows any sound
  to be assigned and played expressively with position-sensitive response, adding a performance
  dimension often lacking in drum machines of the era. The built-in effects section includes reverb,
  flanger, delay, and chorus, eliminating the need for external processing in many situations.

  The R-70 earned its place in notable studios, with Nine Inch Nails and the Pet Shop Boys among
  its documented users. Its full-sized desktop form factor, MIDI connectivity, and intuitive
  programming interface made it a popular choice for both studio production and live performance
  throughout the 1990s.
specs: |-
  - Sounds: 210 via sample-playback ROM
  - Patterns: 100 (real-time or step input)
  - Songs: 20 maximum
  - Effects: Reverb, flanger, delay, chorus
  - Features: Positional pad with assignable sounds
  - Control: MIDI
  - Format: Desktop
releaseDate: "1992"
