description: >-
  Crafted in partnership with Darkglass Electronics, the DarkRay brings a
  cutting-edge 2-band EQ preamp with three voicings — Clean, Alpha (distortion),
  and Omega (fuzz) — to the StingRay Special platform.
details: |-
  Crafted in partnership with Darkglass Electronics, renowned for their expertise in bass accessories, the DarkRay unleashes a universe of sonic innovation. At its core lies a cutting-edge 2-band EQ preamp custom-crafted by Darkglass, offering three distinct modes: Clean, Alpha (distortion), and Omega (fuzz).

  Users can dial in their perfect tone with the onboard gain knob and blend control, seamlessly mixing pristine cleans with aggressive fuzz while preserving low-end power. The intuitive LED ring and 3-way lever switch make mode selection a breeze.

  The DarkRay is every bit a StingRay Special and boasts a neodymium humbucking pickup, roasted maple neck, sleek contoured body, 22 stainless steel frets, and that iconic 3+1 headstock configuration.

  The Darkglass preamp provides two highly regarded drive circuits — Alpha (tight distortion) and Omega (fuzz) — both mixable via the onboard gain knob and blend control with no low-end loss.
specs: |-
  - Body: Select hardwoods; 13-1/2" wide, 1-5/8" thick, 44-7/8" long
  - Body finish: High gloss polyester (except Stealth Black)
  - Neck: Roasted maple
  - Neck finish: Gunstock oil and hand-rubbed wax blend
  - Neck width: 1-11/16" at nut, 2-1/2" at last fret
  - Neck radius: 11"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Ebony (Roasted Maple on Gold Bar)
  - Fret markers: Dot inlay
  - Frets: 22 high-profile wide
  - Scale length: 34"
  - Pickup: Single humbucking with neodymium magnets
  - Electronics: Custom Darkglass 2-band active preamp with Alpha and Omega distortion circuits
  - Controls: Volume, gain, blend, treble, bass
  - Switching: 3-way lever distortion selector (Preamp Only / +Alpha / +Omega)
  - Bridge: Vintage Music Man top-loaded, black-plated steel with vintage black-plated saddles
  - Pickguard: Black
  - Tuning machines: Custom Music Man lightweight
  - Electronic shielding: Graphite acrylic resin coated cavity; black aluminum control cover
  - Strings: 45w-65w-80w-100w (Super Slinky Bass #2834)
