details: |-
  The Monterey 69 is a custom shop send-off for the Monterey Rotary Fuzz Vibe, the pedal Keeley first released in July 2016, built as a run of 50 pieces that the maker states will never be manufactured again. It is a hot rodded take on the original circuit, with the gain stage replaced by the Blacktop Fuzz circuit for a wider, fully articulated fuzz, while the modulation side, the expression pedal input and the order switch were carried over. The enclosure gets a two-tone textured black and grey Blacktop treatment with a black backplate and black aluminium knobs.

  There are two channels, configurable for five sounds. The right footswitch engages the fuzz channel, a two-transistor fuzz built around vintage Fairchild Semiconductor transistors, chosen as moderate gain devices that avoid the temperature sensitivity of germanium. The modulation channel offers a rotary speaker simulation, a vibe, and a harmonic wah, each with an octave control that adds an octave up when turned clockwise from centre, an octave down when turned counter-clockwise, and no octave at the centre position.

  The Les Rotary setting joins a lower drum and upper horn into one effect, simulating the cabinet with very short reverberated reflections for a doubling effect and using a Doppler effect for a chorused sound; the Octave control sets horn volume. With Rate off and the fuzz engaged, Depth and Octave become a speaker cabinet simulation. The Kool Vibe setting combines phasing and tremolo at key frequencies and models the pulsing of a photocell based effect. The Harmonic Wah section covers a cocked wah, an auto wah driven by pick attack, a harmonic wah voiced like a brown face amp's harmonic tremolo but centred on wah frequencies, and a conventional foot-controlled wah when an expression pedal is connected.

  An expression pedal connected to the EXP input controls the rate of the Les Rotary and Kool Vibe settings, and the frequency in the Harmonic Wah setting. An order switch on the jack side swaps the fuzz and modulation blocks. No expression pedal is included, and the pedal is not battery powered: it requires a standard 9V 100mA negative tip supply.
specs: |-
  - Two channels, configurable for five sounds
  - Blacktop Fuzz circuit using vintage Fairchild Semiconductor transistors
  - Modulation side: Les Rotary speaker simulation, Kool Vibe, Harmonic Wah with auto wah and cocked wah
  - Octave control: octave up, octave down or no octave at centre
  - Expression pedal input controls rate in the rotary and vibe settings, frequency in the wah setting
  - Order switch swaps the fuzz and modulation blocks
  - Two-tone textured black and grey enclosure with black backplate and black aluminium knobs
  - Power: standard 9V 100mA negative tip supply, no battery operation
  - Limited to a run of 50 units, not to be manufactured again
  - No expression pedal included
