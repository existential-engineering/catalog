description: The acoustic electric 21-chord autoharp reissue, which can be
  plugged directly into an amplifier, PA system, or recording console, with
  onboard volume and tone controls.
details: |-
  Silvertone has partnered up with ChromAharP to reissue the legendary instrument from the 1960's. The original 15 chord version has been updated to 21 chords! Construction and design features include torsion-tight tuning pins, pre-stressed maple frame, and a maple top and back. The following 21 chord bars enable the player to literally play hundreds of songs: Eb, Bb, F, C, G, D, A, F7, C7, G7, D7, A7, E7, B7, Ab, Bb7, Cm, Gm, Dm, Am, Em.

  The Acoustic Electric model adds a pickup with onboard Volume and Tone controls and a 1/4-inch output jack, so it can be plugged straight into an amplifier, PA system, or recording console.
specs: |-
