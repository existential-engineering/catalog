description: Active studio monitor delivering precise reference monitoring and
  controlled performance in a compact design.
details: |-
  The KH 150 is a powerful bi-amplified studio monitor with reference-class performance. Its 6.5" woofer in a bass reflex cabinet provides stunning low end and high SPL capability with undiminished clarity. DSP controlled electronics ensure linear phase response and allow for room-adaptive calibration via Neumann's revolutionary MA 1 Automatic Monitor Alignment.

  The KH 150 follows the same philosophy as all Neumann studio monitors: highest linearity, lowest distortion, no coloration, and perfect adaptability to any acoustic environment. It allows you to hear every nuance of your tracks.

  What differentiates the KH 150 from its smaller siblings is its deeper bass response down to 39 Hz. That's almost as low as the larger KH 310, thanks to the KH 150's novel 6.5" high-precision woofer in a carefully designed bass reflex cabinet. The KH 150 is thus ideally suited to urban music, EDM, film scoring, and all styles that require extended low end and/or elevated listening levels. Thanks to powerful amplifiers (145 W/100 W) and sophisticated protection limiters, no clarity is lost even at high SPLs.

  The KH 150 has an exceptionally linear frequency response from 39 Hz to 21 kHz (plus/minus 3 dB). It also linearizes the phase response, translating to clear mids with astonishing transparency as well as extreme accuracy in the time domain. The internal DSP also realizes new standards in tonal consistency: the KH 150 is made to extremely low tolerances of no more than plus/minus 0.8 dB.

  Neumann's Mathematically Modelled Dispersion (MMD) waveguide guarantees a wide sweet spot and minimizes desk reflections. The KH 150's internal DSP allows for room calibration via Neumann's Automatic Monitor Alignment. MA 1 (sold separately) makes sure your DSP powered monitors are optimally adapted to the character of your room and perfectly calibrated for your listening position.

  Tonal compatibility with other KH line studio monitors makes it possible to use the KH 150 in mixed setups e.g. in surround/immersive setups. For flexible connectivity the KH 150 features both analog and digital inputs.

  The KH 150 AES67 model variant offers integrated redundant AES67 audio network ports that are fully compliant with broadcast standards such as ST 2110, ST 2022-7 redundancy, and RAVENNA, and is compatible with DANTE-generated AES67 network streams.

  Neumann engineers developed a patent pending amplifier technology that combines superior audio performance with the energy efficiency of Class D. Although the KH 150's amplifiers deliver up to 145 W to the 6.5" woofer and 100 W to the 1" tweeter, they only consume 17 W at idle. Auto-standby reduces power consumption to 0.3 W when the KH 150 has not been used for a while, but can be deactivated.

  Most of the KH 120 accessories also fit the KH 150, with the exception of the LH 65 table stand, which is available in a slightly larger version as the LH 66. The LH 61 (L bracket) was updated, and the LH 64 (VESA mount) was adjusted to allow access to the controls of the KH 150.

  The KH 150 is available in two color options, anthracite and white.
specs: |-
  - Acoustical Principle: Bassreflex, ports at the front
  - Woofer: 165 mm (6.5") with protecting black metal grille
  - Tweeter: 25 mm (1") with protecting black metal grille
  - Free Field Frequency Response6d B: 36 Hz ... 21 kHz
  - Free Field Frequency Response3d B: 39 Hz ... 20.4 kHz
  - Pass Band Frequency Response: 42 Hz ... 20 kHz, plus/minus 1.25 dB
  - Free Field Linearity Deviation: plus/minus 0.8 dB (between 100 Hz and 10 kHz)
  - Reproduction Accuracy: plus/minus 0.50; plus/minus 0.30; plus/minus 0.15 dB (between 100 Hz and 10 kHz: 100%, 80%, 50% of units)
  - Self Generated Noise: <20 dB(A) SPL at 10 cm (input gain set to 100 dB SPL for 0 dBu)
  - Sine Wave Output T H D: 95 dB SPL (>75 Hz) at 1 m in half space, THD < 0.5%
  - Max Spl Half Space: 118.7 dB SPL (3% THD, averaged 100 Hz to 6 kHz, at 1 m)
  - Max Spl Full Space: 112.7 dB SPL (3% THD, averaged 100 Hz to 6 kHz, at 1 m)
  - Bass Capability: 107.5 dB SPL (3% THD in half space, averaged 50 Hz to 100 Hz, at 1 m)
  - Max Short Term Spl Iec: 108 dB(C) SPL at 1 m (IEC-weighted noise per IEC 60268-5, typical listening conditions)
  - Max Short Term Spl Pair: 100 dB(C) SPL at 2.3 m (music material, typical listening, pair / full range)
  - Max Short Term Spl Pair With Sub: 106 dB(C) SPL at 2.3 m (music material, typical listening, pair with subwoofer)
  - Max Long Term Spl Pink: 88 / 94 dB(C) SPL at 2.3 m (pink noise, typical listening, single / pair full range)
  - Max Long Term Spl Pink With Sub: 88 / 94 dB(C) SPL at 2.3 m (pink noise, typical listening, single / pair with subwoofer)
  - Dolby Dardt Fullrange: 114 dB
  - Dolby Dardt Bass Managed: 120 dB
  - Recommended Listening Distance: 1.0 ... 2.5 m (3' ... 8')
  - Feasible Listening Distance: 0.75 ... 6.0 m (2'6" ... 18')
  - Analog Input: XLR: analog electronically balanced
  - Analog Input Impedance: 24 kOhms
  - Max Input Level: +24 dBu at 94 dB SPL setting; +14 dBu at 100 dB SPL setting; +9 dBu at 108 dB SPL setting; -1 dBu at 114 dB SPL setting
  - Cmrr: >56 dB @ 15 kHz
  - Volume Control: via MA 1 software
  - Volume Control Range: 0 ... -inf dB; 0.1 dB resolution
  - Analog Dynamic Range: 118 dB A-weighted; THD+N 90 dB
  - Digital Input: RCA (75 Ohm): S/PDIF
  - Digital Output: RCA (75 Ohm): S/PDIF
  - Digital Max Input Level: 1.2 V pk-pk, unbalanced / balanced
  - Digital Converter Resolution: 24 Bit
  - Digital Converter Sampling Rate: 32 kHz ... 200 kHz
  - Internal Sampling Rate: 48 kHz
  - Output Sample Rate: identical to input sample rate
  - Latency: Analog Input: 2.6 ms; S/PDIF Input: 2.1 ms
  - User Delay Range: 0 ... 120 ms
  - Delay Resolution: 20.8 us
  - Delay Max Lip Sync: 0 ... 120 ms for TOF=0 ms (depends on APP implementation)
  - Delay Max Time Of Flight: 0 ... 120 ms for lipsync=0 ms (depends on APP implementation)
  - Input Gain Control: 0 dB ... -15 dB
  - Output Level Control: 94; 100; 108; 114 dB SPL (in 1 m based on 0 dBu input level)
  - Equalization Bass: 0; -2; -4; -6 dB
  - Equalization Low Mid: 0; -2; -4; -6 dB
  - Equalization Treble: +1; 0; -1; -2 dB
  - Input Select: Analog; S/PDIF L; S/PDIF R; Mono
  - Ground Lift: Yes
  - Control: Local; Network
  - Mains Switch: Yes
  - Mains Voltage: Universal Power Supply 100 V ... 240 V
  - Controller Design: Digital; active
  - Crossover Frequency: 1700 Hz
  - Crossover Slope: 24 dB / octave
  - Equalization Via Software: No (Neumann.Control)
  - Automatic Room Calibration: Yes (via MA 1)
  - Fir Phase Correction: Linear phase (105 Hz ... 16 kHz; +/- 45 deg)
  - Protection Circuitry: Independent soft clip, peak and thermo limiters for woofer and tweeter; woofer excursion limiter; thermo limiter for the electronics and amplifiers
  - Infrasonic Filter: 38 Hz; 12 dB / octave
  - Remote Control: MA 1 software via an RJ45 connector carrying standard IP data
  - Display Normal: Neumann logo White
  - Display Identification: Neumann logo Rose
  - Display Error: Neumann logo Red (Limit / Clip / Errors / Protection / Boot Mute / Shut Down Mute)
  - Logo Brightness: via MA 1 software
  - Output Power Woofer: 145 W (THD+N with limiter deactivated: 10%); 120 W at 0.1%
  - Output Power Tweeter: 100 W (THD+N with limiter deactivated: 10%); 80 W at 0.1%
  - Mains Power Supply: 100-240 V; 50/60 Hz
  - Power Consumption Standby: 0.3 W
  - Power Consumption Idle: 15 W
  - Power Consumption Full Output: 320 W
  - Standby: Automatic, 90 mins (default); user defined in software
  - Cabinet Material: Composite polycarbonate front and rear, wooden sleeve
  - Cabinet Finish: Painted; metallic anthracite (RAL 7021) / Black (RAL 9005)
  - Operating Conditions: +10 C to +40 C (+50 F to +104 F); <75% RH, non-condensing
  - Transport Storage Conditions: -25 C to +60 C (-13 F to 140 F); <90% RH, non-condensing
  - Mounting Points: 2 x M6 threaded inserts with 70 mm spacing on back panel; thread depth 15 mm (5/8")
  - Dimensions: 345 x 225 x 273 mm (13.58" x 8.86" x 10.75") (H x W x D)
  - Internal Net Volume: 12.6 L
  - External Net Volume: 20.4 L
  - Weight: 8.0 kg (17 lbs 10 oz)
  - Packed Dimensions: 480 x 303 x 403 mm (18.9" x 11.9" x 15.9") (H x W x D)
  - Packed Weight: 9.4 kg (20 lbs 12 oz)
  - Packed Cube: 0.059 m^3 (2.08 ft^3)
  - Acoustical Axis Horizontal: 112.5 mm (4.4")
  - Acoustical Axis Vertical: 197 mm (7.8", from bottom)
