description: >-
  The SH-2000, introduced in 1973, is Roland's second synthesizer and is essentially a limited
  version of the SH-1000. It is a single-oscillator monophonic analog preset synthesizer designed
  to sit atop a home organ, featuring 30 preset sounds selected via colorful tab switches.
details: |-
  The SH-2000 features a 37-note keyboard with 30 preset sounds including Tuba, Trombone, French
  Horn, Trumpet, Saxophone, Bassoon, Oboe, Flute, Clarinet, Cello, Violin, Bass Guitar, Hawaiian
  Guitar, Banjo, Fuzz Guitar, Piano, Harpsichord, Accordion, Vibraphone, Xylophone, Singing Voice,
  Song Whistle, Popcorn, Space Reed, Planet, Frog Man, Funny Cat, Growl Wow, and Wind. Left-side
  controls include filter cutoff, resonance, modulation sliders, LFO rate, portamento, vibrato,
  pitch bend, and volume. It includes aftertouch called Touch Effect assignable to volume, vibrato,
  pitch, and effects. Features a random note generator plus Growl and Wow effects. Used by Norman
  Cook (Fatboy Slim), 808 State, Blondie, Human League, Mike Oldfield, and Jethro Tull.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - LFO: 1 with modulation amount
  - Filter: Cutoff, resonance, modulation amount
  - Keyboard: 37 keys with aftertouch
  - Memory: 30 preset sounds
  - Control: None (no CV/Gate)
releaseDate: "1973"
releaseDateYearOnly: true
