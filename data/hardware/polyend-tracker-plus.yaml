description: A remastered standalone hardware tracker workstation with a
  16-track sequencer, four synth engines, a new drum machine, stereo sampling,
  granular and wavetable synthesis, expanded memory, and audio over USB.
details: |-
  The Polyend Tracker+ is a remastered version of the original Polyend Tracker, the first dedicated hardware tracker. It is a standalone workstation combining a step sequencer, sampler, sample editor, synthesizers, song arranger, and a mixing and mastering suite in a single device, designed to complete an entire album on one machine.

  Compared to the original, the Tracker+ adds eight more tracks (16 total, with eight dedicated to MIDI or synth playback), stereo throughout (beat slices, granular and wavetable synthesis, and the sample recorder are all stereo), audio over USB, and expanded memory. Hardware upgrades include a faster microcontroller, more memory, a reinforced jog wheel, and soft-touch rubbered mechanical keys.

  Tracker+ features four synth engines (ACD, FAT, VAP, and WTFM) plus a new PERC drum machine instrument, with a Synth Patch Editor for customization. Instruments can be synths, samples, or MIDI, with over 250 presets and more than 3,600 samples included on the SD card. Samples support eight playback options including 1-shot, forward, backward, ping-pong looping, beat slicing, granular, and wavetable engines, plus LFOs, filter, panning, tuning, and custom delay and reverb.

  The workflow is grid-based, using context-adaptive silicon backlit pads, a high-resolution color screen, mechanical main-function and navigation buttons, a large rotary jog wheel, and contextual buttons. The Master view offers per-track and global mixing, delay, reverb, dry mix, line-in levels, master volume, saturation, bass boost, space effects, limiter, and EQ.

  Projects are fully compatible with Tracker Mini 2.0, so songs can move between the two devices. Rendering options allow resampling of a step or an entire song, saving to SD card, or recording a performance directly to a DAW via 14 tracks of stereo USB audio.
specs: |-
  - 16-track sequencer (eight tracks dedicated to MIDI or synth playback)
  - Four synth engines: ACD, FAT, VAP, WTFM
  - PERC drum machine instrument
  - Synth Patch Editor with customizable macros per preset
  - Over 250 synth presets
  - Stereo sampling and stereo sample recorder
  - Granular and wavetable synthesis (stereo)
  - Eight sample playback options: 1-shot, forward, backward, ping-pong looping, slice, beat slice, granular, wavetable
  - LFOs, filter, panning, and sample tuning
  - Custom delay and reverb engines
  - Master view: per-track and global mixer, saturation, bass boost, space effects, limiter, EQ
  - 14 tracks of stereo USB audio to DAW
  - Audio over USB and file transfer via USB-C
  - High-resolution color backlit screen with color and font themes
  - Silicon backlit context-adaptive grid pads
  - Soft-touch mechanical keys and reinforced jog wheel
  - Faster microcontroller and expanded memory
  - 100% project compatibility with Tracker Mini 2.0
  - Included: 16 GB MicroSD card with over 3,600 samples
  - Height with knob: 3.3 cm (1.3 in)
  - Width: 28.2 cm (11.02 in)
  - Depth: 20.7 cm (8.15 in)
  - Weight: 1.2 kg (2.65 lb)
  - Powered via USB (included USB-A power adapter and USB-C cable)
