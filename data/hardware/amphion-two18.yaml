details: |-
  The Two18 is a two-way passive radiator studio monitor designed for nearfield and midfield use. It delivers a frequency response of 39–20,000 Hz ±3dB, extending lower than the Two15 thanks to its larger dual 6½" aluminum woofers.

  The 1600 Hz crossover point enables point-source operation, giving the monitor its hallmark pinpoint imaging and phase coherence. A waveguide time-aligns the tweeter and woofer voice coils so transient information arrives coherently at the mix position.

  Like all Amphion monitors, the Two18 is DSP-free; the acoustic design handles dispersion and frequency shaping without digital processing, keeping the signal electrically clean for downstream use.

  The passive radiator bass-loading system distributes low-frequency energy more evenly into the room compared to ported designs, reducing bass build-up in typical studio acoustics.

  Endorsed by engineers including Rob Kinelski (Billie Eilish), Mark 'Spike' Stent (Ed Sheeran), Finneas O'Connell, Josh Gudwin (Dua Lipa), and Ali Shaheed Muhammad. Requires an external power amplifier rated 100–350 W into 4 Ω.
specs: |-
  - Operating Principle: Two-way, passive radiators
  - Tweeter: 1" titanium
  - Woofers: 2×6½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 4 Ω
  - Sensitivity: 89 dB @ 2.83V/1m
  - Frequency Response: 39–20,000 Hz ±3dB
  - Power Recommendation: 100–350 W
  - Dimensions (H×W×D): 550×190×305 mm
  - Weight: 14 kg (30.9 lbs)
  - Manufacturing: Handmade in Finland
