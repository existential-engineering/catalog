description: The SL 110 is a compact, versatile 1x10" bass cabinet designed for
  portability without sacrificing sound quality. Suitable for electric or
  upright bass, it targets rehearsals, small venues, and studio sessions, and
  can be paired with a second unit for a lightweight 2x10 configuration.
details: |-
  The Aguilar SL 110 is a lightweight, compact 1x10" bass speaker cabinet built
  around the SL (Super Light) philosophy — delivering professional-grade tone in
  a package that weighs just 23 lbs. Whether you are heading to a rehearsal, a
  small club gig, or a studio session, the SL 110 is designed to go with you
  without slowing you down.

  The cabinet is powered by a single 10" ceramic driver capable of handling
  175 watts RMS, with a frequency response that extends down to 41 Hz — deep
  enough for five-string bass and upright bass fundamentals. Sensitivity is rated
  at 94.4 dB (1W/1M), meaning it moves a lot of air efficiently with less wattage.

  At 8 ohms, the SL 110 pairs naturally with almost any bass amp head. Two units
  can be stacked for a 4-ohm, 350-watt 2x10 configuration that punches well above
  its collective weight. The cabinet is available in three finishes: Classic Black,
  Fawn, and Chocolate Brown.

  The SL 110's compact 13.5" x 13.5" footprint makes it easy to fit on stage or
  in tight studio corners, while the 17.25" depth provides the internal volume
  needed for extended low-frequency response.
specs: |-
  - Power Handling: 175 watts RMS
  - Impedance: 8 ohms
  - Frequency Response: 41 Hz – 5 kHz
  - Sensitivity: 94.4 dB 1W/1M
  - Driver: 10" Ceramic
  - Height: 13.5"
  - Width: 13.5"
  - Depth: 17.25"
  - Weight: 23 lbs (10.43 kg)
  - Available Finishes: Classic Black, Fawn, Chocolate Brown
