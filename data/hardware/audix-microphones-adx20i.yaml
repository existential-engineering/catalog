details: |-
  The ADX20i miniature condenser microphone is applicable for professional stage and studio applications. This microphone is primarily used for miking most reed and brass instruments.

  The ADX20i has a uniformly controlled cardioid polar pattern, which provides excellent isolation and feedback control on stage with natural sound reproduction at very close distances.

  The ADX20i condenser instrument microphone is lightweight, compact, and simple to use. Included with the ADX20i is a gooseneck clip with spring tension for easy mounting to the bell of an instrument.

  Designed, assembled, and tested by AUDIX in the USA.
specs: |-
  - Polar pattern: Cardioid
  - Connector: mini-XLRf (TA3F)
  - Gooseneck instrument clip with spring tension
  - Wired or wireless use
