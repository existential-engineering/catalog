details: |-
  This edition of the Tube Drive Twin Triode Dual Overdrive is built around a vintage 1984 GE 12AT7A/7025 tube, described as prized for a lush, deep character alongside military-grade ruggedness. The pedal pairs a high-voltage tube preamp with the Keeley Super Phat Mod drive circuit, giving two gain voices that can be used alone or stacked.

  The tube section runs both triodes in series in Class A, and the pair of amplifier stages feeds a vintage tweed amp style tone stack. The tube is selected, burned in and tested, and displayed behind a custom matte black Keeley tube shroud. A vented jack plate manages airflow around the tube section, a rear-panel marking identifies the high-voltage design inside, and the tube can be swapped using the supplied extraction pin and allen key.

  The second side is based on the Super Phat Mod, which adds punch and sustain with a thick amp-like drive while keeping the guitar's own character. A foot gesture reverses the order of the two sections while playing, so the tube preamp can run into the Phat Mod or the Phat Mod into the tube side.

  All connections sit along one side of the enclosure: Input, Output, and a Remote jack for external switching, with the tip conductor assigned to the Drive side and the ring conductor to the Tube side. Switching is selectable between true bypass and Keeley's silent buffered mode, and power is a standard 9V DC centre-negative supply rated at 500mA or more. This version has a transparent black finish with a black backplate and tube shroud and gunmetal aluminium knobs. It is designed, assembled, tested and finished at Keeley Electronics in Oklahoma City.
