description: >-
  The Generalmusic S2 is a professional music workstation from Italian
  manufacturer GEM, introduced in 1992 as a "Music Processor" featuring a
  61-note semi-weighted keyboard with polyphonic aftertouch. It combines a
  powerful synthesizer engine with sampling capabilities, a robust onboard
  sequencer, and excellent real-time controllers including seven programmable
  sliders and buttons. The 1993 Turbo upgrade doubled polyphony to 32 voices and
  added non-volatile storage, addressing the original model's limitation of
  losing RAM contents at power-off.
details: |-
  Italian company Generalmusic, also known as GEM, was established as a maker of home organs and semi-professional accompaniment keyboards but also developed professional workstations. The S-Series debuted in 1992 as a "Music Processor" aimed at professional musicians. The S2 features a 61-note semi-weighted keyboard with touch and release velocity, polyphonic aftertouch, and metal contacts, while the S3 variant offered 76 keys. The front panel includes seven programmable sliders, seven programmable buttons, pitch and modulation wheels, and a large graphical LCD with light blue neon backlighting. In 1993, GEM released the Turbo upgrade kit which doubled polyphony and added new functions. The S2R rack version shipped with Turbo already integrated.

  The synthesizer engine provides 16-note polyphony, doubled to 32 with the Turbo upgrade, and is 16-part multitimbral. Two oscillators per voice draw from 209 waveforms stored in 6MB of ROM or multisamples loaded into 2MB of sample RAM. Two 12dB/octave resonant filters per voice can be independently configured as lowpass, highpass, bandpass, parameter cut, or parameter boost. When both filters share identical settings they combine into a single 24dB/octave filter for classic analog-style sweeps. Three 10-segment envelopes with continuous looping handle amplitude, filter, and pitch modulation, while a versatile LFO offers sine, triangle, saw, square, random, and sample-and-hold shapes. A panorama function with its own stereo envelope adds spatial movement.

  The S2 excels at analog synthesizer emulations, punchy basses, synth strings and brass, and convincing tone-wheel organ sounds. Acoustic sounds are somewhat dated by modern standards, though some patches like the Pan Flute remain impressive. The sample editor reads WAV, Akai, and AIFF formats from DOS-formatted floppy disks using a Sample Translator utility that supports truncation, normalization, and looping. Users can build multisamples from up to 16 individual samples, which then behave like ROM sounds.

  The onboard sequencer supports up to 250,000 notes with quantization, macro editing, undo/redo, and clipboard functions across 10 songs of 10 sequences each. It can load, save, and convert standard MIDI files, and control two additional sound sources independently through dual MIDI interfaces. The effects section offers two blocks: the first covers reverbs, halls, and reverb/delay combinations; the second provides choruses, flangers, rotary speaker simulations, and pitch/delay combinations.

  Original S2/S3 units use 3.5-inch HD floppy disks with a special 1.6MB formatting, and all RAM data is lost at power-off. The Turbo upgrade added four slots for non-volatile SDRAM chips with up to 2MB capacity, functioning as persistent storage that preserves settings on startup. Notable users include Brian Eno. The S-Series was succeeded by the Equinox generation in 1998, and the Generalmusic brand ultimately disappeared in 2008.
specs: |-
  - Polyphony: 16 voices (32 with Turbo upgrade)
  - Multitimbral: 16 parts
  - Oscillators: 1-2 per voice
  - Waveforms: 209 multisamples on 6MB ROM
  - LFO: 1 with Sine, Triangle, Saw, Square, Random, S&H
  - Filter: 2 DCFs per voice, 12dB/oct with resonance (LP, HP, BP, Parameter Cut, Parameter Boost)
  - Envelopes: 3 x 10-segment with cycling (Amp, Filter, Pitch)
  - Effects: 2 blocks (reverbs, halls, choruses, flangers, rotary speaker, delays)
  - Sampler: 2MB sample RAM (WAV, Akai, AIFF)
  - Sequencer: 16-track, 250,000 notes capacity, 10 songs x 10 sequences
  - Arpeggiator: None
  - Keyboard: 61 keys (S2) or 76 keys (S3), semi-weighted with polyphonic aftertouch
  - Memory: 100 Performances (Turbo models)
  - Storage: 3.5-inch HD floppy (1.6MB); Turbo adds 512KB-2MB non-volatile SDRAM
  - Outputs: 2 main, 4 auxiliary, headphones
  - Control: 2 complete MIDI interfaces, 2 foot-switch inputs, 1 pedal input
  - Date Produced: 1992-1998
