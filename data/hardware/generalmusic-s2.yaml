description: >-
  The Generalmusic S2 is an Italian-made music workstation from 1992 featuring a powerful sequencer,
  sample editing capabilities, and excellent real-time controllers across its semi-weighted keyboard
  with polyphonic aftertouch.
details: |-
  Italian company Generalmusic, also known as GEM, introduced the S-Series in 1992 as a "Music Processor" aimed at professional musicians. The S2 features a 61-note semi-weighted keyboard with touch and release velocity, polyphonic aftertouch, and metal contacts, while the S3 variant offered 76 keys. The front panel includes seven programmable sliders, seven programmable buttons, pitch and modulation wheels, and a large graphical LCD with blue neon backlighting.

  The synthesizer engine provides 16-note polyphony, doubled to 32 with the 1993 Turbo upgrade kit. Two oscillators per voice draw from 209 waveforms stored in ROM or multisamples loaded into 2MB of RAM. Two 12dB/octave resonant filters per voice can be independently configured as lowpass, highpass, bandpass, parameter cut, or parameter boost, and when set identically they combine into a single 24dB/octave filter for classic analog-style sweeps.

  The S2 excels at analog synthesizer emulations, punchy basses, synth strings and brass, and tone-wheel organ sounds. Three 10-segment envelopes with continuous looping, a versatile LFO with six waveform shapes, and a panorama function with its own envelope provide deep sound design options. The sample editor reads WAV, Akai, and AIFF formats from DOS-formatted floppy disks.

  A robust onboard sequencer supports up to 250,000 notes with quantization, macro editing, undo/redo, and clipboard functions. It can control two additional sound sources independently through dual MIDI interfaces. The effects section offers two blocks covering reverbs, halls, choruses, flangers, rotary speaker simulations, and delay combinations.

  The Turbo upgrade added non-volatile SDRAM slots for persistent storage, addressing the original model's limitation of losing all RAM contents at power-off. Notable users include Brian Eno. The S-Series was succeeded by the Equinox generation in 1998, and the Generalmusic brand ultimately disappeared in 2008.
specs: |-
  - Polyphony: 16 voices (32 with Turbo upgrade)
  - Multitimbral: 16 parts
  - Oscillators: 1-2 per voice
  - Waveforms: 209 multisamples on 6MB ROM
  - LFO: 1 with Sine, Triangle, Saw, Square, Random, S&H
  - Filter: 2 DCFs per voice, 12dB/oct with resonance (LP, HP, BP, Parameter Cut, Parameter Boost)
  - Envelopes: 3 x 10-segment with cycling (Amp, Filter, Pitch)
  - Effects: 2 blocks (reverbs, halls, choruses, flangers, rotary speaker, delays)
  - Sampler: 2MB sample RAM (WAV, Akai, AIFF)
  - Sequencer: 16-track, 250,000 notes capacity
  - Keyboard: 61 keys (S2) or 76 keys (S3), semi-weighted with polyphonic aftertouch
  - Memory: 100 Performances (Turbo models)
  - Outputs: 2 main, 4 auxiliary, headphones
  - Control: 2 complete MIDI interfaces
