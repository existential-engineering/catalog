description: Designed with the studio bass player in mind, the Ashdown Studio
  Compressor tames the dynamic range of your signal for less inconsistency
  between the loudest and quietest notes.
details: |-
  The Ashdown Studio Compressor is designed for the studio bass player, levelling the audio signal, limiting to prevent unwanted distortion and preserving dynamic range. Used correctly, it tames the dynamic range so that there is less inconsistency between the loudest and quietest notes while remaining imperceptible to listeners, and it gives the player control over how it does this.
