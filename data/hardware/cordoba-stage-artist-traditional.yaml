description: The Stage Artist Traditional solidbody nylon-string electric guitar
  features a bound solid cedar top, upscale appointments such as maple purfling,
  and a Stage Pickup System co-developed with Fishman®.
details: |-
  The Stage Artist Traditional was designed for players who prefer a solidbody instrument that looks and feels more like a traditional nylon-string guitar. Its solid cedar top is complemented by an antique-tinted gloss finish, and it has a flat fingerboard and a 52mm (2") nut width. The guitar’s visual appeal is further elevated by a suite of exquisite appointments, including ebony binding on the top, fingerboard, and soundhole; an ebony bridge; and a rosewood headstock overlay—all enhanced with bold maple purfling. The upscale aesthetic is completed by gold hardware, Córdoba Flower Petal tuners with black buttons, a flamed maple Córdoba Arches logo, and rosewood knobs inlaid with maple.

  All Stage Artist guitars have a thicker mahogany body and larger internal chambering than Stage guitars. That 48mm (1 7/8") body thickness results in a more substantial feel, a louder acoustic sound, and a fuller tone when amplified. To compensate for its thicker body, the Stage Artist Traditional has a deeper body contour and a sculpted neck heel, allowing the instrument to rest comfortably against the player’s body while also providing increased upper-fret access.

  The Stage Artist Traditional features the Stage Pickup System co-developed with Fishman. It pairs an under-saddle transducer with internal body sensors, a combination that produces a warm, clear, authentic nylon-string tone with exceptional balance and also eliminates the “quack” typically associated with piezo pickups. A professional-quality preamp with easily accessible Volume, EQ, and Body Blend controls provides even more precise tone shaping, which can come in handy when adjusting to differing venues.

  The included Córdoba Stage Hard Case provides an outstanding way to both protect and safely transport your Stage Artist Traditional guitar. Its streamlined design, light weight, and padded handle provide comfortable carrying, while its refined heathered blue vinyl exterior, brown trim, and brass-plated latches ensure you arrive in style. A large storage compartment also makes it easy to bring tuners, extra strings, cables, and other accessories along wherever you go.
