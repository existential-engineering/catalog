description: >-
  A design from the minds of Jon Theodore and Ludwig, the Jon Theodore Signature
  Snare Drum blends craftsmanship, style, and tone to honor a dynamic modern
  drummer. Featuring a 6.5" x 14" seamless brass shell with exclusive antique
  nickel plating, it delivers a warm yet articulate tone that excels in any
  playing environment. This limited-edition instrument is finished with a
  signature blue/olive badge and Jon Theodore's personal signature on each drum
  — a collector's masterpiece and a reliable workhorse for the stage and studio.
specs: |-
  - 1mm seamless brass shell
  - 6.5" x 14" dimensions
  - Exclusive antique nickel plating finish
  - Nickel-plated shell hardware
  - Signature blue/olive badge
  - Remo Controlled Sound Black Dot batter head
  - Pure Sound Super 30 snare wires
  - Signed by Jon Theodore
  - Limited edition
