description: The Ibanez Layer Delayer — a delay pedal that generates
  independently-controllable 16th-note and triplet delay signals, with three
  simulated delay types (digital, analog, tape echo), a ladder filter,
  auto-panning tails, MIDI clock sync, and 50 presets.
details: |-
  The Ibanez Layer Delayer is a revolutionary pedal that redefines the possibilities of delay effects. Unlike traditional tape echoes, this innovative device generates 16th notes and triplets delay signals, each with independent volume controls, allowing you to create intricate rhythmic patterns and sonic textures.

  The LD303 offers three simulated delay types — digital, analog, and tape echo — alongside a simulated low-pass ladder filter with Moog-style resonance emulation. Variable tail decay with eight auto-panning modes adds further movement to the sound.

  A tap tempo footswitch with MIDI clock synchronization keeps the pedal locked to a larger rig, and 20 factory presets (50 total slots) are editable from a PC via the Layer Delayer App. Stereo I/O with a dedicated FX loop and MIDI in/through round out the connectivity.
specs: |-
  - Independent variable volume control of 16th and triplet delay notes
  - Three simulated delay types: digital, analog, tape echo
  - Simulated low-pass ladder filter with Moog-style resonance emulation
  - Variable tail decay with auto-panning (8 modes)
  - Tap tempo footswitch with MIDI clock synchronization
  - PC control via Layer Delayer App
  - 20 factory presets in 50 presets total
  - Stereo in/out with FX loop and MIDI in/through
  - Size: 175(W) x 125(D) x 62(H) mm / 6.9 x 5.0 x 2.5 inches
  - Weight: 640g / 1.4 lbs
  - Required current: 300mA@9V
  - Power: External DC 9V AC adapter (center-negative)
