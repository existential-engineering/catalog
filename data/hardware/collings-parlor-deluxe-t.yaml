description: The Parlor Deluxe T is a Traditional Series 12-fret acoustic guitar
  inspired by the earliest steel string guitar designs of the late 19th century.
  Built with a Sitka spruce top and East Indian rosewood back and sides, it
  delivers exceptional tonal balance and responsiveness in a compact, portable
  body. Pre-war scalloped X-bracing and a mortise & tenon hybrid neck joint
  reflect Collings' meticulous approach to traditional construction.
details: |-
  The Parlor Deluxe T belongs to the Collings Traditional Series, which emphasizes pre-war construction techniques and voicing. The parlor body style — 12 1/4" wide and 18 5/16" long with a 4" depth — draws on the earliest steel string guitar designs from the late 19th century, prized for their exceptional tonal balance, responsiveness, and portability. The neck joins the body at the 12th fret, contributing to the instrument's vintage character and resonance. Construction features a custom Traditional Series pre-war scalloped X-brace pattern, a Honduran mahogany neck with a modified V profile, and a 14"-26" compound fingerboard radius on an ebony board with no inlay. The bridge is an ebony pyramid-style with 2 5/16" petite spacing, paired with bone nut and drop-in bone saddle. Waverly Engraved Bronze 3-on-a-plate tuners with ivoroid buttons complete the vintage aesthetic. Decorative appointments include ivoroid body and fingerboard binding, multi-color wood mosaic purflings, rosette, and backstrip.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Scale Length: 24 7/16"
  - Nut Width: 1 3/4"
  - Neck Profile: Modified V
  - Fingerboard Radius: 14" - 26" compound
  - Fingerboard: Ebony, no inlay
  - Fingerboard Binding: .060" ivoroid
  - Brace Pattern: Custom Traditional Series pre-war scalloped X-brace
  - Neck Joint: Mortise & tenon hybrid
  - Bridge: Ebony pyramid-style, 2 5/16" spacing
  - Nut: Bone
  - Saddle: Bone, drop-in
  - Tuners: Waverly Engraved Bronze 3-on-a-plate with ivoroid buttons
  - Frets: Medium 18% nickel-silver
  - Body Binding: Ivoroid with multi-color wood mosaic purflings
  - Peghead Binding: .100" ivoroid with b/w purfling
  - Peghead Veneer: Stained exotic ebony with gold MOP Collings logo
  - Rosette: Multi-color wood mosaic
  - Backstrip: Multi-color wood mosaic
  - Bridge Pins & End Pin: Ivoroid with black dot
  - Truss Rod: Fully adjustable
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 12 1/4"
  - Body Length: 18 5/16"
  - Body Depth: 4"
  - Total Length: 37 1/4"
  - Strings: D'Addario EJ-26 (.011" - .052")
