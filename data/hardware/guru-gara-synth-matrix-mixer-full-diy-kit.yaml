description: A complete Eurorack matrix mixer DIY kit with a 4-input, 4-output
  configuration for routing and mixing audio and control voltage signals,
  including all components and a hand-screened front panel.
details: |-
  This flexible Eurorack matrix mixer is a powerful tool for creative signal routing and mixing within your modular system. Featuring a 4-input, 4-output configuration, it allows you to blend and distribute audio and control voltages with precision and ease. From subtle modulation blends to complex feedback networks, this module opens up endless patching possibilities. Whether you're shaping evolving soundscapes or building intricate modulation paths. Key Features:

  Technical Specifications

  Skiff Friendly Module
specs: |-
  - 4-In, 4-Out Matrix Mixing: Route and mix any of the four inputs to any of the four outputs for highly flexible patching.
  - Audio & CV Compatible: Safely handles both audio signals and control voltages without compromise.
  - Intuitive Level Control: Individual knobs allow precise control over signal levels and blending.
  - Beginner-Friendly DIY Kit: Includes all components, PCB, and an easy-to-assemble design suitable even for first-time builders.
  - Hand-Screened Front Panel: Each module features a unique, hand-screened panel, adding a handcrafted aesthetic to your Eurorack system.
  - Size: 14HP
  - Current Draw: +12V: 21mA, −12V: 21mA
  - Depth: 25mm
