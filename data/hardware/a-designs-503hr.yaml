description: A horizontal, single-rack-unit (1RU) chassis designed to house
  three 500-series modules, with a three-position FEED switch for internal
  signal routing, an external power supply with LED display, and a three-LED
  voltage rail indicator. No longer in production.
details: |-
  The 503HR 3-Space 500-Series Rack is a horizontal 1RU chassis that
  accommodates three 500-series format modules, allowing engineers to build
  a fully modular channel strip tailored to their workflow. It is no longer
  in production.

  The unit features all-metal construction with XLR input and output
  connectors, providing a robust and professional housing for signal
  processing modules.

  A three-position FEED switch allows flexible signal routing between the
  three module slots, reducing cabling requirements from six XLR cables down
  to just two when routing signals through the chassis internally.

  An external power supply with LED display monitors power consumption, and
  a three-LED array provides real-time indication of the +16V, -16V, and
  +48V voltage rails supplied to the modules.

  Typical applications include live sound reinforcement, studio recording,
  and instrument signal chains — for example, chaining a preamp, compressor,
  and equalizer in a single 1RU package.
specs: |-
  - Form factor: 1U rack-mount, horizontal orientation
  - Module capacity: 3 slots (500-series format)
  - Connectors: XLR input and output
  - FEED switch: 3-position (slots 1-2 only, all three slots, or none)
  - Power rails: +16V, -16V, +48V
  - Power monitoring: LED display on external power supply
  - Voltage indicators: 3-LED array (+16V, -16V, +48V)
