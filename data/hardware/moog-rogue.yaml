description: >-
  The Moog Rogue is a compact two-oscillator analog monosynth that served as Moog's most affordable
  offering, delivering genuine Moog bass tone in a stripped-down, budget-friendly package.
details: |-
  Released in 1981, the Rogue represented Moog's effort to bring their signature sound to a wider audience through aggressive cost-cutting. While it retained genuine Moog componentry and the company's renowned filter design, numerous corners were cut to achieve its low price point, making it the most compact and inexpensive Moog of its era.

  The synthesis architecture centers on two oscillators, though with notable limitations compared to other Moog instruments. Both oscillators must play identical waveforms and pitch ranges, offering only sawtooth and rectangle/square options across 32', 16', and 8' octave settings. The classic 24dB-per-octave Moog lowpass filter provides cutoff, emphasis, and envelope amount controls.

  The envelope section uses a shared generator for both filter and amplifier, featuring Attack and Release controls with a three-position switchable Sustain (off, half, full). A 32-key keyboard rounds out the performance controls. External connectivity is limited to CV/Gate with V-trigger input and S-trigger output.

  The Rogue's design was licensed to Tandy/RadioShack as the Realistic Concertmate MG-1, and it also formed the basis for the Moog Taurus II bass pedal synthesizer. Despite its limitations, the Rogue has been used by artists including Peter Gabriel, Stereolab, Mr. Oizo, and KMFDM.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs
  - OSC 1 Waveforms: Sawtooth, Rectangle
  - OSC 2 Waveforms: Sawtooth, Square
  - Pitch Range: 32', 16', 8' per oscillator
  - Filter: 24dB/octave lowpass (cutoff, emphasis, envelope amount)
  - Envelope: Attack, Release, switchable Sustain (Off, Half, Full)
  - Keyboard: 32 keys
  - Memory: None
  - Control: CV/Gate (V-trig in, S-trig out)
  - Arpeggiator: None
