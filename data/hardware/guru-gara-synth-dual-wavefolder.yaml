description: A transistor-based Eurorack wavefolder PCB and front panel kit
  featuring two identical independent folding circuits that add harmonics to
  simple oscillator waveforms.
details: |-
  The Dual Wavefolder Eurorack PCB and Front Panel Kit is a transistor-based harmonic processor featuring two identical, independent folding circuits. Each folder utilizes two stages of transistor-based folding to provide deep control over wave manipulation, allowing you to transform simple oscillators into complex, harmonically rich soundscapes. What is a Wavefolder? In modular synthesis, a wavefolder is a tool for additive harmonic processing. While a filter removes frequencies, a wavefolder adds them by "folding" the peaks of a waveform back onto itself once they cross a specific voltage threshold. This process generates new harmonics, resulting in the metallic, complex, and "rubbery" timbres often associated with West Coast synthesis. Key Features

  Folding & Modulation

  This module features an architecture where each channel includes a VCA. The Fold and CV controls act directly upon these VCAs, altering the amplitude of the signal relative to the fixed folding thresholds. This results in a highly responsive and musical folding effect where the harmonic complexity is tied to the signal's gain. Input 1 is normalled to Input 2 via a switched jack; this allows you to use the module as a stereo unit with a single mono input, processing the signal through two different fold settings simultaneously. Use an envelope for percussive, "plucked" harmonic strikes or an LFO for wide, sweeping timbral shifts. DIY Build & Front Panel

  The PCB is densely populated to accommodate the dual-channel, multi-stage transistor design. Due to the high component density, careful assembly and advanced soldering skills are required; it is not advised for beginners. The front panel is made from durable PCB material and is screenprinted by hand, reflecting the attention to detail and craftsmanship of Guru Gara Synth modules. Technical Specifications

  Skiff Friendly Module
specs: |-
  - Eurorack PCB and front panel kit
  - Two identical, independent wavefolding circuits
  - Transistor-based 2-stage folding per channel
  - Normalled input (In 1 to In 2) for mono-to-stereo processing
  - Dedicated fold potentiometer for each folder
  - CV input with attenuator (CV amount) for each folder
  - Hand-screenprinted PCB front panel
  - Format: Eurorack
  - Width:
  - Folders: 2 (Identical)
  - Circuitry: Transistor-based
