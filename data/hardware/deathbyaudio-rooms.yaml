details: |-
  ROOMS is a stereo, multi-function digital reverb capable of searing volume, gated walls of sound, and long, trailing reverberant ambiances, with an intuitive array of controls designed with live mood-bending in mind. It offers six meticulously programmed reverb algorithms: ROOM, DIGIT, PEAK, GATE, WAVE, and GONG. Each verb is capable of a universe of sounds.

  ROOM is a classic reverb that simulates many different rooms (Freq sets the tone of decay, Depth the pre-delay of the right side). DIGIT is a delay and verb capable of otherworldly resonances and fractured repeats (Freq sets delay time, Depth sets delay feedback). PEAK is a super intense bandpass filter combined with an ambient reverb (Freq sets filter frequency, Depth sets filter resonance). GATE is a gated reverb where short reverb times create a classic gate effect and long times create a controllable freeze effect (Freq sets decay tone, Depth sets gate response time). WAVE creates a pitch vibrato effect, where lowering Time blends out the reverb signal to sweep from chorus/vibrato to long modulated reverbs (Freq sets modulation speed, Depth sets modulation depth). GONG produces ethereal, crushed reverb sounds (Freq sets modulator frequency, Depth blends from aliasing to ring modulation, sounding most mellow when near center).

  Freq controls the frequency parameter of the current mode, Depth controls the depth parameter, and Time controls the reverb time in all modes. ALT engages the ALT mode, switching between two sets of controls so Freq, Depth, and Time are controlled with the F, D, and T knobs, and the F and T settings can be controlled with an expression pedal. Dry controls the volume of the dry signal from -inf to +20 dB, and FX controls the reverb signal over the same range.

  Any TRS expression pedal or 0-3.3 V control voltage can take control of the Time or Frequency setting while the pedal is in ALT mode. The F↔T slider on the right side selects which one the expression controls, and the small ALT control sets its minimum value. The expression input is only active in ALT mode.
