description: The CCM662 delivers outstanding high-end sound from an in-ceiling
  speaker. Its 25mm tweeter and 150mm Aramid mid/bass driver make sound from
  your music and movies unforgettable.
details: |-
  CCM662 is a two-way Performance Series in-ceiling speaker, pairing a 25mm (1in) Nautilus swirl loaded aluminium dome tweeter with a 150mm (6in) blue Aramid Fibre cone bass/midrange driver. Bowers & Wilkins presents it as a true high performance ceiling-mount speaker rather than a background-music fitting.

  The tweeter housing pivots, so treble can be aimed at the listening position and off-axis response adjusted after the speaker is in the ceiling. A three-position EQ switch on the speaker gives a further off-axis correction, which is the usual answer to a ceiling speaker sitting well away from where anyone is sitting.

  The bass/midrange driver sits in a die-cast chassis, which Bowers & Wilkins says adds rigidity and yields cleaner, faster bass. The crossover uses what the company calls superior components, and the speaker terminals are gold plated; between them they support a maximum amplifier power of 150W.

  The blue Aramid Fibre cone keeps the driver visually hidden behind the grille while still producing a clear and dynamic sound. Installation uses the QuickDogs fixing system and plug-and-play wiring, which Bowers & Wilkins describes as quick and easy.

  It is a passive loudspeaker: 8 ohms nominal with a 4.5 ohm minimum, 88dB sensitivity, and a recommended amplifier power of 25W to 150W, driven from an external amplifier. The frame is 240mm (9.5in) across, the cut-out 202mm (8in), and it needs 133mm (5.2in) of depth behind the ceiling surface.
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x 25mm (1in) Nautilus swirl loaded aluminium dome tweeter, 1x 150mm (6in) blue Aramid Fibre cone bass/midrange driver
  - Frequency range (-6dB): 45Hz to 50kHz
  - Recommended amplifier power: 25W to 150W
  - Sensitivity SPL: 88dB (2.83V, 1m)
  - Nominal impedance: 8 ohms (4.5 ohms minimum)
  - Frame diameter: 240mm (9.5in)
  - Cut-out diameter: 202mm (8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C6
  - Back box: 6C
  - Pivoting tweeter housing for adjustable off-axis treble response
  - Three-position EQ switch for off-axis response
  - Die-cast bass/midrange chassis
  - Gold plated speaker terminals
  - QuickDogs fixing system with plug-and-play wiring
  - Finish: White
