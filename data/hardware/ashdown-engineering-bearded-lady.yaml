description: The Bearded Lady is a bass fuzz pedal from Ashdown's Dr. Green
  range. It splits the signal into low and high fuzz for complete control over
  your tone, letting you boost the low fuzz for huge low-end dirt and dial in
  the high fuzz for definition. It ranges from subtle clipping to full-on
  nuclear fuzz, features true bypass switching, and is housed in a
  custom-designed steel casing built to withstand repeated stage use.
details: |-
  Bass fuzz pedal from the Ashdown Dr. Green range. Splits the signal into low and high fuzz bands with independent output control. Controls: Lo Fuzz (controls low-end fuzz), Hi Fuzz (controls high-end fuzz), Hi Out (controls the high-frequency fuzz output), Lo Out (controls the low-frequency fuzz output). True bypass switching. Housed in a custom-designed steel casing.
specs: |-
  - Effect: fuzz
  - Controls: Lo Fuzz, Hi Fuzz, Hi Out, Lo Out
  - Split low/high fuzz bands
  - True bypass switching
  - Steel casing
