id: MFiwm0AqE-fkLfo29XcTO
name: dbx 2215 Graphic Equalizer/Limiter with Type III™
manufacturer: dbx
primaryCategory: equalizer
categories:
  - rack-mount
  - outboard
url: https://dbxpro.com/en/products/2215
description: The dbx 2215 is a discontinued 2U dual-channel 15-band graphic
  equalizer combining Type III® noise reduction, a patent-pending PeakPlus™
  limiter, and high-quality EQ circuitry for up to 120dB of dynamic range.
  Switchable ±6dB or ±15dB boost/cut ranges with a 40Hz Bessel high-pass filter
  serve portable and touring applications.
details: |-
  The 2215 sets itself apart from conventional graphic equalizers by integrating three essential technologies in one 2U rackmount unit. Type III® Noise Reduction provides up to 20dB of signal-to-noise improvement through an instant encode/decode process, raising the effective dynamic range to over 120dB unweighted.

  The patent-pending PeakPlus™ Limiter with a threshold range of 0dBu to +24dBu protects downstream equipment from overload while maintaining musical transients. A four-segment LED bargraph simultaneously displays gain reduction and output level, with status LEDs confirming all front-panel settings at a glance.

  Front-panel recessed switches select the 40Hz Bessel high-pass filter (18dB/octave) and the equalization range (±6dB or ±15dB). Comprehensive connectivity includes XLR, 1/4" TRS, and barrier terminal strip on both inputs and outputs, accommodating a wide range of installation and live-sound environments.
specs: |-
  - Input Connectors: 1/4" TRS (female), XLR (female, pin 2 hot), barrier terminal strip
  - Input Impedance: Balanced: 40kΩ; Unbalanced: 20kΩ
  - Max Input Level: >+21dBu
  - Output Connectors: 1/4" TRS (male), XLR (male, pin 2 hot), barrier terminal strip
  - Output Impedance: Balanced: 200Ω; Unbalanced: 100Ω
  - Max Output Level: >+21dBu (2kΩ+); >+18dBm (600Ω)
  - Frequency Response: 20Hz–20kHz, ±0.5dB
  - THD+Noise: <0.04% (0.02% typical at +4dBu, 1kHz)
  - Signal-to-Noise (NR On): >102dB unweighted
  - Dynamic Range (NR On): >120dB unweighted
  - Crosstalk: <–80dB (20Hz–20kHz)
  - EQ Bands: 15 bands per channel
  - Boost/Cut Range: Switchable ±6dB or ±15dB
  - High-Pass Filter: 40Hz, 18dB/octave Bessel
  - Noise Reduction: Type III® (up to 20dB S/N improvement)
  - Limiter Threshold: 0dBu to +24dBu
  - Power: 28W; 100/120/230VAC, 50/60Hz
  - Dimensions: 3.5" H × 19" W × 7.9" D
  - Weight: 8.5 lbs (unit); 9.5 lbs (shipping)
