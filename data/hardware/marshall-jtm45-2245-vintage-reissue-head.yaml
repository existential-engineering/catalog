  - Outputs: 2 x 1/4-inch jack speaker outputs, selectable 16 ohm / 8 ohm / 4 ohm load
  - Inputs: 4 x 1/4-inch jack instrument inputs (high/low sensitivity)
  - Controls: Normal/Loudness II, High Treble/Loudness I, Treble, Middle, Bass, Presence
  - Effects: None
  - Effects loop: No
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x 5881
  - Rectifier valves: 1 x GZ34
