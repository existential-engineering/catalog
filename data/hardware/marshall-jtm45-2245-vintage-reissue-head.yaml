description: Unlock the legendary power of Marshall's iconic sound with the
  JTM45 2245. At lower volume levels, the JTM45 can deliver clean and warm tones
  characterised by a smooth, rich, and balanced response. As you turn up the
  volume, the JTM45 begins to exhibit naturally overdriven valve tones prized
  for their dynamic and responsive feel. Expertly manufactured at Marshall's
  Bletchley, England facility, this 30W vintage reissue meticulously replicates
  the original Marshall sound created over six decades ago.
