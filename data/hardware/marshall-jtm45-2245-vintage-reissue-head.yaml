description: Unlock the legendary power of Marshall's iconic sound with the
  JTM45 2245. At lower volume levels, the JTM45 can deliver clean and warm tones
  characterised by a smooth, rich, and balanced response. As you turn up the
  volume, the JTM45 begins to exhibit naturally overdriven valve tones prized
  for their dynamic and responsive feel. Expertly manufactured at Marshall's
  Bletchley, England facility, this 30W vintage reissue meticulously replicates
  the original Marshall sound created over six decades ago.
details: |-
  Let's take it back to where it all started. This faithful JTM re-issue aims to deliver the sounds of the first Marshall amp produced in the early 60s.

  This amp meticulously replicates the original Marshall sound. Using the GZ34 valve rectifier, it works with the ECC83 and 5881 valves to generate the harmonic and unmistakable Marshall tone.

  At lower volume levels the JTM45 delivers clean and warm tones, with a smooth, rich and balanced response. As the volume is turned up it begins to exhibit naturally overdriven valve tones, prized for their dynamic and responsive feel.

  Using the four loudness inputs and two loudness options, the two voices can be blended together to mix crunch and clean. The amp takes external effects pedals in front of it, since there is no effects loop.

  Expertly manufactured at the Bletchley, England facility, this reissue reproduces the authentic Marshall sound of the first amp Jim Marshall built in a Hanwell shop in the early 1960s. Designed and engineered in UK. Made in UK.
specs: |-
