details: |-
  The McCarty 594 Hollowbody II brings a new set of features to one of our most beloved models: the Hollowbody II. With fully-hollow construction, the Hollowbody II is a resonant guitar with warm, woody tone. The details carried over from the McCarty 594 model impart even more vintage character to this already classic instrument. McCarty III pickups ensure that these guitars are clear and musical while dual volume and push/pull tone controls offer plenty of versatility with both humbucking and single-coil tones on tap.

  McCarty III pickups were spec’d by Paul Reed Smith and the PRS New Products Engineering team. From our own hands-on research into coveted vintage pickup models to advancements in signal analyzation and “tuning” technology, these pickups incorporate every detail of pickup knowledge PRS has gained in recent years of R&D. PRS McCarty III pickups are vintage-inspired humbuckers that bring a vocal clarity to their full, warm tone. A zinc two-piece bridge with brass saddles and steel studs, bone nut, and PRS Phase III tuners with brass shafts anchor this guitar and stay true to the promise of the McCarty family.

  Whether you are looking for rich, authentic humbucking tones or nuanced, sweet single-coil sounds, the McCarty 594 Hollowbody II will oblige with warmth and resonance. Additional appointments include, a bound, 22-fret, 24.594” scale length Pattern Vintage neck with rosewood fretboard and PRS trademark bird inlays.

  In the late 1980’s, Paul Reed Smith called on Ted McCarty to consult with him on guitar design and production techniques. He not only served as a mentor but became a great friend of Paul and everyone he met at PRS. In 1994, PRS released the first McCarty, an instrument that incorporated the full spectrum of techniques and knowledge Paul had gained from Ted as well as his own experiences as a guitar builder.
