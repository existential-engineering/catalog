details: |-
  The King is a headphone amplifier engineered exclusively for Audeze by legendary circuit builder Bascom King. It delivers a powerful, dynamic and panoramic sound with awesome power in the bass, creating an immersive listening experience.

  The amplifier employs a two-stage hybrid design incorporating twin-triode E88CC input tubes, a differential P-MOSFET driver, and MOSFET output devices. The design prioritizes low impedance, low distortion, and wide frequency response with 6W of music power.

  Construction features anodized casework with 1/2" thick side panels, 1/4" thick top and bottom, and a 5/8" thick clear-coated front panel. All active components include faraday cage shielding; the AC input is also shielded to minimize RFI.

  Engineering highlights include separate PCBs for left and right channels with independent voltage regulators, protective magnetic shielding, a massively oversized epoxy-molded toroidal transformer, and a DC servo circuit maintaining near-zero DC offset.

  The symmetrical regulated power supply delivers +/-16V DC to output devices with no capacitors in the signal path, resulting in virtually flat frequency response and exceptional signal clarity. This is a legacy product and no longer available for sale.
specs: |-
  - Type: Headphone amplifier
  - Design: Two-stage hybrid (tube and MOSFET)
  - Input tubes: Twin-triode E88CC pair
  - Driver: Differential P-MOSFET
  - Output devices: NPN MOSFETs
  - Music power: 6W
  - Power supply: Symmetrical regulated, +/-16V DC to output devices, no capacitors in signal path
  - Transformer: Oversized epoxy-molded toroidal
  - Construction: Anodized casework, 1/2" thick side panels, 1/4" thick top/bottom, 5/8" thick clear-coated front panel
  - Shielding: Faraday cage on active components, shielded AC input
  - SKU: 300-BA-1110-01-B
