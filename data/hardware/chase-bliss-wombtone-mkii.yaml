description: An all-analog phaser pedal with digitally-controlled parameters,
  featuring switchable 2, 4, and 6 stages of phase shifting and a rare mix
  control that moves from full dry to pure phase vibrato.
details: |-
  Wombtone mkII is an all-analog phaser pedal where every knob and switch is connected to a digital brain while the guitar signal stays 100% analog and never gets digitally processed.

  Switchable 2, 4, and 6 stages of phase shifting provide a wide range of phaser tones, from subtle to dramatic. A rare mix control moves from full dry to pure phase vibrato.

  The pedal includes 3 presets, 16 DIP switches for customization, relay bypass, MIDI control, and expression pedal compatibility.
specs: |-
  - All-analog signal path with digital control
  - Switchable 2, 4, or 6 phase stages
  - Mix control: full dry to pure phase vibrato
  - 3 presets
  - 16 DIP switches
  - Relay bypass
  - MIDI capable
  - Expression input
  - Mono I/O
