description: "Take multitracking and live performance to the next level. The
  Mackie Onyx16 is a premium 16-channel USB mixer optimized for professional
  recording, production and live sound."
details: |-
  Record, produce and perform with a 16-channel mixer that offers remarkable performance, exceptional versatility and a wide host of features that will ignite your creativity.

  Every detail of the Mackie Onyx16 is geared towards recording at a professional level, from our award-winning Onyx preamps to the Perkins 'British Style' EQs inspired by classic desks from the '60s and '70s.

  With 24-Bit/96 kHz multitrack USB recording to Mac/PC, stereo recording directly to an SD card, professional customizable Dynamic FX, and Bluetooth streaming, the Onyx16 provides a complete production hub for studio and stage. The full-color LCD Studio Command interface puts deep control at your fingertips.
specs: |-
  - 18x4 analog USB mixer
  - 12 low-noise Onyx mic preamps with 60dB gain
  - 3-band Perkins 'British Style' EQ with On/Off hard bypass
  - Switchable hi-Z inputs for guitars and bass
  - 24-Bit/96 kHz multitrack USB recording to Mac/PC
  - Stereo recording directly to an SD card
  - Professional customizable Dynamic FX
  - Full-color LCD Studio Command interface
  - Bluetooth streaming support
  - 'Built-Like-A-Tank' steel chassis
