description: The Mackie Onyx16 is a premium 16-channel USB-equipped analog mixer
  with professional award-winning preamps and built-in customizable effects.
details: |-
  Take multitracking and live performance to the next level. The Mackie Onyx16 is a premium 16-channel USB mixer optimized for professional recording, production and live sound. Experience impeccable sound quality, a flexible FX engine and seamless workflow for the studio or the stage.

  Record, produce and perform with a 16-channel mixer that offers remarkable performance, exceptional versatility and a wide host of features that will ignite your creativity. Every detail of the Mackie Onyx16 is geared towards recording at a professional level, from our award-winning Onyx preamps to the Perkins “British Style” EQs inspired by classic desks from the ‘60s and ‘70s.

  Channels 1 to 8 are mono channels with an XLR mic input and a 1/4 inch line input, with Hi-Z switches on channels 1 and 2 and channel inserts on channels 5 to 8. Channels 9/10 through 15/16 are hybrid stereo channels, each pairing an XLR mic input with left/mono and right 1/4 inch line inputs, and channel 17/18 takes a 1/4 inch stereo pair, the 1/8 inch stereo input or Bluetooth.

  Award-winning Onyx mic preamps provide up to 60 dB of gain, and the 3-band Perkins British-style EQ is based on the circuit used on classic mixing consoles from the 60s and 70s, with a sweepable midrange on the mono channels and a hard-bypass EQ in/out switch.

  A high-resolution FX processor supplies 12 presets covering delay, echo, slapback, hall, room and plate reverbs, two choruses, flanger and three combined delay/reverb/chorus programs, edited and saved from the Studio Command full-color display and single-knob encoder.

  Studio Command also handles stereo recording and playback direct to an SD card, with dedicated Previous, Next, Record and Play/Pause buttons, while a paired Bluetooth device streams audio into the last stereo channel and can be routed to the aux sends or the main mix.

  The steel Built-Like-A-Tank chassis carries sealed rotary pots, backlit mute and solo buttons and QuickGrip side cheeks. Power comes from a universal 100-240 VAC supply through a 3-pin IEC line cord.
specs: |-
  - 18x4 analog mixer with 12 Onyx mic preamps providing up to 60 dB of gain
  - 3-band Perkins British-style EQ on all channels with On/Off hard bypass switch
  - Low +/-15 dB at 80 Hz, sweepable mid +/-15 dB from 100 Hz to 8 kHz on mono channels, high +/-15 dB at 12 kHz
  - 100 Hz low-cut filter at 18 dB/octave and 48V phantom power on all mic channels
  - Hi-Z switches on channels 1 and 2 for direct connection of guitars and basses
  - High-resolution multitrack recording to Mac/PC via USB at up to 24-bit / 96 kHz (18x4)
  - Stereo 2x2 24-bit / 96 kHz recording and playback direct to SD card
  - Channel-assignable 4-track USB return (two stereo pairs)
  - 12-preset digital FX engine with dedicated FX EQ and editable, storable user presets
  - Studio Command 128 x 160 px full-color TFT display with push-button rotary encoder
  - Bluetooth streaming into the last stereo channel, routable to aux sends and main mix
  - Channel inserts on channels 5-8
  - 2 aux/monitor send outputs plus a dedicated FX send
  - Dedicated stereo control room outputs and headphone output with its own level control
  - AFL/PFL channel solo and 12-segment stereo main meters
  - Equivalent input noise -128 dBu, mic input maximum +22 dBu, main mix XLR +28 dBu
  - Universal 100-240 VAC power supply via 3-pin IEC line cord, 45 watts
  - Dimensions 18.7 x 14.0 x 5.4 in / 475 x 356 x 137 mm, weight 15.6 lb / 7.1 kg
