details: |-
  The CCM664SR is a dual, two-way ceiling speaker featuring a 150mm (6in) woven glass fibre cone bass/midrange driver and two offset soft dome tweeters.

  The twin voice coil bass/midrange driver and tweeters allow a stereo signal to be combined to facilitate the use of just one ceiling speaker in a single installation area without the loss of one audio channel.

  The CCM664SR also includes a two-position stereo/surround switch to instantly make the speaker very suitable to be used as a surround channel. Incorporating QuickDogs and plug-and-play functionality it is quick and easy to install.

  The speaker is listed as a Performance two-way, dual-channel in-ceiling speaker in a White finish.

  CCM6 Series ceiling speakers install into a cut ceiling aperture using the supplied cut-out template. Speaker cable connects to the spring terminals on the side of the frame, red for the amplifier's positive terminal and black for its negative, and the frame is then lifted into the aperture and held by four QuickDogs spring clamps. The baffle carrying the drivers and crossover fits into the frame on three push-lock fasteners, and the grille is held magnetically. The CCM664SR carries left and right sets of terminals. In surround mode the cable connects to either set, with the switch on the back set to surround.
specs: |-
  - Description: 2-way dual channel in-ceiling system
  - Drive units: 2x ø20mm (1in) soft dome tweeter
  - Drive units: 1x ø150mm (6in) black glassfibre cone bass/midrange driver
  - Frequency range (-6dB): 48Hz to 30kHz
  - Recommended amplifier power: 25 to 80W (per channel)
  - Sensitivity SPL (2.83V, 1m): 82dB (per channel), 88dB (both channels driven)
  - Nominal impedance: 8Ω (minimum 4Ω) per channel
  - Frame diameter: 240mm (9.5in)
  - Cut-out diameter: 202mm (8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C6
  - Back box: 6C
  - Twin voice coil bass/midrange driver, two-position stereo/surround switch
  - Left and right sets of red and black spring terminals on the frame
  - Finish: White
