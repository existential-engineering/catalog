details: |-
  A single button footswitch for remote channel selection on Friedman amplifiers, supplied with the cable that connects it to the amp. An LED on the housing shows when the switch is activated, so the selected channel stays readable on a dark stage.

  Friedman lists it as the footswitch for the JJ-Junior, Runt-20, Runt-50, Smallbox, Twin Sister and JJ-100, and describes it as designed for working musicians.
specs: |-
  - Single button footswitch
  - LED indicator to show activation
  - Supplied with connecting cable
  - For the JJ-Junior, Runt-20, Runt-50, Smallbox, Twin Sister and JJ-100
  - Designed for working musicians
  - No power connection of its own, the amplifier feeds the LED through the footswitch cable
  - Listed dimensions: 7 in x 7 in x 7 in
  - Listed weight: 2 lbs
