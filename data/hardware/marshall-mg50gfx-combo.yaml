description: The MG50GFX is a 50W solid-state guitar combo amplifier from
  Marshall's MG Gold range, built around a 12-inch custom speaker. It offers
  four channels — Clean, Crunch, OD1, and OD2 — covering everything from
  crystal-clear cleans to gritty crunch and high-gain overdrive, with a shared
  three-band EQ for tone shaping. The amplifier includes a built-in digital
  effects section (reverb, chorus, phaser, flanger, delay, and more) accessible
  from the front panel, an MP3/line input for jamming with backing tracks, an
  emulated headphone output for silent practice and direct recording, and
  connections for an external FX pedal and footswitch.
