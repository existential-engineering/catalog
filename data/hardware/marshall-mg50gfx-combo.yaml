description: The MG50GFX is a 50W solid-state guitar combo amplifier from
  Marshall's MG Gold range, built around a 12-inch custom speaker. It offers
  four channels — Clean, Crunch, OD1, and OD2 — covering everything from
  crystal-clear cleans to gritty crunch and high-gain overdrive, with a shared
  three-band EQ for tone shaping. The amplifier includes a built-in digital
  effects section (reverb, chorus, phaser, flanger, delay, and more) accessible
  from the front panel, an MP3/line input for jamming with backing tracks, an
  emulated headphone output for silent practice and direct recording, and
  connections for an external FX pedal and footswitch.
details: |-
  A gig-worthy 50W amp with an undeniably bold sound. With four channels, three-band EQ and a range of digital FX, the MG50FX gives you full control of your tone.

  Each channel can store and recall your settings instantly, while the included 2-way latching footswitch lets you switch between clean:crunch and overdrive channels for hands-free control. The MG50FX is also compatible with PEDL-90008 (sold separately).

  Its custom 12" speaker delivers powerful sound, making the MG50FX a versatile choice that can easily cope with gigs while remaining well-suited for studio use.

  Recording directly and practising silently is now more effortless than ever, thanks to the emulated speaker output. This feature not only simplifies the direct recording process from the amplifier, but also allows silent practice sessions. And the MP3/line input feature allows you to play along with all your favourite songs.

  The MG50FX is purposefully crafted with FX pedals in mind. It features built-in digital FX and also seamlessly accommodates the use of external FX pedals through its series effects loop. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Model: MG50FX, MG Gold range
  - Output wattage: 50W
  - Technology: solid state
  - Channels: 4 (store and recall) - clean, crunch, OD1, OD2
  - Effects: reverb, chorus, phaser, flanger, vibe, octave, delay
  - Controls: gain, clean/crunch select, bass, OD1/OD2 select, middle, treble, reverb, volume, tuner, tap, store, FX select, delay, ext FX switch, master volume, damping switch, store switch
  - Effects loop: yes, 1 x series
  - Speaker outputs: 1 x 1/4" jack socket (minimum 8 ohm load)
  - Speaker configuration: 1x12"
  - Speaker model: custom speaker (8 ohm, 50W)
  - Unit impedance: 8 ohm
  - Inputs: 1 x 1/4" jack instrument input, 1 x 3.5 mm MP3/line input
  - Emulated speaker output for direct recording and silent practice
  - Included in the box: PEDL-90010 2-way latching footswitch, detachable power cable
  - Also compatible with the PEDL-90008 footswitch (sold separately)
  - Weight: 16.6 kg / 37 lb
  - Width: 520 mm / 20.5"
  - Height: 505 mm / 19.9"
  - Depth: 280 mm / 11"
  - Colour: black and gold
  - Country of origin: designed and engineered in UK, made in Vietnam
