description: >-
  The Casio VZ-8M is a 1U rack-mount synthesizer module utilizing Casio's Interactive
  Phase Distortion (IPD) synthesis engine with 8 voices of polyphony. Released in 1988, it
  was designed with MIDI guitar and wind controller compatibility in mind, offering 8
  individually configurable sound modules each with a DCO and DCA.
details: |-
  The VZ-8M entered the market in 1988 as a compact rack-mounted counterpart to Casio's VZ-1 and VZ-10M synthesizers, remaining in production until 1991. It utilized Casio's Interactive Phase Distortion (IPD) synthesis, a digital method that offered complex harmonic possibilities through phase modulation of multiple waveform modules.

  The instrument features eight sound modules that can be configured individually, each with selectable waveforms including Saw Down, Saw Up, Sine, Super Saw, and White Noise. This modular architecture allowed for sophisticated sound design beyond simple preset playback, giving users granular control over each voice component.

  Casio specifically targeted users of their MIDI guitars and wind controllers with dedicated performance modes, making the VZ-8M a practical live and studio companion for non-keyboard players. The synth also offered expandability through optional ROM and RAM cards for additional patch storage.

  The compact 1U form factor came with trade-offs, notably a small 2x16-character LCD display that made on-board programming tedious. Contemporary users found that computer-based editors were practically essential for serious sound design work on the unit.
specs: |-
  - Polyphony: 8 voices
  - Multitimbral: 8 parts
  - Oscillators: 8 modules with DCO and DCA
  - Waveforms: Saw Down, Saw Up, Sine, Super Saw, White Noise
  - LFO: 2 (Saw Down, Square, Triangle)
  - Memory: 64 patches RAM, 128 patches ROM
  - MIDI: In, Out, Thru
  - Form Factor: 1U 19-inch rackmount
  - Year: 1988-1991
