description: A passive stereo inductive field recording device that picks up
  electromagnetic signals for use with body contact, allowing electromagnetic
  fields to be captured or amplified in stereo.
details: |-
  Hidden beyond the realm of sight and touch, lies a world of electromagnetic signals, hidden to you. This Sensory Enhancement Device will allow you to finally achieve the enlightenment of electromagnetic signals you seek. No mere bit-sniffer attached to a jack, this device is an iteration on the Herzlich SEE ALL, but upgraded with 1/4" jacks, hand friendly sizing and stereo pickups. Finally, the strange world of electromagnetism can be heard by human ears in stereo. Move through the world, listening to the harmonies of electric and electronic signals that surround us, and capture them in pristine stereo for later. This is a passive module. It requires amplification to hear the true splendour of the hidden world. Suitable for experimental musicians and field recording enthusiasts alike. A field recorder with a bit of amplification on tap is recommended.
