description: >-
  The Kawai K4r is the rackmount version of the K4 digital synthesizer, offering
  16-voice polyphony and 8-part multitimbrality with a warm, lo-fi digital
  character well suited to industrial, trip-hop, and big-beat production.
details: |-
  The Kawai K4r is the rack-mount variant of the K4 keyboard synthesizer,
  released in 1989. It retains all the sonic capabilities of the keyboard
  version but omits the onboard effects processor, trading it for eight
  individual audio outputs that make it a more flexible studio tool.

  The K4 series occupies an interesting niche in the digital synth landscape.
  Its 16-bit PCM sample-based engine produces sounds with a distinctly warm
  and slightly gritty digital character that sets it apart from the cleaner
  rompler modules of the era. This quality has made it a favorite for lo-fi,
  industrial, and electronic music production.

  The synth offers a digital dynamic filter for analog-style sound shaping,
  giving users more hands-on tonal control than many competing digital modules
  of the late 1980s. Combined with its 8-part multitimbrality and 16-voice
  polyphony, it provides considerable flexibility for layering and arranging.

  Notable users of the K4 series include The Chemical Brothers and ATB, who
  have taken advantage of its capacity for strange, unique textures that blend
  digital precision with an unexpectedly organic feel.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 8 parts
  - Sound source: 16-bit PCM digital
  - Filter: Digital dynamic filter
  - Keyboard: None (rackmount module)
  - Effects: None (keyboard version only)
  - Control: MIDI
