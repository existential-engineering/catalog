description: >-
  The Quasimidi Quasar is a digital rack-mount synthesizer from the early 1990s
  that employed Multi-Algorithm Sound Synthesis (M.A.S.S.) to simulate vintage
  analog sounds without traditional oscillators. It features 1000 onboard ROM
  sounds, 16-part multitimbral capability with General MIDI compatibility, and
  two built-in effects processors including a vocoder. Popular within the dance
  music scene of the 1990s, it offered a user-friendly interface with clearly
  labeled controls and a large 2x40 character LCD display.
details: |-
  The Quasar was produced by the German company Quasimidi as an early attempt at recreating the character of analog synthesis through digital means. Rather than using conventional oscillators, it employed Multi-Algorithm Sound Synthesis (M.A.S.S.), processing its 1000 onboard ROM sounds through various synthesis techniques to achieve warm, analog-like timbres. The controls and knobs have been noted as feeling rather flimsy for a German-made product, though the interface design itself is praised for its clarity.

  The synthesizer supports 16 simultaneous parts including dedicated drum functionality, with full General MIDI compatibility for broad sequencer integration. Two oscillators feed into a single VCA with ADSR envelope shaping, while a built-in arpeggiator syncs to MIDI clock for rhythmic pattern generation. The sound palette includes traditional options as well as more modern selections for 1990s standards, particularly resonant bass sounds and quality drum samples.

  Two effects processors provide a range from chorus and panning to distortion, vocoder, reverb, and delay. The interface emphasizes user-friendliness with clearly labeled controls and a readable 2x40 character LCD display featuring large, bold text that was superior to many contemporary competitors. Most functions are accessible via single buttons, minimizing menu navigation, with numbered buttons for sound selection and up/down selectors for browsing within groups.

  The Quasar was especially popular within the dance crowd in the 1990s for its versatility and comprehensive production capabilities. By modern standards it can sound a little muffled and lo-fi, but it retains a characteristic usability and charm that keeps it relevant among vintage synth enthusiasts.
specs: |-
  - Synthesis: Multi-Algorithm Sound Synthesis (M.A.S.S.)
  - Polyphony: 21 voices
  - Multitimbral: 16 parts
  - Oscillators: 2
  - Waveforms: ROM-based (1000 sounds)
  - LFO: 1
  - VCA: 1 with ADSR envelope
  - Arpeggiator: Built-in, synced to MIDI clock
  - Effects: 2 processors (chorus, panning, distortion, vocoder, reverb, delay)
  - Memory: 1000 ROM sounds, 200 performance layer sounds
  - Demo Songs: 1
  - GM Compatible: Yes
  - Control: MIDI In/Out/Thru (2 MIDI inputs)
  - Outputs: Stereo output, 4 individual outputs
  - Display: 2x40 character LCD
  - Format: Rack-mount
releaseDate: "1993"
