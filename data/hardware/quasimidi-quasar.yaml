description: >-
  The Quasimidi Quasar is a digital rack-mount synthesizer from the early 1990s featuring
  Multi-Algorithm Sound Synthesis (M.A.S.S.), an early approach to simulating vintage analog
  sounds without traditional oscillators. It offers 1000 onboard ROM sounds, 21-voice
  polyphony, 16-part multitimbral capability with GM compatibility, and built-in effects
  including a vocoder.
details: |-
  The Quasar was produced by the German company Quasimidi as an early attempt at recreating the character of analog synthesis through digital means. Rather than using conventional oscillators, it employed Multi-Algorithm Sound Synthesis (M.A.S.S.), processing its 1000 onboard ROM sounds through various synthesis techniques to achieve warm, analog-like timbres.

  The 21-voice polyphonic engine supports 16 multitimbral parts including dedicated drum parts, with full General MIDI compatibility for broad sequencer integration. Two oscillators feed into a single VCA with ADSR envelope shaping, while a built-in arpeggiator syncs to MIDI clock for rhythmic pattern generation.

  Two effects processors provide chorus, vibrato, delays, vocoder, filters, and reverbs. The interface emphasizes user-friendliness with clear labeling and a readable 2x40 character LCD display. Connectivity includes dual MIDI inputs, stereo output, and four individual outputs for flexible studio routing. The rack-mount format and 200 performance layer sounds made it a popular choice for 1990s dance music production.
specs: |-
  - Polyphony: 21 voices
  - Multitimbral: 16 parts
  - Oscillators: 2
  - Waveforms: ROM-based (1000 sounds)
  - LFO: 1
  - VCA: 1 with ADSR envelope
  - Arpeggiator: Built-in, synced to MIDI clock
  - Effects: 2 processors (chorus, vibrato, delays, vocoder, filters, reverbs)
  - Memory: 1000 ROM sounds, 200 performance layer sounds
  - Control: MIDI In/Out/Thru (2 MIDI inputs)
  - Outputs: Stereo output, 4 individual outputs
  - Display: 2x40 character LCD
releaseDate: "1993"
