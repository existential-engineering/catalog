description: 'The Midas M32R LIVE is a rack-mountable mid-format digital live
  mixing console combining classic British console design with modern
  technology. It features award-winning Midas PRO Series microphone
  preamplifiers, 17 motorised faders (rated for 1,000,000 life cycles), 17
  programmable LCD scribble strips, and a 5" day-viewable colour TFT display.
  The audio engine is floating-point with 0.8 ms latency and 192 kHz ADC/DAC
  converters. The console supports 32 mic inputs, 8 aux inputs, and 16 mix
  buses, plus FX stereo returns, Matrix, Main and DCA levels. Dual AES50 network
  ports (Klark Teknik SuperMAC) provide ultra-low latency digital audio over
  CAT5, enabling up to 96 input channels via cascaded DL16 / DL150 stage boxes.
  On-board ULTRANET delivers a 16-channel digital mix to P16 Personal Monitor
  Mixers, MIDI I/O supports bidirectional communication, and Ethernet enables
  remote control over LAN (PC, Mac, iPad, iPhone). An expansion slot accepts
  DN32-USB (standard, 32x32 channels + 16 MIDI), DN32-ADAT, DN32-MADI, or
  DN32-DANTE cards. The console includes 8 true-stereo studio-grade FX engines
  with 16+ effect plug-ins and 50+ effects based on physical modelling
  (including emulations of LA-2A, 1176LN, Fairchild 670, Pultec EQP-1a, MEQ5,
  Lexicon 480L, EMT250 and Quantec QRS), plus a 100-band Real Time Analyzer.
  Scene management supports 500 Cue entries x 100 Scenes x 100 Snippets.
  Recording is supported at 44.1/48 kHz 24-bit (32 tracks via USB 2.0).'
details: |-
  The Midas M32R LIVE is a mid-format rack-mountable digital live mixing console designed in collaboration with industrial designer Rajesh Kutty (known for luxury automotive work). It features 17 motorised Midas PRO faders (1,000,000 life-cycle rated), 17 programmable LCD scribble strips, and a 5-inch day-viewable colour TFT display. The console handles 32 mic inputs, 8 aux inputs and 16 buses (plus FX stereo returns, Matrix, Main and DCA levels) through a floating-point engine with 0.8 ms latency and 192 kHz ADC/DAC converters. Dual AES50 network ports with Klark Teknik SuperMAC technology carry 48 bidirectional channels each over a single shielded CAT5 cable, supporting cascaded DL16 / DL150 stage boxes (up to 48 channels in / 24 out, or 96 input channels system-wide). On-board ULTRANET sends a 16-channel digital mix to P16 Personal Monitor Mixers via CAT5. The expansion slot ships with the DN32-USB card (Hi-Speed USB 2.0, 32x32 channels + 16 MIDI, 400 Mbit/s) and accepts DN32-ADAT, DN32-MADI or DN32-DANTE alternatives. Eight true-stereo studio-grade FX engines host 16+ plug-ins and 50+ effects based on physical modelling, including emulations of the LA-2A, 1176LN, Fairchild 670, Pultec EQP-1a, Pultec MEQ5, Lexicon 480L (Rich Plate / Room / Rich Chamber), EMT250 and Quantec QRS, plus chorus, delay, flanger, de-esser, limiter, wave designer, sub octaver and exciters. A 100-band Real Time Analyzer offers bar, spectrograph and 10-second sonogram views. Scene management spans 500 Cue entries, 100 Scenes and 100 Snippets. Remote control is available via M32-EDIT (PC/Mac/Linux), M32-MIX (iPad, up to 10 devices) and M32-Q (iPhone/iPod/Android). 32-track recording at 44.1/48 kHz, 24-bit runs via USB 2.0. Gain Splitting separates channel gain from head-amp gain to allow independent FOH and monitor mixes. Construction blends carbon-fibre with top-grade aluminium and steel for a high strength-to-weight ratio.
specs: |-
  - Form Factor: Rack-mountable digital desktop mixing console
  - Input Channels: 32 mic inputs + 8 Aux inputs
  - Mix Buses: 16
  - Motorised Faders: 17 (Midas PRO, rated 1,000,000 life cycles)
  - LCD Scribble Strips: 17 programmable
  - Main Display: 5" colour TFT (day-viewable)
  - Sample Rate: 44.1 / 48 kHz (recording); 192 kHz ADC/DAC converters
  - Bit Depth: 24-bit
  - Audio Engine: Floating-point, 0.8 ms latency
  - FX Engines: 8 true-stereo studio-grade engines
  - Effects: 16+ effect plug-ins, 50+ effects total (physical modelling)
  - Real Time Analyzer: 100-band RTA with bar, spectrograph and 10-second sonogram views
  - Scene Management: 500 Cue entries x 100 Scenes x 100 Snippets
  - Recording: 32-track via USB 2.0 at 44.1/48 kHz, 24-bit
  - AES50 Channels: 48 bidirectional channels per port @ 48 kHz over CAT5 (Klark Teknik SuperMAC)
  - AES50 System Capacity: Up to 96 input channels across both ports
  - ULTRANET: 16-channel digital mix to P16 Personal Monitor Mixers via shielded CAT5
  - USB Expansion (DN32-USB, standard): Hi-Speed USB 2.0, 32x32 channels audio + 16 MIDI channels, 400 Mbit/s
  - Expansion Slot: 1 (accepts DN32-USB, DN32-ADAT, DN32-MADI, or DN32-DANTE)
  - Remote Control Apps: M32-EDIT (PC/Mac/Linux), M32-MIX (iPad, up to 10 devices), M32-Q (iPhone/iPod/Android)
