description: The Bricasti Design M7M Reverb Processor Mainframe is an exact
  duplicate of the M7 Stereo Reverb Processor with a reduced front panel,
  intended for use with the M10 Remote Console in multi-channel reverb
  installations. Handcrafted in the USA.
details: |-
  The Bricasti Design M7M Reverb Processor Mainframe is an exact duplicate
  of the M7 Stereo Reverb Processor with reduced front panel controls,
  intended for use in conjunction with the M10 Remote Console. It is offered
  bundled with the M10 in several configurations, or as a standalone product
  for customers wishing to add more channels of Bricasti processing without
  duplicating user interface controls.

  The M7M features more than 200 unique reverb presets with a revolutionary
  True Stereo Reverb Process algorithm. Classic and new presets include Halls,
  Plates, Chambers, and Ambient Spaces. 12 parametric program parameters are
  available, along with 100 user registers and 4 front panel Favorites for
  quick saves and comparisons.

  The digital section features AES 24-bit digital I/O with AES single-wire
  192k support, self-clocking to incoming sample rates from 44.1k to 192k, and
  six state-of-the-art dual-core Analog Devices DSPs. Jitter performance is
  under 20 picoseconds.

  The analog section uses fully-balanced, DC-coupled input and output circuits
  with balanced XLR analog I/O, 24-bit conversion, and dual D/A converters.
  Analog input dynamic range exceeds 116 dB A-weighted, with THD+N below
  0.001% and frequency response of 10 Hz to 20 kHz within 0.05 dB.

  Hardware construction features dual dedicated power supplies, a non-corrosive
  stainless steel chassis, milled anodized aluminum front panel, and MIDI I/O.
  Each unit is hand crafted in the USA.
specs: |-
  - AES 24-bit digital I/O
  - AES single wire 192k supported
  - Self-clocking to incoming sample rates 44.1k to 192k
  - 6 dual-core Analog Devices DSPs
  - Less than 20 picoseconds jitter
  - Balanced XLR analog I/O, fully-balanced DC-coupled
  - 24-bit conversion with dual D/A converters
  - Analog input dynamic range: >116 dB A-weighted
  - Analog input THD+N: <0.001%
  - Analog input frequency response: 10Hz–20kHz ±<0.05dB
  - Analog input CMRR: >60 dB @ ≤1kHz
  - Analog input maximum level: +24 dBu
  - Analog output dynamic range: >116 dB A-weighted
  - Analog output THD+N: <0.001%
  - Analog output frequency response: 10Hz–20kHz ±<0.05dB
  - Analog output maximum level: +24 dBu
  - More than 200 unique reverb presets
  - 12 parametric program parameters
  - 100 user registers, 4 front panel Favorites
  - MIDI I/O
  - Dual dedicated power supplies
  - Non-corrosive stainless steel chassis
  - Milled anodized aluminum front panel
  - Hand crafted in the USA
