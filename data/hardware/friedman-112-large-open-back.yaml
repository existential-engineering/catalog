details: |-
  The Friedman 'Large' 1x12 is a 1x12 inch, open-back cabinet. It utilizes tongue and groove Baltic Birch construction to deliver the bass, mid response and great sound expected from a Friedman cab.

  At the heart of the cab is a Celestion G12H Redback 16 ohm speaker. The G12H Redback shares the definitive vintage Celestion ceramic magnet guitar speaker heritage of its Creamback stablemate, which was developed in the mid-sixties. Players like Hendrix, Clapton, Beck and Page, who typified the louder and more aggressive blues rock playing styles that came to characterize that era, quickly adopted it.

  The G12H Redback used in the 112 open back cab produces the familiar woody G12H tone, but handles greater power. This makes it ideally suited for yesterday and today's amps, when a vintage and modern tone is desired. The increased power handling brings with it low end grunt complementing the warm and vocal mid range, crunchy upper-mids and sweet, refined highs.

  As with all Friedman cabinets, oversized 12-gauge speaker wire is soldered between the speaker and terminal, assuring every ounce of valuable tone is captured. The 112 open back cab is handcrafted with pride in the USA and designed to withstand the rigors of the road.

  The 112 can be ordered with the grill cloth and faceplate of the player's choice, with several options to choose from.
specs: |-
  - 1x12 inch open-back guitar cabinet
  - Multi-ply Baltic Birch tongue and groove construction
  - 1 x Celestion G12H Redback 16 ohm speaker
  - Nominal impedance 16 ohms
  - Oversized 12-gauge speaker wire soldered between speaker and terminal
  - Grille cloth options: Silver/Black Weave, Gold/Black Weave, Vintage, Checked, Black
  - Grill colour and faceplate selected at order
  - Dimensions 9.5 in (D) x 24 in (W) x 21 in (H)
  - Weight 34 lbs
  - Hand-crafted in the USA
  - Limited lifetime warranty
