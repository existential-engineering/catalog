description: Flagship floor processor combining an eight-voice vocal harmony
  engine, a vocal multi-effects suite, a guitar multi-effects suite with amp and
  cabinet modelling, and a six-track synchronised looper. The rear panel carries
  mic, guitar and aux inputs, XLR and 1/4-inch outputs, MIDI, USB and an SD
  slot.
details: |-
  VoiceLive 3 Extreme is the top of the TC Helicon floor processor range, built for singing musicians who want one box for the whole performance. It combines an eight-voice harmony engine, a vocal multi-effects suite, a full guitar multi-effects suite and a six-track synchronised looper in a pedalboard chassis.

  The vocal side covers harmony, doubling, reverb, delay, HardTune, transducer, distortion and the Adaptive Tone engine. The guitar side provides amp and cabinet modelling, drive, modulation and a tuner, so an acoustic or electric instrument can go straight to a PA.

  The looper records six independent vocal and guitar tracks, each with its own undo, redo and stop, and locks them to a shared tempo for building arrangements during a performance. Up to 500 loop arrangements can be saved to onboard storage and recalled by preset.

  Routing is extensive for a stage unit. The rear panel carries a combo mic and line input with phantom power, a guitar input and thru, a stereo aux input, XLR monitor in and thru, XLR voice outputs, 1/4-inch guitar outputs, a headphone output, footswitch and expression jacks, MIDI in and out, a USB host port and a USB mini-B port, and an SD slot for backups.
specs: |-
  - Eight-voice harmony engine
  - Vocal effects: harmony, doubling, reverb, delay, HardTune, transducer and distortion
  - Guitar effects: amp and cabinet modelling, drive, modulation and a tuner
  - Adaptive Tone sweeps EQ, compression, de-essing and gating on the lead vocal
  - Six-track synchronised looper with per-track undo, redo and stop
  - Storage for up to 500 loop arrangements, recalled by preset
  - Combo microphone and line input with phantom power
  - SD card slot for backups
  - Ground lift switch on the outputs
  - External DC power supply with a rear power switch
  - Kensington security slot
