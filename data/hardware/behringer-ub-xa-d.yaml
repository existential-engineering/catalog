description: A 16-voice analog polyphonic synthesizer that recreates the classic
  OB-Xa in a compact desktop and rack-mountable chassis, with 2 VCOs per voice,
  dual-slope 12/24 dB filters and 8 vintage synthesizer modes. It is
  multi-timbral, splitting or layering two different sounds, and carries an
  8-channel modulation matrix, a dual-layer arpeggiator and sequencer and 512
  user program memories.
details: |-
  The UB-Xa D has all the bells, whistles and characteristics that came with the original, but this time it all fits into a more compact rack mount version that can easily integrate into an existing setup and stay within arm's reach no matter the size of the stage. It is also filled to the brim with modern features such as 512 user program memories and comprehensive MIDI implementation, making for a well-rounded synth that will make friends with anything in the rig.

  To recreate the iconic growl and sizzle of the original OB-Xa, its inner workings were brought into the 21st century, including all of the original factory patches that made the 80s roar. Thanks to VCOs and VCFs heavily based on the original 3340 and 3320 chip designs, 16 voices and the ability to split or layer two different sounds, the UB-Xa D is capable of conjuring up massive sounding riffs.

  The UB-Xa D is a synth that stands on the shoulders of giants. Its lineage gave birth to some of the 80s most iconic hits, from Rush's Geddy Lee, the Police and Prince to Van Halen, and even the Terminator theme composed by Brad Fiedel.

  An 8-channel modulation matrix provides the flexibility that expands what the UB-Xa D can do sonically. The 26 rotary controls plus a myriad of other functions give direct control over the VCOs, LFOs, ADSR generators and VCAs to sculpt a sound in a nigh-on unlimited number of ways, and the MIDI implementation lets a favourite controller be paired to expand the instrument's functionality further.

  Up to 512 user program memories store any setting that can be dialled in, with a compare and match feature to bring all the analog controls back to the stored program values. Memories can be assigned to any of the preset recall switches so presets can be changed on the fly, in the middle of a jam.
specs: |-
  - 16 analog voices, 16-note polyphony
  - 2 VCOs per voice with oscillator sync mode
  - VCOs and VCFs based on reproductions of the original 3340 and 3320 semiconductor designs
  - VCO waveforms: sawtooth, triangle or square with variable pulse width
  - Selectable dual-slope 12/24 dB analog low-pass filter per voice with adjustable resonance
  - 2 ADSR generators per voice for VCF and VCA control
  - 2 dedicated LFOs with 7 waveform shapes, modulating pulse width, oscillator pitch and filter cutoff
  - Stereo VCA per voice for voice/layer panning
  - 8-channel modulation matrix
  - 8 vintage modes including OB-Xa and OB-8 signatures
  - Multi-timbral: split or layer 2 different sounds
  - Dual-layer arpeggiator and sequencer with real-time sequence transpose
  - 512 user program memories with compare and match feature
  - 26 rotary controls, LCD display with encoder, assignable preset recall switches
  - Spring-loaded pitch and assignable modulation paddles
  - Velocity and after-touch optionally available for expressive performance
  - MIDI Polyphonic Expression (MPE) support
  - Comprehensive MIDI implementation including NRPN/CC control of all parameters and bulk load/save
  - Fully servo-balanced outputs
  - CV/pedal inputs for expression pedals and footswitches
  - Desktop chassis for stage use or rack mount operation, rack mount brackets included
  - Includes all original OB-Xa factory patches
