description: The KA8 is an active drum amp/monitor speaker with an 8-inch woofer
  and compression driver. It includes onboard DSP EQ presets, Bluetooth
  streaming, and multiple audio inputs including a 1/4-inch drum input and
  headphone output.
details: |-
  The KAT KA8 series speakers are high performance active speakers featuring loads of class D power. The KA8 features 50 watts of power through one 8″ low-frequency driver and one high frequency compression driver. Each features four modes of onboard DSP EQ presets and up to three channels of audio input including Bluetooth audio streaming. The XLR thru allows performers to enhance their sound by connecting to other powered speakers for system expansion. You can also connect with another KAT KA series speaker (Bluetooth only) for even more expandability. The portable design & standard speaker pole mount make for an easy setup and breakdown. The KAT KA8 high power speakers will satisfy all your performance needs.
specs: |-
  - 8-Inch Woofer: Provides deep, punchy bass response.
  - Bluetooth Connectivity: Stream music wirelessly from any Bluetooth-enabled device.
  - 50W Power Output: Ensures loud and clear sound.
  - 3-Band EQ: Adjust bass, mid, and treble frequencies for optimal sound.
  - Multiple Inputs: Includes 1/4" drum input, auxiliary input, and headphone output.
  - Portable Design: Lightweight and easy to transport.
  - Model: KA8
  - Power Output: 50W
  - Speaker Size: 8-inch woofer
  - Connectivity: Bluetooth, 1/4" inputs, aux input, headphone output
  - Dimensions: 12" W x 13" L x 10" H
  - Weight: Approximately 15 lbs
