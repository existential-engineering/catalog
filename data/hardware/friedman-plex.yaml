description: The Plex is a 50-watt, two-channel, EL34-powered head that
  recreates Dave Friedman's 1968 JMP Super Lead. It is the first model in the
  Friedman Vintage Collection.
details: |-
  Dave Friedman's personal 1968 JMP Super Lead Plexi kicked off his lifelong quest for tone and inspired the entire Friedman Amplification product line. Capturing the magic of that amplifier had been a long-running project, and the Plex head is the realization of it.

  The Plex is the first model in the Friedman Vintage Collection, a series of amp designs based on the classic amplifiers that influenced and shaped Dave Friedman's tonal signature. The collection aims to capture the sonic nostalgia and authenticity of yesteryear while infusing decades of his knowledge into each design.

  The Plex features internal channel jumpering, replicating the external blending technique used with vintage Plexi amplifiers, so the Lead and Normal channels can be blended with the turn of a control knob. A post-phase master volume control brings the amp back to manageable levels as channel gain increases, without sacrificing tone or dynamic feel.

  The 50-watt, two-channel, EL34-driven design gives the Lead and Normal channels their own volume controls, replicating the non-master volume performance of its predecessor. The harder those channels are pushed, the more the amp responds with saturation, harmonic richness and sustained brilliance.

  Completing the sonic palette is a vintage-style tone stack of presence, bass, middle and treble. That tone stack, the Hi and Low instrument inputs and a 3-position bright switch allow a wide range of sounds and gain levels to be sculpted for different guitars, pedals and pickups.
specs: |-
  - 50-watt all-tube head
  - Two channels, Lead spec and Normal spec
  - Inspired by Dave Friedman's 1968 JMP Super Lead Plexi
  - Channel 1 volume (Lead spec channel)
  - Channel 2 volume (Normal spec channel)
  - Internal channel jumpering
  - Post-phase master volume control
  - 3-way bright switch per channel
  - Bass, middle, treble and global presence
  - Hi and Low instrument inputs
  - 2 x EL34 power tubes
  - 3 x 12AX7 preamp tubes
  - 4, 8 and 16 ohm impedance jacks
  - Custom USA made transformers
  - Dimensions: 8.75 inches (D) x 24 inches (W) x 10 inches (H)
  - Weight: 33.5 lbs
  - Assembled in the USA
  - Limited lifetime warranty
