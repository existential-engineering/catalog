description: Add-on module for the Livewire Vulcan LFO in 8HP. The Mind Meld is
  an expansion module for the Livewire Vulcan dual LFO, providing switched
  waveform source selection of the Vulcan's logic circuits and reset control for
  both LFOs.
details: |-
  The Mind Meld is an expansion module for the Livewire Vulcan dual LFO. It provides switched waveform source selection of the Vulcan's logic circuits: MAX, MIN, SUM and DIFF. Additionally, each of these normalled inputs can be broken and an external signal can be injected via the input jacks.

  Per the manual, the module performs three primary tasks: it replaces the rear jumpers used for selecting waveforms on the Vulcan with 3-position switches, allows external input to the logic circuits, and adds reset control to each LFO. The outputs of the MAX, MIN, SUM and DIFF circuits remain on the Vulcan itself.

  There are also two jacks for pulse inputs to reset the Vulcan's dual LFOs. Jack A is normalled to Jack B so that both LFOs can be reset at the same time, or you can break the normal and supply a separate reset signal to LFO B. The reset circuit is positive edge triggered and will hold the Vulcan LFO in reset while the signal is high.

  Note: to add reset functionality to the Vulcan you are required to solder two wires to the Vulcan PCB, which may void the Vulcan's warranty. If you do not want to take the risk you can choose not to implement this functionality.
specs: |-
  - Width: 8HP
  - Max depth: 29mm
  - Current draw: 2mA @ +12V, 3mA @ -12V
  - Switched waveform source selection for the Vulcan's MAX, MIN, SUM and DIFF logic circuits (replaces the Vulcan's rear jumpers with 3-position switches)
  - Normalled external-signal input jacks for each side (LFO A / LFO B) of the four logic circuits
  - Two reset pulse inputs (A normalled to B), positive edge triggered
  - Adding reset functionality requires soldering two wires to the Vulcan PCB
