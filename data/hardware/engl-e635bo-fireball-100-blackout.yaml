description: The E635BO Fireball 100 Blackout is an all-black edition of the
  100-watt, two-channel, all-valve Fireball guitar amplifier head, with a
  valve-buffered FX loop and a noise gate, hand-crafted in Germany.
details: |-
  The Fireball has long been a benchmark for high-gain guitar tone. The Fireball Blackout Series is an all-black edition of that amplifier, combining the established Fireball sound with a new aesthetic.

  The Blackout Series delivers the tight low end, cutting mids and articulate high-gain performance that made the Fireball a favourite among guitarists worldwide. It is hand-crafted in Germany and built to ENGL's own standards, for players who want both the tone and the look.

  Two channels, Clean and Lead, each carry their own gain control over a shared 3-band EQ with Lead Volume, Presence and Master A/B. Bright, Bottom and Mid Boost switches handle further voicing, and the FX loop is valve-buffered with a rear balance level alongside the noise gate threshold.

  The preamp runs four ECC83 (12AX7) valves into four 6L6 output valves for 100 watts. Speaker outputs cover 4, 8 and 16 Ohm loads, singly or in parallel pairs, and a dual footswitch jack takes the ENGL Z4.
specs: |-
  - 2 channels: Clean, Lead
  - All-valve 100 W head
  - Valve-buffered FX loop
  - Noise gate
  - Dual footswitch jack for the ENGL Z4
  - Made in Germany
  - Controls: Gain (per channel), Bass, Middle, Treble, Lead Volume, Presence, Master A / B
  - Rear controls: FX loop balance level, noise gate threshold level
  - Sound shaping options: Bright, Bottom, Mid Boost
  - Speaker outputs: 1 x 4 Ohm or 2 x 8 Ohm, 1 x 8 Ohm or 2 x 16 Ohm, 1 x 16 Ohm
  - Preamp valves: 4 x ECC83 (12AX7)
  - Power amp valves: 4 x 6L6
  - Output power: 100 W
  - Dimensions: 27 x 71 x 27 cm
  - Weight: 21 kg
