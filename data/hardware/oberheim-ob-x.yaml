description: >-
  The first in Oberheim's iconic OB series, a programmable polyphonic analog synthesizer
  available in four, six, or eight voice configurations, distinguished by its use of original
  SEM-style filters that give it a uniquely warm and open Oberheim character.
details: |-
  Introduced in 1979, the Oberheim OB-X launched what would become one of the most celebrated
  lines of analog polysynths in music history. As the inaugural member of the OB family, it
  established the template that the OB-Xa and OB-8 would later refine, but retains a sonic
  identity that many consider the most purely Oberheim of the series.

  The key to the OB-X's distinctive sound lies in its filter design. While later OB models
  switched to Curtis ladder filters, the OB-X employs the same 2-pole SEM-style filters found
  in Oberheim's original Synthesizer Expander Modules. This gives it a brighter, less
  aggressive filtering character compared to its successors, with a quality that many players
  find warmer and more musical for pads and leads.

  Each voice provides two VCOs generating sawtooth or pulse waveforms, routed through the
  2-pole low-pass filter with a dedicated ADSR envelope. Additional features include polyphonic
  sample and hold, polyphonic portamento, and a Polymod section for cross-modulation between
  oscillators. The 32-patch memory was a significant selling point at a time when many analog
  synthesizers offered no programmability at all.

  The OB-X found its way into the hands of an extraordinary roster of musicians including
  Herbie Hancock, Queen, Rush, Tangerine Dream, Depeche Mode, Styx, Ultravox, and
  Jean-Michel Jarre. Its rich, expansive sound became a defining element of late 1970s and
  early 1980s progressive rock, new wave, and electronic music.
specs: |-
  - Polyphony: 4, 6, or 8 voices
  - Oscillators: 2 VCOs per voice (sawtooth, pulse)
  - Filter: 2-pole low-pass with ADSR envelope
  - LFO: 1
  - VCA: ADSR envelope
  - Keyboard: 61 keys
  - Memory: 32 patches
  - Features: Polyphonic sample and hold, polyphonic portamento, Polymod
  - Control: CV/Gate on voice 1 only
releaseDate: "1979"
releaseDateYearOnly: true
