url: https://www.klarkteknik.com/en/products/0809-AAS
description: The DN200 V2 is a 2-channel active DI box with extended dynamic
  range, sum and split modes, a 20 dB pad and input/output ground separation. It
  takes a stereo source arriving on unbalanced jacks or a 1/8" cable and sends
  two channels to balanced XLR outputs, powered by +48 V phantom from the mixer
  or recording interface.
details: |-
  SUM adds the left and right inputs together and feeds both outputs, while SPLIT sends the left input to the left and right outputs. Either mode needs phantom power on both output connections, and with one channel connected the DN200 still works as a mono device.

  For hot signals, PAD drops the input by 20 dB. EARTH splits the grounds of input and output, which can clear ground loops between gear on separate mains supplies. The 48V LED lights when the unit receives sufficient phantom power.

  The L/R inputs take balanced or unbalanced XLR or 1/4" cables, and LINK THRU sends the signals on over 1/4" cables. A 1/8" stereo TRS jack takes a line-level source, with the L/R and LINK THRU jacks left unplugged.
specs: |-
  - 2 channels, with SUM and SPLIT modes
  - Frequency response: 20 Hz to 20 kHz, ±1 dB
  - PAD switch: -20 dB
  - EARTH switch separating input and output grounds
  - Powered by +48 V phantom power from the mixer or interface
  - 48 V presence LED
  - Weight: 0.65 kg
