details: |-
  No nonsense, Electromatic Jet FT models are the perfect real, pure and powerful Gretsch instruments — bold, dynamic and articulate, with essential Gretsch sound, style and playability.

  A chambered mahogany body with arched laminated maple top sets up a balanced acoustic foundation, while Black Top Filter'Tron pickups deliver the signature clarity, snap and shimmer Gretsch is known for.

  A Bigsby B50 vibrato tailpiece adds vintage-style expressive shimmer, finishing off a working-class Jet that punches well above its price.
