details: >-
  The Electro-Voice PL-80a is a premium handheld dynamic vocal microphone in
  EV's PL Series, engineered to elegantly capture the character of vocals in
  live sound applications. Its supercardioid polar pattern tightens off-axis
  rejection compared to a cardioid pickup, helping the mic reject stage bleed
  and monitor wedges for greater gain before feedback in loud rooms.


  An EQ-friendly sonic contour gives the PL-80a a forgiving, robust response
  that adapts well to any vocal texture, letting engineers shape the sound
  naturally without fighting the mic. Ultra-low handling noise keeps stage
  handling and cable thumps out of the signal, and superior off-axis rejection
  keeps the focus on the vocalist's voice rather than surrounding instruments or
  PA spill.


  The body is built from die cast zinc with a textured satin black finish for
  durability under stage and touring use. Output is via a standard 3-pin XLR
  connector, with a low-impedance balanced signal at 600 ohms suitable for any
  professional mixer or preamp. The microphone is passive and requires no
  phantom power.
