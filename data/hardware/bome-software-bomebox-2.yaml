url: https://www.bome.com/products/bomebox2
description: The second-generation BomeBox MIDI hub, keeping everything from the
  original while adding 2x MIDI DIN inputs and outputs, 2x USB host ports, and
  more memory and processing power for MIDI processing.
details: |-
  The BomeBox 2 is the second generation of Bome's standalone MIDI hub and router, keeping the original BomeBox's feature set and form factor while doubling the physical connectivity. Bome describes it as the BomeBox improved after user feedback, with 2x MIDI DIN inputs and outputs, 2x USB host ports, and more memory and processing power for MIDI processing. Firmware updates are planned to keep adding features, particularly further MIDI 2.0 functionality.

  Routing is handled by a built-in MIDI router that provides an unlimited virtual MIDI patch bay: arbitrary MIDI thru connections can be defined from and to every connected MIDI device, so the unit can merge MIDI traffic, act as a MIDI thru box, and merge or duplicate streams coming from USB-MIDI devices and from devices reached over the network. For deeper work it runs MIDI Translator Pro project files on a built-in engine, giving unlimited mappings, splits, scenes and conditional routing, with the MIDI Translator Pro editor sold separately. Configuration happens in a browser through Web Config, reachable from any WiFi-enabled device.

  Networking is central to the unit. Two 100MBit/s Ethernet ports form a built-in 2-port switch and carry long-distance MIDI connections, plus centralized access to every MIDI device on the network. Computers, iPads and iPhones connect over Ethernet or WLAN using the free Bome Network tool or Network MIDI 2.0, covering Windows, macOS, iOS, iPadOS, Linux and Raspberry Pi. A PAIR button makes connecting to other BomeBoxes and to computers quick and secure, and Allen & Heath digital mixers are supported over Ethernet. Built-in WLAN (802.11 b/g/n, 2.4 GHz) can act as hotspot, hub or client for quick configuration or for wireless MIDI.

  New on the second generation are USB-C power, a USER button with an RGB LED that can be assigned various functions or used as a one-button MIDI controller, and the PAIR button. Two USB 2.0 host ports with Type A receptacles take USB-MIDI controllers, synthesizers and USB hubs, so the four MIDI DIN sockets can be expanded further, and USB QWERTY keyboards can be mapped to MIDI. Power comes either from a standard USB-C supply at 5V up to 2.5A, or from Power over Ethernet at 48V and 15W; both Ethernet ports are PoE In, so unlike the original BomeBox the unit cannot pass power on to another BomeBox through a PoE Out port. Consumption runs from a minimum of 2W to a maximum of 13W.

  Inside is a 650MHz main processor with 128MB of RAM and 32MB of built-in flash memory, housed in a robust reinforced ABS case measuring 121mm x 96mm x 38mm (4.8 x 3.7 x 1.5 inches) and weighing approximately 200g. At the time of the page the product was a preview: Bome states the specifications are preliminary and subject to small changes, is not taking pre-orders, and expects the first units in fall 2026 once FCC certification is complete. A limited replacement program giving BomeBox 1 owners credit toward a BomeBox 2 is planned for when the first units are in stock, and firmware work on the original BomeBox continues.
specs: |-
  - Preliminary specifications, subject to small changes (product shown as a preview)
  - Robust, reinforced ABS case
  - Define arbitrary MIDI thru connections (routes) from and to all connected MIDI devices, an unlimited virtual MIDI patch bay
  - Web Config for easy configuration from any WiFi-enabled device
  - Long distance MIDI connections via Ethernet
  - MIDI networking: centralized access to all MIDI devices connected to the Ethernet network
  - Connects to Windows, macOS, iOS, iPadOS, Linux and Raspberry Pi using Ethernet or WiFi (free Bome Network tool, or via Network MIDI 2.0)
  - Loads and executes MIDI Translator Pro project files for advanced mappings (editor sold separately)
  - Unlimited mappings, splits, scenes and conditional routing with the built-in MIDI Translator Pro engine
  - Use USB QWERTY keyboards and map them to MIDI
  - Allen & Heath digital mixer support via Ethernet
  - 2x MIDI DIN IN and OUT with very low latency at the standard MIDI rate of 31.25 kbit/s, 4 DIN sockets in total, expandable via the USB host ports
  - 2x USB 2.0 host (Type A receptacle) for USB-MIDI controllers, synthesizers, USB hubs and more
  - 2x Ethernet 100MBit/s, forming a built-in 2-port Ethernet switch
  - WLAN: 802.11 b/g/n, 2.4 GHz, configurable as hotspot, hub or client (wireless, not a physical port)
  - USER button with RGB LED, assignable to various functions or usable as a one-button MIDI controller
  - PAIR button for connecting to other BomeBoxes, computers, iPads and iPhones
  - Power: minimum 2W, maximum 13W. There is no DC barrel jack. The only dedicated power connector is the USB-C socket, taking 5V (up to 2.5A) from a standard USB-C power supply, and the alternative is Power over Ethernet (48V, 15W) on either Ethernet port
  - Both Ethernet ports are PoE In, so the unit cannot power another BomeBox through a PoE Out port the way the original BomeBox could
  - Main processor at 650MHz, 128MB RAM, 32MB flash memory built in
  - Dimensions: 121mm x 96mm x 38mm (4.8 x 3.7 x 1.5 inches)
  - Weight: approx. 200g
  - Firmware updates planned to add more features, especially more MIDI 2.0 functionality
  - Expected to ship in fall 2026, pending FCC certification. No pre-orders accepted at the time of writing
