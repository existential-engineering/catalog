description: >-
  The PO-14 Sub is an ultra-compact bass synthesizer from Teenage Engineering's
  Pocket Operator series. It features multiple real synthesis engines including
  FM, subtractive, wavetable, and physically modeled strings, all packed into a
  pocket-sized form factor powered by two AAA batteries. A 16-step sequencer
  with 16 punch-in bass-oriented playing styles and built-in effects make it a
  surprisingly capable instrument for bass sound design.
details: |-
  The PO-14 Sub is part of Teenage Engineering's original Pocket Operator lineup, delivering a wide range of bass sounds through multiple synthesis engines. It combines FM synthesis, subtractive synthesis, wavetable synthesis, and physically modeled strings into a single ultra-portable device, giving users a diverse sonic palette despite its minimal footprint.

  The 16-step sequencer offers 16 storable patterns that can be chained together, along with 16 punch-in playing styles that allow melodic creation without entering complete note sequences. A simplified built-in drum box adds rhythmic accompaniment. The 16 punch-in effects include delay, bit crusher, and filters for further sound shaping.

  An auto compressor and hardware limiter ensure clean signal generation without clipping. The rear panel features two 3.5mm stereo jack sockets for audio output and sync signals, enabling connection with other Pocket Operators or external gear. While sold without a case, the device is more rugged than it appears, with most electronic components protected behind the LCD screen.
specs: |-
  - 1-voice polyphony
  - Multiple synthesis engines: FM, subtractive, wavetable, physical modeling
  - 16-step sequencer with 16 storable patterns
  - Pattern chaining up to 16 patterns
  - 16 punch-in bass-oriented playing styles
  - 16 punch-in effects including delay, bit crusher, and filters
  - Built-in simplified drum box
  - Auto compressor and hardware limiter
  - 2 x 3.5mm stereo jack sockets (audio and sync)
  - Powered by 2 x AAA batteries
  - Built-in alarm clock function
  - Non-backlit LCD display
