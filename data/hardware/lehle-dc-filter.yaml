description: Stereo filter for audio signals to eliminate DC offsets.
details: |-
  Stereo filter for audio signals to eliminate DC offsets.

  Equipped with a standard TRS-socket for balanced output signals if needed.

  Many effects units feature stereo outputs, and instruments frequently have two pickup systems, for example a combination of conventional magnetic and Piezo types, to emulate an acoustic sound. Lehle accessories are ideal for trouble-free routing of such dual-channel stereo signals, and all stereo-capable Lehle products are also suitable for mono operation.
specs: |-
  - Stereo filter for audio signals to eliminate DC offsets
  - Standard TRS socket for balanced output signals
  - Stereo signal path, also suitable for mono operation
  - RoHS III compliant
