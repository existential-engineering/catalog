description: Analog compressor with an expander and sustainer, a release switch
  tuned for single coils or humbuckers, a treble emphasis Tone control and a
  Blend control for parallel compression.
details: |-
  The Compressor Plus is the first substantial advance on Keeley's two and four knob compressor line, from a shop that had built more than 132,000 compressors as of February 2024. It adds a Release switch tuned for single coils or humbuckers, a Tone control that emphasises the harmonics most easily lost in compression, and a Blend control that retains the peaks of the playing along with the proper phasing of the guitar signal.

  The pedal is a compressor with an expander and sustainer. As well as limiting the peaks of the playing it adds progressively more gain as notes fade out, so notes and bends sustain and bloom rather than dying early.

  The Release switch exists because humbuckers carry more average energy than single coils, which can hold a compressor in compression much longer and make a run of notes sound dull. The faster release setting keeps each note's dynamic attack and definition. The Tone control is taken from the emphasis circuits used in analog delays to recover treble after a BBD line, reworked into a full tone control that gently restores the highs lost in compression. The Blend control allows peaks through while sustain is applied behind them, the parallel approach Keeley calls Manhattan compression.

  Beyond funk and chicken picking settings, the pedal suits players after a smooth, subtle wash, removing peaks for an ambient layer and blending treble back in for shimmer. It is useful for keeping loops well balanced, and the output can be used as an amp boost. The pedal is fully analog and made in the United States, and it was Reverb's best overall selling pedal of 2021.
