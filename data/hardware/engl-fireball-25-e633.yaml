description: 25-watt, two-channel all-tube guitar amplifier head with a
  tube-buffered FX loop, noise gate, Master Volume Boost, Mid Boost and a
  built-in Power Soak.
details: |-
  This amp is as hot as a Fireball. The Clean channel offers chimey, shimmering cleans and starts to smoothly break up as you edge past 12 o'clock on the gain knob. At higher gain settings, chimey, shimmering crunch sounds can be wrung out of this channel.

  The Lead channel starts where the Clean channel ends, offering up endless amounts of gain. This channel suits any style of rock and metal music. The adjustable built-in Noise Gate helps tame extraneous noise at higher gain settings.

  The Mid Boost function is available in both channels and is a useful option for cutting through a band mix, for example when taking centre stage for a solo. The power amp is equipped with 6L6GC tubes, just like the amp's bigger brother, the Fireball 100.

  Thanks to the power amp design, the Fireball 25 has punch and headroom for live and studio situations. The built-in Power Soak offers the opportunity to play late at night or whenever higher volumes are unacceptable, and also gives the chance to push the power amp to break up at lower volumes.
specs: |-
  - 2 channels: Clean, Lead
  - All tube head
  - Tube buffered FX loop
  - Noise gate
  - Master Volume Boost (M.V.B.)
  - Sound option: Mid Boost, available in both channels
  - Built-in Power Soak
  - Controls: Gain (for each channel), 3-band EQ, Lead Volume, Master, Presence, Noise Gate Threshold
  - Poweramp output: 1 x 8-16 ohm, or 2 x 16 ohm in parallel
  - Line output (0 dB)
  - Footswitch: ENGL Z4 (channels, Master Volume Boost, Mid Boost, FX loop)
  - Preamp tubes: 4 x ENGL ECC83 / 12AX7
  - Output tubes: 2 x ENGL 6L6GC
  - Output wattage: 25 W
  - Dimensions: 42 x 20 x 23 cm
  - Weight: 11 kg
