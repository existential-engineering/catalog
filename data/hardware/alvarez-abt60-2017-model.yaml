details: |-
  Tuned from B to B, the ABT60 is pitched between a dreadnought and acoustic bass
  to give you deep tones with easy playability. Chord shapes and scales are the
  same as a standard six-string, but the voicing is lower. A baritone really
  helps you to approach your playing or the song in a different way and is a
  fantastic extra guitar for discovery or vocal accompaniment. Since we launched
  the ABT60, it has been one of our best-selling models.

  The Artist Series represents a commitment to quality and design, making it one
  of the finest solid top guitar lines in the world today. Artist Series guitars
  feel right and are exciting to play; whether you are strumming hard or picking
  lightly, the guitar will do what you ask of it.

  All tops are selected by the Alvarez team and graded independently of suppliers.
  While top quality improves as you move up the Artist Series models, all are
  stiff and finely grained.

  After 55 years of making guitars, continual improvement through the use of
  emerging technologies, processes, and materials is still at the heart of the
  Alvarez culture. Guitars are constructed correctly in every sense, from raw
  material preparation to construction and manufacturing processes.

  The bi-level bridge is designed to heighten string tension and improve sustain
  and response. Real bone nut and saddle, premium tonewoods, and a crafted
  attenuated finish all further the quality of construction and positively impact
  the performance of the instrument.
specs: |-
  - Top Wood: Solid A+ Sitka Spruce
  - Body Finish: Natural/Gloss
  - Back and Sides Wood: African Mahogany
  - Shape: Baritone
  - Neck: Mahogany, 50/50 Semi gloss finish
  - Bridge: Bi-Level Indian Laurel/Rosewood
  - Fingerboard: Indian Laurel/Rosewood w/12th Fret Inlay
  - Nut and Saddle: Real Bone
  - Tuner: Premium Die Cast
  - Binding: Ivory ABS
  - Strings: D'Addario EXP23
  - Bracing System: FST2 - Forward Shifted, Asymmetric Tone Bars
  - Neck Joint: Dovetail
  - Neck Meets Body: 14th Fret
  - Number of Frets: 21
  - Overall Length: 1065 mm
  - Body Width: 439 mm
  - Body Depth at Heel: 102 mm
  - Body Depth at Base: 122 mm
  - Scale Length: 704 mm (27 23/32 inches)
  - Nut Width: 44.45 mm (1 3/4 inches)
