details: |-
  Drum Stereo Mixer completes the drum mix of a Eurorack drum system. Configurable stereo inputs receive signals from stereo FX modules, and a stereo output interfaces the modular system with external devices.

  Four stereo inputs are available. The first offers signal panning, and the second can be configured as a stereo pair or as two separate mono channels, with a +6dB boost on that input for quieter sources.

  LEDs next to each input give visual feedback on signal level, so the balance of the mix can be judged at a glance while patching.

  The panel is 10HP wide and the module is 50mm deep. Mixer gain is 1, and power draw is 36mA on the +12V rail and 26mA on the -12V rail.
specs: |-
  - 4 stereo inputs
  - Signal panning on the first input
  - Configurable stereo / dual mono second input
  - +6dB signal boosting on the second input
  - Signal level indicator LEDs
  - Mixer gain 1
  - Power consumption 36mA@+12V, 26mA@-12V
  - Module width 10HP
  - Module depth 50mm
