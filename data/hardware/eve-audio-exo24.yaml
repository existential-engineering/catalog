description: The EXO 24 is a compact active 2-way studio monitor from EVE Audio,
  pairing a 4" coated aluminium woofer with the Precision AirMotion Tweeter and
  the GDC waveguide. It covers 54 Hz to 24 kHz at 102 dB maximum SPL in full
  space, and adds Ethernet control through EVE Origin plus a rear OLED display
  with a SMART Control Knob.
details: |-
  The EXO 24 is an active 2-way studio monitor for professional studios, ambitious producers and home users wherever space is limited but no compromise in sound is acceptable. EVE Audio combines an advanced acoustic design, control features and a space-saving format in it, and the controlled dispersion characteristics also suit immersive applications such as Dolby Atmos. Four M6 threaded mounting points on the underside of the enclosure simplify mounting.

  The newly developed EXO Precision AirMotion Tweeter works with the GDC Waveguide (Guided Directivity Control) for precise dispersion and a detailed stereo image. Made from ultra-lightweight, dimensionally stable polyamide, the AMT delivers a fast transient response, high efficiency and detailed high-frequency reproduction with minimal distortion, widening the sweet spot and improving spatial integration in multi-channel setups.

  The 4" woofer uses a CAL diaphragm (Coated Aluminium) for deep bass and transparent mids at that size. Its lightweight aluminium cone carries a resonance-damped dust cap and an optimized magnet system for accurate, dynamic reproduction with low distortion.

  The drivers sit in an airflow-optimized LDE enclosure (Low Diffraction Enclosure). The curved shape with rounded edges reduces unwanted sound diffraction, and enhanced rear bass reflex ports with improved aerodynamics allow deeper low-end tuning with significantly reduced port noise.

  A rear-mounted OLED display with an integrated SMART Control Knob presents the system parameters and allows precise adjustment of output level, room adaptation filters and input source selection. An integrated Ethernet connection opens access to the EVE Origin control software for calibration and firmware updates, while Wake-on-Signal and Wake-on-LAN bring the monitor out of standby. On the front panel the illuminated eve audio logo acts as a multi-color status indicator for overload protection, firmware update progress and other system states, glowing warm white in normal operation, and its brightness is continuously dimmable.
specs: |-
  - Frequency range (-3 dB at 1 m, full space): 54 Hz - 24 kHz
  - Woofer diameter: 4"
  - Max. SPL (full space, above 100 Hz): 102 dB
  - Max. SPL (half space, above 100 Hz): 108 dB
  - Cross-over frequency: 2200 Hz
  - Output power per speaker: 280 W
  - Tweeter: Precision AirMotion Tweeter (PAMT)
  - Waveguide technology: Guided Directivity Control (GDC)
  - Tweeter output power: 140 W / 1%
  - Woofer output power: 140 W / 1%
  - Woofer diaphragm material: Coated aluminum
  - Woofer voice coil: Air Stream Optimized Voice Coil Design
  - Dimensions: 171 x 252 x 194 mm (6.7 x 9.9 x 7.6 inch)
  - Weight: 4.3 kg (9.5 lb)
  - Protection limiter: Yes
  - User interface: Rear OLED display with SMART Control Knob
  - Volume: minus infinity to +10 dB
  - High-shelf filter (-5 dB to +3 dB): above 3 kHz
  - Mid EQ (-3 dB to +3 dB): 3.5 kHz
  - Desk filter cut (-5 dB to 0 dB): 650 Hz
  - Low-shelf filter (-5 dB to +3 dB): below 300 Hz
  - Max. input level: -10 dBV (max. 16.5 dBu) / +4 dBu (max. 20 dBu)
  - Input select: Balanced, Unbalanced, S/PDIF L/R/Mono
  - Standby mode: 15 min / 30 min / 60 min / off
  - Mounting point: Bottom side M6 mounting hole pattern of 50.8 x 107.9 mm
  - Standby power consumption: below 1 W
  - Idle power consumption: 7 W
  - Peak power consumption: 400 W
