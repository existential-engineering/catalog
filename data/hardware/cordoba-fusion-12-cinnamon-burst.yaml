description: A Fusion 12 Exotic Top guitar with richly flamed okoume back and
  sides and a matching flamed okoume veneer overlay on the solid-spruce top,
  producing a warm tone with an integrated Fishman Presys Blend pickup system.
details: |-
  Fusion 12 Exotic Top guitars deliver traditional nylon-string tone while also featuring distinctive modern aesthetics. An ultra-thin layer of genuine exotic wood veneer is applied to their solid-spruce tops, resulting in a striking appearance without adversely affecting the tone. The Fusion 12 Cinnamon Burst guitar features richly flamed okoume back and sides, complemented by a matching flamed okoume veneer overlay. Mahogany binding and a hand-inlaid wooden rosette further enhance its unique aesthetics. The guitar produces a warm tone with a snappy response, and its integrated Fishman Presys Blend pickup system maintains that tone when the instrument is amplified.
