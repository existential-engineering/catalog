description: >-
  The DS-2 is a monophonic synthesizer paired with a 44-voice polyphonic strings
  section, produced by Crumar in the late 1970s. It was among the first
  keyboards to use digitally controlled oscillators (DCOs) for improved tuning
  stability. The instrument features a Moog-style 4-pole lowpass filter and dual
  LFOs with sample-and-hold capabilities.
details: |-
  The DS-2 represented an innovative approach to keyboard design by combining a monophonic synthesizer with an extensive polyphonic string ensemble in a single hardcase unit. Its use of DCO technology marked a significant shift toward tuning reliability, though some players noted it lacked the characteristic warmth of VCO-based instruments.

  The synthesizer section offered substantial sonic capabilities through its dual LFOs, one of which included sample-and-hold and staircase waveforms. Its 4-pole lowpass filter earned a reputation for a rich, Moog-like character, and the fast ADSR envelopes made it well-suited for percussion and bass synthesis.

  The DS-2 gained recognition through use by professional musicians including Cirrus, the Cardigans, Tambourine Studio, and Sun Ra, demonstrating its viability in both recording and performance contexts despite its technical limitations.

  However, the DS-2 developed a reputation for unreliability on the used market. The most frequently encountered issues are failures of one or both DCOs or the entire polysynth stage, making the acquisition of a used unit a risky proposition.
specs: |-
  - Polyphony: Monophonic synthesizer section with 44-voice polyphonic string section
  - Oscillators: 2 DCOs
  - LFO: 2 LFOs (LFO 2 includes Sample & Hold and Staircase waveforms)
  - Filter: 1 4-pole lowpass with cutoff, resonance, ADSR, and envelope amount
  - VCA: ADSR envelope
  - Keyboard: 44 keys
  - Memory: None
  - Control: Gate
