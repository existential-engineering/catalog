details: |-
  The Supro Keeley Custom Amp was designed in collaboration between Supro and Keeley Electronics as a pedal platform combo. Its preamp and two-band EQ section are voiced for running gain pedals in front of the amp while keeping the midrange weight and touch dynamics associated with Supro amplifiers.

  A transparent effects loop sits in the design as a point to inject delay and reverb stompboxes into the all-tube signal path. A master volume circuit sets the level reaching the speaker independently of the gain taken from the 12AX7-based tube preamp or from dirt pedals ahead of it.

  The all-tube design is hand-assembled and tested in Port Jefferson, New York. The amplifier is auto-biasing, so closely matched replacement tubes keep hum to a minimum, and 6L6 tubes can be fitted for slightly more output power. A second 8 ohm cabinet or speaker can be connected to the rear Transfer jack, which puts the two speakers in parallel and moves the transformer tap to 4 ohms for greater bass response. To use an external 8 ohm speaker alone, the stock speaker is unplugged and the cabinet is connected to the Speaker jack.
