id: Pj6kXwDIniOxlOSJT1CjD
name: 512v Discrete Mic/Line Pre
manufacturer: api-audio
primaryCategory: preamp
categories:
  - rack-mount
url: https://apiaudio.com/product/512v-discrete-mic-line-pre/
description: Fully discrete 500-series mic/line/instrument preamp with
  switchable 3:1 output transformer tap and variable output level control,
  delivering the classic API 2520 sound with up to 65 dB of mic gain.
details: |-
  Single-slot 500-series mic/line/instrument preamp built around the API
  2520 discrete op-amp. Switchable 3:1 output transformer tap for tonal
  flexibility. Front-panel XLR mic input + 1/4" Hi-Z instrument input; rear mic
  input via edge connector (defeatable). Switchable 48V phantom power, 20 dB
  pad, polarity reverse, LED VU meter. Five-year warranty.
specs: |-
  - Mic gain: 34–65 dB (14–45 dB w/pad)
  - Hi-Z gain: 14–42 dB (−6–25 dB w/pad)
  - Max input (mic): −4 dBu (+16 dBu padded)
  - Max input (Hi-Z): +36 dBu
  - Input impedance (mic): 1,500 Ω
  - Input impedance (Hi-Z): 400 kΩ (20 kΩ padded)
  - Output impedance: <75 Ω (transformer balanced)
  - Clipping level: +30 dBu
  - Frequency response: 20 Hz–50 kHz (+0/−0.3 dB)
  - S/N ratio: 120 dB
  - EIN: −129 dBu
  - Power: ±16V DC @ 90 mA
  - Dimensions: 1.5″ H × 5.25″ W × 7″ D
  - Weight: 1.41 lb
