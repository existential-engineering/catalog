description: A passive Pultec-inspired air boost module designed for the Colour format. Draws inspiration from vintage EQP-1A3SS and EQP-1S3 equalizers, combining passive shelving filters with a 2520-powered makeup gain amplifier. Includes the ROGUE FIVE discrete op amp with a 2520-compatible op amp footprint and gold-plated sockets for op amp swapping.
details: |-
  Selectable shelf boost frequencies via jumper: 3, 5, 8, 12, 16 kHz (expandable). Adjustable shelf boost gain: 0 to 12 dB via trimpot. Features Wima film capacitors. Analog plugin compatible with Chroma (C-DRV knob for drive, C-MIX knob for boost amount). Compatible with DIYRE Colour Palette, Pentode, and CTX Colour modules. Fully assembled, calibrated, and tested.
