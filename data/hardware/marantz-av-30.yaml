name: AV 30
manufacturer: marantz
primaryCategory: preamp
categories:
  - rack-mount
  - remote-controlled
url: https://www.marantz.com/en-us/product/av-processors-pre-amplifiers/av-30/301018.html
description: 11.4-channel balanced AV preamplifier powered by HEOS, engineered
  for large media rooms and dedicated home theater systems. Features Marantz
  HDAM discrete circuitry with seven 8K-compatible HDMI inputs, Audyssey MultEQ
  XT32 room correction (Dirac Live upgradable), Dolby Atmos, DTS:X Pro, and
  Auro-3D support with fully balanced XLR pre-amp outputs and four independent
  subwoofer outputs. Crafted in Shirakawa, Japan.
details: |-
  The AV 30 is engineered for large media rooms and dedicated home theater systems, combining Marantz's signature musicality with cutting-edge immersive audio processing. Built upon decades of Marantz heritage and crafted in Shirakawa, Japan, the AV 30 emphasizes both aesthetic refinement and technical performance.

  The unit incorporates Marantz's proprietary HDAM-SA2 (Hyper Dynamic Amplifier Module) discrete circuitry throughout, delivering immersive spaciousness, warm and rich tone, extraordinary detail and lifelike dynamics. Its 11.4-channel processing architecture supports contemporary immersive audio formats including Dolby Atmos, DTS:X Pro, Auro 3D, MPEG-H, 360 Reality Audio, and IMAX Enhanced.

  Connectivity infrastructure emphasizes professional-grade audio integration, featuring 11.4 channels of fully balanced XLR outputs alongside standard RCA multichannel preouts. The device includes four independent subwoofer outputs with variable crossover capabilities, plus seven HDMI 2.1 inputs supporting 8K/60Hz and 4K/120Hz pass-through with full HDR ecosystem compatibility (Dolby Vision, HDR10+, Dynamic HDR, HLG) and gaming features (ALLM, VRR, QFT).

  The integrated HEOS ecosystem provides multi-room audio streaming across major platforms including AirPlay 2, Spotify Connect, Amazon Music HD, TIDAL, Deezer, Qobuz, and Roon Ready. Audyssey MultEQ XT32 room correction with Dynamic EQ, Dynamic Volume, and LFC, plus optional Dirac Live upgradability, allow acoustic optimization for diverse installation environments. Control integration encompasses IP, RS-232, web, and mobile app protocols, with three DC trigger outputs and IR flasher support for advanced custom installations.
specs: |-
  - 11.4 processing channels
  - 7 HDMI inputs (all 8K/60Hz capable)
  - 3 HDMI outputs (1 with eARC)
  - HDCP 2.3, 4K/120Hz, HDR, HLG, Dolby Vision, HDR10+, Dynamic HDR
  - Gaming support: ALLM, VRR, QFT
  - Supports Dolby Atmos, DTS:X, DTS-HD Master, DTS Virtual:X, DTS Neural:X, Auro 3D, MPEG-H, 360 Reality Audio, IMAX Enhanced
  - Audyssey MultEQ XT32 room correction (Dirac Live upgradable)
  - Audyssey Dynamic EQ, Dynamic Volume, and LFC
  - HDAM-SA2 discrete amplification with Current Feedback Topology
  - Copper-plated chassis, toroidal power transformer, clock jitter reducer
  - Pure Direct mode, MDAX2 compressed audio enhancement
  - Gold-plated RCA terminals
  - 6 analog inputs (1 balanced XLR), Phono MM input
  - 2 optical and 2 coaxial digital inputs
  - 11.4 RCA and 11.4 XLR multichannel pre-amp outputs
  - 4 independent subwoofer outputs
  - Front USB input
  - AM/FM tuner
  - HEOS built-in multi-room streaming (3 zones)
  - AirPlay 2, Spotify Connect, Amazon Music, TIDAL, Deezer, Qobuz, Roon Ready, TuneIn
  - Apple HomePod compatible, Bluetooth retransmit
  - Audio formats: MP3, WMA, AAC, FLAC, ALAC, WAV, DSD5.6
  - Ethernet, Wi-Fi, Bluetooth connectivity
  - IP, RS-232, web, and app control
  - 3 DC trigger outputs, IR flasher
  - RC053SR remote
  - 80W typical power consumption; 0.2W standby
  - Dimensions: 17.4 in W x 16.3 in D x 7.5 in H
  - Weight: 24.5 lbs
  - 5-year warranty
  - Crafted in Shirakawa, Japan
