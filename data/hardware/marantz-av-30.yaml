details: |-
  AV 30 delivers exceptional performance and capability for large media rooms and dedicated home theater systems. This 11.4-channel balanced AV preamplifier features Marantz HDAM discrete circuitry and boasts seven HDMI inputs, each of which is 8K Ultra HD compatible.

  Crafted in Shirakawa, Japan, AV 30 pairs a copper-plated chassis and toroidal power transformer with HDAM-SA2 modules and current feedback topology, and presents every channel on both RCA and balanced XLR pre-outs.

  Powered by HEOS for high-resolution music streaming, AV 30 includes room correction with Audyssey MultEQ XT32 and optional Dirac Live, plus AirPlay 2, Spotify Connect, Roon Ready operation and Bluetooth with headphone retransmission.

  Connectivity covers seven 8K HDMI inputs and three HDMI outputs with eARC, two coaxial and two optical digital inputs, five analog stereo inputs, phono (MM), composite and component video, three multi-room zones, RS-232C, three DC triggers and Marantz Remote Bus.
specs: |-
  - 11.4 processing channels, balanced AV preamplifier
  - 11.4-channel pre-out on both RCA and XLR, four independent subwoofer outputs
  - Seven 8K HDMI inputs (8K/60Hz, 4K/120Hz, up to 40Gbps), three HDMI outputs with eARC
  - Dolby Atmos, Dolby Atmos Height Virtualization, DTS:X, DTS Virtual:X, DTS Neural:X, Auro-3D, IMAX Enhanced, 360 Reality Audio, MPEG-H
  - Audyssey MultEQ XT32 with Dynamic EQ, Dynamic Volume and LFC
  - Dirac Live upgradable
  - HDAM-SA2 modules, current feedback topology, copper-plated chassis, toroidal power transformer
  - HEOS built-in, AirPlay 2, Spotify Connect, Roon Ready, Bluetooth with headphone retransmit
  - Three multi-room zones, 3 DC triggers, RS-232C, IR flasher in and Marantz Remote Bus
  - Power consumption 80 W, standby 0.2 W
  - 17.4 x 15.6 x 7.5 in. without antenna, 24.5 lbs.
