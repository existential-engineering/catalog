description: Socket upgrade kit that adds a KADI port to the Roland CR-8000 or
  CR-5000, so eleven of its individual sounds can be played from MIDI through a
  Kenton converter fitted with a KADI port.
details: |-
  This socket upgrade adds a KADI port to the Roland CR-8000, enabling the individual sounds of the drum machine to be played from the KADI port output of a Kenton device fitted with one. The compatible devices are the Pro-KADI, the Pro-4, and the Pro-2000 when it carries the optional KADI port. The same kit is also suitable for the Roland CR-5000.

  Eleven sounds can be played individually, with or without accent, which is determined by a pre-set velocity level. Exactly which eleven sounds are wired up is chosen at installation time.

  While the KADI port is connected to a KADI device the sounds can only be played from MIDI. Unplugging the KADI cable, or switching the KADI device off, returns the CR-8000 to normal operation.

  The kit contains the components and diagrams needed for connecting the wires and components and for mounting the 15 pin high density D socket. A KADI cable is not included, since one is supplied with the Pro-KADI and with the optional KADI add-on port for the Pro-2000, though not with the Pro-4.

  This is a KADI socket upgrade rather than a full MIDI retrofit, and no retrofit kit is currently produced for this model. Installation is a job for a competent synthesiser service engineer, and the product photograph on the page shows a typical socket upgrade rather than this specific kit.
specs: |-
  - Adds one KADI port on a 15 pin high density D socket
  - Eleven CR-8000 sounds playable individually, chosen at installation time
  - Accent level determined by a pre-set velocity threshold
  - Also suitable for the Roland CR-5000
  - Compatible with the Pro-KADI, the Pro-4 and a Pro-2000 fitted with the optional KADI port
  - KADI cable not included
  - CR-8000 reverts to normal operation when the KADI cable is unplugged
  - Powered from inside the host CR-8000, so the kit has no power connector of its own
