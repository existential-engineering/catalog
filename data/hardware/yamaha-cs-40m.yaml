description: >-
  The Yamaha CS-40m is a duophonic analog synthesizer introduced in 1979, offering
  two-voice polyphony with dual oscillators per voice, a multi-mode filter, and
  comprehensive hands-on control via 36 knobs and 12 sliders. It occupies a practical
  middle ground in Yamaha's CS lineup, delivering classic analog sound at a more
  accessible price point than the flagship CS-80. The 44-key semi-compact keyboard
  includes 20 patch memory locations and was used by artists such as Duran Duran,
  Ultravox, and Vangelis.
details: |-
  The CS-40m occupies an interesting middle ground in Yamaha's synthesizer lineup. While the legendary CS-80 provided eight-voice polyphony at a premium price, the CS-40m delivered practical two-voice capabilities at a more accessible cost. The instrument is structurally similar to Yamaha's CS-20m but with duophonic functionality, making it suitable for musicians seeking expandable sonic possibilities beyond monophonic synthesis.

  Sonically, the CS-40m delivers classic analog characteristics through its dual oscillators per voice. Each oscillator generates triangle, sawtooth, and square/pulse waveforms, supplemented by a noise generator for textural variety. The instrument includes separate AR envelope generators for each VCO, enabling independent amplitude control.

  The filter section provides multi-mode operation with switchable lowpass, bandpass, and highpass configurations. A dedicated ADSR envelope generator enables expressive filter sweeps, and a basic LFO with sine, ramp, square, and sample-and-hold waveforms modulates the VCO, VCF, or VCA for evolving textures. The synth includes 20 patch memory locations across two banks and supports external cassette storage for preset management.

  The CS-40m gained recognition through use by professional artists including Sneaker Pimps, Ultravox, Duran Duran, and Vangelis, establishing its credibility within electronic and new wave music production.
specs: |-
  - Polyphony: 2 voices (duophonic)
  - Oscillators: 2 VCOs per voice; triangle, sawtooth, square/pulse waveforms
  - Noise generator
  - Filter: Multi-mode VCF (lowpass, bandpass, highpass) with cutoff and resonance
  - Envelopes: AR envelope per VCO; ADSR envelope for filter
  - LFO: Sine, up-ramp, down-ramp, square, and sample-and-hold waveforms
  - VCA: ADSR with 5-position switch
  - Keyboard: 44 keys (3.5 octaves)
  - Controls: 36 knobs, 12 sliders
  - Memory: 20 patches across 2 banks; cassette interface for storage
  - CV/Trigger outputs per voice
  - CV inputs for portamento, sustain, brilliance, volume, and filter
  - Production period: 1979-1986
