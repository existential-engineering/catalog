description: >-
  The Novation D-Station is a cosmetic and functional update to the Drum Station v2, combining
  analog sound modeling and sampled voices to recreate authentic TR-808 and TR-909 drum sounds
  with 8-note polyphony and enhanced controls.
details: |-
  The D-Station brings all the famous sounds of the TR-909 and TR-808 drum machines via a mix of analog sound modeling and sampled voices. On-board controls similar to the classic TR machines provide knobs for individual drum sound level, tune, attack, and a few others to tweak the sounds in real-time.

  Compared to the Drum Station that came before it, the D-Station has a few enhancements, namely 8-note polyphony up from the former's 5 notes. Besides a new look, the front panel features more robust and tactile rotary knobs.

  While the D-Station has only 40 patches, there are only 12 sounds in the unit, so 40 patches is usually more than enough for designing drum kits. Full MIDI control of drum parameters is available and the rotary controls transmit MIDI controller data. The only on-board effects are distortion and front cut editing of the attack portion of drum sounds.

  Like the Drum and Bass Station before it, the D-Station includes a DIN Sync output that converts MIDI Clock data into a DIN Sync control pulse, allowing any compatible unit to run in synchronization with MIDI equipment.
specs: |-
  - Polyphony: 8 notes
  - Oscillators: Digital analog sound modeling of TR-808 and TR-909 drum sounds
  - Modeled Sounds: Bass, Snare, Tom Toms, Hi Hat, Cymbals (TR-808), Congas
  - Sampled Sounds: Rimshot, HandClap, Cowbell, Cymbals (TR-909), Maracas, Claves
  - Outputs: Stereo Left/Right, 6 individual outputs, headphone
  - Effects: Front Cut, Pan, and Distortion on most sounds
  - Memory: 40 total (25 factory, 15 user)
  - Control: MIDI In/Out/Thru, DIN Sync Trigger Output (24 ppqn)
releaseDate: "2002"
releaseDateYearOnly: true
