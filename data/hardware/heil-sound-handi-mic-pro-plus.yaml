details: |-
  Product Overview

  The Heil Handi Mic Pro Plus is an ultra-compact dynamic microphone engineered to solve challenging miking and tight-space placement issues on live stages and in recording studios. Designed with a miniature footprint and a specialized cardioid dynamic element, the Handi Mic Pro Plus allows sound engineers to easily position a high-quality microphone inside congested drum setups, tight guitar amplifier cabinets, brass instrument bells, and small acoustic spaces (like Leslie speakers) where standard handheld or studio microphones cannot physically fit.Featuring a smooth frequency response spanning 80 Hz to 15 kHz, the Handi Mic Pro Plus captures transient attacks and mid-range detail while insulating the sound source from ambient stage noise. Capable of handling high sound pressure levels without clipping or distortion, it excels on percussion, snare drums, toms, and high-volume amplified instruments. Built into a durable, low-profile housing with standard 3-pin XLR connection, the Handi Mic Pro Plus delivers reliable Heil Sound dynamic performance in an extremely portable form factor.

  Key Features

  Heil Handi Mic Pro Plus vs. Heil PR 28 Comparison Matrix

  Detailed Specification and Application Comparison

  - Design & Primary Purpose
    - Heil Handi Mic Pro Plus: Ultra-compact utility dynamic mic for tight-space instrument and percussion miking
    - Heil PR 28: Purpose-built drum dynamic mic optimized specifically for toms, snare, and percussion
  - Form Factor
    - Heil Handi Mic Pro Plus: Miniature short-body cylindrical housing
    - Heil PR 28: Compact specialized drum shell housing with dual-suspension element mount
  - Frequency Response
    - Heil Handi Mic Pro Plus: 80 Hz – 15 kHz
    - Heil PR 28: 55 Hz – 18 kHz (Extended low-end punch and stick attack)
  - Polar Pattern
    - Heil Handi Mic Pro Plus: Cardioid
    - Heil PR 28: Tight Cardioid
  - Rear Rejection (@ 180°)
    - Heil Handi Mic Pro Plus: -30 dB
    - Heil PR 28: -35 dB
  - Maximum SPL Handling
    - Heil Handi Mic Pro Plus: 138 dB
    - Heil PR 28: 142 dB
  - Impedance
    - Heil Handi Mic Pro Plus: 600 ohms balanced
    - Heil PR 28: 600 ohms balanced
  - Primary Applications
    - Heil Handi Mic Pro Plus: Tight-space instruments, brass, acoustic instruments, snare, and utility stage miking
    - Heil PR 28: Dedicated rack toms, floor toms, snare drum top/bottom, and hand percussion
specs: |-
  - Ultra-Compact Low-Profile Form Factor: Extremely small body style allows effortless mounting in tight spaces, crowded drum kits, and cramped stage environments.
  - Tailored Dynamic Element: Delivers an 80 Hz – 15 kHz frequency response tuned for crisp transient attack, mid-range articulation, and low-end clarity.
  - High SPL Handling: Effortlessly handles high sound pressure levels from loud percussion, snare hits, and speaker cabinets without mechanical distortion.
  - Cardioid Directional Pattern: Provides excellent off-axis noise rejection to reduce stage bleed from nearby cymbals, monitors, and ambient reflections.
  - Durable All-Metal Construction: Rugged outer shell engineered to withstand drumstick hits, mobile stage use, and demanding tour schedules.
  - Passive Dynamic Operation: Requires no phantom power (+48V) or external power source, connecting directly via standard 3-pin XLR.
  - Element type: dynamic.
  - Frequency response: 80 Hz to 15 kHz.
  - Polar pattern: cardioid.
  - Rear rejection at 180 degrees off-axis: -30 dB.
  - Impedance: 600 ohms balanced.
  - Output level at 1 kHz: -55 dB.
  - Max SPL: 138 dB.
  - Output connection: 3-pin XLR.
  - Included accessories: microphone clip and windscreen.
