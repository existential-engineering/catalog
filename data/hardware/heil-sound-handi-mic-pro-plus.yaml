details: |-
  Product Overview

  The Heil Handi Mic Pro Plus is an ultra-compact dynamic microphone engineered to solve challenging miking and tight-space placement issues on live stages and in recording studios. Designed with a miniature footprint and a specialized cardioid dynamic element, the Handi Mic Pro Plus allows sound engineers to easily position a high-quality microphone inside congested drum setups, tight guitar amplifier cabinets, brass instrument bells, and small acoustic spaces (like Leslie speakers) where standard handheld or studio microphones cannot physically fit.Featuring a smooth frequency response spanning 80 Hz to 15 kHz, the Handi Mic Pro Plus captures transient attacks and mid-range detail while insulating the sound source from ambient stage noise. Capable of handling high sound pressure levels without clipping or distortion, it excels on percussion, snare drums, toms, and high-volume amplified instruments. Built into a durable, low-profile housing with standard 3-pin XLR connection, the Handi Mic Pro Plus delivers reliable Heil Sound dynamic performance in an extremely portable form factor.

