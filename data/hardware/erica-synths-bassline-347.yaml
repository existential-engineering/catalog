details: |-
  Erica Synths Bassline is a fully analogue synth voice module for basslines and leads. It features an AS3340 VCO with three waveforms and a filter inspired by the Erica Synths Acidbox.

  Two features set it apart: a transistor based suboscillator, and two BBD lines that emulate VCO detune to create the sound of a massive polysynth from a single oscillator. Accent provides more expression to the bassline by adding volume and opening the VCF slightly.

  The circuit is fully analogue with great 1V/oct tracking across a C0 to C8 pitch range. Triangle, Square and Master outputs are available simultaneously, and integrated VCF and VCA decay envelopes shape each note. The filter runs in lowpass or bandpass mode.

  External VCO FM and VCF cutoff CV inputs open the voice up to patching, and an Accent input adds emphasis. The audio output runs -5V to +5V and CV level covers -5V to +5V across the full span.

  The module is 14HP wide and 35mm deep, drawing +110mA and -70mA.
specs: |-
  - Pitch range C0-C8
  - Audio output level -5...+5V
  - CV level (full span) -5V-+5V
  - Power consumption +110mA, -70mA
  - Module width 14HP
  - Module depth 35mm
  - Fully analogue circuit
  - Great 1V/oct tracking
  - Simultaneous Triangle, Square and Master outputs
  - Accent input
  - Transistor-based suboscillator
  - BBD-based VCO detune emulation
  - Integrated VCF and VCA decay envelopes
  - LP/BP VCF
  - External VCO FM and VCF cutoff CV inputs
