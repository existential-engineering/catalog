description: >-
  The MacBeth M3X is a hand-built, MIDI-controlled, rack-mount analog monosynth from Scottish designer Ken MacBeth,
  featuring three oscillators and a Moog-style transistor ladder filter in a streamlined package.
details: |-
  The M3X emerged from Ken MacBeth's Scottish workshop in 2001 as a boutique analog synthesizer that prioritized sound quality and build craftsmanship above all else. Each unit was hand-built, reflecting MacBeth's philosophy of creating instruments with genuine analog character rather than mass-produced digital approximations.

  At the heart of the M3X are three dedicated analog oscillators, each offering five waveform types with user-selectable routing destinations including cross-modulation capabilities. A noise generator and external audio input amplifier expand the sound palette further, allowing the M3X to process other synths or sound sources through its signal path.

  The filter section draws inspiration from classic Moog designs, employing a transistor ladder topology for 24dB/octave low-pass filtering. Controls for frequency cutoff, resonance, envelope amount, and a dedicated ADSR envelope give precise command over tonal shaping. The LFO provides nine waveforms for modulation duties, while portamento adds expressive glide between notes.

  The updated M3X2 variant introduced temperature compensation for accurate keyboard tracking across a full 10-octave range, along with refined discrete transistor circuits and enhanced VCA performance. Both versions accept MIDI and CV/Gate control, bridging vintage analog connectivity with modern studio integration.
specs: |-
  - Monophonic
  - 3 analog oscillators with 5 waveform types each
  - Cross-modulation between oscillators
  - Noise generator
  - External audio input
  - 1 filter: 24dB/oct transistor ladder low-pass
  - 1 filter envelope (Attack, Decay/Release, Sustain)
  - 1 LFO with 9 waveforms
  - 1 VCA with dedicated envelope
  - Portamento
  - No keyboard (rack-mount module)
  - No patch storage
  - MIDI control
  - CV/Gate (1V/octave) input/output
  - S-Trig interface
