description: >-
  The original Ryan "Fluff" Bruce Artist Series StingRay (2023) — a Honduran
  mahogany hardtail with Fishman Fluence signature pickups (a dual-voiced
  humbucker at the bridge with push-pull voicing, plus an active single coil at
  the neck), figured roasted maple neck, and Schaller M6-IND locking tuners.
  Limited to 25 instruments per color.
details: |-
  The Ryan "Fluff" Bruce 2023 StingRay Guitar is a collaboration between the Ernie Ball Music Man design team and guitarist/content creator Ryan "Fluff" Bruce.

  Built around a Honduran mahogany body with a hardtail bridge, the guitar features a Fishman signature dual-voiced humbucker at the bridge with a push-pull volume potentiometer that toggles voices, plus a Fishman Fluence active single-coil at the neck.

  Limited to 25 instruments per color with numbered neck plates and a signed certificate of authenticity. Pairs a figured roasted maple neck and fingerboard with custom Fishman Fluence active electronics for a modern Artist Series voice. Ships set up in Drop C# with Beefy Slinky strings.
specs: |-
  - Body wood: Honduran mahogany
  - Body finish: High gloss polyester
  - Body dimensions: 14-1/16" wide, 1-5/8" thick, 39-1/4" long
  - Neck wood: Figured roasted maple
  - Neck finish: Gunstock oil and hand-rubbed wax
  - Neck width: 1-5/8" at nut, 2-1/4" at last fret
  - Neck radius: 10"
  - Neck attachment: 5-bolt numbered Artist Series plate, sculpted joint
  - Fingerboard: Figured roasted maple
  - Fret markers: Black dot inlay
  - Frets: 22 high-profile, medium-width stainless steel
  - Scale length: 25.5"
  - Bridge: Modern Classic Music Man top-loaded steel bridge plate with vintage steel saddles
  - Pickups: Custom Fishman Fluence dual-voiced active humbucker (bridge); Fishman Fluence SSS-BA1 active single-coil (neck)
  - Controls: 3-way pickup selector; push/pull volume toggles bridge pickup voices
  - Tuning machines: Schaller M6-IND locking
  - Available color: Aqua Sparkle (limited to 25 per color)
  - Tuning: Drop C#
  - Strings: 11p-15p-22p-30-42-54 (Beefy Slinky P02627)
