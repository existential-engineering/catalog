description: A stereo pedalboard-format tube/Class D hybrid guitar amplifier
  with two independent amplification channels, a cabinet-simulated line output,
  and a stereo headphone amplifier. It includes footswitches to sum to mono and
  flip channel phase.
details: |-
  Stereo made easy

  ABOUT

  Following on the heels of The Amp and The Amp 100 we have a newly designed fully stereo amplifier design with many extra features that will surely make this amplifier an essential part of any musician's toolkit. There is now an elegant, analog, easy to use end of the chain solution for players using stereo effects featuring our cab sim sweetener, a stereo headphone amplifier and two powerful channels of amplification. On top of the stereo functionality, The Amp Stereo can be run as two independent amplifiers each powering separate channels of audio. Use the built in footswitches to sum to mono and fix phase issues potentially created by wet/dry guitar setups or cabinets with reverse polarity. The two outputs can run into separate cabinets varying in impedance and wattage – for example a 4ohm bass cabinet can be powered by one side and 8ohm guitar cabinet by the other. The Amp Stereo has been designed to maximize headroom and serve as a foundation for all manner of instruments and effects. Like all Milkman products, The Amp Stereo is built by hand in California with the finest components available. WATTAGE

  50W 16ohm Output x2

  100W 8ohm Output x2

  200W 4ohm Output x2

  FOOTSWITCHES

  SUM converts the 2 independent channels to mono (both outputs)

  PHASE flips phase on the right channel (useful for wet/dry)

  DIMENSIONS & WEIGHT

  8-1/2" W x 3" H x 6-1/2" D 2.5lbs

  The Amp Stereo Manual

  Demo

  Introducing The Amp Stereo

  Simplify your Stereo setup
