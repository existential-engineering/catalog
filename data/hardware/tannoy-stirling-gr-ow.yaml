details: |-
  A 2-way floorstanding loudspeaker from the Prestige series, featuring a 10-inch Dual Concentric driver in a handcrafted oiled walnut cabinet. The 25mm aluminium-magnesium dome, loaded by a Tulip Waveguide, produces symmetrical dispersion and true point-source imaging. At 91 dB/W sensitivity and 340 W peak power handling with a Distributed Port system for extended low-frequency response. Gold-plated bi-wireable binding posts and a fifth grounding post reduce RFI and improve midrange clarity.
specs: |-
  - type: 2-Way Floorstanding
  - driver: 10-inch Dual Concentric
  - tweeter: 25mm aluminium-magnesium dome with Tulip Waveguide
  - sensitivity: 91 dB/W
  - peakPowerHandling: 340 W
  - connections: Gold-plated bi-wireable binding posts + 5th grounding post
  - finish: Oiled walnut veneer with walnut inlays
