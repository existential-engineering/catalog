details: |-
  Revisit the sound that defined a generation of drumming while stepping into the future of performance. The Ludwig Stainless Steel Drum Set 50th Anniversary Reissue is more than a drum kit—it's a celebration of craftsmanship, innovation, and thunderous tone.

  This reissue faithfully recreates the original format for the first time in fifty years. The rolled stainless steel shells are precision-crafted to deliver a bold, cutting sound with exceptional projection and tonal balance.

  Whether on stage or in the studio, this kit dominates the mix with authority and finesse. Available as Pro Beat 3pc and Zep 4pc shell packs, plus a full range of component drum sizes for custom configurations.
specs: |-
  - 1mm rolled stainless steel shells
  - Single 45-degree flanged bearing edge
  - Ludwig Weathermaster Silver Dot heads by Remo
  - Blue/Olive badge
  - Curved spurs
  - Pro Beat 3pc Shell Pack: 14" x 24" bass drum, 16" x 16" floor tom, 9" x 13" tom
  - Zep 4pc Shell Pack: 14" x 26" bass drum, 16" x 18" floor tom, 16" x 16" floor tom, 10" x 14" tom
  - Component toms available: 8"x12", 9"x13", 10"x14"
  - Component floor toms available: 16"x16", 16"x18"
  - Component bass drums available: 14"x24", 14"x26"
