details: |-
  The must-have microphone for podcast, broadcast, voiceover, streaming, gaming & video calls. Get your hands on a limited edition The Magnus Archives Podcast Pro, hand-crafted by the Sontronics team, featuring a special colour way and unique laser engraving specific to The Magnus Archives. This set contains 1x The Magnus Archives branded PODCAST PRO MIC + XLR to USB cable + desktop stand; everything you need to start podcasting or streaming like a pro! It also features The Magnus Archives microphone charm / key chain and accompanying booklet. More about the Podcast Pro microphone:

  Sontronics Podcast Pro is a professional dynamic microphone, hand-built in the UK, specifically developed to give incredible results for podcast as well as radio broadcast, gaming, streaming, vlogging, video calls and music. If you need to record, broadcast or capture vocals of any kind, Podcast Pro is the mic for you. Thanks to its tightly focused supercardioid pickup and excellent side rejection, Podcast Pro will reproduce your voice with outstanding detail, presence and depth without capturing any extraneous background noise. Its high output level means that, unlike all the other podcast mics on the market, Sontronics Podcast Pro doesn't require extra signal-boosting devices or any processing with expensive plug-ins. The mic's internal protection and built-in popshield provide superb control over sibilance (eg: S, CH, Z) and plosives (B, P), ensuring the best possible results wherever you are and whatever you're doing. *shipping - please note any shipping outside of the United Kingdom will incur additional duties and taxes payable to local customs, by the customer. FEATURES

