specs: |-
  - Dynamic Microphone : Specifically designed for speech-based applications, delivering clear and natural vocal recordings ideal for podcasting, broadcasting, voiceovers, and streaming.
  - Supercardioid Polar Pattern : Provides excellent off-axis rejection, focusing on your voice while minimising background noise, ensuring clean and professional recordings even in less-than-ideal environments.
  - Broadcast-Quality Sound : Tailored frequency response enhances vocal presence and clarity, delivering rich, broadcast-quality audio right out of the box.
  - Rugged, Compact Design : Built with a durable all-metal body and a sleek, compact form factor that's perfect for desktop use in studios, home setups, or on-the-go recording.
  - Internal Pop Filter : Features an integrated pop filter that reduces plosive sounds (like "p" and "b" sounds), ensuring smooth and clean vocal recordings without the need for additional accessories.
  - No Need for External Power : As a dynamic mic, the Podcast Pro requires no phantom power, making it easy to use with a wide range of audio interfaces and recording devices.
  - Plug-and-Play Simplicity : Simply plug it in and start recording, with no complicated setup or additional equipment needed, ideal for beginners and professionals alike.
  - Tailored for Voice : The mic's frequency response is specifically tuned for speech, capturing every nuance of the voice with detail and warmth.
  - Perfect for Content Creators : Whether you're a podcaster, YouTuber, or Twitch streamer, the Podcast Pro delivers professional sound quality that enhances your content.
