description: >-
  The Transcendent 2000 is a monophonic analog synthesizer designed by Tim Orr and sold as
  a kit by Powertran in 1978. Originally conceived as an affordable DIY alternative to
  commercial synthesizers, it features a single VCO, switchable lowpass and bandpass
  filter, and a 37-key keyboard. Notably, it was the first synthesizer owned by Joy
  Division and can be heard on their debut album Unknown Pleasures.
details: |-
  The Transcendent 2000 was designed by Tim Orr, who was also notable for his work at EMS and Akai. Conceived in the late 1970s, it followed a similar philosophy to PAiA in the United States by offering an affordable synthesizer kit that could be assembled at home. According to legend, EMS did not want their name associated with the varying build quality of a homemade synth, so the kit was marketed by Powertran instead.

  The instrument came in the form of a single PCB that was carefully laid out and accompanied by detailed schematics, keeping manufacturing costs low and assembly straightforward. Build quality varies significantly depending on the assembler's skill, with common issues including a wobbly case, sticky keys, and potentiometers mounted too close to the front panel. These issues are easily remedied by a competent owner.

  Despite its budget origins, Orr did not skimp on features. The oscillator switches between saw and pulse waveforms, with an adjustable gradient for the saw and variable width for the pulse that can also be modulated by the LFO. Pitch modulation is available via the LFO or sample-and-hold, and a noise generator and full ADSR envelope are included. The filter can be switched between lowpass and bandpass modes, which was unusually advanced for a budget synthesizer, and is capable of producing extremely vicious resonant squeals.

  The Transcendent 2000 does not conform to the usual 1V/octave ratio, and the external gate will only trigger if a key is already held down on the keyboard. These limitations can be rectified by using a MIDI converter with CV ratio tuning or by adding a keyboard disable switch. The synthesizer has a character similar to the Korg MS-20, but was available at a fraction of the price, and its simple design allows for interesting modifications.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO with saw and pulse waveforms
  - Waveforms: Adjustable saw gradient and variable pulse width
  - LFO: 1 with pitch and pulse width modulation
  - Modulation: Sample-and-hold
  - Noise: Noise generator
  - Filter: Switchable lowpass and bandpass with attack/decay envelope
  - Envelopes: ADSR amplitude envelope
  - Portamento: Yes
  - Pitch bender: Yes
  - Keyboard: 37 keys
  - Control: CV/Gate inputs
  - Construction: Single PCB kit
  - Memory: None
