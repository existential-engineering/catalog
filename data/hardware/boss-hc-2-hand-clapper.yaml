description: >-
  A single-function hand clap synthesizer released by Boss in 1984 that generates clap
  sounds using filtered white noise with user controls for tone and reverb.
details: |-
  The HC-2 is a compact drum sound module housed in a metal case with a touch-sensitive rubber trigger pad. It produces clap sounds comparable to classic TR-808/909 units using a variation of their circuit design. Users can adjust the 'Dry' control for brightness and the 'Hall' control for reverb tail length. The unit runs on a 9V battery or external power supply and features a 1/4" trigger input jack for integration with drum machines or sequencers. It works well as a companion to units like the DR-55 and TR-606 that lack clap sounds, and offers expressive performance capabilities through manual pad tapping.
specs: |-
  - Polyphony: Monophonic
  - Multitimbral: 1
  - Oscillators: 1
  - Waveforms: White noise
  - Filter: 'Dry' brightness control
  - Envelope: 'Hall' decay control
  - Effects: None
  - Arpeggiator/Sequencer: None
  - Keyboard: Trigger pad (touch sensitive)
  - Memory: None
  - Control: Trigger input
  - Power: 9V battery or DC external power supply
  - Date Produced: 1984-85
releaseDate: "1984"
releaseDateYearOnly: true
