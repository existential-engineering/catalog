details: |-
  The Stephen Egerton StingRay Artist Series guitar is a collaboration between the Ernie Ball Music Man design team and Stephen Egerton, guitarist of the iconic punk rock band Descendents.

  The Egerton StingRay features a Charcoal Frost body with shell pickguard, a classic yellow-tinted satin-finished maple neck with a rosewood fingerboard, and a custom laser-engraved Artist Series neck plate.

  Perhaps the most conspicuous feature is the absence of any knobs or switches. A single Music Man custom-wound chrome-covered humbucker is wired straight to the jack — plug in and play.
specs: |-
  - Body wood: Okoume
  - Body finish: High gloss polyester
  - Body color: Charcoal Frost
  - Body dimensions: 14-1/16" wide, 1-5/8" thick, 39-1/4" long
  - Neck wood: Maple
  - Neck finish: Ultra-light satin polyurethane (classic yellow tint)
  - Neck width: 1-5/8" at nut, 2-1/4" at last fret
  - Neck radius: 10"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Rosewood
  - Fret markers: 1/4" dot inlay
  - Frets: 22 high-profile, medium-width stainless steel
  - Scale length: 25-1/2"
  - Pickup: Single Music Man custom-wound humbucking with chrome cover (no knobs or switches; wired straight to jack)
  - Bridge: Music Man Modern hardtail with crescent cover and vintage bent steel saddles
  - Pickguard: Shell
  - Tuning machines: Schaller M6-IND locking
  - Strings: 11p-14p-18p-28w-38w-48w (RPS Power Slinky #2242)
