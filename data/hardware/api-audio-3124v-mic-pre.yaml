id: af32mnAoMEop6XrNRpTKq
name: 3124V Mic Pre
manufacturer: api-audio
primaryCategory: preamp
categories:
  - rack-mount
url: https://apiaudio.com/product/3124v-mic-pre/
description: 4-channel rack-mount mic preamp with API's classic AP2516 input
  transformer, proprietary output transformer, and API 2520 op-amps. Delivers up
  to 65 dB gain per channel with switchable mic/instrument inputs, 48V phantom
  power, 20 dB pad, polarity invert, and variable 3:1 output transformer tap.
details: |-
  1U 4-channel rack-mount mic preamp. Each channel features rear-panel
  XLR mic input, front-panel Hi-Z instrument input, 20 dB pad, polarity switch,
  48V phantom power, variable output level with 3:1 transformer tap selection.
  EIN: -129 dBu (mic), -125 dBu (unbalanced).
specs: |-
  - Channels: 4
  - Gain: 10–65 dB
  - Mic input impedance: 1,500 Ω
  - Hi-Z input impedance: 470 kΩ
  - Output impedance: <75 Ω (transformer balanced)
  - Frequency response: 10 Hz–20 kHz
  - EIN (mic): -129 dBu
  - THD: 0.03% at +4 dBu; 0.09% at +22 dBu
  - Power: 19.2 W
  - Dimensions: 19" W × 1.75" H × 11" D
  - Weight: 10.38 lb
