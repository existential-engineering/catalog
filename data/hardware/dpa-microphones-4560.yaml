details: |-
  The 4560 CORE+ Binaural Headset Microphone is, in its essence, a pair of 4060 CORE+ Miniature Omnidirectional Microphones that are mounted on two earhooks (as known from the 4266 Flex type of headset). The microphones are a stereo pair; two handpicked 4060s, selected on sensitivity within ±1.5 dB. Now available with CORE+ & MicroLock. CORE+ takes your miniature mic to the next level, neutralizing distortion across the entire dynamic range. MicroLock – A dependable, secure locking microphone connector with limitless flexibility and reassuring reliability. Unobtrusive and easy immersive sound recording is possible with the 4560 Binaural Headset Microphone.
