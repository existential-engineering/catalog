url: https://rme-audio.de/fireface-802-fs-ae.html
description: 'The Fireface 802 FS is a highly integrated pro audio solution for
  live and studio use, all within a 19" enclosure. An interface designed for
  users who don''t want to make compromises in sound, stability and ultra-low
  latency operation, and who long for an unrivaled professional feature set.
  Once again a milestone interface from RME, including the best of the best and
  even a bit more. 60 channels of audio, high-end microphone preamps, reference
  class converters, a complete effects section and operation at up to 192 kHz
  are the base for many more features. The Fireface 802 FS is based on a newly
  developed analog and digital board. While the analog board offers DC-coupled
  analog outputs as well as new AD and DA converters, the digital board also
  enables interesting new features thanks to updated high-tech components. The
  front panel provides four high-performance XLR/TRS combo inputs for
  microphone, instrument and line signals and two stereo headphone jacks with
  +17 dBu output level. The rear panel reveals the full connectivity with MIDI
  and Word Clock I/O, two optical ADAT I/Os, an AES/EBU I/O, and eight balanced
  analog inputs and outputs with line level. With the new Multi-Mode, the two
  ADAT I/Os can be used as separate optical SPDIF inputs and outputs in addition
  to the AES I/O. A USB A port is available for connecting the optional ARC USB.
  The Fireface 802 FS operates in two different modes: driver-based USB 2 and
  Class Compliant. All line-level outputs are fully DC-coupled, allowing for the
  sending of control voltages (CV) or Gate information to modular synthesizers.'
details: |-
  60-Channel 192 kHz high-end USB audio interface in a 19-inch 1U rack enclosure. Features four front-panel XLR/TRS combo inputs for microphone, instrument and line signals (channels 9-12), two stereo headphone outputs with +17 dBu output level, eight rear-panel balanced analog line inputs and outputs, AES/EBU I/O, dual optical ADAT I/O (Multi-Mode for SPDIF), MIDI I/O, Word Clock I/O, USB 2.0, and an additional USB A port for the optional ARC USB remote control. Includes TotalMix FX DSP mixer with EQ, Dynamics, Reverb and Delay; DigiCheck Analyzer; SteadyClock FS; DC-coupled outputs for CV/Gate control; Class Compliant USB mode for Linux, macOS and iPadOS; stand-alone operation with 6 memory slots for setup recall.
specs: |-
  - 60-channel 192 kHz high-end USB audio interface
  - 19-inch 1U rack enclosure
  - Sample rates: 28 kHz to 200 kHz
  - AD Line In 1-8: SNR @ LoGain 116 dB (AES17), 118 dBA
  - AD Line In 1-8: THD @ -1 dBFS < -120 dB
  - AD Line In 1-8: Maximum input level +19 dBu
  - Microphone In 9-12: SNR 113 dB RMS unweighted, 116 dBA
  - Microphone In 9-12: Gain range 54 dB
  - Microphone In 9-12: Maximum input level Gain +6 dB: +10 dBu; Gain +60 dB: -44 dBu
  - Instrument In 9-12: Input impedance 1 MOhm
  - Instrument In 9-12: SNR 113 dB RMS unweighted
  - Instrument In 9-12: Maximum input level Gain +6 dB: +21 dBu; Gain +60 dB: -33 dBu
  - DA Phones Output (9-12): Maximum output level 0 dBFS: +17 dBu
  - DA Phones Output (9-12): Max power @ 32 Ohm, 0.02% THD: 200 mW
  - DA Line Out 1-8: SNR @ HiGain 116.5 dB (AES17), 118.5 dBA
  - DA Line Out 1-8: THD+N < -110 dB
  - DA Line Out 1-8: Output impedance 75 Ohm
  - Clocks: Internal, ADAT In, AES In, SPDIF In, Word Clock In
  - Jitter suppression of external clocks: > 50 dB (> 1 Hz)
  - AES/EBU: 1 x XLR, transformer-balanced, galvanically isolated
  - AES/EBU Lock range 27 kHz–200 kHz
  - ADAT Optical: 2 x TOSLINK; 2 x 8 channels 24-bit up to 48 kHz (Single Speed)
  - ADAT Optical: 2 x 4 channels at 96 kHz (Double Speed)
  - ADAT Optical: 2 x 2 channels at 192 kHz (Quad Speed)
  - SPDIF optical (ADAT 1/2 + ADAT 9/10): 1 x optical; Lock range 27 kHz–200 kHz
  - Word Clock: BNC, not terminated (10 kOhm); Level range 1.0 Vpp–5.6 Vpp; Lock range 27 kHz–200 kHz
  - AES/EBU output: Professional 4.2 Vpp, Consumer 2.4 Vpp
  - SPDIF output: Format Consumer per IEC 60958
  - Word Clock output: Max output voltage 5 Vpp; Output impedance 10 Ohm
  - Power supply: Internal switching PSU, 100–240 V AC, 30 Watt
  - Idle power consumption: 15 Watt; Typical 22 Watt
  - Dimensions with rack ears: 483 x 44 x 242 mm (19" x 1.73" x 9.5")
  - Dimensions without rack ears: 436 x 44 x 235 mm (17.2" x 1.73" x 9.3")
  - Weight: 2.8 kg (6.2 lbs)
  - Temperature range: +5° to +50° Celsius (41°F to 122°F)
  - Relative humidity: < 75%, non-condensing
  - DC-coupled line outputs for CV/Gate control of modular synthesizers
  - USB 2.0 Class Compliant mode for driverless operation (Linux, macOS, iPadOS)
  - 6 memory slots for stand-alone setup recall
  - Includes TotalMix FX DSP mixer with EQ, Dynamics, Reverb and Delay
  - Includes DigiCheck Analyzer
  - SteadyClock FS technology
  - Intelligent Clock Control (ICC)
