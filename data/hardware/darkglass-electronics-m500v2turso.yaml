description: The Microtubes 500 V2 Iku-Turso is a limited-edition run of the
  500W Microtubes 500 V2 bass amplifier head, dressed in a full-color print of
  the Iku-Turso sea deity from Finnish mythology. Only 200 units were produced.
details: |-
  The Microtubes 500 V2 Iku-Turso is a limited-edition version of the Microtubes 500 V2 bass amplifier head, themed around Finnish mythology. Known in ancient sagas as the master of tempestuous seas, the Iku-Turso deity comes to life in a stunning, full-color print on the amp.

  Available in an exclusive run of just 200 units, each amplifier is a homage to the epic narratives of the Kalevala, the treasured compilation of epic Finnish poetry, celebrating the mystical sea creature that has been a cornerstone of Finnish culture for centuries.

  The hardware is the Microtubes 500 V2: a 500W head with an all-analog solid-state preamp, custom Class D power module, the Dual Microtubes engine (B3K and Vintage drive circuits), cabinet simulation, a 6-band graphic EQ, and an intelligent compressor. Only the cosmetic graphic sets this limited edition apart.
specs: |-
  - Limited Edition Iku-Turso graphic (run of 200 units)
  - 500W bass amplifier head with signature Darkglass distortion engines
  - All-analog solid-state preamp with custom Class D power module
  - Dual Microtubes engine: B3K and Vintage drive circuits
  - Cab sim with selectable impulse responses
  - Studio-grade 6-band graphic EQ and intelligent compressor
