description: Camden 500 is the most astoundingly clean, linear, transparent 500
  series preamp you've ever heard. But it also has "Mojo" analogue saturation.
details: |-
  Camden 500 provides the utmost clarity and detail when it is most required. Its custom 'Camden' topology achieves stunning low-noise and low-distortion performance: -129.8dB EIN (150 ohm, unweighted) and THD+N as low as 0.0002%. It also sets a new standard for frequency and phase linearity: ±0.7dB frequency response from 5Hz to 200kHz at max gain and <2° phase shift @ 50Hz-20kHz.

  Camden 500 features "Mojo" - a custom analogue saturation circuit that transforms it into the fattest, warmest, most colourful mic preamp in your arsenal. Designed to introduce harmonics and saturation effects that vintage gear produces, Mojo can be subtle, it can be exaggerated, but best of all it can be bypassed.

  Designed from the ground up by Director of Engineering Edward Holmes, Camden 500 was created to be the ultimate recording front-end for the modern studio. It features a completely original, custom-designed preamp topology that achieves stunning low-noise and low-distortion performance and frequency/phase linearity at any gain setting from unity to 68.5dB.

  Camden 500 features a premium, 12-way switch gain control that applies up to 68.5dB of clean, transparent preamp gain in 5.5dB steps, making it easy to recall gain settings and match the gain of two Camden 500s for stereo applications. Any two Camden preamps are stereo matched to within 0.1dB.

  A 3-way Input Type switch tailors input impedance and headroom for Mic, Line, and Hi-Z sources, giving punchy, full-range line recording with +26.5dBu of input headroom as well as natural-sounding DI'd instruments via its BJT design and 1.5MOhm input impedance.
specs: |-
  - Minimum Gain: Mic 8dB, Line 0dB, Hi-Z 3dB
  - Maximum Gain: Mic 68dB, Line 60dB, Hi-Z 63dB
  - Input Impedance: Mic 8.9kOhm (48V off) / 5.4kOhm (48V on); Line 24.3kOhm; Hi-Z 1.5MOhm unbalanced / 3MOhm balanced
  - Max Input Level: Mic 17.6dBu (<0.003% THD); Line 26.5dBu (<0.02% THD); Hi-Z 24dBu (<0.02% THD)
  - Max Output Level: 27.5dBu (<0.002% THD, 30dB gain)
  - Output Impedance: 150 Ohms
  - Equivalent Input Noise (EIN): <-129.5dBu (150 ohm source, unweighted); <-131dBu (150 ohm source, A-weighted); <-135.5dBu (inputs common, unweighted)
  - Frequency Response: ±0.25dB (<5Hz to >200kHz, 35dB gain); <±1dB (<5Hz to >200kHz, max gain)
  - Phase Shift: <2.25° (40dB gain, 20Hz-20kHz); <4° (max gain, 20Hz-20kHz)
  - THD+N: <0.0004% (1kHz, 35dB gain, 24dBu out)
  - Intermodulation Distortion: <0.0008% (50Hz and 7kHz, 35dB gain, 20dBu out); <0.0006% (50Hz and 7kHz, 35dB gain, 15dBu out)
  - CMRR: >70dB typical, >85dB (35dB gain, 10-20kHz, 100mV common mode)
  - Slew Rate: 20V/uS (35dB gain, 25dBu out)
  - Current Draw: 120mA per rail idle; 140mA per rail typical use
  - Hi-Pass Filter (HPF): 80Hz, -3dB, 12dB/Octave, progressive slope
  - Dimensions: 31.8 x 133.35 x 170.11mm (W x H x D)
  - Gain control: 12-way stepped switch, 5.5dB steps
  - Stereo matching: within 0.1dB between units
