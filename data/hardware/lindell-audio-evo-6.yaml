details: |-
  The EVO-6 is a Discrete Microphone preamplifier featuring Lindell's Vintage 1731OPA for a creamy vintage tone. With hand wound transformers and inductors as well as onboard tone controls that are reminiscent of the old school passive Pultec filters, the EVO-6 is your key to an incomparable smoothness.

  Employing hand-wound transformers and inductors to provide vintage-style colored tone, the EVO-6 500 Series Discrete Microphone Preamp features the vintage 1731 op amps for additional warmth. Its input pad and separate gain control allow you to drive your signal harder for saturated tones, while the 2-band EQ section provides you with Pultec-style passive filters.

  Gain is clearly displayed via the 30-segment LED VU meter. The Sound can be described as Vintage, Punchy and Tight.
specs: |-
  - Transformer Balanced inputs and Balanced Outputs
  - Vintage OPA input stage
  - Up to 70db of Gain
  - Passive Pultec Equalizer. Inductor + Vintage OPA
  - 2 Step Switched Eq Low Freq Boost 60Hz, 100Hz
  - 2 Step Switched Eq High Freq Boost 4kHz, 8kHz/16kHz
  - Selectable High Boost Bandwidth on PCB
  - Polarity Reverse
  - 48V Phantom Power
  - 30-LED segment output Meters
  - Gold Plated PCB
