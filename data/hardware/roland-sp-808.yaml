description: >-
  Roland's SP-808 GrooveSampler is an all-in-one phrase sampling workstation
  built around a Zip drive for storage, offering four stereo voices of
  polyphony, 16 sample pads, built-in effects, and a pattern sequencer aimed at
  remixers, DJs, and hip-hop producers.
details: |-
  Released in 1998, the SP-808 was Roland's ambitious attempt to create a self-contained sampling
  production environment. It stored samples on removable 100MB Zip disks, offering up to 25 minutes
  of stereo sampling at 44.1 kHz across over 1,000 sample slots organized into 64 banks of 16 pads.
  The built-in D-Beam controller allowed for theremin-style manipulation of pitch and volume in
  real time.

  The onboard effects section was a major selling point, with 99 preset and 99 user effect patches
  covering lowpass resonant filters, isolator, reverb, delay, pitch shifting, distortion, phaser,
  and compression. A pattern sequencer with capacity for 64 songs and 2,000 events per song
  provided arrangement capabilities without needing external gear.

  In 2000, Roland released the SP-808EX (e-Mix Studio) in a translucent case with significant
  upgrades including a 250MB Zip drive, a virtual monophonic synthesizer, a 10-band vocoder, voice
  transformer, and mic simulator. The EX version expanded recording capacity to 61 stereo minutes
  using compression and offered optional expansion boards for additional analog and digital I/O.
specs: |-
  - Polyphony: 4 stereo voices
  - Sampling: 44.1 kHz and 32 kHz rates
  - Storage: 100MB Zip drive (250MB on SP-808EX)
  - Sample capacity: 1,000+ samples (16 pads x 64 banks)
  - Maximum sample time: 25 minutes stereo at 44.1 kHz
  - Effects: 99 preset / 99 user patches (filter, isolator, reverb, delay, pitch shift, distortion, phaser, compression)
  - Sequencer: 64 songs, 2,000 events per song
  - Controller: D-Beam infrared controller
  - Connectivity: MIDI In/Out, MMC, MTC, MIDI Clock
  - SP-808EX additions: virtual synth, 10-band vocoder, voice transformer, 61 min stereo recording
releaseDate: "1998"
