details: |-
  The Martin 000-18 Modern Deluxe is a premium Auditorium-body acoustic guitar that merges Martin's vintage tonal heritage with modern construction refinements. Built on the classic 000-14 fret platform, it pairs a Vintage Tone System (VTS) Sitka spruce top with genuine mahogany back and sides for a warm, balanced voice with crisp articulation.

  Under the hood, Golden Era–style scalloped Adirondack spruce X-bracing and a carbon fiber bridgeplate deliver enhanced responsiveness and sustain while keeping weight low. The Vintage Deluxe neck shape with a High-Performance Taper offers a comfortable hand feel for both fingerstyle and flatpicking players.

  Appointments are upscale throughout: an ebony fingerboard and bridge, Waverly gold open-gear tuners, EVO gold frets, and Liquidmetal bridge pins with red acrylic dots. The instrument ships with Authentic Acoustic Lifespan 2.0 phosphor bronze light strings and a ply hardshell case, and is backed by Martin's limited lifetime warranty.

  While the standard configuration is fully acoustic, the 000-18 Modern Deluxe can be optionally upgraded at order with LR Baggs Anthem, Fishman Gold Plus Natural, or Fishman Infinity Matrix electronics for amplified performance.
specs: |-
  - Body size: 000-14 Fret (Auditorium)
  - Top: Sitka spruce with Vintage Tone System (VTS)
  - Back and sides: Genuine mahogany
  - Bracing: Golden Era–style scalloped Adirondack spruce X-brace
  - Bridgeplate: Carbon fiber
  - Scale length: 24.9"
  - Nut width: 1¾"
  - Fingerboard: Ebony
  - Bridge: Ebony
  - Neck shape: Vintage Deluxe with High-Performance Taper
  - Frets: EVO gold, 20 total
  - Tuners: Waverly gold open-gear
  - Bridge pins: Liquidmetal with red acrylic dots
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light
  - Case: Ply hardshell included
  - Left-handed: Available
  - Electronics: None standard (optional LR Baggs Anthem, Fishman Gold Plus Natural, or Fishman Infinity Matrix upgrade)
