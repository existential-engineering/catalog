description: >-
  The Oberheim OB-Mx is a fully analog rackmount synthesizer designed by Don Buchla, featuring modular voice expansion from 2 to 12 voices and dual filter types per voice emulating both classic Oberheim and Minimoog characteristics. It was one of the few true analog polyphonic synths available with full MIDI programmability in the mid-1990s.
details: |-
  Released in 1994, the OB-Mx represented an ambitious attempt to bring classic analog synthesis into the modern MIDI era. Designed by the legendary Don Buchla, though he later distanced himself from the project, the instrument aimed to deliver the coveted tones of vintage Oberheim and Moog synthesizers in a programmable, rack-friendly format.

  The architecture is built around expandable voice cards, starting with two voices and scaling up to twelve through the addition of modular expansion boards. Each voice features two oscillators with triangle, sawtooth, and pulse width waveforms, three LFOs, and four multistage envelopes, providing substantial modulation depth. The dual filter design pairs a 12 dB per octave Oberheim-style multimode filter with a 24 dB per octave Minimoog-style lowpass, though these filters have been a point of contention among users who find them thinner sounding than the vintage originals they emulate.

  With 256 patches and 256 performances accessible across 12 multitimbral parts via MIDI, the OB-Mx offered considerable flexibility for studio integration. Despite the filter criticisms, the raw oscillator sound and extensive modulation routing made it a compelling instrument for artists like Nine Inch Nails, U2, Sneaker Pimps, and DJ Spinna who valued genuine analog signal paths with modern convenience.
specs: |-
  - Polyphony: 2 voices (expandable to 12 via voice cards)
  - Oscillators: 2 per voice (triangle, sawtooth, pulse width)
  - Filters: 2 per voice (12 dB/oct Oberheim low/band/highpass + 24 dB/oct Minimoog lowpass)
  - LFO: 3 per voice (triangle, sawtooth, sample & hold)
  - Envelopes: 4 multistage per voice
  - Memory: 256 patches, 256 performances
  - Multitimbral: 12 parts
  - Keyboard: None (rack module)
  - Control: MIDI
