url: https://sonicware.jp/products/liven-8bit-warps
description: LIVEN 8bit warps pairs an 8-bit waveform-memory synthesizer with a
  step sequencer and 4-track looper, built for live electronic performance. It
  offers 6-voice polyphony, mono and arpeggiator modes, multimode filtering, and
  128 editable waveform memories.
details: |-
  LIVEN 8bit warps combines an 8-bit waveform memory synthesizer with a step sequencer, designed with a focus on live electronic performance.

  This product does not include an AC adapter. If you need one, please select the "With PSU" option.
specs: |-
  - Maximum polyphony : 6 voices
  - Voice Mode : Polyphonic, Mono, Arpeggiator
  - Filter : LPF, HPF, BPF
  - Memory : 128 patch memories, 128 waveform memories
  - Sequencer : 128 steps, 128 patterns
  - Looper : 4-track looper (3 tracks for internal, 1 track for LINE IN)
  - I/O : MIDI IN/OUT, SYNC IN/OUT, LINE IN/OUT , headphone out
  - Size : 11.7 inch (W) x 6.92 inch (D) x 1.89 inch (H), 297mm (W) x 176mm (D) x 48mm (H)
  - Weight : 1.74lb., 790g
  - Accessories: Warranty
  - Power supply: AA batteries x 6, or 9V DC output AC adapter (1A or higher, EIAJ3 standard inner diameter 1.7mm outer diameter 4.75mm, center +) *The AC adapter is not included.
