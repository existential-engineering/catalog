details: |-
  The AUDIX Novacore NCTH is a professional tight hypercardioid wireless capsule engineered for high-gain environments where maximum feedback rejection and precise, controlled pickup are critical. Its voicing is consistent with the AUDIX OMX series of stage microphones, delivering the natural sound and strong transient response that AUDIX capsules are known for — optimized for the demands of loud stages, monitor-heavy rigs, and controlled theatrical applications.

  The tight hypercardioid polar pattern provides a narrow pickup angle and substantially improved off-axis rejection compared to cardioid and extended cardioid patterns, making it the preferred choice for vocalists performing in front of loud stage monitors, in wedge-heavy theatrical productions, or in any environment where gain-before-feedback is the primary concern. Internal vibration isolation reduces handling noise for clean, consistent vocals throughout a performance.

  The NCTH mounts via standard "S" thread to the AUDIX NCHH handheld transmitter and is also compatible with many S-thread wireless handheld transmitters by other leading brands in the category , offering an immediate sonic upgrade for engineers on other wireless platforms. It is sold individually and is also included in the NCHHTH bundle.
specs: |-
  - Polar pattern: Tight hypercardioid
  - Voicing: consistent with AUDIX OMX series
