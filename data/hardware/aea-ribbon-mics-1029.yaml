description: The AEA 1029 is an ultra-clean stereo VCA compressor in a half-rack
  chassis, featuring a proprietary discrete op-amp design by Fred Forssell and
  two THAT 4305 VCA chips driven by a single RMS detector.
details: |-
  The AEA 1029 utilizes a proprietary discrete op-amp design by Fred Forssell and two THAT 4305 VCA chips run off of a single RMS detector being fed by the summed input signals. This design results in a versatile compressor with a clear and balanced sound perfect for taming vocals or smashing drum overheads.

  Designed to pair well with AEA's TRP and RPQ series preamps, the 1029 Stereo VCA compressor is perfect for recording and/or mixing stereo microphones.

  Packed into a sleek, half-rack design, the AEA 1029 is perfect for desktop use or for those looking to save space in their rack. With 3 position Sensing Time (Peak Fast, Slow, and RMS) and a variable ratio from 1:1 to Limit, the 1029 can go from subtle to extreme compression as needed.

  The 1029 features a Dry/Wet percentage control knob and true bypass relay switching, making it equally at home in a bedroom or professional studio.

  Made in the U.S.A. and designed by Fred Forssell, the 1029 delivers ultra-clean compression that goes from subtle smoothing to brickwall limiting.
specs: |-
  - Half-rack form factor
  - 2 channels of XLR in and out
  - 3 position Peak Fast, RMS, and Peak Slow sensing times
  - Variable threshold from -20dBu to 20dBu
  - Variable ratio from 1:1 - Limit
  - Up to 20dB of makeup gain
  - Dry/Wet percentage control knob
  - True bypass relay switching
  - Circuit, including discrete op-amp, designed by Fred Forssell
  - Two THAT 4305 VCA chips
  - Single RMS detector fed by summed input signals
  - Made in the U.S.A.
