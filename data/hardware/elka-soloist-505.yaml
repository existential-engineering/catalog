details: |-
  The Soloist 505 is a straightforward monophonic synthesizer from Elka that carries the visual DNA of the organ world, complete with front-panel controls and even a sheet music stand. Its clean, clear sound is characteristic of Italian synthesizer design from this era, sharing sonic qualities with instruments from fellow Italian manufacturer Siel.

  The instrument provides a single VCO with a preset section offering ready-made sounds including sax and trombone patches that carry some genuine character. A free mode allows basic waveform modification for more adventurous sound design, though the overall capabilities remain modest. The 49-key keyboard is a highlight, offering a responsive playing experience.

  Without MIDI, CV, or any form of external control, the Soloist 505 is a self-contained instrument from a pre-connectivity era. It lacks an LFO, arpeggiator, and patch memory, relying instead on its preset sounds and simple controls for slow attack, decay, and wow effects. It remains a slightly rare curiosity from the late 1970s Italian synthesizer scene.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - Filter: Slow attack, decay, wow
  - LFO: None
  - Arpeggiator: None
  - Keyboard: 49 keys
  - Memory: None
  - Control: None (no MIDI or CV)
releaseDate: "1978"
