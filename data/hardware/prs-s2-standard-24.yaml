details: |-
  With its solid build and versatile electronics platform, the S2 Standard 24 is a true player’s guitar that handles as well as it sounds whether plugged straight into your amp or run through your pedal board. The subtle aesthetic of mahogany and vintage vibe of pickguard-mounted electronics give the S2 Standard 24 an understated look for players who prefer a stripped-down approach to their music.

  The S2 Standard 24’s solid mahogany body and set neck give this guitar a distinctive resonance and powerful sustain, and when mahogany’s rich, round, warm tone meets the Maryland, USA-made PRS 58/15 LT pickups, there are plenty of clear highs and strong mids to be dialed in. The original PRS Standard, introduced in 1987, evolved from Paul Smith’s pre-factory all-mahogany guitars. Reimagined here for the S2 Series, the Standard 24 is gig-ready with a price tag to match.
