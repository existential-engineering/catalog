description: >-
  A monophonic bass synthesizer pedal from 1996 that transforms bass guitar signal into analog-modeled
  synth tones with 11 modes including internal oscillator, wave shaping, and T-Wah effects.
details: |-
  The Boss SYB-3 is a compact bass guitar pedal that functions as a genuine monophonic synthesizer,
  converting bass guitar input into a range of synthetic tones using analog-modeled DSP processing.
  Released in 1996, it bridges the gap between traditional bass effects and dedicated synthesizer
  hardware with a straightforward stompbox interface.

  The pedal offers 11 synthesis modes divided into three categories. Seven internal sound modes use
  the bass guitar signal to trigger a built-in oscillator producing sawtooth, square, pulse width
  modulation, lower octave, and noise waveforms. Two wave shape modes process the actual bass signal
  through synthetic filtering, and two T-Wah modes generate dynamic wah effects driven by playing
  dynamics.

  A resonant low-pass filter with cutoff control shapes the synthesized tones, while decay and hold
  parameters control the envelope behavior. Dual outputs allow the synthesized signal and the dry
  bass signal to be routed separately, enabling parallel processing or dedicated amplification for
  each signal path.

  Despite its simple three-knob interface, the SYB-3 delivers convincing analog synth bass tones
  that have made it a popular choice among bass players seeking synthesizer sounds without the
  complexity of a dedicated keyboard instrument.
specs: |-
  - Polyphony: Monophonic
  - Oscillator: Analog-modeled DSP (sawtooth, square, PWM, sub-octave, noise)
  - Filter: Low-pass with resonance and cutoff
  - Modes: 7 internal synth, 2 wave shape, 2 T-Wah
  - Controls: Decay, cutoff/resonance, hold
  - Outputs: Dual (synth and direct bass)
  - Format: Guitar pedal
releaseDate: "1996"
