details: |-
  Bass drum pedal available in a single (L204SF) and double (L205SF) configuration. The single pedal features an improved beater with traditional Speed King sizing, smooth-action bearings at the heel, an improved toe clamp to reduce hoop damage with a secured grip, ergonomic wing bolts with attached drum key, a reinforced baseboard, orientation marks for easier cam adjustments, and anti-slip cam features for stability. The double pedal extends the single's performance features into a double-kick format with an Anti-Slip Speed Cam, Speed Bearings, Spur-Lock Heel Anchor, aircraft aluminum connector shaft, 3-point adjustment for quick setup, and an included double pedal bag.
specs: |-
  - Single pedal model: L204SF
  - Double pedal model: L205SF
  - Improved beater with traditional Speed King sizing
  - Smooth-action bearings at heel connection
  - Improved toe clamp to reduce hoop damage with secured grip
  - Ergonomic wing bolts with attached drum key
  - Reinforced baseboard for added strength
  - Orientation marks for easier cam adjustments
  - Anti-slip cam features for maximum stability
  - Double pedal: Anti-Slip Speed Cam
  - Double pedal: Speed Bearings
  - Double pedal: Spur-Lock Heel Anchor
  - Double pedal: Aircraft aluminum connector shaft
  - Double pedal: 3-point adjustment format for quick setup
  - Double pedal: Double Pedal Bag included
