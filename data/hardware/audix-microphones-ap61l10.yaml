details: |-
  A professional true diversity lavalier wireless system featuring the AUDIX ADX10 cardioid miniature condenser microphone.
  The ADX10 is a lightweight, low-profile mic designed for lavalier applications such as speech, presentation, and theatrical production. With the ability to accurately capture and reproduce vocals from a comfortable distance of 4-8 inches, the ADX10 has a natural sound with an exceptional response that is resistant to feedback and easy to use.
  A single space rackmount kit with BNC cables for front mounting antennas is included. Optional accessories include a rackmount kit for mounting two systems in one rack space, active directional antennas, and an antenna distribution system for up to four systems (4 channels).

  Frequency Range
  522 MHz – 586 MHz
specs: |-
  - Mic: ADX10 cardioid miniature condenser lavalier
  - Polar pattern: Cardioid
  - System: R61 single-channel true diversity receiver with B60 bodypack transmitter
  - Frequency range: 522 MHz – 586 MHz
  - 207 pre-coordinated frequencies
  - Single-space rackmount kit with BNC antenna cables included
