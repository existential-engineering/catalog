details: |-
  A fiendishly clever high frequency equalizer, designed from the ground up with six parallel signal paths that produced the kind of air, sparkle, and presence previously found only in very old, very expensive analog equalizers.

  The Clariphonic 500 module makes it affordable to sprinkle that magic on vocals, drums, and individual instruments as well. The signal path is identical to the original rack unit, with a serious kind of voodoo, somehow it brings out the subtle beauty in everything it touches.

  Two high-shelves run in parallel, with a choice of 6 unusual and carefully selected corner frequencies covering everything from the mids to the supersonics. The internal parallel signal paths produce a form of additive-only high frequency equalization that is at once holographic, transparent, and virtually phaseless.

  The Clarity section selects between upper filters (Silk, climbing to 34k, or Shimmer, climbing to 18k) and lower filters (Sheen, rising to 8k, or Presence, rising to 4k), with a maximum boost of 14 to 16dB depending on the filter chosen. The Focus section routes the signal to Lift (800) or Open (3k) with up to 16dB of boost, and both sections bypass from the centre position of their three-position switches.
specs: |-
  - 500-series parallel equalizer module
  - Six parallel signal paths, additive-only high frequency equalization
  - Two high shelves running in parallel
  - Six selectable corner frequencies from the mids to the supersonics
  - Clarity upper filters: Silk climbs to 34k, Shimmer climbs to 18k
  - Clarity lower filters: Sheen rises to 8k, Presence rises to 4k
  - Clarity Gain max boost 14-16dB depending on filter
  - Focus filters: Lift (800) and Open (3k), max boost 16dB
  - Three-position multi-function switches with centre bypass for Clarity and Focus
  - Signal path identical to the original Clariphonic rack unit
