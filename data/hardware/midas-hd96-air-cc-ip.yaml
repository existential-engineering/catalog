name: HD96-AIR-CC-IP
manufacturer: midas
primaryCategory: console
url: "https://www.midasconsoles.com/en/products/0603-AEQ"
description: 'Midas HD96-AIR Control Centre (in-package). HD96-AIR takes the
  next leap in digital console evolution, fusing the iconic sound of the H3K and
  engineering precision of the Heritage D Series with breakthrough portability.
  Designed for engineers who demand power without compromise, HD96-AIR features
  a 21" high-brightness multi-touch screen with multi-gesture control in a
  hyper-lightweight form factor. Key features include the Flexi-Aux system
  (aux-to-aux sends for advanced group and stem-style mixing), Tap Off Points
  for routing audio from any stage in the signal chain (with post-insert fader
  tap points and fully customisable, drag-and-drop processing chains), the Shout
  Mixer (16 independent shout inputs and 12 dedicated outputs for talkback
  systems with instant recall), and Variable Channel Phase per channel for
  seamless blending of sound sources. Rear panel I/O: 8 x 3-pin XLR
  analogue/AES3 inputs (switchable), 8 x 3-pin XLR analogue/AES3 outputs
  (switchable), 4 x RJ45 AES50, 2 x BNC word clock (75 ohm), 1 x XLR balanced
  Talk input, 2 x HDMI monitor outputs, External Ethernet connector (RJ45 XLR),
  Snake 1/2 (2 x optical and 2 x copper), 8 x USB 3.0 type A (5 V, 900 mA), 2 x
  micro-USB service ports, 1 x top-panel USB 2.0 type A (5 V, 500 mA), 2 x
  expansion module slots, 2 x 5-pin MIDI DIN sockets, 4-pin lamp connector (12
  VDC / 150 mA max), 2 x IEC mains sockets with power switch, and 1 x 1/4" TRS
  stereo headphone output on the side panel. Audio performance: +24 dBu non-clip
  max input level, analogue stepped gain from -2.5 dB to +45 dB plus -40 dB to
  +20 dB continuous digital trim, +48 V phantom power switchable per input, 10
  kOhm analogue input impedance, 50 Ohm analogue output impedance, +21 dBu
  analogue output max level, 106 dB dynamic range (22 Hz to 22 kHz unweighted),
  and crosstalk of -100 dB at 1 kHz / -90 dB at 10 kHz (physically adjacent
  input channels). Talk mic: 5 kOhm impedance, +15 dB to +60 dB gain, +6 dBu max
  level. Headphones: 10 Ohm output impedance, +21 dBu max output level. Display
  and control surface: 21" LCD high-brightness 1920 x 1080 px capacitive
  touchscreen (up to 10 simultaneous touches), 15 x full colour LCD info
  displays (24 mm x 24 mm, 240 x 240 px), 4 x 20-segment meters (-36 dBu to +21
  dBu), 3 x 100 mm motorized faders, 8 fully assignable rotary controls, 8 fully
  assignable backlit buttons, 24 global assignable shortcut buttons plus 2
  left/right shortcut buttons, and phones controls (min to max, mutable).
  Wireless: dual-band internal and external antennas, IEEE 802.11 a/b/g/n/ac,
  2.4 GHz and 5 GHz operation (region dependent), 18 dBm max output power (5 GHz
  range). Bluetooth: 5.0 Dual Mode at 8 dBm, 30 m typical range, supporting GAP,
  SDN, PAN, SPP, IAP, HFP 1.5, GATT, ATTR, IAP, A2DP, ACRP. Physical: 210.5 x
  464.5 x 805.8 mm (8.3 x 18.3 x 31.7"), 16.74 kg (36.83 lbs) without flight
  case, 29.90 kg (65.78 lbs) with flight case. Operating temperature 5 C to 45
  C, storage temperature -20 C to 60 C.'
details: |-
  The HD96-AIR-CC-IP is the Control Centre (in-package) variant of the Midas HD96-AIR portable digital mixing console. Positioned as the next leap in digital console evolution, HD96-AIR fuses the iconic sound of the Heritage 3000 (H3K) and the engineering precision of the Heritage D Series with breakthrough portability. Marketing copy: 'Finally, a Midas you can take anywhere. Designed for engineers who demand power without compromise, HD96-AIR features a stunning 21" high-brightness touchscreen with multi-gesture control, unlocking an ultra-intuitive workflow in a hyper-lightweight form factor.' Marketing-highlighted feature blocks: 'Tap Off Points' - new tap off points on channels giving freedom to route audio from any stage in the signal chain, perfect for sending raw signals to stage without affecting the main mix; as per the HD96-24, AIR features post-insert fader tap points alongside fully customisable processing chains - drag, drop, and reorder signal flow exactly as desired. 'Flexi-Aux' - the Flexi-Aux system opens up powerful routing possibilities, including aux-to-aux sends for advanced group and stem-style mixing, allowing parallel-compressed drum kits to be fed to an artist's in-ears, etc. 'Shout Mixer' - allows complex communication groups to be effortlessly created and stored, with 16 independent shout inputs and 12 dedicated outputs, building flexible talkback systems that operate entirely outside the main I/O count; instant recall lets the engineer switch between shout configurations in a heartbeat. 'Variable Channel Phase' - intuitive, easy-to-use Variable Phase per channel that allows sound sources to be blended seamlessly with high or low phase changes - from subtle alignment tweaks to bold creative shifts. Lifecycle status on the product page is null (no discontinuation statement found). Manufacturer SKU: 0603-AEQ.
specs: |-
  - Analogue / AES3 in, switchable: 8 x 3-pin XLR
  - Analogue / AES3 out, switchable: 8 x 3-pin XLR
  - AES50: 4 x RJ45
  - Word clock 75R: 2 x BNC
  - Talk: 1 x XLR, balanced
  - HDMI 1 / 2 (monitor output): 2 x HDMI
  - Supported monitor formats: 1920 x 1080 p, 59.94 Hz / 60 Hz 16:9 & 720 x 480 p, 59.94 Hz / 60 Hz
  - External (Ethernet) connector: RJ45 XLR
  - Snake 1 / 2: 2 x optical 2 x copper
  - USB port: 8 x USB 3.0, type A, 5 V = 900 mA power
  - USB port (service): 2 x USB, micro-USB
  - USB (top panel): 1 x USB 2.0, type A, 5 V = 500 mA power
  - Expansion: 2 x expansion module slots
  - MIDI in / out: 2 x 5-pin MIDI DIN sockets
  - Lamp: 4-pin, 12 VDC / 150 mA max
  - IEC mains socket with power switch: 2
  - Headphone output (side panel): 1 x 1/4" TRS, stereo
  - Analogue input impedance: 10 kOhm
  - Non-clip maximum input level: +24 dBu
  - Input gain: Analogue stepped gain -2.5 dB to +45 dB plus -40 dB to +20 dB continuous digital trim
  - Phantom power (switchable per input): +48 V
  - Talk mic impedance: 5 kOhm
  - Talk mic gain: +15 dB to +60 dB
  - Talk mic max level: +6 dBu
  - Analogue output impedance: 50 Ohm
  - Analogue output max level: +21 dBu
  - Dynamic range: 106 dB, 22 Hz to 22 kHz, unweighted
  - Crosstalk @ 1 kHz: -100 dB physically adjacent input channels
  - Crosstalk @ 10 kHz: -90 dB physically adjacent input channels
  - Headphones output impedance: 10 Ohm
  - Headphones maximum output level: +21 dBu
  - Display screen: 21" LCD high brightness 1920 x 1080 px, capacitive touchscreen up to 10 simultaneous touches
  - LCD info displays: 15 x full colour LCD info displays, 24 mm x 24 mm (size), 240 x 240 px
  - Meters: 4 x 20 segment -36 dBu to +21 dBu
  - 100 mm motorized faders: 3
  - Fully assignable rotary controls: 8
  - Fully assignable backlit buttons: 8
  - Phones controls: Min to max, mutable
  - Talk controls: Talk gain min to max
  - Global assignable shortcut buttons: 24
  - Global assignable shortcut buttons (left / right): 2
  - Operating temperature range: 5 C to 45 C (41 F - 113 F)
  - Storage temperature range: -20 C to 60 C (-4 F - 140 F)
  - Dimensions (H x W x D): 210.5 x 464.5 x 805.8 mm (8.3 x 18.3 x 31.7")
  - Weight without flight case: 16.74 kg (36.83 lbs)
  - Weight with flight case: 29.90 kg (65.78 lbs)
  - Wi-Fi antenna: Internal & External dual-band
  - Wi-Fi standard: IEEE 802.11 a/b/g/n/ac (supports a/b/g/n/ac device)
  - Wi-Fi frequency range: 2.4 GHz (2.4 GHz - 2.4835 GHz) and 5 GHz (5.15 GHz - 5.825 GHz), operation dependent on region
  - Wi-Fi max output power: 18 dBm (using 5 GHz range)
  - Bluetooth version: 5.0 Dual Mode
  - Bluetooth power: 8 dBm
  - Bluetooth compatibility: Supports GAP, SDN, PAN, SPP, IAP, HFP 1.5, GATT, ATTR, IAP, A2DP, ACRP
  - Bluetooth maximum communication range: 30 m typical
