description: >-
  The Chamberlin Rhythmate holds the distinction of being the first drum machine ever produced,
  using a magnetic tape loop mechanism to play back 14 separate drum patterns.
details: |-
  Built around 1949 by Harry Chamberlin in his Upland, California garage, the Rhythmate is a landmark instrument in music technology history. Only approximately ten units were ever produced, making it an extraordinarily rare piece that predates all other drum machines by over a decade.

  The Rhythmate's mechanism is elegantly simple. A one-inch magnetic tape loop continuously passes across a tape head that can be physically moved up or down to select from 14 different pre-recorded drum patterns. Tempo control is achieved by adjusting a spindle position, which changes the speed at which the tape moves across the playback head.

  The unit is entirely self-contained with a built-in amplifier and 12-inch speaker, requiring no external equipment to produce sound. This approach to tape-based playback proved to be a foundational concept in music technology.

  In 1951, Chamberlin adapted the same tape playback principle to create the Chamberlin Model 200 keyboard instrument, which evolved through several subsequent models. This concept was later adopted by Mellotronics in the mid-1960s for their Mellotron keyboards, initially without Chamberlin's permission, though he was eventually compensated with a $30,000 settlement.
specs: |-
  - Drum Patterns: 14
  - Playback Medium: 1-inch magnetic tape loop
  - Tempo Control: Adjustable spindle speed
  - Pattern Selection: Movable tape head position
  - Amplification: Built-in amplifier
  - Speaker: 12-inch built-in
  - Units Produced: Approximately 10
