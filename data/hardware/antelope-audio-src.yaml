details: |-
  Introducing the SRC, the ultimate extension for Orion Studio Synergy Core. Designed to accelerate your workflow and replace any need for traditional monitor controllers, the SRC offers unparalleled ease of use and functionality. With just the touch of a button, access and recall any configuration seamlessly, from small adjustments to complex setups. Maximize your studio's efficiency and focus more on what truly matters—perfecting your sound.

  Unlock the power of efficiency with the SRC's intuitive design that places critical controls at your fingertips. This remote streamlines your studio's operations by allowing you to quickly adjust volumes, switch outputs, and recall presets—all within arm's reach. Whether controlling monitoring or switching between setups, the SRC simplifies your workflow, making every adjustment seamless. It's more than a tool—it's your studio's new command center.

  Tailor your sound environment with the SRC's fully customizable presets. Each of the five programmable buttons features dual layers: one for configurable preset files and another for complete snapshots of all interface settings. This dual capability allows you to instantly recall your preferred setups, from signal routing and monitoring to effects processing. This flexibility streamlines your workflow, saving you time and letting you focus on crafting the perfect audio landscape.

  SRC unlocks the processing power of Orion Studio Synergy Core, enabling calibration of a stereo pair of monitors and a subwoofer with dedicated LFE channel. A 16-band parametric EQ with adjustable frequency, gain, and Q, along with a delay offset of up to 100ms, ensures optimal room acoustic tuning. Its advanced bass management mixer features per-channel crossover filters, selectable filter types, and customizable filter order, allowing precise integration of a subwoofer.

  Feel every adjustment with the SRC's tactile feedback. The solid, responsive buttons and a precision rotary encoder provide physical confirmation of every change, ensuring accurate settings adjustments. Coupled with a clear, informative display that shows your output levels, the SRC offers a satisfying and effective interaction. This tactile approach not only enhances your control over the audio but also brings a new level of enjoyment and precision to your studio work.
specs: |-
  - Dedicated remote control and monitor controller for Orion Studio Synergy Core
  - Five programmable preset buttons (A-E) with dual-layer functionality for preset files and full interface snapshots
  - Main rotary encoder for volume control with press-to-mute / unmute
  - Dim button with -20 dB attenuation positioned next to the volume knob
  - Stereo Monitor Out switching
  - Speaker Layout Buttons for individual speaker solo and mute
  - Bass Management On/Off switch mirroring the interface control panel
  - Function Button (FN) with power indicator LED and boot-mode activation
  - Clear, informative display showing output levels
  - Stereo and 2.1 calibration with dedicated LFE channel for subwoofer
  - 16-band parametric EQ with adjustable frequency, gain and Q
  - Delay offset up to 100 ms for room acoustic tuning
  - Advanced bass management mixer with per-channel crossover filters, selectable filter types and customizable filter order
  - Exclusively compatible with Orion Studio Synergy Core
