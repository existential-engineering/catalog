url: https://animalfactoryamps.com/products/baron-samedi-12hp-eurorack-module-preorder
description: A Eurorack chaotic fuzz module capable of CV-controllable
  self-oscillation and extreme sound mangling, with separate dry and wet-only
  outputs.
details: |-
  Open for orders - batch starts shipping April 15, 2026. Not just a simple Eurorack "port" of our beloved Baron Samedi Fuzz Pedal. This will probably the craziest, filthiest, scariest and generally most fun module in your rack. After a lot of research, we gave up trying to figure out what exactly it does. In the process of our investigations, however, we succeeded in making this module even wilder and weirder than it already was. We know that it chirps, shrieks, growls, distorts, defecates, destroys and does other such wonderful things to whatever pristine sounds you sacrifice to it. Absolute chaos under your CV control. For those who are looking to open all the wrong sonic doors on their way to the afterlife, look no further.
specs: |-
  - Perfect for mangling sounds beyond all recognition
  - CV-controllable self-oscillation - can generate sounds from deep basslines to ritualistic shrieks
  - Flexible routing options with separate dry and wet-only outputs
  - What do you mean by "gentle", mortal?
  - Controlled chaos - sounds are highly repeatable, not lost forever at the turn of a knob.
