description: 8-in 8-out MIDI interface with standalone functionality and powered USB hub
details: |-
  The MIDI Eight from Black Lion Audio is an 8-in/8-out MIDI interface with standalone functionality and a powered USB hub. Whether you're in a DAW-centric setup or running a standalone rig, the MIDI Eight's three standalone routing modes (Pass, Thru, and Merge) keep your gear connected without a computer. A panic button mutes stuck notes instantly, and activity LED indicators let you monitor MIDI traffic at a glance.

  Front-panel In/Out connectors make it easy to connect a MIDI keyboard or controller on the fly, while the eight rear-panel DIN inputs and outputs cover every synth, drum machine, and outboard piece in your rack. The integrated 5-port USB hub lets you connect multiple USB devices through a single cable to your computer.

  The MIDI Eight supports class-compliant operation on macOS and Windows with no drivers required, and multiple units can be connected simultaneously via firmware-based serialization. It can be powered by USB bus power or the included DC adapter.
specs: |-
  - 8x 5-pin DIN MIDI Inputs (rear)
  - 8x 5-pin DIN MIDI Outputs (rear)
  - 1x 5-pin DIN MIDI In (front panel)
  - 1x 5-pin DIN MIDI Out (front panel)
  - USB-C connection (class-compliant, no drivers required)
  - Integrated 5-port USB-C hub
  - Three standalone routing modes: Pass, Thru, Merge
  - Panic button for muting stuck notes
  - Activity LED indicators
  - Multi-unit support via firmware serialization
  - Compatible with macOS and Windows
  - Powered by USB bus power or included DC adapter
  - Black aluminum enclosure
