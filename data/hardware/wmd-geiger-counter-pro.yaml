description: A guitar distortion pedal offering complete control over brutal to
  subtle tones with 512 wavetables, wavetable morphing, 12-bit signal path, and
  full MIDI control. It includes 16 switchable presets, dual CV/expression
  inputs, and dry/wet mix.
details: |-
  The quick story of the GCP / a rambling note from William:

  Making the Geiger Counter Pro has been a labor of love, and has had a lot of ups and downs. It took a lot of stopping and starting to get it done and then the pandemic and parts shortage caused lots more trouble. Years were spent agonizing over every detail to make it look and sound great. As of this writing in 2024, it's at revision 2.14 (like 12 of those revisions were prototyped or production). But it's so worth it. This pedal makes me feel like a viceroy, in absolute control of the brutality I can unleash at any moment with my guitar. Benevolence and subtlety may be reigned down as well, enrapturing your subjects. They look amazing and sound totally vulgar, and I'm really happy to share them with the world again. -William

  Check the Manual (link below) for all the feature and control descriptions. I've fixed and changed a few minor things:

  QUICK START GUIDE

  Geiger Counter Pro VST (2021 update, Windows should work, MacOS may not) I'm working on getting these updated.
specs: |-
  - GCP works with Strymon Power now.
  - MIDI is only supported on Channel 1
  - Jacks have moved slightly for ease of assembly
