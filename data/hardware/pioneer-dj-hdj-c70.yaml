description: |-
  The lightweight HDJ-C70s deliver a true sound across the frequencies, while a flexible headband and rotatable housings support every style of monitoring. They feature innovative sound-isolation chambers, inherited from the HDJ-1500s, to eliminate background noise and enable accurate monitoring even at high volumes.

  Built for the rigours of frequent use, the HDJ-C70s come with 2 detachable, anti-tangle cords (one straight and one curled) and a handy carry pouch. Plus the headband, housing, head cushion and insert-style ear pads can be replaced to extend the headphones' lifespan when necessary.
details: |-
  ### Superior sound design

  Fine-tuned for professionals, the HDJ-C70s have 40mm aperture driver units and neodymium magnets to deliver outstanding resolution, deep bass notes and clear low to medium frequencies. Copper-clad aluminium wire voice coils and a 2,000 mW input capacity eliminate distortion.

  ### Excellent soundproofing

  An innovative sound-isolation chamber on the bass reflex port eliminates background noise from inside and outside the booth. Plus the ear pads use soft leather-type materials for a snug fit and to enhance sound insulation.

  ### Durable and flexible

  The HDJ-C70s feature a lightweight, flexible headband and snug-fitting ear pads to ensure comfort even during prolonged use. Both ear cups can be rotated by 90-degrees in either direction and have handy grips around the outside for effortless one-ear monitoring.
