description: The BASSRIG Super Vintage is, quite simply, a complete vintage bass
  amp in a pedal. Based on the iconic Ampeg SVT, it uses all-analogue circuitry
  to recreate a complete valve amp-style signal path, along with an all-analogue
  cabinet simulator, giving you all the warmth, feel and drive of this classic
  bass rig in one small box.
details: |-
  The BASSRIG Super Vintage uses the same ground-breaking circuitry found in Origin Effects' other Analogue Amp Recreation pedals, replicating the entire signal path of the SVT and delivering all the tone shaping, drive and character of this historic amp with stunning realism.

  In addition to all the familiar controls from the world's favourite bass amp, a BLEND knob has been added, which mixes in some of the clean signal in parallel with the pedal's emulated amp circuit. This control can add some subtle, low-end clarity or be used to create massive bi-amp-style overdrive tones.

  The balanced DI output on the BASSRIG Super Vintage is equipped with an all-analogue simulation of Ampeg's famous 8x10 speaker cabinet, essential to the SVT sound. You can select whether the cabinet simulator is always active or only on when the pedal is engaged, meaning you can use the BASSRIG to add cabinet simulation to other pedals or keep an unaffected DI signal when the pedal is in bypass.

  The proprietary Amp Out EQ lets you tailor the BASSRIG's 1/4" Amp Out, so you never have to compromise your amp settings to flatter the pedal or vice versa. With LF and HF trimmers, as well as a HORN CUT switch, this post-drive filter can fatten up small combos, tame boominess in big cabs and prevent harshness with tweeter-equipped rigs. This allows you to match your on-stage sound to your DI signal, balance your clean and overdriven tones or compensate for ever-changing backline amps.

  Housed in a hand polished, brushed stainless steel enclosure and furnished with aluminium controls, Neutrik jack sockets and heavy-duty footswitch, the BASSRIG Super Vintage is equally at home on the road and in the studio.
specs: |-
  - Complete valve amp-style signal path with dedicated class-A preamp and push-pull output stage, based on the Ampeg SVT
  - Balanced DI output with analogue cabinet simulator based on the Ampeg SVT 8x10 cabinet
  - Reactive design simulates interaction between amp and speaker for realistic feel and authentic sound
  - Full range of SVT tones from clean to overdriven
  - Powerful tone-shaping Amp Out EQ
  - Blend control lets you mix your drive sound in parallel with your clean signal
  - Tour-grade, all-metal construction
  - High-impedance, buffered bypass with silent switching
  - Designed and built in England
  - Weight: 846 g (1.86 lb)
  - Dimensions: 146 x 93 x 65 mm (5.74 x 3.6 x 2.5 in.), L x W x H, includes knobs and switches
  - Input Impedance: 1 M ohm
  - Output Impedance: 500 ohm
  - Current Draw: 150 mA
  - Power Supply: 9V DC, 2.1 mm centre-negative barrel connector (mains adaptor only, no battery option)
