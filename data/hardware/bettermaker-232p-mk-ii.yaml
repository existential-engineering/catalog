details: |-
  The Bettermaker 232P MK II is an analog mastering equalizer with digital recall, combining the warmth of analog circuitry with the convenience of modern digital preset management. It features 10 filters in total, five per channel: two Pultec-inspired shelf sections, two parametric bands, and a steep 24dB/octave high-pass filter variable from 18 to 200Hz.

  The unit stores up to 399 presets with full digital recall via USB, allowing integration into DAW workflows with plugin control and automation support. Processing modes include Stereo, Dual Mono, and M/S, with A/B comparison for quick before/after evaluation during mastering sessions.

  The 232P MK II ships with 11 factory presets including four exclusive mastering and bus presets by mastering engineer Luca Pretolesi. A companion plugin (AU, VST, RTAS, AAX; macOS and Windows) enables remote operation and parameter automation directly from the DAW.

  The unit is listed in the Legacy section of the Bettermaker website, indicating it is a discontinued product.
specs: |-
  - 10 filters total, 5 per channel: 2 Pultec shelf sections, 2 parametric filters, 1 high-pass filter
  - Pultec-inspired shelf filters with separate boost and attenuation controls
  - High-pass filter: 24dB/oct, 18-200Hz variable
  - Parametric EQ 1: 45-1000Hz, ±15dB gain, 0.2-3 octave bandwidth
  - Parametric EQ 2: 650-15000Hz, ±15dB gain, 0.2-3 octave bandwidth
  - 399 preset storage cells with full digital recall
  - Processing modes: Stereo, Dual Mono, M/S
  - A/B comparison functionality
  - USB connectivity for DAW plugin operation with automation support
  - Plugin support: AU, VST, RTAS, AAX (32 & 64-bit, Windows/macOS)
  - Frequency response: 5Hz to 100kHz (-0.5dB)
  - Dynamic range: >106dB
  - S/N ratio: >104dB
  - Max input/output level: +24dBu balanced, +18dBu unbalanced
  - Input impedance: 10kΩ unbalanced, 20kΩ balanced
  - Output impedance: 100Ω unbalanced, 200Ω balanced
  - Power supply: 115V AC 50/60Hz or 230V AC 50Hz
  - Power consumption: 15W
  - Weight: 7kg
  - U.S. Patent No. 10,693,428 B2
