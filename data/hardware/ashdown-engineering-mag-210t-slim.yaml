details: |-
  Loaded with custom Ashdown drivers for exceptional attack, clarity and low-end performance, MAG cabinets look as good as they sound with retro vinyl covering, chrome protective corners, cloth grilles and new double-wing badges. Partnered with the MAG 300 EVO III amp head, they create the perfect rig for the hard-working bass player. The MAG 210T Slim is rated at 250W into 8 Ohms, and features 2 x 10 inch Ashdown custom drivers with a HF tweeter for enhanced top end response.
