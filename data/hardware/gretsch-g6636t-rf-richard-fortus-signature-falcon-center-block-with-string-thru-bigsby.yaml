details: |-
  Richard Fortus, a highly respected guitarist with a nearly two-decade tenure with Guns N' Roses, inspired this signature model. The instrument features a resonant 1.75"-deep, 17"-wide double-cutaway maple body with a chambered spruce center block designed to minimize feedback while maintaining performance volume.

  The guitar emphasizes playability through its 25.5" scale length, "U" shaped maple neck and 12"-radius ebony fingerboard with 22 medium jumbo frets. Custom Wound Filter'Tron pickups deliver versatile tones, while a master volume with treble bleed and master tone with no-load pot provide tonal control. The string-thru Bigsby vibrato system paired with a TonePros Tune-o-matic bridge ensures stability and quick string changes.
