details: |-
  The Legend 4 Neck-Thru from Spector takes the classic NS body design to the next level with premium materials and high-end Aguilar electronics. The Legend 4 Neck-Thru is carved from solid maple and features a uniquely figured high-grade maple top. The solid maple construction of the Legend Neck Thru provides the classic, cutting tone you expect from Spector. With a neck-thru body design, of these Legend basses provide an articulate response, even note response, and enhanced sustain. The Legend 4 Neck-Thru models come equipped with a set of Aguilar P/J pickups and an Aguilar OBP-2 circuit. This combination makes for an exciting assortment of tones, from deep, rich lows to bright and sizzling highs. Additional features like a brass nut and professional grade hardware ensure that this instrument will provide years of reliability on the road or in the studio.
specs: |-
  - Powered by an onboard battery for the active electronics, no external power connector
