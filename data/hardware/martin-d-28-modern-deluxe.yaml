description: The D-28 Modern Deluxe elevates Martin's flagship Dreadnought with
  heritage tone and contemporary craftsmanship, combining a VTS spruce top,
  Adirondack X-bracing, and exclusive Liquidmetal bridge pins.
details: |-
  The D-28 Modern Deluxe elevates Martin's flagship Dreadnought with heritage tone and contemporary craftsmanship. A spruce Vintage Tone System (VTS) top and Golden Era–style Adirondack spruce X-bracing recreate the deep, balanced resonance of a nearly century-old Martin.

  Natural protein glue and a lightweight carbon-fiber bridge plate enhance sustain and clarity, while exclusive Liquidmetal bridge pins return energy for added volume. EVO gold frets and a slightly asymmetrical neck provide exceptional comfort.

  European flamed-maple binding, Waverly gold open-gear tuners, and a 1933-style pearl logo offer modern sophistication. The iconic Dreadnought body shape delivers thunderous bass, shimmering highs, and full-spectrum power.

  Classic Martin sound refined for today's player, where craftsmanship, tone, and innovation live in perfect harmony.
specs: |-
  - Body Size: D-14 Fret (Dreadnought)
  - Top: Spruce with VTS (Vintage Tone System)
  - Back/Sides: East Indian Rosewood
  - Scale Length: 25.4"
  - Fingerboard Material: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Neck Shape: Vintage Deluxe with High-Performance Taper
  - Neck Material: Genuine Mahogany
  - Neck Finish: Satin
  - Bracing: Forward-Shifted X-Brace, GE-Scalloped, Adirondack Spruce with VTS
  - Frets: 20 total, joins body at 14th fret
  - Bridge: Ebony, Modern Belly Drop-in Saddle with Liquidmetal pins
  - Tuners: Gold Open Gear Waverly
  - Binding: European Flamed Maple
  - Finish: Gloss (top and back/sides)
  - Electronics: None (optional pickups available)
