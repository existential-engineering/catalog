url: https://www.expert-sleepers.co.uk/fhx8gt.html
description: The FHX-8GT is a 4HP expansion module for the FH-2 'factotum'
  Eurorack module, providing 8 extra clock, gate and trigger outputs at +5V. Up
  to four of them can be attached to one FH-2.
details: |-
  The FHX-8GT is an expansion module for the FH-2 'factotum' Eurorack module, providing 8 extra clock, gate and trigger outputs.

  Up to four FHX-8GTs can be attached to one FH-2. Each FHX-8GT can itself be expanded with the ESX-8GT, for a total of 64 outputs.

  That is in addition to the seven FHX-8CVs that can be added to an FH-2 for extra CV outputs.
specs: |-
  - Panel width: 4HP
  - Module depth: 41mm
  - Current draw: 16mA on the +12V rail, 0mA on the -12V rail
  - Outputs: 8 (+5V)
  - Expansion header for connecting an ESX-8GT expander
