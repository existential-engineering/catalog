description: The ultimate MIDI control interface for all of your Meris pedals
  and more. The Meris MIDI I/O allows control of up to 4 Meris pedals via MIDI,
  from a MIDI controller, wirelessly with a Bluetooth adapter, or from a DAW.
details: |-
  The Meris MIDI I/O allows control of up to 4 Meris pedals via MIDI, from a MIDI controller, wirelessly with a Bluetooth adapter, or from a DAW.

  Compact and pedalboard friendly, the MIDI I/O supports MIDI input and output from all Meris pedals, allows control of all parameters via MIDI, and enables unlimited offline preset saving and loading. MIDI in and out activity status LEDs show its state at a glance, and wireless compatibility is available with a Bluetooth MIDI adapter, sold separately. The unit is also compatible with Empress and Chase Bliss pedals with a special cable.
specs: |-
  - Compact, pedalboard friendly MIDI I/O for up to 4 Meris pedals
  - Allows control of all parameters via MIDI
  - Supports MIDI input and output from all Meris pedals
  - Allows unlimited offline preset saving and loading
  - Wireless compatibility with Bluetooth MIDI adapter (sold separately, Yamaha MD-BT01)
  - MIDI in and out activity status LEDs
  - Also compatible with Empress and Chase Bliss pedals (requires special cable)
  - 9V Power supply not included
  - 9V DC center-negative, 10mA, 2.1mm jack
  - Dimensions 3.7" wide, 2.6" deep, 1.5" tall
  - Weight 6.4 ounces
  - Includes 1 Flat 11" TRS cable
