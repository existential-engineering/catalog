url: https://www.dangerousmusic.com/product/mq
description: The Dangerous MQ combines mastering quality digital and analog
  metering with flexible cue mix monitoring and talkback communication, in one
  simple to use 2 RU package.
details: |-
  Some things will never change. No matter how revolutionary your DAW has proven to be, performers still need to hear themselves, and engineers need to be able to communicate with the artist and instantly assess average and peak levels of a mix.

  The Dangerous MQ combines mastering quality digital and analog metering with flexible cue mix monitoring and talkback communication, in one simple to use 2 RU package. MQ consists of two stereo cue mix inputs, two selectable front-panel headphone outputs, and on-board power amps ready to feed any headphone breakout box, plus two assignable mono inputs for hassle-free headphone mixes straight from a DAW output.

  The MQ also features an integrated talkback system, complete with built-in mic and remote control.
specs: |-
  - Comprehensive Headphone Cue Mixer
  - Talkback System w/ Remote and Built-in Mic
  - True Analog VU Meter
  - 2 Separate Stereo Cues
  - 2 Assignable Mono Inputs
  - 2 Selectable front-panel headphone outputs
  - On-Board Power Amps
  - +4 dBu nominal level, +26 dBu max input level
  - 2 x 20 watt stereo cue power amps
  - Sifam R-22 precision VU movements with adjustable offsets
  - 2 RU
  - Power: 100-240 VAC in, 40 watts max
