details: |-
  A dual-channel system that combines the OM2 handheld transmitter with the ADX10 cardioid lavalier system.

  This is a very efficient and cost-effective solution for combining the hands-free convenience of a lavalier with the flexibility of a handheld mic. The package is ideally suited for presentations, meetings, or events where the lead speaker remains in control while the handheld microphone is passed around either on stage or in the audience.
specs: |-
  - System: R42 dual-channel diversity receiver, both channels usable simultaneously
  - Transmitters: OM2 dynamic handheld and B60 bodypack with ADX10 cardioid condenser lavalier
  - Frequency bands: A (522-554 MHz), B (554-586 MHz)
  - 106 pre-coordinated frequencies
