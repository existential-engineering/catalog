description: >-
  MEGABYTE builds on Caroline Guitar Company's acclaimed KILOBYTE legacy with
  two old school lo-fi digital chips for more delay time, tap tempo, trails or
  true bypass, and a nastier, dirtier runaway Havoc.
details: |-
  The Megabyte is a lo-fi delay computer from Caroline Guitar Company, serving
  as the follow-up to their acclaimed Kilobyte delay pedal. It uses two
  old-school lo-fi digital chips to deliver up to 1200ms of delay time, double
  that of its predecessor.

  Tap tempo is included with three subdivisions, and the pedal offers switchable
  trails or true bypass modes to suit different performance and studio needs.

  The Havoc oscillation feature is paired directly to the tap switch, enabling
  expressive runaway feedback effects on demand.

  A +21dB drive preamp with built-in modulation adds grit and movement to the
  delayed signal, contributing to the pedal's characteristically dirty, lo-fi
  character.

  Internal controls allow for 100% dry-kill (useful for production work) and a
  maximum headroom option on the Havoc/oscillation side.
specs: |-
  - Delay time: up to 1200ms
  - Two lo-fi digital delay chips
  - Tap tempo with three subdivisions
  - Switchable trails or true bypass
  - Havoc oscillation paired to tap switch
  - +21dB drive preamp with modulation
  - Internal dry-kill control (100% dry)
  - Internal maximum headroom option for Havoc/oscillation
  - Available in Standard and Special Modded variants
