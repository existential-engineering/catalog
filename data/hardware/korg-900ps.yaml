description: >-
  The Korg 900PS is a rare analog preset monosynth from 1975 featuring 29 selectable tone
  colors for instant sound selection. It includes a distinctive chromium rod touch bar
  running the length of the 37-key keyboard that controls repeat, forte, pitch, vibrato,
  and portamento parameters in real time.
details: |-
  The 900PS, sometimes referred to as the PS900, is a distinctive monosynth that borrowed design concepts from the ARP Pro-Soloist. It emphasizes preset-based sound selection rather than deep synthesis programming, allowing musicians to instantly access 29 different instrument emulations ranging from orchestral sounds to percussion effects.

  The instrument features a unique chromium rod touch bar running the full length of the keyboard in front of the keys. This innovative control surface manages repeat, forte, pitch, vibrato, and portamento parameters in real time, giving the player expressive control over the preset sounds.

  Sound editing capabilities include adjustable portamento, repeat rate, vibrato speed and depth, attack control, sustain control, harmonics control, a filter cutoff labeled Traveler Control, pitch bend, forte, and volume. The 29 available presets include Timpani, Electric Bass, Synthe Bass, Piano, Harpsichord, Shamisen, Banjo, Mandolin, Xylophone, Tuba, Bassoon, Horn, Cello, Trombone, Saxophone, Voice, Clarinet, Accordion, Trumpet, Funky Trumpet, Synthe Trumpet, Oboe, Violin, Recorder, White Noise, Scale Noise, and three Harmonics variations.
specs: |-
  - Analog monosynth
  - 37-key keyboard
  - 29 preset sounds
  - Chromium rod touch bar controller
  - Filter with Traveler Control
  - VCA with attack and sustain controls
  - Vibrato with adjustable speed and depth
  - Portamento with adjustable rate
  - Repeat function with adjustable rate
  - Pitch bend and forte controls
  - Harmonics control
