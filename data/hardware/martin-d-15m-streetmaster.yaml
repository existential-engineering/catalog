details: |-
  The Martin D-15M StreetMaster is part of Martin's 15 Series, pairing all-solid mahogany construction with a beautifully worn satin finish that gives the guitar a vintage vibe right out of the case. The distressed satin finish in Mahogany Burst suggests years of road-tested character, while the all-mahogany body delivers the bold, focused Dreadnought voice players expect from a 14-fret D-body.

  Tonally, the StreetMaster speaks with warm lows, punchy mids, and a strong, dry voice — a classic mahogany-on-mahogany response that favors fingerpicking, blues, folk, and roots playing as readily as flatpicked rhythm. The non-scalloped spruce X-brace pattern keeps the response taut and articulate without sacrificing volume.

  The neck is shaped to Martin's Modified Low Oval profile with standard taper, joined to the body at the 14th fret over a 25.4-inch scale. An East Indian rosewood fingerboard with diamond-and-square abalone inlays sits above a select hardwood neck, with a 1 11/16-inch nut and 2 1/8-inch spacing at the 12th fret. A bone nut, compensated bone saddle on a 16-inch radius, and Ping aged-nickel tuners round out the appointments.

  The guitar ships in a waterproof softshell case with backpack straps — fitting for a guitar designed to be carried and played, not coddled. Optional onboard electronics are available from the factory (L.R. Baggs Anthem, Fishman Gold+Plus Natural, or Fishman Matrix Infinity), but the standard D-15M StreetMaster is purely acoustic.
specs: |-
  - Body Size: D-14 Fret Dreadnought
  - Top: Solid Mahogany
  - Back & Sides: Solid Mahogany
  - Top Color: Mahogany Burst
  - Finish: Satin (distressed)
  - Bracing Pattern: Non-scalloped Spruce X-brace
  - Scale Length: 25.4"
  - Number of Frets: 20 (14 clear of body)
  - Neck Shape: Modified Low Oval with Standard Taper
  - Neck Material: Select Hardwood
  - Fingerboard Material: East Indian Rosewood
  - Fingerboard Inlays: Diamonds and Squares (abalone)
  - Fingerboard Width at Nut: 1 11/16"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Bridge Material: East Indian Rosewood
  - Bridge Style: Modern Belly with Drop-In Saddle
  - Saddle: Compensated Bone, 16" radius
  - Nut Material: Bone
  - Tuning Machines: Ping Aged Nickel
  - Recommended Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze, Medium
  - Case: Softshell (waterproof, backpack straps)
