description: The Charvel USA Select DK24 HH 2PT CM is an exquisite USA-made
  instrument designed for modern players with discerning tastes, built at the
  Custom Shop in Corona, California and combining vintage Charvel heritage with
  modern performance features.
details: |-
  Built in Charvel's Custom Shop in Corona, California, the USA Select DK24 HH 2PT CM pairs a Dinky-shaped alder body in a gloss finish with a scalloped lower back bout and a shredder's cut heel for upper fretboard access.

  The bolt-on caramelized maple neck features graphite reinforcement, a 4-bolt sculpted heel, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. The caramelized flame maple fingerboard has a 12"-16" compound radius with 24 stainless steel jumbo frets, 4mm pearl dot inlays, and Luminlay side dots for stage visibility. A Graph Tech TUSQ XL nut (1.6875" width) and 25.5" scale length complete the playing platform, with a heel-mount truss rod adjustment wheel for easy setup.

  Electronics center on a custom Seymour Duncan HH set: a Full Shred TB-10 at the bridge for bold, articulate tone and an Alnico II Pro APH-1N at the neck for warm, buttery vintage tone, both direct-mounted in flat black. Controls include a 500K EVH Bourns Low-Friction volume potentiometer and a no-load tone, with a 5-position blade switch plus a 2-way mini toggle for series/parallel switching.

  Hardware includes a Gotoh Custom 510 tremolo bridge with titanium saddles and brass block, a Gotoh tremolo arm, Sperzel die-cast locking tuners, Stratocaster-style skirt control knobs, a beveled output jack, and a Fender Standard string guide, all in chrome. A Charvel hardshell case is included.
