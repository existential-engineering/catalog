url: https://www.engl-amps.com/shop/signature/marty-friedman-inferno-signature-e766/
description: Marty Friedman signature 100 W all-valve guitar amplifier head with
  EL34 output valves, separate three-band EQs and switchable gain boost per
  channel pair, a valve-buffered FX loop and a noise gate.
details: |-
  Once again, collaboration with an extraordinary musician results in a truly exceptional amp. In close cooperation with the six-string virtuoso Marty Friedman, we tailored his amp for him.

  The motto could have been simple and mightily powerful: a whopping 100 watts of tube power can be fired off via two channels. Each channel has its own 3-band EQ and a switchable gain boost.

  The Lead Channel is super hot, with more than enough gain for all situations. And, if you let the Master Volume off its leash, things can get loud, infernally loud.

  The 100 watts come from four ENGL EL34 output valves and four ENGL ECC83 (12AX7) preamp valves, with Bright and Tone voicing options, Master A and Master B volumes, a power valve monitor and a valve-buffered FX loop with its own balance control.

  A noise gate with a rear-panel threshold control keeps high-gain settings quiet, and channels, masters, Tone, FX loop and noise gate can all be switched from an ENGL Z4 or Z9 footswitch over the footswitch jack or the S.A.C. port.
specs: |-
  - 4 channels: Clean, Crunch, Soft Lead, Heavy Lead
  - All-valve head
  - Valve-buffered FX loop with balance control
  - Noise gate with rear-panel threshold control
  - Master A/B
  - Power valve monitor
  - S.A.C.: Serial Amp Control
  - Sound options: Bright, Tone, Gain Boost
  - Controls: Gain (Clean and Lead channels), 2 separate 3-band EQs (Clean and Lead channels), Volume (Clean and Lead channels), Master A, Master B, Noise Gate threshold, FX Loop Balance
  - Poweramp output: 1 x 4 ohm, 1 x 8 ohm, 1 x 16 ohm, 2 x 8 ohm parallel, 2 x 16 ohm parallel
  - Footswitch: Z4 or Z9 (channels, Master A/B, Tone, FX loop, noise gate)
  - Preamp valves: 4 x ENGL ECC83 / 12AX7
  - Output valves: 4 x ENGL EL34
  - Output power: 100 W
  - Dimensions: 71 x 27 x 29 cm
  - Weight: 22.5 kg
