description: DAW-inspired 4-in/2-out USB 2.0 audio interface with dbx 60V mic
  preamps and 24-bit/96kHz converters. Discontinued.
details: |-
  The Lexicon I-O 42 is a DAW-inspired USB 2.0 audio interface designed to work with any digital audio workstation, including Pro Tools 10 through 12. It features newly designed dbx 60V high-voltage, ultra-low noise mic preamps on all four channels and performance-driven A/D and D/A converters supporting 24-bit/96kHz audio.

  The interface offers four combo XLR/TRS mic/line inputs with +48V phantom power, two front-panel 1/4" instrument (Hi-Z) inputs, two 1/4" TRS balanced line outputs, and two independent 1/4" headphone outputs each with its own volume control. Digital connectivity is provided via stereo S/PDIF I/O on RCA, alongside 5-pin DIN MIDI in and out.

  The I-O 42 bundled the Lexicon Pantheon II VST/AU reverb plug-in along with Cubase LE, EzDrummer Lite, and XILS3 SE to offer a complete recording starter package. The product is listed as discontinued on Lexicon's website; the most recent drivers shipped circa 2016-2017 for macOS Sierra and Windows 8/10.
specs: |-
  - 4 dbx 60V high-voltage, ultra-low noise mic preamps
  - 24-bit / 96kHz A/D and D/A converters
  - 4 combo XLR/TRS mic/line inputs with +48V phantom power
  - 2 front-panel 1/4" Hi-Z instrument inputs
  - 2 balanced 1/4" TRS line outputs
  - 2 independent 1/4" headphone outputs with separate volume controls
  - Stereo S/PDIF digital I/O (RCA)
  - MIDI In and Out (5-pin DIN)
  - USB 2.0 connection to host computer
  - Records up to 4 tracks simultaneously
  - Bundled with Pantheon II reverb plug-in, Cubase LE, EzDrummer Lite, and XILS3 SE
