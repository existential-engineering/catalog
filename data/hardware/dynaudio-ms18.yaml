details: |-
  The MS18 is a high-powered subwoofer designed for film and television post production studios. It supports immersive monitoring formats including Dolby Atmos HE 7.1.4, 9.1.4, and full Atmos theatrical multi-channel configurations.

  Housing a single 18-inch driver, the enclosure offers flexible deployment options: it can be configured for ceiling mounting to provide low-frequency support in Atmos arrays, or oriented in a low-profile position to accommodate confined studio spaces.

  The MS18 is a passive subwoofer with a recommended amplifier power of 500–3000 watts; Dynaudio Acoustics suggests pairing it with the DA80 or DCA1400 amplifier. Custom cabinet sizes are available on request, making it adaptable to bespoke post-production rooms.

  Built with a 460mm fibre-loaded cone in a black textured-paint finish, the MS18 delivers a frequency response of 25 Hz to >500 Hz and a maximum SPL of 130 dB at 1 metre — suitable for comprehensive post-production monitoring environments where accurate, high-output bass reproduction is critical.
