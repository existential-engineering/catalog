details: |-
  Soundcraft's flagship dual-purpose MH4 console has become even more flexible thanks to the introduction of updated mono and stereo input modules. The new modules expand the use of the Aux busses by adding true mono/stereo switching to take maximum advantage of the console's 16 busses in Monitor mode, giving configurations of 16 mono, 12 mono/2 stereo or 8 mono/4 stereo mixes. The MH4 has become widely adopted because of its ability to handle the most demanding live sound mixing, and is capable of use on FOH, monitors, or a combination of both. The new mono/stereo Aux switching makes the monitor-mode even more flexible when large numbers of mono mixes are required. For product availability and pricing please contact your local dealer.
