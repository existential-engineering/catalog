description: UK-built, lightweight 800-watt bass head finished in striking Ice
  Blue. Designed to magnify your bass tone with clarity and power, it features
  Ashdown's signature Sub-Harmonic Generator, smooth onboard Compression,
  responsive Overdrive, and versatile FX Loop, Headphone Out, DI, and an
  analogue Ashdown Cab Sim DI. Compact yet commanding, it delivers reliable
  performance and unmistakable Ashdown character on stage, in the studio, or at
  home.
details: |-
  The Ashdown UK-RBM-800 (Rootmaster Bass Magnifier) is the next evolution of the celebrated Rootmaster range, now hand-built in the UK and finished in a distinctive Ice Blue. This 800-watt head delivers the authority, articulation, and tonal richness that working bassists demand without sacrificing portability. The Sub-Harmonic Generator lets you blend in a powerful octave below your fundamental notes, the onboard Compressor smooths out peaks with a natural feel, and the valve-emulated Overdrive circuit ranges from warm harmonic lift to full, textured growl. A built-in FX loop supports external pedals and processors, while a traditional DI output and an analogue Cab Sim DI serve live and recording applications. A dedicated Headphone Out provides an isolated playing experience for practice.
specs: |-
  - Power output: 800 Watts
  - Power requirements: 115-230 Volts
  - Impedance: minimum 4 Ohms
  - Speaker outputs: 2 x Neutrik Speakon/Jack outputs
  - Frequency response: -3dB @ 22Hz and 25kHz
  - Signal to noise: better than 80dB (EQ flat)
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 340Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz shelving
  - Distortion: less than 0.5% THD
  - H x W x D: 89 x 311 x 235 mm
  - Net weight: 2.5 kg
