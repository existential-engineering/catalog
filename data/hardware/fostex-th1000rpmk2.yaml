description: Flagship closed-back planar magnetic headphone in the TH Premium Series. Second-generation Premium RP driver with optimized air-damping control, paired with a hard maple housing hand-dyed in traditional Awa Aizome indigo by Tokushima artisans. Magnesium-alloy mechanical parts reduce weight by roughly 20% versus the previous design, while a new two-layer ear pad using silk-protein-based synthetic leather and natural sheepskin head pads improve long-session comfort. Detachable cable system uses 2-pole 3.5 mm connectors on the cups; ships with a 2 m 7N high-purity OFC unbalanced Y cable terminated in a 6.3 mm gold-plated stereo plug.
details: |-
  Configuration: Closed-back, around-ear, planar magnetic headphones with detachable dual-entry cable

  Features:
  - Second-generation Premium RP planar magnetic driver with optimized air-damping control
  - Hard maple housing hand-dyed with Awa Aizome (Tokushima indigo) by skilled artisans
  - Magnesium-alloy mechanical parts for approximately 20% weight reduction
  - Two-layer ear pad with silk-protein-based synthetic leather outer surface
  - Natural sheepskin head pad and headband
  - Detachable 2-pole 3.5 mm cable system (recable-compatible)
  - Optional balanced 4.4 mm cable available (ET-TH4.4BL2Y)

  Country Of Manufacture: Japan

  Series: TH Premium Series
