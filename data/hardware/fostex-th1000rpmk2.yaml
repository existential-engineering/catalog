name: TH1000RPmk2
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/th1000rpmk2/
description: Flagship closed-back planar magnetic headphone in the TH Premium Series. Second-generation Premium RP driver with optimized air-damping control, paired with a hard maple housing hand-dyed in traditional Awa Aizome indigo by Tokushima artisans. Magnesium-alloy mechanical parts reduce weight by roughly 20% versus the previous design, while a new two-layer ear pad using silk-protein-based synthetic leather and natural sheepskin head pads improve long-session comfort. Detachable cable system uses 2-pole 3.5 mm connectors on the cups; ships with a 2 m 7N high-purity OFC unbalanced Y cable terminated in a 6.3 mm gold-plated stereo plug.
details: |-
  This product is the mk2 version of Fostex's flagship RP headphones, carefully assembled one by one at a factory in Japan using the company's proprietary premium grade RP driver with a fully-driven planar diaphragm, optimized diaphragm movement centered on air damping control inside the driver, and a connector that is easy to re-cable. The indigo color and texture of the wood grain of the housing, hand-dyed by skilled Awa Indigo craftsmen, combine with the resolution of the premium RP drivers.

  The Premium RP Driver, developed using the largest diaphragm ever used in a fully driven planar diaphragm driver based on RP technology refined since 1974, has been further optimized with mk2 technology through air damping control inside the driver, flow adjustment using damping materials and new ear pads. This achieves ideal diaphragm amplitude, particularly in the low-frequency range, with sharp response, high sensitivity, smooth frequency characteristics and excellent transient response.

  The newly adopted mk2 ear pads feature a sloped design on the side that contacts the face. The internal low-density urethane foam is arranged in a two-layer structure, with a soft type on the outer side and a high-elasticity type on the inner side. Silk protein-based synthetic leather offers three times the durability of the previous model.

  The mk2 version uses a 2-pole 3.5 mm connector, improving re-cable compatibility and versatility. The internal wiring and included unbalanced cable use 7N (99.99999%) grade high-purity OFC cable. A separate 4.4 mm balanced cable (ET-TH4.4BL2Y) is available.

  Magnesium alloy is used for mechanical parts such as the housing base plate and hanger, reducing overall weight by 20% compared to aluminum, with rubber packing in the rotation mechanism to limit excess vibration. The head pad and headband are made of natural sheepskin material.
specs: |-
  - Type: Closed dynamic
  - Driver: RP planar magnetic (Premium RP Driver mk2)
  - Impedance: 32 ohm
  - Sensitivity: 100 dB/mW
  - Maximum input: 3,000 mW
  - Frequency response: 10 to 40,000 Hz
  - Weight: Approx. 420 g (excluding cable)
  - Housing: Solid hard maple finished with Awa indigo dye
  - Connectors: 2-pole 3.5 mm on each housing
  - Cable: 3.5 mm (2-pole) x2 to 6.3 mm (gold-plated 3-pole) 2 m, 7N (99.99999%) grade high-purity OFC unbalanced cable x 1
  - Accessories: Synthetic leather pouch, safety precautions
  - Optional balanced cable: 4.4 mm ET-TH4.4BL2Y
  - Magnesium alloy mechanical parts, natural sheepskin head pad and headband
  - Assembled in Japan
  - Passive wired headphones, no power supply required
  - Series: TH Premium Series
