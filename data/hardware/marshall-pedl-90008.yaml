details: |-
  The PEDL-90008 is a 4-way momentary footswitch specifically designed for use on the MG15FX, MG15CFX, MG30FX, MG30CFX, MG50FX, MG50CFX, MG101HFX, MG101HCFX, MG101FX, MG101CFX, MG102FX and MG102CFX.

  This footswitch can be fully programmed by the amp. It includes built-in indicator lights that will show you whether the switch is activated or not.
specs: |-
  - Type: 4-way momentary footswitch
  - Fully programmable by the amp
  - Built-in indicator lights show whether a switch is activated
  - Numeric note and preset display with CLN, OD, REV, FX, EXT FX, DAMP and TAP indicators
  - Compatible with MG15FX, MG15CFX, MG30FX, MG30CFX, MG50FX, MG50CFX, MG101HFX, MG101HCFX, MG101FX, MG101CFX, MG102FX and MG102CFX
  - Cable included
  - No power connector of its own, the footswitch is passive and is powered by the amplifier over its connecting cable
  - Colour: Black
