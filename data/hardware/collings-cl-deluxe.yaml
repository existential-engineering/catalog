description: The City Limits Deluxe is a solid body electric guitar built from
  Honduran mahogany with a premium flamed maple top, joined by an extra-long
  hand-set mortise and tenon neck joint for enhanced sustain and tonal
  complexity. Its sleekly contoured body features a swooping heel, elegant
  cutaway, and back comfort carves, finished in high gloss nitrocellulose
  lacquer. Lollar Standard Wind Imperial Humbuckers drive the electronics, wired
  in vintage 50s style through CTS 500K pots and Jupiter Vintage Yellow caps.
  The Deluxe trim adds grained ivoroid bindings throughout the body,
  fingerboard, and peghead.
details: |-
  The City Limits Deluxe is Collings' premium solid body electric, pairing a Honduran mahogany body with a flamed maple top and a carefully hand-set extra-long mortise and tenon neck joint. The construction is designed to maximize sustain and tonal complexity while keeping the body comfortable with contoured carves and a swooping cutaway heel. The rosewood fingerboard features a 12" radius, medium 18% nickel-silver frets, and mother-of-pearl long dot inlays, with an ebony peghead veneer bearing a mother-of-pearl Collings logo. Electronics are centered on Lollar Standard Wind Imperial Humbuckers wired in 50s style through CTS 500K pots and Jupiter Vintage Yellow capacitors. Hardware is all nickel: a Kluson ABR-1 bridge, Kluson stop tailpiece with steel studs, and Gotoh tuners with the Collings logo. The Deluxe designation adds grained ivoroid bindings on the body, fingerboard, and peghead, along with custom grained ivoroid top hat knobs, pickup rings, and truss rod cover. A deluxe hardshell case is included.
specs: |-
  - Body Material: Honduran mahogany
  - Top: Premium flamed maple
  - Body Width: 13 1/2"
  - Body Length: 17"
  - Body Depth: 1 7/8"
  - Total Length: 38 1/2"
  - Finish: High gloss nitrocellulose lacquer
  - Neck Material: Honduran mahogany
  - Neck Joint: Extra long mortise & tenon
  - Fingerboard: Rosewood
  - Fingerboard Inlays: Mother-of-pearl long dots
  - Fingerboard Radius: 12"
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Frets: Medium 18% nickel-silver
  - Peghead Veneer: Ebony with MOP Collings logo
  - Peghead Profile: Haircut
  - Pickups: Lollar Standard Wind Imperial Humbuckers
  - Pots: CTS 500K
  - Capacitors: Jupiter Vintage Yellow
  - Wiring: 50s style
  - Bridge: Kluson ABR-1 (nickel-plated zinc)
  - Tailpiece: Kluson stop tailpiece (nickel-plated zinc with steel studs)
  - Tuners: Nickel Gotoh with Collings logo
  - Knobs: Custom grained ivoroid top hat
  - Pickup Rings: Custom grained ivoroid
  - Truss Rod Cover: Grained ivoroid
  - Body Binding: Grained ivoroid
  - Fingerboard Binding: Grained ivoroid
  - Peghead Binding: Grained ivoroid
  - Strings: D'Addario NYXL1046 (.010" - .046")
  - Case: Deluxe hardshell case included
