description: >-
  The Quasimidi Technox is a 1U rack-mount rompler built on the Raven engine, purpose-designed for techno and rave music
  with aggressive basses, acid leads, classic drum machine kits, and a built-in 16-track sequencer.
details: |-
  Released in 1995, the Technox was Quasimidi's follow-up to their Quasar rack synthesizer, replacing the earlier MASS engine with the more capable Raven engine. Housed in a distinctive silver 1U rackmount enclosure, it was squarely aimed at electronic dance music producers who needed quick access to genre-appropriate sounds.

  The 64MB ROM sample bank provides the foundation for a sound library explicitly tailored to techno and rave production. The preset collection includes solid basses, rave leads, hoover-style sounds, acid squeals, spacey pads, and notably useful drum kits featuring TR-808, TR-909, and TR-606 sample hits. Sound creation works by selecting preset samples and adjusting their parameters through offset values rather than building tones from scratch.

  With 21-voice polyphony and 16-part multitimbral operation, the Technox can handle complex arrangements. Each performance draws from up to three samples shaped by a low-pass filter, LFO, and ADSR envelope. Two effects units provide delay/reverb on one bus and modulation effects on the other, with 18 effect types available. An arpeggiator adds rhythmic movement to patches.

  The built-in 16-track sequencer and 100 performance slots make the Technox a self-contained production tool. Being a mid-1990s rompler, playing sounds at extreme octave ranges can reveal sample-stretching artifacts, but within its intended musical territory it delivers punchy, immediately usable results.
specs: |-
  - Polyphony: 21 voices
  - Multitimbral: 16 parts
  - ROM sample playback (64MB ROM)
  - 3 samples per performance
  - Low-pass filter per performance
  - LFO
  - ADSR envelope
  - 18 effects across 2 units (FX1: delay/reverb, FX2: modulation)
  - Arpeggiator
  - 16-track sequencer
  - 512 sounds, 100 performances, 14 multitimbral setups
  - MIDI In/Out/Thru
  - Foot switch controller input
  - Stereo outputs
  - 1U rack-mount format
