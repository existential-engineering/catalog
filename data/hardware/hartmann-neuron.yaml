description: >-
  The Hartmann Neuron is a German-made polyphonic synthesizer that uses neural network technology to
  analyze and re-synthesize sounds, offering a unique approach to sound design with 3D joystick
  control and 5.1 surround output.
details: |-
  The Hartmann Neuron, produced from 2002 to 2005, was an ambitious attempt to create an entirely new form of synthesis based on neural network technology. Rather than using traditional oscillators, the Neuron analyzes audio files and creates digital models of sounds that can be re-synthesized and extensively manipulated using joysticks and data wheels. The instrument shipped with 200 modeled sounds, and users could create their own via the proprietary ModelMaker software.

  Instead of oscillators, the Neuron employs two "Resynators," each holding a single sound model. Each resynator features a joystick controlling "Scape" (the excitation source properties) and "Sphere" (the resonating body characteristics). The Blender function mixes the two resynators through morphing, crossfading, or using one to manipulate the other. The Silver section provides a multi-mode filter and dual multi-effects processors, while the Slicer and Mod sections handle modulation duties.

  The Neuron's joystick movements can be recorded and embedded into sound designs, enabling truly animated and evolving textures. Six freely definable audio outputs support true 5.1 surround sound, allowing sounds to swirl through a full surround environment. This made the Neuron appealing to film composers like Hans Zimmer and electronic musicians such as BT.

  The beautifully designed instrument features mushroom-shaped joysticks, pentagonal rotary knobs, and a great 61-note keyboard. However, its steep price of approximately $5,000 and the difficulty of deliberately creating specific sounds due to limited display capabilities meant it did not sell well. Hartmann went out of business in 2005. A software version, the Neuron VS, was released but was also discontinued.
specs: |-
  - Polyphony: 16-48 voices
  - Oscillators: 2 Resynators with 3 parameter layers per Scape/Sphere
  - LFO: 2 (Mod: 12 waveforms; Slicer: multi-dimensional cyclic modulation)
  - Filter: 12dB HP, 24dB LP, Bandpass
  - Effects: Digital multi-effects with MIDI sync (chorus, flange, delay, phaser, distortion, compressor, limiter)
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 256MB RAM, 10GB HD, 200 sound and 200 setup locations
  - Outputs: 6 freely definable (5.1 surround capable)
  - Control: MIDI In/Out/Thru, USB
releaseDate: "2002"
