details: |-
  The Al Joseph, AJ, takes the SCB and redefines it into a progressive-metal-geared guitar.

  Some changes include a bevel delete towards the top of the body and reconfigured controls to better suit Al's playing.

  The model is also available with the Al Joseph Spec Package, an upgraded package specific to Al's tastes.
specs: |-
  - Two spec packages: Standard, and Al's Specs (the Al Joseph Spec Package)
  - Construction: neck-through
  - Scale length: 25.5"
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Fingerboard: roasted maple with a 14" radius, or roasted flamed maple with a 14" radius on Al's Specs
  - Neck: maple with 2-way adjustable truss rod and dual carbon-fiber rods, or 3-piece all maple on Al's Specs
  - Neck finish: tung-oil, or painted to match the body with a clear satin top coat on Al's Specs
  - Neck profile: thinner neck profile
  - Neck width options: 1.69" or 1.90" wide at the nut
  - Body: mahogany, or mahogany with a flamed maple top and baked body binding on Al's Specs
  - Pickups: direct-mount passive Kiesel Lithium humbuckers, with brushed black covers and black pole pieces, or brushed gold covers and gold pole pieces on Al's Specs
  - Electronics: master volume, 3-way pickup selector and mini-toggle coil splitter
  - Output jack placement: a flush mount output jack and a rear access output jack are offered
  - Bridge: Hipshot/Kiesel tremolo system, .4125" spacing
  - Headstock: pointed 3+3 headstock painted to match the body, with the truss rod cover deleted
  - Inlays: black acrylic blocks with standard black-ring Luminlay Super Blue side dots
  - Hardware: black, or gold on Al's Specs
  - Strings: Elixir Nanoweb 1046E
  - Dimensions: 38.75" long, 1.66" body thickness, 12.5" wide body
  - Weight: 7.7 to 7.8 lbs
  - Offered in several string counts, configured to order
  - Built to order with a choice of body, top, fingerboard and finish options
