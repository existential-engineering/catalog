description: >-
  The Korg Trident is a polyphonic programmable analog synthesizer from 1980
  featuring three independent sections for synthesizer, brass, and strings,
  with a built-in flanger effect.
details: |-
  The Trident's defining feature is its three-section architecture. The Synthesizer section provides two VCOs with sawtooth, square, pulse, and PWM waveforms through a self-oscillating 24dB low-pass filter. The Brass section offers a single VCO limited to sawtooth waves, while the Strings section adds another VCO with its own character. All three sections operate independently and can be layered for rich, complex sounds.

  Eight-voice polyphony was generous for 1980, and each section has its own pair of ADSR envelopes or gate-mode options. The synthesizer section's filter includes cutoff, resonance, envelope intensity, and key tracking controls, providing deep sound-shaping capability. Three preset piano and clavi sounds round out the voicing options.

  A global flanger with speed, feedback, intensity, and manual controls adds movement and depth to any section's output. The flanger is capable of self-oscillation, producing distinctive metallic and resonant effects. The Strings section also features a unique bowing effect for more organic string textures.

  The original Mark I version offered 16 user patch memories, while the more common Mark II expanded this to 32. CV inputs for filter cutoff and trigger, plus discrete audio outputs per section, provide connectivity for integration with other analog gear. Notable users include Rick Wakeman, Joe Zawinul, and Phoenix.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: Synth (2 VCOs), Brass (1 VCO), Strings (1 VCO)
  - Waveforms: Sawtooth, square, pulse, PWM (synth section); sawtooth (brass)
  - Filter: 24dB low-pass, self-oscillating, with cutoff, resonance, envelope, key tracking
  - Envelopes: 2 ADSR or gate per section
  - Effects: Global flanger with self-oscillation, string bowing effect
  - Keyboard: 61 keys
  - Memory: 16 patches (mkI), 32 patches (mkII), 3 presets
  - Presets: Piano 1, Piano 2, Clavi
  - Control: CV inputs for filter cutoff and trigger, discrete outputs per section
