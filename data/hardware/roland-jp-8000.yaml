description: >-
  The JP-8000 is Roland's pioneering analog modeling synthesizer, combining the warmth of
  classic analog synthesis with digital flexibility and MIDI capability. Featuring 49
  velocity-sensitive keys and 38 front-panel controls, it enables real-time sound
  manipulation across diverse musical styles. It is widely regarded as a landmark
  instrument in the trance and electronic music scenes of the late 1990s.
details: |-
  The JP-8000 represents Roland's groundbreaking approach to analog modeling synthesis, merging vintage analog synth characteristics with contemporary digital technology. Its innovative Motion Control functionality records and preserves slider and knob movements, preventing the loss of spontaneous performance tweaks during sound design sessions.

  The synthesizer incorporates traditional analog capabilities including oscillator sync, ring modulation, adjustable filtering with -12dB and -24dB options, cross modulation, an assignable ribbon controller, and robust pitch bend and modulation controls. Its signature Super Saw waveform, which layers seven detuned sawtooth oscillators, became iconic in trance and electronic dance music production.

  Prominent users include The Crystal Method, BT, Orbital, Vince Clarke, Goldie, Prodigy, Groove Armada, Pet Shop Boys, Depeche Mode, ATB, Faithless, Gary Numan, Ferry Corsten, William Orbit, Paul Van Dyk, and Garbage.
specs: |-
  - 8-voice polyphony
  - 2 Roland Analog Modeling DSP oscillators
  - Waveforms: Saw, Square (PWM), Triangle (PWM), Super Saw (7 detuned), Triangle Mod, Feedback OSC, Noise
  - Resonant 12/24dB per octave low pass, band pass, and high pass filter
  - Ring modulator
  - Onboard digital delay and chorus effects
  - 128 preset patches, 128 user patches
  - 64 performances, 64 user performances
  - Vintage-style arpeggiator with beat patterns
  - Programmable real-time phrase sequencing (RPS)
  - 49 velocity-sensitive keys
  - MIDI control (2 parts)
  - 38 front-panel knobs and sliders
  - Assignable ribbon controller
