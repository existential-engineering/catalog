name: HD96-24-CC-IP
manufacturer: midas
primaryCategory: console
url: "https://www.midasconsoles.com/en/products/0603-AEE"
description: 'Live Digital Console Control Centre with 144 Input Channels, 123
  Mix Buses, 96 kHz Sample Rate and 21" Touch Screen. Part of the Midas Heritage
  D (HD96-24) platform, building on the legacy of the H3K and PRO Series
  consoles. Features the Graviton Mk 2 Processing Engine with 64-bit summing mix
  engine, Channel AI adaptive presets, Flexi-Aux aux-to-aux routing, Variable
  Channel Phase, tap-off points throughout the signal path, True Preview and
  True Audition. Powered by 18 SHARC DSPs, 14 layer boards, 5 Eighth Generation
  FPGAs, and 2 GPU co-processors. The 21" HD multitouch screen supports up to 10
  simultaneous fader controls. A Shout Mixer provides 16 independent shout
  inputs and 12 dedicated outputs. Up to 96 effects available including TC 6000
  (VSS4), TC 3000 (VSS3), TC Electronic 2290, HD2A, HD670, KT1176, R-Comp, KT
  Bus compressor, Mteq Program EQ-HD, M6 compressor, HD Stressor compressor,
  Ultra-Dualistic Voice Doubler, Rack-Amp, Glow, Rotor Motor, Enlightenment
  Bass, XL4 EQ, M Harmonics, Uncl HD Distortion, Prime Input Expander, and Wave
  Designer.'
details: |-
  The HD96-24-CC-IP is the Control Centre variant of the Midas Heritage D (HD96-24) live digital mixing console platform. The Heritage D reinvents the workflow of the sound engineer with a 21" HD multitouch screen and modern GUI control. Key innovations include Channel AI (which listens to a source and suggests Gain, EQ, Compression, and Gate settings with adaptive presets), True Preview, True Audition, the Flexi-Aux system (aux-to-aux routing for group/stem-style mixing), Variable Channel Phase per channel, and new tap-off points throughout the signal path enabling post-insert fader points and drag-and-drop processing order. The Graviton Mk 2 Processing Engine uses 64-bit summing with delay compensation to avoid comb filtering. The platform is described as designed for the future with ongoing feature development. The Shout Mixer enables complex talkback/communication groups with 16 shout inputs and 12 dedicated outputs, independent of input/output channel counts, with instant recall between soundcheck and show settings. Heritage History: The Heritage 3000 (H3K) was introduced in 1999 and became a worldwide industry standard for live sound. The Heritage D builds on the legacy of the H3K and PRO Series consoles.
specs: |-
  - Input Channels: 144
  - Mix Buses: 123
  - Sample Rate: 96 kHz
  - Display: 21" HD multitouch screen
  - Simultaneous Touch Faders: Up to 10
  - Processing: 18 SHARC DSPs, 14 layer boards, 5 Eighth Generation FPGAs, 2 GPU co-processors
  - Mix Engine: Graviton Mk 2, 64-bit summing
  - Effects: Up to 96 simultaneous effects
  - Shout Inputs: 16 independent
  - Shout Outputs: 12 dedicated
