description: The LTD TH-400 takes a contemporary approach to a traditional guitar shape, offering professional components and build quality at an affordable price point. Features bolt-on construction with a 25.5" scale, mahogany body, three-piece roasted maple neck, rosewood fingerboard with 24 extra-jumbo frets, EMG 81/85 active pickups, LTD locking tuners, and an LTD fixed bridge with string-thru-body. Finished in Scarlet Metallic with a matching-finish headstock and black hardware.
details: |-
  The LTD TH-400 offers a contemporary new approach to a traditional guitar shape, with professional components and build quality at a price that musicians can afford. Built with bolt-on construction at 25.5” scale, the TH-400 features a mahogany body and a smooth three-piece roasted maple neck with rosewood fingerboard, offset dot inlays, 24 extra-jumbo frets, a matching-finish headstock, and black single-ply binding. Components on this excellent guitar include black hardware, an LTD fixed hardtail bridge with string-thru-body, LTD locking tuners, and a set of aggressive EMG 81 (bridge) and EMG 85 (neck) active pickups.
