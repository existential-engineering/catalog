description: The LTD TH-400 takes a contemporary approach to a traditional
  guitar shape, offering professional components and build quality at an
  affordable price point. Features bolt-on construction with a 25.5" scale,
  mahogany body, three-piece roasted maple neck, rosewood fingerboard with 24
  extra-jumbo frets, EMG 81/85 active pickups, LTD locking tuners, and an LTD
  fixed bridge with string-thru-body. Finished in Scarlet Metallic with a
  matching-finish headstock and black hardware.
