  - Element: Condenser (back-electret)
  - Polar pattern: Cardioid
  - Frequency response (-3 dB): 40 Hz - 20,000 Hz
  - Maximum SPL (1% THD): 135 dB
  - Impedance (low-Z balanced): 250 ohms
  - Open circuit voltage: 5.6 V
  - Power requirement: 24 - 52 V phantom
  - Current consumption: 6 mA
  - Connector: 3-pin XLR
  - High-pass filter: 12 dB/octave, switchable
  - Output stage: Transformerless differential (for long cable runs)
  - Wired/wireless: Wired
  - Height: 10.5 in
  - Maximum diameter: 32 mm
  - Net weight: 0.240 lb
  - Case material: Metal
  - Finish: Non-reflective black (RE92H) or white (RE92HW)
  - Family: RE Series Installation
