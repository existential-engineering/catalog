description: Hanging-style cardioid condenser microphone with switchable 12
  dB/octave high-pass filter and transformerless differential output, designed
  for suspended install applications such as theater and houses of worship.
details: >-
  The Electro-Voice RE92H is a hanging-style cardioid condenser microphone
  designed for permanent suspended installations where discreet, unobtrusive
  placement is critical — most commonly above stages in theaters and houses of
  worship. A wide, smooth frequency response of 40 Hz to 20,000 Hz (-3 dB) gives
  the RE92H broader bandwidth than the install-focused RE90H, suiting it to
  programs that include both vocal and full-range musical content.


  The capsule uses a back-electret condenser element with a cardioid polar
  pattern, providing directional pickup that helps reject ambient noise and
  reduce feedback in live-sound environments. Maximum SPL is rated at 135 dB (1%
  THD), giving the microphone ample headroom for percussive and high-level
  sources. The case is metal with a non-reflective black finish; a white-finish
  variant is available as the RE92HW for installations with light-colored
  ceilings or backdrops.


  Electro-Voice includes an in-line electronics module on the cable assembly
  that houses a switchable 12 dB/octave high-pass filter for tailoring the
  low-frequency response, and a transformerless differential output stage
  designed to drive long cable runs cleanly between a suspended position and a
  remote stage box, wall plate, or rack. Output is balanced low-impedance at 250
  ohms on a 3-pin XLR connector, with an open-circuit voltage of 5.6 V and
  current consumption of 6 mA from a standard 24–52 V phantom supply.


  Physical dimensions are 10.5 inches in height with a maximum diameter of 32
  mm, and the net weight of 0.240 lb keeps the suspended mass modest for
  inconspicuous overhead installations.
specs: |-
