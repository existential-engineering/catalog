url: https://mackie.com/en/products/audio-tools/mtest-1-cable-tester/MTEST_1.html
description: Whether you have a few or a mountain of cables, it pays to know
  which ones are good and which ones need to be tossed into the not so good
  pile. The MTEST-1 is an incredibly handy tool that can weed out the cables
  that may have seen too much action.
details: |-
  Never play the guessing game with cables again. Featuring a simple switch to test every pin, even with mismatched connectors, the battery-powered MTEST-1 is an essential tool to have in your bag for every gig.

  You can even manually test continuity between any two points with the included probes. It is equipped with the most commonly used connector types including TRS, TS, XLR, RCA, Speakon, 3.5mm TRS, MIDI, and Banana jacks.

  The 6-way knob is rotated to check the cable status of pin inputs 1 to 5, as well as the ground connection at the far left and battery strength at the far right.

  Pin indicator LEDs illuminate as the knob is rotated to show which input pins are connected to which output pins. The top row is yellow and reflects the connector on the right side of the unit, the row below it green for the connector on the left side.
specs: |-
  - Test the most commonly used connector types in live sound and studio applications
  - 1/4" TRS and TS
  - 1/8" (3.5 mm) TRS and TS
  - XLR (male and female)
  - RCA / Phono
  - Speakon
  - MIDI
  - Banana
  - Quickly verify each pin via the 6-way switch
  - Manually check continuity with the supplied probes
  - Ground and battery-check positions on the same knob
  - Powered by a single 9V battery
  - Built-Like-A-Tank construction
  - Dimensions 2.7 x 6.5 x 4.8 in / 69 x 165 x 122 mm
  - Weight 1.4 lb / 0.6 kg
