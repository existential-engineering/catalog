url: https://mackie.com/en/products/audio-tools/mtest-1-cable-tester/MTEST_1.html
description: The MTEST-1 is a handy cable tester that verifies continuity on
  common audio cable connectors so you can quickly weed out cables that have
  seen too much action.
details: |-
  Whether you have a few or a mountain of cables, it pays to know which ones are good and which ones need to be tossed into the not so good pile. The MTEST-1 is an incredibly handy tool that can weed out the cables that may have seen too much action.
specs: |-
  - Tests 1/4" TRS/TS, 1/8" TRS/TS, XLR, RCA/Phono, Speakon, MIDI, and Banana connectors
  - 6-way switch for pin verification
  - Continuity testing with supplied probes
  - Powered by a single 9V battery
  - Built-Like-A-Tank construction
