description: The 4115 is a noise-cancelling ribbon microphone engineered for
  close indoor talking situations where good quality broadcasting and public
  address speech is required in conditions with high background noise present.
  It features a corrugated aluminium ribbon with acoustic damping, providing
  freedom from resonance and immunity to handling noises.
details: |-
  The Coles 4115 Broadcaster's Microphone is a purpose-built noise-cancelling ribbon
  microphone designed specifically for demanding broadcast and public address environments
  where high background noise is a challenge. Its engineering focuses on delivering clean,
  intelligible speech even in acoustically hostile conditions.

  The microphone uses a corrugated aluminium ribbon element with acoustic damping, a design
  that provides excellent immunity to mechanical shock and handling noises. This construction
  makes it well-suited for installation in environments where physical vibration or incidental
  contact might otherwise cause interference.

  The 4115 has been deployed globally by broadcasters and is a proven tool for speech
  transmission in extreme noise environments including aircraft cabins, sawmills, shunting
  yards, and power stations. Special versions compatible with civil aviation regulations
  have also been developed and approved by the Civil Aviation Authority.

  As a ribbon microphone, the 4115 benefits from the natural warmth and smooth
  high-frequency roll-off characteristic of the ribbon transducer type, while the
  noise-cancelling design rejects ambient noise from non-close sources.
specs: |-
  - Noise-cancelling ribbon microphone design
  - Corrugated aluminium ribbon transducer
  - Acoustic damping for freedom from resonance
  - Immunity to handling noises and mechanical shock
  - Designed for high background noise environments (aircraft, sawmills, shunting yards,
    power stations)
  - Special Civil Aviation Authority approved aircraft-compatible versions available
  - Intended for close indoor talking and broadcast/PA speech applications
