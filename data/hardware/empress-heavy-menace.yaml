description: "The most versatile distortion pedal Empress Effects has made: an
  evolution of the original Heavy with new features and a compact enclosure.
  Three modes cover any high-gain sound from classic hard rock to searing modern
  metal, backed by an enhanced 3-band EQ and a footswitchable adaptive noise
  gate."
details: |-
  Alongside the original Heavy and Heavier modes, the Heavy Menace adds a new Lite(ish) mode, covering the full high-gain range. Its 3-band EQ borrows from Empress's ParaEq pedals: a Weight control adjusts a high-pass filter in the distortion circuit to shape the low end (thick and full turned up, tight and palm-mute-friendly turned down), and the midrange is sweepable from 200Hz to 2.5kHz to scoop for aggression or push for definition and cut.

  The adaptive gate uses envelope followers that respond to your playing, letting sustained notes decay naturally while clamping down quickly on fast stops. It is now footswitchable with two modes: normal bypass, where the gate is inactive when distortion is off, and independent bypass, which behaves like separate distortion and gate pedals. A gate key input lets you trigger the gate from an external signal, useful when stacking low-gain pedals ahead of it.

  The Heavy Menace offers both true bypass for maximum transparency and buffered bypass to protect against signal loss over long cable runs.
specs: |-
  - Controls: three distortion modes (Lite(ish) / Heavy / Heavier), 3-band EQ, sweepable mid frequency (200Hz - 2.5kHz), Weight (low-end high-pass), footswitchable noise gate with two modes
  - Gate key input for external triggering (1/8" TS or TRS)
  - True bypass or buffered bypass
  - All-analog signal path
  - Power: 9V DC centre-negative, 2.1mm barrel connector
  - Power consumption: 250mA
  - Dimensions: 4.8" L x 2.6" W x 2.5" H (including controls)
  - Weight: 1 lb
