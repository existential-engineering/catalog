name: BloodMoon Blood & Chrome
manufacturer: mr-black
primaryCategory: pedal
categories:
  - reverb
url: https://www.mrblackpedals.com/products/bloodmoon-blood-chrome
description: A dual-reverb pedal combining Mr. Black's BloodMoon and SuperMoon
  Chrome into one box, with preset save/recall and optional expression control.
  Two modes selected by Red or Green.
details: |-
  The BloodMoon Blood & Chrome brings together Mr. Black's two most coveted
  reverbs, the BloodMoon and the SuperMoon Chrome, in a single pedal. The BloodMoon
  is dark, eerie and moody, while the SuperMoon Chrome is known for its brighter
  voice, multiple early reflections and enhanced Sway modulation. A Red mode runs
  the BloodMoon and a Green mode runs the SuperMoon Chrome.

  Each mode goes from a touch of space and breath to full ambient washes. With an
  expression pedal assigned to Mix, you can seamlessly transition from full-wet
  ambience back to your dry signal while the reverb trails continue, with up to 40
  seconds available in the SuperMoon Chrome mode.

  Assigning an expression pedal is simple: connect any standard expression pedal to
  the EXP jack and turn the desired control to the EXP marker. Assignments can be
  changed on the fly in real time. A favorite setting is stored by pressing Save
  and instantly recalled with the Preset footswitch, then deactivated by pressing
  the Preset footswitch again.

  Both modes are 100 percent wet capable with trails on bypass. The pedal has a
  compact 3.7-inch by 4.7-inch enclosure and takes industry-standard 2.1mm
  negative-center-pin 9VDC power, drawing under 70mA (a 100mA supply is
  recommended). Power supply not included.
specs: |-
  - Two modes: BloodMoon (Red) and SuperMoon Chrome (Green)
  - 100% wet capable in each mode
  - Trails on bypass
  - Preset save/recall
  - Optional expression control assignable to any control on the fly (expression pedal not included)
  - Up to 40 seconds of trails in SuperMoon Chrome mode
  - Compact design (3.7" x 4.7")
  - 9VDC 2.1mm negative center-pin power (100mA supply recommended)
  - <70mA maximum current draw
  - Power supply not included
