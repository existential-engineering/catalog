description: The Studio Vintage 1x12 Cabinet (SV112) is a compact passive 1x12"
  guitar speaker cabinet designed as the matching extension cab for the Studio
  Vintage range. Loaded with a single 16Ω Celestion V-Type speaker and rated at
  70W, it captures the sound of the screaming '60s in a small, studio- and
  home-friendly footprint that pairs naturally with the SV20H Plexi-voiced head
  or extends the SV20C combo.
details: |-
  Suitable for capturing the world-renowned classic rock sound of the 60s, the SV112 brings the Studio Vintage head to life or can be used as an extension cab for the combo.

  Handcrafted in Britain with one Celestion V-Type speaker, this cab accurately recreates the definitive sound of rock 'n' roll in a lightweight, compact format.

  One 12-inch Celestion V-Type speaker handles 70W at a 16 ohm unit impedance, through a single input.

  Inspired by the 1959, the cabinet is compact and portable. Designed and engineered in UK. Made in UK.
