details: |-
  The G&L ASAT Classic Bluesboy 90 is a fresh take on the Bluesboy vibe, swapping the neck humbucker for a G&L P-90 made in Fullerton. As with the original Bluesboy, the single-coil Magnetic Field Design bridge pickup created by Leo Fender delivers crisp attack with complex harmonics while individual brass saddles offer modern levels of intonation refinement. Flipping to the neck P-90 brings a whole lot of bluesy tone but with more harmonics than a humbucker gives. For a player who has dreamed of an ASAT that delivers stellar "woman tone", this is the guitar. The ASAT Classic Bluesboy 90's hard-rock maple neck features an easy-playing satin finish, comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets for silky playability.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: G&L P-90 in neck position; G&L MFD single coil in bridge position
  - Body wood: Swamp Ash on Premier Finishes, Alder on Standard Finishes
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 3-position pickup selector, volume, tone
  - Includes: G&L Deluxe Gig Bag
