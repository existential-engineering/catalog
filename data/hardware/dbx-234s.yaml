id: 7Q2g9En89j-5FLbJPuPJq
name: dbx 234s
manufacturer: dbx
primaryCategory: filter
url: https://dbxpro.com/en/products/234s
description: Stereo 2/3-Way, Mono 4-Way Crossover with Linkwitz-Riley
  24dB/octave filters and TRS balanced connectors.
details: |-
  The dbx 234s employs precision filters to separate audio signals, directing specific frequency bands to individual speaker drivers. This approach frees amplifiers to use their full power on usable signals, thereby eliminating distortion and enhancing overall PA system clarity and sound quality.

  Equipped with professional-grade components, the unit features Linkwitz-Riley 24dB per octave filters alongside independent output gain controls for level matching. Additional capabilities include output phase inversion, a 40 Hz low cut filter, and optional mono summing of low frequency subwoofer outputs.

  The 234s operates in either stereo 2-way/3-way or mono 4-way configurations, making it adaptable to various speaker setups. CSA NRTL/C approved and CE compliant, backed by a 2-year parts and labor warranty.
specs: |-
  - Input Connectors: 1/4" TRS
  - Input Impedance (Balanced): >50k ohm
  - Input Impedance (Unbalanced): >25k ohm
  - Max Input Level: >+22 dBu
  - CMRR: >40 dB, typically >55 dB at 1 kHz
  - Output Connectors: 1/4" TRS
  - Output Impedance (Balanced): 200 ohm
  - Output Impedance (Unbalanced): 100 ohm
  - Max Output Level: >+21 dBu into 2k ohm or greater
  - Bandwidth: 20 Hz to 20 kHz, ±0.5 dB
  - Frequency Response: <3 Hz to >90 kHz, +0/−3 dB
  - Dynamic Range: >106 dB unweighted
  - THD+Noise: <0.004% at +4 dBu, 1 kHz
  - Interchannel Crosstalk: <−80 dB, 20 Hz–20 kHz
  - Filter Type: Linkwitz-Riley, 24 dB/octave, state-variable
  - Crossover Frequency Range (Stereo): 45–960 Hz or 450 Hz–9.6 kHz (×10)
  - Low Cut Filter: 40 Hz Butterworth, 12 dB/octave high-pass
  - Operating Voltage: 100–120/230 VAC, 50/60 Hz
  - Power Consumption: 15 W
  - Dimensions: 1.75" H × 19" W × 6.9" D
  - Weight: 4.0 lbs (1.8 kg)
