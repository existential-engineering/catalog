description: An end-address large-diaphragm condenser with a flexible pivoting
  body. Inbuilt pop filtering and exceptional feedback rejection make this an
  ideal close vocal mic for loud bands and noisy venues.
details: |-
  Chantelle is an end-address large-diaphragm condenser with a flexible pivoting body. It is very feedback resistant and is aimed at live vocals and acoustic instruments.

  Chantelle was designed as a live vocal mic, bringing the clarity, warmth and character of a large diaphragm capsule to a low-profile body suited to close-micing. It has a smooth high end with no harshness and a very gentle upper-midrange emphasis, and it incorporates a full foam pop filter for plosive protection. With its feedback rejection it can be used on even the loudest of stages.

  Its warm, present tone also works well on acoustic instruments. For close-micing a variety of instruments and vocals, Ear Trumpet Labs also points to Edwina, optionally with a pop filter. Suggested applications are close-micing vocals and acoustic instruments in demanding live settings, and in the studio.
specs: |-
  - Hand-made microphone with unique appearance
  - Side or end address, using pivoting bracket
  - Capsule and electronics tuned for close vocal use on the loudest of stages with excellent feedback rejection
  - Internal shock dampers for minimal handling noise
  - Integral silk and mesh pop filter, for effective control of plosives without loss of clarity
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000 Hz, 94 dB): -54 dB (2 mV/Pa)
  - Power requirement: +24V to +48V phantom power
