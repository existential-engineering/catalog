id: OP8t7pNZqIhONhzQiGONf
name: EKX-15
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/ekx-15/
description: 15-inch two-way passive loudspeaker designed for mid-size live
  applications. Pairs a high-sensitivity EVS-15M woofer with a DH-1M 1-inch
  titanium compression driver behind EV's patented Signal Synchronized
  Transducers (SST) waveguide, delivering 132 dB peak SPL from a lightweight
  plywood enclosure with EVCoat finish.
details: >-
  Part of EV's EKX portable loudspeaker family, the EKX-15 is the larger passive
  full-range model in the lineup, sized for medium-format live music and DJ use
  where a powered cabinet's amplifier and processing aren't required.


  The Signal Synchronized Transducers (SST) waveguide aligns the LF and HF
  outputs across the crossover region for a smooth 90 degree by 60 degree
  coverage pattern, while internal bracing and a 15 mm plywood cabinet keep
  weight at 23.2 kg / 51.2 lb without sacrificing rigidity.


  Versatile deployment options include an aluminum pole-mount cup, a 40 degree
  monitor tilt with rubber feet, all-metal handles, and eight M10 fly points for
  permanent or rigged installations.
specs: |-
  - Configuration: 2-way passive full-range
  - LF transducer: EVS-15M 15 in (381 mm) woofer
  - HF transducer: DH-1M 1 in titanium compression driver on SST waveguide
  - Power handling (continuous / peak): 400 W / 1600 W
  - Frequency response (-3 dB): 75 Hz - 18 kHz
  - Maximum SPL (peak): 132 dB
  - Axial sensitivity (1 W @ 1 m): 96 dB SPL
  - Nominal impedance: 8 ohms
  - Minimum impedance: 7.2 ohms
  - Crossover frequency: 1.6 kHz
  - Coverage pattern (nominal, -6 dB): 90 degrees (H) x 60 degrees (V)
  - Recommended high-pass filter: 50 Hz
  - Input connectors: 2 x NL4 Speakon (parallel in/through)
  - Cabinet material: 15 mm plywood with EVCoat finish
  - Grille: 18 AWG steel with powdercoat
  - Suspension: 8 x M10 threaded fly points
  - Pole mount: aluminum 35 mm socket
  - Monitor angle: 40 degrees with rubber feet
  - Dimensions (H x W x D): 685 x 432 x 429 mm (27.0 x 17.0 x 16.9 in)
  - Net weight: 23.2 kg (51.2 lb)
