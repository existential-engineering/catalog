details: |-
  The original TAT II model was among the first ground-breaking designs that established the core vision behind the foundation of Caparison guitars. This classic model has now been reintroduced as a 2025 version, featuring the original neck-through design with a 648mm scale length, 24 frets, and 2 humbucker pickup configuration. Crafted from Alder, the body mirrors the inaugural TAT, delivering a versatile and expansive tonal range. The distinctive curved top enhances playability while maintaining the exceptional sound quality. For the 2025 edition, the neck features a robust 5-piece blend of maple and walnut, complemented by an Ebony fingerboard and stainless-steel jumbo frets. The high-output "PH-R" bridge pickup is direct mounted for optimal clarity and responsiveness, complimented with a Caparison "PH-F" in the neck position, with a push/pull CTS tone pot that coil splits both pickups simultaneously for a wider tonal pallet. The Caparison TAT II is available in 4 finishes: "Interstellar Black", "Frozen White", "Light Blue Pearl" and a late addition, "Crimson Purple". All feature a vibrant metallic finish with unmistakable 80s character, combining vintage appeal with a bold, modern edge.
