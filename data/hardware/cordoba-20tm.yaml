details: |-
  The 20 series ukuleles feature a solid Mahogany top and Mahogany back and sides. The natural dual-herringbone wood pattern rosette and satin finish make this a truly beautiful instrument for both beginners and ukulele enthusiasts alike. Available in soprano (20SM), concert (20CM) tenor (20TM) and baritone (20BM) sizes.
specs: |-
  - Construction: Solid Top
  - Size: Tenor
  - Bridge Material: Pau Ferro
  - Fingerboard Material: Pau Ferro
  - Neck Material: Mahogany
  - Nut Material: Composite
  - Saddle Material: Composite
  - Back and Sides Wood: Mahogany
  - Color: Natural (NAT)
  - Finish: Satin Polyurethane
  - Frets to Body: 14
  - Neck Joint: Dowel Joint
  - Neck Shape: C Shape
  - Top Bracing Pattern: Fan
  - Fingerboard Inlays: 4mm Dots - Pearloid
  - Frets Total: 18
  - Headplate: Mahogany
  - Nut String Spacing: 28mm
  - Tuning Machines: Córdoba Nickel with Pearl Buttons
  - Nut Width: 35mm (1 3/8")
  - Number of Strings: 4
  - Rosette: Maple and Ebony Herringbone Pattern
  - Scale Length: 432mm (17")
  - Strings: Aquila New Nylgut Tenor 10U
  - Tuning: G-C-E-A
  - Country of Origin: China
