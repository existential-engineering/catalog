description: With its tweeter and its 16.5 cm woofer with Slatefiber membrane, Alpha 65 Evo is a monitoring enclosure with dynamics, neutrality of tonal balance and excellent sound consistency, whatever the listening place. Its compactness and great versatility make it discreet and efficient equipment for all professionals.
details: |-
  With its tweeter and its 16.5 cm woofer with Slatefiber membrane, two speakers signed Focal, Alpha 65 Evo is a monitoring enclosure with dynamics, the neutrality of tonal balance and excellent sound consistency, whatever the listening place. Its compactness and great versatility make it discreet and efficient equipment for all professionals.

  Polyvalence: like the Alpha 50 and Alpha 80, the Alpha 65 Evo offers a host of features: TRS, XLR and RCA inputs, disengageable automatic standby mode, wall and ceiling-mounting inserts, for all types of studio work.

  Performance: its exclusive Focal technologies are the source of excellent dynamics, great dispersion, with identical sound maintained throughout the room, and great precision. Its dual amplification delivers high current capacity, for total control of signal dynamics.

  Perfect integration: its bass-reflex design with a large-section laminar vent, rounded contours and robust side panels make the Alpha 65 Evo a modern piece of equipment that is easy to integrate into any room.

  Manufactured by Focal, the inverted dome tweeter has been a signature since 1981. Aluminium increases the rigidity of the dome and reduces distortion, and a waveguide perfects the spatialization of the sound. Exclusive to Focal and made in France, the Slatefiber cone is made of recycled carbon fibers and thermoplastic polymer.
specs: |-
  - Product type: 2-way monitor
  - Woofer: 6.5" Slatefiber membrane
  - Tweeter: 1" aluminium inverted dome
  - Frequency response (+/- 3dB): 40 Hz - 22 kHz
  - Maximum SPL (peak @ 1m): 104 dB
  - High frequency amplifier: 30 W, class D
  - Mid-range and low frequency amplifier: 55 W, class D
  - Inputs: TRS symmetrical 10 kOhms, XLR symmetrical 10 kOhms, RCA asymmetrical 10 kOhms with compensated sensitivity
  - Bass level (>250Hz): adjustable +/-6dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: sensitivity, auto standby, LF Shelv, HF Shelv
  - Power On LED
  - Local supply: 100 - 240V (T2AL fuse/250V)
  - On/Off switch on the rear panel
  - Height: 33.9 cm / 13.35 in
  - Width: 26.1 cm / 10.28 in
  - Depth: 28.9 cm / 11.38 in
  - Weight: 7.6 kg / 16.8 lb
