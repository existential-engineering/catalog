description: "Alpha 65 Evo, Active 2-way studio monitor: Our professional
  monitors are designed from the first stage to reproduce the sound signal
  without alteration. These monitors will meet the needs of both large studios
  and small listening rooms."
specs: |-
  - 2-way active studio monitor
  - Woofer: 6.5" Slatefiber
  - Tweeter: 1" aluminum inverted dome
  - Frequency response (±3 dB): 40 Hz – 22 kHz
  - Maximum SPL (peak @ 1 m): 104 dB
  - Bass amplifier: 55 W class D
  - Treble amplifier: 30 W class D
  - Inputs: TRS, XLR, RCA
  - Dimensions (H × W × D): 33.9 × 26.1 × 28.9 cm
  - Weight: 7.6 kg (16.8 lb)
