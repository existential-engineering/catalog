details: |-
  The X-Station combines a virtual analog synth, a MIDI controller, a 2-in/2-out audio interface, and an effect processor into one package. Available in 25, 49, and 61 semi-weighted key versions, it provides a comprehensive music production tool.

  The oscillator section features 3 oscillators with 17 waves each and an independent noise source, a ring modulator, oscillator 1-2 sync, and 2-operator FM synthesis. Standard analog waves include sine, square/pulse, saw, and triangle, plus noise sources and digital waves that function like wavetables or preset sounds.

  A 12 dB or 24 dB multimode filter includes low-pass, band-pass, and high-pass filtering with a drive circuit. Two LFOs with 32 waves each, two ADSR envelopes, and an AD envelope for FM synthesis with velocity provide extensive modulation options. Additional features include portamento, unison, a versatile arpeggiator, and an X/Y pad that by default controls the filter.

  The effect processor, LFOs, arpeggiator, and effects can sync to external MIDI clock. Build quality has been noted as somewhat flimsy on the knobs, combo jacks, headphone amplifier, and outer casing.
specs: |-
  - Polyphony: 8 voices (Mono, Mono AG, Poly 1, Poly 2 modes)
  - Multitimbral: Monotimbral
  - Oscillators: 3 oscillators, Noise, Ring modulator, 2-operator FM synthesis
  - Waveforms: Sine, Saw, Square/Pulse with PWM, Triangle, Noise, Digital waves
  - Filter: 12 dB/oct and 24 dB/oct low-pass, band-pass, and high-pass with ADSR envelope
  - LFO: 2 LFOs with 32 waves each
  - Envelopes: 1 ADSR for amp, 1 AD envelope with velocity for FM
  - Arpeggiator: Up, Down, Up-Down 1, Up-Down 2, Played, Random, Chord; 32 patterns; syncs to MIDI clock
  - Effects: Delay, Reverb, Chorus, Compression, Distortion, EQ
  - Keyboard: 25, 49, or 61 keys with velocity and aftertouch
  - Memory: Two banks of 100 patches each
  - Control: MIDI In, 2x MIDI Out, USB MIDI/Audio, Expression and Sustain pedal inputs
