description: The NF06 is a new near-field passive monitor speaker created using
  technology accumulated over many years of developing professional monitor
  speakers. It is designed for professional studios and thoroughly pursues the
  reference performance required in today's music production. The newly
  developed 6.5-inch woofer unit exclusively for the NF06 employs an HR
  diaphragm to disperse the peaks of specific frequencies caused by split
  vibration and eliminate natural sound, while ensuring high rigidity while
  being lightweight. Achieves high resolution and speedy low frequency playback.
  The front and rear positions of the woofer and tweeter were carefully listened
  to and time alignment adjustments were made. The bass emitted from the bass
  reflex port located at the bottom of the woofer's baffle can suppress
  unnecessary changes in low frequencies caused by the wall on the back of the
  speaker when installed on a studio speaker stand.
details: |-
  Tagline: Passive-type near-field monitor speaker that thoroughly pursue the reference performance required for studio music production using the latest technology

  Features:
  - HR (HP ROTATION) diaphragm — HP (HYPERBOLIC PARABOLOIDAL) shape rotated in the circumferential direction; only shearing force acts as internal stress and no bending stress, resulting in a diaphragm that is lightweight, highly rigid, and disperses resonance caused by split vibration.
  - Diaphragm material uses an optimized hybrid composition: wood pulp and non-wood pulp combined with ultra-high elastic carbon fiber, PBO, and Cellgaia pulp — ideal rigidity and internal loss with propagation speed approaching a metal diaphragm.
  - Magnetic circuit designed to stabilize the amplitude of the vibration system; copper cap on the pole piece reduces current distortion.
  - UDR tangential shape edges (Up/Down Roll Tangential) — up roll and down roll joined by a tangential surface, used together with the HR diaphragm.
  - 1" ridge dome shaped titanium tweeter — non-constant distance from voice coil to dome top disperses natural resonance while preserving the high-speed response of a metal diaphragm.
  - Short type voice coil on the tweeter improves input resistance and high frequency reproduction.
  - Time-aligned woofer and tweeter front/rear positioning.
  - Bass reflex port located at the bottom of the woofer's baffle to suppress unnecessary low-frequency changes caused by the wall behind the speaker on a studio stand.
