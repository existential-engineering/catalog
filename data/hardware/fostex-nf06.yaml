details: |-
  The NF06 is a new near-field passive monitor speaker created using technology accumulated over many years of developing professional monitor speakers. It is designed for professional studios and thoroughly pursues the reference performance required in today's music production.

  Newly developed 6.5-inch HR woofer. The woofer unit exclusive to the NF06 employs an HR diaphragm to disperse the peaks of specific frequencies caused by split vibration while ensuring high rigidity at low mass, achieving high resolution and speedy low frequency playback. The diaphragm material uses an optimized hybrid composition of wood pulp and non-wood pulp with ultra-high elastic carbon fiber, PBO and Cellgaia pulp, giving the ideal rigidity and internal loss for a woofer diaphragm.

  The magnetic circuit is designed to stabilize the amplitude of the vibration system so there are fewer changes in the force factor, ensuring linear followability from small to large signal input, and a copper cap on the pole piece reduces current distortion. The edges use the UDR (Up/Down Roll) tangential shape, in which up roll and down roll are joined by a tangential surface.

  Newly developed 1-inch titanium diaphragm tweeter. The 1-inch dome tweeter is made of titanium and molded in a ridge dome shape which, combined with the optimized shape of the diffuser, provides clear, high-resolution monitoring. The ridge dome shape disperses natural resonance that causes coloration while keeping the high-speed response of a metal diaphragm.

  New concept bass reflex port. The front and rear positions of the woofer and tweeter were carefully auditioned and time alignment adjustments made. The bass emitted from the bass reflex port at the bottom of the woofer's baffle suppresses unnecessary changes in low frequencies caused by the wall behind the speaker when installed on a studio speaker stand.
specs: |-
  - Type: 2-way bass reflex, passive
  - Units: 6.5 inch HR shaped diaphragm woofer, 1 inch ridge dome shaped titanium tweeter
  - Frequency response: 40 Hz to 35 kHz (-10 dB)
  - S.P.L.: 84.5 dB/W (1 m)
  - Impedance: 8 ohm
  - Maximum input: 100 W
  - Crossover frequency: 1.6 kHz, -12 dB/oct.
  - Dimensions: 238 (W) x 400 (H) x 271 (D) mm
  - Weight: 9.8 kg
  - Enclosure material: MDF
  - Accessory: safety precautions
  - Passive design, no power connection
