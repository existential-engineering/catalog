details: |-
  Players fond of the old adage "if it ain't broke…" haven't played a JB. The G&L JB is all about refinement, blending classic Alnico single-coil tone with modern improvements and superb craftsmanship.

  This JB projects a time-honored yet subtly progressive vibe, embracing the past yet unafraid of moving forward. The slim, hard-rock maple neck features a classic gloss finish, while its comfortable 9" radius and medium-jumbo nickel frets deliver modern playability. What's more, the JB features an innovative Leo Fender-designed Saddle-Lock bridge to transfer string energy right into the body end-grain for an incredibly resonant instrument.
specs: |-
  - Construction: bolt-on
  - Scale: 34"
  - Pickups: 2x G&L Alnico single coil pickups
  - Body wood: Poplar & Ash Top over Poplar
  - Neck wood: Hard Rock Maple with vintage tint satin finish and Maple or Rosewood fingerboard
  - Neck width at nut: 1 1/2"
  - Neck radius: 12"
  - Neck profile: medium C
  - Frets: medium jumbo, nickel
  - Tuning keys: Traditional open-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock
  - Electronics: one volume control for each pickup, master tone
  - Available in: Lake Placid Blue over Poplar, 3-ply White Pickguard, Rosewood fingerboard with white neck binding and white pearloid block inlays
  - Available in: 3-Tone Sunburst over Swamp Ash top on Poplar, 3-ply Black Pickguard, Maple fingerboard with black neck binding and black block inlays
