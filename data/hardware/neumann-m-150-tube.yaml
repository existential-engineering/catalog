description: The M 150 Tube is a unique small diaphragm condenser microphone for
  orchestral recordings, based on the legendary Neumann M 50.
details: |-
  Recreates the sound of the legendary Neumann M 50

  Titanium capsule with unique directional characteristic

  Perfect for orchestral recording

  Ideal for DECCA Tree stereo and surround recordings

  Modern version of the legendary Neumann M 50

  Unique all-titanium capsule

  Extended frequency response and unparalleled transient accuracy

  Tube circuit with transformerless output stage

  Very low self-noise

  12 mm small diaphragm capsule flush mounted in a 40 mm sphere

  Subminiature triode tube circuit

  Transformerless output stage allows cable runs up to 300 m

  -10 dB pad switch

  40 Hz rumble filter (LIN position shifts to 16 Hz)
specs: |-
  - Acoustical operating principle: Pressure transducer
  - Directional  Pattern: Omnidirectional
  - Frequency  Range: 20 Hz ... 20 kHz
  - Sensitivity at 1 k Hz into 1 kohm: 20 mV/Pa
  - Rated  Impedance: 50 ohms
  - Rated load impedance: 1 kohms
  - Equivalent noise level,  C C I R: 28 dB
  - Equivalent noise level,  A-weighted: 15 dB-A
  - Typical  S P L (tube characteristic) for  K<0.5%: 114 dB
  - Typical  S P L (tube characteristic) for  K<5%: 134 dB
  - Signal-to-noise ratio,  C C I R (re. 94 d B  S P L): 66 dB
  - Signal-to-noise ratio,  A-weighted (re. 94 d B  S P L): 79 dB
  - Maximum output voltage: 8 dBu
  - Dynamic range of the amplifier,  D I N/ I E C 651, for  T H D < 0.5%: 99 dB
  - Dynamic range of the amplifier,  D I N/ I E C 651, for  T H D < 5%: 119 dB
  - Power supply: N 149 A
  - Matching connector: Microphone: DIN 8 F, Power Supply: XLR 3 F
  - Weight: 800 g
  - Diameter: 78 mm
  - Length: 165 mm
