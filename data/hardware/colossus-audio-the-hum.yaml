description: A 6-oscillator analog drone synthesizer with independent pitch and
  volume per oscillator, a non-linear combiner with touch-sensitive bolts,
  low-pass/high-pass tone shaping, a noise generator, and a PT2399-based delay.
details: |-
  The Hum is a 6-oscillator analog drone synthesizer engineered for both studio and live performance. Each oscillator features independent pitch and volume control, while a non-linear combiner generates two additional signals accessible via four touch-sensitive bolts for real-time manipulation. The integrated tone shaper provides low-pass and high-pass filtering, a dedicated noise generator delivers powerful white noise textures, and the PT2399-based delay adds spatial dimension with adjustable time and feedback. A master volume/gain control manages overall presence and distortion characteristics.
