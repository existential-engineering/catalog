description: The Ignition Special Edition (SE) asses are based on the Höfner
  Violin Basses from the 1970s.
details: |-
  In contrast to the Contemporary series, the Ignition basses have a hollow body with a soundpost wich connects the top and the back (similar construction as inside of a violin). This reduces the feedback at higher volume level on stage. In addition to the classic control panel with Tea Cup knobs, they are equipped with a wooden bridge and trapeze tailpiece and carry the traditional Höfner logo on the body.

  The Cavern version (HI-CA-SE-SB(C)) of our Ignition Bass offers the famous Pick Up Spacing from 1961 in addition to the features already mentioned. All our Ignitions (SE) come with a certificate of authenticity and the famous BASSMANN sticker.

  The HI-BB-SE is available in sunburst (SB) or black (BK). In addition, the SB-version is also available as left-handed version without extra charge. All modells are fitted with Tea Cup knobs.
