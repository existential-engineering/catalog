url: https://bastl-instruments.com/eurorack/modules/citadel-alchemist
description: A 16HP patchable Eurorack hybrid-synthesis instrument reimagining
  the Kastle 2 Alchemist desktop device. Five synthesis modes (FILTER, FM,
  HYPERSINE, SUPERSAW, GLITCHNOISE), four oscillators, FM with feedback, ring
  modulation, stereo filter, and dual FX (delay + chorus/flanger/distortion).
  Macro controls TIMBRE, ENV, and PITCH SLIDE. Integrated pattern generator with
  user-programmable rhythms via web editor. TRS MIDI + USB-C. Open-source.
details: |-
  Citadel Alchemist is a 16HP patchable Eurorack hybrid-synthesis instrument — a full Eurorack reimagining of the Bastl Kastle 2 Alchemist desktop synth. Five synthesis modes — FILTER, FM, HYPERSINE, SUPERSAW, and GLITCHNOISE — each with custom-tuned dual FX (stereo delay left, chorus/flanger/distortion right). Four oscillators with FM and feedback, raw waveform mixing, ring modulation, track and hold, stereo noise, stereo filter, and a transient shaper.

  Three macro controls: TIMBRE (main timbral sweep, refined by RATIO), ENV (synthesis contour and sequencing, enables mode morphing), and PITCH SLIDE (pitch envelope and portamento). Pitch range spans ±3 octaves.

  The integrated tempo-synced pattern generator outputs GATE and CV and supports user-defined polyrhythmic patterns via the Alchemist Laboratory web app. Tap tempo, clock division, and multiplication supported. MIDI via TRS input (clock, notes, CCs, pitch bend) and USB-C rear panel (USB MIDI in/out, firmware updates). Headphone output drives up to 250Ω. Audio at 44kHz/16-bit. Open-source firmware; blank reverse panel for custom labeling.
