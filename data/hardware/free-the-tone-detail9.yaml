description: A light, compact pedalboard power supply with two completely
  independent isolated output terminals (9 VDC/500 mA) and six low-noise
  standard output terminals (9 VDC/100 mA), able to power up to eight lines.
details: |-
  Although it is light and compact, the PT-3D furnishes two completely independent isolated output terminals (9 VDC/500 mA) and six low-noise standard output terminals (9 VDC/100 mA), so it can power up to eight lines from one unit. Like the other PT series products, rigidity and lightness are attained by making the housing from a Japanese-made aluminium alloy used in aircraft parts.

  The isolated output terminals can supply current higher than 1 A momentarily, which some digital effects units require on boot. After the units have booted, the PT-3D continues to supply the required amperage stably up to 500 mA. That makes a 9 VDC supply applicable to high-current effects units such as the DigiTech WHAMMY DT and WHAMMY 5, the Eventide TIME FACTOR, MOD FACTOR, PITCH FACTOR, SPACE and H9, the LINE6 DL4, MM4 and FM4, and the Strymon TIMELINE and MOBIUS.

  Each 9 VDC output is stabilized and feeds the effects unit through its own noise filter and short-circuit protection circuit. The noise level of the low-noise standard outputs is greatly reduced by a two-step noise filter, and their output voltage is set to approximately 9.8 VDC to reproduce the condition of power coming from a brand-new battery.

  Because the two isolated output terminals are completely independent of each other and electrically insulated, no ground loop noise occurs between them, and external digital noise arriving over the mains supply lines is rejected. The isolated terminals can also be used with a polarity reversing cable for a pedal driven from minus 9 V, which the low-noise standard terminals cannot do.

  The unit measures 120 by 55 by 35 mm excluding rubber feet and weighs approximately 185 g excluding accessories. It ships with a warranty card, a manual, four 30 cm and four 50 cm DC cables and an AC adapter. The supplied DC cables do not fit Eventide or LINE6 units, which need the Free The Tone CP-R25CV conversion cable or a suitable cable of the customer's own.
specs: |-
  - 2x stabilized 9 VDC isolated output terminals (at max. 500 mA)
  - 6x stabilized 9 VDC low-noise standard output terminals (at max. 100 mA)
  - Low-noise standard output voltage set to approximately 9.8 VDC
  - Short-circuit protection circuit in each output
  - Isolated outputs can momentarily supply more than 1 A
  - Housing of Japanese-made aircraft-grade aluminium alloy
  - Dimensions: 120W x 55D x 35H mm (excl. rubber feet)
  - Weight: approx. 185 g (excl. accessories)
  - Accessories: warranty card, manual, 4x DC cables (L = 30 cm, L/L), 4x DC cables (L = 50 cm, L/L), 1x AC adapter (FA-1220D-JA/UK/EU)
  - Supplied DC cables are not applicable to Eventide or LINE6 units; the FREE THE TONE CP-R25CV conversion cable covers Eventide TIME FACTOR, MOD FACTOR, PITCH FACTOR and SPACE and LINE6 DL4, MM4 and FM4
