description: A hand-built UK 2x12 guitar cabinet loaded with Celestion
  Creambacks for 130 watts of rich, balanced tone at 16 ohms. Delivering punchy
  lows, warm mids, and smooth highs, it offers greater headroom and projection
  than a 1x12, making it suited to both studio and stage. Crafted from
  lightweight premium ply with reinforced corners and a stitched leather handle,
  the PM-212 combines boutique build quality, portability, and the unmistakable
  voice of Creambacks, an ideal match for the Peacemaker PM-20H and PM-80H
  heads.
