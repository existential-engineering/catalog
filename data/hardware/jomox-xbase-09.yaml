description: >-
  The JoMoX XBase 09 is an analog drum machine that faithfully emulates and expands upon
  the Roland TR-909 with true analog kick and snare circuits alongside tweakable
  sample-based percussion. It offers more hands-on controls per sound than the original
  808 or 909, with 100 patch memories, dual LFOs, and full MIDI implementation.
details: |-
  Released in 1997, the JoMoX XBase 09 is a serious TR-909 emulation that goes beyond simple recreation. Like the original 909, it uses true analog circuits for its kick and snare sounds, not emulations or samples. Hi-hats, cymbal, ride, rimshot, claps, and noise sounds are sample-based but remain highly tweakable with tuning and reverse capabilities.

  The XBase 09 provides more hands-on controls per sound than the original TR-808 or TR-909 ever offered, including tuning, level, decay, snap, and additional parameters. All edited sounds can be stored in 100 patches of memory. Two built-in LFOs with sawtooth up/down, triangle, and rectangle waveforms can modulate bass drum pitch, snare tune, snare snap, snare noise tune, hi-hat tune, or each other, with MIDI sync capability.

  The built-in sequencer stays faithful to the step and real-time programming style of the 909 and 808, but with a critical advantage: sound edits are stored with each pattern or song. This makes it possible to have dynamically changing drum sounds throughout a sequence, something not easily achievable on the original machines. An extensive shuffle mode adds further rhythmic variation.

  The XBase 09 also works well as a simple drum tone module, with all editable controls accessible via MIDI. Control movements send MIDI data for recording real-time edits into external sequencers. If you are looking for the TR-909 that should have been, this is it: authentic sounds with more functionality and modern MIDI specs. Its main limitations are 3-voice polyphony and its premium price point. The rack-mount AirBase 99 offers a cheaper alternative with added tom sounds.
specs: |-
  - Polyphony: 3 voices
  - Sounds: Kick, Snare, Clap, Open Hat, Closed Hat, Ride, Cymbal, RimShot
  - LFO: 2 with Sawtooth Up/Down, Triangle, Rectangle; Intensity, Speed, MIDI Sync
  - Analog Section - Kick: Tune, Pitch, Decay, Harmonics, Pulse, Noise, Attack, EQ
  - Analog Section - Snare: Tune, Snap, Decay, De-tune, Noise Tune
  - Sample Section: Claps, Rimshot, Hi-Hats, Ride, Cymbal, Noise (Tune, Reverse, Hi-Hat Balance, Hi-Hat Decay)
  - Keyboard: 5 buttons
  - Sequencer: Step and real-time programming with sound edits per pattern
  - Memory: 100 DrumKit patches
  - Control: MIDI, DIN-Sync Out
