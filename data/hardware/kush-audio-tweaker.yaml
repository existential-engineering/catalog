details: |-
  Tweaker takes compression to the next level. Its vintage, discrete VCA and bespoke detector are married to envelope-pushing controls that allow this box to be whatever you want it to be: smooth & polished or dark & filthy, subtle & delicate or fierce & explosive.

  To achieve such extremes, Tweaker stretches and expands the range and function of its traditional compressor controls, then breaks new ground with a radical and innovative 'Sidechain Shaper' section. With simultaneous Tri-Metering of Input/Output/Gain Reduction levels, Single or Dual-stage Release, Wet/Dry Mix, and a unique 'Curve' control that sharpens the knee as the ratio is increased, Tweaker is an old soul with a post-modern brain.

  This expansion of the classic, coupled with the introduction of the cutting edge, enable this box to create a wider array of effects than any other compressor in existence.

  The front panel is divided into three sections matching the three signal paths inside the compressor: an audio path with Drive, Mix and Output, a sidechain path with Threshold, Contour and the Sidechain Shaper switch, and a detector path with Attack, Release and Curve.

  Drive dictates the amount of gain pushed out of the VCA, so less drive means less distortion and more drive means more distortion. Because of the signal flow, that distortion is mitigated during the attack phase of compression, resulting in clearer, less distorted transients.
specs: |-
  - Mains powered, 110-260V, AC inlet type not documented by the maker
  - Mono compressor, stereo linkable via TRS-TRS
  - Balanced input and output via XLR and TRS
  - Sidechain Shaper with extensive detector-path filtering
  - Additional external sidechain insert via XLR
  - Tri-Metering for simultaneous input, output and gain reduction monitoring
  - Frequency response 10Hz - 22kHz +/- 1dB
  - THD = .003% - 10%
  - Bespoke, discrete-transistor VCA
  - Bespoke RMS detector
  - Mix control for parallel compression
  - Single or dual-stage release
  - Curve control that sharpens the knee as the ratio is increased
