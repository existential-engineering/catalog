details: |-
  An inexpensive over the head headphone, rather than an in-ear type, aimed at use at a computer workstation.

  The cable runs to 1.8 metres, which is long enough for the plug to reach a headphone socket on a computer without strain, and it terminates in a 3.5mm stereo jack plug.

  Impedance is 32 ohms with a maximum power input of 50 mW, and the quoted frequency range is 20 Hz to 18 kHz. The headphone weighs 30 grams on its own, or 45 grams including the cable.
