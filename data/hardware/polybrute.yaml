description: >
  PolyBrute is more than a synthesizer - it's a 6-voice analog powerhouse, with unprecedented expressivity and sound morphing capabilities, built to let you perform fearlessly, compose with fluidity, and explore sound in perpetual motion.
details: |-
  Polybrute is a 6-voice analog synthesizer that combines unprecedented expressivity with sound morphing capabilities. It features two analog vcos and dual iconic filters—a 12db/oct steiner parker filter with continuous morphing between lowpass, notch, highpass, and bandpass modes, and a legendary 24db/oct ladder filter inspired by dr. Bob moog with distortion and overdrive. The instrument is built for fearless performance, fluid composition, and continuous sonic exploration with its groundbreaking morphing architecture.

  The synthesizer's core strength lies in its sound morphing capability, where each preset exists in two simultaneous states (a and b) with seamless morphing between them. The innovative morphe controller provides three-axis control (x, y, z touch and pressure) for mapping to any modulation destination, enabling next-generation musical expression. Three lfos with waveform selection and shaping, combined with three envelope generators including a freely assignable third eg with delay stage, provide instant and limitless modulation possibilities. The brute factor feedback control adds signature bite and bark to both filters.

  The 61-note velocity and pressure-sensitive keyboard supports up to 6-voice polyphony with mono, unison, and poly voicing modes, plus single, split, and layer configurations. The ribbon controller, positioned above the keybed, allows effortless gliding across modulation destinations. A 12x32 modulation matrix with up to 32 destinations and 64 total connections enables complex parameter routing. The instrument includes a motion recorder for capturing real-time performance automation and creating custom envelope curves.

  The sequencer offers 64-step polyphonic sequences with velocity, accents, slides, and randomization capabilities, supported by three parallel automation tracks for timbre changes. An advanced matrix arpeggiator hybrid mode allows construction of 16-step frameworks to generate complex arpeggios. The instrument provides instant access to 768 preset memory locations, including nearly 400 professionally designed patches. Digital effects include chorus, phaser, flanger, and ring modulation, plus 9 delay algorithms (including bbd and digital delay) and 9 reverb algorithms (including hall, plate, spring, and shimmer).

  Polybrute connect software provides seamless integration between the hardware synthesizer and virtual studio projects, offering bi-directional visual editing and DAW plugin support for all major platforms. The instrument generates MIDI from almost every control, allowing capture of performances as part of DAW productions. Built with meticulous attention to detail, polybrute features a pristine metal chassis embellished with luxurious dark walnut appointments, combining timeless aesthetic with modern design heritage.
specs: |-
  - 6-voice analog polyphony
  - Mono, unison, poly voicing modes
  - Single, split, layer modes
  - 61-note velocity and pressure-sensitive keyboard
  - Two analog vcos with saw, triangle, metalizer, square, pulse width, sub, linear fm, hard sync
  - Vcf 1 steiner parker filter 12db/oct with continuous lp/notch/hp/bp morphing
  - Vcf 2 ladder filter 24db/oct with distortion and overdrive
  - Brute factor feedback control
  - Three envelope generators with adsr and delay stage
  - Three lfos with waveform selection and shaping
  - Tempo sync and various retrig options
  - Ribbon controller
  - Morphe 3d touch and pressure-sensitive controller with x, y, z axes
  - Pitch wheel and assignable mod wheel
  - Expression and sustain pedal inputs
  - 12x32 modulation matrix with up to 32 destinations and 64 total connections
  - 768 preset memory locations
  - 64-step polyphonic sequencer with velocity, accents, slides, randomization
  - Three parallel automation tracks
  - Arpeggiator and matrix arpeggiator with 16-step framework
  - Motion recorder for parameter automation
  - Chorus, phaser, flanger, ring modulation effects
  - 9 delay algorithms including bbd and digital delay
  - 9 reverb algorithms including hall, plate, spring, shimmer
  - MIDI and USB I/o
  - Analog clock I/o
  - Stereo digital effects
  - Master cutoff control for both filters
  - Series and parallel filter routing
  - Mixer with three sound sources
  - Headphone output with volume control
  - Master volume and fine tuning controls
  - Stereo voice placement
  - Polybrute connect software integration
  - Bi-directional visual editing between hardware and software
  - DAW plugin support for all major daws
  - MIDI track control from DAW
  - Size: 972 x 378 x 110 mm (38.27 x 14.88 x 4.33 in)
  - Weight: 17 kg (37.48 lb)
