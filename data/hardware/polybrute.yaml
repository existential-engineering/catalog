details: |-
  Polybrute is more than a synthesizer - it's a 6-voice analog powerhouse, with unprecedented expressivity and sound morphing capabilities, built to let you perform fearlessly, compose with fluidity, and explore sound in perpetual motion.

  The single morph knob unlocks polybrute's sweeping morph abilities, allowing you to sweep all parameter settings between two different patches at once. Each preset exists in two states simultaneously - a and b - with the groundbreaking ability to gradually morph between them.

  The innovative morphe controller maps the x and y touch axes plus the z pressure axis to bring a new form of control to any destination parameters available in the mod matrix. You can even use the morphe to randomize your sequences or arpeggios with spice, dice, and ratcheting.

  The ribbon controller, positioned immediately above the keybed, can be assigned to your chosen modulation destination and glide effortlessly up and down the spectrum. Coupled with a premium velocity/pressure-sensitive keybed, pitch wheel and assignable mod wheel, and footpedal controller inputs, polybrute excels beyond the realm of powerful polysynth.

  Polybrute is a synthesizer years in the making, undergone rigorous testing to ensure a build quality of the finest calibre. Its pristine metal chassis is embellished with luxurious dark walnut appointments for a timeless aesthetic, with a sleek, modern flare that sets it apart from the crowd.
specs: |-
  - 6-voice analog polyphony
  - Mono, unison, poly voicing modes
  - Single, split, layer modes
  - 61-note velocity- and pressure-sensitive keyboard
  - Two analog vcos with saw, triangle, metalizer, square, pulse width, sublinear fm, hard sync
  - Vcf 1 (steiner parker filter) - 12db/oct with continuous lp>notch>hp>bp morphing
  - Vcf 2 (ladder filter) - 24db/oct lowpass with distortion and overdrive
  - Brute factor feedback control
  - Three envelope generators with velocity-sensitive adsrs
  - Three lfos with waveform selection and shaping
  - Morphe 3d touch and pressure-sensitive controller
  - Ribbon controller
  - Pitch bend, mod wheel, footpedal controller inputs
  - Sound morphing capability with part a and b states
  - 768 preset memory locations
  - 96-point digital patchbay with up to 32 modulation destinations
  - 64 total modulation connections
  - 12x32 modulation matrix
  - 64-step polyphonic sequencer
  - Arpeggiator and matrix arpeggiator modes
  - Motion recorder
  - Three stereo digital effects
  - Modulation fx: chorus, phaser, flanger, ring modulation
  - Delay: 9 algorithms including bbd and digital delay
  - Reverb: 9 algorithms including hall, plate, spring, shimmer
  - MIDI and USB I/o
  - Analog clock I/o
  - Expression and sustain pedal inputs
  - Polybrute connect software integration
  - Size: 972 x 378 x 110 mm (38.27 x 14.88 x 4.33 in)
  - Weight: 17 kg (37.48 lb)
