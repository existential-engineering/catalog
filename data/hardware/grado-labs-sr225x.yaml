description: Open-back, on-ear dynamic headphones from Grado's Prestige X
  Series. Hand-assembled in Brooklyn with the 4th generation X Series driver, F
  cushion, and an 8-conductor super annealed copper cable.
details: |-
  The SR225x is the successor to the beloved SR225e, a favorite among headphone enthusiasts for nearly a decade. Grado introduces upgrades including the new F cushion for enhanced textured tones, an improved headband with more cushioning, and a more durable cable. The star feature is the 4th generation X Series Driver, with a more powerful magnetic circuit, a voice coil with decreased effective mass, and a reconfigured diaphragm.

  The SR225x maintains the family resemblance but adds modern touches. It is suitable for home use but not an ultra-portable option due to its slightly heavier construction. A standout surprise is its unexpected aptitude for PC gaming, providing an open soundstage and impressive mid-range and dynamic bass response.

  In terms of sound, the SR225x impresses with a warm and nuanced middle range, punchy lows, and a well-balanced presentation across genres. The headphone excels in reproducing vocals.

  The 8-conductor cable is housed in a more durable exterior and uses super annealed copper wire for improved purity of the audio signal. The new headband adds cushioning for greater comfort during longer listening sessions.
