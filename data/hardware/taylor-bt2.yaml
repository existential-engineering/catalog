details: |-
  The Baby Mahogany BT2 is a 3/4-size acoustic built for portability and approachability. The solid Neo-Tropical Mahogany top delivers warm, present tone that outperforms its compact footprint, while the layered Sapele back and sides add durability suited to life on the road.

  The slim neck profile and 22-3/4" scale length make chord transitions accessible for beginners and comfortable for smaller hands. Matte finish on the top, back, and sides gives a natural, tactile feel. Ebony bridge with Nubone nut and Micarta saddle provide smooth action.

  Ships with a soft gig bag and D'Addario XS Coated Phosphor Bronze Light strings.
specs: |-
  - - Body style: Baby Taylor (3/4 size)
  - Top: Neo-Tropical Mahogany (solid, matte)
  - Back/sides: Sapele (layered, matte)
  - Neck: Mahogany
  - Fretboard: Ebony
  - Bridge: Ebony
  - Scale length: 22-3/4"
  - Tuners: Die-Cast Chrome
  - Inlays: 4mm dots (Italian Acrylic)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Case: Soft gig bag included
