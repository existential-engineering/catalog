description: High-pass filter version of the 1073MP microphone preamplifier,
  featuring Class A transformer-coupled design with the characteristic sound of
  the 1073 equalizer — harmonically rich low end, resonant highs, and focused
  mids.
details: |-
  The BAE 1073MPF is a rackmount microphone preamplifier that adds an inductor-based high-pass filter to the classic 1073MP design. It delivers the same harmonically rich, transformer-coupled Class A sound associated with the original Neve 1073 equalizer, with a focused midrange and resonant high end.

  The unit features a selectable high-pass filter with four frequency settings (50Hz, 80Hz, 160Hz, and 300Hz), allowing engineers to roll off low-end rumble or room noise before it enters the signal chain. An input impedance selector offers 1200 or 300 ohms for the mic input, enabling tonal shaping at the source.

  The 1073MPF is available in single or dual channel configurations housed in a standard 19-inch 1U rack chassis. It includes both phantom power and phase reverse functions, each with illuminated buttons. A high-impedance front-panel DI accommodates guitars, basses, and synthesizers.

  Power is provided by a regulated linear power supply capable of supporting up to four channels. The unit is hand-wired using modular construction, consistent with BAE's approach to replicating vintage Neve circuit topology and build quality.
