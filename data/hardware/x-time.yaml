description: "True stereo delay pedal featuring 16 all-new delay algorithms
  leveraging IK Multimedia's latest AmpliTube technologies, with 24-bit/192kHz
  converters, 112 dB dynamic range, pure analog dry path, 300 storable presets,
  and included virtual X-TIME plugin for AmpliTube 5."
details: |-
  Delay Algorithms: VTG-TAPE, MOD-TAPE, ANALOG, DIGITAL, PING-PONG, PATTERN, DUAL, REVERSE, REV-PONG, SWELL, DUCK, PITCH, HARM, DIRTY, SLAPBACK, ARCTIC

  Presets: factory: 50; total Storable: 300

  Controls: MODEL encoder, PRESET encoder, PARAMETER encoder, Main parameter knobs, A footswitch, B footswitch, TAP footswitch

  Eight 16-segment character display

  True bypass and soft bypass selectable

  True stereo with pure analog dry path

  Anodized aluminum chassis. Designed and made in Italy.

  Includes virtual X-TIME plugin for AmpliTube 5, AmpliTube 5 SE, and X-GEAR Librarian app.
specs: |-
  - Ultra-low noise 24-bit/192 kHz converters
  - Frequency response: 5 Hz - 24 kHz
  - Dynamic range: 112 dB
  - 16 delay algorithms
  - 50 factory presets, 300 total storable
  - Selectable true or soft bypass
  - Pure analog dry path
  - True stereo inputs and outputs
  - Tap tempo with BPM sync and spillover/trails
  - 5 cabinet impulse responses
  - 8-character 16-segment LCD display
  - 3 footswitches
  - Anodized aluminum chassis
  - Dimensions: 175 x 145 x 58 mm (6.88" x 5.7" x 2.28")
  - Weight: 906 g (31.96 oz)
  - Power: 9V DC center-negative (PSU included)
