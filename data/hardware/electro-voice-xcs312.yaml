description: Triple-12 cardioid bass element for the Electro-Voice X-Line line
  array system. Designed as a flyable cardioid subwoofer that integrates
  directly into main arrays, the XCS312 uses three DVX3120A 12-inch woofers and
  self-contained rigging hardware to deliver a controlled forward pattern with
  significantly reduced rearward low-frequency energy, and is fully supported by
  EV's LAPS II aiming and prediction software.
details: >-
  The XCS312 is a flyable cardioid bass element designed for integration into
  Electro-Voice X-Line line array systems. Its three 12-inch DVX3120A neodymium
  woofers are arranged in a cardioid configuration that focuses low-frequency
  energy forward, reducing rearward LF spill on stage and in the rear of the
  venue. The two forward-facing 12s and a single rear-facing 12 are driven on
  separate amplifier channels so the rear element can be processed (delay +
  polarity) to cancel rearward radiation.


  The cabinet covers 40 Hz to 100 Hz (-10 dB) with a calculated maximum SPL of
  136 dB at 1 m and is intended to be crossed over to the main array at 100 Hz,
  with a recommended 40 Hz high-pass to protect excursion. Self-contained
  rigging hardware lets the XCS312 fly directly within the main array (between
  or above the full-range modules) rather than requiring separate ground-stacked
  subs, and the system is fully modeled in EV's LAPS II aiming and flying
  software for prediction and rigging calculations.


  The enclosure is EVCoat-coated birch plywood with a powder-coated steel grille
  and is available only in black. Audio connection is via two Neutrik NL8
  Speakon connectors on the rear, providing separate amplifier feeds for the
  forward 12s (LF) and the rear 12 (LF2).
specs: >-
  - Configuration: Flyable cardioid subwoofer with three 12-inch woofers (two
  forward, one rear)

  - LF transducers: 3 x 12-inch DVX3120A neodymium woofers

  - Frequency range (-10 dB): 40 Hz - 100 Hz

  - Frequency response (-3 dB): 45 Hz - 100 Hz

  - Maximum SPL @ 1 m (calculated): 136 dB

  - Peak SPL @ 10 m: 121 dB

  - Axial sensitivity: 100 dB SPL (1 W @ 1 m)

  - Horizontal coverage (nominal -6 dB): 200 degrees

  - Crossover frequency: 100 Hz

  - Recommended high-pass: 40 Hz

  - LF power handling (forward pair): 1000 W continuous / 4000 W peak

  - LF2 power handling (rear element): 500 W continuous / 2000 W peak

  - Passive power handling: 6000 W

  - LF nominal impedance: 4 ohms

  - HF (LF2) nominal impedance: 8 ohms

  - Connectors: 2 x Neutrik NL8 Speakon

  - Rigging: Self-contained, compatible with X-Line arrays and LAPS II software

  - Enclosure: EVCoat-coated birch plywood

  - Grille: Powder-coated steel

  - Color: Black

  - Dimensions (H x W x D): 508 x 726 x 677 mm

  - Net weight: 67.13 kg
