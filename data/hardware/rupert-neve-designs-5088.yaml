description: The 5088 is a fully discrete, transformer-coupled, modular analog
  mixing console — the culmination of Rupert Neve's vast analog circuitry
  knowledge. Available in 8, 16, 32, 48, and 64+ channel frames (expandable in
  16-channel increments), with an optional Penthouse for vertical-mount mic
  pres, EQs, compressors, 500 Series racks, or 19" outboard. Optional SwiftMix
  2.0 motorized fader automation integrates with any DAW over a single USB
  connection.
details: |-
  The 5088 is Rupert Neve's final word in discrete analog mixing console design. It incorporates and improves upon many of the same analog concepts that made the original 80 series consoles so revered: single-sided, fully discrete amplification, bespoke audio transformers on every input and output, bulletproof build quality, and unparalleled headroom and dynamic range.

  The base 16-channel configuration provides 16 channel inputs, 8 group busses, 8 auxiliary sends, 4 stereo effects returns, and a stereo output bus. Channel count is expandable in multiples of 16 (8, 32, 48, 64+). The signal path is class-A, ±24V single-sided discrete topology using custom high-voltage discrete op-amp cards. Bespoke transformers on every input and output provide electrical isolation and true floating ground.

  Per-channel features include 8 aux sends, 8 group sends, solo, mute, Send Follows Pan, Aux to Group, a transformer-coupled direct out, and a 100mm fader. An optional 552 stereo input module adds stereo channels with Line/Tape inputs, six aux sends, individual trims/pans, L/R direct outs, and stereo width control.

  The optional Penthouse (25 slots on a 16-channel frame) accepts Shelford 5052 mic pre/EQ, Shelford 5053 transformer-gain mic pre/inductor EQ, Shelford 5051 EQ/compressor, 5022 dual mic pre, 500 Series racks, 19" rack modules, or vintage modules. An optional meterbridge adds calibrated VU meters per input and group channel.

  SwiftMix 2.0 automation uses 100mm motorized touch-sensitive faders with 10-bit resolution, supports up to 64 automated channels, communicates with the DAW over a single USB cable, and stores all automation data within the DAW session via the Mothership plug-in and Injektor stand-alone application.
specs: |-
  - Topology: fully discrete, single-sided, Class-A, ±24V
  - Frequency response: extends beyond 100kHz
  - Channel counts: 8, 16, 32, 48, 64+ (expandable in 16-channel increments)
  - Base 16-channel frame: 16 mono input channels, 8 group busses, 8 aux sends, 4 stereo FX returns, stereo output bus
  - 8-channel frame: 4 groups, 4 auxes, 2 stereo FX returns
  - Faders: 100mm (motorized touch-sensitive with optional SwiftMix 2.0; 10-bit resolution; up to 64 automated channels; USB connection to DAW)
  - Penthouse: 25 vertical module slots on 16-channel frame
  - Producer desk width: 73 cm / 28.7 inches (matches 16-channel expander)
