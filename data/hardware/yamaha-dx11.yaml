description: >-
  The Yamaha DX11 is a 1988 FM synthesizer featuring 4-operator digital synthesis with
  8-part multitimbrality, a significant advancement over the monotimbral DX7. It offers 61
  velocity and aftertouch-sensitive keys, 8-voice polyphony, and up to eight different
  waveforms for FM synthesis. Quick Edit functions make sound design more accessible than
  earlier DX models.
details: |-
  The DX11 arrived four years after the DX7's market introduction, bringing significant enhancements to Yamaha's FM synthesis line. Its primary innovation was 8-part multitimbrality, whereas older DX synths were monotimbral, allowing users to spread various sound patches across different zones of the keyboard. This capability enabled complex ensemble performances using external sequencers or while playing live using Performance patches.

  The instrument incorporated practical editing features absent from earlier models. Quick Edit functions let users adjust tone and envelope parameters without mastering FM synthesis complexity. Unlike most previous DX synths which all used sine waves for synthesis, the DX11 offers up to eight different waveforms to work with, expanding the sound palette considerably.

  With only 8-voice polyphony versus the DX7's 16 voices, the DX11's multitimbral performances can sound thin when splitting voices across multiple parts. Effects included reverb, DDL delay, pan, and tremolo, but notably lacked the chorus found on some earlier iterations. Despite these tradeoffs, the DX11 delivered versatile capabilities at an accessible price point.
specs: |-
  - 8-voice polyphony
  - 4-operator digital FM synthesis
  - Up to 8 different waveforms
  - 8-part multitimbral
  - 61-key keyboard with velocity and aftertouch
  - Built-in effects: reverb, DDL delay, pan, tremolo
  - 128 preset patches, 32 performance patches
  - External cartridge memory (64 patches)
  - Cassette interface for patch storage
  - MIDI IN/OUT/THRU
  - LFO
