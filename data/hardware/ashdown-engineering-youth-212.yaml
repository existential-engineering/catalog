details: |-
  Designed for Martin 'Youth' Glover from Killing Joke, the YOUTH 212 is an angled 2x12" bin featuring Celestion drivers. It is built from Birch Ply with a PA-style spatter finish and four rear casters for ease of manoeuvrability. The cabs can be ordered directly and are built to order in the UK at the Ashdown custom shop, with special requirements accommodated on request.
specs: |-
  - Speaker configuration: angled 2 x 12" bin, Celestion drivers
  - Size: H 417mm (15.5"), W 849mm (33.5"), D 760mm (30")
  - Nominal power handling: 500W
  - Continuous program: 1000W (3dB greater than nominal rating)
  - Impedance: 4 Ohms
  - Birch Ply construction with PA-style spatter finish
  - Four rear casters
