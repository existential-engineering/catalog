description: The DN530 is a four-channel analogue gate with a Transient
  Accenting circuit that adds controlled energy back into the attack envelope.
  Where a conventional gate simply opens and closes, it selectively boosts the
  leading edge of the signal by up to +12 dB for approximately 30 ms, restoring
  impact lost to mic positioning or PA compression upstream.
details: |-
  Gate attack is exponential, opening fast enough to preserve the leading transient without audible clicks, and release is reverse-exponential to blend with the natural decay of percussion and harmonic material. Intelligent Threshold Shift (iTS) hysteresis prevents low-frequency content from re-triggering the gate, a common failure mode on kick drum and bass guitar where conventional gate hysteresis chatters around threshold.

  Each channel offers an external sidechain input on balanced 1/4" TRS and an internal band-pass sidechain filter for frequency-selective triggering, used correctively to isolate the kick from snare bleed and creatively to gate sustained sources from rhythmic keys. A ducking mode reconfigures the channel for voice-over applications, a solo bus monitors the sidechain without affecting the channel output, and a multi-colour LED bargraph tracks the gate envelope cycle in real time.

  Applications named on the page are live drum gating with restored attack, broadcast voice-over ducking and mixing-stage envelope shaping where conventional gates lack the creative range. The Transient Accent function makes it a sound design tool as well as a corrective one.
specs: |-
  - Four-channel transient-accenting gate, 1U rackmount
  - Transient accent up to +12 dB for approximately 30 ms
  - iTS intelligent threshold hysteresis
  - External sidechain input plus internal band-pass sidechain filter per channel
  - Exponential gate attack, reverse-exponential release
  - Ducking mode for voice-over
  - Solo bus for sidechain monitoring without affecting the channel output
  - Multi-colour LED envelope bargraph
  - Balanced XLR input and output
  - Auto-ranging universal switch-mode power supply
