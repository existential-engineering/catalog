details: |-
  Based on the earliest White Falcon guitars of the mid '50s, this model is as close to the original as you can get short of having a time machine. Features include period-correct body and neck construction, wiring and electronics. The single-coil DynaSonic pickups are faithfully recreated by Seymour Duncan, and the Falcon's signature eye-catching trim is preserved.

  Includes a vintage-style speckled-gray case.
