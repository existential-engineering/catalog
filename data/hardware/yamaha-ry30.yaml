description: >-
  The Yamaha RY30 is a drum machine featuring advanced synthesizer-like
  capabilities and sample-based sound generation. It combines 16-bit PCM drum
  samples with synth-like editing features, digital multimode filtering, and
  layerable oscillators for creative drum sound design. The RY30 draws its
  sounds from a ROM synthesis engine derived from Yamaha's SY/TG series of
  digital synthesizers.
details: |-
  The RY30 draws its sounds from a sample-based ROM synthesis engine derived from Yamaha's SY/TG series of digital synthesizers. The audio engine processes 16-bit, 48kHz PCM with digital multimode filters, providing high-quality drum and percussion tones with extensive sound shaping possibilities.

  The instrument offers substantial sound design capabilities through its 90 waveforms, predominantly acoustic drum and percussion samples supplemented by six analog waveforms including sine, triangle, and sawtooth waves. Users can layer two oscillators per voice and control pitch and playback via MIDI, with 16-note polyphony available.

  The sequencer supports up to 100 user patterns and 20 songs, with 100 preset patterns in various styles included. Eight velocity-sensitive pads control specific drum sounds, while a modulation wheel adjusts pitch, decay, pan, filter cutoff, and oscillator balance. The device includes four assignable outputs for routing individual drums and accepts external ROM cards for additional sounds.
specs: |-
  - 16-note polyphony (metronome uses 1 voice)
  - 96 internal PCM sounds (12 banks of eight)
  - 32 sounds per external ROM card
  - 90 waveforms (84 drum/percussion samples + 6 analog waves)
  - 2 oscillators per voice, layerable
  - Digital high-pass and low-pass filters (12 and 24 dB/octave)
  - 100 preset patterns + 100 user patterns (up to 4 measures each)
  - 20 songs (up to 999 measures)
  - Sequencer resolution: 1/96 note
  - Tempo range: 40-250 BPM
  - MIDI IN/OUT (16-part multitimbral)
  - 8 velocity-sensitive pads
  - 4 assignable outputs
  - Decay rate + volume VCA with velocity-sensitive envelope
releaseDate: "1991"
