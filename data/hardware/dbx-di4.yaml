name: dbx DI4
manufacturer: dbx
primaryCategory: di-box
url: https://dbxpro.com/en/products/di4
description: The dbx DI4 is a 4-channel active direct box and stereo line mixer
  in a half-rack unit, providing four independent DI channels with individual
  XLR outputs plus a stereo line mixer output. Per-channel pad switches, ground
  lift, volume, and pan controls allow keyboards and modules to be routed to
  both FOH and monitors independently.
details: |-
  The dbx DI4 packs four totally independent DI box units into a compact half-rack (0.5U) package, serving double duty as both a multi-channel DI box and a stereo line mixer. Musicians can connect keyboards, samplers, and sound modules into a single rack unit and provide independent XLR outputs to the front-of-house engineer while also creating separate stage monitoring mixes.

  Each of the four channels features a 1/4" TS input, individual 20 dB pad switch, ground lift switch, volume control, and pan control. The four XLR balanced outputs carry each channel's signal to the console, while the stereo RCA master output provides the mix for in-ear monitors or a stage amplifier. A master volume control and headphone output round out the feature set.

  The DI4 draws power from the mains (100–240 VAC, 50–60 Hz) and consumes only 775 mW, making it efficient enough for even extended sessions.
specs: |-
  - Input Connectors: 4× 1/4" TS unbalanced
  - Input Impedance: 320 kΩ
  - Peak Input Level: +15 dBu
  - XLR Output Connectors: 4× XLR balanced
  - Stereo Mixer Outputs: RCA connectors
  - Output Impedance: 600 Ω
  - Max Output Level: +16 dBu
  - Frequency Response: 20 Hz – 20 kHz (0 to -2 dB)
  - THD+Noise: 0.0008% typical at +4 dBu, 1 kHz
  - Crosstalk: <-90 dB (20 Hz–20 kHz)
  - Power Supply: 100–120 V / 200–240 V AC, 50–60 Hz
  - Power Consumption: 775 mW
  - Dimensions: 1.75" H × 8" W × 8.5" D (44.5 × 230.6 × 217 mm)
  - Weight: 3.85 lbs (1.75 kg)
