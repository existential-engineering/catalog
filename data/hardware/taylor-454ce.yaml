details: |-
  The 454ce is a 12-string acoustic-electric from the 400 Series, built around the Grand Auditorium body with Venetian cutaway. Indian rosewood back and sides pair with a Sitka spruce top to produce a rich, full-bodied sound with warm lows, sparkling highs, and complex blooming overtones.

  Taylor's V-Class bracing delivers improved intonation, greater volume, and longer sustain. The Neo-Tropical Mahogany neck with West African Crelicam Ebony fretboard features a 1-7/8" nut width to comfortably accommodate the doubled 12-string courses.

  Expression System 2 behind-the-saddle electronics provide natural amplified tone. The guitar ships with a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Auditorium
  - Configuration: 12-string
  - Top: Sitka Spruce (solid, gloss)
  - Back/sides: Indian Rosewood (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Scale length: 25-1/2"
  - Nut width: 1-7/8"
  - Tuners: Taylor Nickel with Nickel Buttons
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.010-.047)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
