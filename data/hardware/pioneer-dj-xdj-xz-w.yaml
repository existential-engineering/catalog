details: |-
  4-channel professional all-in-one DJ system

  The XDJ-XZ is a professional all-in-one DJ system that’s perfect for events, a bar or club, or your private studio. Wherever you take it, the XDJ-XZ gives you all the features you need to get the job done. This 4-channel system features a professional layout – so you’ll feel exactly like you’re using our club-standard NXS2 setup. And, thanks to flexible media support, you can choose from a variety of ways to perform. Animate your sets with 14 professional Beat FX and 6 Sound Color FX, and trigger software-specific features using the 16 multicolored Performance Pads. Superior club-ready sound and a host of advanced features are at your fingertips at all times with the sturdily built, single unit. -->
