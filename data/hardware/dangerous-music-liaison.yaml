url: https://www.dangerousmusic.com/product/liaison
description: Instant recall is no longer just for digital. With the LIAISON from
  Dangerous Music you can store and recall complex analog patches that include
  up to six stereo or mono analog paths.
details: |-
  At the core of the LIAISON is a set of no-compromise analog circuits developed by Dangerous Music's head designer, Chris Muth. Audiophile-grade components are used throughout the LIAISON's 100% passive analog relay switching system.

  Connect up to six favorite outboard units to the LIAISON. Instantly audition any device or combination, change the order, dial in some parallel processing, and store customized signal paths as presets for instant recall. True hard-wire bypass relays remove outboard gear entirely from the signal path, even units without their own bypass.

  With the onboard, latency-free, audiophile-grade parallel buss, users can blend processed and unprocessed signals for parallel effects on the even-numbered inserts (2, 4, 6); flip buttons let users reverse insert pairs.

  Four monitor outputs provide pre- and post-insert monitoring of both busses. Four onboard memory slots store and instantly recall complex patch combinations; a polarity button reverses phase 180 degrees.
specs: |-
  - Six stereo (or mono) insert loops with true hard-wire bypass relays (5 rear + 1 front)
  - Two independent stereo busses (Buss A, Buss B) with individual XLR in/out
  - Parallel processing loop on even-numbered inserts (2, 4, 6) of Buss B
  - Flip buttons to reverse insert pairs
  - 4 stereo monitor outputs (pre/post Buss A, pre/post Buss B) via single rear DB25 connector
  - 4 onboard memory presets with store/clear/recall
  - Polarity reverse (180°) button
  - Frequency Response (Passive): +0, -0.1dB, 10Hz-100kHz
  - Maximum Level: > +28dBu
  - Noise Floor: < -94.5dBu (22Hz-22kHz bandwidth)
  - THD+N: < 0.002%
  - Crosstalk Rejection (Passive): > 124dB
  - Input Impedance: 20K Ohms
  - Output Impedance: 20 Ohms
