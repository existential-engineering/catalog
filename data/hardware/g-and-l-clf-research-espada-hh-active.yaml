description: Leo Fender's lost design from '69 takes on a new vibe with twin
  humbuckers in the G&L Espada HH Active. It adds a G&L Micro-Preamp in place of
  the passive model's kill-switch, with a 3-way mini-toggle for passive, active
  and active-bright modes.
details: |-
  Leo Fender's lost design from '69 takes on a whole new vibe with twin humbuckers in the G&L Espada HH and Espada HH Active. The latest in double-hum guitars from G&L, they are wrapped in a gorgeous shape tucked away for decades at CLF Research.

  Espada HH Active features a G&L Micro-Preamp to unlock a new dimension of tones. For active duty, the kill-switch on the passive Espada HH is replaced by a 3-way mini-toggle to control the preamp modes (passive, active and active-bright). Left off, everything still works, but switched on it reveals more of the pickups' natural harmonic complexity. It is classic Leo Fender: he solved "the cord problem" with an on-board buffer to shield the pickups from a cord's loading effect. The result is audible in every pickup setting, from jangly single-coil tones that defy split-humbucker expectations, to overdriven humbucker tones with crisp detail and definition. There is always more to explore with Espada HH Active, and every journey is as exciting as the destination.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: G&L AS4255C in neck position; AW4386C in bridge position
  - Body wood: Swamp Ash and Alder
  - Neck wood: Natural Satin Hard-Rock Maple with Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 21 medium jumbo, nickel
  - Tuning keys: Kluson
  - Bridge: Leo Fender-designed G&L Saddle-Lock bridge with forged brass saddles
  - Controls: 3-position pickup selector, volume, treble, bass (PTB system), coil tap switch for both pickups, 3-position pre-amp mode switch
  - Power: battery-powered, 9V (G&L Micro-Preamp)
  - Includes: G&L Deluxe Gig Bag
  - Available in: Jet Black over Alder, 3-ply black pickguard, Rosewood fingerboard
  - Available in: Vintage White over Alder, 3-ply black pickguard, Rosewood fingerboard
  - Available in: Honeyburst over Swamp Ash, 3-ply parchment pickguard, Rosewood fingerboard
  - Available in: Cherryburst over Swamp Ash, 3-ply black pickguard, Rosewood fingerboard
