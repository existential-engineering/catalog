description: |-
  With classic striped style that pays homage to Van Halen's original guitar, giant sound and high-speed playability along with player-oriented features, this latest take on the Wolfgang Special is ready to crank out some serious rock.
  Features an arched top basswood body with a robust graphite-reinforced quartersawn maple neck - carved and rolled to EVH's exacting specifications. The speedy 12"-16" compound radius ebony fingerboard facilitates energetic riffing and blazing leads, and is the only Wolfgang Special finish to feature an ebony fingerboard besides the Stealth model. Also new for a Wolfgang Special model is its chrome hardware and non-matching black headstock, while other familiar traits include 22 jumbo frets and heel-mounted spoke wheel for easy truss rod adjustment. The crystal clear Custom Designed EVH Wolfgang Humbucking pickups are direct mounted, supplying girth and sparkle, as well as near-endless sustain to power chords and melody lines. Every component of the guitar has been selected and positioned for high-speed playing.
  The low-friction volume knob lets you perform speedy violin-like volume swells with ease while the tone knob resists easy turning - avoiding unwanted tonal shifts as your picking hand flies furiously across the strings. The rock-solid EVH-branded Floyd Rose® Locking Trem combines with the Floyd Rose Locking nut to maintain precise tuning, no matter how insane your whammy-bar histrionics get. The EVH D-Tuna® retunes to Drop-D and back with strict accuracy at the mere flick of a finger, making this the only guitar you'll need onstage.
