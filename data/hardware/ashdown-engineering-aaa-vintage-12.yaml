name: AAA Vintage 12
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/aaa-vintage-12
description: The AAA Vintage 12 is a compact, feature-packed practice and
  rehearsal bass combo combining a 75W power amp with a high-quality Ashdown 12"
  bass speaker. High and Low impedance inputs handle active or passive basses,
  and a tube-emulated drive control takes your tone from warm and clean to fat
  musical distortion. Its App-Tek socket connects to smartphone and tablet
  amp-sim and effects apps (including Ashdown's own ABM Pre app), and a DI
  output feeds a mixer or PA.
details: |-
  Ashdown AAA-series bass combo. 75W power amp driving a single Ashdown 12" bass speaker. Three-band EQ (Bass, Middle, Treble). High and Low impedance instrument inputs for active or passive basses. Tube-emulated drive control. App-Tek connection (via a supplied 4-pole mini-jack cable) for integration with smartphone/tablet amp-sim and effects apps, including the ABM Pre app on Agile Partners Amp Kit. Line input for an MP3 player, headphone output with speaker-mute switch for silent practice, and a DI output for recording or sending direct to a mixer. Tough cabinet with quality coverings, metal corners and quality components. Power output: 75W. Speaker configuration: 1 x 12". Dimensions (H x W x D): 480 x 415 x 335 mm. Weight: 14 kg.
specs: |-
  - Power output: 75W
  - Speaker configuration: 1 x 12"
  - EQ: Bass, Middle, Treble
  - High and Low impedance instrument inputs
  - Tube-emulated drive control
  - App-Tek connection (4-pole mini-jack)
  - Dimensions (H x W x D): 480 x 415 x 335 mm
  - Weight: 14 kg
