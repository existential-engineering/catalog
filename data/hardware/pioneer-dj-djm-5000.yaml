details: |-
  4-channel 19-inch rack mountable digital mixer.

  Mobile DJs need more these days: more flexibility, more compatibility, more possibilities and more punch. These requirements are now met by the latest addition to the trusted DJM mixer family – the DJM-5000. The 4-channel mixer boasts several standout innovations that place a premium on DJ dynamism, usability and professional style . The ideal companion for our MEP-7000 media player, the DJM-5000 delivers 96 kHz/24-bit sound and is also fully MIDI-enabled . Its built-in sound card for the laptop DJ guarantees quick and convenient PC/Mac connectivity , while three microphone channels together with four mic effects and an Advanced talk over application allow meticulous control over MCs, announcements and vocals. It also offers a dedicated Master/Zone output facility , enabling one DJ to manage two separate outputs across two different locations. Adding to its knockout credentials, the DJM-5000 includes a new Sound Maximizer function that boosts EQ dynamics to suit play in any environment and breathe new life into MP3’s.
specs: |-
  - 4-channel 19-inch rack mountable digital mixer
