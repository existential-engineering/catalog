details: |-
  The Altec Lansing BoomJacket is the perfect companion for your active lifestyle, delivering bold sound and rugged durability in a compact, go-anywhere design. With an IPX7 waterproof rating, it's fully submersible and even floats, so you can bring it to the pool, beach, or lake without worry. Designed for ultimate portability, the BoomJacket features multiple mounting options including a built-in magnet that sticks to most metal surfaces, an included speaker mount, and a carabiner clip—giving you the flexibility to #MountIT, #ClipIT, or #StickIT wherever your adventure leads. With up to 24 hours of playtime, you'll enjoy non-stop music from morning to night, and the USB-C quick charge feature gets you back to full battery faster than ever. Take your audio experience even further by pairing two BoomJacket speakers together via True Wireless Pairing for immersive stereo sound. Plus, with a 100-foot Bluetooth wireless range, you can move freely without losing connection. Whether you're on the trails, by the water, or in your backyard, the BoomJacket brings rugged performance, reliable power, and seriously impressive sound wherever you go."
