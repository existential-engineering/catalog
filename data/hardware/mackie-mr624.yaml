description: "Express your creativity and mix like a pro. Professional and
  robust, Mackie MR624 powered studio monitors provide an accurate
  representation of the entire frequency spectrum, so you can create
  professional mixes that sound great anywhere."
details: |-
  Mackie has set the bar for professional studio monitors since the beginning. In 2008, the MR Series proved that speakers with a smaller price tag can meet the demands of professional studios—and Mackie studio monitors carry that torch. Featuring a logarithmic waveguide and Acoustic Space Control, these 6.5" monitors provide an enhanced stereo image with stunning clarity. Whether you're a content creator, musician or audio engineer, you can create professional mixes that sound pristine on any playback device.
specs: |-
  - 6.5" polypropylene woofer
  - 1" silk dome tweeter
  - 65W bi-amplified Class A/B amplification
  - Frequency response: 38 Hz – 20 kHz
  - Logarithmic waveguide with ultra-wide dispersion
  - Adjustable Acoustic Space and HF filters for room optimization
  - All-wood cabinet with internal bracing
  - Compatible with MRS10 companion subwoofer
