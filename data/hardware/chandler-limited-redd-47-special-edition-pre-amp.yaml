description: The REDD.47 Special Edition Pre Amp is a mono microphone
  preamplifier built with 53 new-old-stock and vintage parts from the 1960s and
  1970s, authentically recreating the sound of the original EMI REDD.47
  amplifier from the legendary REDD.51 mixing console.
details: |-
  The REDD.47 Special Edition Pre Amp is a mono tube microphone preamplifier developed by Chandler Limited in partnership with EMI Abbey Road Studios. It is built with 53 new-old-stock and vintage parts from the 1960s and 1970s, including Piher, ISKRA, Beyschlag, and ERO/Roederstein resistors and Siemens, Wima, ERO, Roederstein, and Mullard 'tropical fish' capacitors. Wade Goeke integrated these vintage components into the core REDD.47 tube/valve signal path (EF86, E88CC) while adding the Input Sensitivity, Line Input, and Bass Lift sections from the original REDD.51 console. The unit features a new layout mirroring the iconic look of original REDD console cassettes, including a new EMI lighted sign. It is designed in partnership with Abbey Road Studios and EMI.
