description: Versatile filter with overdrive.
details: |-
  The Black Multimode VCF has simultaneous high pass, band pass and low pass outputs and CV control over cutoff and resonance, which suits serious modular patches where one source needs to be split across several filter slopes at once.

  At the core of this VCF is a highly stable custom multimode VCF chip, the AS3320, produced in Riga. A cutoff CV level attenuverter sets the depth and polarity of incoming modulation, and the filter self oscillates when resonance is taken high enough.

  A bonus feature is a unique, adjustable germanium diode overdrive circuit on the VCF input, so the signal can be driven into the filter rather than only cleaned up by it.

  Erica Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. When designing the Black Series, Erica Synths did not economise on module width, putting design and usability first.

  Audio output amplitude is 10V peak to peak and a full CV sweep is 10V peak to peak. The panel is 10HP wide at a depth of 35mm, the skiff-friendly design suits shallow cases, and power draw is 27mA on the +12V rail against 29mA on the -12V rail.
specs: |-
  - Simultaneous HP, BP and LP outputs
  - CV control over Cutoff and Resonance
  - Self-oscillation
  - Cutoff CV level attenuverter
  - Adjustable germanium diode overdrive
  - Skiff-friendly design
  - Custom multimode VCF chip AS3320
  - Audio output amplitude 10 Vptp
  - CV input (full sweep) 10 Vptp
  - Panel width 10HP
  - Module depth 35mm
  - Power consumption 27mA@+12V, 29mA@-12V
