description: This DW Rack includes mounted stainless steel tubing, Cymbal Boom Arms, built-memory locks, and more.
details: |-
  This DW Rack System is a heavy-duty solution to expand your existing setup and expedite hardware setup and teardown for live performance. This rack features 1.5″ stainless steel tubing for long-term durability, soft-grip rubber feet with integrated spikes for stability, and tube-mounted Cymbal Boom Arms for cymbal placement.

  The rack also features DW-branded built-in memory locks and a level to help you find your ideal positioning on the first go. Furthermore, built-in hi-torque wingnuts ensure the rack stays taut in play.

  The package includes one 42″ curved 1.5″ bar, two 36″ straight 1.5″ bars, two leg assemblies, two perpendicular rack clamps, two 1.5″ to V-clamps for cymbal tubes, two short boom arm assemblies, three 1.5″ V-clamps, nine 1.5″ memory locks, one hi-torque drum key and one rack level with DW logo.

  A retractable spur with thumb adjustments enhances rack stability based on the type of flooring, the redesigned Tri-Clamp keeps tubing and mounts tight during play, and heavy-duty coated wing nuts let you apply more torque without discomfort to your hands.
