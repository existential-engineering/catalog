details: |-
  The Pro-Mod Signature Rick Graham DK24 2PT MPL is a 6-string signature electric guitar developed in collaboration with virtuoso guitarist Rick Graham. It pairs a Dinky alder body with a distressed nitrocellulose lacquer finish in Worn Shell Pink, evoking the well-worn aesthetic of a favorite pair of jeans while preserving the resonant, organic tonal qualities of a true nitro finish.

  The bolt-on maple neck features graphite reinforcement, a satin finish, and rolled fingerboard edges for comfortable playability. A 12" to 16" compound radius maple fingerboard with 24 jumbo frets, black dot inlays, and Luminlay side dots sits atop a Graph Tech TUSQ XL nut (1.6875"). The headstock is a reverse licensed Fender Stratocaster shape mounted with a 4-bolt recessed neck plate.

  Electronics consist of an HSS pickup configuration: a Charvel Custom Humbucking bridge pickup with Charvel Custom Single-Coil middle and neck pickups, all in parchment. Controls are master volume and tone with a 5-position blade selector that offers Bridge / Bridge Inner Coil + Middle / Bridge Outer Coil + Neck / Middle + Neck / Neck.

  Hardware includes a Gotoh Custom 510 tremolo with Gotoh tremolo arm, Charvel-branded die-cast locking tuners, and dome-style control knobs, all in chrome finish. The guitar ships strung with nickel-plated steel strings (.009-.042) and a Charvel Multi-Fit Hardshell Gig Bag (P/N 0994742100).
