description: Wash Away. Intellijel Swells is a multi-model reverb module with a
  built-in SWELL Generator. Choose from nine unique reverb models passionately
  researched and developed by Intellijel.
details: |-
  Swells is a multi-model reverb module with a built-in SWELL Generator, offering nine unique stereo reverb models researched and developed by Intellijel — from lush halls and plates, to reimagined vintage digital devices, to bizarre and otherworldly "spaces" (Fog, Blur, Shadow, Velvet, Asterion, Deadspace, Buckets, Ritual, and Gaze).

  Each reverb model has a comprehensive set of controls, including eight dedicated sliders for PRE-DELAY, SIZE, DECAY, HI/LO DAMPING, and EQ, plus two unique-per-model controls called EBB and FLOW. A DRIVE option saturates the signal fed into the reverb, and all controls respond smoothly to internal and external modulation.

  The SWELL generator creates waves of modulation. It is, essentially, a multi-mode envelope follower that can be triggered from the input signal, output signal, or a dedicated external sidechain input, or manually via the SWELL button. Its output is normalled to all reverb parameters for instant self-modulation, and it also has a dedicated output for sending swells of modulation to other modules.

  Additional processors — FREEZE, REVERSE, BURST, and LO-FI — add further character. FREEZE captures a slice of audio for infinite sustain through the reverb. REVERSE flips the audio playback from the pre-delay. BURST triggers momentary effects such as a burst of noise or a surge of pre-delay feedback. Any or all of these functions can be assigned to the TRIG input. LO-FI applies a model-specific effect that degrades or modifies the audio through the reverb.

  Swells offers 96kHz 24-bit stereo I/O with 32-bit floating point internal processing, and nine CV inputs with attenuverters for deep modulation of its parameters.
specs: |-
  - Width: 20HP
  - Depth: 30mm
  - Power: 117mA @ +12V, 6mA @ -12V
  - Nine unique stereo reverb models (Fog, Blur, Shadow, Velvet, Asterion, Deadspace, Buckets, Ritual, Gaze)
  - 96kHz 24-bit stereo I/O, 32-bit floating point internal processing
  - Nine CV inputs with attenuverters
  - SWELL Generator: multi-mode envelope follower with RISE, FALL, THRESHOLD
  - Selectable envelope-follower audio source: IN / Side Chain / OUT
  - Selectable LO-FI depth (OFF / MIN / MAX)
  - FREEZE, REVERSE, and BURST performance processors
  - Assignable TRIG input for FREEZE, BURST, REVERSE, SWELL, or REVERSE sync
  - Send/Return mode to disable the dry signal path
