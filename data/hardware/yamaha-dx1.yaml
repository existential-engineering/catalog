description: >-
  Yamaha's flagship FM synthesizer featuring a dual 6-operator engine, essentially two DX7s in a
  premium wood-paneled case with a 73-note weighted keyboard and greatly improved editing interface.
details: |-
  The DX1 sat at the top of Yamaha's legendary DX line, replacing the DX7's membrane buttons with real push-buttons and multiple display screens showing amplitude modulation, envelopes, velocity, levels, and detuning parameters. This made the notoriously complex FM synthesis far more approachable for programmers and performers alike.

  At its core the DX1 houses two independent 6-operator FM engines that can be layered or split across the keyboard. In single-patch mode it delivers 32-voice polyphony, dropping to 16 voices when running both channels simultaneously. The sound carries the signature crystalline FM character but with a noticeably fatter quality than the standard DX7.

  With only approximately 140 units ever manufactured and a staggering original retail price of $13,900 in 1985, the DX1 remains one of the rarest and most collectible FM synthesizers ever produced. Notable users include Depeche Mode, Vince Clarke, Kitaro, Elton John, and Herbie Hancock.
specs: |-
  - Polyphony: 32 voices (single patch), 16 voices (dual patches)
  - Oscillators: Dual 6-operator FM engines
  - Multitimbral: 2 parts (Channel A and B)
  - LFO: Sine, square, triangle, sawtooth up/down, random
  - Envelopes: 6 envelope generators with 8 parameters each
  - Keyboard: 73 weighted keys with velocity and aftertouch
  - Memory: 64 performances, 32 ROM + 32 RAM patches, external cartridge
  - Control: MIDI, CV
  - Effects: None
