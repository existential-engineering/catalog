description: A passive latching mute switch for CV and audio signals in a hybrid
  1U/0hp format, providing tactile click feedback to toggle a signal on or off
  without imparting actuation noise.
details: |-
  Be quiet! Choosing when a signal should and should not be present is key to performance. For non-Eurorack musicians, we know this state as "not doing anything" or syncope if you want to get really fancy. But plugging and pulling patch cables is rarely the best method of muting a signal - fortunately, there are other solutions, fancy, active mute modules like the 4hp Stum as well as less fancy, passive mute modules like the 2hp Apnea 3 . But what if you want to mute just one particular thing, at exactly the right time, and you had neither power nor rackspace to sacrifice in pursuit of your goal? What then? Operation couldn't be easier: click the switch, and your signal is muted. That's it. You want that signal to come back? Give it another click! Best of all, the switch gives you a tactile bump and click, so you are never in doubt about whether you have pressed it, without imparting actuation noise on your sound or signal. No power, no space? No problem. The hybrid 1U/0hp format means you can easily install it as a 5hp 1U unit in a 1U rail, or take it on the go (or on the run) with a brass-threaded enclosure, allowing you to install and uninstall it at your leisure. I have traveled the world in search of the finest and most skilled switchmakers, just to give you the best switching experience I can. Not all switches are made equal, but these are made very well, and the difference will matter next time you need to unmute that sick LFO modulation on your stereo reverb. Still not convinced? I guarantee you won't find a better passive mute experience anywhere, except possibly for physically cutting your patch cables in half and soldering them back together live on stage, but you wouldn't do that, because after all, there is a better way,
specs: |-
  - Accepts both CV and audio signals
  - High quality switch for noise-free operation
  - Tactile feedback lets you hear and feel the click of the switch
  - Passive design: no external power, no batteries
