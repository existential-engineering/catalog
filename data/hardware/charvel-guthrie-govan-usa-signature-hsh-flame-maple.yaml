description: Developed over two years of meticulous work with virtuoso guitarist
  Guthrie Govan, this San Dimas Style 1 signature model is positioned as the
  ultimate ultra-pro guitar, featuring premium caramelized wood construction and
  high-performance specifications for demanding professional play.
details: |-
  The Guthrie Govan USA Signature HSH Flame Maple is built on a caramelized basswood San Dimas Style 1 body with a flame maple top, finished in thin satin urethane (Natural).

  The bolt-on neck is caramelized flame maple with graphite reinforcement and a contoured heel (no neck plate), capped with a caramelized flame maple fingerboard featuring a 12" to 16" compound radius spanning two octaves, 24 extra jumbo stainless steel frets, ebony ring inlays with maple dot centers, and Luminlay side dots. The bone nut measures 1.6875" (42.86 mm) across a 25.5" scale, and the heel-mount truss rod adjustment wheel allows quick relief tweaks.

  Electronics consist of three Charvel Custom MF pickups in HSH configuration (brown bridge humbucker, single-coil middle, neck humbucker), routed through volume and tone controls with Luminlay numbered dome knobs, a 5-way blade switch, and a 2-way mini-toggle for single-coil simulation.

  Hardware highlights include a U.S.-made Charvel locking recessed tremolo with oversized brass block and Tremol-No unit, pop-in tremolo arm, Gotoh MG-T locking tuners, side-mount oval output jack, brass control position marker inlays on the body, and a licensed Fender Stratocaster headstock. The guitar ships strung with .010-.046 nickel-plated steel and includes a hardshell case.
