description: The semi-hollow ASAT Classic Bluesboy adds G&L's twin voice
  chambers and an f-hole to a sassafras body. It pairs a G&L alnico humbucker in
  the neck with a single-coil G&L Magnetic Field Design bridge pickup.
details: |-
  The G&L ASAT Classic Bluesboy is a factory-modded version of Leo's final word on the traditional single-cutaway bolt-on guitar, and the semi-hollow version takes it further with G&L's distinctive twin voice chambers and f-hole added to a beautiful sassafras body. Like its solid-body stablemate, this axe delivers a well-balanced pairing of a G&L alnico humbucker designed by Paul Gagon and a single-coil G&L Magnetic Field Design bridge pickup designed by Leo Fender.

  Framed in a classic boxed-steel bridge, the single-coil MFD bridge pickup delivers crisp attack with complex harmonics while individual brass saddles offer modern levels of intonation refinement. Flipping to the neck humbucker reveals all the charismatic warmth a player could ask for. Together the two pickups open up the limits of this guitar's surprising versatility. The semi-hollow body softens the midrange attack, accentuating the low and high harmonics.

  The Tribute Series ASAT Classic Bluesboy Semi-Hollow is dripping with authentic G&L mojo at a price attainable for every working musician.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: G&L AS4255C Alnico neck humbucker, Leo Fender-designed G&L MFD single coil bridge pickup
  - Body wood: semi-hollow Swamp Ash top on Poplar with twin voice chambers and f-hole
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck width at nut: 1 5/8"
  - Neck radius: 9-1/2"
  - Neck profile: medium C
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: 18:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 3-position pickup selector, volume, tone
  - Available in: Red Burst over Swamp Ash top on Poplar, 3-ply White Pearloid pickguard, Rosewood fingerboard
  - Available in: 3-Tone Sunburst over Swamp Ash top over Poplar, Tortoise pickguard, Maple fingerboard
  - Available in: Clear Orange over Swamp Ash top on Poplar, 3-ply Cream pickguard, Maple fingerboard
