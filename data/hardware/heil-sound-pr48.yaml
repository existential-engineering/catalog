details: |-
  Product Overview

  The Heil PR 48 is a professional dynamic microphone purpose-built specifically to capture kick drums and low-frequency, high-SPL instruments. Engineered with a large 1.5-inch dynamic diaphragm element sealed inside a vulcanized shock mount, the PR 48 delivers massive low-end punch, round sub-bass thump, and clear click articulation without requiring heavy outboard EQ correction.

  Featuring a tailored frequency response spanning 30 Hz to 8.5 kHz, the PR 48 incorporates a specially designed low-pass filter that creates a boost in the sub-bass frequencies (60 Hz – 100 Hz) followed by a rise around 4.5 kHz to highlight beater attack, before steeply rolling off above 8.5 kHz to eliminate high-frequency cymbal bleed and snare rattle. With an exceptional -40 dB of rear noise rejection at 180° off-axis and an extreme maximum pressure handling of 148 dB SPL, the PR 48 is an indispensable workhorse for live sound reinforcement and studio drum tracking on kick drums, bass guitar speaker cabinets, and floor toms.
specs: |-
  - Purpose-Built for Kick Drums & Bass: Custom-voiced specifically for kick drum port placement, floor toms, bass guitar cabinets, and low-frequency acoustic instruments.
  - Large 1.5" Dynamic Diaphragm: Heavy-duty dynamic capsule sealed in a vulcanized internal shock mount to isolate low-frequency rumble and mechanical stand noise.
  - Internal Tailored Low-Pass Filter: Features a built-in filter providing low-end extension (60 Hz – 100 Hz) and a presence peak at 4.5 kHz for beater attack, while drastically attenuating frequencies above 8.5 kHz to reject cymbal spill.
  - Exceptional Rear Noise Rejection (-40 dB): Cardioid polar pattern provides stellar isolation at 180° off-axis, preventing stage bleed and unwanted bleed from nearby instruments.
  - Extreme SPL Capacity (148 dB Max SPL): Handles intense sound pressure levels inside bass drums and in front of high-wattage bass stacks without clipping or mechanical distortion.
  - Built-In Swivel Stand Mount: Integrated heavy-duty threaded mount connects directly to standard microphone boom arms and short floor stands.
  - Passive Dynamic Design: Requires no phantom power (+48V); connects directly via standard 3-pin XLR.
  - Element Type: Dynamic (1.5″ Large Diaphragm).
  - Frequency Response: 30 Hz – 8.5 kHz.
  - Polar Pattern: Cardioid.
  - Rear Rejection (@ 180° off-axis): -40 dB.
  - Impedance: 250 ohms balanced.
  - Output Level (@ 1 kHz): -59 dB.
  - Max SPL: 148 dB.
  - Weight: 20.33 oz (576.3 g).
  - Output Connection: 3-pin XLR.
  - Mounting Connection: built-in integrated swivel mount with 5/8″-27 threads.
