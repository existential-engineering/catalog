details: |-
  The Yamaha RM1x arrived in 1999 as a dedicated pattern-based music production tool designed specifically for electronic dance music. Its 654 onboard sounds and 46 drum kits were carefully curated for trance, house, hardcore, and related genres, delivering analog-modeled basses, pads, and percussion that could be immediately deployed in a production context without extensive programming.

  The workflow centered on pattern-based composition with 60 preset and 50 user patterns, each offering 16-part multitimbral playback from the 64-voice polyphonic engine. Creating custom phrases was streamlined through direct access to variation, instrument, sound, tempo, filtering, LFO, and effects parameters, allowing users to quickly morph preset patterns into original material. The 110,000-note sequencer provided ample capacity for building complete arrangements across 20 user songs.

  Real-time sound shaping was a core strength, with a low-pass filter offering dedicated cutoff, resonance, and envelope controls for sculpting sounds during performance. The effects section was generous for a device of this era, providing 11 reverb algorithms, 11 chorus types, and 43 variation effects that could be applied and adjusted on the fly.

  Produced from 1999 to 2002, the RM1x earned a following among electronic artists including Apollo 440, Crystal Distortion, and Signal Electrique. Its combination of inspiring preset content, hands-on control, and a capable sequencer made it a popular choice for both live electronic performance and studio sketch work, particularly among producers who preferred hardware-based workflows over computer-centric production.
