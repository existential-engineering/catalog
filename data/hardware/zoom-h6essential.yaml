description: The H6essential Handy Recorder features an interchangeable mic
  capsule system and 32-bit float recording for up to 6 tracks, delivering
  unprecedented quality.
details: |-
  With 6 tracks of 32-bit float recording, the H6essential provides unprecedented quality and unmatched versatility. 32-bit float and dual A/D converters capture a huge dynamic range, giving creators the ability to record clip-free every time with no need to set gain.

  The 4 XLR/TRS combo inputs carry ultra-clean Zoom preamps and locking connectors, and the included X/Y microphone capsule captures up to 135 dB SPL. A built-in mixer adjusts each track's level, and gain can be fine-tuned while recording to reduce post-production editing. The full-color LCD shows a waveform display so audio is visible as it records.

  The 3.0 capsule system has been updated to support 32-bit float. The XYH-6e adds two microphones in an X/Y stereo arrangement, the SSH-6e pairs a super-directional centre mic with a bidirectional side mic for a mid-side image adjustable from mono to ultra-wide, and the EXH-6e adds two more XLR/TRS combo inputs plus a 3.5 mm jack with plug-in power for lavalier mics. When the X/Y mic is not needed the capsule detaches and the included cap gives a low-profile setup.

  The USB-C port connects to PC, Mac, iOS and Android to use the H6essential as a 32-bit float interface while simultaneously recording all 6 tracks to the SD card. Outputs are a 3.5 mm line output for connecting to a camera, a 3.5 mm headphone output for monitoring, and an onboard speaker for quick reference playback. Recording and rotary controls are designed for silent operation.

  A firmware update for the Essential Series added AI Noise Reduction to lower the noise floor by removing steady background noise, gain adjustment during recording, and MP3 recording for smaller files. The BTA-1 Bluetooth Adapter pairs with an iOS device to start recording, adjust the mix, view waveforms and change settings remotely, and receives wireless timecode from the ATOMOS UltraSync BLUE. The TCA-1 adapter generates and jams timecode within 0.5 frames over 24 hours. The Essential Series was the first Handy Recorder line designed with accessibility for the blind and visually impaired, with audible menu descriptions in English, Spanish, French, Japanese, German, Italian or Chinese.
specs: |-
  - Up to 8 simultaneous recording tracks and 6 simultaneous playback tracks
  - Recording formats: WAV at 44.1/48/96 kHz, 32-bit float, mono or stereo, BWF and iXML supported. MP3 at 128, 256 or 320 kbps
  - Recording media: microSDHC cards 4 to 32GB, microSDXC cards 64GB to 1TB
  - XY mic capsule (XYH-6e): 90 degree XY stereo format, unidirectional, -42 dB/1Pa at 1 kHz sensitivity, 135 dB SPL maximum sound pressure input
  - MIC/LINE inputs: 4 XLR/TRS combo jacks with locking connectors (XLR 2 hot, TRS tip hot), gain adjustment unnecessary thanks to dual A/D converter circuits
  - Input impedance: 3.8 kohms or more on XLR mic, 39 kohms or more on TRS line
  - Maximum input level: +4 dBu on XLR mic, +24 dBu on TRS line
  - Phantom power: +48 V, 32 mA or less channel total
  - Equivalent input noise: -120 dBu or less (IHF-A) at 150 ohm on XLR mic, -95 dBu or less (IHF-A) at 600 ohm on TRS line
  - LINE OUT: stereo mini jack, maximum output level +1 dBu, output impedance 110 ohms or less
  - Headphone out: stereo mini jack, maximum output 20 mW + 20 mW into a 32 ohm load, output impedance 10 ohms or less
  - Built-in mono speaker: 20 mm x 30 mm elliptical dynamic, 250 mW effective maximum output
  - Display: 2.0 inch full-color LCD, 360 x 240
  - USB: USB Type-C connector, USB 2.0 High Speed for audio interface and file transfer
  - Audio interface: 6 in / 2 out (multi) or 2 in / 2 out (stereo), 44.1/48/96 kHz interface only, 44.1/48 kHz with onboard recording, 24-bit and 32-bit float
  - Remote: dedicated ZOOM BTA-1 wireless adapter
  - Power: 4 AA alkaline, lithium or rechargeable NiMH batteries, USB bus power, or the ZOOM AD-17 AC adapter (DC 5 V/1 A)
  - Battery life on alkalines: about 18 hours 2-track, about 3.5 hours 6-track at 48 kHz
  - Maximum power consumption: 5 W
  - Dimensions: recorder 78.1 mm (W) x 160.1 mm (D) x 42.8 mm (H), XYH-6e capsule 69.1 mm (W) x 50.8 mm (D) x 43.0 mm (H)
  - Weight: recorder 381 g including batteries, XYH-6e capsule 42 g
  - AI Noise Reduction to lower the noise floor by removing steady background noise
  - Gain adjustment during recording and a built-in mixer for per-track levels
  - Compatible with Zoom capsule system 3.0 (XYH-6e, SSH-6e, EXH-6e)
  - Timecode generation and jam sync via the TCA-1 adapter, wireless timecode from the ATOMOS UltraSync BLUE with the BTA-1
  - Voice Guidance accessibility in English, Spanish, French, Japanese, German, Italian or Chinese
