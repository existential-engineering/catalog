description: Multi-Voice Instrument Synthesizer
details: |-
  Enzo is a multi-voice synthesizer that tracks a guitar for tight monosynth leads, complex chord polyphony, or multi-note sequenced arpeggiation, all without any special pickup installation. It is not limited to guitar, and can be used on any instrument, including drum machines, vocals or other synths.

  The full synth palette of multimode analog-style synth filters, ring modulation, envelopes and more drives punchy, thick synth textures, or the pure instrument signal can be transformed into an altered state with pitch, time and modulation effects.

  Enzo provides stereo input and output, with switchable input/output headroom level for guitar or synth/line level. The multi-function EXP jack supports MIDI in/out via a compatible MIDI-to-TRS conversion box, preset switching, an expression pedal, or a tap switch, and presets are available via an external 4-preset switch or MIDI, with MIDI beat clock synchronization.
specs: |-
  - Colossal multi-voice dual oscillator synth architecture with selectable waveforms
  - Three synth modes: Poly Synth, Mono Synth, and Arpeggiated Synth
  - Two Tap Delay with Time, Feedback, Modulation and two-stage level control (530 mS max delay time)
  - Custom 6-mode filter with frequency, bandwidth (resonance), and envelope
  - Adjustable compressor with threshold and mix for the input signal (Dry mode)
  - Conversion: 24-bit A/D and D/A
  - DSP: 32-bit floating point
  - Bypass: Selectable True Bypass (Relay) or Analog Buffered Bypass
  - Current draw: < 150 mA
  - Dimensions: 4.25" wide x 4.5" long x 2" tall
