description: 4+1 channel all-analogue DJ mixer with the legendary Xone:VCF
  filter (HPF/BPF/LPF with resonance), 3-band total kill EQ, X:FX external FX
  loop, replaceable crossfader with three curve settings, balanced XLR main
  outputs and independent booth/record outputs.
details: |-
  4+1 Channel Analogue Mixer — a 4+1 channel DJ mixer delivering the famous Xone analogue audio quality in a familiar layout for classic setups in clubs, bars and at home.

  100% Analogue — created for DJs and electronic music purists, Xone:43 is a 4+1 channel DJ mixer that offers the very best of analogue audio quality.

  The 43 features the legendary Xone filter with resonance control, 3 band EQ, crossfader with three curve settings and X:FX for send/return to your favourite FX unit.

  With balanced XLR main outputs, independent booth and record outputs, Xone:43 excels in the club and in high end personal DJ setups.

  Analogue Isolator EQ — each stereo channel features 3-band EQ with Total Kill on each band for precision sculpting of tracks, bassline swaps and creative transitions.

  The Legendary Xone Filter — a freely assignable filter delivers all the power of the legendary Xone VCF system with three modes (HPF, BPF and LPF) plus cutoff and resonance controls for complete control.

  X:FX — Xone:43 provides an FX loop with channel X:FX controls for a simple and intuitive way to integrate your favourite FX unit.

  Faders For Your Mixing Style — the Xone:43's crossfader has three switchable curve settings to suit your mixing style, and can be easily upgraded for ultimate crossfader performance. The channel faders are designed for longevity and precision whether you're in the club or in the lounge.

  Features: 4 channels with phono/line inputs; Xone:VCF filters; 3-band isolator EQ; external FX loop with dry/wet control per channel; XLR mic input with 2-band EQ; independent XLR Master, and RCA Booth and Record outputs; touring grade build quality; Innofader compatible.
