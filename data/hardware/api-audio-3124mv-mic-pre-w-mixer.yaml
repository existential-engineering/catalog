id: 1BQiqu-CPrrX7BftZTC7I
name: 3124MV Mic Pre w/ Mixer
manufacturer: api-audio
primaryCategory: preamp
categories:
  - mixer
  - rack-mount
url: https://apiaudio.com/product/3124mv-mic-pre-w-mixer/
description: 4-channel rack-mount mic preamp with integrated stereo mixer. Each
  channel features API 2520 op-amp and AP2516 input transformer, 48V phantom
  power, 20 dB pad, polarity switch, stereo panning, post-fader aux send, and
  per-channel insert points. Includes master stereo mix outputs (balanced XLR +
  unbalanced 1/4"), aux return, and VU metering.
details: 1U 4-channel mic preamp with integrated stereo mixer. Four front-panel
  unbalanced 1/4" line inputs and one front Hi-Z input (all switchable). Four
  front and rear XLR mic inputs (switched). Per-channel 20 dB pad, polarity
  switch, 48V phantom, stereo panner with level, post-fader aux send. Rear
  insert points per channel. Balanced XLR and unbalanced 1/4" stereo mix
  outputs. API 2520 op-amps and AP2516 input transformers throughout.
specs: |-
  - Channels: 4
  - Gain (mic): 10–65 dB
  - Gain (unbalanced): 14–50 dB
  - Mic input impedance: 1,500 Ω
  - Hi-Z input impedance: 470 kΩ
  - Output impedance: <75 Ω (transformer balanced)
  - Frequency response: 10 Hz–20 kHz (+0/−5 dB)
  - EIN (mic): -129 dBu
  - EIN (unbalanced): -125 dBu
  - THD (+4 dBu): 0.03%
  - THD (+22 dBu): 0.09%
  - Power: 19.2 W
  - Dimensions: 19" W × 1.75" H × 10.5" D
  - Weight: 11.54 lb
