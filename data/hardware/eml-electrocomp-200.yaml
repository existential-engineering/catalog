description: >-
  A monophonic analog synthesizer module from Electronic Music Laboratories
  featuring dual oscillators, extensive patch points, and built-in spring
  reverb, originally designed for educational institutions.
details: |-
  The ElectroComp 200 comes from Connecticut-based Electronic Music Laboratories, a company that produced synthesizers along similar lines to Moog and ARP but primarily targeted the educational market. The unit packs sophisticated features for its era into a nicely designed front panel available in silver or blue variants, with 31 knobs and over 60 patch points for flexible signal routing.

  The synthesis architecture includes two VCOs producing sine, triangle, pulse, and noise waveforms, fed through independent high-pass and low-pass filters. Dual ring modulators, an LFO with sample-and-hold, stereo panning capability, and a built-in spring reverb round out a surprisingly full feature set for a keyboardless module. The unit was designed to interface with the EML Model 300 manual controller or other analog equipment.

  As a keyboardless expander module, the ElectroComp 200 connects to external controllers via CV/Gate, though its oscillators use a non-standard 1.2V/oct tuning scale that requires consideration when interfacing with other manufacturers' gear. Produced from 1969 through 1980, surviving units are relatively rare compared to contemporary Moog and ARP instruments, making them valued primarily as collector's items.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (sine, triangle, pulse, noise)
  - Filter: Lowpass, highpass, 2 ring modulators
  - LFO: 1 with sample-and-hold
  - Envelope: ADS generator
  - Effects: Built-in spring reverb, stereo panning
  - Patch Points: 60+
  - Keyboard: None (expander module)
  - Memory: None
  - Control: CV/Gate (1.2V/oct)
releaseDate: "1969"
