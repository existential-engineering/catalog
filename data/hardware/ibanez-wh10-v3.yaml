url: https://www.ibanez.com/usa/products/detail/wh10v3_01.html
description: Third-generation WH10 wah pedal in a die-cast aluminum body, with
  multiple feedback opamp circuitry, a Guitar/Bass range switch, volume boost,
  and selectable true or buffered bypass.
details: |-
  The WH10 series has remained a highly popular wah pedal through the years due to its many unique features. The WH10V3 continues that legacy with a guitar/bass range switch, a multiple-feedback op-amp circuit, volume boost, and selectable true-or-buffered bypass.

  The die-cast aluminum alloy body with black finish is built for the road. A single Depth control sets the intensity of the effect, while the Effect ON/OFF, Frequency range (Guitar/Bass), and Buffered/True Bypass switches handle the rest of the routing.
specs: |-
  - Controls: Depth
  - Switches: Effect ON/OFF, Frequency range (Guitar/Bass), Buffered/True Bypass
  - I/O: Input (right side), Output (left side)
  - Size: 100(W) x 202(D) x 84(H) mm
  - Weight: 815g
  - Required Current: 12mA@9V
  - Power Supply: One 9V battery or external DC 9V AC adapter
  - Multiple feedback opamp circuit
  - Die-cast aluminum alloy body
