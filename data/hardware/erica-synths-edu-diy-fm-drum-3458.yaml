description: Analog punch and metallic tones.
details: |-
  An FM Drum circuit that fuses analog punch with the metallic tones of FM synthesis. The kit offers a wide range of sounds for a patch, from kicks to toms to metallic clangs, a versatile source of rhythmic elements for a system.

  Erica Synths and Moritz Klein developed the mki x es.EDU series of educational DIY kits with one specific goal in mind: to teach people with little to no prior experience how to design analog synthesizer circuits from scratch.

  What is in the box is not simply meant to be soldered together and then disappear in a rack. Instead, the kit takes the builder through the circuit design process step by step, explaining every choice that was made and how it affects the finished module. The kits in the series are simple and come with extensive user manuals that can be downloaded separately.
