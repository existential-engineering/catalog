details: |-
  The set-through Crescent was a major change-up from the double cuts seen by Kiesel. The aggressive horns and modern carved top create an ideal aesthetic for the modern metal player. Contemporary function lies in the thinner body and increased fret access.

  The neck joint mimics the sound of a set-neck while replicating the widely-preferred feel of a neck-through.

  The standard build is an alder body with a plain maple carved top, rear of body natural clear and natural body binding, with a tung-oiled maple neck carrying a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability.

  Electronics are master volume and tone controls with a 5-way lever style pickup selector feeding direct-mount Kiesel Lithium humbuckers. Bridge choices are a Hipshot fixed bridge or a Hipshot Solo Saddle bridge at .4125 inch (10.5 mm) spacing, and the gallery also shows tremolo-equipped builds.

  Gallery examples cover 6-string (C6X, CT6H) and 7-string (C7X) builds with quilted maple, flamed maple and master grade buckeye tops, ebony, royal ebony and flamed maple fingerboards, and finishes from translucent blue and red through orange burst and custom multi-color vertical fades.
specs: |-
  - Available in multiple string counts, including 6-string and 7-string builds, plus multiscale options
  - Construction: set-through
  - Body: alder with plain maple carved top and rear of body natural clear
  - Binding: natural body binding
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: ebony with 14 inch radius, or ebony with 20 inch radius
  - Frets: 24 stainless steel medium-jumbo, .103 inch wide x .048 inch tall
  - Scale length options: 25.5 inch, and multiscale 25.5 to 26.5 inch, 25.5 to 27 inch, 26 to 27.5 inch
  - Pickups: direct-mount Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 5-way lever style pickup selector
  - Bridge: Hipshot fixed bridge, .4125 inch (10.5 mm) spacing, or Hipshot Solo Saddle bridge, .4125 inch (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: 3 x 3 pointed headstock with maple overlay
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Neck width: 1.69 inch to 2.12 inch wide at the nut depending on configuration, 0.78 to 0.82 inch thick at the 1st fret, 0.88 to 0.90 inch thick at the 12th fret
  - Body dimensions: 37.5 inch long, 1.65 inch thick, 12.75 inch wide across all configurations
  - Weight: 8 lbs to 8.45 lbs depending on configuration
  - Strings: Elixir Nanoweb 1046E
