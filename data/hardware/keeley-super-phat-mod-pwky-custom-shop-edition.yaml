details: |-
  The Super Phat Mod is Keeley's long-running Phat Mod overdrive built as a complete pedal, here in the Custom Shop PWKY colourway with a Blackface-style name badge and metal-flake clear sparkle over gold. The circuit is the Phat Mod duplicated part for part apart from a set of JFETs chosen to emulate old tube amplifiers, a Toshiba device the company settled on after years of trying alternatives.

  The design uses tube-like amp gain stages, a tube amp tone stack and tone shaping circuits intended to suit a range of guitar pickups. Keeley describes the result as full range, highly responsive and dynamic, with a natural break-up that answers to pick attack and the guitar's volume control at high gain settings, and credits the design with the phrase transparent overdrive. The build is true bypass.

  The lineage runs from the Keeley BD-2 modification, which was the first to add a switch giving two bass response modes, the boosted one called Phat mode; that switch survives as the micro toggle on the Super Phat Mod. The same line later produced the Luna Overdrive and then the Katana Blue Drive, which kept active bass and treble controls while smoothing the highs and widening the gain range.
specs: |-
  - JFET gain stages chosen to emulate tube amplifiers
  - Tube amp style tone stack and tone shaping circuits
  - Micro toggle for two bass response modes, including the boosted Phat mode
  - True bypass
  - PWKY Custom Shop colourway, Blackface-style name badge, metal-flake sparkle over gold
