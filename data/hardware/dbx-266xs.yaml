name: dbx 266xs
manufacturer: dbx
primaryCategory: compressor
categories:
  - gate
  - dynamics
url: https://dbxpro.com/en/products/266xs
description: Dual-channel compressor/gate with OverEasy® compression,
  AutoDynamic™ attack/release, program-adaptive expander/gates, and balanced XLR
  plus 1/4" TRS I/O. Supports stereo or dual-mono operation.
details: |-
  The dbx 266xs is a dual-channel dynamics processor designed to smooth uneven levels, add sustain to guitars, fatten drums, and enhance vocal clarity. It features dbx's patented OverEasy® compression technology that provides a smooth, musical response across the knee.

  AutoDynamic™ attack and release controls adapt automatically to program material, making it easy to achieve transparent gain control without manual adjustment. The expander/gate section also uses program-adaptive timing for smooth, natural-sounding release characteristics.

  The 266xs provides separate precision LED displays for gain reduction and threshold monitoring. Selectable OverEasy® or hard knee compression lets users choose between smooth and punchy response. Stereo or dual-mono operation accommodates both stereo bus processing and independent dual-channel use.

  A side chain insert (ring=send, tip=return) allows routing external processors into the detection path for frequency-sensitive or ducking applications. Balanced XLR and 1/4" TRS connectors are provided on all inputs and outputs.
specs: |-
  - Input Connectors: 1/4" TRS & XLR (pin 2 hot)
  - Input Impedance: 40kΩ balanced/unbalanced
  - Max Input: >+22dBu
  - Output Connectors: 1/4" TRS & XLR (pin 2 hot)
  - Output Impedance: 100Ω balanced, 50Ω unbalanced (+4dBu)
  - Max Output: >+21dBu into 2kΩ+
  - Compressor Threshold Range: –40dBu to +20dBu
  - Compressor Ratio: 1:1 to ∞:1
  - Compressor Attack: Program-dependent AutoDynamic™
  - Compressor Release: Program-dependent AutoDynamic™
  - Expander/Gate Threshold Range: –60dBu to +15dBu
  - Expander/Gate Ratio: 1:1 to 4:1
  - Expander/Gate Attack Time: <100µs
  - Expander/Gate Release Time: Program-dependent
  - Bandwidth: 0.35Hz–90kHz, +0/–3dB
  - Frequency Response: 20Hz–20kHz, +0/–0.5dB
  - Noise: <–93dBu unweighted
  - THD+Noise: <0.2% @1kHz
  - IMD: <0.2% SMPTE
  - Dynamic Range: >114dB unweighted
  - Crosstalk: <–95dB, 20Hz–20kHz
  - CMRR: >40dB (typically >55dB @1kHz)
  - Power Consumption: 15W maximum
  - Operating Voltage: 100/120/230VAC, 50/60Hz
  - Operating Temperature: 0°C to 45°C (32°F to 113°F)
  - Dimensions: 1.75" × 5.75" × 19"
  - Weight: 4.84 lbs (2.19 kg)
