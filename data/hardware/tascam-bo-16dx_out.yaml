id: 98IUT46QA4ynykr4QN99H
name: BO-16DX/OUT
manufacturer: tascam
primaryCategory: utility
categories:
  - rack-mount
url: https://tascam.com/us/product/bo-16dx_out
description: Passive 1U rackmount D-Sub to XLR breakout adapter designed for
  professional installation and live sound applications. Converts audio signals
  from two rear-panel D-Sub 25-pin female connectors (AES59-2012 compliant) to
  16 front-panel XLR outputs. Companion to TASCAM ML-16D and ML-32D Dante
  converters, with multiple rackmounting orientations and a shallow 2-inch
  depth.
details: |-
  Fully passive 1U rackmount D-Sub to XLR breakout adapter. Two rear-panel D-Sub 25-pin female inputs (AES59-2012 compliant, 8 channels each) fan out to 16 front-panel XLR 3-pin outputs. No active electronics; requires no power. Shallow 2-inch depth (1.8-inch behind rack ears) with multiple mounting orientations including forward/backward. Companion to TASCAM ML-16D and ML-32D Dante converters for stage boxes, mixing consoles, and audio-over-IP systems.
specs: |-
  - - Rear: 2× D-Sub 25-pin female (AES59-2012, 8 channels each)
  - Front: 16× XLR 3-pin outputs (pin 1: GND, pin 2: Hot, pin 3: Cold)
  - Dimensions: 482.6(W) x 44.1(H) x 51.5(D) mm; weight: 0.9 kg
  - Clearance above connectors: ~13mm (0.5") for XLR lever access
  - Form factor: 1U rackmount; passive (no power required)
  - Included: No.4-40 UNC rack screws ×4
