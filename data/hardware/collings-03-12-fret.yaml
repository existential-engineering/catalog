description: The 03 12-Fret is a single-0 acoustic guitar with softer contours
  and a longer body dimension than its 14-fret counterpart, producing a
  balanced, full tone with slightly more bass and overall volume. It features a
  short 24 7/8" scale and wide 2 5/16" string spacing, making it well-suited for
  fingerstyle playing, strumming, and recording. East Indian rosewood back and
  sides pair with a Sitka spruce top and pre-war scalloped X-bracing for a
  responsive, articulate voice.
details: |-
  The 03 12-Fret is a parlor-sized single-0 acoustic guitar rooted in a body style originally introduced in 1854. Its smaller, softer contours and 12-fret neck joint push the bridge into a sweeter spot on the lower bout, contributing to enhanced bass response and overall volume compared to the 14-fret variant. The short 24 7/8" scale length reduces string tension for comfortable playability, while the wide 2 5/16" string spacing at the bridge accommodates fingerstyle technique. Construction centers on a Sitka spruce top with pre-war scalloped X-bracing and East Indian rosewood back and sides, delivering the balanced projection and warmth associated with vintage small-body acoustics. A Honduran mahogany neck with modified-V profile and ebony fingerboard round out the build. Ivoroid binding with b/w/b/w/b purfling, an abalone rosette, and a chevron backstrip provide tasteful visual appointments.
