specs: |-
  - Bit Depth: 24 bit (44.1 kHz Sample Rate)
  - Frequency Response: 20 Hz - 20 kHz, +/- 0.5 dB
  - Dynamic Range: > 110 dB, 1 kHz @ 0 dBFS, A-Weighted
  - Signal-to-Noise Ratio: > 92 dB Max Out (Dynamic Range)
  - Analog Input (Microphone): 110 mVrms, -60 dBu (minimum)
  - Analog Input (Auxiliary): +15 dBV (maximum)
  - Analog Output (Master, Balanced): +18 dBu (maximum)
  - Analog Output (Master, Unbalanced): +15 dBu (maximum)
  - Analog Output (Booth): +18 dBu (maximum)
  - Speakers Frequency Response: 20 Hz - 20 kHz, +/- 1 dB
  - Network: Wi-Fi
  - Power Connection: External power supply, DC, Center Positive, 12.0 V 3.0 A
  - Power Input Voltage: 100-240 VAC, 50/60 Hz
  - Dimensions (W x D x H): 28.3" x 15.9" x 3.9"
  - Weight: 12.8 lbs.
