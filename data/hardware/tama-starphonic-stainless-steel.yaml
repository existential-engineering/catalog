description: This model features 1mm thick stainless steel which has solid and
  rich resonance. And also its R.S.E. (Resonant Sound Edge) provides an open
  sound and brightness reminiscent of the vintage metal snare drums of the 20's.
details: |-
  R.S.E. (Resonant Sound Edge): TAMA's exclusive R.S.E. ingeniously combines a standard bearing edge with a special air chamber to create a shell capable of a range of sounds that you simply can't achieve with a standard drum.

  Super Sensitive Hi-Carbon Snare Wires: In order to provide a more crisp and sensitve sound, we redesigned our snappy snare, using new materials and customizing the shape of the plate and the wire coil's winding pattern. As a result of these modifications, the new "Super Sensitive Hi-Carbon Snare Wires" fits more closely to the snare side head, demonstrating greater sensitivity and brighter, crisper sound.

  Non-Loosening Rubber Gasket (US.PAT.NO. 7825318): STARPHONIC's claw hooks have a rubber block inside to prevent the tension bolts from loosening during playing. Once the tension bolt is tightened, the claw hook is pressed towards the hoop. This also presses the rubber block inside the claw hook and adds pressure to the tension rod inside.

  Ratchet Style Snappy Tension Adjuster: To prevent the snappy snares from loosening, TAMA incorporated a ratchet system on the strainer's tension adjustment mechanism. Much like an adjustment tool with fine gears, it achieves high-pressure retension, even with extreme settings. Single click adjustments offer a vertical pull of 0.083mm of wire motion, which allows you to achieve ltra sensitive micro-adjustments.

  Detachable Butt Plate: The Detachable Strainer Butt allows you to change your snare side head, but keeps the snare wire tension in its original state. Just loosen the two screws and detach the butt plate with the snappy snares still on. When you reattach tha butt plate, the snare wire tension will be restored to its original position and calibration. The Grooved Snare Side Hoop features an open frame for simpler operation.

  "Linear-Drive" Strainer (US.PAT.NO. 8017846): STARPHONIC's strainer uses a "Linear-Drive" system, which we designed to provide greater control of the lever adjustment arm and more precise control of the strainer's deployment motion. Even if you move the arm rapidly, you will not hear the typical "slap" of the wires hitting the bottom head. The strainer movement is designed to work in a true "linear motion", similar to the motion found on "round sproket" drum pedals. Most strainers are not designed like this and tend to speed up right before the snare wires connect with the snare side head. Also, by tilting the angle of the butt plate 30 degrees, this design holds the snare wire cords or tape more firmly and reduces unnecessary pressure on the strainer and shell.
