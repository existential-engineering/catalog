description: This two-way in-ceiling loudspeaker offers high-quality acoustics
  in an incredibly discreet package. It features a decoupled Diamond dome
  tweeter and a single bass/midrange Continuum driver (7in) with anti-resonance
  plug.
details: |-
  CCM8.5 D is the two-way in-ceiling model in the Bowers & Wilkins Reference Series of custom-installation loudspeakers. It pairs a 25mm (1in) Diamond Dome tweeter in a Nautilus tube-loaded housing with a single 180mm (7in) Continuum cone bass/midrange driver carrying an anti-resonance plug, and loads the bass through a Flowport.

  All the drive units sit in a rotatable aluminium mini-baffle, so the installer can turn the whole array to 'toe in' the speaker towards the listening position after the frame is in the ceiling. The tweeter sits on an aluminium 'wing' and is decoupled from the baffle. For optimum discretion once installed, the Continuum cone is given a dark finish.

  It is a passive loudspeaker. There is no on-board amplifier and no mains connection: it is driven from an external power amplifier or a channel of a distribution amplifier through speaker cable. Bowers & Wilkins quotes a nominal 8 ohm impedance, 88dB sensitivity, a recommended amplifier power of 120W and a 35Hz to 35kHz frequency range at -6dB.

  The frame measures 351mm (13.8in) across and needs a 331mm (13in) cut-out, with only 8mm (0.3in) of protrusion below the ceiling line once the grille is fitted. Net weight is 5kg. A matching back box, the BB CCM8.5, is available for installations that need the rear volume controlled or sound transference through the ceiling void reduced.

  The finish is White.
specs: |-
  - 2-way in-ceiling loudspeaker
  - Drive units: 1x ø25mm (1in) Diamond Dome, Nautilus tube-loaded tweeter, 1x ø180mm (7in) Continuum cone bass/midrange driver with anti-resonance plug
  - Technical features: aluminium tweeter 'wing', rotatable aluminium mini-baffle allowing toe-in, Diamond Dome Nautilus tube-loaded tweeter, anti-resonance plug, Flowport
  - Frequency range: 35Hz to 35kHz (-6dB)
  - Recommended amplifier power: 120W
  - Sensitivity: 88dB
  - Nominal impedance: 8 ohms
  - Frame (width/height): 351mm (13.8in)
  - Cut-out (width/height): 331mm (13in)
  - Protrusion: 8mm (0.3in)
  - Net weight: 5kg
  - Matching back box: BB CCM8.5
  - Passive: no on-board amplifier and no mains inlet, driven from an external power amplifier
  - Continuum cone given a dark finish for discretion when installed
  - Finish: White
