details: |-
  CCM8.5 D is a two-way in-ceiling loudspeaker which offers high-quality acoustics in an incredibly discreet package.

  It features a decoupled Diamond dome tweeter and a single 7inch bass/midrange Continuum driver with anti-resonance plug.

  All the drive units are located in a rotatable mini-baffle which allows the user to ‘toe in’ the drive units of the loudspeaker for the best performance.

  For optimum discretion when installed, the Continuum cone is given a dark finish. Other technical features include an aluminium tweeter ‘wing’, a Diamond Dome Nautilus tube-loaded tweeter, an anti-resonance plug and Flowport.
specs: |-
  - Description: 2-way in-ceiling loudspeaker
  - Technical features: aluminium tweeter 'wing', rotatable aluminium mini-baffle allows 'toe-in', Diamond Dome Nautilus tube-loaded tweeter, anti-resonance plug, Flowport
  - Drive units: 1x ø25mm (1in) Diamond Dome, Nautilus tube-loaded tweeter
  - Drive units: 1x ø180mm (7in) Continuum cone bass/midrange driver with anti-resonance plug
  - Frequency range (-6dB): 35Hz – 35kHz
  - Recommended amplifier power: 120W
  - Sensitivity: 88dB
  - Nominal impedance: 8Ω
  - Frame (width/height): 351mm (13.8in)
  - Cut-out (width/height): 331mm (13in)
  - Protrusion: 8mm (0.3in)
  - Net weight: 5kg
  - Back box: BB CCM8.5
  - Finish: White
