details: |-
  The Aurora Reverb is Keeley's entry into reverb processing, covering the ground between spring tanks, cathedral echoes and plate reverberation. The design brief was that it had to be affordable without compromising audio quality, be simple for guitarists to use, and cover the essentials of tone shaping without a large control set. The result is a true bypass pedal with a 100 percent analog dry path, low noise and a 24-bit high-fidelity reverb processor.

  A toggle switch selects between Room, Plate and Hall. Room sizes range from very small spaces to barn-sized ones, and careful Room settings approach a spring reverb sound for amplifiers with no tank of their own. Plate gives large sheet-metal plate sounds and Hall gives cathedral-scale resonance.

  Decay sets how long the reverberated sound takes to disappear, from close-quarters spaces through to long, complex, still-ringing reflections. Slapback is the pre-delay control, setting how soon the first reflection is heard and so how much distance the reverb suggests, adjustable from zero to 100 milliseconds. Short, staccato phrases can be left to articulate before the reverb joins them, and setting Slapback to zero gives the impression of unbroken space.

  Warmth is a dampening control rather than a conventional tone control, so the sound becomes warmer as it is turned up and brightest when fully down. Blend mixes the reverb into the fully analog dry signal, and the pedal is suggested for the end of a signal chain.
