description: "A standalone headphone correction system that restores neutral
  frequency response and natural stereo imaging. Functions as an
  audiophile-grade DAC and amplifier with built-in acoustic modeling to recreate
  the experience of professional studio monitors within headphones."
details: |-
  The ARC ON-EAR is a standalone headphone correction system featuring a high-end 32-bit ESS SABRE DAC converter and ultra-low-distortion headphone amplifier. It provides correction/calibration profiles for over 200 headphone models, restoring neutral frequency response and natural stereo imaging without requiring a DAW or drivers.

  Virtual monitoring modes emulate the sound of professional studio monitors, smartphones, smart speakers, and TV sets for reference checking across multiple playback systems. The digitally controlled analog volume stage maintains audio quality at all levels, and up to 5 custom user presets can be stored.

  The compact aluminum chassis houses a rechargeable lithium battery providing 4 hours of use. Includes a protective carrying case. The dedicated ARC ON-EAR Control Software handles setup, firmware updates, and preset management.
specs: |-
  - 32-bit ESS SABRE DAC converter
  - Ultra-low-distortion headphone amplifier
  - Headphone correction profiles for 200+ models
  - Virtual monitoring: studio monitors, smartphones, smart speakers, TV sets
  - Up to 5 custom user presets
  - Standalone zero-latency operation
  - Digitally controlled analog volume stage
  - 4-hour rechargeable lithium battery
  - Compact aluminum chassis with carrying case
