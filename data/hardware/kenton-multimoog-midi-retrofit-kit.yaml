description: Bring the power of MIDI to your Multimoog. The Kenton Multimoog
  MIDI Retrofit Kit gives you enhanced control over your Multimoog using MIDI,
  allowing you to control it from your DAW, sequencer or other controller.
details: |-
  A MIDI retrofit kit for the Multimoog, giving MIDI control of notes, modulation, pitchbend, the instrument's LFO and its filter cutoff, and adding sustain and slide or portamento.

  MIDI functionality is added without changing the Multimoog's own behaviour, and the kit switches automatically between keyboard and MIDI control. Any of the sixteen MIDI channels can be selected, and the setup is stored in non-volatile EEPROM memory.

  Incoming MIDI covers notes 36 to 96 with transpose, pitchbend with a range selectable between two semitones, a fifth or an octave, and aftertouch, velocity and pitchbend routable to volume and to the filter cutoffs. Defaults put the mod wheel on CC#1, sustain on CC#64, portamento on-off on CC#65, portamento time on CC#5 and the Multimoog's low pass filter cutoff on CC#16. Every one of these parameters can be reassigned to a different CC.

  The kit carries its own MIDI-syncable LFO, with LFO MIDI sync on CC#12, waveshape on CC#13, speed on CC#14, LFO to VCO amount on CC#15 and LFO to low pass filter cutoff amount on CC#17. The mod wheel can be switched to control this LFO instead of the instrument's own.

  Added hardware is a pair of MIDI In and Thru sockets and a push button for programming the MIDI setup. The kit comprises a MIDI circuit board that fits inside the Multimoog, a small pack of DIN sockets and mounting hardware, a large pack of cable assemblies, user instructions and step by step fitting instructions. Every kit is checked and tested before despatch, installation is a skilled job for a competent synth service engineer, and kits are built to order with a current build time of up to 25 working days.
specs: |-
  - Fits the Moog Multimoog
  - Adds MIDI In and MIDI Thru sockets
  - Any of the 16 MIDI channels selectable
  - Note range MIDI 36 to 96, transposable
  - Pitchbend range selectable: 2 semitones, a fifth or an octave
  - Controls note pitch, pitchbend, modulation, filter cutoff, sustain and slide or portamento
  - Built-in MIDI-syncable LFO
  - Default CCs: 1 mod wheel, 64 sustain, 65 portamento on-off, 5 portamento time, 16 low pass cutoff, 12 LFO sync, 13 LFO waveshape, 14 LFO speed, 15 LFO to VCO, 17 LFO to low pass cutoff
  - All parameters reassignable to different CCs
  - Aftertouch, velocity and pitchbend assignable to volume and filter cutoff
  - Automatic switching between keyboard and MIDI control
  - Setup stored in non-volatile EEPROM
  - Powered from the host instrument, so the kit has no power inlet of its own
  - Build time currently up to 25 working days
