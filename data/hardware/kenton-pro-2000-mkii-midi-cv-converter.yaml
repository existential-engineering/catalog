description: A mains-powered MIDI to CV converter with two completely
  independent main CV and gate outputs, six programmable auxiliary outputs, two
  LFOs, DIN sync and 24 setup memories, for controlling pre-MIDI monophonic
  synthesisers.
details: |-
  Controlling a pre-MIDI synthesiser from a modern MIDI instrument or sequencer means turning digital MIDI messages into the analogue signals the older synth understands. The PRO 2000 MkII does that in a rugged steel case, designed to control all types of monosynth, with a 16x2 character LCD display, 24 memory locations for setups and a fast response time.

  There are two completely independent main CV outputs, meaning every setting for synth outputs A and B is set separately. Each is switchable between V/oct, Hz/V and 1.2V/oct scaling, with software-controllable fine tune and scale, transposition up and down 12 semitones and a pitchbend range adjustable to plus or minus 12 semitones. The main CV outputs use 16 bit D/A converters for stable pitch, while the auxiliary outputs run 12 bit converters.

  Gate outputs are programmable as V-trig up to 15V or S-trig with or without pull-up, with multiple and single trigger modes and note priority selectable as newest, lowest or highest. Old notes are remembered to help with trills and playability. Portamento is available on the main CV outputs, including an auto mode where legato playing engages it, two types (fixed rate or fixed time) and selectable portamento controllers.

  Six programmable auxiliary outputs can be driven by any MIDI controller on any MIDI channel, and two independent LFOs each offer nine wave shapes including random. The LFOs can modulate pitch, the auxiliary outputs or both, with separate controllers for each destination, and can be synchronised to MIDI clock. A clock output offers selectable 1 to 12 cpqn modes plus 24 and 48 cpqn, and a DIN SYNC 24 socket is fitted.

  Any MIDI channel can be selected for any output, and a channel filter can channelise an omni-on synth. Every parameter is controllable in real time over SysEx, with SysEx dump and load of the current program and any memory, and setups held in non-volatile memory. A MIDI monitor mode assists troubleshooting. Optional add-on ports cover DCB and KADI/WASP, each with a cable, and KADI can run on its own MIDI channel.
specs: |-
  - Dimensions: 280mm x 132mm x 42mm
  - Weight: 2.5kg
  - Power: 230V AC 50Hz (170V to 260V) or 115V AC 50/60Hz (85V to 130V), internally selectable
  - Mains inlet: IEC socket on the back panel
  - Main CV outputs: 16 bit D/A converters
  - Auxiliary outputs: 12 bit D/A converters
  - Two completely independent main CV outputs, A and B, with independent settings
  - CV scaling switchable per output: V/oct, Hz/V, 1.2V/oct
  - Gate: programmable V-trig up to 15V or S-trig, with or without pull-up
  - Transpose: up and down 12 semitones
  - Pitchbend range: adjustable plus or minus 12 semitones
  - Note priority: newest, lowest or highest, with multiple and single trigger modes
  - Six programmable auxiliary outputs, assignable to any MIDI controller on any MIDI channel
  - Two programmable independent LFOs, nine wave shapes each including random, synchronisable to MIDI clock
  - Clock output: selectable 1 to 12 cpqn plus 24 and 48 cpqn
  - DIN SYNC 24 socket
  - Display: 16x2 character LCD
  - 24 memory locations for setups, stored in non-volatile memory
  - Polyphonic operation selectable with three note assignment types
  - All parameters controllable in real time by SysEx, with SysEx dump and load
  - MIDI monitor mode for troubleshooting
  - Expansion port: 15 pin high density D or 8 pin mini DIN, depending on version
  - Optional ports: DCB with cable, KADI/WASP with cable
  - Case: steel
