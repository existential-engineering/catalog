details: |-
  The M45 is a miniaturized shotgun condenser microphone with a swivel-and-pivot base for convenient aiming and positioning. The M45 is optimized for vocal intelligibility and offers high sensitivity, an integrated preamp, immunity from RF interference, and is easy to install in a 1-1/2" hole with no additional tools required.

  Mic-level signal and LED control is over an RJ45 connection. An adapter is included to convert from RJ45 to an 8-conductor pluggable terminal block.

  For use in Dante networks, the optional AUDIX DN4 Enhanced Onramp for Dante | AES67 supports up to four devices and includes LED logic control.

  Designed, machined, assembled, and tested by AUDIX in Wilsonville, Oregon.
