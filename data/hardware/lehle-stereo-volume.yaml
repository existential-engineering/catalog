name: Stereo Volume
manufacturer: lehle
primaryCategory: pedal
categories:
  - utility
  - routing
url: https://www.lehle.com/lehle-stereo-volume
description: The LEHLE STEREO VOLUME is a volume pedal equipped with a precise
  magnetic sensor enabling it to operate almost wear-free. A premium Blackmer
  Stereo-VCA replaces the mechanical potentiometer, allowing it to operate more
  precisely than conventional mechanical potentiometers or optical sensors.
details: |-
  This sensor uses the Hall effect, named after Edwin Hall, to measure the strength of magnetic fields. In the LEHLE STEREO VOLUME, the Hall sensor, which is made in Germany, is accurately calibrated to the built-in magnet and the control range of the pedal. The pedal moves only the magnet, the distance is measured by the Hall sensor which controls a VCA.

  A premium Blackmer Stereo-VCA (Voltage Controlled Amplifier) from the United States replaces the mechanical potentiometer. The principle of the voltage-controlled amplifier is based on the fact that gain can be varied by the control voltage coming from the Hall sensor. In addition the potentiometer-typical noise and the complicated adjustment are eliminated.

  Over the entire control range the LEHLE STEREO VOLUME transmits the full sound spectrum of the connected instrument. The input and output impedance always stay the same, ensuring that there will be no damping of higher frequencies as with potentiometers. Internally, the input voltage coming from the power supply socket of the pedal is rectified, then filtered, stabilized and doubled to 18V, thus achieving a total dynamic range of 110 dB. The volume control ranges from -92 dB to 0 dB, so from a virtually muted level to the same volume.

  The LEHLE STEREO VOLUME runs mechanically extremely smooth and steady, as it is equipped with low-friction bearings of a high-performance polymer, and there is no mechanical transmission of the pedal to other components. By means of an adjusting screw the mobility of the pedal can be modified very precisely.

  The LEHLE STEREO VOLUME can both distribute one signal to two outputs and add up two input signals to one output. If only a mono signal is supplied, the signal can be split and sent to two different output channels using the split-function. An input stereo or a dual-mono-signal can be merged to mono via the summing function. The balanced (TRS) as well as unbalanced (TS) outputs make the LEHLE STEREO VOLUME fit for use in studios or FOH-environment.
specs: |-
  - Magnetic Hall-effect sensor instead of a potentiometer
  - Blackmer Stereo-VCA from THAT Corporation
  - Supply voltage internally rectified, filtered, stabilized and doubled to 18V
  - Control range -92 dB to 0 dB
  - Balanced (TRS) and unbalanced (TS) outputs
  - Split one signal to two outputs or sum two inputs to one output
  - Weight: 1480 g
  - Length: 260 mm (10.2 inch)
  - Width: 100 mm (3.9 inch)
  - Overall height: 66 mm (2.6 inch)
  - Supply voltage: 9 to 15 V DC
  - Current consumption: 63 mA
  - Frequency range: 20 Hz to 100 kHz (+/- 0.2 dB)
  - Total harmonic distortion: < 0.05 % (-10 dBu, 1 kHz)
  - Impedance input: 2 MOhm
  - Impedance output: 500 Ohm
  - Max. level: 3 V RMS / 11.8 dBu (at 12 V input voltage)
  - Level noise floor: -100 dBu (A-weighted)
