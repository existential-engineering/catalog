description: >-
  The Roland TR-909 is an analog drum machine produced from 1984 to 1985, widely
  regarded as the definitive rhythm machine for house and techno music. It
  features twelve individually tweakable drum voices with parameters for attack,
  tone, tuning, decay, snap, and accent. Its distinctive analog drum sounds and
  built-in sequencer with shuffle and flam capabilities have made it one of the
  most influential instruments in electronic music history.
details: |-
  The Roland TR-909 Rhythm Composer was released in 1984 as one of the first MIDI-equipped drum machines. While it was not a commercial success upon release, it quickly became the backbone of the emerging house and techno scenes in Chicago and Detroit, defining the rhythmic foundation of electronic dance music for decades to come.

  The TR-909 uses a hybrid sound engine combining analog synthesis for most of its drum voices with digital samples for its cymbal and hi-hat sounds. Its characteristic punchy kick drum, snappy snare, and sizzling hi-hats became the sonic signature of an entire genre. Each sound can be individually shaped using dedicated parameters, giving producers hands-on control over their beats.

  The built-in step sequencer allows programming of up to 96 patterns and 8 songs, with shuffle and flam functions for adding groove and feel. The TR-909 was among the first drum machines to feature MIDI connectivity alongside Roland's proprietary DIN Sync, making it a bridge between older and newer production setups. Individual audio outputs allow each drum voice to be processed separately through external effects and mixing consoles.

  Notable users of the TR-909 include 808 State, Air, Future Sound of London, Moby, Fatboy Slim, Orbital, Underworld, The Prodigy, Faithless, and the Chemical Brothers. Original units have become highly sought-after collectors' items, commanding premium prices on the used market.
specs: |-
  - Polyphony: 12 voices
  - Sound Generation: Analog (drums) / Digital samples (cymbals, hi-hats)
  - Sounds: Kick, Snare, Low Tom, Mid Tom, Hi Tom, Rimshot, Hand Clap, Cymbal, Open Hi-Hat, Closed Hi-Hat
  - Patterns: 96
  - Songs: 8
  - Sequencer: Step sequencer with shuffle and flam
  - Connectivity: MIDI In/Out, DIN Sync In
  - Outputs: Individual outputs per voice
  - Memory: External memory cartridge support
  - Date Produced: 1984-1985
