details: |-
  The HDJ-500Ts are designed for your complete DJ lifestyle giving you exceptional sound quality whether you're DJing at home or in the club, or listening to music when you're out and about. Use the straight cord with in-line microphone for hands-free talking when you're listening to music on your mobile phone.

  These headphones emulate our flagship HDJ-2000MK2s, with a simple yet stylish design, and a lightweight but robust build. The streamlined hanger makes it easy to identify left and right sides of the headphones, even in a dimly lit booth.

  Key features:

      - Just answer the call on your phone to start a hands-free call. (The straight cord cannot be connected to the ø6.3 mm 3P plug adapter).

      - The HDJ-500Ts deliver rich bass notes and clean low to mid level frequencies for accurate monitoring.

      - Rotate the right ear cup up to 60 degrees to the right, while the flexible headband maintains side pressure.

      - The 1.2 meter coiled cord stretches to around 3 meters to give you freedom to move while DJing, or you can change it for the 2 meter straight cord when you're on the move.
