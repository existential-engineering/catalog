description: The limited edition EVH Star is a modern interpretation of one of
  the guitars that Eddie Van Halen used to attain the early Van Halen sound.
  Experience resonant tone, sustain, and crunch thanks to a basswood body and
  single EVH Wolfgang humbucker. Fire off cool stutter effects with the
  momentary kill switch. Outfitted with a comfortable maple neck and
  fast-playing ebony compound-radius fingerboard, blasting our pummeling riffs
  or lightning licks has never been easier. Beyond that, a top-mounted Floyd
  Rose tremolo with D Tuna yields massive sustain, also allowing you to dive
  bomb and shift to a Drop D tuning on the fly.
