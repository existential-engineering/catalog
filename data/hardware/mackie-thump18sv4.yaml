description: Craving some extra oomph for your PA system? You need a subwoofer.
  Thump18Sv4 shakes the floorboards with massive bass that gets people on their
  feet, for moments that leave a lasting impression.
details: |-
  Thump18Sv4 shakes the floorboards with massive bass that gets people on their feet. Connect loudspeakers. Dial in the perfect low end. Feel the difference of a professional subwoofer that brings music alive with complex bass lines and punchy kicks.

  Thumpv4 subwoofers integrate perfectly with Thumpv4 loudspeakers, with voicing modes that automatically tailor the sound to match the size of your speakers. The crossover can also be set manually for more control over the sound.

  This 18 inch subwoofer is the perfect match for Thumpv4 loudspeakers (or any PA speakers) with selectable high pass modes, plus a variable mode for setting the crossover yourself. Thump 12 crosses over at 140 Hz for Thump12v4 loudspeakers, Thump 15 at 110 Hz for Thump15v4, and Thump GO at 150 Hz for Thump GO. All modes include 1.4 ms alignment delay.

  Built-in carry handles make Thumpv4 subwoofers portable enough to add to a touring rig or gigging setup. A pole-mountable Thump loudspeaker can be stacked above Thump18Sv4 using the dedicated Mackie SPM400 speaker pole (sold separately) to create an all-in-one PA system.

  Thumpv4 Series subwoofers are designed to sit on the floor or stage. They are not designed to be pole-mounted or suspended, and the cabinet has no rigging points.
specs: |-
  - 1400W Class-D amplifier for 132 dB maximum SPL
  - 18 in / 457 mm high-performance woofer
  - Frequency response (-3 dB): 33 Hz - 160 Hz
  - Frequency response (-10 dB): 28 Hz - 160 Hz
  - Low frequency amplifier rated power: 1400 watts peak / 470 watts RMS, THD <1%, convection cooled
  - Inputs: 2x female XLR balanced, 10k ohm balanced line impedance
  - Outputs: male XLR balanced, 2x full range and 2x high pass, 150 ohm output impedance
  - Full range output switchable stereo or mono for single or dual subwoofer deployment
  - Selectable high pass modes: Thump 12 (140 Hz), Thump 15 (110 Hz), Thump GO (150 Hz), Variable
  - All high pass modes include 1.4 ms alignment delay
  - Polarity / phase invert switch
  - Variable level control (muted to +6 dB)
  - Defeatable front LED, plus High Pass Mode and Signal/Overload LEDs
  - Peak and RMS transducer limiting, power supply and amplifier thermal protection
  - Power: detachable line cord, 100-240V~, 50-60 Hz, 400W, 3-pin IEC 250 VAC 10 A male connector
  - Switchmode universal mains regulated power supply with PFC integrated
  - M20 thread for SPM400 speaker pole (sold separately)
  - Built-in ergonomic carry handles
  - Height: 21.3 in / 541 mm
  - Width: 24.8 in / 630 mm
  - Depth: 23.8 in / 605 mm
  - Weight: 70.4 lb / 31.9 kg
