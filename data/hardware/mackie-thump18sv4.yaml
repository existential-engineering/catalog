url: https://mackie.com/en/products/loudspeakers/thumpv4-series/thump18sv4.html
description: "Craving some extra oomph for your PA system? You need a subwoofer.
  Thump18Sv4 shakes the floorboards with massive bass that gets people on their
  feet, for moments that leave a lasting impression."
details: |-
  Connect loudspeakers. Dial in the perfect low end. Feel the difference of a professional subwoofer that brings music alive with complex basslines and punchy kicks.

  Thump18Sv4 combines our 1400W Class-D active subwoofer amplifier with a 18" high-performance woofer, for massive 132 dB maximum SPL and 33 Hz low frequency performance.

  This 18 inch subwoofer is the perfect match for Thumpv4 loudspeakers (or any PA speakers) with selectable high pass modes, plus a "variable" mode for setting the crossover yourself.

  Stack your pole-mountable Thump loudspeaker above Thump18Sv4 using the dedicated Mackie SPM400 speaker pole (sold separately) to create an all-in-one powerhouse PA system, projecting sound across the entire area while keeping floor space clear for getting down.
specs: |-
  - 1400W Class-D amplifier for 132 dB maximum SPL
  - 18" high-performance woofer for 33 Hz low frequency
  - Built-Like-A-Tank to conquer every gig while lightweight with built-in handles for easy loading
  - Connect loudspeakers to high-pass outputs and select from four modes
  - All modes include 1.4 ms alignment delay
  - Thump 12 mode: Thump12v4 loudspeakers (140 Hz crossover)
  - Thump 15 mode: Thump15v4 loudspeakers (110 Hz crossover)
  - Thump GO mode: Thump GO loudspeakers (150 Hz crossover)
  - Variable mode: Set crossover manually to match any loudspeakers
  - Stereo XLR inputs: Connect to DJ controller, mixer or other source
  - Stereo XLR high-pass outputs: Connect to loudspeakers and select your high pass mode
  - Stereo XLR full-range outputs: Chain the full, unaltered signal to the next subwoofer
  - Phase invert switch
  - Defeatable front LED
  - Stereo or mono summing for single or dual subwoofer deployment
  - Variable level control (Muted to +6 dB)
  - Front LED On/Off
  - Built-in handles
  - Rugged, modern construction
  - M20 thread for SPM400 speaker pole (sold separately)
  - Height: 21.3 in / 541 mm
  - Width: 24.8 in / 630 mm
  - Depth: 23.8 in / 605 mm
  - Weight: 70.4 lb / 31.9 kg
