description: >
  KeyStep mk2 is the ultimate compact controller & sequencer for hybrid setups. With a 32-note Slimkey keyboard, generative sequencing tools and deep connectivity via CV/Gate, MIDI DIN, and USB-C - spark ideas in your DAW, pilot any synth or patch modular without breaking your flow.
details: |-
  Keystep mk2 is the ultimate compact controller and sequencer for hybrid setups, bridging hardware and software for seamless composition, jamming, and performance. With a 32-note slimkey keyboard, generative sequencing tools, and deep connectivity via CV/gate, MIDI din, and USB-c, it enables users to spark ideas in their DAW and pilot any synth or modular patch without breaking creative flow. The device plays like an instrument, edits like a groovebox, and invents like a modern synth.

  The sequencer, arpeggiator, and controller modes work in synergy to keep ideas evolving. The polyphonic step sequencer supports up to 64 steps with 8-note polyphony, allowing users to chain, overdub, undo, mutate, and automate bends and modulation in real time. The 16-mode arpeggiator includes poly, walk, pattern, and random types, with phrase arp remapping sequences to played notes for immediate musical mutations. Mutate, spice & dice tools provide instant, musical variations and controlled randomness for live performance.

  The OLED display with clickable encoder and rgb LED feedback enables fast, intuitive editing and parameter feedback. Capacitive pitch and mod strips deliver smooth bends and modulation, while gate length and spice/dice sliders provide expressive tweaks. Chord & scale modes allow users to lock to a key and trigger full chords for harmonic flow, with real-time, step, or un-quantized recording options. Shift and octave +/- buttons provide quick access to secondary functions and keyboard transposition.

  Universal connectivity is achieved through full-size MIDI din I/o for classic hardware, USB-c for daws and soft-synths, and assignable CV/gate outputs for modular systems. Four CV/gate outputs are mappable to velocity, aftertouch, mod-wheel, and more for expressive control over modular gear. The 3.5mm sync in/out supports vintage gear synchronization, while trs sustain/expression input and MIDI in CV conversion enable playing modular systems from external keys. Class-compliant USB bus power and a sturdy on/off hardware control complete the connectivity suite.

  The device includes analog lab intro with 500+ sounds and operates at low power with ipad compatibility via camera connection kit. Its compact dimensions (50 x 484 x 145 mm) and lightweight design (1.1 kg) make it ideal for mobile production and studio use. The kensington lock slot provides security for live performance and travel scenarios.
specs: |-
  - 32-note slimkey keyboard with velocity and aftertouch
  - 2 capacitive touch strips for pitch bend and modulation
  - Polyphonic step sequencer: up to 64 steps, 8-voice polyphony
  - 16-mode arpeggiator with generative pattern styles
  - Mutate, spice & dice tools for live variation
  - Chord & scale modes
  - OLED display with clickable encoder and rgb LED feedback
  - 4 CV/gate outputs (pitch, gate, mod 1, mod 2) assignable to velocity, aftertouch, mod wheel
  - Full-size MIDI din in/out
  - 3.5mm sync in/out
  - Sustain/expression pedal input (trs)
  - USB-c MIDI (class-compliant) and bus power
  - Power switch and kensington lock slot
  - Low-power operation; ipad compatible (camera connection kit required)
  - Analog lab intro (500+ sounds)
  - Size: 50 x 484 x 145 mm (1.97 x 19.06 x 5.71 in)
  - Weight: 1.1 kg (2.43 lb)
