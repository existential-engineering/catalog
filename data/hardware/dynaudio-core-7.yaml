details: |-
  Trust is critical in this business. Whether you're recording a power-trio or an orchestra, mixing a solo voiceover or video-game soundtrack, or mastering a full immersive audio project (such as a Dolby ATMOS mix), you need to know that your monitors reproduce everything you need to hear - warts and all. Core 7 has been developed alongside industry professionals with exactly this in mind.

  Core 7 is the most compact model in Dynaudio's range of high-end professional reference monitor systems. This no-compromise two-way design features two class-D amplifiers - a 500W amp for the mid/woofer and a 150W unit for the tweeter - plus the best of modern DSP technology and a flat bass response down to 38Hz - 31kHz +/- 6dB and 45Hz - 27kHz +/- 3dB. It's been specifically designed and engineered to meet the challenges of high-demand environments.

  Each driver unit is handmade at Dynaudio's factory in Denmark, with the company producing 1.4 million drivers each year for the home hi-fi, custom-install, in-car and pro-studio markets. Soft-dome tweeters provide hours of pinpoint imaging and detail without listener fatigue. The original Esotar Pro tweeter features a revolutionary Hexis system, and the mid/woofer uses Dynaudio's proprietary MSP (Magnesium Silicate Polymer) cone material.

  Advanced DSP delivers simple-to-use, powerful-to-listen-to positioning filters. Core 7 is suitable for recording studios, edit suites, broadcast trucks, mobile facilities, broadcast and theatrical dub stages, immersive audio mixing rooms and custom installations. Core reproduces what was recorded - nothing more, nothing less. And you know the truth when you hear it.
specs: |-
  - Type: Nearfield Monitor
  - Box principle: Front-loaded bass reflex
  - Crossover type: 2-way DSP-based
  - Crossover frequency: 2300 Hz
  - Tweeter: 1.1" Esotar Pro soft dome with Hexis
  - Mid/Woofer: 7" MSP
  - Amplifier power (mid/woofer): 500W class-D
  - Amplifier power (tweeter): 150W class-D
  - Maximum SPL (anechoic @ 1m): 112 dB
  - Maximum SPL (half space @ 1m): 118 dB
  - Lower cutoff (85 dB ±3 dB): 40 Hz
  - Upper cutoff (85 dB ±3 dB): 27 kHz
  - Lower cutoff (dynamic @ -6 dB): 36 Hz
  - Upper cutoff (dynamic @ -6 dB): 29 kHz
  - AC power input: 100-240V 50/60Hz
  - Weight: 14.6 kg (32.1 lbs)
  - Dimensions (W x D x H): 220 x 355 x 390 mm (8 5/8" x 14" x 15 3/8")
  - Cabinet baffle thickness: 32 mm
  - Finish: Dark Grey
