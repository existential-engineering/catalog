description: >-
  The Future Retro Revolution is a monophonic analog synthesizer with a distinctive circular
  step sequencer interface, replicating the TB-303's filter and oscillator topology while adding
  24-bit digital effects, a 256-pattern remix system, and multi-format sync outputs.
details: |-
  The Revolution's most striking feature is its circular design, which Future Retro created to
  better reflect the cyclic nature of music. LEDs run around a circular loop with each LED
  representing one step of the pattern, providing natural visual cues for playback timing that
  break from conventional linear sequencer displays.

  The synthesizer employs a fully analog signal path replicating key elements of the TB-303: a
  single oscillator with saw and square waveforms, a 3-pole 18 dB/octave lowpass resonant filter,
  gated amplifier, and accent and glide circuits. CV modulation allows the filter cutoff to track
  internal or external control voltages, while an accent decay time control shapes the character
  of accent effects.

  The sequencer stores 256 patterns of up to 16 steps each, recording note duration, pitch,
  accent, glide, loop point, time signature, and swing amount. A unique Remix feature generates
  256 variations for every pattern and song, yielding over 65,000 possible patterns. Patterns can
  play forward or backward and be selected remotely via MIDI program changes.

  Effects processing combines an analog overdrive with 24-bit stereo digital effects including
  chorus, delay, flange, reverb, and Leslie simulation. The original models featured a white
  chassis, while the second-generation R2 revision introduced a gunmetal gray finish and improved
  battery life. Connectivity covers MIDI, DIN Sync, and CV/Gate outputs.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 analog (saw or square waveforms)
  - Filter: Lowpass resonant 3-pole (18 dB/oct)
  - Effects: Analog overdrive; 24-bit stereo DSP (chorus, delay, flange, reverb, plates, halls, rotary speaker, lowpass muffler)
  - Sequencer: 256 patterns (16 steps max), 16 songs (3,580 measures per song), Remix feature
  - Control: MIDI In/Out/Thru, DIN Sync out, CV/Gate outputs (1V/oct, 0 to +12V gate)
  - Date produced: 2004
releaseDate: "2004"
releaseDateYearOnly: true
