url: https://ashdownmusic.com/products/mibass-220
description: The MiBass 220 is a compact bass amplifier head delivering 220W of
  Class D power in a gig-bag-sized chassis with an internal power supply. It
  features a switchable Active/Passive instrument input, input level control
  with the trademark Ashdown VU meter, and a 7-band semi-parametric EQ with Deep
  and Shape voicing buttons and an EQ In/Out bypass. The rear panel carries
  combination Jack/Speakon speaker outputs, a Pre/Post switchable balanced DI,
  an FX send and return and a headphone jack.
details: |-
  Designed from the ground up, the MiBass 220 packs 220W of Class D power and pro features into a compact bass head measuring roughly 8.3 x 2.6 x 6.3 inches, including an internal power supply. The front panel offers a switchable Active/Passive instrument input and an input level control that matches the input signal to your bass via the Ashdown VU meter. The preamp centers on a 7-band semi-parametric EQ, with rotary controls to select frequency and sliders to cut or boost, a Deep button for extra low end and a Shape button for an instant slap-happy tone; the EQ can be bypassed with an EQ In/Out switch. A front-panel line input with level control lets you connect an MP3 player for practice. The rear panel carries combination Jack/Speakon speaker outputs, a Pre/Post switchable balanced DI output for a PA or recording console, an FX send and return, and a headphone jack for silent practice. Available in black; replacement blue and purple panels are also offered.
specs: |-
  - Power output: 220 watts (Class D)
  - Speaker outputs: 2 x combination Jack/Speakon
  - EQ: 7-band semi-parametric with Deep and Shape buttons, EQ In/Out bypass
  - Line input: yes, with level control
  - Line output: yes
  - DI output: yes, with Pre/Post switch
  - Effects send: yes
  - Effects return: yes
  - Ashdown VU meter with input level control
  - Internal power supply
  - Dimensions (H x W x D): 66 x 210 x 160 mm
  - Weight: 2.3 kg
