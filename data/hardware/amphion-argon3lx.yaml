details: |-
  The Argon3LX is a two-way passive radiator floorstanding loudspeaker handmade in Finland, designed as a floorstanding evolution of the acclaimed Argon3X bookshelf speaker. It combines the midrange detail and speed that Amphion is known for with surprising bass extension suitable for smaller rooms or near-wall placement.

  The Argon3LX features a new 1-inch titanium tweeter paired with a revised crossover fine-tuned for superior driver integration and balance across the frequency range.

  At the heart of the design is Amphion's 5th generation waveguide, which enables a low crossover point of 1600 Hz. This waveguide approach ensures consistent, predictable performance across listening positions and makes the speaker forgiving of room placement.

  The 6.5-inch aluminum woofer delivers deep, controlled bass with a seamless frequency transition, covering 30 Hz to 55,000 Hz (-6dB).

  The Argon3LX is available in four handcrafted finishes — Walnut, Standard White, Full White, and Full Black.
specs: |-
  - Operating Principle: Two-way, passive radiator
  - Tweeter: 1" titanium
  - Woofer: 6½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 8 Ω
  - Sensitivity: 85 dB
  - Frequency Response: 30–55,000 Hz (-6dB)
  - Power Recommendation: 50–250 W
  - Dimensions (H×W×D with base): 995×234×344 mm
  - Weight: 21 kg (46.3 lbs)
  - Manufacturing: Handmade in Finland
