description: Erica Synths Black Voltage Controlled Clock is a module with
  advanced features (tap tempo, shuffle, divided/multiplied clock out, random
  clock out, CV input) and a bright segment LED display.
details: |-
  The Black Voltage Controlled Clock is built to be the beating heart of a modular system. The module generates several clock signals simultaneously and carries advanced features such as tap tempo, shuffle and division, both for controlled, rhythmic music production and for experiments with a high level of uncertainty.

  Tempo is entered with the encoder or with the tap tempo button, and a bright segment LED display shows the resulting BPM. The divided clock output covers /16, /8, /4, /3, /2, x2, x4, x8 and x16. A shuffling clock output adds an adjustable shuffle level together with clock multiplication up to x16, and a random clock output runs at its own adjustable rate. An external clock input takes over the tempo with BPM indication, and the clock rate can also be voltage controlled.

  Erica Synths' Black series are high-end modules with unique functionality. Only the highest quality components are used and all inputs and outputs are protected against undesired overvoltage. Erica Synths did not economise on module width when designing the Black series, putting design and usability first, so the big knobs are assigned to the functions that make a difference in sound. Together the Black series modules form a range that makes an entire synthesizer.

  Inputs and outputs are protected against over-voltage and the module carries diode protection against a reversed power supply. The panel is 12HP wide and the module is 25mm deep, with a clock range of 30 to 420BPM.
specs: |-
  - CV input signal level: -10V to +10V
  - Clock signal level: 0 to +5V
  - Clock rate: 30 to 420BPM
  - Power consumption: +40mA, -5mA
  - Module width: 12HP
  - Module depth: 25mm
  - Clock output with BPM set by encoder or tap-tempo button
  - Divided clock output (/16, /8, /4, /3, /2, x2, x4, x8, x16)
  - Shuffling clock output with adjustable shuffle level and clock multiplication (x2, x4, x8, x16)
  - Random clock output with adjustable output rate
  - Voltage controlled clock rate
  - External clock input with BPM indication
  - Inputs and outputs protected against over-voltage
  - Diode protection on reversed power supply
