description: Advanced X/Y microphones, incredibly natural-sounding preamps, and
  built-in cutting-edge effects make the H4n Pro the ultimate portable 4 track
  recorder for musicians.
details: |-
  With onboard X/Y microphones, two combo input jacks, overdubbing, effects, and more, the H4n Pro is packed with features that allows musicians to create songs from start to finish.

  The H4n Pro is capable of recording the loudest and heaviest performances, up to 140 dB SPL without distortion. Take a line-level stereo feed from the mixing console and capture room ambience with the X/Y microphones. Note that +4dBu line-level is not supported.

  The H4n Pro features high performance, low-noise mic preamps with recording resolutions up to 24-bit/96 kHz. The improved noise floor (-120 dBu EIN) captures audio at lower volumes with less noise and fewer artifacts. Functioning as a 2-input/2-output USB audio interface for PC or Mac, the H4n Pro enables you to record directly to your computer.

  Three recording modes are available. Stereo Mode can be used with the built-in X/Y microphones or external mics, and is convenient for recording live performances, acoustic instruments, and more. 4-Channel Mode records with the built-in X/Y mics and two external inputs to capture live room sound and a stereo board feed at the same time. Multi-Track Mode turns the device into a four-track studio, with built-in effects, overdub functions, and the ability to work with previously recorded sound files.

  Capture two seconds of audio before you hit RECORD with the Pre-Record function and never miss the start of a great take (one second when recording at 96 kHz or working in 4CH mode). The Auto-Record and Auto-Stop functions allow the H4n Pro to automatically start and stop recording according to your designated levels.

  The H4n Pro can capture audio in both MP3 and WAV file formats. WAV files recorded with the H4n Pro comply with BWF (Broadcast Wave Format) and include marks and creation dates. It allows for easy syncing and file organization for both musicians and filmmakers.
specs: |-
  - Four-track simultaneous recording
  - High-fidelity mic preamps
  - Built-in X/Y stereo microphones, adjustable between 90 and 120 degrees
  - Records up to 140 dB SPL with X/Y microphones
  - Two mic/line level inputs with XLR/TRS combo connectors
  - Stereo 1/8-inch Mic In mini phone jack
  - +24V or +48V phantom power for main inputs, plug-in power (2.5V) via Mic/Line In mini phone jack
  - Output/headphone jack with dedicated volume control
  - Records directly to SD and SDHC cards up to 32 GB
  - Supports up to 24-bit/96 kHz audio in BWF-compliant WAV or a variety of MP3 formats
  - Built-in effects, including compression/limiting, low-cut filtering, modulation, reverb/delay and amp models
  - 2-in/2-out USB audio interface for PC/Mac computers
  - Mounts to mic stand or tripod, or directly to DSLR with optional Hot Shoe adapter
  - Number of simultaneous recording tracks: 2 (STEREO mode), 4 (4CH mode), 2 (MTR mode)
  - Recording time on 4 GB SDHC: approx. 380 minutes (WAV 44.1 kHz/16-bit stereo), approx. 68 hours (MP3 44.1 kHz/128 kbps stereo)
  - Maximum file size of simultaneous recording: 2 GB, 1000 projects per card
  - Other functions: punch-in/out, bounce, A-B repeat, locate (hours/minutes/seconds/milliseconds)
  - Effects: 2 modules, 53 types, 60 patches
  - Tuners: chromatic, guitar, bass, open A/D/E/G, DADGAD
  - Metronome: 5 sound sources, variable beat 1/4 to 8/4 and 6/8, tempo 40.0 to 250.0 BPM
  - A/D and D/A conversion: 24-bit with 128x oversampling
  - Recording media: SD card (16 MB to 2 GB), SDHC card (4 GB to 32 GB)
  - Display: 128 x 64 dot full-dot backlit LCD
  - WAV format: 16-bit/24-bit at 44.1/48/96 kHz
  - MP3 format: 32 to 320 kbps and VBR at 44.1/48 kHz
  - Input 1 and 2: XLR (balanced) / standard phone (unbalanced) combo jack, 3 kohm or more balanced (pin 2 hot), 470 kohm or more unbalanced
  - Input 1 and 2 gain: -16 dB to +43 dB balanced, -30 dB to +32 dB unbalanced
  - Built-in stereo mic: unidirectional condenser, sensitivity -45 dB/1 Pa at 1 kHz, gain -16 dB to +51 dB, maximum sound pressure input 140 dB SPL
  - External mic input: mini stereo phone jack, 2 kohm or more, gain -16 dB to +51 dB
  - Line output: load impedance 10 kohm or more, rated output level -10 dBu
  - Phone output: 20 mW + 20 mW into 32 ohm load
  - Monaural speaker: 400 mW, 8 ohm
  - Phantom power: 48V, 24V, OFF
  - USB: USB 2.0 High Speed mass storage class operation and audio interface operation, operable on USB bus power
  - Power requirements: DC 5V 1A from AC adapter (Zoom AD-14) or 2 x AA batteries (IEC R6)
  - Continuous recording time in STEREO mode with built-in mics at 44.1 kHz/16-bit without headphones: about 5.5 hours on alkaline, about 7.5 hours on NiMH (2500 mAh)
  - Continuous recording time in STAMINA mode with built-in mics at 44.1 kHz/16-bit without headphones: about 8 hours on alkaline, about 10.5 hours on NiMH (2500 mAh)
  - Dimensions: 73 (W) x 157.2 (D) x 37 (H) mm
  - Weight: 294 g
