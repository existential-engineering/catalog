description: >-
  A compact programmable rhythm and drum machine designed for groove music production,
  featuring 256 drum and bass sounds organized into 128 kits with 400 authentic groove
  patterns and a 3-track sequencer.
details: |-
  The DR-202 is a battery-powered or AC-powered groove production tool from BOSS's Groove Zone lineup. It targets dance music producers and DJs seeking an affordable, portable solution for sketch work and live performance accompaniment. The machine draws from classic drum synthesis heritage, incorporating classic TR-808, TR-909, and TB-303 sounds, vinyl sounds, lo-fi drum samples, various synth basses, and sound effects.

  The instrument provides 400 pre-programmed patterns sorted into stylistic categories including Old School, Slow Tempo, Medium Tempo, New Jack, Trip Hop, Jazzy, Abstract, East Coast, and West Coast, each with variations. Users can deconstruct patterns or build custom sequences using the on-board 3-track sequencer supporting step and live edit modes, with capacity to store up to 20 complete songs internally.

  On-board controls include real-time adjustment knobs for cutoff, resonance, and decay parameters per instrument sound, plus reverb and delay effects. The 13 pads are laid out with dedicated kicks, snares, hi-hats, ride, crash, percussion, and performance trigger pads. Each pad routes separately to effects while allowing global effect processing. An external source track enables triggering of external MIDI devices.

  The interface omits a backlit display, which may present visibility challenges in stage lighting. This design prioritizes portability and immediacy over comprehensive real-time sound sculpting, positioning it as an instrumental sketchpad rather than a deep sound design platform.
specs: |-
  - 24-voice polyphony
  - 256 sounds (207 drum, 49 bass)
  - 128 preset drum kits, 64 user drum kits
  - 400 preset patterns, 100 user patterns
  - 3-track sequencer (rhythm, bass, external source/MIDI)
  - 14,000 notes of sequencer memory
  - Up to 20 songs
  - 13 drum and bass trigger pads
  - Reverb (8 types), Delay (2 types), Flanger (4 types)
  - Real-time cutoff, resonance, and decay knobs
  - MIDI In/Out
  - Battery or AC adapter powered
releaseDate: "2000"
