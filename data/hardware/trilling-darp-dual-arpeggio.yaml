description: A dual arpeggiator with precise pitch, flexible timing, and
  hands-on modulation. Both arpeggiators share the same scale or chord while
  keeping independent control over mode, speed, floor note, octave range, gate
  length, glide, and output behaviour.
details: |-
  A powerful dual arpeggiator built for precise pitch, flexible timing and hands-on modulation. Both arpeggiators share the same scale or chord, while keeping independent control over mode, speed, floor note, octave range, gate length, glide and output behaviour. Two precision 16-bit CV outputs provide highly accurate 1V/oct tracking across a full 10-octave range. They can also operate as stepped modulation outputs, with adjustable glide between values. A five-route CV router lets one bipolar CV input control up to five parameters at once, making it easy to create evolving patterns without extra utility modules. Each arpeggiator can advance from the internal or MIDI clock while also responding to its own trigger input, or run entirely from triggers. Dedicated gate and wrap outputs provide a gate for every step and a trigger whenever an arpeggio completes its loop. A shared reset input restarts both arpeggiators, while MIDI can update the active scale or chord, sync other devices and send both arpeggios directly to external synths. Tech specs

  📖 Manual
specs: |-
  - Width: 12 HP (60.6mm)
  - Depth: 35mm (including power cable)
  - Universal 10/16 pin Eurorack power
  - Standard 3.5mm TS jacks
  - Standard 3.5mm TRS Type A MIDI
  - Power: +12V 30mA, -12V 5mA
