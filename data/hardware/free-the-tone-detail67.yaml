description: The COSMIC WAVE CW-1Y is a compact digital delay with multiple
  filter functions, a reverse delay and an adjustable output bit depth from 8 to
  24 bits.
details: |-
  COSMIC WAVE is a compact digital delay with multiple filter functions. It uses high-speed signal processing on a dedicated DSP together with analog and digital audio circuits, and the maker places its sound quality on a level with its FT-2Y FLIGHT TIME digital delay and FF-1Y FUTURE FACTORY RF phase modulation delay.

  The unit's tone filter can process the delay sound to have a rich tone or, conversely, take it far from the original sound. Several filters can be applied at once, covering the proprietary Cosmic filter, a bandpass filter, a 3-band EQ and a Tone control; the Cosmic filter is the one the maker describes as adding an outer-space character to the delay. A newly developed reverse delay uses a new method intended to produce a smoother, more musical reverse sound.

  The output bit count of the delay sound is adjustable in 1-bit steps, from a smooth 24 bits down to a rough 8 bits that adds distorted noise as the volume drops. That covers the nuances of delay sounds from the 1980s and 1990s as well as bitcrusher-style delay.

  Effect processing runs on a dedicated DSP, combining 32-bit fixed-point high-speed arithmetic with 32-bit floating-point high-precision arithmetic. Delay time can be shown in milliseconds or as BPM, tempo can be tap-entered from the footswitch, and presets 1 and 2 can be switched from the footswitch. A small display improves operability, and the unit holds 128 user presets alongside 11 factory presets. Other functions include a feedback level limit, kill dry, trail on and off, and delay phase inversion.

  The original dry sound travels from input to output as an analog signal and is mixed with the delay sound at an internal analog mixer, so the output keeps the character of the original sound. Free The Tone's HTS (Holistic Tonal Solution) circuit performs impedance conversion while drawing out the sound characteristics of the guitar or bass, and prevents deterioration of the instrument sound even when the effect is off.
specs: |-
  - 128 user presets, 11 factory presets
  - Input impedance: 1M Ohm
  - Output load impedance: min. 10k Ohm
  - Max. input level: +10 dBm
  - Terminals: 1 x 1/4 inch standard TRS phone jack (IN (TRS)), 3 x 1/4 inch standard TS phone jacks (OUT/L, OUT/R, EXP/CV/FS), DC9V input jack (for AC-DC adapter), 3.5-mm stereo mini phone jack (MIDI IN)
  - Power supply: 9V DC center negative polarity, or 006P (9V) 6F22 alkaline battery
  - Current consumption: approx. 185 mA
  - Dimensions: 66 (W) x 125 (D) x 54 (H) mm including protuberances such as jacks
  - Weight: approx. 335 g
  - Multiple simultaneous filters: Cosmic Filter, Bandpass Filter, 3-Band EQ, Tone
  - Output bit number adjustment from 8 to 24 bits
  - Delay time shown in milliseconds or BPM, with tap tempo from the footswitch
  - Feedback level limit, kill dry, trail on/off and delay phase inversion functions
  - Dry signal stays analog from input to output and is mixed with the delay at an internal analog mixer
