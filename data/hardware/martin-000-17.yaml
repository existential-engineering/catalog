details: |-
  The Martin 000-17 combines classic design with modern refinements, featuring a solid mahogany satin-finished body that delivers a warm, woody tone characteristic of Martin's 17 Series instruments.

  Key appointments include Sitka spruce Golden Era (GE) top bracing for a vintage, breathy tone, traditional compound dovetail neck joint construction, a thinner fingerboard with beveled comfort edge, and refined string spacing for modern playability.

  The satin-finished select hardwood neck features a shorter 24.9-inch scale length for fast playability, with a vintage-inspired GE Modified Low Oval profile and High-Performance Taper. The 000-14 Fret body size offers comfortable ergonomics and balanced tonal response.

  The guitar ships with a hardshell case featuring brass/nickel plated hardware and a plush laminated wood shell, and comes pre-strung with Martin Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light strings.
specs: |-
  - Body Size: 000-14 Fret
  - Top: Solid Mahogany (Dark Mahogany, Satin)
  - Back & Sides: Mahogany (Dark Mahogany, Satin)
  - Bracing: Spruce X-Brace, GE-Scalloped (1/4")
  - Neck Joint: Dovetail
  - Neck Material: Select Hardwood (Dark Mahogany, Satin)
  - Neck Shape: GE Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Scale Length: 24.9"
  - Frets: 20 total, joins body at 14th fret
  - Fingerboard: Ebony
  - Nut Width: 1 3/4"
  - Width at 12th Fret: 2 1/8"
  - Fingerboard Inlay: GE Diamond and Square Short (Abalone)
  - Side Dots: White
  - Bridge: Ebony, GE Modern Belly, drop-in saddle
  - Saddle: Compensated Bone (16" radius)
  - Nut: Bone
  - Bridge Pins: Bone
  - Bridge String Spacing: 2 5/32"
  - Tuning Machines: Nickel Open Gear with Butterbean knobs
  - Pickguard: Faux Tortoise
  - Rosette: Multi-Stripe
  - Finish: Satin
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Light
  - Case: Hardshell with brass/nickel plated hardware
