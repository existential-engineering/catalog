description: The Giygas 2K is a highly modified fuzz engine in a slim two-knob
  format — the Muff for people that don't like Muffs. Unlike traditional
  dual-filter fuzz designs, the Giygas 2K sculpts its tone with respect to the
  surrounding circuitry, giving you volume-knob cleanup and a punchy, responsive
  feel. The Fuzz knob sweeps from a warm, slightly gritty boost all the way to a
  rich, rounded square-wave singing fuzz.
details: |-
  The Giygas 2K is a modified Big Muff-inspired fuzz in a slim two-knob enclosure. Rather than using a traditional dual-filter topology, the circuit is tuned to interact with the surrounding gear, offering volume-knob cleanup and a punchy, dynamic response.

  The Loud knob sets output volume. The Fuzz knob sweeps from a warm, slightly gritty boost at minimum to a rich, rounded square-wave singing fuzz at maximum. A set-and-forget pedal that covers wide ground in a compact package.
specs: |-
  - Modified Big Muff-style fuzz engine without the standard dual-filter tone circuit
  - Controls: Loud, Fuzz
  - Accepts a 9V center-negative power supply
  - Recommended to run at 9V for optimal instrument interaction
