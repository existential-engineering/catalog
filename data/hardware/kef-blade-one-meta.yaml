description: |-
  The world's first Single Apparent Source speaker, now featuring 12th
  generation Uni-Q® with Metamaterial Absorption Technology (MAT™). The Blade
  One Meta pairs a coaxially mounted 25mm aluminum dome tweeter and 125mm
  aluminum midrange cone with four 225mm force-cancelling bass drivers in a
  three-way bass reflex design.
specs: |-
  - Design: Three-way bass reflex, Single apparent source
  - HF driver: 25mm (1 in.) aluminum dome with MAT
  - MF driver: 125mm (5 in.) aluminum cone
  - LF drivers: 4x 225mm (9 in.) aluminum cone (force cancelling)
  - Frequency Response (-6dB): 27Hz - 45kHz
  - Frequency Response (±3dB): 35Hz - 35kHz
  - Sensitivity: 88dB (2.83V/1m)
  - Impedance: 4 ohms (min. 2.8 ohms)
  - Maximum SPL: 117dB
  - Amplifier Requirements: 50-400W
  - Crossover Frequencies: 350Hz, 2kHz
  - Dimensions (H×W×D): 1590 × 363 × 540mm (62.5 × 14.3 × 21.2 in.)
  - Weight: 57.2kg (126 lbs.)
