description: The Dante D Option is a factory-installed card that adds an eight
  channel Dante network output to any HV-3D microphone preamplifier. It carries
  24-bit 192 kHz audio over Audinate Dante and RedNet Ethernet networks, with
  Primary and Secondary connections for redundancy.
details: |-
  The Dante D Option adds eight channels of networked digital output to an HV-3D microphone preamplifier. It works with Audinate Dante and RedNet Ethernet networks at up to 24-bit 192 kHz across all eight channels.

  Primary and Secondary network connections are provided so the card can sit on a redundant Dante network. Any HV-3D unit can have the option installed, and installation is done at the factory, with the card powered by the host preamplifier rather than a supply of its own.
specs: |-
  - Channels: 8 Dante network outputs
  - Resolution: 24-bit, up to 192 kHz
  - Networks: Audinate Dante and RedNet Ethernet
  - Network Connections: Primary and Secondary for redundant networks
  - Host Compatibility: All HV-3D units
  - Installation: Factory-installed, powered by the host unit
