description: "Bring your perfect studio guitar sound onstage with the new
  AmpliTube X-DRIVE distortion pedal. This boutique pedal features 16 all-new
  overdrive and distortion effects leveraging IK's latest AmpliTube
  technologies, accompanied by an exclusive virtual X-GEAR version."
details: |-
  X-DRIVE features 16 overdrive and distortion algorithms: MODERN, METAL, MONARCH, CAT, ORANGE, YELLOW, GREEN, DIODE, BLUE, BOOSTER, H-BOOST, CRUSH, OCTOFUZZ, PURPLE, FUZZACE, and BIG-FUZZ. X Mode enables advanced cab simulation with 5 built-in cabinet impulse responses. 50 factory presets are included with room for 300 total.

  Controls include MODEL encoder, PRESET encoder, PARAMETER encoder with sub-parameters, main parameter knobs, and 3 footswitches (A, B, TAP). An 8-character 16-segment LCD display provides clear visual feedback. Selectable true bypass or soft bypass modes accommodate different rig configurations.

  Anodized aluminum chassis. Designed and made in Italy. Includes virtual X-DRIVE plugin for Mac/PC, AmpliTube 5 SE, and X-GEAR Librarian app.
specs: |-
  - Ultra-low noise 24-bit/192 kHz converters with 4x oversampling
  - Frequency response: 5 Hz - 24 kHz
  - Dynamic range: 123 dB
  - 16 overdrive/distortion algorithms
  - 50 factory presets, 300 total storable
  - Selectable true or soft bypass
  - 5 cabinet impulse responses
  - 8-character 16-segment LCD display
  - 3 footswitches
  - Anodized aluminum chassis
  - Dimensions: 175 x 145 x 58 mm (6.88" x 5.7" x 2.28")
  - Weight: 906 g (31.96 oz)
  - Power: 9V DC center-negative (PSU included)
