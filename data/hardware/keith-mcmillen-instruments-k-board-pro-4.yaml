description: K-Board Pro 4 is a four-octave, 48-key MPE MIDI keyboard controller
  with multiple dimensions of touch sensitivity in each key, powered over USB.
details: |-
  K-Board Pro 4 is a 48-key MPE MIDI keyboard controller, four octaves wide, with multiple dimensions of touch sensitivity in every key. Each key sends attack velocity, release velocity, continuous pressure, horizontal position and vertical position data to a DAW or synthesizer.

  Under each key is the Smart Sensor Fabric technology used across the maker's MIDI control surfaces. Resilient silicone keys and the absence of moving parts are intended to keep the surface durable in use.

  The keyboard is USB powered and class compliant, so it works with all operating systems as well as MIDI capable hardware without a driver.
specs: |-
  - 48 keys, four octaves
  - MPE MIDI keyboard controller with multiple dimensions of touch sensitivity per key
  - Each key sends attack velocity, release velocity, continuous pressure, horizontal position, and vertical position
  - Smart Sensor Fabric sensing under each key
  - Resilient silicone keys with no moving parts
  - Class compliant, no driver required
  - USB bus powered, no external power supply
