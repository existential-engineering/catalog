id: JogfwO8q-u76yS73XKCam
name: DM16
manufacturer: midas
primaryCategory: mixer
url: "https://www.midasconsoles.com/en/products/0601-AHA"
description: 16 Input Analogue Live and Studio Mixer with MIDAS Microphone
  Preamplifiers. Designed for live performance and studio recording, the DM16
  accommodates small bands, worship teams, and serves as a sub-mixer for larger
  setups. Features 12 mono channels with XLR mic inputs and 2 stereo channels
  (13/14 and 15/16), 3-band EQ with mid-sweep, 2 switchable pre/post-fader aux
  sends, +48V phantom power, and an internal switch-mode power supply.
details: |-
  The Midas DM16 is a 16-input analogue live and studio mixer featuring MIDAS microphone preamplifiers. It provides 12 mono channels with balanced XLR mic inputs and 1/4" TRS line inputs (each with insert points), plus 2 stereo channels (13/14 and 15/16) accepting 1/4" TRS line-level signals. Each mono channel offers a 3-band EQ with sweepable mid (150 Hz–3.5 kHz, ±15 dB), shelving treble (12 kHz, ±15 dB) and bass (80 Hz, ±15 dB), 2 switchable pre/post-fader aux sends, PFL, mute, and peak LED. The stereo channels feature 2-band EQ and balance control. The mixer includes balanced XLR main outputs with insert jacks, 1/4" TRS aux and monitor outputs, RCA 2-track in/out for recording playback, and a 1/4" stereo headphone output. Global +48V phantom power is available with indicator LED. Powered by an internal switch-mode supply (100–240 VAC, 50/60 Hz) with IEC mains connector. Designed for small bands, worship teams, and sub-mixing in larger setups.
specs: |-
  - Input Channels: 16 (12 mono + 2 stereo)
  - Mono Channels: 12 with XLR mic inputs
  - Stereo Channels: 2 (channels 13/14 and 15/16)
  - Channel Faders: 14 x 60mm
  - Master Faders: 2 x 60mm
  - EQ: 3-band (treble, mid, bass) with mid-sweep (150 Hz–3.5 kHz)
  - Treble EQ: ±15 dB shelving at 12 kHz
  - Bass EQ: ±15 dB shelving at 80 Hz
  - Aux Sends: 2 switchable pre/post-fader
  - Mic Gain Range (mono): 10 to 60 dB
  - Line Gain Range (mono): -10 to +40 dB
  - Stereo Gain Range: -20 to +20 dB
  - Aux Control Range: 0 to +10 dB
  - Phantom Power: +48V (global)
  - Power Supply: Internal switch-mode
  - Power: 100–240 VAC, 50/60 Hz
  - Mains Connector: IEC
  - Height: 95 mm (3.7 in)
  - Width: 438 mm (17.2 in)
  - Depth: 370 mm (14.6 in)
  - Weight: 5 kg (2.3 lbs)
  - Metering: 2 x LED meter ladders
  - Per-Channel Features: PFL, Mute, Peak LED
