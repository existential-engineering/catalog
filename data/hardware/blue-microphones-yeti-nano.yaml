description: The Logitech G Yeti Nano premium USB microphone delivers
  broadcast-quality sound for podcasting, YouTube videos, Twitch streaming and
  Zoom calls. Inspired by the legendary Yeti, Yeti Nano combines legendary sound
  quality with powerful Blue VO!CE vocal effects for professional recording and
  streaming.
details: |-
  Yeti Nano is a compact dual-pattern USB condenser microphone built around two proprietary 14 mm capsules, aimed at podcasting, YouTube videos, Twitch streaming and Zoom calls. It records at 24-bit / 48 kHz and connects to a computer or laptop over a single USB cable with no drivers required.

  Two pickup patterns cover the common streaming cases. Cardioid mode captures sound sources directly in front of the microphone for rich, full-bodied speech, suited to Twitch streaming, podcasting, voiceovers and Discord calls. Omnidirectional mode picks up sound equally from all around the microphone, for capturing the ambience of a room, a multiplayer board game session, a few guests, or a roundtable discussion.

  An internal shockmount isolates the 2-capsule array from desk and stand vibration to keep the recording focused on the voice. A pattern button and a headphone control sit on the microphone body, and an onboard headphone amplifier drives a monitoring output rated at 58 mW per channel into 16 ohms, with a 15 Hz to 22 kHz response and 100 dB signal to noise.

  Blue VO!CE vocal effects are available through the free Logitech G HUB software, which runs the processing on the host computer rather than on the microphone. The filter set covers EQ, noise reduction, high-pass filtering, compression and de-essing, along with voice modulation and HD audio samples for stream playback.

  The microphone ships on a built-in adjustable metal desktop stand that sets the angle of the capsule without blocking a monitor. The stand can be removed to mount Yeti Nano on a desktop boom arm such as Compass. Measured with the stand fitted it is 21.1 cm high, 9.6 cm wide and 10.9 cm deep, and weighs 0.63 kg.
specs: |-
  - Capsules: 2 proprietary 14 mm condenser capsules
  - Polar patterns: Cardioid, Omnidirectional
  - Sample rate: 48 kHz
  - Bit rate: 24-bit
  - Frequency response: 20 Hz - 20 kHz
  - Sensitivity: 4.5 mV/Pa (1 kHz)
  - Max SPL: 120 dB (THD: 0.5% 1 kHz)
  - Headphone amplifier impedance: >16 Ohms
  - Headphone amplifier power output (RMS): 58 mW per channel (R load = 16 Ohms)
  - Headphone amplifier THD: 0.009%
  - Headphone amplifier frequency response: 15 Hz - 22 kHz
  - Headphone amplifier signal to noise: 100 dB
  - Power: USB bus powered, 5 V 150 mA
  - Internal shockmount
  - Built-in adjustable metal desktop stand, removable for mounting on a desktop boom arm
  - Dimensions (mic with stand): 21.1 cm H x 9.6 cm W x 10.9 cm L (8.31 in x 3.78 in x 4.29 in)
  - Weight: 0.63 kg (1.39 lbs)
  - System requirements: Windows 10 or later, or macOS 10.14 or later, with USB
    1.1/2.0/3.0
  - Blue VO!CE vocal effects require the free Logitech G HUB software
  - Warranty: 2-Year Limited Hardware Warranty
  - In the box: Yeti Nano USB microphone (including desktop stand), USB cable, user documentation
