description: Dual-pattern USB microphone with Blue VO!CE. Features broadcast
  quality sound, compact footprint, built-in metal stand, Blue VO!CE vocal
  effects and 2 pickup patterns.
details: |-
  The Logitech G Yeti Nano premium USB microphone delivers broadcast-quality sound for podcasting, YouTube videos, Twitch streaming and Zoom calls. Inspired by the legendary Yeti, Yeti Nano combines legendary sound quality with powerful Blue VO!CE vocal effects for professional recording and streaming. Blue VO!CE requires download and installation of the free G HUB software.

  Every aspect of Yeti Nano is designed to help you game, record and stream easily. The compact footprint fits perfectly on any desktop, and the sleek aesthetic looks great on camera. The built-in metal stand makes it easy to adjust the angle of the mic so your squad can hear you without your mic blocking your screen.

  Yeti Nano features 2 capsules and 2 pickup patterns, perfect for game streaming, YouTube videos, Discord chat and more. Cardioid mode captures sound sources that are directly in front of the microphone, delivering rich, full-bodied sound, which suits Twitch streaming, podcasting, voiceovers and Discord calls. Omni mode picks up sound equally from all around the mic, best for capturing the ambience of being there, like streaming a multiplayer board game session, Just Chatting with a few guests, or hosting a roundtable discussion over Discord.

  Yeti Nano makes it easier than ever to achieve professional on-stream sound quality with Blue VO!CE vocal effects. Sculpt your sound with tools like EQ, noise reduction and de-essing, transform your voice with advanced voice modulation, and entertain your stream audience with HD audio samples. Yeti Nano's internal shockmount protects the 2-capsule array and helps keep your content clean and focused on your voice.

  When inspiration strikes, Yeti Nano is ready to capture it. Just plug it straight into your computer or laptop with the included USB cable and you are set to record or stream right away, with no drivers required. The desktop stand lets you set the perfect angle to pick up your voice, or you can remove the stand and mount Yeti Nano to a desktop boom arm like Compass.
specs: |-
  - 2 proprietary 14 mm condenser capsules
  - Polar patterns: cardioid, omnidirectional
  - Sample rate: 48 kHz
  - Bit rate: 24-bit
  - Frequency response: 20 Hz - 20 kHz
  - Sensitivity: 4.5 mV/Pa (1 kHz)
  - Max SPL: 120 dB (THD: 0.5% 1 kHz)
  - Power required/consumption: 5V 150 mA, drawn over the USB connection (USB bus powered)
  - Internal shockmount
  - Built-in adjustable metal desktop stand, removable for boom arm mounting
  - Plug and play, no drivers required
  - Headphone amplifier impedance: >16 Ohms
  - Headphone amplifier power output (RMS): 58 mW per channel (R load = 16 Ohms)
  - Headphone amplifier THD: 0.009%
  - Headphone amplifier frequency response: 15 Hz - 22 kHz
  - Headphone amplifier signal to noise: 100 dB
  - Dimensions with stand: 21.1 cm H x 9.6 cm W x 10.9 cm L (8.31 x 3.78 x 4.29 in)
  - Weight: 0.63 kg (1.39 lbs)
  - In the box: Yeti Nano USB microphone including desktop stand, USB cable, user documentation
  - Blue VO!CE vocal effects (EQ, noise reduction, de-essing, voice modulation, HD audio samples) require the free G HUB software
  - Part number: 988-000088
