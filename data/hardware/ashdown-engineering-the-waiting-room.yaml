description: The Waiting Room is a high quality digital delay pedal that
  produces a warm, organic reproduction of your original signal, ranging from a
  light analogue-like delay to full-bodied tape-like sounds while keeping the
  original signal intact.
details: |-
  From Dr Green, The Waiting Room delivers the consistency and reliability of a digital delay while producing a warm, organic reproduction of the original signal. It ranges from a light analogue-like delay to full-bodied tape-like sounds, with total transparency keeping the dry signal intact. It features true bypass switching and a custom steel casing built to stand up to being stomped on night after night.
specs: |-
  - Type: digital delay pedal
  - Range: light analogue-like delay to tape-like delay
  - Switching: true bypass
  - Housing: custom steel casing
