description: The KT-15 delivers 15 watts of tube-like warmth in a compact guitar
  practice amp designed for great tone at home. It carries two channels (Clean
  and Overdrive), a single 8" speaker, a line input for jamming along to tracks,
  and a headphone output for silent practice, with simple, intuitive controls
  for consistent Killer Tone.
details: |-
  Compact 15-watt solid-state guitar practice amp. Two channels: Clean (detailed articulation) and Overdrive (punchy, dynamic distortion), voiced for tube-like warmth with solid-state reliability. Single 8" speaker. Line input for jamming along to tracks. Headphone output for silent practice. Simple, intuitive controls.
specs: |-
  - Power output: 15 watts (solid-state)
  - Channels: 2 (Clean & Overdrive)
  - Speaker: 1 x 8"
  - Line input for jamming with tracks
  - Headphone output for silent practice
