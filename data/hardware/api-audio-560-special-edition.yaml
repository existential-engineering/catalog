url: https://apiaudio.com/product/560-special-edition/
description: 10-band graphic EQ based on the original 1969 API 560 design, with
  improved ±4 dB resolution, API 2520 op-amp, custom output transformers, and
  proportional Q filtering. Active Special Edition upgrade to the standard 560.
details: |-
  500-series 10-band graphic EQ at octave centers: 31, 63, 125, 250, 500
  Hz, 1k, 2k, 4k, 8k, 16 kHz. ±12 dB boost/cut. Improved ±4 dB resolution vs
  original 1969 design. Proportional Q (narrows at extremes). API 2520 op-amp
  and custom output transformers. Silent bypass. Center detent per band.
  Compatible with 500V, 500H, 500b lunchbox, and legacy API consoles.
  15-position 0.156″ edge connector.
specs: |-
  - Filter slope: 12 dB/octave at full boost/cut
  - Input impedance: 20 kΩ (balanced)
  - Output impedance: <85 Ω
  - Nominal level: −15 to +15 dBu
  - Clipping level: >+28 dBu
  - Frequency response: +0, −0.25 dB (30 Hz–20 kHz)
  - Noise floor: −95 dBu output
  - THD: 0.05% max @ +20 dBu
  - Power: ±12/18V DC @ 60 mA
  - Dimensions: 1.5″ × 5.25″ × 6.75″ D
  - Weight: 1.61 lb
