details: |-
  702 S3 Signature is the Signature edition of the flagship floor-standing loudspeaker in the Bowers & Wilkins 700 Series, a three-way vented-box design carrying a 25mm Decoupled Carbon Dome high-frequency unit in a Solid Body Tweeter-on-Top housing, a 150mm Continuum cone FST midrange driver and three 165mm Aerofoil Profile bass cones. Bowers & Wilkins describes it as engineered for pristine studio-quality sound at home, using upgraded midrange and low-frequency motor systems, improved capacitors, revised speaker terminals and a more open tweeter grille mesh, all developed for the 800 Series Signature loudspeakers.

  Bowers & Wilkins presents the Signature models as a refinement pass over the standard range rather than a new platform: the 700 Series Signature models are built with the same techniques as the rest of the range, then optimised in small details to reflect the latest developments in the company's audio engineering. The stated goal is a pinnacle in performance and design within the series, and the same treatment is applied to the 705 S3 Signature stand-mount and the HTM71 S3 Signature centre channel.

  The speaker is entirely passive and carries no amplification, no mains inlet and no line-level input. The 700 Series 3 manual states that there are two linked pairs of terminals on the back of the speaker, labelled HF and LF. For conventional single-wire connection the terminal links stay in place as delivered and only one pair is connected to the amplifier; for bi-wiring or bi-amplification the links are removed and each pair is connected independently. The terminals accept 4mm banana plugs, 6mm and 8mm spades, or bare wire up to 4mm diameter, with the 4mm holes blocked by plastic pins on delivery to satisfy European CENELEC safety rules.

  Installation is floor-standing only. The supplied plinth must always be fitted, with the spike or rubber feet inserted into the plinth rather than directly into the cabinet, and the tommy bar and spanner supplied with the 702 S3 are used to lock the feet once positioning is settled. For stereo the manual suggests 1.5m to 3m between speakers in an equilateral triangle with the listening position, at least 0.5m from the back and side walls, and for home theatre use within roughly 0.5m of the sides of the screen. The drive units create stray magnetic fields, so magnetically sensitive items should be kept 0.5m away.

  Low-frequency output can be tuned with the supplied two-piece foam port plugs, using either the outer piece alone for gentler attenuation or the complete assembly, which is the intended remedy when the speaker cannot be moved further from a wall. Performance changes during the initial listening period: the manual asks for up to a week for temperature effects to stabilise and about 15 hours of average use for the drive unit suspensions and damping compounds to reach their intended mechanical characteristics.
specs: |-
  - Description: 3-way vented-box system
  - Drive units: 1x 25mm (1 in) Decoupled Carbon Dome high-frequency, 1x 150mm (6 in) Continuum cone FST midrange, 3x 165mm (6.5 in) Aerofoil Profile bass
  - Frequency range: -6dB 28Hz to 33kHz
  - Frequency response: 46Hz to 28kHz +/-3dB
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 86Hz to 28kHz, less than 0.5% 110Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 3.1 ohms)
  - Recommended amplifier power: 30W to 300W into 8 ohms on unclipped programme
  - Sensitivity: 90dB
  - Max recommended cable impedance: 0.1 ohms
  - Technical features: Decoupled Carbon Dome tweeter, Solid Body Tweeter-on-Top, Continuum cone FST midrange, decoupled midrange, Aerofoil Profile bass cones, Flowport
  - Passive: no on-board amplification and no mains connection. Two linked pairs of HF and LF terminals, single-wire as delivered, bi-wire or bi-amp with the links removed
  - Terminals accept 4mm banana plugs, 6mm and 8mm (1/4 in and 5/16 in) spades, or bare wire up to 4mm (5/32 in) diameter
  - Dimensions: height 1010mm (39.8in) cabinet only, 1138mm (44.8in) including tweeter and plinth; width 192mm (7.6in) cabinet only, 290mm (11.4in) including plinth; depth 354mm (13.9in) cabinet only, 391mm (15.4in) including grille and terminals, 410mm (16.1in) including plinth
  - Net weight: 35.26kg (77.7lb)
  - Cabinet finishes: Midnight Blue Metallic, Datuk Gloss
  - Grille finish: Black
  - Supplied with plinth, spike feet, rubber feet and two-piece foam port plugs
