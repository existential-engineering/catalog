  Aerofoil Profile bass drivers. Signature edition adds upgraded crossover
  components, revised speaker terminals, and an open tweeter grille mesh design.
details: |-
  The 702 S3 Signature is the flagship of Bowers & Wilkins' 700 Series Signature range, a refined evolution of the standard 702 S3 floor-standing loudspeaker. Engineered for high-performance two-channel listening, it employs a 3-way vented-box system with a tweeter-on-top design that decouples the high-frequency driver from the main enclosure to reduce coloration.

  Driver complement comprises a 25mm Decoupled Carbon Dome tweeter, a 150mm Continuum cone FST (Fixed Suspension Transducer) midrange, and three 165mm Aerofoil Profile bass drivers. The Aerofoil cones use a variable-thickness profile to maintain stiffness while reducing mass, supporting clean low-frequency reproduction down to 28Hz (-6dB).

  Signature treatments over the standard 702 S3 include improved midrange and low-frequency motor systems, upgraded bypass capacitors in the crossover, revised binding-post terminals, and an open-weave tweeter grille mesh said to improve high-frequency transparency. The cabinet is finished in either Datuk Gloss real-wood veneer or Midnight Blue Metallic paint, both exclusive to the Signature edition.

  Specified sensitivity is 90dB with a nominal 8Ω impedance (3.1Ω minimum), recommended amplifier power range is 30W to 300W into 8Ω, and harmonic distortion is rated below 1% across most of the audible band. The speaker stands 1,138mm tall with the tweeter pod and plinth fitted, and weighs 35.26kg (77.7 lbs) per cabinet.

  The 702 S3 Signature is supplied as a pair and carries a 5-year warranty from date of purchase. It is an EISA Award recipient.
specs: |-
  - System: 3-way vented-box
  - Tweeter: 1× 25mm Decoupled Carbon Dome
  - Midrange: 1× 150mm Continuum cone FST
  - Bass: 3× 165mm Aerofoil Profile
  - Frequency range: 28Hz–33kHz (−6dB)
  - Frequency response: 46Hz–28kHz ±3dB
  - Sensitivity: 90dB
  - Nominal impedance: 8Ω (minimum 3.1Ω)
  - Recommended amplifier power: 30W–300W into 8Ω
  - Harmonic distortion: <1% (86Hz–28kHz); <0.5% (110Hz–20kHz) at 90dB SPL, 1m on-axis
  - Max recommended cable impedance: 0.1Ω
  - Height: 1,138mm (with tweeter and plinth)
  - Width: 290mm (with plinth)
  - Depth: 410mm (with plinth)
  - Weight: 35.26kg (77.7 lbs)
  - Finishes: Datuk Gloss, Midnight Blue Metallic
  - Warranty: 5 years
