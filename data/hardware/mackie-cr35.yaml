description: Shape the sound of your Mackie CR3.5 studio monitors on the fly, so
  you can mix a podcast episode, listen to music and DJ a house party, all with
  the same set of compact speakers.
details: |-
  Mackie CR3.5 and CR4.5 Creative Reference Powered Studio Monitors combine professional-quality sound with a selection of inputs and switchable desktop and bookshelf modes, giving clear, accurate sound for content creation, music production and casual listening.

  CR3.5 studio monitors have the clear, accurate sound you need to produce and record music. With the tone knob turned all the way left, you get a flat frequency response for tracking and mixing. Crank the tone knob to the right to hear more bass and sparkle.

  Hook up audio interfaces, mixers, record players and other playback devices with TRS, RCA and 3.5 mm inputs. All inputs may be used simultaneously and sum together rather than overriding each other.

  Use the tone control knob to shape the sound, starting with the transparent response you expect from studio monitors. Turn the knob to gradually boost the bass and add high-end sparkle, perfect for immersive gaming, casual listening or all-out party use.

  Flip the location switch between desktop speaker mode and bookshelf speaker mode to optimise the monitors for wherever you place them. Use desktop mode for listening up close and bookshelf mode for listening at a distance.

  The powered monitor carries the amplification, the connections and a front-panel headphone output that auto-defeats the speaker output. Spring-clip wire terminals on the rear panel feed the matching passive monitor, and a position select switch sets whether the powered monitor sits on the left or the right.
specs: |-
  - Sound-shaping tone control
  - Location switch with desktop and bookshelf modes
  - 50 watts RMS of bi-amplified Class A/B amplification
  - TRS, RCA and 3.5 mm inputs
  - Built-in headphone output
  - Silk dome tweeter with protective grille, 1.0 in / 25 mm
  - 3.5 in / 89 mm woven woofer
  - Input impedance 10 k ohm
  - Custom-tuned rear port tube
  - Solid MDF enclosure with black vinyl wrap
  - Detachable line cord: 100V to 240V~, 50 to 60 Hz, 60W
  - Size (H x W x D): 8.1 x 5.5 x 7.1 in / 206 x 140 x 180 mm
  - Weight: 8.2 lb / 3.7 kg
