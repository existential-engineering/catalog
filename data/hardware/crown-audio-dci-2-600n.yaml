description: Two-channel, 600W @ 4Ω Power Amplifier with BLU link, 70V/100V. EN
  54-16 compliant for life safety applications.
details: |-
  The DCi 2|600N is part of the DriveCore Install Network series, delivering high-performance installation capability via Crown's proprietary DriveCore technology. The 2-channel design provides 600W per channel into 4Ω in a compact 2RU chassis and is EN 54-16 compliant for life safety voice alarm applications.

  The amplifier features both balanced analog inputs and HARMAN's proprietary BLU-Link digital audio transport, with a priority input router and automatic failover. Network monitoring and control are available via HiQnet protocol over standard TCP/IP, and programmable GPIO ports support volume controls, preset recall, and error reporting integration.

  Integrated DSP includes LevelMAX limiters, input and output EQ, crossover, delay, matrix mixer, and speaker line monitoring. The amplifier supports 70V/100V constant voltage output and bridge mono mode operation, with continuously variable speed forced-air cooling and a universal power supply.
specs: |-
  - Output Channels: 2
  - Output Power (4Ω, Dual Mode): 600W
  - Output Power (Bridge Mono, 8Ω): 1200W
  - Frequency Response (8Ω, 20Hz–20kHz): ±0.25dB
  - Total Harmonic Distortion: 0.35%
  - Damping Factor (20Hz–100Hz): >1000
  - Load Impedance (Stereo): 2Ω–16Ω; 70Vrms/100Vrms
  - Load Impedance (Bridge Mono): 4Ω–16Ω; 140Vrms/200Vrms
  - Inputs: Balanced analog + BLU-Link digital audio transport
  - Certification: EN 54-16 compliant
  - Cooling: Continuously variable speed forced air
  - Max Fan Noise: 45 dBA @ 1M
  - AC Mains: 100V–240V ~ 50/60Hz
  - Power Connector: 15A IEC
  - Dimensions: 483 × 89 × 362 mm (19″ × 3.5″ × 14.25″)
  - Weight: 8.53 kg (18.8 lbs)
