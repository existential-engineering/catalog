name: "234XL"
manufacturer: dbx
primaryCategory: filter
capabilities:
  - filter
url: https://dbxpro.com/en/products/234xl
description: Stereo 2/3-Way, Mono 4-Way Crossover with XLR balanced connectors
  and Linkwitz-Riley 24dB/octave filters.
details: |-
  The dbx 234XL represents precision engineering designed for demanding audio applications. The unit incorporates an internal high-quality power supply, and all inputs and outputs utilize XLR balanced jacks securely bolted to the chassis, protecting circuit boards from mechanical stress.

  Operational flexibility is a core strength, with back panel switches enabling selection between stereo 2-way, 3-way, or mono 4-way configurations. Users can independently control crossover frequencies for both channels, with front-panel LEDs confirming ×10 switch activation status. The design incorporates recessed 40 Hz high-pass filters and phase reverse switches on all outputs.

  The 234XL employs Linkwitz-Riley filters at 24 dB per octave. Individual level controls on all band outputs enable precise gain matching from −6 dB to +6 dB. CSA NRTL/C approved and CE compliant, with a 2-year parts and labor warranty.
specs: |-
  - Input Connectors: XLR
  - Input Impedance (Balanced): >50k ohm
  - Input Impedance (Unbalanced): >25k ohm
  - Max Input Level: >+21 dBu
  - CMRR: >40 dB, typically >50 dB at 1 kHz
  - Output Connectors: XLR
  - Output Impedance (Balanced): 200 ohm
  - Output Impedance (Unbalanced): 100 ohm
  - Max Output Level: >+21 dBu into 2k ohm or greater
  - Bandwidth: 20 Hz to 20 kHz, ±0.5 dB
  - Frequency Response: <3 Hz to >90 kHz, +0/−3 dB
  - Dynamic Range: >114 dB unweighted
  - THD+Noise: <0.004% at +4 dBu, 1 kHz
  - Interchannel Crosstalk: <−80 dB, 20 Hz–20 kHz
  - Filter Type: Linkwitz-Riley, 24 dB/octave, state-variable
  - Crossover Frequency Range: 45–960 Hz or 450 Hz–9.6 kHz (×10)
  - Low Cut Filter: 40 Hz Butterworth, 12 dB/octave high-pass
  - Operating Voltage: 100–120/230 VAC, 50/60 Hz
  - Power Consumption: 15 W
  - Dimensions: 1.75" H × 19" W × 6.9" D
  - Weight: 4.0 lbs (1.8 kg)
