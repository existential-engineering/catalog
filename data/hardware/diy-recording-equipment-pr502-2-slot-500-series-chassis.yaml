description: A 2-channel, high-current 500-series power rack chassis available
  in desktop or 19-inch rack-mount format, providing clean regulated power for
  500-series modules.
details: |-
  The PR502 is a 2-channel, high-current, 500-series chassis in a desktop or 19" rack-mount format. The assembly process is fairly simple, and does not require dealing with wall power. Rugged and refined

  The PR502's minimalist, all-black chassis is made from anodized aluminum and powder-coated steel. The compact case fits into any desktop setup, while the optional rack ears make the PR502 compatible with standard 19" racks. High-current, low-noise

  Our custom, universal power supply provides up to 250mA of clean current per channel—almost double the 500-series spec—and can power up to four PR502 racks (eight modules). Additional filtering and regulating in the chassis ensures that the power for your modules is stable and dead quiet. Simplicity is a feature

  While the PR502 is designed with an emphasis on simplicity, it is a full-featured 500 rack. Beginner friendly

  Assembling the PR502 is safe and easy, thanks to the external power supply and our step-by-step instructions.
specs: |-
  - THRU jack for powering additional racks
  - LED power indicators for +/-16 and +48v
  - Neutrik XLR audio jacks
  - FEED feature turns your PR502 into a channel strip by patching channel 1 into channel 2 without a cable
  - Compressor link
  - 11" x 8" x 1.7" without rack ears
  - PR502 Assembly Guide
  - PR502 Rack Ears
  - PR502 Schematic
  - Rupert Neve Designs
  - AudioScape
