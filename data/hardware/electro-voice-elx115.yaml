id: v_mWacF7Vi2LBcHkW8ipM
name: ELX115
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/elx115/
description: 15-inch two-way passive loudspeaker from Electro-Voice's Live X
  series, delivering more power and fuller sound for larger rooms. Pairs an
  EVS-15K 15-inch woofer with a DH-1K 1.5-inch titanium-diaphragm compression
  driver for 134 dB peak SPL from an internally braced 15 mm plywood enclosure
  with textured paint finish.
details: >-
  Positioned as a powerful step up from the ELX112 in the Live X family, the
  ELX115 extends low-frequency response for medium-to-large rooms while keeping
  a portable footprint typical of the series.


  The 1.5-inch DH-1K titanium compression driver is paired with the 15-inch
  EVS-15K woofer through a 1.7 kHz crossover, delivering a nominal 90 degree by
  50 degree coverage pattern suited to FOH and stage-monitor duty.


  Cabinet construction uses 9-ply 15 mm plywood with internal bracing and a
  textured paint finish, fronted by an 18 GA black powder-coated steel grille.
  Deployment options include pole-mounting or stacking with Live X subwoofers.
specs: |-
  - Configuration: 2-way passive full-range
  - LF transducer: EVS-15K 15 in (381 mm) woofer
  - HF transducer: DH-1K 1.5 in (39 mm) titanium-diaphragm compression driver
  - Power handling (continuous / peak): 400 W / 1600 W
  - Frequency response (-3 dB): 75 Hz - 18 kHz
  - Frequency range (-10 dB): 50 Hz - 20 kHz
  - Maximum SPL: 134 dB
  - Axial sensitivity: 95 dB
  - Nominal impedance: 8 ohms
  - Minimum impedance: 7.4 ohms
  - Crossover frequency: 1.7 kHz
  - Coverage pattern (nominal): 90 degrees (H) x 50 degrees (V)
  - Recommended high-pass filter: 40 Hz
  - Input connectors: 2 x NL4 Speakon (parallel in/through)
  - Cabinet material: 9-ply 15 mm plywood, internally braced, textured paint
  - Grille: 18 GA steel with black powder coat
  - Mounting: pole mount or stack with Live X subwoofers
  - Dimensions (H x W x D): 708 x 432 x 382 mm (27.89 x 17.02 x 15.05 in)
  - Net weight: 21.9 kg (48.2 lb)
  - Shipping weight: 26.6 kg (58.6 lb)
