description: A Eurorack envelope generator module providing classic attack,
  decay, sustain, and release control with normal and inverted outputs, plus a
  manual trigger button.
details: |-
  The Stoel Music Systems ADSR provides a classic synthesizer envelope. Attack, decay, sustain, and release are all controlled with knobs. The ADSR envelope output is provided in both normal and inverted forms. The manual trigger button fires off the ADSR without a gate signal present, which is excellent for playing sounds live or sorting out complicated patches. Technical Specifications

  Width
  6 HP

  Depth
  21 mm

  Current Draw
  +12V: 15mA, -12V: 11mA, +5V: 0mA
specs: |-
  - Classic attack, decay, sustain, and release envelope
  - Output has normal and inverted modes
  - Manual button triggers the envelope without gate signal
