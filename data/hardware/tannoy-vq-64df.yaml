description: 2-Way Down-Firing Dual Concentric Mid-High Loudspeaker for
  high-performance installation applications. Modular design creates seamless
  tight-packed arrays for large sports arenas and stadia.
details: |-
  2-Way Down-Firing Dual Concentric Mid-High Loudspeaker for high-performance installation applications. Modular design creates seamless tight-packed arrays for large sports arenas and stadia. Dual Concentric 3.5" and 1.75" diaphragm compression drivers loaded into a single PSW (Point Source Waveguide) horn. Configurable for Single-Amp or Bi-Amp with Lake LM26/44 DSP or Lab Gruppen PLM+/D series. Down-firing configuration provides even coverage to areas immediately below main flown loudspeakers.
specs: |-
  - frequencyResponse: 400 Hz - 23 kHz (-3 dB)
  - frequencyRange: 350 Hz - 27 kHz (-10 dB)
  - sensitivity: 114 dB (1 W @ 1 m)
  - dispersion: 60 x 40 degrees (-6 dB)
  - directivityFactorQ: 19.3
  - directivityIndexDI: 12.9 dB
  - maximumSPL: 137 dB averaged, 143 dB peak
  - powerHandlingMF: 200 W continuous, 400 W peak (@ 8 Ω)
  - powerHandlingHF: 90 W continuous, 180 W peak (@ 8 Ω)
  - nominalImpedance: MF: 8 Ω, HF: 8 Ω
  - dimensions: 500 x 694 x 515 mm
  - weight: 29.5 kg
