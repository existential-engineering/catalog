description: It is a 1U stereo amplifier designed to boost your external signals
  into modular levels. Intellijel case's fully compatible.
details: |-
  The 1U TRS is a rear connector interface module designed for use with the Befaco 7U Case or Intellijel cases (7U and Palette). It provides total flexibility for connecting external audio signals to your modular system.

  The module features two stereo TRS channels that are fully reversible — each channel can be used independently as either an input or an output, making it adaptable to different signal routing needs. By using Y cables, four independent inputs or outputs can be obtained per module.

  Each channel includes an independent tip and ring attenuator that can be selectively engaged to convert modular signal levels to line output levels, allowing proper interfacing between modular-level and line-level equipment.

  The module is entirely passive, requiring no power from the case's power supply. It is designed, kitted, and assembled in Barcelona.
