description: This True Bypass pedal switches the signals from magnetic and piezo
  pick-ups just as free of losses and background noise as it does line signals,
  letting you change instruments without swapping cables.
details: |-
  There can't be anyone, anywhere, who doesn't know what a drag it can be swapping cables when changing instruments during a gig. The LEHLE 3AT1 SGOS removes it. This True Bypass pedal switches the signals from magnetic and piezo pick-ups just as free of losses and background noise as it does line signals. The secret is in its gold-plated-contact relays and its active pop-and-click suppression. Any differences in level can be ironed out, and Inputs A and B lowered relative to C.

  You can also feed signals from totally different sound sources, such as keyboards and CD/MP3 players, to an amp or a PA channel. All inputs and outputs, plus the internal signal path, are stereo. Press the active footswitch again to route the signal to the second output, and thus to an instrument tuner, another amp, or a mixing console channel.

  The LEHLE 3AT1 SGOS can be remote controlled using MIDI program change commands. You can also network the unit with other Lehle SGoS switchers via a stereo jack socket.

  Two of the three inputs feature a level control for volume adjustment, and all sockets and signal paths are fully stereo, so stereo preamps, keyboards or synthesizers can be connected. Both outputs are not intended for simultaneous use: hum-free parallel operation needs a separate isolation stage such as the P-SPLIT, LITTLE DUAL or DUAL SGoS.

  All Lehle switchers feature special relays and slide switches with gold-plated contacts for zero-loss switching, and a processor based on ARM Cortex-M technology controls the switching operation, giving a service life of 2 million switching operations.
specs: |-
  - Three inputs, two outputs, fully stereo sockets and signal path
  - True Bypass switching with gold-plated-contact relays
  - Active pop-and-click suppression
  - Level control on inputs A and B relative to C
  - TRS socket for networking with other LEHLE SGoS switchers and external MIDI equipment
  - Receives and sends MIDI program change commands
  - Weight: 645 g
  - Length: 103 mm / 4"
  - Width: 156 mm / 6.1"
  - Overall height: 47 mm / 1.9"
  - Supply voltage: 8 - 20 V DC
  - Current consumption: 97 mA
