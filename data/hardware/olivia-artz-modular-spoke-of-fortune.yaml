description: A clockable, resettable D-latch module with normal, inverted, and
  trigger outputs, usable as a component for building flip-flops and clock
  dividers.
details: |-
  Spoke of Fortune is a clockable, resettable D-latch with normal, inverted, and trigger outputs. It's a fundamental component of computing you can use to quantize the timing of triggers. You can self patch it to build a flip-flop. And a flip flop is a clock-divider! And a clock-divider is a suboctavizer! There's a lot you can do with it and it's weird you don't have one. Spoke stores the binary state present at the D(ata) input. When you C(lock) the module, the state is retrieved from the Q output. Spoke of Fortune Manual

  Spoke on ModularGrid

  - 2hp wide
  - 41mm deep (including power cable)
  - 6ma +12 V, 0ma -12 V, 0ma +5 V
