description: "Exceptional sound meets compact dimensions. The 4010A offers the
  same clarity, reliability and adaptability as its larger 4000 series family
  members – but in a tiny footprint."
details: |-
  The 4010A is the most compact member of Genelec's 4000 series of active installation loudspeakers, designed to deliver high-quality, neutral sound in commercial and public spaces where size and discretion matter. Despite measuring just 181 mm tall, it shares the same engineering DNA as its larger siblings, pairing a 76 mm bass driver with a 19 mm metal-dome tweeter, each driven by its own 25 W Class D amplifier. The cabinet is a die-cast aluminium Minimum Diffraction Enclosure (MDE) with rounded edges and an integrated Directivity Control Waveguide (DCW), which together give the 4010A an unusually flat on- and off-axis response for a speaker of its size.

  Frequency response extends from 67 Hz to 25 kHz (-6 dB), with a short-term maximum SPL of at least 96 dB and peak SPL of 105 dB at one metre. A balanced analog input on a 3-pin Euroblock connector accepts line-level signals from installed sources, and the internal active crossover and amplification remove the need for any external DSP, processor, or amplifier rack. The speaker is mains-powered, accepting 100-240 VAC at 50/60 Hz through a standard IEC-style inlet.

  A set of rear-panel room-response DIP switches lets installers tune the 4010A to its acoustic environment, with bass tilt, treble tilt, bass roll-off, and a desktop response setting available to compensate for boundary loading or reflective surfaces. Driver protection circuitry guards the woofer and tweeter against overload, and Genelec's Intelligent Signal Sensing (ISS) technology drops standby power consumption below 0.5 W after a period of silence – a meaningful reduction across the large numbers of speakers typical of installation projects.

  The 4010A is engineered for fixed installation. Threaded M6 inserts in the enclosure, a supplied simple wall bracket, and an extensive accessory ecosystem of ceiling mounts, wall mounts, truss adapters, table stands, and VESA brackets make it adaptable to almost any mounting scenario. The speaker is offered in three standard finishes – white (4010AW), producer black (4010AM), and unfinished raw aluminium (4010A RAW) – and can also be ordered in any of the AV-series RAL custom colors to match interior design schemes.

  Manufactured in Iisalmi, Finland using certified sustainable methods, the 4010A is positioned for hospitality, corporate AV, retail, public spaces, education, and music-venue installations where compact form, even coverage, and long-term reliability are required.
specs: |-
  - Frequency response: 67 Hz - 25 kHz (-6 dB)
  - Frequency response: 74 Hz - 20 kHz (±2.5 dB)
  - Short term max SPL: ≥96 dB
  - Peak SPL: ≥105 dB
  - Long term max SPL: ≥91 dB
  - Self-generated noise: ≤5 dB (A-weighted, 1 m)
  - Harmonic distortion 70-400 Hz: ≤3%
  - Harmonic distortion >400 Hz: ≤0.5%
  - Bass driver: 76 mm cone
  - Treble driver: 19 mm metal dome
  - Bass amplifier: 25 W Class D
  - Treble amplifier: 25 W Class D
  - Enclosure: Die-cast aluminium, reflex port
  - Signal input: 1 x Euroblock, balanced, 10 kOhm
  - Mains: 100-240 VAC, 50/60 Hz
  - Power consumption (ISS active): ≤0.5 W
  - Power consumption (idle): ≤5 W
  - Power consumption (full output): 30 W
  - Height: 181 mm
  - Width: 121 mm
  - Depth: 115 mm
  - Weight: 1.5 kg (3.3 lb)
