description: A single-channel 500-series microphone preamp with AEA's
  3rd-generation DC-coupled JFET circuit, providing 85dB of ultra-low-noise gain
  and 100KΩ input impedance (phantom off) for optimal performance with passive
  ribbon microphones.
details: |-
  Based on the circuit and topology of AEA's original TRP preamp, the TRP500 has the low noise, musical sonics, and ultra-high gain and impedance that AEA is renowned for. The TRP500 excels at drawing out the warmth and lush sound of ribbon mics as well as other top-level microphones. With up to 85 dB of quiet DC-coupled gain, minimal path architecture, and a gentle 115 Hz or 230 Hz high-pass filter, this preamp puts as little as possible between you and your audience.

  The ultra-high gain DC-coupled JFET circuit has two input impedances: 11,900 Ohms with phantom power ON and 100,000 Ohms with phantom power OFF. The 100,000 Ohm mode brings out the best in passive ribbons and tube mics, and also provides a unique balanced input for vintage, high-impedance dynamic mics.

  Like all AEA products, the TRP500 is handcrafted in Pasadena, California from locally sourced parts. AEA is a family-owned company with a small crew of skilled technicians, many of whom are musicians themselves.
specs: |-
  - Single-channel, 500-series format
  - 85dB of quiet DC-coupled JFET gain
  - Input impedance: 11,900 Ohms (phantom ON) / 100,000 Ohms (phantom OFF)
  - Switchable 115 Hz or 230 Hz high-pass filter
  - Switchable phantom power
  - Polarity reverse switch
  - Handcrafted in Pasadena, California
