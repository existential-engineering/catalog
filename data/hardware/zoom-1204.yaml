description: A studio-quality reverb and modulation effects processor with MIDI capability
specs: |-
  - 512 preset effect programs (16 effects x 2 banks x 16 patterns) plus 100 user memories, 612 programs in all
  - Manual mode edits parameters in real time, memory mode recalls any of the 100 stored settings, with store, recall and cancel functions
  - Bank A reverbs and delays: HALL, ROOM, PLATE, VOCAL, AMBI, ORCHE, STUDIO, SESSION, PERCUS, DRUMS, SOLO, DLY, ECHO, GATE, POWER, REVERSE
  - Bank B: CHORUS, FLANGER, PITCH, TREMOLO, DLY+REV, CHO+REV, FLG+REV, PIT+REV, CHO/REV, FLG/REV, PIT/REV, TRM/REV, CHO/ECHO, FLG/ECHO, PIT/ECHO, SFX
  - SFX bank: 10-band vocoder, rotary speaker simulation, vocal distortion with ping-pong delay and chorus, and ZNR Zoom noise reduction with separate L and R depth
  - Pattern 1 of every effect is a demo setting and patterns 2 to 16 vary reverb time, gate time, feedback, modulation rate or pitch interval
  - Reverb times from 0.5 to 9.0 seconds with diffusion, attack, pre-delay, high cut, high multiply, high damp, density and gate threshold parameters
  - Delay up to 740 ms with feedback from 0 to 95 percent, plus a fully separate two-channel echo
  - Pitch shifter with one octave of shift up or down along the major scale, and a detune pattern that moves L and R in opposite directions
  - Vocoder divides the left channel input into 10 frequency bands and takes its envelope from the MIC IN jack or the right channel input
  - Front-panel MIC IN mixes with the rear inputs, calling for a dynamic microphone rated at 600 ohms
  - Front-panel input, output, mix (dry/wet), EQ low gain, EQ high gain and EDIT 1 and EDIT 2 controls, effect selector, bank A/B switch, pattern selector and mode, effect, store, cancel and MIDI keys
  - MIDI IN receives control change and program change messages on a settable channel in memory mode, transmits nothing, and ignores note on, system exclusive, start/stop and NRPN
  - 18-bit A/D and D/A converters, both 128-times oversampling, 44.1 kHz sampling frequency
  - Frequency response 10 Hz to 20 kHz
  - Rear inputs (L/MONO, R): standard monaural phone jacks, -10 dBm to +4 dBm, input impedance 10 kilohms mono and 20 kilohms stereo
  - Mic input: standard monaural phone jack, -56 dBm to -36 dBm, input impedance 10 kilohms
  - Rear outputs (L, R): standard monaural phone jacks, -10 dBm to +4 dBm, impedance 2 kilohms or less
  - A low-output or high-impedance instrument (470 kilohms or higher) needs a preamp, mixer or compact effect device ahead of the input
  - Conforms to EIA and DIN 19-inch rack mounting (rack screws not supplied), metal enclosure
  - 482 (W) x 44 (H) x 115 (D) mm, 1.5 kg
  - 9V DC 300 mA from the supplied AC adapter
