description: Ultra-low-profile omnidirectional back-electret condenser headworn
  microphone terminated with a TA4F mini-XLR connector for use with
  Electro-Voice and Telex wireless bodypack transmitters. Designed for
  spoken-word applications in houses of worship, corporate AV, theater, and
  fixed installations.
details: >-
  The Electro-Voice RE97Tx is a micro-headworn condenser microphone engineered
  to virtually disappear on the performer while delivering natural, intelligible
  speech reproduction. Its ultra-low-profile boom and 3.05 mm capsule make it
  well suited to broadcast, theater, houses of worship, and corporate
  presentation applications where the microphone needs to stay out of sight on
  camera and on stage.


  The back-electret condenser capsule uses an omnidirectional polar pattern,
  which delivers a uniform off-axis response and tolerates head movement without
  dramatic level changes. The element handles up to 125 dB SPL at 1 percent THD
  with an open-circuit output voltage of 4 V, and the consumption is rated at
  less than 500 microamps so it imposes minimal load on a wireless bodypack's
  bias supply.


  The earpiece is symmetrical and can be flipped to mount on either the left or
  right ear, simplifying setup for multi-presenter rentals and installations.
  The cable is terminated with a TA4F (4-pin mini-XLR) connector that mates
  directly with EV and Telex wireless bodypacks; the same termination can be
  paired with the EV TXA preamp adapter to convert the headworn microphone for
  wired phantom-powered XLR use. The microphone ships in beige, brown, and black
  finishes to blend with a range of skin tones and hair colors.
specs: >-
  - Mic type: Headworn

  - Element: Back-electret condenser

  - Polar pattern: Omnidirectional

  - Maximum SPL (1% THD): 125 dB

  - Open circuit voltage: 4 V

  - Current consumption: < 500 µA

  - Connector: TA4F (mini-XLR, 4-pin female)

  - Wired/wireless: Wireless (compatible with EV and Telex bodypack
  transmitters)

  - Maximum capsule diameter: 3.05 mm

  - Net weight: 0.017 lb (~7.7 g)

  - Mounting: Interchangeable left/right ear

  - Available finishes: Beige, brown, black

  - Application: Speech

  - Compatible with TXA preamp adapter for wired XLR (phantom-powered) use
