details: |-
  Features
  The LINGONBERRY OVERDRIVE inherits the characteristics of the original Strawberry Red Overdrive, however, it produces a stronger distortion and a low cut trim pot has been installed. Additionally, lower-end frequencies are more predominant. In order to make these changes, BJF has reduced the signal necessary to obtain the perfect amount of distortion and compression. Specifications Input Impedance: 330K Output impedance: 25K Drive voltage: 9 V Current consumption: 4 mA S / N ratio: -86 dB Size: 39 W x 100 D x 31 H mm (not including projections) 　　　　47 W x 100 D x 48 H mm (including projections) Weight: Approximately 160 g True-Bypass Switching High Quality Aluminum Enclosure Power: 9V Battery or Standard DC Power Supply Bjorn's Description It is safe to say that the Strawberry Overdrive hsa been and continues to be one of the best selling BJF Series FX pedals. For this reason, I decided to expand on this models success with two other models; The Cranberry and Lingonberry. The LINGONBERRY OVERDRIVE is a higher gain version of the Strawberry Red Overdrive. In addition to having optimized control over lower gain sounds, the filtering has been altered to allow a bit more bite as well as a tighter sound. The player can adjust 3 characteristics: Volume: Output volume Treble: Allows to change the tone from 'soft' to 'slightly biting' Drive: Sets the gain and distortion of the circuit. Low: Trimmer switch that sets the low-end frequency response - Bjorn Juhl

