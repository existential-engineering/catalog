description: A retro form factor updated with forward-looking functionality,
  designed as an easy-to-use compact standalone workstation. The first hardware
  tracker in the music world, combining a sampler, wavetable and granular
  synthesizer, step sequencer and song arranger, and performance mode.
details: |-
  A retro form factor updated with forward looking functionality and designed as an easy to use compact standalone workstation. Made for creatives who break patterns on a daily basis. Designed to help artists forge unique avenues of sonic construction, Tracker was the first hardware tracker in the music world.

  Polyend Tracker is equipped with a variety of powerful sound design tools. Use samples from your existing library, record new ones with line or mic inputs, or use the built-in FM radio. Record samples, play them, slice them, mash them, or even make a synth out of them using Wavetable and Granular synthesis with all their necessary parts (filters, ADSRs, etc.).

  A large screen and ergonomic keyboard pair with a big knob for fast and easy navigation. It's standalone and portable, everything needed to produce an album wherever you are, with a powerful step sequencer and song arranger for finishing a piece in a flash.

  Performance mode lets you creatively break, mangle, and augment your patterns when playing live, and bidirectional MIDI lets it play with other software and hardware.
specs: |-
  - Sampler with slicer, sample editor, and sample recorder
  - Wavetable and Granular synthesis
  - Built-in FM radio as a sound source
  - Powerful step sequencer and song arranger
  - Performance mode for live pattern mangling
  - Bidirectional MIDI
  - Large high-resolution screen, mechanical keyboard, metal haptic knob
  - Height (w/ knob): 1.3 inch (3.3 cm)
  - Width: 11.02 inches (28.2 cm)
  - Depth: 8.15 inches (20.7 cm)
  - Weight: 2.65 pounds (1.2 kg)
  - In the box: USB-C cable (2 m), stereo 3.5mm to 2x mono 6.3mm adapter, minijack to MIDI DIN adapter (Type B), 16GB MicroSD card
  - Powered via USB (any standard USB power source)
