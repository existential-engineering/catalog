description: >-
  A cosmetically refined version of the EDP Gnat featuring wood side panels,
  retaining the same single-oscillator monophonic synthesis and 25-key
  capacitive touch-sensitive keyboard as the original.
details: |-
  The Gnat Special was a 1982 revision of the original EDP Gnat, adding wood side panels and cosmetic refinements to the compact monophonic synthesizer. Electronically identical to the original, it retains the single digital oscillator with analog filter and envelope circuitry, lowpass resonant filtering, attack and decay envelope controls, and an LFO for pitch or filter modulation.

  The 25-key capacitive touch-sensitive keyboard with flat non-moving keys remains unchanged from the original Gnat, as does EDP's proprietary digital control interface for linking to a Wasp or other EDP gear and the built-in speaker for standalone use.

  Designed by Chris Huggett, who also created the Oxford Synthesizer Company's OSCar, the Gnat Special delivers the same characterful analog bass and synth leads as the original in a more visually appealing package. MIDI retrofits are available.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 DCO (adjustable 2' to 32')
  - Waveforms: Ramp, square, enhance, noise (switchable)
  - LFO: 1 (sine, ramp, sawtooth, square, random)
  - Filter: 1 lowpass 12 dB/oct with resonance
  - Keyboard: 25 capacitive touch keys
  - Memory: None
  - Control: EDP proprietary digital socket, MIDI retrofits available
