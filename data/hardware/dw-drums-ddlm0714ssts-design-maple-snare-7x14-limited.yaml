details: |-
  This Limited-Edition 7x14″ Design Series snare drum showcases a striking Titanium Satin Matte Lacquer finish and a unique dual-row 20-lug design that enhances the drum's bold aesthetic and gives it a commanding presence. Handcrafted from 100% North American maple, it delivers the full, punchy tonality that defines the Design Series, now with an exclusive look and feel.

  Featuring a 10-ply HVT shell, mini turret lugs, True-Pitch tuning, MAG throw-off, triple-flange hoops, and True-Tone snare wires, this snare embodies DW's signature craftsmanship.

  Bold, versatile, and collectible, it's the perfect match for the Limited-Edition Titanium Satin Design Series kit or a powerful standalone addition to any setup.
