description: Ashdown's smallest bass combo, the AAA Tour Bus 10 packs a 10W
  power amp and a rugged 6.5" driver into a super-compact box. Simple volume,
  bass and treble controls make it easy to dial in a strong core tone for home
  practice and learning. A headphone output allows silent practice and an MP3/CD
  input lets you jam along with your favourite tracks.
details: |-
  Ashdown AAA-series practice bass combo. 10W power amp driving a single 6.5" driver. Three-band EQ (Bass, Middle, Treble). Headphone output for silent practice and an MP3/CD line input for playing along to tracks. Power output: 10W. Speaker configuration: 1 x 6.5". Impedance: 8 Ohms. Dimensions (H x W x D): 245 x 245 x 175 mm. Weight: 4.25 kg.
specs: |-
  - Power output: 10W
  - Speaker configuration: 1 x 6.5"
  - Impedance: 8 Ohms
  - EQ: Bass, Middle, Treble
  - Dimensions (H x W x D): 245 x 245 x 175 mm
  - Weight: 4.25 kg
