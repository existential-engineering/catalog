description: The Sick As Overdrive is a Klon Centaur-derived overdrive/boost
  pedal with a dual-purpose gain control, a toggle for headroom and character,
  and a two-band active EQ. It boosts internal voltage to 18V for extra clarity
  and headroom.
details: |-
  What's new with the mk3 Version:

  The Sick As Overdrive is a diversion from the well-worn path, taking its basic structure from the Klon Centaur but with some major improvements for the modern player. The gain control serves a dual purpose— as the gain is increased, the ratio of gain-to-clean tone increases as well. This ensures that when the gain is rolled off, the tone never becomes muddy and unpleasant. You can control the amount of headroom and the character of the drive with the toggle switch. Choose from a more compressed, mid-range focused tone or an open, transparent, rhythm tone. The tone circuit is a powerful, two-band active EQ circuit capable of boosting or cutting the bass and treble frequencies up to 15dB for maximum versatility. The voltage is also boosted internally to 18V for increased clarity and headroom. Tech Specs:

  Shipping Information

  User Manual

  Download the User Manual - PDF
specs: |-
  - Same classic Sick As sound
  - R obust power input protection
  - Optimised power delivery network
  - Significantly reduced noise (20dB improvement to the SNR compared to the Sick As Overdrive mk2)
  - Our quietest ever true-bypass switching
  - Clean Boost, Overdrive or a blend of the two.
  - Dynamic and natural, responsive to your pick attack or volume knob.
  - Internally boosted to 18 volts for maximum headroom and clarity.
  - Toggle switch controls the amount of headroom and character of the drive.
  - Powerful active tonestack, capable of 15dB of boost or cut
  - Soft touch true-bypass switching
  - Input Impedance 500kOhms @ 1kHz
  - Output Impedance 560Ohms @ 1kHz
  - Dimensions: 119mm*98mm*49mm
  - Current consumption <70mA
  - Australia: Ships via Australia Post within 1-3 business days
  - USA: Ships from US warehouse via USPS Priority Mail within 1-5 business days (no international fees)
  - International: Ships from Sydney via DHL Express
  - Note: Some products are stocked exclusively at our Sydney lab but can be shipped to the USA. For these items, international shipping rates will apply.
