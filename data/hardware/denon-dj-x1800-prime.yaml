name: X1800 PRIME
manufacturer: denon-dj
primaryCategory: mixer
categories:
  - effect
url: https://www.denondj.com/professional-4-channel-dj-mixer-x1800primexus.html
description: Professional 4-channel DJ mixer with switchable line/phono inputs,
  dual USB audio, digital inputs, dedicated Sweep and BPM FX, and Engine Connect
  for beatgrid-locked effects.
details: |-
  4-channel digital DJ club mixer with multi-assignable inputs (Line, Phono, Digital, USB)

  3-band EQ with selectable Classic and Isolation modes

  Adjustable filter resonance per channel

  4 paired Sweep FX (Dub Echo, Noise, Wash Out, Gate) with dedicated knobs

  12 classic Denon DJ BPM FX plus 14 additional FX accessible via OLED menu

  Effects Quantization Touch Strip for time-division rhythm adjustments

  Built-in LAN hub with 5 Ethernet ports for connecting up to 4 SC Prime media players

  Engine Connect protocol for beatgrid-locked FX with Prime players

  Dual USB audio connections for two computers

  2 independent microphone inputs (XLR+1/4" Mic 1, 1/4" Mic 2) with EQ and talkover

  Send/Return loop for external effects processors

  Split/Cue headphone monitoring with 1/4" and 1/8" outputs

  Flex-Fader crossfader technology

  1.6" OLED display with screensaver

  5-pin DIN MIDI output for sync with external gear

  Rugged metal construction

  24-bit / 96 kHz pro-grade audio
specs: |-
  - Channels: 4
  - Dynamic Range (master): > 117 dB (A-weighted)
  - Frequency Range: 22-22,000 Hz (+1 dB)
  - Signal-to-Noise Ratio (Line): > 93 dB (A-weighted)
  - Signal-to-Noise Ratio (Phono): > 87 dB (A-weighted)
  - THD+N: < 0.02%
  - Channel Separation: < -90 dB (@ 1 kHz, unity)
  - Headroom (Line Inputs): > 16 dB
  - Headroom (Microphone Inputs): > 20 dB
  - Headroom (Outputs): > 20 dB
  - Digital Output Sampling Rate: 44.1, 48, 96 kHz
  - Digital Output Bit Depth: 24-bit
  - Displays: (2) monochromatic LED-backlit displays, 1.6" / 39 mm diagonal OLED
  - Power Connection: IEC
  - Input Voltage: 100-240 V~, 50/60 Hz
  - Power Consumption: 65 W
  - Dimensions (mm): 310.9 x 445 x 109.7
  - Dimensions (inches): 12.2" x 17.5" x 4.3"
  - Weight: 15.43 lbs / 7.00 kg (without USB/power cable)
