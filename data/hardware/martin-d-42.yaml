details: |-
  The Martin D-42 is a trusted blend of power and pearl, designed for players who seek bold tone and stunning visual details. Its Dreadnought body size delivers a loud, projective sound with strong bass, clear trebles, and rich overtones, making it perfect for both powerful strumming and intricate picking.

  Handcrafted with a solid Sitka spruce top and solid East Indian rosewood back and sides, the D-42 produces a resonant, balanced voice that shines across all playing styles. The genuine mahogany neck features a Golden Era Modified Low Oval profile with a High-Performance Taper and a 25.4" scale length for smooth, comfortable playability.

  Aesthetic highlights include intricate abalone Style 45 snowflake inlays on the ebony fingerboard, a shimmering abalone rosette, pearl trim wrapping around the fingerboard, antique white binding, an ebony bridge with bone pins, and gold open-gear tuners with butterbean knobs.

  Martin's 2025 Standard Series refresh enhances tone and comfort via Sitka spruce GE top bracing (vintage-inspired forward-shifted X-brace), a reimagined neck profile, a thinner fingerboard, and refined bridge and heel detailing. Every D-42 ships in a hardshell case and is Plek'd for precision setup.
specs: |-
  - Body: D-14 Fret Dreadnought
  - Top: Solid Spruce with Aging Toner, gloss finish
  - Back & Sides: Solid East Indian Rosewood
  - Bracing: Forward-Shifted X-Brace, GE-Scalloped Sitka Spruce, 5/16"
  - Neck: Genuine Mahogany, GE Modified Low Oval shape, High-Performance Taper, Dark Mahogany finish
  - Scale Length: 25.4"
  - Fingerboard: Ebony with Style 45 Snowflake abalone inlay, 20 frets, 14th fret body join
  - Nut: Bone, 1 3/4" width
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Bridge: Ebony, GE Modern Belly drop-in style with bone saddle and bone pins with abalone dots
  - Headstock: East Indian Rosewood plate with Block Inlay Golden Era logo and antique white multi-stripe binding
  - Tuners: Gold Open Gear with Butterbean knobs
  - Binding: Antique White with abalone multi-stripe inlay
  - Finish: Gloss throughout
  - Electronics: None
  - Case: Hardshell included
  - Plek'd: Yes
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Medium
  - Left-handed: Available
