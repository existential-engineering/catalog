description: >-
  The EKO EKOsynth P15 is a rare Italian monophonic preset synthesizer from 1979 with 15 preset
  sounds and a fully analog signal path, despite its misleading "Digital System" label which
  referred only to its integrated circuit technology.
details: |-
  The EKOsynth P15 is a distinctive monophonic synthesizer from Italian manufacturer EKO, one of
  relatively few analog synthesizers to come from that country's keyboard industry. Despite being
  labeled "Digital System," the name refers only to the use of integrated circuits rather than
  any digital sound generation. The entire signal path remains analog.

  The instrument offers 15 preset sounds including some unusual choices like Latin Vihuela and
  Panpipes alongside more conventional emulations of orchestral and band instruments. In Manual
  mode, users gain access to independent VCF and VCA sections, with the preset buttons doubling
  as waveform selectors for sawtooth, square, and other waveforms across various octaves.

  The filter section features a self-resonating 24 dB/oct lowpass VCF with frequency cutoff and
  resonance controls. Two envelopes handle the VCA and VCF independently, though each is limited
  to attack and sustain parameters only. A single LFO with sine and square waveforms can modulate
  the filter, amplifier, or oscillator via intensity sliders controlling wah-wah, tremolo, and
  vibrato effects. Glide and portamento round out the feature set.

  Built into a rugged road-worthy case with a carrying handle and 44-key keyboard, the P15 is a
  practical if modest instrument that has become quite collectible due to its rarity.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - Waveforms: Sawtooth, square
  - LFO: 1 (sine and square waveforms)
  - Filter: 1 24 dB/oct lowpass with attack/sustain envelope
  - VCA Envelope: Attack/sustain
  - Effects: Glide/portamento
  - Keyboard: 44 keys
  - Presets: 15 (Oboe, Clarinet, Bass Clarinet, Horn, Trumpet, Trombone, Reed, Fuzz Guitar, Bass Guitar, Vihuela, Panpipes, Marimba, Violin, Viola, Contra Bass)
  - Control: 1 foot switch
releaseDate: "1979"
releaseDateYearOnly: true
