description: >-
  The EKOsynth P15 is a rare Italian preset-based monophonic analog synthesizer
  manufactured by EKO circa 1979. Despite its "Digital System" label, it
  features entirely analog signal processing using integrated circuits rather
  than traditional transistors. The instrument offers 15 preset sounds plus a
  manual synthesis mode in a rugged vinyl-wrapped steel and wood case with a
  built-in carrying handle.
details: |-
  The EKOsynth P15 represents a rare and unique Italian take on the preset-based synthesizer format of the late 1970s. Manufactured by EKO, an Italian company better known for guitars and accordions, this monophonic synthesizer combines both preset and manual operation modes, allowing users to access pre-programmed sounds or engage with synthesis parameters directly.

  The instrument is entirely analog despite its prominent "Digital System" labeling, which refers only to the use of integrated circuits rather than traditional transistor-based circuitry. The 15 presets include conventional orchestral voices like Oboe, Clarinet, and Trumpet alongside more unconventional choices such as Vihuela and Panpipes. In manual mode, the preset buttons instead select waveforms including sawtooth, square, and combinations across various octaves, though sine waves and noise generation are notably absent.

  The synthesis architecture features a single VCO routed through a self-resonating 24 dB/octave lowpass filter with its own attack/sustain envelope, and a VCA with a separate attack/sustain envelope. An LFO with sine and square waveforms provides modulation via wah-wah, tremolo, and vibrato controls, and a glide function is also available for portamento effects.

  Build quality is substantial, with construction of steel and wood wrapped in vinyl, a latched protective cover, and a built-in carrying handle making it genuinely road-worthy for live performance use.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - Waveforms: Sawtooth, square, and combinations (no sine or noise)
  - LFO: 1 (sine and square waveforms)
  - Filter: 1 self-resonating 24 dB/octave lowpass VCF with A/S envelope
  - VCA: 1 with A/S envelope
  - Effects: Glide (portamento)
  - Keyboard: 44 keys
  - Memory: 15 presets
  - Control: 1 foot switch input
releaseDate: "1979"
