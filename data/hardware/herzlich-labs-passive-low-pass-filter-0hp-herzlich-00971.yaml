url: https://www.herzlichlabs.com/products/passive-low-pass-filter-0hp-herzlich-00971
description: A single pole -3 dB passive low pass filter with high quality
  components, covering a range from 31 Hz to 16 kHz. It accepts both CV and
  audio signals for gentle filtering.
details: |-
  Low pass filtering for fun and profit You need filters. You need huge, voltage controlled filters with massive cutoff knobs for doing sick filter sweeps, with old styroflex caps and transistors made in long-departed Eastern Bloc countries, of course. But when that is taken care of, you really also need some filters for smaller tasks. Taming sounds and signals gently, not with a brick wall or iron fist. The Passive LPF is simple: a single pole -3 dB low pass filter with high quality components ranging from 31 Hz to 16 kHz. Set and forget, and move on to more important tasks in your performance or recording. It won't beat your beloved active filters in a toe-to-toe fight - but it won't have to, once you discover the inherent utility of having extra filtering options on hand.
specs: |-
  - Accepts both CV and audio signals
  - High quality capacitors from Wera
  - Passive design: no external power, no batteries
