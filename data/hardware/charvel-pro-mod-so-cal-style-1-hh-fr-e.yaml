description: The Pro-Mod So-Cal is a stunning high-octane axe, fueled by four
  decades of requests for a hot-rodded high-performance guitar with the latest
  and greatest features. Paying homage to its 1980s Southern California roots,
  the So-Cal blends vintage-style appointments with the classic playability and
  innovative design elements that have made Charvel a legendary name.
details: |-
  The Pro-Mod So-Cal Style 1 HH FR E pairs an alder So-Cal Style 1 solid body with a gloss finish. The bolt-on maple neck features graphite reinforcement and a hand-rubbed satin urethane finish. An ebony fingerboard with a 12"-16" compound radius hosts 22 jumbo frets with white dot inlays, anchored by a Floyd Rose 1000 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics center on a Seymour Duncan Distortion TB-6 humbucker in the bridge position and a Seymour Duncan Distortion SH-6N humbucker in the neck position. Controls include a push/pull volume knob for coil splitting, a no-load tone control, and a 3-position blade switch.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo with a locking tremolo arm, Charvel-branded die-cast tuning machines, a Floyd Rose retainer bar string tree, knurled flat-top control knobs, a 1-ply black pickguard, and a black switch tip in a black hardware finish. The licensed Fender Stratocaster headstock, 4-bolt serialized neck plate, and heel-mount truss rod adjustment wheel round out the build.
