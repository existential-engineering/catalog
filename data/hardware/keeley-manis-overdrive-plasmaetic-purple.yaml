details: |-
  The Plasmaetic Purple Manis is the Keeley Manis Overdrive finished in the maker's Plasmaetic Purple colorway, a series finish applied across several pedals.

  The circuit combines germanium NOS transistors with germanium diodes for extra compression and saturation, and adds a 3dB bass boost. Keeley positions it as a reworking of the transparent overdrive circuit the pedal world calls the Klone, with a hard clipping clean boost character updated by the maker's power supply improvements.

  A germanium switch substitutes the essential germanium diodes with Cold War era germanium transistors, increasing compression and saturation for a softer attack closer to a tube amp. A second switch lowers the low frequency cutoff by exactly one octave and raises output by 3dB, recovering low end for single coil guitars. The pedal is rated for 18 volt operation.

  Bypass mode is selectable on the fly: holding the footswitch for two seconds toggles between buffered silent switching and true bypass. The Manis is designed, engineered and manufactured in Oklahoma City, with circuit boards and aluminium enclosure built in house, and it won a Premier Guitar Premier Gear Award.
specs: |-
  - Plasmaetic Purple finish
  - Hard clipping clean boost circuit using Russian transistors in place of germanium diodes
  - Ge-Trans switch selects diodes or transistors, changing feel with increased saturation and tube-like compression
  - Bass+ switch lowers the frequency response by one octave and pushes 3dB harder
  - Selectable true bypass or buffered silent switching, toggled by holding the footswitch for two seconds
  - 18 volt capable for extra headroom
  - Aluminium enclosure fabricated in house, built in Oklahoma City, USA
