description: The ABM 400 Ltd Edition marks 25 years of Ashdown's iconic ABM
  (Ashdown Bass Magnifier) bass amp. UK-built, hand-numbered and signed by
  founder Mark Gooday, each is supplied in a custom flight case with a personal
  note of thanks. Central on the front panel is the 7-band EQ that made the ABM
  a classic, joined by an onboard sub-harmonic generator, a 400W high-headroom
  power stage and the variable Valve Drive control. Connections include a
  front-panel balanced DI, rear FX send and return, a pair of Speakon outputs, a
  line input and a footswitch jack for the included 4-way footswitch.
details: |-
  Ashdown 25th-anniversary limited-edition bass head based on the classic ABM (Ashdown Bass Magnifier). UK-built, hand-numbered and signed by Ashdown founder Mark Gooday, supplied in a custom flight case with a personal note of thanks. 7-band EQ: rotary Bass, Middle and Treble controls with pairs of sliders between the knobs for more detailed shaping. Onboard sub-harmonic generator. 400W high-headroom power stage. Variable Valve Drive control from clean and punchy to warm and grinding. Balanced DI output on the front panel; FX send and return, a pair of Speakon speaker outputs and a line input on the rear. Jack for the included 4-way footswitch controlling EQ, sub-harmonics, valve drive and a fixed level of soft compression. Rear-panel low-noise twin-fan intelligent cooling system. Note: direct purchases not available in the United States, sold through local dealers.
specs: |-
  - Power output: 400W high-headroom power stage
  - 7-band EQ (Bass, Middle, Treble rotary plus sliders)
  - Variable Valve Drive control
  - Onboard sub-harmonic generator
  - Twin-fan intelligent cooling system
  - Included 4-way footswitch (EQ, sub-harmonics, valve drive, soft compression)
  - Hand-numbered and signed, supplied in a custom flight case
