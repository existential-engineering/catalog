description: Laugh all you want while headbanging along to Steel Panther's
  satirically swaggering take on '80s-era Sunset Strip glam metal, but there's
  just no arguing with the ferociously slamming chops of the band's guitarist
  Satchel. Simply put, nobody puts the 1987 into today like Parrish and his
  metalloid feline cohorts, and Charvel is excited to deliver a huge horns-up in
  the tiger-striped form of the Satchel Signature Pro-Mod DK22 HH FR M.
details: |-
  The Satchel Signature Pro-Mod DK22 HH FR M pairs a Dinky-shaped alder body with sharper-radius top edges and a flamboyant tiger-striped Satin White Bengal finish. The bolt-on maple neck features graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. A maple fingerboard with a 12"-16" compound radius hosts 22 jumbo frets and black dot inlays, anchored by a Floyd Rose 1000 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics center on a pair of zebra-bobbin (black/purple) Fishman Fluence Classic PRF-CHB humbuckers in the bridge and neck positions, routed through a 3-position toggle (bridge, bridge + neck, neck) with a single volume control. A push/pull on the volume activates a second voice per pickup, giving two selectable tones per pickup via active electronics.

  Hardware includes a top-loaded Floyd Rose 1000 Series double-locking tremolo with locking tremolo arm, Charvel-branded die-cast tuning machines, a Floyd Rose retainer bar string tree, dome-style control knobs, and a black switch tip in a black hardware finish. The licensed Fender Stratocaster headstock, 4-bolt serialized neck plate, and heel-mount truss rod adjustment wheel round out the build.
