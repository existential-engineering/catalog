description: The Bricasti M12 Platinum is the M12 Source Controller with the MDx
  Network Processor Board factory-installed, combining DAC, preamplifier,
  headphone amplifier, and network streamer functions. Balanced XLR and
  unbalanced RCA outputs, Ethernet connectivity, and a trigger output are
  included. Handcrafted in Massachusetts, USA.
specs: |-
  - MDx Network Processor Board factory-installed
  - Functions: DAC, preamplifier, headphone amplifier, network streamer
  - USB: up to 32-bit / 384kHz PCM, DSD64/128/256
  - AES/EBU, S/PDIF (BNC and RCA): up to 24-bit / 192kHz
  - Toslink: up to 24-bit / 96kHz
  - Balanced analog output: 4VRMS (XLR)
  - Unbalanced analog output: 2VRMS (RCA)
  - Output impedance: 100Ω (balanced), 50Ω (unbalanced)
  - THD+N: <0.001%
  - SNR: >118dB
  - Chassis: 2U rack-mount, 19-inch
  - Handcrafted in Massachusetts, USA
