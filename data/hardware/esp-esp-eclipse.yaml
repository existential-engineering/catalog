description: All ESP Original Series instruments are hand-crafted, one at a
  time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan.
  With the ESP Eclipse Custom Titan Metal, you get one of the world's finest
  guitars at any price. Its classic single-cutaway design uses set-neck
  construction at traditional 24.75" scale, providing smooth access to the
  highest frets. It features a Honduran mahogany body with hard maple cap, and a
  single-piece Honduran mahogany neck. This guitar offers an ebony fingerboard
  with a comfortable 305mm radius, 22 extra-jumbo stainless steel frets, ESP
  flag inlays, Luminlay side dots, and a graphite nut. Top-tier components on
  the ESP Eclipse Titan Metal include black nickel hardware that matches the
  guitar's aesthetic, ESP strap locks, Gotoh locking tuners, a TonePros locking
  TOM-style bridge, a Gotoh tailpiece, and a set of EMG JH HET active humbucking
  pickups with brushed black chrome covers. Includes a deluxe ESP form fit case.
