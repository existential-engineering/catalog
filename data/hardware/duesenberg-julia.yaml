description: Julia is made for players who value style, embrace creative
  freedom, and aren't afraid to carve their own path. Blending timeless design
  with exceptional tone, it's an instrument for those who refuse to compromise
  on sound or self expression.
details: |-
  Julia is a chambered-body electric guitar built from solid premium mahogany with large sound chambers, a flat maple top and elegant double binding. Duesenberg describes the chambered construction as a solid body with big sound chambers for enhanced tone and weight reduction, giving a tone somewhere between a solid and a semi-hollow instrument. The design draws on the effortless elegance and bold spirit of the 1950s and 1960s.

  The neck is a single piece of maple, set into the body, fitted with an Indian rosewood fingerboard with a 305 mm / 12 inch radius and cream binding. It carries 22 jumbo frets over a 648 mm / 25.5 inch scale, a Medium D profile, Duesenberg Wing inlays and a steel dual-action truss rod. The fingerboard is processed on Duesenberg's Plek machine so the frets are perfectly level, which the company treats as the basis for its hand fret-polishing and setup work.

  The pickup pair is a Duesenberg Domino P90 at the neck and the Duesenberg Split/King Dual-Coil at the bridge, both in trapeze covers. The Split/King is built around a genuine single coil that can be paired with a specially engineered second coil to produce an authentic humbucking sound, rather than simply disabling one coil as a conventional coil-split does. A discreet switch behind the tremolo toggles between the two modes, and an additional Direct Out switch routes the bridge pickup straight to the output jack, bypassing the rest of the electronics. Controls are one volume, one tone and a three-way pickup selector.

  Hardware is nickel finished and includes Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge and the Diamond Deluxe Tremola vibrato. Duesenberg describes the Diamond Deluxe as lightweight with heavy duty needle and nylon bearings, a vibrato arm that turns freely through 360 degrees and can be adjusted for angle and length, and string loading through holes in the bar beneath the arm axis. Nickel is used in place of chrome because it has a warmer sheen and ages naturally, which Duesenberg notes means regular cleaning is needed to slow that ageing.

  The guitar ships in three finishes: Black, which pairs a patterned Crystaloid pickguard with the body colour, and Catalina Sunset Rose and Narvik Blue, both matched with aged white pickguards. A Duesenberg Custom Line Case is included as standard, along with all the required allen keys.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Duesenberg Wing
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Solid Mahogany with sound chambers
  - Top: Maple, flat
  - Body dimensions: 45 x 33.8 cm / 17.7" x 13.3"
  - Height (sides): 3.9 cm / 1.5"
  - Binding: Cream
  - Pickguard: Aged White (Narvik Blue finish), Crystaloid (Black finish)
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Tremolo: Duesenberg Diamond Deluxe Tremola
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg Domino P90 (Trapeze Cover)
  - Pickup (bridge): Duesenberg Split/King Dual-Coil (Trapeze Cover)
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector
  - Switches: 1x bridge pickup split, 1x bridge pickup direct out
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
