description: A 1U Eurorack utility module that duplicates and inverts signals,
  capable of inverting 4 signals or duplicating a signal on up to 4 outputs.
details: |-
  The idea behind QBI-S is to fulfill two fundamental functions when patching:
  -Duplicate a signal
  -Invert a signal

  These are two basic yet important and essential functions when patching. But even though they are important, we wanted them to take up as little space as possible. We therefore imagined QBI-S is capable of:
  -Invert 4 different signals with very high precision. -Duplicate a signal on 3 outputs without losses. -Duplicate and invert a signal on 4 outputs without losses. And the best of all is that you can add these different functions together to always meet your needs when patching.
