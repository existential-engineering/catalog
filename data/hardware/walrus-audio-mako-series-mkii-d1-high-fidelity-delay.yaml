url: https://www.walrusaudio.com/products/mako-series-mkii-d1-high-fidelity-delay
description: "The D1 MKII is a feature-packed, high-fidelity all-in-one delay
  pedal with six algorithms for players to choose from: Digital, Mod, Vintage,
  Dual, Reverse, and Grain. The D1 can create inspirational delay trails ranging
  from dreamlike and bizarre, to rhythmic and clear, to warm and analog
  sounding."
details: |-
  The D1 MKII is a feature-packed, high-fidelity all-in-one delay pedal with six algorithms for players to choose from: Digital, Mod, Vintage, Dual, Reverse, and Grain. Each program can be fully customized with the left encoder knob, which controls six parameters on all programs: Depth, Rate, Shape, Age, Tone, and Spread. The right encoder adjusts BPM, Swell, and Tap Division. Programs: Digital (clean and crystal-clear), Mod (unique modulation LFOs on random repeats), Vintage (analog tape delay-inspired), Dual (two delays, one per channel, with parallel/ping pong/series feedback), Reverse (delay memory read backward, always or flip-flop), Grain (smooth, choppy, glitchy, or flowy grain trails). The D1 can save up to 128 onboard presets held in preset banks (A/B/C) accessible via the menu, plus MIDI.
specs: |-
  - Six carefully crafted delay algorithms to meet the needs of any guitar player
  - Complete BPM control for the user with readout on screen
  - Up to 128 presets
  - Redesigned Dual Mode allows you to set unique tap divisions on each channel
  - All new Grain Delay Program
  - Add modulation to delay trails with six wave shapes (sine, square, triangle, ramp, reverse ramp, random)
  - Navigation menu screen for easy tweaking of secondary controls and BPM, or accessing presets
  - Stereo in and out; MIDI support
  - Power: 9V DC, 300mA minimum, center negative
  - Dimensions: 4.9" x 2.52" x 2.64" (with knobs)
