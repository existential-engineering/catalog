description: World's Smallest 1176-Style FET Limiting Amplifier for Chroma, Mister Focus, & DIYRE Colour. A miniaturized version of the legendary 1176 limiter featuring the most loved ratio settings — 4:1 and 'All Buttons In' — delivering all the aggression, smash, and colorful leveling of the original in a palm-sized Colour Module format.
details: |-
  We did the impossible. We took the most loved, most ubiquitous ratio settings of the legendary 1176 limiter heard on countless hit records — 4:1 and 'All Buttons In' — and created a miniaturized version that can fit in the palm of your hand. Implode delivers all the aggression, smash, and colorful leveling many have trusted for decades. It was no small feat to create the world's smallest 1176! We squeezed in every transistor, capacitor, and resistor from the original Revision F discrete preamp and detector circuits — over 100 parts meticulously arranged to create a small city of analog mojo machinery. By including individual trimpots for both attack and release, you can create compression presets for each module — like the much used 'Dr. Pepper' setting. We've even included the Bypass setting, which allows you to process audio through the discrete transistor preamp without compressing. By driving the input using the Colour Palette Saturation knob, you control the amount of compression. Output gain can be adjusted with Colour's Trim knob.
specs: |-
  - Revision F discrete preamp and detector circuits using 2N3391A and 2N3707 transistors
  - 2N5457 FET
  - Ratio 4:1 or 'All Buttons In' selected via internal jumpers
  - Adjustable Attack, Release, and Output via internal trimpots
  - Detector circuit can be bypassed like original via internal jumper
  - LME49710 make-up gain amp
  - Output mute during power-on
  - Preset at the Rogue Planet Command factory with the beloved and versatile 'Dr. Pepper' attack and release settings
  - VU Meter omitted for maximum sonic risk-taking (exploration)
  - Analog plugin compatible with Chroma
  - C-DRV knob on Chroma controls amount of compression
  - C-MIX knob on Chroma blends compressed signal with dry signal for parallel compression effects
  - Compatible with DIYRE Colour
