description: The Falken brings you an entirely new and daring body shape. The
  new Split/King pickups open up a whole new world of versatility.
details: |-
  The Falken is a solid-body electric guitar built around a carved alder body measuring 42 x 32.5 cm (16.5" x 12.8") with 4.2 cm (1.7") sides, cream binding, a black and aluminium pickguard and a PUR lacquer finish. Duesenberg describes the solid-body construction as delivering instant response, long sustain and strong feedback resistance, and the instrument's construction was designed for the demands of touring.

  The set neck is one-piece maple with an Indian rosewood fingerboard at a 305 mm / 12" radius and Duesenberg Wing inlays. It carries 22 jumbo frets (2.8 x 1.0 mm), a medium D profile, a 648 mm / 25.5" scale length, a steel dual-action truss rod and a reversed, black headstock. Duesenberg's Plek process levels the frets, which the maker treats as the basis for its fret polishing and setup work.

  Electronics use two Duesenberg SplitKing dual-coil pickups, which produce both real single coil and real humbucker tones from a coil design that extends a full-size single coil into a complete humbucker with a separate fine-tuned coil. Mode switches sit on the lower brushed aluminium pickguard and can be raised or lowered inside the pickguard on a small elevator mechanism. Wiring is one volume, one tone, a three-way pickup selector and two SplitKing pickup mode switches.

  Hardware is nickel finished and includes Duesenberg Z-Tuners and a Duesenberg Steel Saddle Bridge, with a Duesenberg Wrapper tailpiece and the short version of the Duesenberg Radiator Tremola vibrato system both listed as options. The Radiator Tremola is Duesenberg's evolution of its Diamond Deluxe vibrato, using heavy-duty needle and nylon bearings, with an arm that turns freely through 360 degrees and can be set to a preferred angle and length, and strings guided through holes in the bar beneath the arm axis. Strap pins are the Duesenberg Standard type and are Straplock compatible.

  The guitar ships with the Duesenberg Custom Line Bag, a lightweight padded gig bag with high-impact padding, plush lining, external storage pockets, tuck-away shoulder straps, a padded handle and an adjustable neck pillow. All required allen keys are included, and a Duesenberg Custom Line Case for the Falken is available separately, except on the Matte Black & Gold edition, which Duesenberg says includes a case.
specs: |-
  - Neck type: Set Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Duesenberg Wing
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Solidbody, Alder
  - Dimensions: 42 x 32.5 cm / 16.5" x 12.8"
  - Height (sides): 4.2 cm / 1.7"
  - Binding: Cream
  - Pickguard: Black & Alu
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Tailpiece (optional): Duesenberg Wrapper tailpiece
  - Vibrato System (optional): Duesenberg Radiator Tremola, short version
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 010/050 (010-013-017-028-042-050)
  - Pickup (neck): Duesenberg SplitKing Dual Coil
  - Pickup (bridge): Duesenberg SplitKing Dual Coil
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector, 2 SplitKing Pickup Mode Switches
  - Bag: Duesenberg Custom Line Bag (included)
  - Case: Duesenberg Custom Line Case for Falken (available separately, included
    with the Matte Black & Gold edition)
  - Tools: All required allen keys included
