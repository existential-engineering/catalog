description: The Klipsch R-121SW is a 12-inch front-firing powered subwoofer
  featuring a spun-copper thermoformed crystalline polymer woofer and an
  all-digital 200W continuous / 400W peak amplifier. A bass-reflex enclosure
  with rear-firing port delivers deep bass from 28Hz, with low-pass crossover
  and phase control for seamless integration with any home theater system.
details: |-
  The R-121SW uses Klipsch's Thermoformed Crystalline Polymer (TCP) woofer technology — an exceptionally light yet rigid spun-copper cone that provides remarkable low-frequency response with minimal cone breakup and distortion.

  The built-in all-digital amplifier delivers 200W continuous and 400W peak power with high efficiency and true-to-source accuracy, ensuring maximum output, detail, and power.

  The front-firing 12-inch driver provides deep bass and flexible room placement. A bass-reflex enclosure with rear-firing port extends low-frequency output down to 28Hz.

  Amplifier controls include volume, low-pass crossover, 0/180° phase switch, and auto power-on. LINE/LFE RCA inputs ensure compatibility with all home theater receivers.

  The cabinet is constructed from reinforced 3/4-inch MDF with an all-new internal bracing design to reduce cabinet vibration for less audible coloration and improved sonic accuracy. The scratch-resistant black textured wood grain vinyl finish integrates seamlessly into any décor.
