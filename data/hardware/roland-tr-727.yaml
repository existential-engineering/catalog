description: >-
  The Roland TR-727 is a Latin percussion drum machine and a companion to the
  TR-707, featuring 15 sampled Latin kit sounds including congas, bongos, and
  timbales. It offers 64 programmable patterns with shuffle and flam effects,
  individual outputs, and volume controls for each sound. The TR-727 became a
  staple of tribal, Latin, and Indian house music and was used by artists such
  as Aphex Twin, Freddy Fresh, and Luke Vibert.
details: |-
  Released in 1985, the Roland TR-727 was designed as the Latin percussion counterpart to the popular TR-707 drum machine. While the TR-707 focused on standard drum kit sounds, the TR-727 provided a dedicated set of 15 Latin percussion samples, making it one of the few hardware drum machines of its era to specialize in Latin rhythms.

  The TR-727 shares much of its architecture and programming interface with the TR-707, including a matrix display for pattern editing and a full MIDI implementation with both MIDI and DIN sync connectivity. Programming capabilities include shuffle and flam effects, allowing users to add rhythmic variation and expressiveness to their patterns. The machine supports 64 patterns and 4 songs.

  Sound adjustment is minimal by design — the only control available for each drum tone is its volume level. However, the inclusion of individual outputs for each sound allows for external processing and mixing flexibility, which helped the TR-727 find a lasting place in electronic music production. Its distinctive Latin percussion tones have become iconic in house, techno, and experimental electronic music.
