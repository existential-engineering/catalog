description: The Three Plus is a powerful 2.1 stereo Bluetooth tabletop speaker
  system biamplified for audiophile resolution, featuring real wood veneer and
  professionally tuned by Klipsch acousticians.
details: |-
  The Three Plus is a premium tabletop Bluetooth speaker system that blends the acoustics and classic design legacy of Paul W. Klipsch with the latest technologies. It is professionally tuned by Klipsch acousticians to deliver a crystal-clear performance with great bass.

  The speaker features a 2.1 stereo biamplified configuration with dual 2.25" full-range drivers and a 5.25" high-excursion woofer, designed to fill larger spaces with bold, detailed sound at audiophile resolution.

  Connectivity options include Bluetooth 5.3 with up to 40-foot range, Phono/RCA inputs for direct turntable connection, and a USB-C port for both audio playback and reverse device charging.

  The Klipsch Connect App enables EQ customization, preset saving, and firmware updates. Broadcast Mode allows wireless connection to 10 or more speakers simultaneously.

  Available in Modern Walnut and Ebony finishes with real wood veneer construction and tactile switches and knobs. Dimensions: 14" W × 8.39" D × 7" H.
