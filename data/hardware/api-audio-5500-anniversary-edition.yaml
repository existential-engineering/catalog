name: 5500 Anniversary Edition
manufacturer: api-audio
primaryCategory: eq
categories:
  - rack-mount
  - discontinued
url: https://apiaudio.com/product/5500-anniversary-edition/
description: Limited run of 55 units commemorating API's 55th year. Dual-channel
  3U EQ with vintage cream chassis, expanded 50 kHz response, variable HPF
  (40–600 Hz per channel), and Mid/Side decoding circuit for separate M/S EQ
  processing.
details: |-
  3U rack-mount dual-channel equalizer, limited to 55 units (API's 55th
  anniversary). Four EQ bands per channel (LO, LO-MID, HI-MID, HI), 20 Hz–40
  kHz, ±0.5–12 dB boost/cut. Variable HPF 40–600 Hz per channel (from AXS/Vision
  console designs). Mid/Side decoding for separate M/S EQ processing. Vintage
  cream chassis. Transformer-coupled output.
specs: |-
  - Form factor: 3U rack-mount
  - Dimensions: 19″ W × 5.25″ H × 11.25″ D
  - Weight: 16 lb
  - Max input/output: +32 dBu
  - Input impedance: 20 kΩ
  - Output impedance: 75 Ω (transformer coupled)
  - S/N ratio: −105 dB
  - Frequency response: ±0.5 dB (20 Hz–50 kHz)
  - HPF: 40–600 Hz variable (per channel)
  - EQ boost/cut: ±0.5–12 dB
  - Power: 20 W; ±16V @ 150 mA, +24V @ 40–100 mA
  - Production run: 55 units
