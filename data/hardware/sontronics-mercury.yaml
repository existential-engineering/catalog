details: |-
  A variable-pattern valve microphone showcasing the absolute pinnacle in audio precision and British engineering. Sontronics Mercury is a variable-pattern valve condenser microphone that guarantees you spectacular results, whatever you're recording. Hand-built in the UK, Mercury utilises premium-grade electronic components with exceptionally low tolerances, rarely used in microphone manufacturing. This results in an impeccably clean signal and superbly accurate reproduction of vocals and instruments. Mercury's power supply features both pad and filter switches and a fully sweepable polar pattern control that provides an infinite choice of pickups, from omni to figure-of-eight and cardioid, and every nuance in between. All this plus its exceptionally low self-noise make Mercury a must-have for anyone serious about achieving the very best quality results. Receive a FREE 10m lead worth £155 with the Sontronics Mercury. Simply add the lead to your basket and the offer will be automatically applied. IDEAL FOR

