description: "The Delta series philosophy: reliability, trust and transparent
  amplification of your mix"
details: |-
  Every model uses the highest-quality power-amplifier technology - so you know for a fact that what goes in, comes out exactly as intended. Only louder.

  The 2U Delta 80 yields a staggering 4x 2000W of power at 4 ohms - or 2x 4000W when bridged. And it does so without breaking a sweat, while delivering enviably low distortion and noise figures. For instance, THD is as little as <0.18% at 1kHz.

  Analogue or AoIP via Dante? Delta 80 handles up to four channels; a future-proof system that can keep up with whatever your studio throws at it. When using Dante, your audio is converted by 24-bit/96kHz DACs.

  You also get back-up amplifier redundancy, ensuring that your production can move ahead almost regardless of what might happen on the amp side of your studio.

  Want a stereo four-way system? Just connect to a Delta DSP amplifier with a single Cat 5 cable to eliminate the need for external processing.
specs: |-
  - Type: Amplifier
  - Range: Acoustic Amplifiers
  - Segment: Pro
  - Number of channels: 4
  - Output power (per channel) @ 8 ohms: 1000W
  - Output power (per channel) @ 4 ohms: 2000W
  - Output power (per channel) @ 2.7 ohms: 2200W
  - Output power (per channel) @ 2 ohms: 2000W*
  - Output power (bridged) @ 8 ohms: 4000W
  - Output power (bridged) @ 4 ohms: 4000W
  - *2.7 ohm power quoted for highest single ended output and greatest efficiency (3 x 8 ohm parallel drivers). Amplifier is stable with 2 ohm loads but output will be reduced.
  - THD @ 1kHz (1dB below max output): < 0.18%
  - THD 20Hz to 20kHz (1dB below max output): < 0.2%
  - Gain: 32dB
  - Sensitivity (for max power): 8.2dBu
  - Frequency response: 20Hz to 20kHz (+0/-0.5dB)
  - Power consumption nominal @ 240V/4Ω: 4.1A
  - Power consumption nominal @ 120V/4Ω: 8.2A
  - Networking: 2x RJ45 (1000BASE-T, Dante, AES67)
  - Mains inlet: C13 connector, 90-260 VAC
  - Chassis: 19", 2 RU
  - Amplifier dimensions (H x W x D): 88 x 482 x 428 mm
  - Weight: 10.1 kg / 22.3 lbs
  - Boxed weight: 11.6 kg / 25.6 lbs
  - Single-box packaging (H x W x D): 230 x 580 x 560 mm
  - Double-box packaging (H x W x D): 250 x 610 x 600 mm
  - Status: Current
