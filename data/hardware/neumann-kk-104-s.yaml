description: Condenser capsule head. Cardioid characteristic. High feedback
  resistance. Studio grade sound quality. For Sennheiser SKM 5000 und 5200
  handheld transmitters.
details: |-
  Studio grade Neumann condenser capsule

  Neumann sound for or Sennheiser SKM 5000/5200 wireless systems

  Tight cardioid pattern without off-axis coloration

  Feedback resistant, high rejection of rearward sound (180°)

  Unaffected by extreme sound pressure levels

  Built-in pop protection, low handling-noise

  Easy cleaning
specs: |-
  - Directional Pattern: Cardioid
  - Frequency Range: 80 Hz ... 20 kHz
  - Sensitivity at 1 kHz into 1 kohm: 1.7 mV/Pa ± 1 dB equ. –55.4 dBV
  - Equivalent noise level, CCIR: 42 dB
  - Equivalent noise level, A-weighted: 31 dB-A
  - Maximum SPL for THD 0.5%: 148 dB
  - Maximum SPL for THD 3%: 153 dB
  - Signal-to-noise ratio, CCIR (re. 94 dB SPL): 52 dB
  - Signal-to-noise ratio, A-weighted (re. 94 dB SPL): 63 dB-A
  - Weight: approx. 325 g (incl. Transmitter + power supply)
  - Diameter: 48 mm
  - Length: 257 mm (incl. Transmitter)
