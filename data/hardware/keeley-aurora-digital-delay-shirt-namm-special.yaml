details: |-
  The Recino Digital Delay, named after the Latin for echo, is a clean digital delay offering up to a full second of delay time. It is an FV-1 Spin Semiconductor based design.

  The design aims at very low noise, usable tones and dependable operation rather than at character, with the signal treated so that the DSP adds no unwanted distortion and the result does not sound glassy or sterile. It is intended as a set-and-forget stompbox.

  The pedal was introduced at the 2015 NAMM show alongside the Aurora Reverb, the Mini Katana and the Baby Dirt. The feed records it as no longer in production.
