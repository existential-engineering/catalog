details: |-
  The Stage Pro Element preamp uses our minimalist pickup and adds the maximum amount of onboard control via the system’s side-mounted control panel. The Element is the pickup system that we stripped down to bare essentials. By removing every physical obstacle between the guitar and its film sensor, we built this system to correct a design flaw in most traditional undersaddle pickups, which depend on direct string pressure to compress the sensor. This is what leads to the notorious “quack” that acoustic guitarists constantly try to avoid. Lloyd Baggs invented the Element with a beautifully minimalist design. The Element rejects string attack, allowing it to mirror the actual movement and resonance of your guitar’s soundboard and capture the nuances of your instrument. With a High-Graded FET input, the preamp delivers a warm, “un-quackable” tone that cuts through a loud band mix.
specs: |-
  - Guitar-mounted undersaddle Element pickup with side-mounted preamp controls
  - Active system, High-Graded FET input
  - Controls: Master volume, 3-band EQ, phase inversion, notch filter, chromatic tuner with mute
  - 9V battery, 100+ hours battery life
  - 1/4-inch endpin output jack
  - Seamless fingertrap sensor construction
  - For steel-string and 12-string acoustic guitars; requires professional installation
