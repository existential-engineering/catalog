details: |-
  The Harmony Foundation Series is one for the discerning musician, an inseparable companion to weave tales out of every path of the journey. The Terra FS Classical Acoustic, which comes in an attractive natural gloss finish, is a cut above the rest, built with a solid spruce top and solid mahogany sides and back for a full-bodied sound that's warm, balanced and tonally complex. The mahogany neck's resilience remains straight and true over time for improved tuning stability, while the rosewood fretboard smoothens the overall playing experience. Solid spruce X-bracing gives remarkable depth to sound projection. Meanwhile, the bone nut and saddle add to superior tone and resonance. Premium tonewoods ensure that this guitar ages gracefully over the years, improving in both appearance and sound. The Terra FS Classical Acoustic is strung with D'Addario EJ45 Pro-Arte, which offer sweet and mellow highs. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
