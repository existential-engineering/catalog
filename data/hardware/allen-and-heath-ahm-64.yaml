description: 64x64 Audio Matrix Processor. The most powerful matrix processor in
  the AHM range, scaling to large campus installations with up to 64 zones, 96
  controllers and hundreds of system I/O.
details: |-
  AHM-64 is the largest member of the AHM family of Audio Matrix Processors, with a 64x64 processing matrix, 12x12 local analogue I/O, and a built-in 128x128 SLink port for audio expansion. It is designed for large-scale corporate, retail, hospitality, and education installations, scaling to whole-campus systems with up to 64 zones and 96 IP remote controllers.

  Sound management processing on every input and zone includes 8-band PEQ, dynamics and delay, with eight Automatic Mic Mixers, Ambient Noise Compensation (ANC), priority ducking, and speaker processing (crossover, delay, limiter, PEQ, all-pass filters). EQ Ganging supports relative, absolute and mirrored controls.

  An optional Processing Expansion Module adds up to 12 channels of feedback suppression (FBS) or acoustic echo cancellation (AEC) for videoconferencing and challenging room acoustics.

  The I/O Port accepts option cards including Dante 96kHz (AES67 / DDM ready), MADI, Waves and SLink, providing up to 128x128 of audio networking. Combined with the built-in SLink port, AHM-64 connects to the full range of Allen & Heath Everything I/O expanders (DX, GX, DT168, DT164-W) and ME Personal Mixing systems.

  Control options include IP1, IP6 and IP8 networkable wall-mount IP remote controllers (up to 64 IP1, 64 IP6 or 16 IP8), CC-7 and CC-10 Custom Control touch panels, Crestron / AMX / Extron drivers, and the Custom Control app and editor for BYOD touchscreen control. A networkable GPIO interface supplements the 2x2 local GPIO.

  Configuration is done via the free AHM System Manager software for Mac/Windows. Additional features include 32 user profiles, integrated stereo playback, an event scheduler, NTP support, automatic firmware matching across connected IP remote controllers and DX expanders, and a 12V DC backup power input (unique to AHM-64 within the family).
specs: |-
  - 64x64 processing matrix
  - 12x12 local analogue I/O (mic/line inputs and relay-protected line outputs on Phoenix connectors)
  - Built-in 128x128 SLink port for audio expansion
  - I/O Port for audio networking (up to 128x128) — Dante 96kHz (AES67/DDM ready), MADI, Waves, SLink option cards
  - 96kHz FPGA core with ultra-low latency
  - 64 configurable processing outputs — mono / stereo zones or speaker processing
  - 8x Automatic Mic Mixers (AMM)
  - ANC (Ambient Noise Compensation)
  - Priority Ducking
  - 8-band PEQ, dynamics and delay on every input and zone
  - Speaker processing: crossover filter, delay, limiter, PEQ, all-pass filters
  - EQ Ganging (relative, absolute, mirrored controls)
  - Optional Processing Expansion Module: 12-channel AEC or FBS
  - 2x2 local GPIO plus networkable GPIO interface
  - Compatible with IP1, IP6, IP8 remote controllers (up to 64 / 64 / 16 respectively)
  - Up to 96 IP remote controllers over standard TCP/IP
  - 32 user profiles
  - Integrated stereo playback
  - Event Scheduler
  - NTP support
  - TCP/IP protocol for third-party integration; Crestron, AMX and Extron drivers
  - Mac / Windows AHM System Manager software
  - Custom Control app and editor for BYOD touchscreen control
  - Automatic firmware matching for connected IP remote controllers and DX expanders
  - 12V DC backup power input
  - 1U rack-mount chassis (rear rack ear kit available)
