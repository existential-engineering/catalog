description: >-
  The E-mu Emulator III is a flagship 16-bit digital sampling workstation from
  1987, offering CD-quality 44.1kHz stereo sampling, 16-voice polyphony, a
  16-track sequencer, and extensive professional connectivity.
details: |-
  Released in 1987, the Emulator III (also known as the EIII) represented the pinnacle of E-mu's
  classic sampler line and stood as their most professional sampling workstation prior to the 1990s.
  Marketed as a "Digital Sound Production System," it combined high-fidelity sampling with
  synthesis, sequencing, and comprehensive studio integration.

  The EIII offered 16-bit CD-quality sampling in both stereo and mono at 44.1kHz or 33kHz, with
  4MB of RAM expandable to 8MB providing up to 67 seconds of sample time. Extensive sample editing
  capabilities allowed detailed manipulation of recordings, while the built-in analog filters
  earned praise for their characteristically warm and substantial tone.

  A fully featured 16-track sequencer with 100 patterns and 100 songs provided complete music
  production capability within the instrument, complemented by a built-in arpeggiator. The 61-key
  keyboard with velocity and aftertouch sensitivity offered expressive performance control, and
  ADSR envelope generators shaped the amplitude of each voice.

  Professional connectivity was a major strength, with MIDI, SMPTE time code, SCSI for external
  storage, a built-in disk drive, and multiple audio outputs. A Macintosh computer could be
  connected for graphical sample editing. Notable users included Depeche Mode, Genesis, and
  Jellyfish.
specs: |-
  - Polyphony: 16 voices
  - Sampling: 16-bit, 44.1kHz or 33kHz (stereo/mono)
  - Sample Time: Up to 67 seconds
  - Memory: 4MB RAM (expandable to 8MB)
  - Filter: Analog low-pass
  - Envelopes: ADSR
  - Sequencer: 16 tracks, 100 patterns, 100 songs
  - Arpeggiator: Built-in
  - Keyboard: 61 keys (velocity and aftertouch)
  - Connectivity: MIDI, SMPTE, SCSI, multiple outputs
  - Built-in disk drive
