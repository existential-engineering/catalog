id: Npje3ItCHP2XZKHZY6TQg
name: Link 10n
manufacturer: marantz
primaryCategory: outboard
url: https://www.marantz.com/en-us/product/network-audio-players/link-10n/300993.html
description: Reference 2.1 channel fully featured streaming preamplifier powered
  by HEOS, combining network audio streaming with full preamplifier
  functionality in a triple-layer aluminum chassis with copper plating.
details: |-
  The Marantz Link 10n is a reference-class 2.1 channel fully featured streaming preamplifier powered by HEOS built-in. It combines high-resolution network audio streaming with a full analog and digital preamplifier in a triple-layer aluminum chassis with copper plating. The Link 10n features the newest HDAM and Marantz Musical Mastering (MMM) Conversion DAC circuits, an HD TFT color display, HDMI ARC with CEC support, asynchronous USB-B DAC mode with isolation, and a 2.1 channel subwoofer output with adjustable low-pass filter. Phono input supports both MM and MC cartridges with a premium EQ stage. Streaming is delivered via HEOS, Roon Ready, Qobuz, AirPlay, Bluetooth and Wi-Fi, with control via the HEOS app, Apple Siri, and Google Assistant. Available in Marantz Black and Marantz Champagne finishes.
specs: |-
  - 2.1 channel streaming preamplifier with HEOS built-in
  - Hi-Res audio support
  - HD TFT color display
  - Newest HDAM and MM (Marantz Musical) circuits
  - MMM-Conversion DAC circuit
  - HDMI ARC with CEC support
  - 2.1 channel subwoofer output with adjustable low-pass filter
  - Phono input (MM/MC switchable) with premium EQ
  - Asynchronous USB-B DAC mode with isolation
  - Roon Ready and Qobuz support
  - Apple Siri and Google Assistant voice control
  - Electric volume control (MUSES 72323)
  - Frequency Response: 2Hz-50kHz (-3dB) PCM
  - THD: 0.0004% PCM
  - SNR: 122dB (balanced and line)
  - Output Level: 2.0V unbalanced, 4.0V balanced
  - Headphone Output: 130mW @ 32 ohms
  - Power Consumption: 7W operating; <0.3W standby
  - Dimensions: 440W x 192H x 472D mm (with antenna)
  - Weight: 33.3 kg
  - Available in Marantz Black and Marantz Champagne finishes
