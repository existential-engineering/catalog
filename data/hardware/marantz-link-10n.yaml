description: LINK 10n is a reference-class network audio player engineered using
  the same technology and artisanship that establish MODEL 10 and SACD 10 as
  class leaders.
details: |-
  LINK 10n is a streamer and a fully featured preamplifier featuring a fully balanced architecture, analog and digital inputs, and a high resolution full-color display.

  The Best of the Best. From the triple-layer aluminum chassis with copper plating to entirely original multi-layer PCBs, isolated sub-enclosures and HDAM modules, LINK 10n is the product of decades of expertise in audio engineering. It sets a new benchmark with meticulous construction, state-of-the art technologies, and elegant design.

  Intuitive Display. LINK 10n comes with a large high-resolution full-color display for a beautiful user interface and intuitive operation. Familiar arrow buttons make navigation effortless. Scroll to select your desired input and see source, track info, and play mode displayed on the screen, or enjoy easy HEOS onboarding and access to the app via a QR code.

  Marantz Industrial Design. Machined and brushed aluminum control surface, sculpted backshell, spun knobs, and high-resolution full color display are each striking features of 10 Series components. The design is both distinctively Marantz, drawing inspiration from classic models, and progressively modern.

  Preamplifier Function. LINK 10n can act as a complete preamplifier front-end for your system, with all the functions of a modern high-end stereo system. Complete with single ended and balanced analog inputs, digital inputs, and a Marantz Premium Phono EQ supporting both MM and MC cartridges, it is also a fully featured front end for even the highest performance stereo systems.
specs: |-
  - Hi-Res audio support up to DSD 11.2 MHz and PCM 384 kHz / 32 bit
  - HEOS Built-in, Roon Ready, Qobuz support, Apple Siri and Google Assistant voice control
  - 2.1 channel subwoofer output with adjustable low-pass filter
  - HDMI ARC with CEC support
  - New HD TFT full-color front panel display with 20-step dimmer
  - New HDAM output circuit, New HDAM High Grade fully balanced preamplifier circuit, toroidal power transformer
  - New MMM-Conversion DAC circuit with MMM-Stream dither, noise shaper and selectable digital filter, jitter reducer and DAC master clock design
  - Asynchronous USB-B input with Complete Isolation System Duo isolator
  - Marantz Musical Premium Phono EQ for MM and MC with selectable MC impedance (32 / 100 / 390 ohms, MM 39 kohms)
  - Electric volume control (MUSES 72323) with variable gain
  - bass, treble and balance tone control
  - Discrete headphone circuit with Low / Mid / High gain setting, 130 mW into 32 ohms
  - Line output level: unbalanced 2.0 Vrms, balanced 4.0 Vrms
  - Frequency response: PCM 2 Hz to 50 kHz (-3 dB), analog input 5 Hz to 100 kHz (+0 / -3 dB)
  - Harmonic distortion: PCM 0.0004%, analog input 0.001% (20 Hz to 20 kHz)
  - Signal-to-noise ratio: balanced 122 dB, line 122 dB, phono MM 88 dB, phono MC 76 dB
  - Optical input / output maximum support 44.1 kHz to 192 kHz (2 in / 1 out, on-off switchable)
  - Coaxial input / output maximum support 44.1 kHz to 192 kHz (1 in / 1 out, on-off switchable)
  - Triple-layer copper-plated rear panel and chassis, aluminum front panel, back-shell, side and top covers, solid aluminum feet with copper
  - Front panel illumination on all sides with dimmer
  - Dimensions (W x H x D): 440 x 192 x 472 mm with antenna, cabinet 440 x 192 x 422 mm
  - Net weight: 33.3 kg
  - Power consumption: 75 W, less than 0.3 W standby, less than 2 W with network control on
  - Supplied accessories: RC004PMND remote control with 2 x AAA batteries, audio-grade OFC power cord, stereo RCA cable, remote connector cable
