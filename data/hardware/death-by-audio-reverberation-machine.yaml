description: A synthetic atmosphere generator simulating spring reverb units,
  capable of blooming into a distorted, saturated wall-of-sound reverb.
details: |-
  BLISTERING REVERB The original synthetic atmosphere creator. The Reverberation Machine offers up drippy, saturated spring reverbs and cavernous expanses in one small package. Push the Altitude and hear the reverb blasted with gloom and distorted shimmer for the ultimate wall of sound. An instant classic for a reason, the Reverberation Machine's unique and experimental sounds are equally at home twisting your sound into a galactic nebula or adding a sinister and yearning beauty to anything you plug in. Details The Reverberation Machine has one job, and that's to make you sound incredible. This synthetic atmosphere generator simulates amp-top spring units, or at higher levels, creates a blooming distorted reverb so thick and heavy you could carve a statue from it. Maybe you've noticed the Reverberation Machine doesn't have regular reverb pedal controls. That's because it isn't a regular reverb pedal. Unless you want it to be. You're operating this machine. In true Death By Audio fashion, the VERB control goes all the way to 125% wet for trippy psyched-out reverbs that are louder than the input! This thing gets intense! Controls VOL Controls the output volume of the effect. Altitude Control This is similar to gain. Turn it up to bring in a more wide open, distorted sound. Verb Blends in the amount of reverb. Dark/Light Toggle Dark cavernous reverberation to bright shimmering reverberation. **When the Altitude and Verb controls are turned past 12 o'clock, the pedal can produce potentially harmful volumes, white noise, and other artifacts** Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 66 mA Physical Details Dimensions: 4.86" x 3.67" x 2.06" (including hardware) Weight: 14 oz. Sound Samples Hofner Galaxie Guitar Maxxed Out Bright Crash Bright Spring Dark Fuzz Dark Tones Fender Jazz Bass Grindy Blown Out A Little Gain, A Little Verb A Little More Gain Dark N Fuzzed Out
