description: >-
  The JV-80 is a 61-key digital synthesizer released by Roland in the early 1990s,
  featuring assignable sliders for hands-on parameter editing and 28-voice polyphony. It
  accepts SR-JV80 expansion boards for additional sound libraries across various
  categories. Though it lacks a built-in sequencer, it served as a solid performance and
  sound design platform and helped establish the foundation for Roland's later JV and XP
  series instruments.
details: |-
  The JV-80 was released between 1992 and 1994 as a performance-oriented digital synthesizer with hands-on editing capabilities. Sliders positioned above the keyboard allowed fast parameter manipulation, making it well suited for live use and studio sound design. Its 28-voice polyphony and 4MB ROM sound engine provided a capable starting point, though it was designed to function best as part of a larger setup rather than a standalone workstation.

  The stock sound library was modest, but the JV-80 accepts SR-JV80 expansion boards offering 8MB of additional sounds across categories including Orchestral, Vintage Synths, and Techno sets. This expandability made it adaptable to a wide range of musical styles and studio requirements.

  The sound engine provides four oscillators per voice with digital time-variant filters and two routable LFOs for modulation of pitch, amplitude, and filter parameters. Two onboard effects units round out the signal chain. Memory holds 192 patches (64 user-writable) and 48 performances (16 user-writable), with full MIDI implementation supporting 8-part multitimbral operation.

  A rack-mount equivalent, the JV-880, was available for studio integration, and the JV-90 variant offered a 76-note semi-weighted keyboard with expanded memory and an enhanced sound library. Notable users of the JV-80 include Eat Static and Vangelis.
specs: |-
  - 28-voice polyphony
  - 4 oscillators per voice, digital
  - 4 MB ROM sampled sound engine
  - Digital TVF (Time-Variant Filters)
  - 2 LFOs routable to pitch, TVA, or TVF
  - 2 effects units
  - 61-key velocity and aftertouch sensitive keyboard
  - 192 patches (64 user), 48 performances (16 user)
  - Compatible with SR-JV80 8 MB expansion boards
  - MIDI IN/OUT/THRU with 8-part multitimbral capability
  - No built-in sequencer or arpeggiator
