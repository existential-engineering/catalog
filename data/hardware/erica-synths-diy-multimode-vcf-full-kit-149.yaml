url: https://www.ericasynths.lv/diy-multimode-vcf-full-kit-149/
description: Erica Synths DIY Multimode VCF is a multimode filter with a CV
  control over cutoff and resonance and simultaneous LP, BP and HP outputs for
  serious modular patches. The core of the VCF is a highly stable, custom
  multimode VCF chip AS3320 (produced in Riga, btw).
details: |-
  The DIY Multimode VCF is a multimode filter whose core is the AS3320 custom multimode filter chip, produced in Riga. The chip is highly stable, and the module is rated for high temperature stability as a result.

  Low pass, band pass and high pass outputs are all available at the same time, which is what makes the module useful in involved modular patches rather than only as a single-mode filter in a voice chain.

  Cutoff and resonance are both under CV control, and the cutoff CV input runs through an attenuverter so the depth and the polarity of the modulation can be set at the panel. Volume drop is compensated as resonance is raised, so the level stays usable at high resonance settings.

  Audio input amplitude is 10Vptp and CV amplitude sweeps the full range from -5V to +5V. The panel is 10HP wide and the module is 35mm deep with a skiff-friendly build, drawing 36mA from each rail.
specs: |-
  - Simultaneous LP, BP and HP outputs
  - CV control over cutoff and resonance
  - Cutoff CV attenuverter
  - Volume drop compensation as resonance is increased
  - High temperature stability
  - Skiff-friendly design
  - AS3320 custom multimode VCF chip
  - Audio input amplitude 10Vptp
  - CV amplitude (full sweep) -5V to +5V
  - Panel width 10HP
  - Module depth 35mm
  - Power consumption 36mA@+12V, 36mA@-12V
