  - Package Includes: 1 UX1200R Wireless Receiver (506 MHz - 542 MHz) 1 UX-LP1 Lapel Microphone 1 UX600B Beltpack Transmitter Experience the freedom to move about the stage without the constrains of a wired microphone with the UX1200LP1 Wireless Lapel System, which is the ideal solution for spoken word presentations. The UX-LP1 Lavalier microphone is designed for speaking engagements where high intelligibility is required while maintaining a natural sound with crisp highs and defined low end. The UX-LP1 compact design allows for discreet placement on the speaker or presenter so the microphone will not distract from the person delivering the spoken word. Features: » Designed for persons giving a spoken presentation or lecture. » Compact design allows for discreet positioning. » Excellent alternative for presenters and speakers not wanting a headset mic. » Included alligator style clip allows for easy positioning on a tie or lapel. » 4-Pin TA4F style connector works with Carvin UX, SHURE and Anchor Audio systems. One UX1200B can serve as 3 different workhorses in your inventory. Choose different accessories such as the PERFORMER 1T tan over ear headset microphone (also available in black), the UX-LP1 lavalier microphone or the UX-GT 1/4-inch instrument cable.
  - UX-LP1 Specifications: »Type: Lavalier Microphone »Polar Pattern: Cardioid »Frequency Response: 100Hz-15kHz »Sensitivity (1kHz): -60dB, (1mV) »Impedance: 2.2k ohms »Connector Type: TA4F 4-Pin »Cable Length : 58.75" (150cm) »Mic Windscreen Included : Yes »Warranty: 90 Days UX1200R Receiver Specifications: » Simultaneous Channels in Operation : 14 » System Type : Analog » Group / Channel Selections : 6 Groups of 23 Channels » Channel selection : Auto and Manual ( In .025MHz increment) » RF Frequency Band : 506MHz - 542MHz » RF Bandwidth : 36MHz » Reception Format : True Diversity, PLL Synthesized » Audio Output : XLR and 1/4-Inch outputs » Receiver Type : Table Top or Rack mount » Warranty: 90 Days UX600B Belt Pack Transmitter Specifications : » Input Connector: TA4F 4-pin XLR » Frequency Response: 40Hz ‰ÛÒ 18kHz » RF Output Level : 10mW or 50mW » Battery : 2x AA, Not Included » Lighted Mute Indicator: Yes » Backlit Display: Yes » Group and Frequency Selection : Yes, Manual and Auto Scan » Sensitivity Adjust : Yes , -18dB /+12dB (3dB steps) » Attenuation Control : Yes- Helps to manage extreme SPL input » Lock Out : Yes » Microphone Accessories : UX-HM3(Black), UX-HM3T(Tan), UX-LP1, UX-GT » Warranty: 90 Days
