description: Edge Duo is a large dual-diaphragm condenser modeling microphone
  with multi-pattern vintage microphone emulations from Antelope Audio.
details: |-
  Edge Duo is a multi-pattern large dual-diaphragm condenser modeling microphone capable of 3-dimensional, high-resolution sound recordings. Custom electronics and double-sided 6-micron gold-sputtered membranes deliver an intimately detailed presence across vocals, instruments, acoustic performances and room sources.

  Edge Duo's modeling engine reproduces the sonic signatures of 18 iconic studio microphones, captured through rigorous measurements at dedicated European facilities to ensure accurate 360-degree frequency response coverage of each original microphone being emulated.

  The dual-diaphragm design exposes both capsules over two separate XLR output channels, allowing the polar pattern (cardioid, figure-8, omnidirectional and intermediate stages) to be selected and adjusted in real time during recording and after the fact during mixing.

  Includes 18 vintage microphone emulations: Berlin 47 FT, Berlin 47 TU, Berlin 49T, Berlin 57, Berlin 67, Berlin 87, Berlin K86, Berlin M103, Berlin M251, Berlin V563, Vienna 12, Vienna 414, Berlin/Halske M25, Illinois 7B, Minnesota 20, Sacramento 121R, Oxford 4038, and Tokyo 800T.

  Edge Duo works with any preamp that supplies 48V phantom power, and pairs especially well with Antelope Audio Synergy Core interfaces. Microphone emulation plugins are available in VST, AU, and AAX formats for macOS and Windows; an iLok 2 or 3 USB dongle is required.
specs: |-
  - Capsule: single capsule with large, double-sided 6-micron gold-sputtered membranes
  - Diaphragm diameter: 34 mm
  - Polar patterns: multi-pattern (cardioid, figure-8, omnidirectional)
  - Frequency response: 20 Hz - 20 kHz
  - Self-noise: 19 dB(A)
  - Signal-to-noise ratio: 75 dB(A)
  - Sensitivity: -35 dB | 18 mV/Pa (-1 to +3 dB)
  - THD+N: -116 dB
  - Output impedance: 50 Ohms @ 1 kHz
  - Power: 48V DC phantom power
  - Output connector: 5-pin male XLR
  - Output channels: 2 separate XLR output channels (one per diaphragm)
  - Dimensions: 8.6" x 2.1" (219 mm x 53 mm)
  - Weight: 1.23 lbs (560 g)
  - Included accessories: breakout cable 16.4' (5 m) 5-pin female XLR to dual 3-pin male XLR, shock mount, pop filter
