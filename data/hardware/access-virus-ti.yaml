description: >-
  The flagship of Access's Virus line, a dual-DSP powerhouse delivering over 80
  voices of polyphony with deep modulation, wavetable and granular oscillators,
  and tight computer integration.
details: |-
  Released in 2005, the Access Virus TI represented a major leap forward from the already acclaimed Virus C rather than an incremental update. Powered by dual DSP processors, it delivered over 80 voices of polyphony and introduced a revolutionary Total Integration concept that allowed the synthesizer to function as a USB audio interface and plugin within any DAW environment.

  The oscillator architecture is exceptionally deep, offering three oscillators plus a sub-oscillator and noise source per voice. Sound sources span classic analog waveforms, hypersaw (supersaw), wavetables, granular synthesis, and formant generators. Dual multimode filters with analog emulations including Minimoog-style circuitry provide the dark, aggressive character that became the Virus signature. An 18-slot modulation matrix connects three LFOs and multiple envelope sources for complex, evolving patches.

  The TI shipped in multiple form factors: a compact desktop module (whose wooden sides could be removed for rack mounting), a 37-key version, and a 61-key keyboard with Fatar keybed. The 2009 TI2 revision brought 25% faster DSP processing, a redesigned enclosure, and enhanced effects. Both generations share the same core synthesis engine and sound library of 128 patches across 30 banks.

  The comprehensive effects section includes reverbs, delays, tape delay emulation, EQs, distortion, phaser, flanger, chorus, and a vocoder. Access built a strong reputation for after-sales support, providing lifetime free firmware updates. The Virus TI became iconic in dance and electronic music production, prized for its distinctive sonic character and hands-on control surface.
specs: |-
  - Polyphony: Over 80 voices
  - Multitimbral: 16 parts
  - Oscillators: 3 + sub-oscillator + noise per voice (FM, sync capable)
  - Waveforms: Sine, pulse, sawtooth, supersaw, wavetable, granular, formant
  - Filters: Dual LP/HP/BP/BR with multi-pole analog emulations
  - LFOs: 3 with 18-slot modulation matrix
  - Envelopes: Amp, filter, LFO-as-envelope option
  - Effects: Reverbs, delays, tape delay, EQs, distortion, phaser, flanger, chorus, vocoder
  - Keyboard: 37-key or 61-key models with Fatar keybed (desktop also available)
  - Memory: 128 patches per bank x 30 banks
  - Control: MIDI, USB (audio interface + plugin integration)
