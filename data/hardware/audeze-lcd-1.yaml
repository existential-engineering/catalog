description: Open-back foldable planar magnetic headphones with 90mm drivers,
  engineered for portability, comfort, and audiophile sound quality.
details: |-
  The LCD-1 combines Audeze's planar magnetic technology with a foldable, lightweight design. Featuring 90mm planar drivers, the LCD-1 delivers frequency extension from 10Hz to 50kHz with precision clarity suitable for both audiophile listening and professional studio applications. Weighing only 250 grams with memory foam construction, these open-back headphones are engineered for extended comfortable listening sessions.

  The open-back circumaural design produces an expanded soundstage ideal for critical listening and mixing. Patented Fluxor magnets and Uniforce voice coils articulate distortion-free audio with visceral power. Each driver is hand-precision-crafted in the Orange County facility using laser-etching technology.

  The LCD-1 serves as an industry standard for mixing and monitoring across professional studios worldwide. Its soundstage and stereo imaging enable producers to confidently fine-tune mixes with complete accuracy. The foldable design with included travel case makes this premium solution accessible for portable professional use.

  Includes a dual 3.5mm cable with reversible connectors and a 1/4 inch (6.35mm) adapter. Listed as a legacy product no longer available for sale.
specs: |-
  - Style: Over-ear, open-circumaural
  - Transducer type: Planar Magnetic
  - Magnetic structure: Single-sided Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-thin Uniforce
  - Transducer size: 90 mm
  - Maximum power handling: 5W RMS
  - Maximum SPL: >120dB
  - Frequency response: 10Hz - 50KHz
  - THD: <0.1% @ 100dB
  - Impedance: 16 ohms
  - Sensitivity: 99 dB/1mW (at Drum Reference Point)
  - Ear pads: Memory foam, genuine lambskin leather
  - Weight: 250g
