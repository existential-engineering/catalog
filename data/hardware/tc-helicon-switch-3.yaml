details: |-
  The Switch-3 is a three-button external footswitch designed for TC-Helicon and BOSS-style 1/4-inch TRS footswitch jacks. Plugged into a vocal processor, it gives hands-free control over harmony, looper, preset up and down, tap tempo and effect bypass without the performer reaching for the host pedal.

  A rugged metal chassis, silent switching and an LED indicator above each button keep it gig-ready and readable in a dark venue.
specs: |-
  - Three footswitches with an LED indicator above each
  - Connects to a TC-Helicon or BOSS-style 1/4-inch TRS footswitch jack
  - Controls harmony, looper, preset up and down, tap tempo and effect bypass
  - Rugged metal chassis
  - Silent switching
  - Passive footswitch, no power supply required
