description: A quad voltage-controlled amplifier (VCA) module offering manual
  and CV control over four channels of amplification, with bi-polar LEDs showing
  signal polarity.
details: |-
  You can never have too many voltage controlled amplifiers VCAs! (voltage controlled amplifiers). Ampera offers 4x VCAs in a tiny 6HP footprint with manual potentiometer control mixed with CV control. Amplification ranges between 0.1x-2x, so you can make your 5V signals 10V with an offset voltage. Chain 2 channels together, and you have boost. Ampera has bi-polar LEDs that display red or blue depending on the polarity of the signal. At audio rates, the LEDs show purple. An excellent solution for those with small systems, or those just looking to free-up some space in their Eurorack cases. Important note: Ampera works both for CV and audio. However, if audio is passed though, it will always be slightly audible, as the VCA circuit has some leakage (cannot completely mute). Two channels can be used in series to mitigate this if necessary.
