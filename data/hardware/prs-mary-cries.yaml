details: |-
  The PRS Mary Cries optical compressor pedal is intuitive and sounds incredible. Based on the storied LA-2A, Mary Cries will thicken your tone, help control signal peaks, lengthen sustain, and push your tone without losing definition or clarity. Depending on your settings, it can be used as a boost as well as a straightforward compressor. PRS pedals were created to be high-end pieces of audio gear. Designed by PRS Guitars in Stevensville, MD, USA.
