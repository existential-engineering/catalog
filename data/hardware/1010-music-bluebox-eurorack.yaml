description: The Bluebox Eurorack edition is the new Eurorack mixer with effects
  and multichannel recording/playback based on the award-winning Bluebox desktop
  mixer. With the Eurorack edition's USB-C EXT port, you can send 2 channels of
  audio to and from your computer. Plus, you can control up to 6 mix settings
  with the 6 CV inputs. Whether recording your Eurorack jams, using it to play
  stems as backing tracks, or a combination of both, Bluebox Eurorack edition
  will rock your rack!
details: |-
  The bluebox Eurorack edition is the elegant way to get high-quality mixing, effects and integrated recording and playback all in one super-optimized 30 HP form factor. Like all 1010music products, it uses a touchscreen with knobs to let you quickly control volume, gain, 4-band parametric EQ, pan, reverb and delay effects, mute/solo and record/play functions for each track, all with a fast, fluid, intuitive workflow. Connect your eurorack, sampler, drum machine, and synthesizer outputs to 12 mono 3.5mm inputs and map them to 12 mono tracks or 6 stereo tracks, all with independent control for recording and playback. Connect a computer to the USB-C port to send and receive two channels of audio.

  Top Features: mix 12 mono/6 stereo tracks of live or prerecorded sound; independently route each track to any combination of outputs (4 mono/2 stereo outputs, plus stereo headphone output); 6 CV inputs for modulation and control, plus clock output; TRS MIDI input and output; USB-C for external MIDI controllers; USB-C for 2-channel audio streaming; microSD to record/play hours of multi-track/stereo music as 48k, 24-bit WAVs and for firmware updates; playback of pre-recorded tracks while recording new ones; master control of the same mixer parameter across multiple tracks for faster mixes; four-band EQ per track with Cut/Shelf/Parametric settings for each band; reverb and delay effects with independent sends for each track; a built-in global compressor to maximize loudness and glue the mix together; and save/recall of Project settings including all parameters for tracks, outputs, EQ and effects.

  What's Included: a bluebox Eurorack edition 30 HP Eurorack module, a microSD card with bluebox firmware and pre-loaded project files, two Eurorack power cables, a bluebox Eurorack edition Quick Start guide, and two MIDI adapters.
specs: |-
  - 30 HP
  - Module dimensions including knobs: 6" x 5" x 1.6"
  - Depth behind front panel with ribbon cable: 1.0"
  - Requires the +5V rail, which may not be present on some older racks
  - Power draw: 500-850mA at +5V (depending on screen brightness), 320mA at +12V, 82mA at -12V
  - Requires two power connections
  - 12 mono tracks, 6 stereo tracks, or a mix of both
  - Connects to TRS or USB-C MIDI for beat-synced effects
  - Supports Eurorack levels up to +/-5V on inputs and outputs
  - 3 built-in effects: reverb, delay, and compressor
  - Records and plays back 48kHz, 24-bit WAV files
  - 4-band EQ per track
  - Durable aluminum faceplate
  - Streams 2 channels of audio in and out over USB-C
  - 3.5-inch touchscreen, 4 knobs, 8 navigation buttons, 3 transport buttons
  - microSD card slot for recording and firmware updates
  - SKU: 024
  - Shipping weight: 1.04 lbs
  - Shipping dimensions: 9.25 x 7 x 2.25 in
  - Country of origin: China
  - Current firmware: version 1.1.24 (per downloads page; release notes: advanced CV control with attenuverters/offset in CV Map, EQ bypass button, capture reverb/delay tails on MIDI transport stop, count-in for recording, additional filename info for punch-in recordings)
