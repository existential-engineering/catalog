description: An instant power-chord generator that adds an octave and a perfect
  fifth to a single note, with independent level control for each voice.
details: |-
  The Black LTD. High-Five is an instant power-chord generator: it does exactly
  what it looks like it does. Three simple, intuitive controls set the output
  level of your dry signal, an octave (either high or low), and a natural fifth
  (five notes above or four notes below), turning a single note into an instant
  power chord.

  Each voice runs from -infinity dB up to +3dB, with a subtle, gentle flutter
  that recreates the natural resonance and intermodulation of a strong power
  chord. Dial in the dry level, then rotate the 5th and Oct controls to set the
  level and direction of the transposed notes (counter-clockwise for below,
  clockwise for above). It is especially effective with distortion and for leads.

  Like all Mr. Black pedals it is hand-built with premium components, true-bypass
  switching, and a tough Black LTD. powder-coat. It is a Jack Deville original
  design, produced as a limited run of 53 pieces.
specs: |-
  - Instant power-chord generator (octave + perfect fifth from one note)
  - Three controls: dry level, octave (high/low), fifth (5 above / 4 below)
  - Output levels: -infinity dB to +3dB per voice
  - Subtle flutter recreating natural power-chord resonance and intermodulation
  - True-bypass switching
  - Power: internal 9V battery (not included) or 9VDC pedal power
  - Current draw: ~59mA @ 9VDC
  - Limited run of 53 pieces
