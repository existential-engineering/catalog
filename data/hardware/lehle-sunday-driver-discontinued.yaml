description: The LEHLE SUNDAY DRIVER is a high end preamp with a convenient
  compact format. It features JFET-based circuitry and provides two modes of
  operation, with selection via a mode selector switch with gold-plated
  contacts.
details: |-
  The Sunday Driver is a high end preamp in a compact format, built around JFET circuitry. Two modes of operation are chosen with a mode selector switch with gold-plated contacts. In mode D, for Driver, the guitar signal is amplified with no modification at the input impedance of a guitar amp, eliminating the losses that occur on the route through leads and effects, so the signal stays strong and clear and retains its full dynamics.

  The second setting, S for Sunday, multiplies input impedance by four. Previously inaudible details come forward and, as gain increases, the guitar sound takes on the characteristic warmth that gave the preamp its name.

  Even at a 15 dB gain setting the Sunday Driver stays clean and free of background noise, thanks to a studio-standard signal-to-noise ratio of better than -100 dB. To exploit the dynamics of tube amplifiers to the full, the input voltage is rectified from the power supply socket, then filtered, stabilized and doubled to 18 V.

  With an output range of 20 to 100,000 Hz and the option of running from a standard 9 V (PP3) battery, it can be used as a cable driver for large stages, inside complex effects set-ups, or as a recording preamp.
specs: |-
  - JFET-based preamp circuitry
  - Two modes selected by a mode selector switch with gold-plated contacts: D (Driver) and S (Sunday)
  - Mode S multiplies input impedance by four
  - Gain up to 15 dB, clean at every setting
  - Signal-to-noise ratio better than -100 dB
  - Frequency range 20 Hz to 100,000 Hz
  - Input voltage rectified, filtered, stabilized and doubled to 18 V internally
  - Runs from a standard 9 V (PP3) battery or an external power supply
