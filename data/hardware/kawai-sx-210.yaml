description: >-
  The Kawai SX-210 is an 8-voice polyphonic synthesizer from 1983 featuring DCO
  oscillators with analog VCF filtering and VCA envelope generators. Often overlooked in
  favor of its Roland and Korg contemporaries, it offers flexible voice configurations
  including 4-voice dual-oscillator and monophonic unison modes. Its solid analog sound
  character and built-in stereo ensemble chorus make it a capable and underrated
  instrument.
details: |-
  Released in 1983, the SX-210 was widely overlooked despite its capable design. The synthesizer employs one DCO per voice with traditional analog VCF and VCA envelope generators, providing authentic analog sound characteristics.

  The instrument supports multiple operational modes: standard 8-voice polyphony, 4-voice mode utilizing two DCOs per voice for richer textures, and monophonic unison mode with eight stacked oscillators for powerful lead sounds.

  Program editing uses a global Increment wheel for parameter adjustment, a superior implementation compared to Roland's Alpha Juno approach. Users select a parameter switch and adjust the dial to desired values. The primary limitation is 32 memory patches, though a cassette interface allows patch backup and loading.

  The oscillator section provides three waveforms, a sub-oscillator, pulse-width modulation, and a noise generator. The analog lowpass VCF includes its own ADSR envelope generator, complemented by a highpass filter. The LFO simultaneously modulates DCO, VCF, and VCA. Notably, it features both glissando and portamento, which was rare in synthesizers of that era.
specs: |-
  - 8-voice polyphony (4-voice dual-DCO and monophonic unison modes)
  - 8 DCOs (1 per voice) with 3 waveforms, sub-oscillator, PWM, and noise
  - 1 LFO with 3 waveforms and reverse mode
  - Lowpass VCF with dedicated ADSR envelope generator
  - Highpass filter
  - VCA with ADSR envelope generator
  - Stereo ensemble (chorus) effect
  - Glissando and portamento
  - 61-key keyboard
  - 32 patch memory with cassette interface for backup/loading
