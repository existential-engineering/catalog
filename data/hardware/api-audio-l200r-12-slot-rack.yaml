id: _1AZNLN2QLqTrHZ_Z-LNp
name: L200R 12-Slot Rack
manufacturer: api-audio
primaryCategory: rack-mount
url: https://apiaudio.com/product/l200r-12-slot-rack/
description: 2U 12-slot rackmount chassis for API 200-series (L200) modules,
  with XLR audio I/O and TT jacks for sidechain/aux/mic. Requires external
  L200PS tri-polar power supply (sold separately).
details: |-
  19″ 2U chassis for API 200-series modules (205L DI, 212L Mic Pre, 215L
  Filter, 225L Compressor, 235L Noise Gate). 12 slots. XLR I/O wired PIN 2 hot.
  TT jacks for sidechain, auxiliary outputs, and mic inputs. External L200PS
  tri-polar (+16V/−16V/+48V) power supply required — NOT included. Front panel
  power LED. 5-year warranty.
specs: |-
  - Slots: 12 (API 200-series / L200 format)
  - Dimensions: 3.5″ H × 19″ W × 7.25″ D
  - Weight: 8.67 lb
  - Power: External L200PS required (100–250V, 50/60 Hz AC)
  - Audio I/O: XLR (PIN 2 hot) + TT jacks
