description: Our Funky, Tripped-Out Neutrino Envelope Filter and Auto Wah! This
  dynamic wah sound is an effect based on your pick attack or strength. The
  harder you pick, the harder it "wahs"!
details: |-
  The Nebula Edition is a limited run of the Keeley Neutrino envelope filter, made for the company's 13th anniversary: five units of each of five prints, 25 in total, with the print supplied at random.

  The Neutrino is an envelope filter and auto wah built on a classic opto-coupler design, with each opto-coupler tuned individually. The filter is triggered by pick attack and strength, so the harder the player picks the more pronounced the wah, moving from a rounded warmth up to a bright peak, and producing the vowel-like sounds and chord stabs associated with funk and jam band playing.

  The controls are deliberately simple. A Gain control sets input level so the effect triggers correctly with any pickup or instrument level, and the maker calls this the critical adjustment. A Peak control sets how sharp or warm the sweep is, from mellow to quacky. A Filter Selector chooses between three filter types, and a Range switch stresses either high or low frequencies. A side-mounted Direction switch sets whether the wah sweeps up or down.

  The pedal is also intended for bass guitar and keyboards, with the Gain control set for the instrument and the Peak control setting the depth of the effect.
specs: |-
  - Limited to 25 units, five of each of five prints, print supplied at random
  - Opto-coupler based envelope filter and auto wah, each opto-coupler tuned individually
  - Gain: sets input level so the filter triggers with any pickup or instrument level
  - Peak: sets how sharp or warm the sweep is
  - Filter Selector: three filter types, including band-pass and high-pass settings
  - Range switch: high or low frequency emphasis
  - Side-mounted Direction switch: wah up or wah down
  - Suitable for guitar, bass and keyboards
