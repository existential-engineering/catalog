details: |-
  Say hello to the Mini II FMH, Cordoba's popular Mini travel-size guitar, but slightly bigger and with an extended 580mm (22 7/8 inch) scale length so it tunes perfectly to Standard E. Despite its small profile, the Mini II has a deeper body depth which creates a well-rounded tone that is close to a full-size nylon string guitar. Built with a flamed Mahogany top, back, and sides, the Mini II FMH has an exotic look and sounds mellow, soft, and balanced.
