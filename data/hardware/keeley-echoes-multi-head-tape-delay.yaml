description: A multi-head tape delay pedal with 12 rhythmic delay patterns, two
  levels of tape-style wow and flutter, and up to 950ms of delay time.
details: |-
  The Echoes is a tape-style delay pedal that produces syncopated delay lines rather than single repeats. Its design follows a tape echo machine with four playback heads, an arrangement that turns the repeats into rhythmic patterns, and the Mode control steps through twelve of those patterns.

  Two modulation settings add varying amounts of tape-style wow and flutter, and the pedal offers up to 950ms of delay time. It is voiced slightly darker than the delay in the Dark Side workstation so that it sits warmly behind a fuzz or distortion placed in front of it, and the markings for the delay patterns are easier to read on this enclosure.

  The pedal exists because players asked for the Dark Side's delay as a separate unit, so the modulation and fuzz could sit at one end of a pedalboard and the delay at the other. A straightforward way to learn the patterns is to set feedback low for a single repeat, set the delay time to the wanted tempo, and then step the Mode control through its twelve settings; the manual carries a chart laying out the tape head positions behind each pattern.
