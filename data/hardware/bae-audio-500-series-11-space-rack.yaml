description: An 11-space 500 Series rack enclosure with a heavy-duty steel
  chassis and point-to-point wiring. It features XLR inputs and outputs with a
  remote 2.1A power supply to keep transformer interference away from modules.
details: |-
  BAE's 11 Space 500 Series Rack is a 19-inch rack-mount enclosure for standard API-format 500-series modules. It is built with a strong steel chassis — not aluminum — and features shielded wires on individual connectors for serviceability with no PCBs, using point-to-point wiring throughout.

  The remote power supply design keeps the power transformer interference away from the modules for cleaner audio performance, providing ±16V bi-polar power at 2.1A to hosted 500-series modules via the standard edge-connector bus.

  A smaller 6 Space Rack and a 6LB desktop chassis are also available.
specs: |-
  - Power: ±16V @ 2.1A
  - Power Requirements: 115/230 VAC, 36W
  - Dimensions: 19"W × 5.25"L × 10"D
  - Construction: Steel chassis, point-to-point wiring, no PCBs
