details: |-
  The JHS Pedals 3 Series Fuzz is a versatile fuzz box that cleans up well with your guitar's volume knob. The Fuzz is the perfect balance of vintage and modern with soaring sustain and clear articulation.

  The controls allow you to create a wide variety of sounds via the Bias knob, which gives the Fuzz a more gated sound as you turn it up. Unlike many fuzz pedals, the fuzz knob is usable across 100% of the sweep for many different flavors not typically found in a fuzz, like distortion and even pushed amp-esque overdrive tones.

  The Fat toggle engages a bass boost for an overall fatter, more powerful sound.
