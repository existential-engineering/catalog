url: https://mackie.com/en/products/studio-monitoring/hrmk2-series/HR624mk2.html
description: "Providing massive, balanced, and incredibly accurate sound,
  HR624mkII is an excellent choice for any pro studio."
details: |-
  Providing massive, balanced, and incredibly accurate sound, HR624mkII is an excellent choice for any pro studio. Whether you need an ultra-accurate monitoring setup or you want to add premium sound to your home theatre or gaming system, this THX pm3 approved monitor delivers ultimate performance and sound quality that's ideal for just about any room or setup.

  And despite it's size, you will hear and feel deep low end thanks to it's innovative passive radiator design.

  Because the HR624mk2 and it's larger sibling HR824mk2 share the same design, they function great together, making them optimal for surround systems.
specs: |-
  - Ultra-linear frequency response for accurate mix translation
  - 6.7-inch high-precision, low-distortion LF transducer
  - 1-inch titanium dome, ferro-fluid cooled tweeter
  - Optimized waveguide for wide, even sweet zone
  - Twin FR Series amps: 100W for LF / 40W for HF
  - Full internal damping eliminates midrange artifacts
  - Passive radiator provides tight, articulate bass extension down to 45Hz
  - Acoustic space, LF roll-off and HF controls
  - Balanced XLR, TRS and unbalanced RCA inputs
  - THX pm3 Certified for surround sound applications
