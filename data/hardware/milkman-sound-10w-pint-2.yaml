description: A 10-watt Class A guitar amplifier with parallel single-ended 6V6
  output, tube tremolo, and spring reverb, offered as a head or combo with a
  choice of speakers.
details: |-
  Low power with more power ABOUT The Pint is designed to add a little bit more power to the low power Half Pint circuit. A custom Mercury Magnetics output transformer allows for parallel single ended 6V6 output. The Pint delivers 10 clean watts and 18 snarling overdriven watts when the amp is pushed all the way. Like its little brother, reverb and tremolo and Class A single ended breakup is the name of the game. How about touch sensitivity and feel? The 5Y3 rectifier coupled with true class A design make the Pint the most touch sensitive Milkman amplifier to date. A pair of 6V6 running in a single ended design piles on scoop after scoop of creamy even order harmonics. Three speaker options help tailor the Pint to your unique style: Fane F25 12" is a transparent sounding speaker. Bright, Lively, and efficient. This speaker has a big bottom even at low volume. This speaker has very little breakup and does not color the amp when driven. Jupiter Alnico 12" has a classic American alnico magnet sound. A bit less transparent in the upper midrange, this speaker adds a "woody" tone. Its lively on top, and a bit more focused in the bass response than the Greenback. The speaker starts to break up and add alnico character as the amp is pushed. Its the most efficient of the 3 speaker options. Fane A30 Alnico 12" takes the amp in a different direction. This speaker is very mid forward with little midrange scoop. The top is bright, and the bass response is the tightest out of the three options. This speaker starts to break up when the amp is driven hard. When the amp is overdriven, the A30 is extremely reactive shedding low end and pushing the midrange further into the fun zone. The front end is similar to the Half Pint, with extended headroom, lush spring reverb, and deep output modulating tremolo. The amplifier is hand wired onto a turret board with bespoke Soursound transformers and Jupiter capacitors standard. WATTAGE 10W Class A SPEAKER 12” Fane F25, 8 ohm 12” 50W Alnico Jupiter Speaker, 8 ohm 12" 30W Fane A30, 8ohm EFFECTS Tube tremolo and spring reverb Includes handwired original design detachable footswitch and 15' cable Demo 10W Pint Demo by James Deprato James meets the Pint. SOUNDS Listen Reviews Matt Lemay New York City www.mattlemaysongs.com Joel Hamilton was not kidding; this is the best-sounding amp I've ever met. I had been on the fence about whether I needed an amp with reverb and tremolo, but now I couldn't imagine using an amp without them. This is a game changer for me, thanks for doing such incredible work. Richard Lawton Terre Haute, IN You created a Very Good Thing! I can't imagine using any other amp ever...it crunches at low volume, the reverb and tremolo are transcendent, it can be used at home, for recording, comfortably at small venues, mic'd at larger venues, and it is so kind to my back when I carry it.
