description: Dummy head microphone for a truly immersive sound experience. The
  KU 100 dummy head is a binaural stereo microphone. Two omnidirectional
  condenser capsules are built into artificial ears mounted on an enclosure
  resembling a human head. KU 100 recordings played back over high quality
  headphones give listeners an experience almost identical to what they would
  have heard with their own ears at the recording position, with stunning
  lateral and vertical localization and a breathtaking sense of space. Unlike
  older dummy head microphones, the KU 100 is compatible with loudspeaker
  playback as well.
details: |-
  Binaural stereo microphone for a 3D-sound experience

  Headphone playback optimized, loudspeaker compatible

  Diffuse field equalized

  Battery, external PSU, or phantom powering

  Two omnidirectional condenser capsules in artificial ears

  Transformerless circuitry for very low self-noise

  Handles SPL up to 135 dB (145 dB with -10 dB preattenuation)

  Three low cut options: 150 Hz, 40 Hz, and linear

  Balanced XLR 5 stereo output and unbalanced BNC outputs

  Mounts to standard mic stands with 5/8"-27 female thread
specs: |-
  - Acoustical operating principle: Pressure transducer
  - Directional Pattern: Ear
  - Frequency Range: 20 Hz ... 20 kHz
  - Sensitivity at 1 kHz into 1 kohm: 20 mV/Pa
  - Rated Impedance: 50 ohms balanced, 200 ohms unbalanced
  - Rated load impedance: 1 kohms
  - Equivalent noise level, CCIR: 29 dB (23 dB lt. BA)
  - Equivalent noise level, A-weighted: 16 dB-A
  - Maximum SPL for THD 0.5%: 135 dB
  - Maximum SPL for THD 0.5% with preattenuation: 145 dB
  - Signal-to-noise ratio, CCIR (re. 94 dB SPL): 65 dB
  - Signal-to-noise ratio, A-weighted (re. 94 dB SPL): 78 dB
  - Maximum output voltage: 8 dBu
  - Supply voltage ( P48, IEC 61938): 48 V ± 4 V / 6 x 1.5 V
  - Current consumption ( P48, IEC 61938): 2 x 3.5 mA
  - Battery supply: 6 x 1.5 V (AA) round cell
  - External power supply unit (supplied): 9 V
  - Matching connector: XLR 3 F / XLR 5 F
  - Weight K U 100 without batteries: approx. 3500 g
  - Weight with carrying case: approx. 9500 g
  - Height: 280 mm / 360 mm (case)
  - Width: 180 mm / 390 mm (case)
  - Depth: 220 mm / 260 mm (case)
