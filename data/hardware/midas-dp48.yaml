description: Dual 48-Channel Personal Monitor Mixer with SD Card Recorder,
  Stereo Ambience Microphone and Remote Powering. The DP48 is a 48-channel
  personal monitor mixer that allows two performers to fully control their
  monitor mixes, hear exactly what they want, and even record and playback
  rehearsals and performances. Twelve stereo groups enable rapid creation and
  balancing of personal mixes from fully configurable stem groups. The dual mix
  feature allows two users to be connected to one DP48 each with their own
  separate stereo group mix. Each group features a 3-band EQ, compressor, and
  reverb. A built-in stereo ambience microphone provides on-stage sound feed
  with an automatic ducking function to remove the sense of isolation with
  in-ear monitors. The DP48 connects via AES50 to Midas hubs featuring Power
  over Ethernet (PoE), and any 44.1/48 kHz AES50 device including Midas and
  Behringer digital consoles and I/O boxes is compatible. An SD card interface
  is provided for stereo recording and playback of rehearsal sessions and
  performances.
details: |-
  Personal Monitor Mixing Redefined. The DP48 enables two performers to independently control their monitor mixes via Dual Stereo Mixes. Each of the 12 stereo groups can be processed with a 3-band EQ, compressor, and studio-quality reverb. AES50 return channels also allow personal mixes from the DP48 to be sent back to the console or hub. When connected to a Midas hub, the DP48 can be set up and controlled remotely, and input channel labelling and color information can be transmitted to the DP48 via AES50. Compatible with Midas and Behringer digital consoles and I/O boxes.
specs: |-
  - Channels: 48 input channels
  - Stereo Groups: 12
  - Independent Mixes: Dual Stereo Mixes (Mix A and Mix B)
  - Channel Processing: 3-band EQ, compressor, and reverb per group
  - Sample Rate Compatibility: 44.1 / 48 kHz
  - Connectivity: AES50
  - Remote Powering: Power over Ethernet (PoE) via AES50 from Midas hub
  - Recording: SD card interface for stereo recording and playback
  - Ambience Microphone: Built-in stereo ambience mic with automatic ducking
