description: >-
  A foot-operated analog bass synthesizer with 13 pedal-keys and the
  unmistakable Moog filter, designed to let keyboardists and guitarists add
  thunderous low-end without lifting a hand.
details: |-
  The Moog Taurus emerged in 1975 as part of the Constellation series, a three-tiered system that also included the Apollo lead synthesizer and the Lyra polyphonic unit. While its siblings faded into relative obscurity, the Taurus pedals carved out a unique and enduring role in rock and progressive music by putting deep, floor-shaking bass synthesis literally underfoot.

  The instrument borrows its concept from organ pedalboards, presenting thirteen pedal-keys arranged in a familiar chromatic layout that could be played with the feet while the musician's hands remained free for other instruments. Two voltage-controlled oscillators generating square and sawtooth waves feed into a genuine Moog 24dB-per-octave lowpass filter, producing bass tones of remarkable weight and authority.

  Three factory presets — labeled Bass, Tuba, and Taurus — provide instant access to useful sounds, while a fourth Variable slot allows the player to dial in a custom patch using the front-panel controls. Two foot-operated sliders control filter cutoff and overall volume, enabling real-time timbral expression during performance. The control set is intentionally minimal, keeping the player focused on the music rather than programming.

  The Taurus became a staple of progressive and arena rock throughout the late 1970s and into the 1980s. Rush, Genesis, Yes, The Police, and U2 all incorporated its massive low frequencies into their live performances and recordings. Original units are now highly sought after by collectors and musicians, and the distinctive rumble of the Taurus pedals remains one of the most recognizable bass sounds in rock history.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (square and sawtooth)
  - Filter: 24dB/oct lowpass with cutoff, contour amount, and emphasis
  - VCA: Attack/Decay/Sustain envelope
  - Keyboard: 13 pedal-keys (foot-operated)
  - Memory: 3 factory presets (Bass, Tuba, Taurus) plus 1 user variable preset
  - Control: None (no CV/Gate or MIDI)
  - Produced: 1975–1981
