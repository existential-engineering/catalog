description: The Mister Focus - COMP is a two-knob compressor with character that combines compression, EQ, and output processing into a single unit, built on Louder Than Liftoff's modular Colour platform. Designed and assembled in Silicon Valley, California.
details: |-
  Three-stage signal chain: COMPRESSION stage with selectable Colour modules (Implode for classic 1176 FET limiting at 4:1 or 'all buttons in' ratios, or MN-50 Smash Compressor for aggressive FET compression), INPUT gain control (-6 to +18 dB), and MIX knob for dry/wet blending. FOCUS EQ stage is a single-knob equalizer adapted from the Chop Shop — turn right for brighter, turn left for heavier — with a PRE-C switch to route the EQ before or after compression, and internal jumpers to adjust corner frequency. MEGA output stage powered by the Mass Drivr module featuring a discrete 2520-style op amp and a custom American-wound output transformer (toggleable). Two analog plugin expansion slots support additional Colour-compatible modules. Recommended for drum room mics, vocals, drum bus, guitars, and keys.
