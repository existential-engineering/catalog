id: biRadii6cWU8319f8UrGX
name: Sonicview 24XP
manufacturer: tascam
primaryCategory: console
categories:
  - digital
  - mixer
url: https://tascam.com/us/product/sonicview_24xp
description: Digital Recording and Mixing Console featuring 44 input channels, a
  54-bit floating-point FPGA mixing engine at 96 kHz, integrated 32-track SDXC
  recorder, built-in 64-in/64-out Dante interface, three 7-inch multi-touch
  displays, and 24+1 motorized 100mm faders.
details: |-
  The Sonicview 24XP is TASCAM's flagship 44-channel digital recording and mixing console, featuring a 54-bit floating-point FPGA mixing engine running at 96 kHz with 20.8μs internal latency.

  TASCAM VIEW (Visual Interactive Ergonomic Workflow) provides three configurable view modes across three 7-inch color multi-touch displays (800×480), plus per-channel monochrome displays. The 24+1 motorized 100mm faders with encoder knobs and 8 DCA groups offer comprehensive hands-on control.

  A built-in 32-track SDXC recorder records WAV/BWF, MP3, and AAC formats to SDHC/SDXC cards or USB drives at 48kHz (32 tracks) or 96kHz (16 tracks). An integrated 64-in/64-out Dante interface with primary and secondary redundancy ports and AES67 support enables IP audio networking out of the box.

  An optional expansion slot accepts cards including IF-MA64/EX (MADI), IF-AE16 (AES/EBU), IF-AN16/OUT (16-ch analog out), IF-DA64 (64-ch Dante), or IF-ST2110 (SMPTE ST 2110). Auto-mixer with gain-sharing, 4 multi-effects processors, Ember+ protocol (V2.2.0+), and TASCAM Sonicview Control software for macOS, Windows, and iPadOS round out the feature set.
specs: |-
  - - Input channels: 44 (40 mono + 2 stereo) + 4 FX returns
  - Output buses: 22 flexible + main L/R stereo bus
  - Mixing engine: 54-bit floating-point FPGA at 96kHz
  - Analog-to-analog latency (48kHz): 0.510 ms
  - Internal mixing latency: 20.8 μs
  - ADC: 96kHz, 32-bit; DAC: 96kHz, 24-bit
  - EIN: -128 dBu or less; Dynamic range: 108 dB or more
  - THD+N: 0.002% or less; Crosstalk: 100 dB or more (1kHz)
  - Faders: 24+1 motorized 100mm
  - Displays: 3x 7-inch color touch (800×480) + channel strip monochrome
  - Built-in 32-track recorder (48kHz/24-bit or 96kHz/24-bit)
  - Built-in Dante: 64-in/64-out (48kHz) with primary/secondary redundancy
  - DCA groups: 8; Custom fader layers: 7
  - Power: 85W, AC 100–240V 50/60Hz
  - Dimensions: 690.8(W) x 228.1(H) x 554.4(D) mm
  - Weight: 18 kg
  - Operating temp: 0–40°C
