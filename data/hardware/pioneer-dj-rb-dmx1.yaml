details: |-
  DMX interface for rekordbox dj lighting mode

  Perform intuitive lighting patterns designed in rekordbox on all DMX512-supported lighting fixtures using our RB-DMX1 dedicated interface. Create and save multiple configurations in Lighting mode, then use this convertor to quickly interface your PC or Mac to DMX fixtures from a wide variety of manufacturers. Easily reconfigure the designs to suit the size of the venue or theme of the event. Use automatically generated illuminations created by an algorithm that detects the phrases in tracks, or seamlessly customise the patterns to suit your preference. Coming complete with rekordbox, you can sync lighting sequences straight out of the box.
