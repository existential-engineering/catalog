description: A hand-wired 50 watt all-tube two channel head, the first channel
  running from clean through crunch to full plexi roar and the second carrying
  the modern high gain tone Friedman is known for.
details: |-
  Dave Friedman's Smallbox 50 watt head was designed for guitarists who want the classic tones reminiscent of great vintage plexis as well as Friedman's more modern high gain offerings.

  The Smallbox features two channels. The first gives those classic plexi tones that clean up nicely with just a twist of the guitar's volume knob, going from clean to crunch to that full-blown plexi roar. The second channel features the modern high gain tone on which Friedman has built his reputation. A shared tone stack of bass, middle, treble and presence sits behind both, with a master volume and a gain control for each channel, and the clean channel adds a three-position bright switch.

  The Smallbox was designed to take pedals and suits boosts, overdrives, phasers, flangers, tremolos and wahs, while the ultra-transparent series effects loop handles time-based effects pedals and rack units. A line out with its own level control and a 4, 8 and 16 ohm impedance selector switch round out the rear panel, and channel switching runs from the included single button footswitch with LED.

  The head is handcrafted in the USA, with Tolex over tongue and groove Baltic Birch construction and custom USA made transformers, and is built to withstand the rigors of the road. It carries a limited lifetime warranty.
specs: |-
  - 50 watt all-tube head
  - Two channels
  - Hand-wired in the USA
  - 2 x EL-34 power tubes
  - 3 x 12AX7 preamp tubes
  - Two master volumes and two gain controls
  - Shared channel EQ consisting of bass, middle, treble and presence
  - Clean channel has a 3 position bright switch
  - Line out with level control
  - Ultra transparent series FX loop
  - 4, 8 and 16 ohm impedance selector switch
  - Custom USA made transformers
  - Single button footswitch with LED
  - Tolex over tongue and groove Baltic Birch construction
  - Limited lifetime warranty
  - Dimensions: 8.75 in (D) x 24 in (W) x 10 in (H)
  - Weight: 33.5 lbs
