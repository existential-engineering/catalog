description: >-
  Expand. Create. Perform. The Ludwig Total Percussion Pad gives you instant
  access to over 2,000 global sounds, full mallet instruments, and your own
  custom samples—all from a single, powerful surface. Stack layers, link pads,
  and shape performance FX in real time using the Active control dial. With USB
  import, four external trigger inputs, and a full feature off-line desktop app
  for advanced sound management, the TPP is built for any setup—from studio rigs
  to live stages.
details: |-
  Professional multi-pad with over 2,000 built-in sounds from around the world.

  Includes full mallet instrument collection, FX, and percussion kits.

  Layer two sounds per pad with independent performance modes, and link pads to manipulate up to four sounds at once for complex performances.

  Active FX knob provides live expression and real-time control, with three kit effects per preset for flexible sound design.

  Import your own samples, loops, or backing tracks directly via USB; included free Windows/Mac off-line editing app automatically formats and installs user content for fast preset management.
specs: |-
  - Over 2,000 built-in sounds
  - Includes full mallet instrument collection, FX, and percussion kits
  - Two sound layers per pad with independent performance modes
  - Pad linking up to four sounds at once
  - Three kit effects per preset
  - Active FX knob for real-time control
  - USB sample/loop/backing-track import
  - HH Pad Mode for mini-kit operation
  - Free Windows/Mac off-line editing app included
