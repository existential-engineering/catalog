description: 12x6 digital zone processor with fixed I/O, pre-configured
  architecture, and configurable insert processing for professional audio
  applications.
details: |-
  The ZonePRO 1261m is a 12-input, 6-output digital zone processor designed for installed sound systems. It features six balanced mic/line switchable inputs, four mono-summed RCA input pairs, and an S/PDIF digital input, providing flexible audio sourcing options.

  The device includes a pre-configured architecture with input processing, central matrix, and output processing capabilities. Two input insert positions and one output insert position enable channel-specific processing customization. Hardware-controlled microphone gain adjustment is available per channel, with phantom power support for condenser microphones.

  AutoWarmth® psychoacoustic processing is permanently available on each output zone to maintain full frequency bandwidth when signal levels drop. A link bus allows duplication of the first six audio channels to another ZonePRO device for applications requiring additional output zones.

  Control options include optional ZC Zone Controllers for wall-mounted interfaces, third-party integration via RS-232 or Ethernet, and ZonePRO Designer software offering configuration wizards and comprehensive system management.
specs: |-
  - 12 Inputs / 6 Outputs
  - 6 Balanced Mic/Line Inputs (Euroblock)
  - 4 Unbalanced, Mono-Summed RCA Input Pairs
  - S/PDIF Digital Input
  - Microphone Gain: 30 to 60dB per Channel
  - Mic Preamp EIN: < -118dBu, 22Hz-22kHz
  - Phantom Power: 15V
  - 6 Electronically Balanced Euroblock Outputs
  - Max Output: +20dBu
  - Max Input: +20dBu Mic/Line, +12dBu RCA
  - Sample Rate: 48kHz
  - A/D Dynamic Range: >113dB (line), A-weighted
  - D/A Dynamic Range: 112dB A-weighted
  - Frequency Response: 20Hz–20kHz, ±0.5dB
  - THD+Noise: 0.003% typical at +4dBu, 1kHz
  - Interchannel Crosstalk: >80dB typical
  - Propagation Delay: 0.8 msec
  - Two Configurable Input Insert Positions
  - One Configurable Output Insert Position
  - AutoWarmth® per Output Zone
  - Link Bus for Device Duplication
  - Ethernet Control
  - RS-232 Serial Control
  - Operating Voltage: 100-240 VAC, 50/60Hz
  - Power Consumption: 27W
