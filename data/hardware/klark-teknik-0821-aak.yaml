description: The SQ1G is a dual channel 30 band graphic equaliser with enhanced
  Proportional-Q response and fixed high-pass and low-pass filters per channel.
  It provides the essential features for corrective equalisation and filtering
  in a cost-effective 3U package for Front of House and stage monitoring
  applications.
details: |-
  The enhanced Proportional-Q equalisation offers key advantages over the Constant-Q graphic equalisers more common on the market. At low amounts of cut or boost the filter width is relatively broad, allowing gentle contouring of the frequency spectrum, and it becomes progressively narrower as the amount of boost or cut is increased, giving a more focused response so that problem frequencies can be attenuated quickly and effectively.

  The response used on the SQ1G minimises interaction between adjacent frequency bands, allowing subtle tonal correction without frequency response ripple so that more of the musical content is preserved.

  The graphic equalisation section is augmented with fixed high-pass and low-pass filters. The 80 Hz 12 dB/oct high-pass filter handles rejection of unwanted low and subsonic frequencies, particularly relevant with compact wedge monitors, and the 12 kHz 12 dB/oct low-pass filter tailors the upper frequency response to typical wedge monitor speakers. A channel gain control ranges from full mute to +6 dB and can be used to mute the signal path immediately in the event of sudden on-stage feedback.

  The graphic equaliser section uses centre-detented long-throw 45 mm precision oil-damped faders over a ±12 dB range, with a channel bypass switch for comparison of the equaliser setting against the direct signal. The faders carry protective covers to inhibit the ingress of dirt and dust.

  Inputs are electronically balanced with common-mode rejection and the electronic servo-balanced outputs have high-drive capability to cope with long cable runs, so the unit can be used in-line as well as on a console insert. Power-off bypass relays preserve the signal path in the event of a power failure. The rugged steel 3U rackmount enclosure carries industry-standard XLR connectors plus parallel-connected 1/4 inch TRS connectors.
specs: |-
  - Dual channel, 30 band graphic equalisation per channel
  - Enhanced Proportional-Q filter response
  - Fader range: ±12 dB
  - 45 mm centre-detented long-throw oil-damped precision faders with protective covers
  - Fixed high-pass filter: 80 Hz, 12 dB/oct
  - Fixed low-pass filter: 12 kHz, 12 dB/oct
  - Channel gain range: mute to +6 dB
  - Per-channel bypass switch
  - Electronically balanced inputs, electronic servo-balanced outputs
  - Power-off bypass relays
  - XLR connectors with parallel-connected 1/4 inch TRS connectors
  - 3U rugged steel rackmount enclosure
  - Auto-voltage-sensing universal switch-mode power supply
