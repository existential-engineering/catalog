description: A warm, harmonically rich overdrive voiced after the tweed tube
  amps of the 1950s. It cleans up with a twist of your volume knob and enhances
  your sound without masking the original tone of your instrument.
details: |-
  The Empress Germ Drive delivers natural, tube-like break-up that stays true to your original tone. Rolling back your guitar's volume knob cleans it up seamlessly, and it responds to your dynamics much like a tube preamp, with good sustain and warm overdrive.

  This true-bypass overdrive offers gain control, a two-band EQ (high shelf and low shelf) and an output control to tweak your sound. It works well on bass as well as guitar, and fits into a compact die-cast aluminum enclosure.
specs: |-
  - Controls: Gain, Output, high-shelf EQ, low-shelf EQ
  - All-analog signal path (no digital)
  - True bypass
  - Input impedance: 1M
  - Output impedance: 2.2k
  - Frequency response (-3dB): 20Hz - 20kHz
  - Power: 9V DC (negative tip), 2.1mm barrel connector
  - Power consumption: ~35mA
  - Enclosure: die-cast aluminum
  - Dimensions: 4.5" L x 2.5" W x 1.5" H (enclosure), 2" H including controls
  - Weight: 0.5 lbs
