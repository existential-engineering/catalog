details: |-
  Maple meets metal.

  After two years of relentless development led by John Good, DW SonicPly combines aircraft-grade aluminum with an American Maple shell for enhanced attack and articulation, offering warm tonality and focused sustain.All the sonic versatility of Maple and Aluminum in one breakthrough shell design.

  Hybrid Metal / Maple Shells

  SonicPly snare drums feature a 12-Ply Maple shell with two 1/36" Aluminum Sheets sandwiching the middle plies.  10" - 24" SonicPly drums feature a 9-Ply 333™ Maple shell with a 1/36" Aluminum sheet replacing the middle ply.Bearing EdgeThese Collector’s Series shells are precision-cut with 45-degree (toms) and 60-degree (bass and snare) bearing edges. These edges provide tonality and sustain from your toms, and depth and punch from your bass and snare.

  Make it yours.

