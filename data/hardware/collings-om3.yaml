description: The OM3 is a 3-style Orchestra Model acoustic guitar built on
  Collings' most popular 14-fret body shape. It features a Sitka spruce top with
  East Indian rosewood back and sides, an ebony fingerboard and belly bridge,
  abalone rosette, and gold Waverly tuners. The shallow 4-inch body delivers
  balanced tone and immediate response suited to both fingerstyle and
  flatpicking approaches.
details: |-
  The OM (Orchestra Model) body shape has become the most popular 14-fret model among fingerstyle guitar soloists. The OM3 represents the 3-style trim level of this form, combining premium tonewoods with meticulous construction. The Sitka spruce top is braced with a pre-war scalloped X-brace pattern in Sitka spruce, and the neck is joined via a mortise & tenon hybrid joint. The ebony fingerboard has a compound 14"-26" radius with no inlay, and the neck profile is a Modified V. The body is bound in ivoroid with b/w/b/w/b purfling, the fingerboard in .060" ivoroid, and the peghead in .100" ivoroid with b/w purfling. A chevron backstrip, abalone rosette, tortoise pickguard, and bone nut and saddle complete the appointment package.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony, no inlay
  - Bridge: Ebony belly-style, 2 3/16" spacing
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Tuners: Gold Waverly
  - Frets: Medium 18% nickel-silver
  - Truss Rod: Fully adjustable
  - Brace Material: Sitka spruce
  - Brace Pattern: Pre-war scalloped X-brace
  - Neck Profile: Modified V
  - Neck Joint: Mortise & tenon hybrid
  - Fingerboard Radius: 14" - 26" compound
  - Scale Length: 25 1/2"
  - Body Binding: Ivoroid with b/w/b/w/b purfling
  - Fingerboard Binding: .060" ivoroid
  - Peghead Binding: .100" ivoroid with b/w purfling
  - Peghead Profile: Square with volute
  - Peghead Veneer: Stained exotic ebony with MOP Collings logo
  - Backstrip: Chevron (3-style)
  - Rosette: Abalone
  - Bridge Pins/End Pin: Ebony with abalone dot
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 15"
  - Body Length: 19 1/4"
  - Body Depth: 4"
  - Total Length: 39 3/4"
  - Strings: D'Addario EJ-16 (.012" - .053")
