details: |-
  The AXON-2 is an 8HP expander module that connects to compatible ALM modules via an internal ribbon cable, adding 4 freely assignable CV inputs with individual manual offset knobs and 2 assignable performance buttons.

  Compatible host modules include SQUID SALMPLE (ALM022), MFX (ALM032), Pamela's PRO Workout (ALM034), and MCO (ALM046). The CV inputs accept any modular-level signal and can be assigned to any parameter within the host module. Per-assignment attenuation and offset are configured via the host module's interface.

  The 2 performance buttons provide direct panel control over assignable functions in the host module, enabling hands-on performance without navigating menus.
specs: |-
  - 8HP width, 38mm depth
  - +12V: 10mA, -12V: 0mA
  - 4 assignable CV inputs with manual offset knobs
  - 2 assignable performance buttons
  - Internal ribbon cable connection to host module
  - Compatible: SQUID SALMPLE, MFX, Pamela's PRO Workout, MCO
