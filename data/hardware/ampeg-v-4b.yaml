description: "100-watt all-tube bass amplifier head with vintage '70s cosmetics,
  a 3-way midrange rocker switch, and 2/4/8-ohm output options."
details: |-
  While the SVT is the undisputed king of all-tube bass heads, the legendary V-4B also holds a place in the Ampeg pantheon. When a 300-watt, 80-pound head is overkill, the V-4B steps in to deliver 100 watts of pure tube tone at roughly half the weight of an SVT.

  The V-4B has a grind and sonic texture all its own. Players who love the rich overdriven sound of power tubes pushed hard will find the amp delivers a distinctive character — a tube saturation and harmonic complexity that sits squarely in the classic Ampeg lineage.

  Built around an all-tube preamp and power amp design, the V-4B uses traditional valve circuitry to shape its tone. A flexible 3-way midrange rocker switch lets players sculpt midrange voicing for different rigs and rooms.

  Output flexibility comes from selectable 2-, 4-, and 8-ohm speaker impedance taps. Cosmetically, the V-4B leans into vintage '70s styling, faithful to the look of the original Magnavox-era heads. At 41 lb (18.6 kg) it's substantially lighter than an SVT.
specs: |-
  - Power output: 100 watts
  - All-tube design (tube preamp and tube power amp)
  - Flexible 3-way midrange rocker switch
  - Speaker output impedance: 2, 4, or 8 ohms selectable
  - Vintage '70s cosmetics
  - Weight: 41 lb (18.6 kg)
