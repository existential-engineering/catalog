description: >-
  The Yamaha CS01 is a compact analog monophonic synthesizer released in 1982, originally
  designed for novice musicians but valued by electronic producers for its fat bass
  sounds. Despite its toy-like appearance with mini keys, built-in speaker, and battery
  operation, it delivers authentic analog tones through a single VCO with multiple
  waveforms and a resonant voltage-controlled filter. Notable users include Dust Brothers,
  Underworld, and OMD.
details: |-
  The CS01 emerged in 1982 as an entry-level synthesizer with straightforward operation and editing capabilities. Though conceived for first-time synth users, the instrument has proven its value to professional electronic musicians seeking authentic analog bass generation. Its portability is enhanced by a built-in amplifier, speaker, mini keys, and battery operation option.

  Sonically, the CS01 excels at generating bubbly and growling bass through its single voltage-controlled oscillator offering sine, square, PWM, and noise waveforms. The instrument features a 12dB resonant voltage-controlled filter with switchable resonance, standard ADSR envelope generator, LFO controls, glissando function, pitch and mod wheels, and breath controller input.

  Yamaha released an improved CS01 MKII variant shortly after the original. The MKII upgraded the filter to 24dB resonance with adjustable slider control and featured a distinctive black case with green lettering, replacing the original's fixed resonance switching.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO (triangle, saw, square, pulse, PWM)
  - Filter: 12dB cutoff with switchable hi/lo resonance (24dB on MKII with slider control)
  - LFO: Sine waveform
  - Envelope Generator: ADSR
  - Keyboard: 32 mini keys
  - Memory: None
  - Control: Breath controller input, CV/Gate via Kenton kit
  - Year Produced: 1982 (MKII: 1984)
releaseDate: "1982"
