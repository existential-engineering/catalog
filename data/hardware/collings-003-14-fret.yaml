description: The 00 14-Fret Series finds the sweet spot between a small-bodied
  and mid-sized instrument while bringing to the table a distinctive voice and
  character all its own. This fullness of tone is complemented by dry and
  articulate attack, with more low-end definition than you'd typically expect to
  find in an instrument of this size.
details: |-
  The 003 14-Fret is the highest trim level in the 00 14-Fret series, featuring 3-style appointments: abalone rosette, chevron backstrip, Gold Waverly tuners, ebony bridge pins with abalone dot, ivoroid binding throughout including fingerboard and peghead binding, and a b/w/b/w/b top purfling.

  The 00 14-Fret body style finds the sweet spot between small-bodied and mid-sized, with a pleasing midrange resonance, dry and articulate attack, and more low-end definition than expected for the size. The shorter 24 7/8" scale length combined with a relatively broad waist allows for delicate top-voicing suitable for fingerstyle to strumming.
specs: |-
  - Top: Sitka spruce
  - Back & sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Bridge: Ebony belly-style
  - Tuners: Gold Waverly
  - Bridge pins/end pin: Ebony with abalone dot
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Frets: Medium 18% nickel-silver
  - String spacing: 2 3/16"
  - Bracing: Pre-war scalloped X-brace (Sitka spruce)
  - Neck profile: Modified V
  - Scale length: 24 7/8"
  - Body width: 14 1/2"
  - Body length: 18 7/8"
  - Body depth: 4"
  - Total length: 39"
  - Body binding: Ivoroid with b/w/b/w/b purfling
  - Fingerboard binding: .060" ivoroid
  - Peghead binding: .100" ivoroid with b/w purfling
  - Rosette: Abalone
  - Backstrip: 3-style (Chevron)
  - Body finish: High gloss nitrocellulose lacquer
  - Neck finish: High gloss polyester resin
