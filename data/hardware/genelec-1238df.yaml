description: "The super-compact dimensions of the 1238DF allow it to partner
  with an accompanying subwoofer to deliver main monitor performance in rooms
  where space is at a real premium."
details: |-
  The Genelec 1238DF is a super-compact three-way main studio monitor engineered for professional facilities where physical space is at a premium but uncompromising reference-grade performance is required. By combining a slimline cabinet with a remote rack-mounting RAM-L amplifier module, the 1238DF delivers true main monitor capability in control rooms, mastering suites, and post-production environments that cannot accommodate the depth of traditional soffit-mounted main monitors.

  Acoustically, the 1238DF features a coaxial midrange/treble driver paired with dual 210 mm bass drivers in a sealed MDF enclosure. The system reproduces 50 Hz to 20 kHz and produces a short-term maximum SPL of 117 dB at one meter, with 124 dB peak output. Genelec's Directivity Control Waveguide (DCW) technology shapes the dispersion pattern of the coaxial mid/high section to provide an exceptionally even frequency response on and off axis, improving stereo imaging and reducing the influence of early reflections in the listening room.

  Power is delivered by the dedicated RAM-L 3U rack-mounted amplifier, which houses a 500 W Class D bass amplifier, a 250 W Class D midrange amplifier, and a 200 W Class AB tweeter amplifier per channel. Active crossovers, optimized amplifiers, and comprehensive driver protection circuitry work together to keep the system operating safely at high output levels while maintaining low harmonic distortion (under 0.5% above 200 Hz) and a self-generated noise floor below 10 dB SPL.

  As a Smart Active Monitoring (SAM) product, the 1238DF integrates with Genelec's GLM software and reference microphone kit to automatically measure each monitor's relationship with the room and apply compensation EQ, level, distance delay, and subwoofer crossover settings. This allows the 1238DF to be deployed in stereo, surround, and immersive configurations and to deliver mixes that translate reliably to other rooms and playback systems.

  The 1238DF supports both analog and AES/EBU digital inputs via XLR, with an AES/EBU thru output for daisy-chaining additional SAM monitors. Intelligent Signal Sensing (ISS) reduces standby power draw to half a watt, and the system is shipped with individually calibrated amplifier pairing, Speakon interconnect cabling, and the network cables required for GLM control.
specs: |-
  - Frequency Response: 50 Hz – 20 kHz (-6 dB); ±2 dB (57 Hz – 20 kHz)
  - Max Spl Short Term: 117 dB SPL @ 1 m
  - Max Spl Peak: 124 dB SPL @ 1 m
  - Max Spl Long Term: 107 dB SPL @ 1 m
  - Bass Drivers: 2 × 210 mm cone
  - Midrange Driver: 125 mm cone
  - Treble Driver: 25 mm metal dome
  - Bass Amplifier: 500 W Class D
  - Midrange Amplifier: 250 W Class D
  - Treble Amplifier: 200 W Class AB
  - Crossover Bass Mid: 420 Hz
  - Crossover Mid Treble: 3000 Hz
  - Enclosure: Sealed MDF
  - Harmonic Distortion: ≤1% (60–200 Hz); ≤0.5% (>200 Hz)
  - Self Generated Noise: ≤10 dB SPL (A-weighted @ 1 m)
  - Group Delay: 5.1 ms (Extended Phase Linearity OFF)
  - Analog Input: 1 × XLR female, balanced, 10 kΩ
  - Digital Input: 1 × XLR female AES/EBU, 110 Ω
  - Digital Output: 1 × XLR male AES/EBU Thru, 110 Ω
  - Control Network: 2 × RJ45 GLM Network
  - Mains Voltage: 100–240 VAC, 50/60 Hz
  - Power Consumption Iss: ≤0.5 W
  - Power Consumption Idle: ≤25 W
  - Power Consumption Full Output: 750 W
  - Dimensions: 610 × 470 × 235 mm (H × W × D)
  - Weight: 36 kg (79.4 lbs)
  - Ram Ldimensions: 132 × 483 × 240 mm (H × W × D)
  - Ram Lweight: 6 kg (13.2 lbs)
  - Ram Lformat: 3U rack-mounted
  - Product Code: 1238DFPM
