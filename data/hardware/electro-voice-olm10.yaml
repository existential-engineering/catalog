description: The OLM10 is a rugged omnidirectional lavalier microphone built
  around a back-electret condenser element. Its small form factor and wide
  pick-up pattern make it well suited to beginners, soft speakers, and general
  spoken-word use in presentation, broadcast, and houses of worship. An
  integrated 6-foot (180 cm) cable terminates in a TA4F connector, making it
  directly compatible with all Electro-Voice bodypack transmitters. For wired
  applications it can be paired with the EV TXA adapter to feed a standard 3-pin
  XLR mic input. A clothing clip is included for fast on-talent mounting.
details: |-
  Omnidirectional back-electret condenser lavalier microphone

  Rugged construction tuned for spoken-word and presentation use

  Wide pick-up pattern forgiving of beginners and soft speakers

  Integrated 6-foot (180 cm) cable

  TA4F connector compatible with all EV bodypack transmitters

  Use with EV TXA adapter for wired XLR applications

  Clothing clip included for easy mounting
