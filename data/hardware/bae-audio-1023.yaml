description: The 1023 is a handwired microphone/line preamp with a three-band
  equalizer featuring expanded frequency options compared to the 1073, using the
  same mic/line preamp circuit but with significantly more mid and
  high-frequency selections allowing overlapping EQ curve manipulation.
details: |-
  The BAE 1023 is a completely handwired microphone/line preamp and three-band equalizer built with Carnhill (St. Ives) transformers. It shares the same mic/line preamp circuit as the 1073 but introduces significantly expanded EQ frequency options.

  The high-frequency section offers ±16dB shelving across five selectable frequencies: 10kHz, 12kHz, 16kHz, 20kHz, and 24kHz. The low-frequency section provides ±16dB shelving at 35Hz, 60Hz, 110Hz, or 220Hz.

  The mid-range section delivers ±12dB or ±18dB peaking with 11 switchable center frequencies ranging from 160Hz to 10kHz, enabling highly specific tonal shaping and overlapping EQ curve manipulation not possible on the 1073.

  A high-pass filter operating at 18dB/octave is switchable between 45Hz, 70Hz, 160Hz, and 360Hz. Additional controls include an EQ on/off switch and a 180° phase reverse button.

  The 1023 is available as a 19″ 1RU rackmount (with or without power supply), as a 500-series format module, and in stereo pair configurations. Standard and black faceplate options are offered.
specs: |-
  - Frequency Response: 10Hz to -3dB at 55kHz
  - Mic Input Impedance: ~1200/300 ohms
  - Line Input Impedance: 10k ohms
  - DI Input Impedance: ~150k ohms
  - Output Impedance: 65 ohms
  - CMRR: 100dB min @ 60Hz
  - Maximum Output Level: +27.4 dBu @ 600Ω
  - Gain Range: 0 to 80 dB
  - Equivalent Input Noise: -110 dBu (unweighted, 300kHz BW)
  - High Frequency EQ: ±16dB shelving, 10kHz / 12kHz / 16kHz / 20kHz / 24kHz
  - Low Frequency EQ: ±16dB shelving, 35Hz / 60Hz / 110Hz / 220Hz
  - Mid Range EQ: ±12dB or ±18dB peaking, 11 switchable center frequencies (160Hz–10kHz)
  - High Pass Filter: 18dB/octave, switchable 45Hz / 70Hz / 160Hz / 360Hz
  - Transformers: Carnhill (St. Ives) hand-wired
  - Power Requirements: 115/230 VAC, 28W
  - Module Dimensions: 45mm W × 8.75" H × 10.5" D
  - Rackmount Dimensions: 19" W × 1.75" H × 9" D
  - Module Weight: 6 lbs (2.72 kg)
  - Rackmount Weight: 10 lbs (4.54 kg)
