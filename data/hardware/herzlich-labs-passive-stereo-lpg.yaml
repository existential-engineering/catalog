description: A passive dual low pass gate module using two hand-built vactrols
  with a single cutoff control, designed for stereo signal processing with
  internal normalization.
details: |-
  Seeing double, maybe, but are you also hearing double? Most of us came into this world with two ears. With the exception of Van Gogh, this remains true for most, so why squander your signals on mere mono? The Passive Stereo LPG is not one, but two low pass gates, in one. Two hand-built vactrols, side by side, with one cutoff control to allow you to sweep through four different cutoff values simultaneously. Internal normalization gives you interesting options when it comes to your stereo signal: CV and audio inputs on the left channel are repeated in the right channel without a signal present, meaning a mono source can quickly become stereo, while stereo signals remain firmly in their realm. CV control will grant you many interesting options, however - while you can simply repeat the same CV signal on both channels, small (or large) variations on either channel will create distinctly different outputs, from gentle stereo movements to complete separation. The discerning listener will appreciate your good taste when they hear your LPG plinks and bloops in beautiful, wide stereo. Will you deny them this gift forever, or cater to their delicate desires?
specs: |-
  - Two independent LPG units for stereo separation
  - Hand-built, custom made vactrols
  - Single four-way cutoff control for both channels
  - Channel normalization from left to right input
  - High grade component selection and all-analog architecture
  - Low-profile passive design fits anywhere and draws no power
