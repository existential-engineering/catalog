details: |-
  Tailor-made for the left-handed player, this concentric Turbo Cam pedal with dual chain-and-sprocket drive system is both powerful and versatile.

  A host of drummer-friendly adjustments offer feel customization for a wide variety of musical genres and playing situations. Standard features of this pro-level machine include the Delta Ball-Bearing Hinge, Precision Universal Assembly and Single Post Auxiliary Pedal.

  The Tri-Pivot Toe Clamp's three self-aligning rubber pads grip any diameter bass drum counter hoop, and a ballistic nylon deluxe carrying case with a rigid liner protects the pedal, beaters and universal assembly.
specs: |-
