url: https://www.ericasynths.lv/fusion-vcf3-910/
description: The Fusion VCF3 is resonant 24dB/oct lowpass filter of unique
  design that combines vacuum tubes and vactrols, providing distinct, soft
  filtering. For more versatility, the independent audio mixer and buffered
  multiple is incorporated in the module, and, most importantly – a CV recorder
  that records motion of the potentiometer, so you can design advanced
  modulation patterns.
details: |-
  A resonant 24dB/oct lowpass filter of unique design, fully analogue, that combines vacuum tubes and vactrols for a distinct, soft filtering character. Because of the lag inherent to vactrols the filter will not accept audio rate modulation, and the maximum modulation frequency is 10Hz.

  An input signal mixer with a gain of 2 is built in, so signals can be overdriven on the way into the filter, and a buffered multiple is included for splitting audio and CV signals.

  The most distinctive addition is a potentiometer motion record unit with CV and gate outputs, plus multiplication and division of the recorded CV, which allows advanced modulation patterns to be designed by hand and played back.
specs: |-
  - Filter slope 24dB/oct
  - Vacuum tube and vactrol based filter circuit
  - Maximum modulation frequency 10Hz (no audio rate modulation)
  - Input signal mixer with gain 2 for signal overdrive
  - Buffered multiple for splitting audio and CV signals
  - Potentiometer motion record unit with CV and gate outputs
  - Recorded CV multiplication and division
  - Audio input level 10Vptp
  - CV input level -5V to +5V
  - CV output level 0V to +5V
  - Panel width 20HP
  - Module depth 36mm
  - Power consumption 81mA@+12V, 76mA@-12V
