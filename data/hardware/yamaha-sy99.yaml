description: >-
  Yamaha's flagship 1991 workstation merging advanced FM synthesis with high-quality sample playback,
  resonant filters, and a built-in sequencer for comprehensive music production.
details: |-
  The SY99 represented Yamaha's most ambitious attempt to fuse FM synthesis with sample-based sound generation in a single professional instrument. Released in 1991, it combined an Advanced FM (AFM) engine derived from the DX series with Yamaha's AWM2 sample playback technology, providing 32 voices of polyphony split between the two sound engines. The result was an instrument capable of both the complex harmonic textures that FM excels at and the realistic timbres that only sampled waveforms can deliver.

  Building on the earlier SY77, the SY99 expanded the platform with a larger 76-note keyboard, upgraded synthesis capabilities, and a more generous sample ROM containing 267 waveforms. Crucially, it introduced multi-stage time-variant filters with resonance — a feature conspicuously absent from earlier Yamaha digital instruments. These filters could sweep and shape sounds in ways reminiscent of analog synthesizers, bridging the gap between the clinical precision of digital synthesis and the warmth players associated with vintage hardware.

  The onboard 16-track sequencer with a capacity of 27,000 notes made the SY99 a genuine production workstation. Two internal digital effects processors offered 63 effect types that could be applied independently, and the generous memory — 128 presets plus 128 user patches — ensured enough sonic variety for live performance and studio work alike.

  The SY99 found favor with demanding keyboardists who needed both sonic sophistication and production capability in a single instrument. Vangelis adopted it alongside his beloved CS-80, and jazz fusion keyboardist Chick Corea incorporated it into his live rig. While it never achieved mass-market popularity, the SY99 remains one of the most capable and sonically distinctive workstations of the early 1990s.
specs: |-
  - Polyphony: 32 voices (16 AFM + 16 AWM2)
  - Oscillators: 6-operator AFM synthesis engine + AWM2 sample ROM with 267 waveforms
  - Filter: Multi-stage time-variant filters with resonance
  - Effects: 2 internal digital effects processors, 63 effect types
  - Sequencer: 16 tracks, 27,000-note capacity, 99 patterns, 10 songs
  - Keyboard: 76 keys with velocity and aftertouch
  - Memory: 128 preset + 128 user patches
  - Control: MIDI
  - Produced: 1991
