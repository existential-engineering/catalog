description: "The 6040R fuses the very best of Finnish technology and design,
  bringing exceptional performance and beautiful aesthetics to all lovers of
  high quality audio."
details: |-
  The 6040R is a Smart Active floor-standing loudspeaker that updates Genelec's original 6040A two decades after its launch. Designed for high-quality home and high-end listening, home theatres, and TV and gaming, it combines professional-grade low-frequency drivers, proprietary Class D power amplifiers, and tight integration with Genelec's GLM calibration software to deliver clean performance, a smooth frequency response, precise imaging, and low distortion even in challenging acoustic environments.

  The 6040R was created in close collaboration with leading Finnish designer Harri Koskinen, with fluid curves fashioned from die-cast recycled aluminium. The sealed-box enclosure shape and material help produce a more truthful, less coloured loudspeaker performance while also serving as a visual centrepiece in any listening environment. Built to high environmental standards, the 6040R is engineered for decades of trouble-free operation.

  Acoustically, the 6040R pairs a 165 mm magnetically shielded bass cone with a 19 mm metal-dome tweeter, each driven by its own 150 W Class D amplifier. It reproduces 43 Hz - 20 kHz at -6 dB with ±1.5 dB accuracy from 50 Hz to 20 kHz, peak SPL of at least 118 dB per pair, and self-generated noise of no more than 5 dB SPL. Group delay measured at the analog input with Extended Phase Linearity off is 2.9 ms.

  Connectivity comprises a balanced XLR analog input (10 kOhm), an AES/EBU XLR digital input (110 Ohm), and an AES/EBU XLR digital output/thru (110 Ohm), plus two RJ45 CAT5 GLM network ports for control and room calibration via the Genelec Loudspeaker Manager software. Mains input accepts 100-240 VAC 50/60 Hz, with Intelligent Signal Sensing (ISS) reducing standby consumption to no more than 1 W.

  The 6040R is part of Genelec's Signature Series and is available in five factory finishes: White with White Grille, Black with Black Grille, White with Black Grille, Black with White Grille, and Grey. It integrates with Genelec subwoofers such as the F Two and 7360A and is calibrated and tuned through the GLM Calibration Kit.
specs: |-
  - Peak SPL: ≥118 dB
  - Short term max SPL: ≥109 dB
  - Long term max SPL: ≥98 dB
  - Frequency response: 43 Hz - 20 kHz (-6 dB)
  - Frequency response accuracy: ±1.5 dB (50 Hz - 20 kHz)
  - Self-generated noise: ≤5 dB SPL
  - Group delay: 2.9 ms (Extended Phase Linearity off)
  - Bass driver: 165 mm cone, magnetically shielded
  - Treble driver: 19 mm metal dome, magnetically shielded
  - Bass amplifier: 150 W Class D
  - Treble amplifier: 150 W Class D
  - Enclosure material: Die-cast aluminium
  - Enclosure type: Sealed box
  - Analog input: 1 x XLR female, balanced, 10 kOhm
  - Digital input: 1 x XLR female AES/EBU, 110 Ohm
  - Digital output: 1 x XLR male AES/EBU thru, 110 Ohm
  - Control: 2 x RJ45 CAT5 (GLM network)
  - Mains voltage: 100-240 VAC 50/60 Hz
  - Power consumption (ISS active): ≤1 W
  - Power consumption (idle): ≤12 W
  - Power consumption (full output): 180 W
  - Height: 999 mm (39.3 in)
  - Width: 237 mm (9.3 in)
  - Depth: 220 mm (8.7 in)
  - Weight: 14.9 kg (32.8 lb)
