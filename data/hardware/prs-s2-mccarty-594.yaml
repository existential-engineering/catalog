details: |-
  The S2 McCarty 594 is a versatile, vintage-inspired instrument that delivers both humbucking and single-coil tones in a modern, reliable package. Featuring a bound 22-fret Pattern Vintage neck and slightly thicker back for more sustain, the S2 McCarty 594 feels and sounds like a guitar you’ve been playing forever. A zinc two-piece bridge with brass saddles and steel studs, bone nut, and PRS Phase III tuners with unplated brass shafts anchor this guitar and stay true to the promise of the McCarty family.

  Loaded with Maryland, USA-made PRS 58/15 LT pickups, the S2 McCarty 594 has a warm, vintage-inspired tone. Whether you are looking for authentic humbucking tones or nuanced, sweet single-coil sounds, the S2 McCarty 594 can seamlessly master both sonic territories thanks to both the pickups and dual volume and push/pull tone control layout.

  Designed to capture the heart of the McCarty family of instruments and stay true to the S2 Series spirit, the S2 McCarty 594 is a guitar your arsenal deserves.
