details: |-
  The G&L Legacy blends contemporary refinements from the Leo Fender-designed S•500 and Comanche models with classic Alnico V pickups. For a player whose holy grail is faithful Alnico single-coil tone with modern refinements and superb craftsmanship, the Legacy makes for an excellent choice.

  The Legacy's vintage-spec CLF-100 Alnico V pickups have that unmistakable chime and quack reminiscent of the best examples from the late '50s, thanks to the work of G&L's Paul Gagon. Gagon found his inspiration reviewing original prints stored in Leo's private laboratory at G&L, but that was just the start. In the early '80s, Gagon was an R&D engineer at another company when he was tasked with finding out what was so special about the early bolt-on guitars many players raved about. Gagon analyzed many examples of what were considered holy grail guitars, spending time out on the shop floor talking to builders still working in the pickup department since the '50s, all on a quest to discover where the real mojo was, and wasn't. What he learned from the builders matched his own engineering analysis. Back in the day, the actual spec of pickups coming down that old production line varied considerably. That meant coming up with the right specs for the Legacy pickups was more challenging than simply following the prints. Gagon's persistence paid off as the Legacy garnered rave reviews from both players and magazines like Guitar Player and Guitar World.

  This axe is no slave to the past, however, starting with Leo's PTB (Passive Treble and Bass) system which functions on all three pickups for dramatically more variety than the vintage setup. What's more, the Legacy features a Leo Fender-designed Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm.

  The Legacy is all about honest, classic Alnico tone complemented by Leo's own modern refinements, at a price within reach of every working musician.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: G&L CLF-100 Alnico V single-coils
  - Body wood: Swamp Ash top on Poplar
  - Neck wood: Hard-Rock Maple with Rosewood fingerboard
  - Neck width at nut: 1 5/8"
  - Neck radius: 12"
  - Neck profile: medium C
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: 18:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato
  - Controls: 5-position pickup selector, volume, treble, bass (PTB system)
  - Available in: 3-Tone Sunburst over Swamp Ash top on Poplar, 3-ply Black pickguard, Rosewood fingerboard
