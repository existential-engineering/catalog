description: Channel-switching guitar amplifier that places the Vinny 1 Watt
  circuit, complete with output transformer and dummy load, in the dirt channel
  for real power tube distortion in the preamp stage.
details: |-
  Point-to-point construction on terminal strips (no circuit, eyelet or turret
  board). Custom Soursound transformers including wax-potted output transformer.
  Jupiter Yellow Tone Capacitors. Baltic birch head cabinet.

  Dirt channel uses the Vinny 1 Watt circuit with output transformer and dummy load
  for real power tube distortion at any volume. Fits Benson 1x12 cabinet, vertical
  2x12, and horizontal 2x12 cabinet. Handmade in Portland, OR.
specs: |-
  - Tubes: 2x EL34, 1x 6L6, 1x EL84, 3x JJ 12AX7
  - Power: 35 watts
  - Speaker outputs: 1x 8 ohm, 1x 16 ohm
  - Channels: foot-switchable clean/dirt channels
  - Effects loop: pedal-level FX loop
  - Dimensions (head): 18.5"W x 8"H x 8"D, 23 lbs
