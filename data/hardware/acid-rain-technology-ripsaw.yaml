description: Ripsaw is a digital eurorack oscillator bringing polyphony with 4
  voices of 7 morphing super-saw to super-square waveforms, each with individual
  pitch control. It features stereo spread outputs.
details: |-
  Ripsaw is a powerful digital oscillator designed to bring polyphony to your rack in a compact and playable interface. We were inspired by the super-saw; a mainstay of electronic music production, and a waveform rich with harmonics for filters and effects to chew on. Ripsaw features 4 voices of 7 waves, with individual pitch control per voice. All waves morph from super saw to super square for giant hollow basslines and more
