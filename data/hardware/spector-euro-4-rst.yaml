details: |-
  The Euro RST series brings Spector's classic design into a new era with updated tonewoods, enhanced electronics, and a fresh palette of exclusive stain options. Neck-through construction has long been central to the Spector design. The Euro RST takes this concept to the next level with a three-piece Roasted Maple neck & fingerboard, which not only gives this design a distinct look, but offers enhanced stability and rigidity. This perfectly tempered tonewood is paired with a uniquely figured Flame Maple top and Empresswood back, for striking looks, resonance, and lightweight performance. For electronics, Euro RST models are loaded with Aguilar Super Double pickups and OBP-2 pre-amps for an added mid-range focus that's sure to cut through any mix. These exciting basses are available in three all-new colors, Sienna Stain, Turquoise Tide, and Sundown Glow, each complemented with a matching headstock, and a soft matte finish that feels broken-in from day one.
