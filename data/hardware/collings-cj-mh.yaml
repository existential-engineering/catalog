description: The CJ Mh is a slope-shouldered jumbo acoustic guitar that draws on
  classic pre-war dreadnought tradition while carving out its own tonal
  identity. Built with a Sitka spruce top and Honduran mahogany back, sides, and
  neck, it delivers a warm, percussive bottom end well suited to blues and roots
  playing. A pre-war scalloped X-brace contributes to its vintage-inspired
  response and projection.
details: |-
  The CJ Mh is a slope-shouldered jumbo acoustic guitar sharing the body dimensions of a traditional dreadnought but delivering a distinctly different tonal character. The combination of a Sitka spruce top with Honduran mahogany back, sides, and neck produces a warm, percussive character well suited to blues and roots playing. A pre-war scalloped X-brace in Sitka spruce contributes to its vintage-inspired response. The ebony fingerboard features mother-of-pearl long dot inlays, and the ebony belly-style bridge is set to a 2 3/16" spacing. Bindings are tortoise with b/w/b/w top purfling, and the rosette is ivoroid with b/w purfling. Finish is high gloss nitrocellulose lacquer on the body with a polyester resin neck finish.
specs: |-
  - Body Style: Slope Shoulder Jumbo
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Inlays: MOP long dots
  - Scale Length: 25 1/2"
  - Nut Width: 1 11/16"
  - Neck Profile: C-shape
  - Bracing: Pre-war scalloped X-brace (Sitka spruce)
  - Bridge: Ebony belly-style, 2 3/16" spacing
  - Tuners: Nickel Waverly
  - Body Binding: Tortoise with b/w/b/w top purfling
  - Fingerboard Binding: Tortoise with b/w purfling
  - Peghead Binding: Tortoise with b/w purfling
  - Backstrip: 1-style walnut
  - Rosette: Ivoroid with b/w purfling
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: Polyester resin
  - Body Width: 16"
  - Body Length: 20 1/8"
  - Body Depth: 4 7/8"
  - Total Length: 41"
  - Strings: D'Addario EJ-17 (.013"-.056")
