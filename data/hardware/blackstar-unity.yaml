url: https://blackstaramps.com/unity/
description: Compact, versatile and powerful bass combos for home right up to stage.
details: |-
  Unity Pro Bass are the result of countless hours of technical research and benchmarking against the most iconic historic references. Designed from the ground up by bass players, for bass players they are straight forward and powerful.

  Blackstar's unique Response control allows the player to choose between the sound and feel of three classic power amp stages, shaping compression, natural drive and dynamics. Combined with three distinct preamp voicings and a 3-band semi-parametric EQ, Unity produces infinitely flexible bass tone and exceptional feel, whatever your playing style.

  Unity's deceptively simple controls allow you to quickly and easily mould and create your tone no matter the style. Choose from 3 unique voices (Classic, Modern, Flat) and response controls to uniquely shape the sound in your head.

  Push your creativity with built-in Chorus, Compression and Sub-Octave effects, all whilst providing the perfect unit for both studio and stage with a balanced XLR DI, USB connectivity and more.

  The Unity series spans the Unity 30, Unity 60, Unity 120, Unity 250 and Unity 500 combos, plus the Unity 250ACT — a 250W active extension cabinet for Unity combos.
specs: |-
  - Power output options: 30W, 60W, 120W, 250W, 500W
  - Speakers: 1x8" (U30), 1x10" (U60), 1x12" (U120), 1x15" Eminence Opus (U250), 2x10" Eminence Opus (U500)
  - 3 Voices: Classic, Modern, Flat
  - 3-band EQ with semi-parametric Mid
  - Built-in Chorus and Sub-Octave effects with adjustable level
  - Built-in Compressor
  - Pad Switch
  - Instrument Input, Footswitch Input, Line-in
  - Effects Loop (U250 and U500)
  - USB Recording (U250 and U500)
  - DI/Line Out (XLR and Jack) with cabinet emulation
  - Cabinet Link (XLR) for extension via Unity 250ACT active cabinet
  - Unity 250ACT: 250W active extension cabinet with 1x15" Eminence Opus speaker and Cabinet Link Thru
