description: >-
  The Roland JX-10, also known as the Super JX, is a 12-voice polyphonic analog
  synthesizer released in 1986 that combines two JX-8P voice modules into a single
  instrument. Featuring a 76-note keyboard with velocity and aftertouch, it delivers an
  outstandingly warm and rich analog sound that remains popular in modern studios. Notable
  users include Pink Floyd, Duran Duran, The Cure, and Angelo Badalamenti.
details: |-
  Released in 1986, the JX-10 (Super JX) combines two individual JX-8P synthesizer modules for an outstandingly warm, rich analog sound which is still used in many modern studios around the world. It features a quality 76-note keyboard with velocity and aftertouch, making it one of the most programmable synths of its era.

    The JX-10 replaced traditional knobs and sliders with low-profile buttons and an LCD display for parameter editing. It includes a chorus effect and a chase-play delay function that allows programmable delayed repeats of voices by alternating patches of the upper and lower modules. Two programmable sliders provide real-time control over selected parameters.

    The instrument accommodates 50 preset and 50 user patches along with 64 program patches. A simple sketch-pad one-track real-time sequencer is built in, supporting M16C cards for 400 notes or M64C cards for 1440 notes of storage. The JX-10 has been used by artists including Jane Child, Pink Floyd, Duran Duran, Angelo Badalamenti, Yellow Jackets, and The Cure.
specs: |-
  - Polyphony: 12 voices
    - Oscillators: 2 DCOs per voice (24 total)
    - Filter: One resonant low-pass and one non-resonant high-pass filter
    - Envelope Generators: 2 ADSR per voice
    - Effects: Portamento, chorus, chase-play delay
    - Memory: 50 preset patches, 50 user patches, 64 program patches
    - Keyboard: 76 keys with velocity and aftertouch
    - Sequencer: 1-track real-time, 400 notes (M16C) / 1440 notes (M64C)
    - Control: MIDI
