description: The Jake E Lee signature 20-watt all-tube head, a two-channel EL84
  amplifier with an internal load and a cab-simulated XLR output for silent
  recording.
details: |-
  Following the limited edition JEL-100 signature head, Jake E Lee and Dave Friedman teamed up again and combined their ears and talents to create the Jake E Lee 20 Head, a signature amplifier that offers Lee's tones in a compact 20-watt package. The rigid Baltic birch head cabinet is presented in a signature red tolex with contrasting white piping, designed to cosmetically match the Jake E Lee 20 cab.

  The JEL-20 is a two-channel, EL84-powered all-tube fire breather. In Lee's own words, "this amp puts the two specific tones I use to create my sound in one head: The sweetness and warmth of a classic Plexi and the more aggressive slant of the master volume amps of the '80s, all tweaked to my taste." Jake's playing embraces the athleticism of the '80s while remaining firmly rooted in the hard rock fundamentals of the '70s, and his tonal choices provide the evolutionary glue between the sonics of those two great eras.

  The head features an internal load and a cab-simulated XLR output. Comparing this analog circuit to some of the most intricate computer-based IRs, Dave Friedman achieved a direct output that can be sent to front of house or used in the studio. The XLR output includes ground-lift, level, and center-of-cone or edge-of-cone axis switches.

  The JEL-20 also allows silent playing, so the amp can be run safely without a speaker cabinet connected, which makes recording without a cab straightforward.

  The ultra-transparent buffered, series effects loop takes time-based effects pedals and rack units equally well. It is the same FX loop Friedman uses on all its amplifiers, including the BE-100. A SAT switch adds gain, compression and saturation, and a global presence control sits alongside it.
specs: |-
  - 20-watt all-tube head
  - 2 channels
  - 2 x EL84 power tubes
  - 3 x 12AX7 preamp tubes
  - Custom made transformers
  - JEL channel: gain, master, bass, middle, treble, with a push-pull hi/lo gain switch
  - Plexi channel: gain, volume, shared EQ and bright switch
  - Global presence control
  - Ultra-transparent series effects loop
  - SAT switch adds gain, compression and saturation
  - XLR cab simulated output with ground lift, axis and level switches
  - Silent recording: record without a speaker connected
  - Impedance selector switch: 8 and 16 ohm
  - Foot switch included
  - Assembled in the USA
  - Limited 5 year warranty
  - Dimensions: 8.5 in (D) x 18 in (W) x 8.25 in (H)
  - Weight: 22 lbs
