description: Bandit is a fun combination of band-pass filters, VCAs, and routing
  options. A spectral processing playground.
details: |-
  Bandit is a spectral processing playground from Befaco combining band-pass filters, VCAs, and flexible routing options in an 8 HP Eurorack module.

  It serves multiple functions including voltage-controlled equalizer/isolator, spectral crossover, multiband VCA, four-band spectral mixer, and spectral external FX insert point.

  Bandit allows you to cut or emphasize different frequency bands of a signal, acting as a voltage-controlled equalizer or isolator. It can split a sound into four different frequency bands for external processing and optionally insert them back into the mix.

  With individual band inputs, you can mix four different signals with predefined tone placement. Four different envelopes can modulate volume per band to create varied sounds from a single source, and LFOs or audio-rate modulation can create evolving timbres.

  Designed, kitted, and assembled in Barcelona, Bandit is available both as a fully assembled module and as a DIY kit.
