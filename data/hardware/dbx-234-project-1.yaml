description: Stereo 2/3-Way, Mono 4-Way Crossover (discontinued legacy model).
details: |-
  The dbx 234 (Project 1) is a discontinued legacy crossover from dbx Professional Audio, designed for audio signal routing and frequency division in professional sound reinforcement applications. As a predecessor to the current 234 series, it performed stereo 2-way/3-way or mono 4-way frequency splitting for more precise speaker management.

  This unit has been superseded by newer models in the dbx crossover lineup. Documentation remains available through the shared 223/234 Project 1 owner's manual.
