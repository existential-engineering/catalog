name: "4436A Smart IP Active Pendant Loudspeaker"
manufacturer: genelec
primaryCategory: speaker
url: https://www.genelec.com/4436a
description: "The Smart IP 4436A hanging pendant loudspeaker is specially
  designed for AV installations in open high-ceiling spaces, easing targeted
  sound distribution while combining subtle aesthetics with the highest quality
  sound reproduction — and utilising our award-winning Smart IP single-cable
  networked technology for ease of installation, system scalability and simple
  operation. The elegant and highly durable steel pendant design of the two-way
  4436A provides exceptional long-term value for premium AV installations and is
  available in a choice of black or white finish."
details: |-
  The Genelec 4436A is a Smart IP active pendant loudspeaker engineered for AV installations in open, high-ceiling spaces — atriums, lobbies, retail, hospitality, transport hubs and corporate environments where targeted, intelligible sound has to coexist with restrained visual aesthetics. The two-way design is built into a highly durable steel pendant enclosure created in collaboration with Finnish industrial designer Harri Koskinen, fusing Genelec's acoustic engineering with a minimalist Nordic visual language. Black (4436AM) and white (4436AW) finishes are offered, and the loudspeaker ships with a 5 m adjustable hanging wire plus magnetically attached grille and cable entry covers.

  Acoustically, the 4436A delivers a frequency response of 70 Hz - 20 kHz (±2.5 dB), with -6 dB extension reaching from 62 Hz down to 39 kHz at the top end. A 130 mm cone woofer and 19 mm metal dome tweeter are each driven by an independent 50 W Class D amplifier, and a proprietary internal power supply stores energy to deliver short-term SPL of ≥104 dB on demand — well above what raw PoE+ headroom would normally allow. Coverage is shaped for room-filling distribution at 120° horizontal by 100° vertical, and loudspeaker synchronisation operates to sub-microsecond level for solid acoustic imaging across multi-speaker zones.

  Connectivity is the defining feature of the Smart IP platform: a single CAT cable carries power (PoE or PoE+), audio (uncompressed, low-latency Dante and AES67 streams) and management traffic to each pendant. The 4436A exposes one RJ45 network port for AES67 / Dante input and one Euroblock 10 kOhm balanced analog input as a fallback or local source. Power consumption is exceptionally low — ≤4 W with Intelligent Signal Sensing active and ≤5 W at idle — supporting 24/7 deployments without meaningful overhead.

  System configuration, supervision and calibration are handled through Genelec's Smart IP Manager software, which provides device discovery and detailed control at individual, room, zone and system levels. Day-to-day operation is exposed through the Smart IP Controller mobile app for iOS and Android, and a public API command set plus pre-built drivers allow integration into common AV control automation systems (Crestron, Q-SYS, etc.). Each loudspeaker carries built-in room compensation and alignment tools that remove the need for external DSP.

  Designed and manufactured in Finland under strict sustainability and quality systems, the 4436A is intended as a long-life premium AV asset rather than a disposable install fixture. Installation is reduced to running a single CAT cable and hanging the speaker from the included adjustable wire, removing bulky external amplifier racks and the associated cabling complexity from the AV system design. Typical applications include corporate AV, education, hospitality, public spaces and music venues.
specs: |-
  - Two-way active Smart IP pendant loudspeaker
  - Short-term maximum SPL: ≥104 dB (100 Hz - 3 kHz at 1 m, half space)
  - Frequency response: 70 Hz - 20 kHz (±2.5 dB)
  - Low cutoff (-6 dB): 62 Hz
  - High cutoff (-6 dB): 39 kHz
  - Woofer: 130 mm (5 1/8 in) cone driver
  - Tweeter: 19 mm (3/4 in) metal dome
  - Bass amplifier: 50 W Class D
  - Treble amplifier: 50 W Class D
  - Dispersion: 120° horizontal × 100° vertical
  - Mains voltage: PoE+ / PoE (Power-over-Ethernet)
  - Power consumption (ISS active): ≤4 W
  - Power consumption (idle): ≤5 W
  - Analog input: 1× Euroblock balanced, 10 kOhm
  - Network input: 1× RJ45 AES67 / Dante (audio + PoE/PoE+)
  - Loudspeaker synchronisation to sub-microsecond level
  - Smart IP Manager software and Smart IP Controller mobile app support
  - Public API command set for third-party control system integration
  - Dimensions (H × W × D): 237 × 294 × 0 mm
  - Weight: 5.3 kg (11.7 lb)
  - Enclosure: steel pendant with magnetically attached grille and cable entry covers
  - Includes 5 m adjustable hanging wire
  - Designed and manufactured in Finland
