description: 3xMIA is a 6-channel attenuverting mixer, offset, scale and
  polarizer built from 3 blocks of 2-channel attenuverting mixers using dual
  concentric pots.
details: |-
  3xMIA is a 6-channel attenuverting mixer / offset / scale / polarizer.

  It is built from 3 blocks of 2-channel attenuverting mixers, using dual concentric pots. Each channel can be switched to mix with the subsequent channel, allowing for 2-2-2, 4-2 and 6 mix configurations.

  With nothing plugged into an input, an offset is normalled to that channel. The inner knobs control the A inputs, while the outer knobs control the B inputs.

  DC coupled, so it can be used for audio, CV, or both at the same time.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - 6 attenuverting channels in 3 blocks of 2
  - Dual concentric pots: inner knobs control A inputs, outer knobs control B inputs
  - Switchable mixing with the subsequent channel for 2-2-2, 4-2 and 6 configurations
  - Normalled offset on any channel with no input plugged in
  - DC coupled for audio, CV, or both at once
  - 80 mA +12V
  - 80 mA -12V
  - 35 mm depth
  - 6 HP wide (24 HP for the 1U version)
  - Reverse power protected
