description: A shimmer reverb built on the Eterna foundation with a modified
  algorithm, adding a 60-second-plus decay tail, shimmer-swell and extra early
  reflections. Production discontinued.
details: |-
  The Eterna Gold is a shimmer reverb that Mr. Black calls the second coming of Shimmer Reverb, built on the foundation of the original Eterna but running a modified reverb algorithm rather than the same circuit.

  The modifications expand the pedal well beyond the original: the decay tail stretches past a full 60 seconds, a shimmer-swell mode is coupled with the standard shimmer voicing, and additional early reflections deepen the reverb's sense of space. The overall reverb voicing is augmented for a richer, more dramatic wash.

  Those algorithmic changes make this a functionally distinct product from the base Eterna, not merely a finish variant, so it is catalogued as its own effect.

  The pedal is no longer produced. The listing carries a "PRODUCTION DISCONTINUED 06.25.2026" banner and is marked sold out, so it is included for catalog completeness.
specs: |-
  - Shimmer reverb with modified algorithm (built on the Eterna)
  - Expanded decay: over a 60-second tail
  - Shimmer-swell coupled with standard shimmer
  - Multiple early reflections
  - Augmented reverb voicing
  - PRODUCTION DISCONTINUED (06.25.2026)
