description: Limited 50th Anniversary Edition stereo bus compressor — only 50
  units built. Features THRUST® filter with 3 sidechain settings, 3 selectable
  knee settings, NEW/OLD type switch, variable L/R link, auto/manual makeup
  gain, 2510/2520 discrete op-amps with transformer output, and relay bypass.
details: |-
  Limited run of 50 units. 2U rack-mount stereo bus compressor. Features
  premium stereo VU meters (selectable input/output), 10-segment stereo gain
  reduction LED metering, full hard-wired relay bypass, and commemorative serial
  number plate. Mix/Blend output circuit and patented THRUST® filter with peak
  and RMS control voltage filters.
specs: |-
  - Max output: +32 dBu
  - Frequency response: ±0.5 dB, 20 Hz–50 kHz
  - Signal-to-noise ratio: 120 dB
  - Power: 33.6 W
  - Dimensions: 19" W × 3.5" H × 10.5" D
  - Weight: 11.4 lb
