description: A harmonic entry into the expansive world of Duesenberg. Julietta
  is packed with all the features you would expect from a Duesenberg, yet it is
  the most affordable instrument in the line up so far.
details: |-
  Julietta is Duesenberg's entry-level electric guitar, reduced to the basics with an uncompromising solid alder body and a bolt-on neck. Duesenberg says the alder body paired with the maple neck delivers quick attack, sparkling trebles and long sustain. The body measures 43 x 32 cm / 16.9" x 12.6" and 4.0 cm / 1.6" deep, finished in PUR lacquer with a three-ply white or three-ply black pickguard.

  The neck is a single piece of maple bolted to the body, with an Indian rosewood fingerboard at a 305 mm / 12 inch radius, cream dot inlays, 22 jumbo frets, a Medium D profile and a steel dual-action truss rod. Every Julietta is Plek processed, which Duesenberg uses to guarantee level frets and buzz-free playability before the instrument is finished by hand and set up by one of its luthiers, each of whom signs the inside of the instrument.

  The electronics use what Duesenberg calls its award-winning pickup combination: a Domino P90 at the neck and a GrandVintage Humbucker at the bridge, both in trapeze housings. Wiring is one volume, one tone and a five-way pickup selector.

  Hardware is nickel finished throughout, with Duesenberg Z-Tuners, a Duesenberg Steel Saddle Bridge, a Duesenberg Aluminum Stop Tailpiece on non-tremolo models and the Diamond Deluxe Tremola vibrato on tremolo models. Strap pins are Duesenberg Standard and Straplock compatible, and the guitar is strung with Duesenberg Custom 10/50 sets.

  Five finishes are offered, including the Catalina Black introduced with this model. Each instrument ships with the Duesenberg Custom Line Bag, a lightweight gig bag with high impact internal padding, black plush lining, external storage pockets, a padded handle, backpack straps that tuck away so it can be carried like a case, and an adjustable neck pillow. All required allen keys are included.
specs: |-
  - Neck type: Bolt-on Neck, 1-piece Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: Cream dots
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5" (Baritone: 710 mm / 28")
  - Trussrod: Steel dual-action
  - Headstock: Black
  - Body type: Solid Body, Alder
  - Body dimensions: 43 x 32 cm / 16.9" x 12.6"
  - Height: 4.0 cm / 1.6"
  - Pickguard: 3-ply white or 3-ply black
  - Finish: PUR lacquer
  - Tuners: Duesenberg Z-Tuners
  - Bridge: Duesenberg Steel Saddle Bridge
  - Tailpiece: Duesenberg Aluminum Stop Tailpiece (non-trem models only)
  - Vibrato System: Duesenberg Diamond Deluxe Tremola (trem models only)
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware finish: Nickel
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Strings Baritone: Duesenberg Custom 14/70 (014-018-026-044-056-070)
  - Pickup (neck): Duesenberg Domino P90 (Trapeze Housing)
  - Pickup (bridge): Duesenberg GrandVintage Humbucker (Trapeze Housing)
  - Wiring: 1 Volume, 1 Tone, 5-Way Pickup Selector
  - Bag: Duesenberg Custom Line Bag (included)
  - Tools: All required allen keys (included)
