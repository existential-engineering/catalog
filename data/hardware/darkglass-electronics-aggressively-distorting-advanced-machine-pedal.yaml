name: Aggressively Distorting Advanced Machine
manufacturer: darkglass-electronics
primaryCategory: pedal
categories:
  - distortion
  - compressor
url: https://www.darkglass.com/products/aggressively-distorting-advanced-machine-pedal
description: The Darkglass ADAM (Aggressively Distorting Advanced Machine) is a
  powerful distortion and compression pedal for bass, combining parallel
  distortion and multi-band compression, a 6-band EQ, and cabinet simulation
  into a versatile tone-shaping platform.
details: |-
  The Darkglass ADAM (Aggressively Distorting Advanced Machine) is a sophisticated bass tone-shaping pedal that integrates parallel distortion with multi-band compression, offering comprehensive control over the sound signature.

  The ADAM combines five distinct distortion modes with five compressor ratios (4:1, 8:1, 12:1, 20:1, and ALL IN), alongside a 6-band graphic EQ with touch-sensitive sliders spanning -12 dB to +12 dB. Onboard cabinet simulation includes five impulse response slots, with default IRs captured by Nolly. Firmware updates have added a Chorus Machine effect, a DG6BEQ tone-shaping EQ, and per-preset noise suppression.

  The pedal offers extensive studio and stage connectivity, including a USB-C port for audio interface functionality and integration with the Darkglass Suite software. An aux input and headphone output support quiet practice, and a MIDI input allows external parameter control.
specs: |-
  - 5 distortion modes
  - 5 compressor modes (4:1, 8:1, 12:1, 20:1, ALL IN)
  - 6-band graphic EQ with touch-sensitive sliders (-12 dB to +12 dB)
  - 5 cab sim impulse responses (default IRs by Nolly)
  - MIDI input to externally control parameters
  - Aux input and headphone output
  - USB-C audio interface capability
  - Headphone output impedance 16-600 ohms
