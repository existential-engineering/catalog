description: >-
  The Korg Polyphonic Ensemble S is a preset-based analog string and orchestral
  synthesizer released in 1976, designed to generate sustained sounds like
  strings, choir, organ, and brass. Featuring full 48-note polyphony with three
  oscillators per note, it was sold under two names: the PE-2000 (Polyphonic
  Ensemble Orchestra) by Korg, and the K-5 (Poly-Ensemble S) by Unicord. Notable
  users include Jean-Michel Jarre, Tangerine Dream, and Hawkwind.
details: |-
  Korg introduced the Polyphonic Ensemble S in 1976 as part of a complementary pair with the Polyphonic Ensemble P. While the P model focused on percussive sounds, the S model was specifically designed for sustained tones including strings, choir, organ, and brass. The company manufactured units under two different names: Korg distributed them as the Polyphonic Ensemble Orchestra (PE-2000), while Unicord distributed identical versions labeled Poly-Ensemble S (K-5 model number). Despite the naming differences, there are no technical distinctions between the variants.

  The instrument offers eight preset sounds organized in four categories with two variations each: String 1 and 2, Pipe Organ 1 and 2, Brass 1 and 2, and Chorus 1 and 2. Users can layer a maximum of two preset sounds simultaneously. Sound sculpting capabilities are intentionally limited, with controls for envelope Attack and Sustain, oscillator detuning, and EQ for Treble and Bass frequencies. A built-in phase shifter effect adds a classic seventies shimmer to the sound.

  The Polyphonic Ensemble S features sturdy metal and wood construction housed within a flight case designed for professional touring. Output options include stereo connections, a dedicated headphone output with independent volume control, and an expression pedal input for real-time sound manipulation.
specs: |-
  - Full 48-note polyphony
  - 3 VCOs per note
  - 8 presets: String 1/2, Pipe Organ 1/2, Brass 1/2, Chorus 1/2
  - Up to 2 presets layered simultaneously
  - Envelope controls: Attack, Sustain
  - EQ: Bass (low pass), Treble (high pass)
  - Built-in phase shifter effect
  - 48-key keyboard
  - Stereo outputs
  - Headphone output with independent volume
  - Expression pedal input
  - Metal and wood construction with flight case
  - Produced 1976-1979
