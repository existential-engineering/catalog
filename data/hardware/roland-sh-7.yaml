description: >-
  The Roland SH-7 is a duophonic analog synthesizer from 1978 featuring dual syncable
  VCOs, a mixer with distortion capabilities, and extensive modulation options. It builds
  on Roland's SH synthesizer line with enhanced creative control including a ring
  modulator, sample-and-hold circuit, and external audio input. The SH-7 is known for its
  aggressive, tweakable sound suitable for experimental and electronic music.
details: |-
  The SH-7 represents an evolution of Roland's SH synthesizer line, building on the foundation of earlier models while introducing significant new capabilities. The instrument distinguishes itself through its dual syncable voltage-controlled oscillators, a departure from traditional SH designs that prioritized simplicity. This synchronization feature enables complex harmonic relationships and dramatic pitch-sweep effects.

  The mixer section is particularly noteworthy, allowing users to blend audio signals from multiple sources and apply distortion for creating harsh, aggressive timbres. The inclusion of an external audio input expands the SH-7's sound-design potential beyond its internal oscillators, enabling processing of external sources through the filter and effects sections.

  Additional sound-shaping tools include a ring modulator for bell-like and inharmonic tones, dual noise generators providing both white and pink noise, and a sample-and-hold circuit for unpredictable, evolving textures. The dual ADSR envelope generators provide independent amplitude and filter modulation capabilities, giving the player fine-grained control over tonal dynamics.
specs: |-
  - Polyphony: Duophonic
  - Oscillators: 2 VCOs with square, triangle, ramp, and PWM waveforms (syncable)
  - LFO: 1 with sawtooth, square, and sine waveforms; speed and delay control
  - Filter: 12dB/octave highpass and lowpass with resonance
  - Filter Modulation Sources: LFO, sample-and-hold, VCO2, envelope follower
  - Envelope Generators: 2 ADSR
  - Features: Ring modulator, white/pink noise generators, external audio input, sample-and-hold
  - Keyboard: 44 keys
  - Control: CV/Gate
  - Production Years: 1978-1981
releaseDate: "1978"
