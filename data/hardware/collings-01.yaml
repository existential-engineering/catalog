description: The 01 is a single-0 14-fret acoustic guitar that functions equally
  well as a travel instrument or a small OM-style stage guitar. It delivers a
  uniquely round, punchy tone with the coveted small body character, along with
  impressive volume and headroom. Built with a Sitka spruce top and Honduran
  mahogany back and sides, it features a pre-war scalloped X-brace pattern and a
  high-gloss nitrocellulose lacquer finish.
details: |-
  The 01 is a single-0 14-fret acoustic guitar, designed to serve as both a travel companion and a full-voiced stage instrument. Its small body produces a uniquely round, punchy tone with impressive volume and headroom, though with reduced low-end compared to larger-bodied models. The guitar is built with a Sitka spruce top and Honduran mahogany back, sides, and neck, topped with an ebony fingerboard featuring mother-of-pearl short dot inlays and an ebony belly-style bridge. A pre-war scalloped X-brace pattern shapes the acoustic response, while medium 18% nickel-silver frets, nickel Waverly tuners, and a modified V neck profile complete the playing feel.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony with MOP short dots
  - Bridge: Ebony belly-style
  - Nut/Saddle: Bone
  - Brace Pattern: Pre-war scalloped X-brace
  - Scale Length: 24 7/8"
  - Body Width: 13 7/16"
  - Body Length: 18 3/16"
  - Body Depth: 4"
  - Total Length: 38"
  - String Spacing: 2 3/16"
  - Frets: Medium 18% nickel-silver
  - Neck Profile: Modified V
  - Tuners: Nickel Waverly
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: Polyester resin
  - Strings: D'Addario EJ-16 (.012"-.053")
