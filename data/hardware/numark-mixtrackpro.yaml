description: Mixtrack Pro 2-Channel DJ Controller With Audio I/O.
details: |-
  Mixtrack Pro is a complete DJ system that works with the music on your Mac or PC. Mixtrack Pro's classic two-turntables-and-a-mixer setup connects to your computer so you can scratch, mix, loop, and much more. Mixtrack Pro has all the inputs and outputs you'll need for your headphones, speakers, and a mic. Plus, Mixtrack Pro is portable, so you'll always be ready to DJ anywhere.

  Mixtrack Pro has two decks, each with a large, touch-sensitive turntable for accurate scratching, beat-juggling and locating precise points within your tracks. It's just like working with a record. In addition to the two decks, Mixtrack Pro has an easy to use audio mixer so veteran DJs and beginners alike will be able to step right up and get the party going. If you're DJing for the first time, Mixtrack Pro is a great place to learn because your skills will transfer to any other DJ system.

  Mixtrack Pro comes with Serato DJ Intro, powerful software which makes it easy to mix your favorite music. Mixtrack Pro lets you create professional sounding mixes at home or at live performances at parties, functions and clubs. Mixtrack Pro is also a MIDI-over-USB controller, so it's compatible with virtually all DJ software.

  Mixtrack Pro, while a powerful controller for software, also houses a complete audio interface, which enables you to input and output high-quality sound. Whether you're connecting Mixtrack Pro to the computer, to the sound system, for recording, previewing in headphones, or talking over the music with a mic, Mixtrack Pro gives you all the inputs and outputs you'll need.
specs: |-
  - Large, touch-sensitive control wheels for scratching and song cueing
  - Built-in audio connections for both cue preview and performance output
  - Serato DJ Intro software included
  - Complete mixer section with crossfader, EQ, loop and effects controls
  - Mouseless navigation controls on the deck
  - Lighted deck-controls indicate software status
  - Integrates with your iTunes library to play and mix songs
  - Compatible with virtually any MIDI DJ software
  - USB powered when connected to a computer
  - Also works with Traktor Pro, VirtualDJ Pro, UltraMixer, djay, PCDJ, FutureDecks Pro, Torq and MixVibes (each sold separately)
  - Class Compliant: compatible with every current and future version of Mac OS X and iOS and with Windows (98SE and up) operating systems
  - Dimensions (WxDxH): 18.75" x 11.5" x 2.5"
  - Weight: 1.45 lbs
