details: |-
  Pico VCF3 is a 24dB/oct lowpass filter in a 3HP panel. Despite the small size it has a classical, full sound that makes a Pico System read like a much larger setup.

  The filter tracks 1V/octave, so its cutoff can be played from a keyboard or sequencer, and it self oscillates at high resonance settings for use as a sine source.

  The Pico Series set Erica Synths the challenge of fitting superior functionality into a 3HP panel at an affordable price. The VCF3 is 3HP wide and 35mm deep, draws +20mA and -20mA from the eurorack bus, and its input is protected against overvoltage.
specs: |-
  - 24 dB/oct lowpass VCF
  - 1V/octave tuning
  - Self oscillation
  - Input protection against overvoltage
  - Power consumption +20mA, -20mA
  - Module width 3HP
  - Module depth 35mm
