description: "Paraphonic dual filter analog synthesizer with 3 discrete
  wave-morphing oscillators, dual-filter design, 12 studio-quality effects,
  advanced 64-step sequencer, and 25-note keyboard in a compact portable
  format."
details: |-
  The UNO Synth Pro X is a compact paraphonic analog synthesizer featuring 3 discrete wave-morphing oscillators with PWM, sync, FM, and ring modulation capabilities. Its dual-filter design pairs an OTA-based multimode filter (LP/HP) with an SSI-chip-based 2/4 Pole LP filter for extensive tonal shaping.

  The sound engine includes 3 ADSR envelopes with loop and retrigger options, 2 LFOs, and a 16-slot modulation matrix. 12 studio-quality effects are available across 3 simultaneous slots plus analog overdrive, covering chorus, uni-vibe, 5 delay types, and hall/plate/shimmer reverb. Play modes include Bassline, Legato, Mono, and Paraphonic.

  The advanced 64-step sequencer supports per-step parameter recording for up to 48 parameters with a scale-aware randomizer, complemented by a 10-mode arpeggiator with pattern designer. A 25-note keyboard with octave shift, 256 user-editable presets, over 30 hands-on controls, and CV/Gate I/O round out the feature set. The included Editor/Librarian runs standalone and as a DAW plugin on Mac/PC.
specs: |-
  - 3 discrete wave-morphing oscillators (PWM, sync, FM, ring mod)
  - Dual-filter design: OTA multimode + SSI 2/4-pole LP
  - 3 ADSR envelopes with loop and retrigger
  - 2 LFOs, 16-slot modulation matrix
  - 12 studio-quality effects in 3 slots + analog overdrive
  - 64-step paraphonic sequencer (up to 48 parameters per step)
  - 10-mode arpeggiator with pattern designer
  - 256 user-editable presets
  - Over 30 hands-on controls
  - Dimensions: 33.3 x 15 x 5 cm (13.11" x 5.91" x 1.96")
  - Weight: 800 g (1.76 lb)
  - Enclosure: plastic
  - Power: iRig PSU-3A (included) or USB (5V/1.5A, 7.5W minimum)
