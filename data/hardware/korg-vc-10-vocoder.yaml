description: >-
  Korg's compact polyphonic 20-band analog vocoder with a built-in 32-key
  keyboard, allowing voice-controlled synthesis and creative processing of
  external audio sources.
details: |-
  The VC-10 is a charming little vocoder that uses 20 filter bands to analyze an incoming voice signal and impose its spectral characteristics onto an internal carrier oscillator. The result is the classic robotic vocal effect that became a staple of late 1970s electronic and progressive rock music.

  Beyond standard voice processing, the VC-10 accepts any audio source through its input, opening up creative possibilities for processing drums, guitars, and other instruments through its filter bank. A built-in ensemble effect adds width and richness to the output, while vibrato with adjustable rate provides additional modulation. The 32-key keyboard controls the carrier pitch, and an external CV input allows pitch control from other synthesizers.

  The VC-10 found its way into the rigs of some of the era's most influential artists, including Keith Emerson, Tangerine Dream, Pink Floyd, Yes, and more recently Goldfrapp. Its compact size and integrated keyboard made it considerably more accessible than larger modular vocoder systems of the period.
specs: |-
  - Polyphony: Polyphonic (all keys sound)
  - Oscillators: 1 carrier signal + 1 speech input
  - Filter: 20-band vocoder
  - LFO: Vibrato with rate control
  - VCA: Mix level (dry to processed)
  - Effects: Ensemble
  - Keyboard: 32 keys
  - Control: External pitch CV input
