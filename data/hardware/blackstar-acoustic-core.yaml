description: Accessible acoustic amps packed with cutting edge features for the
  modern singer-songwriter.
details: |-
  ACOUSTIC:CORE was designed to give singer/songwriters the ability to get a professional sound without any sound engineering expertise, then share it via live streaming or recording, or live performance. All in a compact, easily portable combo with the option of battery power.

  Designed by the same team that developed the award winning Sonnet acoustic amplifier series, ACOUSTIC:CORE delivers natural sounding acoustic tones with the power and flexibility of Blackstar's world-beating CORE digital platform.

  Proprietary Super Wide Stereo technology with Enhance and Vocal Clarity controls provide a rich, deep and spatial acoustic and vocal sound, delivering an inspirational, immersive sonic experience when practicing or playing live.

  4-channel USB audio makes low-latency professional recording simple: USB Channel 1+2 carry the main stereo output, USB Channel 3 carries a Pre-EQ D.I. for Channel 1, and USB Channel 4 carries a Pre-EQ D.I. for Channel 2. Studio-quality Super Wide Stereo reverb is provided for each channel, plus two specially voiced chorus effects for the instrument channels.

  The series is offered as the ACOUSTIC:CORE 30 — a 30W (2x15W Super Wide Stereo) combo with instrument and mic/line channels, XLR D.I. mix out, phase feedback suppression, TRRS livestreaming, USB audio, tilt-back stand and PA stand mounting.
specs: |-
  - Power: 30W (2x15W Super Wide Stereo)
  - Instrument and Mic/Line channels
  - EQ Instrument Channel: Low, High
  - EQ Mic/Line Channel: Low, Mid, High
  - Instrument Enhance
  - Mic/Line Vocal Clarity
  - Effects Instrument Channel: 2 chorus (Vintage and Wide), 2 reverb (Room and Hall) in Super Wide Stereo
  - Effects Mic/Line Channel: 2 reverb (Room and Hall) in Super Wide Stereo
  - Super Wide Stereo
  - XLR D.I. Output
  - Phase Feedback Suppression
  - Speaker Emulated output
  - Line Out/Headphones
  - Line In
  - TRRS Streaming
  - USB Audio
  - Tilt-back Stand
  - PA Stand Mountable
  - Speakers: 2x5"
