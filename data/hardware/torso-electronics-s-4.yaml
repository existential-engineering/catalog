id: XpUapjKCBM4NljLNQMljm
name: S-4
manufacturer: torso-electronics
primaryCategory: sampler
url: https://torsoelectronics.com/pages/s-4
description: A sculpting sampler designed to capture and transform sounds,
  merging tape-era workflows with cutting-edge technology for crafting unique
  soundscapes through samples and real-time audio processing.
specs: |-
  - 4 parallel stereo tracks, 5-stage signal chain per track
  - 8-voice polyphonic sampler engine with granular processing
  - 48-band resonant filter bank
  - Dual-band distortion
  - Delay/reverb with freeze
  - 128 scenes, 4 modulators per track, 12 macros
  - Built-in microphone for recording
  - 24-bit / 48kHz stereo
  - 4 GB internal memory (expandable via USB)
  - 3.5" high-resolution LCD display
  - 21 tactile RGB buttons, 9 encoders
  - Matte black aluminum housing
  - 242 x 156 x 39 mm, 820g
