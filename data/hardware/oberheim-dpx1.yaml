description: >-
  The Oberheim DPX1 is a 2-unit rackmount sample player released in 1987 that
  loads and plays back samples from 3.5-inch and 5-inch diskettes, compatible
  with E-mu Emulator II, Sequential Prophet 2000/2002, Ensoniq Mirage, and Akai
  S900 formats.
details: |-
  In 1987 Oberheim released the DPX1, a 2-unit rackmount sample player during the era of the classic samplers. Its function is to load 3.5-inch and 5-inch diskettes containing samples into its 1 MB of RAM, from which you can play the samples using any MIDI keyboard, controller, or sequencer.

  The DPX1 was compatible with the E-mu Emulator II, Sequential Prophet 2000, 2002, 2002+, Ensoniq Mirage DSK8/DMS8, and the Akai S900 formats. Samples cannot be edited; the DPX1 is simply a load-and-play machine. Its universality among these early samplers makes it great for anyone who may still have old disks of samples but not the samplers that created them.

  The DPX1 has a very faithful architecture that recalls the nuances of samples including any processing, looping, filtering, and modulations, resulting in very accurate reproductions. Ensoniq and E-mu samples come through sounding just like they are being played from the original synths, if not better. However, Sequential sounds are not quite as accurate when played from the DPX1.

  Sounds can also be re-stored in an Oberheim DPX format on 3.5-inch disks. A 20 MB hard disk model was also made available around 1988. Full MIDI and 4-part multitimbrality equip the DPX1 for easy use in any studio.
specs: |-
  - Polyphony: 8 voices
  - Sampler: 12-bit, variable sample rates
  - Memory: 1 MB RAM
  - Internal Storage: 100 patches
  - External Storage: 3.5-inch and 5-inch disk drive
  - Keyboard: None
  - Effects: None
  - Control: MIDI (4-part multitimbral)
