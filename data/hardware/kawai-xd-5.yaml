description: >-
  The Kawai XD-5 is a digital drum synthesizer module featuring 256 waveforms that can be
  combined in groups of up to four to create custom drum and percussion sounds. It
  includes a resonant lowpass filter, amplitude envelopes, delay and ring modulation
  effects, and six individual outputs alongside stereo mains, making it a versatile
  rack-mount unit for electronic percussion design.
details: |-
  Released in 1989, the Kawai XD-5 represents Kawai's approach to affordable digital drum sound synthesis. Rather than relying solely on samples, the XD-5 allows users to combine up to four of its 256 built-in waveforms per voice, enabling the creation of unique percussion and drum tones from the ground up.

  The sound engine features a digital resonant lowpass filter (DCF) and digital amplitude control (DCA) with envelope shaping, giving users detailed control over the tonal character and dynamics of each sound. The inclusion of delay-type effects and ring modulation processing expands its sonic palette well beyond traditional drum machines, making it suitable for genres requiring heavily processed or experimental drum sounds.

  With 16-voice polyphony, the XD-5 supports complex layered drum arrangements. It stores 64 patches and 16 drum kits in internal memory, with additional storage available via external memory cards. Professional studio integration is facilitated by six individual outputs in addition to stereo mains, enabling detailed mixing and processing of individual drum elements.
specs: |-
  - 16-voice polyphony
  - 256 waveforms, 1-4 combinable per voice
  - Digital resonant lowpass filter (DCF)
  - Digital amplitude envelope (DCA)
  - Delay and ring modulation effects
  - Stereo main outputs plus 6 individual outputs
  - 64 patches and 16 drum kits
  - External memory card support
  - MIDI (1 channel)
  - Rack-mount form factor, no keyboard
