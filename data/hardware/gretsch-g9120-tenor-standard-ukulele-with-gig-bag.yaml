details: |-
  Featured worldwide in popular music of all styles, the ukulele has experienced a phenomenal resurgence in recent years. At the request of Gretsch fans, we reintroduced a selection of our classic uke best sellers offering unparalleled tone and quality at sensational low prices.

  The G9120 Tenor Standard Ukulele features a 17" scale length, mahogany top, back and sides, mahogany neck and ovangkol fingerboard with 19 frets (14 to body). This uke also comes with an ovangkol bridge, bone nut and saddle, Grover 9NB Sta-Tite geared tuners, Aquila Nylgut strings and fitted gig bag. The G9210 is available in Vintage Mahogany Stain with an 'open pore' semi-gloss finish.
