details: |-
  The OM-28 Modern Deluxe merges vintage Martin character with modern sophistication. A spruce VINTAGE TONE SYSTEM (VTS) top and Golden Era-style Adirondack spruce X-bracing replicate the articulate, lively tone of a nearly century-old Martin, while modern construction details deliver exceptional clarity, dynamic headroom, and balance for expressive players seeking heritage tone with modern precision.

  The 000-14 fret Auditorium body shape pairs East Indian rosewood back and sides with the torrefied spruce top, producing a rich, complex voice that favors fingerstyle players and singer-songwriters. The 25.4-inch scale length and 1 3/4-inch nut width give the OM platform its characteristic comfort and clarity.

  Modern Deluxe touches include a carbon-fiber bridge plate, natural protein glue construction, Liquidmetal bridge pins with red acrylic dots, EVO gold frets, an asymmetrical Vintage Deluxe neck profile, European flamed maple binding, and a 1933-style pearl headplate logo. Waverly gold open-gear tuners and a modern belly-style ebony bridge complete the package.

  The guitar ships in a ply hardshell case and carries Martin's Limited Lifetime Warranty.
specs: |-
  - Body Size: 000-14 Fret (Auditorium)
  - Top: Spruce with VTS (Vintage Tone System)
  - Back and Sides: East Indian Rosewood
  - Bracing: X-Brace, Golden Era-style Adirondack Spruce
  - Neck Wood: Genuine Mahogany
  - Neck Shape: Vintage Deluxe (asymmetrical)
  - Fingerboard: Ebony
  - Scale Length: 25.4"
  - Nut Width: 1 3/4"
  - Frets: EVO gold
  - Bridge: Ebony, Modern Belly style
  - Bridge Pins: Liquidmetal with Red Acrylic dots
  - Bridge Plate: Carbon fiber
  - Tuning Machines: Gold Open Gear (Waverly)
  - Binding: European flamed maple
  - Headplate: 1933-style pearl logo
  - Finish: Gloss top, Satin neck
  - Case: Ply Hardshell
  - Electronics: None standard (optional LR Baggs Anthem, Fishman Gold Plus Natural, or Fishman Infinity Matrix)
