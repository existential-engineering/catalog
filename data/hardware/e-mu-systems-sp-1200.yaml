description: >-
  E-mu's legendary 12-bit sampling drum machine, whose gritty lo-fi character
  and groove quantize made it the defining production tool for golden-age
  hip-hop and rap music.
details: |-
  The E-mu SP-1200 holds an almost mythical status in hip-hop production. Released in 1987, its combination of 12-bit sampling at 26.04kHz and a maximum of 10 seconds of sample time across four memory banks imposed strict creative constraints that paradoxically fueled some of the most innovative beats of the late 1980s and 1990s.

  The lo-fi sampling quality, often described as dirty and crunchy, became a defining sonic signature. What might be considered a technical limitation turned into an aesthetic virtue, with producers embracing the grit as an essential part of the SP-1200 sound. Eight touch pads provide a tactile interface for triggering and programming, while 100 patterns and 100 songs offer substantial arrangement capacity.

  Groove quantize functionality allows beats to be nudged off the rigid grid, introducing the human feel and swing that became central to the golden-age hip-hop sound. MIDI and SMPTE support integrate it into larger studio setups, and 32 user sample slots provide room for custom sound libraries loaded from the built-in disk drive.

  Production continued intermittently from 1987 through 1998, with multiple reissues including a sought-after black-case version in 1997. Artists from Daft Punk to Phil Collins, Roni Size to The Prodigy have all relied on the SP-1200, cementing its place as one of the most important production instruments ever made.
specs: |-
  - Polyphony: 8 voices
  - Sampler: 26.04kHz, 12-bit; 256KB memory; 10 seconds total (4 x 2.5-second banks)
  - User samples: Up to 32
  - Patterns: 100
  - Songs: 100
  - Interface: 8 touch pads
  - Memory: 32 patches
  - Storage: Built-in disk drive
  - Control: MIDI, SMPTE
