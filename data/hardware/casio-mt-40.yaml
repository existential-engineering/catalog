description: >-
  The Casio MT-40 is an unassuming budget keyboard from the early 1980s that became a foundational instrument in reggae and dancehall music history. Its built-in "rock" rhythm pattern provided the basis for Wayne Smith and King Jammy's 1984 track "Under Mi Sleng Teng," one of the most influential riddims ever recorded.
details: |-
  At first glance, the Casio Casiotone MT-40 appears to be nothing more than a basic consumer keyboard from the early 1980s. With its compact form factor, built-in speaker, and modest feature set, it was marketed as an affordable entry-level instrument. However, its cultural impact far outweighed its humble specifications.

  The MT-40 features 22 instrument sounds, six onboard rhythms, and a dedicated 15-key mini bass keyboard positioned to the left of the main 37-key playing surface. Its lo-fi drum sounds and simple preset patterns gave it a distinctive character that caught the ear of Jamaican producer King Jammy. In 1984, the "rock" rhythm preset became the foundation of Wayne Smith's "Under Mi Sleng Teng," a track that revolutionized dancehall music and inspired countless subsequent productions using variations of the pattern.

  The instrument offers basic vibrato and sustain effects, nine-voice polyphony across the main keyboard, and a separate monophonic bass voice. While it was quickly succeeded by the MT-41 (featuring a dark grey enclosure), the MT-40's place in music history is secure as the unlikely source of one of the most sampled and imitated rhythm patterns in Caribbean music.
specs: |-
  - Keyboard: 37 keys (main) plus 15 mini bass keys
  - Polyphony: 9 voices (8 main keys, 1 bass)
  - Sounds: 22 instrument presets
  - Rhythms: 6 onboard patterns
  - Effects: Vibrato, sustain
  - Speaker: Built-in
  - Output: Audio out, headphone jack
