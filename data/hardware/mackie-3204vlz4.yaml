description: "The largest in the VLZ4 lineup, the 3204VLZ4 is equipped to make
  live sound in your venue, club, house of worship, and beyond sound better than
  ever. With 32 channels of classic analog Mackie sound signature, Onyx preamps,
  and plenty of routing options, this is the perfect step up to professional
  analog sound for your production."
details: |-
  VLZ4 ups the level of sonic quality at every level, featuring Mackie's flagship Onyx mic preamps and premium components from front to back. The result is the most rock solid, the most easy to use and, yes, the best sounding compact mixer ever created.

  The largest in the VLZ4 lineup, the 3204VLZ4 is equipped to make live sound in your venue, club, house of worship, and beyond sound better than ever. With 32 channels of classic analog Mackie sound signature, Onyx preamps, and plenty of routing options, this is the perfect step up to professional analog sound for your production.

  Mackie Analog Perfection, and Lots of It.
specs: |-
  - 28 boutique-quality Onyx mic preamps
  - Ultra-wide 60dB gain range
  - 128.5 dB dynamic range
  - +22 dBu line input handling
  - Extended frequency response
  - Distortion under 0.0007% (20Hz – 50kHz)
  - Improved RF rejection for broadcast applications
  - Phantom power for condenser mics
  - Dedicated inline channel compression (ch. 25-28)
  - 28 high-headroom line inputs with dedicated inserts
  - Level, pan, solo and overload/mute LEDs per channel
  - 3-band EQ with sweepable midrange
  - 18 dB/oct 100Hz low-cut filter on mic inputs
  - 4 subgroups with dedicated inline compressors
  - 6 aux sends with inserts, pre/post fader options
  - 2 stereo returns and 4 group outs with inserts
  - Dual 32-bit RMFX+ processors with 24 reverbs, choruses, tap delay
  - Integrated 4x2 24-bit USB interface
  - Stream subgroups or master L/R to PC/Mac
  - PFL/AFL solo modes
  - 60mm long-wearing log-taper faders
  - High-resolution 12-segment stereo meters
  - Sealed rotary controls
  - Built-Like-A-Tank rugged steel chassis with powder-coat finish
  - High-visibility, high-contrast controls
  - Universal power supply
