description: MESS combines a powerful multi-track step sequencer with effects
  brimming with Polyend character, from classic modulation, delay or reverb to
  experimental effects never before seen in pedal form.
details: |-
  MESS turns a simple guitar line into something bigger. Atmospheres, pulses, textures you didn't expect, the kind of sounds that keep you curious and make you want to play more. It is a multi-effect step sequencer that stacks up to four effects at once, each one moving differently so the sound keeps shifting.

  With 125 stereo effects to choose from, MESS spans classic modulation, delay and reverb through to experimental granular, glitch, pitch shift and spectralize processing, plus shapers, drives, filters, slicers and microloopers. Reverbs and delays can be shrunk to a closet or stretched to a cathedral, then made to move in time with the sequencer.

  Sequencing makes the effects come alive: instead of one static sound you get movement, rhythm and evolving textures. MESS can behave like a trusty pedalboard one moment and a box of sonic mischief the next, switching between the familiar and the unexpected with a single tap.

  MESS ships with 150 presets and room for a thousand of your own. One knob per function keeps things simple, and a 16-step grid lets you build sequences fast. It works as a rhythm engine for guitars, drum machines, synths, or whatever you plug in.
specs: |-
  - 4 effect tracks, stack up to four effects at once
  - 125 stereo effects
  - 150 factory presets, room for a thousand user presets
  - 16-step grid sequencer
  - One knob per function
  - Power: 9-18 V DC / min. 500 mA (power adapter not included)
  - Height: 2.24 inches (5.7 cm) with knobs
  - Width: 7.09 inches (18.0 cm)
  - Depth: 4.72 inches (12.0 cm)
  - Weight: 2.05 pounds (0.930 kg)
