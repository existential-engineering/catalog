description: >-
  The Red Sound Elevata is a 16-voice virtual analog polyphonic synthesizer
  sound module featuring DSP analog modeling technology. Its front panel swivels
  90 degrees to facilitate both rack-mount and desktop use, with hands-on knobs
  for the oscillator, filter, envelope, and LFO sections. It supports EPROM
  upgrades including a Vocoda expansion that adds vocoder capability.
details: |-
  The Elevata employs the same DSP analog modeling synthesizer technology found in the Red Sound DarkStar, repackaged into a versatile sound module format. Its distinguishing physical feature is a front panel that swivels 90 degrees, allowing the unit to be used as either a rack-mount module or a desktop synthesizer. The interface prioritizes hands-on control with dedicated knobs plainly laid out for the oscillator, filter, envelope, and LFO sections.

  Each of the 16 voices features two analog modeling oscillators offering square, sawtooth, sine, and formant waveforms, along with pink, white, and blue noise options. The filter is a 12 dB/octave resonant design switchable between low-pass, high-pass, and band-pass modes. Two syncable LFOs and ADSR envelopes for both the filter and VCA sections provide extensive modulation possibilities, while built-in chorus and flange effects round out the sound shaping tools.

  The Elevata is 8-part multi-timbral with full MIDI implementation across all parts. A joystick controller can be assigned to any modulatable parameter for expressive real-time performance. The Sound Wizard function randomizes various parameters to inspire new sound creation. Storage includes 127 preset patches, 127 user patches, and 90 multi-patches, each containing up to eight programs for layered arrangements.

  Expandability comes through EPROM upgrades, with room for up to three expansion chips. The Vocoda EPROM adds full vocoder functionality, processing external audio through the stereo inputs. Six audio outputs and comprehensive MIDI connectivity make the Elevata a flexible studio tool, positioned as an alternative to other virtual analogs of its era such as the Nord Lead and Novation SuperNova.
specs: |-
  - 16-voice polyphony
  - 8-part multi-timbral
  - Two oscillators per voice with square, sawtooth, sine, and formant waveforms
  - Pink, white, and blue noise generators
  - 12 dB/octave resonant filter with low-pass, high-pass, and band-pass modes
  - Two syncable LFOs with ramp, triangle, square, sine, pulse, sample & hold, and random waveforms
  - ADSR envelopes for filter and VCA
  - Built-in chorus and flange effects
  - Assignable joystick controller
  - Sound Wizard randomization function
  - 127 preset patches, 127 user patches, 90 multi-patches
  - MIDI IN/OUT/THRU (8-part)
  - 6 audio outputs, stereo audio inputs
  - Swiveling front panel for rack-mount or desktop use
  - Expandable with up to 3 EPROMs (Vocoda vocoder expansion available)
  - Sound module format (no keyboard)
