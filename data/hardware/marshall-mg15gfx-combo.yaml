description: The MG15GFX is a 15W solid-state guitar combo amplifier from
  Marshall's MG Gold range, designed for practice and small performances. It
  offers four channels — Clean, Crunch, OD1, and OD2 — for a wide range of tones
  from sparkling cleans to high-gain distortion, with a shared three-band EQ for
  tone shaping. The amplifier includes built-in digital effects (reverb, chorus,
  phaser, flanger, delay, and more) accessible from the front panel, plus an
  MP3/Line input for jamming along with backing tracks and a headphone output
  with emulated speaker simulation for silent practice and direct recording.
