description: The MG15GFX is a 15W solid-state guitar combo amplifier from
  Marshall's MG Gold range, designed for practice and small performances. It
  offers four channels — Clean, Crunch, OD1, and OD2 — for a wide range of tones
  from sparkling cleans to high-gain distortion, with a shared three-band EQ for
  tone shaping. The amplifier includes built-in digital effects (reverb, chorus,
  phaser, flanger, delay, and more) accessible from the front panel, plus an
  MP3/Line input for jamming along with backing tracks and a headphone output
  with emulated speaker simulation for silent practice and direct recording.
details: |-
  Packed with a variety of digital FX, the MG15FX delivers versatility and numerous tone options.

  Four channels: clean, crunch, and two overdrive channels, combine with a three-band EQ to bring you greater tonal control. Whether you're after a pristine clean sound, a gritty crunch, or the intensity of overdrive using the OD1 and OD2 channels, this amplifier covers a wide sonic spectrum. The added three-band EQ further enhances your tonal control, allowing you to sculpt and tailor your sound with precision.

  Direct recording and silent practice has never been easier thanks to the emulated speaker output. This feature not only facilitates seamless recording directly from the amplifier, but also enables silent practice sessions. The addition of the MP3/line input allows you to play along with your favourite songs.

  Crafted with the seamless integration of FX pedals in mind, the MG15FX amplifier is designed to be a canvas for your unique sonic vision. This intentional design allows you to experiment with and incorporate external FX pedals. The MG15FX also features built-in digital FX, further expanding your sonic palette.

  Grab the MG15FX and go. This conveniently sized amplifier proves to be adaptable for multiple playing environments. Its compact construction not only caters to home settings but also makes it easy to take with you to band practices. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Model: MG15FX, MG Gold range
  - Output wattage: 15W
  - Technology: solid state
  - Channels: 4 (store and recall) - clean, crunch, OD1, OD2
  - Effects: reverb, phaser, flanger, delay, chorus
  - Controls: gain, clean/crunch select, bass, OD1/OD2 select, middle, treble, reverb, volume, tuner, tap, store, FX select, master volume
  - Effects loop: no
  - Speaker configuration: 1x8"
  - Speaker model: custom speaker (8 ohm, 15W)
  - Unit impedance: 8 ohm
  - Inputs: 1 x 1/4" jack instrument input, 1 x 3.5 mm aux in
  - Outputs: 1 x 3.5 mm jack headphone out
  - Emulated speaker output for direct recording and silent practice
  - Weight: 7.7 kg / 17 lb
  - Width: 385 mm / 15.2"
  - Height: 380 mm / 15"
  - Depth: 210 mm / 8.3"
  - Colour: black and gold
  - Box contents: power cable included
  - Country of origin: designed and engineered in UK, made in Vietnam
