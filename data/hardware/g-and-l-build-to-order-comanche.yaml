details: |-
  The G&L Comanche is Leo's final word on the traditional double-cutaway bolt-on axe. Fact is, the first thing to notice about the Comanche is the distinctive shape of the Magnetic Field Design Z-Coil pickups designed by Leo Fender himself. These pickups deliver a bright and sparkly top end while offering a robust bottom end, all without any 60-cycle hum.

  There is plenty of power in the Z-Coil pickups, but what is surprising is how glassy and detailed they become as the volume and bass controls are rolled back, the latter a part of the Comanche's PTB (Passive Treble and Bass) system. What's more, the Comanche includes a mini-toggle expander switch to allow neck+bridge or all three pickups together. In a pinch, the neck+bridge combo does a convincing faux ASAT Special. Talk about versatile!

  Making the most of this delicious combo is Leo's Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm.

  The Comanche was the very last double-cutaway bolt-on guitar designed by Leo Fender, the culmination of everything he had learned during his amazing lifetime. Founded by Leo Fender in 1980, the Comanche and all G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.

  Due to the offset pickup design, the Comanche is available in Right-Hand only.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD Z-Coil hum-cancelling
  - Body wood: Swamp Ash and Alder
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato with forged brass saddles
  - Controls: 5-position pickup selector, volume, treble, bass (PTB system), mini-toggle expander switch enabling additional pickup combinations of neck+bridge or all three pickups together
  - Includes: G&L Deluxe Gig Bag
  - Handedness: right-hand only, due to the offset pickup design
