description: The Empress Distortion is an all-analog, true-bypass distortion
  pedal that goes from mild break-up to crunch to high-gain lead while keeping a
  tight low end and compressing naturally like a high-gain amp. Three selectable
  voicings plus gain, two bands of EQ, and output control let you dial in the
  sound.
details: |-
  From mild to crunch to lead, the Empress Distortion does it all. This true-bypass pedal offers three flavors of distortion while retaining a super-tight low end and naturally compressing like a high-gain amp.

  The mild setting offers gentle break-up that cleans up with your volume knob. The crunch setting is tight, with good bite, and is great for rhythm playing. The lead setting offers high gain with lots of sustain.

  A gain control, high-shelf and low-shelf EQ, and an output control let you tweak the sound to taste. The signal path is entirely analog, housed in a small die-cast aluminum enclosure, and it works great on bass as well.
specs: |-
  - All-analog signal path
  - 3 selectable voicings: mild, crunch, lead
  - Mild: gentle break-up that cleans up with your volume knob
  - Crunch: tight low end with strong bite, great for rhythm
  - Lead: high gain with lots of sustain
  - High-shelf and low-shelf EQ
  - True bypass
  - Works great on bass
  - Input impedance 300k, output impedance 5k
  - Frequency response (-3dB) 20Hz - 12kHz
  - Power 9V DC (negative tip), 2.1mm barrel connector, ~35mA draw
  - Die-cast aluminum enclosure
  - Dimensions 4.5" (L) x 2.5" (W) x 2" (H with controls), weight 0.5 lbs
