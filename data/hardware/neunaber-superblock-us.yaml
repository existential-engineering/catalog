specs: |-
  - 57 Tweed : Experience the mid-forward power and raw grit of this late-'50s workhorse.
  - 61 Blonde : Enjoy the bell-like cleans and growling weight under gain that defined the '60s.
  - 65 Blackface : Revel in the slightly scooped midrange and velvety highs reminiscent of the golden era of American amps.
  - Features - Up to 25 watts
  - 3 Classic Voices
  - 3 band EQ (Bass/Mid/Treble)
  - Gain
  - Limiter
  - Reverb
  - Effects Loop
  - Cab Sim
  - Headphone Out
  - Controls - Primary Controls
  - GAIN adjusts the distortion from clean to overdrive.
  - LIMITER reduces gain just enough to prevent overdrive, and then restores gain as the note dies away.
  - 3-BAND ACTIVE EQ Boosts and cuts Bass, Mids, and Treble frequencies.
  - 3-Voice Switch: 57 Tweed, 61 Blonde and 65 Blackface voicings.
  - Cab Sim Switch
  - Effects Controls
  - EFFECTS LOOP send and return jacks.
  - REVERB
  - Volume Controls
  - MASTER controls power amp volume as well as LINE OUT volume.
  - Specifications Electronic Performance Input ¼" mono, 1M input impedance Effects Loop 1V full scale, 1K Send impedance, 47K Return impedance Line Out Balance XLR output Power AC Power Requirement 24 Volt Power Supply (included) Power Requirement for reduced power 9V - 300ma Power Output 25 Watts 8 ohms (4-16 ohms okay) Dimensions HxWxD 4.25" x 6.5" x 1.5" ( 10.8cm x 16.5cm x 2.5cm) Weight 1.35 lbs (0.61 kg)
