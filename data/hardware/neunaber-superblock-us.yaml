description: A pedalboard-format guitar amplifier that captures three classic
  American amp voicings (57 Tweed, 61 Blonde, 65 Blackface) with cab simulation,
  FRFR mode, reverb, and effects loop.
details: |-
  Unleash the Power of Classic American Tones

  Meet your pedalboard's new best friend: the Quilter SuperBlock US! This compact yet powerful pedalboard amplifier packs the essence of three legendary American amplifiers into a single, portable unit. Whether you're on stage, in the studio, or practicing at home, the SuperBlock US delivers the iconic sounds of '57 Tweed, '61 Blonde, and '65 Blackface with unmatched authenticity and versatility. Three Classic Voices

  The SuperBlock US features three distinct voicings that capture the essence of classic American amplifiers:

  Versatile Power Options

  Designed for ultimate flexibility, the SuperBlock US can be powered by a 24-volt power supply for a full 25 watts of tube-like power, or by a conventional 9-volt power supply for 1 watt of power—perfect for quieter applications and home practice. Cab Simulations and FRFR Mode

  The SuperBlock US includes two Cab Sims and an FRFR mode on the XLR Out and headphone out, ensuring your tone is always dialed in, whether you're recording direct or monitoring through headphones. The built-in reverb and effects loop further enhance your sound, making the SuperBlock US a complete solution for any guitarist. Compact and Portable

  Fitting into a slot about the size of a double-width pedal, the SuperBlock US is the most extensible system you can fit on your pedalboard. It's perfect for fly dates, commutes, or as a replacement for your traditional amp setup. -
