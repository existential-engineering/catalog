description: Bettermaker PEQ_Core is a high-end passive stereo equalizer
  designed for the most demanding audio engineers, mastering engineers, and
  professional recording studios. It combines the legendary analog character of
  passive equalizers with modern digital control, offering full DAW integration,
  instant parameter recall, and a level of precision that is simply unattainable
  with traditional analog designs.
details: |-
  The Bettermaker PEQ_Core is a 1U rackmount passive stereo equalizer built for mastering engineers and professional recording studios. Its 100% analog signal path preserves the legendary character of classic passive equalizer designs while adding modern digital control via a dedicated companion plugin.

  The low-frequency section covers 20 Hz, 30 Hz, 60 Hz, and 100 Hz, with up to +15 dB of boost and -16 dB of cut. The high-frequency section offers 10 boost frequencies spanning 3 kHz to 28 kHz — including Air Bands at 20 kHz and 28 kHz — with a maximum boost of +18 dB, plus 3 cut frequencies.

  All parameters are controlled digitally through the companion plugin, enabling full DAW automation, real-time control, and instant snapshot recall. The unit supports both linked stereo and dual-mono operation, giving engineers precise control over the stereo field.

  USB connectivity (compatible with Mac and PC) bridges the hardware to the DAW environment, with input/output metering and a band audition function available in the plugin for surgical frequency work. The design is protected under U.S. Patent No. 10,693,428 B2.
specs: |-
  - 100% analog signal path
  - Low-frequency bands: 20 Hz, 30 Hz, 60 Hz, 100 Hz
  - Low-frequency boost: up to +15 dB; cut: up to -16 dB
  - High-frequency bands: 10 boost frequencies from 3 kHz to 28 kHz (including Air Bands at 20 kHz and 28 kHz); 3 cut frequencies
  - High-frequency boost: up to +18 dB
  - Stereo and dual-mono operation modes
  - Full DAW automation and real-time control via companion plugin
  - Instant parameter recall and snapshot functionality
  - USB connectivity (Mac and PC)
  - Input/output metering in plugin
  - Band audition function
  - 1U rackmount form factor
  - Companion plugin: macOS 10.13+ (native M1 support), Windows 8+
