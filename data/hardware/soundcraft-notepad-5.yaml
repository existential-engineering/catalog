details: |-
  The Notepad-5 mixer makes it easy to get legendary Soundcraft sound for your music, podcasts or videos. The Notepad-5 combines professional-grade analog components and a built-in USB audio interface to use with your favorite Mac or PC editing software. Whether you’re a singer-songwriter or a podcaster, Notepad mixers offer best-in-class features like renowned Soundcraft mic preamps, so you can bring a level of polish to your creative productions that’s sure to impress.

  Pristine audio quality. A Soundcraft tradition.

  For over 40 years, audio professionals have trusted Soundcraft mixing solutions for pristine sound quality and reliable performance. Notepad series mixers continue this tradition with professional-grade Soundcraft microphone preamps, convenient XLR and 1/4” connectors, and durable metal enclosures built to stand the test of time.

  Comfortably familiar. Incredibly powerful.

  You’ll find yourself right at home with Notepad’s traditional channel strip layout. Two EQ controls per channel give you a level of convenience often reserved for larger consoles. A rotary headphone volume fader makes it easy to adjust your personal listening level, while a master level with LED metering provides precise control over your master output signal. Designed for home studios, rehearsals, live performances, and podcast production, the Notepad series provides a layout that’s familiar to audio professionals yet easy to grasp for beginners.
