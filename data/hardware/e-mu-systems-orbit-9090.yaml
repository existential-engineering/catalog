description: >-
  The E-mu Orbit 9090 is a rack-mounted dance music module packed with 8MB of vintage analog
  samples and digital filters, purpose-built for techno, house, trance, and hip-hop production.
details: |-
  Released in 1996, the Orbit 9090 was the first entry in E-mu's dance-focused module line,
  targeting electronic music producers who needed instant access to classic analog-style sounds
  without the complexity of full-blown synthesizer programming. It arrived in a distinctive gold
  single-rack-space enclosure with a clear LCD display for easy navigation.

  The sound library draws from 8MB of ROM samples covering the essential palette of dance music
  production: sweeping pads, punchy basses, classic drum machine hits, and a wide range of textures
  familiar from house, techno, trance, and hip-hop records. A digital filter controlled via the
  modulation wheel provides VCF-style sweeps, and dual AHDSR envelopes along with two LFO sources
  routable to 42 destinations offer considerable sound-shaping flexibility.

  The Orbit found its way into the rigs of notable electronic artists including Todd Terry, Roni
  Size, ATB, and Orbital. While the digital sound source can lean toward the harsh side on its own,
  the 512 onboard patches provide a broad starting point, and the sounds respond well to external
  reverb and delay processing.
specs: |-
  - Polyphony: 32 voices
  - Sound Source: 8MB ROM samples
  - Filter: Digital
  - Envelopes: 2 AHDSR (VCA)
  - LFOs: 2 sources, 42 destinations, MIDI controllable
  - Memory: 512 patches
  - Control: MIDI
  - Format: 1U rackmount
releaseDate: "1996"
