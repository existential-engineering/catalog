description: Custom Shop limited edition treble booster with a glow in the dark
  silver sparkle finish, built around a Russian MP41A germanium transistor.
  Intended for use with an amp already on the verge of breakup, where cranking
  both amp and pedal yields creamy, sustaining distortion.
details: |-
  Keeley brought back its classic Java Boost for 2018 in a Custom Shop finish, a glow in the dark silver sparkle. By day it reads as the standard Java Boost, and the glow in the dark clear coat gives a subtle glow once the stage lights go down.

  Treble booster designs of this kind give the cutting guitar tones associated with the 1960s and 1970s, and this is not a clean boost. The 2018 version uses a Russian MP41A germanium transistor. The higher the note played, the more it is amplified and then distorted by the amp, and bass notes are cut in both of the pedal's modes.

  The pedal is designed to sit in front of an amp that is already overdriven or clipping a little, which is the key to getting a good sound from it. Set in front of a very clean amp with the volume at 1 or 2 the result is a fairly weak tone, so the amp should be set on the verge of breakup or beyond. A power amp with a lot of headroom that does not distort easily makes the pedal harder to use.

  It can also be run in front of another overdrive pedal as part of a two pedal overdrive setup, adding sparkle and life to solos. Treble boosters of this type have been used for many years by players including Tony Iommi, Brian May, Rory Gallagher, Eric Clapton, Ritchie Blackmore, Dweezil Zappa and Wolf Hoffmann.
