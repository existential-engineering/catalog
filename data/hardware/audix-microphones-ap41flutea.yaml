details: |-
  A professional diversity wireless system featuring the ADX10FL miniaturized cardioid condenser for standard-sized flutes.

  The ADX10FL reproduces the natural tone and percussive nature of the flute with detail and accuracy. The tight pickup pattern of the mic helps to isolate the flute from the rest of the instruments on stage.

  Specifically designed for use with a standard-sized flute, the ADX10FL includes an integrated clip that attaches to the headstock of the flute.
specs: |-
  - Mic: ADX10FL miniaturized cardioid condenser for flute
  - Polar pattern: Cardioid
  - System: R41 diversity receiver with B60 bodypack transmitter
  - Frequency bands: A (522-554 MHz), B (554-586 MHz)
  - 106 pre-coordinated frequencies
