id: 7sWdDCIMYce4n1c1J2Nac
name: LEGEND L10
manufacturer: midas
primaryCategory: rack-mount
url: "https://www.midasconsoles.com/en/products/0831-AAA"
description: 500 Series Rackmount Chassis for 10 Modules with Advanced Audio
  Routing. The L10 accommodates up to 10 single-width modules in a compact 3U
  rackmount format, featuring advanced audio routing, compressor bus linking,
  and universal power supply compatibility for worldwide use.
details: |-
  The Midas LEGEND L10 is a 500 series rackmount chassis that accommodates up to 10 single-width modules in a compact 3U rackmount format. It features industry-standard XLR main and auxiliary input/output connectors per channel, audio output link switches that enable module signal chaining without external cables, and comp bus link switches that support stereo/multi-channel dynamics linking for compatible compressor modules. The universal auto-ranging switch-mode power supply works worldwide, providing 3.2 A @ ±16 V for modules and 300 mA @ +48 V phantom power. The chassis features all-steel construction.
specs: |-
  - Rack Space: 3U
  - Form Factor: 19" rackmount
  - Module Capacity: 10 single-width 500 series modules
  - Power Supply: Universal auto-ranging switch-mode
  - Module Power: 3.2 A @ ±16 V
  - Phantom Power: +48 V, 300 mA
  - Chassis: All-steel construction
