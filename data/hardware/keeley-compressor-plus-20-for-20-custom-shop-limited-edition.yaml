details: |-
  The 20 for 20 series is a line of twenty Custom Shop finishes, each carrying the 20 for 20 insignia and each limited to twenty units. This is the Compressor Plus in that series, finished in textured matte crimson with a monotone graphic scheme and clear knobs.

  The Compressor Plus itself is the first substantial advance on Keeley's two and four knob compressor line. It adds a Release switch tuned for single coils or humbuckers, a Tone control that emphasises the harmonics most easily lost in compression, and a Blend control that retains the peaks of the playing along with the proper phasing of the guitar signal.

  The pedal is a compressor with an expander and sustainer. As well as limiting the peaks of the playing it adds progressively more gain as notes fade out, so notes and bends sustain and bloom. The Release switch exists because humbuckers carry more average energy than single coils and can hold a compressor in compression longer, making a run of notes sound dull; the faster release keeps each note's attack and definition. The Tone control is taken from the emphasis circuits used in analog delays to recover treble after a BBD line, and the Blend control allows peaks through while sustain is applied behind them, the parallel approach Keeley calls Manhattan compression.

  Beyond funk and chicken picking settings, the pedal suits players after a smooth, subtle wash, removing peaks for an ambient layer and blending treble back in for shimmer. It is useful for keeping loops well balanced, and the output can be used as an amp boost. The pedal is made in the United States.
