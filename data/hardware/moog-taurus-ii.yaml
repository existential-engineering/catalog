description: >-
  The Moog Taurus II is a monophonic analog pedal synthesizer featuring an 18-note
  foot-operated keyboard and the same synth engine as the Moog Rogue. Produced from 1981
  to 1983, it excels at deep bass sounds using its dual VCOs with sawtooth and square
  waveforms, and can also control external synthesizers via CV/gate outputs.
details: |-
  The Taurus II represents Moog's second generation of bass pedal synthesizers, housing essentially the same synthesizer engine as the Rogue in a floor-mounted pedalboard format. Its dual VCOs offer sawtooth and square waveforms that, while basic, produce exceptionally powerful low-frequency tones prized by keyboardists and guitarists for live bass lines played with their feet.

  The instrument features a 24dB/oct lowpass filter with cutoff and keyboard tracking, along with an external source input for the filter. Portamento, pitch, and mod wheels provide additional expressive control. The pedal controller outputs CV/gate signals, allowing it to double as a controller for other analog synthesizers in a live or studio setup.

  Produced between 1981 and 1983, the Taurus II occupies a unique niche in synthesizer history as one of the few dedicated foot-controlled synths. While it lacks memory storage and polyphony, its straightforward signal path and robust low-end response have made it a sought-after instrument for performers who need hands-free bass synthesis.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs with sawtooth and square waveforms
  - Filter: 1 24dB/oct lowpass with cutoff and key tracking
  - VCA: Attack + Decay or Sustain
  - Keyboard: 18-note pedalboard
  - Memory: None
  - External source input for filter
  - Portamento, pitch wheel, and mod wheel
  - Control: CV/Gate output
  - Arpeggiator/Sequencer: None
releaseDate: "1981"
