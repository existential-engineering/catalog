details: |-
  The SVT amp and SVT 8x10 cabinet are the most iconic pairing in bass amplification. Designed to pair perfectly with the Heritage 50th Anniversary SVT—the best SVT to date—Ampeg offers an SVT cab to match: The Heritage SVT-810AV.

  Savvy players know a full Ampeg fridge rig is crucial to that legendary sound, and with the SVT-810AV's carefully matched aesthetics and renowned durability and tone, Ampeg aficionados can be confident that a full Heritage rig represents the ultimate in Ampeg all-tube amplification.

  From the beautiful blue/silver grill cloth to the Heritage badging and hang tags, the 810AV is a must for Heritage SVT owners.
specs: |-
  - 8 U.S.-made custom 10" Eminence drivers
  - Stereo/mono inputs
  - Rugged 15mm poplar-ply enclosure
  - Vintage '70s-style anniversary grille, soft Tolex, and trim
  - Perfect match for Heritage 50th Anniversary SVT
  - 137 lb / 62 kg
