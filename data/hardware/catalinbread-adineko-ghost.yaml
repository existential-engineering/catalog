description: Catalinbread knows what type of spirits lurk within the hearts of
  ancient tonal devices. Where would modern day fuzzboxes be if not for the
  faulty tube in the console at Nashville's Bradley Studios? Sometimes gear that
  is… disturbed… is the key to achieving fresh tones.
details: |-
  Catalinbread knows what type of spirits lurk within the hearts of ancient tonal devices. Where would modern day fuzzboxes be if not for the faulty tube in the console at Nashville's Bradley Studios? Sometimes gear that is… disturbed… is the key to achieving fresh tones. It is these strange possessions that led Catalinbread to ghost hunting: The Adineko Ghost distills this spectral energy into the Adineko circuit. Behold, as the new Ghost control introduces a densely-filtered octave section into the delay path, for just a touch of spooky modulation to full-on digital gaga that permeates your signal chain. With the Ghost control infecting both delay lines of the original Adineko, you can mix in your own blend of short and long delay on either end of the Balance control, or mix them right down the middle for a full supernatural experience with a healthy dose of the Ghost control. If you opt to keep the Ghost at bay, the Adineko Ghost still delivers a killer oil-can delay just like the devices of yore.
specs: |-
  - Power source: center negative, regulated 9-18V DC external power supply
  - Controls: Reverb, Blend, Ghost, Timing, Balance
  - Two parallel delay lines mixed by the Balance control
