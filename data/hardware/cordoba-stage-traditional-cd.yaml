description: The Stage Traditional CD is for players who prefer a solidbody
  nylon-string electric guitar that looks and feels more like a traditional
  nylon-string instrument. It features a bound solid cedar top and a Stage
  Pickup System co-developed with Fishman®.
details: |-
  The Stage Traditional CD guitar features the Córdoba Stage body, which was specifically designed with live performers in mind. Its 38mm (1 1/2") deep body is constructed of solid mahogany, strategically chambered to reduce weight and increase resonance, and capped with a solid cedar top. A soft body cutaway provides increased comfort and easy access to higher frets. The Stage Traditional CD guitar’s neck joins the body at the 12th fret and its rosewood fingerboard has a flat radius and a 52mm (2") nut width, which will be familiar to most nylon-string guitarists.

  The guitar’s solid mahogany body combined with a solid cedar top produces a warm, full-bodied, and harmonically rich tone with a strong midrange presence, further enhanced by fanned top bracing. This combination also makes the Stage Traditional CD guitar respond beautifully to subtle playing dynamics, making it especially suitable for players with a lighter touch.
