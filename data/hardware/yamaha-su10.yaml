description: >-
  The Yamaha SU10 is a compact, portable sampler and sequencer released in 1996, designed
  as a musical notepad for capturing ideas on the go. It offers up to 4-voice polyphony
  with sampling rates from 11.64kHz to 44.1kHz, providing between 19 and 54 seconds of
  sampling time. Notable users include Jimi Tenor, Autechre, and Scanner.
details: |-
  The SU10 can store up to 48 samples across four banks, with 12 keypads that serve dual purposes for both editing and triggering samples. A distinctive ribbon controller enables creative sound manipulation including filter modulation, pitch alteration, reverse, scaling, crossfading, and sample scratching.

  The device features a VCF-type digital filter with three resonant settings and bandpass, highpass, or lowpass shapes that can process external audio sources. However, the filter is known to be somewhat unreliable, producing crackles, distortion, and noise, with external sound filtering resulting in very low output levels.

  Despite its limitations, the SU10 has found a following among experimental electronic musicians. Its compact form factor, creative sampling features, and the unique ribbon controller make it an appealing tool for lo-fi and glitchy sound design.
specs: |-
  - Polyphony: 4 simultaneous samples (mono)
  - Sampling rates: 11.64kHz to 44.1kHz
  - Sample duration: 19 to 54 seconds depending on sample rate
  - Maximum samples: 48 across four banks
  - Sequences: 4 songs with up to 100 events each
  - Interface: 12 keypads, ribbon controller
  - Filter: Digital hi/low/bandpass with resonance
  - Connectivity: MIDI, stereo mini-jack input/output
