details: |-
  The Hooke Spring Reverb puts vintage tube-amp spring reverb and tremolo into one pedal, with three modes: Classic Spring, Blackface Trem-n-Verb and an organ-like Fugue-Verb.

  In Classic Spring the Tone control moves the reverb from bright and spanky to dark and thick, while the Spring control sets how loose the simulated pan is, since looser springs generate more reflections and an audible bounce. Between them the two controls cover two-spring and three-spring pans and short, medium or long decay, so a specific vintage amplifier's reverb pan can be approximated.

  Trem-n-Verb models the vibrato channel reverb of a black panel amplifier, which uses tremolo rather than pitch vibrato. Keeley filtered and equalised the mode for a deep tremolo and, as happens in the original circuit when output tube bias is modulated, the reverb level dips with the tremolo, with the reverb wash slightly thickened over the tremolo texture.

  Fugue mode is a fully wet spring reverb with octave up and octave down added and no dry signal, giving a church organ character. A bank switch under the back plate selects a second bank of three more patches: a long decay Trem-n-Verb set up for single-coil guitars with very long trails, Spring-Plate, which crossfades between spring and plate reverb in any proportion, and Vibro-Spring, a spring reverb with pitch vibrato.
