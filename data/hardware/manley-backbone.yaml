name: BACKBONE Mastering Insert Switcher
manufacturer: manley
primaryCategory: mastering
categories:
  - mixer
  - summing-mixer
  - mid-side
  - utility
  - analog
  - rack-mount
  - outboard
url: https://www.manley.com/products/pro-audio/mastering/backbone
prices:
  - amount: 7499
    currency: USD
description: The Manley BACKBONE offers 8 balanced stereo inserts (2 with M/S
  matrix encoding), stepped I/O gains, and precision relay switching for
  high-end analog mastering applications.
details: |-
  The Manley BACKBONE is a professional mastering insert switcher and routing console designed to sit at the heart of an analog mastering chain. It provides 8 balanced stereo insert points for outboard processors with precision relay-switched routing, hard-wire bypass topology, and fully balanced signal paths throughout.

  Three balanced stereo inputs feed the chain, and two of the eight insert points include integrated M/S (Mid/Side) matrix encoding for sum/difference processing of stereo material. Grayhill stepped attenuators are used for input and output gain staging so settings are repeatable across sessions. Patchable SEND and RETURN paths plus separate SUM and DIFFERENCE outputs on the rear panel give engineers flexibility for parallel and mid/side workflows. Connectors are customer-configurable as either XLR or DB25 (Tascam-format) at order time.
specs: |-
  - 8 balanced stereo insert points with relay-switched routing
  - 2 inserts with integrated M/S (Mid/Side) matrix encoding
  - 3 balanced stereo inputs
  - Separate SUM and DIFFERENCE outputs on rear panel
  - Patchable SEND and RETURN paths
  - Hard-wire bypass topology
  - Fully balanced signal paths
  - Grayhill stepped I/O attenuators for repeatable gain staging
  - Customer-configurable connectors: XLR or DB25 (Tascam-format)
  - Frequency Response: 10 Hz – 100 kHz, ±0.1 dB
  - THD + Noise: 0.0015% @ +4 dBu; 0.0011% @ +22 dBu (A-weighted)
  - Maximum Signal Level: +29 dBu
  - Dynamic Range: 124 dB
  - Input Impedance: 30K Ohms
  - Output Impedance: 150 Ohms
  - Noise Floor: -95 dBu (22 Hz – 22 kHz A-weighted)
  - Dimensions: 19" × 3.5" × 12" (2U rack space)
  - Weight: 13 lbs
  - Power Consumption: 60 watts
  - Mains Voltage: 100V, 120V, or 220-240VAC (unit-specific)
