description: >-
  The Casio VZ-1 is a professional synthesizer released in 1988 that combines
  phase distortion and frequency modulation synthesis using eight iPD oscillator
  modules arranged in four pairs. Featuring a 61-key keyboard with velocity and
  aftertouch, it delivers distinctive space-age sounds ranging from smooth pads
  to harsh, complex textures.
details: |-
  The VZ-1 arrived in 1988 as Casio's flagship successor to the CZ-1, competing directly with professional instruments from Yamaha, Roland, and Korg. It featured a sleek all-black design with a brushed steel front panel and an all-metal chassis that remained relatively lightweight for gigging purposes.

  A major departure from the CZ line was the programming interface. Rather than analog-style button-per-function controls, Casio implemented a page-driven system with a large backlit dot matrix LCD display. This made programming substantially easier than competing instruments like the Yamaha DX7, allowing graphical editing of envelopes and signal paths with multiple parameters visible simultaneously.

  The VZ-1 employed a hybrid sound generation approach. While the CZ line used phase distortion synthesis and Yamaha used phase modulation (marketed as FM), the VZ-1 combined phase distortion for ring modulation and waveform generation with true frequency modulation synthesis for harmonic generation. This resulted in distinctive tonal characteristics unavailable from competing instruments.

  A combination mode allowed stacking up to four patches for a total of 32 oscillators per voice, though this reduced polyphony significantly. Each patch could be velocity-switched, crossfaded, or split across the keyboard. Limitations included only 64 user patches, no onboard effects, and no sequencer.
specs: |-
  - Polyphony: 16 voices
  - Multitimbral: 8 parts duo-phonic
  - Oscillators: 8 iPD modules across 4 pairs
  - Waveforms: 1 sine, 5 saw, 1 noise, 1 noise + sine
  - LFO: 2 generators (tremolo and pitch)
  - Filter: None
  - Envelopes: 9x 8-stage (8 amp, 1 global pitch)
  - Arpeggiator/Sequencer: None
  - Keyboard: 61 keys with velocity and aftertouch, 3 wheels
  - Memory: 64 preset patches, 64 user patches, 64 via RC-100 ROM card
  - MIDI: In, Out, and Thru
  - Produced: 1988-1991
releaseDate: "1988"
