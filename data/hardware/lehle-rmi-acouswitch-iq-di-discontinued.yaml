details: |-
  This multifunctional tool for acoustic musicians was conceived by Jacques Ruppert, mastermind of Ruppert Musical Instruments (RMI) and engineered by LEHLE. It is a high end preamp in 2 channel design, with A/B switch for 2 instruments, a switchable parallel loop, a tuner-mute function and a DI out which is isolated by a LEHLE transformer.

  As a special feature the Acouswitch, which serves as a central controller for acoustic setups, it has a body-contour-control to suit every musical environment: on the one hand a narrow notchfilter to reduce feedback with a frequency range of 45 Hz to 500 Hz, on the other hand it can boost a broad band of low to low-mid frequencies to make the sound fatter or make small speaker cabinets sound bigger.

  The ACOUSWITCH IQ DI is manufactured by LEHLE in Germany on behalf of RMI.
specs: |-
  - Lehle True Sound Technology
  - Input A/B switch with option to mix both signals
  - Studiograde preamp
  - 3-band EQ with semiparametric mids from 100 Hz to 6 kHz
  - Body-Contour-Control can be used as notchfilter or variable low mid boost
  - Switchable effects loop with blend/mix control
  - Switchable effects loop can also be used as volume boost
  - Serial effects loop (non switchable)
  - Studiograde D.I. box with pad, pre/post and groundlift switches, including LEHLE LTMZ transformer for galvanic isolation
  - Can be used with any power supply 9 to 20 volt AC or DC
  - Additional output for tuner
  - Mute switch
  - Extremely robust design with protected controls
