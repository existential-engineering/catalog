details: |-
  Originally released to wide acclaim and quietly discontinued years ago, the Rivolta Mondata Baritone VII is back — but only in limited numbers. Revered by tone chasers and collectors alike, this rare breed of baritone electric guitar has been faithfully re-created by the same expert craftsmen at MIRR Korea , to the same exacting standards and specifications as the beloved original. Designed by Dennis Fano , the Mondata Baritone VII features the unmistakable offset silhouette, chambered mahogany body, and German carve top that made the Mondata line a standout. But the magic lies in its extended 28" scale and powerful tonal range — a deep, resonant voice that sits between guitar and bass, equally suited for cinematic swells, doom-laden riffs, or articulate low-register melody. With custom-wound pickups and premium hardware, this baritone delivers punch, clarity, and vintage charm in equal measure. FEATURES & SPECS

  CASE OPTIONS:
  Premium Soft Case
  Hard Case: Mondata Baritone
specs: |-
  - chambered mahogany body
  - German carve top with raised center block
  - double bound body
  - set maple neck
  - bound fingerboard
  - aged perloid block inlays
  - bound peghead
  - 28" scale – 24 medium jumbo frets
  - 12″ fingerboard radius
  - 1.687″ nut width
  - Rivolta C+ neck profile
  - Rivolta 'Novanta' P90 & 'Brevetto' Humbucker with phase / coil tap mini switches
  - nickel hardware
  - Kluson style tuners
  - Nashville tunomatic bridge
  - 14 - 68 gauge strings
