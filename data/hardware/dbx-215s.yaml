id: qnWQBCqQLaefFGVf-Hc3F
name: dbx 215s Dual Channel 15-Band Equalizer
manufacturer: dbx
primaryCategory: equalizer
categories:
  - rack-mount
  - outboard
url: https://dbxpro.com/en/products/215s
description: The dbx 215s is a dual-channel, 15-band graphic equalizer with
  1/3-octave Constant Q frequency bands, switchable ±6/±12dB boost/cut ranges,
  and a 50Hz high-pass filter. It delivers over 112dB of dynamic range with
  balanced XLR and TRS connectivity for portable and touring use.
details: |-
  The 215s carries on dbx's four-decade heritage of professional graphic equalizers, combining exceptional sound quality with rugged reliability designed for the demands of portable and touring applications. Each of the dual channels provides 15 bands of 1/3-octave Constant Q equalization, with faders offering either ±6dB or ±12dB of boost or cut via a front-panel switch.

  A ±12dB input gain control allows the engineer to optimize signal level before equalization, while the 50Hz high-pass filter (12dB/octave Bessel characteristic) removes unwanted low-frequency rumble. Four-segment LED output level metering provides clear visual monitoring of signal levels. Front-panel bypass switching allows instant comparison of processed and unprocessed signals.

  With an extended frequency response of less than 10Hz to over 50kHz and dynamic range exceeding 112dB, the 215s maintains high audio fidelity throughout the equalizer's range. Both channels feature electronically balanced inputs and impedance-balanced outputs via XLR and 1/4" TRS connectors.
specs: |-
  - Input Connectors: 1/4" TRS (female), XLR (pin 2 hot)
  - Input Impedance: Balanced: 40kΩ; Unbalanced: 20kΩ
  - Max Input Level: >+21dBu
  - Output Connectors: 1/4" TRS (male), XLR (pin 2 hot)
  - Output Impedance: Balanced: 100Ω; Unbalanced: 50Ω
  - Max Output Level: >+21dBu (2kΩ+); >+18dBm (600Ω)
  - Bandwidth: 20Hz–20kHz, ±0.5/–1dB
  - Frequency Response: <10Hz to >50kHz
  - Dynamic Range: >112dB
  - Signal-to-Noise Ratio: >95dB
  - THD+Noise: <0.003%
  - Crosstalk: <–90dB (20Hz–20kHz)
  - EQ Bands: 15 bands per channel, 1/3-octave Constant Q
  - Boost/Cut Range: Switchable ±6dB or ±12dB
  - High-Pass Filter: 50Hz, 12dB/octave Bessel
  - Power: 100–240VAC, 50/60Hz, 15W
  - Dimensions: 1.75" H × 19" W × 6" D
  - Weight: 4.8 lbs (2.2 kg)
