description: 20% More is a slew-limiting distortion pedal built around a
  resonant slew limiter that acts as a steep distorted low-pass filter,
  featuring JFET clipping, sub and upper octaves, envelope follower, and low
  pass gate.
details: |-
  20% More is built around a schematic of mysterious origin, combining a slew
  limiter with oscillator behavior. A slew limiter smoothes out how quickly incoming
  voltage can change, limiting it to a fixed v/sec slope. Since time and frequency
  are intrinsically linked, this acts as a steep, somewhat distorted low-pass filter.

  When it resonates, these fixed slopes become triangle wave oscillations. Input
  signals can overwhelm the oscillation, producing pseudo-wavefolding and synthetic
  distortion artifacts. The pedal features JFET clipping, sub and upper octaves, an
  envelope follower, and a low pass gate. A programming guide enables expanded
  CV-based control of the circuit parameters.
specs: |-
  - Slew limiter distortion circuit
  - JFET clipping
  - Sub and upper octave generation
  - Envelope follower
  - Low pass gate
  - Power supply: 9 VDC centre-negative
  - Made in Hull, Québec
