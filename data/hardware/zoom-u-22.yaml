description: The U-22 is the essential mobile recording and performance
  interface, with an innovative 2-in/2-out ultra-portable design that makes it
  easy to connect to a laptop or an iPhone/iPad and create great-sounding audio
  anywhere.
details: |-
  The U-22 is a 2-in/2-out mobile audio interface in an ultra-portable body measuring 119.2 mm deep, 91.8 mm wide and 44.6 mm high, and weighing 151 g. It records and plays back at resolutions up to 24-bit/96 kHz, and an asynchronous transfer system keeps it clear of computer jitter. It works with Mac, PC and iOS devices, and delivers the same sound as the U-44 and U-24 in a more compact form factor.

  A single high-performance, low-noise mic preamp based on the one in the H6 Handy Recorder measures -120 dBu EIN or less. The XLR/TRS combo input records a microphone or a line-level source with +48 V phantom power, and its Hi-Z setting takes a guitar or bass directly. A stereo mini LINE IN jack records an iPhone, iPad, mixer or other portable audio device. Only one input works at a time: when the LINE IN jack is in use, the XLR/TRS combo input is disabled.

  Outputs are an RCA L/R pair and an independent headphone output with its own volume control, so a processed signal can be sent to a mixer or a house PA while headphones monitor. The U-22 also works as a studio-quality headphone amp. A DIRECT MONITOR switch lets the input be heard before it passes through the computer, for zero-latency recording and mixing.

  Power comes from the USB bus, from two AA alkaline or NiMH batteries for about 5 hours with phantom power off, or from the Zoom AD-17 adapter or any 5 V DC supply on the Micro-B connector. Connecting to an iPhone or iPad needs battery or adapter power plus an Apple iPad Camera Connection Kit or Lightning-to-USB Camera Adapter. The design puts the connectors, knobs and controls within quick reach: the OUTPUT jacks and the gain and output knobs on top, the MIC/Hi-Z, LINE IN and PHONES jacks on the front, the USB and DC connectors on the back, and the power source, 48 V and direct monitor switches on the right side.

  The box contains the operation manual, a USB cable and an Ableton Live 9 Lite download code. The AD-17 power supply and the AIH-1 Audio Interface Holder are optional. Steinberg Cubasis LE, a 4-track recording, editing and mixing app for iPad, is a free App Store download for U-22 owners.
specs: |-
  - 2-in/2-out stereo USB audio interface for PC, Mac, iPhone and iPad
  - ANALOG IN, MIC/Hi-Z: TRS/XLR combo jack (XLR 2 hot, TRS tip hot)
  - Input gain: 0 to 43 dB
  - Input impedance: 2.6 kohms (MIC), 484 kohms (Hi-Z)
  - Maximum input level: -0.8 dBu (MIC), +8.7 dBu (Hi-Z)
  - Phantom power: +48 V
  - ANALOG IN, LINE IN: stereo mini jack, input impedance 22 kohms, maximum input level +1.0 dBu
  - Records one input at a time: using the LINE IN jack disables the XLR/TRS combo input
  - ANALOG OUT, OUTPUT L/R: RCA (coaxial), maximum output level -0.8 dBu at 0 dBFS into a 10 kohm load, output impedance 1 kohm
  - ANALOG OUT, PHONES: stereo mini jack, 10 mW x 2 into a 32 ohm load, output impedance 10 ohms
  - Frequency characteristics: 44.1 kHz plus or minus 1.5 dB (20 Hz to 20 kHz), 96 kHz plus or minus 2 dB (20 Hz to 40 kHz)
  - Input conversion noise: measured EIN -120 dB or less (IHF-A) at 43 dB with 150 ohm input
  - Audio recording and playback channels: 2 recording, 2 playback
  - Sampling frequencies: 44.1, 48, 88.2 and 96 kHz
  - Bit depth: 24-bit
  - Interface: USB 2.0
  - Power source: USB bus power (Type B), ZOOM AD-17 (Micro-B), DC 5 V power supply (Micro-B), or 2 AA batteries for about 5 hours continuous operation with phantom power off
  - Accepts standard AA alkaline or NiMH rechargeable batteries
  - Power consumption: 5 W maximum
  - Dimensions: 119.2 mm (D) x 91.8 mm (W) x 44.6 mm (H)
  - Weight (main unit only): 151 g
  - Zero-latency direct monitoring via a DIRECT MONITOR switch
  - Gain control knob for the MIC/Hi-Z input and a dedicated OUTPUT knob
  - Includes a download code for Ableton Live 9 Lite
  - System requirements, Windows: Windows 10 or 11 (64-bit), Intel Core i3 or faster, USB 3.0 or 2.0
  - System requirements, Mac: Mac OS X 10.9.5 to macOS 26, Intel Core i3 or faster, USB 3.0 or 2.0
  - System requirements, iPhone and iPad: iOS 7.1 to 26, iPadOS 15 to 26, with batteries or AC adapter for power plus an Apple Camera Connection Kit or Lightning-to-USB Camera Adapter
  - Note: 0 dBu = 0.775 Vrms
