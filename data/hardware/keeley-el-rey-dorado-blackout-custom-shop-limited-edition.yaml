details: |-
  This Custom Shop Blackout edition of the El Rey Dorado carries a textured black finish, silver-capped M style knobs and the Keeley Custom Shop insignia.

  The pedal is an overdrive aimed at the Plexi amplifier tone of the 1960s. That tone covers a wide range depending on the amplifier's power, valves, speakers and cabinet, and the pedal targets the centre of it; one of the reference points named for the voicing is a reissue JTM 45/100 full stack.

  Two gain modes are selected by the Power toggle, which changes the amount of compression and harmonic content. Low Power mode is louder, with more girth and fewer harmonics, for a more old-school crunch. High Power mode is more compressed, with more harmonics and a tighter, more defined tone, aimed at lead sounds. The control set is Volume, Gain and Tone alongside the toggle, and the two modes let the pedal push any amplifier.
