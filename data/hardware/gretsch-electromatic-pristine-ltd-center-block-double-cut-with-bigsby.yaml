details: |-
  Clean, elegant and powerful, our Limited Edition Electromatic Pristine Center Block guitars deliver uncompromising Gretsch power and fidelity in stunning style. Two-tone finishes with metallic tops and rich stained bodies and necks, gold hardware and P-90E pickups with cream inserts present a sleek, simple opulence that is sure to turn heads.

  Mahogany Body with Spruce Center Block: The Limited Edition Pristine Center Block guitars feature a laminated mahogany body with a chambered spruce center block for lightweight comfort, feedback rejection, open resonance and classic Gretsch clarity, snap and attack.

  Thin "U" Mahogany Neck: The Thin "U" shaped mahogany neck provides exceptional feel and playability, paired with a 12" radius laurel fingerboard and pearloid Neo-Classic thumbnail inlays.

  P-90E Pickups: The P-90E single-coil pickups produce a wide, balanced, and transparent tone with the bite and presence that have made P-90s a perennial favorite for everything from blues to rock.
