description: The HP-1 is a professional over-ear studio headphone for music
  production, mixing, gaming, and everyday listening. With 3 selectable voicings
  it gives a neutral, accurate view of a mix and also allows checking how the
  work will sound on the most popular headphones in use today.
details: |-
  The HP-1 is made to help check how a mix will sound on the headphones and other systems that people are ultimately listening on. With the press of a button it switches between three tunings: Kali's neutral studio voicing, plus two reference tunings for popular headphones, so a mix can be auditioned against what listeners are actually using without leaving the headphone. The tuning modes are handled by a DSP chip on board, and the Kali studio mode is the neutral reference the other two are measured against.

  Kali explains why a headphone target curve is not a straight line. Headphones and loudspeakers measure very differently: a loudspeaker's flat line more or less correlates to better performance, while with headphones the interaction between the headphone and the listener's body complicates the measurement data. A headphone that measures flat or linear will not sound good, and the sound in it will not translate well to other systems.

  The broad research consensus Kali cites is that headphones should have some boost in the low frequencies rolling off around the low mids at about 200 Hz, another broad boost in the high mids centred around 3500 Hz, and a sharp roll-off of the high frequencies from about 10 kHz to 20 kHz. A headphone measuring flat instead gives anemic bass, overly pronounced midrange, dull upper mids into the high frequencies, and a shrill, piercing upper octave. The goal of the HP-1, as with all Kali products, is a neutral reference that can be trusted for mix translation.

  Because the DSP chip is already processing the different tunings, the HP-1 also carries quality-of-life features for casual listening and travel. The included headphone cable gives a higher-fidelity wired connection and Bluetooth covers on-the-go use. Active noise cancelling can be engaged to block out the outside world, and buttons on the headphone adjust level, skip forward and back, and pick up calls.

  A single charge gives at least 40 hours of playback, recharged over the included USB-C cable. The headband is vegan leather, the earcups are replaceable vegan leather, the headphone folds, and a carrying case is included.
