description: All ESP Original Series instruments are hand-crafted, one at a time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan. The ESP Horizon-II HT is a world-class guitar that exudes pure elegance with its carved arch top and textured ESP exclusive Sugilite finish. It features set-thru construction for fret access, a Honduran mahogany body with maple top and three-piece maple neck, Seymour Duncan pickups (TB-4 JB Trembucker bridge, SH-1 '59 neck), Hipshot hardtail bridge with string-thru, and is supplied with a deluxe form-fit case.
details: |-
  All ESP Original Series instruments are hand-crafted, one at a time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan. The ESP Horizon-II HT is a world-class guitar that exudes pure elegance with its carved arch top and textured ESP exclusive Sugilite finish.

  Built with set-thru construction at 25.5" scale, allowing smooth, unfettered access to the highest frets, the ESP Horizon-II HT Sugilite pairs a Honduran mahogany body to a comfortable thin u-shaped three-piece maple neck. It offers an ebony fingerboard with graphite nut, offset bar inlays, 24 extra-jumbo stainless steel frets, Luminlay side dots, and reverse headstock with matching finish.

  Top-shelf components on the ESP Horizon-II HT Sugilite include black hardware, ESP strap locks, Gotoh locking tuners, a Hipshot fixed hardtail bridge with string-thru-body, and an outstanding set of Seymour Duncan pickups: a TB-4 JB Trembucker in the bridge position, and an SH-1 '59 in the neck position with chrome covers, providing full and powerful low end, crisp highs, and a sweet midrange bump for extraordinary clarity. Includes a deluxe ESP form fit case.

  Finish: Sugilite. Series: Horizon Series, ESP Original Series. New for 2026.
