description: All ESP Original Series instruments are hand-crafted, one at a
  time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan.
  The ESP Horizon-II HT is a world-class guitar that exudes pure elegance with
  its carved arch top and textured ESP exclusive Sugilite finish. It features
  set-thru construction for fret access, a Honduran mahogany body with maple top
  and three-piece maple neck, Seymour Duncan pickups (TB-4 JB Trembucker bridge,
  SH-1 '59 neck), Hipshot hardtail bridge with string-thru, and is supplied with
  a deluxe form-fit case.
