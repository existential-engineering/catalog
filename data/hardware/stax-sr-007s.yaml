id: XZqaZITZjxGAG2qw_wARN
name: SR-007S
manufacturer: stax
primaryCategory: headphones
description: A premium electrostatic earspeaker featuring an advanced push-pull
  unit with renewed diaphragms and fixed electrodes, combined with an
  anti-resonance arc structure and sheepskin ear pads. The design balances
  enhanced clarity and sound details with profound resonant qualities, honoring
  the vintage aesthetic of the original 007 series.
specs: |-
  - Type: Push-pull electrostatic large circular sound element, open-air type enclosure
  - Sound element shape: Large round shape
  - Frequency response: 6 – 41,000 Hz
  - Electrostatic capacitance: 110 pF (including cable)
  - Impedance: 145 kΩ (including cable, at 10 kHz)
  - Sound pressure sensitivity: 101 dB / input 100 Vr.m.s. / 1 kHz
  - Bias voltage: DC 580 V
  - Right/left channel indication: Golden solid line (left) and dotted line (right) on the cable
  - Earpad: Genuine leather (skin touching portion), high-quality artificial leather (surrounding portion)
  - Cable: OFC parallel 6-strand, low-capacity special wide cable, 2.5 m
  - Weight: 430 g (without cable)
io:
  - name: Captive cable (Pro Bias)
    signalFlow: input
    category: audio
    type: headphone
    connection: 5-pin din
    maxConnections: 1
    position: Bottom
