description: The Pro-Mod DK24 HH 2PT CM LH is a left-handed, modern
  high-performance Dinky-style electric guitar built for the progressive player.
  It pairs an alder body with a caramelized maple bolt-on neck and
  compound-radius caramelized maple fingerboard, loaded with Seymour Duncan
  humbuckers and a Gotoh Custom 510 tremolo.
details: |-
  Charvel turns modern high performance on its head with the Pro-Mod DK24 HH 2PT CM LH, a left-handed instrument aimed at the progressive guitarist searching for an unparalleled spectrum of sound. The classic Dinky-style alder body is contoured with a sculpted shredder's cut heel and scalloped lower back bout for unhindered upper-fret access and balance.

  The bolt-on caramelized maple neck is graphite-reinforced and finished in hand-rubbed satin urethane, with a Speed Neck profile and rolled fingerboard edges that feel broken-in straight out of the case. The 25.5" scale caramelized maple fingerboard carries a 12"-16" compound radius, 24 jumbo frets, 4mm pearloid dot inlays, and Luminlay side dots for low-light visibility.

  Electronics are anchored by a Seymour Duncan Full Shred TB-10 in the bridge and a Seymour Duncan Alnico II Pro APH-1N at the neck, routed through a 5-position blade switch with an additional 2-way mini toggle for series/parallel humbucker voicing. Volume duties go to a low-friction EVH Bourns 500K potentiometer paired with a no-load tone control for maximum signal clarity when wide open.

  Hardware includes a Gotoh Custom 510 tremolo with steel block, Charvel-branded die-cast locking tuners, a Graph Tech TUSQ XL nut (1.6875" wide), a licensed Fender Stratocaster headstock, a beveled jack, and a heel-mount truss rod adjustment wheel. The guitar ships strung with .009-.042 nickel-plated steel strings; a gig bag is available as an optional accessory.
