description: A two-channel passive random signal generator that produces clicks,
  fizzes and chaotic CV/audio signals from an input CV source, in a hybrid
  0hp/1U format.
details: |-
  Things are about to get a little weird

  Taking inspiration from the famous Razmasynth Super Warp Generator , the Caos Generator is the product of a collaboration with the fine folks over at Caos Modular. With two channels of something-from-nothing signal generating capability, there is much to like about the Caos Generator - merely input CV of your choosing, and see how the output will generate strange clicks, fizzes, hisses and chatter, giving you both a delightful sound and CV source to experiment with. Oh, but it gets better - the LEDs glow in glorious RGB colors, and Input 1 is normalled to Input 2, meaning you can get two kinds of strangeness with just one signal. Connect it to a solar panel, an LFO, an envelope generator or even a sound source, and behold as the strangeness unfolds before your ears. Some modules are there to provide utility or to solve problems. This module is here to create the absolute opposite - and you will revel in the chaos. No power, no space? No problem. The hybrid 1U/0hp format means you can easily install it as a 1U unit in a 1U rail, or take it on the go (or on the run) with a brass-threaded enclosure, allowing you to install and uninstall it at your leisure.
specs: |-
  - Generate random CV and audio rate signals with CV inputs
  - Use both channels in tandem, or independently
  - Enjoy the glory of the softly glowing LEDs
  - Passive design: no batteries required or power supply required
