description: Compact, stylish, and powerful, the FRFR-GO delivers full-range
  flat-response sound that faithfully represents every nuance of an amp
  modeler's tone. This 30W amp is designed for musicians who are always on the
  go, with up to 13 hours of battery life, Bluetooth streaming and flexible
  input options.
details: |-
  The FRFR-GO is a full-range flat-response amplifier built as a partner for amp modelers. Unlike traditional guitar amps that can color the sound, it is precision-tuned for full-range flat-response performance, so it preserves the pure tone of an amp modeler or pedalboard with no loss of character.

  Two custom 3-inch speakers and 30 watts of clean power deliver amp and cabinet emulations with clarity and volume. Output is rated at 30W (2x15W) on main power and 24W (2x12W) on battery power, with a maximum peak SPL of 109.4 dB and a frequency response of 75 Hz to 20 kHz.

  Weighing 7.4 lbs (3.35 kg) and fitted with a carry handle, the cabinet is built to move, and the rechargeable lithium-ion battery allows up to 13 hours of playing away from mains power.

  Onboard bass and treble EQ allows quick adjustments on the fly without tweaking the amp modeler, so the sound can be fine-tuned to fit any space, from small rooms to open outdoor spaces.

  A 1/4-inch line-level input connects an amp modeler directly, a stereo 1/8-inch aux input takes a backing track or drum machine, and Bluetooth streams audio wirelessly from any Bluetooth-enabled device. Plugging in headphones allows late-night practice, and Bluetooth streaming still works while headphones are in use.
specs: |-
  - Dual 3-inch speakers for accurate guitar amp and cabinet emulations
  - Output power (peak): 30W (2x15W) when using main power, 24W (2x12W) when using battery power
  - Maximum SPL: 109.4 dB (peak)
  - Frequency response: 75 Hz to 20 kHz (-10 dB)
  - Bass and Treble EQ for quick sound adjustments
  - Input: 1/4-inch (6.35 mm) line-level amp modeler mono input
  - Aux input: 1/8-inch (3.5 mm) line-level stereo input
  - Headphones output: 1/8-inch (3.5 mm) stereo output
  - Amp modeler maximum input level: 0 dB
  - Headphone impedance: 22 ohms (typical 282 mW per channel, under 1% THD using 32 ohm headphones)
  - Bluetooth 5.0, A2DP and AVRCP profiles, SBC codec, range up to 100 feet (30.5 m)
  - Up to 13 hours of battery life from the built-in rechargeable battery
  - Power: C7 power cable, 100-120V 50/60Hz or 220-240V 50-60Hz, 45W consumption
  - Protection: electronic soft clip, thermal, and transducer overdrive protection
  - Enclosure: vinyl-wrapped MDF with cloth grille and rear bass port
  - Operating temperature: 0C to 45C (32F to 113F)
  - Dimensions (width x depth x height): 12.6 x 5.91 x 7.24 inches (320 x 150 x 184 mm)
  - Weight: 7.39 lbs (3.35 kg)
