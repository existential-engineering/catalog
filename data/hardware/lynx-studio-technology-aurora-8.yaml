description: The Aurora 8 AD/DA provides analog to digital and digital to analog
  conversion in a compact one-rack space format, with sample rates up to 192
  kHz. It carries simultaneous 8 channel analog and 8 channel AES/EBU I/O plus
  Lynx SynchroLock word clock.
details: |-
  The Aurora 8 AD/DA provides world-class analog to digital and digital to analog conversion in a compact one-rack space format. With sample rates up to 192 kHz, Aurora offers wide, open, uncompressed and unequalised audio for studios, mastering facilities, remote recording, broadcast and production. Lynx's exclusive SynchroLock word clock offers extreme jitter reduction, providing clean digital audio signals for Aurora and other digital devices in the studio.

  Simultaneous 8 channel analog and 8 channel AES/EBU I/O is provided, with 24 bit / 192 kHz mastering quality A/D and D/A conversion. The AES/EBU I/O runs at up to 192 kHz and supports both single wire and dual wire modes, and an on-board 16 channel digital mixer provides flexible I/O routing. Word clock I/O carries the Lynx SynchroLock sample clock technology, and extensive remote control is available through the Lynx AES16 and AES16e cards.

  LSlot connectivity options mean the connection to a host or network can be changed whenever it needs to be. Lynx list USB, Thunderbolt, Pro Tools HD and Dante LSlot cards as the options available for the bay.

  The Aurora 8 was discontinued in 2017, and its product page points readers to the Aurora(n).
specs: |-
  - Simultaneous 8 channel analog and 8 channel AES/EBU I/O
  - 24 bit / 192 kHz mastering quality A/D and D/A conversion
  - 192 kHz AES/EBU I/O supporting single and dual wire modes
  - On-board 16 channel digital mixer provides flexible I/O routing
  - Extensive remote control capability via Lynx AES16, AES16e
  - Word clock I/O with Lynx SynchroLock sample clock technology
  - Line in L/R THD+N: -108dB @1kHz, -1dBFS, -104dB @1kHz, -6dBFS
  - Line in L/R dynamic range: 117dB, A-weighted
  - Line in L/R frequency response: ±0.10dB, 20-20kHz
  - Line in L/R crosstalk: -120dB maximum @ 1kHz, -1dBFS signal
  - Line out L/R THD+N: -107dB @1kHz, -1dBFS, -106dB @1kHz, -6dBFS
  - Line out L/R dynamic range: 117dB, A-weighted
  - Line out L/R frequency response: ±0.01dB, 20-20kHz
  - Line out L/R crosstalk: 120dB maximum @ 1kHz, -1dBFS signal
  - Digital I/O: 8 inputs and 8 outputs, 24 bit AES/EBU format, transformer coupled
  - Sample rates: all standard rates and variable rates up to 192kHz in both single-wire and dual-wire modes
  - Analog I/O ports: 25-pin female D-sub connectors
  - Digital I/O port: one 25-pin female D-sub connector carrying AES/EBU inputs and outputs 1-8, Yamaha digital pinout
  - External clock: 75 ohm BNC word clock input and output
  - MIDI (for firmware updates only): one input and one output, standard optoisolated, 5-pin female DIN connectors
  - AC power: 100 / 115 / 230 VAC, 70 watts
  - Size: 1.75" H x 19" W x 9" D
  - Shipping weight: 12 pounds
  - Certifications: CE and FCC Class B EMI, CE product safety
  - LSlot expansion bay accepts USB, Thunderbolt, Pro Tools HD and Dante cards
