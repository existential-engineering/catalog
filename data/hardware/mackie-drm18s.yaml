description: The Mackie DRM18S is an 18" powered subwoofer that delivers 2000W
  of Class-D power, cutting-edge technology, and deep low-end for both mobile
  and permanent install applications.
details: |-
  If you want to complete your PA with serious low-end, the Mackie DRM18S powered subwoofer is a solution. Decades of innovation in DSP technology and amplifier design allowed us to optimize the DRM18S to its fullest potential. With ultra-efficient power, an over-engineered cabinet, and Advanced Impulse DSP tuning, the DRM18S has what you need to shake the room.

  The DRM18S 2000W 18 inch Professional Powered Subwoofer delivers power via an ultra-efficient Class-D amplifier with next-gen protection and Power Factor Correction technology.

  Advanced Impulse DSP provides acoustic correction via precision tuned FIR filters. The DRM Control Dashboard features a high-contrast, full-color display for quick access to metering, crossover settings and more.

  Subwoofers are naturally omni-directional, which can cause bass buildup and feedback issues on stage. Cardioid subwoofer setups use multiple subwoofers with one facing in the opposite direction, and the DRM18S has settings in the DRM Control Dashboard that make that arrangement easy, side by side or in a stack.

  Designed to match the rest of the DRM Series, the DRM18S is stackable, flyable, and equipped with a pole cup.
specs: |-
  - 2000W peak Class-D amplification
  - Frequency range 30 Hz - 120 Hz (-10 dB), 35 Hz - 160 Hz (-3 dB)
  - Max SPL 135 dB peak
  - 18 in / 457 mm ferrite woofer
  - Advanced Impulse DSP with precision tuned FIR filters for acoustic correction
  - Variable crossover plus a DRM full-range loudspeaker preset
  - Cardioid mode (front / rear) for directional subwoofer arrays
  - Polarity invert (normal / invert)
  - Alignment delay 0-100 ms
  - Six user presets, system lock with 4-digit passcode
  - Dual independent input channels: 2x female XLR and 1/4 in balanced combo inputs (8 kOhm balanced)
  - Male XLR direct outs and high-pass outs (600 Ohm balanced)
  - Universal switchmode power supply 100-240 VAC, 50-60 Hz, 110W, with Power Factor Correction
  - 3-pin IEC 250 VAC 10 A AC connector
  - 18 mm plywood enclosure with black polyurea finish, powder-coated 16-18 gauge steel grille
  - M20 threaded pole attachment, M10 flypoints, flyable via optional FB100 fly bar and FKDRM18S flyware kit
  - Dimensions 23.3 x 23.0 x 31.1 in / 592 x 584 x 790 mm (H x W x D)
  - Weight 90.0 lb / 40.8 kg
