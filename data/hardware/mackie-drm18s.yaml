url: https://mackie.com/en/products/loudspeakers/drm-powered-series/DRM18S.html
description: 'The Mackie DRM18S 18" 2000 Watt Powered Subwoofer delivers deep
  low-end response and cutting-edge DSP for DJs, musicians, and venues that need
  reliable professional loudspeaker systems for both mobile and install
  applications.'
details: |-
  If you want to complete your PA with serious low-end, the Mackie DRM18S powered subwoofer is the ultimate solution. Decades of innovation in DSP technology and amplifier design allowed us to optimize the DRM18S to its fullest potential. With ultra-efficient power, an over-engineered cabinet, and Advanced Impulse DSP tuning, the Mackie DRM18S has everything you need to shake the room.

  When setup time is limited, changes need to happen on the fly, or you just want to get your system going without extra hassle, the last thing you need is the controls on your loudspeakers being difficult. The DRM Control Dashboard starts with a big, bright, full-color display that is easy to read and offers unmatched visual feedback on levels, adjustments, and more.

  Subwoofers are naturally omni-directional. This means that the sound they project goes in all directions. This can sometimes cause excess bass buildup, feedback issues, and more on stage. That's where cardioid comes in. Cardioid subwoofer setups are incredibly helpful when you want all that rumble off of the stage and out to your audience.
specs: |-
  - 2000W Class-D amplifier
  - 18" High-excursion woofer
  - Frequency Response: 30Hz - 120Hz
  - Max SPL: 135 dB
  - Weight: 90 lb / 40.8 kg
  - Universal power supply (100-240 VAC) with Power Factor Correction
  - Advanced Impulse DSP Module
  - 18mm plywood construction with internal bracing
