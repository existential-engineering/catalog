details: |-
  The U1B expands on one of Córdoba's most popular ukuleles, the U1. Perfect for beginners and enthusiasts, the U1B features a baritone-sized body and is built with a Mahogany top, back, and sides. You'll enjoy this ukulele's full, balanced, and happy tone with each strum. Its light satin finish and abalone-style rosette create a classic look and premium Italian Aquila Nylgut strings hold their D-G-B-E tuning.
specs: |-
  - Construction: Layered
  - Bridge Material: Pau Ferro
  - Fingerboard Material: Pau Ferro
  - Neck Material: Mahogany
  - Nut Material: Composite
  - Saddle Material: Composite
  - Back and Sides Wood: Mahogany
  - Body Top: Mahogany
  - Color: Natural (NAT)
  - Finish: Satin Polyurethane
  - Frets to Body: 14
  - Neck Joint: Dowel Joint
  - Neck Shape: C Shape
  - Top Bracing Pattern: Fan
  - Fingerboard Inlays: 4mm Dots - Pearloid
  - Frets Total: 18
  - Headplate: Mahogany
  - Nut String Spacing: 28.5mm
  - Nut Width: 35mm (1 3/8")
  - Number of Strings: 4
  - Rosette: Abalone-style Decal
  - Tuning: D-G-B-E
  - Country of Origin: China
