details: |-
  The Catalinbread EG1 is spreading over the airwaves and there is no known method to stop it. Imagine if you will, a lo-fi delay with three selectable transmission methods, each equipped with their own processing artifacts, coming together with a heavily fortified delay engine to take the concept of signal fidelity beyond a word and into a feeling. All the standard delay parameters remain intact as well as tap tempo functionality to truly insert you into the datastream.

  The second release in Catalinbread's tap tempo platform, the EG1 is a lo-fi delay pedal that deep-dives into what "low fidelity" really means. Truly explore the peripheral quirks of classic technologies with a straightforward feature set built outright for maximum sonic possibilities. Featuring three different modes of signal transmission, including Radio, Digital Television and Tape with corresponding mode-dependent parameters, the EG1 is a genre-bending meta processor that instantly gels with any genre of music from straightforward country slapback to wall-of-sound shoegaze. The EG1's Mod knob depends on the mode, giving you aggressive filtering, Nyquist error downsampling or degrading mechanical wobbling. All the bells and whistles you've come to expect from a premium delay are also found on the EG1: an enhanced mix control that gives you true-wet and dry blends, feedback, ~900ms of delay, integrated tap tempo, higher dynamic range, more headroom and an enhanced signal processing experience overall. The transmission has been cast into the ether, and now it is your job to receive it. Do you dare?
