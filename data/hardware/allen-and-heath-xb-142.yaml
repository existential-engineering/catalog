details: |-
  Compact Broadcast Mixer. XB-14-2 offers a host of specialised broadcast features that normally come at a much higher price, including telephone communication (telco) channels, mic channel ON switch sensing, stereo channel start/cue outputs for playback device control, automatic muting of speaker outputs and much more.

  DuoPre Preamps — with 69dB of gain available on the mic inputs, the XB-14-2 preamps are optimised for the low-output dynamic microphones used in broadcast applications.

  USB Audio Interface — the class-compliant USB audio interface features useful routing options for recording and broadcast applications.

  Audition Bus — the dedicated stereo audition bus can be used for auditioning or off-air recording. Press the Audition button to transfer the mix from the program feed over to the audition bus.

  Telco — two Telco channels provide a selectable clean-feed output (LR PGM, Aux or Audition bus), variable high-pass and low-pass filters to optimise the frequency range of telephone callers, and a Talk button.

  Upgraded and Improved — the evolution of the XB-14. XB-14-2 incorporates new features based on feedback from broadcasters who have built their operations around the original XB-14.

  Routing — wealth of routing options, dual stereo channels for up to 7 stereo sources, dedicated Audition bus, enhanced microphone preamps and stereo channel gain range. Designed for small radio and internet broadcasters as well as larger studios with multiple rooms.

  Remote Control — 27 logic I/O for remote control and 15 configuration switches make XB-14-2 a highly flexible solution.

  Self or Producer Operated — whether you need a mixer for a self-operated broadcast situation, or whether you have a separate studio and engineer, the XB-14-2 has the features to fit.

  Separate monitor mixes can be created for operator and guests or presenter, so the engineer can check levels and cue sources while the presenter or guest can listen to a different source. The engineer/producer can communicate to the guest or presenter using the Talk feature, as well as speaking off-air with telephone callers.

  Remote control of channel mutes from the studio via the remote interface connectors — ideal for studio situated mute or 'cough' switches.
specs: |-
  - Dual stereo channels supporting up to 7 stereo sources
  - 2 Telco channels with selectable clean-feed (LR PGM, Aux or Audition bus), variable HPF/LPF, and Talk button
  - DuoPre mic preamps with 69 dB of gain
  - Class-compliant USB audio interface
  - Dedicated stereo Audition bus
  - 27 logic I/O for remote control
  - 15 configuration switches
