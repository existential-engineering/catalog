description: The D1 T is a Traditional Series dreadnought acoustic guitar
  designed to evoke the character of coveted pre-war instruments. It features a
  Sitka spruce top with Honduran mahogany back, sides, and neck, voiced for
  warm, rounded highs and a present low midrange with quick attack and strong
  projection. The pre-war scalloped X-brace pattern and vintage-inspired
  appointments give it a slightly looser, more broken-in feel compared to the
  standard D1.
details: |-
  The D1 T belongs to the Traditional Series, a line engineered to capture the tonal qualities of pre-war dreadnoughts. The top is Sitka spruce braced with a custom traditional series pre-war scalloped X-brace pattern, while the back and sides are Honduran mahogany — a combination that produces warm, rounded highs and a present low midrange while retaining a quick attack and strong projection. The ebony fingerboard carries gold MOP long dot inlays, and the ebony peghead veneer bears a gold MOP Collings logo. Binding is tortoise with custom wood purflings, and the rosette is a custom wood design. The neck joins the body via a mortise and tenon hybrid joint and carries a fully adjustable truss rod.
specs: |-
  - Body Style: Dreadnought
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Bridge: Ebony belly-style, 2 5/16" spacing
  - Nut: Bone, 1 3/4"
  - Saddle: Bone, cutthrough
  - Tuners: Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Bracing: Pre-war scalloped X-brace (Sitka spruce)
  - Fingerboard Inlays: Gold MOP long dots
  - Body Binding: Tortoise with custom wood purflings
  - Pickguard: Tortoise
  - Backstrip: 1-style (Walnut)
  - Rosette: Custom wood
  - Scale Length: 25 1/2"
  - Fingerboard Radius: 14" - 26" compound
  - Neck Profile: Traditional
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 15 5/8"
  - Body Length: 20"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/4"
  - Strings: D'Addario EJ-17 (.013" - .056")
