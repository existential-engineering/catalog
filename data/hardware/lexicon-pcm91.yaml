url: https://lexiconpro.com/en-US/products/pcm91
description: 2-in/2-out Studio Standard/Live Sound Reverb Processor. Compact,
  affordable reverb processor with dual reverb algorithms, dynamic
  spatialization, and full AES/EBU I/O.
specs: |-
  - 1U rack-mount studio/live sound reverb processor
  - Dual reverb algorithms with dynamic spatialization for 2-channel or surround applications
  - Includes all features of the PCM 90 plus full AES/EBU I/O
  - Designed for realistic small-space ambiences (phone booth, drum room) as well as large halls
  - Sample rates: 44.1 kHz and 48 kHz
  - 24-bit A/D and 24-bit D/A converters; 20-bit internal DSP
  - Frequency response: 10 Hz - 20 kHz +/- 0.5 dB
  - THD: < 0.006%
  - Dynamic range: D/A > 98 dB, A/D > 105 dB, A/A > 96 dB
  - Crosstalk: -55 dB
  - Balanced analog I/O on XLR and 1/4-inch TRS
  - Digital I/O: AES/EBU (XLR) and S/PDIF (coaxial RCA)
  - MIDI In/Out/Thru on 5-pin DIN; footswitch and foot controller support
  - PCMCIA memory card slot for preset storage
  - Dimensions: 19" W x 1.75" H (1U) x 12" D
  - Weight: 6.4 lbs
  - Power: 100-240 V AC, 50-60 Hz, 35 W
