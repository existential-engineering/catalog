description: The Aviator Cub UK is a single-channel guitar combo amplifier
  offering three switchable voicings (AC, AC Top Boost, and JMP) with up to 50
  watts through a custom Eminence 12-inch speaker.
details: |-
  The Aviator Cub UK is designed to give you the ultimate flexibility and performance in a single-channel combo amplifier. With three iconic tones—'AC, 'AC Top Boost, and 'JMP'—all easily accessible at the turn of a knob, this amp allows you to quickly dial in the perfect sound for any style or mood. Whether you're chasing the classic warmth of an AC, the bright chime of a Top Boosted AC, or the punchy power of a JMP, the Aviator Cub UK delivers exceptional tone without compromise. We've teamed up with Eminence, a world-renowned speaker manufacturer, to create a custom 12-inch speaker that captures the essence of vintage greenbacks, yet handles up to 50 watts of power. This means you can enjoy classic, vintage-inspired sound with the reliability and headroom needed for modern playing. Lightweight, powerful, and economical, the Aviator Cub UK is the perfect amp for players who want top-tier tone and portability, without breaking the bank. Whether you're on stage, in the studio, or practicing at home, this amp ensures you're always ready to play your best. -
