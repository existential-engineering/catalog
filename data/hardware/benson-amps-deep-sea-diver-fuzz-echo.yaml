description: Jessica Dobson signature fuzz-echo pedal with switchable signal chain order.
details: |-
  Designed in collaboration with Jessica Dobson. Combines a silicon fuzz circuit
  with a PT2399-based echo. The signal chain order (fuzz into echo, or echo into
  fuzz) is user-switchable. Runs on 9VDC center-negative at under 100mA.
specs: |-
  - Power: 9VDC center-negative, <100mA
  - Circuit: silicon fuzz + PT2399 echo
  - Switchable signal chain order (fuzz→echo or echo→fuzz)
