description: >-
  The Kurzweil K2000 is a V.A.S.T.-powered workstation combining 8 MB of ROM samples with
  31 sound-shaping algorithms, an optional sampler, multi-effects, and a 32-track sequencer.
details: |-
  Launched in 1991, the K2000 introduced Kurzweil's Variable Architecture Synthesis Technology (V.A.S.T.), which became the foundation for their entire professional keyboard line. V.A.S.T. allowed any multi-sample, noise source, or waveform to be processed through 31 different sound-shaping algorithms encompassing resonant filters, EQ, amplitude modulation, distortion, waveshaping, pulse width modulation, hard sync, and more, all with real-time MIDI control.

  The internal 8 MB ROM held a comprehensive sample library of superb quality, and the K2000S model added sampling capability with 2 MB of RAM expandable to 64 MB. Analog and digital inputs supported stereo sampling, and the built-in 3.5-inch disk drive plus SCSI port provided flexible storage options. Expansion boards including the Orchestral and Contemporary ROM sets could bring total ROM to 24 MB.

  The built-in 32-track sequencer offered 768 ppq resolution, nondestructive editing, and groove quantizing. Stereo multi-effects processing delivered four simultaneous effects including reverb, chorus, delay, flange, and rotary simulation. Six polyphonic audio outputs provided flexible routing in studio environments.

  The K2000's build quality matched its feature set, with an elegant layout, high-quality pitch and mod wheels, and a responsive 61-key keyboard with velocity and aftertouch. It became a staple instrument for a remarkably diverse roster of artists including Robert Miles, Pink Floyd, Depeche Mode, Nine Inch Nails, Tori Amos, Massive Attack, and Vangelis, demonstrating its versatility across electronic, progressive, and pop genres.
specs: |-
  - Polyphony: 24 voices
  - Oscillators: V.A.S.T. synthesis with 8 MB ROM samples (expandable to 24 MB)
  - Filter: Digital filters with 31 sound-shaping algorithms
  - Effects: Stereo multi-effects with 4 simultaneous effects (reverb, chorus, delay, flange, rotary simulation)
  - Sampler: Optional 2 MB RAM (expandable to 64 MB) on K2000S
  - Sequencer: 32-track, 768 ppq resolution
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 200 patches, 100 setups; SCSI port
  - Control: MIDI (16 parts)
