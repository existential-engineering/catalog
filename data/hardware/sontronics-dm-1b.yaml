details: |-
  Classy condenser microphone perfectly suited to kick drum and bass instruments

  The Sontronics DM-1B is a large-diaphragm condenser microphone originally designed for kick drum during a three-year project that also resulted in our DM-1S for snare and DM-1T for tom tom. Developed with the help of top producers, recording engineers and drummers, all three microphones have become must-have tools for anyone serious about capturing that perfect drum sound, whether for live performance or in the studio. Thanks to its incredible sensitivity and its ability to handle high sound pressure levels of up to 155dB, DM-1B delivers outstanding results on kick drum, capturing all the attack, resonance and energy like nothing you've heard before! DM-1B also sounds stunning when used with all kinds of bass instruments, from bass guitar cabinets and double bass to baritone sax and tuba. The DM-1B is an 'end-fire' microphone meaning its cardioid capsule faces out of the top end of the mic. To get the best possible sound from your kick drum, this end should be placed facing the front head of the drum or even pushed slightly inside the soundhole. Whether you're using the DM-1B in a Glyn Johns-style mic set-up or using it together with DM-1S and DM-1T on snare and toms plus overhead or room mics, the DM-1B will reproduce all the energy you hear from your kick drum, wherever you are: on stage, at home or in a professional studio. Positioned in front of your bass guitar cabinet or at the bell of your sax, bass clarinet or brass instrument, the DM-1B will sound sublime on all kinds of low-end sources, even male vocals too!
specs: |-
  - Large-Diaphragm Condenser: Specifically designed for capturing the deep, powerful tones of kick drums and bass instruments with precision and clarity.
  - High-SPL Handling: Capable of handling extremely high sound pressure levels (up to 155dB), making it ideal for loud sources without distortion.
  - Tailored Frequency Response: Optimised to capture the low-end thump and punch of kick drums and bass, while maintaining clear attack and detail.
  - Robust Build Quality: Constructed with durability in mind, the DM-1B is built to withstand the demands of both studio recording and live performances.
  - Low Noise Floor: Designed with minimal self-noise, ensuring clean, professional-quality recordings with no unwanted background noise.
  - Phantom Power Requirement: Requires phantom power, ensuring optimal performance and signal clarity for capturing bass-heavy sources.
  - Easy Positioning: Compact and easy to position inside or outside a kick drum, or close to bass amps, for the best possible sound capture.
  - Versatile Application: Not just for kick drums—also excels at capturing other bass-rich instruments like double bass, tuba, and low brass.
  - Designed for Close Miking: Ideal for close-miking situations where precision and clarity of low frequencies are critical.
  - Popular with Professionals: A go-to choice for drummers and recording engineers seeking reliable, high-quality bass capture in studio and live settings.
