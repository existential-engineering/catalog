description: >-
  The Waldorf Microwave II is a rack-mount digital wavetable synthesizer released in 1997,
  expanding upon the original Microwave with increased polyphony, onboard effects, and
  additional patch memory. Its synthesis engine traces directly back to the legendary PPG
  Wave 2.x architecture, delivering complex evolving timbres through 65 preset and 32 user
  wavetables. Notable users include Nine Inch Nails, Vangelis, Hardfloor, and Jimmy Edgar.
details: |-
  The Microwave II represents Waldorf's evolution of their popular original Microwave synth, introduced eight years prior. At its heart lay a digital polyphonic wavetable synth engine derived from the legendary PPG Wave 2.x. The original Microwave earned praise for its powerful synthesis capabilities, and the MKII iteration addressed its usability shortcomings by introducing an onboard effects processor and four quick-edit rotary knobs beneath the LCD display for real-time parameter tweaking.

  A significant design shift occurred with Waldorf's move to purely digital circuitry, replacing the analog filters and VCAs of the original. While this modernization was standard practice for 1997, the warmth and character of the sound changed compared to its predecessor. The Microwave II offered 10-voice polyphony with two oscillators per voice, 13 digital filter models, a programmable arpeggiator, and built-in effects.

  Despite the sonic trade-offs from the all-digital architecture, the Microwave II achieved commercial success and spawned the more hands-on Microwave XT variant, which added a keyboard and additional controls. The synthesizer remains a sought-after instrument for producers looking for complex wavetable sounds in a compact rack-mount format.
specs: |-
  - 10-voice polyphony
  - 2 oscillators per voice with 64MB DSP wavetable synthesis
  - 65 preset and 32 user wavetables
  - Oscillator sync and FM modulation
  - 13 digital filter models (12/24dB LP, BP, HP, Notch, waveshaper, bit-reduction, dual BP)
  - Additional 6dB LP/HP filter with keytracking
  - 2 ADSR envelopes plus 1 free envelope
  - 2 LFOs (sine, triangle, square, random, sample-and-hold)
  - Ring modulator and noise generator
  - Effects: Chorus, Flanger, Autowah, Overdrive, Delay, Amp Mod
  - Programmable arpeggiator with 16 steps and 128 patterns
  - 256 user patches, 128 performance patches
  - MIDI control only
  - Rack-mount format
