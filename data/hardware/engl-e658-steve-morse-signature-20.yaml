description: Compact two-channel Steve Morse signature guitar amplifier head
  with a built-in noise gate, delay, reverb, IR loader, MIDI and a headphone
  output.
details: |-
  Steve Morse, known for his work with bands like Deep Purple and the Dixie Dregs, announced a collaboration with ENGL Amps. The result of this partnership is a small signature head aimed at the precision and clarity Morse is known for.

  The head, named the Steve Morse Signature 20, is a compact and versatile amplifier. With two channels, guitarists can dial in a wide range of tones to suit their playing style.

  What makes this signature head stand out is its preamp and power amp design. The clean channel offers a warm and articulate sound, while the lead channel delivers a classic rock tone with just the right amount of grit. The gain stage produces a sound that can go from smooth and creamy to aggressive and punchy with a twist of a knob.

  The E658 also features a built-in noise gate for high-gain playing without unwanted noise. For more tonal options, the head has a built-in delay and reverb as well as an IR loader, MIDI and a headphone out. With its compact size and feature set, this head suits guitarists of many styles and genres.
specs: |-
  - Two channels: clean and lead
  - Built-in noise gate
  - Built-in delay and reverb
  - Impulse response loader
  - MIDI control
  - Headphone output for silent practice
  - Compact head format
