  Input Impedance
  24kΩ

  Max Input Level
  27.5dBu

  Distortion
  0.008% at 1kHz

  Mic Preamp

  Input Impedance
  3.6kΩ with pad out, 7.2kΩ with pad in

  Gain
  20 to 66dB

  Pad Attenuation
  20dB

  Line Output

  Output Impedance
  50Ω

  Max Output Level
  +22dBu

  General

  Colour Controls Gain Range
  -6 to +12dB

  Trim Control Gain Range
  -14 to +10dB (unity at center)

  Distortion
  0.005% at 1kHz with Colour section bypassed, 0.008% with Colour section engaged

  Frequency Response
  ±0.2dB 20Hz to 20kHz rel. 1kHz

  Power Rails
  ±16vDC, +48vDC

  Power Input
  100-240VAC, ~50/60Hz 2.5A

  Dimensions
  19" x 1.75" x 8.5"

