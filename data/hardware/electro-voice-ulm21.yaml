description: The ULM21 is a rugged cardioid lavalier microphone built around a
  back-electret condenser element. Its small form factor and directional pick-up
  pattern help reduce feedback and improve sound quality in presentation,
  broadcast, and houses-of-worship use. The clothing clip attaches at the
  microphone body to maintain the cardioid pattern when worn on talent. An
  integrated 6-foot (180 cm) cable terminates in a TA4F connector, making it
  directly compatible with all Electro-Voice bodypack transmitters. For wired
  applications it can be paired with the EV TXA adapter to feed a standard 3-pin
  XLR mic input.
details: |-
  Back-electret cardioid condenser lavalier microphone

  Directional pick-up pattern helps reduce feedback and improve sound quality

  Clothing clip attaches at the microphone body to maintain cardioid pattern

  Integrated 6-foot (180 cm) cable

  TA4F connector compatible with all EV bodypack transmitters

  Use with EV TXA adapter for wired XLR applications
