name: 503 Power
manufacturer: lindell-audio
primaryCategory: rack-mount
categories:
  - utility
  - analog
url: https://lindellaudio.com/en/products/503-power
description: The 503 Power is a 3-slot 500 Series compatible power supply
  featuring 2.4A of power. It features gold plated XLR inputs and outputs.
details: |-
  The 503 Power is a 3-slot 500 Series compatible power supply. It features 2.4A of power and is a match for Lindell's own 500 Series modules, including the 6X-500, 7X-500 and PEX-500.

  The 503 Power features XLR inputs and outputs in a no frills, straightforward unit built in an aluminium cabinet with steel M3 threads, and it ships with a neoprene gig bag.
specs: |-
  - 3 slots
  - 800mA of power per slot
  - +/-16V rails
  - 48V phantom power
  - Gold plated XLR inputs and outputs
  - Built in universal power supply: 90-250V
  - Overload protection
  - Short circuit protection
  - Power rail LED indication
  - Aluminium cabinet
  - Lightweight
  - Steel M3 threads
  - Comes with a neoprene gig bag
