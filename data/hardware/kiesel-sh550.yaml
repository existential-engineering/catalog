details: |-
  The SH550, though popular in jazz and blues, is relevant to any style of music. A plethora of top woods are selectable on this semi-hollow body instrument, resulting in a typically lighter weight for a large-bodied instrument.

  F-holes are carved into the top to further add to the resonant tone and classic aesthetic. A set-neck further adds to a fuller, long-sustaining sound.

  The gallery shows the model with finishes and appointments including white/white with gold hardware and mother of pearl block inlays, green sparkle metal flake with chrome hardware, flamed maple with a tiger's eye finish over a mahogany body, koa with black hardware and abalone diamond inlays, and spalted maple in vintage burst with a maple fingerboard.
specs: |-
  - Scale length: 25"
  - Frets: 22 stainless steel medium-jumbo, .103" wide x .048" tall
  - Body: semi-hollow mahogany with plain maple carved top and carved F-holes, 39" long, 2.6" thick, 14.1" wide
  - Neck: tung-oiled mahogany with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69" at nut, 0.79" thick at 1st fret, 0.88" thick at 12th fret
  - Construction: set neck
  - Fingerboard: ebony with 14" radius
  - Headstock: traditional style headstock with flamed maple overlay
  - Bridge: Tune-O-Matic with stop piece, .4125" (10.5mm) spacing
  - Pickups: bezel-mount Kiesel Beryllium humbuckers
  - Electronics: master volume, push/pull tone with coil splitter, 3-way pickup selector
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Hardware: chrome
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Strings: Elixir Nanoweb 1046E
  - Weight: 8.25 lbs
  - Many top woods are selectable, and the gallery notes a MIDI option designated SH575
