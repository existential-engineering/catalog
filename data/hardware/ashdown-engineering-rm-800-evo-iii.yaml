description: Delivering 800 watts of iconic Ashdown tone in a lightweight head,
  the Rootmaster 800 EVO III packs a versatile EQ, Sub Harmonic Generator,
  compression and Valve Emulated Drive, plus an Analogue Cab Sim DI output for
  seamless live or studio use.
details: |-
  The Rootmaster 800 EVO III is a precision-engineered 800-watt bass head with a comprehensive EQ system, the Ashdown Sub Harmonic Generator, a compression control and Valve Emulated Drive. A new Analogue Cab Sim DI output provides flexible monitoring for silent stages and in-ear mixes. With power compatibility from 115V-230V and two Neutrik Speakon/Jack outputs, it is built for the travelling bassist. High and low instrument inputs, a line input and a dedicated tuner output simplify setup, a balanced DI feeds front-of-house, and the rear panel provides an additional balanced XLR DI for post-EQ and post-effects signals. The Cab Sim DI is inspired by the ABM series with selectable enclosure type (ported or sealed), speaker voicing (10 inch or 15 inch) and a horn option for a high-end boost around 5kHz.
specs: |-
  - Power Output: 800 Watts
  - Power Requirements: 115-230 Volts
  - Impedance: Minimum 4 Ohms
  - Speaker Outputs: 2 x Neutrik Speakon/Jack outputs
  - High Instrument Input: Impedance 3.9M Ohms, input range 150mV - 20V p-p
  - Low Instrument Input: Impedance 10k Ohms, input range 300mV - 405V p-p
  - Line Input: Impedance 22k Ohms, input level 0dBu nominal
  - DI Output: 420 Ohm balanced, Level 0dBu nominal
  - Effects Send: Impedance 22k Ohm, Level 0dBu nominal
  - Effects Return: Impedance 22k Ohms, Input Level 0dBu nominal
  - Frequency Response: -3dB @ 22Hz and 25kHz
  - Signal to Noise: Better than 80dB (EQ flat)
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 340Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz shelving
  - Distortion: Less than 0.5% THD
  - H x W x D: 89 x 311 x 235 mm
  - Net Weight: 2.5 kg
