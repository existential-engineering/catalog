description: 12-inch two-way passive loudspeaker from the Electro-Voice EKX
  Series, delivering 1400 W peak / 131 dB peak SPL through high-sensitivity
  transducers and EV's Signal Synchronized Transducers (SST) waveguide for
  consistent 90 x 60 degree coverage on mid-size stages.
details: >-
  The EKX-12 is the 12-inch passive model in Electro-Voice's EKX Series of
  portable loudspeakers. It pairs an EVS-12M 300 mm (12 in) low-frequency driver
  with a DH-1M 1-inch titanium compression driver, crossed over at 1.6 kHz
  behind a Signal Synchronized Transducers (SST) waveguide that EV designs to
  produce uniform 90 degree horizontal by 60 degree vertical coverage across the
  listening area.


  The enclosure is built from 15 mm plywood with internal bracing and an EVCoat
  finish, and includes eight M10 threaded suspension points for permanent or
  temporary rigging. Aluminum pole mounts and metal handles support portable
  use, and rubber feet on the side allow the cabinet to be tilted as a 40 degree
  stage monitor.


  As a passive loudspeaker the EKX-12 requires external amplification, with
  signal connected via dual Neutrik NL4 Speakon connectors (one input, one
  parallel through) on the rear panel.
specs: |-
  - Configuration: 2-way passive loudspeaker
  - LF driver: EVS-12M 300 mm (12 in)
  - HF driver: DH-1M 1-inch titanium compression driver
  - Crossover frequency: 1.6 kHz
  - Frequency response (-3 dB): 82 Hz - 18 kHz
  - Maximum SPL: 131 dB peak
  - Power handling: 350 W continuous / 1400 W peak
  - Nominal impedance: 8 ohms (7.5 ohms minimum)
  - Axial sensitivity: 95 dB SPL (1 W @ 1 m)
  - Coverage pattern: 90 degrees H x 60 degrees V
  - Waveguide: EV Signal Synchronized Transducers (SST)
  - Monitor angle: 40 degrees
  - Connectors: Dual NL4 Speakon (input + parallel)
  - Enclosure: 15 mm plywood with internal bracing, EVCoat finish
  - Suspension: Eight M10 threaded points
  - Dimensions (H x W x D): 607 x 375 x 356 mm
  - Net weight: 17.4 kg
  - Shipping weight: 21.4 kg
