translations:
  ja:
    details: |-
      "MIKRO KPG"はKPGを8ゲート出力とすることで6HPにコンパクト化し基本的な機能はそのままに多くの方に取り入れやすい仕様となっています。

      3箇所のCV入力にシグナルをパッチすることによって複雑で多様なゲートパターンを生成するポリリズミックなゲート/トリガージェネレーターです。
      3つのCV入力のステイタス(High/Low)が変化するとアウトプットジャックが変化します。

      ・3 CV INPUT
      ・SYNC INPUT
      ・背面のトリマーでCVのスレッショルド電圧を調整可能。
      ・8 GATE / TRIGGER OUTPUT
      (背面のジャンパーをカットすることで各出力ごとにGATE/TRIGGERの設定を切り替えることができます。)

      付属品: 電源ケーブル

      Width: 6HP
      Depth: 21mm
      Power: +12V 6mA / -12V 3mA
