description: A compact 6HP Eurorack version of the KPG that generates complex
  polyrhythmic gate patterns from three CV inputs, changing its eight
  gate/trigger outputs as the CV input states toggle between high and low.
details: |-
  こちらは受注後に組み立てするBuild to Orderの商品となっております。
  お支払い確認後1〜2週間前後での納品となりますのでご了承ください。

  <商品説明>
  "MIKRO KPG"はKPGを8ゲート出力とすることで6HPに コンパクト化し基本的な機能はそのままに多くの方に取り入れやすい仕様となっています。

  3箇所のCV入力にシグナルをパッチすることによって複雑で多様なゲートパターンを生成するポリリズミックなゲート/トリガージェネレーターです。
  3つのCV入力のステイタス(High/Low)が変化するとアウトプットジャックが変化します。

  ・3 CV INPUT
  ・SYNC INPUT
  ・背面のトリマーでCVのスレッショルド電圧を調整可能。
  ・8 GATE / TRIGGER OUTPUT
  (背面のジャンパーをカットすることで 各出力ごとにGATE/TRIGGERの設定を切り替えることができます。)

  マニュアル(JP)

  Manual(ENG)

  付属品: 電源ケーブル

  Width: 6HP
  Depth: 21mm
  Power: +12V 6mA / -12V 3mA

  Built by hand in Japan.

  <注意事項>

  ※電源を入れる前に電源の接続を再度ご確認ください。
  当製品の使用により直接または間接的に発生した人身事故、機器の損傷、使用不能について、一切の責任を負いません。

  基板製造に伴い発生してしまう印刷ムラやスレ、キズなどがある場合がございますのでご了承ください。
