description: A compact 6HP Eurorack version of the KPG that generates complex
  polyrhythmic gate patterns from three CV inputs, changing its eight
  gate/trigger outputs as the CV input states toggle between high and low.
details: |-
  "MIKRO KPG" compacts the KPG into 6HP by reducing it to eight gate outputs, keeping the basic functionality intact.

  It is a polyrhythmic gate/trigger generator that produces complex and varied gate patterns from signals patched into its three CV inputs. The output jacks change as the state (high or low) of the three CV inputs changes.

  - 3 CV INPUT
  - SYNC INPUT
  - 8 GATE / TRIGGER OUTPUT (each output can be switched between gate and trigger by cutting the jumper on the rear)
  - A trimmer on the rear adjusts the CV threshold voltage

  Supplied with a power cable.

  Width: 6HP
  Depth: 21mm
  Power: +12V 6mA / -12V 3mA

  Built by hand in Japan.
