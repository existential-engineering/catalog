details: |-
  The Pierre Bensusan 'Old Lady' marks the first collaboration between master luthier, George Lowden, and the French virtuoso affectionately known as Mr DADGAD, Pierre Bensusan. The 'Old Lady' is an O-shaped cutaway handcrafted from AAAA grade Ancient Cuban Mahogany and Californian Red Cedar, featuring Sycamore body bindings and a 5-piece Mahogany neck with Maple splices. It is the first of two Lowden signature models developed with Pierre Bensusan, the second being the PB. As this guitar is an artist signature model, it is not configurable except for being available left- or right-handed. Each guitar ships with a limited lifetime warranty, a hardshell case and free worldwide shipping.
specs: |-
  - O-shaped body with cutaway
  - AAAA grade Ancient Cuban Mahogany back and sides
  - Californian Red Cedar top
  - Sycamore body bindings
  - 5-piece Mahogany neck with Maple splices
  - Handcrafted construction
  - Hardshell case included
