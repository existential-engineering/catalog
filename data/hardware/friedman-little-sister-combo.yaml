description: The Little Sister is a 20-watt, EL84 powered, single channel 1x12
  inch combo based on its 40-watt predecessor. It is voiced for the vintage
  classic rock tones of British tube amps from the 1960s and 1970s.
details: |-
  Primarily designed as a classic rock style amp, the Little Sister covers many styles of music from blues through rock and country. It is a single channel, cathode biased 20-watt design running two EL84 power tubes and three 12AX7 preamp tubes.

  The handcrafted in the USA cabinetry features tongue and groove Baltic Birch construction, and the combo houses a 16 ohm, 12 inch Celestion Creamback G12M-65 speaker that delivers the bass and mid response expected from a Friedman amplifier.

  The panel carries master volume and gain controls, a full EQ of bass, middle and treble, an S-Switch that changes the gain structure and a B-Switch for bright or tight voicing.

  Designed to take pedals, the Little Sister works with boosts, overdrives, phasers, flangers, tremolos and wahs, while the ultra-transparent series effects loop handles time-based effects pedals and rack units.
specs: |-
  - 20-watt cathode biased 1x12 inch combo
  - Single channel all-tube amplifier
  - 2 x EL84 power tubes
  - 3 x 12AX7 preamp tubes
  - Master volume and gain controls
  - Full EQ consisting of bass, middle and treble
  - S-Switch (gain structure)
  - B-Switch (bright/tight)
  - Ultra-transparent series effects loop
  - 4, 8 and 16 ohm speaker jacks
  - Celestion 16 ohm 12 inch G12M-65 Creamback speaker
  - Custom made transformers and capacitors
  - Tongue and groove Baltic Birch cabinet
  - Dimensions: 9.5 inches (D) x 24.25 inches (W) x 22 inches (H)
  - Weight: 45 lbs
  - Assembled in Los Angeles, CA
  - Limited lifetime warranty
