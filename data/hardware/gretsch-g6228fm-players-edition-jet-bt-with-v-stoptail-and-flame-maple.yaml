details: |-
  Power, Fidelity & Complete Tonal Control - The all-new G6228FM Players Edition Jet BT Single-Cut with V-Stoptail and Flame Maple gives you powerful overdrive and shimmering cleans at the stomp of a switch.

  Chambered Mahogany Bodies - Thick and Acoustically Rich - Each Jet BT begins with a select 1.85" mahogany body with tiger flame maple top that produces a strong, balanced mid-range, while the chambered body delivers a smooth attack and extended bandwidth that is remarkably wide and harmonically rich.

  Broad'Tron BT65 Pickups - Power & Fidelity - This powerful platform is fueled by all-new Gretsch Broad'Tron BT65 pickups. Designed by the famed Tim Shaw, the BT65 meticulously captures the guitar's sonic palette and reproduces powerful mids, extended lows and an exceptionally clear, yet smooth high-end.

  Players Edition Comfort, Control & Performance - Responding to players need for increased comfort, the Jet BT features a lowered neck set that greatly improves fret-hand mobility while also giving the picking hand a closer approach, increasing comfort and accuracy.
