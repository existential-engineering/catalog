description: The 805 D5 stand-mount loudspeaker is the most compact model in the
  800 Series Diamond range. While it's best suited for smaller listening spaces,
  its large-scale performance greatly exceeds its modest stature.
details: |-
  The 805 D5 is the stand-mount model of the Bowers & Wilkins 800 Series Diamond range and the most compact speaker in it. Bowers & Wilkins positions it for smaller listening spaces while claiming a scale of performance well beyond its size, and it is a two-way vented-box design built around a 25mm Diamond dome tweeter and a 165mm Continuum cone handling bass and midrange together.

  Drive unit technology is the headline. The Diamond dome tweeter pushes the break-up frequency to 70kHz, which Bowers & Wilkins credits for the speaker's clarity, precision and openness, and the Continuum cone is described as delivering voices and instruments with lifelike detail. The tweeter sits in a Solid Body Tweeter-on-Top housing rather than inside the cabinet, and an Anti-Resonance plug and Flowport are also listed among the technical features.

  Cabinet engineering is shared with the rest of the new 800 Series Diamond range. An upgraded Matrix internal bracing design is said to reduce resonance for a more believable soundstage, and aluminium Space Frame Bracing plus an all-new aluminium top section inside the cabinet are credited with a more spacious, immersive sound. The reverse-wrap cabinet is formed from a single continuous curve locked in place by a solid aluminium spine, a shape Bowers & Wilkins attributes to the science of sound rather than to styling, because it reduces cabinet reflections.

  The speaker is passive and takes amplification from an external power amplifier. Nominal impedance is 8 ohms with a 4.6 ohm minimum, sensitivity is 88dB, and Bowers & Wilkins recommends 50W to 120W into 8 ohms on unclipped programme with total speaker cable impedance kept below 0.1 ohm.

  Placement matters for this model: Bowers & Wilkins states the 805 D5 sounds and performs best when securely atop its bespoke speaker stands, and notes explicitly that stands are not included. The matching stand, the FS-805 D5, is sold separately. Four cabinet finishes are offered, Stealth Black, Warm White, Light Walnut and Dark Walnut, each with matching Leather by Connolly trim, with black grilles on Stealth Black and Dark Walnut and grey grilles on Warm White and Light Walnut.
specs: |-
  - Description: 2-way vented-box system
  - Technical features: Diamond dome tweeter, Solid body Tweeter-on-Top, Continuum cone bass/midrange, Anti-Resonance plug, Matrix, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 165mm (6.5in) Continuum cone bass/midrange
  - Frequency range: -6dB 34Hz to 35kHz
  - Frequency response: 42Hz to 28kHz (+/-3dB from reference axis)
  - Sensitivity: 88dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), under 1% 90Hz to 20kHz, under 0.3% 120Hz to 8kHz
  - Nominal impedance: 8 ohms (minimum 4.6 ohms)
  - Recommended amplifier power: 50W to 120W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 439mm (17.3in) including tweeter, Width 241mm (9.5in) cabinet only, Depth 322mm (12.7in) cabinet only, 363mm (14.3in) including grille and terminals
  - Net weight: 16.4kg (36.0 lb)
  - Cabinet finishes: Stealth Black, Warm White, Light Walnut, Dark Walnut, with matching Leather by Connolly trim
  - Grille finishes: Black (Stealth Black and Dark Walnut), Grey (Warm White and Light Walnut)
  - Matching stand: FS-805 D5, sold separately, stands not included
  - Passive loudspeaker: no on-board amplification and no mains connection
