details: |-
  The PRS SE NF 53 is a powerful, modern guitar inspired by classic tones and design. Built on the foundation of a swamp ash body and 22-fret, 25.5” scale length bolt-on maple neck and fretboard, the PRS SE NF 53 embodies the spirit of the electric guitar in the most timeless way. The addition of PRS Narrowfield DD “S” pickups brings a lot of power and musicality without the hum, making this guitar uniquely PRS. PRS Narrowfield DD (Deep Dish) “S” pickups are made with taller bobbins to fit more winds and extra metal pieces in between the magnets for a focused, powerful tone. The “S” variation of these pickups brings articulate low-end tones and the snarl and twang you’d expect from this instrument – all as a noiseless humbucker, making it extremely receptive to gain. Paired with a volume and tone control and 3-way blade pickup switch, the NF 53 allows players to easily dial in their sound. Finally, the steel plate-style bridge with brass barrel saddles adds to the PRS SE NF 53’s lively tone and resonance.
