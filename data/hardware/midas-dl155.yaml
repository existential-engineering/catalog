description: '16 Input, 16 Output Stage Box with 8 Midas Microphone
  Preamplifiers and AES3 Digital Interface. DL155 is a 2U 19"
  fixed-configuration rack I/O unit featuring 8 award-winning Midas microphone
  preamplifiers with 2.5 dB analogue gain steps, 8 line-level outputs, an 8
  channel digital AES3 (AES/EBU) interface (8 in / 8 out across 4 streams) with
  sample rate conversion, and two AES50 network ports providing dual redundancy.
  Compatible with all Midas PRO and M32 Series digital consoles.'
details: |-
  PRO SERIES DL155 — 16 Input, 16 Output Stage Box with 8 Midas Microphone Preamplifiers and AES3 Digital Interface.

  DL155 is a 2U 19" fixed-configuration rack I/O unit designed as a stage box for Midas PRO and M32 Series digital consoles. It combines 8 award-winning Midas microphone preamplifiers, 8 line-level outputs, an 8-channel AES3 digital interface, and dual redundant AES50 network ports.

  Microphone preamplifiers: DL155 features the latest generation of Midas microphone preamplifiers, which faithfully reproduce every sonic detail. Transparent and pristine sound, low noise and high common-mode rejection are hallmarks of this classic design. Gain is adjusted in 2.5 dB analogue steps with switchable +48 V phantom power per channel.

  Line outputs: DL155 features 8 active servo-balanced low impedance line level outputs with high output current capability for driving long cable runs. The outputs feature an automatic mute facility if the audio signal path is muted by the mixing console operator, and individual LED indicators are provided for each output connector.

  AES3 interface: DL155 features an 8 channel digital AES3 (AES/EBU) interface with 8 input channels and 8 output channels, each configured as four digital data streams on individual XLR connectors. DL155 features sample rate conversion for both inputs and outputs and can interface to equipment operating at 48 kHz and 96 kHz. External clock synchronisation is provided for input channels, and word length and clock source options (internal 48 kHz, internal 96 kHz or external synchronisation) are available for output channels.

  Digital Audio Networking: SuperMAC (AES50-compliant) digital audio networking technology from Klark Teknik provides high channel counts, ultra low and deterministic latencies, sample-synchronous and phase-aligned networked clock distribution, error detection and correction, network redundancy, and ease of deployment. DL155 supports multiple sample rates for the AES50 network and is compatible with all Midas digital consoles and audio system engines, as well as any other AES50-equipped devices.

  Control & power: An industry-standard RJ-45 Ethernet control port (100 Megabit) provides remote configuration. The unit is housed in a rugged 2U steel rackmount chassis with an auto-ranging universal switch-mode power supply (100–240 VAC, 50–60 Hz).
specs: |-
  - Form Factor: 2U 19" rackmount
  - Microphone Preamplifiers: 8 award-winning Midas microphone preamplifiers
  - Analogue Gain Steps: 2.5 dB
  - Phantom Power: +48 V switchable per channel
  - Sample Rate: 48 kHz, 96 kHz
  - Mic EIN (40 dB Gain): -126 dBu
  - Output Noise (Unity Gain): -86 dBu
  - Frequency Response: ±0.5 dB (20 Hz - 20 kHz, relative to 1 kHz)
  - THD+N (Unity Gain): 0.01%
  - Crosstalk @ 1 kHz: -90 dB
  - Analogue Inputs: 8 (Mic/Line Level)
  - Input Impedance: 10k ohm
  - A/D Conversion: 24 bit, 96 kHz with 128 times oversampling
  - Analogue Outputs: 8 (Line Level)
  - D/A Conversion: 24 bit, 96 kHz with 128 times oversampling
  - Digital Inputs: 4 XLR (8 channels)
  - Digital Outputs: 4 XLR (8 channels)
  - Output Impedance: 110 ohm
  - Digital Interface: Conforms to AES3-2009
  - Network Connections: 2 (dual cable redundancy)
  - Network Connector: Industry-standard RJ45 with status LEDs
  - Network Interface: Conforms to AES50-2011
  - Ethernet Control Port: 1
  - Power Connector: IEC mains inlet
  - Mains Input Voltage: 100 to 240 VAC, 50-60 Hz
  - Power Consumption: 150 W
  - Dimensions: 483 x 416 x 88 mm (19.0" x 16.4" x 3.5")
  - Net Weight: 6.7 kg (14.7 lbs)
