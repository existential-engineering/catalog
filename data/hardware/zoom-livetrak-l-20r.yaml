description: The Zoom LiveTrak L-20R is a rack-mountable digital mixer that
  allows musicians to control their live mix right from the stage with the use
  of an iPad, with wireless control, 20 discrete channels, 22 tracks of
  recording and six custom monitor mixes.
details: |-
  The LiveTrak L-20R is the rack-mountable version of Zoom's 20-channel LiveTrak console, built so that a band can set it beside the stage and mix from an iPad rather than from a front-of-house position. Sixteen mono mic/line channels take XLR/TRS combo jacks with +48 V phantom power in banks of four, channels 1 and 2 switch to Hi-Z for electric guitar or bass, and channels 3 to 16 carry a 26 dB pad. The two stereo channels, 17/18 and 19/20, accept unbalanced TS jacks or RCA jacks.

  Each of the 16 mono channels has single-knob compression beside its gain control, and every channel carries a 3-band EQ with a sweepable mid (10 kHz shelving high, 100 Hz to 8 kHz peaking mid, 100 Hz shelving low, each plus or minus 15 dB), a variable low cut from 40 to 600 Hz and pan. Two send buses carry 20 effects, listed in the spec table as reverbs, delays, chorus and combinations of the three. Preamps are specified at -128 dBu EIN with +60 dB maximum input gain, and Scene Recall stores up to nine scenes with monitor mixes, EQ, effects and more.

  During a performance the recorder captures 22 tracks at once, 20 discrete channels plus a stereo mix, direct to SDHC or SDXC media at 44.1, 48 or 96 kHz in 16 or 24-bit WAV, with 20-track playback for overdubbing. Effects, EQ, overdub, the audio interface and fader modes A to F are unavailable at 96 kHz.

  Six independent monitor outputs on the rear panel each carry their own mix and switch between a powerful headphone feed and a balanced line level for in-ear and stage monitors. A separate PHONES output on the front panel lets the front-of-house engineer monitor the master mix, any of the sub mixes or soloed tracks. The supplied BTA-1 Bluetooth adapter plugs into the front-panel REMOTE port and connects a master iPad, with further iPads joining over wifi, so the engineer and six musicians can each control their own mix from anywhere in the venue.

  A front-panel USB device port makes the L-20R a 22-in/4-out, 24-bit USB 2.0 audio interface that routes into a DAW, streaming software or an iOS device while recording to the SD card, and a separate USB host port handles file transfer. A rear-panel CONTROL IN jack takes the optional FS-01 momentary footswitch, and the unit ships with rack ears and the AD-19 DC 12 V adapter.
specs: |-
  - 20 discrete channels (16 mono plus 2 stereo) in a rack-mountable chassis, supplied with rack ears
  - Inputs: Mono (MIC/LINE) x 16, Stereo (LINE) x 2. Outputs: MASTER OUT x 1, MONITOR OUT x 6, PHONES x 1
  - Mono (MIC/LINE): XLR/TRS combo jacks (XLR 2 HOT, TRS TIP HOT)
  - Input gain: PAD OFF +16 to +60 dB, PAD ON -10 to +34 dB, Hi-Z ON +6 to +50 dB
  - Input impedance: XLR 3 kOhm, TRS 10 kOhm (1 MOhm with Hi-Z on)
  - Maximum input level: PAD OFF 0 dBu, PAD ON +26 dBu (at 0 dBFS)
  - Phantom power: +48 V
  - Stereo (LINE): TS phone and RCA pin (unbalanced) jacks, maximum input level +10 dBu
  - MASTER OUT: XLR jacks (balanced), maximum output level +14.5 dBu, output impedance 100 Ohm
  - MONITOR OUT A to F with balanced output for monitor speakers: TRS phone jacks (balanced), maximum output level +14.5 dBu, output impedance 100 Ohm
  - MONITOR OUT A to F with unbalanced output for headphones: standard stereo phone jacks, maximum output level 42 mW + 42 mW at 60 Ohm, output impedance 100 Ohm
  - PHONES: standard stereo phone jack, maximum output level 42 mW + 42 mW at 60 Ohm, output impedance 100 Ohm
  - Buses: MASTER 1, MONITOR 6, SEND EFX 2
  - Channel strip: COMP, low cut 40 to 600 Hz, 12 dB/OCT. EQ HIGH 10 kHz shelving, MID 100 Hz to 8 kHz peaking, LOW 100 Hz shelving, each plus or minus 15 dB
  - Level meters: 12 segments
  - Send effects: 20 types. EFX 1 covers Hall 1, Hall 2, Room 1, Plate, Church, DrumAmb and GateRev (reverbs) plus Vocal 1 to Vocal 3 (delay with hall, mono or plate reverb). EFX 2 covers Hall 3, Room 2 and Spring (reverbs), Delay, Analog and P-P Dly (delays), Vocal 4 (delay with room reverb), Chorus 1 (stereo chorus), Chorus 2 (mono chorus) and Cho+Dly (chorus with delay)
  - Scene Recall: up to 9 scenes with monitor mixes, EQ settings, effects and more
  - Maximum simultaneous recording tracks: 22 at 44.1, 48 or 96 kHz. Maximum simultaneous playback tracks: 20
  - Recording format: WAV 44.1/48/96 kHz, 16/24-bit, mono or stereo
  - Recording media: 4 GB to 32 GB SDHC cards and 64 GB to 1 TB SDXC cards, class 10 or higher
  - Audio interface: 22-in / 4-out at 44.1 or 48 kHz, 24-bit, USB 2.0
  - Effects, EQ, overdub, audio interface and fader modes A to F are not available at 96 kHz
  - Card reader: USB 2.0 High Speed. USB HOST: USB 2.0 High Speed
  - Sampling frequency: 44.1 / 48 / 96 kHz
  - Frequency characteristics: -1.0 dB at 20 Hz to 20 kHz (44.1 kHz), -3.0 dB at 20 Hz to 40 kHz (96 kHz)
  - Equivalent input noise: -128 dB EIN (IHF-A) at +60 dB, 150 Ohm input
  - Display: LCD with backlight, 128 x 64 resolution. Transport controls for record, play/pause and stop, plus overdub
  - Wireless control from iPads running iPadOS 13 or later over the supplied BTA-1 Bluetooth adapter, with a master iPad on Bluetooth and further iPads joining over wifi
  - Compatible with the ZOOM FS-01 momentary footswitch via the CONTROL IN jack
  - System requirements for audio interface mode: Windows 8.1 / 10 / 11 (32 or 64-bit), macOS 10.14 to 26, iOS 9 to 26 and iPadOS 17 to 26 with an Apple Lightning to USB Camera Adapter
  - Power: AD-19 AC adapter, DC 12 V / 2 A. Power consumption 24 W maximum
  - External dimensions: 438 mm (W) x 158.2 mm (D) x 151.7 mm (H)
  - Weight (main unit only): 2.49 kg
  - Supplied with the AD-19 AC adapter, the BTA-1 Bluetooth adapter, rack ears and a quick guide
