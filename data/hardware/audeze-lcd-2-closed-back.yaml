details: |-
  Created in 2018 to bring the beloved sound of the original LCD-2 to a wider audience, the LCD-2 Closed-Back delivers real live sound without distractions.

  The taut, punchy bass response puts you on-stage with the rhythm section, and the warm, lifelike midrange brings out the emotion of every performance.

  Sharing similar offset-magnet planar drivers to the LCD-2 Classic makes LCD-2 Closed-Back a very spacious sounding closed headphone, with greater depth and a more realistic immersion than most sealed designs.

  The elegant marbled earcups give LCD-2 Closed-Back excellent acoustic isolation from distracting everyday noises, letting you focus on the music. Thick, supportive earpads and the suspension headband keep you listening in comfort for hours. This is a legacy product and no longer available for sale.
