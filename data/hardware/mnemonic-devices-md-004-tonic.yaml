description: MD-004 Tonic is a Eurorack expander for MD-001 Juniper that adds a
  full octave keyboard, advanced quantization options, and transposition
  controls for live performance including semi-tone, whole-tone, minor 3rd,
  major 3rd, perfect 4th, perfect 5th, and octave shifts.
details: |-
  MD-004 Tonic is a 4HP expander for MD-001 Juniper providing a full octave keyboard, advanced quantization options and ease-of-use transposition for live performance. Transpositions supported include semi-tone , whole-tone , minor 3rd , major 3rd , perfect 4th , perfect 5th and octave . These transpositions can be either chromatic (using POST quantization) or diatonic (using PRE quantization). Tonic also supports a Live mode in which the root note can be shifted by any desired number of semitones. Tonic, powered by Juniper allows interesting quantized arpeggio patterns using the LFO shaping features of Juniper, furthermore Juniper can record and playback these transpositions and scale changes on the fly . Juniper , Gin and Tonic work in harmony to provide a wide gamut of modulation and quantization possibilities for the Eurorack modular synthesizer.
specs: |-
  - Full octave keyboard with chromatic and diatonic transpositions
  - Powered by MD-001 Juniper through the supplied 4-pin cable, no separate power connector
  - Power draw 20mA at +12V, 0mA at -12V
