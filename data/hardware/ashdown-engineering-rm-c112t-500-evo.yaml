description: A powerful 500 watt Rootmaster EVO combo loaded with a single
  Ashdown White Line 12 inch speaker and a switchable tweeter, offering improved
  features and finish with a dramatic reduction in weight.
details: |-
  The Rootmaster EVO C112T 500 is a 500 watt combo loaded with a single Ashdown White Line 12 inch speaker. Made from lightweight ply to cut weight without risk to the signature Ashdown sound, it can be extended with an 8-ohm extension cabinet output to produce full power. It features bar handles and is finished in Buffalo Tolex with a black cloth grille. Tonally the compact design maintains the low-end response with a more dynamic mid-range, and the tweeter adds extra high end adjustable to hi, low or off. The EVO preamp includes passive and active input jack sockets for high and low output instruments, feeding the input control and trademark VU meter, then a Shape button, 5-band EQ and onboard compressor. The drive control delivers a valve-emulated overdrive and the sub-harmonic controls add fatness, both foot-switchable via an FS-2 footswitch (sold separately). A mute button turns the VU meter from orange to cool blue between sets.
specs: |-
  - Power Output: 500 Watts
  - Speaker Configuration: 1 x 12 inch White Line + switchable tweeter (hi/low/off)
  - Extension: 8-ohm extension cabinet output for full power
  - Instrument Input: passive and active jack sockets, with VU meter
  - EQ: 5-band, plus Shape button
  - Onboard compressor
  - Valve-emulated overdrive (drive control)
  - Sub-harmonic controls
  - Mute button
  - FS-2 footswitch compatible (sold separately)
  - Construction: Lightweight ply, Buffalo Tolex, bar handles
