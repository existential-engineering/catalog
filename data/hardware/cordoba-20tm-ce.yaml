details: |-
  The Córdoba 20TM-CE acoustic-electric ukulele sports a solid Mahogany top with Mahogany back and sides for a rich, warm tone that sounds great when plugged in. This tenor-sized ukulele is hand built in the traditional Portuguese style for a great playing experience and features a soft cutaway for easy upper-fret access. Additional premium features on the 20TM-CE include a wooden herringbone inlay, chrome tuners with pearl buttons and a piezo pickup with 2-band EQ.
specs: |-
  - Construction: Solid Top
  - Size: Tenor Cutaway
  - Bridge Material: Rosewood
  - Fingerboard Material: Pau Ferro
  - Neck Material: Mahogany
  - Nut Material: Composite
  - Saddle Material: Composite
  - Back and Sides Wood: Mahogany
  - Color: Natural (NAT)
  - Finish: Satin Polyurethane
  - Frets to Body: 14
  - Neck Joint: Dowel Joint
  - Neck Shape: C Shape
  - Top Bracing Pattern: Fan
  - Fingerboard Inlays: 4mm Dots - Pearloid
  - Frets Total: 18
  - Headplate: Mahogany
  - Nut String Spacing: 28mm
  - Tuning Machines: Córdoba Nickel with Pearl Buttons
  - Electronics: Córdoba Active Ukulele Pickup with 2 Band EQ
  - Controls: Volume, Bass, and Treble
  - Pickup Type: Undersaddle Piezo
  - Nut Width: 35mm (1 3/8")
  - Number of Strings: 4
  - Rosette: Maple and Ebony Herringbone Pattern
  - Scale Length: 432mm (17")
  - Strings: Aquila New Nylgut Tenor 10U
  - Tuning: G-C-E-A
  - Country of Origin: China
