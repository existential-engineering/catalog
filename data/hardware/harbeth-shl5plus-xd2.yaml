description: The Harbeth SHL5plus XD2 is a three-way stand-mount loudspeaker
  built around a 200mm RADIAL4 bass/mid driver, a ferrofluid-cooled tweeter and
  a dome SuperTweeter, for a sound the maker describes as expansive, powerful
  and crystal-clear.
details: |-
  The Harbeth SHL5plus XD2 offers a high-end audio experience. It brings out the full potential of the Harbeth-designed 200mm RADIAL4 bass/mid driver, delivering a sound that is expansive, powerful and crystal-clear, with remarkable clarity and freshness.

  At the core of the SHL5plus XD2 is Harbeth's RADIAL4 cone technology, a distinctive innovation that ensures exceptional detail. Pioneering work in loudspeaker diaphragm material science set the benchmark for the acclaimed RADIAL4 cone, a revolution in clarity and detail from a drive unit.

  Each speaker in the XD2 series incorporates a newly refined crossover design, significantly improving the integration between the bass, midrange and treble for a smoother, more cohesive audio experience. The enhanced crossover allows each frequency range to work in harmony, creating a seamless blend of sound that feels more balanced and natural, and the result is a speaker that excels in tonal accuracy while offering greater depth and clarity.

  The three-way driver array pairs the 200mm RADIAL4 mid driver with a 25mm ferrofluid-cooled tweeter and a 20mm dome SuperTweeter, giving a quoted range of 40Hz to 20kHz within plus or minus 3dB in free space with the grille on.

  The cabinets are handmade from carefully selected high-quality veneers, which vary in colour, shade and grain structure, and not all finishes are available in every country. The SHL5plus XD2 is designed and handmade in the UK.
specs: |-
  - Description: stand-mount loudspeaker
  - Drive unit: 200mm Harbeth-made RADIAL4 mid drive unit
  - Tweeter: 25mm ferrofluid-cooled
  - SuperTweeter: 20mm dome
  - Frequency range: 40Hz to 20kHz, plus or minus 3dB free-space, grille on, smooth off-axis response
  - Impedance: 6 ohms
  - Sensitivity: 86dB/2.83V/1m axial
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 25W per channel
  - Power handling: 150W programme
  - Connectors: 4mm Harbeth-branded binding posts
  - Space needs: overall response optimised for use away from walls
  - Stands: optimally to bring ears level with tweeters (tweeter 475mm up from cabinet base)
  - Dimensions: 635mm high, 322mm wide, 300mm deep (plus 12mm for grille and binding posts)
  - Packing: single speaker per protective carton
