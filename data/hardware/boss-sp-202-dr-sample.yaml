description: >-
  A budget sampler designed for loops and grooves, offering four sample rates
  from 31.25kHz to 3.91kHz with 20-260 seconds of sample time via built-in
  microphone and line inputs.
details: |-
  The SP-202 provides basic sampling capabilities with six built-in effects including Pitch Shift, Filter 1 & 2, Time Stretch, Delay, and Ring Modulation. It features an innovative BPM function that automatically calculates tempo from sample length for easy synchronization. The device includes battery power option and comes pre-loaded with sampled loops and one-shots.

  Sample editing and effects manipulation are limited — individual samples cannot be pitch-shifted, tempo-adjusted, or have volume altered. The unit lacks re-sampling abilities and only supports four voices. Despite the limitations, it suits DJs wanting to apply filtering and effects to material with live tweaking capabilities. Notable user: Fatboy Slim.
specs: |-
  - Polyphony: 4 voices
  - Sample Rates: 31.25kHz (hi-fi), 15.63kHz (standard), 7.81kHz (lo-fi), 3.91kHz (lo-fi 2)
  - Sample Time: 32-260 seconds
  - Effects: Pitch Shift, Filter, Resonant Filter, Time Stretch, Ring Modulator, Delay
  - Memory: Holds 16 samples
  - Storage: SmartMedia 5.5v Memory Card
  - Pads: 8 touch pads
  - Control: MIDI
releaseDate: "2000"
releaseDateYearOnly: true
