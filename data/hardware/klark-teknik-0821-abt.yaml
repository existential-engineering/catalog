description: The DN3601 is the slave companion to the DN3600 programmable
  graphic equaliser, engineered to extend the DN3600's recallable,
  automation-ready performance across additional channels without duplicating
  the master unit's control surface. It is intended for multi-channel
  installations, large-format touring rigs and theatre sound designs.
details: |-
  The DN3601 receives programme data from a DN3600 master and applies recalled EQ snapshots in lockstep, so every channel under the master's control behaves identically when scenes change. The audio signal path is built to the same tolerances as the master, transparent, predictable and tightly matched.

  Multi-zone installations, distributed PA systems and main-plus-multiple-monitor rigs benefit from the DN3601's ability to operate as a fully programmable channel without occupying a master slot. The slave concept allows one engineer's decisions at the DN3600 to propagate across an entire equalisation system.

  Designed in the United Kingdom by the same team that produced the DN3600, the DN3601 carries the DN-series approach into multi-channel territory.
specs: |-
  - Programmable slave graphic equaliser
  - Receives programme data from a DN3600 master unit
  - Applies recalled EQ snapshots in lockstep with the master
  - Analogue audio signal path matched to the DN3600
