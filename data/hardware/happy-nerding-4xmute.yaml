description: 4xMUTE provides four sections of clickless muting and unmuting
  suitable for both audio and CV, with a button that glows green while the
  signal is passing and red while it is muted.
details: |-
  4xMUTE provides four sections of clickless muting / unmuting suitable for both audio and CV. The button glows green while the signal is passing and glows red while the signal is muted, so the status is always visible.

  Lower inputs are normalled to the upper inputs, thus the same input can be sent to different outputs.

  No bleed in mute state and no distortion is added to the passing signals.

  A comparison picture on the page shows an ordinary good quality NKK toggle switch against 4xMUTE for a 100 Hz triangle wave. Some abrupt change of volume is noticeable for low frequency sines and low pass filtered signals, but 4xMUTE does not produce the click of a passive switch or of instant electronic gate chips.

  4xMUTE has extra good bleed free operation, around 110 dB of reduction, and the lowest distortion. A VCA of vactrol design will have noticeably more noise, bleed and distortion.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - Four sections of clickless muting and unmuting
  - Suitable for both audio and CV
  - Button glows green while the signal passes and red while it is muted
  - Lower inputs normalled to the upper inputs, so one input can feed different outputs
  - No bleed in mute state, around 110 dB of reduction
  - No distortion added to the passing signals
  - 4 HP wide
  - Reverse power protected
