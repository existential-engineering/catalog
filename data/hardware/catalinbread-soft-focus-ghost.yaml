description: The Soft Focus Ghost is a Yamaha FX500-inspired reverb that weaves
  a phase shifter into the mix in place of the Symph knob of the original Soft
  Focus. The Ghost control adds a nontraditional phase-shifting algorithm whose
  rate and depth track a single knob, and the pedal still carries chorus, plate
  reverb, input gain and a full wet-dry mix.
details: |-
  The mythos surrounding the original Yamaha FX500 is now well-traveled, but it was the FX500B, the bass unit, that inspired the entire Ghost product line: a secondhand example randomly switched patches, oftentimes to settings nobody had heard before. That simple mechanical error gave way to the line, inserting new sounds within the architecture of forgotten gear. Careful tweaking of the spirits within the FX500 produced the Soft Focus Ghost.

  The newest feature on the Soft Focus Ghost weaves a phase shifter into the mix, replacing the Symph knob that the original Soft Focus added where once there was none. The new Ghost control adds in a nontraditional phase shifting algorithm that serves as an enhancement tool rather than the gooey modulation that completely overtakes an entire signal. The rate and depth of this phase shifter are tied to the same knob, such that quicker speeds are deeper than the slower settings. The Mod knob now acts as a master depth control for all modulation, and the Ghost still includes chorus, plate reverb, input gain and full wet-dry mix capabilities.
specs: |-
  - Power supply: 9-18V DC, center-negative, at least 100mA
  - Does not run on batteries
  - Ghost control: phase shifter whose rate and depth track one knob
  - Mod control acts as a master depth control for all modulation
