description: Compact passive 2 x 12 inch closed-back guitar speaker cabinet
  loaded with Celestion Vintage 30 speakers, rated 120 W at 16 ohms in mono.
details: |-
  The perfect solution for a small setup. Compact in size but big in sound, the E212VHB's Celestion Vintage 30 speakers offer solid bass foundations and silky highs.

  The solid housing, made of birch plywood, is built for eternity and is 100% roadworthy. Despite the diminutive dimensions, the E212VHB has utterly convincing bass reserves on tap.

  The straight front, closed back, solid hand-welded metal grille and the parallel input and thru for daisy chaining complete the construction.
specs: |-
  - Passive cabinet, no internal amplification and no mains power
  - Speakers: 12 inch Celestion Vintage 30 made in UK
  - Power handling: 120 W (mono)
  - Impedance: 16 ohms (mono)
  - Straight front
  - Closed back
  - Solid birch plywood construction
  - Parallel input and thru for daisy chaining
  - Solid hand welded metal grille
  - Dimensions: 74 x 48 x 36 cm
  - Weight: 33 kg
