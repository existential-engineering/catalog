description: An acoustic-electric guitar with a solid mahogany top delivering
  warm, woody tones with pronounced midrange, paired with sapele back and sides
  for bright, airy trebles. Equipped with Martin E1 electronics featuring a
  chromatic tuner and volume, tone, and phase controls.
details:
  - The Martin 000-15E is part of Martin's 15 Series and feels like it's been a
    part of your musical journey for decades. Built around a 000-14 Fret
    (Auditorium) body, it strikes a balance between the focused articulation of
    smaller body shapes and the warmth of larger guitars.
  - The solid Indian Plantation Mahogany top delivers the warm, woody tones the
    wood is known for, with a pronounced midrange that supports both flatpicking
    and fingerstyle playing. Solid sapele back and sides round out the tonal
    profile by adding bright, airy trebles for a balanced acoustic voice.
  - Inside, scalloped spruce X-bracing supports resonant projection while a
    katalox fingerboard and modern belly-style bridge anchor the modern Martin
    construction details. The PA Profile neck with High-Performance Taper and 1
    3/4" nut width gives players a comfortable, fast-feeling hand.
  - The 'E' designation comes from the onboard Martin E1 electronics package,
    which includes a built-in chromatic tuner alongside volume, tone, and phase
    controls so the 000-15E plugs straight into an amp or PA when needed.
  - Each 000-15E ships in a softshell case with backpack straps, strung with
    Authentic Acoustic Lifespan 2.0 Phosphor Bronze (Light) strings, and is
    backed by Martin's Limited Lifetime Warranty.
specs: |-
  - Body Size: 000-14 Fret (Auditorium)
  - Top Wood: Solid Indian Plantation Mahogany
  - Back/Sides: Solid Sapele
  - Top Finish: Satin
  - Scale Length: 24.9"
  - Fingerboard Material: Katalox
  - Fingerboard Width at Nut: 1 3/4"
  - Neck Shape: PA Profile with High-Performance Taper
  - Total Frets: 20
  - Bracing: Scalloped Spruce X-Brace
  - Bridge: Katalox with Modern Belly Style
  - Electronics: Martin E1 (chromatic tuner, volume, tone, phase)
  - Case: Softshell with Backpack Straps
  - Strings: Authentic Acoustic Lifespan 2.0 (Phosphor Bronze - Light)
