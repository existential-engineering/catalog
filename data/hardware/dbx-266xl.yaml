name: dbx 266XL
manufacturer: dbx
primaryCategory: compressor
categories:
  - gate
  - dynamics
url: https://dbxpro.com/en/products/266xl
description: Dual-channel compressor/gate with AutoDynamic™ controls, OverEasy®
  or hard knee compression, True RMS Power Summing™, and stereo or dual-mono
  operation. Features balanced 1/4" TRS and XLR I/O with side chain insert.
details: |-
  The dbx 266XL is a dual-channel compressor/gate offering musical compression and gating with AutoDynamic™ controls. The device features program-dependent timing algorithms that adapt attack and release to the program material for natural-sounding gain control.

  The 266XL provides separate precision LED displays for gain reduction, compression threshold, and gate threshold monitoring. Stereo coupling allows both channels to be linked for cohesive stereo bus processing.

  Compression can be set to OverEasy® (soft knee) or hard knee modes, and the True RMS Power Summing™ detector accurately tracks signal levels. Balanced 1/4" TRS and XLR connectors on both inputs and outputs ensure compatibility with professional and semi-pro gear.

  A side chain insert allows external signal processing or ducking applications. The unit is discontinued but was widely used in portable, touring, and studio environments.
specs: |-
  - Input Connectors: 1/4" TRS and XLR floating balanced
  - Input Impedance: 40kΩ balanced/unbalanced
  - Max Input: +22dBu
  - Output Connectors: 1/4" TRS and XLR floating balanced
  - Output Impedance: 200Ω balanced, 100Ω unbalanced
  - Max Output: +21dBu into 600Ω
  - Frequency Response: 20Hz–20kHz, +0/–0.5dB
  - Noise: <–93dBu unweighted
  - THD+Noise: <0.2% @ 1kHz
  - Compressor Threshold: –40dBu to +20dBu
  - Compressor Ratio: 1:1 to ∞:1
  - Gate Threshold Range: –60 to +10dB
  - Gate Ratio: 1:1 to 4:1
  - Gate Max Depth: >60dB
  - Gate Attack Time: <100µs
  - Gate Release Time: 30ms to 3sec (to 30dB attenuation)
  - Gain Adjustment Range: –20dB to +20dB
  - Dynamic Range: >114dB unweighted
  - Power Consumption: 15W maximum
  - Dimensions: 1.75" H × 19" W × 6.75" D
  - Weight: 5 lbs (2.3 kg)
