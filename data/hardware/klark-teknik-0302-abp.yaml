url: https://www.klarkteknik.com/en/products/0302-ABP
description: "The VNET INTERFACE POWER SUPPLY is a freestanding or
  rack-mountable supply for up to two VNET accessories requiring external power:
  the USB and RS232 interface when RS232 control is used, and the Dante and
  Ethernet interfaces where Power over Ethernet is unavailable. Connection to a
  Windows PC or laptop uses standard Ethernet cabling, with interconnections
  between VNET devices via Cat5 cables and RJ45 connectors."
specs: |-
  - Powers up to two VNET accessories
  - For the USB and RS232 interface when RS232 control is required
  - For the Dante and Ethernet interfaces where Power over Ethernet is unavailable
  - Freestanding or rack-mountable
  - Connection to a Windows PC or laptop over standard Ethernet cabling
  - Interconnection between VNET devices via Cat5 cables and RJ45 connectors
  - Rugged steel enclosure with Ethercon connectors
