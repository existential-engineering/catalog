details: |-
  The GS Mini body shape is Taylor's scaled-down acoustic platform, delivering a surprisingly rich and full sound from a compact 23-1/2" scale length instrument. The shorter scale reduces string tension, making it comfortable and approachable for new players while remaining a capable travel companion for experienced guitarists.

  The top is constructed from torrefied spruce — a roasting process that accelerates the tonal aging of the wood, imparting warmth and sweetness typically associated with well-played vintage instruments. Paired with layered sapele back and sides, the guitar produces a bold, clear response with good projection for its size.

  The neck is shaped from tropical mahogany with a slender profile and low action, complemented by an ebony fretboard featuring 4mm dot inlays and an ebony bridge. Nubone nut and Micarta saddle help transfer vibration efficiently across the instrument.

  The GS Mini ships with a lightweight structured gig bag and is backed by Taylor's limited lifetime warranty. Die-cast chrome tuners, a black pickguard, and D'Addario XS Coated Phosphor Bronze Medium strings (.013-.056) complete the package.
specs: |-
