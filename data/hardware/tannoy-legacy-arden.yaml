details: |-
  The Legacy ARDEN is a modern reinterpretation of Tannoy's iconic 1970s HPD Series monitors — a floor-standing 15" Hi-Fi loudspeaker with Dual Concentric driver for class-leading point-source coherence and imaging. Handcrafted at Tannoy's Poland and UK workshops. Crossover uses 2 independent LF and HF channels with front-mounted 2-band energy control. Heavy-duty 24-carat gold-plated binding posts (four main + one RF-ground post). High-density enclosure with DMT (Differential Materials Technology) bracing and 8 mm coupling spikes.
specs: |-
  - driver: 15" Dual Concentric
  - powerHandling: 600 W
  - crossover: 2-channel independent LF/HF network
  - connections: 5x 24-carat gold-plated binding posts (4 main + 1 RF ground)
  - controls: Front-mounted 2-band HF energy control
