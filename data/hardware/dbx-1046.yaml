url: https://dbxpro.com/en/products/1046
description: A discontinued quad compressor/limiter featuring four independent
  channels of dbx compression with PeakStopPlus™ limiting, suitable for studio,
  tour, and portable applications.
details: |-
  The 1046 provides four channels of smooth classic dbx OverEasy® or Hard Knee compression perfectly suited for multitrack recording and sound reinforcement. Each channel operates independently while offering stereo linking capabilities for true stereo compression on two pairs. The unit incorporates the industry-standard dbx designs and manufacturing techniques to deliver pristine sonic quality with that classic dbx sound.

  Features include individually adjustable threshold and ratio controls per channel, switchable compression modes, and the newly developed PeakStopPlus™ limiting circuit for protecting systems from oppressive peaks. Each channel can be independently interfaced with balanced gold-plated XLR and 1/4″ inputs and outputs, with switchable +4dBu or -10dBV operating levels.

  The 1046 is ideal for controlling individual signal levels, placement in the mix, or overall characteristics. Whether managing four independent signals or handling stereo pairs, the unit delivers flexible gain leveling with precision metering and hard-wire bypass on every channel.
specs: |-
  - Four independent channels of operation, stereo linkable in two pairs
  - PeakStopPlus™ limiting control for setting maximum allowable level
  - Independent Threshold and ratio controls per channel
  - Switchable OverEasy® or Hard Knee compression
  - Classic dbx® compression with AutoDynamic™ attack/release
  - Differentially balanced gold-plated XLR and 1/4" inputs and outputs
  - True RMS level detection
  - Precision metering of input, output, and gain reduction
  - Dual true stereo or quad mono operation
  - Switchable +4dBu or -10dBV operation per channel
  - Compressor Threshold Range: -40 dBu to +20 dBu
  - Compressor Ratio: 1:1 to infinity:1
  - Limiter Threshold Range: 0 dBu to +24 dBu (off)
  - Output Gain: -20 to +20 dB
  - Max Input: >+22 dBu balanced or unbalanced
  - Max Output: >+22 dBm balanced, >+20 dBm unbalanced
  - Bandwidth: 20 Hz to 20 kHz, +0/-0.5 dB
  - Noise: <-96 dBu, unweighted
  - Dynamic Range: >118 dB, unweighted
  - THD+Noise: >0.008% typical at +4 dBu
  - Dimensions: 1.75"H x 19"W x 9"D
  - Unit Weight: 5.2 lbs (2.4 kg)
  - Power Consumption: 20 Watts
  - Operating Voltage: Switchable 100-120 VAC or 200-240 VAC 50/60 Hz
  - 8-segment LED bar graph metering for gain reduction and I/O levels
