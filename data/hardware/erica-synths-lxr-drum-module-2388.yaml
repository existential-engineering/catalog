description: LXR eurorack module is a compact and great-sounding percussion
  synthesizer based on the sound engine of the LXR-02 drum machine. While
  retaining the core interface of the LXR-02, this module adds the essential
  eurorack ingredient - assignable CV control over parameters and many more
  tweaks in the user interface for better integration in any eurorack system.
details: |-
  The LXR eurorack module is a compact percussion synthesizer built on the sound engine of the LXR-02 drum machine. It keeps the core interface of the LXR-02 and adds the ingredient a eurorack system needs, namely assignable CV control over parameters, along with a number of interface changes aimed at better integration into a rack.

  Six drum and percussion voices are on offer, each with over thirty adjustable parameters. Three of those voices track 1V/oct, so they can be used for bass lines as well as percussion.

  Patching is built around seven trigger inputs with accents, five assignable CV inputs and four assignable outputs, which lets a sequencer drive the module while a modular system modulates its parameters and takes individual voices out separately.

  An insert FX section sits in the signal path, kit memory stores setups, and an SD card slot handles kit exchange and firmware updates. Kits are compatible with the LXR-02, so material moves between the desktop machine and the module.
specs: |-
  - 6 drum/percussion voices
  - 7 trigger inputs with accents
  - 5 assignable CV inputs
  - 4 assignable outputs
  - 3 voices can be used as basslines due to 1V/oct tuning
  - Over 30 adjustable parameters per voice
  - Insert FX section
  - Kit memory
  - SD card for Kit exchange and easy firmware updates
  - Kits compatible with the LXR-02
