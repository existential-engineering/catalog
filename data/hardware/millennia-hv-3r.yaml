description: The HV-3R is an eight channel remote controlled microphone
  preamplifier in a rack chassis, driven over Ethernet with TCP/IP addressing
  for up to 792 channels across 99 units, or over MIDI for Pro Tools control.
  Gain is stepped in 1 dB increments on every channel, and Dante, AES and MADI
  output options are available.
details: |-
  The HV-3R is an eight channel microphone preamplifier built for remote operation. Control runs over Ethernet with TCP/IP addressing, which reaches up to 792 channels across 99 units at once and allows control across the Internet, and a MIDI interface gives plug and play operation with Pro Tools. Dante, AES and MADI output options are offered.

  AElogic software for Windows handles the control surface, with high definition metering, unlimited groups, scene management and voltage and temperature monitoring. Gain is set in 1 dB steps on all channels, matched across channels to 0.08 dB.

  The transformerless signal path uses a matched high speed discrete transistor octet with +23 dBu of input headroom, so no pads are needed, and the fully balanced path keeps total harmonic distortion under 5 ppm. A laser trimmed FET output stage has 32 dB of headroom and drives cable runs of 1000 feet, or 300 meters.

  The chassis is 16 gauge aluminum at 19 inches wide by 3.5 inches high by 16 inches deep, weighing 19 pounds shipped, with a toroidal power supply, Mogami Neglex OFC audio wiring and silver Teflon power wiring. Mains voltage is selectable between 100 to 120V and 200 to 240V at 50 or 60 Hz, drawing 45 watts maximum.
specs: |-
  - Minimum Gain: 8.5 dB
  - Maximum Gain (1 dB per step): 80 dB
  - Frequency Response (+0 / -3 dB): sub 3 Hz to beyond 300 kHz
  - Noise (60 dBu Gain, 10 Hz - 30 kHz, Inputs common): -133 dB EIN
  - Total Harmonic Distortion + Noise (35 dB Gain, 10 Hz - 20 kHz bandwidth, +27 dBu Out): < .001%, Typ. < .0005% (< 5 ppm)
  - Intermodulation Distortion (50 Hz & 7 kHz, 35 dB Gain, +27 dBu Out): < .0009%
  - Phase Response (35 dB Gain, 50 Hz - 20 kHz bandwidth, +27 dBu Out): < 2 degrees deviation
  - Common Mode Rejection Ratio (35 dB Gain, 10 Hz - 20 kHz bandwidth, 100 mV C.M.): > 65 dB, Typ > 85 dB
  - Slew Rate (35 dB Gain, +27 dBu Out): > 25 Volts per microsecond
  - Maximum Input Level (20 Hz - 40 kHz): +23 dBu (no attenuator pads required)
  - Maximum Output Level (20 Hz - 40 kHz): +32 dBu
  - Phantom Input Impedance (1 kHz): 6,750 ohms
  - Output Impedance: 24.3 Ohms (x2)
  - DPA (B&K) Mic Powering: +130 V dc max, (non-phantom)
  - Phantom Powering: +48 V dc, +/- 4 V dc
  - Power Consumption: 45 watts maximum
  - Power Requirements: Selectable 100-120, 200-240 V ac, 50/60 Hz
  - Dimensions/Shipping Weight: 19" W x 3.5" H x 16" D, 19 lbs.
