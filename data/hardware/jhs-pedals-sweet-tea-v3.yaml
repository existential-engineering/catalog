description: A dual-circuit overdrive/distortion pedal combining the Moonshine
  V2 and Angry Charlie V3 with a switchable effects order toggle.
details: |-
  The Sweet Tea V3 is our "Everything Medium-to-High gain 2-in-1" and it covers all the bases from light breakup, blues, rock, heavy grind, and more.

  MOONSHINE ON THE RIGHT: The right side is our brand new Moonshine V2 which is a highly unique and massively tweaked version of the most famous overdrive ever created, housed in a little green enclosure. The Moonshine V2 has the classic mid-heavy tones that you'd expect but with more gain, volume, and tones available than you ever thought possible. The Moonshine V2 has the same core sound as the Moonshine Version 1 but we have added a new "Clean" knob to blend in the perfect amount of clean signal with your overdrive signal.

  ANGRY CHARLIE ON THE LEFT: On the left side is our newest version of the Angry Charlie which is the Angry Charlie V3, one of our most popular pedals of the last few years. High gain JCM 800 type "Brown" sound tone that we believe is the most accurate Marshall tone ever put in a stompbox! It has Volume, Drive, and the full Bass, Mid, and Treble tone stack like you'd find on the amp.

  FEATURES: The Sweet Tea V3 features our classic order switching toggle so that you can choose which circuit is first in the chain for the perfect stacking tones you've been searching for.

  - Even more overdrive and distortion tones
  - Fully independent Moonshine V2 and Angry Charlie V3 circuits
  - Order toggle to select the order of effects when stacking
  - Tons of control to dial in your perfect sound

  VERSION HISTORY:
  V1 = Slightly different icon, no toggles.
  V2 = Order Toggle and Gain Toggle added.
  V3 = Updated Moonshine V2 on the right and Angry Charlie V3 on the left. Top-mount jacks.
