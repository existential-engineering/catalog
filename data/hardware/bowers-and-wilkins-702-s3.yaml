description: High-performance 700 Series floor-standing speaker. A
  state-of-the-art tower speaker that defines new standards for performance in
  its class, featuring a Carbon Dome tweeter housed in an all-new Solid Body
  Tweeter assembly, a downward-firing port configuration, and a trio of Aerofoil
  Profile bass cones for bass that is both profoundly deep and articulate.
details: |-
  The 702 S3 is the flagship floor-standing model in the third-generation Bowers & Wilkins 700 Series. It is a 3-way vented-box system pairing three 165mm Aerofoil Profile bass drivers with a 150mm Continuum cone FST midrange and a 25mm Decoupled Carbon Dome tweeter mounted in a new Solid Body Tweeter-on-Top assembly.

  The Solid Body Tweeter housing is machined from a single block of aluminum and engineered to isolate the high-frequency unit from cabinet vibrations. The Continuum cone FST midrange is decoupled from the main cabinet to further reduce coloration, while the trio of Aerofoil Profile bass cones is paired with a downward-firing Flowport configuration for deep, controlled low-frequency response.

  Available in Gloss Black, Satin White, and Mocha finishes. Grille options are Black, or Grey (Satin White finish only).
specs: |-
  - Drive units: 1x 25mm (1 in) Decoupled Carbon Dome high-frequency, 1x 150mm (6 in) Continuum cone FST midrange, 3x 165mm (6.5 in) Aerofoil Profile bass
  - Configuration: 3-way vented-box system
  - Frequency range: 28Hz to 33kHz
  - Frequency response: 46Hz - 28kHz (+/-3dB)
  - Sensitivity: 90dB spl (2.83Vrms, 1m)
  - Harmonic distortion (2nd and 3rd, 90dB/1m on axis): <1% 86Hz - 28kHz, <0.5% 110Hz - 20kHz
  - Nominal impedance: 8 ohms (minimum 3.1 ohms)
  - Recommended amplifier power: 30W - 300W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Height: 1010mm (39.8 in) cabinet only; 1138mm (44.8 in) including tweeter and plinth
  - Width: 192mm (7.6 in) cabinet only; 290mm (11.4 in) including plinth
  - Depth: 354mm (13.9 in) cabinet only; 391mm (15.4 in) including grille and terminals; 410mm (16.1 in) including plinth
  - Net weight: 33.46kg (73.8 lb)
  - Finishes: Gloss Black, Satin White, Mocha
