description: A limited 7x14″ snare with a sand-cast, machined bell bronze shell and hardware.
details: |-
  The DW MFG True-Cast Snare Drum is a limited snare drum built in collaboration between longtime DW artist and collector, Dave Elitch, and the DW R&D team. This one-of-a-kind snare drum is assembled in the legendary California Custom Shop.

  The 7x14″ snare features a sandcast and machined Bell Bronze shell that offers a contoured interior shape ranging from 5mm to the top and bottom edges to 3mm at the center. The beefy drum delivers fat, low-end punch that does not choke out at any tuning.

  The snare is fitted with True-Cast counter hoops, Mini Turret Lugs, Mini MAG™ throw-off, and True-Pitch™ tension rods, that are machined from brass to exacting standards. The drum is capped off with a 20-strand True-Tone™ snare wires and Remo Ambassador single-ply snare heads with DW MFG logos.

  Since only 100 snare drums will be produced, each handcrafted True-Cast will include a certificate of authenticity.

  Also included is a limited edition DW MFG flight case that will protect the snare from the scrapes and in-transit wear from gigging.
specs: |-
  - Sand-Cast Bell Bronze shell, 5mm at the bearing edges tapering to 3mm at the center
  - Machined True-Cast counter hoops
  - Machined Mini-Turret lugs
  - Machined mini MAG throw-off
  - True-Pitch tension rods
  - 20-strand True-Tone snare wires
  - Remo Ambassador single-ply heads with DW MFG logos
  - Includes DW MFG flight case
  - Size: 7x14
  - Limited to 100 units worldwide, each with a numbered badge and certificate of authenticity
