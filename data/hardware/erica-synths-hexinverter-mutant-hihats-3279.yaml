description: Classic hi-hat reborn.
details: |-
  A classic electronic percussion synthesis design reborn as something different. Hexinverter set out to recreate a classic hihat synthesis design as something new, taking the electro 808 circuit and transforming it into a creative tool for modular synthesis.

  The analogue hihat circuitry synthesises vanilla TR-808 open and closed hihat sounds simultaneously, and an external audio input allows hihats to be synthesised from virtually any sound source. An exclusive switch selects how the two hihats interact when they are triggered at the same time, and the trigger input accepts almost anything as a trigger signal.

  The lo-fidelity original VCAs were replaced by OTA based modern VCAs, and a VCA DRIVE control for each hihat covers anything from soft metallic hihats to extremely overdriven, crunchy ones. An internal resonant bandpass filter has a cutoff frequency control and can be switched off.

  A modular level mutual accent input takes 0V to 5V CV. Non-invasive analogue optocouplers are used for the voltage control, so completely vintage sounds are still available, and the signal chain was completely redesigned, replacing cheap transistor amplifiers with low noise opamp and OTA equivalents.

  The module is a reissue redesigned by Erica Synths in close collaboration with Hexinverter. In September 2022 Stacy Gaudreau, the founder of Hexinverter Électronique, announced the closing of its operations, and Erica Synths took over the manufacturing, sales and support of several of those modules, retaining all functionality while redesigning the hardware, with support provided for the reissue modules only.
specs: |-
  - Analogue hihat circuitry synthesising TR-808 open and closed hihat sounds simultaneously
  - External audio input for synthesising hihats from any sound source
  - OTA-based modern VCAs
  - VCA DRIVE control for each hihat
  - Exclusive switch for open and closed hihat interaction
  - Cutoff frequency control for internal resonant bandpass filter, switchable on and off
  - Modular level mutual accent input (0-5V CV)
  - Trigger input accepts almost any trigger signal
  - Non-invasive analogue optocouplers used for voltage control
  - Low noise opamp and OTA based signal chain
  - Audio output 10Vptp
  - CV levels -5V to +5V
  - Power consumption +23mA, -17mA
  - Module width 13HP
  - Module depth 20mm
