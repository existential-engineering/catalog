details: |-
  With brilliant acoustics and a vast array of tones, the Hollowbody II has been a constant favorite in our dynamic lineup of hollow instruments. The combination of the maple top and back with mahogany sides provides tonal clarity and extraordinary resonance. While the 22-fret, 25” scale length neck delivers familiar comfort and playability.

  Featuring PRS McCarty III pickups, the PRS Hollowbody II has a vintage-inspired voice with vocal clarity and full, warm tone. The LR Baggs/PRS Piezo System comes standard, providing musicians with the versatility of wielding both acoustic and electric guitar tones in one instrument. There are two output jacks on the Hollowbody II Piezo, allowing guitarists to plug into their favorite electric guitar or acoustic guitar amp or DI into a soundboard. By utilizing the separate blend control, the tone of the Hollowbody II Piezo's McCarty III pickups can also be combined with acoustic sounds through a single output.

  With a nearly infinite range of resonant tones, the PRS Hollowbody II Piezo is a beautiful “go-to” guitar.
