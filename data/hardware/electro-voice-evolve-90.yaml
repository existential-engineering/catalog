name: EVOLVE 90
manufacturer: electro-voice
primaryCategory: speaker
categories:
  - subwoofer
url: https://products.electrovoice.com/na/en/evolve-90/
description: The EVOLVE 90 is a portable powered column array PA system for
  professionals handling larger high-energy events, pairing an 18-inch subwoofer
  with a detachable column of eight 4.7-inch neodymium drivers on a distance
  pole. The system delivers 2000 W total Class-D amplification (1000 W LF / 1000
  W HF) and up to 134 dB maximum SPL with 120 deg horizontal x 25 deg vertical
  coverage, while advanced FIR processing keeps the on-axis response linear. The
  EVOLVE 3-2-1 design (three pieces, two clicks, one system) and lightweight
  advanced materials enable rapid deployment and easy transport. The integrated
  mixer offers two XLR/TRS combo mic/line inputs, stereo XLR and RCA line
  inputs, AES/EBU digital I/O, Bluetooth stereo audio, and QuickSmart Link
  wireless control with QuickSmart Mobile app integration. Available in black or
  white.
details: |-
  2000 W total Class-D amplification (1000 W LF + 1000 W HF)

  Eight 4.7 in (120 mm) neodymium column array drivers

  18 in subwoofer with 4 in voice coil for deep low end

  Maximum SPL of 134 dB

  Frequency response 35 Hz - 18 kHz; frequency range 28 Hz - 20 kHz

  Coverage pattern 120 deg horizontal x 25 deg vertical

  Advanced FIR processing for linear on-axis frequency response

  EVOLVE 3-2-1 assembly: three pieces, two clicks, one system

  Built-in mixer with mic/line, stereo line, AES/EBU and Bluetooth inputs

  QuickSmart Link wireless control and QuickSmart Mobile app integration

  Lightweight advanced materials for portability

  Available in black or white
specs: |-
  - frequencyResponse: 35 Hz - 18 kHz
