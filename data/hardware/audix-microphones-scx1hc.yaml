details: |-
  The SCX1HC is the hypercardioid capsule version of the SCX1 professional studio condenser microphone, designed for a wide variety of recording, broadcast, and live sound applications. Known for its high sensitivity, pin-point accuracy, low profile, and consistency, the SCX1 series is also available with cardioid (SCX1) or omnidirectional (SCX1O) capsules.
  With a smooth uniform frequency response from 40 Hz – 20 kHz, the SCX1 is very consistent when responding to on and off-axis signals, and exhibits excellent phase coherence and minimal proximity effect. The high output and sensitivity of the microphone make it an ideal choice for miking overhead, drums, instruments, room ambiance, orchestral sections, stringed instruments, piano, vibes, and sound effects. The SCX1HC condenser microphone is a number one choice for miking hi-hat both live and in the studio.

  Other features include a 21 mm gold vapor capsule, miniaturized electronics, and an extremely small footprint. The SCX1 will handle sound pressure levels of 130 dB and will provide up to 20 dB of ambient noise rejection. In addition to acoustic instruments, it is an excellent choice for group vocals, speech, or Foley work. The SCX1HC has become a popular choice for interior dialogue boom pole miking. It has a precision machined brass body, interchangeable capsules, black multi-layer class 'A' liquid finish, and a gold-plated XLR connector.

  Designed, machined, assembled, and tested by AUDIX in the USA.
specs: |-
