description: A complete microphone floor stand solution offering a high-quality
  stage voice or instrument mic in an elegant and exclusive design.
details: |-
  Using the MMC4011 Cardioid Microphone Capsule for its directional quality and attention to detail, this solution makes everything sounds like the original. A complete microphone floor stand solution offering a high-quality stage voice or instrument mic in an elegant and exclusive design.

  A flat on-axis frequency response and excellent phase response deliver a faithful reproduction of the original sound. The off-axis response is similarly smooth so that any leakage is an accurate reflection of the original, though attenuated according to the true first-order cardioid pickup pattern.

  Due to its modular nature, the 4011 Cardioid Microphone Boom can be combined with different lengths of podium booms – 15, 30 or 45 cm (6, 12 or 18 in). If longer booms are needed for floor stands with visual elegance, our long booms at 75 or 120 cm (30 or 48 in) make a high-quality stage voice mic together with our dedicated accessories.

  4011 Gooseneck Microphones come in five lengths:
  - 20 cm (8 in), 32 cm (13 in) and 47 cm (18 in) boom intended for podium solutions
  - 77 cm (30 in) and 122 cm (48 in) for floor stand applications
specs: |-
  - Directional pattern: Cardioid
  - Principle of operation: Pressure gradient
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range, ±2 dB, at 30 cm (11.8 in): 40 Hz - 20 kHz
  - Sensitivity, nominal, ±2 dB at 1 kHz: 10 mV/Pa; -40 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 18 dB(A) re. 20 µPa (max. 20 dB(A))
  - Equivalent noise level, ITU-R BS.468-4: Typ. 25 dB
  - Distortion, THD < 1%: 136 dB SPL RMS, 139 dB SPL peak
  - Dynamic range: Typ. 121 dB
  - Max. SPL, THD 10%: 144 dB SPL peak
  - Rated output impedance: 100 Ω
  - Cable drive capability: 100 m (328 ft)
  - Output balance principle: Impedance balancing
  - Common mode rejection ratio (CMRR): > 40 dB
  - Power supply (for full performance): P48 (Phantom Power)
  - Current consumption: 3.5 mA
  - Connector: XLR-3M. Pin 1: shield, Pin 2: signal + phase, Pin 3: - phase
  - Microphone diameter: 19 mm (0.75 in)
  - Capsule diameter: 19 mm (0.75 in)
  - Microphone length: Capsule: 23 mm (0.9 in), Boom poles: 20 cm (8 in), 32 cm (13 in), 47 cm (18 in), 77 cm (30 in), 122 cm (48 in)
  - Maximum output voltage, RMS: 2.2 V
  - Polarity: +V at pin 2 for positive sound pressure
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Matching tolerance (frequency response and sensitivity): ±1 dB
  - Phase deviation for kit: < 10°
  - Color: Matte black
