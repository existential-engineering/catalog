details: |-
  Gretsch's time-honored 'Broadkaster' name now adorns the flagship guitars of its center block lineup, crafted for full-spectrum sound at high volume with powerful new pickups and a chambered spruce center block that enhances body resonance for more organic tone and comfortably lighter weight.

  For big sound in a small package, the G6659TG Players Edition Broadkaster Jr. Center Block with Bigsby and Gold Hardware features a slightly smaller single-cutaway body for greater comfort, tonal focus and feedback resistance, all with a matching headstock and gleaming gold hardware. Two new U.S.-made Full'Tron pickups deliver full-spectrum sonic range with a growl unlike any other pickup, in addition to classic Gretsch chime, balance and brilliance with a dash of extra-mid concentration for powering through overdriven and distorted passages at full volume.

  The G6659TG is available in a pair of classic Gretsch finishes - Cadillac Green or Vintage White, and decked out with a matching headstock, tortoise pickguard and gleaming gold hardware.
