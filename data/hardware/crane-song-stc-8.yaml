details: |-
  The STC-8 is a high quality compressor that delivers consistent gain control without sacrificing musical definition or harmonic richness. It utilizes a remarkably dependable peak limiter that provides overload protection that is critical to digital recording and broadcast transmitters. The STC-8 is engineered to provide musically transparent gain control, but is also capable of emulating vintage equipment and creating distinctive new sounds.

  In addition, a switchable enhancement circuit creates analog and tube-like warmth to enrich lifeless audio and digital recordings. This vast flexibility is simplified by the inclusion of several optimized presets, allowing fast, easy set-up on a wide variety of sounds. It can operate in true stereo or discrete independent mono, accessible by a front panel switch.

  The STC-8's sophisticated side-chain allows both compression and peak limiting to take place simultaneously, using the same proprietary gain control circuit. High signal quality is maintained by utilizing the discrete class A audio path and by eliminating any VCA or optical gain control elements.

  The STC-8 requires 2 rack spaces. All inputs and outputs are transformer-less and balanced. The toroidal power transformer is UL approved and allows four line voltages for international use.
specs: |-
  - Simultaneous Compression/Limiting
  - Discrete Class A
  - Balanced/Transformerless I/O
  - Compressor Attack Time: Fast, less than 1mS to 18dB gain reduction; Slow, 100mS for 6dB gain reduction
  - Compressor Release Time: Fast, 50mS for 11 of 12dB; Slow, 20 sec for full 12dB release with PDR enabled
  - Limiter Attack Time: less than 1uS
  - Limiter Release Time: 60mS for 6dB gain reduction
  - Maximum Signal Level: +25dBm (input or output)
  - Noise Floor: -88dBm (20Hz to 20kHz)
  - Frequency Response: 5Hz to 55kHz (Hara mode)
  - Limiter Slope: greater than 10 to 1
  - Power: 100/120/230/240V, 50/60Hz, 55 watts
  - Weight: 19 lbs (8.6 kg), 2 rack spaces
