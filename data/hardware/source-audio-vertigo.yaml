details: |-
  Discover the spiraling and hypnotic power of vintage tremolo. The Vertigo offers three distinct voices of tremolo: warm bias, choppy opto, and swirling harmonic.

  The pedal features three tremolo effect types accessible via a center toggle: Normal (asymmetrical optical), Harmonic (dual frequency reminiscent of Fender "brownface" amps), and Bias (smooth, tube-saturated LFO modulation). It integrates with Neuro 3 software for customization and sharing effects across the One Series platform.

  Users can store up to 6 different effects across two banks (green for live, red for presets). Vertigo offers stereo I/O for wide modulation, Universal Bypass with relay true bypass or transparent buffer options, USB-MIDI connectivity with Neuro Hub compatibility, MIDI Clock sync for external timing, and expression pedal control via Neuro Hub support.
specs: |-
  - Three tremolo voices: Normal (optical), Harmonic, Bias
  - Store up to 6 different effects across two banks (live and preset)
  - Stereo I/O for wide modulation
  - Universal Bypass (relay true bypass or transparent buffer)
  - USB-MIDI connectivity with Neuro Hub compatibility
  - MIDI Clock sync for external timing
  - Expression pedal control via Neuro Hub
  - Housing: brushed anodized aluminum
  - Weight: 0.625 lb
  - Dimensions: 4.6 in. x 2.75 in. x 2.2 in.
  - Power consumption: 165 mA
