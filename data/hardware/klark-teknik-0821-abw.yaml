description: The DN4000 is a two-in-one signal processor that combines fully
  parametric equalisation with precision audio delay in a single 1U rack
  chassis. It is designed for system engineers, theatre sound designers and
  live-sound professionals working with delay-stack PA configurations or
  time-aligned monitor systems.
details: |-
  The DN4000's parametric section offers full continuous control over frequency, Q and gain across each band, delivering the precision that defines a parametric topology. The delay section provides the resolution and range needed for arrival-time alignment across delay-stack PA, distributed-zone installations and main-plus-fill monitor configurations.

  System engineers building large PA designs need delay and EQ to behave predictably and to hold calibration. The DN4000 is engineered to the tolerances that define the DN-series, with a transparent audio path and conservative power and headroom margins.

  The DN4000 is engineered at the United Kingdom facility in Kidderminster, carrying the DN-series approach into hybrid signal-processing territory.
specs: |-
  - Combined parametric equaliser and audio delay
  - Continuous frequency, Q and gain control per band
  - Delay section for arrival-time alignment
  - 1U rack chassis
