name: ELX215
manufacturer: electro-voice
primaryCategory: speaker
url: https://products.electrovoice.com/na/en/elx215/
description: Dual 15-inch two-way passive full-range loudspeaker for high-output
  live applications. Pairs two EVS-15K woofers with a DH-1K 1.5-inch titanium
  compression driver on a 90 degree by 50 degree waveguide, delivering 137 dB
  max SPL and 600 W continuous power handling from a braced 15 mm plywood
  enclosure.
details: >-
  Part of EV's Live X series, the ELX215 is the dual-15 passive flagship of the
  line, sized for medium-to-large mains where a single woofer cabinet cannot
  deliver enough low-end punch or SPL.


  The twin-woofer configuration extends low-frequency output and pushes axial
  sensitivity to 96 dB, while the 1.5-inch DH-1K HF compression driver and 90
  degree by 50 degree waveguide maintain even coverage across the listening
  area.


  A braced 9-ply 15 mm plywood cabinet with textured paint finish and 18 GA
  steel grille is built for the rigors of portable and installed use; dual NL4
  Speakon jacks support daisy-chaining to a second cabinet.
specs: |-
  - Configuration: 2-way passive full-range, dual 15 in
  - LF transducers: 2 x EVS-15K 15 in (381 mm) woofers
  - HF transducer: DH-1K 1.5 in (39 mm) titanium diaphragm compression driver
  - Power handling (continuous / peak): 600 W / 2400 W
  - Frequency response (-3 dB): 62 Hz - 18 kHz
  - Frequency range (-10 dB): 38 Hz - 20 kHz
  - Maximum measured SPL: 137 dB
  - Axial sensitivity: 96 dB
  - Nominal impedance: 4 ohms
  - Minimum impedance: 3.7 ohms
  - Crossover frequency: 1.7 kHz
  - Coverage pattern (H x V): 90 degrees x 50 degrees
  - Recommended high-pass filter: 35 Hz
  - Input connectors: 2 x NL4 Speakon
  - Cabinet material: 9-ply 15 mm plywood, internally braced, textured paint
  - Grille: 18 GA steel with black powdercoat
  - Dimensions (H x W x D): 1154 x 432 x 501 mm (45.44 x 17.02 x 19.73 in)
  - Net weight: 40.7 kg (89.6 lb)
  - Shipping weight: 48.4 kg (106.6 lb)
