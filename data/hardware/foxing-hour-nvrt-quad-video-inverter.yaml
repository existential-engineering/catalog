description: NVRT is a Eurorack module that inverts luma levels of a video
  signal from light to dark and dark to light across four independent circuits.
  It inverts around a 0.5 volt reference rather than around 0 volts as an audio
  inverter would.
details: |-
  NVRT inverts luma levels from light to dark and dark to light and provides four circuits. A video inverter is unlike an audio inverter in that it does not invert around 0 volts. Instead, it inverts around a 0.5 volt reference meaning a video signal of 0 to 1 volt becomes 1 to 0 volts. Documentation
