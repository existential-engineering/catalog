description: A Lowden 35 Series acoustic guitar with Ebony back and sides, whose
  stiffness gives a bright, articulate high end and impressive sustain.
details: |-
  Ebony's natural rigidity has traditionally limited its use to fingerboards, and bridges on acoustic guitars. Yet, its distinctive tonal qualities make it an exceptional choice for guitar bodies as well. The wood's stiffness contributes to a bright, articulate high end and impressive sustain.

  The 35 Series is built from AAAA-grade and above tonewoods, with the buyer choosing both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The Ebony back and sides can be paired with Sitka Spruce, Alpine Spruce, or Sinker Redwood soundboards.

  Every 35 Series guitar is hand built in Ireland and finished with premium appointments, including figured maple or Tasmanian blackwood bindings, handcrafted abalone rosettes, and Lowden-branded Gotoh 510 machine heads.

  Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 35 Series
  - Back and sides: Ebony
  - Soundboard options: Sitka Spruce, Alpine Spruce, Sinker Redwood
  - Body shapes: O (Orchestra), F, S, WL
  - Tuners: Lowden-branded Gotoh 510 machine heads
  - Bindings: figured maple or Tasmanian blackwood
  - Rosette: handcrafted abalone
  - Tonewood grade: AAAA and above
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
  - Country of origin: Ireland
