description: This reusable hard plastic case is full of vital spare parts.
details: |-
  The Drummer's Survival Kit includes a reusable hard plastic case and a set of the spare parts most likely to fail or go missing on a gig.

  The case holds two cymbal felts, one hi-hat felt, two clutch felts, two cymbal sleeves and four snare straps.

  Tension rods are supplied in both common threads: four tom tension rods with washers in 12-24 thread and four in M5, plus four snare tension rods with washers in 12-24 thread and four in M5.

  The kit is rounded out with one drum key, one M8 wing nut, one M6 wing nut, two key screws (1/4 20x9/16), two key screws (1/2 20x3/8) and three hex keys (2mm, 2.5mm and 3mm).
specs: |-
  - Reusable hard plastic case
  - (2) Cymbal Felts, (1) Hi-Hat Felt, (2) Clutch Felts
  - (2) Cymbal Sleeves
  - (4) Snare Straps
  - (1) Drum Key
  - (4) Tom Tension Rods w/ washers (12-24 thread) and (4) with M5 thread
  - (4) Snare Tension Rods w/ washers (12-24 thread) and (4) with M5 thread
  - (1) M8 Wing Nut and (1) M6 Wing Nut
  - (2) Key Screws (1/4 20x9/16) and (2) Key Screws (1/2 20x3/8)
  - (3) Hex Keys (2mm, 2.5mm, 3mm)
