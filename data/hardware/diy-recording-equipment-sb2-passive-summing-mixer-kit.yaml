  Recommended Source Impedance
  100R (standard line output)

  FAQ

  How is the SB2 so inexpensive? Most summing mixers cost at least 10x more. The SB2's radical affordability is due to its radical simplicity. By stripping the passive summing concept down to its essentials and "outsourcing" the pan controls (see below), makeup gain (to mic preamps), and assembly (to you!), we're able to make the SB2 low-cost and pass the savings on to you. Why are there no switches/knobs? How do I pan the inputs? You may have noticed that typical summing boxes are rather expensive, despite containing limited circuitry. This is mostly because they feature panning knobs or switches. In addition to being expensive themselves, these controls necessitate a larger front panel, case, and circuit board. The SB2 bypasses all of these costs by "outsourcing" the panning to your DAW. Each of the SB2's inputs is hard-wired to one of the output channels: odd-numbered inputs to the left, and even-numbered to the right. You simply send pre-panned stereo buses to your interface's hardware outputs and connect them to the SB2. For example:

  1/2: Drums
  3/4: Vocals
  5/6: Guitars
  7/8: Keys/Effects

  For a single track you want panned center, simply send it to a pair of outputs. Do I need to provide makeup gain after the SB2? Yes, being completely passive, the SB2's outputs require 45dB of makeup gain to be returned to line level. The best way to do this is with a pair of mic preamps. Does the SB2 have a "sound"? Nope, a passive summing mixer has essentially no sound of its own. The sound of your summing setup will be determined completely by the mic preamps you use for makeup gain. Indeed, one of the unique benefits of passive summing is that you can tailor your makeup-gain preamp choice to each mix. What is the circuit design based on? The SB2's circuit is a classic passive summing network--the same as found in countless mixers and consoles. The only difference is that instead of dedicated makeup amplifiers, the SB2 has mic-level outputs which must be connected to mic preamps. The circuit is the same one shared by NYDave on GroupDIY and featured in How to Build a Passive Summing Mixer . Do you sell an 8-channel version? You can use the SB2 as an 8 or 16-channel mixer. Just use inputs 1-8 for 8-channel operation. Can I daisy chain two SB2s for 24 or 32-channel summing? No, there is no way to daisy chain two units. We made this design decision because the performance of this kind of passive summing circuit degrades after about 20 channels. Does it come with D-sub breakout cables? Nope, cabling is up to you. Want to feel like a real DIY ninja? Build your own D-sub cables! Can I use the SB2 with unbalanced gear? No, the SB2 only works with balanced inputs and outputs. Docs
