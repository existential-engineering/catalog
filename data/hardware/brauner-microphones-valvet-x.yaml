description: A cardioid-only tube condenser of exceptional intimacy and detail,
  combining breathtaking presence with German craftsmanship and a noise floor
  below 9 dB(A). TEC Award nominee 2009.
details: |-
  The Brauner Valvet X is a dedicated cardioid-only tube condenser microphone, crafted with
  the finest materials and finished in a pristine silky black. It combines breathtaking
  intimacy with charming detail and inspiring presence, representing German craftsmanship and
  technical perfection at its finest.

  Designed for those seeking the real thing, the Valvet X is positioned as unparalleled in
  its class and price point. Every aspect of the microphone's sonic character was refined
  through hours of extensive listening tests, resulting in a microphone that delivers both
  technical excellence and musical inspiration.

  The Valvet X received a TEC Award nomination in 2009, recognizing its contribution to the
  professional audio industry. It operates on either 115 V or 230 V power supply, making it
  suitable for worldwide use.

  With an equivalent noise floor of less than 9 dB(A) and a signal-to-noise ratio exceeding
  85 dB, the Valvet X offers exceptional clarity and dynamic range.
specs: |-
  - Polar pattern: Cardioid only
  - Equivalent noise: < 9 dB(A) (IEC651)
  - Signal to noise: > 85 dB (1 Pa / 1 kHz, Cardioid)
  - Sensitivity: 28 mV/Pa (Cardioid)
  - Frequency range: 20 Hz - 22 kHz
  - Maximum SPL: 142 dB SPL @ 0.3% THD
  - Power supply: 115 V or 230 V
  - TEC Nominee 2009
