description: Active recreation of the iconic 'white cone' studio reference
  monitor, developed with platinum producer Chris Lord-Alge, featuring a
  mid-forward frequency response and 240W RMS Class AB amplification with
  Variable Tissue Paper Control.
details: |-
  The CLA-10 Active is Avantone Pro's powered recreation of the classic
  white-cone reference monitor that has been a studio staple for over 45 years.
  Developed in close collaboration with platinum-selling mix engineer Chris
  Lord-Alge, the monitor is designed as a professional reference tool rather
  than a casual listening speaker, emphasizing the mid-forward frequency
  response that makes vocals and critical mix elements easy to evaluate.

  The system delivers 240W RMS total (120W per speaker) via a Class AB
  monolithic amplifier, chosen for its sonic character and low distortion
  performance. Total harmonic distortion measures 0.005% at low power and
  0.1% at rated load. The power supply uses a linear design with a toroidal
  transformer, deliberately avoiding switch-mode designs in order to preserve
  the legacy sound character associated with the original monitors.

  A standout feature is the VTPC (Variable Tissue Paper Control), which
  simulates the high-frequency dampening effect of the tissue paper dust cover
  found on original units of varying age and condition. This control allows
  engineers to adjust the high-frequency response to match the sonic signature
  of different original specimens.

  The custom-engineered drivers — the AV10-MLF 18 cm low-frequency cone and
  AV10-MHF 3.5 cm soft dome tweeter — were recreated from original
  specifications to faithfully reproduce the frequency response of the source
  material. The sealed cabinet is constructed from hybrid medium-density
  fiberboard with real wood veneer.

  The CLA-10 Active is sold as a stereo pair and is part of a broader CLA
  ecosystem that includes the passive variant, power amplifiers (CLA-100,
  CLA-200, CLA-400), and replacement driver components.
specs: |-
  - System Type: Active full-range two-way stereo pair
  - Total Power: 240W RMS (120W per speaker)
  - Frequency Response: 60 Hz–20,000 Hz
  - Amplification: Class AB monolithic design
  - THD: 0.005% at low power; 0.1% at rated load
  - LF Driver: AV10-MLF 18 cm cone
  - HF Driver: AV10-MHF 3.5 cm soft dome
  - Cabinet: Sealed design, hybrid MDF with real wood veneer
  - Controls: Volume, VTPC (Variable Tissue Paper Control), Ground lift
  - Power Supply: Linear with toroidal transformer
  - Dimensions: 381.5 mm × 215 mm × 197.5 mm (15" × 8½" × 7¾")
  - Weight: 8 kg / 17.6 lbs (each)
