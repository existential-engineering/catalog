description: Imperialstar complete drum kits provide everything a drummer needs
  at an affordable price. The Imperialstar line offers various choices of kit
  configurations and finishes, availability of add-on drums, precisely-processed
  drum shells and reliable, durable hardware.
details: |-
  Spur Brackets: Imperialstar spur brackets provide maximum durability and stability.

  Accu-Tune Hoop: TAMA's Accu-Tune hoops have it all. Their hi-tech GFRP material offers both lighter weight, and faster, more stable tuning than traditional metal hoops. Since Accu-Tune hoops use tension bolts instead of clawhooks and T-rods, head changes and packing up are a breeze. A special groove at the bottom of the hoop offers easy and secure pedal connection even when the bass drum is angled.

  Tom Holder: TAMA L-Rod and Omnisphere tom holder systems have received acclaim from drummers for over 25 years. These systems offer easy positioning, maximum flexibility, stability and greater sound than standard designs which penetrate the shell interior and can inhibit resonance.

  MEINL HCS Cymbals: Imperialstar all-in-one "READY-TO-ROCK" packages not only have everything you need to rock, you'll rock better with HCS genuine brass cymbals from Meinl®, the cymbal maker of choice for many of today's new generation drummers.

  TAMA Precision Bearing Edges: A drum's bearing edge is one of the most important components in drum sound. Our advanced edge-cutting process provides extremely precise bearing edges - which allow TAMA shells to ring openly and fully, and provide a wide range of tune ability, sensitivity and response

  Shells:100% poplar 8mm 6ply: Poplar wood has been used in making drum shell for over 50 years. It offers a full, warm tone combined with medium attack.
