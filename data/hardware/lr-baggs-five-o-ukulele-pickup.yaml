description: Amplifying a ukulele used to mean taking a random guitar pickup
  system and trying to adapt it to fit, or installing a large, bulky onboard
  preamp/EQ system that weighed more than the instrument itself. We created the
  Baggs Five.O Ukulele Pickup to solve both of these problems.
details: |-
  Amplifying a ukulele used to mean taking a random guitar pickup system and trying to adapt it to fit, or installing a large, bulky onboard preamp/EQ system that weighed more than the instrument itself. We created the Baggs Five.O Ukulele Pickup to solve both of these problems. First, we engineered the undersaddle pickup specifically for the ukulele’s unique voice and frequency range. Second, we made every aspect of the pickup as small as possible—the endpin jack, coin cell battery, and volume control wheel were all designed to fit comfortably into a uke, so that your instrument can maintain its natural body character and inherent tone.
specs: |-
  - Custom Element undersaddle pickup voiced for the ukulele's frequency range
  - Miniature endpin preamp with High-Graded FET input
  - Soundhole-mounted volume control wheel
  - Easy-in pull guide for installation
  - Super lightweight design
  - Single 3V CR2032 coin cell battery, 300+ hours of battery life
