description: The ABM 1200 EVO IV is a 1200W bass amp head built for the biggest
  stages and the studio. It features a sophisticated 9-band EQ with sliders for
  precise cut and boost, an upgraded Variable Valve Drive preamp that runs from
  pristine clean to full overdrive, and a One Knob Dynamic Compressor.
  Professional connectivity includes a tuner output, line out, transparent FX
  loop and a line input, and it can power single 8 ohm cabinets or pairs of 4 or
  8 ohm cabinets. Valve Drive, Compression, EQ and Sub-Harmonic Generation are
  footswitchable via the optional FS-4.
details: |-
  Ashdown ABM EVO IV bass head. 1200W power. Sophisticated 9-band EQ with sliders for precise cut and boost across multiple frequencies, footswitchable so players can move from a flat fretless sound to a favourite EQ setting. Upgraded Variable Valve Drive preamp, from pristine clean to full overdrive, footswitchable. One Knob Dynamic Compressor. Sub-Harmonic Generator. Professional connectivity: tuner output, line out, transparent FX loop and a line input for external samplers or sound sources; output muting allows silent tuning. Flexible partnering options: powers single 8 ohm cabinets or pairs of 4 or 8 ohm cabinets. Footswitchable Valve Drive, Compression, EQ and Sub-Harmonic Generation via the FS-4 footswitch (not included).
specs: |-
  - Power output: 1200W
  - 9-band EQ
  - Variable Valve Drive preamp
  - One Knob Dynamic Compressor
  - Sub-Harmonic Generator
  - Powers single 8 ohm cabinets or pairs of 4 or 8 ohm cabinets
