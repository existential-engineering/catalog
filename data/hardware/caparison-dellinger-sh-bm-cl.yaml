description: A limited-edition 30th anniversary electric guitar featuring a Burl
  Maple Radiant Grain top, MB3B Australian Blackwood/maple body, and Caparison
  SH-NC and PH-bcm pickups.
details: |-
  To celebrate Caparison Guitars' 30th anniversary, we created a limited-edition instrument that embodies our dedication to craftsmanship, tone, and innovation. This project began with the discovery of a rare and visually striking slab of Burl Maple Radiant Grain —a unique and highly coveted tonewood known for both its aesthetic appeal and sonic character. True to Caparison's design philosophy, this figured maple isn't just a decorative top; it serves as a full 17mm-thick tonewood, directly shaping the instrument's sound profile. The body construction features our original "MB3B" design, pairing Australian Blackwood wings with a central maple strip. A five-piece maple-walnut neck is integrated into the body's core, resulting in exceptional sustain that rivals neck-thru builds. This synergy creates a tonal signature that blends the articulate, brilliant highs of the Radiant Grain maple with the dynamic attack of a bolt-on neck and the full-bodied response of the MB3B structure. Visually, the guitar maintains the sleek, purposeful design of the classic Dellinger, with iconic details like the Devil's Tail headstock, clock inlays, original Caparison pickups, and a minimalist control layout. Notably, this is the first Dellinger to feature an SH pickup configuration: the neck is fitted with a compact humbucker called the "SH-NC," while the bridge houses the powerful "PH-bcm," offering clean, high-output performance that complements the guitar's tonal foundation. These are controlled via a Schaller "Megaswitch M" five-way lever, unlocking a versatile array of tonal options. Playability is enhanced with an ebony fingerboard featuring "Luminlay SG-20" side dots for superior visibility in low light, and jumbo stainless steel frets for durability and smooth action. The satin finish is intentionally minimal, allowing the natural resonance of the carefully selected woods to shine through — both visually and acoustically. The headstock cap is also cut from the same slab of Radiant Grain maple as the top, tying the design together with a consistent aesthetic. Offered in two finishes — Amber Matt and Black Amber Matt — this exclusive model bears a commemorative gold "Custom Line" logo on the headstock. Even the truss rod cover is made from genuine ebony, reflecting the attention to detail in every element of the build. This guitar stands not only as a celebration of three decades of Caparison Guitars but also as a thank-you to our devoted customers, artists, partners, and everyone who helped bring this instrument to life. — Caparison Guitars Designer: Itaru Kanno
