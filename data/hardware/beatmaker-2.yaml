details: |-
  Combining music production tools that were behind the success of countless
  artists, BeatMaker 2 is a powerful, easy-to-use composition interface for
  amateurs and professionals alike. Build your own virtual home-studio, create
  multiple instruments and connect them to a full-range of audio effects.

  Compose, record, arrange and transform your ideas into complete songs, ready
  to be shared with others. Import your own sounds or use the sound library
  provided: more than 170 high-quality instrument and drum presets from
  synthesizers to realistic orchestral sounds. You can even import songs from
  your ipod library.

  Connect your MIDI accessories for an external control of beatmaker's
  instruments, effects and mixer, ideal for home-studio productions and live
  performances. Using MIDI outputs and virtual ports, beatmaker can now control
  your hardware instruments and compatible ios music applications within
  beatmaker, unleashing whole new sonic possibilities by connecting to other
  synthesizers and sequencers.

  The keyboard sampler features a 128-key keyboard with pitch wheel, double
  keyboard mode, note display and zoom controls. Easily create your own
  instruments from any sample combination with the keygroup editor, including
  volume and filter adsr envelopes, low/high pass filter with cutoff, resonance
  and key tracking, 2 lfos with customizable amplitude, offset and rate,
  polyphony control up to 32 voices, and legato play mode with customizable
  glide.

  The wave editor provides a full-fledged wave editor with intuitive pinch and
  selection for manipulating samples, chop lab for easily slicing samples and
  automatically creating presets and patterns, basic edition tools with 8 levels
  undo/redo, high quality time-stretching and pitch-shifting algorithms, audio
  tools including normalize, silence, reverse, fade in and out, cross-fade, and
  the ability to record new samples from device microphone or plugged instrument
  with loop points and tempo/signature editor.
specs: |-
  - Multi-track sequencer

  - Drum machine with up to 128 trigger pads

  - Keyboard sampler with 128-key keyboard

  - 10 effect units (reverb, compressor, filter, delay, eq, flanger, chorus,
  autopan, bitcrusher, overdrive)

  - 3 effect slots per instrument with unlimited global effect racks

  - Customizable cross controller

  - MIDI inputs, outputs, virtual ports and sync support

  - Pitch wheel and double keyboard mode

  - Volume and filter adsr envelopes

  - Low/high pass filter with cutoff, resonance and key tracking

  - 2 lfos with customizable amplitude, offset and rate

  - Polyphony control up to 32 voices per keyboard sampler

  - Legato play mode with customizable glide

  - Wave editor with pinch and selection tools

  - Chop lab for sample slicing

  - Time-stretching and pitch-shifting algorithms

  - Audio tools: normalize, silence, reverse, fade in and out, cross-fade

  - Record from device microphone or plugged instrument

  - Loop points and tempo/signature editor

  - Realistic multi-track mixer with level meters

  - Solo, mute and bus routing features

  - Pad trigger modes: one-shot, hold & loop

  - Automations for instrument and effect parameters

  - Piano-roll interface for pattern composition

  - Quantize modes and auto-repeat

  - Native ipad and iphone interfaces

  - Retina display support

  - Import MIDI files

  - Export to audio or MIDI files

  - Virtual MIDI support

  - Korg wist support

  - Integrated ftp server for file management

  - Import songs from ipod library

  - Ios pasteboard sharing with 20+ music applications

  - Soundcloud upload support

  - Dropbox integration

  - Bluetooth speaker and headphone support (a2dp-compliant)

  - Supports beatmaker 1 kits and projects

  - 68 drum machine presets

  - 111 keyboard sampler presets

  - More than 1800 quality samples
