url: https://www.kieselguitars.com/series/guitar/lightspeed-series
description: A headless descendant of the headstock-equipped Hyperdrive,
  balanced lighter by the removal of the headstock and a scaled-down body.
  Depending on selected specs, it usually saves around 2 lbs compared with the
  Hyperdrive.
specs: |-
  - Configurations: LS6 and LS7 model codes appear in the gallery, with a tremolo LS6X form and a multiscale option
  - Construction: neck-through, headless
  - Body: alder
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck widths: 1.69 in, 1.71 in, 1.90 in or 1.92 in at nut depending on configuration
  - Fingerboard: ebony with 20 in radius
  - Frets: 24 stainless steel medium-jumbo, .103 in wide x .048 in tall
  - Scale lengths: 25.5 in, or 25.5 in to 26.5 in and 25.5 in to 27 in multiscale
  - Bridge: Hipshot headless fixed bridge or Hipshot Solo Saddle, .4125 in (10.5 mm) spacing
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume control, 3-way pickup selector
  - Inlays: white pearl dots, black-ring Luminlay Super Blue side dots
  - Hardware: black
  - Body dimensions: 31.5 in long, 1.66 in thick, 12 in wide, or 31.65 in long, 1.65 in thick, 12.125 in wide
  - Weight: 7.5 lbs to 7.75 lbs
  - Strings: Elixir Nanoweb 1046E
