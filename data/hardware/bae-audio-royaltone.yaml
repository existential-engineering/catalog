description: The Royaltone is a dual-stomp fuzz pedal pairing vintage English
  fuzz circuits with an in-series 3-band tone circuit. The fuzz section delivers
  an instantly recognizable spitting, buzzy grit, while the left footswitch
  controls a 3-JFET tone stack. Handbuilt in the USA with true bypass on both
  sections.
details: |-
  The Royaltone explores vintage English fuzz circuits in a dual-stomp format featuring a powerful in-series 3-band tone circuit. The fuzz section imparts an instantly recognizable spitting, buzzy grit that cuts right through even the densest mix.

  The left footswitch (green LED) controls a 3-JFET transistor tone stack with Mid (+12.5 dB), Bass (+13.6 dB), and Treble (+16.1 dB) controls. The right footswitch (red LED) engages the Tone Bender/Fuzz section — built around 1 JFET and 2 bipolar transistors — with Attack (20 dB) and Level (20 dB) controls.

  Each section has true bypass switching. Components include sonically selected film, ceramic, mica, and electrolytic capacitors. Powered by a single 9V battery or external 2.5mm center-negative power jack.
specs: |-
  - Circuit: All solid-state; 4 bipolar + 3 JFET transistors
  - Tone Stack Gain: Mid +12.5 dB, Bass +13.6 dB, Treble +16.1 dB
  - Fuzz Gain: Attack 20 dB, Level 20 dB
  - True Bypass: Individual footswitches per section
  - Power: 9V battery or 2.5mm center-negative DC jack
  - Current Draw: 7 mA idle, 13 mA max (both sections on)
  - Dimensions: 3.625"W × 6.25"D × 3.125"H
