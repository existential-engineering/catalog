description: >-
  A monophonic analog synthesizer from East German manufacturer Vermona,
  featuring two VCOs, a 24 dB/oct resonant filter, and a straightforward
  knob-per-function layout housed in a classic wood-paneled enclosure.
details: |-
  The Vermona Synthesizer stands as one of the few analog synthesizers produced behind the Iron Curtain during the 1980s. Built by the German music company Vermona, it offered a no-frills approach to subtractive synthesis with a design philosophy focused on accessibility and directness. Its colorful knobs and clean panel layout, framed by vintage wood end-cheeks, give it a distinctive aesthetic that sets it apart from its Western contemporaries.

  The sound architecture centers on two VCOs offering pulse, ramp, square, and noise waveforms, fed through a 24 dB/octave analog filter with dedicated controls for brilliance, cutoff, resonance, and contour. A single LFO provides modulation to either the VCO or VCF sections, while a standard ADSR envelope shapes the amplitude. The filter section includes five presets plus a manual mode, and the VCA offers a similar arrangement, though there is no true patch memory storage.

  While its capabilities are modest by comparison to many Western synths of the era, the Vermona excels at producing solid analog bass tones. Its dual oscillators provide enough harmonic material for punchy low-end sounds, though string emulations and more complex patches are limited by the simple architecture. The only onboard effects are portamento-style glide and vibrato.

  Notably absent from the Vermona Synthesizer are MIDI, CV/Gate connectivity, arpeggiators, and any form of sequencing, making it a purely standalone performance instrument. Its 44-key keyboard and lack of external control options reflect its origins as a self-contained instrument designed for the East German music market during the Cold War era.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (pulse, ramp, square, noise)
  - Filter: 24 dB/oct analog with brilliance, cutoff, resonance, contour
  - LFO: 1 (speed, VCF modulation, delay)
  - Envelope: ADSR (VCA)
  - Keyboard: 44 keys
  - Memory: None (5 VCF presets + 1 user, 5 VCA presets + 1 user)
  - Effects: Glide, vibrato
  - Control: None (no MIDI, CV, or Gate)
