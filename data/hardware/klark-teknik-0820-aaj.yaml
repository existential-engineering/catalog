  per-channel rotary delay setting of earlier units.
details: |-
  The DN728 is a dual-input, six-output digital delay line with up to 1.3 seconds of total delay, upgradable to 5.2 seconds, and 64 memory locations. Its configurations range from a three-output stereo delay to a six-output mono delay including dual-delay assignments, and software control replaces the per-channel rotary delay setting of earlier units in the series.

  Configurations are set from the front panel and stored automatically alongside delay settings in one of 64 memories. Each output can be assigned to either input independently, and a variable amount of delay memory can be reassigned between channels, which helps when one channel needs extended delay and the other only a short alignment offset.

  Each output offers software-adjustable gain from +4 dB to -14 dB in 1 dB steps, plus channel mute. A rear-panel two-position switch selects a nominal operating level of 0 dB or +10 dB, each with 10 dB of headroom, covering both consumer and professional reference standards.

  Delays can be set as absolute or relative values for quick alignment of delayed speaker stacks, and a distance-mode setting includes temperature compensation to correct for the variation in the speed of sound across outdoor festival environments. Retrofittable remote control interfaces include Intelix Mind-Net, MIDI, RS422 and GPI.

  Typical applications are large-venue and festival delay-tower alignment, broadcast multi-source delay, and theatre or installation work that needs memory-recalled delay configurations.
specs: |-
  - 2 inputs, 6 outputs, 64 memory locations
  - 1.3 s base delay, upgradable to 5.2 s
  - Delay memory reassignable between channels
  - Each output independently assignable to either input
  - Per-output software gain from +4 dB to -14 dB in 1 dB steps, plus channel mute
  - Rear-panel operating level switch: 0 dB or +10 dB, 10 dB headroom each
  - Absolute or relative delay values, with a distance mode including temperature compensation
  - Retrofittable remote control interfaces: Intelix Mind-Net, MIDI, RS422, GPI
  - 1U rackmount
