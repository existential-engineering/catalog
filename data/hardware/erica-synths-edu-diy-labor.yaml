description: Fully-featured circuit design playground.
details: |-
  MKI x ES Labor is a way into circuit design. Developed in collaboration with Dr. Shalom D. Ruben, teaching professor of engineering at the University of Colorado, Labor is a fully-featured circuit design playground and a powerful electronics learning tool in one. It was created as a universal platform for electronics education, so users can explore a wide range of topics, from fundamental concepts to advanced design techniques.

  Whether the user is a beginner learning the basics or an experienced engineer refining their skills, Labor offers a versatile platform for experimentation and discovery. It suits building filters, oscillators, envelopes and sequencers, or following along with the mki x es.EDU series of educational DIY kits.

  A built-in dual power supply provides Eurorack-compatible voltages with overcurrent (short-circuit) protection for safe experimentation. The modular interfacing section carries 16 slots for potentiometers, jacks and switches, and template files for the Labor Switch and Potentiometer boards are available as assembly, Gerber and KiCad archives, with the connector placement shown as viewed from the top layer even though the connectors sit on the bottom layer.

  Analog building blocks are included: a pulse, triangle and sine oscillator covering audio and LFO range, a multi-mode envelope generator controlled by a Cherry push button, a buffered variable control voltage source, and an output amplifier with adjustable gain. A dedicated headphone output and a line-level output handle recording, processing and analysis, and an expansion slot takes specialized prototyping tools such as Labor Scope. A protective lid covers the breadboard and preserves the circuit between sessions.

  Labor ships as a partial DIY kit: many parts are pre-assembled, others require manual assembly and soldering. The Basic Kit includes the Labor unit, a wall wart power supply, jumper cables and a selection of interfacing elements (potentiometers, jack sockets, switches). The Full Kit adds a wide assortment of essential components (resistors, capacitors, ICs, transistors) so building can start right away.
specs: |-
  - Built-in dual power supply with Eurorack-compatible voltages and overcurrent (short-circuit) protection
  - Modular interfacing section with 16 slots for potentiometers, jacks, and switches
  - Pulse/triangle/sine oscillator (audio and LFO range)
  - Multi-mode envelope generator controlled by a Cherry push button
  - Buffered variable control voltage source
  - Output amplifier with adjustable gain
  - Dedicated headphone output and line-level output
  - Expansion slot for specialized prototyping tools such as Labor Scope
  - Protective lid to cover the breadboard
  - Ships as a partial DIY kit, some parts need manual assembly and soldering
  - Basic Kit: Labor power supply (wall wart), jumper cables, selection of interfacing elements
  - Full Kit: everything in the Basic Kit plus resistors, capacitors, ICs and transistors
