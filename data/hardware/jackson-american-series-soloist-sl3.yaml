description: The next chapter in Jackson's storied legacy, marking the first
  made-in-Corona flagship product line. Features neck-through construction with
  24 jumbo frets, inverse mother of pearl sharkfin inlays, and Seymour Duncan
  HSS pickup configuration with a Floyd Rose double-locking tremolo.
specs: |-
  - Body: Alder, Soloist shape
  - Neck: 3-piece maple, neck-through-body construction with graphite reinforcement
  - Fingerboard: Ebony
  - Frets: 24 jumbo
  - Scale length: 25.5"
  - Radius: 12"-16" compound radius
  - Nut width: 1.6875"
  - Nut: Floyd Rose R3 locking
  - Inlays: Inverted mother of pearl sharkfin
  - Side dots: Luminlay
  - Bridge pickup: Seymour Duncan JB TB-4 (humbucker)
  - Middle pickup: Seymour Duncan Custom Flat Strat SSL-6 RWRP (single-coil)
  - Neck pickup: Seymour Duncan Custom Flat Strat SSL-6 (single-coil)
  - Pickup config: HSS
  - Controls: Volume, Tone, 5-position blade switch
  - Bridge: Floyd Rose 1500 Series double-locking tremolo
  - Tuners: Gotoh MG-T locking
  - Strap buttons: Dunlop dual-locking
  - Hardware finish: Black
  - Strings: Nickel plated steel (.009-.042)
  - Finishes: Gloss Black, Platinum Pearl, Riviera Blue, Satin Slime Green
  - Includes: Jackson foam-core case
  - Made in: Corona, CA, USA
