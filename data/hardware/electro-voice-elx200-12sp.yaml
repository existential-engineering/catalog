url: https://products.electrovoice.com/na/en/elx200-12sp/
description: The ELX200-12SP is a 12-inch powered subwoofer for portable and
  installed sound applications. A high-efficiency 1200 W Class-D amplifier
  drives an EVS-12L 300 mm (12 in) woofer in a 15 mm plywood enclosure with
  EVCoat finish, delivering up to 129 dB maximum SPL with low-frequency
  extension to 41 Hz (-10 dB). Integrated QuickSmartDSP provides three system
  presets (Music, Live, Club), sub/top system matching, five user-programmable
  presets, a three-band EQ with store/recall, adjustable low-pass crossover (80
  / 100 / 120 / 150 Hz), and visual limiter/level monitoring. The EV QuickSmart
  Mobile app can wirelessly configure, control, and monitor up to six ELX200
  loudspeakers simultaneously (Bluetooth available in select countries). The
  cabinet features an integrated M20 threaded pole-mount plate and a two-handle
  design for easy transport.
details: >-
  Class-D power amplifier rated at 1200 W


  EVS-12L 300 mm (12 in) low-frequency transducer


  QuickSmartDSP with three presets (Music, Live, Club), three-band EQ, and
  store/recall


  Five user-programmable presets with sub/top system matching


  Adjustable low-pass crossover: 80 / 100 / 120 / 150 Hz


  Maximum SPL of 129 dB


  Frequency response 49 Hz - 135 Hz (-3 dB), 41 Hz - 165 Hz (-10 dB)


  EV QuickSmart Mobile app for wireless control of up to six ELX200 loudspeakers
  (Bluetooth available in select countries)


  15 mm plywood enclosure with EVCoat finish


  18 AWG steel grille with powdercoat


  Integrated M20 threaded pole-mount plate


  Two-handle design for easy lifting


  Available in black or white
