description: >-
  The Roland JD-990 is an enhanced rack-mount version of the JD-800, featuring digital
  synthesis with analog-style editing parameters including lowpass filtering, ring
  modulation, oscillator sync, and frequency cross-modulation. It includes 6MB of ROM
  waveform data, a large LCD display for intuitive patch editing, and an onboard
  multi-effects processor with delay, reverb, phaser, distortion, chorus, and EQ.
details: |-
  The JD-990 represents the top of Roland's JD synthesizer line, utilizing a rack-mount design that proved hugely influential for the subsequent JV-series and XV-series modules. As a digital synthesizer, it provides analog-like edit parameters and synthesis features including lowpass filtering, ring modulation, oscillator sync, and frequency cross-modulation.

  The instrument features a large LCD display enabling intuitive editing with visual representations of envelopes and LFO rates. An onboard multi-effects processor includes delay, reverb, phaser, distortion, chorus, and EQ capabilities. For studio integration, it provides MIDI IN/OUT/THRU connectivity and eight outputs arranged as four stereo pairs.

  The JD-990 accepts one internal expansion board, with the Vintage expansion being the recommended choice, offering approximately 512 patches, including 256 specially programmed for the JD-990. It is also compatible with JV-80 and JD-800 expansion boards.

  Notable users include Vangelis, The Prodigy, Apollo 440, ATB, and Mirwais.
specs: |-
  - 24-voice polyphony
  - 6MB ROM waveform data, expandable to 16MB
  - 4 oscillators per patch
  - 3 banks x 64 patches, expandable
  - 3 drum kits with 61 sounds
  - 2 LFOs per patch
  - TVF with lowpass, bandpass, and highpass modes with resonance and envelopes
  - TVA envelopes and pitch envelopes
  - Ring modulation, oscillator sync, and frequency cross-modulation
  - Multi-effects processor: delay, reverb, phaser, distortion, chorus, EQ
  - 6-part plus rhythm multitimbral via MIDI
  - 8 audio outputs (4 stereo pairs)
  - MIDI IN/OUT/THRU
  - 1 internal expansion board slot (compatible with JV-80 and JD-800 boards)
  - 2U rack-mount form factor
releaseDate: "1993"
