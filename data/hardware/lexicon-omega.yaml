  - legacy
url: https://lexiconpro.com/en-US/products/omega
description: 8x4x2 USB desktop recording studio with dbx Silver Series mic
  preamps, instrument input, S/PDIF and MIDI I/O, bundled with Cubase LE 5 and
  the Pantheon VST reverb.
specs: |-
  - 8x4x2 desktop recording studio (8 inputs, 4 record buses, 2 main outputs)
  - Two dbx Silver Series mic preamps with +48V phantom power
  - 4 TRS line inputs accepting up to +22 dBu
  - 1 high-impedance (Hi-Z) instrument input
  - Stereo S/PDIF digital inputs
  - Fully opto-isolated MIDI input and output
  - TRS insert points per channel
  - Channel peak indicators and assignable bargraph meter
  - 24-bit converters
  - USB connectivity to host computer
  - Power: 9 VAC 1300 mA (PS0913B adapter)
