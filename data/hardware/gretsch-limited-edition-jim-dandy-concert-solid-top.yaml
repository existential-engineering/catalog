details: |-
  Well suited for everything from bluesy porch pickin' to speakeasy swingin', the Gretsch Limited Edition Jim Dandy Concert Solid Top is a ramblin' companion for newbies and old-timers alike. Inspired by the historic 'Rex' line of instruments offered by mail-order catalog in the 1930s, '40s and '50s, Jim Dandy models embody the charm and spirit of those early flat-top guitars with superior playability and best-in-class tone.

  Featuring a comfortable and compact concert body shape, a solid spruce top, and a modest 24.75" scale length, it strikes the perfect sweet-spot of versatile tone and approachable playability for a wide variety of musical settings.
