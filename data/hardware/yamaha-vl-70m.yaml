description: >-
  The VL-70m is a rack-mounted virtual acoustic tone generator released by
  Yamaha in 1996 that employs physical modeling technology to generate
  high-quality monophonic sounds. It simulates complex vibrations, resonances,
  reflections, and other acoustic phenomena that impact the sounds of real wind
  or string instruments. The unit features extensive editing capabilities along
  with built-in reverb, chorus, variation, and distortion effects.
details: |-
  The VL-70m represents a novel approach to sound generation, distinguishing itself through virtual acoustic synthesis rather than traditional oscillator-based methods. This technology enabled musicians to achieve expressive, natural-sounding tones previously difficult to attain through conventional synthesis techniques.

  The unit features extensive editing capabilities with a built-in effects section that offers independent reverb, chorus, and variation as well as distortion effects. Yamaha provided peripheral software solutions including a visual editor with clickable interfaces, an analog editor for familiar control layouts, and an expert editor for accessing complete physical modeling parameters.

  The VL-70m demonstrates remarkable versatility in controller compatibility. Beyond keyboard operation, it accommodates a WX-series Wind MIDI controller via a dedicated WX IN jack and connects to computers through a TO HOST connector without requiring separate MIDI interfaces. Users can employ breath controllers or guitar MIDI converters for enhanced musical expression.

  The device offers 256 presets in two banks with VL-XG mode effects support, balancing extensive sound options with straightforward operation through its backlit LCD panel and intuitive button layout.
specs: |-
  - 1 voice polyphony (monophonic)
  - 1 part multitimbral
  - 1 oscillator
  - 24dB slope (4-pole) low pass filter with resonance
  - 1 LFO with triangle and delay
  - Reverb, chorus, variation, and distortion effects
  - 64 patches RAM, 256 patches ROM
  - MIDI In/Out/Thru
  - WX IN jack for Wind MIDI controller
  - Breath controller jack
  - Headphones jack
  - Output L/MONO and R jacks
  - TO HOST connector for computer connection
  - DC-In power connector
