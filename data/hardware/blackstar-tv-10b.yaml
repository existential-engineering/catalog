description: Boutique, single-ended valve tone in a stunningly simple 10w combo.
details: |-
  The TV-10 B is a dynamic, studio ready valve amplifier that pays tribute to the British tones of classic rock, punk, indie and more. The TV-10 B embraces simplicity and iconic British tonal character within a compact enclosure. With its EL34 power valve and boutique aesthetics, it promises authentic British tones and styling.

  The EL34 power valve is often revered as the tonal heartbeat of many well-known classic British amplifiers. Their characteristic mellow, warm low-end and powerful mids make these power valves the perfect match for the dynamic TV-10 B.

  Designed for an effortless plug-in-and-play experience, the TV-10 B blends both incredible tones and ease of use. The TV-10 B's simple controls allow you to quickly access timeless and classic British amplifier tones, encapsulating everything from warm cleans to British crunch.

  The compact form of the TV-10 B is perfect to have around the house, in the studio or even smaller live performances. Professional features such as a custom-voiced reverb, footswitching and an effects loop make this valve amplifier fully equipped for today's performance requirements.

  The custom-voiced digital reverb has been meticulously designed to emulate the warmth and depth of vintage British valve amps, with tonal references drawn from classic reverb units. The TV-10 B combo features a classic 12 inch Celestion Seventy 80 loudspeaker; a companion TV-10 BH head and TV-112 B cabinet are also available in the TV Series range.
specs: |-
  - Power: 10W
  - Valves: 1x ECC83, 1x EL34
  - Speaker: 1x 12" Celestion Seventy-80
  - Boost/Drive Option: Boost
  - Controls: Gain, Tone, Reverb, Master, Boost Button
  - Emulated Output: Yes
  - Effects Loop: Yes (Series)
  - Speaker Outputs: 1 x 16 Ohm, 1 x 8 Ohm and 2 x 16 Ohm
  - Weight: 15.11kg
  - Dimensions: 473 x 421 x 251 (mm)
  - British Class A, EL34 valve tones
  - Custom-voiced digital reverb emulating vintage British valve amp spring reverbs
  - Footswitchable Boost
