description: Dual true stereo phaser with two independent modulation engines,
  10-stage, 4-stage and uni-vibe modes, series or parallel routing, and alt
  functions for a one-knob compressor and low-end depth.
details: |-
  The Oaxa is a dual true stereo phaser. Two independent phasers can be run at slightly different LFO speeds to build layered, multidimensional movement, and they can be routed in series or in parallel. Ten-stage, four-stage and uni-vibe phasing are all reached from three large vintage-style knobs.

  Alt functions add a one-knob compressor and a further low-end depth control. The pedal is built on the maker's Core series platform, with true stereo processing intended for use alongside stereo reverb and delay in an effects loop.

  The page explains phasing as blending the original signal with a frequency-domain altered version of itself, the altered component behaving like an EQ that is rhythmically adjusted, so that the two signals combined give the familiar phaser sound.

  The effect is a 2, 4, 6 or 10 stage digital phaser with buffered switching that can be set to true bypass. Inputs and outputs are stereo and line-level compatible.
specs: |-
  - Two independent phaser engines, routable in series or parallel
  - 10-stage, 4-stage and uni-vibe modes
  - Type of effect: 2/4/6/10 stage digital phaser
  - Alt functions: one-knob compressor and low-end depth control
  - Stereo inputs and outputs, line level compatible
  - Switching: buffered, switchable to true bypass
  - Power: 9 to 18V DC, 130 mA, high current isolated supply sold separately, no battery
  - Dimensions: width 3.9 in / 99 mm, height 2.6 in / 66 mm, depth 4.9 in / 124.5 mm
  - Built on the maker's Core series platform
