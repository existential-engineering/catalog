description: >-
  The MacBeth M5 is a large-format, fully analog semi-modular synthesizer with three
  oscillators, dual filters, and extensive patching capability, hand-built in limited
  quantities with no digital circuitry whatsoever. Inspired by the ARP 2600 but
  considerably larger at 30 by 26 inches, it delivers uncompromising analog sound through
  manual control and cable patching. Only approximately 90 units were produced, making it
  one of the most coveted modern analog synthesizers among collectors.
details: |-
  Introduced in 2005, the MacBeth M5 is a striking modern analog synthesizer that draws immediate visual comparisons to the ARP 2600, though at 30 inches wide and 26 inches deep it is considerably larger. The M5 contains absolutely no digital circuitry, staying completely faithful to the design philosophy of early analog synthesizers where every sound must be created by hand through knob tweaking and cable patching.

  The signal path starts with three VCOs offering sine, triangle, sawtooth, and square waveforms with pulse width modulation, plus a noise generator with white, pink, and slow random modes. Two discrete filters provide contrasting character: a 24 dB/octave transistor-ladder low-pass filter and a 12 dB/octave multimode filter offering low-pass, band-pass, high-pass, and notch types. Both filters can self-oscillate and feature dedicated ADSR envelope generators.

  Additional modules include two LFOs with four waveforms each, four VCAs, two audio mixers, a ring modulator, a spring reverb, and stereo panning. An external audio input preamplifier allows processing of external sound sources. The audio mixers can be driven into overdrive for distortion effects. CV/gate connectivity enables integration with other analog equipment and modular systems.

  The semi-modular architecture means the M5 produces sound without patching, but the extensive patch points open up far more complex routing possibilities. The unit is housed in a robust steel casing with controls and sockets generously spaced in logical fashion, positioned at an 80-degree angle for optimal playability. Custom versions have been built with alternative color schemes and wooden enclosures.

  Only approximately 90 M5 units were produced, as each was hand-built to order. This extreme rarity, combined with the uncompromising all-analog design, makes the M5 one of the most coveted modern analog synthesizers among collectors and sound designers.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 3 VCOs (sawtooth, square with PWM, triangle, sine) plus 1 noise generator (white, pink, slow random)
  - Filter: 2 VCFs (24 dB/oct transistor-ladder low-pass; 12 dB/oct multimode with low-pass, band-pass, high-pass, notch)
  - Envelopes: 2 ADSR envelope generators
  - VCA: 4 VCAs (2 for filters, 2 for stereo panning)
  - LFO: 2 LFOs (rising ramp, falling ramp, triangle, rectangular)
  - Effects: Ring modulator, spring reverb, stereo panning
  - Mixers: 2 audio mixers, 2 CV mixers, 2 lag processors
  - External Input: Audio preamplifier for external sources
  - Sequencer: None
  - Keyboard: None included
  - Memory: None (no patch memory, no MIDI, no USB)
  - Control: CV/Gate only
  - Construction: Steel casing (custom wood available)
  - Panel Dimensions: 30" W x 26" D
  - Units Produced: Approximately 90
releaseDate: "2005"
releaseDateYearOnly: true
