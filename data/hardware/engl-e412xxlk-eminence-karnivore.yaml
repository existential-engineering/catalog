name: E412XXLK
manufacturer: engl
primaryCategory: speaker
url: https://www.engl-amps.com/shop/cabinets/engl-e412xxlk-eminence-karnivore/
description: Oversized straight-front 4 x 12 inch passive guitar speaker cabinet
  loaded with Eminence Karnivore speakers, handling 240 W at 8 ohm, built for
  modern high-gain players.
details: |-
  ENGL unveils the new E412XXL with Eminence Karnivore speakers, a powerhouse 4 x 12 inch cabinet built to meet the demands of modern high-gain players.

  This updated version of the legendary E412XXL combines ENGL's precision-engineered oversized enclosure with the aggressive tonal character of the Eminence Karnivore speakers, delivering bone-crushing low end, razor-sharp attack, and exceptional clarity at high volumes.

  The straight front and closed back are built from solid birch plywood and finished with a solid hand-welded metal grille, in the oversized format that gives the XXL enclosure its low-end authority.

  A parallel input and thru jack allow the cabinet to be daisy chained to a second cabinet. The cabinet handles 240 W at an impedance of 8 ohm.
specs: |-
  - Straight front
  - Closed back
  - Solid birch plywood construction
  - Parallel input and thru for daisy chaining
  - Solid hand-welded metal grille
  - Speaker: 4 x 12 inch Eminence Karnivore, made in USA
  - Power handling: 240 W
  - Impedance: 8 ohm
  - Passive cabinet, no mains connection
  - Dimensions: 84 x 74 x 38 cm
  - Weight: 57 kg
