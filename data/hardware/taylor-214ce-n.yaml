description: A nylon-string acoustic-electric guitar featuring Taylor's Grand
  Auditorium body shape with a Venetian cutaway, delivering snappy nylon-string
  tone from a torrefied spruce top with punchy attack and aged-in warmth, ready
  for amplified performance via ES-N electronics.
details: |-
  Part of Taylor's 200 Series, the 214ce-N pairs a solid torrefied spruce top with layered walnut back and sides for a balanced, responsive sound. The Grand Auditorium body shape with Venetian cutaway provides comfortable playing across a wide range of musical styles.

  The West African Crelicam Ebony fretboard and bridge, combined with classical nickel tuners with faux pearl buttons, deliver traditional nylon-string aesthetics with contemporary construction. The slotted peghead and 1-7/8" nut width suit players transitioning from steel-string instruments.

  ES-N electronics provide reliable amplified tone for stage and studio use. The guitar ships with a structured gig bag and is backed by Taylor's Limited Lifetime Warranty.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Torrefied Spruce (solid)
  - Back/sides: Walnut (layered)
  - Bracing: Nylon Series
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany, Standard Carve
  - Fretboard: West African Crelicam Ebony
  - Scale length: 25-1/2"
  - Nut width: 1-7/8"
  - Peghead: Slotted
  - Tuners: Classical Nickel with Faux Pearl Buttons
  - Electronics: ES-N
  - Finish: Matte
  - Strings: D'Addario Pro Arte Carbon (.024-.046)
  - Case: Gig bag included
