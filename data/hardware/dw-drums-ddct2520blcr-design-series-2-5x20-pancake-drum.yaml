description: This Pancake Gong Drum is a powerful accessory drum for the expressive player.
details: |-
  This Design Series Pancake Gong Drum is a powerful accessory drum for the expressive player. Crafted from North American Maple and finished in neutral Satin Black, the Pancake Gong Drum was created with the help of Italian drummer Marco lannetta to mimic the sound characteristics of full-sized gong drums, yet they can pack up in seconds.

  Mounted from a single TB12 tom bracket and fitted with signature Design Series mini lugs, this single-headed, 20″ diameter (2.5″ depth) drum packs plenty of punch and can integrate into the tightest set-ups.
