description: The Ashdown Rootmaster EVO II 115T is a 300-watt 1 x 15" bass
  cabinet at 8 ohms, weighing a mere 14kg (30lbs). Its specially designed White
  Line Ashdown 15" speaker excels in attack, clarity, and low-end, while a
  tweeter with a three-way switch (hi, low, off) fine-tunes the high end.
  Lightweight ply construction, a top-mounted bar handle, genuine Neutrik
  Jack/Speakon combi jacks, metal corners, and a Buffalo Tolex finish with black
  cloth grill make it stage- and studio-ready.
details: |-
  Super-lightweight 1 x 15" bass speaker cabinet in the Rootmaster EVO II range, delivering 300 watts at 8 ohms while weighing just 14kg (30lbs). A specially designed White Line Ashdown 15" speaker provides attack, clarity, and low-end, and a tweeter with a three-way switch (hi, low, off) shapes the highs for a punchy mid-range with signature Ashdown low-end. Built from lightweight ply, it carries a top-mounted bar handle, genuine Neutrik Jack/Speakon combi jacks, metal corners, and a Buffalo Tolex finish with black cloth grill.
specs: |-
  - Power handling: 300 watts
  - Impedance: 8 Ohms
  - Speaker configuration: 1 x 15" White Line Ashdown speaker
  - Tweeter: three-way switch (hi / low / off)
  - Weight: 14kg (30lbs)
  - Lightweight ply construction
  - Genuine Neutrik Jack/Speakon combi jacks
  - Top-mounted bar handle
  - Buffalo Tolex finish with metal corners and black cloth grill
