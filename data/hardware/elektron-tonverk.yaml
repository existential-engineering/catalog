description: This is Tonverk, a versatile polyphonic multi sampler and audio
  processor. Enjoy three year warranty, continuous care, premium customer
  support and a creative and vibrant community.
details: |-
  This is a machine primed for adventure: an instrument to propel you towards extraordinary music-making and boundless sound exploration. Tonverk is both a revelatory pathfinder and wondrous labyrinth to immerse yourself in, offering diverse solutions to capture, process, route, and reveal your sound. Tonverk has eight audio tracks that can be utilized in different ways, plus a further eight tracks for buses, sends, and mix, and all 16 tracks have their own sequencer.

  Five machines form the initial basis of Tonverk's sound creation, plus another for MIDI. Single Player is a polyphonic one-shot machine. Multi Player lets you load a multisampled instrument spread across the keyboard. Subtracks loads a sample on every lower row key, so one track is essentially eight Subtracks each with its own two filters, amp envelope and modulation. Grainer cuts your sample into tiny grains and reassembles them into new textures, rhythms, and continuous tones. Wavefinder gives you two independent wavetable oscillators that can be modulated and blended.

  There are two ways to sample with Tonverk. Recorder allows for straightforward audio sampling, externally or internally. Tonverk's Auto Sampler adds another layer: connect your MIDI gear, decide how many notes and velocity layers you want to collect, start the recording, and let the machine do the work. You can even connect via USB and sample from whatever app you have at your disposal.

  Tonverk's routing capabilities are huge. All of Tonverk's tracks have their own routing, and the extensive setup allows you to direct sound from multiple sources to various destinations. You can send audio out of Tonverk, process it externally, and bring it right back in. On the back of the machine there are four outputs and two inputs, plus a headphone out that is also a routing option, MIDI In, Out and Thru, two USB-C slots, and an SD card.

  Tonverk is an effects beast. Rumsklang Reverb, Daisy Delay, Dirtshaper, Degrader, Chrono Pitch, Frequency Warper, Infinite Flanger, Phase 98, Filterbank, Comb +/-, Steel Box Reverb, and Filter Folder join some Elektron classics and a bunch more filters. The Elektron sequencer reaches its biggest-ever size with up to 256 steps, every track has its own sequencer, and you can even Parameter lock the routing itself.
specs: |-
  - 8 voices per audio track
  - 6 selectable machines per audio track: Single Player, Multi Player, Subtracks, Grainer, Wavefinder, MIDI
  - 8 stereo audio tracks, 4 bus tracks, 3 send effect tracks, 1 mix track
  - 1 digital base-width filter per track/subtrack
  - 2 assignable LFOs per track, 1 assignable modulation envelope per voice
  - 2 assignable FX LFOs per audio track, 2 assignable LFOs per effect bus, send effect and mix
  - Modulation setup per track for pitch bend, mod wheel, breath control, aftertouch
  - Shape machine on Bus and Send FX tracks, step edit, extensive routing options
  - MIDI tracks: 16 note polyphony per step, 16 assignable CC controls, 2 assignable LFOs per track
  - 2 trig modes, keyboard mode with 36 different scales, song mode, chord mode
  - Up to 256 steps per pattern and track, arpeggiator per audio and MIDI track
  - Polyphonic sequencing, individual pattern length and time scale multiplier per track
  - Parameter locks, trig conditions and trig chance, retrig, micro timing, sequencer lanes
  - Effects: Comb +/- Filter, Filterbank, Filter Folder, Low-pass Filter, Multimode Filter, Infinite Flanger, Panoramic Chorus, Phase 98, Warble, Chrono Pitch, Frequency Warper, Compressor, Degrader, Dirtshaper, Daisy Delay, Saturator Delay, Rumsklang Reverb, Steel Box Reverb, Supervoid Reverb
  - 128 x 64 pixel OLED screen
  - 4 x 1/4" impedance balanced audio out jacks
  - 2 x 1/4" balanced audio in jacks
  - 1 x 1/4" stereo headphone jack
  - 48 kHz, 24-bit D/A and A/D converters
  - 2 x USB-C port
  - MIDI In/Out/Thru
  - SD Card slot
  - Sturdy steel casing, W286 x D176 x H63 mm (11.3" x 6.9" x 2.5")
  - Weight: approximately 1.85 kg (4.08 lbs)
  - 100 x 100 mm VESA mounting holes, M4 screws with a max length of 7 mm
  - Overbridge multistreaming enabled (no plugin), class-compliant USB audio
  - External input mixer with routable outputs
  - 3 year Elektron warranty
  - Included in the box: 64 GB SD card, Power Supply PSU-5, Elektron USB-C cable
