description: >-
  The DarkStar is a British-manufactured tabletop 8-voice polyphonic synthesizer from Red
  Sound Systems that uses DSP-based analog modeling to deliver clean analog-type sounds.
  It features 2 oscillators per voice, a resonant multimode filter, and 5-part
  multitimbral capability, all in a compact desktop form factor designed after Red Sound's
  DJ tools. An optional VOCODA EPROM upgrade transforms the unit into an 11-band vocoder
  with five operating modes.
details: |-
  The DarkStar was Red Sound Systems' first synthesizer offering. It provides 2 oscillators per voice with continuously variable sawtooth and square waveforms, along with formant and colored noise options. Comprehensive modulation is available via 2 LFOs and 2 envelope generators, and the unit supports a 5-part multitimbral setup for layering different sounds simultaneously.

    Sound shaping includes a resonant filter offering low-pass, high-pass, and band-pass modes with a 12dB/octave slope, alongside ring modulation and pink, white, and blue noise generators. A joystick interface enables mixing between oscillators, and 14 knobs provide hands-on MIDI control of filters and envelopes.

    A notable feature is the upgrade system: users can install EPROM chips to transform the DarkStar into entirely different instruments. The included VOCODA upgrade converts the unit into a fully featured vocoder with 11-band filtering, offering five operating modes including standard vocoding, robotic vocoding, filter processing, sequence-coder, and synthesizer modes.
specs: |-
  - 8-voice polyphony
    - 2 oscillators per voice (continuously variable sawtooth/square, formant, colored noise)
    - Hard sync
    - 2 LFOs with separate speed/delay controls (ramp, triangle, square, sine, pulse, sample & hold, random)
    - MIDI sync
    - 12dB/octave resonant multimode filter (low-pass, high-pass, band-pass)
    - Auto-panning, tremolo, fixed-frequency ring modulation, portamento
    - 64 patch memory
    - 5-part multitimbral via MIDI
    - 14 knobs for real-time control
    - Joystick oscillator mixer
    - EPROM upgrade slot (VOCODA vocoder upgrade available)
    - Desktop/tabletop form factor, no keyboard
releaseDate: "1999"
