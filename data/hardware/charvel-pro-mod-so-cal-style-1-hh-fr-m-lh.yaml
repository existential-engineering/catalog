description: The Pro-Mod So-Cal Style 1 HH FR M LH is a left-handed,
  high-performance electric guitar pairing an alder body with a
  graphite-reinforced maple bolt-on neck, a 12"-16" compound-radius maple
  fingerboard with 22 jumbo frets, dual Seymour Duncan Distortion humbuckers,
  and a recessed Floyd Rose 1000 Series double-locking tremolo.
details: |-
  Constructed with an alder body, this lefty So-Cal Style 1 has a maple neck with a pair of graphite reinforcement rods for rock-solid stability and a Speed Neck profile with hand-rubbed urethane back finish for smooth playing comfort. The 12"-16" compound radius maple fingerboard carries 22 jumbo frets and black dot inlays, with rolled fingerboard edges for a broken-in feel.

  Electronics consist of a Seymour Duncan Distortion TB-6 in the bridge and a Seymour Duncan Distortion SH-6N at the neck position, routed through a 3-position blade switch. Both the volume and tone controls feature push/pull functionality, enabling coil-splitting capabilities for added tonal versatility.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo system paired with a matching Floyd Rose 1000 Series locking nut (1.6875" wide), Charvel-branded die-cast tuning machines, a 1-ply white pickguard, and a heel-mount truss rod adjustment wheel. The guitar features a licensed Fender Stratocaster headstock, a 4-bolt serialized neck plate, and ships strung with .009-.042 nickel-plated steel strings.
