details: |-
  Designed for a broad range of long-distance broadcast, ENG and film miking applications, such as booming, dialogue, interview and table or podium use, the 4018 Supercardioid Microphone offers superb flexibility through modular accessories.

  The 4018 Supercardioid Mic is created for long-distance broadcast, ENG and film miking applications, such as booming, dialogue, interview and podium use.

  As a member of DPA's pencil microphone family, the 4018 is built around a modular concept that separates the supercardioid capsule from the preamp body, allowing the microphone to be configured with different XLR preamps and cable orientations (e.g., the 4018A standalone XLR variant and the 4018ES side-cable XLR variant) to suit booming, podium, interview, and other long-distance miking scenarios.
