details: |-
  The Double Barrel V4 is a dual overdrive pedal combining the Moonshine V2 (right side) and Morning Glory V4 (left side) in a single enclosure. The Moonshine V2 is a highly tweaked version of the classic Tube Screamer topology with added gain, volume range, and a Clean blend knob. The Morning Glory V4 is a transparent, open-toned low-to-medium gain overdrive with a hi-gain toggle and Red Remote capability — plug the JHS Red Remote into the Remote Gain jack to switch the gain toggle on the fly with a standard patch cable. An order toggle lets you choose which circuit comes first in the chain. V4 improvements over prior versions include the updated Moonshine V2, updated Morning Glory V4, and top-mount jacks. The two circuits can be stacked for a total of five on-the-fly overdrive combinations.
