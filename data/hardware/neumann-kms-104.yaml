  - Supply voltage ( P48, IEC 61938): 48 V ± 4 V
  - Current consumption ( P48, IEC 61938): 3.5 mA
  - Matching connector: XLR 3 F
  - Weight: approx. 300 g
  - Diameter: 48 mm
  - Length: 180 mm
