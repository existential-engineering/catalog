details: |-
  Audio Interface for rekordbox

  The INTERFACE 2 opens up rekordbox to anyone, anywhere. This 2-channel audio interface allows you to scratch and control the music from your rekordbox library using your own preferred DJ equipment. Connecting it is quick and simple. What’s in the box? The INTERFACE 2 audio interface comes bundled with a licence key for rekordbox , as well as 2 control vinyl ( RB-VS1-K time coded vinyl records ). So start scratching your digital tracks as soon as you unbox your gear.
