details: |-
  The Blue Angel is a limited edition of the Stahlhammer Distortion in a dark blue case with yellow script labelling. Twenty were made.

  The circuit is the standard Stahlhammer: a hard-hitting distortion voiced for cranked British amp sounds, combining classic high-gain amp distortion with a tube amp style EQ. The distortion is full and thick, using hard-clipping diodes to ground around an LM1458 op amp whose slow slew rate suits heavy clipping on a Strat or a Les Paul, and turned down to around nine o'clock it sits close to an amp just beginning to break up.

  Three tone controls, Bass, Middle and Treble, cover the amp tone stack, and two modes of operation, high gain and tube saturation, are selected by a switch on the right hand side of the enclosure. The Volume control runs into a 3x make-up gain output buffer so the pedal can drive an amp hard.
