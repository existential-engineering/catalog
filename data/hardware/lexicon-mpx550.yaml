details: |-
  The Lexicon MPX550 is a discontinued true stereo reverb and effects processor from Lexicon's MPX series. It is a rack-mount outboard effects unit designed for studio and live use, delivering Lexicon's signature reverb algorithms alongside delay, modulation, and other multi-effect programs.

  The product is no longer manufactured. Lexicon's product page lists the MPX550 in their archive of discontinued products, with only owner's manuals (in English, Spanish, French, German, Italian, and Portuguese) available as legacy documentation downloads.
