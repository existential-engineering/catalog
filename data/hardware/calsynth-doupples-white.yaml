details: |-
  NOTE: THIS IS A PREORDER FOR 3RD WEEK OF JUNE

  Doupples is a stereo multimode filter in 8hp that is based on the sound of the beloved Ripples filter. With 2 separate audio paths, each with cv control and attenuvertors, it opens up a host of creative possibilities. The two channels share a resonance and v/oct cutoff control, and when at high resonance, Doupples can act as a v/oct sine wave generator.
