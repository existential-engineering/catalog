description: Instantly recognisable vintage-inspired 4x12" angled guitar speaker cabinet. The 1960AV is loaded with four 12" Celestion G12 Vintage speakers for the warmer, more vintage-voiced character associated with classic Marshall stacks, and is wired for selectable mono or stereo operation via two 1/4" inputs. Power handling is 280W in mono (16Ω or 4Ω) or 140W per side in stereo (8Ω per side). The angled top baffle helps project sound upward on stage and is designed to pair with Marshall heads from across the range.
details: |-
  The impressive 280W 1960 4x12 Angled Cabinet combines the enclosure of the 1960 and the vintage aural characteristics of a 1982. It features four Celestion G12 vintage speakers that give a warmer tone than its predecessor. This powerhouse offers it all from a well-rounded high-end punch to a low-end thump.

  This cabinet is also available as a straight base cab, allowing you to create your own Marshall stack.

  Four 12-inch Celestion G12-Vintage speakers offer late 80s tone, with warmer sounds than other 1960 models.

  Designed and engineered in UK. Made in UK.
