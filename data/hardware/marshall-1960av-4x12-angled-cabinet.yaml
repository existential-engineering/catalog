description: Instantly recognisable vintage-inspired 4x12" angled guitar speaker
  cabinet. The 1960AV is loaded with four 12" Celestion G12 Vintage speakers for
  the warmer, more vintage-voiced character associated with classic Marshall
  stacks, and is wired for selectable mono or stereo operation via two 1/4"
  inputs. Power handling is 280W in mono (16Ω or 4Ω) or 140W per side in stereo
  (8Ω per side). The angled top baffle helps project sound upward on stage and
  is designed to pair with Marshall heads from across the range.
