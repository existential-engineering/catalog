description: 15-inch two-way passive loudspeaker designed for portable mains and
  floor-monitor use, pairing an EVS15-SF 15-inch woofer with a 1.25-inch
  DH3/2010A titanium HF compression driver in a wedge-shaped polypropylene
  enclosure with 45 degree and 55 degree monitor angles, 400 W continuous / 1600
  W peak power handling, 90 degree x 50 degree coverage, and dual parallel
  Neutrik NL4 Speakon connectors.
details: >-
  The ZX4 is Electro-Voice's 15-inch two-way passive loudspeaker for portable
  sound reinforcement, equally at home as a main PA cabinet on a pole or stand
  or laid on its side as a floor monitor. The wedge-shaped high-impact
  polypropylene enclosure provides 45 degree and 55 degree monitor angles
  depending on which face it rests on. A 15-inch EVS15-SF low-frequency
  transducer is paired with a 1.25-inch DH3/2010A titanium HF compression
  driver, crossed over passively at 1.5 kHz, producing 90 degree (H) x 50 degree
  (V) coverage.


  The cabinet delivers 400 W continuous / 1600 W peak power handling at an 8 ohm
  nominal impedance (6.5 ohm minimum), with 100 dB axial sensitivity (1 W / 1 m)
  and a calculated maximum SPL of 132 dB at 1 m. The 18-gauge galvanized steel
  grille is polyester powder-coated for durability. Mounting hardware includes
  an integrated pole-mount adapter, eyebolt provisions, and attachment plates,
  and the cabinet is flying-capable; the enclosure is not weatherized.


  As a passive loudspeaker the ZX4 requires external amplification. Signal
  connects via two parallel-wired Neutrik NL4 Speakon connectors on the rear
  panel, so one jack acts as the input and the second as a loop-through to
  another cabinet.
specs: >-
  - Configuration: 2-way passive loudspeaker

  - LF driver: 15-inch EVS15-SF low-frequency transducer

  - HF driver: 1.25-inch DH3/2010A titanium HF compression driver

  - Crossover frequency: 1.5 kHz (internal passive)

  - Frequency range (-10 dB): 42 Hz - 20 kHz

  - Frequency response (-3 dB): 60 Hz - 20 kHz

  - Recommended high-pass frequency: 42 Hz

  - Axial sensitivity (1 W / 1 m): 100 dB SPL

  - Maximum SPL (calculated, 1 m): 132 dB

  - Power handling: 400 W continuous / 1600 W peak

  - Nominal impedance: 8 ohms (6.5 ohms minimum)

  - Coverage pattern (-6 dB): 90 degrees H x 50 degrees V

  - Connectors: Dual parallel Neutrik NL4 Speakon

  - Enclosure: High-impact polystyrene composite (polypropylene)

  - Grille: 18-gauge galvanized steel, polyester powder-coated

  - Monitor angles: 45 degrees and 55 degrees (wedge design)

  - Mounting: Integrated pole-mount adapter, eyebolt provisions, attachment
  plates

  - Flying-capable: Yes

  - Weatherized: No

  - Dimensions (H x W x D): 686 x 445 x 406 mm

  - Net weight: 20.2 kg
