details: |-
  The Sin Summing Mixer Eurorack Complete Kit is a compact, utility DIY mixing module designed to seamlessly blend multiple signals in your modular system. This complete kit includes the PCB, front panel, and all required electronic components, making it an ideal choice for builders who want everything included in one package while saving time on sourcing parts from multiple suppliers. To streamline the build process and ensure consistent performance, all essential SMD components are professionally assembled at the factory. The builder completes the module by installing the through-hole (THT) components, offering a satisfying DIY experience without the complexity of SMD soldering. Concept & Design

  The name Sin is short for Singularity - the point where everything collapses and merges into one. Living up to its name, this 5-input, 1-output summing mixer brings five separate audio or CV channels together into a single unified output. While its design is intentionally simple with no individual volume controls, it features a powerful 3-step gain switch. This switch multiplies the total output gain by 1, 0.5, or 0.2, making it incredibly useful for preventing clipping or easily attenuating your mix down to safe line-level signals for external gear. Key Features

  Included Components

  DIY Build & Assembly

  The PCB is clearly labeled to assist with assembly, and the pre-assembled SMD components significantly reduce build time. All remaining components are through-hole and straightforward to install. The front panel is crafted from PCB material featuring a black finish with white screen printing and gold-plated copper accents. As a unique design detail, the full name "Singularity" is printed on the back of the front panel. Technical Specifications

  This full kit offers a straightforward, high-quality build experience, providing essential mixing utility and precise attenuation with a clean, modern aesthetic.
specs: |-
  - Complete Eurorack Mixer Full Kit (PCB, front panel, and all components included)
  - Factory-assembled SMD components
  - 5-channel summing into 1 unified output
  - 3-step output gain switch (Multiplied by 1, 0.5, and 0.2) for line-level compatibility
  - Compact 4HP Eurorack format
  - Eurorack PCB with pre-assembled SMD components
  - PCB front panel (black PCB with factory-printed white graphics and gold-plated exposed copper)
  - 6 x Jack sockets
  - Gain switch
  - 10-pin IDC power socket
  - Ribbon power cable
  - 2 x Mounting screws
  - Width: 4HP
  - Inputs: 5
  - Outputs: 1 x Summed Output
  - Gain Settings: 1x, 0.5x, 0.2x
