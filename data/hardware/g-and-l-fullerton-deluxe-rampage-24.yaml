description: The G&L Rampage returns with 24 frets for a full two octaves, its
  cutaways carefully extended to reach the extra two. A first for the model is
  an Original Floyd Rose vibrato with matching Floyd Rose locking nut and string
  retainer, paired with the G&L AW4370 Alnico humbucker.
details: |-
  The G&L Rampage is back with 24 frets for a full two octaves of shred. The unmistakable shape of the original Rampage still rings true, as the cutaways have been carefully extended to access those extra two frets. Moreover, a thoughtfully sculpted heel and added relief behind the lower cutaway make this Rampage more comfortable than ever before.

  There is another first for Rampage, and that is an Original Floyd Rose vibrato with matching Floyd Rose locking nut and string retainer. But there is one important thing that is unchanged since last time around, and that is a G&L AW4370 Alnico humbucker, made with 43 gauge wire and 7000 turns for that sweet spot of added grind while retaining some classic character.

  The body is made of mid-weight alder, so it still has enough density to offer strong sustain and resonance but not so heavy as the original, soft, maple body of the Rampage.

  Rampage 24 comes in classic Ivory finish or Jet Black with matching headstocks. Both colors are available with maple or ebony fingerboards with a comfortable 12" radius, Plek processed medium jumbo frets, and a sleek, fast-playing profile based on the original '80s G&L Rampage.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
