description: "When you need more monitoring capacity, the Mackie HM-4
  four-channel headphone amplifier has you covered."
details: |-
  Whether you need to increase your home studio headphone monitoring capability or add robust cue mix distribution, the affordable HM-4 four-channel headphone amplifier offers the sound quality, reliability and flexibility you need to expand your setup. It's also simple to use and wildly versatile. Use it to do everything from quickly demoing a mix in the studio to recording and monitoring a round-table podcast.

  Perfect for studios, practice spaces, quiet stages and more, HM-4 can simply and effectively split a single audio signal to your entire band while maintaining full signal integrity.
specs: |-
  - Share a single stereo source with up to 4 pairs of headphones
  - Individual level control for each output
  - Powered via included 12v AC adapter
  - Built-Like-A-Tank construction
