description: The Mackie HM-4 headphone amplifier is a simple, compact way to
  split your stereo signal into four headphone outputs with full signal
  integrity.
details: |-
  When you need more monitoring capacity, the Mackie HM-4 four-channel headphone amplifier has you covered. Perfect for studios, practice spaces, quiet stages and more, HM-4 can simply and effectively split a single audio signal to your entire band while maintaining full signal integrity.

  Whether you need to increase your home studio headphone monitoring capability or add robust cue mix distribution, the affordable HM-4 four-channel headphone amplifier offers the sound quality, reliability and flexibility you need to expand your setup. It is also simple to use and wildly versatile. Use it to do everything from quickly demoing a mix in the studio to recording and monitoring a round-table podcast.

  The ultra-compact HM-4 4-Way Headphone Amplifier features a 1/4" stereo input and four 1/4" headphone outputs with individual level controls. Perfect for studios or even at home when up to four people want to listen together.
specs: |-
  - Share a single stereo source with up to 4 pairs of headphones
  - Individual level control for each output
  - Powered via an included 12V AC adapter
  - Built-Like-A-Tank construction
  - Input type: female 1/4" phono, unbalanced, stereo; 10 k ohm per channel
  - Output type: 4x female 1/4" phono, unbalanced, stereo; 47 ohm per channel
  - Maximum level (1/4" input) +22 dB
  - Power requirements +12V DC, current draw under 220 mA
  - Dimensions 2.0 x 4.3 x 2.3 in / 51 x 109 x 58 mm
  - Weight 0.5 lb / 0.2 kg
