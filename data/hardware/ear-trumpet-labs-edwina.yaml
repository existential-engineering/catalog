details: |-
  Edwina is a versatile large-diaphragm condenser microphone with sound to match her distinctive but not dominating looks.

  With meticulously tested, hand-wired electronic components, Edwina is designed specifically for feedback rejection in demanding live settings. Her smooth, detailed sound covers all kinds of stage duties, from vocals to acoustic instruments to drum overheads, and also works in the studio as a warm, accurate recording mic. She is optimized as a single-source mic, but with a sweet spot from one out to 18 inches she also captures voice and instrument together for a solo performer or even two.

  Edwina is also available in stereo pairs. For single-micing larger groups, Ear Trumpet Labs points to Louise, Myrtle, Josephine, Delphina, or the various bike gear models.

  Suggested applications are stage and studio work on vocals, close-miking acoustic instruments (guitar, mandolin, banjo, fiddle), drum overheads, and electric guitar cabinets.
specs: |-
  - Hand-made microphone with unique appearance
  - Side or end address, using pivoting bracket
  - Capsule and electronics tuned for close to medium distance use on the most difficult stages, with excellent feedback rejection
  - Internal shock dampers for minimal handling noise
  - Integral silk and mesh pop filter, for effective control of plosives without loss of clarity
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000 Hz, 94 dB): -41.9 dB (8 mV/Pa)
  - Power requirement: +24V to +48V phantom power
