name: CDi 2|600BL
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/cdi-2-600bl
description: A 2-channel power amplifier combining analog and BLU link digital
  audio inputs, delivering 600W per output channel. Part of Crown's CDi
  DriveCore series for medium-sized installations such as cinemas, houses of
  worship, bars, and lounges.
details: |-
  The CDi DriveCore Series represents an evolution in amplification technology, offering an impressive mix of high-performance, rich feature set, and competitive cost. Built on technology from Crown's flagship DriveCore Install series, the 2|600BL provides network control, advanced DSP, and front-panel configuration capabilities.

  BLU link delivers a 256-channel fault-tolerant digital audio bus, and HiQnet Audio Architect provides TCP/IP-based control and monitoring. Onboard DSP includes input/output routing, 8-band parametric EQ, crossover, delays (1000ms input / 100ms output), and a LevelMAX limiter.

  The amplifier supports driving up to 100Vrms speaker loads directly without a transformer and includes pre-loaded JBL speaker tunings to expedite installation. A GPIO/AUX port handles preset recall, mute control, fault monitoring, and power management.
specs: |-
  - 2 channels
  - 600W per channel @ 4Ω
  - Dual mode: 300W @ 2Ω, 600W @ 4Ω, 600W @ 8Ω, 300W @ 16Ω, 600W @ 70Vrms, 600W @ 100Vrms
  - Bridge mono: 1200W @ 4Ω, 1200W @ 8Ω, 1200W @ 16Ω
  - Sensitivity: 0.7V RMS (full rated power @ 8Ω)
  - Signal-to-Noise Ratio: >104dB
  - THD: 0.35% (full rated power, 20Hz–20kHz)
  - Damping Factor: >1000 (20Hz–100Hz)
  - Frequency Response: ±0.5dB (8Ω, 20Hz–20kHz)
  - Crosstalk: >80dB (below rated power, 20Hz–1kHz)
  - Input Impedance: 20kΩ balanced / 10kΩ unbalanced
  - BLU link: Yes (256-channel digital audio bus, fault-tolerant)
  - Onboard DSP: 8-band parametric EQ, crossover, LevelMAX limiter
  - Input delay up to 1000ms, output delay up to 100ms
  - Network control via HiQnet Audio Architect (TCP/IP)
  - Direct Drive 70/100Vrms output (no transformer required)
  - Pre-loaded JBL speaker tunings
  - GPIO/AUX control port
  - Dimensions: 19" W × 3.5" H × 12.25" D (excluding 1.3" front panel protrusion)
  - Weight: 14.56 lbs (6.6 kg)
  - Power: IEC 320 inlet, 100–240V AC
