description: A compact true bucket brigade analog delay pedal with 1100ms delay
  time, tap tempo, effects loop, four ratio divisions, onboard modulation, and
  assignable expression control.
details: |-
  In 2011 we released the Panther Analog Delay, almost exactly two years later we tried a nearly impossible feat of taking everything we love about the Panther Delay, making a few improvements, and packaging it into a enclosure half the size. We are proud to bring to you the Panther Cub. True Bucket Brigade delay that has the tone and options to cover any style, any use, and any player. The Panther Cub Delay is our most anticipated pedal to date with it's groundbreaker feature set including "tap tempo control" that lives within an all analog 1100 milliseconds of delay time! The "effects loop" allows you to place any effect or effects chain on the repeats only. We kept the four section "Ratio Control" to give you quarter, dotted eighth, eighth, and triplet divisions. The built in "Modulation" gives you a shimmery Deluxe Memory Man type vibe and works perfectly even with tap in use. The Panther Delay was the first to do this! The internal "Roar" switch gives you two different levels/sensitivity of oscillation and runaway. As the user you have the ability to program an "expression control" to your favorite knob to use it to change settings on the fly! The "Tap In/Out" jack lets you remotely tap in a tempo or slave another tap device for amazing live flexibility. All this and more is powered by a standard 9v supply (300mA is recommended if available).
