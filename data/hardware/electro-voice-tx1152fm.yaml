description: 15-inch two-way passive floor monitor (stage wedge) from
  Electro-Voice's Tour X series, pairing a low-distortion SMX2151 15-inch woofer
  with a 1.25-inch DH3 titanium HF compression driver on a 90 degree x 50 degree
  constant-directivity horn for high-output monitor wedge applications.
details: >-
  The TX1152FM is a 15-inch two-way passive floor monitor in Electro-Voice's
  Tour X (TX) series, designed as a high-output stage wedge for
  small-to-medium-sized stages. It pairs a low-distortion SMX2151 15-inch woofer
  (using EV's fully symmetric drive geometry) with a 1.25-inch DH3 titanium HF
  compression driver on a 90 degree H x 50 degree V constant-directivity horn,
  crossed over at 1.75 kHz through an integrated 24 dB/octave network with HF
  protection.


  The vented low-frequency enclosure is built from plywood and MDF with a black
  EVCoat finish for road durability, includes two integrated handles, and uses
  Signal Synchronized Transducers to keep the woofer and tweeter time-aligned.
  The TX1152FM shares common voicing with the rest of the Tour X family so it
  integrates cleanly alongside TX mains.


  As a passive cabinet, the TX1152FM requires external amplification. Two
  parallel-wired Neutrik NL4 Speakon connectors on the cabinet act as the input
  and a loop-through to a second wedge. Rated for 500 W continuous / 2000 W peak
  with 100 dB sensitivity and 133 dB calculated maximum SPL.
specs: |-
  - Configuration: 2-way passive floor monitor
  - LF driver: 15-inch SMX2151 with fully symmetric drive
  - HF driver: 1.25-inch DH3 titanium compression driver
  - Horn: Constant-directivity 90 degree H x 50 degree V
  - Crossover: Integrated 24 dB/octave with HF protection
  - Crossover frequency: 1,750 Hz
  - Frequency response (-3 dB): 65 Hz - 20 kHz
  - Frequency range (-10 dB): 45 Hz - 20 kHz
  - Sensitivity (1 W / 1 m): 100 dB
  - Maximum SPL (1 m, calculated): 133 dB
  - Power handling: 500 W continuous / 2000 W peak
  - Nominal impedance: 8 ohms (6.2 ohms minimum)
  - Coverage pattern (-6 dB): 90 degrees H x 50 degrees V
  - Connectors: Parallel Neutrik NL4 Speakon (input + loop-through)
  - Enclosure: Vented, plywood and MDF with EVCoat
  - Finish: Black EVCoat
  - Handles: Two integrated
  - Signal Synchronized Transducers (time-aligned woofer/tweeter)
  - Dimensions (H x W x D): 475 x 439 x 655 mm
  - Net weight: 23.5 kg
