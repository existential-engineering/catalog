url: https://www.lynxstudio.com/products/lynx-lt-adat/
description: LT-ADAT is an LSlot device for the Lynx Aurora 8 and Aurora 16
  converters that provides up to 16 channels of ADAT light-pipe input and
  output. It is a full-function ADAT interface that includes two ADAT light-pipe
  inputs and two ADAT light-pipe outputs.
details: |-
  Easily installed inside the Aurora 16 and Aurora 8, the LT-ADAT connects via ribbon cable to the host converter. Channel routing is controlled from the Aurora front panel or by computer via the Lynx AES16. The LT-ADAT clock can be slaved to Aurora or a light-pipe optical signal. Even when slaving to light-pipe, Aurora's SynchroLock technology provides immunity to high levels of jitter, which is typical in optical signals.

  LT-ADAT also allows Aurora to function as a bi-directional format converter, converting ADAT to AES/EBU and analog and back to ADAT.
specs: |-
  - LSlot device for the Lynx Aurora 8 and Aurora 16 converters
  - Full-function ADAT interface with two ADAT light-pipe inputs and two ADAT light-pipe outputs
  - Provides 16 light-pipe I/O channels at sample rates up to 48 kHz
  - 8 channels at 96 kHz and 4 channels at 192 kHz using S/MUX technology
  - Installs in Aurora's LSlot bay and connects to the host converter by ribbon cable
  - Controlled via the Aurora front panel or by computer via AES16
  - Clock can be slaved to Aurora or to a light-pipe optical signal
  - ADAT / AES-EBU bidirectional format converter, converting ADAT to AES/EBU and analog and back to ADAT
  - Flexible clocking options
  - Draws power from the host Aurora chassis through the LSlot bay; the page documents no power connector of its own
  - Discontinued December 2014
