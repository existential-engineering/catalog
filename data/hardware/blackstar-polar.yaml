name: POLAR
manufacturer: blackstar
primaryCategory: audio-interface
url: https://blackstaramps.com/polar/
description: The USB audio interface for guitarists.
details: |-
  POLAR is Blackstar's USB audio interface designed for guitarists, delivering studio-grade 24-bit/192 kHz resolution to capture every nuance of your sound. The range comprises POLAR 2 (2 mic preamps, 2 instrument inputs) and POLAR 4 (4 mic preamps, 4 instrument inputs, plus MIDI In/Out).

  POLAR features world-class microphone preamps with ultra-low noise and high headroom, accommodating a wide range of microphone and instrument types for studio-quality recordings in any environment. Per-channel Enhance switches are designed to deliver a real-amp feel and tone for guitar.

  Blackstar's versatile POLAR Control mixing software is included, offering zero-latency monitoring and loopback to streamline signal routing and eliminate the need for a hardware mixer. Each unit ships with high-output headphone amps and balanced monitor outputs, each with their own level control.

  POLAR is bus-powered over USB Type-C (USB 2.0) using the supplied USB-A to USB-C cable, with a DC 5V input as a fallback if the host USB port can't supply enough power. A +48V phantom power switch is provided for condenser microphones.

  Bundled with POLAR is a studio software collection including the St. James Plugin Suite (worth $129/£129/€129), Ableton Live Lite, ReLab LX480 Essentials Reverb, Melodyne Essential and more — everything needed to start recording out of the box.
specs: |-
  - Form Factor: Desktop
  - Protocol: USB 2.0
  - Connectivity: USB Type-C
  - A/D Resolution: 24-bit/192 kHz
  - Supported Sample Rates: 44.1 kHz, 48 kHz, 88.2 kHz, 96 kHz, 176.4 kHz, 192 kHz
  - Phantom Power: Yes, 48V
  - Bus Powered: Yes (960mA)
  - Loopback: Yes
  - Bundled Software: POLAR Control App, St. James Plugin Suite, Ableton Live Lite, ReLab LX480 Essentials Reverb, Melodyne Essential
  - POLAR 2 — 2 mic preamps, 2 instrument inputs, 2 line inputs, 2 Enhance switches, 2 line outputs, 1 headphone output, no MIDI, 4 x 4 simultaneous I/O (incl. loopback)
  - POLAR 4 — 4 mic preamps, 4 instrument inputs, 4 line inputs, 4 Enhance switches, 4 line outputs, 2 headphone outputs, MIDI In/Out (8-pin DIN), 6 x 6 simultaneous I/O (incl. loopback)
  - POLAR 2 Weight: 0.64 kg / Dimensions: 170 x 64 x 115 mm
  - POLAR 4 Weight: 0.93 kg / Dimensions: 230 x 64 x 115 mm
