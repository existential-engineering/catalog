url: https://bastl-instruments.com/eurorack/modules/sense
description: Analog sensor calibration module that converts physical and
  environmental inputs into control voltage and gate outputs. Accommodates
  variable resistance sensors (light-dependent resistors, contact sensors) as
  well as voltage-output sensors (pulse sensors, accelerometers, piezo
  elements), with built-in pre-amplification, gain control with clipping
  indicator, adjustable voltage offset (positive/negative), AC/DC coupling
  options, and a threshold control for gate generation.
details: 5HP, 50mm depth. +12V <35mA, -12V <25mA. PTC fuse and diode-protected
  16-pin power connector. Sensor input uses a pin-header patchbay.
