details: |-
  The Chandler Limited RS124 Compressor is a recreation of one of the most coveted audio valve compressors of all time, the legendary EMI/Abbey Road RS124, reimagined for use in the modern studio environment. First designed in 1960 by Abbey Road Head of Technical Bill Livy, Deputy Head Len Page and seasoned EMI Audio Designer Mike Bachelor, the Abbey Road RS124 compressor is one of the most desired and mysterious pieces of recording gear ever developed.

  The Chandler Limited RS124 harnesses the sound and personalities of Abbey Road Studios' favorite historic RS124 Compressors (Ser. No's 60070B, 60050A, and 61010B) still in use at the famed studio to this day, all in a single unit. Features include Input control, Output attenuation, Recovery (release) control with HOLD setting, adjustable attack, selectable output impedance (200/600 ohms), and the SuperFuse mode.

  Standard units come with variable Input and Output controls. Stepped controls are available via special request for an additional fee. Circuit uses 6BC8, 6CG7, and 6AL5 tubes.

  Notable users include Clay Blair, Peter Cobbin (Former Chief Engineer, Abbey Road Studios), Kevin Kadish, Vance Powell, Dave Cobb, Green Day, Tony Maserati, Ryan Hewitt, Ross Hogarth, Greg Wells, and Sheryl Crow.
