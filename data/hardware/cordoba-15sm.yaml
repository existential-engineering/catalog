details: |-
  Córdoba's best-selling 15 series ukuleles offer a stylish, easy-to-play, and high-quality instrument at an affordable price. Built with Mahogany top, back, and sides construction, the 15SM provides a rich, clear, and balanced tone. Aesthetic features such as an Abalone rosette and cream binding on both the body and fingerboard set this soprano-sized ukulele apart from other models in its class. Additional features include a sleek satin finish, silver tuners with pearl buttons, and premium Aquila strings. Also available in concert (15CM & 15CM-E) and tenor (15TM) sizes.
