description: UNO Synth Pro is a paraphonic dual-filter analog synthesizer with 3
  wave-morphing oscillators, 24-mode dual state variable filters, 64-step
  sequencer, 256 presets, and 12 studio-quality effects.
details: |-
  3 discrete wave-morphing oscillators with PWM, sync, FM and ring modulation

  Dual state variable filters with 24 modes — original UNO Synth OTA filter plus new SSI-based filter with self-oscillation; serial and parallel routing

  Full ADSR envelopes

  LFOs with modulation matrix

  16-slot modulation matrix

  12 studio-quality effects in 3 simultaneous slots: modulation, delay, and reverb, plus true-analog overdrive

  64-step sequencer with 84 parameters and song mode

  10-mode onboard arpeggiator with chord mode

  256 user-editable presets

  Monophonic or 3-note paraphonic operation

  37-key Fatar semi-weighted keybed with aftertouch (keyboard version); 32 capacitive keys (desktop version)

  Noiseless balanced stereo outputs, headphone out, USB MIDI, 5-pin DIN MIDI in/out with Soft Thru, programmable CV/Gate in/out, audio input to filters/FX/pass-through

  Free editor for Mac/PC — standalone application and DAW plug-in
specs: |-
  - 3 discrete wave-morphing oscillators (PWM, sync, FM, ring mod)
  - Dual state variable filters with 24 modes (OTA + SSI with self-oscillation)
  - Full ADSR envelopes, 2 LFOs
  - 16-slot modulation matrix
  - 12 studio-quality effects in 3 slots + true-analog overdrive
  - 64-step sequencer with 84 parameters and song mode
  - 10-mode arpeggiator with chord mode
  - 256 user-editable presets
  - Monophonic or 3-note paraphonic
  - Keyboard version: 37-key Fatar semi-weighted with aftertouch
  - Keyboard dimensions: 55 x 30 x 7 cm (21.65" x 11.8" x 2.75")
  - Keyboard weight: 5.8 kg (12.8 lb), metal/plastic enclosure
  - Desktop version: 32 capacitive keys
  - Desktop dimensions: 33.3 x 15 x 5 cm (13.11" x 5.91" x 1.96")
  - Desktop weight: 700 g (1.54 lb), plastic enclosure
  - Power: PSU included (keyboard), USB or optional power bank (desktop)
