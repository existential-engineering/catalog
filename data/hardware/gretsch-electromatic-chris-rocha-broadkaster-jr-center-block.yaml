details: |-
  Chris Rocha is a highly influential guitarist and producer in the worship music scene, and his signature Electromatic Broadkaster Jr. Center Block brings his go-to Gretsch tone within reach.

  The Chris Rocha Broadkaster Jr. features a smaller arched maple body with a chambered spruce center block for dynamic resonance, feedback rejection, and lightweight comfort while retaining the open, airy character of a hollow body.

  Favored by Chris on some of his high-end Gretsch guitars, the dual High Sensitive Filter'Tron pickups deliver crisp top end, focused midrange, and articulate low end — equally at home with clean shimmer or driven crunch.

  The Thin "U" shaped maple neck provides exceptional feel and playability, paired with a 12" radius rosewood fingerboard, 22 medium jumbo frets, and pearloid Neo-Classic thumbnail inlays. Gold sparkle binding and a gold Bigsby B70 with wire handle round out the signature look.
