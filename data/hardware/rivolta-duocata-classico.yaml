description: A non-offset thinline electric guitar with a double bound chambered
  ash body and Rivolta F-hole. It features a set maple neck, rosewood fretboard,
  and matched P90/T-style pickups.
details: |-
  Introducing the new Rivolta DUOCATA. Sporting a brand new body silhouette from the mind of Dennis Fano, the DUOCATA is the first non-offset design in the Rivolta line-up. Features include a double bound, tone-chambered Ash body with Rivolta F-Hole, set Maple neck construction, our new C++ chunky neck profile, Rosewood fretboard, 25" scale, 24 jumbo frets, T-style bridge and an ultra smooth satin neck finish. Our new proprietary DUOCATA matched pickups (P90 in neck and T-Style in bridge) offer clear, crisp articulation and balanced tone. The Rivolta DUOCATA is everything you'd expect from a classic thinline guitar and more! **This version of the Duocata has been discontinued. Once they're gone... they're gone! For the updated Duocata, please follow this link .**

  FEATURES & SPECS

  Rivolta Premium Soft Case: Optional Add-On
