description: The DSL20 Head is an all-valve 20W guitar amplifier head from
  Marshall's DSL (Dual Super Lead) range, designed to deliver the rich tone of a
  classic Marshall valve amp in a compact and portable format. It carries two
  channels — Classic Gain and Ultra Gain — each with dedicated gain and volume
  controls, sharing a passive Treble/Middle/Bass tone stack plus Presence and
  Resonance for finer power-amp tone shaping, a Tone Shift switch for a scooped
  mid voicing, and onboard digital reverb. A power-reduction switch drops the
  output from 20W down to 10W at the flick of a switch, making the amp suitable
  for everything from rehearsal-room volumes to more intimate home or studio
  settings. The rear panel provides three 1/4-inch speaker outputs (selectable
  16 Ω / 8 Ω load), a series effects loop, a 3.5 mm emulated line output for
  silent recording or monitoring, a 3.5 mm aux input, a 1/4-inch footswitch
  jack, and a PEDL-90012 footswitch is included in the box. Two ECC83 preamp
  valves plus a third ECC83 phase splitter feed a pair of EL34 power valves.
details: |-
  The DSL20 Head is for those who need the full rich tone of a valve amp in a compact and portable format. From the moment you plug in, the DSL provides you with the functionality you need to take your sound from rehearsal to the studio with confidence.

  Selecting your preferred power setting should always be easy. That is why you can opt for either a commanding 20W or a more restrained 10W power output on the DSL20 Head at the flip of a switch. This feature is ideal for seamlessly transitioning from the rehearsal area to a more intimate home setting.

  Give your sound more bite and depth thanks to additional presence and resonance features. With these elements you can finely tune and sculpt your tone, ensuring a more dynamic and impactful auditory experience during your performances or practice sessions.

  The adaptability of having three speaker outputs not only allows for customisation to match your unique acoustic preferences but also facilitates recording capabilities. The DSL20 Head is an ideal choice for both live gigs and studio practice sessions.

  Its compact and portable design offers you convenience and flexibility. Its small size is perfect for home use and it is also easy to carry, making it an excellent companion for musicians on the move. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Model: DSL20HR
  - Range: DSL
  - Technology: All-valve
  - Channels: 2
  - Output wattage: 20W (with power reduction option to 10W)
  - Outputs: 3 x 1/4" jack sockets (16Ω load / 8Ω load), 1 x 3.5mm jack emulated line out
  - Inputs: 1 x 1/4" instrument jack, 1 x 3.5mm jack aux in, footswitch
  - Controls: Classic gain channel gain and volume, channel select switch, ultra gain channel gain and volume, tone shift switch, treble, middle, bass, presence, reverb
  - Effects: Digital reverb
  - Effects loop: Yes, 1 x series
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 9.7 kg / 21 lb
  - Width: 500 mm / 19.7"
  - Height: 250 mm / 9.8"
  - Depth: 240 mm / 9.4"
  - Country of origin: Designed and engineered in UK. Made in Vietnam.
  - Box contents: PEDL-90012 footswitch included, detachable power cable included
