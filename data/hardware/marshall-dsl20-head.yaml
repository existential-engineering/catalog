specs: |-
  - Output Wattage: 20W (with power reduction option to 10W)
  - Power Reduction: 20W / 10W switch
  - Channels: 2 (Classic Gain, Ultra Gain)
  - Controls: Classic Gain channel gain and volume, channel select switch, Ultra Gain channel gain and volume, tone shift switch, treble, middle, bass, presence, reverb
  - Effects: Digital reverb
  - Effects Loop: Yes, 1 x series
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x EL34
  - Speaker Outputs: 3 x 1/4" jack sockets (16 Ω load / 8 Ω load)
  - Emulated Output: 1 x 3.5 mm jack emulated line out
  - Instrument Input: 1 x 1/4" instrument jack
  - Aux Footswitch Input: 1 x 3.5 mm jack (aux in / footswitch)
  - Footswitch: Included (PEDL-90012)
  - Width: 500 mm / 19.7 in
  - Height: 250 mm / 9.8 in
  - Depth: 240 mm / 9.4 in
  - Weight: 9.7 kg / 21 lb
