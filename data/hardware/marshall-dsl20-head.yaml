description: The DSL20 Head is an all-valve 20W guitar amplifier head from
  Marshall's DSL (Dual Super Lead) range, designed to deliver the rich tone of a
  classic Marshall valve amp in a compact and portable format. It carries two
  channels — Classic Gain and Ultra Gain — each with dedicated gain and volume
  controls, sharing a passive Treble/Middle/Bass tone stack plus Presence and
  Resonance for finer power-amp tone shaping, a Tone Shift switch for a scooped
  mid voicing, and onboard digital reverb. A power-reduction switch drops the
  output from 20W down to 10W at the flick of a switch, making the amp suitable
  for everything from rehearsal-room volumes to more intimate home or studio
  settings. The rear panel provides three 1/4-inch speaker outputs (selectable
  16 Ω / 8 Ω load), a series effects loop, a 3.5 mm emulated line output for
  silent recording or monitoring, a 3.5 mm aux/footswitch jack, and a PEDL-90012
  footswitch is included in the box. Two ECC83 preamp valves plus a third ECC83
  phase splitter feed a pair of EL34 power valves.
