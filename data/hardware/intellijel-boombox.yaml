details: |-
  The Boombox is a speaker module built around a 3″ aluminum cone driver powered by an efficient Class D 15W amp. A special bass boost extends the low end range, and the sealed speaker enclosure is filled with acousta-stuff polyfill.

  A clip LED indicates input overload.

  This was designed as a fun option to plug into your system and jam somewhere free of cables for speakers. It is a quick way to test out ideas and also useful for feedback experiments with a mic.
