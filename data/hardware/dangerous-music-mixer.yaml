url: https://www.dangerousmusic.com/product/mixer
description: The Dangerous MIXER is an 8x2 line-source mixer designed to help
  users of digital audio workstations achieve better mixes through the proper
  integration of hardware synths, multi-effects and outboard gear into their
  digital system.
details: |-
  The Dangerous MIXER is an 8x2 line-source mixer designed to help users of digital audio workstations achieve better mixes through the proper integration of hardware synths, multi-effects and outboard gear into their digital system, avoiding unnecessary A/D/A conversions.

  Dangerous MIXER enables any MIDI device, outboard reverb or multi-effects unit, mic preamp — virtually any line-level source — to be integrated into a mix alongside digital audio tracks. It is also ideal for sub-mixing outputs of external mic preamps while tracking.

  With 8 inputs providing level control, panning, muting and phase reverse, the Dangerous MIXER delivers sonic quality expected from a full scale analog console, but from a compact 2RU device.
specs: |-
  - Frequency Response: 20 Hz-100 kHz within 0.1 dB (-3dB @ 5 Hz)
  - Total Harmonic Distortion: 0.004% in audio band
  - Intermodulation Distortion: 0.006% IMD60 4:1
  - Crosstalk @ 1 kHz: -87 dB
  - Noise floor: -91 dBu total energy in audio band
  - Max output level: +26 dBu
  - Nominal operating level: +4 dBu
  - Power consumption: 30 watts (40 watts with Sends and Direct Out options installed)
