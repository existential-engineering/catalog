description: An 8hp Eurorack module offering six latching switches and two
  momentary switches to generate and control gate signals, with LED feedback for
  each switch.
details: |-
  Spent all day at work pushing bad buttons? Go home and push good buttons instead. Are things getting out of hand in your system? Do you simply need, no, crave more gate signals you can turn on and off at will? Do you toss and turn in your sleep, wishing you could press a button and make everything go away - and then press it again, and make it all come back? We may be alike, you and I, which is why I designed the Gatekeeper . The stock version offers six latching switches, complete with pleasing, clicky, tactile feedback, as well as two momentary switches. All switches have an attached LED that will visualize the current state of the switch with a soft, amber glow, allowing you to see what's happening, even in the darkness of your dungeon synth studio. Switches 1-3 also give you the rare opportunity to insert your own signals, bypassing the internal gate signal generation. The module has no capacity to judge the quality of your input, so you may feel free to do exactly as you please to this particular row of sockets. For those with unusual needs or preferences, we also do custom button layouts on request, simply get in touch with us - yes, even all-momentary switches. This is one of those modules that don't do anything revolutionary - it just does a job that you want it to do, and really well, too. Assert yourself the way a person-in-control would and press those switches, or use it as a crowd pleaser or producer switch, and merely pretend to do something cool, when in fact nothing at all takes place. Turn signals on, or off, or create odd little finger-drumming performances. You know what they say: dance like no one is watching, and patch like it's not plugged in.
specs: |-
  - High quality switches to facilitate your gate signals
  - Six latching switches with tactile feedback
  - Two normally-open momentary switches
  - Immediate visual feedback through front panel LEDs
  - Optionally, insert your own signals
