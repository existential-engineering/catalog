details: |-
  The HTM6 S3 is the entry-level center channel loudspeaker in the third-generation Bowers & Wilkins 600 Series, built to match the 603 S3 floorstanders and the 606 S3 / 607 S3 stand-mounts in a multi-channel home theater system.

  It is a 2-way vented-box system that combines a 25mm (1 in) Decoupled Double Dome Titanium tweeter with two 130mm (5 in) Continuum cone bass/midrange drivers arranged in a horizontal MTM configuration. The Titanium Dome tweeter is new for this generation and is fronted by an acoustically transparent grille mesh for cleaner dispersion.

  Low-frequency tuning uses Bowers & Wilkins' Flowport technology to reduce port turbulence, while upgraded binding-post speaker terminals derived from the 700 Series provide an improved layout and a cleaner signal path between amplifier and drivers.

  Nominal impedance is 8 ohms (4.3 ohm minimum) with a sensitivity of 87dB and a recommended amplifier power range of 30W to 120W into 8 ohms, making the HTM6 S3 well-suited to mainstream AV receivers and integrated amplifiers.

  The cabinet is available in Black, White, or Oak finishes.
specs: |-
  - 2-way vented-box system
  - High-frequency driver: 1x 25mm (1 in) Decoupled Double Dome Titanium
  - Bass/midrange drivers: 2x 130mm (5 in) Continuum cone
  - Frequency response: 72Hz - 28kHz (±3dB on-axis)
  - Frequency range: 42Hz - 33kHz (-6dB)
  - Sensitivity: 87dB SPL (on axis at 2.83Vrms at 1m)
  - Nominal impedance: 8Ω (minimum 4.3Ω)
  - Recommended amplifier power: 30W - 120W into 8Ω
  - Harmonic distortion: <1% (100Hz - 22kHz), <0.5% (120Hz - 12kHz)
  - Max recommended cable impedance: 0.1Ω
  - Dimensions (H x W x D): 160 x 480 x 255mm (6.3 x 18.9 x 10 in) cabinet only; 283mm (11.2 in) depth with grille and terminals
  - Net weight: 7.7kg (17 lb)
  - Available finishes: Black, White, Oak
