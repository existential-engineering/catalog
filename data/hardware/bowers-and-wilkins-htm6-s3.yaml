description: The HTM6 S3 is small enough to fit into convenient spaces in your
  home but mighty enough to partner with the 603 S3 tower speaker. It combines
  the all-new Titanium Dome tweeter with the powerful accuracy and transparency
  of twin Continuum bass/midrange cones.
details: |-
  HTM6 S3 is the centre channel loudspeaker of the third-generation Bowers & Wilkins 600 Series, a 2-way vented-box design carrying one 25mm Titanium Dome high-frequency unit and two 130mm Continuum cone bass/midrange drivers in a horizontal cabinet. Bowers & Wilkins positions it as powerful enough to partner the 603 S3 floorstander and compact enough to sit with any piece of furniture, bringing more realism and accuracy to a home theatre front soundstage.

  The tweeter is the headline change for this generation. Bowers & Wilkins describes the all-new Titanium Dome unit as combining exceptional resolution and insight with smooth, refined high-frequency reproduction, and pairs it with a new, more acoustically transparent tweeter grille mesh first developed for the company's Signature models. The bass/midrange pair uses the Continuum cone, whose composite construction is said to avoid the abrupt transitions in behaviour that can impair a conventional drive unit, for a more open and neutral delivery of voices and instruments.

  The speaker terminals are derived from those recently introduced in the 700 Series range, with an improved layout and a cleaner signal path between amplifier and loudspeaker. The 600 Series 3 manual states that there are two linked pairs of terminals on the back of the speaker, labelled HF and LF. For conventional connection the terminal links stay in place as delivered and only one pair is connected to the amplifier; for bi-wiring or bi-amplification the links are removed and each pair is connected independently. The terminals take 4mm banana plugs, 6mm and 8mm spades, or bare wire up to 4mm diameter, with the 4mm holes blocked by plastic pins to satisfy European CENELEC rules.

  The cabinet is entirely passive: there is no on-board amplification, no mains inlet and no line-level input. Installation follows the manual's centre-channel guidance, behind the centre of an acoustically transparent projection screen where one is used, or directly above or below the screen on a floor stand, furniture unit or wall shelf, as close to ear height as possible. Four self-adhesive rubber feet are supplied to fit to the base for a degree of vibration isolation when the speaker shares a shelf or rack with other AV equipment.

  Low-frequency output can be trimmed with the supplied foam port plug, which is the intended remedy when the speaker cannot be moved further from a wall. The cabinet is offered in Black, White and Oak, with a Black grille on the Black cabinet and a Grey grille on the White and Oak finishes.
specs: |-
  - Description: 2-way vented-box system
  - Drive units: 1x 25mm (1 in) Titanium Dome high-frequency, 2x 130mm (5 in) Continuum cone bass/midrange
  - Frequency range: -6dB 42Hz to 33kHz
  - Frequency response: 72Hz to 28kHz +/-3dB
  - Sensitivity: 87dB spl (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 100Hz to 22kHz, less than 0.5% 120Hz to 12kHz
  - Nominal impedance: 8 ohms (minimum 4.3 ohms)
  - Recommended amplifier power: 30W to 120W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Technical features: Decoupled Double Dome Titanium tweeter, Continuum cone bass/midrange, Flowport
  - Passive: no on-board amplification and no mains connection. Two linked pairs of HF and LF terminals, single-wire as delivered, bi-wire or bi-amp with the links removed
  - Terminals accept 4mm banana plugs, 6mm and 8mm (1/4 in and 5/16 in) spades, or bare wire up to 4mm (5/32 in) diameter
  - Dimensions: height 160mm (6.3in) cabinet only; width 480mm (18.9in) cabinet only; depth 255mm (10in) cabinet only, 283mm (11.2in) including grille and terminals
  - Net weight: 7.7kg (17lb)
  - Cabinet finishes: Black, White, Oak
  - Grille finishes: Black (on Black), Grey (on White and Oak)
  - Supplied with grille, foam port plug and four self-adhesive rubber feet
