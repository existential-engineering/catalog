description: >-
  Roland's first analog polyphonic synthesizer since 1986, combining a
  four-voice true analog section with a 64-voice digital SuperNATURAL engine in
  a single keyboard instrument.
details: |-
  The JD-XA, released in 2015, marked Roland's long-awaited return to analog polyphonic synthesis. It pairs a four-part analog engine with a four-part digital section based on their SuperNATURAL technology, allowing both engines to work independently or interact with each other for richly layered sounds.

  The analog side features two digitally-controlled analog oscillators per voice with true analog filters, delivering the warmth and character that analog purists demand. The digital section adds 64 voices of polyphony and access to Roland's extensive PCM and modeling capabilities. A direct dry output option bypasses internal effects for pristine analog signal path when desired.

  Drawing visual inspiration from the JD-800 with its array of sliders and knobs, the JD-XA features a glossy black panel with a distinctive red glow around its controls. The 49-key keyboard includes velocity and channel aftertouch, and the onboard 16-track sequencer and 64-pattern arpeggiator add significant performance and composition tools. Memory holds 256 internal patches with additional USB storage.

  The instrument includes a comprehensive effects suite with eight MFX systems offering 67 effect types, two TFX systems with 29 types, plus dedicated delay and reverb processors. MIDI and USB connectivity round out a feature set aimed squarely at modern electronic music production.
specs: |-
  - Polyphony: 4 voices (analog) / 64 voices (digital)
  - Oscillators: 2 digitally-controlled analog oscillators per voice
  - Waveforms: Triangle, sine, square (with PWM), fixed square, ramp-up sawtooth
  - Filters: 5 types (analog) / 14 types (digital)
  - LFO: 2 per analog part
  - Keyboard: 49 keys with velocity and channel aftertouch
  - Memory: 256 internal / 256 USB flash
  - Sequencer: 16-track
  - Arpeggiator: 64 preset patterns
  - Effects: MFX (8 systems, 67 types), TFX (2 systems, 29 types), delay, reverb (6 types)
  - Control: MIDI in/out, USB
