details: |-
  The 4060 Omni Mic is the very first miniature microphone developed by DPA from the best technology previously only used in hearing aids and measurement microphones. This microphone handles sound pressure levels up to 134 dB before clipping occurs. This mic is well suited for applications where the sound source is more remote or damped and you need to have a good balance signal versus noise. The 4060 Omni Boundary Layer Mic is optimized to boost speech intelligibility and ideal for use in boardrooms, conference facilities, and courtrooms.

  Boundary layer mount for tabletop placement in boardrooms, conference facilities, and courtrooms.

