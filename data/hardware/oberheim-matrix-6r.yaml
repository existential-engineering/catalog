description: >-
  The Oberheim Matrix 6R is the rack-mount version of the Matrix 6, a six-voice
  analog synthesizer produced from 1986 to 1988. It uses DCOs for stability
  while retaining a fully analog signal path, and features Oberheim's Matrix
  Modulation system for extensive virtual patching capabilities. Notable users
  include Orbital, Philip Glass, Future Sound of London, Tangerine Dream, and
  Mouse on Mars.
details: |-
  The Matrix 6 was one of the last synthesizers from Oberheim during the mid-1980s, following the classic OB series. It utilized digitally controlled oscillators to provide tuning stability and programmability while retaining a totally analog sound engine. The Matrix 6R is the identical synthesizer without a keyboard, retaining the membrane programming interface in a rack-mount format.

  All Matrix synthesizers featured Oberheim's Matrix Modulation system, which allows for extensive virtual patching and an almost unlimited range of sounds and modulation possibilities. Each of its six voices has a pair of DCOs, a lowpass resonant filter, two VCAs, three envelope generators, two LFOs, and two ramp generators, enabling complex analog pads, basses, and textural sounds.

  The programmability is vast but can be tedious to navigate. Following the trend of the era, knobs and sliders were replaced by membrane buttons and a single data slider, with extensive parameter labeling across the front panel. Full MIDI SysEx support allows patch transmission from external sources, making patch management more practical.

  Oberheim later produced the Matrix 1000, which packed 1000 patches from the Matrix 6 into a single rack unit with preset-only access editable through SysEx. The Matrix 6R offers the full programming capabilities of the Matrix 6 in a rack-friendly format, making it an excellent source of bright, punchy sounds, vintage analog pads, textures, and ambient tones.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 12 DCOs (2 per voice)
  - Layers: Single / Split / 2-part Multitimbral
  - Memory: 100 patches, 50 splits
  - Filter: 1 lowpass resonant filter per voice
  - VCA: 2 VCAs + 3 multimode envelopes per voice
  - LFO: 2 per voice (plus 1 for vibrato effect)
  - Keyboard: None (rack-mount module)
  - Control: MIDI In/Out/Thru
  - Production Period: 1986-1988
releaseDate: "1986"
