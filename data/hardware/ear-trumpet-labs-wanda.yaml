details: |-
  Wanda, the latest microphone from Ear Trumpet Labs, pairs vintage mid-century design with cutting-edge performance. This versatile condenser mic delivers exceptional clarity for vocals, horns, strings, drums, and more, both live and in studio.

  Wanda's medium-large diaphragm condenser capsule, high-SPL handling, and multilayer pop filter make it suited to vocals and acoustic instruments as well as high-volume applications like horns, snares, or guitar cabs, with great feedback rejection and plosive control for studio-quality sound anywhere.

  Hand-built in Ear Trumpet Labs' small Oregon workshop with precision and artistry, Wanda follows the maker's practice of building versatile, reliable, and visually distinctive microphones used by GRAMMY-winning artists worldwide.

  Suggested applications are vocals and high-volume sources like horns, snare drums, and guitar cabs, with clarity, plosive control, and feedback rejection for both live and studio use.
specs: |-
  - Mid century inspired design: lustrous all-brass body with brass mesh and classic cast construction
  - Built-in pivot mount: designed for easy adjustment and compatibility with straight and boom stands, no clip required
  - Versatile application: vocals, horns, stringed instruments (guitar, fiddle, mandolin), guitar cabs, and percussion
  - Hand-built craftsmanship: made in Ear Trumpet Labs' small Oregon workshop
  - Generous sweet spot: rich, consistent tone and sweet spot up to 12 inches
  - High SPL handling: circuit designed to accommodate loud sound sources
  - Precision electronics: transformerless FET circuit with fully balanced, hand-wired components, including film capacitors, precision resistors, and hand-tested, matched transistors, each circuit tuned individually
  - Road-ready: rugged brass construction designed to handle the rigors of travel
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000 Hz, 94 dB): -48.3 dB (3.8 mV/Pa)
  - Power requirement: +24V to +48V phantom power
