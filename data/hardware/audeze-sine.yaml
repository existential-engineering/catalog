details: |-
  The SINE represents the next step up for many conventional headphone users as the inaugural on-ear planar magnetic headphone. It merges striking contemporary industrial design with premium construction and cutting-edge planar magnetic technology. Its lightweight frame folds compactly for portability, and buyers may opt for the CIPHER Lightning cable featuring integrated DAC/AMP with DSP.

  Audeze's proprietary planar magnetic engineering delivers astonishingly clear and accurate sound through several patented innovations. Ultra-thin diaphragms—thinner than human hair and three times larger than conventional headphone drivers—enable rapid response times, minimal distortion, superior resolution, and enhanced imaging. The Uniforce voice-coil technology maintains uniform driving force across the entire diaphragm, achieving near-zero distortion characteristics.

  The Fluxor magnet arrays concentrate magnetic flux to nearly double the driving force, reducing distortion and improving precision. Fazor elements guide internal acoustic waves to prevent resonance, ensuring accurate waveform reproduction.

  The optional CIPHER cable represents the world's first 24-bit Lightning cable, featuring an embedded system-on-chip that bypasses iPhone's native DAC and amplifier. The cable incorporates a SIRI-compatible microphone for telecommunications.

  The complementary Audeze iOS application enables real-time sound personalization through dual presets and a ten-band equalizer. This is a legacy product and no longer available for sale.
