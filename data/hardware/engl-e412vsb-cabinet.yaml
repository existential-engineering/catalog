url: https://www.engl-amps.com/shop/cabinets/engl-e412vsb-cabinet/
description: The E412VSB is a slanted 4 x 12 inch passive guitar cabinet with a
  closed back, loaded with four Celestion Vintage 30 speakers and rated at 240
  watts into 8 Ohm.
details: |-
  The E412VSB is a classic representative of its craft, a slanted 4 x 12 cabinet with the beam characteristics and the look that have shaped rock stages for over 50 years.

  Four Celestion Vintage 30 speakers give a centre-oriented voice that presents even complex distorted structures with a solid bass foundation and silky highs. The birch plywood housing is built to last, solid and roadworthy, with a hand-welded metal grille.

  A parallel input and thru pair allows daisy chaining to a second cabinet. Power handling is 240 watts at 8 Ohm, and the cabinet weighs 52 kg.
specs: |-
  - 4 x 12 inch Celestion Vintage 30 speakers, made in the UK
  - Power handling: 240 W
  - Impedance: 8 Ohm
  - Angled front, closed back
  - Solid birch plywood construction
  - Parallel input and thru for daisy chaining
  - Solid hand-welded metal grille
  - Passive cabinet, no mains power connection
  - Dimensions: 74 x 75 x 36 cm
  - Weight: 52 kg
