  - auto-gain
url: https://www.uaudio.com/products/volt-4-gen-2
prices:
  - amount: 374
    currency: USD
description: Twelve-in, six-out USB audio interface with dual Tone Shaping
  preamps, optical expansion and MIDI.
details: |-
  Volt 4 Gen 2 is a desktop USB audio interface offering twelve inputs and six outputs at up to 32-bit, 192 kHz. Two Tone Shaping preamps provide 60 dB of gain with Warmth, Focus and Shine character modes.

  Two mic and line combo inputs sit alongside two front-panel Hi-Z instrument inputs and two further line inputs for outboard gear. An ADAT or S/PDIF optical input adds up to eight channels of digital expansion, and MIDI In and Out connect controllers, keyboards and synths over 1/8-inch TRS.

  An onboard USB hub port connects peripherals and powers external MIDI controllers. A full-colour Smart Display, Auto-Gain, Clip Protection and built-in loopback round out the feature set, with full integration into the UAD Console app and LUNA.
specs: |-
  - 12-in / 6-out USB audio interface
  - 32-bit / 192 kHz conversion
  - Supported sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Two Tone Shaping preamps, 60 dB available gain each
  - Warmth, Focus and Shine character modes
  - ADAT or S/PDIF optical input, 8 channels at 44.1 and 48 kHz
  - S/MUX capable, 4 channels at 96 kHz and 2 channels at 192 kHz
  - MIDI In and Out on 1/8-inch TRS, MIDI Type A
  - USB hub port supplying 5VDC at 0.5A maximum
  - Full-colour Smart Display
  - Auto-Gain and Clip Protection
  - Independent switchable 48V phantom power per channel
  - Built-in loopback
  - Class-compliant with Mac, Windows, iPad and iPhone
