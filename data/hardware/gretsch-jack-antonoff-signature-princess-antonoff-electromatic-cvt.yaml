details: |-
  Jack Antonoff is a highly influential songwriter, producer, and instrumentalist - a ten-time Grammy Award winner, including three back-to-back Producer of the Year awards. He has collaborated with Taylor Swift, The 1975, St. Vincent, Florence and the Machine, Lana Del Rey, and Paramore, plus served in Fun and Bleachers.

  Gretsch is proud to partner with Jack on the Limited Edition Jack Antonoff Signature CVT. The guitar represents an evolution of his beloved vintage Gretsch Princess guitar, featuring a solid alder body, bolt-on maple neck, custom-wound FideliSonic single-coil pickups, and a custom control layout for a guitar that is as unique, versatile, and dynamic as its namesake.

  The solid alder body with bolt-on maple neck provides excellent note attack and a bright, clear tonal response. Custom-wound FideliSonic pickups with Alnico 5 magnets deliver a robust sound with plenty of punch and clarity, enabling transition from thick, rich overdrive to a pristine clean tone.

  The custom control layout allows players to easily dial in a wide range of different sounds, making this an exceptionally versatile guitar that can help you discover exciting new sonic landscapes.
