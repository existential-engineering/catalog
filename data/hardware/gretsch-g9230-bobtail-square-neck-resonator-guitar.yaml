details: |-
  With its deluxe appointments and Fishman Nashville pickup, the Bobtail Square-Neck stands out in the mix in multiple ways. The vital feature of all Gretsch resonator guitars is the Gretsch Ampli-Sonic diaphragm (resonator cone), which is hand-spun in Eastern Europe from nearly 99 percent pure aluminium, yielding an impressive quality and volume of tone.

  Designed for lap-style and slide playing, the G9230 features a square neck with flat-radius padauk fingerboard, laminated mahogany body, and bone nut. The onboard Fishman Nashville Resophonic pickup amplifies its tone for live performance, finished in 2-Color Sunburst.
specs: |-
  - Series: Roots Collection
  - Body: Laminated Mahogany, Resonator shape, Non-Cutaway
  - Neck: Mahogany, Square Neck
  - Scale Length: 25"
  - Frets: 19 medium jumbo (12 to body)
  - Fingerboard: Padauk, flat radius
  - Nut: Bone, 2" width
  - Tuning Machines: Grover Sta-Tite
  - Tailpiece: Weathered Trapeze
  - Hardware: Chrome
  - Electronics: Fishman Nashville Resophonic Pickup
  - Strings: D'Addario EJ42 Phosphor Bronze (.016-.056)
  - Finish: Vintage Semi-Gloss
  - Color: 2-Color Sunburst
