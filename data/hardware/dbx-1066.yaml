description: Stereo compressor/limiter/gate featuring dbx's V2 VCA technology,
  with selectable auto or manual compression modes for studio, broadcast, and
  portable PA applications.
details: |-
  The 1066 Stereo Compressor/Limiter/Gate represents dbx's expertise in signal processing, combining world-class design with state-of-the-art VCA technology. It delivers classic dbx compression through an intuitive Auto button or customizable Attack and Release controls for tailored gain management across various audio applications.

  The unit incorporates frequency-dependent gain control via external sidechain capability, allowing users to trigger compression on specific frequencies while managing overall signal integrity. Its PeakStopPlus™ limiting technology represses unwanted transients with minimal distortion, while selectable Hard-Knee or OverEasy® characteristics accommodate both aggressive and subtle compression needs.

  True stereo or dual-mono operation makes the 1066 versatile for mixing environments. The device features precision metering for input, output, and gain reduction levels, alongside balanced XLR and 1/4" connectors with switchable +4dBu/-10dBV operation per channel, ensuring professional integration into any audio chain.
specs: |-
  - Selectable Auto (classic dbx) or Manual (variable Attack/Release) compression
  - Contour switch removes low-frequency information from detector circuit
  - Selectable OverEasy® or Hard Knee compression modes
  - PeakStopPlus™ limiting for maximum level control with minimal distortion
  - External sidechain (SC Ext) and sidechain monitor (SC Mon) for gating setup
  - True RMS level detection
  - Input: ±24 dBu balanced/unbalanced; Output: ±21 dBm balanced/±20 dBm unbalanced
  - Bandwidth: 20 Hz–20 kHz (±0/−0.5 dB)
  - Noise: <−95 dBu unweighted, 22 kHz measurement bandwidth
  - Dynamic Range: >118 dB unweighted
  - THD+Noise: 0.008% typical at +4 dBu (1 kHz unity gain)
  - Compressor Threshold Range: −40 dBu to +20 dBu
  - Compressor Ratio: 1:1 to infinity:1
  - Limiter Threshold Range: +4 dBu to +24 dBu (off)
  - Expander/Gate Threshold Range: Off to +15 dBu
  - Expander/Gate Ratio: 1:1 to 30:1
  - Gate Attack Time: <100 µsec
  - 12-segment LED gain reduction meter (1–30 dB increments)
  - 8-segment LED I/O meter (−24 to +18 dBu)
  - True stereo or dual-mono operation
  - Relay bypass with 1.5-second power-on delay
  - Dimensions: 1.75″H × 19″W × 9″D
  - Power: 20 watts @ 100–120 VAC or 200–240 VAC 50/60 Hz
