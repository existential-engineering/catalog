description: The OM2H is a 14-fret Orchestra Model steel-string acoustic guitar
  favored by fingerstyle soloists. Its compact body measures just over 4 inches
  deep, producing balanced tone and immediate response. Built with a Sitka
  spruce top and East Indian rosewood back and sides, it delivers clarity and
  warmth across the full dynamic range.
details: |-
  The OM2H is an Orchestra Model acoustic guitar designed for fingerstyle players who demand precision and balance. The compact body shape — just 4 inches deep — keeps the instrument responsive and controlled, with even projection across all registers. Standard construction features a Sitka spruce top, East Indian rosewood back and sides, and a Honduran mahogany neck with an ebony fingerboard and ebony belly-style bridge. Abalone fingerboard inlays, ivoroid binding with herringbone purfling, and a tortoise pickguard give the instrument a refined, classic appearance. The bone nut and saddle, nickel Waverly tuners, and mortise & tenon hybrid neck joint reflect a commitment to tonewoods and hardware that serve long-term playability. A compound fingerboard radius (14" to 26") accommodates both chord work and single-note runs.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Bridge: Ebony belly-style
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Tuners: Nickel Waverly
  - Fingerboard Inlays: Abalone
  - Bridge Spacing: 2 3/16"
  - Frets: Medium 18% nickel-silver
  - Fingerboard Radius: 14" - 26" compound
  - Scale Length: 25 1/2"
  - Body Width: 15"
  - Body Length: 19 1/4"
  - Body Depth: 4"
  - Total Length: 39 3/4"
  - Neck Profile: Modified V
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Body Binding: Ivoroid with herringbone purfling
  - Rosette: iv/tort/iv & b/w purflings
  - Backstrip: 2-style (Zipper)
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Strings: D'Addario EJ-16 (.012"-.053")
