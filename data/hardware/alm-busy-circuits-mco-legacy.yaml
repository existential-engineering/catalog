details: |-
  The MCO (Legacy) is ALM Busy Circuits' original compact digital voltage-controlled oscillator for Eurorack, packing 10 morphing wavetable waveforms into a slim 6HP skiff-friendly module. Waveforms include standard shapes as well as noise, staple waves, and more complex timbres, all voltage-controllable via the waveshape CV input for dynamic timbral sweeps.

  The module provides three simultaneous outputs: the main wavetable output, a PWM'd version of the wavetable for pulse-width modulated textures, and a sub square wave output pitched one octave below the main oscillator. Voltage control inputs cover frequency (V/Oct tracking), waveshape, pulse width, and a type/distribution parameter, plus a hard sync input for classic sync effects.

  This is the discontinued first-generation version, offered as new old stock at a reduced price with a 1-year warranty. It has been superseded by the current MCO which offers expanded features. Original packaging may be absent.
specs: |-
  - Width: 6HP
  - Depth: 32mm
  - Power: +12V 40mA / -12V 15mA
  - 10 morphing wavetable waveforms
  - 3× audio outputs (wavetable, PWM, sub square)
  - 5× CV/gate inputs (V/Oct, waveshape, PWM, type, sync)
  - Hard sync input
  - Sub square wave (one octave below)
  - Reverse polarity protection
  - Skiff friendly
  - Made in the UK
  - 1-year warranty (legacy/NOS)
  - Discontinued — sold as new old stock
