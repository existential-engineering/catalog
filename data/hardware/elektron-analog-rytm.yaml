description: >-
  The Elektron Analog Rytm is a hybrid analog/digital drum machine combining dedicated
  analog synthesis engines for each of its 12 pads with sample playback, a powerful
  parameter-locking sequencer, and extensive performance modes.
details: |-
  The Analog Rytm takes a unique approach to drum synthesis by pairing dedicated analog sound engines with digital sample playback on each of its 12 pads. Rather than offering generic patch-based synthesis, each voice type has a purpose-built engine: the bass drum features two oscillators with snap and tick parameters, while the cymbal engine provides six oscillators and noise color controls. Each voice also supports one sample that can blend with or replace the analog engine.

  The synthesis architecture provides eight voices of polyphony with per-voice filter, amplifier, and LFO pages. Filter types span two-pole lowpass, one-pole lowpass, bandpass, one-pole highpass, two-pole highpass, bandstop, and peak modes. Global digital reverb and delay effects use a bus system with per-sound routing, while analog compression and distortion shape the overall output. Individual voice outputs complement the stereo main outputs.

  The sequencer supports up to 64 steps per pattern with various time signatures and swing control. Elektron's signature parameter locks allow per-step tweaking of any parameter, sound locking for mid-pattern voice swapping, and parameter slides for glitch and glissando effects. Storage is generous at 128 projects, each holding 128 kits, 128 patterns, and 16 songs, with 1 GB of sample storage on the +Drive.

  Performance modes include Mute mode for controlling sound activation, Chromatic mode for melodic playing on the pads, a pressure-sensitive Performance mode for real-time parameter control, and Scene mode for grouping 12 parameter lock collections. Overbridge integration provides DAW connectivity with bidirectional audio streaming and VST control.
specs: |-
  - Polyphony: 8 voices
  - Pads: 12 (velocity and pressure sensitive)
  - Oscillators: 1-6 per voice (engine dependent)
  - Waveforms: Sine, asymmetric sine, triangle
  - Filter: 2-pole LP, 1-pole LP, BP, 1-pole HP, 2-pole HP, bandstop, peak
  - LFO: 1 per voice
  - VCA: 1 per voice
  - Effects: Digital reverb/delay, analog compression/distortion
  - Sequencer: Up to 64 steps per pattern
  - Sampler: 1 sample per sound, 16-bit 48 kHz
  - Storage: 128 projects, 128 kits/patterns per project, 16 songs per project, 1 GB +Drive
  - Control: MIDI, USB
