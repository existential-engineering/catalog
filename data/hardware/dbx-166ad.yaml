description: The dbx 166AD is a discontinued dual-channel
  compressor/limiter/gate adding AES/EBU and S/PDIF digital outputs to the
  166A's OverEasy® compression, PeakStop™ limiting, and noise gate. It bridged
  analog dynamics processing with digital recording systems in a 1U rackmount
  unit.
details: |-
  The 166AD extended the 166A's proven dynamics processing by adding digital output capability, allowing direct connection to digital recording systems without an external analog-to-digital converter. AES/EBU and S/PDIF digital outputs complement the standard analog I/O.

  Like its predecessor, the 166AD features dbx's OverEasy® compression for smooth, transparent gain reduction, a PeakStop™ hard limiter for absolute peak control, and a noise gate section for effective noise reduction. Two independent channels can be operated separately or linked for stereo program material.

  The addition of digital outputs made the 166AD particularly useful in hybrid analog/digital studio environments, enabling engineers to route compressed signals directly into DAWs and digital workstations while maintaining the analog character of dbx's dynamics processing.
