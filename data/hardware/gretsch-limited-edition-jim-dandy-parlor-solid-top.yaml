details: |-
  Well suited for everything from bluesy porch pickin' to speakeasy swingin', the Gretsch Limited Edition Jim Dandy Parlor Solid Top is a ramblin' companion for newbies and old-timers alike.

  Inspired by the historic "Rex" line of instruments offered by mail-order catalog in the 1930s, '40s and '50s, Jim Dandy models embody the charm and spirit of those early Gretsch flat-top guitars with the superior playability and best-in-class tone that their namesake suggests.

  Featuring a petite and portable parlor body shape, a solid spruce top, and a short 24" scale length, the Limited Edition Jim Dandy Parlor Solid Top punches above its weight with a distinct tonal clarity and throaty midrange for which parlor guitars are so beloved. The X-braced body is crafted with a solid spruce top and laminated sapele back and sides for a crisp, clear tone with plenty of warmth and presence.

  The easy playing "C"-shaped neck presents an inviting feel for hours of old-timey inspiration. Period-correct details such as a vintage-style pinned bridge, "G"-graphic pickguard, painted pinstripe purfling, 3-on-a-plate open-gear tuning machines and oversized dot fingerboard inlays combine for a nostalgic personality destined for any barnburner or jamboree.
