description: >-
  The Oberheim Eight Voice is a massive analog polyphonic synthesizer combining
  eight classic SEM modules with a Polyphonic Synthesizer Programmer, providing
  16 VCOs, 8 VCFs, and 16 ADR envelope generators in a 49-note keyboard
  instrument.
details: |-
  The immensely fat and analog Eight Voice from Oberheim is truly a vintage synth. It is essentially eight classic Oberheim SEM modules stacked together alongside the Polyphonic Synthesizer Programmer for memory, a simple analog mixer, and a 49-note keyboard. This gives an eight-voice polyphonic and polytonal synthesizer with 16 VCOs, 8 VCFs, and 16 ADR envelope generators.

  In the late 1970s a two-tier keyboard version was released with a larger 61-note keyboard added below the standard 49-note keyboard. Because the Eight Voice derives its polyphony from having eight mono-synth modules hard-wired together, each voice can be programmed independently to craft diverse and complex sounds.

  The Polyphonic Synthesizer Programmer stores 16 patches per voice, all of which can be different, so programming work can be saved. The Eight Voice was the pinnacle of Oberheim's first synth system, completely based around the simple SEM. But a need for truly polyphonic circuit designs would soon lead to Oberheim's legendary OB-series, leaving the SEM-based poly-synths behind in the 1970s.

  The Eight Voice has been used by Herbie Hancock, Styx, and Rush.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 16 VCOs (2 per voice) with sawtooth or variable-pulse waveforms
  - LFO: Triangle wave only
  - Filter: Low, band, high, notch filter with resonance
  - VCA: 2 ADR envelopes
  - Keyboard: 49 keys
  - Memory: 16 patches per voice via Polyphonic Synthesizer Programmer
  - Control: CV/Gate
