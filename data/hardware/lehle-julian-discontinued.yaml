description: The LEHLE JULIAN is an advanced LEHLE SUNDAY DRIVER SW and offers
  additional controls like the parametric mids and treble. It has developed into
  a versatile booster, especially with the vintage users in mind, to tickle the
  input of a tube amp.
details: |-
  The Julian is an advanced Sunday Driver SW with additional controls for parametric mids and treble, which makes it a versatile booster aimed at vintage players who want to tickle the input of a tube amp.

  The parametric midboost allows individual sound shaping and can recreate the characteristics of familiar classics such as the Dallas Rangemaster or the Hornby Skewes Treble Booster. Because those boosters had a very low input impedance, the Julian carries a switch that reduces impedance from 1 MOhm to 10 kOhm for an authentic rendition of their character, and the treble control completes the sonic performance. Settings from muffled to edgy stay usable throughout, with no dull or piercing extreme.

  The overdrive grade of the connected amp is fine-tuned with the gain pot across plus or minus 15 dB, ranging from super clean to distorted. A JFET input stage keeps the output clean, and the incoming current is rectified, stabilized and doubled to 18 V right after the power socket, which is where the unit's dynamic comes from.

  In OFF status there are two modes of operation. In TB, for True Bypass, input and output are linked with zero losses through a switch with gold-plated contacts, which suits a small set-up with short cable routings or a classical fuzz pedal looped in after the Julian. In TS, for True Sound, the unit is active as a buffer without amplifying or coloring the signal, which suits long cables and complex effect board configurations, whether the unit is a battery-operated stand-alone or sits in an existing pedal board.
specs: |-
  - JFET input stage
  - Parametric mid boost plus treble control for individual sound shaping
  - Impedance switch reducing input impedance from 1 MOhm to 10 kOhm for vintage treble-booster character
  - Gain pot with plus or minus 15 dB range
  - On/Off footswitch with a large status LED
  - Two bypass modes: TB (True Bypass) through gold-plated contacts and TS (True Sound) buffered
  - Incoming current rectified, stabilized and doubled to 18 V after the power socket
  - Runs as a battery-operated stand-alone unit or from an external power supply
