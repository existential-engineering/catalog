name: Parametric Equaliser 512 V2
manufacturer: midas
primaryCategory: equalizer
categories:
  - outboard
url: "https://www.midasconsoles.com/en/products/0821-ACG"
description: The PARAMETRIC EQUALISER 512 V2 is a 500 Series 4-band fully
  parametric equaliser derived from the channel strip of the legendary Midas
  HERITAGE 3000 mixing console. Designed for use with the LEGEND L10, L6, or
  other standard 500 Series rackmount chassis, the 512 V2 delivers the legendary
  Midas sound in a compact modular format with upgraded, premium-quality
  performance. Four overlapping bands cover the full audio range, each combining
  gain and frequency on dual concentric controls — gain on the inner knob and
  frequency on the outer ring. The Lo Mid and Hi Mid bands are always in fully
  parametric mode, while the Bass and Treble bands can be switched between
  shelving and parametric (bell) operation. A true hardware relay bypass via the
  IN switch removes all circuitry from the signal path when EQ is not needed,
  and bypass also engages automatically should the host chassis lose power.
details: |-
  Front panel controls combine gain and frequency on dual concentric knobs for each of the four bands (Bass, Lo Mid, Hi Mid, Treble), with Bell switches for the Bass and Treble bands to toggle between shelving and parametric operation. The Lo Mid and Hi Mid bands always operate in fully parametric mode. A premium balanced input stage with -70 dB CMRR @ 1 kHz feeds the EQ circuitry. The IN switch engages a true hardware relay bypass that removes all circuitry from the signal path, and a power-up mute function prevents transients when the host chassis is powered on. Bypass also engages automatically should the chassis be accidentally powered down. As a 500 Series module, audio I/O is provided by the host 500 Series rackmount chassis (e.g. Midas LEGEND L10 or L6).
specs: |-
  - Format: 500 Series module
  - Bands: 4 overlapping fully parametric bands
  - Bass Frequency Range: 20 Hz to 400 Hz
  - Lo Mid Frequency Range: 100 Hz to 2 kHz
  - Hi Mid Frequency Range: 400 Hz to 8 kHz
  - Treble Frequency Range: 1 kHz to 20 kHz
  - Gain Range: -15 dB to +15 dB
  - Bell/Shelf Switching: Bass and Treble bands switchable between shelving and parametric (bell); Lo Mid and Hi Mid always parametric
  - Bypass: True hardware relay bypass via IN switch; auto-engages on power-down
  - Input Stage CMRR: -70 dB @ 1 kHz
  - Noise Floor: -97 dBu at unity gain (22 Hz to 22 kHz)
