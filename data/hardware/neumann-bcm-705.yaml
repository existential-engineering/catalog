details: |-
  A Dynamic Broadcast Microphone with Neumann Precision

  The BCM 705 is a cost-effective microphone for broadcast and podcast applications. Its entire construction is functionally optimized to convey emotion with technical perfection. Its dynamic capsule is voiced for a smooth yet clear sound with excellent speech intelligibility. The hypercardioid pattern along with the internal shock mount and pop filter minimize extraneous noises.

  Features:
  - Functionally optimized design
  - Specially designed dynamic capsule
  - Optimized for close speech
  - Hypercardioid pattern
  - Integrated pop screen and shock mount
  - Headgrille twists off easily for quick cleaning
specs: |-
  - Acoustical operating principle: Pressure gradient transducer
  - Directional Pattern: Hypercardioid
  - Frequency Range: 20 Hz ... 20 kHz
  - Sensitivity at 1 kHz into 1 kohm: 1.7 mV/Pa = –55.4 dB ± 1 dB
  - Rated Impedance: 200 ohms
  - Rated load impedance: 10 kohms
  - Equivalent noise level, CCIR: 32 dB
  - Equivalent noise level, A-weighted: 18 dB-A
  - Signal-to-noise ratio, CCIR (re. 94 dB SPL): 62 dB
  - Signal-to-noise ratio, A-weighted (re. 94 dB SPL): 76 dB
  - Weight: 500 g
  - Diameter: 64 mm
  - Length: 85 mm
  - Height: 110 mm (without suspension)
