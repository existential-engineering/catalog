id: iNOocZUqfku-RCaFHN6Zh
name: Infinity 500 Combo 112
manufacturer: darkglass-electronics
primaryCategory: bass-amplifier
url: https://www.darkglass.com/products/infinity-500-combo-112
description: The Darkglass Infinity 1x12 combo amp is a bass amplifier that
  redefines tonal possibilities with digital drive voices, sub octave,
  compression, and graphic EQ.
details: |-
  The Darkglass Infinity 500 Combo 112 is a 500W 1x12 digital bass combo amplifier. It carries the Darkglass VMT, B3K, and Alpha Omega drive voices, a sub-octave effect with filter and blend, a compressor with adjustable position (pre or post drive), and a graphic EQ tuned for bass frequencies. The back panel provides Pre and Post XLR DI outputs with ground lift, a Line In and Line Out, an effects loop (Send and Return), a MIDI In, a USB-C port, and an external speaker jack.
specs: |-
  - 500W 1x12 digital combo amplifier
  - Darkglass VMT, B3K, and Alpha Omega drive voices
  - Sub octave with filter and blend
  - Compressor with adjustable position (pre/post drive)
  - Graphic EQ tuned for bass frequencies
  - Pre and Post XLR DI outputs with ground lift
  - Line In, Line Out, effects loop (Send/Return)
  - MIDI In and USB-C
