description: The X/F (Proto 6) is a unique modulation pedal that applies chorus
  to high frequencies and phaser to low frequencies simultaneously, with an
  adjustable crossover point between them. Both effects run in parallel and mix
  out of phase for a distinctive, frequency-dependent modulation character.
details: |-
  The X/F applies chorus to high frequencies and phaser to low frequencies simultaneously, with the crossover point adjustable via the X/F knob. Both modulation effects mix out of phase in a parallel configuration, creating a distinctive frequency-dependent modulation character.

  Controls: RATE (controls rate of both modulation types simultaneously), MIX (wet-dry blend, 0-100%), DEPTH (modulation intensity), X/F (crossover frequency between chorus and phaser). Power accepts 9-18V DC center-negative, minimum 64mA. Backed by a 3-year warranty.
