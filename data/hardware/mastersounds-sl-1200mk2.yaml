details: |-
  The MasterSounds SL is a modified and upgraded Technics SL turntable, hand-built to high specifications by our founder Ryan Shaw, including a total chassis overhaul, newly upgraded tonearm, cartridge, and tonearm mount, proudly bearing the MasterSounds logo. It's our tribute to the iconic Technics design. Built with Skill, Care, and Attention to Detail.
specs: |-
  - Cartridge: The Audio-Technica XP7 strikes the perfect balance between high fidelity and DJ performance. With a club-ready tracking force (2-4g) and a powerful 6.0 mV output, it's the ideal match for the MasterSounds SL.
  - Armboard: Our custom-machined solid aluminium MasterSounds armboard is designed specifically to house our rewired Rega RB-330 tonearm.
  - Tonearm: Expertly upgraded by Audio Origami, our rewired RB-330 tonearm features premium Cardas wiring, high-quality OFC external cables, and durable Rean RCA connectors for unmatched sound and durability.
  - Chassis: All MasterSounds SLs are built upon a refinished chassis, which is carefully stripped and repainted in our own trademark Grey, Black and Silver finishes, built to match our range of DJ Mixers and Audio Accessories. It is then screenprinted with MasterSounds logo detail.
  - Shipping: We ship all of our MasterSounds SLs in our sturdy double-walled SL Boxes, which are designed for secure international shipping.
