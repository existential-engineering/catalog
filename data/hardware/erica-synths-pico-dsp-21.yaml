description: 8x custom effects in 3hp.
details: |-
  Pico DSP is a smaller sibling of Erica Synths' Black Hole DSP module. It features 8 custom effects with two adjustable parameters each and CV control over the first parameter.

  All 8 effects are stereo, and a dry/wet control sets the balance against the incoming signal. Effect selection is colour coded on the panel, so the active algorithm is readable at a glance on a panel this narrow.

  The module is part of the Pico Series, Erica Synths' effort to fit substantial functionality into an affordable 3HP panel. It is 3HP wide and 35mm deep, takes input up to 10Vptp without clipping, and sweeps a parameter fully across a CV range of -5V to +5V.
specs: |-
  - 8 great sounding stereo custom effects
  - 2 adjustable parameters per effect
  - CV control over the first parameter
  - Dry/Wet control
  - Stereo output
  - Colour coded effects selection
  - Input signal amplitude (without clipping) 10Vptp
  - CV amplitude for full parameter sweep -5V to +5V
  - Power consumption +83mA, -20mA
  - Module width 3HP
  - Module depth 35mm
