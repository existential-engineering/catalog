details: |-
  The Pro-Mod San Dimas Style 1 HH FR M is a high-performance double-cutaway electric guitar pairing an alder body with a bolt-on maple speed neck featuring graphite reinforcement, an oiled finish, and rolled fingerboard edges for fast, fatigue-free playing.

  The 12"-16" compound radius maple fingerboard is fitted with 22 jumbo frets and black dot inlays, accommodating both rhythm chording at the nut and effortless string bends in the upper register.

  Electronics include a custom Seymour Duncan Full Shred SH-10B humbucker in the bridge and a custom Seymour Duncan Alnico II Pro APH-1N humbucker in the neck, controlled by a single volume with push/pull coil split, a no-load tone control, and a 3-position blade switch for versatile tonal options.

  Hardware is anchored by a recessed Floyd Rose 1000 Series double-locking tremolo with brass block and matching locking nut, Charvel-branded die-cast tuning machines, and a chrome finish throughout. The Chameleon flip-flop body finish shifts hues with viewing angle for a striking visual signature.
specs: |-
  - Body: Alder, San Dimas Style 1 shape, satin finish
  - Color: Chameleon
  - Neck: Bolt-on maple with graphite reinforcement, oiled finish, speed neck shape with rolled fingerboard edges
  - Scale Length: 25.5" (648 mm)
  - Fingerboard: Maple, 12"-16" compound radius, black dot inlays
  - Frets: 22 jumbo
  - Nut: Floyd Rose 1000 Series locking, 1.6875" (42.86 mm) width
  - Bridge pickup: Custom Seymour Duncan Full Shred SH-10B (parchment)
  - Neck pickup: Custom Seymour Duncan Alnico II Pro APH-1N (parchment)
  - Controls: Volume (push/pull coil split), no-load tone
  - Switching: 3-position blade
  - Bridge: Floyd Rose 1000 Series double-locking tremolo (recessed) with brass block
  - Tuners: Charvel-branded die-cast
  - Hardware finish: Chrome
  - Control knobs: Knurled flat-top
  - Switch tip: Parchment
  - Headstock: Licensed Fender Stratocaster
  - Neck plate: 4-bolt serialized
  - Strings: Nickel-plated steel (.009-.042)
  - Orientation: Right-hand
  - Jack: Side-mounted
  - Model Number: 2975031500
