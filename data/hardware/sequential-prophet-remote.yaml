description: >-
  The Prophet Remote is a 49-note strap-on keyboard controller designed by
  Sequential Circuits as a remote performance accessory for the Prophet 5
  synthesizer. It connects via a proprietary 20-foot cable and features mini
  mod-wheel controllers for pitch bending and modulation, allowing keyboardists
  to move freely on stage. While not commercially successful, it remains a rare
  collector's item among vintage synthesizer enthusiasts.
details: |-
  The Prophet Remote represents an attempt by Sequential Circuits to extend the performance capabilities of their flagship Prophet 5 synthesizer. Rather than creating a standalone instrument, Sequential designed this as a strap-on controller that would allow keyboardists to step away from their main synth during performances, similar to how guitarists could move about the stage with their instruments.

  The remote features hand-grip-mounted mini mod-wheel controllers enabling real-time pitch bending, LFO modulation adjustments, and auxiliary controls. Program and bank selection buttons allow performers to load different patches directly from the remote, providing access to the Prophet 5's sound library without returning to the main unit.

  The device was not commercially successful during the early 1980s, and modern MIDI controllers have rendered it largely obsolete. However, among vintage analog enthusiasts and Prophet 5 collectors, the Prophet Remote maintains value as a historically interesting accessory. Its rarity and unconventional design make it an appealing piece for those documenting the evolution of synthesizer performance peripherals. Notably, Geoff Downes of the band Asia has been documented using this device.
specs: |-
  - Type: Keyboard Controller
  - Keys: 49
  - Connection: Proprietary cable to Prophet 5
  - Cable Length: 20 feet
  - Controls: Mini mod-wheels for pitch bend and modulation
  - Program Selection: Bank and program buttons
  - Polyphony: None (controller only)
  - Sound Generation: None (controller only)
