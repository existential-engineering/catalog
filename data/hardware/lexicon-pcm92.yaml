description: Single rack-space stereo reverb and effects processor with 28
  reverb, delay, and modulation algorithms and over 1,200 factory presets,
  building on the legacy of the PCM81, PCM91, and PCM96.
specs: |-
  - Single rack-space (1U) stereo reverb and effects processor
  - 28 mono and stereo reverb, delay, and modulation algorithms
  - Over 1,200 factory presets
  - Sample rates: 44.1 kHz to 96 kHz
  - 32-bit floating point internal processing
  - Hall, Concert Hall, Random Hall, Chamber, Plate, and Room reverb algorithms
  - Multimode filters in the reverb signal path
  - 'Infinite' reverb switch for continuous reverb tail
  - Multi-voice pitch shift
  - Four virtual machines for flexible signal routing
  - High-resolution OLED front-panel display
  - Balanced analog XLR and 1/4" stereo I/O
  - AES/EBU stereo digital I/O on XLR
  - External BNC word clock input
  - Ethernet connectivity for HiQnet System Architect remote control
  - MIDI In and Out (5-pin DIN)
  - Footswitch and foot pedal control inputs
