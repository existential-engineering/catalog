description: A passive 2hp Eurorack waveshaper that folds and bends waveforms
  into new shapes, and can also function as a passive VCA when connected in
  reverse.
details: |-
  Choppy waves. Calm waves. Square waves? Listen, there's a reason why if you go out to the sea that the waves out there aren't square, okay? Nature doesn't like to expend energy like that. Nature prefers the path of least resistance. Nice, round sine waves. But not you! You like to expend energy on making cool wave shapes, don't you? Well, I have good news for you - while energy credits are not yet an option, you can expend money to get cool wave shapes right here, thanks to the modestly sized High Sea passive waveshaper. It also works like a passive VCA, sort of, if you connect it in reverse. It's very temperamental, and likes some audio and CV sources more than others. Your results may vary - or surprise you. It's first and foremost a fun little waveshaper, the other part is more of a cute oddity the same way that a benign but conspicuous growth on your arm can be a good conversation starter at a party. Waveshapers are cool. You're cool. It makes sense that you should own a waveshaper from that point of view. I don't need to make any further arguments in favor of you buying this, I can tell you're already convinced, because you have good taste and excellent decision-making behavior which has predisposed you to liking this product. There's a lot of science to support this, but I don't have it with me right now, I can e-mail it to you later. This design is made with inspiration from HAGIWO. You should send him an e-mail saying thank you, HAGIWO. It's not required but it would be really nice of you.
specs: |-
  - Fold and bend wave forms into new, exciting shapes
  - Create delicious harmonics where there previously were none
  - Connect it in reverse to unleash it's powers as a VCA (terms and conditions apply)
  - Passive design: draws no power from your case
