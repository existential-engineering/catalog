description: A 16 way bi-directional converter between MIDI and GPI, with 16 GPI
  inputs and 16 GPI outputs on four 9 pin D connectors, working in notes,
  controllers or program changes.
details: |-
  A bi-directional converter between MIDI and GPI (general purpose interface). It carries 16 GPI inputs and 16 GPI outputs on four 9 pin D connectors, with D sockets for the inputs and D plugs for the outputs, and can both receive and send MIDI as notes, controllers (CCs) or program changes depending on the mode in use.

  Each block of eight inputs and outputs is given a starting MIDI note number, with the rest following on consecutive numbers; the first block defaults to 36 to 43 and the second to 44 to 51. MIDI channels are set independently for inputs and outputs, defaulting to channel 1 for transmit and channel 2 for receive, and the switch debounce value covers all inputs over a range of 1 to 100 milliseconds with a 10ms default.

  The inputs have internal pull-ups, so shorting an input to ground sends the appropriate MIDI on message and releasing it sends a MIDI off message unless that has been disabled. On an input socket pins 1 to 8 are the inputs and pin 9 is the common ground.

  The GPI outputs can be pulsed, which is the default, or held under the control of on and off messages. They are floating and each can switch up to 50 volts at 100mA of resistive load, with pins 1 to 8 as the output pins and pin 9 as the common connection, which can sit positive or negative relative to them.

  Two MIDI output sockets carry identical information, and MIDI arriving at the MIDI input is merged with the data generated by the switch inputs before reaching them. Parameters are edited with push buttons alongside a three digit seven segment LED display, settings are held in non-volatile memory, and edit mode has to be enabled with a recessed push button so that settings cannot be changed by accident. Power comes from an included 9V multi-region switch mode supply on a locking plug, with four interchangeable heads covering the UK, Europe, the USA, Canada, Japan, Australia and New Zealand.
specs: |-
  - 16 GPI inputs, 8 on each of 2 x 9 pin D sockets, pin 9 common ground
  - 16 GPI outputs, 8 on each of 2 x 9 pin D plugs, pin 9 common
  - GPI outputs are floating and switch up to 50V at 100mA resistive load
  - GPI outputs can be pulsed (default) or held with on and off messages
  - Modes: MIDI notes, controllers (CCs) or program changes
  - MIDI In, Out 1 and Out 2, with both outputs carrying the same data
  - Incoming MIDI is merged with the switch input data at the MIDI outputs
  - Independent MIDI channels for input and output, default transmit 1 and receive 2
  - Default note range: 36 to 43 for the first block, 44 to 51 for the second
  - Switch debounce 1 to 100 milliseconds, default 10ms
  - Inputs have internal pull-ups and are triggered by shorting to ground
  - Display: 3 x 7 segment LED
  - Power: 9V DC, 200mA max, 2.1mm locking connector, supply included
  - Power supply: 9V multi-region switch mode with locking connector and 4 interchangeable heads
  - Dimensions: 190 x 110 x 46 mm including feet
  - Weight: 800g including power supply
  - Settings stored in non-volatile memory
  - Edit mode enabled by a recessed push button
