description: >-
  A 6-voice polyphonic analog synthesizer from Yamaha's acclaimed CS series, featuring 12 VCOs,
  independent filter envelopes per voice, and a built-in 4-track sequencer.
details: |-
  The CS-70m represents Yamaha's commitment to professional-grade polyphonic analog synthesis in the early 1980s. Part of the esteemed CS series, it delivers substantial sonic depth through its architecture of two oscillators per voice across six voices, enabling complex harmonic interactions and rich timbral possibilities.

  Each voice benefits from its own independent filter envelope, a level of sophistication not found in simpler designs. The dual 12dB voltage-controlled filters per voice, paired with dedicated VCAs, allow for nuanced dynamic control. Two LFOs — one of which is programmable — provide flexible modulation options for vibrato, filter sweeps, and other effects.

  The 61-key keyboard features aftertouch sensitivity for expressive performance. While the 30 onboard preset sounds are considered basic starting points, the CS-70m rewards hands-on sound design through its array of knobs and buttons. External magnetic card memory enables sound preservation and recall, a practical feature for its era.

  Notable users include Kajagoogoo, and the instrument was frequently sought after for emulating the signature sounds of progressive electronic acts like Jean-Michel Jarre and Tangerine Dream. Its size makes it primarily a studio instrument, but dedicated synthesists consider it well worth the space.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 12 VCO (2 per voice)
  - LFO: 2 (1 programmable)
  - Filters: 12 VCF (2 per voice, 12dB each)
  - VCA: 12 (2 per voice)
  - Keyboard: 61 keys with aftertouch
  - Memory: 30 voice presets
  - Sequencer: 4-track polyphonic
  - Storage: External magnetic card memory
releaseDate: "1981"
