description: >-
  The Novation XioSynth is a versatile digital synthesizer from 2007 that
  combines analog-modeled sound generation with a built-in USB audio interface
  and fully assignable MIDI controller in a compact 25 or 49-key format.
details: |-
  Released in 2007 in both 25 and 49-key versions, the Novation XioSynth is
  far more than a scaled-down X-Station. It matches its predecessor's power
  while adding several distinctive features that give it a character of its own.

  The synth engine offers three analog-modeled oscillators with a wide range of
  waveforms including sine, square, triangle, sawtooth, noise variants, and
  wavetables. A switchable 12/24dB filter with low-pass, high-pass, and
  band-pass modes includes a filter overdrive feature for adding gritty
  overtones, something not found on the X-Station.

  The X-Gator is one of the XioSynth's standout features, providing a 16-32
  step rhythmic gate programmer that syncs to MIDI clock for creating complex
  pulsing patterns. Combined with two LFOs offering 32 waveforms each, a
  latchable multi-octave arpeggiator, and the expressive X-Pad touchpad
  controller, the XioSynth offers deep sound-shaping capabilities.

  Beyond synthesis, the unit doubles as a USB audio interface with XLR and
  quarter-inch TRS inputs, plus a fully assignable MIDI controller with 16
  templates. This triple-duty functionality makes it an efficient hub for
  compact production setups.
specs: |-
  - Polyphony: 10 voices
  - Oscillators: 3 analog-modeled
  - Waveforms: Sine, square, triangle, sawtooth, noise, wavetables
  - Filter: 12/24dB (LP, HP, BP) with overdrive
  - LFO: 2 (32 waveforms each)
  - Envelope: 1 ADSR
  - Effects: Delay, reverb, chorus, distortion, 3-band EQ, stereo panning
  - Arpeggiator: Multi-octave, 32+ patterns, latchable
  - Sequencer: X-Gator (32-step rhythmic gate programmer)
  - Keyboard: 25 or 49 velocity-sensitive semi-weighted keys
  - Memory: 200 user patches, 16 MIDI controller templates
  - I/O: Stereo out, headphone out, XLR in, 1/4" TRS in
  - Control: MIDI Out, USB
