details: |-
  The JHS Pedals Emperor is an analog bucket brigade chorus and vibrato pedal. The product page body was empty at the time of extraction, but the image filename (JHS-Pedals-Emperor-Chorus-top.jpg) confirms it is a chorus pedal. Based on the Emperor 500 description (which is the 500-series version of the same circuit), the Emperor pedal is built on the 1980s Arion SCH-1 chorus topology using a 3207 bucket brigade chip, offering chorus and vibrato modes with waveform selection.
