description: Transportable 2x12" extension cabinet designed as a compact,
  powerful companion to Marshall combos and small heads. Loaded with two 12"
  Celestion G12T-75 speakers, the 1922 handles 150W in mono operation (75W per
  side in stereo) and offers mono/stereo switching at the back panel — 8Ω in
  mono, 16Ω per side in stereo via two 1/4" speaker inputs. The closed-back
  cabinet adds low-end weight and stage projection to combos while staying small
  enough for club and large-venue use.
details: |-
  The perfect extension cabinet for 2x12" combos, and compact enough for life on the move.

  Don't be fooled by its smaller size, it delivers the boost you need for larger venues thanks to the two Celestion G12T-75 speakers and 150W of power.

  The cabinet is built in Marshall's UK factory and can be configured in mono or stereo, and it is designed to cope with high-gain amps.

  Designed and engineered in UK. Made in UK.
specs: |-
