  - Power handling: 150W mono, 75W stereo
  - Unit impedance: 8 ohm mono, 16 ohm stereo
  - Inputs: 2
  - Passive cabinet: no mains connection, driven by the amplifier feeding it
  - Weight: 19 kg / 42 lb
