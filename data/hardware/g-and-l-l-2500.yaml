details: |-
  When Leo Fender launched the G&L L•200 bass in 1980, it was clear he was ready to make history all over again. Never before had such a wide range of tones come from a single bass, and today the L•2500 packs all the features of the latest L•2000 into a 5-string.

  Like its L•2000 brother, the foundation of the L•2500 is a pair of G&L Magnetic Field Design humbuckers backed by the flexible Tri-Tone control system, providing the sort of versatility that lets a player find their tone no matter what kind of bass line they are laying down. The Tri-Tone system features a trio of mini toggles for pickup selection, series/parallel signal routing and active/passive operation, as well as a trio of knobs for volume, treble and bass. With all that under the hood, the L•2500 brings the kind of chops that fit any situation, from classic R&B to power-packed rock to poppin' funk. What's more, the L•2500 features an innovative Leo Fender-designed Saddle-Lock bridge to transfer string energy right into the body end-grain for an incredibly resonant instrument.

  The Tribute Series L•2500 delivers the magic of Leo's revolutionary design at a price attainable for every working musician.
specs: |-
  - Construction: bolt-on
  - Scale: 34"
  - Pickups: Two Leo Fender-designed G&L MFD humbucking pickups
  - Body wood: Swamp Ash Top over Poplar & Poplar
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck width at nut: 1 3/4"
  - Neck radius: 12"
  - Neck profile: medium C
  - Frets: 21 medium jumbo, nickel
  - Tuning keys: Traditional open-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock
  - Electronics: Tri-Tone system with 3-position pickup selector, series/parallel switch, 3-position pre-amp mode switch, volume, treble, bass
  - Power: battery-powered, 9V
  - Available in: Tobacco Sunburst over Swamp Ash Top on Poplar, Rosewood fingerboard
  - Available in: Black Frost over Poplar, Maple fingerboard
