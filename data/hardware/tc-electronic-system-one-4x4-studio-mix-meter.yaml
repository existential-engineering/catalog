details: |-
  The TC Electronic SYSTEM ONE 4X4 STUDIO (MIX METER) is a professional metering and analysis system for studio mixing engineers. Provides real-time metering, loudness measurement, and audio analysis for up to 4-input/4-output studio mix workflows. Engineered to ITU/EBU loudness standards for broadcast-grade metering compliance. The kind of metering reference engineers use to mix to translatable standards across consumer, broadcast, and streaming destinations. For studio engineers who treat metering as critical to mix translation, not as decoration.
