description: >-
  A six-voice analog polysynth that became one of the most widely used
  synthesizers in music history, prized for its lush chorus-enhanced pads,
  intuitive single-knob-per-function layout, and reliable DCO-based tuning.
details: |-
  Released in 1984 as the successor to the Juno-60, the Juno-106 quickly became one of Roland's best-selling instruments and arguably the most accessible analog polysynth of its generation. Its addition of full MIDI implementation and expanded 128-patch memory made it an immediate upgrade over its predecessor, while retaining the core sonic character that made the Juno line popular in the first place.

  Each of the six voices is built around a single digitally controlled oscillator offering pulse, sawtooth, and square waveforms. While a single oscillator per voice might seem limited on paper, the Juno-106's built-in stereo chorus effect transforms those raw tones into wide, shimmering textures that have become synonymous with the instrument. The chorus is so integral to the Juno sound that many producers consider it inseparable from the synthesizer's identity.

  The filter section pairs a non-resonant highpass with a resonant 24dB-per-octave lowpass, derived from Roland's earlier SH-series monosynths. This filter is smooth and musical across its full range, excelling at everything from subtle warmth to screaming self-oscillation. The straightforward front panel layout puts every parameter within reach without menu diving, making the Juno-106 one of the fastest synths to program.

  Its tonal sweet spots span lush evolving pads, punchy bass lines, and expressive filter sweeps that sit beautifully in a mix without overwhelming other elements. The stable DCO tuning means it stays in pitch where vintage VCO instruments might drift, making it practical for studio and stage alike.

  The Juno-106 has appeared on countless recordings across house, techno, synthpop, and ambient genres. Artists including Fatboy Slim, Moby, Underworld, the Chemical Brothers, and Depeche Mode have all featured it prominently. Its enduring popularity has made it one of the most sampled and emulated analog synthesizers in existence.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 1 DCO per voice (pulse, sawtooth, square waveforms)
  - LFO: 1 with rate and delay controls
  - Filter: Non-resonant highpass, resonant 24dB/oct lowpass
  - VCA: ADSR envelope with level and gate modes
  - Effects: Built-in stereo chorus (2 modes)
  - Memory: 128 patches
  - Keyboard: 61 keys
  - Connectivity: MIDI In/Out/Thru
  - Produced: 1984
