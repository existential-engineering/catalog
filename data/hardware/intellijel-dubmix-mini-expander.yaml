  - discontinued
url: https://intellijel.com/shop/legacy/dubmix-mini-expander/
description: Connects via a single ribbon cable to Dubmix. Adds voltage control
  over the levels of the 4 channel inputs, plus direct outs and a stereo return.
details: |-
  The Dubmix Mini Expander adds CV control over the input levels of the main Dubmix unit, as well as providing direct post-fader outputs and an additional pair of inputs directly into the main mixer bus.

  MASTER INPUT L and R are audio inputs that sum directly into the Dubmix's L and R busses. DIRECT OUTPUTS 1-4 provide a direct post-fader output of each of the Dubmix's four channels. LEVEL 1-4 are CV inputs providing voltage control over each channel's level fader, summed with the position of that channel's IN knob on the main Dubmix.

  The Mini Expander connects to the main Dubmix via a single ribbon cable and requires a Dubmix to function; it can be used at the same time as the Dubmix Aux Expander.
specs: |-
  - Adds CV control over the input levels of the main Dubmix's 4 channels
  - Provides 4 direct post-fader outputs (one per channel)
  - Adds a stereo return pair summed directly into the L/R mixer busses
  - Connects to the main Dubmix via a single ribbon cable; usable simultaneously with the Aux Expander
  - Requires Dubmix module
