description: The Little Secret is an ultra-compact Marshall Plexi preamp
  emulator that distills the core sound of the Catalinbread Dirty Little Secret.
  It features two mu-amp gain stages delivering British-style classic rock tones
  in the smallest possible package, with tube-like compression response and
  responsive dynamics.
details: |-
  The Little Secret is the smallest Marshall emulator in Catalinbread's lineup, distilling the core character of their Dirty Little Secret into an ultra-compact form factor. Two mu-amp gain stages reproduce the preamp character of a Marshall Plexi.

  The Master control sets output volume, while the Pre-Amp control adjusts first-stage gain, controlling the compression and tube-like growl of the circuit. Works standalone or stacks effectively with other gain pedals. Accepts 9-18V DC center-negative power with extremely low current draw. Backed by a 3-year warranty.
