description: >-
  The ARP Explorer I is a programmable preset analog synthesizer from the mid-1970s that
  bridges preset and manual sound design, offering flexible synthesis capabilities in a
  compact format.
details: |-
  The Explorer represents an important transitional instrument in ARP's synthesizer lineup, introduced between 1974-1978. It combines preset sounds with manual synthesis control, distinguishing it from purely preset-based synths of the era. The instrument features three main sections for comprehensive sound design.

  The waveform section allows users to mix and match various waveforms across different pitch ranges, enabling creation of unique timbres beyond the factory presets. The filter and envelope section provides a 4-pole low-pass filter with resonance control alongside standard ADSR envelope shaping. Additional sound-shaping tools include vibrato, pitch bend, portamento, and repeat effects for expressive playing.

  The Explorer's significance lies in its democratization of synthesis—it made complex sound design accessible to musicians who couldn't afford larger modular systems. Its compact 37-key keyboard and manageable control set appealed to performers seeking both immediate preset access and creative sonic flexibility. Notable users included Philip Glass and Herbie Hancock.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO with sawtooth, square, narrow pulse, modulated-width pulse waveforms, and pink noise
  - LFO: 1 with adjustable speed, depth, and delay controls
  - Filter: 4-pole (24dB/octave) low-pass with cutoff and resonance
  - Envelope: 1 ADSR envelope (VCA)
  - Keyboard: 37 keys
  - Effects: Repeat, delayed vibrato, pitch bend, bender, portamento
  - Date Produced: 1974-1978
