details: |-
  The SE Custom 24-08 Quilt brings expanded guitar tones to players in a classic package complete with a quilted maple veneer. The Custom 24-08 Quilt keeps all the foundational specs of the original Custom 24 while taking the Custom platform to new sonic territories. Like the Core Series instrument, the SE Custom 24-08 features two mini-toggle coil-tap switches that individually tap the humbuckers for single coils sounds and a total of eight pickup configurations.

  Classic design elements include a maple top, mahogany back, ebony fretboard, 24 frets, 25” scale length, bird inlays, dual humbuckers, signature headstock logo, and PRS patented tremolo.
