description: Faithful reissue of the classic Marshall Guv'nor
  overdrive/distortion pedal, hand-built in Marshall's UK factory in Bletchley.
  Delivers a smooth overdriven texture delicately complemented by a touch of
  compression, with a four-band EQ (gain, bass, middle, treble) plus master
  level for fine-grained voicing. Housed in a steel chassis, the pedal fits a
  wide range of playing styles — from soft, driven tones to volume-boosting
  overdrive — and runs on a 9V battery or external 9V DC adapter.
details: |-
  Released in 1988, The Guv'nor set the bar for future generations of distortion pedals. This reissue faithfully recreates the classic sound of The Guv'nor, providing a smooth overdriven sound with a touch of compression. The pedal is housed in a casing that is accurately modelled on the original, from the unique shape right down to the individually coloured control knobs. All that's missing are the stories collected over 30+ years of use, but that's where you come in.

  Built in Marshall's UK factory: every element of this reissue pedal, from its internal components to its exterior construction, is designed and built in Marshall's Bletchley factory. Embodying Marshall's legacy of quality craftsmanship, this pedal is made to stand the test of time and more than handle the challenges of the stage.

  Inspired by the original: in this faithful reissue, this pedal reproduces the timeless sonic character of The Guv'nor, offering a recreation of its classic sound. A sonic landscape characterised by a smooth overdriven texture, delicately complemented by a touch of compression, delivering a finely tuned overdrive.

  Unmistakable sound: this reissue pedal fits a wide range of playing styles. It can do everything from soft, driven tones to boosting the volume for an overdriven sound.

  Designed and engineered in UK. Made in UK.
