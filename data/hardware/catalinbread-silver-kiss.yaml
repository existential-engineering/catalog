description: The Silver Kiss is a three-in-one effects pedal offering clean
  boost, medium-gain overdrive, and a powerful three-band active EQ. Its op-amp
  drive engine uses gentle clipping to bring out harmonics, and dialing back the
  gain removes crunch entirely for a transparent boost. Setting each EQ band to
  noon removes it from the circuit for full flexibility.
details: |-
  The Silver Kiss combines a clean boost, medium-gain overdrive, and active three-band EQ in a single pedal. Its front end uses a tastefully-voiced op-amp drive engine with gentle clipping to bring out harmonics. Dialing back the gain removes crunch entirely for a transparent boost.

  The active EQ section offers significant boost across all three bands with strong interactivity. Setting each EQ band to noon removes it from the circuit entirely, making the pedal fully passive through the EQ stage in that configuration.
specs: |-
  - Power supply: 9-18V DC, center-negative
  - Active three-band EQ (treble and bass shelving, low-Q midrange); each band is out of circuit at noon
