details: |-
  The S2 Vela Semi-Hollow is a vintage-inspired guitar with loads of personality and tonal textures. Its offset body shape is at once elegant and distinctive, and the all-mahogany design delivers warm, organic tone. The addition of semi-hollow construction and f-hole gives the Vela added resonance.

  The pickguard-loaded electronics feature a PRS DS-01 pickup in the treble pickup position, providing a bright, chimey tone, and the PRS Narrowfield in the bass pickup position gives the Vela some noteworthy bite. The coil-tap on the tone control allows the treble pickup to split to single coils, providing even more tonal versatility.

  Anchoring this guitar is the PRS plate-style bridge with two saddles that were designed to compensate for intonation. This bridge harkens back to Paul’s early designs and traditional bass plate-style bridges, but is top-loading for easy restringing. Like the bridge found on Paul’s Guitar and some Private Stock models, PRS’s plate-style bridge features brass saddles and a steel plate for maximum tonal sustain.
