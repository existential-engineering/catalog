description: A complete standalone console package with either 32 or 48 channels
  of analogue inputs
details: |-
  With the Soundcraft Vi Series now firmly established as a firm favourite digital desk on both the touring, broadcast and installed sound scenes, Soundcraft have taken this amazing platform to another, more affordable level with the release of the new Vi1 console.

  Many users have asked for a smaller, lower-priced desk that still has the acclaimed VistonicsTM user interface, and of course the now-legendary optimal sound quality established with the Vi Series.

  So here it is, the Soundcraft Vi1.

  A complete standalone console package with 32 channels of analogue input to 27 analogue outputs, plus 6 digital inputs, 4 Stereo FX Returns and 6 digital outputs in one chassis. As standard, Input to mix capacity is 46chs, but by adding a stagebox (compatible with the existing Vi racks), simultaneous channel count increases to 64. Channels are routable to 24 multifunction busses, plus LR and Mono Mix busses.

  Up to 8 of the busses can be configured as Matrix mixes, each with up to 16 sources.
specs: |-
  - Frequency Response - Local Mic input to Line output: +0/-1dB, 20Hz-20kHz
  - AES/EBU In to AES/EBU Out: +0/-0.2dB, 20Hz-20kHz
  - THD+Noise: 22Hz-22kHz
  - THD & Noise - Local Mic In (min gain) to Local Line Out: <0.003% @ 1kHz
  - THD & Noise - Local Mic In (max gain) to Local Line Out: <0.020% @ 1kHz
  - Mic Input E.I.N: <-125dBu (150Ω source), 22Hz-22kHz bandwidth, unweighted
  - Residual Noise: -95dBu - Local line output; no inputs routed, Mix fader @0dB
  - CMRR: 80dB @ 1kHz Local Mic Input
  - Sampling Frequency: 48kHz
  - Latency - Local Mic Input to Local Line output: < 2ms @48kHz
  - AES/EBU Input Sample Rate: 32–108kHz (with SRC enabled)
  - DSP Resolution: 40-bit floating point
  - Internal Clock Accuracy: < +/- 50ppm
  - Internal Clock Jitter: < +/- 5ns
  - External Sync: BNC Wordclock
  - Input & Output Levels - Mic Inputs: +23dBu max
  - Input & Output Levels - Line Outputs: +22dBu max
  - Input & Output Levels - Nominal Operating Level: 0dBu (-18dBFS)
  - Input & Output Impedances - Mic Inputs: 2k7Ω
  - Input & Output Impedances - All other analogue Inputs: >10kΩ
  - Input & Output Impedances - Line Outputs: <75Ω
  - Input & Output Impedances - AES/EBU Outputs: 110Ω
  - Oscillator: 20Hz to 20kHz/Pink/White Noise, variable level
  - Channel HP filter: 20Hz-600Hz, 18dB per octave
  - Channel LP filter: 1kHz-20kHz, 18dB per octave
  - EQ (Inputs and Bus Outputs) - HF: 20Hz-20kHz, +/-18dB, Q= 0.3-8.7 or shelving
  - EQ (Inputs and Bus Outputs) - Hi-Mid: 20Hz-20kHz, +/-18dB, Q=0.3-8.7
  - EQ (Inputs and Bus Outputs) - Lo-Mid: 20Hz-20kHz, +/-18dB, Q=0.3-8.7
  - EQ (Inputs and Bus Outputs) - LF: 20Hz-20kHz, +/-18dB, Q= 0.3-8.7 or shelving
  - Metering: Internal 11-segment LED bargraphs plus 4-segment gain reduction meters for all inputs and Outputs. Peak hold variable from 0-2s.
  - Mains Voltage Operating Range: 90-264V, 47-63Hz, autoranging
  - Mains Power Consumption: Control Surface - 100W
  - Internal Mass Storage: 4GB Compact Flash Card
  - Operating Temperature: 0°C – 45°C (32°F – 113°F)
  - Relative Humidity: 0% – 90%, non-condensing Ta=40°C (104°F)
  - Storage Temperature: -20°C – 60°C (-4°F – 140°F)
  - Height: 394mm (15.5")
  - Width: 1034mm (40.7")
  - Depth: 711mm (28.0")
  - Weight: 37kg* (82lb)
