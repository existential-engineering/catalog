description: >-
  An 8-way bidirectional voltage-controlled switch with three control modes —
  address, strobe, and step — for flexible audio or CV signal routing in a
  Eurorack system. It can route one input to any of eight outputs, or select one
  of eight inputs to a single output, with switching speeds up to audio rate.
details: |-
  The BOSS BOW TWO (ALM027) is an 8-way bidirectional voltage-controlled switch designed to provide maximum flexibility in signal routing within a Eurorack modular system. It can operate in two fundamental configurations: one input fanned out to one of eight outputs, or one of eight inputs selected to a single output — all under voltage control.

  Three distinct control modes govern how routing is determined. In address mode, the active position is set directly by the offset knob or an external CV, enabling immediate manual or automated routing. Step mode advances the selected position sequentially with each incoming clock pulse, turning the module into a sequential switch or scanner. Strobe mode combines both approaches, holding the addressed position until the next clock pulse arrives.

  Additional features include an attenuverter and offset for precise CV scaling, a reset input that doubles as a master on/off switch in step mode, and fast switching speeds capable of reaching audio rates. The module is manufactured in England at 38mm depth for skiff compatibility.
specs: |-
  - Format: Eurorack
  - Width: 8HP
  - Depth: 38mm
  - Power: +12V 40mA / -12V 10mA
  - Switch ways: 8 (bidirectional)
  - Control modes: Address, Strobe, Step
  - Switching speed: Up to audio rate
  - Controls: Attenuverter, Offset
  - Inputs: CV, Clock, Reset
  - Warranty: 2 years
  - Made in England
