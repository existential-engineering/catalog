description: The Chandler Limited TG1 is a recreation of the classic EMI TG12413
  Limiter used in custom EMI and Abbey Road recording and mastering consoles
  from the late 1960s. These rare pieces were never commercially available, and
  only EMI owned studios had access to them. The TG1 Limiter features an
  all-discrete circuit with transformer balanced input and output. The limiting
  element is a rarely seen diode network that produces smooth, pleasing
  distortion.
details: |-
  Two-channel (stereo/dual-mono switchable) limiter/compressor. Circuit Type: EMI TG, Transistor, Solid-state. Feature Set: Input Gain High/Low switchable, continuous Input Control, switched Output Control, selectable Compression/Limit modes, fixed Attack, 6-position switched Recovery (Release), Harmonic Distortion Mode toggle per channel, True Bypass. I/O: XLR pin 2 hot, transformer balanced, custom wound. Requires external PSU-1 power supply (purchased separately). Licensed by Abbey Road Studios and EMI. Originally used on every channel of TG consoles for The Beatles 'Abbey Road' and Pink Floyd 'Dark Side of the Moon'.
