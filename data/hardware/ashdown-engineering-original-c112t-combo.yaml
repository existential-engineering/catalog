description: A lightweight 300-watt bass combo with a single 12" speaker,
  weighing just 12.5kg (27.5lbs). A 5-band EQ gives precise tone shaping, and a
  front-facing FX loop, XLR DI output, and headphone jack cover modern needs.
  Its kickback design lets it double as a floor monitor. Scuff-proof paint and
  sturdy construction handle the road, backed by a 5-year warranty, auto-protect
  voltage for global touring, and an adaptive temperature-controlled fan.
