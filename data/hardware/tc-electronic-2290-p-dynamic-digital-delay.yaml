  Feedback Path FX Insert"
details: |-
  We carefully recreated the original 2290, but we also added modern features, improved bits and pieces and expanded selected effect parameter ranges particularly with the guitar-playing experience in mind. For example, the guitar-friendly Feedback Loop for inserting additional effects to the wet signal and the option to use sub-divisions to control the Modulation block. We also added a new dimension to the Tap-Tempo options, as the LEARN footswitch includes control per Preset (A&B), per Board (A+B) or globally. And on the MIDI control side, 2290 P digs deep and is ready to integrate with MIDI-based setups seamlessly - for example it offers four different ways to control your delay time. Last but not least, we give you full control via the 2290 P app, and you can connect an expression pedal to control any effects parameter. In fact, not just any one parameter but any three parameters simultaneously. Let’s dive in and take a closer look at what is under the hood of 2290 P!

  2290 was known for its characteristic dynamic delay, but it also offered a host of modulation effects and comprehensive panning possibilities in a stereo setup. We ported all of this to 2290 P. A key point in both cases is that you can control the delayed notes independently from the original sound. You can add modulation to the delayed notes within 2290 P, and in case you have an external pedal or effects unit that you want to use, it can be inserted in the Feedback Loop and will also only affect the delayed notes On the panning side, you get three options: Your entire signal - including the original sound - will be affected, only the delayed notes pan between the left and right channels, or only the original signal is affected.

  2290 P is very memory intensive with up to 9.999 seconds of delay time. Obviously, the maximum delay time is important, but so is the degree of control you have over each of the repeated notes. However, simply knowing that you will not "run out of time" is the first step towards getting creative with fine-tuning the repeats. In short, 2290 P is a highly inspirational tool in your guitar effects arsenal: A pedal that will give you that creative edge you need to step up and stand out.

  To meticulously control the repeated notes, you have three sections at your disposal: FEEDBACK, DELAY, and SUB.D. FEEDBACK not only allows you to set the number of repeats, but also to give them a fundamental tonal shape, as you can use high and lowcut filters to tame the frequencies between 1-20kHz and 0-800Hz respectively. This only affects the repeated notes, leaving your original signal untouched. For every feedback, the signal runs through the filter again making each repeat more and more filtered, making the fade out sound much more natural. Pair this with a slow and subtle delay modulation to mimic the sound of an analog delay. DELAY controls the delay time, which is also indicated visually by the TIME LED. But you can also activate the onboard modulation engine to add some swirly magic. Finally, in the SUB.D section you can set your delay to be a sub-division of the time you enter or tap into 2290 P.

  When you power up 2290 P for the first time, you may feel like you’re programming a trip back to the future. It has that kind of retro vibe, staying completely true to the original. But having evolved from a rack unit to a pedal that lives on the floor, which is a much riskier environment, we added a plate that snaps easily to the frame with magnets, protecting the buttons and the display as much as possible while on the stage.
