description: BETTY is a portable powered speaker from Ashdown's Elizabeth Line,
  blending elegant design with powerful performance in a compact 2.6 kg package.
  It features a 4-inch mid-bass driver and dual 20mm domes in a two-way inverted
  phase-front system, delivering 45W with an SNR greater than 90dB. Connectivity
  includes Bluetooth 5.0, USB, and AUX, backed by a long-lasting rechargeable
  battery and adjustable bass and treble controls.
details: |-
  Part of the Ashdown Elizabeth Line, BETTY is a portable battery-powered speaker with a two-way, phase-front, inverted sound system. Connectivity: Bluetooth 5.0, USB, and AUX. Adjustable bass and treble controls (+/- 3dB each).
specs: |-
  - Power: 45W
  - Unit configuration: 4-inch mid-bass x1, 20mm dome treble x2
  - System form: two-way, phase-front, inverted sound system
  - Battery: 2600 / 3000 mAh
  - Bass: +/- 3dB (60Hz - 1kHz)
  - Treble: +/- 3dB (1kHz - 20kHz)
  - SNR: greater than 90dB (A), L/R
  - Connectivity: Bluetooth 5.0, USB, AUX
  - Dimensions (mm): 230 x 151 x 140
  - Net weight: 2.6 kg
