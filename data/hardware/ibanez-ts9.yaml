details: |-
  The Ibanez TS9 Tube Screamer is a reissue that's just like the original in so many ways. Same housing, same instantly identifiable green paint, and the same crankin' overdrive that makes it one of the all-time classics in guitar effects.

  Three controls — Drive, Tone, and Level — set the tone, and the pedal is made in Japan. Input is on the right side and output on the left, matching the layout of the original.
specs: |-
  - Controls: Drive, Tone, Level
  - Required Current: 8mA@9V
  - Power Supply: One 9 volt battery (006P) or external AC adapter (DC 9V, Center-negative only)
  - Input on right side; output on left side
  - Made in Japan
