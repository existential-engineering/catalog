description: LUMA is a Eurorack module that converts an RGB image into its
  greyscale Y equivalent using ITU-R BT.601 luminance weighting. It also buffers
  the original RGB inputs and offers an inverted Y output.
details: |-
  LUMA converts an RGB image into the greyscale equivalent Y. Y is the specially weighted mix of R, G and B that accurately represents the luminance intensities of each color as they are perceived by the human eye according to the "International Telecommunication Union Recommendation (ITU-R) BT.601."

  Briefly speaking, users may now get Y from any arbitrary RGB set they choose. LUMA also buffers the original RGB inputs and offers an inverted Y. Dimensions:
  4 HP
  42 mm deep

  Current Draw:
  16 mA +12V
  14 mA -12V
  0 mA 5V
