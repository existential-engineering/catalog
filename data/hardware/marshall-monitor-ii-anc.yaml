description: Wireless over-ear headphones with active noise cancellation and up
  to 45 hours of playtime (30 hours with ANC on).
details: |-
  Monitor II A.N.C. headphones utilise advanced active noise cancelling technology that blocks out the noise. With up to 30 hours of wireless playtime using active noise cancelling technology, or up to 45 hours without, you can keep the music going strong wherever you are. Featuring custom tuned 40 mm dynamic drivers, these headphones produce a signature sound only Marshall can deliver.

  Marshall signature sound: the custom-tuned 40 mm dynamic drivers give bright and crisp highs, punchy mids and deep bass, balanced and clear at any volume.

  ANC and transparency mode: the active noise cancelling continuously pinpoints and measures ambient noise to block out what you do not want to hear, and the level of noise cancelling and monitoring transparency is set in the Marshall Bluetooth app.

  30 hours of wireless playtime: up to 30 hours with active noise cancelling and up to 45 hours without, with 15 minutes of charging giving up to five hours of playtime. Bluetooth 5.0 provides the wireless link, and a removable 3.5 mm cable is included for wired listening.

  Controls and design: the multi-directional control knob handles play, pause, shuffle, volume and phone functions, while the multi-function M-Button switches between three equaliser presets or calls up a voice assistant. Super soft ear cushions and a plush headband with metal swivel rotation hinges sit on a compact, foldable over-ear frame.
