name: Mixdeck
manufacturer: numark
primaryCategory: mixer
categories:
  - discontinued
url: https://www.numark.com/product/mixdeck
description: A complete DJ system with dual slot-loading CD/MP3 drives, USB
  flash drive support, integrated iPod dock, and built-in mixer for blending
  music from CDs, MP3 CDs, USB drives, iPods, and computers.
details: |-
  A complete system for every DJ who blends different kinds of music sources, the Mixdeck supports CDs, MP3 CDs, USB flash drives, iPods, computers, and analog players in a traditional two-deck-and-mixer layout.

  The Mixdeck features dual slot-loading CD/MP3 drives with touch-sensitive illuminated platters, USB flash drive support on each deck, and an integrated universal iPod dock with dedicated fader and controls. It also functions as a software controller via USB (MIDI).

  The built-in mixer offers three-band EQ (±12 dB) per channel, beat-synced DSP effects (chop, echo, filter, flanger, pan, phaser), an automatic BPM analyzer with tap tempo, pitch control (±6, 12, 25, 100%) with Key Lock, seamless looping, sampling, hot cues, Bleep/Reverse function, two large backlit displays, and Fader Start capability.
specs: |-
  - Dual slot-loading CD/MP3 drives with touch-sensitive illuminated platters
  - USB flash drive support on each deck
  - Software controller via USB (MIDI)
  - Integrated universal iPod dock with dedicated fader and controls
  - Built-in mixer with three-band EQ (±12 dB) per channel
  - Beat-synced DSP effects: chop, echo, filter, flanger, pan, phaser
  - Automatic BPM analyzer with tap tempo
  - Pitch control (±6, 12, 25, 100%) with Key Lock
  - Seamless looping, sampling, hot cues, Bleep/Reverse function
  - Two large backlit displays
  - Fader Start capability
  - Includes Serato DJ Intro; pre-mapped for Traktor Pro 2 and VirtualDJ Pro
