url: https://sonicware.jp/products/liven-ambient
description: LIVEN Ambient Ø is a soundscape synthesizer built on newly
  developed Blendwave Modulation Synthesis. Four layers (Drone, Pad, Atmos,
  Noise) merge into evolving textures, backed by nine shimmer-capable reverbs, a
  tape-delay and chorus effects section, and per-layer sequencing.
details: |-
  LIVEN Ambient Ø is a soundscape synthesizer with newly developed Blendwave Modulation Synthesis. As an immersive ambient generator, four layers of tone and texture (Drone, Pad, Atmos, and Noise) merge to generate resonance and transformation. The Blendwave Modulation Synthesis engine offers 6 structures designed to create undulating and fluctuating tones, and the Noise layer processes 8-second stereo sampling loops with noise blending and pitch modulation.

  The effects section provides 9 types of lush reverb with shimmer, plus 6 types of effects including Tape Delay and Stereo Chorus. A sequencer on each layer records performances and evolving tonal changes.

  This product does not include an AC adapter. If you need one, please select the "With PSU" option.
specs: |-
  - Synthesizer: 4-layer construction (Drone, Pad, Atmos, Noise)
  - Blendwave Modulation Synthesis: 6 structures, 32 waves (Drone, Pad, Atmos layers)
  - Noise layer: 1 structure, 8 waves, loop or one-shot playback, white noise mixing, 16-bit / 32kHz linear PCM sampling (stereo, up to 8 seconds per sample)
  - Each layer has its own envelope, filter, and 2 LFOs
  - Effects: 9 types of high-quality reverb with shimmer (send amount adjustable per layer)
  - Master effects: 6 types, including Tape Delay, Reverse Delay, Overdrive, Bit/Rate Crush, Tilt EQ, Stereo Chorus
  - Sequencer: 4 tracks, up to 64 steps, 128 patterns, parameter locking
  - I/O: MIDI IN/OUT, SYNC IN/OUT, LINE IN/OUT, headphone out
  - Size: 11.7 in (W) x 6.92 in (D) x 1.89 in (H), 297mm x 176mm x 48mm
  - Weight: 1.74 lb, 790g
  - Power supply: AA batteries x 6, or 9V DC AC adapter (EIAJ3, center positive, not included)
