details: |-
  Gretsch's time-honored "Broadkaster" name now adorns the flagship guitars of its center block lineup, crafted for full-spectrum sound at high volume with powerful new pickups and a chambered spruce center block that enhances body resonance for more organic tone and comfortably lighter weight.

  Built to perform, the G6609TFM Players Edition Broadkaster Center Block Double-Cut with String-Thru Bigsby and Flame Maple features a stunning tiger flame maple body with a matching headstock in handsome Dark Cherry Stain and Bourbon Stain finishes.

  Two new U.S.-made Full'Tron pickups deliver full-spectrum sonic range with a growl unlike any other pickup, in addition to classic Gretsch chime, balance and brilliance with a dash of extra-mid concentration for powering through overdriven and distorted passages at full volume.
