description: The benchmark in the Alpha Evo line, Alpha 80 is particularly recommended for high sound levels and extended subwoofers. With its 21 cm woofer with Slatefiber cone, this amplified monitoring loudspeaker offers great neutrality across the entire spectrum and excellent dynamics with very low distortion.
details: |-
  Versatility, discretion and studio performance. The benchmark in the Alpha Evo line, Alpha 80 is particularly recommended for high sound levels and extended subwoofers. With its 21 cm woofer with Slatefiber cone, this amplified monitoring loudspeaker offers great neutrality across the entire spectrum and excellent dynamics with very low distortion.

  Polyvalence: connection of up to three audio sources (XLR, TRS and RCA inputs), disengageable automatic standby mode, wall or ceiling mounting. Alpha 80 Evo integrates a wide range of features for mixing, mastering or broadcasting.

  Optimal integration: featuring a large-section vent for a compact bass-reflex design, rounded contours and robust side panels to enhance the sound, Alpha 80 Evo integrates easily into studios without compromising performance.

  Performance: the woofer features a Slatefiber diaphragm renowned for its neutral sound and low distortion. Added to this are an aluminium tweeter for fine treble and two high-current amplifiers for dynamic signal control.

  Manufactured by Focal, the inverted dome tweeter has been a signature since 1981. Aluminium increases the rigidity of the dome and reduces distortion, and a waveguide perfects the spatialization of the sound. Exclusive to Focal and made in France, the Slatefiber cone is made of recycled carbon fibers and thermoplastic polymer.
specs: |-
  - Product type: 2-way monitor
  - Woofer: 8" Slatefiber membrane
  - Tweeter: 1" aluminium inverted dome
  - Frequency response (+/- 3dB): 38 Hz - 22 kHz
  - Maximum SPL (peak @ 1m): 106 dB
  - High frequency amplifier: 35 W, class D
  - Mid-range and low frequency amplifier: 80 W, class D
  - Inputs: TRS symmetrical 10 kOhms, XLR symmetrical 10 kOhms, RCA asymmetrical 10 kOhms with compensated sensitivity
  - Bass level (>250Hz): adjustable +/-6dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: sensitivity, auto standby, LF Shelv, HF Shelv
  - Power On LED
  - Local supply: 100 - 240V (T2AL fuse/250V)
  - On/Off switch on the rear panel
  - Height: 39 cm / 15.35 in
  - Width: 29.6 cm / 11.65 in
  - Depth: 33 cm / 13 in
  - Weight: 9.8 kg / 21.6 lb
