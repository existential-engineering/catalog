url: https://www.focal.com/products/alpha-80-evo
description: Active 2-way studio monitor with an 8" Slatefiber woofer and 1"
  aluminum inverted dome tweeter, built for nearfield and midfield monitoring in
  larger control rooms.
specs: |-
  - 2-way active studio monitor
  - Woofer: 8" Slatefiber membrane
  - Tweeter: 1" Aluminium inverted dome
  - Frequency response (±3 dB): 38 Hz – 22 kHz
  - Maximum SPL (peak @ 1 m): 106 dB
  - High frequency amplifier: 35 W class D
  - Low frequency amplifier: 80 W class D
  - Inputs: XLR, TRS, RCA
  - Dimensions (H × W × D): 39 × 29.6 × 33 cm (15.35 × 11.65 × 13 in)
  - Weight: 9.8 kg (21.6 lb)
