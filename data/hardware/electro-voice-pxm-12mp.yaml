description: The PXM-12MP is a 12-inch coaxial powered stage monitor designed
  for musicians, DJs, and engineers needing reliable on-stage monitoring with
  flexible playback options. A 700 W Class-D Dynacord amplifier drives the
  CXCA2128-1NA 12-inch/1.75-inch coaxial transducer to deliver up to 129 dB peak
  SPL with symmetrical 90 x 90 degree coverage, producing consistent tonal
  balance across the stage from the acoustically optimized 55-degree monitor
  floor angle. An integrated pole mount lets the cabinet double as
  front-of-house mains, fill, or delay, and with an optional subwoofer plus
  matching DSP filters it can serve as the top of a compact three-way system.
  QuickSmartDSP provides four factory presets (including a GUITARCAB voicing),
  three-band EQ, five user-programmable presets, visual limiter status, and
  master volume control. The 15 mm plywood enclosure with a black powder-coated
  steel grille is validated through over 500 hours of abuse and endurance
  testing.
details: >-
  12-inch/1.75-inch CXCA2128-1NA two-way coaxial transducer for symmetrical 90 x
  90 degree coverage


  700 W Class-D Dynacord amplifier (500 W LF / 200 W HF) delivering up to 129 dB
  peak SPL


  Acoustically optimized 55 degree monitor floor angle


  Dual-use design: floor wedge monitor or pole-mounted mains/fill/delay


  QuickSmartDSP with four factory presets and five user-programmable presets


  Three-band EQ, master volume, input controls and meters, visual limiter status


  GUITARCAB DSP preset for amp-cabinet style voicing


  Configurable as the top of a compact three-way system with optional subwoofer
  and matching DSP filters


  Crossover frequency: 1.6 kHz


  15 mm plywood enclosure with black powder-coated steel grille


  Integrated pole mount socket


  Verified by over 500 hours of abuse and endurance testing
