description: Wireless planar magnetic gaming headset with 80+ hour battery,
  ultra-low latency 2.4GHz wireless, Bluetooth 5.3, and AI noise reduction
  microphone. Available in PS5 and Xbox versions.
details: |-
  After years of relentless innovation building the world's best wireless gaming headset, Audeze presents Maxwell, designed from the ground up for serious gamers. Sound quality, wireless performance, and battery life are all pushed to new extremes, along with the latest spatial audio features and multi-platform compatibility.

  Experience true audio immersion and enjoy extraordinary lifelike sound in your favorite games. Maxwell reveals detail and layers of sound you've never heard before by bringing your game audio to life and precisely placing you in the middle of the action.

  Powered by Audeze's latest 90mm planar magnetic drivers, with over 3X the driver area of leading competitors, Maxwell delivers powerful bass and pinpoint precision. Audeze drivers are trusted by leading recording and game studios worldwide.

  Maxwell is built on an all-new toughened chassis with premium aluminium yokes and spring steel headband. Play in comfort, all day, all night with deluxe memory foam earpads and replaceable suspension strap.

  Get crystal-clear communications from Audeze's FILTER noise reduction technology. Using a dedicated A.I. processor, background noise is removed instantly and automatically on any platform.
specs: |-
  - Style: Over-ear (circumaural), closed-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-Thin Uniforce
  - Transducer size: 90 mm
  - Maximum SPL: >120dB
  - Frequency response: 10Hz - 50kHz
  - THD: <0.1% (@ 1 kHz, 1mW)
  - Spatial Audio: Dolby Atmos (Xbox Version), Tempest 3D (PlayStation Version)
  - Weight: 490g
  - Boom Microphone: Detachable, Hypercardioid
  - Mic Beamforming: Physical and AI noise reduction, internal mic for chat
  - Battery type: Lithium-polymer, 1800mAh
  - Battery life: Over 80 hrs wireless playback @ 80dBA
  - Fast charge: USB-C, 5v 1.8 Amp max - 25% charge / 20min (Full charge 2hr)
  - Wireless: Ultra-low-latency, Bluetooth 5.3
  - Codec support: Multipoint, LE Audio, LC3, LC3plus, LDAC, AAC, SBC
  - Wired Digital: USB-C with dual-audio endpoints and game-chat mix
  - Wired Analog: 3.5mm TRRS active
  - SKU: 208-MW-1120-01
