name: DL32
manufacturer: midas
primaryCategory: rack-mount
categories:
  - preamp
url: "https://www.midasconsoles.com/en/products/0606-ACR"
description: The DL32 is the perfect solution for connecting the onstage talent
  with your Front of House (FOH) console. A 32x16 digital stage box featuring 32
  Midas PRO Series remote-controllable mic preamps and 16 balanced analog XLR
  returns, connecting to the FOH console via a single Cat 5e cable. Built-in
  AES50 ports allow cascading of two units for 32 outputs, providing 48
  bidirectional audio channels at 48 kHz. Housed in a 2 rack space form factor
  and compatible with M32 and M32C consoles.
details: |-
  The DL32 is a 32x16 digital stage box designed for live sound reinforcement, providing the connection between onstage talent and the Front of House (FOH) console. It features 32 Midas PRO Series remote-controllable mic preamps and 16 balanced analog XLR returns at the stage end. Connection to the FOH console is made via a single Cat 5e cable carrying 48 bidirectional audio channels at 48 kHz over AES50. Built-in AES50 ports allow cascading of two units to provide 32 outputs. Additional connectivity includes 2 optical ADAT sockets, AES-3 (AES/EBU), MIDI I/O, USB for system updates, and an ULTRANET port for Turbosound and Behringer monitoring systems. The unit occupies 2 rack spaces and is compatible with M32 and M32C consoles.
specs: |-
  - Configuration: 32 x 16 digital stage box
  - Mic Preamps: 32 Midas PRO Series remote-controllable
  - Analog Returns: 16 balanced analog XLR
  - Sample Rate: 48 kHz
  - Audio Channels: 48 bidirectional via AES50 over Cat 5e
  - Form Factor: 2 rack spaces
  - FOH Connection: Single Cat 5e cable
  - ADAT Optical: 2 optical ADAT sockets
  - AES50 Ports: Built-in, allows cascading of two units
  - Cascade Capability: 32 outputs when cascaded with another DL32
