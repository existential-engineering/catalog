details: |-
  The late '80s and early '90s marked the heyday of the quintessential Spector sound—appearing in the hands of iconic artists and on countless chart-topping records. These instruments helped define what we now call the classic " Spector Recipe."

  With that legacy in mind, the Spector Custom Shop is proud to introduce a first for the brand: the Spector Woodstock Select . Crafted in an ultra-limited batch at our Woodstock Custom Shop, these instruments are a glorious fusion of the classic Spector formula and the modern refinements that make Custom Shop Spectors world-class. So, what is the Spector Recipe? Solid maple body wings, neck-through maple construction, and a powerhouse electronics package featuring EMG pickups and a HAZ 9V preamp. The result? A timelessly stunning instrument with " The Spector Sound" in spades—available in five iconic gloss finishes.
