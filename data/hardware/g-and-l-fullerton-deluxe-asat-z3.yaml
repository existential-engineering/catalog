description: The ASAT Z-3 packs a Comanche into an ASAT body, built around the
  distinctively shaped Magnetic Field Design Z-Coil pickups Leo Fender designed
  himself. They deliver a bright, sparkly top end and a robust bottom end
  without any 60-cycle hum.
details: |-
  The G&L Comanche is Leo's final word on the traditional double-cutaway bolt-on axe, and the ASAT Z-3 is like packing a Comanche into an ASAT body. Like the Comanche, the first thing anyone notices about the ASAT Z-3 is the distinctive shape of the Magnetic Field Design Z-Coil pickups designed by Leo Fender himself. These pickups deliver a bright and sparkly top end while offering a robust bottom end, all without any 60-cycle hum.

  There is plenty of power in the Z-coil pickups, but what's surprising is how glassy and detailed they become as the volume is rolled back. What's more, the ASAT Z-3 includes a push/pull tone pot to allow neck+bridge or all three pickups together. In a pinch, the neck+bridge combo does a convincing faux ASAT Special. And like the ASAT Special, the Z-3 maximizes sustain with Leo's Saddle-Lock bridge which transfers string energy right into the body end-grain for an incredibly resonant instrument.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD Z-Coil hum-cancelling
  - Body wood: Alder
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Saddle-Lock with chrome-plated brass saddles
  - Controls: 5-position pickup selector, volume, treble with push/pull enabling additional pickup combinations of neck+bridge or all three pickups together
  - Includes: G&L Deluxe Gig Bag
  - Handedness: right-hand only, due to the offset pickup design
  - Available in: 3-Tone Sunburst over Alder, 4-ply tortoise pickguard, Rosewood fingerboard
  - Available in: Sonic Blue over Alder, 3-ply parchment pickguard, Maple fingerboard
