details: |-
  The A2 (Aries 2) was created to keep up with the various advancements in the custom shop.

  Some of the most notable changes include the Access output jack, located on the back of the guitar to eliminate physical cable obstruction; a radiused neck heel for even easier upper fret access; and a shrunken, elongated bevel that shows more of the top wood while still maintaining as much comfort as the original Aries.

  These are only a few of the upgrades to the Aries.
specs: |-
  - Construction: bolt-on with radiused neck heel
  - Scale length: 25.5" or 27" fixed, plus multiscale options of 25.5" to 26.5", 25.5" to 27" and 26" to 27.5"
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Fingerboard: ebony with 14" or 20" radius
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability
  - Neck width options from 1.69" to 2.42" wide at the nut
  - Body: alder
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Output jacks: a flush mount output jack and a rear Access output jack, both fitted as standard, the rear Access jack eliminating physical cable obstruction
  - Bridge options: Hipshot fixed bridge or Hipshot Solo Saddle bridge, .4125" (10.5mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: inline GT headstock
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Strings: Elixir Nanoweb 1046E
  - Body dimensions: 38.25" to 39.75" long, 1.65" thick, 12.6" to 12.7" wide depending on configuration
  - Weight: 7.25 to 7.75 lbs
  - Patent number: D1108531
  - Offered in several string counts and in standard or multiscale layouts, configured to order; the gallery shows an 8-string multiscale build
  - Built to order with a choice of body, top, fingerboard and finish options
