description: >-
  The Rhodes Chroma is a rare analog synthesizer produced from 1982 to 1984, with only
  approximately 3,000 units manufactured. Originally an ARP project, Rhodes picked up its
  development after ARP dissolved in 1981, making it one of the most sophisticated analog
  synthesizers of the early 1980s with 16-voice polyphony and computer interface
  capabilities.
details: |-
  The Rhodes Chroma began life as an ARP project before Rhodes acquired it following ARP's dissolution in 1981. It offered 16 voices with one oscillator per voice, or could be configured as 8 voices with two oscillators per voice, paired with a 64-note velocity-sensitive weighted keyboard and a powerful but complex synthesis architecture.

  Programming the Chroma was made challenging by its limited front-panel interface, consisting of just two rows of membrane push-buttons with few sliders for hands-on control. Despite this, the Chroma was a remarkably stable and elegant instrument featuring complete auto-tuning, split-keyboard mode, and the ability to link to a computer.

  Although the Chroma predated MIDI, it used ARP's proprietary Digital Access Control protocol for interconnection. This allowed it to interface with an Apple IIe computer for sequence and patch storage using dedicated Chroma software. On-board features included two arpeggiators, a graphic equalizer, pitch and mod controls, and six additional sliders. A keyboardless expander module was also manufactured.

  The Rhodes Chroma has been used by notable artists including Jethro Tull, Herbie Hancock, Joe Zawinul, and Oscar Peterson.
specs: |-
  - Polyphony: 16 voices (1 oscillator per voice) or 8 voices (2 oscillators per voice)
  - Oscillators: 16 VCOs with sawtooth and variable pulse waveforms
  - Modulation Sources: 16
  - LFO: 16 waveforms
  - Filter: Switchable hi-pass or low-pass
  - VCA: ADSR envelope
  - Keyboard: 64 weighted keys with velocity sensitivity; polyphonic aftertouch optional
  - Memory: 50 patches plus external cassette tape interface
  - Control: ARP Digital Access Control (MIDI available via retrofit)
  - Features: Two arpeggiators, graphic equalizer, pitch/mod slider, 6 additional sliders
  - Production: Approximately 3,000 units manufactured
