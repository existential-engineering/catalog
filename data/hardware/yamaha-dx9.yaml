description: >-
  The Yamaha DX9 is a 4-operator FM synthesis keyboard released in 1983 as a more
  affordable alternative to the popular DX7. While capable of interesting tonal textures
  through frequency modulation, it suffered from difficult programming and limited MIDI
  implementation. As DX7 prices declined over time, the DX9 became less attractive in the
  market.
details: |-
  The DX9 emerged in 1983 as Yamaha's budget-friendly option compared to its flagship DX7. As a 4-operator FM synthesizer, it could generate complex tonal textures through frequency modulation synthesis, though with fewer operators than the DX7's six.

  However, the instrument faced significant usability challenges, sharing many of the headache problems associated with its DX7 relative, including difficult programming and limited MIDI implementation.

  Unlike the DX100, which gained notoriety for its distinctive gritty house-bass sound, the DX9 lacked signature sounds that differentiated it from competitors. As DX7 prices declined over time, the DX9 became less attractive, pushing it toward obsolescence in the vintage market.
specs: |-
  - 16-voice polyphony
  - Digital 4-operator FM synthesis
  - LFO modulation
  - No filter
  - ADSR envelope
  - 61 keys
  - 20 patch memory
  - MIDI control
