details: |-
  Audeze changed the headphone world forever in 2009 with the LCD-2, a planar magnetic headphone like none before it. Today's LCD-2 carries that legacy forward with hand-finished Padauk wood rings, an updated suspension headband, and modern earpads.

  From Audeze's very beginning onward, the LCD-2's vibrant and physical sound connects listeners with their favorite artist. The midrange tone is warm and lifelike, and the legendary deep and powerful bass lets you feel the pulse of the music.

  Featuring a unique dual-sided staggered magnetic array, LCD-2's planar drivers give music the space to breathe and feel real. Upgraded with patented Fazor waveguides, today's LCD-2 delivers precision and intimacy.

  LCD-2 is still made in Audeze's Southern California workshop, using beautiful hand-crafted wood rings. Now upgraded with the suspension headband and latest earpads, LCD-2 is more comfortable than ever.
