description: TRUE VINTAGE DISTORTION. The Germanium Filter is our love letter to
  sticking a pencil through your speaker.
details: |-
  The Germanium Filter is our love letter to sticking a pencil through your speaker. Start with a console-style drive circuit, made from obsolete germanium transistors, and finish it off with a super intense DBA-style filter, and BLAMO, you've got a sound heavy enough to crush and sharp enough to slice.

  The Filter control is extremely versatile: it'll take you from bottomless, sub-woofered-out lows to super searing and brittle highs, with a universe of tone in between. The Gain control starts with a dirty boost that spans through saturated drive, spitting distortion, and a blistering fuzz tone.

  Filter controls the frequency response of the pedal, featuring huge low end, scooped mids, and sharp, piercing highs. Gain sweeps from mild overdrive to blasted-out fuzz and is very interactive with your guitar's volume control. An internal Volume control sets the overall output level of the pedal.
