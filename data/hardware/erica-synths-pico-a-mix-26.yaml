details: |-
  Pico Audio Mixer is a simple 3 channel, AC coupled mixer intended to mix audio signals before feeding them into other modules. Each of the three inputs has its own level control.

  The inputs accept signals up to 10Vptp and carry diode protection against overvoltage, so a hot source patched in by mistake does not damage the circuit.

  The module is part of the Pico Series, Erica Synths' effort to fit substantial functionality into an affordable 3HP panel. It is 3HP wide and 35mm deep, and draws +20mA and -7mA from the bus.
specs: |-
  - 3 inputs
  - AC coupled
  - Diode protection against overvoltage
  - Input level 10Vptp
  - Power consumption +20mA, -7mA
  - Module width 3HP
  - Module depth 35mm
