description: Compact passive 1 x 12 inch closed-back guitar speaker cabinet
  loaded with a Celestion Vintage 30, rated 60 W at 8 ohms.
details: |-
  Sometimes your space is very limited, be it on stage, in the studio or in the trunk of the car. That doesn't mean your guitar sound needs to suffer, though, because the E112VB delivers full-size tones despite its 12 inch format.

  It is a particularly good companion, both sonically and visually, for the compact Rockmaster, Metalmaster and Gigmaster heads. The Celestion Vintage 30 speaker delivers brawling bass and sweet highs.

  The solid housing, made of birch plywood, is built for eternity and is 100% roadworthy. The straight front, closed back and hand-welded metal grille complete the construction.
specs: |-
  - Passive cabinet, no internal amplification and no mains power
  - Speaker: 12 inch Celestion Vintage 30 made in UK
  - Power handling: 60 W
  - Impedance: 8 ohms
  - Straight front
  - Closed back
  - Solid birch plywood construction
  - Parallel input and thru for daisy chaining
  - Solid hand welded metal grille
  - Dimensions: 58 x 47 x 30 cm
  - Weight: 21 kg
