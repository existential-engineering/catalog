description: Unique sample based groovebox and MIDI controller with an open
  sandbox approach to sequencing and an innovative performance mode.
details: |-
  With a workflow that is both inspiring and simple, Polyend Play is far from your average sample-based groovebox. Endless possibilities for your beats are at your fingertips with over 30 sample packs to play with straight out of the box.

  Flexible sequencing with 8 audio tracks and 8 polyphonic MIDI tracks for controlling outboard gear puts Play at the center of a studio. Step parameters can be independently adjusted with familiar sample-based controls.

  Play runs on 5V/1A via USB-C and can be powered from a power bank for use on the go.
specs: |-
  - 8 audio tracks and 8 polyphonic MIDI tracks
  - Over 30 sample packs included out of the box
  - Per-step parameter editing
  - Innovative performance mode
  - USB-C bus-powered (5V/1A), portable-battery compatible
  - Height (w/ knobs): 1.3 inches (3.3 cm)
  - Width: 11.02 inches (28.2 cm)
  - Depth: 8.15 inches (20.7 cm)
  - Weight: 2.65 pounds (1.2 kg)
  - In the box: USB-C cable (2 m)
