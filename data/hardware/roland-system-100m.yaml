description: >-
  Roland's professional analog modular synthesis system offering over 20 interchangeable
  modules, allowing musicians to design fully customized signal paths for sound creation
  and processing.
details: |-
  Produced between 1979 and 1984, the Roland System 100m expanded on the company's earlier
  semi-modular System 100 by embracing a fully modular architecture. Users could select from
  a broad catalog of individual modules covering oscillators, filters, envelopes, LFOs, ring
  modulators, phase shifters, delays, and parametric EQs, assembling them into personalized
  configurations housed in dedicated rack frames.

  The module lineup included the M-110 single VCO with integrated VCA and VCF sections, the
  M-112 dual VCO with sync options, the M-121 dual VCF with switchable low-pass and high-pass
  modes at 24 dB/oct slope, and the M-140 dual envelope and LFO module featuring five waveform
  shapes. Keyboard options ranged from a compact 32-note controller to a 49-note four-voice
  polyphonic keyboard with built-in arpeggiator.

  The system attracted serious electronic musicians and film composers. Hans Zimmer famously
  assembled a massive custom System 100m rig containing 58 VCOs, 37 VCFs, 32 envelope
  generators, 12 voltage-controlled phase shifters, and 9 sequencers spread across six flight
  cases. Other notable users include Orbital, Vince Clarke, Depeche Mode, Human League, and
  Peter Howell of the BBC Radiophonic Workshop.

  Despite being monophonic at the individual voice level, the system's flexibility and rich
  analog character have kept it highly sought after by collectors and modular enthusiasts
  decades after its discontinuation.
specs: |-
  - Polyphony: Monophonic (per voice)
  - Oscillators: M-110 single VCO, M-112 dual VCO with sync
  - Filter: M-121 dual VCF, low-pass and high-pass, 24 dB/oct
  - Envelopes: M-140 dual ADSR
  - LFO: 5 waveforms
  - Modules: Over 20 available (VCO, VCF, VCA, ENV, LFO, ring mod, phase shifter, delay, EQ)
  - Keyboards: M-180 (32-note), M-181 (49-note), M-184 (49-note, 4-voice poly with arpeggiator)
  - Racks: M-190 (3 modules), M-191 (5 modules)
  - Control: CV/Gate
releaseDate: "1979"
