details: |-
  One strum of the Honey Dipper Round-Neck Resonator Guitar transports you back 80 years to a hobo jungle just off the tracks, where wandering workers congregate in camaraderie and the comforting and captivating strains of a real all-metal resonator guitar waft through the smoke of oil-drum fires and enchant the ears with a sound like raindrops beating on a rusty pump house roof.

  Built with a bell brass body and a maple biscuit bridge with ebony/maple saddle, the Honey Dipper delivers the classic single-cone resonator tone. The mahogany Medium 'V' neck and padauk fingerboard are finished in weathered 'Pump House Roof', completing its vintage character.
specs: |-
  - Series: Roots Collection
  - Body: Bell Brass, Resonator shape, Non-Cutaway
  - Neck: Mahogany, Medium 'V'
  - Scale Length: 25"
  - Fingerboard: Padauk
  - Frets: 19, Medium Jumbo
  - Bridge: Biscuit (Hard Maple with Ebony/Maple Saddle)
  - Tailpiece: Weathered Trapeze
  - Tuning Machines: Grover Sta-Tite
  - Hardware: Chrome
  - Strings: D'Addario EJ16 Phosphor Bronze Light (.012-.053)
  - Color: Weathered Pump House Roof
