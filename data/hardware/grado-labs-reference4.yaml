description: Moving iron phono cartridge from Grado's Timbre Series. Features an
  American Osage wood body, machined boron cantilever with nude Shibata diamond
  stylus, and 6N OCC copper internal wiring. Available in high- and low-output
  stereo and mono configurations.
details: |-
  The Reference4 sits within Grado's Timbre Series, offering a refined balance of resolution, control, and musicality. The moving iron design uses Grado's flux-bridger principle for low moving mass and a stable coil structure.

  The body is machined from American Osage wood, paired with a machined boron cantilever and a nude Shibata diamond stylus. The internal signal path uses ultra-high purity 6N OCC copper, with cryogenic treatment and internal damping applied during assembly.

  Available in high-output and low-output stereo configurations, plus mono high-output and mono low-output variants (special order, no returns). Eligible for Grado's Wood Cartridge Upgrade Program.
specs: |-
  - Body Material: American Osage Wood
  - Cantilever: Machined Boron
  - Stylus Profile: Nude Shibata Diamond
  - Output Voltage (High): 4.0mV @ 5 CMV (45°)
  - Output Voltage (Low): 1.0mV @ 5 CMV (45°)
  - Inductance (High): 55mH
  - Inductance (Low): 6mH
  - Resistance (High): 660 ohms
  - Resistance (Low): 70 ohms
  - Input Load: 10k-47k ohms
  - Cartridge Weight: 9.6 grams
  - Tracking Force: 1.6-1.9 grams
  - Compliance: 20μm/mN
  - Channel Separation: Average 30dB (10-30k Hz)
  - Frequency Response: 10-60 kHz
  - Internal Wiring: Ultra-high purity 6N OCC copper
  - Processing: Cryogenic treatment with internal damping
