description: Eddy is a three channel stereo CV controlled mixer with
  sidechainable compression and distortion, designed as a compact submixer. It
  features normalized feedback paths through bandpass filters for experimental
  tone shaping and percussion synthesis.
details: |-
  If ordering on release (April 2026) please allow an extra week or two for delivery as only one person is doing all the packing and shipping. Eddy is a three channel stereo CV controlled mixer with sidechaineable compression and distortion, designed as a compact submixer. It also has normalized feedback paths for more experimental tone shaping, no input mixing, and percussion synthesis workflows. The Cascade expander is available seperately to allow access to the individual VCA or feedback channels and all mix options at once. DOWNLOAD QUICKSTART

  Features
specs: |-
  - 3 stereo channels
  - Invert/mute switches for each channel
  - Built in VCA feedback compressor
  - Fourth input is switchable between a mono input or sidechain input
  - Aggressive distortion
  - Output switchable between distortion, compression, and clean mix on main module
  - Expander provides individual outputs for each output option
  - Normalized feedback through three bandpass filters allows for no input mixing and percussion synthesis
  - Individual outputs for each filter available on expander
  - Headers on back allow one channel of line level input
  - Trimmer on back allows for altering compressor threshold level
  - 8HP for the main three channel stereo mixer module
  - 4HP expander to use as triple stereo VCA
  - 34mm depth (including cable)
  - current draw: +12V 146mA, -12V 146mA
