description: The Klipsch Reference R-800F Floorstanding Speakers feature
  next-generation horn-loaded technology for a premium home theater sound
  experience.
details: |-
  An updated 90° x 90° Tractrix horn design, including increased outer horn dimensions, delivers more power and emotion to music and movies. Directivity control over a larger bandwidth of frequencies results in a more accurate sound stage.

  The exclusive 1" Linear Travel Suspension (LTS) aluminum tweeter with Kapton Suspension minimizes distortion for more detailed performances. Aluminum is an extremely light and rigid material used in the tweeter assembly to provide high efficiency.

  Dual 8" Spun-Copper Thermoformed Crystalline Polymer (TCP) woofers feature steeper angling of the cones for a smoother response and improved accuracy and transparency.

  The rear Tractrix port is perfectly matched to the cabinet and woofers, creating ideal airflow with minimal distortion or turbulence even at the lowest frequencies.
