description: Movement recorder, distinct LFO and drone/noise oscillator.
details: |-
  The Black Joystick2 is a four channel multi functional CV and sound source, with two axes on each channel. It works as a joystick, a movement recorder, a distinct LFO and a drone or noise oscillator, and it provides great interaction with the modular system, allowing unconventional modulation patterns to be developed easily.

  Eight CV outputs and two gate outputs run simultaneously. Four motion record channels capture stick movement for up to 8 seconds each, gate record captures the accompanying triggers, and two 4-position CV panners route voltages around the channels.

  Sine and random LFOs with adjustable frequency and amplitude cover 0.1Hz to 5Hz, and the drone and noise oscillator runs from 50Hz up to 1kHz, so the module reaches into audio rate as well as modulation rate. CV outputs swing between -5V and +5V.

  Erica Black Series include high-end, unique functionality and superior quality modules. Only the best, highest quality components are used and all inputs and outputs are protected against undesired overvoltage. The panel is 12HP wide at a depth of 30mm, the skiff friendly design suits shallow cases, and power draw is 71mA on the +12V rail against 20mA on the -12V rail.
specs: |-
  - 8 simultaneous CV outputs
  - 2 gate outputs
  - 4 motion record channels
  - Sine and Random LFOs with adjustable frequency and amplitude
  - Drone/noise oscillator
  - Gate record
  - Two 4-position CV panners
  - Skiff friendly design
  - CV output amplitude -5V - +5V
  - LFO frequency range 0.1Hz - 5Hz
  - Drone oscillator frequency range 50Hz - 1kHz
  - Max motion record time 8" per channel
  - Panel width 12HP
  - Module depth 30mm
  - Power consumption 71mA@+12V, 20mA@-12V
