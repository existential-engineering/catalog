url: https://mackie.com/en/products/mixers/vlz4-series/1202VLZ4.html
description: "Mackie 1202VLZ4 12-Channel Compact Analog Mixer with Onyx mic
  preamps for home studios, podcasting, broadcast, and small venues."
details: |-
  VLZ4 ups the level of sonic quality at every level, featuring Mackie's flagship Onyx mic preamps and premium components from front to back. The result is the most rock solid, the most easy to use and, yes, the best sounding compact mixer ever created.

  A favorite among small bands, home studios, and small venues, the 1202VLZ4 packs a ton of pro capability into its easily portable form factor. Great for home studios, podcasting, broadcast, and more where sound quality, small size, and versatility is a must.
specs: |-
  - 4 boutique-quality Onyx mic preamps
  - Ultra-wide 60dB gain range
  - 128.5 dB dynamic range
  - +22 dBu line input handling
  - Extended frequency response
  - Distortion under 0.0007% (20Hz – 50kHz)
  - Improved RF rejection perfect for broadcast applications
  - Phantom power for studio condenser mics
  - 12 high-headroom line inputs
  - 4 balanced inserts perfect for integrating outboard gear
  - 3-band EQ (80Hz, 2.5kHz, 12kHz)
  - 18 dB/oct 75Hz low-cut filter on mic input channels
  - 2 aux sends with level, pan, PFL solo per channel
  - 2 stereo returns for FX processor/stereo sources
  - ALT 3/4 stereo bus for routing flexibility
  - Control room / phones multi-input source matrix
  - High-resolution 12-segment stereo meters
  - Sealed rotary controls resist dust and grime
  - "Built-Like-A-Tank" rugged steel chassis with powder-coat finish
  - High-visibility, high-contrast controls deliver convenient "at-a-glance" visual feedback
  - Rack-mountable design (optional rack ear kit)
  - Multi-voltage power supply for worldwide use
