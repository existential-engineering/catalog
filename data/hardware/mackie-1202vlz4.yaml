description: Mackie 1202VLZ4 12-Channel Compact Analog Mixer with Onyx mic
  preamps for home studios, podcasting, broadcast, and small venues.
details: |-
  A favorite among small bands, home studios, and small venues, the 1202VLZ4 packs a lot of pro capability into an easily portable form factor. It suits home studios, podcasting, broadcast, and more where sound quality, small size, and versatility matter.

  The 12-channel 1202VLZ4 delivers the quality of Mackie's Onyx preamps in a compact mixer design with high-headroom, low-noise performance. Four boutique-quality Onyx mic preamps offer an ultra-wide 60 dB gain range, 128.5 dB dynamic range and distortion under 0.0007% from 20 Hz to 50 kHz, with improved RF rejection for broadcast work.

  Twelve high-headroom line inputs, four balanced inserts, two aux sends, two stereo returns and an ALT 3/4 stereo bus give the routing flexibility of a much larger console, and a dedicated control room / phones source matrix handles monitoring.

  The chassis is a rugged solid-steel Built-Like-A-Tank design with a powder-coat finish, sealed rotary controls that resist dust and grime, and high-contrast controls for at-a-glance feedback. An optional rack ear kit makes it rack-mountable, and the multi-voltage power supply suits worldwide use.
specs: |-
  - 4 boutique-quality Onyx mic preamps
  - Ultra-wide 60 dB gain range
  - 128.5 dB dynamic range
  - +22 dBu line input handling
  - Distortion under 0.0007% (20 Hz - 50 kHz)
  - Improved RF rejection perfect for broadcast applications
  - 48V phantom power for condenser mics
  - 12 high-headroom line inputs
  - 4 balanced inserts perfect for integrating outboard gear
  - 3-band EQ (80 Hz, 2.5 kHz, 12 kHz)
  - 18 dB/oct 75 Hz low-cut filter on mic input channels
  - 2 aux sends, level, pan and PFL solo on each channel
  - 2 stereo returns for connecting FX processor or other stereo source
  - ALT 3/4 stereo bus for added routing flexibility
  - Control room / phones source matrix
  - High-resolution 12-segment stereo meters
  - Sealed rotary controls resist dust and grime
  - Built-Like-A-Tank rugged steel chassis with powder-coat finish
  - Rack-mountable design using optional rack ear kit
  - Multi-voltage power supply for worldwide use, 25 watts power consumption
  - 11.9 x 10.7 x 3.0 in / 303 x 273 x 75 mm, 6.5 lb / 3.0 kg
