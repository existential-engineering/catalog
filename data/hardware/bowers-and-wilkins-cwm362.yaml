description: The CWM362 two-way in-wall loudspeaker features an elegant
  minimal-width border design and is engineered to deliver precision sound in
  any environment. Bring your music and movies to life with CWM362.
details: |-
  CWM362 is a two-way in-wall loudspeaker in the Bowers & Wilkins CI300 Series, sold under the Flexible Series heading. It pairs a 160mm (6in) polypropylene cone bass/midrange driver with a 25mm (1in) soft dome tweeter behind a minimal-width border, and Bowers & Wilkins positions the CI300 Series as the point of entry to areas of the home that were previously off-limits for high-quality installation loudspeakers.

  It is a fully passive loudspeaker. The baffle carries the drive units, the crossover circuit and the connectors, and there is no amplification, no processing and no mains supply of any kind. Nominal impedance is 8 ohms with a 5.0 ohm minimum, sensitivity is 89dB SPL at 2.83V and 1m, power handling is 80W, and the quoted frequency range is 50Hz to 30kHz at -6dB.

  The speaker is designed for conventional stud and sheetrock (joist and plasterboard) walls. It needs a 275mm (10.9in) by 181mm (7.2in) aperture and at least 76mm (3in) of depth clearance behind it, and is held in place by four dog clamps that swing outwards and are tightened with a screwdriver through access holes in the front of the baffle. For new-build projects Bowers & Wilkins offers the PMK W6 pre-mount kit and the BB 6W back box.

  Connection is bare speaker cable into spring terminals on the crossover board, with the cable from the amplifier's positive terminal going to the red spring terminal and the negative to the black. The manual asks for roughly 1.0m (3ft) of slack at the aperture so the speaker can be connected without the cable rattling in the wall void, and recommends low-resistance cable where the run from amplifier to speaker exceeds 5m.

  The grille is held magnetically and simply clicks into the groove in the frame flange, and a paint mask is supplied so the wall can be decorated after the speaker is installed. The drive units create stray magnetic fields, so Bowers & Wilkins recommends keeping magnetically sensitive items such as CRT screens and magnetic cards away from the speaker. The only finish is White, and the speaker is supplied in pairs, matching the manual's carton contents of two speakers.
specs: |-
  - Drive units: 1x 25mm (1in) soft dome tweeter, 1x 160mm (6in) Polypropylene cone bass/midrange
  - Frequency range (-6dB): 50Hz - 30kHz
  - Sensitivity SPL: 89dB (2.83V, 1m)
  - Nominal impedance: 8 ohms (minimum 5.0 ohms)
  - Power handling: 80W
  - Passive two-way in-wall system: on-board passive crossover, no amplifier and no mains supply
  - Connection: spring terminals on the crossover board, red positive and black negative
  - Wall aperture: 275mm (10.9in) height x 181mm (7.2in) width
  - Minimum depth clearance: 76mm (3in)
  - Mounting: four dog clamps tightened from the front of the baffle; for stud and sheetrock walls
  - Magnetically secured removable grille; paint mask supplied
  - Optional pre-mount kit: PMK W6. Optional back box: BB 6W
  - Finish: White
  - Supplied as a pair: two speakers, two grilles, two aperture templates, two paint masks per carton
  - Stray magnetic fields: keep magnetically sensitive items away from the drive units
