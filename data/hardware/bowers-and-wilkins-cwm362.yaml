details: |-
  The CWM362 is the Flexible Series two-way in-wall speaker, listed on the product page as a Flexible two-way in-wall speaker in a White finish and sold as a pair.

  Bowers & Wilkins CI300 Series speakers are designed to offer easy installation and high-quality audio reproduction for discreet custom install applications. The CI300 Series provides a point of entry to areas of the home that were previously off-limits for high-quality installation loudspeakers.

  The CWM362 is a two-way in-wall loudspeaker. Like the in-ceiling models in the series, it features an elegant minimal-width border design. The page's own Specifications block lists the drive units as one 25mm soft dome tweeter and one 160mm Polypropylene cone bass/midrange driver.

  CWM3 Series in-wall speakers comprise a baffle carrying the speaker drivers, crossover circuit and connectors, and a magnetically secured grille. The baffle is secured in the wall aperture by dog-clamps that swing outwards and tighten. Speaker cable connects to the red and black spring terminals on the crossover board, red for the amplifier's positive terminal and black for its negative, before the speaker is inserted into the aperture.
specs: |-
  - Description: 2-way in-wall system
  - Drive units: 1x ø25mm (1in) soft dome tweeter
  - Drive units: 1x ø160mm (6in) Polypropylene cone bass/midrange
  - Frequency range (-6dB): 50Hz – 30kHz
  - Sensitivity SPL (2.83V, 1m): 89dB
  - Nominal impedance: 8Ω (minimum 5.0Ω)
  - Power handling: 80W
  - Frame height: 315mm (12.4in)
  - Frame width: 221mm (8.7in)
  - Cut-out (aperture) height: 275mm (10.9in)
  - Cut-out (aperture) width: 181mm (7.2in)
  - Minimum depth clearance: 76mm (3in)
  - Pre-mount kit: PMK W6
  - Back box: BB 6W
  - Four dog-clamps, magnetically secured grille
  - Red and black spring terminals on the crossover board
  - Sold as a pair
  - Finish: White
