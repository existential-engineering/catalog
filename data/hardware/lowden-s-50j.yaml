description: The 50 Series Jazz combines the benefits of the Lowden Jazz Series
  with Master Grade tonewoods and premium appointments, the ultimate cross-over
  guitar for classical and steel string players alike.
details: |-
  The Lowden Jazz Series of guitars have been designed to feel comfortable and familiar to classical and steel string players alike, making it the ultimate 'cross-over' guitar. The neck has enough width to facilitate the nylon strings but at the same time the cambered fingerboard allows for a wide variety of playing styles. Jazz Series guitars are fitted with an LR Baggs Session VTC pickup as standard, and all S-shaped Jazz models have a cutaway as standard (cutaways are not available on any Lowden WL model). The soundbox is voiced for a versatile and dynamic acoustic response, while at the same time being stiff enough to prevent the whole guitar from hyper-resonating or feeding back when played loud through a sound system. A Lowden 50 Series Jazz guitar combines all the benefits of the Jazz Series with Master Grade tonewoods and premium appointments, and can be configured in any Lowden tonewood combination.
specs: |-
  - S Jazz: 48mm nut width, 60mm neck width at 14th fret, 374mm soundbox width, 105mm soundbox depth, 650mm scale length, 508mm fretboard radius
  - WL Jazz: 48mm nut width, 60mm neck width at 14th fret, 335mm soundbox width, 100mm soundbox depth, 650mm scale length, 508mm fretboard radius
  - Master Grade tonewoods
  - S-shaped body with cutaway
  - Cambered fingerboard
  - LR Baggs Session VTC pickup fitted as standard
