details: |-
  Notorious for their attack as they are for their stunning crystalline looks, Vistalite acrylic drums are a statement both sonically and visually. Since 1972, Vistalite drums have been performed on and coveted by some of music's top players. Proudly handcrafted in the U.S.A., the series remains a touchstone of Ludwig's heritage and a fixture on big stages.

  The shells are 6mm thick cast acrylic with reinforced seams. The acrylic construction is optimum for presence, focus, and attack, and Vistalite kits are known for filling up stage settings nicely without compromising overall volume and body.

  Bearing edges are cut at 45 degrees for elevated sustain and crisp attack. This specific edge offers the ability to perform unrestricted over a wide tuning range, giving players responsive feel across genres and stick weights.

  Vistalite ships in three standard outfits — Fab, Pro Beat, and Zep — covering 22", 24", and 26" bass drum configurations, with multiple tom and floor tom sizes. Available finishes include Amber (47), Blue (55), Yellow (56), Clear (38), and Bronze (1V).
specs: |-
  - 6mm thick cast acrylic shells with reinforced seams
  - 45-degree bearing edges for elevated sustain and crisp attack
  - Hand-crafted in the U.S.A. since 1972
  - Standard outfits: Fab, Pro Beat, Zep
  - Bass drum sizes: 22", 24", 26" (14" depth)
  - Tom sizes: 10"x8", 12"x8", 13"x9", 14"x10"
  - Floor tom sizes: 14"x14", 16"x16", 18"x16"
  - Finishes: Amber (47), Blue (55), Yellow (56), Clear (38), Bronze (1V)
