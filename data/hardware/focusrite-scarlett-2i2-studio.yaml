description: "All-in-one home studio bundle built around the Scarlett 2i2 4th
  Gen USB-C audio interface, paired with a CM25 MkIII condenser microphone,
  SH-450 closed-back headphones, and cables."
details: |-
  Bundle Contents: Scarlett 2i2 4th Gen audio interface, CM25 MkIII condenser microphone with pop filter, SH-450 closed-back studio headphones, USB Type-A to Type-C cable, and 3m XLR cable.

  The interface provides two ultra-low-noise preamps with up to 69 dB of gain, Auto Gain, Clip Safe, and Air modes (Presence and Harmonic Drive). 24-bit/192 kHz conversion. Includes the Hitmaker Expansion software bundle plus Ableton Live Lite, Pro Tools Intro+, and Cubase LE.
specs: |-
  - Bundle: Scarlett 2i2 4th Gen + CM25 MkIII mic + SH-450 headphones + cables
  - Microphone Preamps: 2
  - Preamp Gain Range: 69 dB
  - Max Sample Rate: 192 kHz
  - Bit Depth: 24-bit
  - A/D Dynamic Range: 120 dB (A-weighted)
  - Bus Power: USB 900 mA
  - Phantom Power: 48V
  - Features: Auto Gain, Clip Safe, Air (Presence & Harmonic Drive), Loopback
  - Interface dimensions: 180 mm (W) x 117 mm (D) x 47.5 mm (H)
  - Interface weight: 0.595 kg
  - Warranty: 3 years
  - Included Software: Ableton Live Lite, Pro Tools Intro+, Cubase LE, Hitmaker Expansion
