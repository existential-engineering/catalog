details: |-
  Engineered for vocalists with close mic technique, the OMX-M microphone features a robust all metal construction , a dynamic capsule for accurate vocal capture, and a unique identification ring.

  OMX-M features a tailored mid-range response that results in a desired extra presence in the vocals. The low end is slightly attenuated to reduce boominess and its mid-tight control provides excellent resilience from unwanted noise, both on stage and in the studio.

  OMX-M is part of the new generation of AUDIX's dynamic vocal microphones , featuring our proprietary VLM (very low mass) capsule technology and the new flat-top grille that intuitively guides towards correct positioning and technique.

  Designed and crafted in the USA.
