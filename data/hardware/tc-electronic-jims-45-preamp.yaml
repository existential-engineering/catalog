description: Dual-Channel Guitar Preamp Faithfully Recreates the Sound of a 1965
  45W PLEXI with Independent Channel Controls, Pre/Post Boost, Optional Cab Sim
  and Dedicated Outputs for DI and Headphones
details: |-
  Our passionate and guitar-playing team of engineers set out to faithfully recreate the original amp with the painstaking accuracy and attention to detail that only guitar players with actual hands-on experience with the original amp can achieve. At the heart of JIMS 45, our AMPWORX modeling technology works its magic, carefully recreating the classic guitar tone that’s the sum of each and every component from the circuit of the original. The result? The best and most precise digital amp modeling of this famous amp you have ever run your guitar through.

  We kept the control layout true to the original to not only give you authentic tone, but also a familiar look that makes you feel right at home right out of the box. From this classic starting point, you can go classic, modern or just downright nuts. It’s all up to you how you want to tweak JIMS 45, but rest assured that no matter what, you’ll be able to sculpt jaw-dropping guitar tones that are perfect for bending notes as well as minds.

  Obviously, the cab speaker is a key component of any combo – JIMS 45 is no exception! With today’s convolution-based IR technology it is possible to sample the past with great accuracy and authenticity. And we might have done exactly that, only someone else has specialized in this sonic art form – and who would be better at this than the company that has delivered cab speakers for countless classic guitar combos throughout music history: Celestion. After intensive testing, we decided to integrate the official impulse response of the beloved 4x12 G12M Creamback speaker cab. It truly is a tone match made in heaven.

  When you plug into JIMS 45 for the first time, it’s in the always-on Dual Channel mode. This means you toggle between a green and a red channel. The green channel models the original circuit with the master volume set at 12 ‘o’clock after the tonestack. And the red channel models the original amp’s stock circuit, which didn’t have a master volume control. If you press BOOST and CHANNEL at the same time, you will change to Bypass mode. Now, JIMS 45 simply works as a stompbox that you can punch in and out whenever you want. The channel that was selected when in Dual Channel mode is the one to be used if you switch to Bypass mode.

  The presence knob directly replicates the one in the original amp, varying the internal feedback in the power section, which gives you a fine control over its attack and overall clarity. This is a set-and-forget control, global for the pedal, so find the sweet spot that complements your rig, and you are all set.
