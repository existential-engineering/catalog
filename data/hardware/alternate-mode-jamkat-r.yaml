details: |-
  The JamKAT'R REQUIRES a DITI Trigger Interface for power and to communicate by MIDI with your favorite synth or DAW! Based on the original JamKAT, the JamKAT'R offers 7 more FSR trigger zones built on the neck of the instrument. The "banjo" style layout of the instrument when attached on a concert snare drum stand allows for easy access to playing the instrument standing up. The JamKAT'R plugs directly into the DITI MIDI Controller. Built in kits on the DITI allows the player to instantly enjoy the melodic and rhythmic possibilities that this combination offers. The JamKAT'R is the most powerful electronic hand drum 'banjo' hybrid ever created.
