description: The Empress ECM-519 (nicknamed the Empressor) is an all-analog
  feedback-FET compressor in an API 500-series 1U module. It pairs studio-grade
  dynamics control with a selectable output transformer, super-fast attack down
  to 50 microseconds, a mix knob for parallel compression, two auto modes with
  dual-detector sidechains, a sidechain high-pass filter, and stereo linking.
details: |-
  Empress set out to design a feedback-FET compressor with personality, one that can excel where plug-ins fall short and integrate seamlessly with a DAW to add analog warmth. Pleasing FET harmonic distortion plus transformer-saturation options add analog character, and the compressor is extremely versatile: great on aggressive time settings with lots of gain reduction, but also capable of being extremely transparent.

  Two auto modes engage two completely separate sidechain circuits, each using two detectors together (a fast, higher-threshold detector that reacts to peaks and a slower, lower-threshold detector that smooths the overall signal) for compression that isn't possible with conventional attack and release controls. True-bypass switching makes A/B comparisons against the original signal quick, and parallel compression is a knob twist away.

  The ECM-519 is an API 500-series 1U module (5.25" high, 1.5" wide) and mounts in any compatible 500-series rack. Audio in and out run through the standard 500-series edge connector; two units can be linked as a stereo pair using the rack's link pin or the supplied link cable.
specs: |-
  - All-analog feedback-FET compressor
  - API 500-series 1U module form factor
  - Selectable output transformer for added warmth and saturation
  - 3 ratios: 3:1, 6:1, 12:1
  - Super-fast attack down to 50 microseconds
  - Attack range (manual mode) 50us - 50ms, release range 50ms - 1s
  - Mix knob for parallel (New York style) compression
  - 10-segment LED gain-reduction meter
  - Sidechain high-pass filter at 120Hz or 220Hz
  - Two auto modes with separate dual-detector sidechains
  - Stereo link via rack link pin or supplied link cable
  - True bypass
  - Input impedance 48 kOhm, output impedance 50 Ohm (600 Ohm with transformer)
  - Frequency response (-3dB) 10Hz - 35kHz
  - Input and output level up to +22dBu
  - Power consumption 120mA per rail
  - Dimensions 5.25" (H) x 1.5" (W), API 500-series 1U module
