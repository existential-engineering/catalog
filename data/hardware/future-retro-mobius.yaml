description: >-
  The Future Retro Mobius is a versatile one-track hardware sequencer capable of controlling
  virtually any synthesizer or sound module through MIDI, CV/Gate, and DIN sync outputs, bridging
  vintage analog gear with modern MIDI equipment.
details: |-
  The Mobius was designed as a universal sequencer compatible with everything from rare vintage
  synthesizers to contemporary MIDI instruments. It provides a simple, intuitive drum machine-style
  programming interface and can operate as a real-time recorder, step sequencer, or MIDI-to-CV/Gate
  and DIN converter.

  Internal memory stores 256 patterns, each recording note duration, pitch, accent, glide, loop
  point, and time signature. Patterns can be edited on the fly using copy/paste, shifting,
  transposing, multiple pattern cueing, and LED chase visualization. Up to 16 songs can be
  assembled with a maximum of 3,580 measures per song. Offline storage is handled via MIDI System
  Exclusive dumps.

  The control output section is comprehensive, providing V/Oct CV out, Hz/V CV out, +12V gate out
  (switchable for positive or negative gate types), +12V trigger out, +5V accent out, +5V clock
  out for arpeggiators and analog sequencers, and +5V clock reset out. This range of outputs
  ensures compatibility with virtually any voltage-controlled instrument.

  MIDI connectivity includes full In/Out/Thru connections plus DIN Sync output for synchronizing
  early Roland TR and TB series devices with modern MIDI-based setups.
specs: |-
  - Patterns: 256
  - Songs: 16 (3,580 measures per song)
  - Outputs: V/Oct CV, Hz/V CV, +12V gate, +12V trigger, +5V accent, +5V clock, +5V clock reset
  - Control: MIDI In/Out/Thru, DIN Sync out, CV/Gate
  - Storage: MIDI System Exclusive dumps
  - Date produced: 2001
releaseDate: "2001"
releaseDateYearOnly: true
