description: >-
  The Future Retro Mobius is a versatile single-track hardware sequencer capable
  of controlling virtually any synthesizer or sound module through MIDI,
  CV/Gate, and DIN sync outputs. It bridges vintage analog gear with modern MIDI
  equipment, functioning as a step sequencer, real-time recorder, or
  MIDI-to-CV/Gate converter. The 3U rack module can also be converted to a
  desktop unit with an optional attachment.
details: |-
  The Mobius was designed as a universal sequencer compatible with everything from rare vintage synthesizers to contemporary MIDI instruments. It provides a simple, intuitive drum machine-style programming interface and can operate as a real-time recorder, step sequencer, or MIDI-to-CV/Gate and DIN converter.

  Internal memory stores 256 patterns, each recording note duration, pitch, accent, glide, loop point, and time signature. Patterns can be edited on the fly using copy/paste, shifting, transposing, multiple pattern cueing, and LED chase visualization. Up to 16 songs can be assembled with a maximum of 3,580 measures per song. Offline storage is handled via MIDI System Exclusive dumps.

  The control output section is comprehensive, providing V/Oct CV out, Hz/V CV out, +12V gate out (switchable for positive or negative gate types), +12V trigger out, +5V accent out, +5V clock out for arpeggiators and analog sequencers, and +5V clock reset out. This range of outputs ensures compatibility with virtually any voltage-controlled instrument, including accurate control of the TB-303 and similar analog devices.

  MIDI connectivity includes full In/Out/Thru connections plus DIN Sync output for synchronizing early Roland TR and TB series devices with modern MIDI-based setups. Patterns are interchangeable with the Future Retro FR-777 model.
specs: |-
  - Patterns: 256
  - Songs: 16 (up to 3,580 measures per song)
  - Outputs: V/Oct CV, Hz/V CV, +12V gate (switchable polarity), +12V trigger, +5V accent, +5V clock, +5V clock reset
  - MIDI: In/Out/Thru
  - Sync: DIN Sync out
  - Storage: MIDI System Exclusive dumps
  - Form factor: 3U rack mount (optional desktop conversion kit available)
releaseDate: "2001"
