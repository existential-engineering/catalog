details: |-
  8 Fader Remote Controller. IP8 is a remote controller with 8 motorised faders designed for install and live sound applications.

  Motorised Faders — the 8 motorised faders can be configured to control levels, sends and pans.

  Assignable SoftKeys — 23 assignable SoftKeys deliver a comprehensive level of control for the user.

  Power Options — the IP8 ships with a 12V PSU and also supports PoE.

  Freestanding or Mounted — the optional wall mount bracket (IP8-MOUNT) allows the IP8 to be installed for permanent installations; can be used freestanding or mounted in a plinth, podium or furniture.

  Live — Surfaceless Mixing: teamed up with a dLive MixRack and a laptop running Director software, IP8 is ideal for adding hands-on control to an ultra-compact dLive setup, such as a monitor rig for fly-in dates.

  Install — designed for permanent installations, the IP8 provides hands-on control where it's needed in venues, conference rooms and multi-purpose spaces.

  Connect — IP8 interfaces with the AHM, Avantis or dLive mixing system via standard TCP/IP Network connections and can be networked with other controllers, computers and third party devices using a standard Ethernet infrastructure.

  Configure — the IP8's controls and functions are configured using AHM System Manager, Avantis Director or dLive Director software (PC or Mac), or via an Avantis mixer or dLive Surface.

  System Design — Mix and Match: multiple IP Controllers can be connected to an AHM, dLive or Avantis system to provide control exactly where needed. Use IP controllers of different flavors to suit the needs of your end users, even letting one controller change what other controllers are doing to reflect changes in the space.

  Features summary: 8 motorised faders; 23 assignable SoftKeys; 6 layers; PoE or external 12V PSU (supplied); freestanding, plinth/podium/furniture mountable, or wall-mountable via optional IP8-MOUNT bracket.
