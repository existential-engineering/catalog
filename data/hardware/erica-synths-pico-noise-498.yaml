url: https://www.ericasynths.lv/pico-noise-498/
description: Pico NOISE is a versatile noise and percussion sounds source. It
  consists of white a noise generator, a resonant VCF to generate various
  colours of the noise – from extremely dark ones to high pitched resonant
  sweeps and a VCA/decay envelope generator combination to create range of
  percussion sounds to emulate hi-hats, cymbals and even sine tone-based
  percussions, when the resonance is full up.
details: |-
  Pico NOISE is a noise and percussion source built around three stages in 3HP. A white noise generator feeds a resonant VCF, which colours the noise anywhere from extremely dark to high pitched resonant sweeps.

  After the filter sits a VCA and decay envelope combination, which is what turns the noise into percussion. The range runs from hi-hats and cymbals through to sine tone based percussion once the resonance is turned full up.

  The decay envelope reaches a maximum of 350ms and the output swings from -5V to +5V. Both the input and the output are protected against overvoltage, and the module is protected against a reverse PSU connection.

  The panel is 3HP wide and the module is 35mm deep.
specs: |-
  - White noise generator
  - Resonant VCF for coloured noise
  - VCA and decay envelope combo for percussion sounds
  - Output amplitude -5V to +5V
  - Max decay time 350ms
  - Input and output protection against overvoltage
  - Protection against reverse PSU connection
  - Power consumption +27mA, -25mA
  - Module width 3HP
  - Module depth 35mm
