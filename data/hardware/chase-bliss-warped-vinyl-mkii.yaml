description: An analog vibrato and chorus pedal originally conceived to simulate
  the effect of a warped vinyl record. Features an all-analog signal path with
  digital control over every knob and switch.
details: |-
  Warped Vinyl MkII is an analog vibrato and chorus pedal originally conceived to simulate the effect of a warped vinyl record. The all-analog signal path ensures your guitar signal stays 100% analog and never gets digitally processed.

  Every knob and switch is connected to a digital brain, enabling unprecedented effects, preset recall, and MIDI control in an analog stompbox.

  The MkII version features an improved tone knob for shimmery, transparent vibrato/chorus and an increased signal-to-noise ratio compared to the original.
specs: |-
  - All-analog signal path with digital control
  - True pitch analog vibrato/chorus
  - Tone knob for transparent sounds
  - Improved signal-to-noise ratio
  - Mono I/O
  - MIDI controllable
  - Preset recall
