description: The DSL1 Combo is an all-valve 1W guitar amplifier combo from
  Marshall's DSL range, designed to deliver authentic British tone at low
  volumes suited to home practice, studio recording and small venues. A power
  reduction switch drops output from 1W down to 0.1W, while two footswitchable
  gain channels (Classic Gain and Ultra Gain) cover bright shimmering cleans
  through to punchy, aggressive high-gain tones. The amp features a shared
  three-band EQ, a Tone Shift voicing switch, on-board digital reverb and a
  series effects loop. Round-back amenities include a 3.5mm aux input for
  jamming along with music, a 3.5mm emulated line out for silent recording or
  headphones, and an 8" Celestion G8C-15 'Eight-15' speaker that delivers a
  surprising amount of Marshall character for its size.
