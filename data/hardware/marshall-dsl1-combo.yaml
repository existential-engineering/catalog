description: The DSL1 Combo is an all-valve 1W guitar amplifier combo from
  Marshall's DSL range, designed to deliver authentic British tone at low
  volumes suited to home practice, studio recording and small venues. A power
  reduction switch drops output from 1W down to 0.1W, while two footswitchable
  gain channels (Classic Gain and Ultra Gain) cover bright shimmering cleans
  through to punchy, aggressive high-gain tones. The amp features a shared
  three-band EQ, a Tone Shift voicing switch, on-board digital reverb and a
  series effects loop. Round-back amenities include a 3.5mm aux input for
  jamming along with music, a 3.5mm emulated line out for silent recording or
  headphones, and an 8" Celestion G8C-15 'Eight-15' speaker that delivers a
  surprising amount of Marshall character for its size.
details: |-
  From bright, shimmering clean tones to punchy, aggressive gain, the DSL1 combo has the features to provide a sound that suits you. Packed with the features and classic Marshall tone that is expected from the rest of the DSL series, all in a compact and portable format, perfect for bedroom players.

  The DSL1 Combo is engineered to deliver a great sound at every level, so you can pick the power setting that is right for you. Opt for either 1W or a more subdued 0.1W power output with a simple flick of a switch. Ideal for seamlessly transitioning between the studio and the privacy of your bedroom.

  The Celestion G8C-15 "Eight-15" speaker offers authentic British tone and well-balanced sound, providing strong mids, highs and powerful bass. Using this speaker inside the DSL1 Combo adds extra depth and punch to your tone.

  It features two gain channels, ultra gain and classic gain, that can be effortlessly controlled via footswitch. Dive into sonic experimentation by seamlessly going from ultra-clean tones to heavy distortion and exploring all the nuances in between.

  This conveniently sized amplifier lets you put on a show in both home settings and on-the-go scenarios such as band practices. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Model: DSL1CR
  - Range: DSL
  - Technology: All-valve
  - Channels: 2
  - Output wattage: 1W with optional power reduction to 0.1W
  - Outputs: 1 x 1/4" jack speaker output (16Ω load only), 1 x 3.5mm jack emulated line out
  - Inputs: 1 x 1/4" instrument jack, 1 x 3.5mm jack aux in, footswitch
  - Controls: Classic gain channel volume, channel select switch, ultra gain channel gain and volume, tone shift switch, treble, middle, bass, reverb
  - Effects: Digital reverb
  - Effects loop: Yes, 1 x series
  - Speaker configuration: 1x8"
  - Speaker model: Celestion G8C-15 "Eight-15" (15w, 16Ω)
  - Unit impedance: 16Ω
  - Preamp valves: 2 x ECC83
  - Power amp valves: 1 x ECC82
  - Weight: 7.9 kg / 17 lb
  - Width: 360 mm / 14.2"
  - Height: 340 mm / 13.4"
  - Depth: 215 mm / 8.5"
  - Country of origin: Designed and engineered in UK. Made in Vietnam.
  - Box contents: PEDL-90011 footswitch included, detachable power cable included
