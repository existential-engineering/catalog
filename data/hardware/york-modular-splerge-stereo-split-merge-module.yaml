description: A 2HP module that splits a stereo TRS signal into two mono signals,
  or merges two mono signals into a stereo TRS output.
details: |-
  SPLERGE - a silly name for a (hopefully) serious module. Well, semi-serious at least. It's the first in a series of stereo-oriented modules that I have lined up over the next few months. It stands for SPL it-m ERGE and does exactly what it suggests - it can take a stereo signal (via a TRS cable) and split it into a pair of mono signals, with left and right channels having their own outputs, or it can merge a pair of mono signals into a stereo signal to be delivered via the aforementioned TRS cable. It splits/merges the signal, and nothing else - if you want to do stuff like panning and whatnot then you'll need a separate module to take care of that (or I could build you one - custom orders are still a thing)

  In terms of routing, the jacks are wired thus:

  In this incarnation I've gone with one split and one merge channel per module - if there's demand I can look at doing 2x split and/or 2x merge (or even more)

  2HP wide.
specs: |-
  - Stereo in (TRS) -> mono right (R) + mono left (T); the sleeve is grounded
  - Mono left in + mono right in -> Stereo right (R), stereo left (T); the sleeve is grounded
