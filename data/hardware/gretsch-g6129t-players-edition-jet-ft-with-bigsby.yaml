details: |-
  For 65 years the Gretsch Jet has fueled stages and studios, producing some of the greatest sounds in rock 'n' roll history. The all-new G6129T Players Edition Jet FT with Bigsby is the culmination of over half a century of tonal and performance magic.

  Like its forebears, the Jet FT begins with a select mahogany body with maple top that produces the signature strong, punchy response that has made the Jet famous. For the Players Edition Jet FT, we chose a 1.85" depth along with modern chambering to deliver a tighter, more controlled attack that still retains incredible articulation.

  A pair of High Sensitive Filter'Tron pickups complements the Jet FT's chambered body to produce a wide, balanced and transparent tone.
