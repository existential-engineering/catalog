url: https://intellijel.com/shop/eurorack/1u/audio-io-jacks-1u/
description: TRS jacks for interfacing external 1/4" equipment with the Audio
  I/O 1U module. Our 7U cases have the 1/4" TRS jacks built-in, this 1U Jacks
  module is for the rest of you.
details: |-
  This module adds two pairs (one pair for input and one pair for output) of Tip-Ring-Sleeve (TRS) jacks to the Audio I/O 1U module, allowing you to connect your modular system directly to traditional 1/4″ audio equipment.

  This module is not needed if you have the Intellijel 7U performance case, since that case comes with the rear mounted audio I/O jacks.
specs: |-
  - Width: 16HP
  - Depth: 38mm
  - Power: Passive
  - Connects 1/4″ TRS line level signals to your system via the Audio I/O 1U module
