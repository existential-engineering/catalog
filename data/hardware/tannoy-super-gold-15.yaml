details: |-
  The Super Gold 15 (SGM-15) is a 2-way floorstanding passive loudspeaker featuring Tannoy's 15" Dual Concentric driver. The woofer and tweeter share the same axis for point-source imaging, wide sweet spot, and consistent off-axis response. A three-way front-panel energy control system (treble roll-off, treble energy, presence energy) allows in-room tuning. Front-firing triple bass ports enable flexible placement. Five 4 mm 24ct gold-plated binding posts support bi-wiring.
specs: |-
  - frequencyResponse: 35 Hz - 30 kHz ± 6 dB
  - sensitivity: 93 dB (1 W @ 1 m)
  - impedance: 8 Ω
  - powerHandlingContinuous: 150 W
  - powerHandlingPeak: 600 W
  - recommendedAmplifierPower: 20-300 W
  - crossoverFrequency: 1.1 kHz
  - lowFrequencyDriver: 15" paper pulp cone, 52 mm edge-wound voice coil
  - highFrequencyDriver: 1.3" aluminium/magnesium alloy dome
  - dimensionsHWD: 650.2 x 424.9 x 1033.5 mm
  - netWeight: 50 kg
