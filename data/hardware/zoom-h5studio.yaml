description: Delivering the highest standard of audio for pro creators, the
  H5studio Handy Recorder features large-diameter mics, studio-grade preamps,
  and 32-bit float.
details: |-
  The H5studio was made for seamless and professional production. Creators can record flawless audio with stunningly clear microphones, studio-grade preamps and 32-bit float recording.

  The 19.4 mm microphones are the largest ever fitted to a Handy Recorder, capturing audio with incredible frequency response, 140 dB maximum SPL and 123 dB of dynamic range. The inputs carry F-Series preamps for clarity at -127 dBu equivalent input noise, and with dual A/D converters and 32-bit float they deliver 132 dB of dynamic range. Carefully engineered RF shielding keeps interference from smartphones and Wi-Fi routers out of recordings, and advanced look-ahead limiters anticipate potential overloads before distortion reaches the track.

  Sample rates run from 44.1 to 192 kHz, and the H5studio captures up to 6 tracks at once, 4 individual tracks plus a stereo mix (the stereo mix is available at 96 kHz and below). 32-bit float prevents clipping but calls for post-production, while 16/24-bit needs gain adjustment instead. The H5studio offers both, pairing 32-bit float with dedicated gain knobs.

  Two locking XLR/TRS inputs support +48 V phantom power and +4 dBu line level, alongside a 3.5 mm stereo jack with plug-in power. Outputs are a loud 20 mW headphone out, a 3.5 mm stereo LINE OUT for connecting straight to a camera, and a built-in speaker with 250 mW maximum output for previewing takes on the spot. Input levels and real-time waveforms are monitored on the full-color LCD.

  The 3.0 capsule system supports 32-bit float and is compatible with the SSH-6e, EXH-6e and XYH-6e. The H5studio is also a 4-in/2-out USB audio interface for Mac, Windows, iOS and Android, able to stream live while recording a backup to microSD. It runs on 4 AA alkaline batteries for up to 15 hours or from USB power, stores to microSDHC/microSDXC cards up to 2TB, and navigates its menus with audible descriptions for blind and visually impaired users.
specs: |-
  - Up to 6 simultaneous recording tracks and 4 simultaneous playback tracks
  - Recording formats: WAV at 44.1/48/96/192 kHz, 16-bit, 24-bit or 32-bit float, mono or stereo, BWF and iXML supported
  - Recording media: microSDHC and microSDXC cards up to 2TB
  - XY mic capsule (XYH-5s): 90 degree XY stereo format, unidirectional pickup pattern, -41 dB/Pa at 1 kHz sensitivity, 140 dB SPL maximum sound pressure input
  - MIC/LINE IN on the capsule: 1 stereo mini jack, 2.5 V plug-in power, input gain -inf to +60 dB, input impedance 2 kohms or more
  - MIC/LINE inputs: 2 XLR/TRS combo jacks (XLR 2 hot, TRS tip hot), input gain -inf to +60 dB, input impedance 3 kohms or more, maximum input +4 dBu (mic) and +24 dBu (line), +48 V phantom power, equivalent input noise -127 dBu or less (IHF-A) at 150 ohm input
  - LINE OUT: 1 stereo mini jack, maximum output level +1 dBu, output impedance 110 ohms or less
  - Headphone out: 1 stereo mini jack, maximum output 20 mW + 20 mW into a 32 ohm load, output impedance 10 ohms or less
  - Built-in mono speaker: 20 mm x 30 mm elliptical dynamic, 250 mW effective maximum output
  - Display: 2.00 inch full-color LCD, 320 x 240
  - USB: USB Type-C connector, USB 2.0 High Speed for audio interface and file transfer
  - Audio interface: 4 in / 2 out (multi) or 2 in / 2 out (stereo), 44.1/48/96 kHz interface only, 44.1/48 kHz with onboard recording, 24-bit and 32-bit float
  - Remote: dedicated ZOOM BTA-1 wireless adapter
  - Power: 4 AA alkaline, lithium or rechargeable NiMH batteries, USB bus power, or the ZOOM AD-17 AC adapter (DC 5 V/1 A)
  - Battery life on alkalines: about 15 hours 2-track, about 6 hours 4-track at 48 kHz
  - Maximum power consumption: 5 W
  - Dimensions: 86.0 mm (W) x 206.0 mm (D) x 54.6 mm (H)
  - Weight: 410 g including batteries
  - Advanced look-ahead limiters and a low-cut filter to suppress low-frequency noise
  - Compatible with Zoom capsule system 3.0 (SSH-6e, EXH-6e, XYH-6e)
  - Timecode generation and jam sync via the TCA-1 adapter, wireless timecode from the ATOMOS UltraSync BLUE with the BTA-1
  - Mono mode for interviews, narration and vocals
  - Variable speed playback from 0.5x to 2.0x, A-B repeat playback, normalize and export to 24-bit or 16-bit WAV
  - Recording start tone function for aligning audio with DSLR video
  - Accessibility guide sound in English, Spanish, French, Japanese, German, Italian or Chinese
