description: A faithful reissue of the legendary 18-watt 1974 combo, handwired
  at Marshall's Bletchley, England facility. Delivering the unmistakable vintage
  tones that shaped the landscape of rock music for decades, the 1974X pairs a
  single 12-inch Celestion G12M-20 Greenback speaker with two voices and an
  analogue tremolo circuit for authentic period character. Expertly crafted with
  classic Marshall touches, it captures the rich, dynamic response of the
  original 1960s 1974 combo.
