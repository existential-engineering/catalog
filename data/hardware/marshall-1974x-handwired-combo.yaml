specs: |-
  - Output Wattage: 18W
  - Channels: 2 voices (Normal and Tremolo)
  - Controls: VOLUME I (Normal), VOLUME II (Tremolo), TONE, TREMOLO SPEED, TREMOLO INTENSITY, POWER, STANDBY
  - Inputs: 4 x 1/4" jack instrument inputs (2 per channel: high/low sensitivity)
  - Outputs: 1 x 1/4" jack speaker output (8Ω)
  - Effects: Analogue tremolo circuit (channel 2 only)
  - Footswitch: Yes, 1/4" jack (tremolo on/off)
  - Speaker Config: 1 x 12"
  - Speaker Model: Celestion G12M-20 Greenback (20W)
  - Color: Black
