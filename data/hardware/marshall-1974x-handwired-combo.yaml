description: A faithful reissue of the legendary 18-watt 1974 combo, handwired at Marshall's Bletchley, England facility. Delivering the unmistakable vintage tones that shaped the landscape of rock music for decades, the 1974X pairs a single 12-inch Celestion G12M-20 Greenback speaker with two voices and an analogue tremolo circuit for authentic period character. Expertly crafted with classic Marshall touches, it captures the rich, dynamic response of the original 1960s 1974 combo.
details: |-
  Just like the original, the 1974X Handwired Combo is valve driven, hand soldered, with an aluminium chassis, and has a Tremolo circuit. The special 12-inch Celestion G12M-20 Greenback in this amp has been aged to get as close as possible to that vintage, worn in sound of the 1974.

  Expertly crafted and handwired at our factory in Bletchley, England, the 1974X Handwired Combo effortlessly captures the Marshall spirit. It features all the classic touches you have come to expect from us over the years.

  Classics are classics for a reason. The 1974X Handwired Combo incorporates an analogue tremolo circuit. Despite the advantages of digital effects in certain applications, many guitar players still favour the analogue tremolo for its vintage sound, providing a timeless appeal.

  The G12M Greenback speaker has undergone some changes over time, but it has always managed to keep its highly sought-after sound. The 20W version of this speaker has a bold mid-range and tight high-end, giving it aggressive tones for chords and searing leads. It is perfect for bringing drive and clarity to modern high gain amps.

  Unlock the legendary power of Marshall's iconic sound with the 1974X Handwired Combo. Create your own sound by blending the two voices. Designed and engineered in UK. Made in UK.
specs: |-
  - Output wattage: 18W
  - Outputs: 2 x 1/4-inch jack speaker outputs, selectable 16 ohm / 8 ohm / 4 ohm load
  - Inputs: 4 x 1/4-inch jack instrument inputs (high/low sensitivity)
  - Controls: Channel 2 (Volume, Tone), Channel 1 (Volume, Tone, Tremolo Intensity, Tremolo Speed)
  - Effects: valve tremolo
  - Effects loop: no
  - Speaker configuration: 1 x 12-inch
  - Speaker model: Celestion Heritage G12M-20 (15 ohm, 20W)
  - Unit impedance: 15 ohm
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL84
  - Weight: 19 kg / 42 lb
  - Width: 610 mm / 24 inches
  - Height: 535 mm / 21.1 inches
  - Depth: 230 mm / 9.1 inches
  - Country of origin: designed and engineered in UK, made in UK
  - In the box: PEDL-10034 footswitch, detachable power cable
  - Colour: Black
