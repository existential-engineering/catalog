description: Mackie SR18S 18" 1600W professional powered subwoofer designed for
  working musicians, DJs, events, and venues, with selectable voicing modes and
  a variable crossover.
details: |-
  The SR18S 18” 1600W Professional Powered Subwoofer is designed for real-world working musicians, DJs, events, venues, and beyond. The latest acoustic processing technology, powerful amplification, and versatile configurations deliver incredible sound and unbeatable reliability while selectable voicing modes and a variable crossover make optimization for your system easy. Built-Like-A-Tank construction features a rugged wood cabinet and tough steel grille that is built to last.

  A perfect complement to the SRT Series, SRM | V-Class Series or any PA, SR18S not only adds powerful low end, but allows for a massive increase in efficiency and output for your whole system.

  When operating at very high levels, the processor-controlled system monitoring analyzes the audio signal and identifies the problem areas, then dynamically applies multi-band compression to those specific frequencies rather than lowering the overall output. This keeps levels where you want them and maintains sound quality.

  Three custom voicing presets are provided: Flat for a natural balance between deep bass and overall output, Deep to emphasise ultra-low frequencies for dance, rap and electronic music, and Punch to prioritise the highest possible output level for bands and rock music.
specs: |-
  - 1600W Class-D amplifier
  - Custom high-efficiency transducer
  - Frequency response: 33Hz - 200Hz
  - Max SPL: 133 dB
  - Voicing presets: Flat, Deep, Punch
  - Variable crossover frequency
  - Polarity invert switch
  - Defeatable front LED
  - Stereo or mono-summing for single or dual subwoofer deployment
  - Variable level control (-6dBU to +6dBU)
  - Dedicated processing module monitors and protects the amplifier in real time
  - Universal Power Supply (100-240VAC) with Power Factor Correction
  - Integrated M20 threaded pole cup
  - Weight: 74.5 lb / 33.8 kg
  - Dimensions: 23.3 x 23.0 x 27.0 in / 592 x 584 x 686 mm
