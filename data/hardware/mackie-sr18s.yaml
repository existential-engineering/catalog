description: 'Mackie SR18S 18" 1600W professional powered subwoofer designed for
  working musicians, DJs, events, and venues, with selectable voicing modes and
  a variable crossover.'
details: |-
  The SR18S 18" 1600W Professional Powered Subwoofer is designed for real-world working musicians, DJs, events, venues, and beyond. The latest acoustic processing technology, powerful amplification, and versatile configurations deliver incredible sound and unbeatable reliability while selectable voicing modes and a variable crossover makes optimization for your system easy. Built-Like-A-Tank construction features a rugged wood cabinet and tough steel grille that is built to last.

  A perfect complement to the SRT Series, SRM | V-Class Series or any PA, SR18S not only adds powerful low end, but allows for a massive increase in efficiency and output for your whole system.

  Transparent limiting technology analyzes the audio signal and identifies the problem areas, then dynamically applies multi-band compression to those specific frequencies rather than lowering the overall output.
specs: |-
  - 1600W Class-D amplifier
  - Custom high-efficiency transducer
  - Frequency response: 33Hz - 200Hz
  - Max SPL: 133 dB
  - Selectable voicing presets: Flat, Deep, Punch
  - Variable crossover
  - Integrated M20 threaded pole cup
  - Built-Like-A-Tank rugged wood cabinet with steel grille
  - Weight: 74.5 lb / 33.8 kg
  - Dimensions: 23.3 x 23.0 x 27.0 in / 592 x 584 x 686 mm
