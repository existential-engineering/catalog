description: >-
  The Ensoniq Halo is a 64-voice performance keyboard featuring 32 MB of ROM sounds including the
  acclaimed Perfect Piano, with three expansion slots for up to 128 MB total. Designed for live
  use, it offers 16 real-time controllers, programmable arpeggiators, and E-mu's Super BEATS
  interactive Groove Mode.
details: |-
  The Halo was part of a new line of performance keyboards launched by E-mu/Ensoniq that
  repackaged their top-tier sound modules into genre-targeted keyboard instruments. It shipped
  with the ZR/Perfect Piano sound set and offered three additional ROM slots for significant
  sound expansion.

  With 64 voices of polyphony and 1,152 presets (640 ROM plus 512 RAM), the Halo provided a
  substantial palette of sounds out of the box. The 50 types of 6th and 12th-order Z-plane
  filters gave each preset deep timbral shaping possibilities, going well beyond basic lowpass
  filtering.

  The performance-oriented design included 16 syncable and programmable arpeggiators, 16
  mute/enable buttons for on-the-fly arrangement, and a full complement of real-time controllers.
  The 24-bit dual stereo effects processor covered reverbs, delays, chorus, flange, and
  distortion across multiple algorithm types.

  Built around a 61-key velocity and aftertouch-sensitive keyboard, the Halo targeted working
  musicians who needed reliable, high-quality sounds with immediate hands-on control at an
  accessible price point.
specs: |-
  - Polyphony: 64 voices
  - Oscillators: 32 MB ZR/Perfect Piano sound set ROM, expandable to 128 MB, four 24-bit DACs
  - LFO: 2 per voice
  - Filter: 50 types of 6th- and 12th-order Z-plane filters
  - Effects: 24-bit dual stereo processor (29 reverbs, 15 delays, 8 chorus, 7 flange, 5 distortion)
  - Keyboard: 61 keys with velocity and aftertouch
  - Memory: 1,152 presets (640 ROM, 512 RAM)
  - Control: MIDI
