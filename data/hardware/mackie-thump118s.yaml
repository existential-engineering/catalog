description: 18" 1400W Powered Subwoofer. The Best Got Better.
details: |-
  Welcome to the world of Thump, where rumble rules and the music doesn't stop till you say so. Before you get the party started, equip your system with a subwoofer that can keep up. Thump118S brings 1400W of raw wall-shaking power to your system with selectable voicing modes and a variable crossover to make optimization easy.

  Stereo inputs plus High-Pass and Full-Range outputs offer plenty of configuration flexibility and integrated top corner handles are our most ergonomic design yet.

  So grab one (or two, or three) and take your PA system to the next level, the Thump level. Thump118S is a seriously great choice for DJs, Bands, Clubs, Houses of Worship, and more.
specs: |-
  - 1400W Class-D amplifier
  - 18" High-performance woofer
  - Frequency response: 30Hz - 200Hz
  - Max SPL: 132 dB
  - Weight: 65.5 lb / 29.71 kg
  - Dimensions: 21.3 x 20.9 x 23.9 in / 541 x 531 x 607 mm (HxWxD)
  - Voicing modes (Flat, Deep, Punch, Variable)
  - Polarity invert switch
  - Variable level control (-6dBU to +6dBU)
  - Integrated M20-threaded pole mount
