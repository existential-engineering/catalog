description: The Tone Pocket is a compact bass headphone amplifier for home
  practice, studio recording, and stage use. It features a 3-band EQ with
  +/-15dB per band, a line input for a phone or music player, a mini USB 2.0
  audio output for latency-free recording into a DAW, and a balanced line out to
  an amp or PA.
details: |-
  The Tone Pocket is a bass headphone amplifier that is small in size but built for home practice, studio recording and stage use. A 3-band EQ offers +/-15dB on each band to sculpt bass tone, and a line input connects a smartphone or music player. Analogue-to-digital conversion through the mini USB 2.0 output allows latency-free recording directly into a DAW at 48K/44.1KHz for both playback and recording, and a balanced line out connects directly to an amplifier or PA. It is powered by a 9V rechargeable battery giving approximately 2 hours of playtime, and the USB socket doubles as a charger for desktop use. The chassis measures 25mm (H) x 108mm (W) x 108mm (D) in lightweight black anodized alloy.
specs: |-
  - EQ: 3-band, +/-15dB per band
  - Line input for smartphone / music player
  - USB output: mini USB 2.0, analogue-to-digital conversion for DAW recording
  - Sampling rate: 48K / 44.1KHz playback and recording
  - Balanced line output to amp or PA
  - Power: 9V rechargeable battery, approx. 2 hours playtime, USB charging
  - Dimensions: 25mm (H) x 108mm (W) x 108mm (D)
  - Construction: black anodized alloy
  - Colours: black, white
