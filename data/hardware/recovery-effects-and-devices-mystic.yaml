details: |-
  MYSTIC (Original Prototype FM Drone Noise Synth)

  Recovery 4112 – Rare One-Off FM Drone Synth

  This is a unique, one-off build and an early predecessor to the Mystic and Instrument 01. It shares the same FM synth engine, producing rich, evolving tones, from growls and sweeping textures to cascading atmospherics. This version is fully hand-wired and housed in a one-of-a-kind enclosure. A raw, experimental take on the design, this piece sits closer to the original concept than the refined production versions of Mystic and Instrument 01. Details:

  Note: Video shown is of the Mystic, which is very similar in sound and function.
