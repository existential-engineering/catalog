details: |-
  Amped-up

  This version of the Silvertone Model 1449 features with significant performance upgrades while preserving its vintage charm. Inspired by the classic 1962 "Amp in Case" Model 1448, this two-pickup design remains a favorite of artists like Neil Young and Beck. Featuring a solid mahogany body joined to a smooth, soft "C" shaped mahogany neck with a 24 ¾" scale length, the Model 1449 offers comfortable playability. Its rosewood fingerboard has a 12-inch radius and is fitted with new Semi-Hemispherical frets, providing a faster, smoother feel across the neck. Neck adjustments are made easy thanks to a convenient spoke wheel truss rod. The fingerboard is adorned with pearloid dot inlays and paired with Kluson vintage-style tuners to complete the classic look. The guitar's electronics maintain their vintage mojo with custom-wound Silvertone "Lipstick" single-coil pickups featuring vintage-correct Alnico 6 magnets. The neck pickup is reverse wound and reverse polarity, enabling hum-cancelling operation when both pickups are used. The bridge pickup has a slightly higher output to perfectly balance the tone. Controls include a three-way switch, one volume, and one tone knob, all topped with custom retro "barrel" knobs that capture Silvertone's unique vintage vibe. For precise intonation, the Model 1449 features an upgraded bridge with independently adjustable solid brass saddles, allowing for professional setup and tuning stability. Combining iconic style with modern refinements, the new Silvertone Model 1449 delivers classic jangly tones and exceptional playability—making it the perfect instrument for the stage, studio, or home. Specs

