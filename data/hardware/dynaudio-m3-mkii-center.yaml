description: In essence, M3 MkII Center shares the same impressive
  specifications as M3 MkII.
details: |-
  Own the middle ground and nail the dialogue every time. The M3 MkII Center shares the same impressive specifications as the M3 MkII but is designed for horizontal positioning at the center of surround or immersive production environments.

  It sits comfortably between other M3 MkII speakers and helps make the always-critical dialogue sit perfectly in the mix, ensuring speech intelligibility for your clients every time.

  M3 MkII Center is the result of a painstaking research and development process aimed at elevating main monitors, featuring a pair of 300mm low-frequency MSP (Magnesium Silicate Polymer) drive units and two 150mm midrange units. The high end of the frequency spectrum is handled by a high-power Esotar3 dome tweeter, also present in Dynaudio's award-winning high-performance home and theatre systems.

  The result is an exceptionally clean, dynamic and powerful speaker in which common problems such as cone break-up, thermal compression and phase misalignment have been eliminated. Frequency response is full and flat, and the system's transparency truly advances the art of monitoring at high levels without sacrificing quality.
specs: |-
  - Status: Current
  - Segment: Pro
  - Series: Dynaudio Acoustics
  - Application: Music and post-production
  - Type: 3-way hybrid
  - Frequency response: 35Hz – 20kHz
  - Maximum SPL at 2 metres: 123dB stereo
  - Crossover frequencies: 400Hz and 3900Hz
  - Total harmonic distortion: 1% at 90dB
  - Recommended amplifier power: Two channels: 500-1000W/channel per speaker
  - High frequency driver: Esotar3
  - Midrange driver: 2x 15cm MSP
  - Low frequency driver: 2x 30cm MSP
  - Amplifier recommendation: Dynaudio Acoustics DA40 DSP, DCA800 (with filters)
  - Cabinet dimensions (H x W x D): 570 x 912 x 390 mm
  - Weight: 64 kg
  - Finish: Black textured paint
  - Optional hardwood cabinets: Oak, cherry, walnut, maple
  - Custom cabinet sizes: On request
