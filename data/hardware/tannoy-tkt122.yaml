details: |-
  The TKT122 is a 2,000-Watt 12" 2-way full range loudspeaker designed for KTV applications. Trapezoidal cabinet shape accommodates industry standard mounting brackets. Features a 12" low frequency driver with low mass voice coil and a PEN dome 1" ferrite motor compression driver on a 70° horizontal by 70° vertical low distortion waveguide. High-precision passive crossover network optimized for midrange vocal region. Rear panel carries industry-standard twist-locking speaker and screw terminal barrier strip connectors.
specs: |-
  - powerHandling: 2000 W
  - woofer: 12" low frequency driver, low mass voice coil
  - tweeter: PEN dome 1" ferrite motor compression driver
  - waveguide: 70° horizontal x 70° vertical
  - cabinetConstruction: 15 mm birch plywood, trapezoidal
  - mounting: 35 mm pole mount, integral carry handle, internal rigging points
