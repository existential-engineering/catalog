description: Smooth DJ style VCF.
details: |-
  As its name suggests, the Erica Synths Black DJ VCF provides sound treatment functionality typically found on DJ decks. It is fully open when the cutoff knob is set to 12:00. Turned counter-clockwise, lowpass filtering is applied, and turned clockwise, highpass filtering is applied. The filter also has a nice-sounding resonance parameter.

  This module provides hands-on control over the sound during a performance, as well as unconventional timbre modulations that are hard to achieve with conventional state variable filters.

  The Black DJ VCF is a fully analogue design and consists of two VCFs, highpass and lowpass in series, with the filter management done by complex CV routing. A cutoff CV attenuverter and attenuator shape incoming modulation, and inputs and outputs are protected against undesired overvoltage.

  Audio level is 10V peak to peak, CV level covers -10V to +10V and the filter slope is 24dB/oct. The module is 10HP wide and 35mm deep, drawing +55mA and -58mA.
specs: |-
  - Fully analogue DJ-style VCF
  - Two VCFs, highpass and lowpass in series, managed by complex CV routing
  - Manual resonance control
  - Cutoff CV attenuverter and attenuator
  - Input and output
  - Protection against undesired overvoltage
  - Audio level 10Vptp
  - CV level -10V - +10V
  - Filter slope 24dB/oct
  - Power consumption +55mA, -58mA
  - Module width 10HP
  - Module depth 35mm
