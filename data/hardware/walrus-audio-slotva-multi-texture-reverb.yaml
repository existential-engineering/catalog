url: https://www.walrusaudio.com/products/slotva-multi-texture-reverb
description: The Slötvå Multi Texture Reverb is a variant of the Slö but adds on
  the ability to create and save three presets. Save your favorite dreamscapes
  by simultaneously pressing and holding down on the bypass and sustain
  switches.
details: "The Slötvå Multi Texture Reverb is a variant of the Slö but adds on
  the ability to create and save three presets. Save your favorite dreamscapes
  by simultaneously pressing and holding down on the bypass and sustain
  switches. Scroll through them by simultaneously pressing and releasing bypass
  and sustain. The Slötvå allows players to create lush, modulated, sleepy, and
  ambient soundscapes. Stocked with three different algorithms specifically
  designed to invoke textures for bringing dreams from your subconscious to
  reality. The toggle switch allows three different reverb modes, Dark (Lower
  Octave), Rise (Ambient Swell), and Dream (Latching Pad), while secondary
  functions on the switch change between different wave shapes for the
  modulation on the reverb trail. Combine deep modulation with long washy trails
  and experience, the Slötvå . ALGORITHMS: DARK – Add a lower octave to your
  reverb trail. Here you'll create deep and wide atmospheric sounds and channel
  nightmarish soundscapes. X knob sets the level of a -1 octave signal that
  feeds the reverb. RISE – This is an auto-swell reverb for beautiful cinematic
  swells. Don't rush it. Let it breathe and gently wake up. X knob sets the
  amount of time it takes the reverb to swell in after a note is played. Set
  lower for shorter rise times and higher for longer rise times. DREAM – Lush
  reverb with a latching pad function. Press the sustain switch to latch signal.
  Experiment with the X knob to add vibrato over the pad. Press sustain again
  and the pad will decrescendo according to where the decay knob is set. X knob
  sets the depth of vibrato applied to the reverb trail. The Slötvå also
  features 3 different wave shapes accessible by holding down bypass while
  switching the algorithm toggle. SINE – Smooth and even pitch up and down
  modulation. WARP – Asymmetric pitch up modulation similar to a warped record.
  SINK – Asymmetric pitch down modulation for sinking detune similar to a
  Bigsby. MOMENTARY FUNCTIONS: Bypass: When the switch is in the off position,
  press and hold to temporarily activate the effect to add a moment of reverb
  texture. Releasing the switch turns the effect off, and fades it out. Sustain:
  When pressed, the decay switch ramps up the reverb trail to maximum creating a
  long dreamy reverb trail, and then ramps back down to the decay knob setting
  when released. In the “Dream” algorithm, the sustain switch is latching. Press
  it once to capture and sustain the current reverb decay for extremely long
  pad-like sounds. Press it again to let the reverb trail taper off, based on
  the position of the decay knob. TRAILS MODE: The Slötvå can run in trails or
  no trails mode. In trails mode, when you turn the pedal off, the reverb decay
  dies off naturally. In no trails mode, the decay is abruptly cut off when you
  turn the pedal off. To toggle between either mode, hold down the bypass switch
  for 1 second while applying power to the pedal. Unplug power and repeat to
  toggle to the other mode. PRESET SPILLOVER When scrolling through presets,
  there is only preset spillover if the next preset is the same algorithm as the
  one preceding it. For example, if your red and green presets are both in Dream
  mode, switching from red to green will not cut your reverb trails."
