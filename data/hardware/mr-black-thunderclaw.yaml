name: ThunderClaw
manufacturer: mr-black
primaryCategory: pedal
categories:
  - distortion
url: https://www.mrblackpedals.com/products/thunderclaw
description: The ThunderClaw is a high-gain, high-headroom distortion pedal with
  a 100% analog signal path, active treble and bass tone controls, an active
  output volume and an internal split-rail power supply for exceptional
  dynamics.
details: |-
  Purpose built to bring the heavies, the ThunderClaw is a mean, powerful
  distortion pedal, but cruelty does not always exclude grace. It offers massive,
  aggressive gain with an astounding dynamic range, and is topologically unlike
  any other compact distortion, neither a clone nor a derivative.

  From its internal split-rail power supply to its fully active tone controls and
  potent active output volume, the ThunderClaw redefines the feel and response of
  a compact distortion pedal. Four simple controls respond exactly as you would
  hope, and the carefully tuned active tone controls both boost and cut select
  treble and bass frequencies.

  The low end is clear and powerful without ever getting flubby, and the active
  treble circuit slices through a dense mix or softens so the razor's edge is
  never felt. The distortion is clear, articulate and responsive, and because of
  clever engineering the ThunderClaw can clean up anywhere in the chain simply by
  reducing the volume feeding it.

  Asked what it sounds like, Mr. Black says it is like a pressure washer spraying
  napalm: mean, aggressive and graceful. Housed in a true-bypass, compact
  enclosure and made in the U.S.A.
specs: |-
  - Highly dynamic, aggressive, and responsive high-gain distortion
  - 100% pure-analog, high-headroom signal path
  - Active Treble & Bass controls (boost/cut controls)
  - Active Volume control delivers constant and stable, low-impedance output
  - Internal split-rail power supply for incredible dynamic content and detail (+/- 9V internal split-rail operation)
  - Input Impedance: ~480KΩ
  - Output Impedance: ~1KΩ
  - True-Bypass
  - 9VDC 2.1mm negative center-pin power
  - ~27mA Current Draw
