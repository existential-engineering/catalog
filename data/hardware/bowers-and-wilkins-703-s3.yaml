description: The new 703 S3 now features the iconic Tweeter-on-Top configuration
  for the first time, alongside a decoupled FST Continuum cone midrange driver,
  enhanced by the addition of the revolutionary new Biomimetic Suspension, and
  twin Aerofoil Profile bass drivers.
details: |-
  703 S3 is the mid-sized floor-standing loudspeaker of the Bowers & Wilkins 700 Series, a three-way vented-box system with a 25mm Decoupled Carbon Dome high-frequency unit, a 150mm Continuum cone FST midrange driver and two 165mm Aerofoil Profile bass cones. This generation is the first in which the 703 gains the Tweeter-on-Top configuration, alongside a decoupled midrange driver carrying the Biomimetic Suspension.

  The tweeter sits in the latest generation of the Solid Body Tweeter-on-Top housing, milled from a single solid block of aluminium and carefully decoupled to resist resonance, with a more elongated form and a longer tube-loading system than the previous generation. The Carbon Dome tweeter itself is purpose-built for the 700 Series and raises the breakup threshold to 47kHz. The midrange combines four Bowers & Wilkins technologies, the Continuum cone, FST, Biomimetic Suspension and midrange decoupling, the last of which keeps the bass drivers' operation from interfering with it, while the Aerofoil Profile bass cone uses a computer-modelled variable thickness to place stiffness where it is needed.

  The speaker is entirely passive and carries no amplification, no mains inlet and no line-level input. The 700 Series 3 manual states that there are two linked pairs of terminals on the back of the speaker, labelled HF and LF. For conventional single-wire connection the terminal links stay in place as delivered and only one pair is connected to the amplifier; for bi-wiring or bi-amplification the links are removed and each pair is connected independently. The terminals accept 4mm banana plugs, 6mm and 8mm spades, or bare wire up to 4mm diameter, with the 4mm holes blocked by plastic pins on delivery to satisfy European CENELEC safety rules.

  Installation is floor-standing only. The supplied plinth must always be fitted, with the spike or rubber feet inserted into the plinth rather than directly into the cabinet. For stereo the manual suggests 1.5m to 3m between speakers in an equilateral triangle with the listening position, at least 0.5m from the back and side walls, and for home theatre use within roughly 0.5m of the sides of the screen. The drive units create stray magnetic fields, so magnetically sensitive items should be kept 0.5m away.

  Low-frequency output can be tuned with the supplied two-piece foam port plugs, using either the outer piece alone for gentler attenuation or the complete assembly, which is the intended remedy when the speaker cannot be moved further from a wall. Performance changes during the initial listening period: the manual asks for up to a week for temperature effects to stabilise and about 15 hours of average use for the drive unit suspensions and damping compounds to reach their intended mechanical characteristics.
specs: |-
  - Description: 3-way vented-box system
  - Drive units: 1x 25mm (1 in) Decoupled Carbon Dome high-frequency, 1x 150mm (6 in) Continuum cone FST midrange, 2x 165mm (6.5 in) Aerofoil Profile bass
  - Frequency range: 30Hz to 33kHz
  - Frequency response: 46Hz to 28kHz +/-3dB
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 90Hz to 22kHz, less than 0.5% 120Hz to 20kHz
  - Nominal impedance: 8 ohms (minimum 3.1 ohms)
  - Recommended amplifier power: 30W to 200W into 8 ohms on unclipped programme
  - Sensitivity: 90dB spl (2.83Vrms, 1m)
  - Max recommended cable impedance: 0.1 ohms
  - Technical features: Decoupled Carbon Dome tweeter, Solid Body Tweeter-on-Top, Continuum cone FST midrange, decoupled midrange, Aerofoil Profile bass cones, Flowport
  - Passive: no on-board amplification and no mains connection. Two linked pairs of HF and LF terminals, single-wire as delivered, bi-wire or bi-amp with the links removed
  - Terminals accept 4mm banana plugs, 6mm and 8mm (1/4 in and 5/16 in) spades, or bare wire up to 4mm (5/32 in) diameter
  - Dimensions: height 1010mm (39.8in) cabinet only, 1117mm (44.0in) including tweeter and plinth; width 192mm (7.6in) cabinet only, 290mm (11.4in) including plinth; depth 316mm (12.4in) cabinet only, 353mm (13.9in) including grille and terminals, 372mm (14.6in) including plinth
  - Net weight: 28.81kg (63.5lb)
  - Cabinet finishes: Gloss Black, Satin White, Mocha
  - Grille finishes: Black, Grey (Satin White only)
  - Supplied with plinth, spike feet, rubber feet and two-piece foam port plugs
