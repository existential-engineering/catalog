description: High-performance 700 Series floor-standing loudspeaker featuring
  the iconic Tweeter-on-Top configuration with a Decoupled Carbon Dome tweeter,
  a Continuum cone FST midrange, and twin Aerofoil Profile bass drivers in a
  three-way vented-box design.
details: |-
  The 703 S3 is a three-way vented-box floor-standing loudspeaker in the Bowers & Wilkins 700 Series. Its defining feature is the Solid Body Tweeter-on-Top housing—a milled aluminium enclosure that mechanically isolates the tweeter from the main cabinet to reduce vibration-induced coloration.

  The 25mm Carbon Dome tweeter combines a 30-micron aluminium dome with a carbon-coated ring at the perimeter, pushing the first breakup mode out to 47kHz for extended, low-distortion high-frequency response. Mid-band duties are handled by a 150mm Continuum cone FST driver mounted in its own decoupled pod, isolated from the bass operations of the cabinet, and using Biomimetic Suspension in place of a conventional fabric spider for improved openness.

  Low frequencies come from a pair of 165mm Aerofoil Profile bass drivers whose variable-thickness cones balance stiffness and mass, vented through the Flowport-equipped enclosure. The result is a speaker quoted at 90dB sensitivity with a recommended amplifier power range of 30–200W into 8Ω.

  Finishes available are Gloss Black, Satin White, and Mocha.
specs: |-
  - Drive units: 1x 25mm (1 in) Decoupled Carbon Dome tweeter, 1x 150mm (6 in) Continuum cone FST midrange, 2x 165mm (6.5 in) Aerofoil Profile bass
  - Configuration: 3-way vented-box system with Flowport
  - Frequency range: 30Hz - 33kHz
  - Frequency response: 46Hz - 28kHz ±3dB
  - Sensitivity: 90dB SPL (2.83Vrms, 1m)
  - Harmonic distortion: <1% (90Hz - 22kHz), <0.5% (120Hz - 20kHz)
  - Nominal impedance: 8Ω (minimum 3.1Ω)
  - Recommended amplifier power: 30W - 200W into 8Ω
  - Height: 1,010mm (cabinet), 1,117mm (with tweeter/plinth)
  - Width: 192mm (cabinet), 290mm (with plinth)
  - Depth: 316mm (cabinet), 372mm (with plinth/terminals)
  - Weight: 28.81kg (63.5 lb)
  - Finishes: Gloss Black, Satin White, Mocha
