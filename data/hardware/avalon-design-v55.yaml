description: The Avalon V55 is a dual-channel, Pure Class A microphone
  preamplifier, DI, and re-amp unit with a 10-position passive TONE-BANK,
  transformer-coupled inputs with selectable impedance, professional VU
  metering, and multiple outputs including transformer-isolated re-amp sends in
  a 2U rack-mount chassis.
details: |-
  The V55 DI-RE-MIC Preamplifier is Avalon Design's ultra-high performance dual-channel
  preamplifier, DI, and re-amper. Its sonic signature — deep and controlled bass,
  musical midrange, and enhanced vocal projection — is built on 100% discrete Pure
  Class A amplification, a unique passive TONE-BANK, and professional VU metering.

  The DI input stage provides a very-high impedance, zero-load effect on sensitive
  pickups and keyboards while maintaining massive input headroom to +36 dB before
  overload. The V55 is ideal for ribbon, dynamic, and condenser microphones, bass
  guitar, acoustic and electric guitars, keyboards, synthesizers, and very low output
  passive pickups.

  A high-quality input transformer (the same as the Avalon VT-737SP) offers dual
  microphone input impedance loading for optimal mic and cable matching, along with
  a high-cut switch, headphone monitor amp, and DC-coupled 100% Class A output
  amplifiers for defined bass control.

  A buffered thru output allows zero-instrument-load connections for tuners or power
  amp inputs. An internal toroidal power transformer with discrete high-voltage power
  supplies delivers low noise, and sealed silver relays handle all signal routing.
  The V55 is available in Silver and Black finishes.
specs: |-
  - Circuit topology: 100% discrete, high-voltage Class A, dual channel
  - Gain: switched 2 dB steps (±0.2 dB)
  - Line input impedance: 9,000 Ω balanced; gain −2 dB to +38 dB; max input +47 dBu
  - Instrument/DI input impedance: 10,000,000 Ω; gain +2 dB to +42 dB
  - Mic input impedance (high-Z): 6,600 Ω; gain +20 dB to +60 dB
  - Mic input impedance (low-Z): 1,800 Ω; gain +26 dB to +66 dB
  - Pad: Line −13 dB, Instrument −10 dB, Mic −15 dB
  - Phantom power: 48V regulated @ 10 mA
  - Max line output: +30 dBu DC coupled, balanced 600 Ω (XLR/TRS)
  - Max isolated output: +12 dBu transformer isolated, unbalanced
  - Headphone output: 0.5W into 600 Ω
  - Noise: −98 dBu typical at minimum gain (20 kHz unweighted)
  - Noise EIN: −128 dB at 40 dB gain (low-Z mic)
  - Distortion: 0.05% THD/IMD at +10 dB; 0.5% at +30 dBu
  - Frequency response ±0.5 dB: 5 Hz to 20 kHz
  - Frequency response −3 dB: 2 Hz to 500 kHz
  - High-cut filter: −3 dB at 3.7 kHz
  - Rack size: 2U (19″ × 3.5″ × 12″ / 483 × 88 × 305 mm)
  - Weight: 24 lbs (10.9 kg) packed
  - Power: internal toroidal, 115/230V selectable, 50/60 Hz, 35W max
