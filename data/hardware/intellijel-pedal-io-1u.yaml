description: "Rack meet Guitar; Guitar meet rack. Open your rack to the world of
  guitar effects: delays, choruses, flangers, phasers, fuzz boxes, tremolos,
  wah-wahs, amp simulators, compressors, pitch shifter, and more. Open your
  guitar to the world of eurorack: filters, ring mods, wave folders, sequencers,
  and, most importantly, the unique CV modulation delights inherent to your
  rack."
details: |-
  The Pedal I/O 1U system enables the modular synthesist to interact with the impressive assortment of delays, choruses, flangers, phasers, fuzz boxes, tremolos, wah-wahs, amp simulators, compressors and pitch shifter pedals available to guitarists. Conversely, it also grants guitarists access to the myriad filters, ring mods, wavefolders and, most importantly, the near infinite CV modulation delights inherent in eurorack. The Pedal I/O is more than just a simple level shifter, it's also an impedance converter, which provides proper drive and loading for any FX pedals or instruments you connect.

  The Pedal Interface 1U module connects either to the Pedal I/O Jacks 1U module, or directly to Intellijel 7U cases using the 7U Case Adaptor. Two Pedal Interface modules can be connected to a 7U case in this manner, with one taking the left input and output on the case, while the other takes the right.

  Use the Pedal I/O's RETURN circuit as a "direct box" for connecting any instrument. Signals arriving at the Pedal I/O System pass through a Class A triode emulator, allowing for some tube-like overdrive at high gain settings. Use Pedal I/O in the studio as an active "re-amping" device to play pre-recorded tracks back through guitar amplifiers or pedals.
specs: |-
  - Width: 16HP
  - Depth: 29mm
  - Power: 10mA @ 12V, 10mA @ -12V
  - Class A triode emulator for tube-like overdrive at high gain
  - Separate gain controls on SEND and RETURN
  - Switch to invert phase of the return signal
  - Switch to select line or pedal/instrument level output
  - Low MIX output impedance for driving long cables and lower noise
