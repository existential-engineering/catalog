description: Designed for professional guitar players who require the versatile
  tones, smooth playability, and complete reliability for serious recording and
  touring needs, the LTD Deluxe SN-1000FR is the super guitar of your dreams,
  souped up and modded with everything you ever wanted. Built with bolt-on
  construction at 25.5" scale, it offers a resonant swamp ash body and a thin
  U-shaped three-piece roasted maple neck with a compound radius Macassar ebony
  fingerboard, offset dot inlays, 24 extra-jumbo stainless steel frets, and a
  reverse matching-finish headstock. Components on the SN-1000FR Candy Apple Red
  Satin include black hardware, a Floyd Rose 1000SE double-locking tremolo with
  stainless steel screws, precise Grover tuners, and a set of direct-mounted
  Fishman Fluence Modern 3-Voice Humbucker pickups — ceramic in the bridge, and
  alnico in the neck — with Black Nickel covers. Push-pull controls allow for
  selection of these innovative pickups' multiple voices.
