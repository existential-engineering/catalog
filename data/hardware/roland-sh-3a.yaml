description: >-
  The Roland SH-3a is an early monophonic analog synthesizer featuring a single
  VCO with additive synthesis capabilities, allowing users to mix up to five
  waveforms simultaneously. Its organ-friendly control layout and compact form
  factor made it popular among keyboard players in the mid-1970s.
details: |-
  Released between 1974 and 1976, the SH-3a was among Roland's first forays into programmable additive synthesis. The instrument was designed with traditional keyboard players in mind, positioning its editing controls to the left of the keyboard and even including a sheet music stand, a nod to the organ and piano world from which many early synthesizer adopters came.

  The single VCO is complemented by a pink and white noise generator and portamento control, while the self-oscillating resonant lowpass filter provides classic subtractive shaping. Two LFOs offer sawtooth and sine/square waveforms respectively, with LFO2 featuring a useful delay slider for gradual modulation introduction. A sample-and-hold circuit with adjustable level and sample time adds further sonic variety.

  The SH-3a uses a low-note priority scheme for its 44-key keyboard, which was standard for monophonic synths of this era. Notable users include Kitaro, the Human League, and Vangelis, each of whom employed its distinctive tonal character in their recordings.
specs: |-
  - Polyphony: Monophonic (low note priority)
  - Oscillators: 1 VCO with pink/white noise generator
  - Filter: Resonant self-oscillating lowpass with frequency and resonance controls
  - LFO: LFO1 sawtooth; LFO2 sine or square with delay slider
  - Sample-and-Hold with level and sample time sliders
  - VCA: ADSR envelope
  - Keyboard: 44 keys
  - Portamento: Yes
  - Memory: None
  - External Control: None
