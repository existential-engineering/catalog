description: Get 14″, 12″ and 10″ snare tone in one amazing Collector's Series snare drum.
details: |-
  Introducing the ultimate multi-tool snare drum with the limited edition DW Collector's Series Snare Drum featuring the Zikit System. This revolutionary snare features a clear 14″ seamless Acrylic shell, which is equipped with an internal mechanism of 12″ and 10″ adjustable rings.

  You'll start out with the aggressive and focused punch of a 14″ Acrylic snare drum, then engage the 12″ or 10″ rings with the turn of a lever to increase tension and tone of the head. This gives you the attack and cut of 12″ and 10″ snare drums to raise pulses as your primary beat or use as an extremely versatile side snare.

  This snare is also fitted with DW's legendary innovative hardware like the MAG throw-off and 5P butt plate, which give you magnet-powered instant snare engagement and five levels of snare wire tension. True-Hoops provide a fully rounded top edge for thick rimshots and preserving sticks, while DW Heads by Remo make it playable right out of the box.

  Available to Drummer's Choice Dealer Network and select International Dealers only.
specs: |-
  - Size: 6.5x14
  - Seamless Acrylic drum shell
  - Patented Zikit internal system
  - MAG throw-off
  - 5P butt plate
  - True Hoops
  - Limited edition
  - Finish: Clear Acrylic
