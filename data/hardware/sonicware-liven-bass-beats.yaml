url: https://sonicware.jp/products/liven-bass-beats
description: LIVEN BASS&BEATS is a groovebox that pairs a wavetable bass
  synthesizer with a PCM rhythm machine. It offers 350+ rhythm sounds, 100+
  SE/SFX sounds, a full effects section, and a step sequencer with separate bass
  and rhythm tracks.
details: |-
  LIVEN BASS&BEATS is a groovebox that combines a wavetable bass synthesizer with a rhythm machine.

  This product does not include an AC adapter. If you need one, please select the "With PSU" option.
specs: |-
  - Bass Synth Engine: Wavetable OSC/Sub OSC/Noise, Monophonic
  - Rhythm Engine: PCM (Rhythm sounds: 350+, SE/SFX sounds: 100+)
  - Max. number of simultaneous sounds: 6 voices in total
  - Mixer: Volume and Reverb send adjustment for bass, drums and external input
  - Effects: Hall, Room, Mono Reverb, Chorus, Flanger, Delay, Bit Crusher, Distortion, High Pass Filter, Low Pass Filter, Isolator, Tilt EQ
  - Sound memory: Bass patch 128, Drums kit 128
  - Sequencer: Bass track + Rhythm tracks, Up to 64 steps, 128 patterns, Swing
  - I/O : MIDI IN/OUT, SYNC IN/OUT, LINE IN/OUT , headphone out
  - Size : 11.7 inch (W) x 6.92 inch (D) x 1.89 inch (H), 297mm (W) x 176mm (D) x 48mm (H)
  - Weight : 1.74lb., 790g
  - Accessories: Overlay sheet for the Bass patch edit, Overlay sheet for the Drum kit edit, Warranty
  - Power supply: AA batteries x 6, or 9V DC output AC adapter (1A or higher, EIAJ3 standard inner diameter 1.7mm outer diameter 4.75mm, center +) *The AC adapter is not included.
