description: The WS-12 V2 Subwoofer is the most powerful studio subwoofer
  available under $1000. It is made to be used with any near- or mid-field
  studio monitors, as well as with small portable PA systems in a live setting.
details: |-
  One of the key design specifications for the WS-12 V2 is that it be capable of providing bass management in a 5.1 system where all of the full-range speakers are Kali IN-8s. As such, the WS-12 V2 is powered by a 1000W power amplifier mated to a high-excursion 12-inch driver.

  This much power also makes the WS-12 V2 a capable live subwoofer. Its enclosure is 18mm plywood and it has handles for easy carrying, and Kali's team made sure that it will fit in small passenger cars.

  All this power is controlled by a DSP section that dials in the exact settings a system needs, whether the sub is used with a pair of LP-6s, as bass management in a 5.1 system, or on stage with a PA.

  Connections are a stereo RCA input pair at -10dBV and a stereo XLR/TRS combi input pair at +4dBu, plus balanced XLR outputs carrying the high-passed signal at a pass-through signal-to-noise ratio better than 115 dB. A 1/4-inch footswitch jack bypasses the sub.

  The WS-12 V2 replaces the original WS-12, which was manufactured from January 2020 to March 2023 at $799 each. Compared with it, the V2 adds a pole cup for mounting top boxes, new crossover options based on user feedback, and substantially reduced noise on the high-passed outputs.
