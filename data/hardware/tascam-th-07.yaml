description: Premium closed-back circumaural monitor headphones with 50mm custom
  drivers for tracking, mixing, and critical listening. Features pivoting and
  angling ear cups for a versatile fit and single-ear monitoring, plus a
  foldable design. Two detachable cables with gold-plated connectors are
  included for studio and field use.
details: |-
  Closed-back circumaural headphones with 50mm custom-made drivers. Frequency response 10Hz–30kHz, sensitivity 100dB ±3dB. Pivoting and angling ear cups suit both full-ear and single-ear monitoring. Detachable cable system: includes a coiled cable (short, 3.5mm termination) and a straight ~8.5 ft cable with a multi-connection jack accommodating 3.5mm and 6.3mm plugs. Foldable design with included carrying bag. Passive — no power requirements.
specs: |-
  - - Type: Closed-back, circumaural
  - Driver: 50mm custom-made
  - Freq response: 10Hz–30kHz
  - Sensitivity: 100dB ±3dB
  - Cables: 2× detachable; coiled (3.5mm) + straight ~8.5 ft (3.5mm + 6.3mm multi-jack)
  - Ear cup design: Pivoting and angling
  - Foldable with carrying bag
  - Passive (no power required)
