details: |-
  This is the Mesmer Astral Delay in one of the 20 for 20 Custom Shop finishes. Each of the twenty colorways in the series carries a 20 for 20 insignia and is limited to twenty units. This one is finished in a magenta and cyan fade, described by Keeley as a first for the company.

  The Mesmer Astral Delay is a delay pedal built around harmonised and pitch-shifted repeats rather than conventional echo. Keeley describes at least three modes: two delay lines that return a single note or a chord harmonised in 5ths or octaves, and an arpeggiator that swirls a single note into billowing chords.

  The pedal is aimed at players looking for hypnotic harmonies and ambient textures. Keeley suggests placing a compressor in front of it, running it into a looper, or stacking it with another delay or reverb pedal for denser results.
specs: |-
  - - Three modes: two harmonised delay lines (5ths and octaves) and an arpeggiator
  - - 20 for 20 Custom Shop finish, magenta and cyan fade, limited to 20 units
  - - Carries the 20 for 20 insignia
