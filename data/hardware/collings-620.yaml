description: The 620 is a semi-hollow electric guitar tailor made for guitarists
  who value both nuance and punch. It features a premium flamed maple top, 1
  5/8" Honduran mahogany body, and solid maple center block for smooth sustain
  and a focused sound with a gentle top end. Lollar Low Wind Imperial humbuckers
  and 50s-style wiring deliver expressive, harmonically rich tone. An extra long
  mortise and tenon neck joint and high gloss nitrocellulose lacquer finish
  complete the package.
details: |-
  The Collings 620 is a semi-hollow electric guitar built for players who demand both articulation and power. The Honduran mahogany body is topped with premium flamed maple and fitted with a solid maple center block to control feedback while preserving the resonance of a hollow body. Lollar Low Wind Imperial humbuckers paired with 500K pots, Jupiter Vintage Yellow capacitors, and 50s-style wiring deliver warm, harmonically complex tone that responds dynamically to picking intensity. The Honduran mahogany neck joins the body via an extra long mortise and tenon joint for exceptional sustain and stability, while the rosewood fingerboard with a 12" radius and medium 18% nickel-silver frets offer a comfortable, familiar playing feel. Hardware includes a Kluson ABR-1 bridge with retaining wire, a Kluson Stop Tailpiece, and Nickel Gotoh tuners with Collings logo buttons. The guitar ships in a high gloss nitrocellulose lacquer finish with non-grained ivoroid or tortoise binding and comes with a deluxe hardshell case.
specs: |-
  - Construction: Semi-hollow w/ maple center block
  - Body: Honduran mahogany
  - Body Width: 15"
  - Body Length: 19 3/16"
  - Body Depth: 1 5/8"
  - Total Length: 40"
  - Top: Premium flamed maple
  - Neck: Honduran mahogany
  - Neck Joint: Extra long mortise & tenon
  - Nut Width: 1 11/16"
  - Scale Length: 24 7/8"
  - Fingerboard: Rosewood w/ MOP long dots
  - Fingerboard Radius: 12"
  - Frets: Medium 18% nickel-silver
  - Soundhole: F-holes (unbound)
  - Body Binding: Non-grained ivoroid or tortoise
  - Bridge: Kluson ABR-1 (nickel-plated zinc w/ retaining wire)
  - Tailpiece: Kluson Stop Tailpiece (nickel-plated zinc, steel studs)
  - Pickups: Lollar Low Wind Imperials
  - Pots/Caps: 500K / Jupiter Vintage Yellow
  - Wiring: 50s style
  - Knobs: Davies Radio
  - Pickup Rings: Cream or black
  - Peghead Veneer: Ebony w/ MOP Collings logo
  - Peghead Profile: Flipped Haircut
  - Tuners: Nickel Gotoh w/ Collings logo
  - Guitar Finish: High gloss nitrocellulose lacquer
  - Pickguard: Black/cream/black or single-ply tortoise
  - Truss Rod Cover: Matches pickguard
  - Strings: D'Addario NYXL1149 (.011" - .049")
  - Case: Deluxe hardshell case
