details: |-
  The Avantone Pro Kick is a specialized sub-frequency kick drum microphone
  featuring Avantone's reproduction "white cone" low-frequency driver. It
  brings the boom from your instruments out to the forefront, making
  large-sounding sources sound massive.

  Built around the AV10-MLF 18cm low-frequency driver with a single continuous
  press-formed cone, the Kick is housed in a birch plywood shell with a 10"
  mesh drum head. The figure-8 polar pattern captures the kick drum beater
  attack from the front head while also picking up the body resonance from the
  rear. It ships with a heavy-duty double-braced drum stand, making it
  stage-ready out of the box.
specs: |-
  - Type: Moving Coil Dynamic
  - Polar Pattern: Figure 8
  - Frequency Response: 50Hz–2,000Hz
  - Output Impedance: 6.3 Ω
  - Driver Element: AV10-MLF 18cm cone
  - Output Connector: Male XLR 3-pin
  - Shell Material: Birch Ply
  - Drum Head: Mesh 10"
  - Dimensions: 11.375" × 11.375" × 5.5" (without stand)
  - Weight (without stand): 3.1 kg (6.8 lbs)
  - Weight (with stand): 4.6 kg (10.1 lbs)
