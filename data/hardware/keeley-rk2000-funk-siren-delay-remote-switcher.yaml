details: |-
  A compact dual footswitch built specifically for the RK2000 Funk Siren Delay, giving remote access to the pedal's key functions from a separate position on a pedalboard. It lets the main unit sit somewhere other than the most convenient footswitch spot, which suits larger boards and tighter layouts.

  Each switcher ships with a RockBoard by Warwick cable for connecting it directly to the pedal.

  Three colorways are offered: Standard Grey, PGH White to pair with the PGH White RK2000, and PGH Black to match the PGH Black RK2000. All three behave identically and differ only in finish.
