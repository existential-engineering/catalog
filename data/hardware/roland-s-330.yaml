description: >-
  The Roland S-330 is a compact 1U rack sampler based on the S-550, offering
  12-bit sampling with sophisticated waveform editing capabilities and a
  characterful lo-fi digital color.
details: |-
  Produced from 1987 to 1988, the Roland S-330 distilled most of the S-550's capabilities into a more affordable single-rack-unit format. It arrived during a pivotal moment when affordable sampling was coming of age, and its 12-bit resolution gives recordings a distinctive mid-eighties coloration that many producers still find musically appealing.

  The S-330 provides 750KB of sample memory for approximately 28.8 seconds of total sample time at its highest rate. Variable sample rates from 30kHz down to 15kHz allow users to trade fidelity for longer recording times. The unit can hold 32 samples and tones organized into 16 patches across 2 banks.

  Editing is where the S-330 truly shines. When connected to an external CRT monitor, users gain access to waveform drawing and smoothing, auto-looping, tuning, and multi-stage envelope editing. The Time Variant digital filters provide tonal shaping beyond simple sample playback. Eight-part multitimbrality across eight outputs makes it a capable multi-voice playback instrument.

  With 16-voice polyphony and a built-in 3.5-inch disk drive for sample storage, the S-330 offered a practical sampling workflow in a compact format. Its lo-fi character has earned it a following among producers seeking that authentic vintage digital texture.
specs: |-
  - Polyphony: 16 voices
  - Sample Memory: 750KB (28.8 seconds max)
  - Sample Rates: Variable 30kHz to 15kHz
  - Resolution: 12-bit
  - Capacity: 32 samples/tones, 16 patches in 2 banks
  - Multitimbral: 8 parts
  - Outputs: 8
  - Filter: Time Variant digital filters (TVF)
  - Storage: Built-in 3.5-inch disk drive
  - Connections: MIDI
  - Format: 1U rackmount
releaseDate: "1987"
releaseDateYearOnly: true
