details: |-
  The G&L Legacy HSS fattens things up with a G&L AW4470 alnico bridge humbucker to complement the vintage alnico G&L CLF-100 single coils in the neck and middle positions. Masterminded by G&L VP Engineering Paul Gagon, the Legacy HSS has that ideal balance that lets it play well in a variety of settings, and its splittable bridge humbucker does a convincing job as a single coil with rich, ringing harmonics.

  The Legacy HSS brings all of the Legacy features, starting with Leo's PTB (Passive Treble and Bass) system which functions on all three pickups for dramatically more variety than the vintage setup and a split coil switch for the bridge pickup. The Legacy HSS also features a Leo Fender-designed Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm. The Legacy HSS's hard-rock maple neck features an easy-playing satin finish, comfortable 9 1/2" radius and Jescar 57110 medium-jumbo nickel-silver frets for silky playability.

  For players looking for that extra power to properly rock the house in a classic looking axe, the Legacy HSS is worth a look.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: CLF-100 Alnico single coils in neck and middle position, AW4470 in bridge position
  - Body wood: Swamp Ash on Premier Finishes, Alder on Standard Finishes
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato with forged brass saddles
  - Controls: 5-position pickup selector, volume, treble and bass (PTB system), split coil switch
  - Includes: G&L Deluxe Gig Bag
