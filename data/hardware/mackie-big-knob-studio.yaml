name: Big Knob Studio
manufacturer: mackie
primaryCategory: monitor
categories:
  - audio-interface
url: https://mackie.com/en/products/studio-monitoring/big-knob-series/big_knob_studio.html
description: "Monitor controller and 2x2 USB recording interface with dual Onyx
  mic preamps, 192kHz/24-bit recording, 3-source/2-monitor selection, integrated
  talkback, and dual independent headphone outputs."
details: |-
  The Big Knob Studio combines physical controls for input and monitor switching with a 192kHz/24-bit recording interface. It features dual Mackie Onyx preamps, integrated talkback, dual independent headphone outputs, and professional source/monitor selection (3 sources, 2 monitor pairs).

  The device supports flexible routing for podcasting and multi-track recording with zero-latency monitoring. Classic Big Knob volume control combined with mono, mute, and dim functions delivers hands-on monitoring control at the desktop.

  Inputs include dual XLR Onyx mic preamps with phantom power, a 1/8" stereo smartphone/aux input, and USB return from the host computer. Sixteen-segment input metering helps dial in clean recordings.

  The Big Knob Studio ships with Waveform OEM DAW and the DAW Essentials Collection of 16 FX plug-ins, and is compatible with Mac and Windows DAWs.
specs: |-
  - 2x2 USB recording interface
  - Dual Mackie Onyx mic preamps
  - 192kHz / 24-bit high-resolution recording
  - 3 source, 2 monitor pair selection
  - Classic Big Knob volume control
  - Mono, mute, and dim functions
  - Dual headphone outputs with independent level control
  - Built-in talkback microphone
  - 16-segment input metering
  - 1/8" smartphone input jack
  - Compatible with Mac and Windows DAWs
  - Includes Waveform OEM DAW and DAW Essentials Collection (16 FX plug-ins)
