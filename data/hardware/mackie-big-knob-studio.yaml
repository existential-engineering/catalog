description: Take control of your studio with the Mackie Big Knob Studio monitor
  controller and interface. Experience professional source and monitor selection
  with complete control.
details: |-
  Reach for a Mackie Big Knob Studio monitor controller and level up your workspace. This all-in-one desktop interface and monitor control solution has become the centerpiece for in-the-know producers and musicians. It even features award-winning Onyx mic preamps plus high-resolution USB recording and playback.

  Stop scrolling and fussing with your mouse, and get your hands on the Mackie Big Knob Studio, because pushing real buttons feels way better than clicking virtual ones. Enjoy real, hands-on level control with input and monitor switching, plus get everything you need for high-quality recording sessions via a full-featured 192kHz / 24-bit recording interface and integrated talkback.

  Dual Mackie Onyx preamps and a pair of headphone outputs with independent level controls make tracking in any studio incredibly easy and efficient. A cue mix allows controlled blending of direct inputs with other signals for zero-latency recording.

  The rear panel carries a locking-barrel connector fed by an external universal 100 to 240 VAC power supply, a USB 2.0 audio port, dual Onyx Wide-Z combo preamp inputs on XLR and 1/4 inch, 1/4 inch line-level source inputs, 1/4 inch 2-track outputs with a +4 dB / -10 dB level switch, and 1/4 inch monitor outputs. The front panel adds an 1/8 inch stereo line input and two 1/4 inch headphone jacks.

  A two-position USB Rec Src switch chooses the recording path: disengaged records the 2-track and monitor output signal, engaged sends only the Onyx mic preamps on channels 1 and 2 to the DAW via USB sends 1/2.
specs: |-
  - Professional source and monitor selection: 3 sources and 2 monitor pairs
  - Classic Big Knob volume control
  - Independent trim on all sources and monitor outs
  - Mono, mute and dim functions
  - Flexible 2x2 USB recording interface
  - Two boutique-quality Onyx mic preamps including phantom power for condenser microphones
  - High-resolution 192kHz / 24-bit recording and playback
  - Cue mix allows controlled blending of direct inputs with other signals for zero-latency recording
  - Flexible source connections including convenient 1/8 inch input for your smartphone
  - Dual headphone outs with independent level control
  - Built-in talkback mic for easy communication with artists
  - 16-segment high-resolution input source metering
  - USB format: USB 2.0, 24-bit, 192 kHz
  - Maximum levels before clipping: all inputs +22 dBu, all outputs +22 dBu
  - Universal external power supply: 100 to 240 V~, 50/60 Hz, 0.75 A
  - Dimensions: 3.2 x 9.9 x 6.4 in / 81 x 251 x 163 mm; weight 3.5 lb / 1.6 kg
  - Compatible with all major DAWs on both Mac and Windows
  - Includes Waveform OEM recording software
