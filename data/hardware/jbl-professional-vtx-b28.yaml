details: |-
  The JBL VTX B28 is a professional arrayable dual 18-inch subwoofer engineered to complement the full VTX line array ecosystem. It features two JBL 2288H-M Differential Drive 18-inch woofers in a FEA-optimized Finnish birch plywood enclosure finished in Black DuraFlex, delivering transparent, linear bass response extending down to 25 Hz.

  A large double-flared port design reduces turbulence and extends low-frequency output while maintaining clarity. The enclosure supports both omnidirectional and cardioid deployment modes, giving system designers flexible control over the subwoofer's directional radiation pattern in demanding live sound environments.

  The VTX B28 incorporates a simple 2-point spring-loaded rigging system with captive suspension plates, captive pins, and a 2-step safety lock mechanism. Flown arrays of up to 16 units are supported, and three M20 pole mount attachment points facilitate ground-stacking configurations.

  Front and rear NL4 Speakon connectors enable easy signal pass-through in arrayed configurations. The recommended system amplification is Crown Audio I-Tech HD, operating at 4 ohms. Maximum peak output is rated at 141 dB.

  The VTX B28 is acoustically compatible with all VTX full-range products and is supported by software via JBL's Venue Synthesis and Performance Manager 3 platforms.
specs: |-
  - Frequency Range (-10 dB): 25 Hz – 80 Hz
  - Coverage Pattern: Omnidirectional or Cardioid
  - Maximum Peak Output: 141 dB
  - LF Drivers: (2) JBL 2288H-M 18-inch Differential Drive woofers
  - System Impedance: 4 ohms
  - Recommended Amplification: Crown Audio I-Tech HD
  - Connectors: Front and rear NL4 (Speakon)
  - Enclosure: FEA-optimized Finnish birch plywood, Black DuraFlex finish
  - Rigging: Spring-loaded, 2-step safety lock; flown arrays up to 16 units
  - Dimensions (H×W×D): 508 × 1324 × 750 mm (20 × 52.1 × 29.5 in)
  - Net Weight: 87 kg (191.8 lbs)
