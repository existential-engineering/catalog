details: |-
  Get classic '50s & '60s-inspired Gretsch sound and style with the all-new Electromatic Classic Hollow Body guitars. Crafted with essential Gretsch hollow-body sound, style and playability, these no-nonsense guitars are your next-step Gretsch.

  The G5420LH features a laminated maple body with trestle block bracing to help reduce unwanted feedback, paired with new FT-5E Filter'Tron pickups that deliver full-bodied punch, classic chime and enhanced presence.

  A Classic "C"-shaped maple neck is topped with a 12"-radius laurel fingerboard. Additional features include master volume with treble bleed circuit, bound F-holes, vintage-style open-back tuning machines, and a Graph Tech NuBone nut.

  The guitar arrives in Orange Stain finish with a silver pickguard.
