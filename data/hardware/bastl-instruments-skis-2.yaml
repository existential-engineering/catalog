url: https://bastl-instruments.com/eurorack/modules/skis-2
description: Dual voltage controlled decay envelope module with integrated dual
  VCA. Each channel processes an input signal through an adjustable exponential
  decay envelope triggered by a gate or trigger signal, with normalized ENV OUT
  to VCA CV IN for streamlined percussive sound design. Features decay times
  from 8ms to 3 seconds, LED envelope indication, normalized triggers and
  outputs between channels, and solder jumpers for gate/release mode and
  tambourine bend customization.
details: |-
  5HP width, 24mm depth (skiff-friendly). Power: +12V 40mA, -12V 35mA. PTC fuse and diode protection on 10-pin connector. Solder jumpers for gate/release mode switching and tambourine bend option. Triggers and outputs are normalized between channels. ENV OUT is normalized to VCA CV IN on each channel.
