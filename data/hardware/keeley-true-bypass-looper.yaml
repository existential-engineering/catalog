details: |-
  The True Bypass Looper is a compact loop switcher that places an effect, or a chain of effects, in a true bypass loop so that the effect is fully out of the signal path when switched off. It is offered as a fix for vintage wahs, echoes, phasers and fuzz-face style pedals, and for newer effects with a weak bypass, all of which lose tone while idle in the chain.

  The box measures 1.5 inches wide by about 3 and two thirds inches long, so it fits into tight pedalboard space. It works with or without a power supply, since power only drives the indicators: with a DC supply connected, two LEDs show the state of the loop, blue when the signal is passing through the effect in the loop and red when the unit is in true bypass.

  Keeley lists two further uses. It can act as a multiple effects switcher, with several pedals placed in the loop and switched in or out together, and it can act as a tuner mute, with a tuner in the loop kept off the signal path and silent tuning available when the loop is engaged.
