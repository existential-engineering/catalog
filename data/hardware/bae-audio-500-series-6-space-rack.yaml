description: A 6-space 500 Series rack enclosure with a heavy-duty steel chassis and
  point-to-point wiring. It features XLR inputs and outputs with a remote 1.6A power
  supply to keep transformer interference away from modules.
details: |-
  BAE's 6 Space 500 Series Rack is a 19-inch rack-mount enclosure for standard API-format 500-series modules. It is built with a strong steel chassis — not aluminum — and features shielded wires on individual connectors for serviceability with no PCBs, using point-to-point wiring throughout.

  The remote power supply design keeps the power transformer interference away from the modules for cleaner audio performance, providing ±16V bi-polar power at 1.6A to hosted 500-series modules via the standard edge-connector bus.

  A desktop chassis version (6LB) and a larger 11 Space Rack are also available.
specs: |-
  - Power: ±16V @ 1.6A
  - Power Requirements: 115/230 VAC, 36W
  - Dimensions: 9.25"W × 5.25"L × 10"D
  - Weight (empty): 8 lbs / 3.63 kg
  - Construction: Steel chassis, point-to-point wiring, no PCBs
