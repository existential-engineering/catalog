details: |-
  Cordoba's most popular travel-size guitar now equipped with a cutaway and preamp! The Mini II MH-CE's 580mm (22 7/8 inch) scale length tunes perfectly to Standard E making it a breeze to strum along to all your favorite songs. Its small profile makes it easy to travel with all the while maintaining a well-rounded tone. Built with all-Mahogany woods, the Mini II MH-CE boasts a warm voice that projects exceptionally well for its small size and includes a Cordoba MG102 preamp, featuring a 2-band EQ and built-in tuner. Play at home or on the go, the Cordoba Mini II MH-CE is ready wherever and whenever inspiration strikes.
