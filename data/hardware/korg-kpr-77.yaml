description: >-
  The KPR-77 was Korg's analog drum machine answer to the Roland TR-606,
  featuring basic analog drum sounds with individual level mixing via sliders.
  It offers a simple LCD programming display for sequencing up to 48 patterns
  and two songs, with DIN SYNC connectivity for external synchronization. The
  machine can be battery operated and includes a cassette output for offline
  storage of programmed patterns.
details: |-
  Released in 1983, the Korg KPR-77 was designed to compete directly with the Roland TR-606 Drumatix. Like its Roland counterpart, the KPR-77 is an analog drum machine offering hands-on control of its sound palette through individual slider-based level mixing for each drum voice.

  The sound architecture consists of bass drum, snare, two toms (high and low), open and closed hi-hats, accent, and a switchable cymbal/clap sound. While the KPR-77 does not have the same sonic character as the TR-606, it offers a distinct analog flavor that has found its own audience among drum machine enthusiasts.

  The KPR-77 holds up to 48 patterns organized into three groups of 16, along with two songs. Each pattern can contain up to 32 steps, programmed via a simple LCD display reminiscent of the later Roland TR-505. Like the TR-606, the KPR-77 can be battery operated, and batteries are required for retention of programmed drum patterns. A cassette output is provided for external backup of pattern data.

  For synchronization, the KPR-77 includes DIN SYNC IN/OUT as well as tom trigger outputs for external control. However, Korg's DIN Sync standard is not compatible with Roland's DIN Sync. Korg uses a 48 ppqn (parts per quarter note) standard whereas Roland uses 24 ppqn, meaning the Korg machine will run at half the tempo of a connected Roland unit. This incompatibility can be corrected with translation devices such as the Korg KMS-30.
specs: |-
  - Analog drum machine
  - 6 voices of polyphony
  - Sounds: bass, snare, high tom, low tom, open hi-hat, closed hi-hat, accent, switchable cymbal/clap
  - Individual level sliders per drum voice
  - 48 patterns (3 banks of 16)
  - 2 songs
  - Up to 32 steps per pattern
  - LCD pattern programming display
  - DIN SYNC IN/OUT (48 ppqn)
  - Tom trigger outputs
  - Cassette output for pattern storage
  - Battery operated (batteries required for memory retention)
