description: Affordable, compact and amazing sounding practice amps for the beginner.
details: |-
  Debut Bass is the perfect choice for bass players looking for natural tone, no-fuss controls, and great feel. Designed by the same team behind our award-winning guitar amps, the Debut Bass series offers pro-quality tone in a compact, easy-to-use package.

  With a clean channel for warm, punchy tones and an overdrive channel for added grit and growl, the Debut Bass makes it easy to find your sound fast. Jam along to your favourite songs via the Line In or get in some late night playing via rich sounding headphone output. All this in a compact and portable package that's perfect for around the house or travelling.

  Two models to suit your setup: Debut Bass 15 - 15 Watts, 1 x 6.5" speaker; Debut Bass 25 - 25 Watts, 1 x 8" speaker. Both deliver full-bodied bass tone with enough punch to inspire serious playing, even at low volumes.

  Debut Bass amplifiers are simple, powerful, and built to be your reliable first companion or a trusted home rehearsal amp. They focus more on delivering inspiring tone and being intuitive to use rather than unwanted "bells and whistles", keeping the focus firmly on your playing.

  Plug in your phone, laptop, or tablet via the Line In and play along with your favourite tracks or online lessons. The stereo headphone output gives you the full sound experience without disturbing the neighbours - ideal for late-night sessions or shared living spaces. Whether you're laying down smooth grooves or pushing your tone harder, you've got all the range you need.
specs: |-
  - Power: 15W (Debut Bass 15) / 25W (Debut Bass 25)
  - Speaker: 1 x 6.5" (Debut Bass 15) / 1 x 8" (Debut Bass 25)
  - Channels: Clean and Drive
  - EQ: LOW, MID and HIGH
  - Line / Headphone output (stereo)
  - Line input (stereo through headphones)
  - Compact and portable practice combo design
