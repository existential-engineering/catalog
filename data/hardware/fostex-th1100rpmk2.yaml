name: TH1100RPmk2
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/th1100rpmk2/
description: Open-back premium planar magnetic headphones featuring Fostex's
  evolved RP driver (mk2) with optimized air damping. Housing is hand-carved
  hard maple finished in traditional Awa Aizome (Japanese indigo) using
  plant-based Hon-ai dye, hand-applied and dried over several days so every pair
  shows unique grain and color variation. Newly designed ear pads pair sloped
  contact surfaces with a two-layer urethane structure (soft outer /
  high-elasticity inner) wrapped in silk protein synthetic leather (roughly 3x
  the durability of the previous generation), and natural sheepskin is used for
  the headband and head pad. Lightweight magnesium-alloy mechanical parts cut
  around 20% of the weight versus aluminum equivalents. A detachable 2-pole
  3.5mm connector at each cup makes re-cabling easy; ships with a 2m 7N
  (99.99999%)-grade high-purity OFC cable terminated in a 6.3mm gold-plated
  3-pole plug. Assembled one by one at Fostex's factory in Japan.
details: |-
  This product is the mk2 version of Fostex's flagship RP headphones, carefully assembled one by one at a factory in Japan using the company's proprietary premium grade RP driver with a fully-driven planar diaphragm, optimized diaphragm movement centered on air damping control inside the driver, and a connector that is easy to re-cable. The indigo color and texture of the wood grain of the housing, hand-dyed by skilled Awa Indigo craftsmen, combine with the resolution of the premium RP drivers.

  The Premium RP Driver, developed using the largest diaphragm ever used in a fully driven planar diaphragm driver based on RP technology refined since 1974, has been further optimized with mk2 technology through air damping control inside the driver, flow adjustment using damping materials and new ear pads. This achieves ideal diaphragm amplitude, particularly in the low-frequency range, with sharp response, high sensitivity, smooth frequency characteristics and excellent transient response.

  The hard maple solid wood housing is finished with Awa Aizome, a traditional Japanese dye developed in collaboration with local artisans. The open-type TH1100RPmk2 features double-layered aluminum etched parts at the housing opening, with fine-tuning of the opening ratio and internal components, reproducing a natural soundstage with high resolution and minimal listening fatigue.

  The newly adopted mk2 ear pads feature a sloped design on the side that contacts the face, with a two-layer internal structure of low-density urethane foam and silk protein-based synthetic leather offering three times the durability of the previous model.

  The mk2 version uses a 2-pole 3.5 mm connector, improving re-cable compatibility and versatility. The internal wiring and included unbalanced cable use 7N (99.99999%) grade high-purity OFC cable, and a separate 4.4 mm balanced cable (ET-TH4.4BL2Y) is available. Magnesium alloy mechanical parts reduce overall weight by 20% compared to aluminum, and the head pad and headband are natural sheepskin.
specs: |-
  - Type: Open-back dynamic
  - Driver: RP planar magnetic (Premium RP Driver mk2)
  - Impedance: 32 ohm
  - Sensitivity: 96 dB/mW
  - Maximum input: 3,000 mW
  - Frequency response: 10 to 40,000 Hz
  - Weight: Approx. 420 g (excluding cable)
  - Housing: Solid hard maple finished with Awa indigo dye, double-layered aluminum etched opening
  - Connectors: 2-pole 3.5 mm on each housing
  - Cable: 3.5 mm (2-pole) x2 to 6.3 mm (gold-plated 3-pole) 2 m, 7N (99.99999%) grade high-purity OFC unbalanced cable x 1
  - Accessories: Synthetic leather pouch, safety precautions
  - Optional balanced cable: 4.4 mm ET-TH4.4BL2Y
  - Magnesium alloy mechanical parts, natural sheepskin head pad and headband
  - Assembled in Japan
  - Passive wired headphones, no power supply required
  - Series: TH Premium Series
