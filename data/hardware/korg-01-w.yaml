description: >-
  The Korg 01/W is a professional workstation synthesizer released in 1991 as the
  successor to the popular M1. It features Korg's AI2 sample and synthesis engine with
  32-voice polyphony, 254 sampled instruments, a 16-track sequencer, and two multi-effects
  processors, designed for both home studio and professional use.
details: |-
  The 01/W debuted in 1991 as Korg's second-generation workstation synthesizer and direct successor to the M1. According to product lore, the name originated when someone in marketing saw "M10" upside down, reading it as "01W." The original model had limited commercial success due to its minimal sequencer memory capacity of 7,000 notes, but the 01/WFD variant with floppy disk storage and expanded 48,000-note memory became hugely successful and spawned multiple variants including the 76-key 01/Wpro, the 88-weighted-key 01/WproX, and rack modules.

  The 01/W uses Korg's AI2 sample and synthesis design, which proved so successful that most later Korg synths in the 1990s were also based on this synthesis method. The instrument offers 200 user programs and 200 user combinations, with the ability to layer up to eight programs simultaneously for complex sound creation. A Quick Edit feature allows adjustment of key parameters including octave, wave-shaping intensity, filter EG, VDA level, attack, release, and effects level via eight soft buttons.

  The 16-track sequencer features copy, paste, move, overdub, and punch-in and punch-out recording capabilities. It functions as a master keyboard for controlling external tone generators while managing internal sounds across 16 channels, 100 patterns, and 10 songs. The instrument excels with organ, pad, and string sounds, though guitar and piano sounds are not its strong points. The later models also featured an upgraded and much better sounding acoustic piano sound.

  The 01/W series was used by notable artists including Rick Wakeman, Tony Banks, Keith Emerson, Phil Collins, Jan Hammer, Vangelis, Jean Michel Jarre, Moby, and Peter Gabriel.
specs: |-
  - 32-voice polyphony, 16-part multitimbral
  - AI2 sample and synthesis engine
  - 48 MB ROM with 254 sampled instruments
  - 32 oscillators in single mode, 32 oscillators with 16 sounds in double mode
  - VDF digital lowpass filter (velocity sensitive, non-resonant)
  - VDA digital amplifier with 4-stage ADSR envelope
  - 2 LFOs
  - 2 multi-effects processors with 47 digital effects
  - 200 user programs, 200 user combinations
  - 16-track sequencer with up to 48,000 notes (FD/Pro versions) or 7,000 notes (original)
  - 100 patterns, 10 songs
  - Real-time and step editing
  - 61 keys (01/W, 01/WFD), 76 keys (01/Wpro), 88 weighted keys (01/WproX)
  - Velocity and aftertouch sensitive
  - Multi, layer, and split keyboard modes
  - 3.5-inch 720KB 2DD floppy disk storage (FD and Pro models)
  - MIDI In, Out, and Thru (16-part)
  - Produced 1991-1995
