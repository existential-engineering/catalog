details: |-
  The Manis Overdrive combines germanium NOS transistors with germanium diodes for extra compression and saturation, and adds a 3dB bass boost. Keeley positions it as a reworking of the transparent overdrive circuit the pedal world calls the Klone, with a hard clipping clean boost character updated by the maker's power supply improvements and fixes to the tonal shortcomings of the original design.

  A germanium switch sits at the heart of the pedal. Substituting the essential germanium diodes with Cold War era germanium transistors increases compression and saturation, giving a softer attack that sits closer to a tube amp. A second switch lowers the low frequency cutoff by exactly one octave and raises output by 3dB, which recovers low end for single coil guitars. The pedal is also the first in this circuit family rated for 18 volt operation.

  Bypass mode is selectable on the fly. Holding the footswitch for two seconds toggles between buffered switching, which avoids pops and clicks and keeps the rig sounding clear when the pedal is off, and true bypass, which suits a rig where a buffer would affect the tone of a vintage pedal.

  The Manis is designed, engineered and manufactured in Oklahoma City, with circuit boards and aluminium enclosure built in house. It won a Premier Guitar Premier Gear Award. At launch it was offered in three colorways: standard brushed silver, a PGH exclusive black and a Guitar Center exclusive gold.
specs: |-
  - Hard clipping clean boost circuit using Russian transistors in place of germanium diodes
  - Ge-Trans switch selects diodes or transistors, changing feel with increased saturation and tube-like compression
  - Bass+ switch lowers the frequency response by one octave and pushes 3dB harder
  - Selectable true bypass or buffered silent switching, toggled by holding the footswitch for two seconds
  - 18 volt capable for extra headroom
  - Aluminium enclosure fabricated in house, built in Oklahoma City, USA
  - Launch colorways: brushed silver, PGH exclusive black, Guitar Center exclusive gold
