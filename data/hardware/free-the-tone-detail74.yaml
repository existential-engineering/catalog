description: A signal junction box that collects the inputs and outputs of a
  pedalboard or rack into one place, carrying four 1/4-inch mono phone jacks and
  two 7-pin DIN connectors for MIDI cables and ARC series link connections.
details: |-
  Signal junction boxes are the products Free The Tone has custom-made the most. They are simple devices for connecting cables, but a great many musicians use them on their pedalboards or in their racks, and to provide the highest sound quality and the best user-friendliness Free The Tone brings to them the expertise gathered over more than twenty years of designing and building custom products. Collecting the inputs and outputs of a pedalboard into one place is what they are for.

  Wiring between devices is simplified and setup time is shortened. Damage to cables and plugs is reduced, because the junction box is the interface that gets plugged and unplugged rather than the effects units themselves, which sit packed into a narrow space inside a pedalboard. Depending on where the product is positioned, the INPUT jack on either side can be used as the input.

  Alongside the phone jacks, DIN connectors are available. A 7-pin DIN connector provides support for MIDI cables and for LINK connections to the ARC series, so a routing controller's link can pass through the same interface as the audio lines.

  The JB-21B carries four standard 1/4-inch mono phone jacks and two 7-pin DIN connectors, measures 100 by 62 by 34 mm including protuberances such as jacks, and weighs approximately 240 g excluding accessories. It is entirely passive, with no power supply and no DC input jack.

  Two specification changes were made in response to the trend toward smaller pedalboards, where effects pedals and tuners are increasingly placed on top of the junction box. Terminal name labelling changed to silk-screen printing across the JB-21B, JB-41C and JB-82C, because the previous labels risked peeling when hook-and-loop fasteners were attached and detached from the top. The JB-41C was also lowered in height, from 56 mm to 34 mm, to suit devices sitting on top of it.
specs: |-
  - Terminals: 4x standard 1/4-inch phone jacks (mono), 2x DIN 7-pin connectors (for linking MIDI/ARC Series)
  - Passive unit: no power supply and no DC input jack
  - Either side's jack can be used as the input, depending on how the unit is positioned
  - 7-pin DIN connectors support MIDI cables and LINK connections for the ARC series
  - Terminal name labelling by silk-screen printing, so labels cannot peel when hook-and-loop fasteners are removed from the top
  - Dimensions: 100W x 62D x 34H mm (incl. protuberances such as jacks)
  - Weight: approx. 240 g (excl. accessories)
  - Accessories: warranty card, Web Access Card
