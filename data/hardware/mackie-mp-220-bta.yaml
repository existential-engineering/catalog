description: Dual Dynamic Driver Professional In-Ear Monitors with Bluetooth Adapter.
details: |-
  When you need to hear yourself and everything else as clearly as possible on stage, in-ear monitors are the ultimate solution. MP Series monitors offer clarity and bass response you need to perform your best while being comfortable enough to wear all night.

  We've been helping artists perform their best for decades with our renowned loudspeaker designs, and now we are bringing that signature sound straight to your ears. The precision-tuned drivers, ergonomic design, and rugged construction ensure you'll never miss a beat.

  The MP-220 BTA pairs dual precision dynamic drivers per earpiece with a Bluetooth 5.0 adapter, giving you wired monitoring fidelity for the stage and wireless convenience for everyday listening. Detachable MMCX cables, swiveling connectors, and up to 40dB of sound isolation keep the fit secure and the outside world out.
specs: |-
  - Frequency Response: 20 Hz – 20 kHz
  - Impedance: 16 Ohms
  - Transducer Type: Dual Dynamic
  - Sensitivity: 88dB±3dB@1mW at 1KHz
  - Up to 40dB sound isolation
  - Dual precision dynamic drivers per earpiece
  - Bluetooth 5.0 adapter included
  - Detachable MMCX connectors (swiveling)
  - Three ear tip types (foam, silicone, double flange) in three sizes
  - Gold-plated 1/8" to 1/4" adapter included
  - In-line microphone and controls on Bluetooth adapter
