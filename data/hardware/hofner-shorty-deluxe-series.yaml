description: Shorty Deluxe solid body travel guitar.
details: |-
  The perfect travelling companion just got even better – introducing the new Hofner Shorty Deluxe. Offering versatility and convenience in the one compact package, the deluxe model offers the same full-scale length and small overall dimensions as the original model, making it ideal for playing anywhere at any time, whether on the couch or on the road.

  What takes the Shorty Deluxe to the next level is the addition of twin Humbucker pick-ups, giving an extended range of tonal values to get the sound and warmth you want. And it looks just as great as it sounds, with a new headstock design reflecting the classic Hofner style.

  This guitar will fit in most overhead lockers in aircraft and comes with a durable, padded Hofner gig bag.

  Colour: black or red.
