description: The LT-FW is a FireWire LSlot interface for the Lynx Aurora 8 and
  Aurora 16 A/D D/A converters. It is a FireWire 400 interface that allows up to
  16 channels of analog input and output at sample rates up to 96 kHz.
details: |-
  Nearly all of today's laptops and most desktop computers have FireWire ports. With careful design and clever engineering, FireWire provides an excellent interface for high sample rate multichannel audio. In development for over a year, the LT-FW allows Aurora to be used with FireWire equipped Windows or Mac computers, offering unprecedented audio performance, control and stability.

  Imagine having a MacBook Pro, one Aurora converter, a quality multichannel mic preamp and select microphones. Now you have a fully functional 16 track portable recording studio that can fit in the back of a Miata. And you can record at sample rates up to 96 kHz with this rig.
specs: |-
  - LSlot interface card for the Lynx Aurora 8 and Aurora 16 A/D D/A converters
  - Two FireWire 400 (IEEE-1394a) ports
  - Up to 16 channels of analog I/O at 96 kHz
  - Works with Apple Macintosh and Windows PCs, including laptops, with a compatible FireWire port
  - Supports ASIO and WDM for Windows and CoreAudio for Mac OS X
  - Full WDM implementation allows multiple channel support of 5.1 and 7.1 surround playback formats
  - All relevant settings, such as sample rate selection, sync source selection, channel routing, latency and buffer size, are enabled, controlled and monitored from the host computer
  - Draws power from the host Aurora chassis through the LSlot bay; the page documents no power connector of its own
  - Apple removed FireWire audio support with macOS 13 Ventura; macOS 12 Monterey still supports FireWire audio
  - Discontinued February 2013
