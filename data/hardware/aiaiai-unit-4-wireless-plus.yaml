description: Portable studio monitors with powerful performance and accurate
  sound representation. Battery-powered with ultra-low latency wireless audio
  via W+ Link, Bluetooth 5.2, and a 20-hour playback time. Sold as a stereo pair
  with the X02 wireless transmitter.
details: |-
  Stereo pair (2 units) of portable battery-powered studio monitors with the X02 W+ Link wireless transmitter.

  2-way active monitor with a 4-inch high-excursion paper-cone woofer and a 1-inch silk-dome tweeter crossed at 3kHz. Rear bass vent doubles as a carrying handle. LED battery status rings on the front, magnetic steel protective grille, 3/8-inch BNC microphone stand mount.

  Glue-free design for easy disassembly with replaceable batteries and driver units. 100% recycled plastic construction. Mobile app provides 5-band EQ and sound profile customization. Includes USB-C cable, protective pouches, magnetic steel grilles, and regional power supplies.
specs: |-
  - Woofer: 4-inch high excursion paper cone
  - Tweeter: 1-inch silk dome
  - Crossover: 3 kHz
  - Frequency range: 40 Hz - 40 kHz (-10dB)
  - Frequency response: 50 Hz - 20 kHz (+/-2dB)
  - Peak SPL: 105 dBSPL
  - Amplifier power: 2x30W continuous, 2x80W peak
  - W+ Link latency: 16 ms
  - W+ Link audio quality: Uncompressed 44.1 kHz 16-bit
  - W+ Link operating range: 12 m
  - Bluetooth version: 5.2
  - Battery playback time: 20 hours
  - Charging time: 2 hours
  - Battery capacity: 77 Wh
  - Weight per unit: 2540 g
  - Dimensions per unit: 156 x 258 x 114 mm (6.14 x 10.16 x 4.49 in)
  - Mounting thread: 3/8-inch BNC
