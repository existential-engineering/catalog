details: |-
  3350 Multimode VCF

  The 3350 Multimode VCF Eurorack PCB and Front Panel Kit is a versatile DIY voltage-controlled filter built around the classic 3350 filter IC (CEM3350, AS3350, or equivalent). Implemented as a state variable filter topology, it provides multiple filter responses simultaneously, making it a powerful and flexible sound-shaping tool for Eurorack systems. Key Features

  - Beginner to intermediate friendly DIY build
  - Front panel made from PCB material, screen printed by hand

  State Variable Filtering & Sound Design

  The 3350 Multimode VCF uses a state variable filter core, allowing low-pass, band-pass, and high-pass signals to be accessed at the same time. This makes the module ideal for parallel filtering, complex patching, and advanced sound design techniques. Smooth frequency sweeps and controllable resonance provide classic analog character, while voltage control over both frequency and resonance enables expressive modulation using envelopes, LFOs, and sequencers. Integrated Audio Mixing

  A built-in two-input audio mixer allows you to combine sound sources directly at the filter input. Input 1 is internally set to full level, while Input 2 includes a level control for balancing multiple oscillators or audio sources — reducing the need for an external mixer in compact systems. DIY Build & Front Panel

  This DIY Eurorack filter kit is suitable for beginner to intermediate builders. The front panel is made from durable PCB material and hand screen printed, ensuring a cohesive aesthetic across Guru Gara Synth modules. Technical Specifications

  Skiff Friendly Module

  View Documents

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category. Video Demo
