description: "Focusrite Scarlett 4i4 is the complete compact studio hub for all
  your instruments, perfect for multi-instrumentalists and collaborators."
details: |-
  A compact studio hub featuring two ultra-low-noise mic preamps with instrument, line, and MIDI connectivity.

  Supports keys, guitars, synths, grooveboxes, and controllers with independent mixes for headphones and line outputs.

  Includes Air preamp modes (Presence and Harmonic Drive), Auto Gain, and Clip Safe features.
specs: |-
  - Resolution: 24-bit/192 kHz
  - Sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Dynamic range: 120dB
  - Gain range: 69dB
  - Connectivity: USB 2.0, USB Type-C
  - Bus-powered
  - Dimensions: 180mm x 130mm x 60mm
  - Weight: 0.798kg
