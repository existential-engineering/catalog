description: >-
  The Siel Orchestra is a fully polyphonic four-section analog keyboard from the
  late 1970s, offering brass, strings, organ, and piano timbres that can be
  layered in pairs. Later rebranded as the ARP Quartet, it became a go-to
  instrument for lush analog string and brass textures in both studio and live
  settings.
details: |-
  Released in 1979 by the Italian synthesizer manufacturer Siel, the Orchestra is a four-part polyphonic keyboard designed for players who needed orchestral textures without the complexity of a full synthesizer. Its four tone families (brass, strings, organ, and piano) can be selected individually or combined in pairs, providing a straightforward approach to layered sounds.

  The original Orchestra offers 49-note polyphony across its keyboard, with individual attack and decay controls for the strings, brass, and piano sections, plus a brilliance control for overall timbral shaping. An LFO with adjustable speed, depth, and delay provides vibrato modulation. While the editing options are limited compared to a true synthesizer, the raw analog tone quality gives the Orchestra a warmth and character that digital alternatives of the era could not match.

  A second version, the Orchestra 2, arrived in 1983 with significantly expanded capabilities including dedicated cutoff and resonance filter controls, a five-band graphic equalizer, octave transposition, and an Animator flange effect. Siel was later acquired by ARP, which relabeled the instrument as the Quartet. Notable users include 808 State and Massive Attack, both of whom favored the ARP Quartet version for its distinctive string sounds.
specs: |-
  - Polyphony: 49 notes (fully polyphonic)
  - Sections: Brass, Strings, Organ, Piano (playable individually or in pairs)
  - Filter: Brilliance control (Orchestra 1); cutoff and resonance (Orchestra 2)
  - LFO: Fixed waveform with speed, depth, delay sliders
  - Envelopes: Individual attack/decay for strings, brass, piano
  - Keyboard: 49 keys
  - Effects: None (Orchestra 1); Animator flange, 5-band graphic EQ (Orchestra 2)
  - Memory: None
  - Control: None
  - Production: Orchestra 1 (1979-1982), Orchestra 2 (1983-1986)
