url: https://www.klipsch.com/products/rc-64-iii-center-channel-speaker
description: The RC-64 III is Klipsch's flagship center channel speaker,
  delivering cinema-quality acoustics with an all-new 1.75" titanium diaphragm
  compression driver, a 90° × 90° Tractrix horn, and quad 6.5" Cerametallic cone
  woofers. Designed and assembled in Hope, Arkansas, it features furniture-grade
  wood veneers and a 2.5-way network crossover.
details: |-
  The RC-64 III compression driver features a new phase plug design to improve phase coherency at the throat of the horn, resulting in improved sound pressure linearity at high frequencies.

  The redesigned 90° × 90° Tractrix horn utilizes a circular horn throat paired to a square horn mouth to further improve high-frequency response and extension, while enhancing imaging and dynamics. The compressed molded rubber construction adds high-frequency damping to reduce harshness and improve detail.

  Cerametallic woofers represent the pinnacle of Klipsch driver design, maintaining exceptional rigidity and lightweight construction for minimal cone breakup and distortion. Each 6.5" woofer features a heavy-duty cast aluminum frame for resonant-free operation. When paired with the Tractrix horn-loaded compression driver, it provides speaker efficiency highest in its class.

  The sophisticated 2.5-way network crossover attenuates the outer woofers' output at higher frequencies to minimize horizontal interference off-axis, maintaining a wide and even sound distribution. RC-64 III enclosures are made in the USA in Hope, Arkansas, utilizing furniture-grade wood veneers.
