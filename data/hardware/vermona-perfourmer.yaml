description: >-
  The Perfourmer is a hands-on, real-time quad analog synthesizer consisting of four
  independent monophonic synth voices, each with its own VCO, filter, envelopes, and LFO.
  The four voices can be layered in unison for complex leads and bass, paired in duophonic
  mode, played polyphonically, or used in FM mode where voices modulate each other. Each
  channel has individual audio outputs in addition to stereo main mix outputs, and
  external signals can be processed through the four-channel filterbank.
details: |-
  Each of the four identical synth channels includes a VCO with six waveforms plus white-noise generation, with pitch adjustable by plus or minus 13 halftones. A 4-pole 24dB/oct lowpass resonant filter with variable keytracking and dedicated ADSR envelope shapes the frequency response of each voice. The VCA features its own ADSR envelope modulation or fixed gate envelope control, plus LFO modulation capability.

    The LFO on each channel offers four waveforms and can modulate VCO pitch, VCF frequency cutoff, and the VCA. With 18 knobs per channel arranged across two rows, the Perfourmer is designed for hands-on real-time sound manipulation.

    The instrument provides multiple operational modes to suit different performance needs. Unison mode combines all four voices into a monophonic sound for thick leads and bass. Duophonic mode pairs voices 1+2 and 3+4 for two-fingered pad performance. Polyphonic mode enables four-voice polyphonic operation. FM mode uses voices 1 and 3 as modulators for channels 2 and 4, opening up more complex timbral possibilities.

    Each channel has its own individual audio output in addition to the stereo main mix outputs. Audio inputs allow external signal processing through the four-channel filterbank, and insert jacks enable creative signal routing between synthesizer channels for complex sound design. The Perfourmer has no onboard patch memory, so all sounds must be dialed in manually using its 72-plus knobs.
specs: |-
  - 4 voice polyphony
    - 4 VCOs with 6 waveforms each plus white noise
    - 4-pole 24dB/oct lowpass filter per voice with resonance and variable keytracking
    - Dedicated ADSR envelopes for VCF and VCA per voice
    - 1 LFO per voice with 4 waveforms
    - Unison, duophonic, polyphonic, and FM operating modes
    - Individual audio outputs per channel plus stereo main mix
    - Audio inputs for external signal processing
    - Insert jacks for inter-channel signal routing
    - MIDI In and Thru
    - Optional CV/Gate inputs (1V/oct)
    - No patch memory
    - Rack-mount format
