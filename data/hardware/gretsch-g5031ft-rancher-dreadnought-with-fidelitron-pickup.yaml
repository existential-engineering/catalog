details: |-
  Gretsch Rancher acoustics are back and better than ever! The G5031FT Rancher dreadnought is a distinctive Rancher model, with a sweet iso-chamber mounted Fideli'Tron pickup for great amplified tone and performance.

  Features a solid spruce top with scalloped X-bracing, flame maple back and sides, mahogany neck, and gold-plated hardware. Equipped with a master volume control for the iso-chamber mounted Fideli'Tron pickup.
