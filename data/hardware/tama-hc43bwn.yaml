details: |-
  Boom/Straight Convertible Tilter: Don't let limited stage space cramp your style! If there's no room for a boom, simply convert the stand to a straight stand. The boom arm stores neatly in the upper tube.

  Reversible Bottom: The cymbal bottom protects the cymbal's center hole from the tilter's shaft and threads. If part of the nylon sleeve wears out, you can continue to use the cymbal bottom by turning it upside down.

  Quick-Set Cymbal Mate (US. PAT.No.7629526): By simply gripping and pressing the two buttons on the both sides, users can attach and remove the Cymbal Mate with just one touch, making cymbals setup/breakdown a snap. Like our standard Cymbal Mate: fine adjustments to the cymbal's swinging motion can be made by rotating the unit.
