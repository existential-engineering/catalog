description: Active Mini-Reference Monitor featuring a 5.25" proprietary driver
  and 60W Class A/B amplifier in a compact cube form factor — designed to
  replicate bass-challenged consumer playback devices for reliable mix
  translation checking.
details: |-
  The Mixcube Active is Avantone Pro's self-powered version of the classic
  studio reference cube monitor, designed to replicate the sonic character of
  bass-challenged consumer playback devices such as car stereos, televisions,
  clock radios, computers, and wireless speakers — giving engineers a reliable
  'safety net' for verifying mix translation.

  The monitor features a proprietary 5.25" die-cast polished aluminum frame
  driver with a custom paper cone made from New Zealand pulp with mica fibers
  for reduced weight and added rigidity. The cloth surround is manufactured in
  Japan to exacting tolerances, and the motor structure uses Sumitomo 1008
  low-carbon steel top plate and T-Yoke with Y-40 GRADE (MIL-SPEC) magnets
  yielding a 43 oz. high-power, low-distortion motor.

  The integrated Class A/B amplifier module delivers 60 watts RMS and was
  engineered from the ground up with 'overkill' component selection for robust
  headroom and performance rivaling higher-priced rack-mount studio amplifiers.
  The signal-to-noise ratio is -113 dB.

  The sealed 18mm MDF cabinet includes internal shielding, Dacron acoustic
  stuffing, and a 7mm neoprene isolation pad on the base. A recessed
  industry-standard 5/8"-27 mic stand mount is built into the bottom of the
  cabinet for flexible placement. The input uses a dual-banana XLR/TRS combo
  jack supporting both +4 dBu balanced and -10 dBV unbalanced signals.

  Available in four color variants: Black, Creme, Red, and White.
specs: |-
  - System Type: Active (self-powered) shielded full-range stereo pair
  - Frequency Response: 200 Hz – 10 kHz
  - Impedance: Nominal 8 ohms
  - Max SPL: 104 dB @ 1 meter = 1% THD (pink noise)
  - Amplifier Type: Class A/B
  - Amplifier Power: 60 watts RMS @ 0.005% THD (1 kHz)
  - Noise: S/N -113 dB
  - Sensitivity: 0 dBu (0.775 VRMS) input at maximum volume (+6 dB) = 104 dB SPL
  - Driver: Proprietary 5.25" cast aluminum frame / paper cone / shielded
  - Cabinet: Sealed / 18mm MDF / Dacron acoustical stuffing
  - Input: XLR & TRS combo jack, +4 dBu balanced and -10 dBV unbalanced
  - Weight: 7.13 lbs (per monitor)
  - Dimensions: 6.5" × 6.5" × 6.5"
  - Available colors: Black, Creme, Red, White
