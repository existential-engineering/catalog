description: The Nibbler is a four-bit digital accumulator based on CMOS logic
  that counts in binary from zero to fifteen, with individual bit inputs/outputs
  and stepped voltage outputs. It can generate rhythms, modulation voltages,
  melodies, subharmonics, and modem-like noise depending on clock speed.
details: |-
  The Nibbler is a four bit digital accumulator based on CMOS logic. This means that it counts in binary from zero to fifteen, with inputs and outputs for individual bits as well as stepped voltage outputs (digital to analog converters). It does this with individual logic chips instead of a CPU. The concept here is that counting in binary (and its expression in bits) is inherently musical, and with slow clock speeds we can use it to create both rhythms and modulation voltages (or melodies). At audio rate we can generate subharmonics and modem-like sounds (or noise). Download manual here

  Download quickstart guide here

  Features
specs: |-
  - 5 rhythmically related gate outputs (or audio rate square waves)
  - 2 stepped voltage outputs
  - Second stepped voltage has selectable phase offset
  - Cherry MX Brown switch for reset
  - 4 gate inputs for modulation
  - Chainable using carry in and out
  - Reset input can be used as hard sync at audio rate
  - Subtract input can add variation to sequences
  - Synchronous and asynchronous output modes
  - Shift register functionality (including Rungling)
  - CMOS logic deisgn
  - 12 HP
  - Skiff friendly 28mm depth (35mm including cables)
  - POWER DRAW: +12V 37mA, -12V 17mA
