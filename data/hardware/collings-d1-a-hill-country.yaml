description: The D1 A HC is part of the Hill Country series, designed to push
  acoustic tone to the far end of the tonal spectrum with a strong fundamental
  voice that is both warm and woody. Built with an Adirondack spruce top and
  Honduran mahogany back and sides, it delivers a dry character and full low end
  suited to bluegrass and beyond. Appointments include an ebony fingerboard with
  gold MOP dots, a hand-poured tortoise pickguard, and Relic Nickel Waverly
  tuners.
details: |-
  The D1 A HC (Hill Country Dreadnought) is a premium acoustic guitar built to deliver a warm, woody, fundamentals-forward tone. The Adirondack spruce top is paired with Honduran mahogany back, sides, and neck, giving the instrument a dry, full low end that excels in bluegrass and similar styles while remaining versatile across genres. The ebony fingerboard features a 14" to 26" compound radius and gold mother-of-pearl dots. Construction details include a Hill Country scalloped X-brace pattern with an abbreviated soundboard graft tongue brace, a mortise and tenon hybrid neck joint, and a fully adjustable truss rod. The body is finished in high gloss ultra-thin nitrocellulose lacquer. Hardware includes Relic Nickel Waverly tuners and medium 18% nickel-silver frets. A hand-poured tortoise pickguard set — including rosette ring, wedge, and heel cap — completes the appointments.
specs: |-
  - Top: Adirondack spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Ebony with gold MOP dots
  - Bridge: Ebony belly-style
  - Nut: Aged bone, 1 3/4"
  - Saddle: Aged bone, cutthrough
  - Bridge Pins/End Pin: Ebony
  - Body Binding: Tortoise
  - Tuners: Relic Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - String Spacing: 2 5/16"
  - Scale Length: 25 1/2"
  - Fingerboard Radius: 14" - 26" compound
  - Neck Profile: Comfortable C to modified V
  - Brace Pattern: Hill Country scalloped X-brace with abbreviated soundboard graft tongue brace
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Body Finish: High gloss ultra-thin nitrocellulose lacquer
  - Neck Finish: High gloss ultra-thin nitrocellulose lacquer
  - Pickguard: Hand-poured tortoise with matching rosette ring, wedge, and heel cap
  - Backstrip: 1-style (walnut)
  - Body Width: 15 5/8"
  - Body Length: 20"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/4"
  - Strings: D'Addario EJ-17 (.013" - .056")
