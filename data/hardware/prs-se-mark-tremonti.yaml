details: |-
  The SE Mark Tremonti provides a powerful voice and classic PRS aesthetic for players ready to rock. Through his solo work and as the lead guitarist of Alter Bridge and Creed, Tremonti has made a name for himself as a heavy rock player with melodic strength. The Tremonti "S" pickups are paired with dual volume and tone controls, offering the articulate aggression needed to cover Tremonti’s tonal demands. Additional appointments include a shallow violin carve with flame maple veneer, wide thin maple neck, and a trem-up route, making the SE Mark Tremonti fast to play and hard to put down.
specs: |-
  - Body Construction: Solidbody
  - Top Wood: Maple
  - Veneer: Flame Maple
  - Back Wood: Mahogany
  - Top Carve: Shallow Violin
  - Number of Frets: 22
  - Neck Wood: Maple
  - Neck Construction: Multi-Ply
  - Truss Rod: PRS Double-Acting
  - Neck Shape: Tremonti
  - Fretboard Wood: Rosewood
  - Fretboard Inlay: Birds
  - Bridge: PRS Patented Tremolo with Trem-Up Route
  - Tuners: PRS Designed Tuners
  - Hardware Type: Nickel
  - Nut: PRS
  - Gig Bag: Controls
