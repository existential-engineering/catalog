description: >-
  Roland's entry-level groove workstation combining MC-505 sound libraries with SP-202 sampling
  capabilities, a D-Beam controller, built-in speakers, and a 49-key velocity-sensitive keyboard
  aimed at aspiring electronic music producers.
details: |-
  The EG-101 was Roland's attempt to package the essential elements of electronic music production into an affordable, self-contained instrument. Drawing its sound engine from the MC-505 groovebox and its sampling section from the SP-202, it offered a compelling feature set that included sub-basses, trance pads, and classic 808/909 drum kits alongside user-recordable samples.

  The DJ/Remix mode and Real-time Phrase Sequencer (RPS) allowed quick groove generation suitable for both live DJ performance and composition starting points. Real-time controls for filter cutoff, resonance, ring modulator, and reverb provided hands-on sound shaping, while an external audio input could be routed through the filter and ring modulator for processing external sources. Roland's D-Beam infrared controller added a theatrical element to live performance.

  The sampling section supported 16 total samples with adjustable sample rates ranging from 7.81 kHz for lo-fi textures with up to 128 seconds of recording time, to 31.25 kHz for standard quality at 32 seconds maximum. Basic editing tools included pitch adjustment, time stretch, filtering, effects processing, auto-looping, and truncation. The eight-track sequencer enabled full arrangement creation with real-time pattern switching and track muting.

  With its built-in speakers and 49-key velocity-sensitive keyboard, the EG-101 was clearly positioned for the home producer and bedroom musician market. Its 24-voice polyphony and 448 preset sounds provided plenty of raw material for dance, electronica, and hip-hop production, even if more experienced producers would quickly outgrow its capabilities.
specs: |-
  - Polyphony: 24 voices
  - Multitimbral: 11 parts
  - Keyboard: 49 keys (velocity sensitive)
  - Drum Kits: 12
  - RPS Phrases: 64
  - Memory: 448 preset sounds
  - Sampler: 16 samples; 7.81 kHz (128 sec) to 31.25 kHz (32 sec)
  - Sequencer: 8 tracks with real-time pattern switching
  - Effects: Reverb, ring modulator, filter, resonance, cutoff
  - Controllers: D-Beam
  - MIDI: In/Out
  - Built-in speakers
