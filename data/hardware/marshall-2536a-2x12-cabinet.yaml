description: An iconic 2x12" angled speaker cabinet from Marshall's Studio Jubilee range, designed to pair with the 2525H Mini Jubilee head and 2525C combo. Loaded with two 12" Celestion G12 vintage speakers in an angled baffle for upward stage projection, the cabinet handles 140W through a single mono input at 8Ω and is voiced to deliver the classic Silver Jubilee tone associated with the original 2555 from 1987 in a more compact, home- and studio-friendly format than a full 4x12.
details: |-
  This compact 140W cabinet is designed with space in mind without losing that classic Marshall look or sound. The two Celestion G12 vintage speakers deliver a high-end response.

  The 2536A 2x12 Angled Cabinet has a mono input and is built to be paired with the Studio Jubilee Head.

  Inspired by the Silver Jubilee, it delivers an aggressive Marshall sound with dynamic lows and creamy highs.

  Built in Marshall's UK factory. Designed and engineered in UK. Made in UK.
