description: An iconic 2x12" angled speaker cabinet from Marshall's Studio
  Jubilee range, designed to pair with the 2525H Mini Jubilee head and 2525C
  combo. Loaded with two 12" Celestion G12 vintage speakers in an angled baffle
  for upward stage projection, the cabinet handles 140W in mono operation (70W
  stereo) and is voiced to deliver the classic Silver Jubilee tone associated
  with the original 2555 from 1987 in a more compact, home- and studio-friendly
  format than a full 4x12.
