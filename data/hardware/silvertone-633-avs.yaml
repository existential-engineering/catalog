details: |-
  The Roots of Rock...Unplugged

  Originally manufactured in the 1960's by the Harmony Factory in Chicago, the 'Sovereign' made its stamp on rock n roll history via greats such as Pete Townsend and Jimmy Page. The Silvertone version of this jumbo dreadnought, the 633, was introduced in 1965 and continued until 1973. This 'Big Daddy' jumbo of the Silvertone acoustic family is certain to be appreciated for itsloud volume and deep tone just the same way it was back then. Like the 600 model, the 633 features a solid Engelmann Spruce top and Mahogany back and sides for a well balanced and articulate sound. The old 'steel reinforced' neck has been replaced with a modern two way adjustable truss rod and a C-shape neck profile.
specs: |-
  - Construction - Jumbo Dreadnought
  - Top - Solid Engelmann Spruce
  - Nack & Sides - Mahogany
  - Finishes - Vintage Sunburst
  - Nut Width - 1-11/16"
  - Tuners - Chrome sealed
  - Bridge - Rosewood bridge
  - Material - Mahogany
  - Shape - C
  - Inlays - Pearl Dot
  - Binding - Ivory single ply
  - Frets - 20 fret, 25-1/2" scale
  - Fingerboard - Rosewood
  - Pickguard - Tortoise
