details: |-
  The DW 3000 Series Hardware has been completely redesigned from the ground up.

  With double-braced legs and steel medium-weight tubing, this single tom stand includes a 1/2″ knurled ball-and-socket tom arm and a handy rear auxiliary V-clamp. Also standard is a newly-tooled tube joint with integrated memory lock and oversized anti-skid feet.

  The 3000 Series is engineered for drummers of all levels, with sturdy double-braced hardware providing stability and durability during intense performances, smooth memory locks for seamless adjustment, and a sleek design that complements any drum kit.
