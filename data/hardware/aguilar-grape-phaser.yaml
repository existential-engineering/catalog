url: https://aguilaramp.com/products/grape-phaser-bass-pedal
description: The Grape Phaser provides lush, analog phase shifting via a simple
  two-knob layout. Delivering tones from flowing, liquid textures to fat, funky
  phasing ideal for soloing, fretless, and slap playing. RATE controls
  modulation speed while COLOR feeds signal back through the phase circuit for
  unique, resonant tones.
details: |-
  Four-stage all-analog phase shifter circuit. RATE knob controls modulation
  speed from slow, subtle sweeping to fast, tremolo-like phasing. COLOR knob
  feeds the signal back through the phase circuit, adding resonance and character
  — from smooth and transparent to more pronounced, funky phasing.

  Backed by Aguilar's three-year limited warranty to the original owner.
specs: |-
  - Type: Four-stage analog phase shifter
  - Controls: RATE (modulation speed), COLOR (feedback/resonance)
  - Power: 9V DC (not included)
  - Input: One 1/4-inch jack
  - Output: One 1/4-inch jack
