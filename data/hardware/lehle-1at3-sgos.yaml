description: The LEHLE 1AT3 SGOS is a programmable True Bypass switcher that
  lets you switch backwards and forwards between up to three amplifiers, when
  you want, as often as you want.
details: |-
  The LEHLE 1AT3 SGOS is a programmable True Bypass switcher that lets you switch backwards and forwards between up to three amplifiers, when you want, as often as you want.

  In combination with jack socket C to B, output C can also be used alternatively as an effect loop for amp B, excluding all the effects you don't currently need from the signal path. A tuner can also be connected to output A, taking it, too, out of the signal chain. The gold-plated-contact relays feature active pop-and-click suppression, and switch not only the signal, but also the signal ground, making hum loops impossible when switching back and forth between outputs A, B and C.

  Like all members of the SGoS family, the LEHLE 1AT3 SGOS can also be programmed unbelievably easily and intuitively. The slender, TRS format remote socket assists with programming, and can be used, via a stereo patch cable, to communicate with other SGoS switchers, or for direct contact with MIDI controllers. The LEHLE 1AT3 SGOS can be programmed as a stand-alone unit, or remote controlled using MIDI program change commands.

  All Lehle switchers feature special relays and slide switches with gold-plated contacts for totally reliable, absolutely zero-loss switching. A processor based on the ARM Cortex-M technology controls the switching operation very fast and precisely, and the interplay of the components used here enables a service life of 2 million switching operations.

  The easy-action mushroom-shaped buttons characteristic of LEHLE products are mounted in the cover, so that foot pressure is transmitted indirectly only, via a spring. Thus the electronics board is not exposed to mechanical loads.
specs: |-
  - Programmable True Bypass switcher for up to three amplifiers
  - Output C can alternatively serve as an effect loop for amp B via the C to B jack socket
  - Tuner can be connected to output A and taken out of the signal chain
  - Gold-plated-contact relays with active pop-and-click suppression
  - Switches the signal ground as well as the signal, preventing hum loops
  - TRS remote socket for linking with other SGoS switchers or MIDI controllers
  - Programmable stand-alone or remote controlled via MIDI program change commands
  - ARM Cortex-M based control with a service life of 2 million switching operations
