details: |-
  The DN716 is a 1U rackmount digital delay line with one electronically balanced input and three independently adjustable unbalanced outputs. Each output offers over 1.31 seconds of delay in 20 microsecond steps, which suits multi-zone delay-tower alignment in large-venue PA work where every cluster needs its own time offset from the main system.

  The single input feeds three discrete delay paths, each adjustable from zero to 1.311 seconds with 20 microsecond resolution. The architecture is built around a high-speed CPU, which gives the unit a lower component count and improved reliability over earlier discrete designs in the series.

  Input and output filters are proprietary low-pass hybrid types designed for optimum noise performance, low distortion and high reliability. The input is electronically balanced and the outputs are unbalanced, suitable for short runs to dedicated power amplifiers in delay-tower zones.

  Typical applications are multi-zone PA delay alignment, festival main- and side-fill timing, and theatre installation work where several speaker zones must lock to a single source. The 1.3 second per-output range covers all practical distances in commercial installations.
specs: |-
  - One input and three independently adjustable outputs
  - Delay range 0 to 1.311 seconds per output, in 20 microsecond steps
  - Proprietary low-pass hybrid input and output filters
  - Electronically balanced input, unbalanced outputs
  - High-speed CPU architecture
  - 1U rackmount
