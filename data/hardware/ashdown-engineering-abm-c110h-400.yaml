id: r_pbgMZDLuXsL3D_IsuY9
name: ABM C110H-400
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/abm-c110h-400
description: A compact 1x10 inch bass combo from the ABM NEO range, pairing the
  iconic ABM preamp with a lightweight 400-watt power section for pure Ashdown
  ABM tone in a portable package. Hand-made in the UK, it is sized to be matched
  with an extension cab from the NEO range for easy rig expansion.
details: |-
  The ABM C110H-400 is a compact 1x10 inch bass combo from Ashdown's ABM NEO range, launched for 2014. It couples the iconic ABM preamp with a lightweight 400-watt power section for pure ABM tone in a portable, hand-made-in-the-UK package. Connectivity includes a switchable High/Low instrument input, a line input, a line output, a balanced DI output, a tuner output, and an FX loop, with a 12AX7 preamp tube. It is sized to be matched with a NEO-range extension cabinet.
specs: |-
  - Power Output: 400 Watts
  - Speaker Configuration: 1 x 10
  - Speaker Outputs: Speakon/Jack
  - Minimum Impedance: 4 Ohms
  - Frequency Response: -3dB at 17Hz and 30kHz
  - High Instrument Input: 3.9M Ohms
  - Low Instrument Input: 10k Ohms
  - Line Input: 22k Ohms
  - Line Output: 10k Ohms
  - DI Output: 600 Ohms balanced
  - Tuner Output: 1k Ohms
  - Effects Send: 22k Ohms
  - Effects Return: 22k Ohms
  - Pre-Amp Tubes: 1 x 12AX7
