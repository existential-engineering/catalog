details: |-
  The AC2 blends the best features of acoustic and electric guitars. Borrowing the A2 shape and neck, the model is heavily chambered and adorned with artistic sound holes, mixing aesthetic and functionality.

  The instrument is available in acoustic steel or nylon strings, both complemented by a Kiesel-designed preamp contributing to acoustic-like tones.

  Because of the construction, the increased feedback resistance enhances live-playing sounds.
specs: |-
  - Construction: bolt-on with radiused neck heel, heavily chambered body with sound holes
  - Scale length: 25.5"
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Fingerboard: ebony with 14" radius
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability
  - Body: alder with alder top
  - Electronics: active electronics with master volume, bass and treble boost/cut controls, Kiesel-designed preamp
  - Output jacks: a flush mount output jack and a rear Access output jack, both fitted as standard
  - Bridge: Hipshot fixed bridge, .4125" (10.5mm) spacing
  - Tuners: premium Kiesel non-locking tuners, 20:1 ratio
  - Headstock: inline GT headstock
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Strings: Elixir 16027 Custom Light, with acoustic steel or nylon string options
  - Truss rod cover delete option
  - Neck width options from 1.69" to 2.42" wide at the nut
  - Body dimensions: 38.25" long, 1.65" thick, 12.6" wide, or 39" long, 1.65" thick, 12.6" wide
  - Weight: 5.5 to 5.65 lbs
  - Active electronics run on an internal battery rather than an external power jack
  - Offered in several string counts, configured to order
  - Built to order with a choice of body, top, fingerboard and finish options
