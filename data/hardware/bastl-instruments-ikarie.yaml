url: https://bastl-instruments.com/eurorack/modules/ikarie
description: An 8HP stereo or dual peak filter module with a unique
  lowpass/highpass transition control. Two parallel 12dB/oct state variable
  filter cores can be operated in stereo sync, set apart for stereo effects, or
  chained to form a 24dB filter. The Beyond output delivers the spectral
  difference of the two cores (twin peak / formant effect). Integrated envelope
  follower with three selectable decay settings, output stereo VCA with CV
  pan/detune control, input gain up to 5x, V/OCT with front-panel scaling
  trimmer. Collaboration between Václav Pelousek and Peter Edwards
  (Casperelectronics). Named after the 1963 Czech sci-fi film Ikarie XB-1.
details: |-
  Ikarie is a stereo or dual peak filter module developed through collaboration between Václav Pelousek of Bastl Instruments and Peter Edwards of Casperelectronics. The module features two parallel 12dB/oct state variable filter cores that can be operated in stereo sync, set apart for unique stereo effects, or chained for a 24dB filter.

  A unique lowpass/highpass transition control allows continuous switching between filter modes with a single knob. Voltage-controlled resonance with a well-balanced circuit enables everything from subtle filtering to piercing, throaty resonance. The envelope follower with three selectable decay settings captures input dynamics for internal modulation.

  The Beyond output delivers the spectral difference between the two filter cores, effectively creating a twin peak filter configuration ideal for formant-type and alien soundscapes. An output stereo VCA with CV control over panning (or filter detuning) adds further shaping capability. Input gain supports up to 5x amplification for optional overdrive. V/OCT input with front-panel accessible scaling trimmer enables pitch tracking.

  Named after the 1963 Czech sci-fi film Ikarie XB-1, which pioneered electronic sound design in cinema.
