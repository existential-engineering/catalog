name: N22
manufacturer: cranborne-audio
primaryCategory: patch-bay
categories:
  - routing
url: https://www.cranborne-audio.com/n22
description: N22 is a standalone 4 channel Cat 5 snake and advanced audio
  distribution system using C.A.S.T.
details: |-
  N22 is a standalone 4 channel Cat 5 snake and advanced audio distribution system using Cranborne Audio's C.A.S.T. technology, designed as a tidy, low-cost way to move audio around a studio or stage.

  By repurposing the internal copper wires of a shielded Cat 5e, Cat 6, or Cat 7 cable, N22 replaces 4 balanced XLR cables with a single network cable, transporting balanced analogue audio to and from other C.A.S.T.-enabled products - including a second N22 - over distances of up to 100m (330ft) without high-end roll-off and with very low crosstalk.

  Used as a C.A.S.T. Expander alongside a 500R8 or 500ADAT interface, N22 can be placed in a live room so that mic/line sources connected to its two combi jack inputs are sent directly to the interface's inputs for recording, while the same C.A.S.T. connection carries a stereo monitor mix back to N22's dual 1/4-inch jack and XLR line outputs.

  Two N22 units can also be used standalone as a Cat 5 snake, replacing cumbersome analogue multicore runs to send and receive balanced audio between two locations such as a vocal booth, live room, or hallway.

  N22's C.A.S.T. connection can also carry 48V phantom power from a preamp or audio interface to power condenser microphones and DI boxes, with a single cable able to transfer up to 4 separate phantom power lines. N22 is completely passive and requires no external power of its own.
specs: |-
  - Two balanced combi jack inputs
  - Two balanced 1/4" jack line outputs
  - Two balanced XLR line outputs
  - C.A.S.T. IN port for connecting to a second N22
  - C.A.S.T. OUT port for connecting to 500R8/500ADAT
  - Standalone 4 channel Cat 5 snake using C.A.S.T. audio distribution
  - Compatible with shielded Cat 5e, Cat 6, and Cat 7 cable, up to 100m (330ft)
  - Completely passive, requires no external power
  - Transfers 48V phantom power across up to 4 lines via a single C.A.S.T. cable
