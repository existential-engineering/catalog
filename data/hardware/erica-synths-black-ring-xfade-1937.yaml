url: https://www.ericasynths.lv/black-ring-xfade-1937/
description: Versatile module for sound shaping
details: |-
  The Erica Synths Black Ring-Xfade is an extremely versatile module for sound shaping. It consists of two unconventional ringmodulators and waveshapers, a crossfader that works both for audio and CV, and a VCA.

  Unlike a conventional ringmodulator, which works only with a signal present on both the signal and the carrier input, the Black Ring-Xfade passes the signal through without alteration when no carrier is present, while low level signals on the carrier input result in unique waveshaping. Carrier level is adjustable.

  Placing the voltage controlled crossfader between the two ringmodulators, or between external signals, and topping it up with the VCA gives an amplitude modulation powerplant for a modular system. Crossfade is set manually and by CV.

  Coupling is selectable between AC for audio and DC for control voltage, so the crossfader serves either signal kind, and the VCA offers a selectable bias.

  Audio level is 10Vptp and CV level is -5V to +5V across the full span. The module is 10HP wide and 35mm deep, with power consumption of +38mA and -32mA.
specs: |-
  - Dual ringmodulator/waveshaper
  - Carrier level adjustment
  - Voltage controlled crossfader
  - Manual and CV control over crossfade
  - Selectable AC (audio) or DC (control voltage) coupling
  - VCA with selectable bias
  - Audio level 10Vptp
  - CV level (full span) -5V to +5V
  - Module width 10HP
  - Module depth 35mm
  - Power consumption +38mA, -32mA
