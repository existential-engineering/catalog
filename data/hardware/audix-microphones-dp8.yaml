details: |-
  The DP8 drum pack is a premium ensemble of microphones designed to mic a five-piece kit with accuracy and fine control. Kick, snare, rack toms and floor tom mics feature AUDIX VLM TM capsule technology for natural and precise sound reproduction in high SPL applications. The ultra-compact M1280BHC hi-hat mic and M1280B overhead cymbal mics capture complex timbres and wide dynamic ranges. Included are DVICE rim mounts eliminating the need for bulky mic stands.
