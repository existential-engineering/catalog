description: The AFS224 is a stereo Advanced Feedback Suppression processor
  featuring dbx's patent-pending AFS technology with up to 24 programmable
  filters per channel. Designed for portable and touring applications, it
  delivers transparent feedback elimination with filter Qs as narrow as 1/80 of
  an octave.
details: |-
  The dbx AFS224 was designed as a state-of-the-art feedback elimination processing unit with an intuitive control interface and up to 24 filters per channel. Using dbx's patent-pending Advanced Feedback Suppression technology, the unit automatically detects and eliminates feedback frequencies with minimal impact on overall sound quality.

  The AFS224 supports both stereo and dual independent channel processing modes, allowing the unit to serve double duty as either a stereo feedback suppressor or two independent mono units. Live and Fixed filter modes provide flexibility: Live filters automatically lift over time to make room for new feedback events, while Fixed filters remain permanently engaged for known problem frequencies.

  Application-specific filter types optimized for Speech and Music (Low, Medium, High settings) help tailor the processing to the specific program material. The 24 LED per channel filter metering gives a clear real-time view of active suppression filters. XLR and TRS connectors on both inputs and outputs ensure broad compatibility with professional audio systems.
specs: |-
  - Inputs: 2 total; Female XLR & 1/4" TRS
  - Input Impedance: Balanced 40 kΩ; Unbalanced 20 kΩ
  - Max Input Level: +20 dBu
  - CMRR: >40 dB (typically >55 dB @ 1 kHz)
  - Outputs: 2 total; Male XLR & 1/4" TRS
  - Max Output Level: +20 dBu
  - Sample Rate: 48 kHz
  - Dynamic Range: >110 dB A-weighted; >107 dB unweighted
  - THD+Noise: 0.002% typical at +4 dBu, 1 kHz
  - Frequency Response: 20 Hz – 20 kHz, ±0.5 dB
  - Crosstalk: >80 dB typical
  - Filters per Channel: 24 programmable
  - Power: 9 W; 100/120/230 VAC, 50/60 Hz
