details: |-
  Spector basses have long been cherished by hard rock, metal, and progressive players. As these genres continue to evolve, so do our instruments. Introducing the NS Dimension HP 4-string basses, purpose-built to exceed your expectations and remove every barrier to powerful, modern performance. The NS Dimension HP basses combine the iconic NS contours with cutting-edge multi-scale construction. This powerful pairing delivers optimal performance and an all-business aesthetic that is always ready to work. HP basses are engineered with a 3-piece, multi-scale maple neck capped with a dark ebony fingerboard and illuminating side dot markers. The neck spans the entire length of the instrument, ensuring enhanced tonal transfer, impeccable intonation with lowered tunings, and unwavering stability. Each bass is also loaded with a unique combination of EMG pickups and a Darkglass Tone Capsule preamp, keeping your tone detailed and powerful. Available in White Sparkle, Solid Black, Plum Crazy, and Gunmetal gloss finishes, the NS Dimension HP basses are high-performance basses for today's high-performance players.
