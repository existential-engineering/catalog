description: An analog overdrive pedal offering warm, open overdrive with a
  brighter high-frequency response than the OSD-9. It uses NJM (JRC) 4558 op
  amps and features Drive and Level controls with mechanical true bypass
  switching.
details: |-
  Please note , Godlyke, Inc. is no longer Maxon's Distributor and will no longer be receiving inventory from Maxon Japan. If you're interested in the OOD9 please see Godlyke's new collaborations with Mr. Tamura (original Tube Screamer Engineer), the T amura-Mod Ibanez Tube Screamers . The OOD-9 takes Maxon's resurrected OSD-9 circuit and replaces the NOS 741 Op Amps with current-production NJM (JRC) 4558's. Offering the same warm, open-sounding overdrive as the OSD-9 but with a more pronounced high-frequency response, the OOD-9 is perfect for "livening up" a dark-sounding guitar or amp. The OOD-9 reacts smoothly to input level changes, offering a highly interactive response to player dynamics. Perfect as a stand-alone dirt box or for pushing an amp, the OOD-9 can also be stacked with other OD's to add clarity and character to their tone. The OOD-9 offers up all these classic sounds in Maxon's indestructible, industry standard 9-Series chassis. Modern-day utility features such as mechanical true bypass switching and a voltage regulator have also been added to provide smooth, consistent performance. Providing mild, transparent overdrive that doesn't step all over your original tone, the OOD-9 Organic Overdrive truly lives up to its name. TECH TALK:

  The OOD-9 signal path starts with a 2SK246 jFET buffer which provides a high input impedance and low output impedance into the 1st Op Amp - a NJM (JRC) 4558. This 1st Op Amp is set up to provide a 20 to 120x gain in signal. After the 1st Op Amp we have a pair of diodes to ground, just like classic boxes such as the MXR Distortion+, Pro Co Rat and Boss DS-1. From here it's into another NJM4558 with an amplification factor of 10 to boost the signal back to a high enough level to drive the input of an amplifier if necessary - a feature that the Dist+ and DS-1 do not offer. From here the signal is routed to a 4558 Op Amp unity gain amplifier, a volume control voltage divider, and then another unity gain 4558 to provide a low impedance output. The OOD-9 uses a NJM2374A Voltage converter to stabilize the operating voltage at 9 VDC regardless of the voltage level coming off the battery, providing a smoother, more consistent operation and tonality. The OOD-9 features Mechanical True Bypass switching via a Fujisoku 4PDT switch – the input of circuit is switched to ground when bypassed. NOTE ON POWERING THE OOD-9 - this pedal's voltage regulator IC requires a high inrush current of approximately 2000 mA upon startup. When using with a Power Brick such as the Voodoo Labs Pedal Power 2+, this pedal should be connected to a high current power jack when possible. If it is not possible to connect to a high current jack, you can power the OOD-9 by leaving a battery in the pedal. Upon initial start-up, unplug the external DC power input cable, engage the pedal, and then plug the DC power input cable back in – the pedal will now power up normally off the external power supply until you power down your pedalboard. Input Impedance : 500K Ohms

  Output Impedance : 10K Ohms or less

  Maximum Gain : 41.5dB (700Hz)

  Equivalent Input Noise : -107dB or less (IHF-A)

  Control : DRIVE, LEVEL

  Operating Voltage : 9V

  Power Consumption : 18mA/DC 9V, 18mA/DC 10V

  Dimensions : 74 (W) x 124 (D) x 54 (H) mm

  Weight : 580g (including battery)

  Battery : 9V battery (6LR61 or 6F22) x 1 or Maxon AC adaptor

  Battery life : Manganese dry battery 10.5 hours 25deg C / 77deg F (Panasonic 6F22NB)
  Alkaline dry battery 23 hours 25deg C / 77deg F (Panasonic 6LR61G)

  Option : Maxon AC adaptor (Maxon AC210N for North America)

  * All specifications are subject to change for improvement without notice or obligation. All brand names and product names are trademarks or registered trademarks of their respective companies.
specs: |-
  - Updated version of Maxon's first Overdrive - OD880 - circa 1977
  - Low gain, dynamic overdrive like a tube amp
  - Works great as an amp booster
  - Stack with other OD's for increased tonal options
  - NJM (JRC) 4558 Op Amps for modern tone
  - Regulated 9 VDC power
  - True Bypass Switching
