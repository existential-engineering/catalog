description: The Serato-compatible version of our popular DDJ-1000 is here –
  meet the DDJ-1000SRT. This 4-channel DJ controller for Serato DJ Pro is
  designed to feel just like our club-standard CDJ+DJM setup. You’ll enjoy
  low-latency, full-size jog wheels and a slick MAGVEL FADER for tight
  scratching. And with On Jog Display, which shows you important track
  information in the center of each jog wheel, you can concentrate on the crowd,
  not your laptop. Build excitement on the dancefloor and create huge drops
  using 4 Sound Color FX and 14 Beat FX. The DDJ-1000SRT comes with a free
  voucher for Pitch ‘n Time DJ, enabling you to get creative with advanced
  key-related features. With multiple inputs and outputs, you can enhance your
  setup by connecting external equipment like CDJs, the DDJ-XP1 , or turntables.
  This Serato DJ Pro controller will take your gigs to the next level. Special
  limited offer for Non-EMEA regions Free Serato DJ Suite Expansion Pack We’re
  putting a free Serato DJ Suite voucher worth $299 in the boxes of the first
  5,000 DDJ-1000SRT controllers that we ship worldwide. This all-in-one suite
  unlocks all the Serato Expansion Packs including Serato Play, Serato DVS,
  Serato Video, Serato Flip, and Serato Pitch ‘n Time DJ.
details: |-
  4-channel performance DJ controller for Serato DJ Pro. The Serato-compatible version of our popular DDJ-1000 is here – meet the DDJ-1000SRT. This 4-channel DJ controller for Serato DJ Pro is designed to feel just like our club-standard CDJ+DJM setup. You’ll enjoy low-latency, full-size jog wheels and a slick MAGVEL FADER for tight scratching. And with On Jog Display, which shows you important track information in the center of each jog wheel, you can concentrate on the crowd, not your laptop. Build excitement on the dancefloor and create huge drops using 4 Sound Color FX and 14 Beat FX. The DDJ-1000SRT comes with a free voucher for Pitch ‘n Time DJ, enabling you to get creative with advanced key-related features. With multiple inputs and outputs, you can enhance your setup by connecting external equipment like CDJs, the DDJ-XP1 , or turntables. This Serato DJ Pro controller will take your gigs to the next level. Special limited offer for Non-EMEA regions Free Serato DJ Suite Expansion Pack We’re putting a free Serato DJ Suite voucher worth $299 in the boxes of the first 5,000 DDJ-1000SRT controllers that we ship worldwide. This all-in-one suite unlocks all the Serato Expansion Packs including Serato Play, Serato DVS, Serato Video, Serato Flip, and Serato Pitch ‘n Time DJ.
