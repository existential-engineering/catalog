description: Reclaim the organic feel of faders and knobs without losing the
  power of software with the expandable MCU Pro control surface. With simple USB
  plug-and-play setup with nearly any DAW, you will be mixing like a pro with
  real motorized touch-sensitive faders, buttons and assignable V-pots in no
  time.
details: |-
  Modern DAW software offers virtually unlimited possibilities for manipulating audio, but sacrifices the organic feel of faders and knobs at your fingertips. The expandable MCU Pro control surface brings that experience back without losing the power of software.

  With MCU Pro, you get deep, intuitive control of mix and plug-in parameters, real-time visual feedback and plug-and-play setup, without any MIDI mapping whatsoever.

  Streamline mixing in your project studio or scale up with multiple MCU XTs to mix major projects. With the push of a button, writing automation on dozens of tracks in a large music project or even mixing for film and television is now effortless.

  MCU Pro includes Waveform OEM, a multi award-winning workstation featuring creative tools for the modern musician. Unlike typical Lite versions, it does not impose any restrictions: unlimited track count, powerful features, compatibility with all popular plug-ins and efficient performance on macOS, Windows and Linux.

  Also included is the DAW Essentials Collection, a collection of 16 contemporary FX plug-ins for use with any DAW: Equaliser, Compressor, Reverber8, Delay Studio, Stereo Delay, Tape Delay, Crossover, Limiter, Gate / Expander, Ducker, Flanger, Crusher, Chorus, Bus Compressor, Phaser and Auto Filter.
specs: |-
  - Universal control surface with motorized, touch-sensitive faders
  - Assignable V-pots and dedicated buttons
  - Real-time visual feedback
  - USB plug-and-play setup with nearly any DAW, no MIDI mapping required
  - Expandable with multiple MCU XT Pro extension units
  - Four ports: Port 1 internal USB, plus MIDI In/Out on Ports 2, 3 and 4
  - Two user switch jacks and one external control jack
  - Kensington-style security lock slot
  - External power input rated 7.5V DC, 3.0A-4.0A
  - Includes Waveform OEM DAW
  - Includes DAW Essentials Collection (16 FX plug-ins)
