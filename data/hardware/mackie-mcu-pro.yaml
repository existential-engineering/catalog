name: MCU Pro
manufacturer: mackie
primaryCategory: control-surface
url: https://mackie.com/en/products/controllers/mcu-pro-and-xt-pro/mcu_pro.html
description: "Modern DAW software has given us virtually unlimited possibilities
  for manipulating audio, but sacrifices the organic feel of faders and knobs at
  our fingertips. Reclaim that experience without losing the power of software
  with the expandable MCU Pro control surface."
details: |-
  With MCU Pro, you get deep, intuitive control of mix and plug-in parameters, real-time visual feedback and set up is plug-and-play — without any MIDI mapping whatsoever! Streamline mixing in your project studio or scale up with multiple MCU XTs to mix major projects. With the push of a button, writing automation on dozens of tracks in a large music project or even mixing for film and television is now effortless.
specs: |-
  - Visual Feedback
  - Channels, Faders and Banks
  - Software Friendly
  - Expandability
  - Motorized touch-sensitive faders
  - Assignable V-pots
  - USB plug-and-play setup
