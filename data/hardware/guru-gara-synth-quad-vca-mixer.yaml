details: |-
  Quad VCA / Mixer

  The Quad VCA / Mixer is a massive 16HP utility powerhouse combining four independent VCAs with onboard panning and flexible stereo mixing. Getting four full VCAs plus stereo panning in a single high-density build delivers far more functionality and board space than buying two separate dual 3360 VCA PCB and Front Panel kits (€32 value) - all in one module. Key Features

  Mixing & Dynamic Control

  Each channel of the Quad VCA / Mixer operates as a voltage-controlled amplifier, allowing precise control over audio levels using control voltage. This makes the module ideal for shaping dynamics, creating expressive modulation, and managing complex patches. The four channels can be mixed together via the main outputs, or used independently through their individual outputs, enabling simultaneous processing of multiple sound sources such as oscillators, drums, or submixes. Flexible Routing & Grouping

  The stereo output can also function as two mono group outputs, allowing you to create submixes or route signals to separate processing chains. The CV Link switch simplifies patching by linking all CV inputs to VCA 1, allowing a single envelope or modulation source to control all four VCAs at once — perfect for macro dynamics and grouped volume control. DIY Build & Front Panel

  This DIY Eurorack VCA and mixer kit is suitable for builders with some soldering experience. The front panel is constructed from durable PCB material and hand screen printed, ensuring visual consistency across Guru Gara Synth modules. Build note: Please use 6.8K for R10. Technical Specifications

  Skiff Friendly Module

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category. Video Demo
specs: |-
  - Eurorack PCB and front panel kit
  - Four independent VCAs
  - Functions as a quad VCA or audio mixer
  - Individual CV control per channel
  - Individual outputs for each VCA
  - Stereo output configurable as two mono group outputs
  - CV Link switch to control all VCAs from a single CV input
  - Individual pan control on each channel for stereo positioning
  - Intermediate-friendly DIY build
  - Front panel made from PCB material, screen printed by hand
  - Format: Eurorack
  - Functionality: Quad VCA / Mixer
  - Channels: 4
  - Outputs: Individual outputs + stereo (dual mono) mix output
  - Width: 16HP
  - Depth: 25 mm
