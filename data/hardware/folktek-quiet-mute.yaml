capabilities:
  - gating
url: https://folktek.com/products/quiet
description: A Eurorack mute module for CV or audio signals with a latching
  touch-based on/off switch. Each of its four channels has its own input,
  output, touch button and status light.
details: |-
  A simple but effective mute for audio or CV signals with a latching on/off. Each of the four parts has 3.5mm input and output jack with corresponding touch button and light. Allows for a more hands on experience when patching by allowing the player to turn a passing signal on and off. This is an extremely important addition to any Eurorack system for anyone who wants greater control over the mix and wants to be able to simply add or subtract CV or audio signals on the fly. TOUCH PADS, INPUTS/OUTPUTS

  - Four hexagonal touch-based buttons
  - Accepts any incoming CV, gate, trigger, audio source. - Light indicates signal is passing when lit, muted when dark. SPECS

  +12V: 45mA -12V: 25mA +5V: 0mA
  6HP width
  25mm depth

  View on modular grid: https://www.modulargrid.net/e/folktek-quiet
