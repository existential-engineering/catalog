details: |-
  The SE Hollowbody Standard Piezo features an all-mahogany body with hollow construction for a warm, resonant tone. Boasting 58/15 LT “S” pickups and an LR Baggs/PRSPiezo system, the SE Hollowbody Standard Piezo provides musicians with the versatilityof wielding both acoustic and electric tones in one instrument. Additional appointmentsinclude a 22-fret wide fat neck, bone nut, and PRS adjustable Piezo stoptail bridge.

  The instrument is designed with two discrete volume controls (magnetics and piezo)and output jacks (magnetics and mix/piezo). Players can plug into the “Mix/Piezo” jackand use the individual volume controls to blend the 58/15 “S” pickups with the piezo’sacoustic tones. Alternatively, players can plug into the jacks separately, so the guitar canrun magnetic pickups into an amp and run the piezo through an acoustic amp or DI intothe soundboard. When using the magnetic output jack in isolation, the piezo battery is bypassed completely, acting as a failsafe (in this scenario, the magnetic pickups stillwork even if the piezo battery has run out of juice).

  The SE Hollowbody Standard Piezo is one guitar that can cover any gig in style.
