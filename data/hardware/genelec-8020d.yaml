description: "When it comes to performance versus size, the 8020 has set the
  benchmark in nearfield monitoring for over 15 years. The latest revision of
  this classic monitor offers transparent, truthful reproduction with a wide
  uncolored sweet spot, allowing accurate mix decisions in compact spaces."
details: |-
  The Genelec 8020D is a compact two-way active nearfield studio monitor that continues a lineage stretching back more than fifteen years. Despite its small footprint, the 8020D delivers a remarkably transparent and truthful sonic presentation, with a wide uncolored sweet spot that supports confident mix decisions in tight rooms, edit suites, and personal studios where larger monitors would simply overwhelm the space.

  At the heart of the 8020D is a die-cast aluminum Minimum Diffraction Enclosure (MDE), which combines with Genelec's Directivity Control Waveguide (DCW) to deliver smooth, controlled dispersion across the listening area. A 105 mm bass driver and 19 mm metal-dome tweeter are each powered by their own 50 W Class D amplifier, producing peak SPLs of 107 dB per pair at one meter with music material while keeping self-noise below 5 dB SPL.

  The 8020D incorporates Genelec's Intelligent Signal Sensing (ISS) circuitry, which detects when no audio is present and automatically drops the monitor into a low-power standby state that consumes 0.5 W or less. Idle consumption stays at or below 3 W, while full-output draw tops out around 60 W, making this one of the most energy-efficient monitors in its class without sacrificing dynamic headroom.

  Setup flexibility is built in. The included Iso-Pod stand decouples the cabinet from the surface beneath it, reducing unwanted coloration from desks and shelves, and also allows the monitor to be tilted for proper on-axis listening. Rear-panel room-response compensation switches let the 8020D adapt to placement against walls or in corners, and a set of M6 mounting points across the enclosure supports a wide range of brackets, stands, and rigging hardware.

  Originally awarded the MIPA prize for Best Studio Monitor in 2005, the 8020 platform has continued to evolve. The current 'D' revision delivers higher SPL and lower energy consumption than earlier versions, while preserving the neutral character that has made the model a long-standing reference in music production, mastering rooms, broadcast environments, post-production suites, game audio studios, and education.
specs: |-
  - Frequency response (-6 dB): 56 Hz - 25 kHz
  - Frequency response (±2.5 dB): 62 Hz - 20 kHz
  - Peak SPL: >=107 dB (per pair at 1 m with music material)
  - Short-term max SPL: >=100 dB
  - Self-generated noise: <=5 dB SPL at 1 m on-axis
  - Harmonic distortion: 50-200 Hz <=3%; >200 Hz <=0.5%
  - Bass driver: 105 mm cone
  - Treble driver: 19 mm metal dome
  - Bass amplifier: 50 W Class D
  - Treble amplifier: 50 W Class D
  - Crossover frequency: 3000 Hz
  - Analog input: 1x XLR female, balanced, 10 kOhm
  - Mains voltage: 100-240 VAC 50/60 Hz
  - Power consumption (idle): <=3 W
  - Power consumption (ISS active): <=0.5 W
  - Power consumption (full output): 60 W
  - Enclosure: die-cast aluminum with reflex port
  - Dimensions (H x W x D, with Iso-Pod): 242 x 148 x 142 mm
  - Weight: 3.2 kg (7.1 lb)
  - Included: 1x mains cable (1.8 m), 1x Iso-Pod kit, 1x operating manual
