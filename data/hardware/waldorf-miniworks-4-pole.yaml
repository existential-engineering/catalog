description: >-
  A standalone analog filter and modulation processor from Waldorf that lets
  musicians run any audio source through a resonant 24 dB/oct filter with
  programmable envelopes, LFO, and MIDI control for classic filter sweep
  effects.
details: |-
  Released in 1996, the Waldorf MiniWorks 4-Pole is a dedicated analog filter module designed
  to add movement and character to external audio sources. In an era when filter sweep effects
  were becoming a defining sound of electronic dance music, the MiniWorks offered a hardware
  solution for processing drum loops, synthesizer outputs, and any other audio through a
  genuine analog signal path.

  The core of the unit is a 24 dB per octave resonant filter switchable between low-pass and
  band-pass modes. Surrounding this are full VCA, envelope, and LFO sections with programmable
  modulation routing between them, giving users detailed control over how the filter responds
  to incoming audio. When pushed hard, the input stage can be deliberately overloaded to
  produce lo-fi, crunchy distortion effects.

  The MiniWorks stores 20 preset and 20 user patches, and all parameters respond to MIDI
  control changes for automation and external manipulation. The mono input feeds a stereo
  output, adding spatial dimension to the processed signal. The combination of genuine analog
  warmth, programmability, and MIDI integration made it a practical studio tool that bridged
  the gap between simple stompbox filters and expensive modular filter banks.

  The unit found particular favor with producers looking to add analog texture to digital
  sources, whether filtering drum machines, softening digital synthesizers, or creating the
  signature swept filter builds popularized by acts like Daft Punk.
specs: |-
  - Filter: 24 dB/oct resonant low-pass/band-pass
  - Envelopes: 2
  - LFO: Yes, with programmable modulation routing
  - Memory: 20 preset / 20 user patches
  - Input: Mono
  - Output: Stereo
  - Control: MIDI
  - Keyboard: None
