details: |-
  The M1280B, a miniaturized condenser microphone with a fully integrated preamp and detachable cable, has complete immunity from RF interference caused by cell phones and GSM devices. The M1280B condenser microphone is equipped with a cardioid capsule and is also available with hypercardioid, omnidirectional, or shotgun capsules. The M1280B has a very wide frequency response and may be used in a wide variety of stage, studio, and broadcast applications.

  The M1280B miniaturized condenser microphone is available with a wide array of clips and accessories allowing the microphone to be used for drums, percussion, musical instruments, overhead stage miking, podiums, conferences, and presentations.

  Designed, machined, assembled, and tested by AUDIX in the USA.

  Model variations:
  M1280B – Wide frequency response micro condenser microphone with integrated preamp and RFI immunity. Includes 25′ cable, clip, and windscreen. Requires 18 – 48 V phantom power. Black.
  M1280BHC – As above with hypercardioid capsule for tighter pickup and greater isolation.
  M1280BO – As above with an omnidirectional capsule for recording and room miking.
  M1280BS – As above with shotgun capsule for distance miking and less ambiance.
specs: |-
  - Polar pattern: Cardioid (also hypercardioid, omni, or shotgun capsules)
  - Transducer type: condenser with integrated preamp
  - Power: 18 – 48 V phantom power
  - RF immunity to cell phone and GSM interference
  - Detachable cable (25′ included)
