details: |-
  The Martin OM-28 is a timeless classic from the Standard Series, pairing the Orchestra Model body with a long 25.4" scale for added projection and clarity. With Golden Era bracing, herringbone trim, and smooth playability, it remains a go-to instrument for tone, comfort, and style.

  Built around a 000-14 Fret (Auditorium) body shape, the OM-28 features a solid Sitka spruce top with an Aging Toner gloss finish and solid East Indian rosewood back and sides. The 2025 refresh brings updated Sitka spruce GE top bracing, refining the responsiveness fingerstyle and flatpicking players have long associated with this model.

  The ebony fingerboard is appointed with abalone diamond and square inlays, joined to a GE Modified Low Oval neck with a High-Performance Taper and a 1 3/4" nut width for comfortable, modern playability. The ebony bridge uses Martin's GE Modern Belly style with a compensated bone saddle, while nickel open-gear tuners and a molded hardshell case complete the package.

  Strings ship from the factory with Authentic Acoustic Lifespan 2.0 (Light gauge). The OM-28 is offered in both right- and left-handed configurations and carries Martin's Limited Lifetime Warranty.
specs: |-
  - Body Size: 000-14 Fret (Auditorium / Orchestra Model)
  - Top: Solid Sitka Spruce with Aging Toner gloss finish
  - Back & Sides: Solid East Indian Rosewood, natural gloss finish
  - Bracing: X-Brace, GE-Scalloped, Spruce, 1/4" size
  - Scale Length: 25.4"
  - Nut Width: 1 3/4"
  - Neck Shape: GE Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Fingerboard: Ebony with abalone diamond and square inlays
  - Frets: 20 total, body joins at 14th fret
  - Bridge: Ebony, GE Modern Belly style, compensated bone saddle
  - Tuning Machines: Nickel Open Gear
  - Electronics: None (pure acoustic)
  - Strings: Authentic Acoustic Lifespan 2.0 (Light gauge)
  - Case: Molded Hardshell included
  - Handedness: Right- and left-handed options
