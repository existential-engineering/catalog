description: Katana FET clean boost in a one-off Arlon Prince painted swirl finish.
details: |-
  This is the hand-made Katana clean boost in a custom painted swirl finish by Arlon Prince. Each finish is unique, so units vary.

  The Katana is a clean boost intended as a finishing stage on a signal chain, reproducing the player's tone at a higher level. It is also a fat, harmonically rich boost: pulling out the volume knob brings in overdriven tone. It can be left on permanently to push an amplifier harder, or used occasionally to cut through a mix.

  The circuit uses cascading FET stages to produce tube-amp-like gain behaviour, and predates the use of blue LEDs and non-diode clipping stages in that role.

  The Katana circuit was Robert Keeley's first guitar effect design for Keeley Electronics. It was originally designed for Legendary Tones as part of the Time Machine Boost, and became an independent product under the Keeley name after the Compressor appeared.
