description: The RP-1000SW is a 10" front-firing subwoofer from Klipsch's
  Reference Premiere series, featuring an Ultra Long Throw Cerametallic woofer
  and a 300W RMS / 600W Peak Class D amplifier. It delivers bass extension down
  to 19Hz via a bass reflex cabinet with a proprietary Aerofoil front slot port.
details: |-
  The RP-1000SW strikes an optimal balance between amplifier power, driver capability, and cabinet volume to achieve maximum low frequency extension with great output, accuracy, and speed. Its newly designed Cerametallic woofer is exceptionally light and extremely rigid, providing remarkable low frequency response with minimal cone breakup and distortion for higher, cleaner output using less amplifier power.

  The built-in high-efficiency Class D amplifier features an analog preamp design that maintains the original signal path for cleaner, true-to-source reproduction. The front-firing Aerofoil slot port uses proprietary internal geometry to minimize port noise for clean, undistorted low frequencies, while also allowing flexible placement options.

  The rear panel provides Low Pass Crossover and Variable Phase controls to tune the subwoofer to your speakers and room. Both the RCA and WA-2 wireless inputs can be used simultaneously. A 1/2-watt standby mode meets global efficiency standards. The scratch-resistant ebony vinyl finish is complemented by rounded corners, shock-absorbing rubber feet, and a woven cloth grille.
