details: |-
  Designed to be paired with our EVH® 5150® Iconic® 80-watt head, the 5150® Iconic® Series 4x12 straight-front speaker enclosure is the ultimate in power and performance.

  The cabinet is constructed out of MDF with special internal plywood baffling for tight and increased bass response, and houses four custom designed EVH 12" Celestion® speakers voiced specifically for this preamp circuit, so that the pristine cleans and searing high gain tones are tight, clear and articulate.

  Sporting distinctive EVH style, the 5150 Iconic Series 4x12 cabinet comes in either a thick textured Black or Ivory vinyl covering with black grille cloth and silver and black 5150 and EVH logo badges.

  The cab also has a ¼" parallel speaker input jack, two recessed side-mounted steel bars and removable EVH pop-out casters. A high-quality fitted cover is available as an EVH accessory.
