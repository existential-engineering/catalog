url: https://harbeth.co.uk/c7es-3-xd-loudspeaker-2/
description: A multi-award winning, medium-sized loudspeaker acclaimed for its
  accurate three-dimensional sound. Built around a 200mm Harbeth RADIAL2
  bass/mid unit and a 25mm ferrofluid-cooled tweeter.
details: |-
  The medium-sized C7ES-3 XD loudspeaker allows sensational music moments to come to life in the home. It is acclaimed for its accurate three-dimensional sound and is intended to satisfy the most demanding audiophile listening.

  Harbeth attributes the accuracy and lifelike sound to meticulous attention to detail during the design stage. Critically important, but hidden, is the crossover, which carefully integrates the drive units across a wider horizontal and vertical arc.

  Incremental changes to that fundamental component have allowed this legendary loudspeaker to present the most challenging instruments with increased presence and transparency.

  The cabinets are handmade and feature veneers that vary in colour, shade and grain structure. Not all finishes are available in all countries.
specs: |-
  - Technical features: 200mm Harbeth RADIAL2 bass/mid, 25mm ferrofluid-cooled tweeter
  - Frequency response: 45Hz to 20kHz, +/-3dB free-space, grille on, smooth off-axis response
  - Impedance: 6 ohms, easy to drive
  - Sensitivity: 86dB/2.83V/1m axial
  - Amplifier suggestion: works with a wide range of amplifiers, suggested from 25W per channel
  - Power handling: 150W programme
  - Dimensions: 520 x 272 x 305 mm (+12mm for grille and binding posts)
  - Connectors: two 4mm Harbeth branded binding posts
  - Weight: 13.2kg each (without packing)
  - Space needs: overall response optimised for use away from walls
  - Stands: optimally to bring ears level with the tweeters (tweeter 440mm up from cabinet base)
  - Packing: single speaker per protective carton
  - Grille colour: black
  - Finishes: oak, walnut, cherry, rosewood, black ash, silver willow
