details: |-
  The C1K Uke pairs concert-size comfort with the bright, punchy tone of solid Hawaiian koa. With classic Martin craftsmanship and elegant simplicity, it's a premium ukulele built for tone, playability, and lasting beauty.

  The top, back, and sides are all crafted from solid koa and finished with a smooth hand-rubbed finish that enhances both look and feel. Native Hawaiian koa delivers a bright, clear voice with just the right amount of warmth and punch, making the C1K equally suited to fingerstyle work and strummed accompaniment.

  The instrument features an applied dovetail neck joint for added stability, a select hardwood neck, and a sipo fingerboard with white dot inlays. Nickel open-gear tuners provide reliable tuning, while a compensated white Tusq saddle and white Tusq nut help keep intonation clean across the 17-fret fingerboard.

  The C1K ships with pre-strung soprano/concert ukulele strings and a soft gig bag, and is available in both right- and left-handed configurations.
specs: |-
  - Body Size: Concert Ukulele
  - Top: Solid Koa
  - Back & Sides: Solid Koa
  - Neck: Select Hardwood
  - Neck Joint: Applied dovetail, joins body at 12th fret
  - Fingerboard: Sipo with white dot inlay
  - Frets: 17 total
  - Nut Width: 1 13/32" at nut; 1 13/16" at 12th fret
  - Nut: White Tusq
  - Saddle: Compensated White Tusq
  - Tuners: Nickel open-gear
  - Strings: Pre-strung Ukulele Strings (Soprano/Concert)
  - Finish: Hand-rubbed
  - Case: Soft gig bag included
  - Handedness: Right- and left-handed available
