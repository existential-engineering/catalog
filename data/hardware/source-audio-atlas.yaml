description: Atlas Compressor offers a comprehensive collection of compression
  circuits that perfectly capture the tone and feel of the industry's most
  sought-after compressors.
details: |-
  Atlas Compressor offers a comprehensive collection of compression circuits that capture the tone and feel of the industry's most sought-after compressors, including 6 compression types inspired by studio rack gear and classic effects pedals.

  It features Auto Makeup Gain that automatically adjusts output level based on compression amount, and Dual Compressors that can be used in Series, Parallel, or Band Split mode (with separate controls for high and low frequencies). A special Bass Mode provides compression engines optimized for bass.

  Atlas stores 128 presets (6 accessible via the pedal toggle, 128 via MIDI) and offers stereo I/O for wide stereo effects. Universal Bypass allows selection between true bypass (signal relays) or a transparent buffer.

  MIDI support includes PC messages, CC mapping, and MIDI clock sync, with connectivity to the Neuro software via USB.
specs: |-
  - 6 compression types inspired by studio rack gear and classic pedals
  - Auto Makeup Gain
  - Dual compressors usable in Series, Parallel, or Band Split mode
  - Special Bass Mode for optimized bass compression
  - 128 presets (6 via pedal toggle, 128 via MIDI)
  - Stereo I/O
  - Universal Bypass (true bypass relays or transparent buffer)
  - MIDI support: PC messages, CC mapping, MIDI clock sync
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 2.75" x 2.2"
  - Weight: 0.625 lb
  - Power consumption: 165 mA
