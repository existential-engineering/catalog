description: >-
  The Oberheim OB-1 is a monophonic analog synthesizer released in 1978, notable
  as one of the first truly programmable analog synthesizers with 8 program
  memories. Based on the same architecture as the SEM, it features two VCOs and
  a switchable 2- or 4-pole filter. Notable users include Tangerine Dream, Rush,
  Vince Clarke, and The Grid.
details: |-
  The OB-1 was Oberheim's first dedicated monophonic synthesizer, released in 1978 and based on the same synth architecture as the iconic SEM (Synthesizer Expander Module). Its most significant distinction was being one of the first truly programmable analog synthesizers of its time, offering 8 program memories when most competing instruments had none.

  The sound engine features two analog oscillators routed through a versatile filter section with switchable 2-pole or 4-pole operation, providing both the gentler SEM-style rolloff and a more aggressive 24dB/octave slope. The filter includes cutoff, resonance, and keyboard tracking controls, with modulation available from either the LFO or ADSR envelope. The LFO offers square, sine, and sample-and-hold waveforms with delay and rate controls.

  The OB-1 delivers classic fat bass and lead synth sounds, comparable in character to instruments ranging from the Roland SH-101 to the MicroMoog. Its 37-key keyboard and CV/Gate connectivity made it a versatile monosynth for its era, and it remains an interesting alternative to more common bass synthesizers. A Mark 2 revision followed in 1979 with refinements to the original design.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs
  - LFO: Square, sine, sample & hold with delay and rate control
  - Filter: Switchable 2-pole or 4-pole with cutoff, resonance, key tracking
  - VCA: ADSR envelope
  - Keyboard: 37 keys
  - Memory: 8 program patches
  - Arpeggiator/Sequencer: None
  - Control: CV/Gate
  - Production Period: 1978-1979
