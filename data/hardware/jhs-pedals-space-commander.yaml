description: The JHS Pedals Space Commander is a three-in-one effects pedal
  combining a transistor clean boost, a classic 1980s-style chorus, and a hall
  reverb, each with independent bypass toggles and a single master footswitch.
details: |-
  The Space Commander brings you the spacey sounds of vintage chorus and reverb with a powerful clean boost on board. With simple controls and the ability to use each effect separately or engage all three effects with one stomp, you'll find yourself fully in command of your spacial exploration like none other!

  The Space Commander is three-effects-in-one, with a one-knob control for each effect: Boost, Chorus, and Reverb. Each effect is independently engaged by a toggle below the knob, and the pedal's master on/off is the footswitch. The "Boost" is a simple but powerful transistor boost that can be used to give your rig more volume or send your amp into natural breakup, perfect for tube amplifiers. The Chorus is a classic swirling 1980s style chorus. Increasing the Chorus control increases the speed while the depth decreases, while decreasing the Chorus control decreases the speed and increases the depth. The Reverb is a hall reverb that is perfect for adding that 1980s style decay to your sound. The Reverb knob controls your reverb mix, from fully dry to fully wet.

  Version History: V1 = VCR graphics. V2 = Updated to Space Commander graphics/name.
