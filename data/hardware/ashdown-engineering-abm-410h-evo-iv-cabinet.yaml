description: The ABM-410H-EVO IV brings 650 watts of tight, driving bass in a
  road-tough 4x10 inch format. Built from high-grade birch ply and wrapped in
  buffalo leather cloth with a steel grille, it is engineered to take the hits
  night after night. Four custom Blue Line speakers deliver a thick, full-bodied
  tone with the punch to cut through any mix, and the switchable horn tweeter
  (Hi/Low/Off) adds extra clarity on top. Built-in wheels and a recessed handle
  make this powerhouse easy to move.
details: |-
  The ABM-410H-EVO IV is a 4x10 inch bass cabinet rated at 650 watts, built from high-grade birch ply and wrapped in buffalo leather cloth with a steel grille. Four custom Blue Line speakers deliver a thick, full-bodied tone with punchy mids and cutting highs, and a switchable horn tweeter (Hi/Low/Off) adds top-end clarity. Built-in wheels and a recessed handle aid transport. Available in Metal, Silver Cloth, and Red Cloth finishes.
specs: |-
