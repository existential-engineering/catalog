description: The Charvel USA Select DK24 HSS 2PT CM is an exquisite USA-made
  instrument designed for modern players with discerning tastes, meticulously
  built at the Charvel Custom Shop in Corona, California.
details: |-
  Built at the Charvel Custom Shop in Corona, California, the USA Select DK24 HSS 2PT CM is a meticulously crafted modern Dinky designed for discerning players. The alder body is paired with a bolt-on caramelized flame maple neck featuring graphite reinforcement, a hand-rubbed urethane back finish and a Speed Neck profile with rolled fingerboard edges for a comfortable, broken-in feel.

  The caramelized flame maple fingerboard carries a 12"-16" compound radius, 24 jumbo stainless steel frets, 4mm pearloid dot inlays and Luminlay side dots over a 25.5" scale. A Graph Tech TUSQ XL nut and shredder's cut heel support effortless upper-fret access and precise intonation across the neck.

  Electronics center on an HSS configuration with a Seymour Duncan Full Shred TB-10 humbucker at the bridge and two Seymour Duncan Custom Flat Strat SSL-6 single-coils in the middle and neck positions (the neck pickup is reverse wound/reverse polarity for hum cancellation in combined positions). Wiring is routed through a 500K EVH Bourns low-friction volume pot, a no-load tone control and a 5-position blade switch for a wide tonal palette with beefed-up mids and articulated highs.

  Hardware appointments include a Gotoh Custom 510 tremolo with brass block and titanium saddles, Sperzel die-cast locking tuners, Stratocaster-style skirt control knobs and a heel-mount truss rod adjustment wheel. A scalloped lower back bout, beveled output jack and included Charvel hardshell case round out the package.
