description: Erica Synths DIY Delay is hi-fi delay module with unique
  functionality typically found on advanced factory-produced units.
details: |-
  Erica Synths developed a custom DSP MCU board, supplied pre-soldered and pre-programmed, together with delay algorithms that reach up to 800 ms and can be synchronised. Audio runs at 48 kHz and 24 bit, which is what puts the module in hi-fi territory rather than lo-fi territory.

  Tape and Digital delay flavours are selectable, and delay time follows either BPM sync or tap sync, with divisions and multiplications of the synced value available. Delay time, feedback and the dry/wet mix are all controllable by hand and by CV.

  Three buffer functions push the module past ordinary delay duty. Hold freezes the sound for up to 800 ms, Add layers several passes of sound on top of each other, and Reverse plays the hold buffer backwards.

  The module occupies 14 HP and is 45 mm deep. Erica Synths rates this as a comparably complex DIY project for experienced builders and does not recommend it to beginners or to anyone without proper soldering and testing equipment.
specs: |-
  - Max delay time 800 ms
  - Sampling frequency 48 kHz 24 bit
  - Audio output amplitude 10Vptp
  - CV amplitude (full span) -5V to +5V
  - Tape Delay and Digital Delay algorithms
  - Syncable (clock and tap) delay time
  - Delay time divisions and multiplications
  - Freeze, Add and Reverse functions
  - Manually and CV controlled delay time, feedback and dry/wet mix
  - Custom DSP MCU board supplied pre-soldered and pre-programmed
  - Panel width 14 HP
  - Module depth 45 mm
