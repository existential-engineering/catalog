description: >-
  The Juno-DS61 is an ultra-portable synthesizer weighing only 5.3 kg, designed for musicians who
  need lightweight gear without sacrificing sound quality or playability.
details: |-
  The DS61 features nine categories of sound including synth, piano, and organ, making it easy to get up and running without extensive tweaking. The weighted-action Ivory Feel-G keyboard provides expressive playing and a premium feel.

  Eight Phrase Pads allow adding instant beats to keyboard parts or loading MP3/WAV files from USB memory for playing along with full-band backing. The synth also includes a 128-voice polyphonic engine with 16-part multitimbral capability and an 8-track sequencer.

  Built-in effects include chorus, reverb, mic input reverb, and multi-effects processing. An arpeggiator with 128 presets and extensive pattern storage round out the performance features.
specs: |-
  - Polyphony: 128 voices
  - Multitimbral: 16 parts
  - Oscillators: 2, ROM waveforms
  - Effects: Chorus, reverb, mic input reverb, multi-effects
  - Arpeggiator: 128 presets
  - Sequencer: 8-track sequencer, 32 preset patterns, 128 user patterns
  - Keyboard: 61-note Ivory Feel-G keyboard with weighted action
  - Memory: Internal, USB
  - Control: MIDI In/Out
releaseDate: "2015"
releaseDateYearOnly: true
