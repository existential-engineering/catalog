description: The D-16E blends Dreadnought power with Auditorium comfort and
  comes in rosewood or mahogany. With a solid spruce top, satin finish, and E1
  electronics, it's a versatile acoustic-electric built for any performance.
details: |-
  The Martin D-16E is a hybrid acoustic-electric design that blends Dreadnought power with Auditorium comfort, combining the projection capabilities of traditional Dreadnoughts with the ergonomic depth of Auditorium models. Handcrafted in Martin's Nazareth, Pennsylvania factory, the D-16E pairs a resonant satin-finished Sitka spruce top with mahogany back and sides.

  The guitar features Martin E1 electronics with onboard controls for volume, tone, and phase adjustment, plus an integrated chromatic tuner, making it stage-ready straight out of the case. The neck is a Select Hardwood (Dark Mahogany) with a Modified Low Oval profile and High-Performance Taper, joined to the body at the 14th fret with a 25.4" scale length for traditional Martin feel and response.

  Detail work includes an ebony fingerboard and ebony Modern Belly bridge with drop-in saddle, a bone nut, compensated white Tusq saddle with 16" radius, and nickel open-gear tuning machines. Every D-16E is Pleked for a professionally leveled fretboard and ships with Authentic Acoustic Lifespan 2.0 light-gauge strings.

  The instrument arrives in a waterproof softshell case with backpack straps, ready to help players unleash their inner artist wherever the musical journey takes them.
specs: |-
  - Body Size: D-14 Fret (000 Depth)
  - Top: Sitka Spruce with Satin finish
  - Back & Sides: Mahogany with Satin finish
  - Scale Length: 25.4"
  - Frets: 20 total, 14th fret neck join
  - Fingerboard: Ebony
  - Fingerboard Width at Nut: 1 3/4"
  - Fingerboard Width at 12th Fret: 2 1/8"
  - Neck Shape: Modified Low Oval with High-Performance Taper
  - Neck Material: Select Hardwood (Dark Mahogany)
  - Bridge: Ebony, Modern Belly with drop-in saddle
  - Bridge Spacing: 2 5/32"
  - Nut: Bone
  - Saddle: Compensated White Tusq, 16" radius
  - Electronics: Martin E1
  - Tuning Machines: Nickel Open Gear
  - Case: Softshell (waterproof, backpack straps)
  - Strings: Authentic Acoustic Lifespan 2.0 (Light gauge)
  - Setup: Pleked
