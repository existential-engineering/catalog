url: https://dbxpro.com/en/products/160a
description: A legendary compressor/limiter from the dbx 160 family featuring
  switch-selectable OverEasy® and Hard Knee compression curves, designed for
  portable, tour, and studio applications with True RMS level detection and
  industry-standard dynamic processing.
details: |-
  Since its introduction in the mid-1970s, the dbx 160 series has been the world's most popular line of audio compressors. The 160A represents the latest evolution of this lineage, combining the classic sound and easy setup of its predecessors with an improved signal path and stronger chassis design suitable for digital-ready applications.

  The unit features True RMS level detection for natural-sounding dynamics processing, from subtle compression to peak limiting. Users can choose low ratios with OverEasy® compression for transparent vocal smoothing, or Hard Knee compression with high ratios for protection against overload distortion in digital recording and broadcast applications.

  The 160A includes unique features such as the INFINITY+ inverse-compression mode, which decreases output below unity gain when input exceeds threshold. A detector input allows integration with equalizers for de-essing and selective smoothing. The device supports stereo coupling via two units for processing entire mixes without shifting the left/right image.

  With its musical sound, easy operation, and wide versatility, the 160A follows the tradition of the original dbx 160 while meeting modern digital audio challenges.
specs: |-
  - Input Connectors: 1/4" TRS and XLR, Floating Balanced (XLR: Pin 2 hot, Phone: Tip Hot)
  - Input Impedance: 40k ohms
  - Max Input: +24dBu, Balanced or Unbalanced
  - CMRR: >45dB (any frequency)
  - Detector Input Connector: 1/4" TRS phone, Floating Balanced
  - Detector Input Impedance: >200k ohms
  - Detector Input Max Level: +28dBu, Balanced or Unbalanced
  - Output Connectors: 1/4" TRS phone, Unbalanced; XLR, floating balanced (pin 2 hot)
  - Output Impedance: Balanced 200 ohm, Unbalanced 100 ohm
  - Max Output Balanced: +24dBm; <0.3% THD
  - Max Output Unbalanced: +20dBm; <0.3% THD
  - Noise Floor: <-90dBu, Unweighted (20Hz - 20kHz)
  - Frequency Response: 20Hz - 20kHz, +0/-0.5dB; +0/-3dB at 0.5Hz and 90kHz
  - THD: <0.2% typical, any compression up to 40dB @ 1kHz
  - Compressor Threshold Range: -40dBu to +20dBu
  - Compressor Threshold Characteristic: OverEasy® or Hard Knee
  - Compressor Ratio: Variable 1:1 to ∞:1 through to -1:1; >60dB maximum compression
  - Compressor Attack Time: Program dependent; typically 15ms for 10dB, 5ms for 20dB, 3ms for 30dB
  - Compressor Release Time: Program dependent; typically 8ms for 1dB, 80ms for 10dB, 400ms for 50dB
  - Dynamic Range: >113dB
  - Gain Adjustment Range: -20dB to +20dB
  - Stereo Coupling: True RMS Power summing via 1/4" TRS phone jack
  - Operating Voltage: DO: 90-130VAC, 50/60Hz; EU: 200-250VAC, 50/60Hz
  - Dimensions: 1.75" x 19" x 6.5" (4.45cm x 48.2cm x 16.51cm)
  - Weight: 4.452 lbs (1.99 kg)
