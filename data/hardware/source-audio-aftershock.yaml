description: Get down and dirty with the AfterShock Bass Distortion. The
  Aftershock spans the gamut of low-end crunch, from smooth and natural
  overdrive to full-on fuzz attack.
details: |-
  The AfterShock Bass Distortion features three selectable distortion engines accessed via a center toggle: TUBE (warm tube overdrive), HEAVY (high gain distortion), and FUZZ (based on the Bass Big Muff). It spans the range from smooth natural overdrive to full-on fuzz attack.

  A CLEAN Mix Control blends clean and overdriven signals to preserve low-end clarity and bass fundamentals. The pedal can store up to 6 different overdrives across two banks (a green bank for standard operation and a red bank for three preset slots).

  The AfterShock offers stereo I/O capability, allowing it to distort stereo signals, split a mono signal to dual outputs, or operate as an external effects loop. Universal Bypass allows selectable true bypass or analog bypass.

  It is deeply editable and controllable via the Neuro software and NeuroHub, supporting USB-MIDI, multi-pedal scene saving (up to 5 pedals, 128 scenes via MIDI PC messages), and external expression control via a TRS expression pedal.
specs: |-
  - Three distortion engines: TUBE, HEAVY, FUZZ (Bass Big Muff-based)
  - CLEAN Mix Control to blend clean and overdriven signal
  - Stores up to 6 overdrives (green standard bank + red preset bank)
  - Stereo I/O; can split mono to dual outputs or run as external effects loop
  - Universal Bypass (selectable true bypass or analog bypass)
  - USB-MIDI compatible with NeuroHub
  - Up to 6 effect presets; 128 scenes via MIDI PC messages
  - External expression control via TRS expression pedal
  - Housing: brushed anodized aluminum
  - Dimensions: 4.6" x 2.75" x 2.2"
  - Weight: 0.625 lb
  - Power consumption: 165 mA
