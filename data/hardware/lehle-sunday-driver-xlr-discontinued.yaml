details: |-
  The Sunday Driver XLR is a compact-format high-end preamp for electrical and acoustic instruments alike, from electric guitars and basses to acoustic guitars and other stringed instruments such as violins, cellos and double basses. The XLR variant adds a symmetrical XLR output and a ground-lift switch to the classical Sunday Driver specification.

  On stage it can be used as a compact DI box and as a line-driver for long cable distances. In the studio, an output range of 20 to 100,000 Hz makes it suitable as a recording preamp or as a DI box, whether as a battery-operated stand-alone unit or integrated into an existing setup.

  JFET technology provides two modes, selected with a switch with gold-plated contacts. In mode D, for Driver, the input signal is amplified with no modification, which eliminates the signal losses caused by long cable routings or by impedance matching errors with high-impedance signals from passive pick-ups. The signal stays powerful and clear and retains its dynamics and brilliance. Mode S, for Sunday, multiplies input impedance by four and brings out previously inaudible details, and as gain increases the sound takes on a characteristic warmth.

  There is no distortion at any stage and the signal remains clean even at the maximum gain setting of 15 dB. To exploit the dynamics to the full, the input voltage is rectified from the power supply socket, filtered, stabilized and then doubled to 18 V, and a studio-standard signal-to-noise ratio of better than -100 dB keeps the unit free of background noise.
specs: |-
  - JFET-based preamp circuitry
  - Symmetrical XLR output with ground-lift switch
  - Two modes selected by a switch with gold-plated contacts: D (Driver) and S (Sunday)
  - Mode S multiplies input impedance by four
  - Maximum gain 15 dB with no distortion at any stage
  - Signal-to-noise ratio better than -100 dB
  - Frequency range 20 Hz to 100,000 Hz
  - Input voltage rectified, filtered, stabilized and doubled to 18 V internally
  - Runs as a battery-operated stand-alone unit or from an external power supply
