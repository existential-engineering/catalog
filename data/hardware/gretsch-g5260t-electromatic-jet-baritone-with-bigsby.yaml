details: |-
  The Gretsch Electromatic Collection gives you essential Gretsch power, style and performance.

  The G5260T Electromatic Jet Baritone with Bigsby captures essential Jet power and fidelity at sub-sonic levels.

  The Jet Baritone rattles foundations with dual Gretsch mini humbucking pickups that capture thundering lows while retaining a piano-like articulation and definition.

  An elongated 29 3/4"-scale accommodates lower tunings without loss of string tension, while the sturdy bolt-on maple neck is topped with a comfortable 12"-radius laurel fingerboard featuring 22 medium jumbo frets.
