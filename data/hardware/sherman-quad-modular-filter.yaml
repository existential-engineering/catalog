description: >-
  The Quad Modular Filter is a limited edition analog filter processor from Sherman
  Electronics, with only 100 units produced worldwide. It combines four independent
  Filterbanks into one sleek modular machine with enhanced features, extensive patching
  flexibility, and classic wood side panels. Each filterbank has separate inputs and can
  operate independently or be linked together for combined filtering with up to 96dB slope
  capability.
details: |-
  The Quad Modular Filter is essentially four Sherman Filterbanks housed in a single modular unit. Each of the four filterbanks features separate inputs and complete MIDI implementation with independent MIDI channels (1-4), allowing them to operate autonomously or be linked together for massive combined filtering.

    Patching flexibility is a core design feature, with ten included jack cables enabling complex signal routing between the filterbanks. The unit provides LFO outputs, CV/Gate inputs and outputs, making it highly integrable with other modular and analog equipment. Users can create elaborate analog filter effects by routing audio sources through multiple linked filterbanks in series.

    Banks 3 and 4 include newly added enhanced features not found on Banks 1 and 2. These include a Bright switch to boost high frequencies, much faster filter envelope follower speeds, LFO triggering capability, an Octave switch that doubles the center frequency of filters 3 and 4, and a sawtooth waveform option for the LFO. Each of these enhanced banks also features 2 additional jack sockets.
specs: |-
  - Polyphony: 4 Filter Banks
  - Multitimbral: 4 Filter Banks
  - LFO: 4 (modulates filters or envelopes)
  - Filters: 8 total (2 per filterbank), 24dB/oct 4-pole with low-pass, band-pass, high-pass, and notch modes
  - Filter Features: Resonance and AD(S)R envelopes per filter
  - VCA: ADSR
  - Control: MIDI, CV, Gate
  - Production Run: Limited edition, 100 units worldwide
releaseDate: "2000"
