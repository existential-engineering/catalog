description: A next-generation Eurorack Ornament and Crime module running the
  Phazerville Suite with Quadrants, offering four simultaneous apps, extensive
  trigger and CV I/O, stereo audio processing, MIDI-to-CV conversion, and USB
  and SD storage expansion.
details: |-
  Batch 4 special preorder price - est ship 9/9

  CALSYNTH EXCLUSIVE. 16HP. 24MM SKIFF FRIENDLY DEPTH. 40% LARGER SCREEN. GENEROUS ROOM FOR EASIER FULL CABLE USEAGE. USB AUDIO INTERFACE. 4 APPS RUNNING SIMULTANEOUSLY USING PHAZERVILLE SUITE W/ QUADRANTS. FOR MORE INFO ON THE APPS AND OPERATION OF QUADRANTS AND THE 4.1 ENVIRONMENT, PLEASE VISIT https://firmware.phazerville.com/Quadrants

  XLOC2 IS THE NEXT GENERATION OF ORNAMENT AND CRIME. FEATURING 4 TRIGGERS, 8 CV INS AND OUTS, 5 SLOT STEREO AUDIO I/O WITH EFFECTS, 8MB OF RAM FOR LONGER REVERBS, MIDI IN AND OUT WITH CV CONVERSION, USB HOST AND DEV PORTS, SD CARD FOR STORAGE AND I2C PORT FOR FUTURE EXPANSION

  The new XLOC2 is exclusive to Calsynth and offers more room to patch and a bigger screen to better show the detailed information display of the powerful Phazerville W/ Quadrants

  Quadrants is the latest way to use apps, and you can use 4 apps from the vast collection of useful tools and utilities at the same time. Modulate, manipulate, generate and more. In addition there is a 5-slot audio processing center with delays, panning, dynamics, WAV playing and more being very actively developed. The firmware is evolving daily as a community of enthusiastic contributors add new ideas and energy to the project, so this is just the beginning of an exciting new chapter in OC history. Thanks so much to MXMXMX and Patrick Dowling and Tim Churches for the original that started it all, Chysn for the original Hemispheres Suite, DJ Phazer and Paul Stoffregen for their tireless efforts to get the OC onto a 4.0 and develop the hardware and software for the new ORN8 Teensy 4.1 environment, and Jim Matheson (Jakplugg) for his brilliant interpretation of that environment into what I think is the most useable version to date.

  Storage expansion: includes an SD Card slot for storage.
