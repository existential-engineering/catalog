details: >-
  The Electro-Voice PL-37 is a small-diaphragm condenser microphone in the PL
  Series, voiced for drum overheads, hi-hats and acoustic stringed instruments.
  A self-biased condenser element paired with a tight cardioid polar pattern
  delivers detailed high-frequency response while rejecting off-axis bleed from
  neighbouring kit pieces or sources on a crowded stage.


  A tight-mesh Memraflex grille protects the capsule from stick strikes and air
  blasts inside a drum overhead position while resisting deformation under the
  rough handling typical of touring rigs. The pencil-style body is constructed
  from die cast zinc with a textured satin black finish for stage-friendly low
  reflectivity and road durability.


  Output is via a standard 3-pin XLR connector with a 200-ohm low-impedance
  balanced signal suitable for any professional mixer or preamp. The PL-37
  accepts phantom power from 11 to 52 VDC, making it compatible with virtually
  any console or interface providing standard phantom power.
specs: |-
  - Element: Condenser (self-biased)
  - Mic type: Instrument
  - Polar pattern: Cardioid (tight)
  - Frequency response: 50 Hz - 16,000 Hz
  - Maximum SPL: 132 dB (1% THD)
  - Dynamic range: 107 dB
  - Impedance (low-Z balanced): 200 ohms
  - Open circuit voltage: 6 V
  - Connector: 3-pin XLR
  - Power requirement: 11 to 52 VDC phantom power
  - Grille: Tight-mesh Memraflex
  - Case material: Die cast zinc
  - Finish: Textured satin black
  - Net weight: 0.176 lbs
  - Family: PL Series
  - Wired/wireless: Wired
