description: Custom Shop 20 for 20 colourway of the Tri-Verb reverb pedal, with
  plate, spring and chamber modes and Decay, Tone, Pre Delay and Blend controls.
details: |-
  The Tri-Verb is a reverb pedal with three selectable modes. Plate is modelled on the EMT 140, with low end resonance and a decaying high end shimmer, and is described as sitting well with gain and distortion tones. Spring is a two spring tank voicing with enough splash for surf playing and enough depth for blues. Chamber is a soft, warm vintage voicing taken from the studio chamber at Keeley's own favourite recording room, aimed at reproducing that sound live without a DAW or plugin.

  Four controls cover the pedal: Decay, Tone, Pre Delay and Blend. The enclosure is a compact, pedalboard friendly size.

  This is the 20 for 20 Custom Shop edition, derived from the Keeley X-Series Tri-Verb. The 20 for 20 series was a line of twenty Custom Shop finishes, each carrying the 20 for 20 insignia and each limited to twenty units, with no further runs planned once a colourway sold out.
specs: |-
  - Three reverb modes: plate, spring, chamber
  - Controls: Decay, Tone, Pre Delay, Blend
  - Plate mode modelled on the EMT 140
  - Spring mode voiced as a two spring tank
  - 20 for 20 Custom Shop finish, limited to 20 units of this colourway
  - Compact pedalboard friendly enclosure
  - Derived from the Keeley X-Series Tri-Verb
