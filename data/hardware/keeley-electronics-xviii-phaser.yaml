details: |-
  The XVIII Series Phaser was built to mark Keeley Electronics' eighteenth year. It offers three modes, with two, four or six stages of phasing, so the sweep can orbit tightly around a tonal centre or spread across a wider band.

  A phaser creates peaks and notches across the spectrum of the instrument's output, and the low frequency oscillator moves those bands through the signal to produce the filter sweep. The Depth control sets how pronounced those notches are and the Rate control covers the sweep speed across a wide range. The Feedback control returns part of the output to a stage near the input, folding the sweep back on itself.

  This listing is the 20 for 20 Custom Shop series, a line of 20 colorways each carrying the 20 for 20 insignia and each limited to 20 units. The storefront offers it in a classic and a modern colorway.
