description: "Professional 2 in/5 out audio interface and controller designed
  for recording guitarists, featuring high-end sound with best-in-class guitar
  tone shaping, triple-topology preamp with PURE, JFET, and ACTIVE modes, and
  patent-pending Z-TONE impedance-adapting circuit."
details: |-
  The AXE I/O is a premium 2-in/5-out audio interface built from the ground up for guitarists, featuring a Class-A discrete differential preamp and patent-pending Z-TONE impedance-adapting circuit that adjusts from 1 MOhm to 2.2 kOhms for optimal pickup response.

  Three selectable input topologies let players dial in their ideal tone: PURE mode delivers transparent, uncolored sound; JFET mode adds warm Class-A harmonic enhancement; and ACTIVE mode is optimized for active pickups. The interface supports sample rates up to 192 kHz at 24-bit resolution with a dynamic range of 117 dB(A) on the instrument input and 116 dB(A) on mic/line/monitor outputs.

  Additional features include 48V phantom power, a built-in tuner, and direct monitoring. The unit ships with AmpliTube 5 SE and TONEX SE software, housed in a metal chassis measuring 23.8 x 21.1 x 5.3 cm at 1.3 kg.
specs: |-
  - 2-in/5-out audio interface with USB 2.0 connectivity
  - 24-bit resolution with sample rates up to 192 kHz
  - 117 dB(A) dynamic range (instrument input)
  - Class-A discrete differential preamp with 48V phantom power
  - Patent-pending Z-TONE impedance-adapting circuit (1 MOhm to 2.2 kOhms)
  - Triple-topology input: PURE, JFET, and ACTIVE modes
  - Built-in tuner and direct monitoring
  - MIDI In/Out via 5-pin DIN
  - 2 programmable external controller inputs
  - Dimensions: 23.8 x 21.1 x 5.3 cm (9.37" x 8.31" x 2.09")
  - Weight: 1.3 kg (2.9 lb)
  - Includes AmpliTube 5 SE and TONEX SE
