description: A Eurorack high-voltage distortion module, developed with Erica
  Synths, that boosts the audio signal to 3000V and converts it into continuous
  electrical discharges inside a xenon-filled tube, with CV control over
  distortion level and dry/wet mix plus octave-up and two-octave-down tracking
  oscillators.
details: |-
  The Plasma Drive is a collaboration between Gamechanger Audio and Erica Synths, an established and recognized modular synthesizer brand from Latvia. Erica Synths are a team of visionaries, engineers and musicians who create modules and instruments that are different in terms of sound, looks and functions.

  Similar to the Plasma Pedal, the Plasma Eurorack Drive boosts the audio signal to 3000V and transforms it into a series of continuous high-voltage discharges in a xenon-filled tube. In essence, the player is playing a lightning bolt of electricity, and the electrical discharges produced by the instrument are instantly converted back into an analogue audio signal. The result is a quick, responsive and extremely heavy distortion with tons of unique character.

  The Plasma Drive Eurorack Module brings the sounds of the Plasma Pedal to the modular world. The functions of the pedal are complemented with CV control over the level of distortion and a dry/wet mix. The module introduces tracking oscillators for a new Octave Up and Two-Octave Down function, thus adding even more harmonics to the original signal. Tracking oscillators can be switched on and off manually or via trigger signals.
specs: |-
  - Bus-powered via a conventional Eurorack PSU ribbon cable, plus or minus 12V DC, 300 mA (positive rail 200 mA, negative rail 100 mA)
  - Audio signal boosted to 3000V and discharged across a xenon-filled tube
  - CV control over distortion level and dry/wet mix
  - Tracking oscillators for Octave Up and Two-Octave Down, switchable manually or via trigger signals
  - Two-year warranty
