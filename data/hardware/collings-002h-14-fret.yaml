url: https://collingsguitars.com/acoustics/002h-14-fret/
description: The 002H 14-Fret represents a mid-point between small-bodied and
  mid-sized instruments, delivering a pleasing midrange resonance that
  distinguishes this size from other offerings. It combines a dry and articulate
  attack with more low-end definition than you would typically expect in an
  instrument of comparable dimensions.
details: |-
  The 002H 14-Fret combines East Indian rosewood back and sides with herringbone trim in the standard 00 14-Fret body style. Its 24 7/8" scale and broad waist enable delicate top-voicing suited for both fingerstyle and strumming techniques, delivering a pleasing midrange resonance with dry and articulate attack and enhanced low-end definition.

  Features include abalone fingerboard inlays, an ebony belly-style bridge with 2 3/16" spacing, ivoroid body binding with herringbone purfling, and a zipper backstrip. The neck is a Honduran mahogany Modified V profile.
specs: |-
  - Top: Sitka spruce
  - Back & sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Bridge: Ebony belly-style, 2 3/16" spacing
  - Fingerboard: Ebony with abalone inlays
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Tuners: Nickel Waverly
  - Frets: Medium 18% nickel-silver
  - Fingerboard radius: 14" - 26" compound
  - Neck profile: Modified V
  - Scale length: 24 7/8"
  - Body width: 14 1/2"
  - Body length: 18 7/8"
  - Body depth: 4"
  - Total length: 39"
  - Body binding: Ivoroid with herringbone purfling
  - Backstrip: 2-style (Zipper)
  - Body finish: High gloss nitrocellulose lacquer
  - Neck finish: High gloss polyester resin
  - Strings: D'Addario EJ-16 (.012"-.053")
