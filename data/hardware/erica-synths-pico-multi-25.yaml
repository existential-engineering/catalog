  splitting (audio, clock etc.) in any circuit.
details: |-
  Erica Synths Pico Multi is an advanced replacement for stackable patch cables, an active buffered multiple that handles signal splitting for audio, clock and control voltages in any circuit.

  The 3HP panel carries two independent active buffered multiples, which can be used as a 1 to 3 plus a 1 to 2 split, or chained into a single 1 to 5 split.

  Because the multiples are buffered rather than passive, the split signals hold their level and tuning, which matters when one CV source drives several VCOs. Input levels of up to 10Vptp are accepted, and LEDs indicate the level of the incoming signals.

  The module is 3HP wide and 35mm deep, part of the Pico Series brief Erica Synths set itself, to fit superior synth functionality into 3HP at an affordable price.
specs: |-
  - Two independent active buffered multiples
  - 1-3+1-2 or 1-5 configuration
  - LED indication of input signal levels
  - Input level 10Vptp
  - Power consumption +20mA, -7mA
  - Module width 3HP
  - Module depth 35mm
