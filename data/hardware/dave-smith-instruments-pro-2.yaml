description: >-
  The Dave Smith Instruments Pro 2 is a paraphonic hybrid synthesizer combining
  four digital oscillators with analog filters and signal path, offering an
  extensive modulation matrix, a powerful step sequencer, and dual ribbon
  controllers in a sturdy 44-key keyboard.
details: |-
  Introduced in 2014, the Pro 2 represents one of Dave Smith's most feature-rich monophonic
  designs. While it shares a spiritual lineage with the legendary Sequential Circuits Pro One,
  the Pro 2 is a thoroughly modern instrument with a hybrid architecture that pairs digital
  oscillators capable of 13 Superwave types with analog filters and output stages.

  The synth engine offers four oscillators per voice with a comprehensive selection of waveforms
  including sawtooth, pulse, sine, triangle, and super saw variants. Dual filters can be
  configured in serial or parallel routing with selectable 12dB or 24dB slopes across lowpass,
  highpass, bandpass, and notch modes. Five DAHDSR envelopes with looping capability and four
  LFOs provide deep modulation possibilities.

  The built-in sequencer is particularly powerful, offering either 16 steps across 16 tracks or
  32 steps across 8 tracks. Four delay engines, stereo analog distortion, tuned feedback, and
  harmonic excitation round out the effects section. The semi-weighted keyboard with velocity
  and pressure sensitivity, combined with dual ribbon controllers and an OLED display, makes it
  a highly playable performance instrument. Memory holds 396 RAM and 396 ROM patches.
specs: |-
  - Polyphony: Monophonic (paraphonic mode available)
  - Multitimbral: 4 parts
  - Oscillators: 4 digital with 13 Superwaves
  - Waveforms: Saw, pulse, sine, triangle, square, super saw, sub oscillator, noise
  - Filters: Dual multimode (LP, HP, BP, notch) with 12dB/24dB slopes, serial/parallel routing
  - LFOs: 4 with sample-and-hold, sync, and key sync
  - Envelopes: 5 DAHDSR with looping
  - Sequencer: 16 steps x 16 tracks or 32 steps x 8 tracks
  - Arpeggiator: Up, down, up+down, random, assign modes
  - Effects: 4 delay engines, stereo analog distortion, tuned feedback, harmonic exciter
  - Memory: 396 RAM / 396 ROM patches
  - Keyboard: 44 semi-weighted keys, velocity and pressure sensitive
  - Controllers: Dual ribbon controllers, OLED display
  - Connectivity: MIDI In/Out/Thru
