description: "4-channel modeling mic for 360 degree recording. This quadrasonic
  mic features two dual-membrane capsules, one rotating head and 18 vintage mic
  emulations."
details: |-
  Edge Quadro is Antelope Audio's most advanced modeling microphone, a stereo mic with two large dual-membrane capsules and a rotating top head. It delivers four independent channels of audio so engineers can capture stereo techniques like M/S, X/Y, Blumlein and full 360 degree sound from a single mic position.

  Two large condenser capsules with double-sided 6-micron gold-sputtered membranes are perfectly aligned to eliminate phase-related problems. The top head is fully rotatable and can be repositioned silently at any angle, even while the microphone is actively recording.

  Each head can be assigned its own mic emulation and polar pattern, enabling up to 18 vintage microphone emulations across the two heads simultaneously. The library covers Berlin (47 FT, 47 TU, 49T, 57, 67, 87, K86, M103, M251, V563, Halske M25), Tokyo 800T, Vienna 12 and 414, Oxford 4038, Sacramento 121R, Illinois 7B and Minnesota 20.

  Switchable cardioid, figure-8 and omnidirectional patterns per head support all standard stereo configurations: X/Y (both capsules cardioid, offset 90 degrees), Mid/Side (top cardioid, bottom figure-8), and Blumlein (both figure-8, offset 90 degrees), as well as 360 degree recording.

  Edge Quadro is designed to work with Antelope Audio's mic preamp-equipped interfaces, whose FPGA processing runs the mic emulations in real time. Native AFX plug-ins in VST, AU and AAX formats also let the mic be used with any third-party audio interface on macOS and Windows; an iLok 2 or 3 is required for the native plug-ins and is sold separately.

  Ships with a custom luxury shock mount, two 16.4 ft (5 m) high-grade oxygen-free copper 5-pin female XLR to dual 3-pin male XLR Y-cables, and a handmade wooden carrying case.
specs: |-
  - Capsule: two large condenser capsules with double-sided 6-micron gold-sputtered membranes; top head fully rotatable
  - Capsule diameter: 34 mm
  - Polar pattern: Multi-pattern (cardioid, figure-8, omnidirectional, Blumlein, M/S, X/Y)
  - Frequency response: 20 Hz - 20 kHz
  - Self-noise: 19 dB(A)
  - Maximum SPL: 130 dB (computed from sensitivity and dynamic range; page lists S/N 75 dB(A))
  - Signal-to-noise ratio: 75 dB(A)
  - Sensitivity: -35 dB | 18 mV/Pa (-1 to +3 dB)
  - Equivalent noise level: -116 dB
  - Output impedance: 50 Ohms @ 1 kHz
  - Power: 48 V DC phantom power
  - Output connector: 5-pin male XLR (splits to four independent XLR channels via included Y-cables)
  - Dimensions: 11.9 in x 2.1 in (303 mm x 53 mm)
  - Weight: 1.697 lbs (770 g)
  - Included cables: two 16.4 ft (5 m) 5-pin female XLR to dual 3-pin male XLR high-grade oxygen-free copper Y-cables
  - Included emulations: 18 (Berlin 47 FT, 47 TU, 49T, 57, 67, 87, K86, M103, M251, V563, Halske M25; Illinois 7B; Minnesota 20; Oxford 4038; Sacramento 121R; Tokyo 800T; Vienna 12, 414)
  - Native plug-in formats: VST, AU, AAX (macOS and Windows); requires iLok 2 or 3
  - Compatible Antelope hardware: Zen Tour Synergy Core, Discrete 4 Synergy Core, Discrete 8 Synergy Core, Goliath HD Gen 3, Discrete 4, Discrete 8, Orion Studio (limited emulations), Orion Studio Rev. 2017, Goliath HD (Berlin Halske M25 not supported)
  - In the box: microphone, custom luxury shock mount, two oxygen-free copper Y-cables, handmade wooden carrying case
