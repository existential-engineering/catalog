description: Stereo FET large-diaphragm condenser with dual independently
  controllable multi-pattern capsules enabling XY, M-S, and Blumlein stereo
  configurations, featuring a rotating upper capsule and Class-A circuitry.
details: |-
  The CK-40 is a stereo large-diaphragm FET multi-pattern condenser microphone
  featuring a pair of 35mm center-terminated pressure gradient transducers.
  Each capsule is independently controllable with its own polar pattern
  selection, high-pass filter, and pad switch.

  The upper capsule rotates up to 90 degrees off-axis, enabling a full range
  of stereo recording techniques including XY, Mid-Side (M-S), and Blumlein
  configurations. This makes the CK-40 exceptionally versatile for stereo
  field recording, overhead drum miking, room capture, and acoustic instrument
  recording.

  Both capsules support three polar patterns — cardioid, omnidirectional, and
  figure-8 — and run on 48V phantom power. The microphone outputs via a 5-pin
  XLR connector, and includes a breakout box with splitter cable to feed two
  separate preamp channels.

  The CK-40 ships with a retro-style shock mount, 5-pin microphone cable,
  1×2 stereo splitter box, 30-foot cable, foam filter, and a padded wooden
  storage box.
specs: |-
  - Type: Stereo True Condenser Microphone
  - Polar Patterns: Cardioid, Omni, Figure-8 (×2, independently selectable)
  - Capsule: (2) Dual plate 35mm gold sputtered diaphragm/brass
  - Frequency Response: 20–20,000 Hz ±3dB
  - Output Impedance: ≤250 Ohms
  - Sensitivity: -40dB
  - S/N Ratio: 77dB re 1Pa
  - Maximum SPL: 147 dB (0.5% THD @1000Hz)
  - Equivalent Noise Level: 17dB (A-weighted)
  - High-Pass Filter: 80 Hz, 6dB/octave
  - Pad: -10dB
  - Power: 48V Phantom (×2), 3mA consumption
  - Connector: 5-pin XLR with included breakout box
  - Dimensions: 27.6mm × 49mm
  - Weight: 0.95 kg / 2.1 lbs
  - Finish: Polished Nickel trim / Metallic Cabernet Red
