url: https://www.allen-heath.com/hardware/ahm/ahm-32/
description: With 32 zone outputs, echo cancelling and audio networking options,
  AHM-32 is ideal for multi-room installations in hospitality, corporate and
  education environments.
details: |-
  With 32 zone outputs, echo cancelling and audio networking options, AHM-32 is ideal for multi-room installations in hospitality, corporate and education environments.

  32x32 Processing Matrix with flexible routing and configurable processing on all 32 outputs.

  12x12 Local Analogue I/O: 12x mic/line inputs and 12x relay protected line outputs on Phoenix connectors.

  Audio Networking I/O Port with card options including Dante, MADI, Waves and SLink.

  Sound Management Tools include 4x Automatic Mic Mixers, ANC (Ambient Noise Compensation), Priority Ducking, 8-band PEQ, dynamics and delay on every input and zone, Speaker processing with x-over filter, delay, limiter, PEQ and All-Pass Filters, NTP support, and EQ Ganging (Relative, Absolute, and Mirrored Controls).

  In addition to remote controllers, GPIO and 3rd party integration, AHM-32 has a front panel screen and 8x programmable SoftKeys for intuitive volume control, source select, preset recall and more.

  An optional Processing Expansion Module adds multiple channels of feedback suppression (FBS) or acoustic echo cancellation (AEC) to suit videoconferencing scenarios or to suppress troublesome feedback.
specs: |-
  - 32x32 Processing Matrix
  - 12x12 Local Analogue I/O
  - I/O Port for Audio Networking (Up to 128x128)
  - Dante 96kHz Option Card (AES67 and DDM ready)
  - SLink 128x128 Option Card for Audio Expansion
  - 32 Configurable Processing Outputs - Mono / Stereo Zones or Speaker Processing
  - 96kHz FPGA Core With Ultra-low Latency
  - Front Panel Screen and Navigation
  - 8x SoftKeys
  - Compatible With IP1, IP6, IP8 Remote Controllers (up to 32 IP1, 32 IP4, 8 IP8, 8 IP6)
  - 2x2 Local GPIO Plus Networkable GPIO Interface
  - TCP/IP Protocol for Third Party Integration
  - Crestron, AMX and Extron Drivers
  - Mac / Windows System Manager Software
  - Custom Control app and Editor for BYOD
  - 16 User Profiles
  - Integrated Stereo Playback
  - Event Scheduler
  - 4x Automatic Mic Mixers (AMM)
  - Optional Processing Expansion Module: 12-channel AEC or FBS
