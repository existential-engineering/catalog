name: CDi 2|300
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/cdi-2-300
description: A 2-channel professional power amplifier with analog inputs,
  delivering 300W per output channel. Part of Crown's CDi DriveCore series,
  combining high-performance amplification with onboard DSP and network control
  for small to medium-sized installations.
details: |-
  The CDi DriveCore Series is an evolution in amplification, providing an impressive mix of high-performance, rich feature set, and competitive cost. Using technology derived from Crown's flagship Installed Sound amplifier (the DriveCore Install series), the CDi 2|300 offers streamlined functionality for ease-of-use in a variety of applications.

  DriveCore Technology eliminates hundreds of components within each amplifier, reducing variability and increasing reliability while improving audio fidelity through efficient design. The amplifier features network control and monitoring via HiQnet Audio Architect software over TCP/IP, plus high-level onboard DSP including input/output routing, delays (up to 1000ms input, 100ms output), 8-band parametric EQ, crossover, and a LevelMAX limiter.

  Direct Drive 70/100Vrms output support enables high-impedance speaker applications without requiring an external transformer. Pre-loaded JBL speaker tunings expedite installations, while the front-panel interface provides intuitive amplifier configuration. A GPIO/AUX port handles preset recall, channel muting, fault monitoring, and power control.
specs: |-
  - 2 channels
  - 300W per channel @ 4Ω
  - Dual mode: 150W @ 2Ω, 300W @ 4Ω, 300W @ 8Ω, 150W @ 16Ω, 300W @ 70Vrms, 300W @ 100Vrms
  - Bridge mono: 300W @ 4Ω, 600W @ 8Ω, 600W @ 16Ω, 600W @ 140Vrms, 600W @ 200Vrms
  - Sensitivity: 0.7V RMS (full rated power @ 8Ω)
  - Signal-to-Noise Ratio: >104dB
  - THD: 0.35% (full rated power, 20Hz–20kHz)
  - Damping Factor: >1000 (20Hz–100Hz)
  - Frequency Response: ±0.5dB (8Ω, 20Hz–20kHz)
  - Crosstalk: >80dB (below rated power, 20Hz–1kHz)
  - Input Impedance: 20kΩ balanced / 10kΩ unbalanced
  - Onboard DSP: 8-band parametric EQ, crossover, LevelMAX limiter
  - Input delay up to 1000ms, output delay up to 100ms
  - Network control via HiQnet Audio Architect (TCP/IP)
  - Direct Drive 70/100Vrms output (no transformer required)
  - Pre-loaded JBL speaker tunings
  - GPIO/AUX control port
  - Dimensions: 19" W × 3.5" H × 12.25" D (excluding 1.3" front panel protrusion)
  - Weight: 14.56 lbs (6.6 kg)
  - Power: IEC 320 inlet, 100–240V AC
  - BLU link: No
