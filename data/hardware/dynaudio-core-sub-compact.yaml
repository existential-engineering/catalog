description: Core Sub Compact is a space-saving studio subwoofer from Dynaudio's
  flagship Core reference series. Two opposing 9-inch MSP+ Hybrid Drive units
  deliver bass extension to 16Hz with a 100dB maximum SPL at 1 metre, driven by
  the same DSP engine and amplifier module used across the larger Core monitors
  so tonal character stays consistent through the system.
details: |-
  Core Sub Compact might be smaller in size, but in processing power it's a giant. The subwoofer delivers bass extension down to 16Hz at -3dB with 100dB maximum SPL at 1 metre, using twin 9-inch MSP+ Hybrid Drive units in a sealed cabinet. It's designed for studios where space is tight while preserving the tonal consistency of the Core monitor family.

  The unit shares the same DSP engine and amp module as the larger Core speakers, supporting configurations from 2.1 through 9.1.6 immersive systems. Dual opposed drivers cancel mechanical vibration so the cabinet can sit on a desk, slide under monitors via built-in indentations, or mount on a wall using standard VESA hardware. Multiple units can be stacked or distributed for more even bass coverage in the listening position.

  Reference monitoring is about trust, and solid bass-management is crucial in letting you know exactly how your material and room really sound. The MSP+ Hybrid Drive combines a rigid aluminium core with paper damping and Dynaudio's proprietary MSP material, engineered specifically for subwoofer duty.

  Like every Core model, each Core Sub Compact is individually calibrated at the factory in Denmark before shipping, so units perform to the same reference within tight tolerances. Combined with the Core DSP's boundary and acoustic-environment compensation, the subwoofer is intended for music recording studios, post and broadcast suites, immersive rooms, and any near- or midfield setup needing flat low-end extension in a compact footprint.
specs: |-
  - Type: Subwoofer
  - Series: Core
  - Box principle: Sealed
  - Drivers: 2x 9" MSP+ Hybrid Drive
  - Amplifier power: 280W
  - Maximum SPL: 100 dB
  - Lower cutoff (-3 dB): 16 Hz
  - Upper cutoff (-3 dB): 200 Hz
  - Lower cutoff (dynamic @ -6 dB): 15 Hz
  - Upper cutoff (dynamic @ -6 dB): 230 Hz
  - AC power input: 100-240V 50/60Hz
  - Auto on/off: Yes
  - Standby power consumption: 0.48 W
  - Weight: 26.1 kg (57.5 lbs)
  - Dimensions (W x H x D): 390 x 360 x 365 mm (15 3/8" x 14" x 14 3/8")
  - Speakers per box: 1
