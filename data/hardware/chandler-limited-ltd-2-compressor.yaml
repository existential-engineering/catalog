details: |-
  The Chandler Limited LTD-2 is a hand wired and handmade recreation of the 2254/2264/33609 compressor family, using parts and build techniques from the original manufacture of the modules. Grounding, wiring techniques, original transformers, transistors, and much more attribute to the special sound of these units and have been painstakingly recreated in each LTD-2.

  The LTD-2 uses the control circuit from the 80-series family of compressors, but retains the Class A amplifiers and transformers from the 2254 and 10-series modules. A six-position attack switch was added, which none of the vintage types had. The sped up release times make the units much more versatile. The LTD-2 is warm, creamy, and valuable in many situations.

  All LTD units require and function on the PSU-1, Chandler Limited power supply. The PSU-1 has an internal switch for setting voltage to 120V or 220V (115V/230V). Custom mastering/mixing pairs are available with even faster release times, 1 dB stepped gain makeup, and specially matched for stereo use.

  As of May 2019, the LTD-2 Compressor has been discontinued. The unit earned a strong reputation among top-tier engineers and artists, including Green Day, Paul Simon, Tony Maserati, and Sterling Sound, among many others.
