description: Achieve rich analog sound with the ease and versatility of digital control
details: |-
  The PA-1Q series came out of Free The Tone's work on integrating the digital and analog technologies developed for the AMBI SPACE and TRI AVATAR, after more than ten years of development from the original concept.

  At first glance the units look like digital equalizers, but they are analog equalizers. Every equalizer circuit through which the guitar or bass signal passes, including the input and output sections, is fully analog, which is the same signal processing method found in graphic equalizers with conventional slider controls. Only the parameter control section is digital, storing and processing parameter states in the digital domain so that presets and MIDI can drive the analog circuit in real time.

  The renewed HTS (Holistic Tonal Solution) circuit manages the signal from input to output so that the sound texture stays the same whether the effect is on or off. The ten equalizer bands and their curves are chosen per instrument, and the PA-1QB's frequencies are selected for bass at 40 Hz, 80 Hz, 125 Hz, 250 Hz, 500 Hz, 800 Hz, 1200 Hz, 2400 Hz, 4500 Hz and 8 kHz, each with plus or minus 12 dB of range.

  Any of 99 presets can be recalled instantly over MIDI. Beyond equalization, the unit doubles as a preset volume controller that manages level per preset, which suits raising the volume for a solo or levelling out output differences when switching between several instruments.

  Controls are a pair of cursor keys, a PARAMETER encoder and an INST (-10 dB) / LINE (+4 dB) level selector switch, and the unit is housed in a compact pedal enclosure at 120 x 102.3 x 58.5 mm.
specs: |-
  - Number of presets: 99
  - Input impedance: INST min. 1 MOhm, LINE min. 300 kOhm
  - Output load impedance: min. 10 kOhm
  - Max. input level: INST +4 dBu, LINE +14 dBu with EQ flat
  - Frequency response: 10 Hz to 40 kHz (+/- 0.5 dB) with EQ flat
  - Controls: cursor keys, PARAMETER encoder, INST (-10 dB) / LINE (+4 dB) level selector switch
  - PA-1QB bands: 40 Hz, 80 Hz, 125 Hz, 250 Hz, 500 Hz, 800 Hz, 1200 Hz, 2400 Hz, 4500 Hz, 8 kHz (+/- 12 dB)
  - Terminals: 1/4 inch standard phone jack x 2 (input and output), DC 9V input jack for AC adapter, DIN 5-pin connector x 2 (MIDI IN and OUT/THRU)
  - Power supply: 9V DC centre negative polarity, no AC adapter included
  - Current consumption: 200 mA
  - Dimensions: 120 x 102.3 x 58.5 mm or 4.7 x 4.0 x 2.3 inches including protuberances such as the footswitch and jacks
  - Weight: approx. 350 g or 0.77 lbs excluding accessories
  - Fully analog signal path with digital parameter control
  - Renewed HTS (Holistic Tonal Solution) circuit
  - Doubles as a per-preset volume controller
  - Accessories: warranty card, manual, rubber feet x 4
