description: Available in a new Magenta finish for 2026, the SC-607 Baritone is an LTD Signature Series guitar for Stephen Carpenter, the influential co-founder of California-based alt-metal gurus Deftones. Built with neck-thru-body construction at 27" scale, the SC-607 Baritone is a seven-string guitar designed to allow you to explore the deep textures of downtuned heavy music. Its thin U-shaped three-piece maple neck — affixed to mahogany body wings — features a Macassar ebony fingerboard, 24 extra-jumbo frets, and a reverse headstock that adds even better string tension to the lowest registers. Components on the SC-607 Baritone include gold hardware, LTD locking tuners, a TonePros locking TOM-style bridge with string-thru-body, and a set of Stephen's own Fishman Fluence SRC Signature 3-Voice, with push-pull controls to activate its various voices. Includes deluxe ESP hardshell case.
details: |-
  Available in a new Magenta finish for 2026, the SC-607 Baritone is an LTD Signature Series guitar for Stephen Carpenter, the influential co-founder of California-based alt-metal gurus Deftones. Built with neck-thru-body construction at 27" scale, the SC-607 Baritone is a seven-string guitar designed to allow you to explore the deep textures of downtuned heavy music.

  Its thin U-shaped three-piece maple neck, affixed to mahogany body wings, features a Macassar ebony fingerboard, 24 extra-jumbo frets, and a reverse headstock that adds even better string tension to the lowest registers.

  Components on the SC-607 Baritone include gold hardware, LTD locking tuners, a TonePros locking TOM-style bridge with string-thru-body, and a set of Stephen's own Fishman Fluence SRC Signature 3-Voice, with push-pull controls to activate its various voices. Includes deluxe ESP hardshell case.

  Finish: Magenta. Series: Signature Series Guitars (Stephen Carpenter). New for 2026.
specs: |-
  - Construction: Neck-Thru
