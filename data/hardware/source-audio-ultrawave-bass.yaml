description: At the Ultrawave's core is a dynamic and multi-dimensional sound
  sculpting approach known as multiband processing. Explore its ground-shaking
  varieties of overdrive and tremolo.
details: |-
  At the Ultrawave's core is a dynamic and multi-dimensional sound sculpting approach known as multiband processing. Explore its ground-shaking varieties of overdrive and tremolo, tuned for bass.

  The Ultrawave Bass offers 44 distortion types (including Tube, Diode, Foldback, Negative Flip Diode, and Octave Up), 37 band-splitting options with various frequency configurations, and detailed LFO controls for tremolo, morphing, or ring modulation.

  Sound morphing is available via expression pedal, envelope follower, or LFO, alongside an 8-band graphic equalizer and a dual-channel compressor/expander. The pedal connects to the free Neuro software and apps for customization and preset sharing.

  It stores 128 presets (6 accessible via pedal toggle, 128 via MIDI), with reassignable knobs per preset and Universal Bypass (true bypass or transparent buffer options).
specs: |-
  - 44 distortion types (Tube, Diode, Foldback, Negative Flip Diode, Octave Up, and more)
  - 37 band-splitting options with various frequency configurations
  - Detailed LFO controls for tremolo, morphing, or ring modulation
  - Sound morphing via expression pedal, envelope follower, or LFO
  - 8-band graphic equalizer
  - Dual-channel compressor and expander
  - 128 presets (6 via pedal toggle, 128 via MIDI)
  - Reassignable knobs per preset
  - Universal Bypass (true bypass or transparent buffer)
  - USB-MIDI support
  - Housing: brushed anodized aluminum
  - Weight: 0.625 lb
  - Dimensions: 4.6 in. x 2.75 in. x 2.2 in.
  - Power consumption: 165 mA
