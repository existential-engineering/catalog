id: TyP1sAFKH7in83aXoJfEb
name: DL431
manufacturer: midas
primaryCategory: rack-mount
categories:
  - preamp
url: "https://www.midasconsoles.com/en/products/0606-AAT"
description: '6U 19" fixed-configuration rack I/O unit designed for microphone
  signal splitting applications with 24 mic/line level inputs and 72 line level
  outputs.'
details: |-
  The Midas DL431 is a 6U 19-inch fixed-configuration rack I/O unit designed for microphone signal splitting applications. It features 24 mic/line level inputs with award-winning Midas microphone preamplifiers (3 preamps per input channel — 2 with variable gain in 2.5 dB steps and 1 with fixed gain) and 72 line level outputs (24 channels x 3 outputs per channel). Dual redundant AES50 SuperMAC network interfaces and dual redundant Ethernet control ports provide 96 kHz networked audio and control. Includes a front-panel LCD display, LED status indicators and signal metering, headphone and monitor line outputs, MIDI In/Out/Thru, and dual redundant auto-ranging universal switch-mode power supplies (100-240 VAC, 50-60 Hz). Compatible with Midas PRO3, PRO6, PRO9, XL8, and PRO X consoles. Housed in a rugged steel 6U rackmount enclosure.
specs: |-
  - Sampling Rate: 96 kHz
  - Mic Preamplifiers: 3 per input channel (2 variable gain with 2.5 dB steps, 1 fixed gain)
  - Network Standard: AES50-2011 compliant (SuperMAC)
  - Ethernet: 100 Megabit, frame-based digital audio network
  - Power Supply: Dual redundant auto-ranging universal switch-mode, 100-240 VAC, 50-60 Hz
  - Rack Units: 6U
  - Width: 483 mm (19.0 in)
  - Depth: 402 mm (15.8 in)
  - Height: 266 mm (10.5 in)
  - Weight: 21.5 kg (47.3 lbs)
