description: >-
  The Yamaha DX21 is a consumer-level 4-operator digital FM synthesizer released
  in 1985. It offers keyboard splitting, layering capabilities, and a built-in
  chorus effect, making it more capable than the DX100 and DX27. Notable users
  include Vangelis, Hardfloor, Technotronic, and Norman Cook (Fatboy Slim).
details: |-
  The DX21 employs FM (frequency modulation) synthesis, a technology pioneered by Yamaha that produces distinctive digital tones ranging from lush pads to metallic textures. While the preset sounds are only moderately useful, users willing to invest time in programming can achieve quality string patches, bass sounds, and atmospheric pad tones alongside industrial effects.

  The synth distinguishes itself from other budget DX models through features like portamento, unison mono-mode for expressive lead performances, keyboard splitting, and layering. These capabilities elevate it above the DX100 and DX27 in Yamaha's lineup.

  Notable musicians who utilized the DX21 include Hardfloor, Level 42, Brother Beyond, Astral Projection, Technotronic, Vangelis, and Norman Cook (Fatboy Slim), demonstrating its versatility across genres from synthpop to electronic dance music.
specs: |-
  - 8-voice polyphony
  - 4-operator digital FM synthesis
  - Monotimbral (1 instrument)
  - No filter
  - Built-in chorus effect
  - 61-key keyboard (no velocity or aftertouch sensitivity)
  - 128 patches and 16 performances
  - MIDI control with velocity and aftertouch support
  - Produced from 1985
