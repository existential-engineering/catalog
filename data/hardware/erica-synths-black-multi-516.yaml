description: Buffered multiple.
details: |-
  The Black Multi is a highly accurate active buffered multiple that works either as two 1 to 3 multiples or as a single 1 to 6, in 4HP. It will work for signal splitting in any circuit, including driving several VCOs in tune from one CV source.

  Octave switches, which apply a plus or minus 1V offset, sit on both channels. They add or subtract one volt from each channel, transposing the VCOs fed from that channel one octave up or down without touching the source.

  A hidden feature, custom offset, allows a user defined offset to be set on the first channel, so the transposition is not limited to whole octaves.

  Maximum input level runs between -10V and +10V, the panel is 4HP wide at a depth of 25mm, and power draw is 25mA on each of the positive and negative rails.
specs: |-
  - 2 x 1 signal to 3 or 1 signal to 6
  - Octave or +-1V offset switches
  - Custom offset on the first channel
  - Max input level -10V - +10V
  - Power consumption +25mA, -25mA
  - Module width 4 HP
  - Module depth 25mm
