description: >-
  The BXx2 is a dual-channel preamp, EQ, and mixer based on the classic Boss BX
  series mixers, beloved for their unique character and musicality across
  countless techno records of the 80s and 90s. Each channel features independent
  input gain and level controls enabling overdrive for a signature saturated and
  lively sound, along with high and low shelf EQs and an auxiliary mix input for
  chaining additional sources.
details: |-
  The BXx2 is a dual-channel Eurorack mixer module that faithfully recreates the sound character of the vintage Boss BX series mixers. Each channel is equipped with an input gain control and a separate level control — driving the gain up produces the overdriven, saturated texture the original BX mixers are celebrated for in techno music.

  The per-channel EQ section provides high and low shelf equalisers for tonal shaping. An auxiliary input at a fixed -6dB gain allows a third signal source or additional mixer to be chained seamlessly into the mix.

  Designed in collaboration with Feedback Modules and based on their single-channel PRE BX module, the BXx2 was a limited release of just 300 units. Now discontinued.
specs: |-
  - Format: Eurorack, 8HP
  - Depth: 32mm
  - Power: +12V 10mA / -12V 10mA
  - Channels: 2 (plus auxiliary input)
  - EQ: Per-channel high and low shelf
  - Overdrive: Yes, via gain and level controls
  - Auxiliary input: Fixed gain (−6dB)
  - Reverse power protection: Yes
  - Made in England
  - Limited edition: 300 units
  - Status: Discontinued
