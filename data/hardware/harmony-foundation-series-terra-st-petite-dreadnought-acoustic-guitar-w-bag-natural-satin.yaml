details: |-
  The Harmony Foundation Series is one for the wanderers whose inspiration travels with them, a steadfast companion to weave tales out of every path taken on the journey. The Terra ST Petite Dreadnought's solid spruce top delivers a trio of benefits: a well-balanced tone, enhanced dynamic response, and a sound that gets richer over the years. Its okoume neck is notable for its lightness and provides tonal clarity and resonance. Solid spruce X-bracing helps to deliver sound projection with remarkable depth, while rounded fret ends further add to the guitar refinement, removing any sharpness for a smoother playing experience. The Terra ST Petite Dreadnought comes pre-strung with D'Addario EXP16 coated strings for lasting bright tones. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
