description: Erica Synths Black Voltage Controlled Envelope Generator brings you
  the ultimate control over envelopes in your modular synth.
details: |-
  The bundle pairs the Erica Synths Black VC EG with the Black VC EG Expander, bringing thorough control over envelopes in a modular synth.

  The Black VC EG is a looping linear and logarithmic ADSR envelope generator with CV control over each stage.

  Together with the Black VC EG Expander it becomes a genuinely advanced modulation source. The expander outputs gates or CVs for each active stage of the envelope, so advanced patches can be designed, and inverted and bipolar envelope outputs are available as well.
