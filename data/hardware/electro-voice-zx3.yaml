description: 12-inch two-way passive composite loudspeaker from the
  Electro-Voice ZX Series, offering 131 dB max SPL and a choice of 90 x 50
  degree or 60 x 60 degree coverage in a weatherized wedge cabinet suitable for
  mains, fills, or stage monitors.
details: >-
  The ZX3 is the 12-inch passive model in Electro-Voice's ZX Series of compact
  full-range loudspeakers. It pairs a DVX3121A 12-inch (305 mm) woofer featuring
  forced-air cooling with a 2-inch (51 mm) ND2 titanium/neodymium compression
  driver, crossed over at 2 kHz to deliver 131 dB maximum SPL with 97 dB
  sensitivity (1 W @ 1 m).


  The enclosure is molded from high-impact polystyrene composite with a
  polyester powder-coated 18-gauge galvanized steel grille, and the wedge
  cabinet shape is intended to double as a stage floor monitor. The ZX3 is
  offered in two horn configurations - the standard 90 x 50 degree pattern
  (ZX3-90) and a tighter 60 x 60 degree pattern (ZX3-60) - and in either black
  or white finish. Weatherized construction and integrated suspension hardware
  (seven M8 mounting inserts plus up to four anchor-plate attachment points)
  make the cabinet suitable for permanent indoor or outdoor install as well as
  portable PA.


  As a passive loudspeaker the ZX3 requires external amplification. Signal
  connects via a captive 2-conductor SJO cable feeding through a gland nut on
  the rear panel; an internal passive crossover handles the LF/HF split with
  full-band overload protection.
specs: >-
  - Configuration: 2-way passive full-range loudspeaker

  - LF driver: DVX3121A 12 in (305 mm) with forced-air cooling

  - HF driver: ND2 2 in (51 mm) titanium/neodymium compression driver

  - Crossover frequency: 2 kHz

  - Frequency response (-3 dB): 58 Hz - 15 kHz

  - Frequency range (-10 dB): 48 Hz - 20 kHz

  - Maximum SPL: 131 dB calculated (1 m)

  - Power handling: 600 W continuous / 2,400 W peak

  - LF power handling: 500 W

  - HF power handling: 40 W

  - Nominal impedance: 8 ohms (6.2 ohms minimum)

  - Axial sensitivity: 97 dB SPL (1 W @ 1 m)

  - Coverage pattern: 90 degrees H x 50 degrees V (ZX3-90) or 60 degrees H x 60
  degrees V (ZX3-60)

  - Recommended high-pass filter: 50 Hz

  - Connector: 2-conductor SJO cable with gland nut

  - Enclosure: High-impact polystyrene composite, weatherized

  - Grille: Polyester powder-coated 18-gauge galvanized steel

  - Suspension: Seven M8 mounting inserts; up to four anchor-plate attachments;
  integrated handle

  - Dimensions (H x W x D): 613 x 397 x 362 mm

  - Net weight: 19.8 kg

  - Finishes: Black or white
