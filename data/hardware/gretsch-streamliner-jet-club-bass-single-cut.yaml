details: |-
  The Streamliner Collection revitalizes the best elements from the past and combines them with exciting new features to deliver exceptional performance, sound, and style at an incredible value.

  An exciting new addition to the Streamliner Collection, the Jet Club Bass rings out with a thunderous roar. Featuring versatile Streamliner single-coil bass pickups, a comfortable 30" scale length and Soft 'C' neck shape, and an intuitive control set, the Jet Club Bass gives you everything you need to lay down the low end.

  With the ability to go from warm and round to punchy and articulate, the Low Down single-coil bass pickups can cover a wide range of sonic territory, giving them the versatility needed to cover just about any style.

  The Jet Club bass features a short 30" scale length and a Soft 'C' shaped nato neck that brings a new level of comfort and playability.
