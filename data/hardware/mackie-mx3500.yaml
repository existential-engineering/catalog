url: https://mackie.com/en/products/amplifiers-processors/mx-series/MX3500.html
description: MX Series Professional Power Amplifiers provide the power and
  performance needed for installation and portable passive systems and are the
  perfect match for DRM Series Passive Loudspeakers.
details: |-
  MX Series Professional Power Amplifiers provide the power and performance needed for installation and portable passive systems. Utilizing proven Mackie amplifier design history, they deliver clear, punchy sound that is distortion-free even when pushed to the limits.

  With optimized performance, super-quiet operation and an array of protection circuits, the MX Series delivers powerful performance at an affordable price. Combine with DRM Passive Loudspeakers and the SP260 Loudspeaker Processor for a complete Mackie professional system.

  The MX Series is Built-Like-A-Tank but is still easy to lift thanks to a lightweight and ultra-efficient high-current switching power supply.

  Applications include small to mid-size club and band PA systems, houses of worship, DJs, rehearsal spaces, gymnasiums, banquet halls and A/V rentals.
specs: |-
  - 1000W continuous power @ 8 ohms per channel
  - 1350W continuous power @ 4 ohms per channel
  - 2700W continuous power @ 8 ohms bridged
  - Signal-to-noise ratio above 105 dB below rated power, A-weighted
  - Input gain 37 dB
  - Mains input ~230 to 240 VAC, 50/60 Hz, 1000W @ 8 ohms
  - Dimensions 3.5 x 19.0 x 14.6 in / 88 x 483 x 370 mm
  - Weight 40.3 lb / 18.3 kg
  - Selectable parallel / stereo / bridged operating modes
  - Independent level control per channel
  - Selectable input sensitivity
  - Signal, Clip and Fault LEDs per channel
  - Short, under-impedance, over-current and thermal protection
  - XLR input and Thru per channel
  - NL4 speaker outputs
  - Robust, impact-resistant, all-steel 2U rackmount chassis
  - Forced-air ventilation with variable-speed, back-to-front airflow
  - Frequency response 20 Hz to 20 kHz (+0, -1 dB) @ 1 W
  - Distortion (THD) below 0.5%, 20 Hz to 20 kHz
  - Damping factor above 200 @ 10 Hz to 400 Hz into 8 ohms
  - Slew rate above 10 V/us
  - Input impedance 20 k ohm balanced, 10 k ohm unbalanced
  - AC connector: 3-pin IEC 250 VAC, 10 A male
  - Not available in USA, Canada, China, Japan and other 100 to 120V countries
