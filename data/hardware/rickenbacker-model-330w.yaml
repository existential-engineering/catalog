name: Model 330W
manufacturer: rickenbacker
primaryCategory: electric-guitar
url: https://www.rickenbacker.com/guitars/model-330w/
description: Explore the Model 330W Guitar, a blend of classic design and rich
  sound featuring walnut and single coil pickups.
details:
  - A natural spin on a classic, the W Series brings the same full, rich and
    warm sound that have made 330's popular since the 1960's. The iconic design
    is now strengthened with the natural character of walnut and polished with
    an oil finish.
  - Two single coil pickups on a full size body are accented by a traditionally
    shaped sound hole. The 21 fret Maple fingerboard is punctuated by dot inlay
    fret markers, with full double cutaways permitting access to all the frets.
  - Standard output is monaural through a single jack plate.
