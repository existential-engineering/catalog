url: https://www.klipsch.com/products/the-nines-ii-powered-speakers
description: The Klipsch The Nines II powered speakers deliver powerful
  horn-loaded sound with Dolby Atmos, Dirac Live room correction, and premium
  connectivity including HDMI eARC and XLR studio inputs.
details: |-
  The Nines II are Klipsch's flagship powered bookshelf speakers, built on 80 years of acoustic expertise and powered by Onkyo AVR technology. They feature an 8-inch woofer paired with Klipsch's signature horn-loaded tweeter, housed in a one-piece BMC (Body Molded Component) baffle that reduces resonance and distortion.

  These speakers support Dolby Atmos, DTS:X, and DTS Virtual:X for immersive surround sound decoding, making them equally at home as a home theater hub or a high-fidelity stereo listening system. Dirac Live room correction with a standard license is included, automatically optimizing sound for the listening environment.

  Connectivity is extensive: HDMI 2.1 with eARC, 4K/120, VRR, ALLM, and HDR support ties the speakers into a home theater chain, while new XLR studio inputs bring professional-grade signal compatibility. The built-in phono stage accepts turntable connections directly without a separate preamp.

  Wireless streaming is handled via Google Cast, Apple AirPlay 2, Spotify Connect, Tidal Connect, and Qobuz Connect. Hi-res wireless audio is supported at 48kHz, with full 96kHz resolution available over a wired connection between the two speakers.

  Physical controls are provided by a metal wheel and buttons on the top edge of the primary speaker, and a backlit remote is included. Available in Walnut, Red Oak, and Black finishes, with control via the Klipsch Connect Plus mobile app.
