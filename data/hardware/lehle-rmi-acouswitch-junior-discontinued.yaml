details: |-
  The ACOUSWITCH JUNIOR is a compact multi-functional tool for musicians who perform on stage with electric instruments as well as with acoustic ones and wish to use the same effects for both with one pedal board. With two separately controllable high impedance inputs it becomes the control center within the electric and acoustic setup.

  The control over which signal is sent to the PA or the amp remains with the musician, without re-plugging cables. It does not matter whether you're using it for acoustic music only or for a combination of both electric and acoustic instruments, the Acouswitch Junior is designed for both alternatives.

  The JUNIOR features an active DI Out (XLR) and a line-out jack as selectable outputs. To allow universal usage, the A/B switch can be configured individually, depending on the setup: for example, in one configuration line- and XLR output can be mutually muted, depending on the input being used. Toggling between the inputs is just as possible as mixing them together. For a purely acoustic setup the outputs can be always activated, too.

  In addition to the 4-band EQ for channel A, the ACOUSWITCH JUNIOR has a serial effects loop, a tuner-out output with mute function and a built-in clean boost effect. Effects loop, mute function and boost can be managed via the mute / loop boost footswitch in various combinations.

  The proven LEHLE True Sound Technology with familiar features like the discrete JFET-input stage, or switching via gold-plated relays make sure that the Acouswitch Junior provides an excellent sound. Internally the JUNIOR also works with 18V, but nevertheless is content with all power supplies from 9 to 15V AC or DC. The extremely robust design with protected controllers and the almost indestructible switching mechanism provide many years of fun while playing with acoustic and electric setups.
specs: |-
  - Two separately controllable high impedance inputs for electric and acoustic instruments
  - Individually configurable A/B switch: toggle between inputs, mix them, or mute line and XLR outputs against each other
  - Active DI Out (XLR) and line-out jack as selectable outputs
  - 4-band EQ for channel A
  - Serial effects loop
  - Tuner-out output with mute function
  - Built-in clean boost effect
  - Mute / loop boost footswitch managing effects loop, mute and boost in various combinations
  - LEHLE True Sound Technology with discrete JFET input stage
  - Switching via gold-plated relays
  - Works internally with 18 V
  - Runs on any power supply from 9 to 15 V AC or DC
  - Robust design with protected controls
