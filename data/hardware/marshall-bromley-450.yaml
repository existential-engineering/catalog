description: This portable speaker can play free from wires for 40+ hours.
  Living room, festival or backyard, this party speaker goes the distance.
details: |-
  Whether the party is indoors or out, never sacrifice the sound quality. True Stereophonic 360 degree sound lets everyone know the party is on. And you can keep it going with a portable playtime that lasts as long as the crowd wants. It can take a bit of dirt and water, so no need to stay inside. Living room, festival or backyard, this Bluetooth party speaker goes the distance.

  Whether you are at a house party or festival campsite, the music always feels close with a sound that gets around. Two 6.5 inch woofers, four 2 inch full-range drivers and two passive radiators sit in a sealed cabinet, driven by six class D amplifiers for a maximum sound pressure level of 100 dB at 1 m.

  Inputs for both mic and instruments let you turn the party into an impromptu gig or karaoke session without any hassle, with volume and effect controls for each of the two inputs on the top panel alongside volume, bass, treble and the M-button. Integrated stage lights offer three presets that each add to the energy of the party in their own way.

  With its IP55 rating, dirt and water splashes are no problem for this portable speaker, and a built-in handle plus four strap anchors make it easy to bring along. Playtime is 40+ hours, with a 20 minute quick charge giving 6 hours and a full recharge taking 3.5 hours.

  When designing, Marshall prioritises durability, repairability and replaceable components. Bromley 450 comes with an easily replaceable LFP battery featuring adaptive charging technology that helps protect battery health over time, the battery can be charged in the speaker or separately, and the speaker also runs directly from mains power with no battery fitted. Designed and engineered in Sweden. Made in China.
specs: |-
  - Drivers: 2 x 6.5 inch 40W woofers, 4 x 2 inch 6W full-ranges, 2 passive radiators
  - Driver type: dynamic, sealed cabinet with passive radiator
  - Power amplifiers: 2 x 90W class D for the woofers, 4 x 55W class D for the full-range drivers
  - Frequency range: 40Hz to 20,000Hz
  - Maximum sound pressure level: 100 dB @ 1 m
  - Stereo output with equaliser
  - Bluetooth 5.3 with Auracast and multipoint connectivity, range >70 m (229 feet) in free field
  - Codecs: SBC, AAC-mpeg 2 and LC3
  - Wired connectivity: AUX 3.5 mm (input and output), USB-C, RCA, and 2 x XLR / 6.35 mm combo jacks for mic and instrument
  - Top panel controls: power switch, source selector, media control, volume, bass, treble, M-button, input 1 volume, input 2 volume, input 1 and input 2 effect control, light mode, battery indicator
  - Integrated stage lights with three presets
  - Rechargeable, replaceable LFP (LiFePO4) battery, 40+ hours play time, 3.5 hours to full recharge, 20 minute quick charge gives 6 hours
  - USB Type-C, charge out 5V 3.0A
  - Mains input voltage 100-240V, mains frequency 50/60 Hz, power input 120W
  - Water resistance: IP55
  - Built-in handle and four strap anchors
  - Dimensions: 366 x 261 x 492 mm (14.41 x 10.28 x 19.37 in)
  - Weight: 12.32 kg / 27.16 lbs
  - Compatible with the Marshall Bluetooth app
  - In the box: speaker, Bromley battery (fitted), mains lead, quick start guide, legal and safety sheet
  - Designed and engineered in Sweden. Made in China.
