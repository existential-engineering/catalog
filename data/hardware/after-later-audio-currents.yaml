details: |-
  Full size version of Mutable Instruments Tides V2 (2020). It retains all of the original functionality of the full size version, both software and hardware. Its core is a triangle function generator and waveshaper that can be used as an LFO, oscillator, AD-style envelope generator (EG), and AR-style EG. Based on open source designs by émilie gillet under Creative Commons ( CC-BY-SA ) license.
