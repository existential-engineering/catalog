description: A 10th anniversary edition of the Kilt overdrive/distortion pedal
  with improved gain range, enhanced high-end clarity, increased headroom, and
  refined toggle switches for a more versatile drive from edge-of-breakup to
  gated fuzz.
details: |-
  After ten years, the Kilt gets a refreshed voice and reimagined aesthetic. The Kilt 10 is a 10th anniversary special edition of the Kilt, designed in collaboration with Stu G (guitarist of Delirious?). An updated clipping section delivers more headroom, smoother attack, and a richer, more dynamically useful drive range. The polished aluminum finish pays tribute to the original Kilt V1, paired with classic Expandora-style knobs and a refreshed icon that nods to both the Scottish flag and the Roman numeral X. The gain knob now offers a far more usable 0-25% range with articulate low-gain textures. The G1/G2 toggles provide up to 4 different resistance clipping options, and the G2 toggle can be switched remotely via JHS Red Remote. The Low-Cut toggle has been improved for better compatibility across a wider range of amplifiers and amp modelers. Dimensions: 2.6" x 4.8" x 1.6". Power: 9VDC only, 64mA.
