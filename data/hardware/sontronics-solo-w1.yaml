details: |-
  SOLO W1 brings the trusted sound of Sontronics into the wireless world, giving performers the freedom of movement without compromising vocal clarity, presence or reliability. Based on the character and performance of our popular SOLO handheld dynamic microphone, this supercardioid capsule is designed to deliver a confident, natural vocal sound that cuts through the mix clearly in live environments. Whether used on stage, in houses of worship, theatres or live production settings, SOLO W1 provides consistent results that performers and engineers can rely on night after night. The focused supercardioid polar pattern helps reduce spill from monitors, instruments and stage noise, allowing vocals to remain clear and controlled even in demanding live situations. The result is a balanced, mix-ready sound that works equally well for singers, presenters and spoken word applications. Designed for seamless integration into widely used professional wireless systems, SOLO W1 is compatible with Shure handheld transmitters, making it easy for performers, hire companies and venues to upgrade their vocal sound while continuing to use their existing setup. With strong output and durable construction, SOLO W1 is built to meet the practical demands of touring and regular live use.
