description: Compact VCA module.
details: |-
  The Erica Synths Pico VCA2 is a compact voltage controlled amplifier module built around the AS3330 chip. It features two independent channels, and the first one comes with a manual offset adjustment that is useful for full span vibrato effects.

  Audio and CV inputs of the first VCA are normalled to the second one, so the module can also be used as a buffered audio splitter. Both VCAs are DC coupled, which means they can be used to control the amplitude of control voltage signals as readily as audio.

  The two VCAs have a linear response and the inputs are protected against overvoltage, with further protection against a reverse PSU connection. At 3HP wide and 35mm deep, the module fits the Pico Series goal of putting full functionality into a very small panel.
specs: |-
  - Two independent VCAs with a linear response
  - Manual bias adjustment on the top VCA
  - Input normalling between the two channels
  - DC coupled signal path
  - Input protection against overvoltage
  - Protection against reverse PSU connection
  - CV level (full span) -5V to +10V
  - Max attenuation -110dB
  - Power consumption +20mA, -19mA
  - Module width 3HP
  - Module depth 35mm
