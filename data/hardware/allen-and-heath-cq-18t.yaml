description: Ultra-Compact 18in / 8out Digital Mixer with Wi-Fi. CQ-18T is the
  largest desktop mixer in the CQ range and is ideal for gigging bands,
  rehearsal spaces, home recording and streaming, speech applications and
  corporate AV.
details: |-
  CQ takes our renowned processing and effects, adds exciting new assistive mixing tools, and packages it all up into our smallest, and most affordable, digital mixer series yet.

  CQ draws on technology from our latest generation of live sound consoles to deliver audio quality previously unimaginable at this level of mixer. Pristine 96kHz audio is partnered with studio-grade onboard processing and an optimised suite of FX to set a new standard for what's possible with ultra-compact digital mixers.

  CQ's Feedback Assistant automatically detects and eliminates problem frequencies using up to 16 filters per output so you can mix with confidence — and forget about feedback. The Gain Assistant streamlines soundchecks by setting input gains automatically.

  CQ makes it easy to handle multiple channels simultaneously with 4 DCAs, each capable of controlling the level of any combination of inputs, outputs, and FX, for simple single-fader control of multiple channels, such as a drum kit, without affecting their relative levels. There are also 4 Mute Groups, enabling you to mute and unmute multiple channels at once via a single button.

  CQ packs in multiple recording and playback options. An integrated 24x22 USB-B audio interface enables easy multitrack recording, playback and streaming via your DAW, and an SD card slot is provided for reliable multitrack recording and playback on the go (24x22 @ 48kHz, 16x16 @ 96kHz). You can record and playback stereo files via USB key, and you can even playback from your phone via the built-in Bluetooth functionality. The CQ-18T also includes a pair of headphone outputs which can be fed separate mixes, perfect for a portable production setup.

  Built-in dual-band 2.4G/5G AC Wi-Fi with auto channel select means you can mix wirelessly from the CQ MixPad (engineer) and CQ4You (musician) apps without needing an external access point.
