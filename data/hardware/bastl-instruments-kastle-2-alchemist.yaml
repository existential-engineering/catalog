description: Compact patchable hybrid-synthesis instrument with MIDI. A
  portable, patchable synthesizer designed for discovering melodies and
  harmonies through patch-programmable sequencing across five synthesis modes.
details: |-
  The Kastle 2 Alchemist is a compact, patchable hybrid-synthesis instrument featuring five distinct synthesis modes: FILTER, FM, HYPERSINE, SUPERSAW, and GLITCHNOISE. Its patch-programmable sequencer goes beyond traditional arpeggios, allowing users to discover melodies and harmonies while remaining within scale constraints.

  The instrument features an ENV macro knob that simultaneously affects both synthesis parameters and sequencing behavior, alongside a PITCH SLIDE macro that controls pitch envelopes and portamento. A dual FX section provides delay and a combined chorus-flanger-distortion-combfilter effect chain.

  Connectivity includes USB MIDI input and output, a CV and GATE pattern generator with a syncable LFO, analog sync jacks for modular integration, and stereo audio I/O that accepts signals up to 6 Vpp with +12dB gain. The headphone output supports up to 250 Ohm impedance headphones.

  Audio processing runs at 44kHz/16-bits in stereo. The unit can be powered by 3x AA batteries for 15–18 hours of use, or via USB-C. USB-C also serves for firmware updates, sample uploads, and the web-based Alchemist Laboratory editor.
