description: >-
  Updated revision of the Analog Heat stereo analog sound processor with eight
  distortion circuits, multimode filter, and parametric EQ. MKII adds an
  enhanced OLED screen, backlit buttons, and updated encoders.
details: |-
  The Analog Heat MKII is a stereo analog sound processor featuring eight distinct analog distortion circuits, ranging from subtle saturation and enhancement to aggressive fuzz and distortion: Clean Boost, Saturation, Enhancement, Mid-Drive, Crunch, Distortion, Harmonic Fuzz, and High Gain.

  At the heart of the unit is a multimode analog filter with adjustable resonance, complemented by a two-band parametric EQ. Together with the distortion circuits, these enable deep sound shaping from gentle harmonic enrichment to radical tonal transformation.

  The MKII revision introduced an improved user interface over the original Analog Heat. An enhanced OLED screen displays more detailed information and graphics, while backlit buttons and updated encoders provide a more efficient hands-on experience.

  Modulation capabilities include an envelope follower and LFO, each capable of targeting multiple parameters simultaneously. Overbridge integration allows the unit to function as a plugin within a DAW with total recall of settings and USB audio streaming.
specs: |-
  - 8 stereo analog distortion circuits
  - Stereo multi-mode analog filter with resonance
  - 2-band parametric EQ
  - 1 envelope follower/generator
  - 1 LFO
  - 512 user preset slots
  - 48 kHz, 24-bit D/A and A/D converters
  - 128 x 64 pixel OLED display (enhanced)
  - Backlit buttons and updated encoders
  - Overbridge enabled for DAW integration
  - Class-compliant USB audio
  - Steel casing: 215 x 184 x 63 mm, ~1.5 kg
