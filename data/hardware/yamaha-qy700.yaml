description: >-
  The Yamaha QY700 is a high-end sequencer workstation released in 1996, featuring an
  integrated AWM2 synthesizer, effects processor, and a powerful 32-track MIDI sequencer.
  It provides approximately 4,000 sounds, 3,876 preset phrases, and a large backlit LCD
  for editing, serving as a self-contained alternative to computer-based MIDI studios.
details: |-
  The QY700 functions as an all-in-one sequencer workstation with a built-in Yamaha AWM2 synthesizer engine supporting XG format and General MIDI sounds. Its sequencer can store up to 110,000 notes across 32 linear tracks and 16 pattern tracks, with recording modes including Step, Punch-In, and Realtime with overdubbing. Tempo ranges from 5 to 300 BPM with a flexible Conductor Track, and timing resolution is 1/480 of a quarter note.

  The sound engine draws from 32 Mbit of Wave ROM, offering 480 normal voices and 11 drum voices with 32-note polyphony. The device includes 64 styles with 8 sections each, 3,876 preset phrases, and 99 user phrases per style. Chord memory supports over 25 chord types for real-time accompaniment generation.

  Effects processing includes 11 reverb types, 11 chorus types, delay, rotary speaker, tremolo, auto pan, phaser, distortion, overdrive, amp simulator, and multi-band EQ. The unit features a pseudo 2-octave keyboard with assignable mini pitch and modulation wheels, programmable foot switches, dual MIDI outputs, and a 3.5-inch floppy disk drive supporting SMF Format 0/1.
specs: |-
  - Polyphony: 32 notes
  - Tone Generator: AWM2 with 32 Mbit Wave ROM
  - Sound Format: XG, General MIDI
  - Voices: 480 normal, 11 drum kits
  - Sequencer Tracks: 32 linear + 16 pattern
  - Sequencer Capacity: 110,000 notes, 20 songs
  - Timing Resolution: 1/480 quarter note
  - Tempo Range: 5-300 BPM
  - Preset Phrases: 3,876
  - Styles: 64 with 8 sections each
  - Effects: 11 reverbs, 11 choruses, delay, rotary speaker, tremolo, auto pan, phaser, distortion, overdrive, amp simulator, 3-band EQ, 2-band EQ, auto wah
  - Display: 320 x 240 backlit LCD
  - Storage: 3.5-inch floppy disk drive (2DD/2HD)
  - File Compatibility: SMF Format 0/1, ESEQ
  - MIDI: IN, OUT x2
  - Controls: Pseudo 2-octave keyboard, mini pitch/mod wheels, foot switch inputs
