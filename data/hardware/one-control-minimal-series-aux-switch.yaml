description: A remote control switch box that can output signals of three
  footswitches from a single stereo terminal, useful for controlling multiple
  devices such as tap tempo on stomp boxes simultaneously.
details: |-
  Remote control switch that can be used for various equipment Capable of outputting signals of three foot switches from one stereo terminal TIP, RING, TIP+RING correspond to the Tip & Ring of a stereo plug. TIP+RING outputs the same signal as when the Tip switch and the Ring switch are pressed Two output terminals, in which the same signal can be outputted through both Example: You can synchronize the tap tempo of two Eventide stomp boxes, switch preset numbers at the same time, and combine parameters as well as utilize the active / bypass switching. Minimal Series AUX SWITCH.pdf
