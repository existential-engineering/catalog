description: 500 Series de-esser based on the legendary dbx 902 that tames
  excessive sibilance in vocals and high-frequency dense material.
details: |-
  The dbx 520 helps expertly control excessive sibilance often found in vocals and other high frequency dense material. Based upon the legendary dbx 902, the 520's unique features make it possible to achieve an exact amount of de-essing regardless of variations in signal levels, allowing you to create brilliant, crisp vocals without sibilance.

  With its modular 500 Series based design, the dbx 520 examines the differences in dB between the high frequency and full-bandwidth portions of a signal, allowing de-essing of signals which change in level by as much as 60dB. It features a Frequency Control with range from 800Hz to 8kHz, Gain Reduction Metering and a De-essing Amount Range from 0dB to 20dB.

  Control vocals, drums, percussive instruments and problematic material/reverb combinations with the dbx 520. The unit is recommended for portable, tour, and studio applications.
specs: |-
  - Based on the classic dbx 902
  - Frequency Control Range from 800Hz to 8kHz
  - Expanded Scale LED Gain Reduction Metering
  - De-essing Amount Range from 0dB to 20dB
  - In/Out Switch
  - HF Mode Switch
  - Input: Electronically balanced/unbalanced, RF filtered
  - Input Impedance: 20 kΩ balanced, 10 kΩ unbalanced
  - Max Input Level: +22 dBu
  - Output: Electronically balanced/unbalanced, RF filtered
  - Output Impedance: Balanced 30Ω, unbalanced 15Ω
  - Max Output Level: +22 dBu
  - Frequency Response: 20Hz - 20kHz, +0/-0.5dB
  - Noise: <-99 dBu, Unweighted
  - THD+Noise: <0.006% typical
  - Dynamic Range: >114 dB
  - Crossover Point: Variable 800 Hz to 8 kHz
  - Crossover Filter Type: 12 dB/octave, phase coherent
  - Maximum Attenuation: Variable 0 to 20 dB
  - Power Requirements: +/- 16V DC
  - Power Draw: 2.4 watts
  - 500 Series Compatible
  - Rack Space: 1 Slot
  - Dimensions: 5.25" x 1.5" x 6"
  - Weight: 1.3 lbs
