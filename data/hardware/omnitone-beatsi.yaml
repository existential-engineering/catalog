description: A compact 5-piece digital drum voice module inspired by classic
  modular drum synthesis, offering three switchable timbre kits and control over
  timbre, pitch, decay and level per piece.
details: |-
  Beatsi is our love letter to modular drums! Inspired by classic modular drum synthesis which uses the fundamental building blocks, Beatsi's timbres were created using the same methods, only digitally. Beatsi is not a sample player or a physical modeller, and it's meant to be that way. Beatsi's interface allows for control over individual piece Timbre, Pitch, Decay, and Level. The timbres are organized into 3 kits: an orange (acoustic) kit, a blue (low-fi) kit, and a green (alien) kit. Within these kits the timbres blend smoothly into one another allowing for seamless modulation. Beatsi has two CV modulation inputs which are assignable to any and all parameters with individual attenuversion. Beatsi may be small, but it packs a serious punch. TECHNICAL SPECS:
  - Module Size: 3U X 8HP X 25 mm Deep. - Current Draw: 160mA (180mA peak)@ 12V, 10mA@ -12V. WHAT'S IN THE BOX:
  1x Beatsi module
  1x User Manual
  1x Power cable
  1x Jumper cable
  4x Mounting screws

  Read the info doc
