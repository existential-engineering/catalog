details: |-
  The DN27 carries the Proportional-Q response curve that established Klark Teknik as the reference standard for analogue equalisation across touring, broadcast and fixed-installation sound.

  The 1/3-octave band count of 27 ISO-standard centre frequencies delivers the surgical resolution engineers need for feedback control and room correction.

  The DN27 occupies a historical position in the DN-series catalogue as the single-channel reference equaliser that preceded the dual-channel DN360, and its transparent signal path and characteristic filter behaviour remain a benchmark.

  The unit is obsolete; legacy support and documentation are accessible through Music Tribe Care.
specs: |-
  - Single channel graphic equalisation
  - 27 ISO-standard 1/3-octave centre frequencies
  - Proportional-Q filter response
