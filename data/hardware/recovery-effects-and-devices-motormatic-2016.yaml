details: |-
  This is a rare Recovery Effects Motormatic pedal from 2016, an early pedal-format version of the Motormatic Eurorack module still in production today. Very few of these were made, making it a unique and hard-to-find piece in the Motormatic lineage. Unlike the Eurorack version, this pedal uses tactile toggle switches to shift the character and placement of the effect, moving between unstable ring modulation, saturated fuzz, and unpredictable glitch textures.
