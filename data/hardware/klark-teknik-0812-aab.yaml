  - outboard
url: https://www.klarkteknik.com/en/products/0812-AAB
description: The DS 20 PRO SPLITTER 2 is a passive transformer-isolated signal
  splitter for routing balanced XLR signals to multiple discrete destinations,
  including FOH and monitor consoles, active monitor loudspeakers and broadcast
  mixers. It requires no external power and uses a custom-built MIDAS
  transformer.
details: |-
  A custom instrumentation-grade input circuit uses advanced analogue design techniques to create the ideal input impedance match, giving a low noise, ultra-linear path with a flat frequency response from 30 Hz to 45 kHz (±3 dB).

  All of the input and output connections use industry-standard XLR jacks. Dual independent Earth Lift switches are provided for both the Output A and Output B jacks, eliminating earth loops between equipment on different mains electricity supplies, and the fully transformer-isolated design is intended to hold up in large-scale production environments.

  The ultra-compact enclosure is a thick aluminium extrusion that protects the electronics, with sturdy rubber corner bumpers for road use.

  In use, the DS 20 sends identical copies of a balanced input signal to multiple discrete destinations, with the MIDAS transformer providing galvanic isolation between them.
specs: |-
  - Frequency response: 30 Hz to 45 kHz (±3 dB)
  - Passive design, requires no external power
  - Custom-built MIDAS transformer, fully transformer-isolated with galvanic isolation
  - Balanced XLR input and outputs throughout
  - Independent Earth Lift switches for Output A and Output B
  - Aluminium extrusion enclosure with rubber corner bumpers
