description: The 000-28 pairs spruce and rosewood for rich tone and beautiful
  balance in a comfortable Auditorium body. With vintage-style bracing, elegant
  appointments, and enhanced playability, it's a timeless Martin built for every
  player.
details: |-
  The Martin 000-28 is one of the most iconic models in Martin's Standard Series, pairing the comfortable 000-14 Fret Auditorium body with classic spruce and East Indian rosewood tonewoods. The combination delivers deep bass, rich overtones, and exceptional resonance suited to fingerstyle, flatpicking, and intimate strumming alike.

  As part of the 2025 Standard Series refresh, the 000-28 features a GE-scalloped Sitka spruce X-brace top, a GE Modified Low Oval neck with High-Performance Taper, and a refined bridge and heel design that improves playability while preserving Martin's signature voice. A 24.9" scale length and 1 3/4" nut width make the instrument comfortable for a wide range of players.

  Appointments include an ebony fingerboard, an ebony GE Modern Belly bridge with a drop-in saddle, and nickel open-gear tuning machines. The guitar is offered in Gloss, Gloss 1935 Sunburst, and Gloss 1933 Ambertone finishes, and is available in both right- and left-handed configurations. A molded hardshell case is included.

  Like all Standard Series instruments, the 000-28 is handcrafted in Nazareth, Pennsylvania and backed by Martin's limited lifetime warranty.
specs: |-
  - Body Size: 000-14 Fret (Auditorium)
  - Top: Solid Sitka Spruce
  - Back and Sides: Solid East Indian Rosewood
  - Bracing Pattern: GE-Scalloped X-Brace (Sitka Spruce)
  - Scale Length: 24.9"
  - Neck Material: Select Hardwood
  - Neck Shape: GE Modified Low Oval
  - Neck Taper: High-Performance Taper
  - Fingerboard Material: Ebony
  - Nut Width: 1 3/4"
  - Total Frets: 20 (14-fret join)
  - Bridge Material: Ebony (GE Modern Belly, drop-in saddle)
  - Tuning Machines: Nickel Open Gear
  - Finish: Gloss (Natural, 1935 Sunburst, 1933 Ambertone)
  - Case: Molded Hardshell
  - Electronics: None
