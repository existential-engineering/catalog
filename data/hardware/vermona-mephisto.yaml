description: >-
  The Vermona Mephisto is a genuine analog synthesizer from German manufacturer
  Vermona, featuring 6 voices of polyphony and 3 VCOs with analog oscillators.
  It was designed as a modern follow-up to Vermona's classic 1980s instruments,
  combining vintage analog character with contemporary features like an effects
  processor and updatable OS. The synthesizer was demonstrated as a prototype at
  music conventions in 2000 but was never commercially released.
details: |-
  The Mephisto was designed to blend vintage analog character with contemporary features. It incorporates six voices of polyphony and three VCOs using genuine analog oscillators without any digital sampling or emulation. The instrument features dual filtering capabilities with both highpass and lowpass resonant analog filters that can operate in series or parallel configurations.

  Modern enhancements distinguish this design from purely vintage approaches. The synthesizer includes an effects processor, an external memory card slot, and an updatable operating system. The control interface is notably comprehensive, with 37 motorized control knobs for sound design. A complete 61-note keyboard with aftertouch provides expressive performance capabilities.

  Connectivity options encompass CV/gate control alongside MIDI implementation, allowing integration with various studio setups. The instrument was planned as a limited production run of approximately 500 units but ultimately remained a prototype, with only demonstration units shown at music conventions around the year 2000.
specs: |-
  - 6 voices of polyphony
  - 3 VCOs (genuine analog oscillators)
  - White and pink noise generator
  - Highpass and lowpass resonant analog filters (series/parallel configurations)
  - Ring modulator
  - 2 ADSR envelope generators
  - 2 LFOs with attack and decay
  - Sample-and-hold capability
  - Glide
  - Effects processor
  - 100 patches plus external memory card slot
  - Updatable OS
  - 37 motorized control knobs
  - 61-note keyboard with aftertouch
  - MIDI, CV, and trigger inputs
