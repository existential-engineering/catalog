specs: |-
  - Overview
  - Specifications
  - Video/Reviews
  - The MACH100 100W (50W/50W) Stereo Pedal Amplifier is designed for the modern guitarist who wants a compact high output amplifier that fits right on the pedal board. Use the stereo 2 channel amplifier to drive two guitar cabinets with 16, 8 or 4 ohm impedance. The LINE IN jack allows you to insert a backing track into your performance. Using the PHONES output, you can monitor the amplifier output using a 3.5mm stereo cable. The LEVEL control allows the user to adjust master volume of the amplifier. The MUTE switch lets you instantly control the output of the amplifiers with the press of the switch. Step up to the next level of compact amplification today.
  - Output Power (8Ω): 100W (50W/50W) Stereo Two Channels Minimum Impedance: 4Ω Bridge Mode: No Frequency Response: 20Hz - 20kHz (-3dB) Input Sensitivity: -14dB DC Power Requirements: 24VDC,5A Pedal Dimensions: 2.9"(73mm) W x 4.9"(125mm) L x 1.7"(44mm) H Pedal Weight: 11.8oz. Power Supply Dimensions: 2.7"(70mm) W x 6.6"(168mm) L x 1.6"(41mm) H Power Supply Cable Length (supply to pedal): 44" (1117mm) Power Supply AC Input: 100-240 50/60Hz
  - "My Mach 100 pedal arrived yesterday and it is a winner! After trying an Orange Pedal Baby I was skeptical about any small or pedal style power source, but after being happy with other Carvin products since 1983, I had to give the Mach 100 a chance. Your pedal supplies plenty of power and really replicates the tone of my pre-amp extremely well. The Pedal Baby just came across flat to me, but the Mach 100 gives me the full range of tone I was hoping for. I'm glad I stumbled upon your video on You Tube and put my trust in Carvin once again." - Jon S.-TX "I auditioned the MACH100 through several different cabs, and, as anticipated, the MACH100 is primarily a loud and clean pedal, which makes it ideal as a neutral tonal center for the many effects and drives on my pedalboard. A small box with a big output, the MACH100 makes perfect sense for those looking for loud, clean and reliable power – perfect for when your amp fails on your, perfect for building a compact and portable pedalboard rig." - Guitar World Magazine "MusicRadar verdict: The MACH100 has such an extraordinary amount of power and neutral tone that it makes absolute sense for the gigging musician to carry one, either as a backstop in case of amp failure or to use as part of a fully portable pedalboard rig."- MusicRadar.com
