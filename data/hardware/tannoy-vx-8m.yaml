  - nominalDispersion: 90° conical @ -6 dB point
  - directivityFactorQ: 6.8
  - directivityIndexDI: 9.2 dB
  - sensitivity: 92 dB (1 W @ 1 m)
  - maximumSplPassive: 113 dB continuous, 119 dB peak
  - impedance: 8 Ω
  - powerHandling: 130 W continuous, 520 W peak
  - crossoverType: Passive with dynamic HF protection
  - components: 1 x 8" (200 mm) constant directivity Dual Concentric
  - connectors: 2 x Industry-standard 4-pole twist-lock speaker connectors
  - connectorPinoutPassive: Pins 1+ / 1- Input, Pins 2+ / 2- Link
  - dimensions: 389 x 281 x 316.7 mm (15.3 x 11.1 x 12.5")
  - netWeight: 8.6 kg (18.9 lbs)
  - construction: 15 mm (5/8") plywood, vented and internally braced
  - finish: Semi matt black paint
  - grille: Powder coated perforated steel
