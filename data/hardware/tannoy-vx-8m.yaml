details: |-
  The VX 8M is a full range Dual Concentric loudspeaker from TANNOY, providing a compact, yet punchy and sonically vibrant solution for small-to-medium scale performance sound reinforcement. With a controlled 90 degree dispersion for optimum coverage and forward gain, it is a powerful and versatile performer for a wide range of applications. The VX 8M has been designed to offer a greater degree of flexibility, while maintaining the power and sonic clarity users have come to expect from TANNOY's VX Series range. The asymmetrical cabinet features 40 and 60 degree side angles and includes a robust steel grille, making the VX 8M ideal for use as a dedicated floor monitor, with the 8" driver providing exceptional vocal monitoring clarity. The enclosure's integrated pole mount socket and optional vertical yoke make it a flexible choice for a range of usage and mounting options. Targeted at small and medium sized applications such as corporate events, house of worship, performance spaces and portable PA, the new VX 8M can combine with any TANNOY loudspeaker or subwoofers from the VX and VSX ranges to offer clear, uniform sound no matter what.
specs: |-
