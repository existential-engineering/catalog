details: |-
  Features
  The Silver Sonic Peg reproduces the sound of an iconic 70s tube amp with a similar name. This highly responsive bass pre-amp is adaptable to any style of play. With a dynamic tone range similar to the original amp, the switch on the side of the enclosure allows for a boost/cut of 15dB. Evidently, this pedal is perfect for any bass player. Specifications

  Bjorn's Description
  With every pick of the strings, a certain attack is added which in turn creates power and momentum for the band. And with each slap, thick sustain adds a color to the bass tone, along with an important dignified presence. In my opinion, all bass amps should respond dynamically to speed and power. Monumental vintage bass amps have a vibrant coloring, wide tolerance and a deep breath that can correspond to any genre. We captured the sound similar to the 100W "V4" tube amplifier released by Ampeg in the 1970s. Since 1969, the sound of the electric bass was changed forever. The "SVT" came into the world. The "SVT" amplifier, which has been described by many as a "legendary amp", revolutionized the bass world. To the best of my knowledge, SVT is the first bass amplifier to adopt a speaker cabinet with a higher resonance frequency than the bass sound of the bass guitar. The V series, the successor of the SVT model, also has the same characteristics. The 8 "× 10 cabinet of the V series also has a higher resonance frequency than the sound of the bass guitar. Additionally, the player will experience low distortion and phenomenal power. Sonic Silver Peg succeeded in reproducing the power of the legendary amplifier by installing the Volume control at an early stage in the circuit. In addition, like the original, Sonic Silver Peg has an active Mid knob that realizes a boost / cut of ± 15 dB centered around 800 Hz. The Tone knob controls the low pass filter which can sweep from 300 Hz to 10 kHz. And, with the 0 dB / -15 dB switch, it is also possible to switch the sound of the single input. From a clean, craftsmanship bass tone to colorful and powerful overdrive tones. Since there is a sufficient output level, it can also be outputted directly to a mixer. This pedal creates the craved universal bass tone that everyone is looking for. Try the Sonic Silver Peg for yourself. - Bjorn Juhl

