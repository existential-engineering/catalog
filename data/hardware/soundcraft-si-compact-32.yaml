description: 32-channel digital live sound console with Lexicon effects,
  drawing on the heritage of the acclaimed Si Series.
details: |-
  Drawing on the heritage of Soundcraft's acclaimed Si Series digital live sound mixers, the Si Compact packs powerful digital mixing facilities along with stunning Lexicon effects into a small footprint console. All this and more without compromising a powerful feature set. The Si Compact 32 feature 32 recallable mic pre amps plus 4 stereo returns, AES in and 64 input option slot with a capacity to combine up to 40 of these inputs to mix; each input is 'fully equipped' with compressors, gates, parametric EQ, High Pass Filter and delay. All Si Compact consoles have buses and output processing to match the versatility of the inputs; all aux/group, master and matrix buses feature a compressor, parametric EQ, graphic EQ and delay always available all of the time. To complement the channel and bus processing all Si Compact consoles offer four Stereo Lexicon FX processors providing a wealth of sounds and user adjustable parameters; alongside the 21 graphic EQs that's a total of 25 processes that can all be used at the same time in addition to all the regular channel and bus processing. Flexible onboard and expansion I/O options ensure the Si Compact integrates effortlessly with other system components; along with the 32 mic inputs there are two pairs of stereo analogue line in, AES in and out, 16 analogue line outputs, headphone monitor out and a 64x64 channel expansion card slot capable of utilising any of the Si series option cards that includes AES, AVIOM, CobraNet and MADI. The MADI card, as well as being an interface to multi-track recording systems enables linking the Si Compact to the Soundcraft/Studer stageboxes which extend the I/O power and flexibility; but all this power is nothing without control and here lies the core strength of the Si Compact; a comprehensive but 'simple to use' control surface. As you would expect from any Soundcraft digital mixer the facilities are extensive and include legendary audio quality courtesy of EMMA Lite, the same DSP platform that has helped propel the Si Series to industry standard status; this is united with all the reliability, show management, naming of channels, storing & naming cues and other features that you would expect, but what really sets Si Compact apart from all others is the simplicity of operation... Use with Soundcraft ViSi Remote to roam your venue wirelessly adjusting mixes and other audio parameters directly from an iPad!
