details: |-
  Upgrading standard features using the advancements in the custom shop, the Delos manages a balance between modernization and traditionalism. The deep tummy cut, sloped neck heel sans a neckplate, and pronounced top contour fuse contemporary improvements with an iconic design.

  The most differentiating features include the wide amount of customization. With five bridge types, an optional 22 or 24-fret setup, and a selection of pickup configurations, the Delos remains an S-style guitar that allows for an unparalleled ability to suit the player's exact needs.

  The standard build is an alder body with a white multi-layered pickguard and bolt-on construction with a radiused neck heel, a tung-oiled maple neck with a 2-way adjustable truss rod and dual carbon-fiber rods, and a GT-style inline headstock.

  Electronics are master volume and tone controls with a 5-way blade-style pickup selector feeding Kiesel Beryllium humbuckers, over a Hipshot fixed bridge or Hipshot Solo Saddle bridge at .4125 inch (10.5 mm) spacing.

  Gallery builds span 6-string (D6X, D6G) and 7-string (D7X) forms, Kiesel and Gotoh tremolos, SSS pickup layouts, black limba and alder bodies, maple, ebony and royal ebony fingerboards, and pickguards from white and black to red tortoise shell.
specs: |-
  - S-style model line, available in multiple string counts including 6-string and 7-string builds
  - Five bridge types offered, with an optional 22 or 24-fret setup and a selection of pickup configurations
  - Construction: bolt-on with radiused neck heel, no neckplate
  - Body: alder
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: ebony with 14 inch radius
  - Frets: 24 stainless steel medium-jumbo, .103 inch wide x .048 inch tall
  - Scale length: 25.5 inch
  - Pickups: Kiesel Beryllium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Bridge: Hipshot fixed bridge, .4125 inch (10.5 mm) spacing, or Hipshot Solo Saddle bridge, .4125 inch (10.5 mm) spacing; gallery builds also show Kiesel and Gotoh tremolos
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: GT-style inline headstock
  - Pickguard: white multi-layered
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Neck width: 1.69 inch or 1.90 inch wide at the nut, 0.78 to 0.82 inch thick at the 1st fret, 0.88 to 0.90 inch thick at the 12th fret
  - Body dimensions: 39.5 inch long, 1.65 inch thick, 12.5 inch wide, or 40.15 inch long, 1.68 inch thick, 12.75 inch wide
  - Weight: 8 lbs or 8.12 lbs depending on configuration
  - Strings: Elixir Nanoweb 1046E
  - A headless version is offered separately as the Headless Delos (HD)
