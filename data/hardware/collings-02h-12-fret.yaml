description: The 02H 12-Fret is a small-body single-0 acoustic guitar that
  delivers a balanced and full tone with slightly more bass and overall volume
  than its 14-fret counterpart. Built with a Sitka spruce top, East Indian
  rosewood back and sides, and a pre-war scalloped X-brace pattern, it excels as
  both a fingerstyle and strumming instrument. Its compact dimensions make it a
  versatile choice for recording, with shimmery highs, punchy midrange, and a
  tight, clean low end.
details: |-
  The 02H 12-Fret is a professional-grade small-body acoustic guitar in the single-0 body style. The 12-fret neck joint placement shifts the bridge toward the center of the body, contributing to a warmer, fuller tone with enhanced bass response compared to the 14-fret configuration. The guitar features a Sitka spruce top with East Indian rosewood back and sides, a Honduran mahogany neck, and an ebony fingerboard and pyramid-style bridge. Abalone diamond and square inlays adorn the fingerboard, while ivoroid binding with herringbone purfling and a tortoise pickguard give the instrument a classic aesthetic. The modified V neck profile and 24 7/8" scale length suit both fingerpicking and flatpicking styles.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Bridge: Ebony pyramid-style
  - Nut/Saddle: Bone
  - Inlays: Abalone diamond & square
  - Scale Length: 24 7/8"
  - String Spacing: 2 5/16"
  - Frets: Medium 18% nickel-silver
  - Tuners: Nickel Waverly
  - Truss Rod: Fully adjustable
  - Neck Profile: Modified V
  - Brace Pattern: Pre-war scalloped X-brace
  - Neck Joint: Mortise & tenon hybrid
  - Body Binding: Ivoroid with herringbone purfling
  - Rosette: iv/tort/iv & b/w purflings
  - Backstrip: 2-style (Zipper)
  - Peghead: Stained exotic ebony with MOP Collings logo
  - Pickguard: Tortoise
  - Bridge Pins/End Pin: Ebony with MOP dot
  - Body Width: 13 3/4"
  - Body Length: 19"
  - Body Depth: 4"
  - Total Length: 37 3/4"
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Strings: D'Addario EJ-16 (.012"-.053")
