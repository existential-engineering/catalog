description: Vocal effects processor carrying reverb, delay, doubling,
  modulation, EQ, compression and de-essing voiced for the human voice, with up
  to two channels of independent processing and MIDI patch changes.
details: |-
  Voice Rack FX descends from VoiceLive Rack and gathers reverb, delay, doubling, modulation, EQ, compression and de-essing into one vocal chain, using the algorithms TC-Helicon built its reputation on and voicing them specifically for the human voice.

  It can sit on a lead vocal as an insert chain alongside a DAW over USB, feed a monitor path so the singer hears effects in their headphones, or run live as a vocal effects processor that front of house never has to touch. Up to two channels of independent processing mean a lead and a backing vocal can be treated at once, and MIDI control gives hands-free patch changes on stage.

  The signal path is built around clean preamps, conservative gain staging and converters chosen to keep a real vocal intact.
specs: |-
  - 19-inch rack format
  - Up to two channels of independent processing
  - Reverb, delay, doubling, modulation, EQ, compression and de-essing
  - XLR and 1/4-inch analog I/O, S/PDIF digital I/O, MIDI and USB on the rear panel
  - MIDI control for hands-free patch changes
  - USB connection for use as a DAW insert chain
