description: Flagship planar magnetic headphones featuring Nano-Scale Uniforce
  diaphragms and Double Fluxor magnet arrays for unprecedented detail and
  immersion.
details: |-
  Representing more than 40 years of research and development in planar magnetic technology, the LCD-4 stands in a class of its own. The product features Nano-Scale Uniforce diaphragms and Double Fluxor magnet arrays designed for an unprecedented level of detail and immersion.

  The Double Fluxor Magnetic Array is described as the most powerful open magnetic circuit ever created in a headphone, providing exceptional driver control and dynamics.

  Nano-scale diaphragms — thinner than a red blood cell — provide fast and accurate transient responses, combined with Fluxor magnet arrays and Uniforce voice coils for reference-grade resolution.

  This is a legacy product and no longer available for sale; current replacements include the LCD-5 and LCD-4z.
specs: |-
  - Style: Over-ear, open-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Double Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Nano-Scale Uniforce
  - Transducer size: 106 mm
  - Maximum power handling: 5W RMS
  - Maximum SPL: >130dB
  - Frequency response: 5Hz - 50kHz
  - THD: <0.1% @ 100dB
  - Impedance: 200 ohms
  - Sensitivity: 97 dB/1mW (at Drum Reference Point)
  - Minimum power requirement: >100mW
  - Recommended power level: >500mW
  - Cable: 1.9m, 1/4 inch to dual 4-pin mini-XLR Premium LCD cable
  - Weight: 690g
