description: The ABM 210H EVO IV packs 300 watts of wide, punchy bass into a
  portable 2x10" design. Built from rugged birch ply with buffalo leather cloth,
  reinforced corners and a steel grille, it is made to take the knocks of the
  road. Two custom Blue Line 10" speakers deliver fat lows, clear mids and tight
  definition, while front porting ensures maximum projection and a switchable
  horn tweeter (Hi/Low/Off) gives total control of the top end.
details: |-
  Ashdown ABM EVO IV compact bass cabinet. Two custom Blue Line 10" speakers, 300 watts. Rugged birch ply enclosure with buffalo leather cloth, reinforced corners and a steel grille. Front-ported for maximum projection. Switchable horn tweeter with Hi / Low / Off settings. Offered in metal grille, silver cloth and red cloth finishes.
specs: |-
