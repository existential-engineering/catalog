description: Compact-sized two-way bass-reflex passive speakers embodying low volume audio. High-quality sound speaker units are mounted in a specially designed wooden enclosure. This 2-way speaker system realizes high sound quality even at low volume and embodies high-quality "low volume audio" that creates a relaxing time in private spaces.
details: |-
  High sound quality even at low volume. Compact-sized two-way bass-reflex speakers embodying low volume audio.

  High-quality sound speaker units are mounted in a specially designed wooden enclosure. This 2-way speaker system realizes high sound quality even at low volume and embodies high-quality low volume audio that creates a relaxing time in private spaces. It is shown in use combined with the PC200USB DAC/amplifier.

  A wooden 2-way rear bass-reflex enclosure in subdued colors matches the interior. A UFLC soft dome diaphragm is used for the tweeter; this lightweight diaphragm has high internal loss and its frequency response extends to 40 kHz, making it a high-resolution specification.

  The woofer cone paper is made of wood pulp with moderate rigidity and internal loss. The edge is made of urethane foam to provide sufficient bass characteristics for an 8 cm diameter woofer.
specs: |-
  - Type: 2-way bass reflex
  - Crossover frequency: 4.4 kHz
  - Units: 8 cm cone woofer, 20 mm soft dome tweeter
  - Maximum allowable input: 24 W
  - Impedance: 8 ohm
  - Frequency response: 150 Hz to 40 kHz
  - Sound pressure level: 80 dB/W (1 m)
  - External dimensions: 100 (W) x 195 (H) x 130 (D, including terminal projection) mm per piece
  - Weight: 1.1 kg per piece
  - Accessories: speaker cable (1.5 m) x 2
  - Passive design, no power connection
