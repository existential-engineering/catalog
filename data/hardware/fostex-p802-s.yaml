description: Compact-sized two-way bass-reflex passive speakers embodying low
  volume audio. High-quality sound speaker units are mounted in a specially
  designed wooden enclosure. This 2-way speaker system realizes high sound
  quality even at low volume and embodies high-quality "low volume audio" that
  creates a relaxing time in private spaces.
details: |-
  Tagline: High sound quality even at low volume.

  Features:
  - Wooden 2-way rear bass-reflex enclosure with subdued colors to match the interior.
  - UFLC soft dome diaphragm is used for the tweeter. This lightweight diaphragm has high internal loss, and its frequency response is sufficiently extended to the high frequency range of 40kHz, making it a high-resolution specification.
