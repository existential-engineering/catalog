details: |-
  Scratch style 2-channel DJ mixer for Serato DJ Pro.

  Thanks to the built-in soundcard, this 2-channel mixer is Serato DJ Pro enabled as soon as you unpack it. Featuring a highly durable Magvel crossfader, inherited from the DJM-900NXS2 , the DJM-S3 delivers a smooth and accurate response. The scratch-friendly layout creates more room for you to be creative in the booth. No need to go easy, the DJM-S3 is built to withstand intense performances. And to bring even more creativity to your performances, you can connect the DDJ-SP1 controller and use its large Performance Pads for tactile control of many Serato DJ Pro features, including its FX.

  Built-in sound card. Connect your PC/Mac with a single USB cable to use Serato DJ Pro and mix and scratch your digital files via turntables and the Serato DVS Control Vinyl or compatible multiplayers.

  Magvel crossfader. Scratching becomes effortless with the highly responsive Magvel Crossfader. Sharing the same quality as the DJM-900NXS2 , the fader is accurate, smooth and durable for more than 10 million movements.

  Independent channel filters. Turn the filter knob on each channel to create unique textures. By twisting the parameter knob you can adjust resonance and add tension to your performances.

  High quality sound. Hear the true, high-quality sound of your tracks whether you’re playing from digital or analogue sound sources thanks to the mixer’s dithering technology.
