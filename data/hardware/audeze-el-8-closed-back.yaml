details: |-
  The EL-8 combines planar magnetic drivers with portable design. Features include planar magnetic drivers for better dynamics and frequency response, premium faux leather for style and durability, and sleek contemporary design by DesignWorksUSA, a BMW group company.

  Acoustic engineering emphasizes accuracy through proprietary technologies. The diaphragm design uses space-age materials in a near weightless diaphragm that's three times larger than typical headphones, enabling fast response times, dramatically reduced distortion, higher resolution and improved imaging.

  Technology foundation rests on three patented systems: Uniforce voice-coil technology delivers a uniform driving force across the entire diaphragm for near zero distortion; Fluxor Magnet Arrays focus the magnetic flux nearly doubling the power; and Fazor Elements guide internal headphone soundwaves to avoid resonance.

  Construction emphasizes durability and comfort. The sturdy aluminum frame is built to last a lifetime, the earpads and headband are handcrafted with luxurious faux leather, and the headband fits everyone and contributes to superb long-term comfort.

  This is a legacy product and no longer available for sale.
