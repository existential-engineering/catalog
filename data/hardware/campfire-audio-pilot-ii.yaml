details: |-
  Upgrade your mobile audio experience with the ALO Audio Pilot II, an advanced Digital-to-Analog Converter that takes portable hi-fi to the next level. Use with standard USB-C or included lightning converter. Pilot II delivers elevated sonic performance, featuring the ESS Sabre 9281AC Pro DAC for unrivaled clarity, depth, and detail. A new 4.4mm balanced output and a boost toggle button for variable output further refine your listening experience. Features:

  Aluminum Enclosure

  USB-C Termination

  4.4mm Balanced Jack

  LED Indicator

  Blue = idle or SD audio <= 48kHz

  Red = HD audio > 48kHz

  Magenta = MQA content
