details: |-
  A professional pre-polarized condenser microphone, the ADX60 is designed for stage, studio, and broadcast applications. The ADX60 is highly sensitive and able to handle distance and area miking for various applications including conferences, plays, theatre, and acoustic instruments.

  The ADX60 has a uniformly controlled hemicardioid polar pattern and is designed to capture a designated area. This microphone requires a 9 – 52 V phantom power for operation and is equipped with a 25′ cable and phantom power adapter.

  The ADX60 boundary condenser microphone is easy to position, durable, and is manufactured with a high-performance 12 mm capsule, steel mesh grille, and space-saving mini-XLR connector.
specs: |-
  - Polar pattern: Hemicardioid
  - Capsule: 12 mm
  - Cable: 25' with mini-XLRf (TA3F) connector
  - Phantom power: 9-52 V required (adapter included)
