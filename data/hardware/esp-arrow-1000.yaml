description: Designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs, the LTD Deluxe Arrow-1000 is being made available in a brilliant Pearl White finish. Features neck-thru construction, beveled V-shaped body, reverse headstock with matching finish, and black binding on neck and headstock.
details: |-
  Designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs, the LTD Deluxe Arrow-1000 is being made available in a brilliant Pearl White finish. With its beveled body and completely unique V shape, this Arrow-1000 features neck-thru-body construction at 25.5” scale with a mahogany body. Its extra-thin u-shaped three-piece maple neck has a compound radius for improved playing comfort, and features a reverse headstock with matching finish, Macassar ebony fingerboard with triangular white pearloid inlays, and 24 extra-jumbo stainless steel frets. Contrasting black binding on the neck and headstock gives it a powerfully defined aesthetic. Its components include a Floyd Rose 1000SE double-locking tremolo bridge with stainless steel screws, precise Grover tuners. The Arrow-1000 Pearl White includes a set of direct-mount Fishman Fluence Modern 3-Voice Humbucker active pickups (ceramic in the bridge and alnico in the neck), with push-pull control to select voicings and brushed stainless covers that complement its chrome hardware.
specs: |-
  - Construction: Neck-Thru
  - Scale: 25.5"
  - Body: Mahogany
  - Neck: 3Pc Maple
  - Fingerboard: Macassar Ebony
  - Fingerboard Radius: 300-400mm Compound
  - Finish: Pearl White
  - Nut Width: 42mm
  - Nut Type: Locking
  - Neck Contour: Extra Thin U
  - Frets/Type: 24 XJ Stainless Steel
  - Hardware Color: Chrome
  - Strap Button: Standard
  - Tuners: Grover
  - Bridge: Floyd Rose 1000SE
  - Bridge PU: Fishman Fluence Modern 3-Voice Humbucker Ceramic Brushed Stainless Direct-Mount *(Pull Volume for Voice 3)
  - Neck PU: Fishman Fluence Modern 3-Voice Humbucker Alnico Brushed Stainless Direct-Mount *(Pull Volume for Voice 3)
  - Electronics Layout: Master Volume(Push/Pull)/Toggle Switch
  - Strings: D'Addario XL120 (.009/.011/.016/.024/.032/.042)
  - Case: V-ALEXI GUITAR FORM FIT CASE
  - Case Included: N
