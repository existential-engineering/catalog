description: Instantly recognisable handwired 4x12" straight-fronted guitar speaker cabinet, designed as the matching base half of the 1959HW Handwired full stack. Loaded with four 12" Celestion G12H-30 speakers and handling 120W into a 15Ω mono load via a single 1/4" jack input, the 1960BHW recreates the cabinet voicing of the late-1960s Marshall stacks alongside the 1959HW head, finished in classic Black and Gold.
details: |-
  Experience the nostalgia of the superbly vintage 120W 1960 handwired cabinets. These cabinets are specifically designed to be used with the lovingly constructed 1959HW amplifier. Packed with four 12-inch Celestion G12H 30 speakers, which deliver impressive bass response, a powerful mid-range, and breathtaking highs, perfectly capturing the essence of the iconic 60s sound.

  This cabinet is also available as an angled cab, allowing you to create your own Marshall stack.

  Handwired in the Marshall UK factory, it carries the "salt 'n' pepper" grill cloth and the classic Marshall sound.

  Designed and engineered in UK. Made in UK.
