description: The I-35 is a semi-hollow electric guitar that pairs a hollowed-out
  mahogany body with a maple center block for a tonal response that is complex
  and quick with an airy character. It is a modern tribute to the heritage of
  the double-cutaway semi-hollow electric guitar, featuring Lollar Low Wind
  Imperial Humbuckers and a high-gloss nitrocellulose lacquer finish.
details: |-
  The Collings I-35 features a semi-hollow Honduran mahogany body with a premium flamed maple top and a maple center block, delivering a resonant yet feedback-resistant character. The neck is also Honduran mahogany, joined via an extra-long mortise and tenon joint, topped with a rosewood fingerboard with mother-of-pearl long dot inlays. Electronics consist of Lollar Low Wind Imperial Humbuckers wired in 50s style with CTS 500K pots and Jupiter Vintage Yellow caps. Hardware includes a Kluson ABR-1 bridge, Kluson stop tailpiece, and nickel Gotoh tuners with Collings logo. The guitar ships with a deluxe hardshell case. Finish options span a wide range of nitrocellulose lacquer colors, and a variety of custom options are available through authorized dealers.
specs: |-
  - Body: Semi-hollow Honduran mahogany with maple center block
  - Top: Premium flamed maple
  - Body Width: 15"
  - Body Length: 17 5/8"
  - Body Depth: 1 5/8"
  - Total Length: 40"
  - Neck: Honduran mahogany
  - Neck Joint: Extra long mortise & tenon
  - Fingerboard: Rosewood
  - Fingerboard Radius: 12"
  - Scale Length: 24 7/8"
  - Nut Width: 1 11/16"
  - Frets: Medium 18% nickel-silver
  - Inlays: Mother-of-pearl long dots (5mm non-tapered)
  - Binding: Non-grained ivoroid (body and fingerboard)
  - F-holes: Unbound
  - Pickups: Lollar Low Wind Imperial Humbuckers
  - Wiring: 50s style
  - Pots: CTS 500K
  - Capacitors: Jupiter Vintage Yellow
  - Bridge: Kluson ABR-1 (nickel-plated zinc)
  - Tailpiece: Kluson Stop Tailpiece
  - Tuners: Nickel Gotoh with Collings logo
  - Knobs: Amber or black top hat
  - Pickup Rings: Cream or black
  - Pickguard: Black/Cream/Black
  - Finish: High gloss nitrocellulose lacquer
  - Strings: D'Addario NYXL1149 (.011"-.049")
  - Case: Deluxe hardshell
