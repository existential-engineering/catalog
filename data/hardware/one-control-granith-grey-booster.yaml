details: |-
  Features The GRANITH GREY BOOSTER allows a high-quality boost of up to +15dB with minimized switching noise due to BJF engineered circuitry. This booster is able to attain the equivalent S/N ratio of a high-end amplifier. In order for this to happen, the circuitry was created to fit the frequency range of an electric guitar, which lowers some overtones that coud otherwise be present with other boosters. Specifications Input impedance: 500K Output impedance: 2K Maximum gain:+ 15dB Drive voltage: 8.8V～9.6V Current consumption: 1mA S/N ratio: 115dB Total harmonic distortion rate: 0.006% (1 kHz) Size:39Wx100Dx31H mm (excluding protruding parts) 　　47Wx100Dx48H mm (including protruding parts) Weight: Approx. 140 grams True-Bypass Switching High Quality Aluminum Enclosure Power: 9V Battery or Standard DC Power Supply Bjorn's Description A clean booster is simply a pedal that amplifies signals. The concept is simple, however due to the various uses for this type of pedal, it is a complicated feat. What kind of booster is necessary to maximize performance in any situation? We set out on a quest to find the answer. Granite is a rock whose name originated from the Latin word Granum, which means "grain seed." It was thus named Granith with the hope that this product would send out strong roots into the world. A booster is a pedal that amplifies incoming signals. If the incoming signal has noise in it, the noise is also amplified. This is an undeniable fact. However, you don't have to compromise by thinking that this is unavoidable when you use a booster. Try a truly noiseless booster. A world you've never experienced will unfold before you. The One Control GRANITH GREY BOOSTER is thoroughly dedicated to low noise. From the circuit design stage, we tried to eliminate noise up to the limit of possibility. After repeated consultations between BJF and One Control, the booster now has a completely newly-designed circuit by BJF. It is full of BJF's unique ideas that are unlike conventional circuits. The case is made of high quality cut-out aluminum to protect the precious sound signals from inside and outside noises. It is also much more durable than die cast cases. As a result, the GRANITH GREY BOOSTER went beyond the capabilities of a compact pedal and attained an S/N ratio equivalent to a high-end vacuum tube audio amp. Relevant and Easy-to-Handle Boost The One Control GRANITH GREY BOOSTER allows a boost of +15dB. You might think this is nothing extraordinary but we went through a number of tests to ensure this was sufficient. After repeated tests at different decibel levels, it turned out that securing a +15dB boost was sufficient for various scenarios, all while maintaining the natural usability of any equipment with any connection. If you turn the level knob down to the minimum, you can mute the sound and which allows you to set the level cut and unity gain. Pure Tone & Texture The frequency characteristic of the GRANITH GREY BOOSTER is unique. If you turn up the output without changing the frequency characteristic of incoming signals, you won't be able to ignore the unnatural 'feeling' it creates. This discomfort is caused due to the difference between the frequency characteristic at the original output level and the actual output level. The GRANITH GREY BOOSTER creates the necessary frequency characteristics while the signal passes through the circuit. By doing so, the GRANITH GREY BOOSTER realizes a pure and high quality boost sound without compressing the sound or narrowing the dynamic range. Suitable For Any Guitar, Bass or Equipment The One Control GRANITH GREY BOOSTER secured the 500kΩ input impedance to support any guitar and bass. You can use it by directly connecting any guitars and basses. From single to hum-bucking or from active to passive, The GRANITH GREY BOOSTER does it all. Output impedance was kept low up to 2kΩ at most, which fits almost all effec pedals input and effect loop return on the amp. Awakening Amp Potential The One Control GRANITH GREY BOOSTER can be used with any guitar amp. It not only pushes tube amps but it is also suitable for boosting drive channels inside transistor amps. It can also be used just like other amps for analog circuits even when used with a number of digital amps. If you are using a high-gain amp, connecting the GRANITH GREY BOOSTER to the effect loop will allow the volume to be boosted with power amp distortion all while taking advantage of strong preamp distortion. The GRANITH GREY BOOSTER will maximize the potential of any amp to awaken its true capability. Pedal Board Friendly One Control introduced an original compact cut-out aluminum case for the Granith Grey Booster. The size allows you to place it on any pedal board. Just like all BJF Series FX pedals, it can be powered by a 9V battery. Four PCBs inside the pedal secure the space to hold the battery while preserving the standard mini size. The power consumption is kept below 1mA to allow longer battery power. The One Control GRANITH GREY BOOSTER works with center negative 9VDC adapters (EPA-2000 is recommended) or 006P 9V batteries. When batteries need to be replaced the LED lights turn off and the sound starts to be distorted. The drive voltage of the GRANITH GREY BOOSTER is set at higher than the normal level (8.8-9.6V) to realize high quality sound. So the batteries need to be replaced before they get down to zero. Please use new batteries when you replace them. Different Uses For A Clean Booster ・Gain Booster Use it to boost your gain before or after any effect. If you connect a spatial effect after the booster, the input is amplified and sometimes creates its own unique effect. ・Master Volume If you connect the booster at the end of your signal chain on your pedal board, you can adjust the volume while maintaining the signal created by other effects. You can adjust the booster according to your playing style or role, like switching between the backing and lead. ・Gain Control for a Tube Amp If you connect a clean booster before the tube amp input to adjust the volume boost setting, you can increase the strength of the natural distortion. On the other hand, if you distort the amp first and set the clean booster to lower the volume when it's turned on, you can decrease the gain on the amp when it's turned on. ・Volume Control for Tube Amps If you set a clean booster in the amp's effect loop, you can adjust the output level of the signal sent to the power amp while preserving the preamp distortion. Set it to increase the volume and you will be able to give your signal a power amp distortion along with a higher volume. Set it to a lower volume and you can use it like an attenuator. I am confident that this is the only clean booster you'll ever need. - Bjorn Juhl

