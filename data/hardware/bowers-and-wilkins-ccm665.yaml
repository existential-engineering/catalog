details: |-
  CCM665 is a high-performance ceiling speaker that’s simplicity itself to install and use. It features a two-way design, with a 150mm (6in) woven glass fibre cone bass/midrange driver and a soft dome tweeter in a neat circular ceiling mount chassis. A perfect speaker for those indulgent extra locations – the bathroom, the kitchen – that define the real luxury of custom installed audio.

  Incorporating QuickDogs and plug and play functionality, it is quick and easy to install. The CCM6 Series of ceiling mount speakers is designed to offer easy installation and high quality audio reproduction for discrete custom install applications.

  CCM6 Series ceiling mount speakers comprise a baffle carrying the speaker drivers and crossover, a mounting frame (with integrated bezel), and a magnetically secured grille. The frame is connected via side mounted terminals to the speaker cables, with the baffle connecting automatically as it is inserted in the frame.

  CCM665 requires a ceiling aperture diameter of 202mm (8in) and clear depth behind the sheetrock (plasterboard) of 140mm (5.51in). A square grille is optionally available for CCM6 Series speakers, and pre-mount kits and back boxes are available for new build projects.
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x ø25mm (1in) soft dome tweeter
  - Drive units: 1x ø150mm (6in) black glassfibre cone bass/midrange
  - Frequency range (-6dB): 45Hz – 35kHz
  - Recommended amplifier power: 25 – 130W
  - Sensitivity SPL (2.83V, 1m): 87dB
  - Nominal impedance: 8Ω (minimum 4.5Ω)
  - Frame diameter: 240mm (9.5in)
  - Cut-out diameter: 202mm (8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C6
  - Back box: 6C
  - Ceiling aperture diameter: 202mm (8in)
  - Required clear depth behind plasterboard: 140mm (5.51in)
  - Finish: White
