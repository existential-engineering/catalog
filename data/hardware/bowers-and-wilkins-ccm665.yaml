details: |-
  CCM665 is a two-way passive in-ceiling speaker in the Bowers & Wilkins Performance Series, pairing a 25mm (1in) soft dome tweeter with a 150mm (6in) black glass fibre cone bass/midrange driver in a circular ceiling mount chassis.

  It is a passive loudspeaker driven from an external amplifier: 8 ohms nominal with a 4.5 ohm minimum, 87dB sensitivity measured at 2.83V and 1m, and a recommended amplifier power of 25W to 130W. The information sheet names no on-board amplifier, mains inlet or line-level input.

  Bowers & Wilkins positions CCM665 as the simple end of the range: the information sheet's pitch is that it is 'simplicity itself to install and use', using the QuickDogs fixing system and plug-and-play wiring, and it is aimed at the extra rooms of a custom install, the bathroom and the kitchen, rather than at a critical listening position.

  Unlike the CCM682, CCM683 and CCM684 in the same series, the CCM665 information sheet describes no pivoting tweeter housing and no three-position EQ switch, so no such control is claimed here.

  Installation figures are given for a conventional ceiling: a 240mm (9.5in) frame over a 202mm (8in) cut-out, 133mm (5.2in) of depth needed behind the surface, and a 4mm (0.2in) protrusion once fitted. The matching pre-mount kit is the C6 and the matching back box the 6C. The speaker is offered in White only.
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x 25mm (1in) soft dome tweeter, 1x 150mm (6in) black glass fibre cone bass/midrange driver
  - Frequency range (-6dB): 45Hz to 35kHz
  - Recommended amplifier power: 25W to 130W
  - Sensitivity SPL: 87dB (2.83V, 1m)
  - Nominal impedance: 8 ohms (4.5 ohms minimum)
  - Frame diameter: 240mm (9.5in)
  - Cut-out diameter: 202mm (8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C6
  - Back box: 6C
  - QuickDogs fixing system with plug-and-play wiring
  - Passive: no on-board amplifier, no mains inlet, driven from an external amplifier
  - Finish: White
