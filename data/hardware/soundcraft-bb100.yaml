details: |-
  Designed to satisfy your need for a more cost effective, small format audio console for Production and On-Air applications BB100 is packed with all the features you needed, all the performance you expect and all the reliability you demand. BB100 is available in configurations from 10 to 32 input channels, with four stereo or eight mono subgroups, and offering fully balanced input and output connections, the BB100 features four internal mix minus feeds as standard and is easily configurable for a variety of custom options through internal factory-set links. For product availability and pricing please contact your local dealer. Main Features
