description: A 16-channel, 24-bit, 192kHz analog-to-digital converter designed
  to preserve audio fidelity, featuring transformerless balanced analog inputs
  and routable digital outputs across multiple formats.
details: |-
  The Benchmark ADC16 is a 16-channel, 24-bit analog-to-digital converter capable of operating at sample rates up to 192 kHz. It features transformerless balanced analog inputs with individual 20 dB gain trim controls per channel, allowing precise level matching from a wide range of sources.

  The ADC16 provides three independent output groups: balanced AES/EBU, coaxial AES, and optical outputs configurable for SPDIF or ADAT modes. This flexibility makes it suitable for routing audio to multiple destinations simultaneously without additional conversion.

  At the heart of the ADC16 is Benchmark's UltraLockDDS clock system, which employs a temperature-compensated crystal master oscillator and 500 MHz Direct Digital Synthesis generating a 3072x word clock. This architecture delivers jitter attenuation below 135 dB and frequency accuracy within ±2 PPM, covering an operational range of 28 kHz to 200 kHz.

  The front panel includes a 16-channel meter bridge with 9-segment LED meters per channel for real-time monitoring of all input signals. An optional Firewire interface card was available for direct DAW integration on Windows and Mac (up to OS 10.6).
specs: |-
  - 16 channels of analog input, transformerless balanced
  - 24-bit resolution, up to 192 kHz sample rate
  - SNR: 121 dB (A-weighted, 0 dBFS)
  - SNR: 119 dB (unweighted)
  - THD+N @ 1 kHz, -1 dBFS: -102 dBFS
  - THD+N @ 1 kHz, -3 dBFS: -107 dBFS
  - Frequency response: 2 Hz to 94 kHz (-3 dB) at 192 kHz
  - Frequency response: ±0.02 dB from 20 Hz to 20 kHz
  - Input headroom (0 dB gain): 28 dBu
  - Individual 20 dB gain trim controls per channel
  - Three digital output groups: balanced AES/EBU (8x XLR), coaxial AES (8x BNC), optical ADAT (2x Toslink)
  - UltraLockDDS clock system with <135 dB jitter attenuation
  - Master oscillator: temperature-compensated crystal, ±2 PPM accuracy
  - 500 MHz Direct Digital Synthesis, 3072x word clock
  - Clock frequency range: 28 kHz to 200 kHz
  - 16-channel meter bridge, 9-segment LEDs per channel
  - Optional Firewire card for DAW integration (Windows; Mac up to OS 10.6)
