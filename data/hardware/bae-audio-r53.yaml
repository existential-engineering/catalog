details: |-
  The R53 is a 3-channel horizontal 500 Series rack designed and built by BAE Audio to house standard 500-series modules.

  The chassis is constructed from strong steel — not aluminum — for increased rigidity and shielding. Wiring to individual connectors uses shielded cables rather than PCBs, making the unit fully serviceable in the field.

  Neutrik XLR connectors are used for all inputs and outputs. A linking option allows modules to be chained together to form a complete channel strip signal path.
specs: |-
  - Channels: 3
  - Chassis: Steel
  - Connectors: Neutrik XLR
  - Wiring: Shielded wires on individual connectors (no PCBs)
  - Linking: Channel strip link option
