description: |-
  The Ci200QL is a rectangular in-ceiling/in-wall speaker featuring KEF's
  patented Uni-Q driver array with an Ultra Thin Bezel (UTB) design. The
  Uni-Q driver places the tweeter at the acoustic centre of the bass/midrange
  cone, enabling both to function as a single point source with wide sound
  dispersion.
specs: |-
  - Nominal Impedance: 8 Ohm
  - Sensitivity: 90dB (2.83V/1m)
  - Crossover Frequency: 2.5kHz
  - Frequency Response: 35Hz – 34kHz (±6dB, open-backed)
  - Drive Units: 200mm (8") woofer LF; 25mm (1") Uni-Q tweeter HF
  - Recommended Amplifier Power: 10–150W
  - External Dimensions: 369 × 273 × 106mm
  - Cutout Dimensions: 334 × 238mm
  - Mounting Depth: 99.8mm
  - Weight: 2.6kg
