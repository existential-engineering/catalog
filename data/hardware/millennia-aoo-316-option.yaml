description: The AOO 316 Option is a factory-installed card that adds eight
  channels of balanced HV-3 analog output stages to the HV-316 microphone
  preamplifier. Each output takes a direct balanced feed from the analog gain
  stage of its preamp channel, so no converter sits in the analog output path.
details: |-
  The AOO Analog Output Option card provides eight channels of HV-3 balanced output stages, effectively identical to those in the HV-3C and HV-3D preamplifiers. It is a factory-installed option for the HV-316 and draws its power from the host unit.

  Each output is a direct balanced signal feed from the analog gain stage of the matching HV-316 microphone preamp, with no ADC or DAC in the analog output path. The eight outputs are terminated on a single 25-pin sub-D connector using the AES59 and Tascam balanced format standard.
specs: |-
  - Channels: 8 balanced analog outputs
  - Frequency Response (+0 / -3 dB): sub 8 Hz to beyond 200 kHz
  - Noise (60 dBu gain, 10 Hz to 30 kHz, inputs common): -130 dBu EIN
  - Total Harmonic Distortion + Noise (35 dB gain, 10 Hz to 20 kHz bandwidth, 0 dBFS out): < .005%, typically < .001%
  - Intermodulation Distortion (50 Hz and 7 kHz, 35 dB gain, 0 dBFS): < .0009%
  - Phase Response (35 dB gain, 50 Hz to 20 kHz bandwidth, 0 dBFS): < 2 degrees deviation
  - Slew Rate (35 dB gain): > 25 Volts per microsecond
  - Maximum Output Level (20 Hz to 40 kHz): +22 dBu
  - Output Impedance: 24.3 Ohms
  - Output Connector: 25-pin sub-D, AES59 and Tascam balanced format
  - Installation: Factory-installed in the HV-316, powered by the host unit
