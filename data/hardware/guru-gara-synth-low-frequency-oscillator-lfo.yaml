details: |-
  Eurorack LFO (Low Frequency Oscillator)

  The Eurorack LFO PCB and Front Panel Kit is a DIY low frequency oscillator designed for Eurorack modular systems. Built around a classic OTA-based core, this LFO delivers stable, musical modulation and is suitable for a wide range of modulation tasks in modular synth patches. Key Features

  Modulation & Performance

  The Eurorack LFO provides flexible modulation ranging from sharp, rhythmic pulses to smooth, evolving movement. Voltage control over the LFO rate allows for dynamic modulation changes, while the Ping input resets the oscillation on the falling edge of a trigger, enabling a wide range of creative, trigger-based modulation techniques and rhythm-related patching. DIY Build & Front Panel

  This DIY Eurorack LFO PCB and front panel kit includes a high-quality PCB and a durable front panel made from PCB material, screen printed by hand for a distinctive finish. The kit format allows builders to assemble a unique and expressive modulation source that integrates seamlessly into any Eurorack modular synth system. Technical Specifications

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category. Skiff Friendly Module

  Video Demo

  Creative ways to use LFO

  LFO can be seen in this video controlling Stereo Space on the Riot ST VCF.
