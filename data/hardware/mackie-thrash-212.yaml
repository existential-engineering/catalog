description: Mackie Thrash 1300W loudspeakers are all about no frills, raw
  power, and reliability without sacrificing sound quality.
details: |-
  For those that want to plug in, crank it up, and get down to business, Thrash212 is the loudspeaker for you. With flexible inputs, lightweight and durable construction, and a wall-shaking 1300W of power, Thrash212 has what it takes to keep up with every gig and rehearsal.

  If you are a band that is ready to gig or even upgrade your rehearsal space, Thrash is ready to make it happen. Thrash is voiced to make your voice and instruments cut through in loud basement shows, garage rehearsals, and dusty old venues.

  Dual XLR/TRS inputs plus a Mix Out are easy and versatile for connecting to your gear. You can even connect a microphone directly into either input when you just need simple vocal reinforcement.

  When things get hot, the automatic thermal limiting within Thrash will keep things in check so you can focus on your performance.
specs: |-
  - 1300W ultra-efficient Class-D amplifier
  - Frequency response: 52Hz – 20kHz
  - Max SPL: 125 dB
  - 12" high-performance woofer
  - 1" Titanium compression driver
  - Inputs 1 and 2 feature XLR/TRS combo inputs accepting both line and mic level
  - Mix output contains audio from both input channels
  - Standard pole mount
  - Equipped with 4 handles for easy loading
  - Dual-angle monitor wedge for use as a floor monitor
  - Rotatable grille badge
  - Thermal limiter
  - Weight: 36.4 lb / 16.51 kg
