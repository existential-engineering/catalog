capabilities:
  - distortion
  - overdrive
  - equalization
  - gating
url: https://www.engl-amps.com/shop/heads/steve-morse-signature-e656/
description: 100-watt all-tube Steve Morse signature guitar amplifier head with
  three channels, the ENGL Mid Control Matrix, two tube-buffered FX loops, a
  noise gate and full MIDI programmability.
details: |-
  An exceptional guitarist and an exceptional amp is a truly exceptional combination. Steve Morse has been shaping the sound of rock icons Deep Purple for more than 20 years, and enjoys the highest acclaim in guitar circles with his own Steve Morse Band.

  ENGL worked with Steve for over a year to get his dream amp ready. The E656 head delivers the sounds of the world's top players.

  The EQ section is unique, featuring four controls. In this way, the mid-range, which is so important in a full band context, can be shaped in the best possible way.

  With two switchable master volume levels, two effects loops, a noise gate and MIDI on board, nothing can stand in your way. Whether it is crisp rock riffs with Deep Purple or a variety of sounds in complex solo lines, the E656 has been an integral part of Steve Morse's rig for more than a decade.
specs: |-
  - 3 channels: Clean, Crunch, Lead
  - All tube head
  - ENGL Mid Control Matrix with 8 different midrange voicings
  - 2 tube buffered FX loops, each with balance control
  - Noise gate
  - Master A/B, two switchable master volume levels
  - Power tube monitor
  - Ground lift switch
  - MIDI In and MIDI Thru
  - ENGL MIDI footcontroller phantom power switch
  - MIDI channel assignment and controller enable switches
  - Write / Copy for MIDI programming
  - All functions accessible on the front panel are MIDI programmable
  - S.A.C.: serial amp control port
  - Sound options: Tone, Hi Gain, ENGL Mid Control Matrix (Mid Lo 1/2, Mid Hi 1/2)
  - Controls: Gain (for each channel), 3-band EQ (channels 1 and 2), Bass / Lo Mid 1 / Lo Mid 2 / Hi Mid 1 / Hi Mid 2 / Treble (channel 3), Volume (for each channel), Lo Volume / Hi Volume (channel 3), Presence, Depth Punch, Master A, Master B, Noise Gate Threshold Level, FX Loop I Balance, FX Loop II Balance
  - Poweramp output: 1 x 4 ohm, 1 x 8 ohm, 1 x 16 ohm, or 2 x 8 ohm / 2 x 16 ohm in parallel
  - Pre output and line out
  - Footswitch: ENGL Z4 (channels), Z9, Z12 and Z15
  - Preamp tubes: 4 x ENGL ECC83 / 12AX7
  - Output tubes: 4 x ENGL EL34
  - Output wattage: 100 W
  - Dimensions: 71 x 27 x 29 cm
  - Weight: 22 kg
