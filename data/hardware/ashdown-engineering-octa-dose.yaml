description: An octave pedal for bass from Dr Green in conjunction with Ashdown
  Engineering. Building on Ashdown's sub-harmonizer (originally part of the ABM
  range, delivering an octave below the note played), the Octa Dose adds Direct
  and Octave controls to blend anything from subtle thickening undertones to
  full sub-synth bass. It features true bypass switching and is housed in a
  custom steel casing built to survive nightly stomping.
details: |-
  Dr Green / Ashdown Engineering collaboration. Adds low-octave content below the played note, expanding on the sub-harmonizer from the ABM amplifier range. True bypass switching. Custom steel casing. Controls: Direct (amount of clean bass signal), Octave (amount of low-octave signal).
specs: |-
  - True bypass switching
  - Custom steel casing
  - Control: Direct (clean bass signal level)
  - Control: Octave (low-octave signal level)
