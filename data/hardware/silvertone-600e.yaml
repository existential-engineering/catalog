details: |-
  The Roots of Rock...Unplugged

  Originally manufactured from the 1940's through the 1970's, the Silvertone 600 series is like holding a piece of American history in your hands. We modeled this beauty from our in house 1956 model 600. The 600 model features a solid Engelmann Spruce top and Mahogany back and sides for a well balanced and articulate sound. The old 'steel reinforced' neck has been replaced with a modern two way adjustable truss rod, and the C-shape neck profile is comfortable and easy to get around on. This 600E version has a built in Fishman Clearwave60 preamp with built in tuner. Specs

