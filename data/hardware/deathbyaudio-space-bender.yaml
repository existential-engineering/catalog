details: |-
  The Space Bender chorus modulator replicates and warps your signal into beautiful and organic transmissions from a dimension somewhere beyond linear time. Under the hood lies an array of dynamically modulated delay lines allowing you to craft subtle vintage sci-fi sounds, bending sonic bedlam, and pulsing atmospheres. Never again will you say this chorus pedal just isn't intense enough.

  The Speed and Depth knobs act as the main controls over the delay time and feedback while simultaneously setting the modulation parameters of the delays. In combination with the rocker switch settings, they let you move smoothly through a wide range of effect types, allowing new ways of experimenting with modulated delay, chorus, and flanger. Stretch and pull your sound waves to craft glassy bell resonances, massive reverse dive bombs, and seasick demon drones with a simple but deep interface.

  Speed controls the speed of the LFO, sensitivity of the envelope, and time of the delays; at shorter times expect flange and chorus sounds with slower modulation, while long times stretch into wiggling, modulated delay. Depth controls the depth of the envelope or LFO, as well as the feedback of the delays. Delay Time sets the overall delay time range, from very short (x1) to medium-long (x10), and also inverts the polarity of the envelope. The Modulator switch sets the main source of modulation, either a sine wave oscillator in LFO mode or an envelope in ENV mode. Intensity sets the overall intensity of the effects, where high settings can create oscillations, feedback, and crazy noises. An internal Gain control sets the output level of the pedal, accessible by unscrewing the backplate.
