description: The Microtubes B7K V2 is a bass preamp and distortion pedal
  delivering tone-crushing overdrive and transparent modern sound, adding
  switchable low-mid and high-mid center frequencies over the original B7K.
details: |-
  The Darkglass Microtubes B7K V2 is a bass preamp and distortion pedal designed to deliver tone-crushing overdrive and super transparent modern sound. It enhances the presence of bass instruments in a mix without compromising their original character, building on the original B7K with enhanced tone-shaping through adjustable midrange frequencies.

  The pedal provides comprehensive distortion control through its Blend, Level, and Drive knobs, letting players mix clean and overdriven signals. Attack and Grunt switches enable precise saturation control of treble and bass frequencies respectively. Its EQ features switchable low-mid (500 Hz / 1 kHz) and high-mid (1.5 kHz / 3 kHz) center frequencies, allowing players to tailor their dream distortion tone.

  Connectivity includes a 1/4-inch instrument input and output, a 1/4-inch parallel output passthrough for parallel processing, and a balanced XLR direct output with ground lift. The unit measures 94 mm x 120 mm x 46 mm, weighs 320 g, and runs on a regulated 9V DC center-negative supply (26 mA draw).
specs: |-
  - Blend, Level, and Drive controls
  - Grunt switch sets amount of low frequency content to saturate
  - Attack switch sets amount of treble content to saturate
  - EQ with switchable low mids (500 Hz / 1 kHz) and hi mids (1.5 kHz / 3 kHz)
  - 1/4-inch parallel output passthrough for parallel processing
  - Balanced XLR direct output with ground lift
  - Requires regulated 9V DC center-negative supply (26 mA)
  - Dimensions: 94 mm x 120 mm x 46 mm; weight 320 g
