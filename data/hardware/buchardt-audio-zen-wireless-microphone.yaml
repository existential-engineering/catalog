details: |-
  The Zen Wireless Microphone is a rechargeable battery powered microphone with built-in Bluetooth (setup process) and WiFi 2.4Ghz. It's a calibration tool for collecting room acoustic data. The data is collected during a calibration procedure that last between 30 and 60 seconds and can be done by anyone. The Zen transfers the collected data via network connection to a supported app. The app processes and calibrate the data with the use of the phones or tablets CPU. Based on the calculation, the optimized result is transferred to a supported device to improve your audio experience. Do you already own one of our products and are in our customer base? Choose the "Buchardt Family" price and SAVE €50

  Note :
  Buchardt Family - If you're not in our customer database, the order will be canceled. - Works with iOS and Android. - The Buchardt app supports the Zen microphone. *be sure to update the Buchardt app!
