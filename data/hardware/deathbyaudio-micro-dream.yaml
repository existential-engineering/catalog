details: |-
  Similar to the thick and gooey sound of the Echo Dream 2, the Micro Dream is a streamlined and compact version that still retains the beautiful, decayed delay sound that made the Echo Dream famous. Push the delay past its limits by increasing the delay time to a full second, introducing lo-fi chirps and noise as the circuit protests. A gain stage on the delay line makes the Micro Dream perfect for pseudo looping or just an incredible slapback.

  This tasty lo-fi delay pedal takes the gooey, ectoplasmic sound of the Echo Dream 2 and packs it into a compact enclosure to deliver vivid slapback tones, chewy psychedelic echoes, and up to one full second of kaleidoscopic delay. At shorter delay times it dishes out vibrant, bouncy repeats tight enough to use as an always-on double-tracking effect to thicken up single note runs. As you increase the Time control, the repeats get grainier and more sinister as the longer times push the delay chip past its limit, introducing stretched, smeared, pseudo-looping delays.

  FBack controls the feedback of the delays, from slapback to wild runaway oscillation. Time controls the delay time (shown in milliseconds). Delay sets the volume of the delayed signal, with enough output to make the delay louder than the clean signal. An internal Trimpot sets the point at which the FBack knob will cause the delay to oscillate.
