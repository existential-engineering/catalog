details: |-
  The all-new EVH® 5150III® 50S 2x12 Cabinet is the perfect companion to the new EVH 5150III 50W 50S Head, with matching stealth black chrome EVH logo badges.

  This 60-watt, 16 ohm front-loaded 2x12 straight cabinet features rock-solid birch pine construction and a pair of 12" Signature Celestion® G12H 30W Anniversary Series speakers for Eddie Van Halen's renowned sound.

  Wrapped in Black textured vinyl with woven grille cloth, the 5150III 50S 2x12 Cabinet comes with attached tilt-back legs, removable EVH pop-out casters and a head-mounting mechanism.

  A high-quality fitted cover is available as an EVH accessory.
