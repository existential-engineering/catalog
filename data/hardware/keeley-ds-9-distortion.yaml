description: Hand-built distortion pedal holding two 1980s distortion circuits
  in one enclosure, selected by a relay toggle, with an added bass cutoff
  control.
details: |-
  The DS-9 Distortion puts two 1980s distortion circuits in one box: a green-cased sonic distortion and an orange-cased distortion. The two are closely related styles. The orange circuit has more gain, thanks to an added transistor gain stage, while the green one has a higher bass output with no low-end roll-off but suffers from lower output volume and a limited tone control.

  A toggle switch drives a relay that moves circuit elements around to produce each of the two voices, so one pedal covers both. The orange voice in particular is described as reaching Marshall-like hard rock tones easily.

  The addition is a bass Cutoff control, which blends between the low-end gain responses of the two circuits. Set low it gives the deep bass and gain of the green circuit; turned fully up it matches the tighter, punchier bass response of the orange one. Each unit is hand built.
