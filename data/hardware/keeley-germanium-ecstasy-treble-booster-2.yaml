details: |-
  The Germanium Ecstasy Treble Booster is a hand-built booster aimed at the overdrive tones produced when an amplifier is already pushed into breakup. It follows the Java Boost, Keeley's first treble booster, and is built around hand-selected NOS Mullard and Phillips OC75 germanium transistors, which Keeley credits for its break-up character and texture.

  A treble booster cuts bass and adds high frequencies rather than boosting the whole signal evenly. The reasoning is that simply adding volume for a solo thickens the low end without helping the guitar cut through a band, where removing bass and adding harmonics and gain produces a lead tone that sits above the mix. The pedal therefore needs a tube amplifier set on the edge of breakup or beyond, and Keeley notes that louder settings work better.

  This type of circuit has a long history with players including Tony Iommi, Brian May, Rory Gallagher, Eric Clapton, Ritchie Blackmore, Dweezil Zappa and Wolf Hoffmann. Keeley suggests it particularly suits darker sounding amplifiers such as older Marshall or Vox models. The enclosure artwork, by Atlee Hickerson, reworks a well-known album cover, replacing its two robots with a pre-amp tube and a germanium transistor.
