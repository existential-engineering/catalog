description: "Our most compact professional subwoofer, the 7040A brings
  controlled low-end accuracy to the tightest of production spaces."
details: |-
  The 7040A is Genelec's most compact professional active studio subwoofer, designed to extend the low-frequency reach of small nearfield systems without overwhelming the room. Pairing a 165 mm bass driver with a 50 W Class D amplifier inside a Laminar Spiral Enclosure (LSE), it delivers a flat response down to 33 Hz (±3 dB) and a maximum short-term SPL of at least 100 dB, measured in half space at 1 metre. Its purpose is straightforward: take responsibility for the bottom octaves so the main monitors can focus on the rest of the spectrum.

  The LSE cabinet is the heart of the design. Genelec's curvilinear, spiral-shaped reflex port forms an integral part of an extremely rigid MDF enclosure, allowing a long port to be packed into a small footprint while keeping airflow laminar and turbulence-free. The result is articulate, low-distortion bass — typically more than 30 dB below the fundamental for second and third harmonics — at SPL levels that small ported subwoofers usually cannot reach cleanly.

  Onboard analogue bass management makes the 7040A a true system component rather than a simple add-on. Two XLR inputs accept the L/R signal from the source, and two XLR outputs feed the satellite monitors after the low-frequency content has been filtered out. Rear-panel DIP switches handle level, phase, crossover roll-off and bass roll-off settings, allowing the 7040A to be matched to its room and to any pair of Genelec nearfields — typically the 8010 or 8020 — and to compensate for boundary loading near walls or corners.

  Day-to-day operation is supported by Genelec's Intelligent Signal Sensing (ISS) circuitry, which automatically drops the subwoofer into a sub-0.5 W sleep state when no signal has been present for a period of time and wakes it as soon as audio returns. Protection circuitry monitors signal level and voice-coil temperature to keep the driver inside safe limits without altering the sound during normal use.

  At 410 × 350 × 205 mm and 11.3 kg, the 7040A fits comfortably under a desk or in a project-studio corner, making it the natural low-end partner for compact 8000-series setups in home studios, broadcast booths, OB vans, post-production rooms and any production space where a full-range monitoring system has to live within a tight footprint.
specs: |-
  - Frequency response: 33 Hz - 85 Hz (±3 dB)
  - Frequency response: 30 Hz - 90 Hz (-6 dB)
  - Maximum short term SPL: ≥100 dB
  - Harmonic distortion (40-85 Hz at 90 dB SPL): ≤2.5%
  - Self-generated noise: ≤5 dB SPL
  - Bass driver: ⌀ 165 mm
  - Bass amplifier: 50 W Class D
  - Enclosure: MDF, reflex port (Laminar Spiral Enclosure)
  - Signal input: 2 x XLR female, balanced, 10 kOhm
  - Signal output: 2 x XLR male
  - Mains voltage: 100-240 VAC, 50/60 Hz
  - Power consumption (ISS active): ≤0.5 W
  - Power consumption (idle): ≤5 W
  - Power consumption (full output): 70 W
  - Dimensions: H 410 x W 350 x D 205 mm
  - Weight: 11.3 kg (24.9 lb)
