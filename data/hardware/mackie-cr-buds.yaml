description: "Mackie CR-Buds Series earphones were designed with one thing in
  mind- studio-quality sound you can take with you in your pocket."
details: |-
  Utilizing our decades of experience designing gear for the world's top artists, we have created earphones that present your favorite music with stunning detail and warmth that remain faithful to the artist's studio sound.

  Enjoy hours of comfort with soft silicone tips that keep outside noise to a minimum. With three different ear tip sizes included, you can choose what works best for your ears.

  Tuned for exceptional clarity and bass response, the full-range dynamic driver offers an immersive sound experience.

  In-line microphone with call answer control. Play/Pause music (may support additional functionality depending on your device).
specs: |-
  - Sensitivity: 95 dB
  - Impedance: 16 ohms
  - Frequency Range: 20Hz-20kHz
  - Cable Length: 47 inches (120 cm)
  - Color: Mackie Black
  - Driver Type: Dynamic
  - Soft silicone ear tips in three sizes
  - In-line microphone with call answer control
  - Play/Pause music control
