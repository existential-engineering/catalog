description: Mackie CR-Buds Series earphones were designed with one thing in
  mind, studio-quality sound you can take with you in your pocket.
details: |-
  Utilizing decades of experience designing gear for the world's top artists, Mackie created earphones that present your favorite music with stunning detail and warmth that remain faithful to the artist's studio sound. Available in two models, the CR-Buds and the dual driver CR-Buds+, CR-Buds Series earphones are designed for maximum comfort and rich full-range audio with signature Mackie style.

  Superior Sound Isolation and Comfort

  Enjoy hours of comfort with soft silicone tips that keep outside noise to a minimum. With three different ear tip sizes included, you can choose what works best for your ears for maximum comfort, sound isolation, and bass response.

  Precision Driver

  Tuned for exceptional clarity and bass response, the full-range dynamic driver offers an immersive sound experience.

  Answer Calls and Control Your Music

  An in-line microphone with call answer control and play/pause music control is fitted to the tangle-free cable, and may support additional functionality depending on your device.
specs: |-
  - Sensitivity: 95 dB
  - Impedance: 16 ohms
  - Frequency range: 20Hz - 20kHz
  - Cable length: 47 in. / 120 cm
  - Color: Mackie Black
  - Driver type: Dynamic
  - Three ear tip sizes included
  - In-line microphone with call answer and play/pause control
  - Tangle-free cable
