url: https://products.electrovoice.com/na/en/elx200-18sp/
description: The ELX200-18SP is an 18-inch powered subwoofer designed for
  portable and installed sound-reinforcement applications. A high-efficiency
  Class-D power amplifier rated up to 1200 W drives an EVS-18L 18-inch woofer in
  a 15 mm plywood enclosure with EVCoat finish and 18 AWG steel grille,
  delivering up to 132 dB maximum SPL with low-frequency response down to 40 Hz.
  Integrated QuickSmartDSP provides preset selection, EQ, and an adjustable
  low-pass crossover (80 / 100 / 120 / 150 Hz), and the unit can be controlled
  wirelessly via the QuickSmart Mobile app. Connectivity includes two XLR/TRS
  combo inputs and two XLR link outputs, and the cabinet features an integrated
  M20 threaded pole-mount plate. Available in black or white.
details: |-
  High-efficiency Class-D power amplifier rated up to 1200 W

  EVS-18L 18-inch (457 mm) woofer

  Integrated QuickSmartDSP with single-knob LCD menu interface

  Wireless control via QuickSmart Mobile app

  Maximum SPL of 132 dB (broadband pink noise at 1 m)

  Frequency response 47 Hz - 105 Hz (-3 dB), 40 Hz - 145 Hz (-10 dB)

  Adjustable low-pass crossover: 80 / 100 / 120 / 150 Hz

  15 mm plywood enclosure with EVCoat finish

  18 AWG steel grille with powdercoat finish

  Two XLR/TRS combo inputs with two XLR link outputs

  Integrated M20 threaded pole-mount plate

  Available in black or white
specs: |-
  - frequencyResponse: 47 Hz - 105 Hz (-3 dB)
