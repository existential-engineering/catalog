id: Ry2qrmwGZV-hVzIcXzhVJ
name: Micro Clock mkIII XB
manufacturer: black-lion-audio
primaryCategory: rack-mount
url: https://blacklionaudio.com/en/products/micro-clock-mkiii-xb
description: High-precision word clock with 0.6pS RMS jitter and 6 BNC outputs up to 384kHz
details: |-
  The Micro Clock mkIII XB is Black Lion Audio's highest-precision word clock generator. It delivers 0.6pS RMS jitter at BNC outputs — less than one-third the jitter of the standard Micro Clock mkIII. The device features highly accurate crystal oscillators and superior quality galvanic isolation to achieve extraordinarily low jitter measurements. It provides six BNC word clock outputs, one XLR AES output, one RCA S/PDIF output, and one Optical S/PDIF output. BNC outputs support sample rates from 44.1kHz up to 384kHz; AES and RCA S/PDIF support up to 192kHz; Optical S/PDIF supports up to 96kHz.
specs: |-
  - Jitter: 0.6pS RMS (BNC outputs)
  - BNC Output Impedance: 75Ω, 5V unterminated
  - AES Output Impedance: 110Ω, balanced
  - RCA S/PDIF Output Impedance: 75Ω, unbalanced
  - BNC Sample Rates: 44.1, 48, 88.2, 96, 176.4, 192, 352.8, 384 kHz
  - AES/RCA S/PDIF Sample Rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Optical S/PDIF Sample Rates: 44.1, 48, 88.2, 96 kHz
  - Power: 9VDC, 6W
  - Power Connector: 2.1mm barrel, 5.5mm outer diameter, center pin positive
  - Dimensions: 6.5" L x 6" W x 1.75" H (without rack ears)
  - Weight: 2.2 lbs
