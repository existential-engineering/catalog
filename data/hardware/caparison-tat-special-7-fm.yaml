details: |-
  Caparison's 7-string TAT-Special 7 FM is a constantly evolving flagship design, tailored to meet the standards of the perfect guitar. Its line has recently been upgraded to feature Jescar stainless steel jumbo frets for a crisper note attack and Australian blackwood body wings combined with a stunning flame maple top for a full, rich note bloom and sustain. As part of the Through and Through ethos, the TAT Special 7 FM boasts a neck through body construction with a 5-piece maple/walnut neck and matte surface for a consistently comfortable feel throughout its 27 fret range. This combination of woods ensures not only superior sound quality but also stability and reliability. To complement its exceptional build, the TAT-Special 7 FM features Caparison's original PH7-bm bridge pickup and PH7-nm neck pickup. Its control setup is practical and straightforward with the Caparison original Rotary Switch Mode allowing for four different pickup combinations, from more vintage leaning to modern sounding results. Available in three striking finishes - Moonlight, Aqua Burst, and Rose Burst - the TAT-Special 7 FM showcases the beauty of its construction with natural sides and back highlighting the grain of the woods used. This electric guitar is truly a top-tier instrument that any serious musician would love to add to their collection. Master luthier and head designer, Itaru Kanno notes that Australian Blackwood is perfectly suited to Caparison's guitar designs, known for its rich and warm tone, with a moderate low-end response, and is said to be suitable for various musical genres. By adopting Australian Blackwood for the TAT-Special FM body, the warm and rich tone of the wood can be enjoyed in addition to the visual beauty of the flame maple grain pattern.
