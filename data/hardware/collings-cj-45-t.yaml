description: The CJ-45 T is a Traditional Series slope-shoulder jumbo acoustic
  guitar fully reimagined with vintage-inspired construction. Built with a Sitka
  spruce top and Honduran mahogany back, sides, and neck, it delivers the dry,
  fundamental tone with growl and thump characteristic of Wartime-era
  dreadnoughts. A Wartime scalloped X-brace pattern and ebony straight-style
  bridge reinforce its vintage character.
details: |-
  The CJ-45 T is a fully reimagined slope-shoulder jumbo from the Traditional Series, engineered to capture the voice of Wartime-era dreadnoughts. The body is constructed with a Sitka spruce top and Honduran mahogany back and sides, joined by a Honduran mahogany neck with the CJ-45 Carve profile and a distinctive 'Haircut' peghead. Bracing uses a Wartime scalloped X-brace pattern in Sitka spruce to produce a dry, fundamental tone with characteristic growl and thump. The fingerboard is Indian rosewood with 19 frets, MOP long dots, and a 12" radius. Hardware includes nickel Waverly tuners with Ivoroid buttons, bone nut (1 3/4") and cutthrough bone saddle, an ebony straight-style bridge with 2 5/16" spacing, and Ivoroid bridge pins and end pin with no dot. Finish is high gloss nitrocellulose lacquer on the body and polyester resin on the neck.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: Honduran mahogany
  - Neck: Honduran mahogany
  - Fingerboard: Indian rosewood
  - Fingerboard Inlays: MOP long dots
  - Fingerboard Radius: 12"
  - Bridge: Ebony straight-style, 2 5/16" spacing
  - Nut: Bone, 1 3/4"
  - Saddle: Bone, cutthrough
  - Tuners: Nickel Waverly with Ivoroid buttons
  - Bridge Pins/End Pin: Ivoroid (no dot)
  - Frets: 19, medium 18% nickel-silver
  - Scale Length: 24 7/8"
  - Bracing: Sitka spruce, Wartime scalloped X-brace
  - Neck Joint: Mortise & tenon hybrid
  - Body Binding: Ivoroid (no purfling)
  - Rosette: Single-ring multiple black/white purflings
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: Polyester resin
  - Body Width: 16"
  - Body Length: 20 1/8"
  - Body Depth: 4 7/8"
  - Total Length: 41"
  - Strings: D'Addario EJ-17 (.013"-.056")
