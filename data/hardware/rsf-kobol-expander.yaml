description: >-
  The RSF Kobol Expander is the rack-mount version of the French-made Kobol monophonic
  analog synthesizer, released in 1979. It features two VCOs with continuously sweepable
  waveforms, a 24dB lowpass filter, two ADS envelopes, an LFO, and a 2x8 step sequencer.
  With CV/Gate control and external audio processing capabilities, the Kobol Expander is a
  versatile and highly sought-after vintage analog sound source.
details: |-
  The RSF Kobol was the French synth company's first compact synthesizer, inspired by the Minimoog but offering its own unique character. The Kobol Expander is the rack-mount version, released in 1979 as a follow-up to the 1978 keyboard model, designed for integration into modular and studio setups.

  The synthesis architecture centers on two VCOs offering triangle, square, sawtooth, and pulse waveforms. Most notably, the oscillator waveforms can be continuously swept for a distinctive morphing effect from square to sawtooth to pulse. This continuous waveform sweeping, combined with the overall analog character of the oscillators, gives the Kobol its signature sound.

  Sound shaping is handled by a 24dB lowpass VCF and two ADS envelope generators. An LFO provides triangle and square waveforms for modulation duties. The Kobol Expander includes a 2x8 step sequencer for creating patterns, 16 memories for storing patches, and the ability to process external audio through its filter and envelope sections.

  Control is via CV/Gate at 1 volt per octave, allowing integration with other analog synthesizers and sequencers. The rack system was part of a modular family comprising the Kobol Rack, Expander 2, Programmer, and KM8 mixer, using normalized connections similar to the ARP 2600. Production quantities were limited, with approximately 800 Kobol Racks produced. Notable users include Vince Clarke, Vangelis, Jean-Michel Jarre, Peter Gabriel, and Hans Zimmer.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (triangle, square, sawtooth, pulse with continuous sweep)
  - LFO: 1 (triangle, square waveforms)
  - Filter: 1 VCF, 24dB lowpass
  - Envelopes: 2 ADS
  - Sequencer: 2x8 steps
  - Memory: 16 patches
  - Control: CV/Gate (1V/oct)
  - External Audio: Processable through filter and envelope sections
  - Date Produced: 1979
