description: The CL-115H-NEO is a UK-crafted bass cabinet from Ashdown's Classic
  Custom Shop range, delivering 800 watts of commanding bass through a
  lightweight 15-inch B&C neodymium speaker and high-frequency horn with a
  three-way crossover. Its birch ply cabinet with a tuned bass-reflex port
  projects tight, resonant lows, while Buffalo Tolex, silver & blue cloth, and
  chrome corners reflect Ashdown's heritage style. Neutrik connectors, an offset
  handle, and rugged touring build round out a cab suited to stage and studio.
