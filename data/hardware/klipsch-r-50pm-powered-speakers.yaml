description: The Klipsch R-50PM Reference powered speakers are designed to
  connect to virtually any source without the need for an A/V receiver.
details: |-
  The R-50PM Powered Monitors feature Klipsch's exclusive 90° x 90° Tractrix horn for a wider soundstage with edge-to-edge coverage that maintains clarity even at high volumes. The horn is paired with a 1" aluminum Linear Travel Suspension (LTS) tweeter for high-frequency accuracy.

  The low-frequency driver is a single 5.25" spun-copper thermoformed crystal polymer (TCP) woofer. The steeper angling of the cone provides a smoother response and better crossover integration. The bass-reflex rear-firing port design extends bass response down to 55Hz (dynamic bass extension to 44Hz).

  With 120W total system power (240W peak, 60W per channel) and a built-in factory-tuned amplifier, no external AV receiver is required. Maximum output reaches 104dB.

  Connectivity is comprehensive: phono/line analog input with ground screw terminal for turntables, 3.5mm analog mini jack, USB digital input, optical digital input, and a single RCA line-level subwoofer output for system expansion.

  The compact bookshelf form factor measures 14" × 7" × 10.8" and weighs 24.8 lbs for the pair. Includes remote control, 4M speaker wire, and USB Type A to Type B cable.
