description: triode is an analog/digital synthesizer driven by three oscillators
  and a unique twin-T analog lowpass filter, with 24 wavetables and dual
  envelopes for powerful filter sweeps.
details: |-
  It features the classic triode analog filter with more hands on control and USB MIDI. MeeBlip triode's huge sound is driven by three oscillators and a unique twin-t analog lowpass filter. Two digital pulse / pwm / sawtooth oscillators can be detuned and a square wave sub-oscillator adds to the bottom end. For sonic variety, triode also offers hands-on access to 24 grungy wavetables, along with dual envelopes routed to oscillator amplitude and filter cutoff for powerful filter sweeps and effects. MeeBlip owner Olivier Ozoux explores the sound of triode:

  triode comes fully assembled and ready to use. Because it's open source hardware, users can learn from triode by looking through the code and circuits, modifying how it works, or even creating their own instruments based on the design. Customers outside the USA and Canada: You may be charged VAT and a processing fee on delivery. Please ask your national postal service for more information. We ship by the US Postal Service or Canada Post.
specs: |-
  - Two aggressive MeeBlip digital oscillators for maximum bass impact
  - A third sub-oscillator with pure square wave output (no samples, no digital-to-analog conversion)
  - Switchable waveforms: square, PWM sweep, and sawtooth
  - Twin-T analog resonant filter inspired by guitar stompboxes
  - 24 wavetables for endless sonic possibilities
  - MIDI control of every single parameter you see, plus more under the hood
  - LFO routable to oscillators or filter
  - MIDI IN jack
  - Stereo audio mini jack output
  - Multi-volt international power adapter (100-240 V, 50/60 Hz)
  - Limited run of only 1000 hand-numbered units
  - The latest Version 1.20 firmware is installed
