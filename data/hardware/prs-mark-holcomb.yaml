details: |-
  Mark Holcomb, renowned for his groundbreaking work with progressive metal band Periphery, brings his signature style and precision to the PRS lineup with a guitar built for versatility and power. Holcomb’s innovative riffing, a cornerstone of Periphery’s dense triple-guitar sound, comes to life on stages worldwide with his PRS signature models.

  A standout in the PRS family, the Mark Holcomb model features a mango top, a 25.5” scale length maple neck, and an ebony fretboard with a 20” radius—crafted for speed and precision. Equipped with Holcomb’s signature Seymour Duncan Scarlet and Scourge pickups, this guitar delivers focused low-end punch and crystal-clear articulation, ensuring complex chord voicings, coil-splitting, and drop tunings remain defined and dynamic. The 5-way blade switch unlocks a range of tones, from dual humbuckers in position three to coil-split options in positions two and four. With satin black hardware and seven eye-catching finishes, the Mark Holcomb model doesn’t just sound exceptional—it looks the part too. Whether you’re shredding metal, chicken-pickin’, or exploring jazzy improvisations, this guitar delivers uncompromising performance and boundless fun, ready to meet the demands of any genre.
