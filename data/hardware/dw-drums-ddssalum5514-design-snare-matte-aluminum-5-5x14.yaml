description: This snare features thin beaded aluminum shell for rounder attack with drier resonance.
details: |-
  The DW Design Series raised the bar for DW and made custom-inspired drums available to more drummers than ever before. This Design Series snare beaded aluminum shell with a matte finish for "workhorse-style" tone and versatility with a classy finish.

  The thin beaded aluminum shell offers a more resonant tone with more overtones than their thicker rolled-shell cousins, while producing a rounder attack with drier resonance. The drum also has rolled bearing edges, snare beds and is chrome hardware.

  This snare is fitted with DW's MAG throw-off, Design Series snare lugs, and triple-flange hoops.
