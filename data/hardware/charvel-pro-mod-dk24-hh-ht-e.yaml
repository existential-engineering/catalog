description: A high-performance Dinky-shaped electric guitar combining an alder
  body with premium components, featuring an ebony fingerboard, Seymour Duncan
  humbuckers, and a Charvel HT6 string-through-body hardtail bridge for
  rock-solid tuning stability.
details: |-
  The Pro-Mod DK24 HH HT E pairs a Dinky-shaped alder body in a satin finish with a bolt-on maple neck featuring graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. The body includes a sculpted shredder's cut heel and a scalloped lower back bout for enhanced upper-register access.

  An ebony fingerboard with a 12" to 16" compound radius hosts 24 jumbo frets and offset pearloid dot inlays, all anchored by a 1.6875" black plastic nut and a 25.5" scale length.

  Electronics are built around an HH configuration: a Seymour Duncan Full Shred SH-10B at the bridge and a Seymour Duncan Alnico II Pro APH-1N at the neck, routed through a 5-way blade selector. A 500K EVH Bourns low-friction volume pot and no-load tone control round out the wiring.

  Hardware includes a Charvel HT6 string-through-body hardtail bridge, Charvel-branded die-cast locking tuning machines, dome-style control knobs, and a Fender standard string tree. The licensed Fender Stratocaster headstock, 4-bolt sculpted heel, and heel-mount truss rod adjustment wheel complete a thoroughly modern high-performance platform.
