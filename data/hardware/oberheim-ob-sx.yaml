description: >-
  The Oberheim OB-SX is a smaller, lighter, and more durable live performance
  version of the flagship OB-X synthesizer, produced from 1980 to 1983. It uses
  identical VCO/VCF/VCA circuits to the OB-X with a voice card architecture
  similar to the OB-Xa, delivering the same rich analog character in a more
  portable package. Patch memory was replaced with ROM presets, and the
  programming interface was simplified to real-time filter and envelope
  controls.
details: |-
  The OB-SX was designed as a road-ready alternative to Oberheim's flagship OB-X. It featured identical VCO, VCF, and VCA circuits but employed a voice card architecture similar to the OB-Xa, using CEM/Curtis chips on 2-voice PCB cards. Polyphony depended on how many voice cards were installed, ranging from 2 to 6 voices.

  Several compromises distinguished it from the OB-X. The programming interface was simplified to real-time-only filter and envelope controls rather than dedicated knobs for each function. Patch memory was eliminated entirely, with all sounds stored as presets in ROM. The keyboard was reduced to 48 keys, removing the highest octave.

  Despite these limitations, the OB-SX faithfully reproduced the character of its predecessors, including the temperamental nature of an all-analog design. The preset sounds reflected early funk and late prog rock aesthetics but could be shaped considerably using the real-time controls.

  The OB-SX underwent continuous refinement during its production run. Early units shipped with 24 presets, mid-production models expanded to 48, and late units offered 56 presets with rear panel slide switches for bank selection. The color scheme also evolved from black and gray to black with blue pinstripes. Oberheim even allowed purchasers to submit OB-X patch cassette dumps for custom ROM burning, making some units potentially unique.

  Later production models added the pre-MIDI Oberheim System digital interface, enabling compatibility with the Oberheim DSX sequencer. Like all early analog synths, the OB-SX is vulnerable to voltage and temperature changes, requiring warm-up periods and voltage regulators for stable operation.
specs: |-
  - Polyphony: 2, 4, or 6 voices (depending on installed voice cards)
  - Oscillators: 2 VCOs per voice
  - LFO: 1 variable (1/10 to 20 oscillations per second)
  - Filter: 1 VCF per voice with envelope and dedicated cutoff control
  - Envelope: ASR (Attack-Sustain-Release)
  - Keyboard: 48 keys
  - Memory: 24, 48, or 56 ROM presets (depending on revision)
  - Control Interface: CV/Gate (early units) or Oberheim System digital interface (later units)
  - Production Period: 1980-1983
