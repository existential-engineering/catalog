description: >-
  The Yamaha CS-15D is a monophonic analog synthesizer released in 1979 that
  combines preset instrument sounds with a manual synthesis section. It features
  a single VCO with pulse and sawtooth waveforms, a 12dB lowpass filter with
  dedicated ADSR envelope, and 29 preset sounds split across two mixable
  channels. Known for its solid, warm sound, it bridges the gap between
  ease-of-use preset keyboards and fully programmable synthesizers.
details: |-
  The CS-15D was part of Yamaha's late-1970s synthesizer lineup alongside the CS-20m, CS-40m, and CS-70m. It represents an interesting bridge between preset-based and fully programmable synthesis, appealing to musicians who wanted ease-of-use alongside creative sound design possibilities.

  The preset section is divided into two channels: Channel 1 contains 15 sounds featuring traditional instrument imitations, while Channel 2 offers 14 synth sounds plus access to the manual synthesis section. A slider allows mixing between the two channels, and Channel 2 includes a detuning capability for layered textures.

  The manual synthesis engine centers on a single voltage-controlled oscillator with selectable pulse and sawtooth waveforms. Pulse width modulation, noise, and multiple footings from 32' to 2' provide extensive sound-shaping options. The 12dB lowpass filter includes dedicated cutoff and resonance controls plus its own ADSR envelope, delivering a characteristically warm analog sound.

  Performance controls include a modulation section with one LFO offering sine and square waves, sample-and-hold random modulation, and repeat functionality. Modulation can be routed to the VCO, VCF, or VCA. The pitch wheel lacks a spring, featuring only a soft click at center, which remains a divisive design choice among synthesists.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - LFO: 1 (sine, square, sample-and-hold, repeat)
  - Filter: 1 lowpass, 12dB/octave (2-pole) with dedicated ADSR
  - VCA: 1 with ADSR envelope
  - Keyboard: 37 keys
  - Memory: 29 presets (no user storage)
  - Control Inputs: Dual CV and Gate
  - Production Years: 1979–1982
