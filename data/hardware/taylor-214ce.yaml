description: An ideal choice for virtually any type of player, the 214ce pairs a
  Grand Auditorium body with a solid torrefied spruce top, layered walnut back
  and sides, Venetian cutaway, and Expression System 2 electronics for
  stage-ready performance.
details: |-
  Part of Taylor's 200 Series, the 214ce features a Grand Auditorium body shape with player-friendly contours and an all-purpose tone profile. The solid torrefied spruce top delivers bold, clear projection with aged-in warmth, while layered walnut back and sides add rich brown visual character.

  C-Class interior bracing provides more volume, longer sustain, and a boost to low-end compared to traditional X-bracing. The Venetian cutaway enables upper-fret access, and the Neo-Tropical Mahogany neck with Standard Carve profile offers comfortable playability for players of all styles.

  Expression System 2 electronics feature a behind-the-saddle pickup design for natural amplified tone reproduction. The guitar ships with a structured gig bag and is backed by Taylor's Limited Lifetime Warranty.
specs: |-
  - - Body shape: Grand Auditorium
  - Top: Torrefied Spruce (solid)
  - Back/sides: Walnut (layered)
  - Bracing: C-Class
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany, Standard Carve
  - Fretboard: West African Crelicam Ebony
  - Scale length: 25-1/2"
  - Nut width: 1-11/16"
  - Electronics: Expression System 2 (ES2)
  - Finish: Matte
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Tuners: Die-cast Chrome
  - Series: 200
  - Case: Gig bag included
