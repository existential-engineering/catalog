description: 3xVCA offers three high class linear amplifier circuits in 6 HP.
  Thanks to AC / DC compatibility, a very low noise floor and basically no
  distortion, the module suits control voltages as well as audio material.
details: |-
  3xVCA offers three high class amplifier circuits with linear characteristic. Thanks to AC / DC compatibility, a very low noise floor and basically no distortion, the module is not only a great partner for control voltages, but audio material as well.

  Besides a signal input and output, each VCA has its own CV input. The dual potentiometers regulate levels and bipolar CV attenuation values of all amplifiers.

  Using these rather unusual, yet very practical components, it was possible to equip the 3xVCA with a front panel that is only 6 HP wide.

  Switches allow the user to feed the results of one amplifier to the output of the next amplifier, so 1+2, 2+3 and 1+2+3 output mixes are available. Two-colored LEDs visualize CV and output signals.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - Three linear VCAs with signal input, signal output and CV input each
  - Dual potentiometers set level and bipolar CV attenuation per amplifier
  - AC / DC compatible for audio and control voltages
  - Very low noise floor and basically no distortion
  - Switches cascade one amplifier into the next for 1+2, 2+3 and 1+2+3 output mixes
  - Two-colored LEDs visualize CV and output signals
  - 60 mA +12V
  - 60 mA -12V
  - 35 mm depth
  - 6 HP wide
  - Reverse power protected
