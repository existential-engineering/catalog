details: |-
  MRC is the long-anticipated hardware extension of Antelope Audio's acclaimed surround sound and immersive audio monitoring system. Designed for tactile and straightforward monitoring workflow, the layout of this advanced monitor controller mirrors all major controls of the system for a smooth and intuitive workflow, thanks to fast preset recall and streamlined multichannel functionality.

  The Antelope Audio monitoring system supports over 23 audio formats, from stereo to Dolby Atmos 9.1.6, and features precise speaker and room calibration tools such as per channel 8-band EQ and delay offset. With intuitive controls, a color-coded layout, and fast preset recall functionality, this ecosystem is the top choice for surround and immersive audio production. The MRC controller enhances the system with streamlined and tactile controls, making it the key to effortless advanced monitoring.

  A large main rotary encoder handles output volume control for the stereo or surround/immersive audio monitoring outputs, with press-to-mute functionality. A dedicated Dim button positioned next to the volume knob quickly attenuates the currently selected output by -20 dB, while the Stereo Monitor Out switch toggles between the surround/immersive level and the stereo monitor output on the back of the interface.

  Speaker Layout Buttons enable individual speaker Solo and Mute functions for isolating single channels or whole channel groups when checking spatialization and positioning of mix elements. A dedicated Solo Mode Button enters Solo mode on press (with a Solo Mix mode accessed by holding it down), and a Bass Management control mirrors the Bass Management On/Off switch in the control panel for the LFE channel.

  Five Session preset buttons (A-E) provide fast recall of signal routing, audio format switching, output levels, speaker calibration, FX processing, and direct monitoring mix parameters - useful for seamless switching between input sources or monitoring outputs, and quick comparisons between binaural, surround, or Atmos mixdowns. A Function Button (FN) clears all currently muted speaker states, serves as a power indicator LED, and enters boot mode for firmware reinstallation when held down during power-up.
specs: |-
  - Multichannel remote controller for Antelope Audio immersive monitoring system
  - Seamless support for over 23 audio formats, from stereo to Dolby Atmos 9.1.6
  - Main rotary encoder for stereo or surround/immersive output volume with press-to-mute
  - Dim button for quick -20 dB attenuation of the selected output
  - Stereo Monitor Out switch toggles between surround/immersive and stereo monitor levels
  - Speaker Layout Buttons for per-channel Solo and Mute
  - Solo Mode Button with Solo and Solo Mix modes
  - Bass Management On/Off control mirroring the interface control panel
  - Five Session preset recall buttons (A-E) for routing, format, output levels, calibration, FX and direct monitoring
  - Function Button (FN) clears muted states, acts as power indicator, and enters firmware boot mode
  - Compatible with Galaxy 64 Synergy Core, Galaxy 32 Synergy Core, Orion 32+ Gen 4, and Orion Studio Synergy Core
