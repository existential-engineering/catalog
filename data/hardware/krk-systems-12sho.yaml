details: |-
  Large and powerful near-field studio monitors require a subwoofer that can achieve high sound pressure levels, and KRK's 12sHO is a powerful, sonically pure addition to any studio setup. Whether for stereo or surround formats, the 12sHO subwoofer reproduces low-frequency detail as well as the LFE channel's demanding bass content. These challenging applications place demands far exceeding the capabilities of traditional low frequency drivers and power amplifiers, so KRK developed the 12sHO (HO for "High Output") as the industry solution for all types of demanding mix situations.

  Quad-vented, Front-firing Bass Port

  The front-firing port is quad-vented for low frequency extension.

  Sweepable Crossover Control

  A sweepable crossover control sets the handover to the main monitors, and the included bypass foot control switches the high-pass filter out of circuit.
specs: |-
  - Configuration: Front Loaded, Vented Subwoofer
  - System Type: Active Subwoofer
  - Low-Frequency Transducer: 12" Woven Kevlar High Performance Woofer
  - Frequency Response: 29.2Hz - 160Hz (L/R inputs), 29.1Hz - 211Hz (LFE input)
  - Max Peak SPL: 123 dB
  - Amplifier: Class A/B
  - Power Output (Continuous): 400 Watts @ 1% THD+N @ 100Hz
  - Signal to Noise Ratio: 92 dB
  - Amplifier Distortion (THD + N): <= 0.1% @-3dB Of Max Power Output 20Hz-200Hz
  - Input Impedance: 10 KΩ Balanced or Unbalanced
  - Ground Lift: On/Off
  - HPF Bypass: With Footswitch Only
  - Footswitch: Included
  - Indicators: Power, Protection, Limiter
  - Input Connectors: Combo XLR / 1/4-inch TRS, balanced, left and right
  - LFE Input: Combo XLR / 1/4-inch TRS, balanced
  - Output Connectors: Balanced XLR, left and right
  - AC Power Input: Selectable 110V-120V / 220V-240V
  - Enclosure: 18mm & 36mm Reinforced MDF
  - Finish: Textured Paint
  - Dimensions (H x W x D): 20" (508 mm) x 20" (508 mm) x 22.48" (571 mm)
  - Weight: 109.7 lb. (49.7 kg)
  - Sweepable crossover control
  - Quad-vented, front-firing bass port
