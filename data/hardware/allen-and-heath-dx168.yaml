description: The DX168 is a rugged, 96kHz portable expander for adding remote
  I/O to a dLive, Avantis, SQ, or Qu* system, or to AHM audio matrix processors.
  (*96kHz Qu models only)
details: |-
  The DX168 is a rugged, 96kHz portable expander for adding remote I/O to a dLive, Avantis, SQ, or Qu* system, or to AHM audio matrix processors. (*96kHz Qu models only)

  16 Mic Preamps with +60dB of gain, Phantom Power indicators and -20dB pad for line level sources.

  8 Line Outs — balanced, relay protected line outputs on XLR.

  Rugged stagebox format with optional rackmount kit available — can sit on stage or mount in a 4U rack space.

  Plug-and-Play: no configuration required, just connect to your mixer and you're ready to go. Firmware updates are handled automatically by the mixer.

  Rugged design with hard-wearing rubber bumpers allows placement directly on the stage floor during performances.

  Weighs 4.8kg and features a sturdy carry handle for portability in rental, education, houses of worship and other environments.

  Can be placed up to 100m away from the mixer via a single Cat5e cable on a secure EtherCon port.

  A second locking EtherCon port is provided for redundant connection to compatible hardware, or for daisy-chaining to a downstream DX Expander for additional remote I/O.
specs: |-
  - 16 in / 8 out
  - 96kHz operation
  - 16x Mic Preamps with +60dB gain, Phantom Power indicators and -20dB pad
  - 8x Balanced, relay protected Line Outputs on XLR
  - 2x Locking EtherCon DX Link ports (primary + redundant / daisy-chain)
  - Up to 100m cable run on a single Cat5e
  - Plug-and-play with automatic firmware updates from the mixer
  - Rugged stagebox format with rubber bumpers and carry handle
  - Weight: 4.8kg
  - Optional 4U 19-inch rack mounting kit available
