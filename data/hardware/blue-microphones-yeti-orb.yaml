details: |-
  Yeti Orb is a condenser USB microphone sold under Logitech G, carrying the Blue Yeti name in a compact spherical body aimed at gaming and game streaming. Logitech positions it as a premium gaming microphone that pairs a condenser capsule optimized for streaming with LIGHTSYNC RGB and Blue VO!CE presets, reaching that performance over a simple USB connection.

  The capsule is a single cardioid condenser, so the mic hears the voice in front of it and rejects what arrives from the sides and rear. Logitech frames this as focus rather than isolation: the capsule optimizes the voice while reducing noises such as keypresses that would otherwise sit in the middle of a stream. There is no multi-pattern switch, the cardioid pattern is fixed.

  Conversion runs at 24-bit / 48 kHz with a stated frequency response of 70 Hz to 20 kHz, a maximum SPL of 117 dB (1% THD) and a signal-to-noise ratio of 72 dB. The single USB-C port on the body is both the audio and the power path, fed by the supplied 2 m USB-C to USB-A cable, and the host only needs a USB 1.1 port or higher on Mac or Windows. No drivers are required for plug-and-play operation.

  Lighting is part of the product rather than an accent: an RGB logo and a status light are built in and driven by LIGHTSYNC, so the mic joins the lighting effects shared across a Logitech G desk. G HUB is the single desktop application controlling the mic alongside mice, keyboards and Litra lights, and it is also where the Blue VO!CE presets live, offering clipping protection and voice effects for the stream.

  The body is a 196 mm tall, 115 mm wide orb weighing 230 g, presented as a clean camera-ready shape for on-screen use. It ships with a removable desktop stand and takes any 1/4-inch-20 threaded mount, so it can move to a boom arm. The box also carries user documentation and a Streamlabs Ultra redeem code, and the mic is covered by a 2-year limited hardware warranty.
specs: |-
  - Transducer type: condenser
  - Polar pattern: cardioid (fixed)
  - Sample rate: 24-bit / 48 kHz
  - Frequency response: 70 Hz to 20 kHz
  - Max SPL: 117 dB (1% THD)
  - Signal-to-noise ratio: 72 dB
  - Connector: USB-C on the mic, supplied 2 m USB-C to USB-A cable
  - USB bus powered, no external power supply required
  - Lighting: RGB with LIGHTSYNC (illuminated logo plus status light)
  - Blue VO!CE presets and control via Logitech G HUB
  - Plug and play, no drivers needed
  - Mounting: included removable desktop stand or any 1/4-inch-20 threaded mount
  - Dimensions: 196 mm H x 115 mm W x 115 mm D (7.72 x 4.53 x 4.53 in)
  - Weight: 230 g (8.11 oz)
  - System requirements: Mac or Windows with an available USB 1.1 port or higher
  - Warranty: 2-year limited hardware warranty
  - Colours: Black (SKU 988-000549) and White (SKU 988-000556)
  - In the box: microphone, removable desktop stand, 2 m USB-C to USB-A cable, user documentation, Streamlabs Ultra redeem code
