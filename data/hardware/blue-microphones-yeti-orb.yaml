details: |-
  Logitech G Yeti Orb is a premium gaming microphone with LIGHTSYNC RGB, a condenser capsule optimized for game streaming, and Blue VO!CE presets that delivers best-in-class audio performance and ease of use via a simple USB connection.

  Thanks to an optimized condenser capsule, Blue VO!CE presets, and a simple, compact design, the Yeti Orb is one of the easiest ways to upgrade a gaming or streaming setup with crystal clear comms. The condenser mic capsule optimizes the voice, reducing noises like keypresses that get in the way of play.

  Yeti Orb's built-in RGB logo and status light work with LIGHTSYNC to enable custom lighting effects, illuminating the gaming room and bringing life to a stream. The sleek, clean, camera-ready design brings a polished look on video.

  G HUB software controls the Yeti Orb alongside the rest of the Logitech G gear including gaming mice, keyboards and Litra lights, all in one desktop window. Blue VO!CE software adds protection against clipping plus effects for entertaining an audience.

  The microphone ships with a removable desktop stand and can also be fitted to any 1/4"-20 threaded mount. A 2 m USB-C to USB-A cable is included in the box.
specs: |-
  - Type: Condenser
  - Polar pattern: Cardioid
  - Sample rate: 24-bit / 48 kHz
  - Frequency response: 70 Hz - 20 kHz
  - Max SPL: 117 dB (THD 1% kHz)
  - Signal to noise ratio: 72 dB
  - Connector: USB-C to USB-A
  - Bus-powered over USB (no separate power input)
  - Lighting: RGB with LIGHTSYNC
  - Mounting: included desktop stand or any 1/4"-20 threaded mount
  - Blue VO!CE presets and effects, with clipping protection
  - G HUB software support
  - Dimensions: 7.72 in x 4.53 in x 4.53 in (196 mm x 115 mm x 115 mm)
  - Weight: 8.11 oz (230 g)
  - System requirements: Mac or Windows system with an available USB 1.1 port (or
    higher), plus internet access for optional software download
  - Warranty: 2-year limited hardware warranty
  - In the box: Yeti Orb USB microphone, removable desktop stand, 2 m USB-C to USB-A cable, user documentation, Streamlabs Ultra redeem code
