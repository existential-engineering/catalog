details: |-
  4-channel high-end digital mixer.

  Loaded with an amazing array of features and jawdropping effects, the DJM-800 gives you freedom of creativity and digital control at your fingertips. The DJM-800 is a powerful 4 channel 96 kHz / 24 bit digital mixer that’s complemented by 61 assignable MIDI control channels. It features ' Harmonic Mixing ’, a landmark innovation that detects a track’s key and automatically aligns it to the closest true key, removing inaccuracies created when adjusting the pitch. The DJM-800 displays a wide variety of effects , such as ‘filter’, ‘sweep’ and ‘crush’ effects through a highpass/lowpass filter, notch filter and bit crusher effect for all line channels. The effects automatically detect the BPM of the music and sync to the beats . In conjunction with the additional Digital Beat Effects , 50 combinations of effects are possible. The DJM-800 has a high rigid chassis for minimizing unnecessary vibration that could adversely affect sound quality. It also incorporates a dual-shield structure for eliminating entry of digital noise and a high performance power supply.
specs: |-
  - 4-channel high-end digital mixer
