description: The Pro-Mod Series continues upon Charvel's storied legacy of
  innovative excellence in high-performance guitar design, offering the latest
  technology and top-notch features that modern players need. An instrument
  designed for high-speed playing with scorching sound and grin-inducing
  performance.
details: |-
  The Pro-Mod San Dimas Style 1 HH FR RW pairs an alder San Dimas Style 1 body with a gloss Pharaohs Gold finish (also offered in Satin Ferrari Red). The bolt-on maple neck features graphite reinforcement, a hand-rubbed satin urethane finish, and a Speed Neck profile with rolled fingerboard edges. A rosewood fingerboard with a 12"-16" compound radius hosts 22 jumbo frets with white dot position markers, anchored by a Floyd Rose 1000 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics center on a Seymour Duncan JB TB-4 bridge humbucker and a Seymour Duncan '59 SH-1N neck humbucker in black, routed through a 3-position blade switch with coil-split capability via a push/pull volume control, plus a no-load tone control.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo with a locking tremolo arm, Charvel-branded die-cast tuning machines, a Floyd Rose retainer bar string tree, knurled flat-top control knobs, and a black switch tip in a black hardware finish. The licensed Fender Stratocaster headstock, 4-bolt serialized neck plate, and heel-mount truss rod adjustment wheel complete the build.
