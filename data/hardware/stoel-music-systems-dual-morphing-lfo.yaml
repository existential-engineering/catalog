description: A Eurorack module featuring two multi-waveform voltage-controlled
  LFOs with cross-modulation, each offering saw, square, triangle, sine, and
  combination waveforms up to about 120Hz.
details: |-
  The Stoel Music Systems Dual Morphing LFO features a pair of multi-waveform voltage-controlled LFOs with cross-modulation, allowing for a wide variety of rhythmic phenomena and happy accidents. The speed of each LFO is controllable with CV. If the CV jacks are unused, the sine output of each LFO goes to the CV control of the opposite LFO. This routing arrangement allows the output of one LFO to modulate the speed of the other. This routing is overridden by plugging a cable into the CV jack, allowing an external CV signal to be applied. The maximum frequency is approximately 120Hz. Each LFO has saw, square, triangle, and sine wave outputs. Additionally, each LFO has a sine minus saw waveform and a sine minus square waveform. These unique waveforms create additional sound design possibilities. The shape of the saw wave can be modified using the shape control. At the lowest setting, there is the expected saw wave. As the shape control is increased, another saw peak is added at the zero crossing of the original saw waveform. At the maximum setting of the knob, the frequency of the saw waveform is effectively doubled by the addition of this peak. This modified saw waveform is used in the sine minus saw output as well. The shape control does not affect the other waveforms (sine, triangle, square, and sine minus square). All Stoel Music Systems modules feature aluminum front panels with a durable high-gloss white finish. For a crisp appearance and exceptional durability, the front panel markings are digitally printed at high-resolution with UV-cured ink. Mounting holes are plated to significantly reduce screw rash. The power connection features polarity protection to prevent accidental damage to the module if it is connected backward. Each module includes a 12" long 10-pin to 16-pin ribbon cable compatible with the Eurorack standard, M3 mounting screws, and a complimentary sticker. Technical Specifications

  Width
  16 HP

  Depth
  21 mm

  Current Draw
  +12V: 40mA, -12V: 45mA, +5V: 0mA
specs: |-
  - Two multi-waveform LFO in a single unit
  - Each LFO can be cross modulated with each other
  - Maximum frequency is 120 Hz
  - Can be used as an oscillator but it does not track 1V/oct
  - Has a wide variety of rhythmic phenomena and happy accidents
