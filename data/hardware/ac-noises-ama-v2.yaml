description: "AMA V.2 pairs a gently modulated and oscillating spring reverb with a bit crusher placed after it, a second-generation revision of AC noises' best-selling pedal."
details: |-
  AMA is an Italian verb which means "love" in second person imperative (tu, ama! = you, love!). The first version of this effect pedal was released in early 2018 and it quickly became the top seller of the AC noises catalogue. During the consecutive two years, the AMA has been chosen by many alternative, post-rock, shoegaze and ambient artists and it has been featured on the gear encyclopedia "Pedal Crush" in late 2019.

  This new version (simply marked as V.2) is the result of the feedback received from all around the world during the past two years, created for sonic adventurers who love a gently modulated and oscillating spring reverb in front of a bit crusher.

  The AMA V.2 offers up to 4 control parameters for the reverb (OSC, MIX, REVERB and RAMP) and 2 for the re-worked and now more musical bit crusher, which is still placed after the reverb (RESOLUTION and SAMPLE RATE).

  Another new feature offered by this version is an expression input connected to the sample rate, which bypasses the knob and controls the frequency cut using an external expression pedal (10k value recommended).
specs: |-
  - OSC: sets how much oscillation is heard on the reverb tail, from none to self-oscillation
  - MIX: controls the balance between the dry and wet signal
  - REVERB: controls the decay length
  - RAMP footswitch: tied to the reverb oscillator, its speed depends on the OSC knob setting
  - CRUSH toggle switch engages the bit crusher circuit placed after the reverb
  - RESOLUTION: the amount of the oscillation pulse
  - SAMPLE RATE: bit crusher internal oscillation frequency
  - Internal trimmer controls the bit crusher gate
  - Expression input connected to the sample rate (10k expression pedal recommended)
  - Switching system: true bypass managed by soft switch and programmed relay
  - Power: 9V center negative
  - Current draw: 100mA minimum
