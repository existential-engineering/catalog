description: >
  Get ready to meet a different kind of Brute. A drum machine with attitude, DrumBrute Impact is an addictively fun, instantly satisfying beat maker with a beefy, unique sound.
details: |-
  Drumbrute impact is an analog drum machine designed for musicians and producers seeking raw power and distinctive sonic character. It features 10 high-energy, refined, punchy analog sounds including a chest-pounding kick, two face-slapping snares, hi and low toms, a zingy cymbal, searing hats, a massive fm synth sound, and a cowbell. The machine delivers a beefy, unique sound with an instantly satisfying beat-making experience in a compact form factor.

  The color sound-shaping system allows unique per-instrument effects that can be activated per instrument or per step for additional tonal control. Users can boost harmonic content, add drive, snap, or crack at the touch of a button, and automate tonal changes by creating color sequences. The built-in distortion on the output provides drum-optimized crunch, with the ability to bypass it when not needed, while the main output features specially voiced distortion for adding character to the overall mix.

  The intuitive sequencer shares the same architecture as the original drumbrute and allows users to easily create patterns using step and accent buttons or record them in real-time from the pads. The polyrhythm feature enables changing pattern length per instrument, the looper adds glitchy beat-repeats, and the roller provides per-instrument drum fills. Users can create up to 16 full songs by chaining saved patterns, perfect for creating live sets, and add unpredictable variations to patterns available per instrument or globally.

  The device offers extensive connectivity and sync options including MIDI, clock (1pps, 2ppq, din24, din48), and USB for synchronization with external gear, vintage sequencers, modular synths, korg volcas, and daws. A 3.5mm headphone output allows for independent monitoring with the metronome removed from the main output, while four additional individual audio outputs enable routing of kick, snares, hi hats, or fm sound separately for post-processing and creative control.

  The touch strip enables real-time glitchy beat-repeat breakdowns, while a dedicated random knob adds unpredictable variations to single instruments or entire patterns. The swing feature provides syncopation and groove control, and the machine is designed for tactile, instant analog satisfaction without computer screens or sub-menus. Drumbrute impact delivers a massive sound with effortless workflow and amazing performance controls for both studio and live performance applications.
specs: |-
  - 10 pure analog sounds
  - 64 patterns with up to 64 steps each
  - Separate accent per drum
  - Color sound-shaping per instrument
  - Built-in distortion on output
  - Polyrhythm feature
  - Looper with beat-repeats
  - Roller for drum fills
  - 16 full songs via pattern chaining
  - Random variations per instrument or globally
  - 3.5mm headphone output
  - 4 individual audio outputs (kick, snares, hi hats, fm sound)
  - Touch strip for real-time glitchy beat-repeats
  - Swing feature
  - MIDI sync
  - Clock sync (1pps, 2ppq, din24, din48)
  - USB connectivity
  - Vintage sequencer sync
  - Modular synth sync
  - Korg volcas sync
  - DAW sync
  - Electromechanical relay true bypass
  - Analog dry path
  - Dimensions: 13.5 x 9.6 x 2.2 inches (342 x 243 x 57mm)
  - Weight: 4 lbs (1.84 kg)
