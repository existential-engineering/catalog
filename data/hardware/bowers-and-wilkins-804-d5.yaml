description: The 804 D5 brings reference-quality 800 Series Diamond performance
  to a more conventional floorstanding loudspeaker design.
details: |-
  The 804 D5 is a three-way vented-box floorstanding loudspeaker that brings 800 Series Diamond performance to a more conventional tower format and a smaller footprint. It is a passive design driven from an external amplifier, with a recommended amplifier power of 50W to 200W into 8 ohms and no mains connection of its own.

  It carries the Bowers & Wilkins Diamond dome tweeter in the Solid Body Tweeter-on-Top housing, a 130mm Continuum cone FST midrange located in an all-new aluminium midrange enclosure, and two 165mm Aerofoil bass drive units rigidly mounted within the reverse-wrap cabinet. Unlike the larger 803 D5, it does not use the separate Turbine Head midrange enclosure.

  The cabinet uses an upgraded Matrix bracing design with aluminium Space Frame Bracing and an all-new aluminium top section, which Bowers & Wilkins says reduces resonance and creates a more spacious and immersive soundstage. Other listed technical features are an anti-resonance plug, Biomimetic Suspension, Aerofoil bass cones and Flowport.

  The speaker is stabilised on an upgraded plinth with tuned-mass damping. It stands 1101mm tall including the tweeter and plinth, is 308mm wide across the plinth and 392mm deep including grille and terminals, and weighs 40.3kg. Quoted sensitivity is 89dB with a nominal impedance of 8 ohms, minimum 3.0 ohms.

  Finishes are Stealth Black, Warm White, Light Walnut and Dark Walnut with matching Leather by Connolly trim; grilles are black on Stealth Black and Dark Walnut and grey on Warm White and Light Walnut.
specs: |-
  - Description: 3-way vented-box system
  - Technical features: Diamond dome tweeter, Solid Body Tweeter-on-Top, Continuum cone FST midrange, anti-resonance plug, Biomimetic Suspension, Matrix, Aerofoil bass cones, Flowport
  - Drive units: 1x 25mm (1in) Diamond dome high-frequency, 1x 130mm (5in) Continuum cone FST midrange, 2x 165mm (6.5in) Aerofoil bass
  - Frequency range: -6dB 20Hz to 35kHz
  - Frequency response: 19Hz to 24kHz (+/-3dB from reference axis)
  - Sensitivity: 89dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 90Hz to 20kHz, less than 0.3% 120Hz to 8kHz
  - Nominal impedance: 8 ohms (minimum 3.0 ohms)
  - Recommended amplifier power: 50W to 200W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Dimensions: Height 1101mm (43.3in) including tweeter and plinth, Width 238mm (9.4in) cabinet only or 308mm (12.1in) including plinth, Depth 337mm (13.3in) cabinet only or 392mm (15.4in) including grille and terminals
  - Net weight: 40.3kg (88.7lbs)
  - Cabinet finishes: Stealth Black, Warm White, Light Walnut, Dark Walnut
  - Grille finishes: Black (Stealth Black and Dark Walnut), Grey (Warm White and Light Walnut)
