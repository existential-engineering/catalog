description: Multi-tool for Labor.
details: |-
  This mki x es.EDU Labor add-on, featuring the oscilloscope, the voltmeter, the spectrometer and the tuner, turns the Labor into a self-contained electronics development and experimentation station.

  The Labor Scope is intended for use exclusively with the Labor platform, and other applications or modifications may lead to permanent damage of the instrument. The device requires meticulous installation and attentive use and storage, so the enclosed user manual should be reviewed completely before installation and use, and its instructions followed precisely.

  The 3-channel oscilloscope offers two channel inputs on a female connector, with the third channel hard wired to the audio output of the Labor. A Lissajous curves visualizer sits alongside it.

  Measurement tools round out the add-on: a voltmeter with a 10V range and 0.1V accuracy, a spectrometer with configurable representation, and a chromatic tuner.
specs: |-
  - 3-channel oscilloscope, two channel inputs on a female connector and a third channel hard wired to the Labor audio output
  - Lissajous curves visualizer
  - Voltmeter, 10V range, 0.1V accuracy
  - Spectrometer with configurable representation
  - Chromatic tuner
  - For use exclusively with the mki x es.EDU Labor
