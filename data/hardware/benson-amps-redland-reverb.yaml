description: Vast range of tones, simple controls.
details: |-
  Available as 15W (6V6) or 35W (6L6) versions in head or 1x12 combo
  configurations. Unique tone stack drawing inspiration from Dumble and Peavey
  designs. Bass control provides a sizable scoop affecting 100Hz–1kHz. Treble uses
  a steeper 12dB/octave rolloff.

  Built with point-to-point construction, Soursound transformers, and Jupiter Yellow
  capacitors. Handmade in Portland, OR.
specs: |-
  - Power: 15W (2x6V6) or 35W (2x6L6), variable from 0.5W–15W or 1W–35W
  - Tubes: 2x12AX7, 1x12DW7 (reverb driver), 6L6GC (voltage regulator)
  - Speaker outputs: 1x 8 ohm, 1x 16 ohm
  - Controls: Volume, Wattage, Reverb, Bass, Treble
  - Construction: point-to-point, Soursound transformers, Jupiter Yellow capacitors, 12dB/octave treble rolloff
  - Dimensions (15W combo): 23.5"W x 17.5"H x 10"D, 39 lbs
  - Dimensions (35W combo): 23.5"W x 17.5"H x 10"D, 44 lbs
  - Dimensions (15W head): 21"W x 11"H x 8.5"D, 21 lbs
  - Dimensions (35W head): 21"W x 11"H x 8.5"D, 27 lbs
