details: |-
  Digital media player

  Pioneer is breaking new ground in the DJ market once again with the launch of the DMP-555. This is the world‘s first digital media player that combines the immediacy of MP3 with established CD technology and the emerging Secure Digital (SD) standard. Regarded as "the new vinyl" by Pioneer, the compact and portable SD Card is quickly becoming the globally preferred medium for high-capacity digital music storage. 

  The DMP-555 is Pioneer‘s response to the demand of DJs to utilise digital audio available from the Internet. In recognising this, Pioneer is introducing a CDJ player that‘s complemented with new software capable of CD ripping and managing compressed audio files, such as MP3.
