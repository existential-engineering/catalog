description: Don't be fooled by its small size. The SRM150 is big on features
  and sound quality. Featuring a built-in three-channel mixer and Mackie's
  powerful 3-band EQ giving you full tonal control of the output.
details: |-
  By combining Mackie's proven mixer technology with our equally renowned SRM speaker technology, we've created a powerful, compact, great-sounding PA system that is affordable, versatile and expandable. Featuring a 150W Class-D amplifier and 5.25" full-range neodymium driver, the SRM150 provides extremely high output performance and fidelity.

  The SRM150 can even be mounted on a mic stand, making it the ideal personal monitor.
specs: |-
  - 150-watts Class-D power amplifier
  - 5.25" premium full-range neodymium driver
  - Frequency Response: 100Hz to 17.5kHz
  - Maximum SPL: 120 dB @ 1 meter
  - 3-channel mixer with 3-band active EQ
  - Built-in limiter for system protection
  - Impact-resistant polypropylene enclosure
  - Integral aluminum heat sink
