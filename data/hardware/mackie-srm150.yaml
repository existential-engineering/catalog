description: The ultra compact SRM150 Compact Powered PA is great as a personal stage monitor that easily mounts to a mic stand.
details: |-
  Combining Mackie's mixer technology with SRM speaker technology, the SRM150 is a compact PA system that is affordable, versatile and expandable. A 150W Class-D amplifier drives a 5.25" full-range neodymium driver for high output and fidelity from a very small cabinet.

  The built-in 3-channel mixer carries two high-headroom Mackie mic/line preamps with switchable 48V phantom power, an instrument-ready input on channel 1 that needs no DI, and a dedicated stereo channel on RCA connectors for keyboards or media players. A 3-band active EQ gives tonal control over the output.

  The rear panel adds a combo Main In for linking or adding inputs and a male XLR Thru with a mic/line switch for chaining further SRM150s or sending to a main PA. Complete system protection with a built-in limiter keeps things safe.

  A built-in top carry handle, integral aluminium heat sink and an impact-resistant polypropylene enclosure make it portable, and the mic stand integration system lets it mount on a stand or boom as a personal monitor.
specs: |-
  - 150W peak / 100W rated Class-D power amplifier
  - 5.25" / 134 mm full-range neodymium driver with 1.0" voice coil
  - Frequency response: 100 Hz - 17.5 kHz
  - Maximum SPL: 120 dB peak at 1 m (110 dB long-term)
  - 3-channel mixer with 3-band active EQ (100 Hz, 2.5 kHz, 12 kHz, +/-15 dB)
  - Two Mackie mic/line preamps on XLR/TRS combo connectors with global 48V phantom power
  - Instrument switch on channel 1 for high-impedance sources, no DI required
  - Channel 3 stereo RCA input for keyboards or media players
  - Rear combo Main In accepting balanced XLR or 1/4" TRS
  - Male XLR Thru output with mic/line switch (-30 dB mic level pad)
  - Complete system protection with built-in limiter and auto-reset amplifier shutdown
  - Universal power supply 100-240 VAC, 50-60 Hz, 3-pin IEC connector
  - Impact-resistant polypropylene enclosure, grey textured finish, weather-resistant perforated metal grille
  - Integral aluminium heat sink and built-in top carry handle
  - Mic stand mountable via the supplied adapter
  - Dimensions (H x W x D): 8.0 x 11.2 x 6.8 in / 203 x 284 x 173 mm
  - Weight: 7.6 lb / 3.4 kg
