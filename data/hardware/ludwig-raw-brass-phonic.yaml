description: >-
  An unplated brass-shell snare drum that delivers the warm tonal qualities of
  the Black Beauty with added dry response. As organic in looks as it is in
  sound.
details: |-
  The Raw Brass Phonic features a 1mm seamless brass shell left unplated for a natural, organic appearance that develops a unique patina over time. Tonally it sits in the Black Beauty family but with added dry response from the bare brass surface.

  Available in 5x14", 6.5x14", and 8x14" sizes (LB484R designation).
specs: |-
  - 1mm seamless brass shell (unplated)
  - Raw brass natural finish
  - 2.3mm steel triple flanged hoops
  - 10 lugs
  - P88AC throw off
  - P35P butt plate
  - Ludwig Weather Master medium coated batter head
  - Ludwig Weather Master clear snare-side head
  - Available sizes: 5x14", 6.5x14", 8x14"
  - LB484R — Raw Brass Phonic
