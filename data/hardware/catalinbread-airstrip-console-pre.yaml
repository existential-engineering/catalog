description: The Trident A-Range console dominated the UK recording scene in the
  late '60s to early '80s, due in part to just how good it made things sound.
  The heart of the beast consists of a discrete
  germanium-and-transformer-equipped preamp that can be adjusted to suit all
  tastes, from the tones of Lou Reed to the fuzzy freakouts of Frank Zappa.
details: |-
  The Airstrip is a stompbox-sized console preamp inspired by the legendary Trident A-Range mixing console, which dominated UK recording studios from the late 1960s through the early 1980s. The circuit is built around a discrete germanium-and-transformer-equipped preamp designed to deliver the warmth and character of those classic consoles.

  At the heart of the overdrive section is a discrete op-amp based on a vintage UREI design, which pushes the front end of the console circuit into blissful gain when engaged. This allows the Airstrip to cover territory from pristine clean boosts to full-on collapsing fuzz textures.

  A tasteful treble filter on the back end sets the luminosity of the preamp to suit any rig, while a specially-selected transformer adds a touch of iron to the signal path, contributing harmonic richness and saturation associated with transformer-coupled console designs.

  The Airstrip is capable of producing every gain sound imaginable, from warm clean boosts to gnarly collapsing fuzz, putting the sound of a classic mixing desk on your pedalboard. It operates on standard 9V power but can also run at 24V for additional headroom.
specs: |-
  - Power source: center-negative DC power supply, 9 to 24 volts (higher voltage gives more headroom, volume and clarity)
  - Controls: Push, Volume, Filter, Trim
  - Discrete germanium-and-transformer-equipped console preamp circuit
  - Discrete op-amp front end based on a vintage UREI design
