description: The Vintage Ultra is a bass overdrive preamp and DI pedal, a
  tribute to legendary rock sounds. It delivers warm tube-like tones with a
  natural dynamic response echoing vintage tube amps and reel-to-reel tape
  machines, with a 4-band EQ, switchable cab-sim, and XLR DI.
details: |-
  The Vintage Ultra is Darkglass's tribute to some of the most legendary sounds in rock history, built as a bass overdrive preamp and DI pedal. It provides warm tube-like tones with a natural dynamic response that echoes the organic compression of old tube amps and reel-to-reel tape machines.

  A four-band equalizer with six selectable mid frequencies shapes the tone, and Attack and Grunt toggle switches control the high- and low-frequency saturation. A master volume sets the overall level, and a dedicated footswitch engages the overdrive section independently of the preamp.

  For connectivity, the Vintage Ultra carries an XLR output with switchable cabinet simulation, a headphone output with IR cab-sim, and an aux input for practicing along with backing tracks.
specs: |-
  - Bass overdrive preamp/DI pedal (Vintage voicing)
  - Four-band equalizer with six selectable mid frequencies
  - Attack and Grunt toggle switches for high- and low-frequency saturation
  - Master volume for overall level
  - Dedicated footswitch engages the overdrive independently
  - XLR output with switchable cab sim
  - Headphone output with IR cab sim
  - Aux In jack for backing tracks
