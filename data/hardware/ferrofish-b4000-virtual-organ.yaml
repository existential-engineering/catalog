details: |-
  The B4000+ packs the legendary Hammond B3 organ into an ultra compact box. Nobody would build a guitar without a neck because it simply does not work without one, which is why the B4000+ carries nine drawbars, there to be touched, tweaked and above all played.

  It is based on one of the best and most powerful digital signal processors on the market, the Sharc DSP from Analog Devices. The sound and the warmth of the B3 are recreated down to the last detail, including all the electrical and mechanical shortcomings that made the instrument a legend.

  The result is a real organ with a voluminous bass belly, defined mids and the necessary scream in the highs, the authentic sound of a living electromechanical B3.

  The B4000+ simulates all 91 tonewheels, with crosstalk and mechanical wear where wanted. All of it is fully polyphonic, with scanner vibrato, tube amplifier and reverb, and of course the legendary Leslie, each simulated and voiced.

  Three fully polyphonic manuals (Upper, Lower and a MIDI foot pedal) can be played at the same time over two MIDI inputs with key split, and the effect processor covers rotor (Leslie), chorus, amp simulation, vibrato and reverb. The panel carries nine drawbars, six metal endless encoders and a colour TFT display in a solid metal housing.
specs: |-
  - Nine drawbar manual
  - Three fully polyphonic manuals: Upper, Lower and Pedal (MIDI foot pedal)
  - All three manuals playable at the same time
  - Effect processor with rotor (Leslie), chorus, amp simulation, vibrato and reverb
  - Colour TFT display
  - Factory and user presets
  - USB connection (MIDI to host)
  - 2 x MIDI In
  - MIDI key split
  - 6.3 mm jack input for a swell pedal
  - 6.3 mm jack input for rotor slow and fast
  - Also controllable over aftertouch and modulation wheel
  - Audio and headphone output
  - 6 metal endless encoder pots
  - Solid metal housing
  - Dimensions 24.1 cm x 17.8 cm x 6.1 cm
  - Shipping weight 3 kg
