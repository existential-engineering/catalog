description: Level up with the DDJ-XP2 add-on DJ controller for rekordbox and
  Serato DJ Pro. No matter which DJ application you’re used to, this DJ hardware
  will enable you to get more out of it than ever before. This DDJ-XP1 evolution
  adds to the functionality of the original, without sacrificing the intuitive
  layout and solid build quality. Its sturdy construction and non-slip rubber
  surround mean you can hit it as hard as you want during performances. The
  DDJ-XP2 enhances your setup with 32 robust, multicolored Performance Pads, and
  puts powerful pad modes at your fingertips. Assign transport controls like
  play, pause, cue, and pitch up/down to the pads with Transport mode. Use 16
  pads to control a single mode (a first for Serato DJ Pro). Trigger Silent Cue
  to soundlessly cue up tracks with the faders open on the mixer. Then instantly
  trigger them from Hot Cue points. And feel confident and in control during DJ
  performances thanks to the looping controls of our DJM-S9 flagship scratch
  mixer.
