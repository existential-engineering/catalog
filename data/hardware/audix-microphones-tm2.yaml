details: |-
  The TM2 is an Integrated Ear-Simulator (coupler) specifically designed for test and measurement in the professional sound industry.

  Ear simulator "couplers" are the measurement devices used by manufacturers of IEMs for capturing key metrics during research and development, final production and quality control of IEMs. Using patent-pending technology, the TM2 incorporates these features into an integrated compact package that is ideally suited for sound and studio engineers who want a simple, yet effective way to test IEM performance.

  Monitor engineers are often faced with questions from performers regarding the functionality of their IEMs with no reliably consistent method to test them in their environment. With the TM2 and readily available measurement software such as Rational Acoustic's SMAART or Studio Six Digital's Audio Tools, a monitor engineer can easily confirm the functionality of each performer's IEMs as part of a pre-show checklist.
