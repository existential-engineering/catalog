id: l39RNIvK7-iYVi61iW9oH
name: Buddy
manufacturer: bastl-instruments
primaryCategory: mixer
categories:
  - utility
url: https://bastl-instruments.com/eurorack/modules/buddy
description: A 5HP Eurorack stereo mixer with preamp optimized for hybrid
  setups. Channels A and B are DC-coupled Eurorack-level inputs (×2/+6dB).
  Channels C and D are AC-coupled line-level inputs (×10/+20dB) accepting stereo
  TRS or dual mono. All four channels sum to a stereo output with soft Zener
  clipping. Chainable via back-panel jumpers.
details: |-
  Buddy is a compact 5HP stereo mixer with preamp designed for hybrid studio setups where both Eurorack-level and line-level signals need to coexist in the same mix.

  Channels A and B are optimized for Eurorack signals: DC coupled, 100kΩ input impedance, ×2/+6dB gain. Each channel has two mono inputs (left normalized to right). Channels C and D target line-level sources such as drum machines and synthesizers: AC coupled, 10kΩ input impedance, ×10/+20dB gain, each accepting a stereo TRS or dual mono TS 3.5mm jack. Solder jumpers on C and D allow DC coupling conversion.

  All four channels sum to a stereo output with 1kΩ output impedance and soft Zener clipping at 10Vpp on the mixdown stage. NE5532 op-amps provide low-noise performance. Back-panel jumpers allow chaining multiple units for expanded mixing.
