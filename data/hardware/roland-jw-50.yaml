description: >-
  The Roland JW-50 is an early 1990s music workstation that combines an SC-55 Sound Canvas
  synthesizer module with an integrated 16-track sequencer. It features 128 General MIDI
  sounds and drumkits along with MT-32 sound variations, a 61-key velocity-sensitive
  keyboard with aftertouch, and dual effects processing. Designed as an all-in-one music
  production tool, it offered an accessible workflow for composing and arranging complete
  songs.
details: |-
  The JW-50 appeared in the early 1990s as a physically large and relatively expensive workstation from Roland. It essentially packaged the SC-55 Sound Canvas module architecture with full sequencing capabilities during a period when Roland was producing numerous Sound Canvas variants. By the time of its launch, the Sound Canvas sound engine was considered somewhat dated for professional studio work, but it remained a capable tool for General MIDI composition and arrangement.

  The sound engine provided 128 GM sounds and drumkits alongside MT-32 sound variations that expanded the sonic palette beyond standard General MIDI. While editing was limited to the common eight GM parameters, the MT-32 sounds offered users a broader range of tones to work with. Effects processing included reverb or delay and chorus or flanger, with good quality but limited to only two simultaneous effects, which proved insufficient for some musical styles.

  The 16-track sequencer was a strong point of the JW-50. Creating a song was as straightforward as selecting a MIDI channel and instrument, hitting record, and playing. Standard sequencer functions included quantizing, transposition, and a microscope editor for detailed note editing. The microscope editor also allowed users to alter sounds using NRPN events, and individual drums from the drumkits could be transposed. Voice count was restricted to 24 voices, with some sounds consuming two voices, which sometimes required careful management of note lengths to prevent voice stealing.
specs: |-
  - Polyphony: 24 voices
  - Multitimbral: 16 parts
  - Oscillators: Fixed (1 or 2 depending on instrument)
  - Waveforms: General MIDI
  - Filter: GM cutoff and resonance
  - LFO: GM vibrato
  - Envelope: GM attack, decay, release
  - Effects: Reverb/delay and chorus/flanger (2 simultaneous)
  - Sequencer: 16-track
  - Keyboard: 61 keys, velocity-sensitive with aftertouch
  - Memory: 128 preset, 128 user
  - Control: MIDI I/O
releaseDate: "1992"
