description: "- Modified Drive Circuit - Tight Bass, Searing Sustain!"
details: |-
  The Red Dirt Germanium is a further modification of the Red Dirt platform, aimed at heavy saturation and classic amp tones with tight bass and long sustain.

  The modification came out of work on the drive circuit that produced variable gain across different parts of the frequency response, an approach the maker says he had not seen used this way in a Tube Screamer type circuit. Because the bass is given a different gain rate, the low end stays tight and forceful while the midrange and highs carry the sustain and saturation. The pedal still cleans up with the volume control despite having more gain available.

  The Red Dirt line began as a search for a classic drive sound with more versatility, combining the earlier Mod Plus and Baked modified-pedal circuits with refinements from Keeley's custom pedal line. A Keeley-designed FET input stage gives it a tube-like breakup, dynamic response and enough clarity to cut through a dense mix while keeping a full midrange. Units are hand-built in the USA with premium components.
