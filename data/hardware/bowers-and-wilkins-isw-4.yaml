description: A pair of 200mm long-throw drivers deliver extended bass from a
  discreet in-wall subwoofer.
details: |-
  Need big sound, slamming bass and audiophile bass extension, but don't want to see where it comes from? Then the ISW-4 in-wall subwoofer is the product for you. Its two long-throw 200mm drivers allow the ISW-4 to move the large volumes of air needed for high-quality low-frequency output, while it is nicely hidden away inside a wall.

  The ISW-4 is designed both for home theatre installations and to augment the bass performance of full-range speakers in two-channel audio systems. It ships in three cartons: the driver panel with its wall frame, grille, cut-out template, paint mask and gasket, the Back Box with its brackets, gasket roll and fixings, and the CDA-4D amplifier, whose own connections are covered by a separate manual.

  Installation begins before the wall is plastered or boarded. The Back Box is designed to sit between two adjacent studs on standard 40cm (16in) spacing with a noggin directly above it and the driver aperture at the bottom, or to be built into brick or blockwork like a window frame, in which case a lintel is required because the box is not designed to carry the weight of the wall above.

  The cable from the CDA-4D amplifier is routed through the wall and into the Back Box through its cable entry gland, leaving around 20cm (8in) free. Inside the box, 15mm of insulation is stripped from the cable and it is connected to the spring-loaded connection terminals on the rear of the driver panel.

  The 27.5L braced MDF Back Box measures 1,406 x 345 x 86mm and weighs 9.6kg. The driver panel adds 6.4kg behind a 494 x 264 x 21mm baffle needing a 485 x 255mm cut-out. Frame and grille are semi-matt white and paintable.
specs: |-
  - Description: in-wall subwoofer, passive, with closed-box Back Box
  - Drive units: 2x ø200mm (8in) Paper / Aramid Fibre cone long-throw bass
  - Nominal impedance: 8 ohms (minimum 6.3 ohms)
  - Power rating: 250W
  - Frequency response (-3dB): 25Hz to 222Hz
  - Frequency range (-6dB): 19Hz to 400Hz
  - Baffle dimensions: Height 494mm (19.5in), Width 264mm (10.4in), Depth 21mm (0.8in)
  - Cut-out size: Height 485mm (19.1in), Width 255mm (10.0in)
  - Baffle net weight: 6.4kg (14.1lb)
  - Frame / grille finish: semi-matt white (paintable)
  - Back Box: closed-box subwoofer, MDF, braced
  - Back Box dimensions: Height 1,406mm (55.4in), Width 345mm (13.6in), Depth 86mm (3.4in)
  - Back Box volume: 27.5L
  - Back Box net weight: 9.6kg (21.2lb)
  - Amplifier (mandatory): CDA-4D compact distribution amplifier
  - Connection: spring-loaded terminals on the rear of the driver panel, bare wire (15mm strip)
  - Passive in-wall subwoofer, with no built-in amplifier and no mains inlet of its own
  - Amplifier (mandatory): CDA-4D compact distribution amplifier, which is the unit connected to the mains supply
  - Nominal impedance 8 ohms (minimum 6.3 ohms), power rating 250W
