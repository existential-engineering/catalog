description: Need big sound, slamming bass and audiophile bass extension, but
  don't want to see where it comes from? Then the new ISW-4 in-wall subwoofer is
  the product for you. Its two long-throw 200mm drivers allows the ISW-4 to move
  large volumes of air needed for high-quality low-frequency output, but is
  nicely hidden away inside a wall.
details: |-
  ISW-4 is an in-wall subwoofer built around two long-throw 200mm (8in) paper/Aramid fibre cone drivers on a single driver panel, loaded by a dedicated closed-box Back Box that is built into the wall behind it. The Back Box is not optional packaging: the manual states that it defines the subwoofer's acoustic loading and must be used for correct operation.

  It is a passive subwoofer. Nominal impedance is 8 ohms with a 6.3 ohm minimum, the power rating is 250W, and the information sheet lists the CDA-4D compact distribution amplifier under 'Amplifier (mandatory)'. Nothing on the product amplifies, equalises or level-matches anything: the manual points the reader at the matching amplifier's own manual for operation and connections, and there is no mains inlet, line input or control of any kind on the subwoofer itself.

  The published performance is 25Hz to 222Hz at -3dB with a -6dB range of 19Hz to 400Hz. The visible driver panel is 494mm (19.5in) high by 264mm (10.4in) wide and weighs 6.4kg (14.1lb), sitting in a 485mm (19.1in) by 255mm (10.0in) cut-out, while the Back Box behind it is a tall 1,406mm (55.4in) by 345mm (13.6in) by 86mm (3.4in) braced MDF enclosure of 27.5 litres weighing 9.6kg (21.2lb).

  Installation runs in five stages and is meant to happen before the wall is finished. The Back Box is bracketed between wall studs on standard 40cm (16in) spacing with a noggin directly above it and the driver aperture at the bottom, or built into brick or blockwork like a window frame with a lintel carrying the load above. The cable from the CDA-4D is routed through the wall into the Back Box via its cable entry gland, the box is covered with sheetrock and plaster-skimmed, and the Wall Frame is then secured flush to the plaster with dog clamps.

  Only at the last stage is the driver panel fitted. Fifteen millimetres of insulation is stripped from the connecting cable inside the Back Box and the conductors go into the spring-loaded connection terminals on the rear of the driver panel, positive to red and negative to black, before the panel is bolted flat into the wall frame with six bolts and the grille is push-fitted into the slot between the panel and the frame. The drive units create stray magnetic fields, so Bowers & Wilkins recommends keeping magnetically sensitive items at least 0.5m (20in) away; LCD and plasma screens are unaffected.
specs: |-
  - Description: in-wall subwoofer
  - Drive units: 2x 200mm (8in) Paper/Aramid Fibre cone long-throw bass drivers
  - Nominal impedance: 8 ohms (minimum 6.3 ohms)
  - Power rating: 250W
  - Frequency response (-3dB): 25Hz - 222Hz
  - Frequency range (-6dB): 19Hz - 400Hz
  - Amplifier (mandatory): CDA-4D compact distribution amplifier
  - Passive: no on-board amplifier, no mains inlet, no line-level input
  - Connection: spring-loaded terminals on the rear of the driver panel, red positive and black negative, 15mm (0.6in) of insulation stripped
  - Baffle dimensions: 494mm (19.5in) height x 264mm (10.4in) width x 21mm (0.8in) depth
  - Cut-out size: 485mm (19.1in) height x 255mm (10.0in) width
  - Baffle net weight: 6.4kg (14.1lb)
  - Frame/grille finish: semi-matt white (paintable)
  - Back Box: closed-box subwoofer enclosure, 1,406mm (55.4in) height x 345mm (13.6in) width x 86mm (3.4in) depth
  - Back Box material: MDF, braced; internal volume 27.5L; net weight 9.6kg (21.2lb)
  - Back Box is mandatory: it defines the acoustic loading and must be used for correct operation
  - Installation: drywall (stud) construction on 40cm (16in) stud spacing with a noggin above, or solid brick/blockwork with a lintel
  - Supplied with the driver panel: wall frame, grille, cut-out template, adhesive B&W logo, paint mask, 6x M5 bolts, frame gasket
  - Stray magnetic fields: keep magnetically sensitive items at least 0.5m (20in) away; LCD and plasma screens unaffected
  - Finish: White
