translations:
  ja:
    details: |-
      こちらはDIYビルダー向けの基板と部品のフルセットとなっております。

      制作難易度: ★☆☆☆☆
      DIYビギナーの方でも比較的製作が簡単なモジュールです。
      ※注意点: [写真2]のようにジャックのグランドピンを斜めに曲げて取り付けます。

      SWTは3IN/1OUTのルーティングセレクターが2系統備わったシンプルなユーティリティモジュールです。

      マニュアル操作の3WAYスイッチで3つの入力のうちどれを出力させるかを切り替えることができ、オーディオ/CV/GATEなど信号のルーティングセレクターとして使うことができます。
      3つのインプットジャックがトグルスイッチの上中下に対応し、選択されているポジションの信号が白い丸で囲われたOUTPUTジャックから出力されます。
      パッシブですのでIN/OUTを逆に接続し1IN/3OUTのOUTPUTセレクターとしても使用可能です。

      Size: 2HP
      Depth: 13mm
      Power: ----
