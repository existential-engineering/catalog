details: |-
  This is a full set of PCB and parts for DIY builders. Assembly difficulty: ★☆☆☆☆

  SWT is a simple utility module carrying two 3-in/1-out routing selectors. A manual 3-way switch selects which of the three inputs is sent to the output, so it can be used as a routing selector for audio, CV or gate signals. The three input jacks correspond to the up, middle and down positions of the toggle switch, and the signal at the selected position leaves the output jack ringed in white. Because it is passive, IN and OUT can be reversed to use it as a 1-in/3-out output selector.

  Size: 2HP
  Depth: 13mm
  Power: no power required
