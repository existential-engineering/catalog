details: |-
  The 9000 Series are DW's most advanced cymbal stands, used by more top professionals than any other. The 9000 stands feature drummer-friendly Toothless Tilters with TechLock for infinite adjustment and secure positioning, and the patented Cymbal Seat Adjustment for adjusting cymbal movement and quickly locking in place.

  The convertible design lets the stand be played in either a boom or a straight position, and hinged memory locks set or reset stand heights quickly to the right height every time.

  Hinged memory locks and heavy-gauge tubing make these stands road-worthy and reliable beyond compare.

  Trusted by today's best drummers, DW's flagship hardware line is loaded with cutting-edge innovations for superb performance and durability. The 9000 Series sets the standard for drummers who demand the best.
specs: |-
  - Convertible boom or straight position
  - Toothless Tilter with TechLock Handle
  - Cymbal Seat Adjustment (U.S. Patent No. 4889028)
  - Integrated cymbal seat and wingnut felt
  - Hinged memory locks
  - Plastic tube insulators
  - Heavy-gauge tubing
