details: |-
  Create the juiciest beats and tastiest rhythms with nanobox | razzmatazz, a mini drum sequencer that combines powerful FM synthesis and sampling. Featuring advanced voice architecture, razzmatazz puts a huge range of percussive sounds at your fingertips, from deep and gritty kick drums to searing snare hits and crisp hi-hats. Perform using 8 touchscreen pads or a MIDI controller, and craft up to 16 rhythms with an innovative visual sequencer that shows all pad states and steps simultaneously.

  Shape the sound of each pad by combining two FM oscillators and a WAV file, plus two filters, two envelopes, a resonator, a snap generator, and three additional effects (delay, reverb, and cabinet distortion), with four distinct types of distortion available. Record via line input to create samples up to 30 seconds long, load custom WAV files from a microSD card, and use internal resampling, modulation automation, and Looping Clips or Sliced WAVs on any pad.

  razzmatazz integrates with other synths, drum machines, and audio devices via mini TRS MIDI in/out and mini TRS line in/out, and MIDI controls can be quickly mapped to macro parameters and mixer settings. The compact, nearly indestructible 3.75" x 3" x 1.5" design goes anywhere and is powered over USB-C.
specs: |-
  - Includes 120 presets and 112 wave files
  - 8 pads, each supporting 2 FM oscillators plus 1 WAV file
  - Visual stepper sequencer: 16 rhythms, up to 64 steps, step sizes from 1/64 to 8 bars
  - Per-pad sound shaping: 2 filters, 2 envelopes, resonator, snap transient generator, bit crushing, rate crushing
  - 4 types of distortion, plus delay, reverb, and cabinet distortion effects
  - Sample memory per WAV: 30 seconds
  - Record via line input to create custom pad samples
  - Internal resampling, adjustable per-pad pitch, Looping Clips and Sliced WAVs
  - microSD card slot for custom WAV files
  - Power: USB-C connection, 5V, 500mA
  - USB-C power connector can also receive MIDI
  - 3.5mm audio input and output
  - Maximum input and output level: 2Vrms
  - DAC and ADC resolution: 24-bit
  - Internal resolution: 32-bit
  - Sample rate: 48kHz
  - MIDI Input: 3.5mm Type A/B auto sensing
  - MIDI Output: 3.5mm, Type A or Type B selectable
  - Clock Input: 1, 2, 4, 8, 12, or 24 PPQ selectable
  - MIDI support: Program Change, Note On/Off, Velocity, Pressure, Mod Wheel, assignable CCs, and clock
  - H x W x D: 1.5" x 3.75" x 3"
  - Weight: 0.25 lbs
