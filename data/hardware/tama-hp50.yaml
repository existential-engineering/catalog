description: While super complex and technical playing can wow audiences,
  sometimes a simpler and stripped down approach is even more moving. Sometimes,
  eliminating everything but the most essential can produce greater creativity
  and boosts interaction between players and audiences.
details: |-
  Smooth Surface Footboard: The newly designed classic style footboard features lightweight construction and smooth surface, making it a great choice for any drumming style.

  Center Strike Height Adjust: By simply loosening the square head bolt of the side pillar, you can change the height of the beater shaft. This makes it possible to have the beater strike the center of the bass drum without using a bass drum lifter or adjusting the length of the beater.

  Easy Access Spring Adjustment: This unique Easy Adjust Spring Post allows you to adjust the spring tension while still sitting on the drum throne because of its top mounted construction. This means you can adjust the tension while actually checking the resulting feel simultaneously.

  The Classic Beater: This unique Easy Adjust Spring Post allows you to adjust the spring tension while still sitting on the drum throne because of its top mounted construction. This means you can adjust the tension while actually checking the resulting feel simultaneously.

  Individual Adjustment of Beater & Footboard Angle: Using a drum key, you can adjust the beater angle as desired. Also, by changing the chain position on the sprocket, you can adjust the footboard angle independently of the beater angle.

  Easy-Tight Hoop Clamp: We set the screw to tighten the hoop clamp on the outside of the pedal frame, making it quick and easy to set and remove.
