details: |-
  Hughes & Kettner's all-analog Spirit Tone Generator is now available in a compact pedal format. AmpMan Modern´s two distinctive channels each embody an entire era of legendary guitar tones, served up by the built-in 50-watt power amp or the integrated Red Box AE+. With connoisseur tone-shaping capabilities, impressive power and a comprehensive set of professional features in a handsome little box, AmpMan is the go-to solution on stage, at home and in the studio.

  Making the most of every square meter inside the chassis, AmpMan is as small as it needs to be yet big enough to hold a treasure-trove of tech, features and sound. On top of that, it's a real powerhouse with plenty of juice to rock even a 4 × 12″ speaker cab.

  All that musical might comes courtesy of the specially developed Ultra Response power amp. Cranking out up to 50 watts of deliciously dynamic power, its punch and feel rivals that of any similarly rated tube power amp. It sends every single watt to the speaker with that spine-tingling dynamic response intact and translated into impressive sound pressure. And the Ultra Response power amp stays true to its musical character even at an all-out roar.
specs: |-
  - Channels: 2 (Clean & Classic Distortion)
  - Power: 50 Watts
  - Special: Noise Gate (for each channel)
  - Control: Master, Volume, Sagging, Presence, Resonance, Tone, Gain (for each channel)
  - Red Box AE+: 8 different Cabs
  - Pre Amp: Spirit Technology
  - Power Amp: 50 watts @ 4 Ohms, 25 watts @ 8 Ohms, 12.5 watts @ 16 Ohms
  - Footswitch: Solo, FX Loop, Boost, Channel A/B
  - Dimensions: 250 x 52 x 153 mm, Weight 1,150 g
  - Input: 6.3 mm jack
  - Speaker Out: 4-16 Ohm
  - Effects Loop: Send / Return
  - Red Box AE+ (with Ambience Emulation) XLRm Out
  - Phones / Line Jack: 3.5 mm stereo, 50 Ohms
  - Aux Input: 3.5 mm stereo
