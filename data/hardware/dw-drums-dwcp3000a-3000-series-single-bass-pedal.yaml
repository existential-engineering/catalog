description: Offers drummer-friendly features, legendary reliability, and unmistakable feel.
details: |-
  For over 50 years, DW has been the worldwide leader in hardware innovation. Every DW product launch has been followed with tireless innovation and the 3000 Series is no exception. The 3000 Series pedal offers innovative features and enhanced player functionality making it a smart, versatile choice for drummers of all skill levels and playing styles.

  This all-metal, dual-chain single pedal has been updated with an Accelerator cam, adjustable footboard angle, and swivel toe clamp. The steel base plate also now features an anti-skid rubber mat for greater stability.

  All-metal construction: DW design, precision, and durability for any drummer. Dual-Chain Accelerator Drive System: Increases velocity throughout the length of your pedal stroke.

  Two-Way DW 101 Beater: This reversible beater also features adjustable shaft weight. Bearing Spring Rocker Assembly: A dual-bearing rocker allows the spring to follow the motion of each stroke.
specs: |-
  - Dual-Chain Accelerator Drive System
  - Delta stroke adjustment with ball bearing and detachable spring
  - Swivel toe clamp
  - Two-Way DW101 beater with memory lock
  - Steel base plate with anti-skid rubber mat and included drum key
