description: 12x6 Digital Zone Processor for commercial audio applications with
  advanced signal processing and Ethernet control.
details: |-
  The ZonePRO 1260 is a digital zone processor designed for commercial audio installations. It features 12 inputs and 6 outputs with Ethernet control capability, providing comprehensive signal processing and routing functionality. The unit combines sophisticated input processing with advanced output optimization tools for system performance.

  Input capabilities include selectable mic/line channels, RCA inputs, and S/PDIF connectivity with microphone preamps offering 30-60dB gain and phantom power. Processing features encompass parametric EQ, compression, limiting, noise gating, notch filtering, and the proprietary AutoWarmth function co-developed with JBL. The routing module enables primary source selection, source ducking for paging, and priority override functionality.

  Output processing tools include bandpass and crossover filters, limiting, and delay capabilities for system optimization. Control options range from wall-mounted zone controllers to advanced system control via ZonePRO Designer software, featuring a built-in real-time clock for programmable daily or weekly scheduling. The unit supports RS-232 and Ethernet connectivity for flexible system integration.
specs: |-
  - 12 inputs: 2 switchable mic/line (Euroblock), 8 RCA, 1 S/PDIF
  - 6 analog outputs (Euroblock connectors)
  - Mic preamp gain: 30-60dB
  - Mic preamp EIN: <-118dB
  - 15V phantom power
  - Max input: +20dBu mic/line, +12dBu RCA
  - Max output: +20dBu
  - Sample rate: 48kHz
  - A/D dynamic range: >113dB line, >110dB unweighted
  - D/A dynamic range: 112dB A-weighted, 109dB unweighted
  - THD+Noise: 0.003% typical at +4dBu, 1kHz
  - Frequency response: 20Hz-20kHz, ±0.5dB
  - Interchannel crosstalk: >80dB typical
  - Propagation delay: 0.6 msec
  - Advanced Feedback Suppression (AFS)
  - AutoWarmth function
  - Auto Gain Control, Compression, Limiting
  - Parametric EQ, Notch filtering, Bandpass/Crossover filters
  - Security lockout, Wall panel control, RS-232 control
  - Ethernet connectivity with ZonePRO Designer software
  - Built-in real-time clock for scheduling
  - Operating voltage: 100-240 VAC, 50/60Hz
  - Power consumption: 27W
  - Dimensions: 1.75"H x 5.75"D x 19"W
  - Weight: 6.8 lbs (3.1 kg)
