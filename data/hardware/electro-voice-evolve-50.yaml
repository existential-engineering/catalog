name: EVOLVE 50
manufacturer: electro-voice
primaryCategory: speaker
categories:
  - subwoofer
url: https://products.electrovoice.com/na/en/evolve-50/
description: The EVOLVE 50 is a portable powered column-array PA system
  combining a 12-inch subwoofer, a detachable column loudspeaker with eight
  3.5-inch neodymium drivers, and a connector pole into a clean, compact
  package. A 1000 W Class-D amplifier (500 W LF + 500 W HF) drives the system to
  127 dB maximum SPL with 120deg horizontal x 40deg asymmetrical vertical
  coverage, while QuickSmart DSP delivers four factory presets (Music, Live,
  Speech, Club), three-band EQ, output delay, and five user-programmable presets
  through a single-knob LCD interface. Built-in Bluetooth supports both
  high-quality audio streaming and wireless control of up to six EVOLVE systems
  simultaneously via the EV QuickSmart Mobile app. Available in black or white.
details: >-
  Three-piece portable column array: 12-inch powered subwoofer, eight 3.5-inch
  driver column, and connector pole


  1000 W total Class-D amplification (500 W LF + 500 W HF)


  127 dB maximum SPL


  120deg horizontal x 40deg asymmetrical vertical coverage


  Frequency response 43 Hz - 20 kHz (-3 dB)


  QuickSmart DSP with single-knob LCD interface


  Four factory presets: Music, Live, Speech, Club


  Five user-programmable presets with store and recall


  Three-band EQ, output delay, and switchable +15 V phantom power


  Built-in Bluetooth for high-quality wireless audio streaming


  Wireless control of up to six EVOLVE systems via EV QuickSmart Mobile app


  Two XLR/TRS combo inputs, 3.5 mm stereo input, and stereo RCA input


  XLR Thru and XLR Mix outputs


  Available in black or white finishes


  Total system weight approximately 60 lb
