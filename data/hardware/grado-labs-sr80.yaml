  - Operating Principle: Open Air
  - Frequency Response: 20 Hz - 20 kHz
  - SPL 1mW: 98 dB
  - Nominal Impedance: 38 ohms
  - Driver Matched dB: 0.1 dB
  - Driver Size: 44 mm
  - Cushions: F Cushions
  - Headband: Standard assembly with padded synthetic headstrap
  - Cable Type: Bronze (fixed)
  - Source Connection: 3.5 mm (1/4-inch adapter included)
