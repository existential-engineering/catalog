description: Open-back, on-ear dynamic headphones from Grado's Classic Series,
  positioned as 'The New Classic.' Features a 44mm X2 dynamic driver delivering
  greater immediacy, presence, and tighter bass response than the SR60.
details: |-
  The SR80 is positioned as 'The New Classic' from Grado's Classic Series. It features a 44mm X2 dynamic driver with a Mylar diaphragm and rare earth magnetic system.

  Compared to the SR60, the SR80 delivers greater immediacy and presence with tighter bass response, offering improved balance and clarity while maintaining the brand's signature lively character.

  The headphones use a standard headband assembly with a padded synthetic headstrap, ship with F cushions, and include a fixed Bronze cable terminated in a 3.5mm plug with an attached 1/4-inch adapter.
specs: |-
