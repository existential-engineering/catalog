details: |-
  African Blackwood boasts greater stiffness, hardness, and density than Brazilian Rosewood. As Brazilian Rosewood becomes increasingly scarce, African Blackwood is widely recognised as a true alternative. Its deep, chocolate-like hues and intricate grain patterns deliver exceptional tonal clarity, powerful projection, and rich resonance. As one of the few builders pioneering its use, Lowden makes this tonewood a signature choice.

  The 50 Series is Lowden's premium line, built exclusively from Master Grade tonewoods and exploring the limits of tonal and aesthetic refinement. The buyer chooses both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The African Blackwood back and sides can be paired with Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, or Sinker Redwood soundboards.

  Every 50 Series guitar is hand built in Ireland. Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 50 Series
  - Back and sides: African Blackwood
  - Soundboard options: Red Cedar, Sitka Spruce, Lutz Spruce, Alpine Spruce, Adirondack Spruce, Sinker Redwood
  - Body shapes: O (Orchestra), F, S, WL
  - Tonewood grade: Master Grade
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
