description: A compact 8HP touch controller for expressive CV and 1V/Oct
  control, built on the Electrosmith Daisy Seed and programmed in C++ for
  precision and low-latency performance.
details: |-
  The [i] is a 8HP Eurorack CV controller built on the Electrosmith Daisy Seed and programmed in C++ for precision and low-latency performance. It combines tactile control with musical intelligence, making it a versatile source of melodic or modulation CV.

  At its core is a 12-point capacitive touch strip, allowing direct finger interaction to set pitch or CV values. Each touch position corresponds to a note or voltage step, with a clear LED display showing the active point in real time.

  The module offers flexible output modes via the Scale knob: Off (free CV mode) outputs raw CV proportional to touch position, Chromatic quantizes to semitones across the octave, and Major / Minor quantize to diatonic scales, with Root Key selection via a dedicated knob.

  To shape the output response, the Attack and Decay knobs provide slew limiting, transforming abrupt changes into expressive glides or envelopes.

  The [i] bridges performance and control, functioning equally well as a melodic controller, modulation source, or experimental gesture interface.
specs: |-
  - Width: 8HP
  - Depth: 31mm
  - Power Consumption: +12V=58mA, -12V=60mA, +5V=0mA
  - Built on the Daisy Seed platform using C++
  - 12-point capacitive touch controller with LED feedback
  - Selectable output modes: CV, Chromatic, Major, Minor
  - Root key selection for scale quantization
  - Attack and Decay controls for slew/glide shaping
  - Switchable CV or 1V/Oct output for melodic integration
  - Front-panel controls: Scale, Root Key, Slew Attack, Slew Release
