description: The HV-35 Anniversary Edition is a limited run of 100 individually
  numbered HV-35 microphone preamplifier modules in API 500 series compatible
  format, finished in champagne-gold anodizing with a 25 Year logo. It keeps the
  HV-35 feature set, including continuously variable gain, a front panel
  instrument input and a selectable ribbon microphone path.
details: |-
  The HV-35 Anniversary Edition marks the company's 25th anniversary and its 2019 induction into the NAMM Technology Hall of Fame. Production is limited to 100 individually numbered units, each with a champagne-gold anodized finish and a 25 Year logo, hand-signed by John La Grou and the Millennia team.

  Electrically it is the HV-35, a single channel microphone preamplifier in API 500 series compatible format that draws its audio connections and power from the host rack. Gain is continuously variable from 14.5 dB to 60 dB, dropping to 1 dB with the pad engaged, and the DC coupled ribbon microphone setting adds a 10 dB boost for a 70 dB maximum.

  The front panel carries an instrument input, an 80 Hz rolloff filter, a 15 dB pad, polarity flip and 48V phantom power, with phantom supplied by the 500 series rack. Frequency response runs from below 10 Hz to above 200 kHz at the -3 dB points, equivalent input noise is -130 dB, and total harmonic distortion plus noise is typically under 0.001 percent.

  The module measures 1.5 inches wide by 5.25 inches high by 6 inches deep and ships at 2 pounds. Rated operating range is 0 to +40 degrees C at 10 to 80 percent relative humidity up to 3,000 meters.
specs: |-
  - Minimum Gain: 14.5 dB, 1dB with Pad
  - Maximum Gain (continuously variable): 60 dB (70 dB in Ribbon Mode)
  - Frequency Response (-3 dB): < 10 Hz to > 200 kHz, typical -1.0 dB @ 10 Hz, typical -1.5 dB @ 200 kHz
  - Noise (60 dBu Gain, 10 Hz - 30 kHz, Inputs common): -130 dB EIN
  - Total Harmonic Distortion + Noise (35 dB Gain, 10 Hz - 20 kHz bandwidth, +24 dBu Out): < .003%, Typical < .001%
  - Intermodulation Distortion (50 Hz & 7 kHz, 35 dB Gain): < .0006% +12 dBu Out, < .001% +20 dBu Out
  - Phase Response (35 dB Gain, 50 Hz - 20 kHz bandwidth, +27 dBu Out): < 2 degrees deviation
  - Common Mode Rejection Ratio (35 dB Gain, 10 Hz - 20 kHz bandwidth, 100 mV C.M.): > 65 dB, Typ > 85 dB
  - Slew Rate (35 dB Gain, +24 dBu Out): > 25 Volts per microsecond
  - Maximum Input Level (20 Hz - 40 kHz): +12dBu @ 0.02% THD+N, +18dBu @ 0.02% THD+N with pad
  - Maximum Output Level (1 kHz @ 35dB of gain): THD+N < 0.001% at +26dBu output, < 0.05% at +28 dBu output
  - Phantom Input Impedance (1 kHz): 2,210 ohms
  - Output Impedance: 24.3 Ohms (x2)
  - Phantom Powering: provided by 500 rack
  - Dimensions/Shipping Weight: 1.5" W x 5.25" H x 6" D, 2 lbs.
  - Environmental: 0 to +40 C / +32 to +104 F, 10% to 80% RH, maximum altitude 3,000 meters
