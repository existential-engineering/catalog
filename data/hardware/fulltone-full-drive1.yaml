description: A simplified overdrive pedal recreating the sound of a late 90s to
  early 2000s Fulldrive without the boost channel, offering Volume, Tone, and
  Drive controls with Flat-Mids, Vintage, and Comp-Cut clipping modes.
details: |-
  Yes it's true, finally the sound of a late 90s to early 2000s Fulldrive with-OUT the boost channel! Simple as it comes... with Volume, Tone, Drive, and toggle bringing back the Flat-Mids (FM), Vintage, and the infamous (for assaulting the front end of tube amps) Comp-Cut (CC) modes. Simple True-Bypass switching, 9-18 volt operation. No need to find and pay $400-$600 for a 90's FD2 anymore. Soundwise? I'm talking about the exact (full midrange) Comp-Cut that was in the earliest FD2s, not the Flatter mids CC in later models. So even though the FD-1 will have the Flat-Mids mode, the Comp-Cut is the fuller-mids version identical to the "pre FM / pre-MOSFET" versions of the FD2. This tiny pedal is the size of our Mas-Malo, with top-mounted (also called rear mounted) jacks & power port, and a JRC4558 chip for your go-to overdrive sound. Come home. Size: 4.8" x 2.9" x 2.35"
