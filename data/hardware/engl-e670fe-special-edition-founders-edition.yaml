url: https://www.engl-amps.com/shop/heads/engl-e670fe-special-edition-founders-edition/
description: Five-channel 100 W all-valve guitar amplifier head with nine
  voicing options, three valve-buffered FX loops, reverb, a footswitchable noise
  gate and MIDI control, hand-built in Germany.
details: |-
  ENGL Amplifiers is proud to announce the launch of the Special Edition Founders Edition E670FE, an amplifier that takes high-gain tone to the next level.

  The E670FE Special Edition Founders Edition is a 100-watt, all-tube head that delivers a massive range of tones, from crystal-clear cleans to searing high-gain distortion. It features five channels, nine voicings, and a host of other features that make it one of the most versatile amplifiers on the market.

  The E670FE Special Edition Founders Edition is hand-built in Germany using only the finest components and materials. It features a stunning black finish with chrome knobs and an aggressive red illumination.

  The five channels (Clean, Crunch, Lead I, Lead II and Tubedriver) run into three valve-buffered FX loops, of which FX Loop I and FX Loop II are variable from serial to parallel, and the noise gate threshold is footswitchable. Nine sound-shaping options cover Gain Boost, Hi Gain, Mid Shift, Contour, Bright, Mid Edge, Modern Classic, Mega Lo Punch and Depth Boost.

  Control comes over MIDI In and MIDI Thru, the S.A.C. port and a dual footswitch jack, while the rear panel adds the noise gate threshold, both FX loop balance controls and the Tube Driver EQ. The 100 watts come from four 6L6 or EL34 output valves and five ECC83 (12AX7) preamp valves.
specs: |-
  - Five channels: Clean, Crunch, Lead I, Lead II, Tubedriver
  - All-valve head
  - Three valve-buffered FX loops (serial FX loop; FX Loop I and FX Loop II variable from serial to parallel)
  - Noise gate with footswitchable threshold
  - Power valve monitor
  - MIDI In / MIDI Thru / S.A.C. port / dual footswitch jack
  - Line output
  - Sound shaping options: Gain Boost, Hi Gain, Mid Shift, Contour, Bright, Mid Edge, Modern Classic, Mega Lo Punch, Depth Boost
  - Controls: Gain (per channel), Bass/Middle/Treble (Clean, Crunch), Bass/Middle/Treble (Lead I, Lead II), Reverb, Volume (per channel), Presence A and B, Master A and B
  - Rear controls: noise gate threshold, FX Loop I balance, FX Loop II balance, Tube Driver EQ
  - Outputs: 1 x 4 ohm, 2 x 8 ohm, 1 x 8 ohm, 2 x 16 ohm, 1 x 16 ohm
  - Preamp valves: 5 x ECC83 (12AX7)
  - Output valves: 4 x 6L6 or 4 x EL34
  - Output power: 100 W
  - Handcrafted in Germany
  - Dimensions: 71 x 27 x 29 cm
  - Weight: 22.5 kg
