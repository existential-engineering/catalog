description: Four-deck DJ controller with built-in DJ mixer and USB audio
  interface that works with or without a computer.
details: |-
  N4 is a four-deck DJ controller with a built-in DJ mixer and USB audio interface. The integrated mixer lets you connect two external sources plus two microphones, so the unit works with or without a computer. Large touch-sensitive control wheels and high-resolution 14-bit MIDI provide tight control and response.

  The built-in professional USB audio interface has balanced XLR outputs for a solid connection to virtually any sound system, and enables USB recording of all analog and digital sources. N4 ships with Serato DJ Intro and a 4-deck version of Virtual DJ LE software, and includes dedicated video controls.
specs: |-
  - Four-deck software control with loop and effects controls
  - Integrated DJ mixer supporting two external sources plus two microphones
  - Built-in professional USB audio interface with balanced XLR outputs
  - Large touch-sensitive control wheels
  - High-resolution 14-bit MIDI
  - Pitch fader with key-lock control per deck
  - Dedicated video controls
  - Class Compliant (Mac OS X, iOS, Windows 98SE and up)
  - USB recording of all sources
  - Sample Rate: 44.1 kHz
  - Bit Depth: 16-bit
  - SNR Balanced Outputs (XLR): > 89 dB (A-weighted)
  - SNR Unbalanced Outputs (Line, RCA): > 89 dB (A-weighted)
  - SNR Unbalanced Outputs (Booth, RCA): > 89 dB (A-weighted)
  - SNR Headphone Outputs (1/8", 1/4"): > 99 dB (A-weighted)
  - THD+N Balanced Outputs (XLR): < 0.008%
  - THD+N Unbalanced Outputs (RCA): < 0.008%
  - THD+N Headphone Outputs (1/8", 1/4"): < 0.02%
  - Frequency Response: 20 Hz - 20 kHz (+/- 1.5 dB)
  - Power: 12V DC, 2A, center-positive
  - Dimensions (LxWxH): 22.5" x 12" x 2.4" (571.5mm x 304.8mm x 61mm)
  - Weight: 7 lbs (3.2 kg)
  - Includes: Serato DJ Intro, 4-Deck Virtual DJ LE, USB Cable, Power Supply, Quick Start Guide
