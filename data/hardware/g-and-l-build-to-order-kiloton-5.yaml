details: |-
  What happens when you pack Leo Fender's potent Magnetic Field Design bass humbucker into the sleek shape of his SB-2? The G&L Kiloton: explosive power that's easy to handle.

  Kiloton's silhouette is the most comfortable bass body ever created by Leo. It's compact and pure, with every curve and contour perfectly executed. And now it's carrying more firepower than ever, with Leo's G&L Magnetic Field Design humbucker placed right in the sweet spot he specified back when the sign over the door still read CLF Research.

  Kiloton's single MFD humbucker fires without the aid of a preamp, while a 3-position series/split/parallel toggle harnesses the coils' power. Simple volume and tone controls are devastatingly effective, revealing a wide range of textures Leo's MFD humbucker is famous for. What's more, Kiloton is armed with a 6-bolt neck and Leo Fender-designed Saddle-Lock bridge to transfer all the energy right into the body end-grain for an incredibly resonant instrument.

  Kiloton is a force of nature, wrought from Leo's elements and ready for impact.

  Made in Leo Fender's historic G&L facility on Fender Avenue in Fullerton, California, the Kiloton is available with a wide range of custom options including body and neck woods, body and neck finishes, neck profiles and pickguard materials.
specs: |-
  - Strings: 5
  - Construction: bolt-on, 6-bolt neck
  - Scale: 34"
  - Pickup: Leo Fender-designed G&L MFD humbucker
  - Electronics: 3-way series/split/parallel mini toggle, volume, tone
  - Body wood: Alder on Standard and all solid finishes, Swamp Ash on all Premier finishes
  - Neck wood: Hard-Rock Maple with choice of Maple or Rosewood fingerboard
  - Neck profile: G&L 1 1/2" Medium C with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L Ultra-Lite with aluminum tapered string posts
  - Bridge: Leo Fender-designed G&L Saddle-Lock with chrome-plated brass saddles
  - Includes: G&L Deluxe Gig Bag
  - Custom options: body and neck woods, body and neck finishes, neck profiles, pickguard materials
