url: https://blackstaramps.com/cv30/
description: Signature 6L6 driven combo designed with Carmen Vandenberg.
details: |-
  Designed with Carmen Vandenberg. Carmen Vandenberg. One of the most exciting guitarists in the world. Her band, Bones UK, has been Grammy nominated and supported the likes of KORN and Rage Against the Machine. She also co-wrote the Jeff Beck album Loud Hailer. In 2019 Carmen visited Blackstar's headquarters in the UK and worked closely with our engineers to create an amp designed for her blend of riff-heavy rock and roll and industrial blues tones.

  Incredible 6L6 Valve Tone. The CV30's unique 6L6 design carefully optimises the key power amplifier parameters resulting in outstanding dynamics normally associated with a USA 6L6 design, whilst adding the chime and shimmer of a classic British Class A amplifier.

  Perfect Pedal Platform. Carmen is renowned for creating huge soundscapes with an array of different pedals. The CV30 has been meticulously designed to accommodate this and be the ideal canvass for pedals.
specs: |-
  - Power: 30W
  - Preamp Valves: 2x ECC83
  - Output Valves: 2x 6L6
  - Speaker: 12" Celestion V-Type
  - Channels: 2
  - Voices: American Clean, British Clean, Classic Overdrive, Modern Overdrive
  - EQ: Channel 1: Tone - Channel 2: Bass, Middle, Treble, ISF
  - Patented ISF: Yes (Channel 2)
  - Reverb: Yes (Dark and Light)
  - Speaker Emulated Output: Yes
  - Effects Loop: Yes (Series)
  - Footswitch: Yes (Included 2-Way footswitch)
  - Weight: 22.5kg
  - Dimensions: 690 x 540 x 260 (mm)
