  - groovebox
url: https://sonicware.jp/products/liven-xfm
description: LIVEN XFM is a compact FM synthesizer built for live performance,
  with four FM synth engines (4 operators, 16 algorithms), 6-voice polyphony,
  and a 4-track step sequencer. Its X-LAB, XFORM, X-LFO and LIBRARY tools make
  deep FM programming fast and hands-on.
details: |-
  LIVEN XFM is a compact synth equipped with live performance focused features, four FM synth engines, and a 4-track step sequencer.

  This product does not include an AC adapter. If you need one, please select the "With PSU" option.
specs: |-
  - Sound Source: 4 operators - 16 algorithms FM synth engine (X-LAB, XFORM, X-LFO, LIBRARY)
  - Max. number of simultaneous sounds: 6 voices
  - Sound memory: 512 (16 x 32 banks)
  - Sequencer: 4 tracks, up to 64 steps, 128 patterns, Swing
  - I/O : MIDI IN/OUT, SYNC IN/OUT, LINE IN/OUT , headphone out
  - Size : 11.7 inch (W) x 6.92 inch (D) x 1.89 inch (H), 297mm (W) x 176mm (D) x 48mm (H)
  - Weight : 1.74lb., 790g
  - Accessories: Overlay sheet for sound edit, Warranty
  - Power supply: AA batteries x 6, or 9V DC output AC adapter (1A or higher, EIAJ3 standard inner diameter 1.7mm outer diameter 4.75mm, center +) *The AC adapter is not included.
