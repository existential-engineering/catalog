details: |-
  The Amphion One12 is a two-way passive nearfield studio monitor handmade in Finland. It uses a 1" titanium tweeter paired with a 4½" aluminum woofer, crossed over at 1600 Hz, and features a passive radiator design for natural bass loading without the colorations of a ported enclosure.

  Amphion's DSP-free acoustic purity philosophy means the One12 operates without any digital signal processing in the signal path, preserving the electrical clarity of the source signal. The point-source sound design, combined with a time-aligned driver arrangement via a waveguide, yields precise phase coherence and pinpoint stereo imaging.

  The One12 is optimized for extreme-nearfield placement — positioning the monitor very close to the listening position effectively removes room acoustics from the equation, making it practical for professional mixing in acoustically untreated or variable environments, as well as on-the-go production setups.

  Even dispersion and consistent performance at low monitoring levels are core design goals, allowing reliable mixing decisions without needing to push volume. The monitor's 84 dB sensitivity and 8 Ω impedance make it compatible with a wide range of power amplifiers, with a recommended power range of 50–200 W.

  The One12 is a passive speaker requiring an external amplifier — Amphion pairs it with the Amp700 power amplifier. The cabinet measures 260 × 132 × 220 mm and weighs 5 kg.
specs: |-
  - Operating Principle: Two-way, passive radiator
  - Tweeter: 1" titanium
  - Woofer: 4½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 8 Ω
  - Sensitivity: 84 dB @ 2.83V/1m
  - Frequency Response: 78–20,000 Hz ±3dB
  - Power Recommendation: 50–200 W
  - Dimensions (H×W×D): 260×132×220 mm
  - Weight: 5 kg (11 lbs)
  - Manufacturing: Handmade in Finland
