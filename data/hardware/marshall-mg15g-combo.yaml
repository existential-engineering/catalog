description: The MG15G is a compact 15W solid-state guitar combo amplifier built around an 8" custom speaker. Two split channels (Clean and Overdrive) let players move between sparkling cleans and crunchy distortion without extra pedals, while a 3-band EQ (Bass, Middle, Treble) shapes the tone. A 3.5mm Aux input lets you jam along with music from a phone or laptop, and a 3.5mm headphone output enables silent practice at home.
details: |-
  A compact 15W amp that packs plenty of power. The 8-inch speaker delivers a great sound for practice but can also hold its own in front of a small crowd. The MG15G Combo brings an added punch and lower end to your sound, and its variety of tonal options are sure to complement any style.

  Thanks to the emulated speaker output on the headphone jack, silent practice and direct recording are easier than ever. The MP3 / line in lets you play along to your favourite songs.

  One amp, two channels. The MG15 lets you configure and shift between tones effortlessly, moving between clean and distorted sounds while playing without the need for additional equipment, which is especially useful when exploring diverse musical styles.

  At home, during band practice, or even at small gigs, the MG15's compact and portable design is tailored for spontaneous music sessions in any setting.

  Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Output wattage: 15W
  - Technology: solid state
  - Channels: 2 (split, clean and overdrive)
  - Controls: clean volume, channel select button, overdrive gain, overdrive volume, bass, middle, treble
  - Effects: none
  - Effects loop: no
  - Speaker configuration: 1x8"
  - Speaker model: custom speaker
  - Unit impedance: 8 ohm
  - Inputs: 1 x 1/4" jack instrument input, 1 x 3.5 mm aux in
  - Outputs: 1 x 3.5 mm jack headphone out
  - Emulated speaker output on the headphone jack for direct recording and silent practice
  - Weight: 7.6 kg / 16.7 lb
  - Width: 375 mm / 14.8"
