description: The MG15G is a compact 15W solid-state guitar combo amplifier built
  around an 8" custom speaker. Two split channels (Clean and Overdrive) let
  players move between sparkling cleans and crunchy distortion without extra
  pedals, while a 3-band EQ (Bass, Middle, Treble) shapes the tone. A 3.5mm Aux
  input lets you jam along with music from a phone or laptop, and a 3.5mm
  headphone output enables silent practice at home.
