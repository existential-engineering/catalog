description: The Lehle Mono Volume S is an active and wear-free volume pedal
  that is lighter and smaller but no less efficient, using the magnet sensor and
  VCA technology of the other Lehle volume pedals. Its analogue signal path is
  digitally controlled, with a 30 V high-end preamp and MIDI over USB-C.
details: |-
  The Lehle Mono Volume S is an active and wear-free volume pedal that is lighter and smaller than the larger Lehle volume pedals but no less efficient. It uses the same magnet sensor and VCA technology, so the volume of the instrument is controlled precisely, and because there is no mechanical potentiometer the typical noise, expensive repairs and complicated adjustment are avoided.

  The foot moves only the magnet, while the Hall sensor measures the distance with great precision and very fast. An ARM Cortex CPU processes the sensor data in a matching, musical taper and controls the VCA, and the signal path itself is kept completely analogue.

  Over the entire control range the Mono Volume S transmits the full sound spectrum of the connected sound source, and the input and output impedance always stays the same, so unlike with potentiometers there is no damping of higher frequencies. The input voltage coming from the power supply (9 to 15 V) is internally rectified, then filtered, stabilized and transformed to 30 V, achieving a total dynamic range of 120 dB, and the high-end preamp with its discrete Class-A input stage brings out every sound nuance.

  Low-friction bearings of a high-performance polymer bed the shaft gently into the aluminium enclosure and reduce mechanical stress towards zero, so the pedal runs mechanically smooth and steady, and an adjusting screw modifies the tension of the pedal with great precision. Alongside the main output, a second buffered direct output can feed a tuner, a DAW or even a second amp without affecting the sound.

  The boost delivers up to +12 dB more gain with a little extra emphasis (push) in the toe position, and a small button recalls the presets 0 dB, +5 dB and +10 dB. The USB-C socket calibrates, edits and updates the pedal through the free online editor Lehle Verwalter, and sends MIDI data to a DAW, an amp simulation or any hardware device offering a USB host. Compared with the Lehle Mono Volume the weight is reduced by 50 % and the size by 35 %, and the pedal is 2 cm flatter while the pedal range stays the same.
specs: |-
  - Analogue signal path, digital control
  - High-end preamp with discrete Class-A input stage
  - 120 dB dynamic range thanks to 30 V technology
  - Magnetic sensor technology, without mechanical wear
  - Precise volume control from analogue VCA
  - MIDI via USB
  - Future proof via the free online editor Lehle Verwalter
  - Optimised size and weight
  - Supply voltage: 9 to 15 V, internally transformed to 30 V
  - Boost of up to +12 dB with recallable presets of 0 dB, +5 dB and +10 dB
  - Second buffered direct output alongside the main output
  - 50 % lighter and 35 % smaller than the Lehle Mono Volume, and 2 cm flatter with the same pedal range
