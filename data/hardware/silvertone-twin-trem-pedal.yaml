details: |-
  Introducing the TWIN TREM

  The ultimate true analog tremolo guitar effects pedal. The TWIN TREM features two distinct tremolo effects: a Harmonic Trem on the right side and an Optical Trem on the left side, each equipped with independent Speed, Depth, and Volume controls. These tremolos can be used separately as stand-alone effects or combined to create rich, unique, and percussive sounds. Both sides also include LED indicators that visually display their speed, making it easy to sync the two tremolos together. Each effect has its own separate I/O top-mounted jacks, allowing versatile signal routing. Run it like a standard pedal, routing the signal in through the first jack and out through the last. Or route the signal through the Harmonic side first, pass it through a reverb or another effect, and then into the Optical side, preserving the classic placement of optical tremolo after reverb, just like in many amplifiers. This opens up endless possibilities for integrating the TWIN TREM with other effects in a signal chain. With a stereo setup, the right side can run through the Harmonic tremolo, while the left side passes through the Optical. PRICE: $299.00

  TECHNICAL SPECS:
  Input Impedance: 1M
  Output Impedance: 10K
  Power Supply: DC
  Voltage Input: 9V
  Polarity: Center Negative
  Current Draw: 35mA
  Dimensions: 5" x 4.5"
