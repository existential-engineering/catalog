description: The Mackie DRM18S-P is an 18" passive subwoofer with class-leading
  performance and deep low-end for any live sound application.
details: |-
  Add powerful low frequency reinforcement to your DRM passive PA system with the Mackie DRM18S-P passive subwoofer, a professional subwoofer for clubs, venues and DJs. The 18-inch passive subwoofer handles up to 2000W for touring bands, mobile DJs and rental or install applications.

  DRM Series Professional Passive Loudspeakers deliver high-performance sound with the rugged construction and reliability that professional production and install customers demand.

  Custom transducers housed in coated touring-grade plywood cabinets are designed for consistent performance in the most demanding applications.

  Equipped with M10 flypoints, dual angle pole mounts, and available line array configurations, the DRM Series suits clubs, houses of worship and rental systems.
specs: |-
  - 18 in professional passive subwoofer
  - Power handling 500W continuous / 1000W program / 2000W peak (1000 watts RMS, 2000 watts peak)
  - Max SPL 129 dB peak
  - Frequency range 33 Hz - 250 Hz (-10 dB), 40 Hz - 250 Hz (-3 dB)
  - 18 in / 457 mm ferrite woofer
  - Nominal impedance 8 Ohm
  - 1x female speakON input, 1x female speakON thru (parallel)
  - 18 mm plywood enclosure with black polyurea finish, powder-coated 16-18 gauge steel grille
  - M20 threaded pole attachment, M10 flypoints, flyable with the optional FB100 fly bar and FKDRM18S flyware kit
  - Dimensions 23.3 x 23.0 x 31.1 in / 592 x 584 x 790 mm (H x W x D)
  - Weight 75.7 lb / 34.3 kg
