details: |-
  Add powerful, unrelenting low frequency reinforcement to your DRM passive PA system with the Mackie DRM18S-P passive subwoofer. DRM18S-P is a professional subwoofer for clubs, venues, and DJs who need serious, reliable bass.

  We compromised nothing to create a subwoofer that lives up to the DRM Series name. Our 18-inch passive subwoofer handles up to 2000W to deliver spine-tingling subsonic rumble for touring bands, mobile DJs and rental / Install applications.

  Designed for bands, clubs, rehearsal spaces, and houses of worship that require premium low-end sound with unparalleled reliability. Features road-worthy textured cabinet coating and a powder-coated heavy gauge steel grille. Flyable via the optional FB100 Fly Bar and FKDRM18S Flyware Kit, and compatible with the SP260 Loudspeaker Processor.
specs: |-
  - Peak Power: 2000W
  - Continuous / Program / Peak Power Handling: 500W / 1000W / 2000W
  - LF Driver: 18" high-excursion woofer
  - Frequency Response: 33Hz - 250Hz
  - Max SPL: 129 dB
  - Cabinet: 18mm plywood construction
  - Weight: 75.7 lb / 34.3 kg
  - Pole Attachment: M20 threaded
  - Connectors: Parallel speakON inputs (Female speakON with thru connection)
