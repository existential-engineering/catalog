description: Open-back on-ear planar magnetic headphones featuring spacious
  soundstage, ultra-low distortion bass, and fatigue-free listening. The
  open-back evolution of the SINE model.
details: |-
  The SINE DX represents an open-back evolution of Audeze's closed-back SINE model. Open-back design inherently provides spacious acoustics with wider, deeper soundstage characteristics and enhanced air separation between performers.

  The headphones deliver exquisite sound pulling listeners into music's emotional core through ultra-low-distortion, deep driving bass, gorgeous midrange, and refined highs.

  High efficiency at 100dB and 18-ohm impedance enables compatibility with nearly any audio source. The on-ear planar magnetic design optimizes driver performance specifically for open-back configuration.

  This is a legacy product and no longer available for sale.
specs: |-
  - Style: On-ear, open-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm: Ultra-thin Uniforce
  - Transducer size: 80x70 mm
  - Maximum power handling: 1W RMS
  - Maximum SPL: >130dB
  - Frequency response: 10Hz - 50kHz
  - THD: <0.2% @ 100dB
  - Impedance: 18 ohms
  - Sensitivity: 102 dB/1mW (at Drum Reference Point)
  - Minimum power requirement: >100mW
  - Weight: 300g
