description: "The best-selling PRO Series amp. The SVT-3PRO is a hybrid
  tube/solid-state bass amplifier head engineered for flexibility and potency,
  capable of producing stage-shattering sound night after night. Delivers the
  signature fat and warm Ampeg Round Sound in a powerful, flexible, and portable
  2U rackmount package."
details: |-
  Engineered for flexibility and potency, the SVT-3PRO is a hybrid tube/solid-state bass amplifier head capable of producing stage-shattering sound night after night.

  Delivers the signature fat and warm Ampeg Round Sound in a powerful, flexible, and portable 2U rackmount package.

  Variable tube drive control, a 5-position peaking midrange filter, and shelving bass and treble filters provide extensive tone shaping for any style.

  A footswitchable 9-band graphic EQ functions as a second channel, and an onboard variable-ratio compressor (1:1–10:1) helps tame dynamics for stage and studio.
specs: |-
  - Power Output: 450W at 4 ohms / 275W at 8 ohms
  - Hybrid tube/solid-state design
  - Variable tube drive control
  - 5-position peaking midrange filter
  - Shelving bass and treble filters
  - 9-band graphic EQ (footswitchable as second channel)
  - Onboard compressor (1:1 to 10:1)
  - 2U rackmount chassis
  - Weight: 26 lb (11.8 kg)
