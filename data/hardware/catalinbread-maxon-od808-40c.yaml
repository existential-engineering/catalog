description: A limited-edition collaboration between Maxon and Catalinbread
  engineer Nicholas Kula, the OD808-40C applies the 'ODin808' modification to
  the classic Maxon OD808 circuit. The mod delivers a creamy, articulate
  overdrive with enhanced gain and output, a flattened mid-hump, and amp-like
  response that pushes the 808 into distortion territory. Limited to 400
  individually numbered units, each with a signed certificate of authenticity.
details: |-
  The OD808-40C is a limited production run of 400 individually numbered units celebrating the 40th anniversary of the Maxon OD808. Catalinbread engineer Nicholas Kula developed the 'ODin808' modification, which enhances gain and output while flattening the classic 808 mid-hump and improving amp-like response.

  Units 1-40 are hand-signed by Nicholas Kula and include additional upgrades: OPA2134 OpAmp, different drive and tone pot values, and Catalinbread-branded knobs. All 400 units include a signed certificate of authenticity.
