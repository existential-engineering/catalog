description: The DS3 is a 12-fret slope shoulder dreadnought rooted in the
  original oversized Hawaiian guitar shape developed nearly a century ago. The
  bridge placement closer to the center of the lower bout produces an open, airy
  tone with smoothness and warmth not typically found in contemporary 14-fret
  dreadnoughts, handling both flatpicking and fingerstyle playing with
  substantial headroom and dynamic range. Ivoroid binding throughout, an abalone
  rosette, and gold Waverly tuners distinguish it as the flagship of the DS
  series.
details: |-
  The DS3 is the flagship 12-fret slope shoulder dreadnought, drawing on the original dreadnought shape first designed as an oversized Hawaiian guitar almost a century ago. The 12-fret neck join positions the bridge closer to the center of the lower bout, yielding an open, airy tone with smoothness and warmth not typically found in contemporary 14-fret dreadnoughts. Top tonewoods are Sitka spruce over East Indian rosewood back and sides, joined by a Honduran mahogany neck, ebony fingerboard and belly-style bridge. The pre-war scalloped X-brace pattern in Sitka spruce contributes to the guitar's balanced low-end response. Ivoroid binding runs throughout the body, fingerboard, and peghead, with a three-style chevron backstrip and abalone rosette adding visual distinction. Gold Waverly tuners, a tortoise pickguard, and a high-gloss nitrocellulose lacquer body finish complete the package.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony (no inlay)
  - Bridge: Ebony belly-style, 2 3/8" spacing
  - Nut: Bone, 1 13/16"
  - Saddle: Bone, drop-in
  - Tuners: Gold Waverly
  - Bridge Pins/End Pin: Ebony with abalone dot
  - Brace Material: Sitka spruce
  - Brace Pattern: Pre-war scalloped X-brace
  - Neck Profile: Modified V
  - Peghead: Tapered slotted square with volute
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Frets: Medium 18% nickel-silver
  - Fingerboard Binding: 0.060" ivoroid
  - Body Binding: Ivoroid with b/w/b/w/b purfling
  - Peghead Binding: 0.100" ivoroid with b/w purfling
  - Backstrip: 3-style (Chevron)
  - Rosette: Abalone
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Scale Length: 25 1/2"
  - Fingerboard Radius: 14" - 26" compound
  - Body Width: 15 5/8"
  - Body Length: 20 7/8"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/8"
  - Strings: D'Addario EJ-17 (.013" - .056")
