description: >-
  Ensoniq's composer-focused 61-key workstation featuring the innovative Idea Pad MIDI capture
  buffer, onboard drum machine, 16-track sequencer, and three expansion slots for up to 72 MB of
  additional sample content.
details: |-
  The MR-61 was designed with a clear focus on the songwriting process, reflecting Ensoniq's research into how composers actually work. Its standout feature was the Idea Pad, a MIDI capture buffer that continuously recorded keyboard performance including notes and pitch bend data, allowing musicians to experiment freely and then audition or commit their ideas to the sequencer after the fact.

  The 64-voice polyphonic engine delivered sounds through two oscillators per voice with ROM and wavetable waveform sources, processed through dual filters, two LFOs, and three envelope generators. With 1,200 ROM patches and space for 1,200 user patches in RAM, the MR-61 offered a substantial sonic palette that could be further expanded through three dedicated expansion slots, each capable of holding up to 24 MB of additional samples. Notable expansion cards included Perfect Piano, World Sounds, and Urban Dance Project.

  The onboard drum machine provided natural-sounding rhythm patterns with eight variations and fills per style, while the 16-track sequencer offered non-destructive editing with undo capability and a Song Editor for assembling full arrangements from its 50,000-note capacity. The 61-key keyboard responded to both velocity and aftertouch for expressive performance.

  The MR-61 found its way onto notable recordings including Janet Jackson's 1997 album "The Velvet Rope," particularly the hit single "Together Again." However, early units shipped with known OS bugs affecting both general operation and MIDI functionality, which Ensoniq later addressed through an updated OS chip replacement.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Oscillators: 2 per voice (ROM, wavetable)
  - Filters: 2 per voice
  - LFOs: 2
  - Envelopes: 3 (VCA)
  - Keyboard: 61 non-weighted keys with velocity and aftertouch
  - Memory: 1,200 RAM patches, 1,200 ROM patches
  - Sequencer: 16-track, 50,000 note capacity
  - Effects: 4 master effects
  - Expansion: 3 slots (up to 24 MB each)
  - MIDI: In/Out/Thru
