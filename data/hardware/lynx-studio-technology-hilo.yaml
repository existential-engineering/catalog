description: Hilo is a reference AD/DA converter and monitor controller with a
  touchscreen interface, offering 2 in, 6 out independently coupled conversion
  with digital expansion up to 16x16. Real-time meters and analysis tools,
  hyper-flexible routing and monitor control are all saved and recalled on the
  unit itself.
details: |-
  Hilo (pronounced hee-loh) is for professionals who demand the purest audio quality. Engineered to be a true all-in-one device, Hilo offers class-leading AD/DA conversion, built-in metering and analysis, multiple ins and outs, hyper-flexible routing and monitoring control, all easily saved and recalled via touchscreen. The page names mastering with an analog chain, mixing with multiple speakers, location sound recording, voice recording and overdubbing, audiophile listening and archiving as its intended uses.

  Hilo displays real-time, accurate metering and analysis. Dual horizontal, VU analog, all I/O and spectrum analysis cover all tasks. Routing is equally open: set independent input levels, channel modes and mute states for each output, then set unique level offsets for each output.

  Monitoring is one-to-one. Independently level-match the 4x4 selected sources, then globally control them with the master volume. Scenes give device-wide settings recall, so custom scenes can be saved for different tasks and switched through in a click. No extra computer software is needed to change a setting such as sample rate, clock source or trims, since every setting is reachable on the 480 x 272 touchscreen itself.

  The LSlot expansion port keeps the computer connection changeable rather than fixed, and supports cards with up to 32 inputs and outputs simultaneously. The cards available at the time of writing are USB, Thunderbolt 3 and Dante. Hilo Remote, a free connected application for iPad and desktop, offers full control with extended features.

  Power comes from mains or from 9-18V DC battery packs for location recording, and the unit is available in black or silver. Hilo has been replaced by the Hilo 2.
specs: |-
  - 2 in, 6 out independently coupled AD/DA conversion with digital expansion up to 16x16
  - Line in L/R THD+N: -114dB @1kHz, -1dBFS, 20kHz filter, +22dBu trim
  - Line in L/R dynamic range: 121dB, A-weighted, -60dBFS signal method
  - Line in L/R frequency response: +/-0.01dB, 20-20kHz
  - Line in L/R crosstalk: -140dB maximum @ 1kHz, -1dBFS signal
  - Line in L/R full-scale trim settings: +0dBV, +2dBV, +4dBV, +6dBV, +18dBu, +20dBu, +22dBu, +24dBu
  - Line in L/R connectors: female XLR
  - Line out L/R THD+N: -109dB @1kHz, -1dBFS, 20kHz filter, +22dBu trim
  - Line out L/R dynamic range: 121dB, A-weighted, -60dBFS signal method
  - Line out L/R frequency response: +/-0.02dB, 20-20kHz
  - Line out L/R crosstalk: -135dB maximum @ 1kHz, -1dBFS signal
  - Line out L/R full-scale trim settings: +0dBV, +2dBV, +4dBV, +6dBV, +18dBu, +20dBu, +22dBu, +24dBu
  - Line out L/R connectors: male XLR
  - Monitor out L/R THD+N: -107dB @1kHz, -1dBFS, 20kHz filter, volume at max
  - Monitor out L/R dynamic range: 121dB, A-weighted, -60dBFS signal method
  - Monitor out L/R frequency response: +/-0.02dB, 20-20kHz
  - Monitor out L/R crosstalk: -135dB maximum @ 1kHz, -1dBFS signal
  - Monitor out L/R output level at max: +24dBu or +10dBu, jumper selectable
  - Monitor out L/R connectors: 1/4 inch TRS
  - Headphone out THD+N: -107dB @1kHz, -1dBFS, 20kHz filter, volume at max
  - Headphone out dynamic range: 121dB, A-weighted, -60dBFS signal method
  - Headphone out frequency response: +/-0.02dB, 20-20kHz
  - Headphone out crosstalk: -130dB maximum @ 1kHz, -1dBFS signal
  - Headphone out output level at max: +19dBu
  - Headphone out connector: 1/4 inch headphone jack
  - AES/EBU: transformer-coupled on XLR connectors
  - S/PDIF I/O coax: transformer-coupled on RCA jacks
  - S/PDIF I/O optical: on optical connectors
  - ADAT I/O: 8 channels at 48 kHz when selected on optical connectors
  - Sample rates: all standard rates up to 192 kHz using the SynchroLock sample clock generator
  - Synchronization sources: internal, external word clock I/O (75 ohm TTL signal on BNC connectors), AES/EBU or S/PDIF inputs
  - Computer connectivity: Windows 32-bit and 64-bit drivers provided by Lynx, Macintosh OS X drivers provided by Apple
  - LSlot expansion port supports Lynx LSlot expansion cards with up to 32 inputs and outputs simultaneously
  - LCD display: 480 x 272 LCD touch screen
  - Powered by mains or 9-18V DC battery packs for location recording
  - Available in black or silver
