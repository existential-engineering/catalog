details: |-
  This limited edition Pro-Mod San Dimas Style 1 HH FR E pairs a sandblasted ash body in a striking Green Glow satin finish with a bolt-on maple neck featuring graphite reinforcement and a satin finish. The Speed Neck profile includes rolled fingerboard edges for fast, comfortable playing.

  An ebony fingerboard with a 12" to 16" compound radius hosts 22 jumbo frets and white dot inlays, anchored by a Floyd Rose 1000 Series locking nut (1.6875" width) and a 25.5" scale length.

  Electronics consist of a Seymour Duncan JB TB-4 humbucker at the bridge and a Seymour Duncan '59 SH-1N humbucker at the neck, wired to a 3-position blade switch with a push/pull volume control for coil-splitting and a master tone.

  Hardware includes a recessed Floyd Rose 1000 Series double-locking tremolo with locking tremolo arm, Charvel-branded die-cast tuning machines, a Floyd Rose retainer bar string tree, dome-style control knobs, and a black switch tip - all in a black hardware finish. The licensed Fender Stratocaster headstock and 4-bolt serialized neck plate round out this high-performance Charvel.
