details: |-
  FLASHBACK 2 DELAY packs our entire delay legacy into a single compact and affordable stompbox that's designed for now – and the future. Our groundbreaking MASH technology adds an expression pedal to a world-class delay stompbox that responds to your touch and saves precious pedalboard space – and blends the ethereal world of delay with the ultimate in personal expression. Add the brand-new Crystal delay algorithm and two additional TonePrint slots, and the soon-to-be legendary FLASHBACK 2 DELAY brings a wealth of new dimensionality to your quest for tonal perfection!

  Why Just Repeat History – Create it

  Whether you’re an ambient guru searching for a few dreamlike tones, a sonic astronaut exploring the outer regions of your own personal soundscape – or just want to add a big dose of awesome to your playing, FLASHBACK 2 DELAY provides the tools to reinvigorate your creativity like nothing else. Why follow the herd – when you can lead it!

  MASH – Heart of Innovation

  The FLASHBACK 2 DELAY features groundbreaking new technology that brings a wide range of creative expression to the party, and is controlled solely by how much pressure you apply to the depressed footswitch. Years in the making, and only available in select TC ELECTRONIC products, this clever innovation elevates the common footswitch well above the mundane duties of just “On” and “Off”. More importantly – MASH elevates your performance to the next level.
