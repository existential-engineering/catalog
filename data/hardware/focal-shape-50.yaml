url: https://www.focal.com/products/shape-50
description: 2-way active studio monitor with a 5" Flax woofer and an
  Aluminium-Magnesium M-shaped tweeter, designed for accurate nearfield
  monitoring in project studios.
specs: |-
  - 2-way active studio monitor
  - Woofer: 5" Flax membrane
  - Tweeter: 1" Aluminium-Magnesium M-shaped dome
  - Frequency response (±3 dB): 50 Hz – 35 kHz
  - Maximum SPL (peak @ 1 m): 106 dB
  - High frequency amplifier: 25 W class AB
  - Mid-range/low frequency amplifier: 60 W class AB
  - Bass/midrange level (160 Hz): adjustable ±3 dB
  - Bass level (>250 Hz): adjustable ±6 dB
  - Treble level (<4.5 kHz): adjustable ±3 dB
  - High-pass filter: Full range, 45 Hz, 60 Hz, 90 Hz
  - Dimensions (H × W × D): 31.2 × 19.1 × 24.2 cm (12.3 × 7.5 × 9.5 in)
  - Weight: 6.5 kg (14.3 lb)
  - Power supply: 220–240 V or 100–120 V selectable
