description: Shape 50 is the all-rounder par excellence. Usable from a listening distance of 80 cm, it offers a very wide frequency response in the low frequencies (50 Hz) thanks to its 5" woofer with Flax membrane.
details: |-
  Shape 50 is the all-rounder par excellence. Usable from a listening distance of 80 cm, it offers a very wide frequency response in the low frequencies (50 Hz) thanks to its 5" woofer with Flax membrane. Its compact, ventless design and double passive radiator enable it to be positioned close to a wall, and fit perfectly into rooms smaller than 12 m².

  Focal know-how: Shape monitors feature Focal innovations that deliver a high level of transparency. With different settings, different inputs and low-directionality loudspeakers for flexible listening positions, they meet the nearfield listening needs and acoustic characteristics of small spaces.

  Wide sound spectrum: its 13 cm woofer with Flax cone ensures precise, articulate bass. Low-midrange and midrange frequencies benefit from great neutrality, with no masking effect, greatly facilitating equalization of these ever-critical registers. The "M" profile tweeter is the source of very high definition, with formidable precision at very high frequencies.

  Compact design: the MDF cabinet is covered on top and front with through-dyed real walnut veneer. The monitor's compact size means it can be installed discreetly without loss of performance. Designed without a vent, it can also be positioned close to a wall.

  Accessories: mounting inserts are provided on the back and underside of Shape line monitors, making it possible to install them on table stands, microphone stands, ceilings or walls (mounting accessories not supplied).
specs: |-
  - Product type: 2-way monitor
  - Woofer: 5" Flax membrane
  - Tweeter: 1" aluminium-magnesium M-shaped dome
  - Frequency response (+/- 3dB): 50 Hz - 35 kHz
  - Maximum SPL (peak @ 1m): 106 dB
  - High frequency amplifier: 25 W, class AB
  - Mid-range and low frequency amplifier: 60 W, class AB
  - Inputs: XLR symmetrical 10 kOhms, RCA asymmetrical 10 kOhms with compensated sensitivity
  - High-pass filter: full range, 45 Hz, 60 Hz, 90 Hz
  - Bass/midrange level (160 Hz): adjustable +/-3 dB
  - Bass level (>250Hz): adjustable +/-6dB
  - Treble level (< 4.5kHz): adjustable +/-3dB
  - Indicators and controls: HPF, LF Shelv, LMF EQ, HF Shelv
  - Power On LED
  - Local supply: 220-240V (T500mAL / 250V fuse) or 100-120V (T1.6AL / 250V fuse)
  - On/Off switch on the rear panel
  - Double passive radiator, ventless cabinet
  - Height: 31.2 cm / 12.3 in
  - Width: 19.1 cm / 7.5 in
  - Depth: 24.2 cm / 9.5 in
  - Weight: 6.5 kg
