description: The 360 Baritone is an offset solid body electric guitar built on
  the 360 LT M platform, extended to a 27.5" scale length for baritone tuning.
  It features Custom Lollar Alnico Pole Piece P90 pickups, a Mastery Offset
  bridge and vibrato tailpiece, and high gloss nitrocellulose lacquer finish.
  The result opens up a whole new range of sonic possibilities while retaining
  the refined construction Collings is known for.
details: |-
  The Collings 360 Baritone expands on the 360 LT M model with an extended 27.5" scale length designed for baritone tuning. The solid ash body (alder available as a custom option) is paired with a maple neck featuring a rosewood fingerboard with ivoroid long-dot inlays and a 12" radius. An extra-long mortise and tenon neck joint ensures solid coupling between neck and body. Custom Lollar Alnico Pole Piece P90 pickups are wired in 50s style with CTS 500K pots and Jupiter Vintage Yellow capacitors. The Mastery Offset bridge and Mastery Offset Vibrato tailpiece provide precise intonation and smooth vibrato action. Chrome Gotoh tuners with a Collings logo hold the standard string set of nickel wound .014"-.068" gauges. The peghead sports an ebony veneer with a mother-of-pearl Collings logo. All hardware is finished in chrome as standard, with gold and aged options available. A deluxe hardshell case is included.
specs: |-
  - Body: Solid ash (alder available as custom option)
  - Neck: Maple
  - Fingerboard: Rosewood
  - Fingerboard inlays: Ivoroid long dots
  - Fingerboard radius: 12"
  - Nut width: 1 11/16"
  - Scale length: 27 1/2"
  - Frets: Medium 18% nickel-silver
  - Neck joint: Extra long mortise & tenon
  - Pickups: Custom Lollar Alnico Pole Piece P90s
  - Wiring: 50s style
  - Pots & caps: CTS 500K / Jupiter Vintage Yellow
  - Bridge: Mastery Offset
  - Tailpiece: Mastery Offset Vibrato
  - Tuners: Chrome Gotoh with Collings logo
  - Peghead veneer: Ebony with MOP Collings logo
  - Peghead profile: Haircut
  - Finish: High gloss nitrocellulose lacquer
  - Hardware finish: Chrome (gold & aged available)
  - Strings: Nickel wound .014"-.068"
  - Case: Deluxe hardshell case included
