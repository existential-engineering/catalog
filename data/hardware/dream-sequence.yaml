description: A programmable pedal that uses sequencing, envelope shaping, and pitch shifting to create synth-like arpeggios, pulsating sub-octave distortion, shimmering chord washes, and innovative sound transformations.
details:
  - The dream sequence is a programmable rhythm and octave pedal that uses advanced sequencing, envelope shaping, and pitch shifting technologies to create a wide range of innovative sonic textures. It can generate synth-like arpeggios, pulsating sub-octave distortions, shimmering chord washes, and numerous experimental sound possibilities.
  - 'The pedal features a sophisticated sequencing system with three distinct preset banks: user, factory, and saved. The user bank contains 12 customizable step sequencer patterns, while the factory bank offers more complex, evolving presets. Users can create and save custom patterns by tapping footswitches or using MIDI in daws like ableton live or logic.'
  - The device offers extensive control options, including a shape knob that morphs waveform contours from percussive square-wave sounds to backwards-guitar-like ramp waves. Users can record and automate knob movements, manipulate drive, tone, and shape controls, and save these configurations as presets.
  - An expression pedal input allows users to assign control to multiple parameters including distortion, tone, pattern subdivision, or tempo. The pedal supports MIDI clock synchronization and can even clock other pedals via its MIDI output, providing flexible integration with other musical equipment.
  - The dream sequence's hold function enables musicians to sample and sustain chords or notes indefinitely, feeding these samples into the pattern sequencer to create unique harmonies, drones, and innovative tonal landscapes.
specs:
  - Octave up and down pitch shifting
  - Pattern sequencer
  - Rhythmic gate with dynamic adsr morphing
  - Tap tempo
  - Digitally-controlled analog drive and tone
  - Analog dry path
  - Infinite hold sampler
  - 24 built-in presets
  - 11 custom preset save slots
  - Pattern recorder
  - Knob automation recording
  - MIDI in/out
  - Expression pedal input
  - True bypass switching (electromechanical relay)
