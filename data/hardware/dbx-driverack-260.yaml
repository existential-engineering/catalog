description: The dbx DriveRack 260 is a professional loudspeaker management
  system with 2 inputs and 6 outputs, featuring a 28-band graphic EQ, Advanced
  Feedback Suppression, stereo compressor, 120A Subharmonic Synthesizer, 2.7
  seconds of alignment delay, and a built-in RTA with pink noise generator. A
  Wizard setup system with JBL speaker and Crown amplifier tunings simplifies
  system configuration.
details: |-
  Built on over 30 years of dbx signal processing heritage, the DriveRack 260 delivers two independent channels of processing power with a linkable 28-band graphic equalizer, dbx stereo compressor module, Advanced Feedback Suppression, and the 120A Subharmonic Synthesizer at the input stage. Six channels of output processing include parametric EQs, PeakStopPlus limiters for speaker protection, and up to 2.7 seconds of alignment and zone delay.

  The 260 includes an Auto-EQ function with a full-time real-time analyzer (RTA) and pink noise generator for fast, accurate room tuning. The Wizard setup system includes factory tunings for JBL speaker systems and Crown power amplifiers, enabling fast, professional configuration. Security lockout, wall panel control inputs, and RS-232 PC GUI control via DriveWare software ensure flexible, secure operation in both touring and installed environments.

  With a maximum input level of +30 dBu (jumper-selectable) and a 110 dB A-weighted overall dynamic range, the 260 handles the full range of professional signal levels. Its 6× XLR output configuration supports 2-way, 3-way, and mono subwoofer system topologies.
specs: |-
  - Input Channels: 2 line + 1 RTA mic
  - Input Connectors: 2× female XLR (line), 1× XLR (RTA mic)
  - Input Impedance: >40 kΩ
  - Max Input Level: +30 dBu (jumper selectable)
  - CMRR: >45 dB
  - Mic Phantom Power: +15 VDC (RTA)
  - Mic EIN: <-110 dB (22 Hz–22 kHz, 150 Ω)
  - Output Channels: 6 total
  - Output Connectors: 6× male XLR
  - Output Impedance: 120 Ω
  - Max Output Level: +22 dBu
  - Sample Rate: 48 kHz
  - A/D Converter: dbx Type IV conversion system
  - A/D Dynamic Range: >113 dB A-weighted (line); >110 dB unweighted
  - Type IV Dynamic Range: >119 dB A-weighted
  - D/A Dynamic Range: 112 dB A-weighted; 109 dB unweighted
  - Overall Dynamic Range: >110 dB A-weighted
  - THD+N: 0.003% typical (+4 dBu, 1 kHz, 0 dB gain)
  - Frequency Response: 20 Hz – 20 kHz, ±0.5 dB
  - Alignment Delay: 2.7 seconds
