details: |-
  Spector's iconic silhouette takes on a new life with a range of updated models for 2019, including the new EuroBolt Series featuring roasted maple bolt-on necks. These new bolt-on models feature premium, proven tonewoods, including highly figured North American maple, European alder, and roasted maple. EuroBolt models also feature professional grade Aguilar pickups & preamps. The all-new EuroBolt Series takes the classic Spector design and substitutes a bolt-on neck, roasted maple neck & fingerboard, and premium pickups and pre-amps from Aguilar Electronics. Crafted from premium tonewoods including American figured maple and European alder, these meticulously crafted basses feature Spector's original deep inset neck pocket design, which provides added sustain and rigidity, professional grade Spector hardware, and a high-gloss finish.
specs: |-
  - Powered by an onboard battery for the active electronics, no external power connector
