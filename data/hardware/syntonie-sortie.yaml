description: Sortie is a Eurorack RGB to Composite/S-video/Component encoder and
  sync generator supporting SD and HD standards. It automatically selects the
  video standard when an external sync signal is present.
details: |-
  Sortie (french for output) is a RGB to Composite/S-video/Component encoder and sync generator supporting SD and HD. The internal standard is selected by the mean of a push button, with a dedicated LED indicator for each standard. When an external video signal is present at the sync input of the module, the standard will be selected automatically and the external sync LED indicator will light up. RCA sync I/O at the rear of the module. Supports the following standards:

  Inputs:

  - 0-1V RGB, 100k ohm, jack
  - 0-700mV Sync in, 75 ohm, RCA (rear)

  Outputs:

  - 0-700mV YPbPr/CVBS, 75 ohm, RCA
  - 0-700mV S-Video, 75 ohm, Mini Din-4
  - 0-700mV Sync out, 75 ohm, RCA (rear)

  Specs:

  - 8HP
  - 130mA +12V
  - 0mA -12V
  - 0mA +5V
  - 42mm deep

  Can be powered through standard Eurorack 16pin connector or DC barrel connector. Documentation
