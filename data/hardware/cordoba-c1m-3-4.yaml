details: |-
  The Protege by Cordoba C1M 3/4 is the perfect nylon string guitar for students of all levels, and is perfect for the classroom or at home. Comfortable and easy to play, it's a great first guitar at an affordable price. Every Protege C1M is built with a Spruce top, Mahogany back and sides, a comfortable, slim neck profile, a traditional mosaic rosette, and a matte polyurethane finish. Like all Cordoba instruments, C1M models feature premium Savarez strings and an adjustable truss rod for lifetime neck stability.
