details: |-
  The Silvertone 853 Concert Size Ukulele, a best-seller from 1950 to 1970, is reborn with an 18-fret fingerboard and modern geared tuners for reliable intonation. The 50's style brown sunburst satin finish adds a nostalgic touch, paying homage to the era when ukuleles were a cultural phenomenon. The traditional mahogany body and neck, along with a Walnut fingerboard, promise exceptional projection and rich bass tones. Features

  • Reissue of the original 1950's Model Concert Ukulele
  • Traditional Mahogany body and neck
  • 18-fret, Walnut fingerboard
  • Modern geared tuners for reliable intonation
  • 50's style Brown Sunburst Satin Finish
  • Exceptional projection & rich bass tones

