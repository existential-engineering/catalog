description: The Empress Buffer+ Stereo is a full stereo pedalboard I/O
  interface that preserves your guitar's signal over long cable runs. It brings
  the foot-switchable boost, input padding, noise filters, and variable input
  loading of the Buffer+, plus input metering, AB/ABY switching, external switch
  control, transformer-isolated outputs, and 12 user-configurable routing modes.
details: |-
  The Empress Buffer+ Stereo was designed to be the complete I/O interface for your pedalboard, all while maintaining the highest fidelity of your guitars' signal. Signal loss due to long, un-buffered cable runs is an issue that has plagued guitar players for decades, and the primary goal of the Buffer+ Stereo is to eliminate this loss so your tone is unchanged by your cables.

  It incorporates all the features of the Buffer+ (the foot-switchable boost, input padding, noise filters, and variable input loading) plus input metering with clip indicators, AB/AY switching, external switch control, and full stereo in/out connectivity. Transformer-isolated outputs avoid ground loops when connecting to multiple amps, and the polarity can be inverted to maintain phase between stereo amps.

  On top of that, twelve different operating modes each provide their own unique internal signal routing for maximum versatility: connecting stereo effects out to stereo amps, running parallel mono effects chains, switching between dual instruments, or combining front-of-amp effects with the amp's FX loop.
specs: |-
  - All-analog signal path
  - Footswitchable clean boost up to 30dB (onboard or external footswitch)
  - AB/ABY switching of outputs, inputs, or amp FX loop
  - 12 user-configurable internal routing modes
  - Input metering with clip-level indicators
  - Tuner mute (hold footswitch, or external footswitch for instant mute)
  - Two selectable noise filters
  - Input pad of 6dB or 12dB
  - Variable input loading
  - Transformer-isolated output with polarity invert
  - External footswitch control
  - Input impedance 1: 10kOhm - 1MOhm, Input impedance 2: 1MOhm
  - Output impedance 1: 47 Ohm, Output impedance 2: 600 Ohm
  - Frequency response (-3dB) 20Hz - 38kHz, THD 0.02%, Noise -104dB
  - Power 9V DC, 2.1mm barrel connector, 150mA draw
  - Dimensions 4.5" (L) x 3.5" (W) x 2" (H with controls), weight 12.5 oz
