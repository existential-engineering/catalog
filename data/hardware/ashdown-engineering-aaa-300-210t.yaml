description: A lightweight 300-watt bass combo in the AAA EVO range, loaded with
  2 x 10" custom Ashdown speakers. It features footswitchable tube-emulated
  overdrive, a 4-band EQ with sweepable mid, Vintage/Modern voicing switches for
  lows and highs, passive and active inputs, a balanced XLR DI, an FX loop, a
  line input, a tweeter mute, a speaker mute, and a headphone socket.
details: |-
  Lightweight 300-watt AAA EVO bass combo with 2 x 10" custom Ashdown speakers. Footswitchable tube-emulated overdrive and a 4-band EQ with a sweepable mid. Passive and active inputs plus a balanced XLR DI output. Vintage/Modern Low push button reshapes the low end and a Vintage/Modern Highs push button adjusts high-end presence. Rear panel adds a tweeter mute, a speaker mute and headphone socket for silent practice, a balanced DI XLR, an FS-1 footswitch jack, a line input and an FX loop. An extension cabinet output unlocks the full 300 watts for larger gigs. AppTek connection for iOS amp-sim and FX apps (ABM Pre App via Agile Partners Amp Kit). Premium heavy-duty buffalo Tolex with a vintage red grille.
specs: |-
  - Power output: 300 watts
  - Speaker configuration: 2 x 10" custom Ashdown
  - Passive and active inputs
  - 4-band EQ with sweepable mid
  - Footswitchable tube-emulated overdrive
  - Vintage/Modern Low and Vintage/Modern Highs voicing switches
  - Balanced XLR DI output
  - FX loop
  - Line input
  - Tweeter mute and speaker mute switches
  - Headphone socket
  - FS-1 footswitch jack
  - Extension speaker output
  - Weight: 17 kg (36 lb)
  - Heavy-duty buffalo Tolex with vintage red grille
