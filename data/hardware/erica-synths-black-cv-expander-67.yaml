description: The Erica Black CV Expander is the satellite module to our HADSR
  envelope generator, it allows each envelope parameter to be controlled via
  external control voltage CV.
details: |-
  The Black CV Expander is the satellite module to the Erica Synths Black HADSR envelope generator, and it opens each envelope parameter to control by an external control voltage.

  The module produces unpredictable, complex envelopes that are ideal for random drones. It is internally patched to the Black Envelope Generator over a ribbon cable, supplied with the module.

  The Erica Black series are high-end modules with unique functionality. Only the highest quality components are used, and all inputs and outputs are protected against undesired overvoltage. When designing the Black Series, Erica Synths did not economise on module width, putting design and usability first, so big knobs are assigned to the functions that make a difference in sound. Together the Black series modules are a range that makes up an entire synthesizer.

  CV input signal level runs from -10V to +10V. The panel is 8HP wide, the module is 25mm deep, and power consumption is +15mA and -15mA.
specs: |-
  - CV input signal level -10V to +10V
  - Satellite module for the Black HADSR envelope generator
  - Internally patched to the Black Envelope Generator over a supplied ribbon cable
  - All inputs and outputs protected against overvoltage
  - Power consumption +15mA, -15mA
  - Module width 8HP
  - Module depth 25mm
