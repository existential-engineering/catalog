description: A uniquely versatile live sound mixer, WZ4 14:4:2 is equally at
  home at Front of House, on Monitors, or doubling up to fill both roles at
  once.
details: |-
  A uniquely versatile live sound mixer, WZ4 14:4:2 is equally at home at Front of House, on Monitors, or doubling up to fill both roles at once.

  10 mic/line inputs with balanced XLR/TRS jack feed our renowned clean and detailed preamp design.

  2 dual stereo channels are perfect for stereo playback or for hooking up keyboards and other stereo instruments.

  Flexible aux section with 2 pre-fade, 2 switched and 2 post-fade sends.

  6×2 Matrix perfect for feeding delay and fillspeakers, broadcast and recording mixes, and more.

  Three modes of operation — FOH, Monitor, and Dual — let the desk be reconfigured for the role at hand.

  FoH Mode: 4 groups with inserts, 100mm faders and XLR outputs can be routed and panned to the LR mix for flexible sub-mixing. Main LR mix has inserts, separate left and right faders, and XLR outputs.

  Monitor Mode: aux mixes are routed to the group and LR faders, inserts and XLR outputs; AFL/PFL is switched to the Mono output to provide an engineer's wedge output.

  Dual Mode: some auxes can be used as monitor mixes and some sub-grouping can be used alongside the main LR outputs, allowing FoH and some monitor mixes from the same console.

  The MixWizard4 preamp delivers extremely low noise, minimal distortion, wide yet smooth gain law and plenty of headroom; adapted from the design used on A&H's large-format analogue consoles.

  All MixWizard4 models offer 6 auxes, each with its own master level rotary control and impedance-balanced TRS outputs. Auxes 1-2 routed pre-fade; auxes 3-4 switchable pre/post-fade; auxes 5-6 post-fade. Pre/post settings can be changed via internal jumpers.

  Two dual stereo channels with TRS connectors and independent gain controls are included for FX returns and stereo line sources; one stereo input can feed straight to LR. Stereo channels feature 4-band EQ and can be routed to all 6 auxiliary sends.

  Quick Change Connectors (QCC): the connector panel can be swiftly repositioned for desktop, rack or flightcase mounting. Hard plastic side trims can be removed to reveal integral rack ears.
specs: |-
  - 10 Mic/Line Inputs (balanced XLR/TRS jack)
  - 2 Dual Stereo Inputs (TRS jack)
  - 4 Group Outputs (XLR) with inserts and 100mm faders
  - Main LR Outputs (XLR) with inserts and separate L/R faders
  - 6 Aux Sends (impedance-balanced TRS): 2 pre-fade, 2 switchable, 2 post-fade
  - 6×2 Matrix
  - 4-band EQ on stereo channels
  - Three modes of operation: FOH, Monitor, Dual
  - Quick Change Connectors (QCC) for desktop, rack or flightcase mounting
