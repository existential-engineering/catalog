details: |-
  “The Archon Classic is not a re-issue of the original Archon, but a newly voiced circuit with the Lead channel excelling in 70s and 80s rock tones and a hotter Clean channel able to go into breakup. This is the answer for those wanting an Archon with a hotrod vintage Lead channel gain structure without changing preamp tube types and a juiced up Clean channel without having to use a boost pedal all wrapped up in a retro inspired cabinet design.” – Doug Sewell, PRS Amp Designer

  The PRS Archon Classic is a powerful, two-channel amp designed for rock and roll players who crave classic tones but still want the ability to push beyond. With a refined gain structure from the original Archon, the Archon Classic’s Lead Channel offers a wider range of gain flavors – especially in the midrange – and the Clean Channel goes from pristine clean to edge of breakup sounds with ease. The 3-dimensional tone of the Archon Classic delivers lush highs and tight low-end, all while maintaining excellent note separation and articulation.

  The Archon Classic’s intuitive control layout with 3-band EQs allows players to best dial in their tones. The individual channel volume and master volume controls work together to command the amp’s loudness and distortion. The bright switch acts almost as a treble boost, putting a shine on the amp’s high-end without going into icepick territory. The global presence and depth controls in the Archon’s power amp section both work to modify the feedback network of the amp to unleash the potential of the high- and low-end respectively. Turning up the Presence control releases more high-mid and treble frequencies, bringing the amp’s tone forward. Depending on the tone stack and volume settings, the Presence can change the gain/texture and loudness of the high-end, making your tone wilder and more 3-dimensional (or more “present” sounding). In addition to adding low-end, the Depth control allows players to choose between a tight, focused sound or a more resonant, bass-heavy response. For players looking to add a pedal board, the Archon Classic provides ample headroom and built-in effects loop in addition to its ultra-clean tonal platform.

  The Archon Classic combines rugged construction with sleek aesthetics, ensuring it stands out on stage and remains reliable on the road. Whether you’re playing classic rock or pushing the envelope into modern territory, this amp is built to deliver the sound you desire.
