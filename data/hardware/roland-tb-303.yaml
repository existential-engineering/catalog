description: >-
  A monophonic analog bass synthesizer with a built-in step sequencer, originally
  designed as a guitarist's practice companion but destined to become the
  defining instrument of acid house and techno.
details: |-
  Roland released the TB-303 Bass Line in 1982 as a companion to the TR-606 drum machine, intended to provide realistic bass guitar accompaniment for solo musicians practicing at home. It was a commercial disappointment — its squelchy, synthetic tone bore little resemblance to an actual bass guitar, and it was discontinued by 1984 after sluggish sales. Units piled up in pawn shops and secondhand bins at bargain prices.

  That commercial failure set the stage for a musical revolution. In the mid-1980s, Chicago DJs and producers began picking up discounted 303s and discovered that the instrument's quirky resonant filter, when manipulated in real time over a looping sequence, produced hypnotic, squelching textures unlike anything else. Phuture's "Acid Tracks" in 1987 is widely credited as the record that launched acid house, and the 303 was at its center.

  The sound engine is deceptively simple: a single voltage-controlled oscillator switchable between sawtooth and square waves feeds into an 18dB-per-octave resonant lowpass filter. The filter's cutoff frequency, resonance, and envelope modulation amount are the primary tone-shaping tools, and the interplay between these three controls produces the instrument's trademark screaming, bubbling, and warbling character. Accent and slide functions in the sequencer add rhythmic dynamics and portamento that give 303 patterns their distinctive liquid feel.

  The built-in step sequencer stores 64 patterns and 7 songs, programmed through a somewhat unintuitive interface that many users found confusing. Ironically, the difficulty of programming it precisely often led to happy accidents that became part of the creative process. The typical performance approach involves setting a pattern to loop while tweaking the filter knobs by hand, creating evolving, almost alive bass lines.

  The TB-303's cultural impact far exceeds what its modest specifications might suggest. It spawned entire genres, influenced countless hardware and software clones, and remains one of the most recognizable sounds in electronic music. Hardware modifications like the Devil Fish and Borg mods expanded its capabilities, while artists from Aphex Twin and Hardfloor to the Chemical Brothers and Orbital have made it central to their work.
specs: |-
  - Polyphony: Monophonic
  - Oscillator: 1 VCO (sawtooth or square wave)
  - Filter: 18dB/oct resonant lowpass with cutoff, resonance, and envelope modulation
  - VCA: Decay time and accent intensity controls
  - Sequencer: 64 patterns, 7 songs, accent and slide per step
  - Keyboard: None
  - Connectivity: CV/Gate, DIN Sync
  - Produced: 1982–1984
