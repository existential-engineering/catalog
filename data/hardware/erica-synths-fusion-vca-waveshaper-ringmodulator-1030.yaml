url: https://www.ericasynths.lv/fusion-vca-waveshaper-ringmodulator-1030/
description: The Fusion VCA/Waveshaper/Ringmodulator is a complex sound
  processor that combines VCA, waveshaper and ringmodulator. It’s not a regular
  VCA; it can operate as one, but most of the power of the module is in advanced
  modulations – with two CVs applied simultaneously to different stages of the
  VCA, audio rate modulations, using ringmodulator as a waveshaper – your
  imagination is the limit!
details: |-
  A fully analogue sound processor that combines a VCA, a waveshaper and a ring modulator. It can work as a conventional VCA, and a direct switch puts it in that mode, but most of its character comes from advanced modulation.

  The VCA stage is built around two miniature vacuum pentodes for better gain reduction, which also keeps power consumption low. Two unconventional CV controls drive it: the CVs are not mixed, they control different grid voltages of the tubes, so applying two CVs simultaneously to different stages of the VCA produces results a conventional VCA cannot.

  An input crossfader, a manual VCA bias control, a manual overdrive and a built-in ring modulator complete the panel. At audio rate modulation, and with the ring modulator used as a waveshaper, the module becomes a versatile sound shaping unit.
specs: |-
  - Audio input level 10Vptp
  - CV input level (full swing) -10V to +10V
  - Panel width 14HP
  - Module depth 36mm
  - Power consumption 48mA@+12V, 69mA@-12V
