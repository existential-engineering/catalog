details: |-
  The BASSWITCH CLEAN BOOST was born out of the idea to buy the BASSWITCH IQ DI another full-fledged channel. This compact preamp combines the boostfunction of the BASSWITCH IQ DI with a 3-band-eq that has been especially voiced for a clean sound. Additionnaly the treble control combines a passive high frequencies reduction with an active high frequency boost.

  The EQ of the BASSWITCH CLEAN BOOST has the feel of a mixing console channel to it and allows a strong bending of the basic signal. It consigns a wonderfully tidy soundscape and your instrument will receive a new sonic shine.

  The BASSWITCH CLEAN BOOST allows gain adjustment of +/-15 dB and can be used as a stand-alone booster, it can be teamed up with the BASSWITCH IQ DI for more options or work as a compact standalone preamp in front of an active monitor or bass cab.

  The approved LEHLE True Sound Technology ensures a great tone: starting from the discrete JFET input stage, up to the switching via gold-plated relais this booster offers a more than studio-standard dynamic range of over 110 dB with very little noise. The extremely robust construction with its protected controls and indestructable switching mechanism will provide many years of joy with clean boosting.
specs: |-
  - Compact preamp and booster adding a full-fledged channel to the BASSWITCH IQ DI
  - 3-band EQ voiced for a clean sound, with the feel of a mixing console channel
  - Treble control combining passive high frequency reduction and active high frequency boost
  - Gain adjustment of +/-15 dB
  - LEHLE True Sound Technology with discrete JFET input stage
  - Switching via gold-plated relays
  - Dynamic range of over 110 dB with very little noise
  - Works internally with 18 V
  - Runs on any power supply between 9 and 15 V AC or DC
  - Robust construction with protected controls
