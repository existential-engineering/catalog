details: |-
  The BAE B15 is a 3-band parametric EQ built in standard 500-series format (1.5″ × 5.25″). Each of the three bands provides 5 selectable frequencies and ±16 dB of boost/cut via continuous variable potentiometers, with push-button shelving available on the low and high bands.

  The circuit uses an all-discrete, high-headroom, low-noise design with Jensen transformer-balanced input and output. Controls are built around custom-machined aluminium knobs, Elma gold-plated rotary switches, and Avedis® 1122 opamps, with a 15-way edge connector for integration into any standard 500-series rack.
specs: |-
  - Format: Standard 500-series (1.5" × 5.25")
  - EQ bands: 3-band parametric
  - Frequencies per band: 5 selectable
  - Gain range: ±16 dB (continuous variable)
  - Shelving: Push-button on low and high bands
  - Design: All discrete
  - Input/Output: Jensen transformer balanced
  - Opamps: Avedis® 1122
  - Knobs: Custom machined aluminium
  - Switches: Elma gold-plated rotary
