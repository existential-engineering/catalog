  feeling neck (48mm nut width) and built-in Fishman Presys Blend preamp.
details: |-
  Meet the Maple, a beautiful crossover guitar that features a solid European Spruce top and flamed Maple back and sides for a bright, snappy tone and sweetly pronounced high end. Other than its strikingly beautiful back, the 12 Maple's main feature is its slim steel-string feeling neck (48mm nut width) and 16" radius fingerboard. Available with 12 frets to the body, the Maple is ready for the stage with its Fishman Presys Blend preamp.
