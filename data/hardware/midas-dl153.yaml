name: DL153
manufacturer: midas
primaryCategory: rack-mount
categories:
  - preamp
url: "https://www.midasconsoles.com/en/products/0606-ABQ"
description: 'PRO Series 2U 19" fixed-configuration rack I/O unit (stage box)
  with 16 mic/line level inputs and 8 line level outputs. Features 16
  award-winning Midas microphone preamplifiers with 2.5 dB analogue gain steps
  and switchable +48 V phantom power, and 8 active servo-balanced low impedance
  line level outputs with automatic mute and per-output LED indicators. Two
  AES50 SuperMAC (AES50-Compliant) network ports provide dual cable redundancy
  and connect to Midas PRO Series consoles at 96 kHz or Midas M32 Series
  consoles at 48 kHz. Remote operation supported up to 100 m via CAT5/5e cable.
  All settings are configurable from the mixing console or via the front panel
  LCD with menu navigation and LED status indicators (power-supply rail, AES50,
  and Ethernet network status). Built in a rugged steel 2U rackmount chassis
  with auto-ranging universal switch-mode power supply for worldwide use,
  designed as the ideal stage-end partner to Midas PRO and M32 Series digital
  consoles for a digital snake from Front of House to stage.'
details: |-
  Award-winning Midas microphone preamplifier with 2.5 dB analogue gain steps, transparent and pristine sound with low noise and high common-mode rejection, designed by Midas with over 40 years of preamp design heritage. SuperMAC (AES50-Compliant) digital audio networking technology from Klark Teknik provides high channel counts, ultra-low and deterministic latency, sample-synchronous and phase-aligned networked clock distribution, error detection and correction, network redundancy, and ease of deployment. High Output Drive line outputs: 8 active servo-balanced low impedance line outputs with high output current capability for driving long cable runs, automatic mute when the console operator mutes the signal, and individual LED indicators per output. All configuration settings can be controlled remotely from the mixing console or directly via the front panel LCD with intuitive menu navigation and LED status indicators showing power supply rail condition and AES50/Ethernet network connection status and activity. Rugged steel 2U rackmount enclosure with premium industry-standard connectors. Auto-ranging universal switch-mode power supply is auto-voltage-sensing for worldwide use. Compatible with all Midas PRO Series and M32 Series digital consoles and with any other AES50-equipped devices.
specs: |-
  - Sample Rate: 48 kHz, 96 kHz
  - Dynamic Range: >107 dB unweighted (20 Hz - 20 kHz)
  - Mic EIN (40 dB Gain): -126 dBu
  - Maximum Output Level: +21 dBu into 600 ohm
  - Output Noise (Unity Gain): -86 dBu
  - Frequency Response: +/-0.5 dB (20 Hz - 20 kHz, relative to 1 kHz)
  - THD+N (Unity Gain): 0.01%
  - Crosstalk @ 1 kHz: -90 dB
  - Analogue Inputs: 16 (3-pin XLR Balanced)
  - Input Impedance: 10k ohm
  - A/D Conversion: 24 bit, 96 kHz with 128 times oversampling
  - Phantom Power: +48 V, individually switchable per channel
  - Analogue Outputs: 8 (Line Level, servo-balanced)
  - Output Impedance: 50 ohm
  - D/A Conversion: 24 bit, 96 kHz with 128 times oversampling
  - Network Connections: 2 (Industry-standard RJ45 with status LEDs)
  - Redundancy: Dual cable redundancy
  - Network Interface: Conforms to AES50-2011
  - Ethernet Control Port: 1
  - Power Inlet: IEC mains inlet
  - Mains Input Voltage: 100 to 240 VAC, 50-60 Hz
  - Power Consumption: 150 W
  - Dimensions: 483 x 416 x 88 mm (19.0 x 16.4 x 3.5")
  - Net Weight: 6.7 kg (14.7 lbs)
  - Operating Temperature Range: +5 degC to +45 degC
  - Storage Temperature Range: -20 degC to +60 degC
  - Form Factor: 2U 19" rackmount
  - Remote Cable Run: Up to 100 m via CAT5/5e
