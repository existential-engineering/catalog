description: "The largest of the 4000 series models, the flagship 4040A is
  designed for larger fixed installations that demand higher playback levels and
  greater low frequency extension."
details: |-
  The 4040A is the flagship of Genelec's 4000 series of active installation loudspeakers, designed for larger fixed installation applications that demand higher playback levels and greater low-frequency extension than its smaller siblings. It is built around a 165 mm cone woofer and a 19 mm metal-dome tweeter, each driven by a 120 W Class AB amplifier for a combined 240 W output stage. The result is a frequency response of 55 Hz - 20 kHz (±3 dB), a short-term maximum SPL of at least 109 dB, and a long-term maximum SPL of at least 101 dB measured in half space at 1 metre, with self-generated noise of no more than 10 dB (A-weighted).

  The active architecture integrates amplification, crossover and protection electronics directly inside the die-cast aluminium reflex-ported cabinet, eliminating the need for external power amplifiers or speaker-level cabling. Genelec's Directivity Control Waveguide (DCW) technology delivers the trademark precision and clarity of the brand with controlled, even directivity, so the 4040A behaves predictably across the listening area and across rooms of different sizes and shapes.

  The rear panel provides a single 10 kOhm balanced analog input on a 5-position terminal block (Euroblock), keeping integration simple for contractors and AV designers. Room compensation controls on the rear panel allow the speaker to be adapted to its acoustic environment - addressing bass tilt near walls or corners, broadband level matching, and treble tilt to suit reflective or absorptive spaces - so a consistent tonal balance can be achieved across an entire installed system.

  Intelligent Signal Sensing (ISS) circuitry drops the 4040A into a sleep state of no more than 0.5 W when no audio has been present for a period of time, and wakes it as soon as signal returns, keeping standby power consumption well under typical energy-efficiency thresholds for fixed installations. Idle power consumption is no more than 15 W, and full-output consumption is 170 W. Regional mains voltage options (100, 120, 220 and 230 VAC, 50/60 Hz) cover worldwide deployment.

  Measuring 350 x 237 x 223 mm and weighing 9.9 kg (21.8 lb), the 4040A is available in standard white and black finishes, with an additional 120-option RAL custom-colour programme and a RAW unfinished-aluminium option for visually demanding installations. Typical applications include theatres, restaurants, conference rooms, museums, art galleries, hospitality venues, public spaces, retail, education facilities, music venues and sports centres. Each unit ships with a 5-position terminal block, a 1.8 m mains cable, a simple bracket, a mounting screw set and the operating manual.
specs: |-
  - Two-way active installation loudspeaker
  - Short term maximum SPL: ≥109 dB
  - Long term maximum SPL: ≥101 dB
  - Frequency response: 55 Hz - 20 kHz (±3 dB)
  - Low cutoff (-6 dB): 50 Hz
  - High cutoff (-6 dB): 25 kHz
  - Self-generated noise: ≤10 dB (A-weighted)
  - Harmonic distortion (50-100 Hz): ≤3%
  - Harmonic distortion (>100 Hz): ≤0.5%
  - Bass driver: ⌀165 mm cone
  - Treble driver: ⌀19 mm metal dome
  - Crossover frequency: 2500 Hz
  - Bass amplifier: 120 W Class AB
  - Treble amplifier: 120 W Class AB
  - Total amplifier power: 240 W
  - Signal input: 1 x Euroblock (5-position terminal block), 10 kOhm balanced
  - Mains voltage: 100, 120, 220 or 230 VAC, 50/60 Hz (regional variants)
  - Power consumption (ISS active sleep): ≤0.5 W
  - Power consumption (idle): ≤15 W
  - Power consumption (full output): 170 W
  - Enclosure: die-cast aluminium, reflex port
  - Dimensions (H x W x D): 350 x 237 x 223 mm
  - Weight: 9.9 kg (21.8 lb)
  - Standard finishes: white, black
  - Custom finishes: 120 RAL colour options, RAW unfinished aluminium
  - Includes: 5-position terminal block, 1.8 m mains cable, simple bracket, mounting screw set, operating manual
