description: Polivoks VCF is famous for its’ crazy resonance sweeps and deep,
  bassy sounds that make it ideal for acid basslines.
details: |-
  Erica Synths considers this one of the most authentic sounding emulations of the Polivoks VCF available, and the sound circuit uses the original Russian K140UD12 integrated circuits to get there. The filter is known for wild resonance sweeps and deep, bassy tones that suit acid basslines.

  Several updates adapt the circuit to contemporary modular demands. Inputs are independently buffered, the cutoff knob range is extended, the clicks that came with switching filter modes are eliminated, and an output stage was added to remove the signal inversion of the original.

  Two filter modes are switchable, band pass at 6dB per octave and low pass at 12dB per octave. The module accepts input levels up to 20Vptp and CV input from -10V to +10V.

  Inputs and outputs are protected against over-voltage and the power input is protected against a reversed supply. The panel is 10HP wide and the module is 30mm deep with a skiff friendly build, drawing 11mA from each rail.
specs: |-
  - Switchable BP/LP modes
  - Filter modes BP (6dB/oct) and LP (12dB/oct)
  - Input level up to 20Vptp
  - CV input level -10V to +10V
  - Original Russian K140UD12 ICs in the sound circuit
  - Independently buffered inputs
  - Extended Cutoff knob range
  - Inputs and outputs protected against over-voltage
  - Protection on reversed power supply
  - Skiff friendly design
  - Module width 10HP
  - Module depth 30mm
  - Power consumption 11mA@+12V, 11mA@-12V
