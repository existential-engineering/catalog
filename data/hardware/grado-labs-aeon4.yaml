description: The Aeon4 is a low-output moving iron phono cartridge from Grado's
  Lineage Series, emphasizing clarity, control, and balance with resolved detail
  across the frequency range. Features Grado's patented flux-bridger technology,
  sapphire cantilever, and Brazilian Ebony wood body.
details: |-
  The Aeon4 is part of Grado Labs' Lineage Series, utilizing the company's patented moving iron flux-bridger technology to deliver a composed presentation with resolved detail across frequencies.

  The cartridge pairs a sapphire cantilever with a nude Shibata diamond stylus and houses these in a Brazilian Ebony wood body. Ultra-high purity 7N OCC copper internal wiring is used throughout, and the assembly receives cryogenic treatment. Available in stereo and mono configurations, and eligible for Grado's Wood Cartridge Upgrade Program.
specs: |-
  - Output: 1.0mV @ 5 CMV (45 degrees)
  - Frequency Response: 5 Hz – 70 kHz
  - Channel Separation: ~30dB (10–30kHz)
  - Input Load: 10–47k ohms
  - Inductance: 8mH
  - Resistance: 74 ohms
  - Weight: 10.5 grams
  - Recommended Tracking Force: 1.6–1.9 grams
  - Compliance: 20 μm/mN
  - Stylus: Nude Shibata diamond
  - Cantilever: Sapphire
  - Body: Brazilian Ebony wood
  - Internal Wiring: 7N OCC copper
  - Cryogenically treated during assembly
