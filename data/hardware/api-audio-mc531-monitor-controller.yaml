id: gWRt_Jdbj7U-zI4HcgW42
name: MC531 Monitor Controller
manufacturer: api-audio
primaryCategory: outboard
url: https://apiaudio.com/product/mc531-monitor-controller/
description: Standalone desktop monitor controller derived from API's analog
  console center section, with 3 balanced analog inputs, AES3 and USB digital
  inputs, Bluetooth, 3 stereo balanced outputs, 2 headphone outputs, mono
  subwoofer output, talkback mic, and 18-segment stereo LED metering.
details: |-
  5 stereo source inputs: ST-1/2/3 via balanced 1/4-inch TRS (30 kΩ, API
  2510 op-amps); ST-4 via AES3 XLR or USB Type-B; ST-5 via Bluetooth or 3.5mm
  aux. 3 stereo balanced outputs (control room + 2 alternate) with independent
  trim. Mono subwoofer output with adjustable gain. 2 headphone outputs.
  Built-in talkback electret mic. Mute, Mono, DIM controls. 18-segment stereo
  LED metering. 16W power consumption. Desktop (not rack-mount).
specs: |-
  - Max input level: +28 dBu
  - Max output level: +28 dBu
  - Frequency response: ±0.5 dB (20 Hz–50 kHz)
  - S/N ratio: 115 dB
  - Input impedance (analog): 30 kΩ
  - Output impedance: 75 Ω
  - Power: 16 W
  - Dimensions: 11.0" × 12.75" × 4.0"
  - Weight: 8.5 lb
