description: "AXE I/O ONE is the ultimate compact and affordable 1-in/3-out
  audio interface designed for musicians who want the best sound possible for
  recording guitar or bass. It combines IK's patent-pending Z-Tone® impedance
  control, an Amp Out for Tone Modeling, multiple circuit topologies, Ableton
  Live 10 Lite, and award-winning AmpliTube and TONEX software for a complete
  digital studio rig."
details: |-
  Z-TONE impedance-adapting input enhances pickups' true sound

  PURE and JFET selectable input stages for modern or vintage tones

  Active/Passive pickup selector optimizes signal flow

  Class-A mic preamp with 48V phantom power for transparent recording

  Amp Out with ground loop interrupter for reamplification, monitoring, or Tone Modeling

  Direct/DAW monitoring for latency-free recording

  2 programmable external controller inputs for expression pedals or switches

  USB-C bus powered, no external power supply required

  Includes AmpliTube 5 SE (80 gear models), TONEX SE, and Ableton Live Lite

  Access to ToneNET: 6,000+ AmpliTube presets and 10,000+ TONEX tone models

  Control Panel software for input/output management and routing

  Compatible with Mac, PC, and iPad
specs: |-
  - 24-bit A/D and D/A conversion
  - Sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Dynamic range: 108 dB(A)
  - Class-A discrete differential mic preamp with 48V phantom power
  - Mic frequency response: 9 Hz - 45 kHz within 0.5 dB (at 96 kHz)
  - Z-TONE variable impedance: 1 MOhm down to 2.2 kOhms (passive)
  - THD (Pure mode): 0.0018% / THD (JFET mode): 0.42%
  - Monitor outputs: electronically balanced, crosstalk 109 dB(A)
  - Amp output: unbalanced with selectable ground lift
  - Headphone output: virtually zero impedance, +5 dBu into 50 Ohms
  - USB-C bus powered
  - Dimensions: 130 mm (5.12") x 145 mm (5.71") x 52 mm (2.04")
  - Weight: 370 g (0.8 lb)
