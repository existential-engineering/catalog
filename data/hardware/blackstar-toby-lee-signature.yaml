description: The TL506L6 is a signature guitar amplifier designed in
  collaboration with young blues sensation, Toby Lee.
details: |-
  Blackstar recognise a true talent in Toby, both for today and the future. We welcomed him to our ever-growing family in 2019, and endorsed him with a custom HT-20 MkII finished in red. A few years later and Toby was amongst the first artists to start using the St. James amplifiers so we are pleased that we are able to honour him with his very own signature St. James TL50 6L6 head and cab.

  At the heart of the signature amp is the seamless fusion of vintage aesthetics and modern performance. Toby, an avid enthusiast of all things from the '60s, shares our meticulous attention to detail, resulting in an amp that exudes nostalgia and comfort. The eye-catching red vinyl and cream basket weave finish, complemented by cream chicken head knobs, make this amplifier a true work of art.

  Beyond its visual appeal, the St. James Toby Lee Signature amp offers unparalleled functionality. Its lightweight design allows for easy portability without compromising on the tonal quality—a crucial advantage for Toby's on-the-go lifestyle. Toby specifically chose 6L6 valves over EL34's, as they perfectly complement his preferred style of playing providing rich overdriven tones. One standout feature of the amp is its outstanding reverb capabilities across all volumes and channels, Toby's love of ambient soundscapes made this a crucial element to the design of the amp.

  The TL50 6L6 is packed with cutting-edge features to deliver class-leading recording performance. From 50W, 2W and SAG switchable power modes, to an inbuilt reactive load that routes the post-power valve output signal to the amp's three direct recording outputs (XLR, Stereo Line-Out and USB) for truly authentic 'amp-in-a-room' feel. The sound from these recording outputs is derived from Blackstar's state-of-the-art and fully customisable CabRig DSP speaker simulator.

  The St. James range uses highly efficient, lightweight power transformers designed around modern SMPS (Switched-Mode Power Supply) technology. More than 3 years of intense R&D have delivered all the benefits of SMPS, namely lightweight and universal voltage compatibility, whilst retaining the sound and feel of a traditional iron-core transformer. Sold as a head (TL506L6) and matching 2x12 cabinet (TL212VOC) loaded with Celestion Zephyr speakers.
specs: |-
  - Power: 50W (Head)
  - Preamp Valves: 2x ECC83
  - Output Valves: 2x 6L6
  - Channels: 2
  - Voice/Boost: Voice
  - EQ: Bass, Middle, Treble
  - Power Reduction: 50W, Sag, 2W
  - Reverb: Yes
  - Inbuilt Reactive Load: Yes
  - CabRig DSP Speaker Simulator: Yes
  - USB Audio: Yes
  - XLR CabRig Output: Yes
  - Series Effects Loop: Yes (With Level Switch)
  - Footswitchable: Yes (Included 2-Way Footswitch)
  - Tolex: Red
  - Voltage: 90V to 264V 50/60Hz
  - Weight (Head): 6.7 kg
  - Dimensions (Head): 402 x 222 x 214 mm
  - Cabinet (TL212VOC) Power: 140W
  - Cabinet Speakers: 2x 12" Celestion Zephyr 140W
  - Cabinet Weight: 13.6 kg
  - Cabinet Dimensions: 501 x 718 x 295 mm
