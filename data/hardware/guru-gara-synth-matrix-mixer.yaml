description: A DIY Eurorack utility module with a 4x4 matrix layout allowing any
  of four inputs to be routed to any of four outputs with individual level
  control, for mixing audio and control voltages.
details: |-
  Matrix Mixer

  The Matrix Mixer Eurorack PCB and Front Panel Kit is a versatile DIY utility module designed for flexible routing and mixing of both audio and control voltages. With a simple and intuitive 4×4 matrix layout, it allows any input to be routed to any output with precise level control. Key Features

  Routing & Modulation

  Each input can be freely routed to any of the four outputs, making the Matrix Mixer ideal for:

  Because the circuit supports both audio and CV, it functions equally well as an audio matrix mixer, a CV router, or a hybrid utility for advanced modular patching. DIY Build & Front Panel

  This beginner-friendly Eurorack DIY kit is suitable for builders new to modular synthesis or electronics. The circuit is simple and reliable, making it an excellent utility module for first-time builders. The front panel is crafted from durable PCB material and hand screen printed, ensuring a consistent look alongside other Guru Gara Synth modules. Technical Specifications

  Skiff Friendly Module

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category.
specs: |-
  - Eurorack PCB and front panel kit
  - 4 inputs × 4 outputs matrix configuration
  - Mixes audio signals and/or control voltages
  - Individual level control for each input-to-output connection
  - Beginner-friendly DIY build with straightforward circuitry
  - Compact and intuitive matrix layout
  - Front panel made from PCB material, screen printed by hand
  - Audio signal routing and blending
  - Complex CV distribution
  - Feedback and cross-modulation patches
  - Creating evolving modulation relationships
  - Format: Eurorack
  - Width: 14HP
  - Depth: 25mm
  - Current Draw: - +12V - 21 mA
  - -12V - 21 mA
  - +5V - 0mA
