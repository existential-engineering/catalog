description: The Studio Jubilee 1x12 Cabinet is a compact passive 1x12" guitar speaker cabinet designed as the matching extension cab for the Studio Jubilee range. Loaded with a single 16Ω Celestion V-Type speaker and rated at 70W, it delivers the classic rock and metal tones of the Silver Jubilee in a small, studio- and home-friendly footprint that pairs naturally with the Studio Jubilee head or extends the Studio Jubilee combo.
details: |-
  The Studio Jubilee 1x12 cab pushes the shimmering classic rock tones and dirty overdriven sound of the Jubilee to the front.

  Providing the grunt for the Studio Jubilee Head or being utilised as an extension cab for the Studio Jubilee Combo, the UK-made Studio Jubilee 1x12 Cabinet lets you recreate the classic rock and metal roar in any environment.

  One 12-inch Celestion V-Type speaker handles 70W at a 16 ohm unit impedance, through a single input.

  Inspired by the Silver Jubilee, the cabinet is compact and portable. Designed and engineered in UK. Made in UK.
