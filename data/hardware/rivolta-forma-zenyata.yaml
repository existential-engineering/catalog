description: A guitar from the Forma Series with a triangular-inspired body and
  headstock silhouette, made from lightweight Simarouba wood. It features a
  rosewood fretboard, 25-inch scale, 23.5 frets, an angled P90 neck pickup, and
  a humbucker bridge pickup, plus an included hardshell case.
details: |-
  DESCRIPTION

  'The shape of things to come...'

  Introducing the Forma Zenyata by Rivolta Guitars. The Rivolta Forma Zenyata was designed by Dennis Fano to incorporate triangular elements into the body and headstock silhouette. Drawing inspiration from various classic vintage instruments, the Forma Zenyata is a real show stopper with it's sleek lines and carves, coupled with incredible sustain and an ergonomic playing experience. The Rivolta Forma Zenyata is made from ultra light weight, yet resonant Simarouba wood and features a Rosewood fretboard, 25" scale, 23 1/2 Medium Jumbo Frets (Yes, we said 23 1/2!), angled P90 in the neck, Humbucker in the bridge and a custom fitted vintage style hardshell case. FEATURES & SPECS
