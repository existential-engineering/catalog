description: "High headroom three-way with unbelievable imaging. The 8341A is
  the point source monitor with the perfect blend of size and performance."
details: |-
  The 8341A is a three-way coaxial point-source studio monitor from Genelec's "The Ones" range, built around a die-cast aluminium Minimum Diffraction Enclosure (MDE) with a reflex port. Its acoustic design combines two 170 x 90 mm racetrack bass drivers with a coaxial mid/treble assembly using a 90 mm midrange and a 19 mm metal-dome tweeter, all radiating from a single acoustic axis for exceptionally stable imaging.

  Each driver section has its own amplification: 250 W of Class D power for the bass, 150 W for the midrange, and 150 W for the treble, with active crossovers at 500 Hz (bass/mid) and 3000 Hz (mid/treble). The result is high headroom and accurate reproduction from a compact cabinet.

  As a Smart Active Monitoring (SAM) product, the 8341A is compatible with Genelec Loudspeaker Manager (GLM) software, which measures each monitor in its room and applies automatic calibration for level, delay, and room-response compensation across stereo, surround, and immersive configurations.
