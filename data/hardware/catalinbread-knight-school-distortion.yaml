description: There is perhaps nothing more emblematic of modern guitar rock than
  the humble op-amp distortion. The MXR Distortion+ is the simplest of the
  bunch, and this circuit replaces its single op-amp with a dual op-amp for much
  more gain on tap, with an updated clipping diode arrangement.
details: |-
  There is perhaps nothing more emblematic of modern guitar rock than the humble op-amp distortion. This effect took its greatest hold in the late '70s when Boss released the OD-1, but the concept of intentional hard-clipping distortion really took hold across three platforms that all released relatively close together: the ProCo RAT, the Boss DS-1 and the MXR Distortion +. The MXR unit is the simplest of the bunch, and the Knight School Distortion updates it to add an extra gain stage. Where the original used a single op-amp, this circuit uses a dual op-amp to goose the distortion and provide much more gain on tap than the average IC-based gain, giving tons of extra saturation with minimal-gain sparkle and clarity. An updated clipping diode arrangement provides maximum clipping without sounding harsh. It also takes other pedals extremely well without any offputting artifacts.
specs: |-
  - Dual op-amp reworking of the MXR Distortion+ topology with an extra gain stage
  - Updated clipping diode arrangement
  - Controls: Volume, Distortion
  - Accepts a 9V center-negative DC power supply
  - Sold as a DIY kit or fully assembled
