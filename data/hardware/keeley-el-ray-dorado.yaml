description: Overdrive pedal voiced after 1960s British amplifier tone, with two
  gain modes selected by a power toggle.
details: |-
  The El Rey Dorado is an overdrive aimed at the Plexi amplifier tone of the 1960s. That tone covers a wide range depending on the amplifier's power, valves, speakers and cabinet, and the pedal targets the centre of it; one of the reference points named for the voicing is a reissue JTM 45/100 full stack.

  Two gain modes are selected by the Power toggle, which changes the amount of compression and harmonic content. Low Power mode is louder, with more girth and fewer harmonics, for a more old-school crunch. High Power mode is more compressed, with more harmonics and a tighter, more defined tone, aimed at lead sounds.

  The control set is simple: Volume, Gain and Tone alongside the Power toggle. The pedal is compatible with a 9 volt battery, which is not supplied.
