specs: |-
  - Features - Up to 200 watts
  - 3 band EQ (Bass/Mid/Treble)
  - Gain
  - Limiter
  - Reverb
  - Effects Loop
  - FRFR, FullQ and Vintage voices
  - Controls - Primary Controls
  - GAIN adjusts the distortion from clean to overdrive.
  - LIMITER reduces gain just enough to prevent overdrive, and then restores gain as the note dies away.
  - 3-BAND ACTIVE EQ Boosts and cuts Bass, Mids, and Treble frequencies.
  - Effects Controls
  - EFFECTS LOOP send and return jacks.
  - REVERB
  - 3 VOICE SWITCH
  - Volume Controls
  - MASTER adjusts speaker power volume level. (0-200 watts)
  - Specifications Electronic Performance Input ¼" mono, 2M input impedance Effects Loop 1V full scale, 1K Send impedance, 47K Return impedance Signal Out (Front) TRS, switchable, Line Out pre-Master +4dB balanced, or Headphone post-Master. Power AC Power 100–240Vac, 50–60 Hz, 250 W maximum Power Output 0-200 watts, 4-8 ohms Speaker 1 Output 8 ohms, 200W minimum recommended rating Speaker 2 Output 4 ohms, 200W minimum recommended rating Dimensions HxWxD 8.5" x 7.25" x 3.25" (21.6cm x 18.4cm x 8.3cm) Weight 3 lbs (1.5 kg)
