url: http://www.afterlateraudio.com/products/ornate-criminal
prices:
  - amount: 350
    currency: USD
    asOf: 2026-09-04
    source: official-website
description: A module based on the Ornament and Crime design running Phazerville
  firmware, offering 8 CV outputs, 8 CV inputs, 4 trigger inputs, and stereo
  audio in/out.
details: |-
  Based on the OC Teensy 4.1 reference design from Paul @ PJRC and runs the Phazerville firmware from Nick and crew. This all builds on the work from the mxmxmx crew on the original Ornament and Crime. Thanks to everyone for all of the contributions. 8 CV Outs
  8 CV Ins
  4 Trig Ins
  Stereo audio in
  Stereo audio out

  There are headers that will connect to a MIDI expander that has 3.5mm jacks for IN/OUT and USB host/device. There is also an I2C QWIIC connector for those looking to tinker.
