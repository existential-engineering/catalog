details: |-
  The Integrated Series began as Free The Tone's 15th anniversary project, restructuring every component of an effects unit around the company's accumulated experience and its own sense of tone. The second release in that series is the BLACK VEHICLE, a bass overdrive pedal.

  The BLACK VEHICLE carries a newly developed HTS (Holistic Tonal Solution) circuit designed for electric bass. The HTS circuit prevents a thin sound, keeps the texture of the unit's sound consistent whether the effect is on or off, and passes the received signal on to the following circuit in optimal condition.

  Newly designed EQ and MIX circuits are also fitted. The TREBLE and BASS controls affect only the drive sound, and the MIX circuit blends the unprocessed dry signal back in with it. Together they minimize signal phase error and stop the sound being buried as the drive amount is increased, so the drive retains a clear pitch and contour.

  Two types of boost are provided. PRE BOOST controls how much signal is sent into the overdrive section and POST BOOST adjusts the output volume, so the volume can be raised without changing the tonal character, or the distortion amount increased without changing the volume.

  The pedal has the sparkling overtones and long sustain of a well driven valve amplifier and covers a wide range of amp-like sounds, from a natural overdrive through to a rich distorted tone. It shares the series' custom turned brass knobs, optimized case design and metal IC tone plate for damping and shielding.
specs: |-
  - Input impedance: min. 1 MOhm
  - Output load impedance: min. 10 kOhm
  - Controls: LEVEL, MIX, BASS, TREBLE, GAIN, POST BOOST, PRE BOOST
  - Terminals: 2 x 1/4 inch phone jacks (input and output), 1 x DC 9V input jack for AC adapter
  - Power supply: 9V DC centre negative polarity, no AC adapter included
  - Current consumption: approx. 200 mA
  - Dimensions: 95 x 124 x 51 (H) mm including protuberances such as footswitches and jacks
  - Weight: approx. 640 g
  - HTS (Holistic Tonal Solution) circuit developed for electric bass
  - TREBLE and BASS EQ circuits that act on the drive sound only
  - MIX circuit to blend the dry signal with the drive sound
  - Custom turned brass control knobs
  - Metal IC tone plate for damping and shielding
  - Accessories: warranty card, Web Access Card, 4 rubber feet
