description: >-
  The Spectral Audio Cyclus 3 is a hardware MIDI sequencer that brings
  analog-style sequencing to MIDI gear. It features 112 patterns with 8 tracks
  each, independent loop points per subtrack, and supports real-time recording,
  step-time entry, and direct knob input. The desktop module can also be
  rack-mounted with optional rack ears.
details: |-
  The Cyclus 3 was designed to provide old-school analog-style sequencing for MIDI equipment, bridging the gap between classic hardware sequencer workflows and modern MIDI connectivity. Unlike vintage analog sequencers, it does not output CV/Gate signals, focusing entirely on MIDI-based control.

  Each of the 8 tracks contains 5 subtracks covering note pitch, xtranote, step length, note-off time, velocity, and controller settings. Users can choose between xtranote or controller subtrack modes, and controller tracks are capable of transmitting pitch bend data. Independent loop points for each subtrack enable evolving, non-linear arrangements where different parameters cycle at different rates.

  Data entry is flexible, supporting real-time recording, step-time input, and direct knob tweaking. A post-recording analysis function converts captured note and controller data into manipulatable analog-style tracks. One track can also modulate another track's pitch, opening up generative sequencing possibilities.

  The sequencer uses an interrupt-based architecture for precise timing accuracy. It supports MIDI clock transmission and reception, RAM dumping to a PC, and firmware updates via MIDI. Memory capacity is generous, with 112 patterns organized into up to 30 songs containing 80 steps of pattern changes and 1-32 loop configurations.
specs: |-
  - Type: Hardware MIDI Sequencer
  - Patterns: 112
  - Tracks Per Pattern: 8
  - Subtracks Per Track: 5 (note pitch, xtranote, step length, note-off time, velocity/controller)
  - Songs: 30
  - Song Steps: 80 pattern changes
  - Song Loops: 1-32
  - Song Name Length: 8 characters
  - Data Entry: Real-time recording, step-time, knob input
  - Connectivity: MIDI In, MIDI Out
  - Clock: MIDI clock transmit and receive
  - Additional Features: RAM dump to PC, firmware update via MIDI
  - Form Factor: Desktop module with optional rack ears
