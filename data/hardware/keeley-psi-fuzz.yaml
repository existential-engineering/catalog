description: Thick sustain for creamy leads Hybrid Op-Amp + Germanium Transistor Fuzz
details: |-
  The Psi Fuzz reworks the op-amp take on a classic high-sustain fuzz circuit. One of the gain stages is inverted, the midrange is brought forward and the bass tightened, and a germanium transistor output stage is added, making the pedal an op-amp and transistor hybrid aimed at thick sustain for lead playing.

  The design notes on the page describe the changes in detail. The second gain stage is a Sallen-Key filter whose roughly 1 kHz second-order corner was made sweepable by the Voice control, so harmonics can be brought in or out, and a lower-noise op-amp was chosen to keep noise down without dulling the guitar tone. The first stage was rebuilt as a non-inverting op-amp so that input and output stay in phase once the germanium gain stage is added.

  Six silicon diodes in the third stage's feedback path were replaced by two LEDs, one of which shows through a hole in the top of the enclosure as a visible clipping indicator. The germanium stage sits between the Voice and Voltage controls as a common-emitter amplifier built around an AC187, biased with its collector near 4.5 V for about 10 dB of gain. A germanium diode is fitted in reverse polarity across the base-emitter junction to offset the transistor's temperature coefficient, which heat-gun testing above 140 degrees Fahrenheit was used to confirm.

  The circuit uses a single quad op-amp package plus that one transistor. The pedal was offered in two artwork treatments: a hand-drawn late-1960s style illustration by Erin Lofties, and a stripped-back Greek Gold Deco finish.
