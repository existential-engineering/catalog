details: |-
  The ARIES marked a major turning point for Kiesel since its release in 2015. With its prominent bevel and effortless fret access in a bolt-on configuration, the Aries series remains the recommended guitar for beginners and pros alike.

  To this day, the model remains the most popular among players and offers the widest diversity of options, including five bridge types, 6 to 8-string configurations, and many more.

  The series proved so popular that five spin-offs are currently offered in the Kiesel line-up: the Aries Neck-Through, AC2, A2, NA2, and A2 Bass.
specs: |-
  - Construction: bolt-on with radiused neck heel
  - Scale length: 25.5", 27" or 29" fixed, plus multiscale options of 25.5" to 26.5", 25.5" to 27" and 26" to 27.5"
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Fingerboard: ebony with 14" or 20" radius
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability
  - Neck width options from 1.69" to 2.42" wide at the nut
  - Body: alder
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Bridge: five bridge types offered, with the spec table listing the Hipshot fixed bridge and Hipshot Solo Saddle bridge at .4125" (10.5mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: pointed inline headstock
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Strings: Elixir Nanoweb 1046E
  - Body dimensions: 38.25" to 40.5" long, 1.65" thick, 12.5" wide depending on configuration
  - Weight: 7.8 to 9 lbs
  - Offered in 6 to 8-string configurations and in standard or multiscale layouts, configured to order
  - Five spin-off models exist in the Kiesel line-up: the Aries Neck-Through, AC2, A2, NA2 and A2 Bass
  - Built to order with a choice of body, top, fingerboard and finish options
