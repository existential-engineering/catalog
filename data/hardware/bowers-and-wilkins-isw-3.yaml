details: |-
  Bass is a vital element in the enjoyment of sound. It's true for both music and movies, and it's as true for custom installation as it is for an audiophile's two-channel hi-fi. The ISW-3 is an incredibly versatile and compact in-wall and in-ceiling subwoofer, capable of providing high-quality bass output in spaces that may have previously missed out on this vital element, including kitchen cabinets. Its balanced design, featuring 2 x 6.5in drivers, means that it can be placed in a variety of locations without causing vibrations.

  The manual covers four separate applications: in-ceiling and in-wall installations in new construction, under the floor, and inside a kitchen unit. In-ceiling work fits the cabinet between joists on standard 40cm (16in) or greater spacing, with 25cm (10in) or more clearance behind the underside of the joists, and the visible louvre straddling the gap between them.

  The subwoofer is passive. Appropriate gauge speaker cable is run to the installation point, stripped and connected to the spring terminals on the cabinet observing correct polarity, and the excess is secured with the attached cable tie to prevent rattles. The information sheet lists the CDA-4D compact distribution amplifier as a mandatory partner, and quotes power handling of 250W into a nominal 8 ohms.

  The braced 22L MDF cabinet measures 470 x 330 x 235mm and weighs 12.5kg, behind an 89 x 345 x 6mm baffle needing a 334 x 78mm cut-out. Frame and grille are finished in semi-matt white and are paintable. The carton adds a louvre and louvre fascia, cowl extension, cut-out template, gasket strips, angle support brackets, a support bar and rubber feet.
specs: |-
  - Description: in-wall / in-ceiling subwoofer, passive (closed cabinet)
  - Drive units: 2x ø165mm (6.5in) Paper / Aramid Fibre cone bass
  - Nominal impedance: 8 ohms (minimum 6.3 ohms)
  - Power rating: 250W
  - Frequency response (-3dB): 25Hz to 222Hz
  - Frequency range (-6dB): 19Hz to 400Hz
  - Baffle dimensions: Height 89mm (3.5in), Width 345mm (13.6in), Depth 6mm (0.23in)
  - Cut-out size: Height 334mm (13.15in), Width 78mm (3.1in)
  - Frame / grille finish: semi-matt white (paintable)
  - Cabinet dimensions: Height 470mm (18.5in), Width 330mm (13.0in), Depth 235mm (9.25in)
  - Cabinet material: MDF, braced
  - Volume: 22L
  - Net weight: 12.5kg (27.6lb)
  - Amplifier (mandatory): CDA-4D compact distribution amplifier
  - Connection: spring terminals on the cabinet, bare wire
