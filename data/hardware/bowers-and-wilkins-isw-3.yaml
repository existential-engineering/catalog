description: The ISW-3 is an incredibly versatile and compact in-wall and
  in-ceiling subwoofer, capable of providing high-quality bass output in spaces
  that may have previously missed out on this vital element. Its balanced
  design, featuring 2 x 6.5in drivers, means that it can be placed in a variety
  of locations without causing vibrations.
details: |-
  ISW-3 is a compact custom-installation subwoofer built around two 165mm (6.5in) paper/Aramid fibre bass drivers in a braced MDF enclosure of 22 litres. The two drivers are arranged as a balanced pair, which is what lets Bowers & Wilkins place it in locations that would normally transmit vibration into the structure, including inside kitchen cabinets.

  It is a passive subwoofer. Nominal impedance is 8 ohms with a 6.3 ohm minimum and the power rating is 250W, and the information sheet lists the CDA-4D compact distribution amplifier under 'Amplifier (mandatory)'. There is no on-board amplifier, no mains inlet, no line-level input and no gain, phase or crossover control anywhere on the product: all of that lives in the external amplifier.

  Bass extension is the point of the design. Frequency response is quoted as 25Hz to 222Hz at -3dB with a -6dB range of 19Hz to 400Hz, from a cabinet measuring 470mm (18.5in) high by 330mm (13.0in) wide by 235mm (9.25in) deep and weighing 12.5kg (27.6lb). Output reaches the room through a narrow louvre whose visible baffle is only 89mm (3.5in) high by 345mm (13.6in) wide.

  The same product covers four installation cases, and the manual walks each one: in-ceiling between joists on 40cm (16in) or greater spacing with the louvre straddling the gap, in-wall between studs, under a floor, and free-standing inside cabinetry with the cowl extension vent aligned to a cut-out in a toekick panel. In-ceiling installation needs 25cm (10in) or more of clearance behind the underside face of the joists, and the cabinet is carried on four L-brackets screwed to the joists.

  Connection in every one of those cases is the same: strip the ends of the speaker cable and connect them to the spring terminals on the cabinet, observing polarity, then secure the slack with the cable tie attached to the subwoofer so it cannot rattle. Self-adhesive gasket strips are applied to the support bar and the cabinet so they bear on the drywall panel rather than buzzing against it.
specs: |-
  - Description: in-wall / in-ceiling subwoofer
  - Drive units: 2x 165mm (6.5in) Paper/Aramid Fibre cone bass drivers
  - Nominal impedance: 8 ohms (minimum 6.3 ohms)
  - Power rating: 250W
  - Frequency response (-3dB): 25Hz - 222Hz
  - Frequency range (-6dB): 19Hz - 400Hz
  - Amplifier (mandatory): CDA-4D compact distribution amplifier
  - Passive: no on-board amplifier, no mains inlet, no line-level input
  - Connection: spring terminals on the cabinet, observing polarity
  - Baffle dimensions: 89mm (3.5in) height x 345mm (13.6in) width x 6mm (0.23in) depth
  - Cut-out size: 334mm (13.15in) height x 78mm (3.1in) width
  - Product dimensions: 470mm (18.5in) height x 330mm (13.0in) width x 235mm (9.25in) depth
  - Cabinet material: MDF, braced
  - Internal volume: 22L
  - Net weight: 12.5kg (27.6lb)
  - Frame/grille finish: semi-matt white (paintable), per the information sheet
  - Finish: Black
  - Installation: in-ceiling between joists, in-wall between studs, under-floor, or free-standing inside cabinetry
  - In-ceiling clearance: 25cm (10in) or greater behind the underside face of the joists; joist spacing 40cm (16in) or greater
