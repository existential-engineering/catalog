description: A limited-edition Custom Shop collaboration between Misha Mansoor
  and the Jackson Custom Shop, pairing vintage-inspired curves with aggressive
  performance specifications. Built around a 30" baritone scale length with a
  roasted ash body and quartersawn caramelized flame maple neck, it features
  Bare Knuckle Juggernaut humbuckers, a Hipshot fixed bridge, and Gotoh locking
  tuners in nitrocellulose lacquer.
specs: |-
  - Body: Roasted ash, Surfcaster shape, nitrocellulose lacquer finish, Army Drab over White
  - Neck: Quartersawn caramelized flame maple, bolt-on, speed neck shape, hand-rubbed urethane gel finish
  - Fingerboard: Caramelized flame maple, 20" radius
  - Scale Length: 30"
  - Frets: 22 jumbo stainless steel
  - Nut: Bone, 1 11/16" width
  - Pickups: Bare Knuckle Juggernaut humbuckers (bridge and neck), HH
  - Controls: Volume, tone (500K)
  - Switching: 3-position toggle
  - Bridge: Hipshot 6-Fixed (.175)
  - Tuners: Gotoh locking
  - Hardware Finish: Chrome
  - Strap Buttons: Dunlop Straplok dual design
  - Strings: Nickel-plated steel (.017-.074)
  - Master Built By: Pat Campolattano, Jackson Custom Shop
