description: BETSY is a portable powered speaker from Ashdown's Elizabeth Line,
  pairing the brand's styling with modern connectivity. It features an iconic VU
  meter calibrated to display audio output, dual 4-inch coaxial drivers in a
  stereo 2.0 configuration, and 50W + 50W of power. Inputs include optical, USB,
  and a 3.5mm auxiliary jack, plus Bluetooth 5.2 wireless streaming, with
  adjustable bass and treble controls.
details: |-
  Part of the Ashdown Elizabeth Line, BETSY is a portable powered stereo speaker with an iconic front-panel VU meter. Connectivity: Bluetooth 5.2, optical, USB, and 3.5mm AUX. Adjustable bass and treble controls.
specs: |-
  - Power output: 50W + 50W
  - Drivers: dual 4-inch coaxial
  - Sound mode: stereo 2.0
  - Bass: +/- 3dB (55Hz - 1kHz)
  - Treble: +/- 3dB (1kHz - 20kHz)
  - Connectivity: Bluetooth 5.2, optical, USB, 3.5mm AUX
  - VU meter
  - Dimensions (H x W x D): 185 x 195 x 330 mm
  - Weight: 4.9 kg
  - Power: 110V - 240V AC
