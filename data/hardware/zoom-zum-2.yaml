description: A plug and play USB condenser microphone for podcasters, YouTubers,
  streamers, musicians and voiceover artists, with the warm, smooth sound of a
  professional broadcast microphone.
details: |-
  The ZUM-2 is a back electret condenser USB microphone aimed at podcasters, YouTubers, streamers, musicians and voiceover artists. It takes the side-address broadcast microphone form and puts a USB Type-C connector on the base, so it records and streams without an interface or a preamp in front of it.

  The capsule is supercardioid, which narrows the pickup toward whatever sits in front of the microphone and rejects room noise arriving from the sides and rear. Frequency response runs 20 Hz to 20 kHz, sensitivity is -35 dBV/Pa, and maximum sound pressure input is 135 dB SPL.

  Conversion is 24-bit at sample rates of 44.1, 48, 88.2 and 96 kHz. No driver installation is needed on either platform: the microphone is class compliant and appears as an audio device once the supplied cable is connected to a Mac or PC.

  A headphone output on the body gives latency-free monitoring of the microphone alongside computer playback, with a dedicated knob setting the level. The output delivers 110 mW per side into a 32 ohm load. A status LED sits above the knob.

  The microphone measures 54 mm in diameter by 150 mm long and weighs 422 g. Power arrives over the USB connection as DC 5 V bus power, so there is no separate adapter or battery. The box holds the microphone, a TPS-4 desktop tripod stand, a pivoting mic stand mount, a foam windscreen and a 2 metre USB Type-C to Type-A cable.
specs: |-
  - Type: back electret condenser
  - Polar pattern: supercardioid
  - Frequency response: 20 Hz to 20,000 Hz
  - Sensitivity: -35 dBV/Pa
  - Maximum SPL: 135 dB SPL
  - Sampling frequency: 44.1 / 48 / 88.2 / 96 kHz
  - Bit depth: 24-bit
  - Output: USB (Type-C) and headphone (3.5 mm phone jack), 110 mW + 110 mW into a 32 ohm load
  - Power requirements: USB bus power, DC 5 V
  - Dimensions: 54 mm x 150 mm
  - Net weight: 422 g
  - Class compliant, no driver installation required on Mac or PC
  - Dedicated headphone volume knob for direct monitoring of microphone and computer audio together
  - In the box: ZUM-2 USB microphone, TPS-4 desktop tripod stand, pivoting mic stand mount, foam windscreen, 2 metre (6.56 ft) USB Type-C to Type-A cable
