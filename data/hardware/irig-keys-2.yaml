details: |-
  The iRig Keys 2 is a universal MIDI keyboard controller featuring 37 velocity-sensitive mini-keys with multi-platform connectivity via included Lightning, USB-C, and USB-A cables. It works with iPhone, iPad, Android, Mac, and PC right out of the box, and also functions in standalone mode with a USB power supply or battery pack.

  The control surface includes pitch bend and modulation wheels, 4+4 assignable knobs, an assignable data push encoder, octave up/down buttons, program up/down buttons, and audio volume control. The SET button stores up to 4 configurable setup memories for quick recall.

  MIDI I/O is available via 2.5mm TRS (adapter included), with a headphone output and sustain pedal input. Included software comprises SampleTank 4 SE and SampleTank FREE for iOS.
