details: |-
  PRO SERIES DL151 — 24 Input Stage Box with 24 Midas Microphone Preamplifiers.

  DL151 is a 2U 19" fixed-configuration rack I/O unit with 24 mic/line level inputs and delivers legendary Midas sound quality utilising time-tested and road-proven technologies. Featuring award-winning Midas microphone preamplifiers with 2.5 dB analogue gain steps and two AES50 network ports providing dual redundancy, the DL151 is the ideal partner to all Midas PRO and M32 Series digital consoles, enabling a digital snake connection from Front of House to stage.

  Key features:
  - 24 award-winning Midas microphone preamplifiers with switchable +48 V phantom power
  - Remote operation up to 100 m via CAT5/5e cable
  - Selectable 96 kHz or 48 kHz sample rate operation
  - All settings programmable from front panel controls or console
  - PSU status indicator LEDs and configuration LCD display on front panel
  - Supports dual redundant AES50 networks
  - Industry standard RJ-45 AES50 network ports
  - Rugged 2U rackmount chassis for durability in portable applications
  - Auto-ranging universal switch-mode power supply

  Digital Audio Networking: SuperMAC (AES50-Compliant) digital audio networking technology from Klark Teknik simultaneously provides high channel counts, ultra low and deterministic latencies, sample-synchronous and phase-aligned networked clock distribution, error detection and correction, network redundancy, and ease of deployment. DL151 is compatible with all Midas digital consoles and audio system engines, as well as with any other AES50-equipped devices.
specs: |-
  - Form Factor: 2U 19" rackmount
  - Microphone Preamplifiers: 24 award-winning Midas microphone preamplifiers
  - Analogue Gain Steps: 2.5 dB
  - Phantom Power: +48 V switchable per channel, with LED indication
  - Sample Rates: 96 kHz (Midas PRO Series) or 48 kHz (M32 Series)
  - AES50 Network Ports: 2 (dual redundancy)
  - Network Standard: AES50-2011 compliant, SuperMAC (Klark Teknik)
  - Network Topology: 100 Megabit Ethernet frame-based digital audio network
  - AES50 Connector: Industry standard RJ-45
  - AES50 Cable: CAT5/5e up to 100 m
  - Ethernet Control Port: 1
  - Front Panel: LCD display with menu navigation and LED status indicators
  - Configuration: Remote (from console) or local (front panel)
  - Power Supply: Auto-ranging universal switch-mode
  - Power Requirements: 100 to 240 VAC, 50 to 60 Hz
  - Chassis: Steel 2U rackmount
  - Dimensions: 483 mm wide x 416 mm deep x 88 mm high (19.0" x 16.4" x 3.5")
  - Weight: 6.9 kg (15.2 lbs)
