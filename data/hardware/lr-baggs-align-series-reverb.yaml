description: What guitar player doesn’t like a little reverb? When we created
  the Synapse Personal PA years ago, we developed a custom acoustic reverb. This
  feature was so popular we had to use it when we created this pedal.
details: |-
  What guitar player doesn’t like a little reverb? When we created the Synapse Personal PA years ago, we developed a custom acoustic reverb. This feature was so popular we had to use it when we created this pedal. The circuit seamlessly integrates the wet and dry signals with the effect in side-chain with our pristine input and output circuitry so it never muddies the source. The pedal’s Tone control adds versatility by sweeping from warm and muted to open and present.
specs: |-
  - Reverb control blends the effect with the dry signal
  - Decay control adjusts the reverb tail length
  - Tone control sweeps from warm and muted to open and present
  - Volume level control
  - Engage footswitch for affected signal or true bypass
  - Side-chain effect design to preserve the dry signal
  - Powered by 9V battery or 9V DC supply
