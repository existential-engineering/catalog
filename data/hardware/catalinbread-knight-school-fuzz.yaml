details: |-
  The Knight School Fuzz began as an instructional device for a local pedal building class taught by a local amp tech.

  The brief was three simple requests: first and foremost, a ripping fuzz pedal that covers all the bases from full and throaty to sputtery and gnarly. Secondly, it had to be able to be placed almost anywhere in the chain, compared to say, a Fuzz Face, which is notoriously picky about where it goes. Thirdly, it had to be simple to build, easy enough for even the most novice solder jockeys.

  The result is based on one of the most underrated fuzz circuits in existence: the Jordan Boss Tone. This device originally plugged straight into your guitar during an era where pedalboards weren't really "a thing" yet, so integrating one into a modern setup isn't a simple procedure as most other vintage units.

  Unlike many circuits of the era, the Boss Tone isn't based on anything else; most other venerable legacy fuzzes were copying each other in some form or another, but Jordan Electronics, whose engineers also built things like Geiger counters, was up for the challenge of an original circuit, and they crushed it with the Boss Tone, even though the housing wasn't super user-friendly.

  Despite its integration difficulties, you can hear the Boss Tone on several classic records by ZZ Top, the Black Keys, Spirit, New Riders of the Purple Sage, and countless others. The Knight School Fuzz riffs on this formula, with some value swaps, different transistors for a more modern sound, and a Bias control that utterly dissolves the sound into gnarled madness as you crank it.
specs: |-
  - Based on the Jordan Boss Tone circuit with value swaps and different transistors
  - Controls: Volume, Bias, Gain
  - Bias control loads the supply down from 9V to just under 5V
  - 2N5088 NPN transistor; 1N4148 silicon clipping diodes
  - Accepts a 9V center-negative DC power supply supplying at least 0.5mA
  - Sold as a DIY kit or fully assembled
