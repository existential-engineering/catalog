description: Andy Timmons' signature two-channel overdrive/distortion with an
  independent footswitchable boost, three wattage-mode toggle, and wide-ranging
  drive from blues to high-gain distortion.
details: |-
  The AT+ is Andy Timmons' signature overdrive pedal, an evolution of the original AT (@) from 2016. The drive channel is identical to the original AT — featuring Volume, EQ (bright/dark tone), Drive (blues to thunderous distortion), Air (presence-style top-end control), and a three-way wattage toggle (25W = most compression/saturation, 50W = balanced, 100W = open crunch/high volume). New to the AT+ is an independent footswitchable Boost — a slightly dirty, overdriven pre-boost that hits the front end of the drive channel for more saturation and definition, and can also be used standalone. Version history: V1 = diamond knob layout, single footswitch; V2 = AT+ U-shaped layout, two footswitches (limited edition also in black).
