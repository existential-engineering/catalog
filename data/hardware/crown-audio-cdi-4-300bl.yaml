name: CDi 4|300BL
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/cdi-4-300bl
description: A 4-channel professional power amplifier with analog and BLU link
  digital audio inputs, delivering 300W per output channel. Part of Crown's CDi
  DriveCore series for small to medium installations such as restaurants and
  retail.
details: |-
  An evolution in amplification, providing an impressive mix of high-performance, rich feature set, and competitive cost. Using technology derived from Crown's flagship Installed Sound amplifier (the DriveCore Install series), the CDi DriveCore 4|300BL offers streamlined functionality for diverse applications including restaurants and retail.

  The amplifier features network control and monitoring via HiQnet Audio Architect software, high-level onboard DSP with 8-band parametric EQ, crossover, routing, and LevelMAX limiter, plus the BLU link digital audio bus (256 channels, fault-tolerant) for send and receive.

  Direct Drive 70/100Vrms output capability supports high-impedance speaker loads without requiring an external transformer. The intuitive front-panel interface enables full configuration on the unit, and pre-loaded JBL speaker tunings expedite installation.
specs: |-
  - 4 channels
  - 300W per channel @ 4Ω
  - Dual mode: 150W @ 2Ω, 300W @ 4Ω, 300W @ 8Ω, 150W @ 16Ω, 300W @ 70Vrms, 300W @ 100Vrms
  - Bridge mono: 300W @ 4Ω, 600W @ 8Ω, 600W @ 16Ω, 600W @ 140Vrms, 600W @ 200Vrms
  - Sensitivity: 0.7V RMS (full rated power @ 8Ω)
  - Signal-to-Noise Ratio: >104dB
  - THD: 0.35% (full rated power, 20Hz–20kHz)
  - Damping Factor: >1000 (20Hz–100Hz)
  - Frequency Response: ±0.5dB (8Ω, 20Hz–20kHz)
  - Crosstalk: >80dB (below rated power, 20Hz–1kHz)
  - Input Impedance: 20kΩ balanced / 10kΩ unbalanced
  - BLU link: Yes (send and receive)
  - Onboard DSP: 8-band parametric EQ, crossover, LevelMAX limiter
  - Input delay up to 1000ms, output delay up to 100ms
  - Network control via HiQnet Audio Architect (TCP/IP)
  - Direct Drive 70/100Vrms output (no transformer required)
  - Pre-loaded JBL speaker tunings
  - GPIO/AUX control port
  - Dimensions: 19" W × 3.5" H × 12.25" D (excluding 1.3" front panel protrusion)
  - Weight: 16.13 lbs (7.31 kg)
  - Power: IEC 320 inlet, 100–240V AC
