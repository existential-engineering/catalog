name: 500VPR 10-Slot Rack w/PSU
manufacturer: api-audio
primaryCategory: rack-mount
categories:
  - outboard
url: https://apiaudio.com/product/500vpr-10-slot-rack-w-ps/
description: 10-slot 500 Series rack accepting all API standard 5.25" × 1.5"
  format modules. Features XLR input and output connectors wired PIN 2 hot.
  Includes the API L200PS external tri-polar power supply. Five-year warranty.
details: |-
  10-slot 500 Series rack compatible with API 512c, 525, 550A, 550b,
  560, and other standard API 500-series modules. XLR I/O wired PIN 2 hot.
  Includes the L200PS power supply (also sold separately at $499). Note: older
  API 560A equalizers require a circuit board modification before use to prevent
  damage from 48V potential.
specs: |-
  - Slots: 10 (API 500 Series format, 5.25" × 1.5")
  - Audio I/O: XLR (PIN 2 hot)
  - Power supply: External tri-polar (L200PS included)
