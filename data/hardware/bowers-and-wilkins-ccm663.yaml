description: Smaller 2-way in-ceiling design with adjustable aluminum-dome
  tweeter and Aramid mid/bass for superb sound.
details: |-
  The CCM663 is a true high performance ceiling-mount speaker. The tweeter has a 25mm (1in) aluminium dome and its housing pivots for adjustable off-axis treble response.

  The bass/midrange driver's die-cast chassis provides extra rigidity which results in a cleaner, faster bass, and a three-position EQ switch gives a better off-axis response. The blue Aramid Fibre (Kevlar) cone means that the unit is well hidden behind the grille but still produces a remarkably clear and dynamic sound.

  Incorporating QuickDogs and plug-and-play functionality it is quick and easy to install. The product page highlights QuickDogs, a die-cast bass/midrange chassis, an aluminum dome tweeter and a three-position EQ switch, and lists the speaker as a Performance two-way in-ceiling speaker in a White finish.

  CCM6 Series ceiling speakers install into a cut ceiling aperture using the supplied cut-out template. Speaker cable connects to the spring terminals on the side of the frame, red for the amplifier's positive terminal and black for its negative, and the frame is then lifted into the aperture and held by four QuickDogs spring clamps. The baffle carrying the drivers and crossover fits into the frame on three push-lock fasteners, and the grille is held magnetically.
specs: |-
  - Description: 2-way in-ceiling system
  - Drive units: 1x ø25mm (1in) Nautilus swirl loaded aluminium dome tweeter
  - Drive units: 1x ø150mm (6in) blue Aramid Fibre cone bass/midrange driver
  - Frequency range (-6dB): 45Hz to 50kHz
  - Recommended amplifier power: 25 to 130W
  - Sensitivity SPL (2.83V, 1m): 88dB
  - Nominal impedance: 8Ω (minimum 4.5Ω)
  - Frame diameter: 240mm (9.5in)
  - Cut-out diameter: 202mm (8in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Pre-mount kit: C6
  - Back box: 6C
  - Pivoting tweeter housing and three-position EQ switch
  - Red and black spring terminals on the side of the frame
  - Finish: White
