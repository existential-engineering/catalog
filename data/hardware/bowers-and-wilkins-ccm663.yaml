description: The CCM663 is a true high-performance ceiling-mount speaker. The
  tweeter has a 25mm (1in) aluminium dome and its housing pivots for adjustable
  off-axis treble response.
details: |-
  CCM663 is a two-way passive in-ceiling speaker in the Bowers & Wilkins Performance Series, built around a 150mm (6in) blue Aramid Fibre cone bass/midrange driver and a 25mm (1in) Nautilus swirl loaded aluminium dome tweeter. It is a passive design with no amplifier and no mains connection: it is driven from an external amplifier over ordinary speaker cable.

  The tweeter housing pivots so the high frequency axis can be aimed at the listening area rather than straight down. Tilt angle indicators at 15 and 30 degrees are marked as dots on the tweeter body, and a three-position equalisation switch on the baffle is set to match the number of tilt dots, which keeps the off-axis treble balance correct at whichever angle is chosen. The bass/midrange driver uses a die-cast chassis for extra rigidity, which Bowers & Wilkins credits for cleaner, faster bass.

  The speaker is a three-part assembly: a baffle carrying the drive units and crossover, a mounting frame with an integrated bezel, and a magnetically secured grille. Speaker cable lands on side-mounted red and black spring terminals on the frame, and the baffle connects automatically through a mating connector as it is pushed into the frame and locked with three push-lock fasteners. Four QuickDog spring clamps hold the frame flush against the ceiling.

  Installation is into conventional stud and sheetrock ceilings. A 202mm (8in) round aperture is required and at least 140mm (5.51in) of clear depth behind the plasterboard, and the carton includes a cut-out template and a paint mask so the flange and grille can be painted in conventional domestic paint without contaminating the terminals or the grille magnets. Pre-mount kits and back boxes are offered for new-build projects, and an optional square grille is available in place of the round bezel.

  Bowers & Wilkins positions the CCM663 for background audio, conventional stereo pairs (3m to 5m apart and a similar distance in front of the listening area) and as a channel in multi-channel systems, advising against corner placement in all three cases. The drive units create a stray magnetic field, so magnetically sensitive items such as CRT screens and magnetic cards should be kept at least 0.5m (20in) away; LCD, OLED and plasma screens are unaffected.
specs: |-
  - Drive units: 1x 25mm (1in) Nautilus swirl loaded aluminium dome tweeter, 1x 150mm (6in) blue Aramid Fibre cone bass/midrange driver
  - Frequency range (-6dB): 45Hz to 50kHz
  - Recommended amplifier power: 25W to 130W
  - Sensitivity SPL: 88dB (2.83V, 1m)
  - Nominal impedance: 8 ohms (4.5 ohms minimum)
  - Frame diameter: 240mm (9.5in)
  - Depth behind surface: 133mm (5.2in)
  - Protrusion: 4mm (0.2in)
  - Two-way passive in-ceiling speaker: no on-board amplifier, no mains inlet, driven from an external amplifier
  - Connection: one pair of red and black spring terminals on the side of the mounting frame
  - Tilting tweeter with 15 and 30 degree tilt indicators
  - Three-position equalisation switch on the baffle, matched to the tweeter tilt setting
  - Die-cast bass/midrange chassis
  - Required ceiling aperture: 202mm (8in) diameter
  - Required clear depth behind sheetrock: 140mm (5.51in)
  - Construction: baffle (drive units and crossover), mounting frame with integrated bezel, magnetically secured grille
  - Mounting: 4x QuickDog spring clamps; baffle held by three push-lock fasteners
  - Supplied in carton: speaker assembly, cut-out template, paint mask, document pack
  - Flange and grille may be painted with conventional domestic paint using the supplied paint mask
  - Optional square grille available (bezel must be removed)
  - Pre-mount kits and back boxes available for new-build installations
  - Stray magnetic field: keep magnetically sensitive items at least 0.5m (20in) away; LCD, OLED and plasma screens unaffected
  - Finish: White
  - RoHS and WEEE compliant
