description: >-
  The Powertran Transcendent DPX was a DIY synthesizer kit designed by Tim Orr (formerly
  of EMS), sold from the late 1970s until 1982. It featured selectable piano, strings, and
  brass voices with full 61-note polyphony, touch sensitivity, and built-in effects
  including chorus, vibrato, and delay. Due to its complexity across multiple circuit
  boards, fewer units were successfully completed compared to Powertran's simpler kits.
details: |-
  The Transcendent DPX was designed by Tim Orr, formerly of EMS, and marketed by Powertran as a complete DIY kit at a selling price of £295 in 1982. It competed alongside other Powertran offerings including the Transcendent 2000 mono synth (£165) and the Polysynth (£275 base, expandable to 8 voices).

    Sound generation uses a single NE566 master oscillator producing a 1000.45KHz square wave, which is digitally divided by twelve integers to provide a full polyphony division network across all 61 keys. The instrument offers two types of piano sound (Honky and Piano) plus strings and brass voices, selectable via interlocking multi-pole switches. Effects include chorus, vibrato, and delay alongside tone and volume controls.

    Due to its complexity and multiple circuit boards, the DPX proved significantly more challenging to build than the single-board Transcendent 2000. A large number of kits sold were never successfully completed, and throughout the 1980s and 1990s many self-built units were discarded. Most surviving DPX units require extensive rebuilding, making working examples quite rare.
specs: |-
  - Polyphony: Full 61-note
    - Oscillator: Single NE566 master oscillator at 1000.45KHz
    - Sound generation: Top-octave divider (square wave divided by 12 integers)
    - Voices: Piano (Honky and Piano), Strings, Brass
    - Filters: Bandpass and lowpass (hard set)
    - Effects: Delay, chorus, vibrato
    - Keyboard: 61 keys with dynamics and touch sensitivity
    - DAC: 6-bit
    - Output: Mono (high and low channels)
    - Form factor: DIY kit
