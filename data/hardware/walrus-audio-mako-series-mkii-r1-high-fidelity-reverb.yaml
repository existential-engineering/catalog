description: The R1 MKII is an extremely powerful and versatile multi-function
  reverb that can go from intimate, small-room type subtle reverbs to huge,
  experimental euphoria.
details: |-
  The R1 MKII is an extremely powerful and versatile multi-function reverb that can go from intimate, small-room type subtle reverbs to huge, experimental euphoria. With six distinct programs based on fan-favorite reverb sounds that have been built from the ground up, players of all styles and genres will be able to find eternal inspiration with the R1. Programs: Spring (excited spring reverb with drip), Hall (large live sound spaces), Plate (smooth analog plate), BFR (a big hall-esque reverb with rich, lush decay), Refract/RFRCT (glitch-like grain textures over controllable diffusion), and Air (larger diffused reverb with shimmer and clarity). The R1 MKII includes a unique Ducking/Swelling control, plus size, diffuse, and feedback EQ controls. Save up to 128 onboard presets in banks A/B/C plus MIDI.
specs: |-
  - All six programs rebuilt and revamped for vast tonal improvement
  - New Ducking/Swelling feature
  - Size Control for each program
  - Diffuse Control for each program
  - Feedback EQ Control
  - 128 on-board presets accessible via the menu
  - Menu screen for simple navigation and adjustments for secondary controls
  - Stereo in and out; MIDI support
  - Power: 9V DC, 300mA minimum, center negative
  - Dimensions: 4.9" x 2.52" x 2.64" (with knobs)
