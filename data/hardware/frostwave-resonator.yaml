description: >-
  The Frostwave Resonator is an Australian-made analog filter effect that
  faithfully clones the Korg MS-20's dual VCF section. It provides
  series-connected highpass and lowpass filters with independent resonance and
  cutoff controls in a desktop stompbox format. Six quarter-inch jacks handle
  audio I/O and CV inputs for external modulation of all filter parameters.
details: |-
  The Resonator recreates the Korg MS-20's celebrated filter topology as a standalone effects processor. It places a highpass and lowpass filter in series, each with independent resonance and cutoff controls, allowing the same aggressive filter sweeps and self-oscillating tones that made the MS-20's filters legendary.

  The hardware presents itself as a large stompbox with four main knobs controlling frequency cutoff and resonance for each filter section, plus dedicated volume and wet/dry mix knobs. A bypass switch allows clean signal pass-through when the effect is not needed.

  Six quarter-inch jacks handle audio and control connections: mono input, mono output, and four CV inputs for external voltage control of lowpass cutoff, lowpass resonance, highpass cutoff, and highpass resonance. These CV inputs enable integration with analog synthesizers for synchronized filter modulation.

  The Resonator provides a cost-effective way to apply the MS-20's distinctive filter character to synthesizers, guitars, bass, samplers, and vocals. It was notably used by Charlie Clouser of Nine Inch Nails.
specs: |-
  - Polyphony: Monophonic (effect processor)
  - Filter: 1 highpass with resonance and cutoff; 1 lowpass with resonance and cutoff (in series)
  - Controls: Volume, wet/dry mix, bypass switch
  - Connections: Mono input, mono output, 4 CV inputs (LP cutoff, LP resonance, HP cutoff, HP resonance)
  - Origin: Australia
  - Date produced: 2000
