description: The LTD MH-400HT QM offers the powerful design features of the MH Series with professional components and build quality at a price that musicians can afford. Built with set-thru construction and a 25.5" scale for accessible upper fret access, it features a mahogany body with a quilted maple top, an extra-thin U-shaped three-piece maple neck with rosewood fingerboard, 24 extra-jumbo frets, reversed headstock, LTD locking tuners, an LTD fixed bridge with string-thru body, and EMG 81/85 active pickups for aggressive tones. Finished in See Thru Black Sunburst with black hardware.
details: |-
  The LTD MH-400HT QM offers the powerful design features of the MH Series with professional components and build quality at a price that musicians can afford. This guitar — built with set-thru construction at 25.5” scale for smooth access to the highest frets — provides a mahogany body with a gorgeous arched quilted maple top, and pairs it to an extra-thin, U-shaped, three-piece maple neck with rosewood fingerboard, 24 extra-jumbo frets, and a reversed headstock with matching finish. Components on the MH-400HT QM include black hardware, LTD locking tuners, and LTD fixed bridge with string-thru body, and a set of powerful, aggressive EMG 81 (bridge) and EMG 85 (neck) active pickups.
