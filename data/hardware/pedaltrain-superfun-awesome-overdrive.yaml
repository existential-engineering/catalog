url: https://pedaltrain.com/products/superfun-awesome-overdive
description: "A full-spectrum overdrive pedal for guitar or bass, the first
  pedal in Pedaltrain's SUPERFUN! series."
details: |-
  SUPERFUN! Awesome Overdrive is the first pedal in a new full-spectrum series, enjoyable by both guitarists and bassists. The tone knob sweep stays musical and usable through its entire range, and backing off the guitar's volume cleans the pedal up without the sound breaking up at higher gain settings. Controls are three simple knobs: Level, Tone, and Drive.
specs: |-
  - Level: Level controls the volume of the output.
  - Tone: Tone controls the darkness/brightness of the tone.
  - Drive: Drive controls the amount of overdrive/distortion.
