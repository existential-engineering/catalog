url: http://cranesong.com/egret.html
description: Egret is a highly flexible digital audio workstation back end with
  eight channels of high-quality D/A converters and a stereo line-level mixer
  with adjustable harmonic color. It lets users bring analog-summed digital
  mixes to life, with balanced inserts on each channel, an aux effects
  send/return, and AES/ADAT/S-MUX digital I/O up to 192kHz.
details: |-
  Each channel of the stereo mixer has a level control, an aux send (post level control), a color control, and a pan control. Each channel also contains an analog/digital source select button, and solo/mute buttons. The color function is adjustable from a transparent sound to a complex mix of second and third harmonic content, allowing clean modern sounds to be mixed with vintage sounds.

  By using the balanced direct outputs and the balanced analog inputs, individual channels can have analog processing inserted into them. The built-in aux bus with its master level control can be used as an effects send, and a balanced stereo effects return is built into the system.

  The master stereo bus level control is a stepped attenuator with 1dB steps for most of its range, allowing accurate gain control, repeatability, and stereo gain matching to better than .05dB.

  The headphone system allows a monitor mix to be created when Egret is used in multi-channel location recording, allowing monitoring of all channels.

  The D/A converters support sample rates up to 192K and have sample rate converters on each channel for jitter reduction, with a front panel switch to disable the SRC when lower latency is required. The standard interface supports AES single wire to 192KHz, ADAT, and S/MUX to 96K, and the converters can be independently operated, even at different sample rates.
specs: |-
  - Eight channels of D/A converters
  - Stereo line-level mixer with color (harmonic saturation) control
  - Per-channel level, aux send, color, and pan controls
  - Per-channel analog/digital source select, solo, and mute
  - Balanced direct outputs and balanced analog inputs per channel for inserting analog processing
  - Built-in aux bus with master level control for effects send
  - Balanced stereo effects return
  - Stepped attenuator master stereo bus level control, 1dB steps, stereo gain matching better than .05dB
  - Headphone monitor mix system for multi-channel location recording
  - D/A converters support sample rates up to 192kHz
  - Per-channel sample rate converters for jitter reduction, with front-panel SRC disable switch for lower latency
  - Digital interface supports AES single wire to 192kHz, ADAT, and S/MUX to 96kHz
  - Converters can be independently operated at different sample rates
