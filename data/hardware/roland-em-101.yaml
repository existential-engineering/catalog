description: >-
  The Roland EM-101 Sound Plus is a compact analog synthesizer module offering classic 1980s
  keyboard sounds with 8-voice polyphony, a rich analog filter, and Roland/Boss stereo chorus.
details: |-
  The EM-101 is a small rack-mount analog synthesizer module that packs a surprising range of
  classic 1980s keyboard tones into an affordable and compact package. Its preset sounds draw
  favorable comparisons to the Roland Juno-106 and Korg Poly-800, making it an underappreciated
  source of warm analog textures.

  The module offers 8-voice polyphonic or unison monophonic modes with two oscillator options per
  voice. A rich analog low-pass filter provides the warmth, while a Roland/Boss stereo chorus
  effect similar to the one found in the JX-8P adds lush spatial depth. Twenty-four programs are
  organized across three banks, with two banks visible and a third hidden bank accessible through
  specific procedures.

  Front-panel controls are streamlined but effective, featuring an 8-step Brilliance control for
  filter cutoff adjustment, an Attack knob for envelope shaping, and a Dynamics control for
  velocity response sensitivity. Fine-tuning of the oscillators and output level selection round
  out the hands-on controls.

  MIDI implementation is basic, responding on channels 1 through 8 but lacking support for
  continuous controllers, pitch bend, pressure, or SysEx messages. Audio connectivity includes
  stereo outputs and a mono mix input, with MIDI In and Thru ports for integration into larger
  setups.
specs: |-
  - Polyphony: 8 voices (polyphonic or unison mono)
  - Oscillators: 2 modes
  - Filter: Analog low-pass with cutoff control
  - Effects: Roland/Boss stereo chorus
  - Memory: 24 programs across 3 banks
  - Controls: Brilliance (8-step filter), Attack, Dynamics
  - I/O: Stereo output, mono mix input
  - MIDI: In, Thru (channels 1-8, no CC/pitch bend/SysEx)
releaseDate: "1985"
