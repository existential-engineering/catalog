details: |-
  OTA Low Pass VCF (Voltage Controlled Filter)

  The OTA Low Pass VCF Eurorack PCB and Front Panel Kit is a DIY analog low-pass filter inspired by the classic MS-20 filter topology. Designed for Eurorack modular systems, this filter delivers warm, juicy tones and rich resonance, making it ideal for adding analog character to any modular synth setup. Key Features

  Sound & Filtering

  This OTA-based VCF provides smooth, musical filtering with rich resonance and expressive sweeps. The 12dB/octave slope offers a versatile response suitable for everything from subtle tone shaping to aggressive analog filtering, making it a flexible low-pass filter for Eurorack systems. DIY Build & Calibration

  This DIY Eurorack VCF PCB and front panel kit is intended for intermediate builders. For optimal performance and to achieve the signature warm sound, careful calibration is required. Important build notes:

  Component correction: C3 = 1µF , R32 = 22K

  Input Level Calibration

  Frequency Resolution Adjustment

  Technical Specifications

  Skiff Friendly Module

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category. Video Demo
specs: |-
  - Eurorack PCB and front panel kit
  - Inspired by classic MS-20 style low-pass filter designs
  - 2-pole (12dB/octave) voltage-controlled filter
  - Built around the LM13700 OTA for musical, reliable performance
  - Warm, resonant analog sound
  - 8HP Eurorack format
  - Set the Frequency control fully clockwise
  - Set the Resonance control fully counter-clockwise
  - Adjust the In-Level trimmer so the output signal is slightly lower than the input signal, providing sufficient headroom for resonance
  - Start with the trimmer at its lowest setting and slowly increase
  - Avoid overly hot input signals, as this may cause instability or unwanted screeching
  - Use the Frequency Resolution trimmer to fine-tune the response of the frequency potentiometer
  - Adjust for heavy filtering when the pot is fully down and minimal filtering when fully up
  - Format: Eurorack
  - Width: 8HP
  - Depth: 25mm
