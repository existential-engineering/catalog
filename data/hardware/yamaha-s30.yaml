description: >-
  The Yamaha S30 is a 61-key control synthesizer sharing its AWM2 sound engine
  with the CS6x, offering 64-note polyphony, deep real-time control, and a
  streamlined interface aimed at live performance and studio integration.
details: |-
  Released around 2000, the S30 was positioned as Yamaha's performance-oriented synthesizer,
  packing the same high-quality AWM2 engine found in the CS6x into a more portable and
  controller-friendly package. It quickly found favor with electronic musicians, most notably being
  used by Faithless for their landmark track "Insomnia."

  The sound engine draws from 16MB of waveform ROM containing 479 waveforms, delivering convincing
  stereo-sampled acoustic pianos, organs, guitars, strings, and a wide palette of analog-style
  synth sounds across 256 presets. Thirteen filter types provide extensive tonal shaping, while a
  generous effects section includes 12 reverbs, 23 chorus algorithms, and 93 insertion effects.

  As a real-time controller, the S30 excels with four assignable sliders, five assignable knobs,
  and full MIDI master keyboard functionality. SmartMedia card support enables storage of user
  patches and SMF playback, making it a versatile centerpiece for both live rigs and production
  setups. The 128-slot user patch and 128-slot performance memory provide ample room for custom
  programming.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Sound Engine: AWM2, 16MB ROM, 479 waveforms
  - Presets: 256 preset patches, 128 user patches, 128 performances
  - Filters: 13 types including multi-pole and band-pass
  - Effects: 12 reverbs, 23 chorus, 93 insertion effects
  - Keyboard: 61 keys with initial touch and aftertouch
  - Controls: 4 assignable sliders, 5 assignable knobs
  - Storage: SmartMedia card (2-32MB)
  - MIDI: In/Out/Through
releaseDate: "2000"
