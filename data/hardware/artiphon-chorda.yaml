description: A next-gen, smart instrument that strums, taps, and loops with expressive ease.
details: |-
  Chorda is a portable, all-in-one smart instrument that combines a synthesizer,
  a looper, and an MPE MIDI controller in a slim, handheld form factor. It is
  designed so that beginners and experienced musicians alike can play melodies,
  chords, and beats using simple gestures, with four playing modes and features
  like one-finger chords and quantize to keep performances in key and in time.

  The playing surface consists of twelve touch-sensitive pads paired with a
  strummable bridge whose six triggers can fire individual notes or full chords,
  letting you strum, tap, and tilt to shape sound. Built-in accelerometer and
  gyroscope sensors capture motion gestures for expressive control, and the
  onboard MPE support sends per-note pitch, pressure, and slide data to
  compatible software instruments.

  A built-in 5W speaker lets you play and hear sounds without any external gear,
  while a 3.5mm headphone/line output, USB-C, and Bluetooth LE MIDI provide
  connectivity to headphones, speakers, computers, and mobile devices. A
  rechargeable battery gives up to five hours of untethered play. Chorda has
  since been discontinued.
specs: |-
  - Twelve touch-sensitive pads
  - Strummable bridge with six triggers (individual notes or chords)
  - Four playing modes with one-finger chords and quantize
  - MPE MIDI output (per-note pitch, pressure, and slide)
  - Accelerometer and gyroscope motion sensors
  - Built-in 5W speaker
  - 3.5mm headphone / line output
  - USB-C for charging and MIDI
  - Bluetooth LE MIDI
  - Rechargeable battery, up to 5 hours of use
