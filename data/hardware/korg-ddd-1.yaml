description: >-
  The Korg DDD-1 is a digital programmable drum machine from 1986 that features
  18 sampled percussion voices with adjustable pitch, dynamics, decay, roll, and
  flam parameters. It offers 100 programmable patterns chainable into 10 songs,
  along with an optional sampling capability for adding custom sounds to the
  drum kit. With full MIDI implementation and individual outputs, it served as
  Korg's professional-grade alternative to units like the Roland TR-707.
details: |-
  The Korg DDD-1 was released in 1986 as Korg's flagship digital drum machine, positioned as a more professional alternative to its sibling, the DDD-5. It arrived during a period of intense competition among Japanese manufacturers to deliver the most versatile and realistic-sounding programmable rhythm units.

  The DDD-1 featured 18 high-quality sampled drum sounds including two kicks, two snares, low/mid/high toms, rimshot, handclaps, crash cymbal, two open hi-hats, two closed hi-hats, ride cymbal, cowbell, tambourine, and cabasa. Each sound could be individually shaped using pitch, dynamics, decay, roll, and flam controls, giving users significant flexibility in tailoring the kit to their needs.

  A key selling point was the optional sampling capability, which allowed users to record short custom samples and integrate them alongside the factory sounds. While the sampling time was limited, it provided an extra creative edge that set the DDD-1 apart from many competitors of the era.

  The sequencer offered 100 programmable patterns that could be linked or chained together to form complete arrangements across 10 song memory locations. Fourteen velocity-sensitive trigger buttons provided expressive real-time programming. Full MIDI implementation made the DDD-1 easy to integrate into any MIDI-based studio setup, and individual outputs allowed for professional mixing and external processing of individual drum voices.
specs: |-
  - 18 sampled drum voices
  - Sounds: 2 Kick, 2 Snare, Low/Mid/Hi Toms, Rimshot, Claps, Crash, 2 Open Hi-Hats, 2 Closed Hi-Hats, Ride, Cowbell, Tambourine, Cabasa
  - 100 programmable patterns
  - 10 song memory locations
  - 14 velocity-sensitive trigger buttons
  - Per-voice pitch, dynamics, decay, roll, and flam controls
  - Optional sampling capability
  - Full MIDI implementation
  - Individual audio outputs
  - Produced: 1986-1987
