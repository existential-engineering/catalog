description: A stereo variable-mu tube compressor expansion module for the Silver Bullet mk2, developed in collaboration with Locomotive Audio. Draws inspiration from Locomotive Audio's acclaimed 14B and WT-COMP compressor designs, bringing real tube mojo into the Silver Bullet mk2 signal flow.
details: |-
  Delivers vari-mu compression when sidechain is enabled, or tube and transformer saturation when the sidechain is bypassed. Selectable attack times of 0.7, 10, or 40 ms (jumper-selectable). Release options of 150, 300, or 600 ms (jumper-selectable). Variable compression ratio from 1:1 to 3:1. Adjustable threshold and output gain via trimmers. Sidechain high-pass filter options: off, 100 Hz, or 200 Hz (jumper-selectable). Stereo Link or Dual Mono sidechain operation. Built with 12AU7 tubes and custom American-wound transformers. Premium components from Nichicon, Panasonic, Vishay, Susumu, Wima, and Texas Instruments. All audio path resistors are 0.5% or 0.1% thin film types. Discrete op amp designs. High-temperature Tg 170 PCB material. RoHS compliant (lead-free) assembly. Mojo Module format — slots into the Silver Bullet mk2 chassis (sold separately).
