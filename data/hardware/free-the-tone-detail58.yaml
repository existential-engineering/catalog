description: The Free The Tone PHV-1 is a device which inverts the signal phase
  of an effects unit or amplifier, taking the input signal from in phase to out
  of phase or out of phase to in phase. A switchable input impedance and a
  remote jack let it sit anywhere in a rig, including under the control of an
  ARC Series routing controller.
details: |-
  The PHV-1 inverts the signal phase of an effects unit or an amplifier, turning an in phase input out of phase or an out of phase input in phase. Its purpose is to make the phase something a player can manipulate rather than inherit.

  Controlling whether a signal is in phase or out of phase widens the palette. Many wah-wah pedals, compressors and boosters with conventional circuits output an inverted signal and build their sound on that character, while in other situations flipping the same output back in phase gives the better result. Since overlapping sounds always interfere, the useful move is to test both.

  Where an out of phase signal is what is thinning the instrument, the PHV-1 is the way to address it. That matters particularly for bassists who reference a kick drum, since a phase difference arising from a combination of effects units can be a persistent source of stress in playing.

  The maker names three applications: inverting an effects unit's output phase, sitting in an amplifier's send and return where that loop flips the phase, and pairing with a switcher where the phase is not the same between amplifier channels.

  The unit carries three 1/4-inch jacks, IN, OUT and REMOTE, plus a DC 9 V input, and an INPUT Z switch chooses between Hi-Z at 1 Mohm and Lo-Z at 300 kohm. The REMOTE jack takes a control terminal from a Free The Tone ARC Series Audio Routing Controller, so the inversion can be switched from the controller, and a manually operated latch type footswitch can be used instead. No AC adaptor is included in the box.
specs: |-
  - Terminals: 3 x 1/4-inch standard phone jacks (IN, OUT, REMOTE), DC9V input jack for connecting an AC adaptor
  - Controls: INVERTER ON/OFF switch, INPUT Z select switch (Hi-Z 1 Mohm, Lo-Z 300 kohm)
  - Power supply: 9 VDC AC adaptor, not included
  - Consumption current: approx. 60 mA
  - Dimensions: 93.5 (W) x 54 (D) x 35.5 (H) mm, excluding protrusions such as knobs and switches
  - Weight: approx. 180 g
  - Accessories: warranty card, Web Access Card
  - REMOTE jack accepts an ARC Series control terminal or a latch type footswitch
