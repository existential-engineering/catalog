url: https://dynaudio.com/professional-audio/dynaudio-acoustics-m-series/m4-mkii-mini
description: Compact 4-way main monitor that delivers the M4 MkII's reference
  performance in a significantly smaller cabinet footprint.
details: |-
  The heart and soul of M4 MkII but with a compact footprint.

  M4 Mini MkII delivers the incredible 4-way accuracy as its larger sibling M4 MkII but in a significantly smaller package. The SPL is comparable, and with two 300mm low-frequency MSP (Magnesium Silicate Polymer) drivers with 100mm ferrofluid-cooled voice coils and three channels that should be fed 500-1000 W per speaker, you are guaranteed to have a stellar listening area with a rock-solid soundstage.

  The low-mid section uses two 170mm MSP drivers with 75mm voice coils and neodymium magnets. The upper-midrange driver is a 54mm critically doped fabric dome Esotar model that ensures low distortion and excellent transient response. Finally, the high-frequency unit is the legendary Esotar 3, designed to reproduce distortion-free transients of up to 1000 watts.

  Optional hardwood cabinets are available in oak, cherry, walnut, and maple, with custom cabinet sizes offered on request.
specs: |-
  - Status: Current
  - Segment: Pro
  - Series: Dynaudio Acoustics
  - Application: Music recording and mixing
  - Type: 4-way hybrid
  - Frequency response: 35Hz – 20kHz
  - Maximum SPL at 2 metres: 130dB stereo
  - Crossover frequencies: 250Hz, 2kHz, 5kHz
  - Total harmonic distortion: 1% at 90dB
  - Recommended amplifier power: Four channels: 500-1000W/channel per speaker
  - High frequency driver: Esotar 3
  - High-mid driver: 56mm soft dome
  - Low-mid driver: 2x 17cm MSP
  - Low frequency driver: 4x 30cm MSP
  - Amplifier recommendation: Dynaudio Acoustics DA40/80 DSP, DCA800/1400
  - Cabinet dimensions (H x W x D): 900 x 850 x 680mm
  - Weight: 145 kg
  - Finish: Black textured paint
  - Optional hardwood cabinet: oak, cherry, walnut, maple
  - Custom cabinet sizes: on request
