id: kVzxB2PEI-Q8chTF4GiXy
name: MAG 300H EVO III
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
categories:
  - amplifier
url: https://ashdownmusic.com/products/mag-300h-evo-iii
description: The MAG 300H EVO III is a bass amplifier head with a fan-cooled
  300-watt power section. It carries a comprehensive 5-band EQ with rotary bass,
  middle and treble plus 15dB cut and boost at 220Hz and 1.6kHz, front-panel
  Bright and Deep push switches, the trademark Ashdown sub-harmonic generator, a
  built-in compressor and a footswitchable Overdrive control. Inputs are
  provided for active and passive instruments, and the front panel adds an
  effects send and return, a tuner/line output and a balanced DI output for
  direct connection to a mixing console.
details: |-
  Part of the updated MAG range, adding a footswitchable Overdrive control (via a standard single latching footswitch) to the established MAG line. The MAG 300H head features a fan-cooled 307 watts RMS power section. Rotary bass, middle and treble controls are supplemented by smaller rotary controls providing 15dB of cut and boost at 220Hz and 1.6kHz for a comprehensive 5-band EQ section. Front panel push switches for Bright and Deep settings provide attacking and warm, rounded sounds respectively, and the trademark Ashdown sub-harmonic generator adds deep low-end. Inputs are provided for active and passive instruments; the front panel also features an effects send and return, a tuner/line output and a balanced DI output. EVO III status adds a built-in compressor with precision sonic control. The cabinet is finished in a tough, retro-style vinyl covering.
specs: |-
  - Power output: 300 watts (307 watts RMS)
  - Power requirement: 115 - 230V
  - Speaker outputs: 2 x jack sockets
  - Minimum impedance: 4 Ohm
  - Frequency response: -3dB at 17Hz - 30kHz
  - High instrument input impedance: 3.9M Ohms, input range 150mV - 20mV p-p
  - Low instrument input impedance: 10K Ohms, input range 300mV - 40V p-p
  - Line input impedance: 10K Ohms, input range 300mV - 40V p-p
  - Tuner output impedance: 22K Ohms, level 0dBu nominal
  - DI output: 600 Ohms balanced, level -20dBu nominal
  - EQ: Bass +/-15dB @ 100Hz, Lo Mid +/-15dB @ 220Hz, Middle +/-15dB @ 660Hz, Hi Mid +/-15dB @ 1.6kHz, Treble +/-15dB @ 7kHz shelving
  - Effects send impedance: 22K Ohm, level 0dBu nominal
  - Effects return impedance: 22K Ohm, level 0dBu nominal
  - Distortion: less than 0.5% THD
  - Signal to noise: better than 80dB (EQ flat)
  - Dimensions (H x W x D): 90 x 463 x 267 mm
  - Weight: 8.5 kg
