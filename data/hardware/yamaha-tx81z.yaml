description: >-
  The TX81Z is a compact FM synthesizer module from Yamaha, functioning as a
  keyless rackmount version of the DX-11. It delivers eight-voice polyphonic FM
  synthesis with multitimbral capabilities in a single rack unit, offering tonal
  characteristics comparable to the DX-7 at a significantly lower price point.
details: |-
  The TX81Z, introduced in 1987, represents Yamaha's effort to provide affordable FM synthesis in a studio-friendly format. As a rackmount module, it eliminates the keyboard to reduce cost while maintaining sophisticated sound-design capabilities. The instrument builds on Yamaha's established DX-series legacy, offering comparable tonal characteristics to the celebrated DX-7 at a significantly lower price point.

  A key innovation of the TX81Z was its expansion beyond simple sine-wave FM synthesis. The module includes eight assignable waveforms, allowing musicians to explore timbral territory beyond traditional FM sounds. This flexibility, combined with eight-voice polyphony and 32 user-editable patches, made it attractive for both studio and live electronic music production.

  The TX81Z gained notable adoption in electronic and experimental music circles. Artists including Fluke, Roni Size, Squarepusher, and Jimmy Edgar incorporated the module into their production workflows, leveraging its punchy percussive capabilities and characteristic FM character for contemporary electronic music aesthetics.
specs: |-
  - 8-voice polyphony
  - 4-operator digital FM synthesis
  - 8 multitimbral parts
  - 8 assignable waveforms
  - 128 patches, 32 user presets, 24 performance setups
  - MIDI with velocity and aftertouch
  - 1-unit rackmount format
