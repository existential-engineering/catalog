details: |-
  Cutting Edge technology. Next-generation effects for the dLive platform, delivered as a collection of 10 new algorithms that rival the most advanced plug-ins on the market.

  Combining Allen & Heath's renowned FPGA technology with the power of ARM processing, the RackUltra FX card opens dLive up to the next generation of onboard processing and effects.

  The RackUltra FX collection spans four effect families — Vocal Processing, Reverb & Delay, Distortion & Saturation, and Harmonisers — providing studio-quality processing inside the dLive ecosystem.
