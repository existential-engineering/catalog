description: A simple three-channel switch module for Eurorack modular
  synthesizers, allowing independent two-way switching between sources or
  destinations for both CV and audio signals.
details: |-
  SL3KT (pronounced "Select") is a simple three-channel switch module for Eurorack Modular Synthesizers. Three independent, two-way switches allow for users two select between different sources or destinations of both CV and Audio Signals. Useful for many tasks in a Eurorack system such as sequence selecting, CV selecting, boolean logic operations, group switching, group routing, gating, waveform mixing, and so much more!
