description: >-
  The Yamaha SU200 is a compact desktop sampler designed for DJs and entry-level
  musicians, focusing on groove sampling and remix capabilities. It features
  eight touch pads, a ribbon controller for vinyl-style scratching, and
  real-time effects processing. Variable sampling rates from 5 to 44.1 kHz
  provide recording durations ranging from 21 seconds in stereo to over five
  minutes in mono.
details: |-
  The SU200 enables musicians to create original compositions through loop-based sampling and live performance. It supports variable sampling rates from 5 to 44.1 kHz, with recording durations ranging from approximately 21 seconds in stereo to over five minutes in mono. Users can assign samples to eight touch pads and apply various real-time effects including filtering, distortion, and delay.

  A distinctive ribbon controller allows scratching samples like vinyl records. The Loop Remix function slices up a loop and allows the user to effect the slices to create entirely new variations, enabling creative sound design within performance contexts.

  The beat-matching technology automatically synchronizes loop playback to a consistent tempo, essential for DJ applications. The SU200 can sync to a tempo via MIDI or use the Tap Tempo key for live DJ use. Resampling functionality allows musicians to record their effects-processed performances back into the sampler for layering possibilities.

  Samples are stored in flash RAM with SmartMedia 3.3V card support for offline storage. The unit can run on batteries or an AC adapter, making it portable enough for mobile DJ setups and live performance.
specs: |-
  - 6-voice polyphony
  - 896 KB flash RAM; holds up to 24 samples
  - Sampling rates: 44.1 kHz, 22.05 kHz, 11.025 kHz, 5.5125 kHz
  - Recording duration: approximately 42, 84, 168, or 333 seconds (mono)
  - Stereo or mono sample modes
  - 8 touch pads with ribbon controller
  - 2 assignable real-time control knobs
  - Effects: Loop Remix, Slice, Low-pass filter with resonance, Distortion/Lo-Fi, Delay, Tech Mod (LFO)
  - SmartMedia 3.3V offline storage
  - Line and mic inputs
  - MIDI IN with bulk dump support
  - Battery or AC adapter power
