description: The Aguilar SL 115 is a lightweight 15-inch bass speaker cabinet
  delivering smooth, balanced, and focused tone suited to a wide range of genres
  and playing styles. Built with a custom-voiced Neodymium woofer and lite-ply
  construction, it weighs just 34 lbs while handling 400 watts RMS.
details: |-
  The SL 115 is part of Aguilar's SL (Super Light) series, engineered for working
  bassists who need professional-grade sound without the weight penalty of
  traditional cabinets. The cabinet tips the scales at just 34 lbs, making it
  easy to transport and load in for gigs.

  At the heart of the SL 115 is a custom-voiced 15-inch woofer featuring a
  Neodymium cast frame driver. Neodymium magnets are significantly lighter than
  traditional ferrite magnets while maintaining strong magnetic flux, which is key
  to keeping the overall cabinet weight low without sacrificing driver performance.

  The cabinet is constructed from lite-ply — a lightweight plywood variant — which
  reduces mass compared to standard MDF or birch ply enclosures while still
  providing sufficient rigidity for a sealed, well-damped cab. This materials
  choice is fundamental to the SL series weight savings.

  With a frequency response of 35 Hz to 4 kHz, the SL 115 covers the full range
  of a bass guitar including extended low B string content, while its 99 dB
  sensitivity rating (1W/1M) means it produces substantial volume from a modest
  amplifier output. Power handling is rated at 400 watts RMS at 8 ohms (a 4 ohm
  version is also available).

  The SL 115 is designed to work as a standalone cabinet or pair with other
  Aguilar SL series enclosures for larger rigs. Its compact footprint and modular
  design make it a versatile building block for a variety of stage configurations.
specs: |-
  - Power Handling: 400 watts RMS
  - Impedance: 8 ohms (4 ohm version available)
  - Frequency Response: 35 Hz – 4 kHz
  - Sensitivity: 99 dB 1W/1M
  - Driver: Custom-voiced 15" woofer with Neodymium cast frame magnet
  - Height: 19"
  - Width: 21 15/16"
  - Depth: 15 11/32"
  - Weight: 34 lbs (15.42 kg)
