description: Dynamic kick drum and low-frequency instrument microphone with a
  supercardioid polar pattern. Voiced specifically to capture the power,
  punctuation and snap of kick drums with little to no additional EQ required.
details: >-
  The Electro-Voice PL-33 is a dynamic kick drum microphone in the PL Series,
  designed specifically for capturing kick drums and other low-frequency
  instruments. A powerful neodymium magnet drives the dynamic element to deliver
  high output and strong transient response, while the supercardioid polar
  pattern provides tight pickup and improved isolation from neighboring kit
  pieces and stage bleed.


  The frequency response is strategically crafted for kick drum sound: a
  tailored low-end extension and presence shaping deliver the attack, punch and
  body that kick drum tracks need, generally requiring little to no additional
  EQ. A tight-mesh Memraflex grille protects the capsule from impact and wind
  blasts inside the shell while resisting deformation under the rough handling
  typical of touring rigs.


  The body is constructed from die cast zinc with a textured satin black finish
  for stage-friendly low reflectivity and road durability. Output is via a
  standard 3-pin XLR connector with a 150-ohm low-impedance balanced signal
  suitable for any professional mixer or preamp. The microphone is passive and
  requires no phantom power.
specs: |-
  - Element: Dynamic with neodymium magnet
  - Polar pattern: Supercardioid
  - Frequency response: 20 Hz - 10,000 Hz
  - Impedance (low-Z balanced): 150 ohms
  - Open circuit voltage: 0.63 V
  - Connector: 3-pin XLR
  - Power requirement: Passive (no phantom power required)
  - Grille: Tight-mesh Memraflex
  - Case material: Die cast zinc
  - Finish: Textured satin black
  - Net weight: 0.364 lbs (0.165 kg)
  - Shipping weight: 0.672 lbs (0.305 kg)
  - Family: PL Series
  - Wired/wireless: Wired
