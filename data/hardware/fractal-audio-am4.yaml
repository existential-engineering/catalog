description: Fractal Audio's AM4 Amp Modeler delivers industry-leading amp
  modeling, speaker cab sims, world-class effects, and pro-level connectivity in
  a compact, easy-to-use, pedalboard ready unit.
details: |-
  The AM4 Amp Modeler combines Cygnus X-3 amp modeling, visual DynaCab speaker simulation, UltraRes user cabs and a suite of effects with a streamlined workflow aimed at players who want professional sound with less complexity. The user interface is inspired by traditional amps and pedals, with an Expert Edit feature that stays hidden until advanced parameters are needed.

  The unit is compact enough to sit on a pedalboard or a studio desk, to travel in a backpack alongside expression pedals, or to work as a fly rig in an overhead bag. USB audio and a headphone jack let it double as a mobile guitar recording setup with a Mac or PC.

  Amp modeling is built on the same technology as the Axe-Fx III and aims at the tone, feel and authentic controls of real tube amps, from vintage classics to modern high gain. Unlike capture systems, every amp model stays fully adjustable, with familiar amp controls that behave like the originals. The amp block carries four channels for gapless switching between four amp and cab tones in every preset, across 104 presets and more than 240 amp models.

  Speaker simulation is integrated directly into the amp block. More than 45 classic and modern guitar and bass DynaCabs allow virtual mics to be positioned in real time, and third-party or Fractal Audio impulse responses can be loaded as UltraRes User Cabs. A built-in room simulator adds ambient dimension without a separate block.

  The effects suite runs the algorithms of the Axe-Fx III and spans more than 325 stompbox and studio models, including 77 or more drives, 79 or more reverbs, dozens of delays and 150 or more options across chorus, compressor, flanger, phaser, tremolo, wah, EQ, gate and filter. Hidden Expert Edit pages unlock deeper controls and modifier options for MIDI, pedals, LFOs, envelopes and a sequencer. AM4-Edit, a free editor and librarian for Mac and PC, handles preset creation, cab import and export and system settings, with Fractal-Bot available for backups and firmware updates.
specs: |-
  - Cygnus X-3 amp modeling with 240 or more amp models
  - 104 presets, each with four blocks and four scenes
  - Four amp and cab channels per preset with gapless switching
  - 45 or more DynaCab models with visual mic positioning
  - UltraRes User Cabs for standard-format impulse responses, plus a stereo room simulator
  - More than 325 effect models powered by Axe-Fx III algorithms: 77 or more drives, 79 or more reverbs, dozens of delays, 150 or more chorus, compressor, flanger, phaser, tremolo, wah, EQ, filter and gate types
  - Four footswitches with five modes: Presets, Scenes, Effects, Tuner and Tempo, and Amp Mode, with custom colors and an integrated tap on and off boost
  - Low-noise instrument input with Auto-Z impedance loading
  - Balanced TRS outputs and a stereo analog insert with Send and Return jacks
  - High-quality headphone output for silent practice and monitoring
  - Two Pedal ports, each accepting an expression pedal or an external footswitch, compatible with Fractal Audio EV pedals and many third-party models
  - S/PDIF digital input and output
  - USB-C carrying MIDI and 4x4 audio with re-amping and DI capture
  - 3.5 mm MIDI In and MIDI Out
  - AM4-Edit editor and librarian for Mac and PC, with Fractal-Bot for backups and firmware updates
  - Upgradeable firmware
  - Powered by the included 9V DC 1.5A adapter
