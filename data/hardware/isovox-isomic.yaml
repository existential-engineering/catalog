details: |-
  More info about the ISOMIC Voice Over Microphone

  Designed for professional Voice Over Artists & Vocalists who want an easy-to-use solution to achieve the "Pro Studio Sound" along with the ISOVOX Vocal Booth. The sound is "Pre-Set" and works fantastic for Voice-Overs, Audio Books, Narrations, and of course, Vocals of different genres. You can tweak it if you feel the need. Its top-of-the-line specifications along with its patented triangular capsule, give a sound that is just as unique as you are. The sound can be described as hyper-realistic, well-balanced, and crystal clear. This is what we think the future should sound like. The high-end is naturally smooth and makes it very "comfortable" sounding, which makes it great for modern high-compressed Voice Overs / Vocals without sounding harsh. It has an extremely low self noise, making editing easier than ever. You don't need to cut away disturbing noises, crossfade clips and adjust to eternity just because there is annoying noise, with ISOMIC there is near zero self noise and when combined with the ISOVOX 2 you have the ultimate recording studio for professional results.
