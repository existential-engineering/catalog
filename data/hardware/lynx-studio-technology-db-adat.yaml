description: The DB-ADAT is an Aurora(n) ADAT daughter board for the LM-DIG
  AES/EBU digital I/O module, bringing ADAT and S/PDIF connectivity when the two
  are paired. It lets the Aurora(n) connect directly with other devices that
  support ADAT or S/PDIF, and allows Aurora to work as a bi-directional format
  converter between ADAT, AES/EBU and analog.
details: |-
  Continuing in the tradition of non-obsolescence design, Lynx adds the DB-ADAT daughter board that brings ADAT and S/PDIF connectivity when paired with an LM-DIG Aurora(n) module.

  Now the industry-leading Aurora(n) interface can be configured to connect directly with other audio devices that support ADAT and/or S/PDIF protocol.

  With its 300,000:1 jitter reduction capability, Aurora's SynchroLock 2 technology provides immunity to high levels of jitter which is typical in optical signals. The DB-ADAT also allows Aurora to function as a bi-directional format converter, converting ADAT to AES/EBU and analog and back to ADAT.
specs: |-
  - ADAT daughter board for the LM-DIG AES/EBU digital I/O module
  - Provides ADAT and S/PDIF connectivity when paired with an LM-DIG in an Aurora(n) interface
  - 4 high-quality optical connectors with two inputs and two outputs
  - 8 channels per port (16 total ADAT channels of I/O) at 44.1 kHz and 48 kHz
  - 4 channels per port (8 total ADAT channels of I/O) at 88.2 kHz and 96 kHz
  - 2 channels per port (4 total ADAT channels of I/O) at 176.4 kHz and 192 kHz
  - SynchroLock 2 provides 300,000:1 jitter reduction for immunity to the high jitter levels typical of optical signals
  - Powered by the host Aurora(n) through the LM-DIG module it mounts on, no separate power connector is documented
