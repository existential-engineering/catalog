description: A 16 input GPI to MIDI converter that turns contact closures on two
  9 pin D sockets into MIDI notes, controllers or program changes, and merges
  them with incoming MIDI.
details: |-
  A converter with 16 GPI (general purpose interface) inputs arranged as two blocks of eight on 9 pin D sockets. Closing a contact on an input produces a MIDI message, which can be a note, a controller (CC) or a program change depending on the output mode in use.

  The inputs carry internal pull-ups, so shorting an input to ground sends the appropriate MIDI note-on message and releasing the short sends a note-off, unless note offs have been disabled for that block. On each D socket pins 1 to 8 are the eight inputs and pin 9 is the common ground.

  Each block of eight inputs is given a starting MIDI note number, with the remaining inputs following on consecutive numbers; the first block defaults to 36 to 43 and the second to 44 to 51. Whether note offs are sent when the switches open is set per block and defaults to yes, though off messages do not apply to program changes. The MIDI transmit channel covers all inputs and can be set from 1 to 16, defaulting to 1, and the switch debounce value is settable from 1 to 100 milliseconds with a default of 10ms.

  Two MIDI out sockets carry identical data, and MIDI arriving at the MIDI input is merged with the data generated by the switch inputs before being sent to both outputs. Parameters are edited with push buttons alongside a three digit seven segment LED display, and edit mode has to be enabled with a recessed push button so settings cannot be changed by accident.

  The unit is supplied with a 9V multi-region switch mode power supply that connects by a locking plug, with four interchangeable heads covering the UK, Europe, the USA, Canada, Japan, Australia and New Zealand.
specs: |-
  - 16 GPI inputs, 8 on each of 2 x 9 pin D sockets, pin 9 common ground
  - Output modes: MIDI notes, controllers (CCs) or program changes
  - MIDI In, Out 1 and Out 2, with both outputs carrying the same data
  - Incoming MIDI is merged with the switch input data at the MIDI outputs
  - Default note range: 36 to 43 for the first block, 44 to 51 for the second
  - MIDI transmit channel 1 to 16, default 1
  - Switch debounce 1 to 100 milliseconds, default 10ms
  - Inputs have internal pull-ups and are triggered by shorting to ground
  - Display: 3 x 7 segment LED
  - Power: 9V DC, 120mA max, 2.1mm connector, supply included
  - Power supply: 9V multi-region switch mode with locking connector and 4 interchangeable heads
  - Dimensions: 190 x 110 x 38 mm
  - Weight: 800g including power supply
  - Edit mode enabled by a recessed push button
