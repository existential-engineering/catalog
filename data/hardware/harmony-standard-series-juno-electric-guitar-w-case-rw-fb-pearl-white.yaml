details: |-
  The Harmony Juno is what we imagine small body guitars to be — compact yet capable of powerful sound. Its genuine mahogany body is lightweight, perfectly balanced and comfortable in the hands of any musician. Crafted with a pair of hand-wound gold foil P90 pickups, the Juno offers warm and rich harmonics that roar with an attitude once you push this wonderful guitar into overdrive. A push/pull Master Volume pot adds even more tonal versatility — just pull it up to recreate the effect of a rolled-off tone knob.
