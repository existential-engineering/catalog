description: A hybrid analog/digital stereo passive equalizer combining vacuum
  tube technology with handcrafted transformers and integrated DAW plugin
  recall, designed for professional recording, mixing, and mastering workflows.
details: |-
  The Bettermaker Valve Stereo Passive Equalizer (VSPE) is a 2U rack-mount stereo passive equalizer built around Soviet-era military-grade vacuum tubes sourced from the 1970s and 1980s, combined with handcrafted audio transformers manufactured in-house by Bettermaker in Warsaw, Poland.

  The unit features HEAT circuitry that adds warmth and rich harmonics by activating transformer-balanced output at 30Ω impedance. Low-frequency bands cover 20, 30, 60, and 100 Hz with up to ±15-16 dB of boost or cut, while high-frequency bands span 3 to 28 kHz with up to +18 dB boost. Control resolution is 101 steps in standard mode or 17 steps in Quantize mode for repeatable stepped adjustments.

  The hardware integrates seamlessly with a companion DAW plugin that provides full parameter recall, automation support, mastering-grade digital high-pass and low-pass filters, a spectrum analyzer, and session snapshot storage. The plugin enables dual-mono operation and independent audition of high and low frequency bands for precise workflow integration.

  The VSPE is protected under U.S. Patent No. 10,693,428 B2. It ships with a 100-240VAC power adapter and operates in a 2U rack form factor at 140mm depth, weighing 2.7kg.
specs: |-
  - Input level: +24 dBu balanced (48kΩ impedance)
  - Output level: +22 dBu
  - Output impedance: 120Ω standard, 30Ω with HEAT activated (transformer balanced)
  - LF boost/cut range: ±15-16 dB
  - HF boost range: +18 dB
  - LF frequency options: 20, 30, 60, 100 Hz
  - HF frequency range: 3-28 kHz selectable
  - Control resolution: 101 steps (standard), 17 steps (Quantize mode)
  - Form factor: 2U rack-mount
  - Depth: 140mm
  - Weight: 2.7kg
  - Power: 18W AC (100-240VAC adapter included)
  - Vacuum tubes: Soviet-era military-grade (1970s-80s)
  - Handcrafted audio transformers by Bettermaker
  - HEAT circuitry for harmonic enhancement
  - Companion DAW plugin: parameter recall, automation, HPF/LPF, spectrum analyzer, session snapshots
  - Dual-mono operation via plugin
  - U.S. Patent No. 10,693,428 B2
