details: |-
  The Session VTC takes the studio-inspired features that we originally pioneered in our Session DI and builds them into the guitar’s onboard electronics. Now you can harness the rich warmth of the Session’s harmonic Saturation and the balance of the multi-band Comp-EQ, without needing to haul a separate pedal to the gig.
specs: |-
  - Onboard undersaddle Element pickup with integrated preamp (guitar-mounted)
  - Soundhole-mounted control panel
  - Active system, High-Grade FET input, all-discrete Class-A preamp
  - Controls: Volume, Tone, Phase inversion, Saturation
  - Multiband Comp-EQ processing derived from the Session DI
  - 9V battery with multi-segment battery check
  - 1/4-inch endpin output jack
  - For steel-string acoustic guitars; requires professional installation
