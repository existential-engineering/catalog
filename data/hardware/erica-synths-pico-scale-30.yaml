url: https://www.ericasynths.lv/pico-scale-30/
description: Erica Synths Pico SCALE module allows you to manipulate audio or CV
  signals – attenuate, boost, invert and offset – in order to achieve
  interesting modulation effects.
details: |-
  The Erica Synths Pico SCALE module reshapes audio or CV signals, attenuating, boosting, inverting and offsetting them to reach modulation effects a plain attenuator cannot.

  Attenuation runs down from unity and boosting goes up to a gain of 2, so a weak modulation source can be brought up to a useful range and a hot one tamed.

  Inverting flips the signal around zero, and an offset of plus or minus 5V shifts the whole range up or down, which is how a bipolar modulation source is turned into a unipolar one or the reverse.

  A bicolour LED shows the level and polarity of the signal at the output. The panel is 3HP wide and the module is 35mm deep, part of the Pico Series brief Erica Synths set itself, to fit superior synth functionality into 3HP at an affordable price.
specs: |-
  - Signal attenuation and boosting (up to gain 2)
  - Signal inverting
  - Signal offset by +-5V
  - Bicolour signal level LED
  - Power consumption +24mA, -8mA
  - Module width 3HP
  - Module depth 35mm
