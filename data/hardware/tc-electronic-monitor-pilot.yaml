details: |-
  Tried and True TC Flight

  Literally thousands of world-leading recording and mastering studios, as well as film, post and broadcast facilities, have relied on our tried-and-true high-end monitor controllers like CLARITY X, SYSTEM 6000, BMC2 and LEVEL PILOT over several decades. Yes, we know monitor control, which is your guarantee that when you are flying with the MONITOR PILOT, you can have absolute peace of mind that you’re in for a smooth and safe flight! We even got you a seat in First Class with a delicious and complementary three-course menu of unparalleled flexibility, transparent connectivity and direct access to volume level and stereo speaker selection right at your fingertips.

  Meet and Greet with the Pilot

  First of all, you can connect up to three stereo speaker sets on fully balanced, 22 dBu line level professional XLR connectors, as well as a pair of headphones on a ¼” TRS jack connector, which is conveniently available on the front panel. On the input side, you will find another pair of balanced XLR connectors ready to take on the main output from your audio interface. On top of that, you also have the option of connecting any media device via the 1/8” mini jack connector on the front panel. Note that it will happily entertain balanced as well as unbalanced signals, depending on what device you connect. Once you have installed your MONITOR PILOT, you are set for seamless and transparent switching between speakers, as well as clear visual indication of which speakers are currently active.

  Smooth and Elegant Integration
