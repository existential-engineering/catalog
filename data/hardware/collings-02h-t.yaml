description: The 02H T is a vintage-inspired Traditional Series 0-body acoustic
  guitar built to showcase the most desirable characteristics of coveted pre-war
  instruments. Its voicing delivers warm, rounded highs and a present low
  midrange while retaining a quick attack and strong projection. Crafted with a
  Sitka spruce top and East Indian rosewood back and sides, it is finished in
  high-gloss ultra-thin nitrocellulose lacquer with ivoroid binding and
  herringbone purfling.
details: |-
  The 02H T is part of the Traditional Series, a line designed to capture the feel and tone of pre-war small-body acoustic guitars. The 0-body shape offers a focused, articulate sound suited to fingerpicking and light strumming. The Sitka spruce top is paired with East Indian rosewood back and sides for a balanced tonal character with warm midrange presence. The Honduran mahogany neck is topped with an ebony fingerboard inlaid with gold mother-of-pearl short diamonds and squares, and the ebony belly-style bridge is set at 2 5/16" string spacing. At 24 7/8" scale length and a 1 3/4" bone nut, it plays comfortably in a shorter-scale vintage register. The finish is a high-gloss ultra-thin nitrocellulose lacquer applied over ivoroid body binding with herringbone purfling.
specs: |-
  - Body Style: 0 14-Fret
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard Inlays: Gold MOP short diamond & squares
  - Bridge: Ebony belly-style
  - Bridge Spacing: 2 5/16"
  - Nut: Bone
  - Nut Width: 1 3/4"
  - Scale Length: 24 7/8"
  - Frets: Medium 18% nickel-silver
  - Body Binding: Ivoroid with herringbone purfling
  - Finish: High gloss ultra-thin nitrocellulose lacquer
  - Body Width: 13 7/16"
  - Body Length: 18 3/16"
  - Body Depth: 4"
  - Total Length: 38"
  - Strings: D'Addario EJ-16 (.012"-.053")
