description: The 000-16 StreetMaster pairs East Indian rosewood back and sides
  with an Adirondack spruce VTS top under a distressed vintage-style satin
  finish for aged tone and character.
details: |-
  The 000-16 StreetMaster is the only Martin that pairs the beautifully distressed StreetMaster finish with the rich warmth of East Indian rosewood and the dynamic power of an Adirondack spruce top. Built on the 000-14 Fret Auditorium body, it delivers a balanced, articulate voice well suited to fingerstyle and flatpicking alike.

  The Adirondack spruce top is treated with Martin's Vintage Tone System (VTS), torrefying the wood to recreate the responsive, broken-in feel and warm overtones of a vintage instrument. East Indian rosewood back and sides add depth, sustain, and complex harmonic shimmer to the equation.

  A Modified Low Oval neck with High-Performance Taper makes the 000-16 StreetMaster easy to play across the entire fingerboard, while the 24.9-inch scale, 1 3/4-inch nut, and rosewood fingerboard with abalone Diamond & Square Short inlays carry the vintage aesthetic from headstock to soundhole. Ping aged-nickel tuners and a solid East Indian rosewood headstock complete the look.

  The guitar ships in a waterproof soft gig bag with backpack straps and is strung with Authentic Acoustic Lifespan 2.0 Phosphor Bronze light-gauge strings. It is covered by Martin's Limited Lifetime Warranty and is available in right- and left-handed configurations.
specs: |-
  - Body: 000-14 Fret (Auditorium)
  - Top: Adirondack Spruce with Vintage Tone System (VTS)
  - Top Finish: Satin, Dark Mahogany color
  - Back & Sides: East Indian Rosewood, Satin finish
  - Bracing: Scalloped X-brace
  - Neck: Select Hardwood
  - Neck Shape: Modified Low Oval with High-Performance Taper
  - Neck Finish: Satin, Dark Mahogany color
  - Scale Length: 24.9 inches
  - Nut Width: 1 3/4 inches
  - Fingerboard: Rosewood, 2 1/8 inches at 12th fret
  - Fingerboard Inlays: Abalone (Diamond & Square Short)
  - Frets: 20 total, joins body at 14th fret
  - Bridge: Modern Belly Rosewood with drop-in saddle
  - Saddle: Compensated bone, 16-inch radius
  - Bridge Pins: Ebony
  - String Spacing: 2 5/32 inches
  - Tuning Machines: Ping Aged Nickel
  - Headstock: Solid with square taper, East Indian Rosewood
  - Neck Joint: Simple Dovetail
  - Electronics: None
  - Case: Soft Gig Bag (waterproof, backpack straps)
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze, Light gauge
