details: |-
  Kali's debut line of studio monitors featured a 6.5-inch and an 8-inch 2 way system. These monitors immediately drew praise for their accuracy, low distortion, and hyper-realistic imaging.

  They are succeeded by 2nd Wave versions: the LP-6 V2, LP-6W V2, and LP-8 V2. The 2nd Wave versions have 12 dB lower noise floor, 3 dB higher output, smoother high frequency response, and other upgrades that benefit the acoustic and cosmetic quality of the speakers.

  LP-Series speakers (LP-6, LP-6 White, and LP-8) made before March 20, 2021 are all 1st Wave, and LP-Series speakers made after May 1, 2021 are all 2nd Wave. The 3rd to 9th digits of the serial number are the date of manufacture in MMDDYY format. 1st Wave monitors have a dark black, shiny finish on the transducers, while 2nd Wave monitors have a lighter matte finish.

  Components are not interchangeable between the two generations: the transducers and amplifiers are optimized for use with one another, and both are new for the 2nd Wave.
