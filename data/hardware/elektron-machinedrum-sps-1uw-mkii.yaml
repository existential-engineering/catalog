description: MKII hardware update of the SPS-1UW, combining User Wave sample
  playback with improved processing and the updated MKII platform.
details: |-
  The Machinedrum SPS-1UW MKII combined the UW sampling engine with the improved MKII hardware revision. It was a groundbreaking digital drum machine that combined extremely flexible drum synthesis methods with a sampling engine.

  The MKII revision improved the hardware design, switching from AC to DC power supply (PSU-2b, 6 VDC) and offering enhanced processing. The powerful sequencer with parameter locks remained the core of the creative workflow.

  All Machinedrum variants share the same final firmware, OS 1.63, released May 2016.
specs: |-
  - 5 drum synthesis methods plus User Wave sampling
  - RAM-based sample playback
  - Step sequencer with parameter locks
  - 6 individual audio outputs (A/B balanced, C-F unbalanced)
  - 2 audio inputs
  - Power: 6 VDC, minimum 3A (PSU-2b)
  - Final firmware: OS 1.63 (May 2016)
