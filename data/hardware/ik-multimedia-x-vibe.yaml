description: "Audiophile-grade modulation pedal featuring all-new effects
  leveraging IK's latest AmpliTube technologies plus an exclusive plug-in of the
  exact same effects."
details: |-
  Breakthrough software and hardware integration for guitarists. State-of-the-art DSP in a road-worthy anodized aluminum chassis with 16 different algorithms, 50 factory presets (300 storable presets). Includes exclusive virtual X-VIBE version for use in AmpliTube 5. Designed and made in Italy.

  Algorithms: 80-Chorus - Inspired by '80s stereo chorus effects, Chorus-1 - Based on Solina String Ensemble Keyboard chorus effect, Chorus-X - Based on Roland RS Series synthesizer chorus, 60-Vibe - Based on Univox Uni-Vibe chorus/rotating-speaker simulator, Phazer-9 - Based on MXR Phase 90, Phazer-10 - Based on MXR Phaser 100, Phazer-CL - Inspired by classic '70s analog phase shift effect, Fox - Based on fOXX Foot Phaser, Stone - Based on Electro-Harmonix Small Stone, Electric - Based on Electro-Harmonix Electric Mistress flanger/filter matrix, Doubler - Based on MXR Flanger Doubler, Metallic - Based on MXR Flanger 117, Rotary - Model of a rotary speaker cabinet, Tremolo - Fully customizable tremolo with envelope and wave shape control, Step-Slicer - Beat-synced slicing stomp effect, Step-Filter - Beat-synced filter stomp effect with LP/HP/BP filtering

  MODEL encoder (16 algorithms), PRESET encoder (300 presets), PARAMETER encoder with sub-parameters, 4 main parameter knobs, 3 footswitches (A, B, TAP)

  8-character, 16-segment LCD display

  Selectable true or soft bypass

  Anodized aluminum chassis. Designed and made in Italy.

  Includes virtual X-VIBE plugin for AmpliTube 5, AmpliTube 5 SE, X-GEAR Librarian app, and 5 cabinet impulse responses.
specs: |-
  - Ultra-low noise 24-bit/192 kHz converters
  - Frequency response: 5 Hz - 24 kHz
  - Dynamic range: 112 dB
  - 16 modulation algorithms
  - 50 factory presets, 300 total storable
  - Selectable true or soft bypass
  - True stereo inputs and outputs
  - Tap tempo with BPM sync
  - 5 cabinet impulse responses
  - 8-character 16-segment LCD display
  - 3 footswitches
  - Anodized aluminum chassis
  - Dimensions: 175 x 145 x 58 mm (6.88" x 5.7" x 2.28")
  - Weight: 906 g (31.96 oz)
  - Power: 9V DC center-negative (PSU included)
