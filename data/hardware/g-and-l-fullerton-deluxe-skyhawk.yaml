description: The Fullerton Deluxe Skyhawk starts from George Fullerton's evolved
  double-cutaway with a hint of offset, a slim waist and generous curves, topped
  by his arched pickguard and a chrome control plate. Its MFD single coils run
  through a PTB system on all three pickups, with a mini-toggle Expander Switch
  for neck plus bridge or all three together.
details: |-
  Like the original G&L Skyhawk of 1984, it starts with George Fullerton's evolved double-cutaway with a hint of offset, a slim waist and generous curves. This very comfortable body is complemented by his arched pickguard shape, his most pleasing iteration of the form.

  The elegant pickguard meets a beautiful control plate in chrome, a perfect backdrop for the exquisitely machined and chrome plated knobs for volume, treble and bass. The Skyhawk features a Leo Fender-designed Dual-Fulcrum vibrato, a work of engineering art which allows bending up or down with unsurpassed stability, while offering a silky feel through its beefy aluminum vibrato arm.

  There is plenty of punch in the MFD pickups, but what is surprising is how glassy and detailed they become as the volume and bass controls are rolled back, the latter a part of the Skyhawk's PTB (Passive Treble and Bass) system which functions on all three pickups. The Skyhawk also includes a mini-toggle Expander Switch to allow neck plus bridge or all three pickups together. In a pinch, the neck plus bridge combo does a convincing faux ASAT Special.

  P.T.B., Passive Treble and Bass controls: dramatically more effective than a standard tone control, treble and bass frequencies can be separately cut with this exclusive passive style circuitry via two separate tone knobs.

  Expander Switch: a mini toggle switch (push/pull knob on Tribute Series) adds two additional pickup selections when used in conjunction with the five-position switch. The switch is on when thrown towards the pickups (knob pulled up on Tributes). With the five-position switch set to either extreme, a selection of the bridge and neck pickup is available. All three pickups can be selected when the bridge pickup coupled with the middle pickup, or the neck pickup coupled with the middle pickup, is selected with the five position switch.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic CLF Research / G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD single coils
  - Body wood: Alder
  - Neck wood: Natural Satin Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius and 1 11/16" nut-width
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, nickel
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: Leo Fender-designed G&L Dual-Fulcrum vibrato with forged brass saddles
  - Controls: 5-position pickup selector, volume, treble, bass (PTB system), mini-toggle switch enabling additional pickup combinations of neck plus bridge or all three pickups together
  - Includes: G&L Deluxe Gig Bag
  - Available in: Cherryburst over Swamp Ash, 3-ply pearl pickguard, Maple fingerboard
  - Available in: Andromeda over Alder, 3-ply pearl pickguard, Rosewood fingerboard
  - Available in: Lake Placid Blue over Alder, 3-ply tortoise pickguard, Rosewood fingerboard
  - Available in: 3-Tone Sunburst over Alder, 3-ply tortoise pickguard, Rosewood fingerboard
  - Available in: Clear Orange over Swamp Ash, 3-ply parchment pickguard, Maple fingerboard
