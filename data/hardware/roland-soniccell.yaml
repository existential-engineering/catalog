  - discontinued
description: >-
  Roland released their SonicCell desktop synthesis unit in 2007 with the
  intention of delivering the sound quality of a Roland hardware synth in a
  compact form. The device targets both computer-based musicians and live
  performers, bundled with PC/Mac Editor and Cakewalk SONAR LE software.
details: |-
  The SonicCell is powered by the Fantom X-class synth engine with 128 voices of polyphony and
  6-part multitimbrality. It features built-in acoustic sounds with extra emphasis on realistic
  acoustic tones and is compatible with SRX-series expansion boards with two slots available. The
  unit functions as audio interface, sound module, and file player. It has 128 MB wave memory with
  896 ROM patches, 256 user patches, 32 rhythm sets, and 64 performances. Features include
  multi-effects, chorus, reverb, input effects, and master effects processing.
specs: |-
  - Polyphony: 128 voices
  - Multitimbral: 6 parts
  - Oscillators: 4
  - Waveforms: ROM
  - Filters: 12 dB (2-pole), 24 dB (4-pole), band-pass, comb, high/low-pass
  - LFO: 2 with multiple waveforms and sync options
  - Memory: 896 ROM patches, 256 user patches, 32 rhythm sets, 64 performances
  - Effects: Multi-effects, chorus, reverb, input effects, master effects
  - Control: MIDI In/Out, USB
releaseDate: "2007"
releaseDateYearOnly: true
