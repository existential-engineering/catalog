details: |-
  The Seafoam Chorus is a Keeley design that treats chorus and vibrato as one effect, voiced from the ground up rather than derived from an existing circuit. It is not only a chorus: a Blend control rides the line between chorus and pitch-bending vibrato.

  Setting the Depth wide and the Rate low generates large sound-spaces, and the Rate control stays musical at fast settings for splashy, exotic textures. Four controls cover the whole range: Rate, Depth, Tone and Blend.

  The chorus engine is built around the ES56033 IC, paired with a Keeley LFO opto-coupler design that reaches very slow rates and deep depth. An analog-digital topology keeps the original guitar signal analog and blends it with the digital side, while low-noise circuitry avoids the noise typical of all-analog chorus designs. A Keeley-designed FET input stage captures pickup and effect nuance, and the pedal is designed for both guitar level and effects loop levels.
