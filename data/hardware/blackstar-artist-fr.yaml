description: Compact, guitar-voiced FRFR powered cabinet from Blackstar,
  designed by amp engineers to deliver the feel and response of a traditional
  guitar amp for use with modellers, profilers and floorboard processors.
details: |-
  Designed by the same team behind Blackstar's amps, the Artist FR cabinets give your modeller or floorboard the dynamics and character you expect from an analogue setup. Whether you're dialling in patches at home, recording in the studio, or stepping onto a stage, Artist FR gives you full-range clarity with the feel of an amp behind you.

  Modellers and IRs can vary wildly. Artist FR's active 3-band EQ and Presence control let you shape your tone fast — perfect when switching guitars, patches, or playing environments. The custom-designed flat-response speaker with whizzer cone delivers extended highs with zero harshness, while a bass port on the rear ensures the lows are full and defined.

  Artist FR is available in two versions. The Artist FR Standard is a compact, 50W 1×12″ cabinet ideal for home and studio players with the ability to do smaller gigs. The Artist FR Special is a larger, louder, stage-ready 100W 1×12″ that brings the same tone and feel to rehearsals and full-stage setups.

  Built on Blackstar's proven cabinet construction and power-amp technology for stage-tough reliability, both versions feature a built-in kickstand that tilts the cabinet into a monitor position for better projection during rehearsals and live shows.
specs: |-
  - Easy-to-use FRFR powered 1×12″ cabinet
  - Designed by amp experts to create the feel and response of a traditional guitar amp
  - Built on Blackstar cabinet construction and power amp technology for proven power and reliability
  - Custom designed flat-response speaker with whizzer cone for clarity and accuracy with amp and effects models
  - Bass port on rear for full, defined low end
  - Active 3-band EQ and Presence control on front panel
  - Volume control
  - Built-in kickstand for tilt-back monitoring
  - Artist FR Standard: 50W
  - Artist FR Special: 100W
