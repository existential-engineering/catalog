description: The Klark Teknik DN 30R Dante Audio Receiver connects active
  loudspeakers, amplifiers or mixers to a Dante network. It receives signals
  from any Dante transmitter over a standard CAT5e or CAT6 cable, and that same
  connection can power the device through Power over Ethernet, with a 24-volt DC
  input as the alternative.
details: |-
  The DN 30R is a way of connecting active loudspeakers, amplifiers or mixers to a Dante network.

  Its compact size and the flexibility of its features and mounting options suit it to hospitality and event spaces, performance and installed audio.

  The unit receives signals from any Dante transmitter via a standard CAT5e or CAT6 cable. The same connection can be used to power the device through Power over Ethernet, or power can come from a 24-volt DC input.
specs: |-
  - Dante network audio receiver
  - Receives from any Dante transmitter over standard CAT5e or CAT6 cable
  - Powered by Power over Ethernet or a 24 V DC input
  - Compact enclosure with flexible mounting options
