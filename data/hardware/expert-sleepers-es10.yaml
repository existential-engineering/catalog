id: 7aQbCMuo40biZ9_4-Kisd
name: ES-10
manufacturer: expert-sleepers
primaryCategory: modular
categories:
  - utility
  - audio-interface
hp: 12
url: https://www.expert-sleepers.co.uk/es10.html
description: The ES-10 is a Eurorack 8-in/8-out ADAT interface with DC-coupled
  inputs and outputs that carry both audio and CVs. Each input can be
  individually set for modular or line level operation.
details: |-
  The ES-10 is a Eurorack 8-in/8-out ADAT interface, with DC-coupled inputs and outputs that can be used for both audio and CVs. Each input can be individually selected for modular or line level operation, and the outputs can be expanded via the ES-5 module.

  The ES-10 uses AKM VELVET SOUND DACs and ADCs together with low noise audio op-amps. Expert Sleepers notes that the module cannot be used without an ADAT input connection, taken from the ADAT output port of an audio interface.

  The panel is 12HP wide and the module is 35mm deep including the power cable. The eight inputs are 3.5mm TS jacks, DC or AC coupled, switchable between modular and line level, with a maximum voltage of plus or minus 12V. The eight outputs are 3.5mm TS jacks, DC coupled, with a maximum voltage of plus or minus 11V. One expansion header is fitted, for the ES-5. Current draw is 132mA on the +12V rail and 90mA on the -12V rail.

  Expert Sleepers describes the ES-10 as offering the same functionality as the combination of an ES-3, ES-6 and ES-7, while using less HP, being less deep, consuming considerably less power, offering better audio quality through lower noise, and adding the option of line level input.
specs: |-
  - Panel width: 12HP
  - Module depth: 35mm (including power cable)
  - Inputs: 8x 3.5mm TS jacks, DC or AC coupled, modular or line level
  - Maximum input voltage: plus or minus 12V
  - Outputs: 8x 3.5mm TS jacks, DC coupled
  - Maximum output voltage: plus or minus 11V
  - Expansion header: one, for the ES-5
  - AKM VELVET SOUND DACs and ADCs with low noise audio op-amps
  - Current draw: 132mA on the +12V rail, 90mA on the -12V rail
  - Requires an ADAT input connection from the ADAT output port of an audio interface
