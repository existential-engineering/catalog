releaseDate: "2013"
releaseDateYearOnly: true
description: >-
  Maths is an analog computer designed for music by Make Noise. It is the
  do-it-all analog function generator for eurorack modular synthesizers,
  combining the functionality of envelope generators, LFOs, slew limiters,
  attenuators, and more in a single 20 HP module.
details: |-
  Maths is an analog computer designed for music. Combining the classic
  functionality of the Buchla 281 and Serge DUSG (Dual Universal Slope
  Generator), Maths provides a wide range of functions essential for
  creating and modifying control voltages in a modular system.

  The module features two primary channels (CH 1 and CH 4) with
  independently controllable Rise and Fall times, each with dedicated CV
  inputs for voltage control. The central attenuverter/mixer section (CH 2
  and CH 3) provides signal processing and mixing capabilities.

  Maths excels as an envelope generator, LFO, slew limiter, oscillator,
  lag processor, and more. Its cycle modes allow channels to self-trigger,
  creating complex modulation sources. The OR and SUM outputs provide
  logic and mixing functions for combining the channels.

  A cornerstone of modular synthesis, Maths is often described as the
  Swiss Army knife of eurorack modules.
specs: |-
  - 20 HP width
  - 24mm depth
  - +12V: 60mA
  - -12V: 50mA
  - Two primary function generator channels (CH 1, CH 4)
  - Two attenuverter channels (CH 2, CH 3)
  - Independent Rise and Fall controls per channel
  - Voltage controlled Rise and Fall times
  - Cycle mode for self-triggering (LFO, oscillator)
  - End of Rise (EOR) gate output
  - End of Cycle (EOC) gate output
  - Unity output per channel
  - OR logic output
  - SUM output
  - Analog circuitry throughout
