details: |-
  The AUDIX Novacore NCEC is a professional extended cardioid wireless capsule engineered for balanced vocal clarity across a wide dynamic range. Its voicing is derived from the AUDIX OMX series of stage microphones, applying the same proprietary VLM capsule technology — valued for natural sound reproduction and strong transient response — to the Novacore wireless platform.

  The extended cardioid polar pattern provides a broader pickup angle and more consistent off-axis response compared to tighter patterns, making it the preferred choice for vocalists and presenters who move during performance and need reliable, even-sounding coverage without frequent gain adjustments. Internal vibration isolation reduces handling noise for clean vocals even during active stage movement.

  The NCEC mounts via standard "S" thread to the AUDIX NCHH handheld transmitter and is also compatible with many third-party S-thread wireless handheld transmitters, making it an immediate sonic upgrade option for engineers already invested in another wireless platform. It is sold individually and is also included in the NCHHEC bundle.
specs: |-
  - Polar pattern: Extended cardioid
  - Capsule technology: VLM (derived from AUDIX OMX series)
  - Mount: standard "S" thread wireless capsule
