description: >-
  The Roland MKS-50 is a rack-mount version of the Alpha Juno synthesizer, delivering 6-voice analog polyphony with a
  DCO-based engine renowned for its acid basslines, lush chorus, and solid MIDI implementation.
details: |-
  Released in 1987, the MKS-50 took the synthesis engine from Roland's Alpha Juno keyboard and repackaged it in a compact rack-mount format. This made the Alpha Juno's distinctive sound accessible to studios and performers who needed analog polyphony without dedicating keyboard space, and it quickly became a popular choice for adding warm analog tones to MIDI-based setups.

  Each of the six voices features a single DCO (digitally controlled oscillator) with pulse, sawtooth, sub-oscillator, and noise waveforms. The signal passes through a 24dB analog low-pass filter with ADSR envelope shaping for both filter and amplifier stages. Built-in chorus adds the lush, wide character that Roland's Juno line is famous for, while 16 programmable chord memories add performance flexibility.

  The MKS-50 improved on previous Roland synths with a more capable MIDI implementation, supporting velocity and aftertouch mapping to the VCF or envelope parameters. Patch storage holds 64 user and 64 preset sounds with cassette backup capability. The optional PG-300 programmer provides traditional slider-based control over all synthesis parameters for those who prefer hands-on editing over the LCD menu system.

  The MKS-50 earned a reputation for excellent bass sounds, particularly the squelchy acid basslines that became central to the acid house and techno movements. Notable users include Future Sound of London, Pet Shop Boys, Vince Clarke, Astral Projection, and Fluke.
specs: |-
  - Polyphony: 6 voices
  - 1 DCO per voice (Pulse, Sawtooth, Sub-oscillator, Noise)
  - 24dB analog low-pass filter
  - ADSR envelope for filter and amplifier
  - Chorus effect
  - Portamento
  - 16 programmable chord memories
  - 64 user patches, 64 preset patches
  - Cassette backup
  - MIDI with velocity and aftertouch mapping
  - Optional PG-300 programmer
  - No keyboard (rack-mount unit)
  - LCD display
