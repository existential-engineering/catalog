description: An experimental, patchable stereo sample player designed for
  discovering rhythms and riffs through modulation. Pocket-sized and
  battery-powered with modular patching capabilities, built-in effects, a
  resonant filter, LFO, and pattern/rhythm generator.
details: |-
  The Kastle 2 Wave Bard is a pocket-sized, battery-powered, patchable stereo sample player built for experimental music-making. It comes loaded with 6 factory sample banks and supports loading custom samples via a web-based sample loader app, with capacity for up to 89 seconds mono or 44 seconds stereo at 44kHz/16-bit.

  The device features a resonant lowpass/highpass filter, built-in delay/chorus/flanger effects, an LFO (synced or free-running), and a pattern/rhythm generator for creating evolving sequences. Pitch can be shifted ±2 octaves, and samples can be reversed with a unique envelope.

  USB MIDI input and output are available from firmware v1.1 onward. The instrument also features analog sync I/O via 3.5mm jacks for hardware clock synchronization. The open-source firmware allows user customization, and a DIY kit version is available with an assembly guide.

  Powered by 3× AA batteries (15–18 hours) or USB-C. Comes with 10 patch cables, a quickstart guide, and a sticker.
