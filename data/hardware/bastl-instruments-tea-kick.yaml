url: https://bastl-instruments.com/eurorack/modules/tea-kick
description: Analog drum circuit based on enhanced twin T resonant structure
  simulating a virtual electronic membrane. Tune with CV and attenuator,
  Resonance with range switch (prevents self-oscillation in low range), Click
  tone control, trimmer for resonance range. Can function as drum generator or
  experimental oscillator.
details: 5HP, 35mm depth (skiff-friendly). +12V <15mA, -12V <15mA. 16-pin power
  connector.
