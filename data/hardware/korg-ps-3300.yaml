description: >-
  The Korg PS-3300 is a megalithic semi-modular polyphonic analog synthesizer system from
  1977, essentially comprising three PS-3100 units stacked together with an integrated
  mixer. Featuring 48 voices of polyphony with 48 VCOs, 48 VCFs, and 48 VCAs, it remains
  one of the largest and fattest compact synthesizer systems ever produced. Notable users
  include Vangelis, Jean-Michel Jarre, and Emerson, Lake and Palmer.
details: |-
  The PS-3300 is Korg's flagship from their legendary PS series of the late 1970s, representing one of the first truly polyphonic analog synthesizers. It is a two-piece system consisting of the main synthesizer unit and the PS-3010 48-key remote polyphonic keyboard, housed in beautiful wood panels with an abundance of knobs and patch points.

    Building on the PS-3100, the PS-3300 essentially triples that instrument's architecture by stacking three PS-3100 voice boards together with an integrated mixer. This gives it an extraordinary 48 voices of polyphony driven by 48 voltage-controlled oscillators, 48 voltage-controlled filters, and 48 voltage-controlled amplifiers. Each keyboard note supports microtonal tuning capabilities.

    The modulation possibilities are incredible for an instrument of its era, with a general envelope generator and sample-and-hold functionality complementing the semi-modular patch-point architecture. Despite being nearly five decades old, the PS-3300 remains a very useful and coveted synthesizer, prized for its bold, massive Korg sound.
specs: |-
  - Polyphony: 48 voices
    - Oscillators: 48 VCOs
    - Filter: Resonant VCF (48 independent VCFs)
    - VCA: 48 independent VCAs with ADS envelope generator
    - Effects: 3-band EQ
    - Modulation: Sample-and-hold, general envelope generator
    - Keyboard: PS-3010 48-key remote polyphonic keyboard
    - Tuning: Microtonal tuning per key
    - Control: CV/Gate
    - Arpeggiator/Sequencer: None
    - Configuration: Semi-modular, two-piece system
