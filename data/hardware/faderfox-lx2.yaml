url: https://faderfox.de/lx2.html
description: Special controller for switch commands, optimized for Ableton Live.
  Setup files for Ableton Live as of version 4.1 are shipped with the
  controller.
details: |-
  Special controller for switch commands (optimized for Ableton Live). Setup files for Ableton Live as of version 4.1 are shipped with the controller. Take the Live internal control surface 'LV2_LX2_LC2_LD2' to have all controls automapped, so setting files are no longer necessary.

  Independent of operating system and computer type (PC or Mac) due to the midi interface, with no driver necessary.

  3 groups of 12 coloured buttons, each group switchable between 3 keysets which are independently programmable. Programmable are keymode (1 of 12 and toggle), cc/note number (in groups of 12 ascending numbers), channel (1-12), track (1-12) etc. A mini-keyboard with octave-shift-buttons allows fast triggering of any instrument (octave, velocity, channel programmable).

  12 setup memories store 3 keysets of each button group (12 setups x 3 keysets x 4 button groups). Parameter feedback of button statuses is indicated by LED's (LIVE sends Mute and FX), and 49 LED's in different colors display various information, with low basic lights of all LED's for better orientation in dark club atmosphere.

  Independent power supply by standard or rechargeable batteries, 3 x AA cell, lifetime about 30 to 60 hours, with powersave mode after 10 minutes of the last movement, LED battery control and a socket for an external power adaptor (4.5-6V DC, min. 100 mA). Very compact design in a black, plastic casing (desktop format 180x105x70 mm, 450 g) with a silver aluminium front plate with anodised coating (abrasion resistant) and inscriptions.
specs: |-
  - 3 groups of 12 coloured buttons, each group switchable between 3 independently programmable keysets
  - Programmable keymode (1 of 12 and toggle), cc/note number, channel (1-12) and track (1-12)
  - Mini-keyboard with octave-shift-buttons for fast triggering of any instrument (octave, velocity and channel programmable)
  - 12 setup memories (12 setups x 3 keysets x 4 button groups)
  - Parameter feedback of button statuses indicated by LED's (LIVE sends Mute and FX)
  - 49 LED's in different colors, with low basic lights for orientation in dark club atmosphere
  - Midi-merge function
  - Expandable system by other micromodul controllers, chained by midi connections
  - Compatible to the 1st/2nd micromodul line (same cc/note numbers as LV1, LX1, LV2, LC2, LD2)
  - Powered by 3 x AA standard or rechargeable batteries, about 30 to 60 hours lifetime
  - Powersave mode after 10 minutes of the last movement (flash light)
  - LED battery control
  - Socket for an external power adaptor (4.5-6V DC, min. 100 mA)
  - Black plastic casing, desktop format 180 x 105 x 70 mm, 450 g
  - Silver aluminium front plate with anodised coating (abrasion resistant) and inscriptions
  - Requires a PC or Mac with a free USB port (1.0 or higher) or any USB hub
  - Requires Ableton Live 4.1 or later, or software which allows user assignment of continuous parameters (CC) and note commands
