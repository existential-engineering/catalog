  historic EMI TG12413 limiters found on the TG12345 mixing and mastering
  consoles of the late 1960s and early 1970s.
details: |-
  The Chandler Limited TG Opto Compressor traces its lineage to the historic EMI TG12413 limiters found on the TG12345 mixing and mastering consoles of the late 1960s and early 1970s. Conceived from meetings in 1967 between Abbey Road engineers and EMI's Central Research Laboratories technical team, the EMI TG12345 desk ushered in a sea change in sound and flexibility at Abbey Road Studios.

  The TG Opto has two distinct personalities actuated by the selectable Sharp and Rounded knee types. In Sharp mode, the TG Opto is capable of explosive drum sounds; set to Rounded, it is well suited to gentle compression scenarios. The continuous control-set (Input, Output, Attack, Release) affords fine-tuning to respond to an array of sources.

  Notable users include Mitch Dane, Vance Powell, and Ryan Hewitt.
