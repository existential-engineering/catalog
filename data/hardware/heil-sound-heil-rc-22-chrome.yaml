details: |-
  The Heil RC 22 is the wireless capsule version of the Heil PR 22 and PR 22 UT wired microphones. The RC 22 has the same features as the PR 22 UT including the same element, internal mount, and excellent rear noise rejection. The RC 22 is an excellent upgrade to your existing wireless system and will instantly add greater clarity, articulation, and quality to your sound. The RC 22 works with most Shure, Sony, Lectrosonics, and Line 6 wireless systems with removable capsules, and is compatible with some Sennheiser systems with the proper adapter (see ambient.de for adapters and compatible systems).
specs: |-
  - Thread: 31.3 mm, 1.0 mm threading (1.25″ x 28 thread pitch).
  - Element type: dynamic.
  - Frequency response: 50 Hz to 18 kHz.
  - Polar pattern: cardioid.
  - Rear rejection at 180 degrees off axis: -30 dB.
  - Impedance: 600 ohms balanced.
  - Output level: -55 dB at 1 kHz.
  - Weight: 4.9 oz.
  - Max SPL: 145 dB.
