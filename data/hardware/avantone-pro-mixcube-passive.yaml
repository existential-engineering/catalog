description: Passive mini-reference monitor designed to replicate bass-limited
  consumer playback devices, helping producers verify how their mixes translate
  across real-world listening environments.
details: |-
  The Avantone Pro MixCube Passive is a mono full-range mini-reference monitor
  built around a 5.25-inch custom driver. Its compact 6.5" cube form factor
  and intentionally limited frequency response (200 Hz–10 kHz) make it an
  ideal tool for checking how mixes will sound on consumer devices like
  televisions, radios, and portable Bluetooth speakers.

  The cabinet is constructed from 18mm MDF with Dacron stuffing for internal
  damping. The enclosure is internally shielded for low-noise operation and
  features 7mm neoprene acoustic isolation pads on the bottom to decouple the
  monitor from surfaces.

  The custom 5.25" driver uses a die-cast aluminum frame, a paper cone made
  from New Zealand pulp and mica fibers, a Japanese cloth surround, and a
  Y-40 Grade magnet motor structure with a 43oz motor. The top plate and
  T-yoke use Sumitomo 1008 low-carbon steel.

  Input connectivity is provided via high-end nickel-plated 3-way binding
  posts on the rear panel, accepting bare 12-gauge wire, spade connectors, or
  banana plugs. The monitor requires an external amplifier rated between 10 and
  200 watts into 8 ohms.

  A recessed mic stand mount (5/8"-27 industry standard thread) is built into
  the bottom of the cabinet. Available in Black and Creme finishes.
specs: |-
  - System Type: Dynamic Shielded Full-Range Mono
  - Frequency Response: 200 Hz – 10 kHz
  - Impedance: 8 ohms nominal
  - Sensitivity: 93 dB @ 1W / 1 meter
  - Recommended Power: 10–200 watts
  - Driver: 5.25" custom die-cast aluminum frame
  - Cone material: Paper (New Zealand pulp and mica fibers)
  - Surround: Japanese cloth
  - Magnet: Y-40 Grade, 43oz motor structure
  - Cabinet: 18mm MDF with Dacron stuffing
  - Dimensions: 6.5" × 6.5" × 6.5"
  - Weight: 7.13 lbs per monitor
  - Input: 3-way nickel-plated binding posts (bare wire, spade, banana plug)
  - Mic stand mount: 5/8"-27 recessed thread
  - Isolation pads: 7mm neoprene
  - Available finishes: Black, Creme
