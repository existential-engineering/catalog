details: |-
  The Manley Stereo Neo-Classic 300B delivers switchable Single-Ended and Push-Pull operation in a single amplifier, providing access to two distinct triode topologies optimized for different performance priorities. Hand-built in California around four 300B output tubes and custom-wound Manley transformers, this amplifier combines the dimensional imaging and harmonic purity of Single-Ended Class A operation with the power reserves and control of Push-Pull configuration for comprehensive system matching capability.

  The Neo-Classic 300B offers true topology switching between Single-Ended (12W) and Push-Pull (24W) configurations. Single-Ended mode operates with zero negative feedback in pure Class A, emphasizing harmonic richness, spatial dimensionality, and low-level detail resolution. Push-Pull mode provides doubled output power with reduced distortion and increased damping factor, delivering enhanced bass control and extended dynamic capability for demanding loudspeaker loads and complex musical passages.

  A front-panel negative feedback control allows continuous adjustment from 0 dB to 10 dB, modifying the amplifier's damping factor and transient characteristics. This variable topology enables precise matching to loudspeaker impedance curves and personal sonic preferences, ranging from zero-feedback purity with maximum harmonic transparency to moderate feedback for tighter bass control and extended bandwidth. This flexibility ensures optimal performance across diverse speaker designs and listening requirements.

  The Neo-Classic 300B employs four 300B triode output tubes operating in pure Class A for maximum linearity and harmonic accuracy. Custom-wound Manley IRON® output transformers are engineered in-house with specialized winding techniques to accommodate both Single-Ended and Push-Pull operation while maintaining wide bandwidth, low distortion, and exceptional low-frequency extension. This combination delivers the sonic characteristics that define reference-grade 300B amplification: transparency, dimensional accuracy, and natural tonal balance.
specs: |-
  - True Single-Ended and Push-Pull operation via front-panel switching
  - Pure Class A topology utilizing legendary 300B triode output tubes
  - Variable negative feedback control for damping factor adjustment
  - Custom-wound Manley IRON® output transformers designed in-house
  - Power Output: 12 Watts (SE) / 24 Watts (PP)
  - Tubes: 4 x 300B, 2 x 6SN7GT, 2 x 6SL7GT
  - Frequency Response: 10 Hz – 40 kHz
  - Negative Feedback: Adjustable (0 to 10 dB)
  - Input Sensitivity: 750 mV for full output
  - S/N Ratio: -78 dB typical
