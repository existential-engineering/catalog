details: |-
  The next-generation JBL 306P MkII powered studio monitor makes legendary JBL performance available to every studio. With the revolutionary JBL Image Control Waveguide and refined transducers, JBL 306P MkII offers stunning detail, precise imaging, a wide sweet spot and impressive dynamic range that enhances the mix capabilities of any modern workspace. Leveraging patented technologies derived from the JBL 7 Series and M2 Master Reference Monitors, the 306P MkII delivers outstanding performance at an accessible price.

  The JBL Image Control Waveguide was originally developed for JBL's flagship M2 Master Reference Monitor. This patented innovation ensures an acoustically seamless transition between the low- and high-frequency transducers and provides an immersive soundstage with precise imaging, offering a broad sweet spot and neutral frequency response — revealing subtle details even when listening off-axis.

  The 306P MkII features the patented Slip Stream low-frequency port design, which enables superior bass performance across all playback levels. Dual integrated, custom Class-D amplifiers provide 112 watts of total power for high output and extended dynamic range.

  Tailored sound options allow users to adapt the monitor to their studio environment. The Boundary EQ attenuates low-end boost that can occur when monitors are placed on a desktop or near walls, while the 3-position HF Trim switch (+2dB, 0dB, -2dB) lets users adjust the high-frequency response to match room acoustics.

  The 306P MkII offers flexible, professional connectivity with balanced XLR and 1/4" TRS inputs and a +4dBu/-10dBV input-sensitivity switch, making it compatible with both professional and consumer-level sources.
specs: |-
  - LF Driver: 165mm (6.5")
  - HF Driver: 25mm (1") soft dome
  - LF Amplifier Power: 56W, Class-D
  - HF Amplifier Power: 56W, Class-D
  - Total Amplifier Power: 112W
  - Crossover Frequency: 1425Hz, 4th order acoustic Linkwitz-Riley
  - Frequency Response (±3dB): 47Hz – 20kHz
  - Frequency Range (-10dB): 39Hz – 24kHz
  - Max Continuous SPL: 92dB
  - Max Peak SPL: 110dB
  - Signal-to-Noise Ratio: 75dBA (A-Weighted)
  - Coverage Angle: 120° x 90°
  - Enclosure: Ported, 15mm MDF
  - Dimensions (H×W×D): 361 × 224 × 282mm (14.2" × 8.8" × 11.1")
  - Net Weight: 6.1 kg (13.42 lbs)
  - AC Input: 100–240VAC (±10%), 50/60Hz
  - HF Trim: -2dB, 0dB, +2dB
  - Boundary EQ: LF Shelf @ 50Hz
  - Input Sensitivity Switch: +4dBu / -10dBV selectable
