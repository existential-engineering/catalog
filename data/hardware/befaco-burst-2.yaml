description: Burst is a trigger processor and generator, designed to add an
  organic chain of events to your modular setup.
details: |-
  Burst is a trigger processor and generator for Eurorack modular synthesizers, designed to add an organic chain of events to a modular setup. It can be seen as a 'Trigger Activated Trigger Burst' — each time it is activated, either manually or with an external trigger, a given amount of triggers are generated with control over Time Division, Distribution, Quantity, and Probability.

  With Burst synced to your tempo, you can create all kinds of ratcheting effects and multiplications leading to doubles, triplets, quintuplets, and true polyrhythms for your modular system.

  With very short time windows, Burst can help synthesize fast repeating transients for 'hand-clap like' sounds or modern drum hits.

  Working in Cycle Mode, Burst is also an excellent master clock with tap tempo functionality, and is able to achieve non-linear distributed clocks. The module supports up to 32 triggers per burst.
