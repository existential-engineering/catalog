description: New World of Fluctuation Created by Dual Delay
details: |-
  The FUTURE FACTORY FF-1Y was developed around the creation of a new sound. In most digital delays with a modulation function, the phase of the low frequency oscillator changes regularly at a preset cycle. In the FF-1Y the signal's phase instead changes at random whenever the signal crosses a certain attenuation level, which Free The Tone states was a world first as of November 2018. The result is a fluctuating, spacious sound that seems to float in the air, and the function works best in stereo mode.

  The unit holds two delay modules, which can be used as a stereo delay or connected in series for mono use, in parallel or in series as required. Processing runs on a 32-bit high-precision DSP, with a built-in HTS (Holistic Tonal Solution) circuit and an analog mixer.

  A dedicated 3-band equalizer is provided for the delay sound, with frequencies selectable to match the instrument in use, which the maker suggests suits guitarists and bassists as well as saxophone, violin, DJ and keyboard players.

  For players working mainly in monaural mode, a soft clipping circuit was added to one channel of the delay. Distorting the delay sound and adding it to the dry signal narrows the delay's bandwidth but adds harmonic overtones, giving a sound closer to that of vintage devices.

  Further functions include delay phase invert, a trail function, a tap input, instrument and line input level switching, preset switching across four slots from a total of 128 presets, and MIDI support on a single DIN connector that can be set as input or output.
specs: |-
  - Number of presets: 128
  - Random Fluctuating Phase Modulation function, stated as a world first as of November 2018
  - Dual delay units connectable in parallel or series
  - 32-bit high-precision DSP
  - 3-band equalizer dedicated to the delay sound
  - Soft clipping circuit on one delay channel
  - Built-in HTS circuit and analog mixer
  - Instrument and line input level switching
  - Delay phase invert and trail function
  - Tap input and preset switching across slots 1 to 4
  - Input impedance: min. 500 kOhm
  - Output load impedance: min. 10 kOhm
  - Max. input level: INST +3.5 dBu, LINE +11 dBu
  - Terminals: standard 1/4 inch phone jacks (A-IN, B-IN, A-OUT, B-OUT, EXT), DC 9V input jack for AC adapter, DIN 5-pin connector selectable as IN or OUT
  - Power supply: 9V DC centre negative polarity, no AC adapter included
  - Current consumption: approx. 350 mA
  - Dimensions: 145.4 (W) x 120.5 (D) x 60 (H) mm including protuberances such as jacks
  - Weight: approx. 470 g
  - Accessories: warranty card, manual, 4 rubber feet
