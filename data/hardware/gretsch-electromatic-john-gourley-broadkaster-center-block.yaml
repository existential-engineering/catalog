details: |-
  The Limited Edition John Gourley Electromatic Broadkaster celebrates the 'force of nature' creativity that fuels Portugal. The Man's, John Gourley. Featuring Pro-inspired specs, and classic Gretsch stylings, this guitar is a powerful representation of John's expressive force.

  Maple Body with Spruce Center Block: A laminated maple body with a chambered spruce center block delivers lightweight comfort, feedback rejection and the open, airy resonance Gretsch center-block guitars are known for.

  USA Full'Tron Pickups: Designed by Tim Shaw, the U.S.-made Full'Tron humbucking pickups deliver classic Gretsch chime, balance and brilliance with a slightly more pronounced midrange for added tonal muscle at higher gain.

  Exclusive Artwork by Cleon Peterson: A silver plexi pickguard featuring custom artwork by artist Cleon Peterson gives this Broadkaster its unmistakable visual identity.
