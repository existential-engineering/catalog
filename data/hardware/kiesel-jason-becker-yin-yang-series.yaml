description: The JBYY is a Jason Becker model inspired by Eric Clapton's
  "Blackie", pairing a Floyd Rose tremolo with a bolt-on neck. Exclusive
  features include the Yin Yang finish and inlays, a 24.75 in scale length and
  the M12SD bridge pickup.
specs: |-
  - Model designation: JBYY
  - Construction: bolt-on with radiused neck heel
  - Body: mahogany
  - Neck: tung-oiled maple with thinner profile, 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.68 in at nut, .75 in thick at 1st fret, .85 in thick at 12th fret, 2.22 in wide at 24th fret
  - Fingerboard: roasted flamed maple with 14 in radius
  - Frets: 24 stainless steel jumbo
  - Scale length: 24.75 in
  - Headstock: reverse pointed inline, painted black
  - Bridge: Floyd Rose tremolo, .42 in (10.7 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Pickups: black and white M12SD bridge pickup, white Mark's Singles neck pickup
  - Electronics: master volume and tone controls with white top hat knobs, 3-way pickup selector
  - Finish: Yin Yang
  - Inlays: Yin Yang dot inlays, black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Body dimensions: 39.125 in long, 1.7 in thick, 12.625 in wide
  - Weight: 7.5 lbs
  - Strings: Elixir Nanoweb 1046E
  - Truss rod cover: Jason Becker signature
