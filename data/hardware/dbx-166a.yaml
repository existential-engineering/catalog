description: The dbx 166A is a discontinued dual-channel compressor/limiter/gate
  in a 1U rackmount unit, adding a noise gate to the 166's OverEasy® compression
  and PeakStop™ limiting. It provided studio and live sound engineers with
  comprehensive dynamics control in a single rack space.
details: |-
  The 166A expanded on the original 166 by adding a noise gate section to the compressor/limiter circuit, making it a complete dynamics processor in a 1U rackmount chassis. The unit processes two independent channels or links them for cohesive stereo control.

  dbx's OverEasy® compression delivers smooth, transparent gain reduction with a soft-knee characteristic that avoids harsh pumping artifacts common with hard-knee designs. The PeakStop™ hard limiter provides absolute peak control to prevent downstream overload, while the gate offers effective noise reduction between audio passages.

  The 166A was a popular choice for studio tracking, mixing, and live sound applications throughout the 1990s, offering reliable professional dynamics processing at an accessible price point.
