details: |-
  Touch Panels for Custom Control. Powered by the Allen & Heath Custom Control app, CC-7 and CC-10 are control touch panels for desktop or wall mount use. They can operate as fixed control devices or complementing a BYOD solution. From simple music source selection to level control, preset recall or paging, they offer an alternative to the IP range of remote controllers for applications where a touchscreen interface is preferred.

  Two Size Options — the CC-7 features a 7" 1024x600 touchscreen and the CC-10 offers a 10" 1280x800 touchscreen.

  Easy to Mount — CC-7 and CC-10 have threaded inserts for standard VESA 75x75mm mounting, and optional desktop stand and wall/glass mount brackets are available.

  Power Up — both models can be powered via a 12V DC PSU or via PoE for a neater install.

  Safe & Secure — running Custom Control in kiosk mode, the app prevents unauthorised operation, securing the settings of the panel. The installer, integrator or system admin can exit the app to change the touch panel settings such as IP address or brightness, or to update the software.

  Multiple User Interfaces — the integrator can freely design multiple user interfaces, tailored to different user levels and/or device types. For example, a bartender can be presented with a simple phone interface, while the AV operator can access uncluttered levels and routing on their tablet, but more comprehensive control when using their laptop.

  Powered by Custom Control — Custom Control is a customisable, cross-platform control app, providing elegant, bespoke control over Allen & Heath AHM, dLive and Avantis installed audio systems.

  Features: PoE or DC 12V powered; Gigabit Ethernet port; USB-A port for Custom Control updates; VESA 75x75 mounting.

  Optional accessories: Desktop stand (CC-STN); Wall/glass mount bracket (CC-BRK).
