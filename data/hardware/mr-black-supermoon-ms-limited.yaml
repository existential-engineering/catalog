description: A special-edition 100-piece run based on the SuperMoon Chrome with
  additional modulation in the reverb output, sold as a charity release with all
  proceeds donated to the National MS Society.
details: |-
  The SuperMoon MS Limited was a special-edition 100-piece limited run built on
  the SuperMoon Chrome, with additional modulation added to the reverb output for
  an even more animated ambient wash.

  The release was a charity project: 100% of the proceeds were donated directly
  to the National MS Society, with buyers choosing a contribution level rather
  than a fixed price. It was a one-time fundraiser rather than a standard catalog
  item.

  The run sold out on 15 July 2016 and was never restocked, making it a rare
  collectible in the SuperMoon family.

  Like the rest of the SuperMoon line, it shared the lush, modulated reverb
  voicing, true-bypass switching and compact, daisy-chain-friendly enclosure, and
  was proudly made in the U.S.A.
specs: |-
  - Based on the SuperMoon Chrome with additional modulation in the reverb output
  - Stunning, lush reverb
  - Dynamic, proprietary Sway modulation
  - Full, lossless wet/dry mix control (100% wet capable)
  - Up to >30 seconds of fluid reverb trails
  - Daisy Chain Friendly
  - Input Impedance: ~500KΩ
  - Output Impedance: ~2KΩ
  - Frequency Response: ~15.6Hz – ~22KHz
  - True-Bypass
  - 9VDC 2.1mm negative center-pin power or internal 9VDC battery (not included)
  - Current Draw: <60mA
