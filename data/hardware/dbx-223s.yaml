name: "223s"
manufacturer: dbx
primaryCategory: filter
url: https://dbxpro.com/en/products/223s
description: Stereo 2-Way/Mono 3-Way Crossover with Linkwitz-Riley 24dB/octave
  filters and TRS balanced connectors.
details: |-
  The dbx 223s Crossover delivers professional-grade performance with ultra low-noise operation and reliable engineering spanning four decades of expertise. By directing specific frequency bands to individual speaker drivers, the unit frees amplifiers to use full power on usable signals, eliminating distortion and producing cleaner audio output.

  This dual-channel crossover incorporates Linkwitz-Riley 24dB per octave filters, independent output gain controls for level matching, output phase inversion capability, and a 40 Hz low-cut filter. An optional mono-summing feature allows low-frequency subwoofer output consolidation.

  The 223s operates in stereo 2-way or mono 3-way configurations, making it suitable for portable sound applications. All components meet professional standards with CSA NRTL/C approval and CE compliance, backed by a 2-year parts and labor warranty.
specs: |-
  - Input Connectors: 1/4" TRS
  - Input Impedance (Balanced): >50k ohm
  - Input Impedance (Unbalanced): >25k ohm
  - Max Input Level: >+22 dBu balanced or unbalanced
  - CMRR: >40 dB, typically >55 dB at 1 kHz
  - Output Connectors: 1/4" TRS
  - Output Impedance (Balanced): 200 ohm
  - Output Impedance (Unbalanced): 100 ohm
  - Max Output Level: >+21 dBu into 2k ohm or greater
  - Bandwidth: 20 Hz to 20 kHz, ±0.5 dB
  - Frequency Response: <3 Hz to >90 kHz, +0/−3 dB
  - Dynamic Range: >106 dB unweighted
  - THD+Noise: <0.004% at +4 dBu, 1 kHz
  - Interchannel Crosstalk: <−80 dB, 20 Hz–20 kHz
  - Filter Type: Linkwitz-Riley, 24 dB/octave, state-variable
  - Crossover Frequency Range: 45–960 Hz or 450 Hz–9.6 kHz (×10)
  - Low Cut Filter: 40 Hz Butterworth, 12 dB/octave high-pass
  - Operating Voltage: 100/120/230 VAC, 50/60 Hz
  - Power Consumption: 15 W
  - Dimensions: 1.75" H × 19" W × 6.9" D
  - Weight: 3.7 lbs (1.7 kg)
