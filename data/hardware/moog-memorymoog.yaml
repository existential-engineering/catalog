description: >-
  Moog's ambitious polyphonic flagship that packed six independent
  Minimoog-style voice circuits into a single instrument, delivering massive
  analog sound with programmable patch memory.
details: |-
  The Memorymoog arrived in 1982 as the most powerful instrument Moog Music had ever built, and it would also be the last major synthesizer the company produced before financial difficulties forced it to close its doors. It represented an attempt to answer the polyphonic synthesizers from Sequential Circuits and Oberheim with something unmistakably Moog in character.

  Each of the six voices contains its own trio of voltage-controlled oscillators and a dedicated 24dB lowpass filter, giving the Memorymoog a total of eighteen oscillators and six independent filter circuits. In unison mode, all eighteen oscillators can be stacked onto a single note for a wall of sound that few instruments have ever matched. The architecture also supports oscillator sync and a sample-and-hold circuit for further sonic variety.

  Two versions were produced: the original Memorymoog and the improved Plus model. The Plus added MIDI connectivity, a built-in sequencer, and improved oscillator stability through autotune circuitry. The original model was notorious for tuning drift and voice reliability issues — a consequence of the sheer number of analog components involved. Many surviving units have been upgraded with aftermarket modifications from Lintronics or Kenton to improve stability and add modern connectivity.

  Despite its temperamental reputation, the Memorymoog is revered for the depth and richness of its sound. When all voices are firing properly, it produces lush pads, searing leads, and thick polyphonic textures that carry the unmistakable Moog DNA. It found its way into the work of artists spanning ambient, electronic, and dance music, including Jean-Michel Jarre, Air, The Crystal Method, and The Orb.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 3 VCOs per voice (18 total), pulse/sawtooth/triangle waveforms
  - LFO: Triangle, pulse, sine, and square waveforms
  - Filter: One 24dB/oct lowpass VCF with dedicated ADSR per voice
  - Keyboard: 61 keys
  - Memory: 100 programmable patches
  - Arpeggiator/Sequencer: Sample & Hold (Plus model adds sequencer)
  - Control: CV/Gate (MIDI on Plus model)
  - Effects: None
  - Produced: 1982–1985
