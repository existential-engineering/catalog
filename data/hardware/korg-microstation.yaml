description: >-
  The Korg MicroStation is a compact 61-key workstation built on the M50 sound
  engine, delivering 120-voice polyphony, 16-part multitimbrality, a 16-track
  MIDI sequencer, and 134 effect types in a portable mini-key format.
details: |-
  Released in 2010, the MicroStation continued Korg's popular micro series by packing workstation
  features into an affordable, compact form factor. Built around the EDS-i sound engine derived
  from the M50, it offered two oscillators per voice with 49MB of wave ROM and 480 factory presets
  expandable to 512.

  The polyphony is generous at 120 voices in single mode and 60 in double mode, with 16-part
  multitimbrality making it capable of handling complex arrangements. The dual multi-mode filters
  per voice with four routing options provide flexible sound shaping. Two LFOs and a selection of
  waveforms including triangle, sine, square, saw, and sample-and-hold cover modulation needs.

  The built-in 16-track MIDI sequencer with a dedicated master track can store up to 210,000 MIDI
  events, while the arpeggiator offers five modes with 640 user patterns. The effects section is
  comprehensive with 134 types spanning delay, reverb, chorus, phaser, flanger, compressor, and
  limiter. The 61-key Natural Touch mini keyboard is velocity-sensitive but lacks aftertouch,
  a tradeoff for its compact size. A software editor compensates for the smaller LCD display.
specs: |-
  - Polyphony: 120 voices (single) / 60 voices (double)
  - Multitimbral: 16 parts
  - Oscillators: 2 per voice
  - Sound engine: EDS-i with 49MB wave ROM
  - Waveforms: Triangle, sine, square, guitar, saw, ExpSawDwn, random S/H
  - Filters: 2 multi-mode per voice, 4 routing types
  - LFOs: 2
  - Presets: 480 (expandable to 512)
  - Sequencer: 16 MIDI tracks + 1 master track, 210,000 MIDI events
  - Arpeggiator: Up/Down/Random/Alt1/Alt2, 640 user patterns
  - Effects: 134 types (delay, reverb, chorus, phaser, flanger, compressor, limiter)
  - Keyboard: 61 mini keys, velocity-sensitive, no aftertouch
