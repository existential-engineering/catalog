details: |-
  The DN301 is the cut-only variant of the DN300 platform: 30 bands of 1/3-octave equalisation configured for subtractive use only, with no boost capability.

  Cut-only operation is the system-tuning discipline preferred by many touring and broadcast engineers, because it forces the equaliser to address problems by removing peaks rather than adding fader gain, preserving headroom and improving overall system signal-to-noise.

  The signal-processing core inherits the full DN-series heritage: the Proportional-Q response curve, the transparent British signal path and the build standards of the touring industry's reference equaliser.

  The DN301 is obsolete but remains in active service in legacy installations worldwide, with service and documentation continuing through Music Tribe Care.
specs: |-
  - Single channel graphic equalisation
  - 30 bands of 1/3-octave equalisation
  - Cut-only (subtractive) operation, no boost
  - Proportional-Q filter response
