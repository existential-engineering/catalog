description: The GS Mini Mahogany is a compact travel acoustic guitar with a
  solid Neo-Tropical Mahogany top and layered Sapele back and sides, delivering
  a warm, focused midrange tone in Taylor's portable GS Mini body.
details: |-
  The GS Mini Mahogany is built around Taylor's GS Mini body shape — a scaled-down acoustic platform balancing portability with genuine playability. The 23-1/2" scale length and compact dimensions make it an ideal travel companion or practice instrument.

  The solid Neo-Tropical Mahogany top pairs with layered Sapele back and sides for a warm, focused midrange character. Layered construction adds structural stability across varying humidity and temperature conditions. Matte finish on body and neck gives a natural, understated look.

  West African Crelicam Ebony fretboard and bridge, Nubone nut, Micarta saddle, and die-cast chrome tuners. Ships with a gig bag.
specs: |-
  - - Body shape: GS Mini
  - Top: Neo-Tropical Mahogany (solid, matte)
  - Back/sides: Sapele (layered, matte)
  - Neck: Mahogany (matte)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Scale length: 23-1/2"
  - Inlays: 4mm dots (Italian Acrylic)
  - Tuners: Die-Cast Chrome
  - Pickguard: Black
  - Strings: D'Addario XS Coated Phosphor Bronze Medium (.013-.056)
  - Case: Gig bag included
