details: |-
  The GS Mini-e Bass brings bass to Taylor's compact GS Mini platform. It features a solid Sitka spruce top paired with layered sapele back and sides, delivering a punchy, warm bass tone with enough snap and projection to cut through when played alongside other instruments.

  Powered by Taylor's ES-B electronics system, the GS Mini-e Bass includes a built-in digital chromatic tuner for on-the-go convenience. The nylon-core acoustic bass strings (D'Addario Coated Phosphor Bronze, .037–.090) are specially formulated for acoustic bass applications and contribute to the instrument's distinctive feel.

  Construction details include a Neo-Tropical Mahogany neck, West African Crelicam Ebony fingerboard and bridge, NuBone nut, and Micarta saddle. The 23-1/2" short scale length makes it comfortable and accessible for players of all sizes.

  The guitar ships with a lightweight gig bag. Matte finish, die-cast chrome tuners, and D'Addario bass strings included.
specs: |-
  - - Body Style: GS Mini
  - Top: Solid Sitka Spruce (matte)
  - Back & Sides: Layered Sapele (matte)
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Nut: NuBone
  - Saddle: Micarta
  - Scale Length: 23-1/2"
  - Nut Width: 1-11/16"
  - Strings: D'Addario Coated Phosphor Bronze Bass (.037-.090)
  - Tuners: Die-Cast Chrome
  - Electronics: ES-B with built-in digital chromatic tuner
  - Finish: Matte
  - Case: Lightweight gig bag included
