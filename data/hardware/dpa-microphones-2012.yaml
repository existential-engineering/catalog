description: The 2012 Compact Cardioid Microphone is an all-around generalist
  pencil mic that guarantees excellent results on any instrument on a live
  stage.
details: |-
  The 2012 Cardioid Microphone is a robust and reliable condenser mic for close miking. It is extremely flexible and will shine on many instruments. In addition to natural sound reproduction, the mic has uniform cardioid directionality and has been designed to withstand rough use on the live stage.

  An all-around generalist pencil mic that guarantees excellent results on any instrument on a live stage. Exceptionally natural and precise sound reproduction.

  Available as a single mic or stereo pair.
specs: |-
  - Directional pattern: Cardioid
  - Principle of operation: Pressure gradient
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range, +/-2 dB, at 30 cm (11.8 in): 40 Hz to 20 kHz
  - Sensitivity, nominal, +/-2 dB at 1 kHz: 8 mV/Pa
  - Equivalent noise level, A-weighted: Typ. 20 dB(A) re 20 microPa (max. 22 dB(A))
  - Distortion, THD < 1%: 148 dB SPL, 151 dB SPL peak
  - Dynamic range: Typ. 131 dB
  - Max. SPL, THD 10%: 156 dB SPL peak
  - Rated output impedance: 60 Ohm
  - Minimum load impedance: 2 kOhm
  - Cable drive capability: 100 m (328 ft)
  - Output balance principle: Impedance balancing with Active Drive
  - Common mode rejection ratio (CMRR): > 60 dB
  - Power supply (for full performance): P48 (Phantom Power)
  - Current consumption: 0.7 mA
  - Connector: XLR-3M. Pin 1: shield, Pin 2: signal + phase, Pin 3: - phase
  - Weight: 83 g (2.9 oz)
  - Microphone diameter: 19 mm (0.75 in)
  - Capsule diameter: 17 mm (0.67 in)
  - Microphone length: 94 mm (3.7 in)
  - Maximum output voltage, RMS: 8.7 V (21 dBu)
  - Polarity: +V at pin 2 for positive sound pressure
  - Temperature range: -40 C to 45 C (-40 F to 113 F)
  - Relative humidity (RH): Up to 90%
  - Colors: Black
