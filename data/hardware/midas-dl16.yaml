description: Digital stage box providing a 16 x 8 signal distribution solution
  for live entertainment production. Features 16 award-winning Midas Pro Series
  microphone preamplifiers with switchable +48V phantom power, 8 balanced
  analogue XLR outputs, dual AES50 ports for connection to a FOH console via a
  single shielded CAT5 cable, integrated ULTRANET output for P16-M personal
  monitor mixers, ADAT optical outputs (supporting up to 16 additional analogue
  outputs via converters), MIDI In/Out, and a front-panel headphones jack. AES50
  provides 48 bidirectional audio channels at 48 kHz with ultra-low
  deterministic latency (1/8 ms per node) and phase-aligned networked clock
  distribution. Up to three units can be daisy-chained for 48 channels in and 24
  out. Occupies two rack spaces.
details: |-
  Award-winning Midas Pro Series microphone preamplifiers with remote control of gain and phantom power. ULTRANET technology for seamless digital integration with P16-M personal monitor mixers. ADAT-ready for expanded outputs via external converters. Dual AES50 ports allow daisy-chaining of up to three units. Onboard monitoring/head amp control section with signal metering at the stage box. Scene automation with MIDI support. Front-panel headphones output for on-stage monitoring.
specs: |-
  - Microphone Preamps: 16 x Midas Pro Series with switchable +48V phantom power
  - Analogue Outputs: 8 balanced XLR
  - AES50 Ports: Dual, 48 bidirectional channels at 48 kHz over shielded CAT5
  - Latency: Ultra-low deterministic, 1/8 ms per node
  - Clock: Phase-aligned networked clock distribution
  - ULTRANET: Integrated output for P16-M personal monitor mixers
  - ADAT: Optical outputs supporting up to 16 additional analogue outputs via converters
  - MIDI: In/Out with scene automation support
  - Daisy-Chain: Up to 3 units for 48 channels in / 24 out
  - Rack Space: 2U
