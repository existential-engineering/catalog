description: The ASAT Classic 'S' adds an S•500 MFD middle pickup and a
  5-position selector to the single-cutaway ASAT Classic. A push/pull tone pot
  enables neck plus bridge or all three pickups together.
details: |-
  The G&L ASAT Classic 'S' is a factory-modded version of Leo's final word on the traditional single-cutaway bolt-on axe. First created in 2004 by the G&L Custom Creations team, the ASAT Classic 'S' later joined the line as a standard model in 2008.

  The basic idea for this kind of arrangement has been long established in the Nashville session player scene, where players often install a Strat middle pickup in the middle position of a Telecaster and swap the 3-position pickup selector with a 5-way unit.

  Back in 2004, the G&L Custom Creations Department decided to build an instrument similar to the formula adopted by the Nashville players but with a distinctly G&L flavor, with ASAT Classic MFD pickups in place of Alnico Tele pickups, and the S•500 MFD in place of the Strat pickup. The CCD team iced the cake with a push/pull tone pot that functions the same way as the S-500's mini-toggle switch, enabling additional pickup combinations of neck plus bridge or all three pickups together for a unique sonic depth that G&L players love.

  The "S" designation comes from both the internal designation for this instrument, due to its use of the S•500 middle pickup, and "Session" in homage to the origin of this guitar configuration.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Construction: bolt-on
  - Scale: 25 1/2"
  - Pickups: Leo Fender-designed G&L MFD single coils
  - Body wood: Swamp Ash on Premier Finishes, Alder on Standard Finishes
  - Neck wood: Hard-Rock Maple with Maple or Rosewood fingerboard
  - Neck profile: G&L Modern Classic with 9 1/2" radius
  - Nut: 100% natural bone
  - Frets: 22 medium jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: 12:1 ratio, sealed-back
  - Bridge: traditional boxed-steel bridge with individual brass saddles
  - Controls: 5-position pickup selector, volume, tone with push/pull pickup expansion enabling neck+bridge or all 3 pickups together
  - Includes: G&L Deluxe Gig Bag
