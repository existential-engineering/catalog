details: |-
  Rising virtuoso Bastian "Baxty" Martinez bases his model on the A2 but tweaks key specs to create a unique instrument suited for the modern player. The upper horns opt for a deeper cutaway, increasing access to the upper frets.

  Notable aesthetics include the select solid colors, clear gloss, and the Baxty truss rod cover, while the construction features an alder or mahogany body, Kiesel trem, and Vantium pickups.

  The neck is tung-oiled roasted maple with a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability, cut to a thinner neck profile, with an ebony fingerboard at a 14 inch radius and 24 stainless steel jumbo frets.

  Electronics are a master volume control with a 3-way pickup selector driving direct-mount passive Kiesel Vantium humbuckers, with a Kiesel/Hipshot tremolo system at .4125 inch (10.5 mm) spacing and premium Kiesel locking tuners.
specs: |-
  - Based on the Kiesel A2 with deeper upper-horn cutaways
  - Available in more than one string count, with two sets of body dimensions, neck widths and weights listed
  - Body: alder (mahogany also offered)
  - Construction: bolt-on with radiused neck heel
  - Neck: tung-oiled roasted maple with 2-way adjustable truss rod and dual carbon-fiber rods, thinner neck profile
  - Fingerboard: ebony with 14 inch radius
  - Frets: 24 stainless steel jumbo, .110 inch wide x .055 inch tall
  - Scale length: 25.5 inch
  - Pickups: direct-mount passive Kiesel Vantium humbuckers
  - Electronics: master volume control, 3-way pickup selector, flush mount output jack and rear access output jack offered
  - Bridge: Kiesel/Hipshot tremolo system, .4125 inch (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: painted 2x4 headstock with gold Kiesel logo
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Truss rod cover: Baxty signature truss rod cover
  - Finish: Primer Gray with clear gloss
  - Hardware: gold
  - Neck width: 1.69 inch or 1.90 inch wide at the nut, 0.78 to 0.82 inch thick at the 1st fret, 0.88 to 0.90 inch thick at the 12th fret
  - Body dimensions: 38.25 inch or 39 inch long, 1.65 inch thick, 12.6 inch wide
  - Weight: 7.15 lbs or 7.3 lbs depending on configuration
  - Strings: Elixir Nanoweb 1046E
