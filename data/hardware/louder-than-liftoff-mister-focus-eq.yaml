description: "Mister Focus - EQ is an equalizer built around three blocks of high end analog processing: EQUALIZR, SHEEN, and FOCUS. Available in two EQUALIZR variants — FET Filter or Rogue-Tec Air — each offering distinct EQ character. The SHEEN stage uses a discrete class AB transformer-coupled output module (Royal Blue) to add British console mojo, with an optional treble presence boost. The single-knob FOCUS EQ provides intuitive tone shaping with pre/post switchability. Assembled in Silicon Valley, California."
details: |-
  EQUALIZR stage available in two variants: FET Filter (midrange boost/cut at selectable frequencies 330, 500, 800, 1600 Hz; high-pass filter at 72, 160, 340 Hz; FET saturation switchable between clean or dirty) or Rogue-Tec Air (Pultec-style passive high-frequency boost at selectable frequencies 3, 5, 8, 12, 16 kHz). Drive control provides -6 to +18 dB input gain. SHEEN stage features discrete class AB transformer-coupled output with optional treble presence boost via jumper. FOCUS EQ is a single-knob stage switchable pre or post. Two analog plugin (Colour) expansion slots. Components include Nichicon HE, Panasonic FR, and Wima polypropylene capacitors, thin-film 0.5% resistors, OPA1602 op-amps, and Alps switches. RoHS compliant.
specs: |-
  - Midrange boost / cut + HPF, with FET saturation - Mid EQ: +/-12 dB at 330, 500, 800, 1600 Hz (selectable via jumpers)
  - High Pass Filter: 6 dB/oct at OFF, 72, 160, 340 Hz (selectable via jumpers)
  - FET saturation: Clean or Dirty (selectable via jumper)
  - Pultec style passive HF boost with 2520 discrete op amp - High shelf boost: 3, 5, 8, 12, 16 kHz (selectable via jumper)
  - Constant output gain
  - Switchable to pre or post EQ
  - Internal jumpers to select corner frequency
  - Nichicon HE and Panasonic FR electrolytic capacitors
  - Wima polypropylene film capacitors
  - Thin film 0.5% resistors
  - Audiophile grade op amps (OPA1602), class A biased
  - Alps pushbutton switches
