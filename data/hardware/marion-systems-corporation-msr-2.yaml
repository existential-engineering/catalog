description: >-
  The Marion MSR-2 is a Tom Oberheim-designed rackmount synthesizer module that
  packs the classic Oberheim sound into a single-rack-space format. It offers
  8-voice polyphony expandable to 16, 16-part multitimbral capability, and a
  sophisticated matrix modulation system with 24 sources and 33 destinations. An
  external audio input allows routing outside signals through its switchable
  12/24 dB filter and envelope sections.
details: |-
  Released in 1994, the MSR-2 was designed by Tom Oberheim himself, giving this compact rack-mount module an unmistakable sonic pedigree. Despite its unassuming single-space appearance, the MSR-2 delivered the warm, fat Oberheim sound that defined an era of synthesizers, updated with modern digital reliability and full MIDI implementation.

  Each voice featured two oscillators routed through a switchable 12/24 dB/octave filter, and the modulation system was remarkably sophisticated for a module of this size. A matrix modulation architecture supported up to 10 simultaneous routings drawn from 24 sources and 33 destinations, providing deep sound design potential that belied the MSR-2's compact form factor.

  The MSR-2 was 16-part multitimbral with 8-voice polyphony expandable to 16 voices, making it a capable multitimbral sound source for MIDI-based production. Five hundred patch memories provided ample storage for programmed sounds. An external audio input allowed routing external signals through the filter and envelope sections, adding creative processing possibilities.

  Described as rare but definitely worth checking out by the synthesizer community, the MSR-2 remains a compelling find on the used market. Its combination of genuine Oberheim design heritage, powerful modulation matrix, and practical rack-mount format makes it a distinctive instrument for those who value the Oberheim character in a studio-friendly package.
specs: |-
  - Polyphony: 8 voices (expandable to 16)
  - Oscillators: 2 per voice
  - Filter: Switchable 12/24 dB/oct
  - Modulation: Matrix with 10 simultaneous routings, 24 sources, 33 destinations
  - LFO: Available as modulation source
  - Effects: None
  - Keyboard: None (rack-mount module)
  - Memory: 500 patches
  - Control: MIDI (16-part multitimbral)
  - External Audio Input: Routes through filter and envelope sections
  - Format: Single-space rackmount
