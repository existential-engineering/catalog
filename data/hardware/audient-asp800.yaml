details: |-
  ASP800 is an audio powerhouse making it the perfect addition to your audio
  interface. ASP800 provides 8 channels of Audient's renowned console mic
  preamps, burr-brown converter technology, two jfet d.I's and two retro
  channels with tone control.

  Just plug in your mics, guitars, keyboards and drum machines and you're ready
  to go.
specs: |-
  - 8 channels of console mic preamps
  - Burr-brown converter technology
  - Two jfet d.I's
  - Two retro channels with tone control
