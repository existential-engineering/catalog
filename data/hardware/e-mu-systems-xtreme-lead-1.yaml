description: >-
  The E-mu Xtreme Lead-1 is a rack-mount sound module derived from the Audity 2000 architecture,
  loaded with dance and electronica sounds and featuring the innovative SuperBEATS mode for live
  groove performance.
details: |-
  The Xtreme Lead-1 delivers E-mu's take on dedicated electronic music production, shipping with
  32 MB of X-Lead ROM containing techno basses, synth leads, pads, dance drumkits, vocal stabs,
  analog synth emulations, and DJ scratches. The Proteus 2000-derived engine provides 64 voices
  of polyphony with 12-pole digital filters and 24-bit dual effects processing.

  The standout feature is SuperBEATS Mode, which lets performers trigger, latch, and unlatch
  synced loops and grooves from separate keyboard keys across 16 independent rhythm tracks. This
  makes the unit particularly practical for live DJs and performing electronic musicians. Sixteen
  simultaneously available programmable arpeggiators further enhance live flexibility.

  Programming uses E-mu's Modular PatchCord architecture for deep sound design, with 512 ROM and
  512 user preset slots. The standard configuration offers two outputs, while the Turbo upgrade
  doubles polyphony to 128 voices, adds four additional outputs (six total), expands to 32 MIDI
  channels, and includes S/PDIF digital output along with two additional ROM expansion slots.

  Notable users include BT and The Crystal Method. The XK-6 Xtreme Keys and XL-7 Command Station
  extend this platform into keyboard and desktop groovebox formats respectively.
specs: |-
  - Polyphony: 64 voices (128 with Turbo upgrade)
  - Sound ROM: 32 MB X-Lead (expandable to 128 MB)
  - Filters: 12-pole digital
  - Effects: 24-bit dual stereo effects processor
  - Arpeggiator: 16 programmable, SuperBEATS Mode
  - Presets: 512 ROM, 512 user
  - Outputs: 2 analog (6 with Turbo), S/PDIF (Turbo only)
  - MIDI: 16 channels (32 with Turbo)
  - Expansion: 1 ROM slot (3 with Turbo)
releaseDate: "2000"
releaseDateYearOnly: true
