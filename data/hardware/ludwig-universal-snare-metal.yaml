description: >-
  Emphasizing optimal response, sensitivity, and dark warm tones, the Universal
  Metal Brass drum delivers a rich, dynamic range suitable for a multitude of
  tuning ranges and head combinations. Modeled after the famous Black Beauty and
  fitted with heavy-duty tube lugs, P88i throw-off, P35 butt plate, and 20
  strand snare wires. Offered in popular sizes (5.5x14, 6.5x14, 7x13, 8x14) and
  two hoop options: 'Black-to-Black' Brass (black nickel-plated shell with
  die-cast hoops for sharper attack and aggressive projection) and Chrome-Plated
  (triple-flange hoops for a more balanced, controlled sound).
specs: |-
  - shell: 1mm all-brass (black nickel-plated)
  - lugs: Heavy-duty tube lugs
  - throwOff: P88i
  - buttPlate: P35
  - snareWires: 20 strand
  - sizes: 5.5x14, 6.5x14, 7x13, 8x14
  - hoopOptions: Black Nickel Die-Cast (Black-to-Black Brass), Chrome Triple Flange (Chrome-Plated)
  - modelNumbers: LU6514, LU6514C
