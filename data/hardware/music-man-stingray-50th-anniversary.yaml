details: |-
  The 50th Anniversary StingRay Special celebrates fifty years of one of the most influential electric basses ever made. Ernie Ball Music Man marks the milestone with two limited-edition finishes — Liquid Gold, hand-numbered and capped at 50 instruments worldwide, and Molten Gold, limited to 300 instruments — each carrying its own unique character.

  Beneath the commemorative finish sits the StingRay Special platform: a poplar body paired with a roasted flame maple neck for a fast, comfortable, and balanced feel. The ebony fretboard features gold dot inlays on the face and glow-in-the-dark side markers, making stage navigation effortless under any lighting.

  Sound comes from a single neodymium humbucking pickup routed through an 18V active 3-band preamp with controls for volume, treble, mid, and bass. The 34-inch scale, 22 high-profile medium-width stainless steel frets, and vintage Music Man top-loaded bridge — stamped with the 50th Anniversary mark — deliver the punchy, articulate StingRay voice players have relied on for five decades.

  Gold hardware throughout and a commemorative 50th Anniversary silkscreen on the back of the headstock complete the visual package. Each instrument ships in a deluxe hardshell case with a certificate of authenticity.
specs: |-
  - Body: Poplar
  - Neck: Roasted Figured Maple
  - Fretboard: Ebony with gold dot inlays and glow-in-the-dark side markers
  - Pickup: Single Humbucking with Neodymium magnets
  - Electronics: 3-band active preamp (18V); volume, treble, mid, bass
  - Scale length: 34" (86.4 cm)
  - Frets: 22 high-profile, medium-width stainless steel
  - Hardware: Gold-plated
  - Bridge: Vintage Music Man top-loaded (50th Anniversary stamped)
  - Finishes: Liquid Gold (limited to 50); Molten Gold (limited to 300)
  - Includes: Deluxe hardshell case and certificate of authenticity
