description: A stereo microphone preamplifier inspired by the 1970s Quad Eight
  Pacifica console, featuring solid-state electronics with custom Cinemag
  transformers, dual front-panel Hi-Z DI inputs, and up to 72dB of gain.
details: |-
  The Pacifica is a stereo microphone preamplifier inspired by the legendary
  1970s Quad Eight Pacifica console. It features solid-state electronics with
  custom Cinemag transformers, delivering what professionals describe as
  combining the depth of a Neve, the midrange of an API, and the high-end of
  a Massenburg.

  Proprietary A-Designs input transformers are custom-wound by Cinemag, and
  output transformers use a custom alloy design matching the original Quad Eight
  specifications. This transformer-coupled design gives the Pacifica its
  characteristic big-iron sound with unbelievable bandwidth.

  Each channel includes independent controls for phase reversal, a -20dB pad,
  and switchable +48V phantom power. Two front-panel Hi-Z instrument direct
  inputs allow the Pacifica to double as a high-quality DI box.

  The Pacifica is handmade in the USA and comes with a 1-year warranty. Its
  1U rack-mount form factor houses dual channels in a chassis measuring
  19" x 1.75" x 10" and weighing 11 lbs.
specs: |-
  - Frequency Response: 9Hz–101kHz with <1% distortion
  - Maximum Gain: 72dB
  - EIN (Equivalent Input Noise): -128dB
  - Input Impedance: 1500 ohm
  - THD: <1%
  - Power: 100/120/230 VAC, 23W
  - Dimensions: 19" x 1.75" x 10" (1U rack-mount)
  - Weight: 11 lbs
  - Input Transformer: Proprietary A-Designs, custom-wound by Cinemag
  - Output Transformer: Custom alloy, matching original Quad Eight specs
  - Per-channel phase reversal switch
  - Per-channel -20dB pad
  - Per-channel switchable +48V phantom power
  - Two front-panel 1/4" Hi-Z instrument direct inputs
  - Handmade in the USA
  - 1-year warranty
