description: The CL-115H is a Classic Series bass cabinet designed to complement
  the wide tonal range and power of Ashdown's valve heads, delivering bold
  classic tone with authority. Rated at 500W RMS at 8 ohms, it is loaded with a
  single high-powered custom Eminence 15-inch speaker and a switchable HF horn
  (Off, High, Low) to tailor top-end definition. Handmade in the UK from birch
  ply, it features dual Speakon/jack connectors, heavy-duty vinyl covering, and
  vintage red grilles.
details: |-
  Handmade in the UK from birch ply. Custom-spec Eminence driver, switchable HF horn (Off, High, Low), dual Speakon/jack connectors, horn control switch, heavy-duty vinyl covering, and vintage red grille.
specs: |-
  - Power handling: 500 watts RMS
  - Speaker configuration: 1 x 15-inch custom Eminence
  - Frequency response: 37Hz - 2kHz
  - Impedance: 8 ohm
  - SPL: 98dB 1W @ 1m
  - Switchable HF horn (Off, High, Low)
  - Dimensions (H x W x D): 760 x 617 x 425 mm
  - Weight: 33 kg
