description: The MRS-1608 is a hard-disk recording workstation with 16 physical tracks plus stereo drum and bass tracks, eight XLR/phone combo inputs, a 15-fader mixer with per-track 3-band EQ, and insert and send effects. It records 16-bit 44.1 kHz audio to an internal hard disk and carries a rhythm section played from 12 velocity-sensitive pads.
specs: |-
  - 16 physical tracks (8 mono, 4 stereo) plus a stereo drum track, a bass track and a dedicated stereo master track
  - 160 virtual takes (10 V-takes per track), 1000 projects, 100 markers and 100 scenes per project
  - 8 tracks recorded simultaneously, 19 played back simultaneously (16 audio plus stereo drum and bass)
  - 16-bit linear uncompressed recording at 44.1 kHz, approximately 3 hours per GB on a mono track
  - Eight XLR/standard phone combo inputs, 1 kilohm balanced and 50 kilohm unbalanced, pin 2 hot
  - Two front-panel high-impedance guitar/bass inputs on standard mono phone jacks, 500 kilohm, which take priority over inputs 1 and 2
  - RCA phono line inputs (L/R) mixed into inputs 7/8, 10 kilohm, rated input level -10 dBm
  - 48V phantom power with on/off switches, documented for the input 3/4 and 5/6 pairs
  - Input level -50 dBm to +4 dBm continuously variable
  - RCA phono master output (L/R), output impedance 1 kilohm, rated output level -10 dBm
  - Master phones output and a separate stereo sub output, each a standard stereo phone jack at 50 mW into a 32-ohm load
  - S/PDIF optical digital output (20-bit)
  - 15 faders with post-fader and pre-fader metering and a monitorable fader value
  - Per-track 3-band EQ, chorus/delay and reverb sends, pan and sub-output send, with stereo linking on tracks 1/2, 3/4, 5/6 and 7/8
  - 9 insert effect algorithms (CLEAN, DIST, ACO/BASS SIM, BASS, MIC, DUAL MIC, LINE, 8x COMP EQ, MASTERING)
  - 320 insert patches and 60 send/return patches, 6 insert modules and 2 send/return modules
  - Track editing: copy, move, erase, exchange, trim, fade in/out, reverse, time stretch, pitch fix, harmony generate, duo harmony
  - Manual and auto punch in/out, bounce, scrub/preview, A-B repeat, capture/swap and phrase looping with a 100-phrase pool
  - Rhythm section with 24 drum and bass voices, 50 drum kits, 36 drum sounds per kit and 13 bass programs
  - 12 velocity-sensitive pads, 48 PPQN resolution, 511 rhythm patterns and 10 rhythm songs per project
  - Pad sampler playing parts of an audio track or an 8-bit or 16-bit AIFF or WAV file imported from CD-ROM
  - Chromatic, guitar, bass, open A/D/E/G and D modal tuner
  - 3.5-inch E-IDE hard disk with a drive bay for the optional CD-02 CD-R/RW drive
  - 24-bit 64-times oversampling A/D, 24-bit 128-times oversampling D/A, 24-bit internal signal processing
  - Frequency response 20 Hz to 20 kHz (+/-1 dB into 10 kilohms), S/N ratio 93 dB, dynamic range 97 dB, THD+N 0.02%
  - 122 x 65 mm custom backlit LCD
  - One expansion board slot for the optional UIB-02 USB interface board, which adds file transfer to and from a computer
  - 490 (W) x 450 (D) x 125 (H) mm, 7.8 kg with CD-R/RW drive installed and 7.3 kg without
  - DC 12V 3A from the supplied AD-0011 AC adaptor, 30 W typical power consumption
  - Optional FS01 foot switch, FP02 expression pedal, UIB-02 USB interface board and CD-02 CD-R/RW drive
