url: https://www.mrblackpedals.com/products/black-ltd-octave-ii
description: An analog octave pedal delivering one octave up, one octave down,
  and the dry signal blended together. A Jack Deville original design produced
  as a Black LTD. limited run.
details: |-
  The Black LTD. Octave II is an octave effect that blends an upper octave, a
  lower octave, and the original dry signal, with a bit of grit for character.
  As Mr. Black puts it: one up, one down, plus the dry, and a little stank,
  three's company.

  It is a Jack Deville original design, hand-built in Portland, Oregon and
  released as part of the Black LTD. limited series. This run was strictly
  limited to 50 pieces.

  The pedal uses a standard stompbox layout with a 1/4-inch instrument input and
  output and 9VDC pedal power. The Black LTD. Octave II was a limited edition and
  sold out, but no notice states the product line itself is permanently
  discontinued.
specs: |-
  - Limited run of 50 pieces
  - Jack Deville original design
  - 9VDC pedal power
