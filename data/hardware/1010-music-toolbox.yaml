description: Toolbox is a touchscreen based sequencer and function generator for
  eurorack. It is designed to drive signal patterns to your other modules to
  create the music you imagine.
details: |-
  Toolbox is a touchscreen-based sequencer and function generator for Eurorack, with both MIDI and Control Voltage connections for interfacing with a wide range of hardware. A 3.5" integrated touchscreen gives immediate access to sequences, parameters, and events, with touch-based scrolling and zooming for fast editing.

  Features:
  - Up to 8 rhythm sequencers (1-128 steps, step size from 1/64 note to 8 bars), available internally and through dedicated gate outputs; can trigger the note sequencers
  - Up to 16 polyphonic note sequencers, each with independent step count/size, note duration, MIDI channel, MIDI port, clock source (internal, external, or rhythm sequencers), and transposition in semitones with optional scale quantization
  - Piano roll editing via the touchscreen interface
  - Sequencer output via a dedicated CV+Gate output and MIDI
  - Up to 8 function generators (LFOs with standard waveforms, bar CV sequencer), free-running or synced to the master beat clock
  - MIDI input serves as a source for recording sequences live or via step entry; MIDI outputs transmit gate and control signals to other devices
  - CV inputs serve as clock sources for gate and note sequencers, and can be used as modulators for sequence step count, step length, transposition, etc.

  Toolbox is 1010music's first Series 2 module, a different hardware platform from the Series 1 line (bitbox, fxbox, synthbox). Firmware updates are distributed by signing up at forum.1010music.com.
specs: |-
  - 26 HP
  - Power: +12V 350mA, -12V 0mA, 5V 0mA
  - Weight: 0.78 lbs
  - Dimensions: 7.75 x 6.25 x 3.25 in (WooCommerce package dimensions; panel depth not separately stated)
  - SKU: 008
  - 28 total 1/8-inch (3.5mm) I/O jacks: MIDI In, Clock In, CV 1 In, CV 2 In, CV Mod In x4, Gate Output x8, CV Output x8, MIDI Output x4
  - MicroSD card slot for firmware/data storage
