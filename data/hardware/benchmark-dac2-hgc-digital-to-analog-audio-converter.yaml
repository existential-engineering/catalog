url: https://benchmarkmedia.com/products/benchmark-dac2-hgc-digital-to-analog-audio-converter
description: The Benchmark DAC2 HGC is a second-generation 2-channel
  digital-to-analog converter with lower noise and distortion than the DAC1,
  featuring 32-bit quad-balanced D/A conversion, UltraLock2 jitter attenuation,
  native DSD support, and a Hybrid Gain Control headphone amplifier stage.
details: |-
  The Benchmark DAC2 HGC is Benchmark's second-generation 2-channel digital-to-analog converter, designed as a significant leap beyond the legendary DAC1. It achieves SNR of 126 dB (A-weighted) and THD+N of -109 dB, performance figures that exceed the measurement limits of some of the best available test equipment at the time of its release. Internal digital processing is 32-bit and includes 3.5 dB of headroom above 0 dBFS, with four balanced 32-bit D/A converters summed per channel to create each balanced analog output.

  All five digital inputs — one USB, two optical (TOSLINK), and two coaxial (RCA) — are fully isolated from interface jitter by Benchmark's UltraLock2 jitter attenuation system. The USB input supports USB Audio 2.0 (up to 192 kHz) and driverless USB Audio 1.1. All inputs accept native PCM or DSD conversion, with DSD transported bit-accurately over DoP 1.1. Coaxial inputs support sample rates from 28 to 210 kHz; optical inputs support up to 96 kHz.

  The DAC2 HGC features the Hybrid Gain Control (HGC) system, which combines active analog gain control, passive low-impedance attenuators, 32-bit digital gain control, and a servo-driven volume control to maintain extremely low noise and distortion at any level setting. Two RCA analog inputs allow the HGC to serve as a stereo line-level preamplifier, and a Home Theater Bypass mode passes analog signals through at a fixed level. Balanced XLR outputs deliver up to +30 dBu clip point with an output impedance as low as 60 ohms (attenuator bypassed).

  The HPA2 headphone amplifier stage provides two independent 1/4-inch TRS outputs with output impedance below 0.11 ohms. The amplifier delivers up to 250 mA per channel and is independently current-limited and thermally protected per channel. THD+N into 30 ohms at +18 dBu (1.26W) measures -106 dB.

  The DAC2 HGC occupies a half-rack-width, 1U form factor (9.5" W × 1.725" H × 9.33" D including connectors) and weighs 3 lb. It operates on 100–240V AC worldwide and draws as little as 0.5W at idle and a maximum of 15W. The unit has been officially discontinued by Benchmark Media Systems.
specs: |-
  - SNR A-Weighted: 126 dB (20–20 kHz, Fs=44.1–96 kHz, 0 dBFS = +24 dBu)
  - SNR Unweighted: 123 dB
  - THD+N at 1 kHz, 0 dBFS: -109 dBFS / 0.00035%
  - THD+N at 1 kHz, -1 dBFS: -110 dBFS / 0.00035%
  - Crosstalk: -137 dB at 20 Hz, -130 dB at 1 kHz, -116 dB at 20 kHz
  - Maximum jitter-induced sideband amplitude: < -144 dB
  - Maximum idle tone amplitude: < -147 dB
  - Jitter attenuation: UltraLock2 on all inputs
  - Digital inputs: 5 (1 USB, 2 optical TOSLINK, 2 coaxial RCA)
  - Analog inputs: 2 (RCA, for home theater bypass / preamp mode)
  - USB sample rates: 44.1, 48, 88.2, 96, 176.4, 192 kHz
  - Coaxial input sample rate range: 28–210 kHz
  - Optical input sample rate range: 28–96 kHz
  - Maximum input word length: 24 bits
  - Native DSD conversion via DoP 1.1 on all inputs
  - Internal processing: 32-bit with 3.5 dB headroom above 0 dBFS
  - D/A architecture: four balanced 32-bit converters summed per channel
  - Balanced XLR outputs: 2, clip point +30 dBu, impedance 60 Ω (attenuator off)
  - Unbalanced RCA outputs: 4, clip point +13.5 dBu, impedance 30 Ω
  - Headphone outputs: 2× 1/4-inch TRS, impedance < 0.11 Ω, max 250 mA per channel
  - Headphone THD+N: -106 dB into 30 Ω at +18 dBu
  - Bi-directional 12V trigger
  - Frequency response at 96 kHz: +0 / -0.04 dB, 20 Hz–20 kHz
  - Group delay at 44.1 kHz: 1.36 ms; at 192 kHz: 0.47 ms
  - Form factor: half-rack width, 1U (9.5" W × 1.725" H × 9.33" D)
  - Weight: 3 lb (unit only)
  - AC power: 100–240V, 50–60 Hz; idle <0.5W, max 15W
  - Fuses: 5×20mm, 0.5A 250V Slo-Blo (2 required)
  - Front panel: 16 LEDs indicating input selection, sample rate, word length, polarity, and mute/dim
