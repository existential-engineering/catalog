description: >-
  The Syrinx is a rare monophonic analog synthesizer produced in the Netherlands by Synton
  between 1983 and 1984. It features two VCOs, three flexible voltage-controlled filters,
  and a distinctive touch-sensitive pad for real-time parameter control. Only a few
  hundred units were produced, placing it in the same category as classic lead synths like
  the Minimoog and ARP Odyssey.
details: |-
  The Synton Syrinx employs seven Curtis chips for its voltage-controlled components, giving it a rich and characterful analog sound. Its two VCOs offer triangle, sawtooth, square, and pulse-width modulation waveforms, complemented by a sub-oscillator, ring modulator, and noise generator. The mixer section allows independent level adjustment for each sound source.

  The filter section is particularly notable, featuring three voltage-controlled filters that can be configured as either a 24 dB/octave lowpass or two bandpass filters. These can be patched in four different series and parallel arrangements, providing unusual flexibility for a monophonic synthesizer. Each filter has its own cutoff, resonance, ADSR envelope, keyboard tracking, and LFO modulation.

  Modulation capabilities include two LFOs, frequency modulation, pulse-width modulation, oscillator sync, and portamento. A distinctive touch-sensitive pad called the Touch 'N Bend Pad enables real-time control of parameters ranging from pitch bending to LFO rate adjustment. The 44-key keyboard uses low-note priority without velocity sensitivity.

  Released in 1983, the Syrinx unfortunately missed the advent of MIDI and patch memory. A rare rack-mount reissue produced in the 1990s addressed this by adding MIDI and external audio inputs. Notable users of the Syrinx include Aphex Twin, Air, Vince Clarke, Depeche Mode, and Electronic Dream Plant.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs (triangle, sawtooth, square, PWM) plus 1 sub-oscillator
  - Ring modulator and noise generator
  - Filters: 3 VCFs (two bandpass, one 24 dB/octave lowpass) with four patchable configurations
  - Envelopes: 2 ADSR (one for VCA, one for VCF)
  - LFOs: 2
  - Keyboard: 44 keys, 3.5-octave range, low-note priority, no velocity
  - Touch 'N Bend Pad for real-time parameter control
  - Control: CV/Gate (Moog-type)
  - No MIDI, sequencer, arpeggiator, or patch memory
  - Produced in black, blue, red, and white color variants
releaseDate: "1983"
