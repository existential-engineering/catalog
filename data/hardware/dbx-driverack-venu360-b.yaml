description: Complete 3-input, 6-output loudspeaker management system with BLU
  link digital audio networking, improved AutoEQ and AFS algorithms, and
  Ethernet control via mobile devices.
details: |-
  The DriveRack VENU360-B is a 3-input, 6-output loudspeaker management processor featuring BLU link digital audio networking via two RJ-45 ports. It provides comprehensive processing between mixer and amplifiers to optimize and protect loudspeakers with improved AutoEQ and AFS algorithms.

  BLU link supports up to 60 devices on a single ring with 100m cable runs on Category 5e or higher cable, with extremely low latency of 0.23 ms at 48 kHz. Ethernet control via Android, iOS, Mac, and Windows allows remote system configuration and monitoring.

  The unit features 24-bit A/D and D/A converters with dbx Type IV Conversion System, 32-bit floating point internal processing, and operates at 48 or 96 kHz sample rates. Up to 1000 ms of alignment delay is available per output channel.

  Note: This product is discontinued.
specs: |-
  - Input Connectors: (3) female XLRs, (1) female XLR RTA mic input
  - Input Impedance: >30 kΩ, balanced line to line
  - Max Input Level: >+28 dBu, balanced, ≤1% THD
  - Output Connectors: (6) male XLR line outputs
  - Output Impedance: 120 Ω, balanced line to line
  - Max Output Level: +22 dBu, balanced, ≤1% THD
  - BLU link Connectors: 2 x RJ-45 Ethernet
  - BLU link Max Nodes: Up to 60 devices
  - BLU link Max Cable Length: 100m/328ft on Category 5e or higher
  - BLU link Latency: 0.23 ms @ 48 kHz, 0.11 ms @ 96 kHz
  - Alignment Delay: Up to 1000 ms per output channel
  - A/D Converter: 24-bit with dbx Type IV Conversion System
  - A/D Dynamic Range: 117 dB A-weighted, 114 dB unweighted
  - D/A Converter: 24-bit
  - D/A Dynamic Range: 116 dB A-weighted, 113 dB unweighted
  - Internal Processing: 32-bit floating point
  - Sample Rates: 48/96 kHz (32-192 kHz with sample rate conversion)
  - System Dynamic Range: 114 dB A-weighted; 110 dB unweighted
  - THD+Noise: 0.0025% typical at +4 dBu, 1 kHz
  - Frequency Response: 20 Hz – 20 kHz, +0 / -0.5 dB
  - Crosstalk: <-97 dB, -105 dB typical 20-20 kHz
  - Latency (Analog): 2.57 ms (48 kHz), 2.28 ms (96 kHz)
  - Latency (AES): 2.31 ms (48 kHz), 2.15 ms (96 kHz)
  - Operating Voltage: 100-240 VAC 50/60 Hz
  - Power Consumption: 18 W
  - Weight: 5.48 lbs (2.49 kg)
  - Dimensions: 1.75" H x 8.0" D x 19" W
