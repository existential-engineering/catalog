description: The MP-220 steps up the count with two dynamic drivers in each
  monitor. In addition to offering cleaner performance at higher levels, it
  allows the monitor to achieve higher efficiency evenly across the entire
  frequency range.
details: |-
  The MP-220 steps up the count with two dynamic drivers in each monitor. In addition to offering cleaner performance at higher levels, it allows the monitor to achieve higher efficiency evenly across the entire frequency range.

  Because you have twice the drivers taking care of the same job, they can resolve details and nuance in the sound much better than a single driver, this also means increased bass which dynamic drivers are particularly good at. Step up to true professional in-ear monitors and elevate your performance with MP-220 Dual Driver IEMs.
specs: |-
  - Ergonomically molded low-profile enclosure offers maximum comfort and bass response
  - Up to 40 dB of sound isolation
  - Dual precision dynamic drivers offer powerful bass response and enhanced clarity
  - Shielded, braided cable designed for extra durability and sonic performance
  - Detachable MMCX connector that swivels for increased comfort and durability
  - Over-ear design keeps the cables behind your head for uninterrupted performance
  - Three types of ear tips included (foam, silicone, double flange) in small, medium and large
  - Hard case included
  - Gold-plated 1/8-inch to 1/4-inch adapter included
  - Frequency Response: 20 Hz - 20 kHz
  - Impedance: 16 Ohms ±15%
  - Transducer Type: Dual Dynamic
  - Sensitivity: 88dB±3dB@1mW at 1KHz
