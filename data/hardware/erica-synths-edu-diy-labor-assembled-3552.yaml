description: Ready-to-use mki x es.edu Labor unit.
details: |-
  Labor Assembled makes it possible to start designing circuits the moment the box is open. It is a ready-to-use mki x es.edu Labor unit with Labor Scope pre-installed, giving a three-channel oscilloscope, a built-in dual power supply, an interfacing section and essential analog building blocks in one self-contained workstation. No soldering is required.

  Developed in collaboration with Dr. Shalom D. Ruben of the University of Colorado, Labor is both an educational tool and a powerful prototyping environment. It suits building filters, oscillators, envelopes and sequencers, or following along with the Erica Synths circuit-design learning kits to learn the fundamentals.

  The built-in dual power supply provides Eurorack-compatible voltages with short-circuit protection, and the modular interfacing section carries 16 slots for pots, jacks and switches. Integrated analog building blocks cover a pulse, triangle and sine oscillator across audio and LFO range, a multi-mode envelope generator with a Cherry pushbutton trigger, and a buffered variable control voltage source.

  An output amplifier with adjustable gain feeds a headphone output and a line-level output for listening, recording or signal analysis. An expansion slot takes further specialized prototyping tools, and a protective lid keeps breadboarded circuits safe between sessions.

  The box holds the fully assembled Labor unit, the fully assembled Labor Scope module, a power supply, jumper cables, pre-built interfacing elements (pots, jacks, switches) and a wide assortment of essential components.
specs: |-
  - Fully assembled, tested, and ready to use, no soldering required
  - Labor Scope pre-installed: three-channel oscilloscope for visualizing signals directly on the device
  - Built-in dual power supply with Eurorack-compatible voltages and short-circuit protection
  - Modular interfacing section with 16 slots for pots, jacks, and switches
  - Pulse / triangle / sine oscillator (audio + LFO range)
  - Multi-mode envelope generator with a Cherry pushbutton trigger
  - Buffered variable control voltage source
  - Output amplifier with adjustable gain
  - Headphone output and line-level output for listening, recording, or signal analysis
  - Expansion slot for adding specialized prototyping tools
  - Protective lid to keep breadboarded circuits safe
