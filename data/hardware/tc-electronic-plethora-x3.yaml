description: TonePrint Pedalboard with up to 127 Boards, 3 Pedal Slots, All Your
  Favorite TC Effects, 75 TonePrint Slots per Effect, 3 MASH Footswitches and
  Tape Deck Looper
details: |-
  PLETHORA X3 is your flexible collection of up to 127 mini boards within your pedalboard – just like the original PLETHORA X5. In comparison, the only hint of a compromise is 3 slots instead of 5, but you may well find that beneficial, as it takes up less precious real estate on your pedalboard! Rest assured that the sound quality and flexibility is every bit as hard rocking as PLETHORA X5.

  On the rear panel, you’ll find low-noise stereo connectivity with tons of headroom, as well as MIDI IN for selecting PLETHORA X3 boards from external control units.

  Load any one of your favorite TC Electronic TonePrint effects in any one of the 3 pedal slots. Then add up to 75 custom, swift-recall TonePrints to each effect and you’re good to go. Once you have buckled up and got your fingers flying, step up and MASH the footswitches for mind-bending expressiveness. Each footswitch acts as an expression controller with customizable mapping. Tailor each effect and MASH-functionality to catch your drift and fit your playing style perfectly!   Effects include: HELIX PHASER, VISCOUS VIBE, TAPE DECK LOOPER, HALL OF FAME 2 REVERB, FLASHBACK 2 DELAY, SUB N UP OCTAVER, BRAINWAVES PITCH SHIFTER, CORONA CHORUS, HYPERGRAVITY COMPRESSOR, MIMIQ DOUBLER, VORTEX FLANGER, PIPELINE TAP TREMOLO, QUINTESSENCE HARMONY, SENTRY NOISE GATE, SHAKER VIBRATO AND ALTER EGO VINTAGE ECHO

  To save even more space on your board, we integrated UniTune for easy access to an ultra-precise and responsive chromatic tuner. We also added the option to engage cab sim at the end of your signal chain if you record direct to an audio interface or gigs without an amp, going direct to a PA system.

  Regardless of whether you prefer your signal to flow from left to right or vice versa, PLETHORA X3 can be set up to fit your logic. It may not be the most mind-blowing feature PLETHORA has under the hood, but it fits perfectly into our guitar philosophy of never standing in the way of your creativity, and it will make a real practical difference if the rest of your pedal board’s signal flows in a certain direction.
