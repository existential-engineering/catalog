description: The SX-5H delivers 5 watts of all-valve warmth with ECC83 and EL84
  tubes, offering rich, vintage tones in a compact format. With digital reverb,
  an effects loop, and a speaker-emulated out for recording, it's the perfect
  blend of classic tube character and modern flexibility, ideal for studio,
  stage, or home sessions.
details: |-
  The SX-5H is a 5-watt all-valve guitar head driven by a JJ ECC83 preamp tube and EL84 power tube, low enough for natural breakup at manageable volumes yet dynamic enough for rich, vintage-inspired tone. A single-channel preamp offers bass, middle, treble and master volume, a genuine Accutronics digital reverb block adds depth, and a stealth switch reduces output with tone compensation. A speaker-emulated recording out replicates a Celestion Alnico speaker, a speaker mute switch enables silent recording, 16 and 8 ohm outputs connect different cabinets, a series effects loop integrates pedals, and an aux input plays along with backing tracks.
specs: |-
  - Output power: 5 Watts (all-valve)
  - Preamp tube: 1 x JJ Electronics ECC83
  - Power tube: 1 x JJ Electronics EL84
  - Channels: single-channel preamp with master volume
  - EQ: Bass, Middle, Treble
  - Reverb: digital Accutronics reverb block
  - Speaker outputs: 16 Ohm and 8 Ohm for external cabinets
  - Aux input for backing tracks / MP3
  - Effects loop: series
  - Recording out: speaker-emulated (Celestion Alnico simulation)
  - Speaker mute switch for silent recording
  - Stealth switch: reduces volume, activates speaker tone compensation
  - Cabinet: plywood, tolex-covered, classic style
  - Height x Width x Depth: 220 x 435 x 240 mm
  - Net weight: 9.2 kg
