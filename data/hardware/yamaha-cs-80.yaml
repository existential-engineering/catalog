description: >-
  Yamaha's flagship polyphonic analog synthesizer from the late 1970s, celebrated for its
  extraordinarily expressive keyboard, lush detuned timbres, and iconic role in the Blade Runner
  soundtrack.
details: |-
  The CS-80 stands as one of the most revered synthesizers ever manufactured, a towering instrument in every sense. Weighing over 200 pounds and commanding a premium price even by 1977 standards, it represented Yamaha's most ambitious statement in analog synthesis. With eight-voice polyphony, patch memory, and a keyboard with both velocity sensitivity and polyphonic aftertouch, it offered a level of expressiveness that few instruments of any era have matched.

  Each voice contains two complete oscillator-and-filter chains that can be layered, giving the CS-80 an inherently rich, doubled character. The oscillators produce sawtooth, square, sine, and noise waveforms with pulse width modulation, feeding into independent highpass and lowpass resonant filters per voice. A ring modulator and ribbon controller add further sonic possibilities. The slight tuning instabilities between voices — often described as natural detuning — give the instrument an organic width and movement that synthesizer designers have been trying to recreate digitally for decades.

  Vangelis made the CS-80 immortal through his score for Blade Runner, where its sweeping brass patches and ethereal pads became inseparable from the film's dystopian atmosphere. But the instrument's reach extends well beyond that single association. Toto used it extensively, as did Paul McCartney, Stevie Wonder, and Kraftwerk. More recently, Daft Punk sought out the increasingly rare instrument for their recordings, helping introduce it to a new generation of listeners.

  The CS-80 was produced for only two years and lacks MIDI, making it difficult to integrate into modern setups. Combined with its enormous weight and the fragility of aging components, functioning units have become extremely scarce and valuable. It remains the benchmark against which expressive polyphonic analog synthesizers are measured.
specs: |-
  - Polyphony: 8 voices, each with two layered sound sources
  - Oscillators: Sawtooth, square, sine, noise with PWM
  - LFO: 5 waveform options
  - Filter: Independent highpass and lowpass resonant filters per voice with ADR envelopes
  - VCA: Mixer for VCF output and sine, ADSR envelope
  - Ring modulator and ribbon controller
  - Keyboard: 61 weighted keys with velocity and polyphonic aftertouch
  - Memory: 4 patches
  - Control: External modulation input, no MIDI
  - Produced: 1977–1979
