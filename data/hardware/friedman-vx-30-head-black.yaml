description: A 30-watt all-tube Vintage Series head built on four EL84s and a
  5AR4 rectifier, with a Brilliant top boost channel and a Normal channel
  carrying a three-position Voice switch. Both channels run in phase so they can
  be blended.
details: |-
  The chime, shimmer and touch-sensitive feel of the great British EL84 amplifiers have inspired generations of guitarists for more than sixty years. The VX-30 Head is built around two independent voices that can be used individually or blended together to create sounds unavailable on the original vintage designs.

  The Brilliant channel delivers the sparkle, clarity and harmonic richness that made British Top Boost amplifiers legendary. Independent Treble, Bass and Volume controls cover everything from pristine cleans to rich, edge-of-breakup tones with articulation and dynamic response.

  The Normal channel features a three-position Voice switch that recreates the three distinct factory voicings offered on the vintage originals: the articulate TREBLE voice for crisp, open cleans, the fuller BASS voice for thicker low-end character and added body, or the classic NORMAL voice for a warm, woody response.

  Unlike the vintage amplifiers that inspired it, the VX-30 Head places both channels in phase, allowing them to be blended, just like jumping the inputs on a classic Plexi. Dialling in as much Brilliant or Normal channel as wanted creates new textures while preserving the voice of each circuit, from crystalline cleans with added warmth to harmonically rich overdrive. For players chasing iconic British tones, the head excels with a treble booster feeding the Normal channel, producing singing sustain, harmonic bloom and dynamic touch response.

  A Cut control shapes the power amp's high-frequency response, while the Master Volume Control lets the cathode-biased EL84 output stage be pushed into its sweet spot at more manageable listening levels, without sacrificing the amp's character.
specs: |-
  - Vintage Series 30 watt all-tube head
  - 4 x EL84 power tubes
  - 3 x ECC83 preamp tubes
  - 5AR4 tube rectifier for sag, touch response and natural soft start, so no standby switch is needed
  - Cathode-biased power section with zero negative feedback
  - Brilliant channel: Volume, Treble, Bass
  - Normal channel: Volume and three-position Voice switch (TREBLE, NORMAL, BASS)
  - Both channels operate in phase and can be blended
  - High and Low sensitivity inputs
  - Cut control for power amp high-frequency shaping
  - Master Volume Control (M.V.C.)
  - Three speaker outputs: one 16 ohm jack, plus a paired pair of jacks for one 8 ohm cabinet or two 16 ohm cabinets
  - Custom made transformers
  - Available in Black or Vintage Ivory cosmetics
  - Matching VX-212 cab with dual Celestion Alnico Blue speakers, sold separately
  - Dimensions: 8.5 in (d) x 24 in (w) x 9.5 in (h)
  - Weight: 37 lbs
  - Handcrafted in Los Angeles, California
  - Limited lifetime warranty
