details: |-
  The Abasi® Stage 7 guitar merges the Córdoba® Stage solidbody nylon-string guitar concept and Stage pickup system with the Larada® ergonomic platform designed with Abasi Concepts. This unique 7-string instrument—tuned B to E—features 24 fanned frets, a compound radius fingerboard, and a satin neck finish for exceptional range, intonation, and playability. Choose from Ziricote, White Burst, and Acacia finishes.
