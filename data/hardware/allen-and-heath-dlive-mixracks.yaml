url: https://www.allen-heath.com/hardware/dlive-series/dlive-mixracks/
description: At the heart of every dLive system is the MixRack, capable of
  128x64 channels of pristine sounding 96kHz audio. All dLive MixRacks feature
  the same mix engine - 128 input channels and 64 mix outputs with a
  configurable 64-bus architecture, class-leading 0.7ms latency and
  phase-aligned signal paths for maximum flexibility in all applications - but
  differ in the number of onboard analogue I/O, redundancy options and digital
  I/O card slots.
details: |-
  Family of seven rackmount dLive mixing engines, split between flagship S Class (DM64, DM48, DM32, DM0) and compact C Class (CDM64, CDM48, CDM32) lines. All share the same 96kHz XCVI mix engine and differ only in onboard analogue I/O, redundancy and digital I/O card slots.

  S Class MixRacks: DM64 (64 mic/line in, 32 line out), DM48 (48 mic/line in, 24 line out), DM32 (32 mic/line in, 16 line out), DM0 (no onboard analogue I/O - for fully networked systems). All S Class models offer 3 I/O Ports, redundant Surface Link, redundant DX Links, and an optional hot-swappable dual-redundant PSU.

  C Class MixRacks: CDM64 (64 mic/line in, 32 line out), CDM48 (48 mic/line in, 24 line out), CDM32 (32 mic/line in, 16 line out). All C Class models have 1 I/O Port and an integrated (non-redundant) PSU.

  Acclaimed preamp design optimised for transparency and clarity, paired with a unique Active PAD circuit for consistent performance regardless of source level. 96kHz signal path uses variable bit depth throughout with a 96-bit accumulator for virtually infinite dynamic range.

  I/O expansion: every MixRack ships with 2 DX ports (each carrying 32x32 channels). S Class adds up to 28 DX I/O expanders via DX Hub modules or DX Link cards; C Class supports up to 12. Plug-and-play 96kHz expanders with ultra-low 8-sample transport latency.

  Surface options: S Class connects up to 4 dLive Surfaces (1 via integrated gigaACE socket, 3 via optional gigaACE cards); C Class supports up to 2 Surfaces (1 integrated, 1 via optional card). Surfaceless operation is also supported via the free dLive Director software (Mac/PC), the dLive MixPad iPad app, or small-format IP Controllers.

  MixRacks are the engine of a dLive system and require a separate dLive Surface or remote control software (not included) to form a complete mixing system.
specs: |-
  - Models: DM64, DM48, DM32, DM0 (S Class); CDM64, CDM48, CDM32 (C Class)
  - XCVI 160x64 FPGA core, 96kHz sample rate
  - Variable bit-depth for ultimate precision and noise performance
  - Virtually infinite mix headroom thanks to 96-bit accumulator
  - Class-leading, ultra-low latency of 0.7ms
  - 128 input channels with full processing
  - 64 mix outputs with full processing
  - Configurable 64-bus architecture (group, FX, aux, matrix, mains)
  - LR, LCR and up to 5.1 mains mode; multiple PFLs
  - 8 RackUltra FX with dedicated stereo sends, returns and pre/post processing
  - 16 RackExtra FX with dedicated stereo returns
  - 24 DCAs
  - AMM (Automatic Mic Mixer) up to 64 channels across 1, 2 or 4 zones
  - Built-in signal generator and RTA
  - New preamp design for extra transparency
  - Unique Active PAD circuit for consistent performance with any source
  - Reversible rack ears design; flush front panel with ultra-quiet fan
  - DM64: 64 mic/line inputs, 32 line outputs, 3 I/O Ports, redundant Surface Link, redundant DX Links, optional redundant PSU
  - DM48: 48 mic/line inputs, 24 line outputs, 3 I/O Ports, redundant Surface Link, redundant DX Links, optional redundant PSU
  - DM32: 32 mic/line inputs, 16 line outputs, 3 I/O Ports, redundant Surface Link, redundant DX Links, optional redundant PSU
  - DM0: 0 mic/line inputs, 0 line outputs, 3 I/O Ports, redundant Surface Link, redundant DX Links, redundant PSU
  - CDM64: 64 mic/line inputs, 32 line outputs, 1 I/O Port, integrated PSU
  - CDM48: 48 mic/line inputs, 24 line outputs, 1 I/O Port, integrated PSU
  - CDM32: 32 mic/line inputs, 16 line outputs, 1 I/O Port, integrated PSU
  - S Class: up to 28 DX I/O expanders via DX Hub modules or DX Link cards
  - S Class: up to 4 dLive Surfaces (1 integrated gigaACE socket + 3 via optional gigaACE cards)
  - C Class: up to 12 DX I/O expanders via DX Hub modules or DX Link cards
  - C Class: up to 2 dLive Surfaces (1 integrated + 1 via optional gigaACE card)
  - S Class: hot-swappable PSU (dual-redundant option)
  - C Class: integrated PSU
  - S Class: 3 Year Warranty
