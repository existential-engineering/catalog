description: A two-way passive floorstanding loudspeaker delivering breathtaking
  performance with deep emotional impact, incorporating technologies from
  Amphion's flagship studio monitors and featuring 5th generation waveguide
  technology.
details: |-
  The Argon7LS is a two-way passive radiator floorstanding loudspeaker that brings studio monitor technology into the home listening environment. It uses a 1-inch titanium tweeter paired with two 6½-inch aluminum woofers, crossed over at 1600 Hz for seamless driver integration.

  Amphion's proprietary 5th generation U/D/D (Uniformly Directive Diffusion) waveguide technology time-aligns the voice coils of the tweeter and woofers, ensuring accurate phase relationships and exceptional midrange clarity across a wide listening area.

  The low 1600 Hz crossover point keeps the upper midrange — where the human voice lives — entirely within the woofer's range, reducing handoff artifacts. This, combined with the waveguide, results in a coherent, natural midrange.

  At 91 dB sensitivity with a 4 Ω nominal impedance, the Argon7LS is designed to work with amplifiers rated between 50 and 150 watts. Its passive radiator loading extends bass response down to 28 Hz (−6 dB).

  Each Argon7LS is handmade in Finland and is available in four finishes: Walnut, Standard White, Full Black, and Full White.
specs: |-
  - Operating Principle: Two-way, passive radiator
  - Tweeter: 1" titanium
  - Woofers: 2×6½" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 4 Ω
  - Sensitivity: 91 dB
  - Frequency Response: 28–25,000 Hz (-6dB)
  - Recommended Amplifier Power: 50–150 W
  - Dimensions (H×W×D): 1158×234×344 mm
  - Weight: 27 kg (59.5 lbs)
  - Manufacturing: Handmade in Finland
