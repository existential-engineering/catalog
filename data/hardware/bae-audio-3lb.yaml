  overbuilt power supply designed to support third-party modules alongside BAE
  units.
details: |-
  The 3LB incorporates 3 slots for 500 series modules or the 1073D in a 3 space chassis.

  Built with the same hand-wired construction that BAE is known for, the 3LB features a solid steel chassis with an overbuilt power supply designed to support third-party modules. Inputs and outputs are accessible from either side of the chassis.
specs: |-
  - Slots: 3 (500 Series modules or 1073D)
  - Power Requirements: 115/230 VAC, 36W
  - Power Output: ±16 VDC @ 1.6A (0.8A per rail); 48 VDC @ 0.1A
  - Weight (Empty): 6 lbs / 2.72 kg
  - Dimensions: 11"D × 10"W × 5.5"H
