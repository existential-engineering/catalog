description: Compact 20W all-valve guitar amplifier head that brings the
  formidable tone of the 1959SLP plexi down to home and studio levels. A power
  reduction switch drops the output from 20W to 5W, and the classic four-input
  layout lets you select the high-treble or normal channel or blend them
  together with a patch cable. EQ and presence controls span warm saturated
  blues through aggressive biting leads. Hand-built at Marshall's factory in
  Bletchley, England as part of the Studio Vintage range.
details: |-
  - All-valve construction
  - 20W output with switchable power reduction to 5W
  - Two channels (High Treble and Normal), bridgeable via patch cable
  - Four instrument inputs (high and low sensitivity per channel)
  - Series effects loop, switchable
  - DI output for direct recording
  - Multiple speaker outputs for 16Ω, 8Ω, and 4Ω loads
  - Hand-built in the UK at Marshall's Bletchley factory
specs: |-
  - Model: SV20H
  - Range: Studio
  - Output Wattage: 20W (with power reduction option to 5W)
  - Channels: 2, bridgeable
  - Technology: Valve
  - Preamp Valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power Amp Valves: 2 x EL34
  - Controls: Normal/Loudness II, High Treble/Loudness I, Treble, Middle, Bass, Presence
  - Effects: None
  - Effects Loop: Yes, 1 x series switchable
  - Inputs: 4 x 1/4" jack instrument inputs (high/low sensitivity)
  - Outputs: Speaker outputs: 5 x 1/4" jack sockets (16Ω load / 8Ω load / 4Ω load), DI (1/4" jack)
  - Product Height: 240 mm / 9.4"
  - Product Width: 500 mm / 19.7"
  - Product Depth: 230 mm / 9.1"
  - Weight: 9.25 kg / 20.4 lb
  - Country Of Origin: Designed and engineered in UK. Made in UK.
  - Box Contents: Detachable power cable included; speaker cable included
