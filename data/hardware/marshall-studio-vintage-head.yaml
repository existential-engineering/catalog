description: Compact 20W all-valve guitar amplifier head that brings the formidable tone of the 1959SLP plexi down to home and studio levels. A power reduction switch drops the output from 20W to 5W, and the classic four-input layout lets you select the high-treble or normal channel or blend them together with a patch cable. EQ and presence controls span warm saturated blues through aggressive biting leads. Hand-built at Marshall's factory in Bletchley, England as part of the Studio Vintage range.
details: |-
  Marshall has reworked the timeless elegance of the plexi era for the modern guitarist. Inspired by the beloved 1959, you can now get that same vintage sound at only 20W, and it is significantly smaller and lighter than its 100W counterpart, making travelling and touring a breeze.

  Select the ideal power setting for your surroundings. Toggle effortlessly between 20W and 5W power output with a simple switch, making it convenient to transition between the rehearsal studio and the living room as needed.

  The Studio Vintage lets you harness the formidable tone of the 1959SLP at home or in the studio. Choose between the brightness of the high treble channel, the roundness of the normal channel, or blend between the two with a patch cable. Add in the EQ and presence controls and you can take your sound from warm blues to aggressive, biting leads.

  This instantly recognisable tone is driven by two ECC83 preamp valves and two EL34 power amp valves, with a switchable series effects loop for incorporating outboard effects.

  Recreating the 100-watt tone in a 20-watt format posed a considerable challenge. Crafted with precision at the Bletchley, England factory, the Studio Vintage carries the quintessential Marshall spirit of the 60s into today. Designed and engineered in UK. Made in UK.
specs: |-
  - Model: SV20H
  - Range: Studio
  - Technology: valve
  - Channels: 2, bridgeable
  - Output wattage: 20W with power reduction option to 5W
  - Inputs: 4 x 1/4" jack instrument inputs (high/low sensitivity)
  - Outputs: speaker outputs 5 x 1/4" jack sockets (16 ohm load / 8 ohm load / 4 ohm load), DI (1/4" jack)
  - Controls: Normal/Loudness II, High Treble/Loudness I, Treble, Middle, Bass, Presence
  - Effects: none
  - Effects loop: yes, 1 x series switchable
  - Preamp valves: 2 x ECC83, 1 x ECC83 (phase splitter)
  - Power amp valves: 2 x EL34
  - Weight: 9.25 kg / 20.4 lb
  - Width: 500 mm / 19.7"
  - Height: 240 mm / 9.4"
  - Depth: 230 mm / 9.1"
  - Colour: Black
  - Country of origin: designed and engineered in UK, made in UK
  - Box contents: detachable power cable included, speaker cable included
