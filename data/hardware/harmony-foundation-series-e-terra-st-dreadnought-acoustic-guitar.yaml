details: |-
  The Harmony Foundation Series is one for the discerning musician, an inseparable companion to weave tales out of every path of the journey. The Terra ST Dreadnought stars a solid spruce top, bringing several acoustic benefits to the table: rich and articulate tones, increased dynamic response, and a tone that will only get better over the years. The guitar's okoume neck is notably light, and ensures optimal clarity and resonance. Solid spruce X-bracing helps to project sound with remarkable depth, ensuring each note resonates just as well at home as on stage. Rounded fret ends add to the guitar's refinement and playing comfort. The Terra ST Dreadnought is pre-strung with D'Addario EXP16 coated strings, which offer lasting brightness over many sessions of play. Equipped with a custom Harmony under-saddle pickup, it seamlessly transforms the instrument's rich acoustic tones into plug-and-play capabilities, making it ideal for live performances and amplified sessions. Crafted to be the perfect guitars to inspire your art and take anywhere, the Harmony Foundation Series acoustic models are designed to refine your musical craft and deepen your expression.
specs: |-
