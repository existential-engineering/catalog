details: |-
  Sonata4 is part of the Grado Timbre Series, representing a refined balance of resolution, control, and musicality. Developed through decades of cartridge design, it delivers a highly engaging presentation while maintaining the tonal integrity that defines Grado cartridges.

  Built on Grado's moving iron design, Sonata4 provides a stable and responsive signal with low moving mass and long-term consistency.

  Offered in both stereo and mono configurations, Sonata4 continues the evolution of Grado's wood body cartridges.
