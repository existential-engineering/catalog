description: >-
  The Korg PS-3100 is a fully polyphonic analog synthesizer from 1977 featuring
  48 dedicated synthesizer circuits, one for each key on its keyboard. With its
  rich single-VCO-per-voice architecture, three-band resonator, extensive
  patchbay, and built-in ensemble effect, it delivers a warm, lush sound that
  has made it a highly sought-after rarity with only 600 units produced.
details: |-
  The PS-3100 was Korg's ambitious approach to full polyphony in the late 1970s, dedicating a complete VCO, VCF, VCA, and envelope generator to each of its 48 keys. Rather than using voice allocation or paraphonic tricks, every key has its own independent synthesizer circuit, allowing truly polyphonic performance with no voice stealing.

  The oscillators use a divide-down architecture derived from 12 master VCOs, offering triangle, sawtooth, and square waveforms with pulse width modulation. The low-pass filter is notably warmer than Korg's later MS-series synths, contributing to the instrument's characteristically lush and full sound. A three-band resonator section containing three bandpass filters can create vocal formants and phase-like effects, adding further tonal variety.

  Two LFOs provide modulation capabilities, with the first LFO reaching speeds up to 1 kHz and offering multiple waveforms capable of everything from subtle vibrato to aggressive amplitude modulation and ring modulation effects. The PS-3100 includes two envelope generators: one that affects the VCA and LPF polyphonically, and a General Envelope Generator that functions as both a paraphonic envelope and a modulation source.

  The extensive patchbay on the front panel opens up semi-modular routing possibilities, while the built-in Ensemble effect excels at creating rich, 70s-style string patches. With only 600 units manufactured, the PS-3100 remains one of the rarest and most desirable vintage polyphonic synthesizers ever produced.
specs: |-
  - 48-voice polyphony (one voice per key)
  - 12 VCOs using divide-down architecture
  - Waveforms: triangle, sawtooth, square with PWM
  - 3 resonant VCFs (bandpass resonator section)
  - Low-pass filter per voice
  - 3 envelope generators (without release stage)
  - 2 LFOs (LFO1 up to 1 kHz with multiple waveforms)
  - 48-key keyboard
  - 3-band resonator/EQ
  - Built-in Ensemble effect
  - Semi-modular patchbay
  - CV/Gate connectivity
  - No patch memory
  - Weight: 30 kg
  - Only 600 units produced
