description: The ME+ is a mono version of Grado's Prestige wood body cartridge,
  mounted with an upgraded generating system and an elliptical diamond for
  quieter, more musical playback of mono records. It uses modified four-piece
  OTL cantilever technology, oxygen-free coil wire, and a high-polished
  elliptical diamond mounted in a brass bushing.
details: |-
  There are many analog lovers with record collections that include mono albums. At Grado we strive to have products that will fit all the needs of the analog enthusiast. So now, Grado offers two new cartridge models in a mono version. The MC+ and the ME+ are mounted with an elliptical diamond. The ME+ uses one of Grado's upgraded generating systems. All wooden body cartridges are available in mono version. This will make your records quieter and enhance the musical pleasure of these recordings.

  The Prestige model ME+ uses a modified four piece OTL cantilever technology, oxygen free wire in the coils and a specially designed, high polished, elliptical diamond mounted in a brass bushing.
specs: |-
