details: |-
  Product Overview

  The Heil RC 35 is a professional dynamic wireless replacement microphone capsule engineered to bring the warm, full-bodied, condenser-quality audio performance of the flagship Heil PR 35 to wireless handheld transmitters. Designed for lead vocalists, broadcast professionals, and demanding live sound applications, the RC 35 delivers exceptional vocal detail and smooth response without the feedback issues or fragility associated with studio condenser capsules on stage.

  Built around a large 1.5-inch low-mass dynamic element, the RC 35 provides a wide 40 Hz to 18 kHz frequency response and handles extreme sound pressure levels up to 140 dB Max SPL. Its tight supercardioid polar pattern yields an outstanding -35 dB of rear noise rejection at 180° off-axis , isolating vocals from loud stage monitors, drum spill, and ambient room noise. The RC 35 features industry-standard 31.3 mm / 1.0 thread pitch mountings, making it compatible with major professional wireless handheld transmitters (including Shure, Lectrosonics, Line 6, Audio Technica and Sony systems with removable capsules) for an instant upgrade in wireless vocal clarity.
specs: |-
  - PR 35 Studio Quality for Wireless: Translates the warm, natural frequency response and dynamic range of the wired PR 35 microphone into a wireless capsule format.
  - Large 1.5" Dynamic Diaphragm: Massive element structure delivers extended frequency response (40 Hz – 18 kHz) with rich low-end presence and articulate upper-midrange clarity.
  - Universal Wireless Transmitter Compatibility: Fits industry-standard wireless handheld transmitters featuring 31.3 mm diameter / 1.0 thread pitch mounts (compatible with select Shure, Lectrosonics, Line 6, and Sony transmitters).
  - High Rear Noise Rejection (-35 dB): Supercardioid polar pattern isolates vocals and rejects unwanted off-axis noise from stage monitors and surrounding instruments at 180°.
  - High SPL Capability (140 dB Max SPL): Effortlessly handles powerful vocalists and loud stage environments without distorting or overloading the capsule.
  - Internal Element Isolation: Built-in shock mounting reduces handling noise and mechanical vibration transmitted through the handheld wireless body.
  - Durable Grille Protection: Heavy-duty mesh screen protects the dynamic element from physical impact and breath plosives during live stage performances.
  - Element Type: Dynamic.
  - Frequency Response: 40 Hz – 18 kHz.
  - Polar Pattern: Supercardioid.
  - Rear Rejection (@ 180° off-axis): -35 dB.
  - Impedance: 370 ohms balanced.
  - Max SPL: 140 dB.
  - Threading / Interface: industry-standard 31.3 mm diameter / 1.0 thread pitch wireless mount.
  - Weight: 5.3 oz (150.2 g).
  - Passive dynamic element, requires no battery or phantom power from the transmitter.
  - Fixed full-range response; the low-cut filter switch is on the wired PR 35 body only.
  - Sennheiser handheld transmitters require a third-party thread adapter.
