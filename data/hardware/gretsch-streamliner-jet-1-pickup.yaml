details: |-
  The Streamliner Jet 1 Pickup is a no-nonsense tone machine loaded with exciting new features to deliver exceptional performance, easy playability and rock-solid tuning stability at an incredible value.

  A single HotWire high-output ceramic humbucker (zebra) handles tone duties with master volume and master tone controls. The mahogany body features a carved top and comfort contours, while the Fast 'C' mahogany neck and Pitch-Perfect head angle ensure comfortable playability and stable tuning. An adjustable wrap-around bridge keeps setup simple.
