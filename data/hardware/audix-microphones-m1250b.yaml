details: |-
  The M1250B is a miniaturized cardioid condenser microphone with a fully integrated preamp, detachable cable, and has RF immunity to prevent interference from cell phone and GSM devices. The M1250B is also available with hypercardioid, omni, or shotgun capsules, giving the microphone the unique ability to be used in a wide variety of stage, studio, and broadcast applications.

  The M1250B condenser microphone is available with a wide array of clips and accessories allowing the microphone to be used for acoustic instruments, choral miking, overhead stage miking, podiums, conferences, and presentations.

  Designed, machined, assembled, and tested by AUDIX in the USA.
specs: |-
