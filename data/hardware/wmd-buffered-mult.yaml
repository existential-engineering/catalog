description: Buffered Mult is a three channel buffered multiple for Eurorack
  with dual color LEDs indicating positive or negative voltage. Each channel is
  normalled to the next, providing nine outputs from one input.
details: |-
  - BUFFERED MULT IS NOW SHIPPING IN BLACK -

  Clear and simple, the way a mult should be. Three channel buffered multiple. Each channel has a dual color LED indicating Green for a positive voltage, and Red for a negative voltage. Each channel is normaled to the next channel for a total of nine outputs from one input.
specs: |-
  - 3 Channels
  - Dual Color LED for +/- voltage
  - Each channel normalled to the next for a total of nine outputs
  - Power: +12V = 30mA; -12V = 30mA
  - Size: 4HP
  - Depth : 25mm
  - We will take care of you.
