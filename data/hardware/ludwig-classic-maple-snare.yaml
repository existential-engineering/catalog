description: >-
  Ludwig's wood snares have remained popular throughout the company's nearly
  100-year history, and were the drums that helped establish the fat backbeat
  and deep grooves of pop and R&B music in the 1970's and 80's. The Classic
  Maple all-maple shell features the clarity and warmth players have come to
  expect from maple drums, plus the projection and musicality that has
  maintained Ludwig's reputation for snare drum innovation and excellence.
details: |-
  Available in a wide selection of sounds, sizes and styles, from piccolo, standard and deep models. From lacquer, exotic and wrapped finishes, Ludwig Classic Maple snares are the new Classics of today.
specs: |-
  - 7-Ply Maple Shell
  - 45 Degree Bearing Edge
  - P85AC Throw Off and Butt Plate
  - 2.3 MM Steel Hoops
  - Ludwig Weather Master Coated Batter Head
  - Ludwig Weather Master Clear Resonant Head
  - Available sizes: 5x14", 6.5x14", 8x14"
  - LS401 — 5x14" standard depth
  - LS403 — 6.5x14" standard depth
  - LS484 — 8x14" deep model
  - Finish categories: lacquer, exotic, and wrapped
