description: The AG 700 is a 700-watt Class D bass amp head designed for
  bassists seeking a pristine, hi-fi sound that is both articulate and
  responsive. It features a comprehensive 4-band EQ with Deep and Bright
  broadband boosts and delivers transparent tone that allows the natural voice
  of your bass to shine clearly.
details: |-
  The AG 700 is designed for bassists seeking a pristine, hi-fi sound that is both
  articulate and responsive. Unlike the Tone Hammer series' tube-like warmth, this
  amp offers a transparent tone that allows the natural voice of your bass to shine
  clearly through the full signal chain.

  The AG Series emphasizes clarity, dynamic range, and fast transient response with
  high, clean headroom for transparent audio reproduction. The solid state preamp
  paired with a Class D power section delivers 700 watts into 2.67 or 4 ohm loads,
  and 350 watts into 8 ohms, supporting flexible cabinet pairing down to 2.67 ohms.

  Tone shaping is handled by a 4-band EQ — Bass (±17 dB @ 40 Hz), Low Mid (±15 dB
  @ 300 Hz), High Mid (±14 dB @ 800 Hz), and Treble (±14 dB @ 4 kHz) — plus two
  broadband boosts: Deep (+6 dB below 250 Hz) and Bright (+6 dB above 3 kHz
  shelving). A -10 dB input pad accommodates high-output instruments.

  The rear panel provides dual XLR balanced outputs with pre/post EQ selection, an
  aux input, headphone output, tuner output, and a series effects loop with +6 dB
  of gain. A ground lift switch is included on the XLR outputs.

  The AG 700 integrates with Aguilar Cabinet Suite software and features universal
  mains voltage compatibility for worldwide use. Two thermal-controlled whisper fans
  manage heat quietly. At 5.67 lbs and measuring 12.5" × 9" × 3", it is a
  lightweight and compact 1U-sized head.
specs: |-
  - Power: 700W @ 2.67/4 ohms; 350W @ 8 ohms
  - Preamp: Solid State
  - Power Section: Class D
  - 4-Band EQ: Bass ±17 dB @ 40 Hz, Low Mid ±15 dB @ 300 Hz,
    High Mid ±14 dB @ 800 Hz, Treble ±14 dB @ 4 kHz
  - Deep broadband boost: +6 dB below 250 Hz
  - Bright broadband boost: +6 dB above 3 kHz (shelving)
  - Input pad: -10 dB
  - Series effects loop gain: +6 dB
  - Dual XLR balanced outputs (pre/post EQ selectable) with ground lift
  - Universal mains voltage
  - Two thermal-controlled whisper fans
  - Dimensions: 12.5" W × 9" D × 3" H
  - Weight: 5.67 lbs (2.57 kg)
  - Aguilar Cabinet Suite software included
