description: A Lowden 35 Series acoustic guitar with East Indian Rosewood back
  and sides, offering rich, deep bass with remarkable projection and sustain.
details: |-
  East Indian Rosewood is perhaps the most popular and commonly requested tonewoods - and for good reason. Offering a rich, deep bass response with remarkable projection and sustain, this select, AAAA grade rosewood offers a wide array of tonal versatility when paired with any of the Spruce tonewoods. George's recommended pairing; East Indian Rosewood and Sinker Redwood.

  The 35 Series is built from AAAA-grade and above tonewoods, with the buyer choosing both a top wood and one of Lowden's four body shapes: O (Orchestra), F, S, and WL. The East Indian Rosewood back and sides can be paired with Red Cedar, Sitka Spruce, Alpine Spruce, or Sinker Redwood soundboards.

  Every 35 Series guitar is hand built in Ireland and finished with premium appointments, including figured maple or Tasmanian blackwood bindings, handcrafted abalone rosettes, and Lowden-branded Gotoh 510 machine heads.

  Orders include a hardshell case, a Limited Lifetime Warranty, and free worldwide shipping.
specs: |-
  - Series: 35 Series
  - Back and sides: East Indian Rosewood
  - Soundboard options: Red Cedar, Sitka Spruce, Alpine Spruce, Sinker Redwood
  - Body shapes: O (Orchestra), F, S, WL
  - Tuners: Lowden-branded Gotoh 510 machine heads
  - Bindings: figured maple or Tasmanian blackwood
  - Rosette: handcrafted abalone
  - Tonewood grade: AAAA and above
  - Case: hardshell case included
  - Warranty: Limited Lifetime Warranty
  - Country of origin: Ireland
