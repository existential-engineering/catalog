details: |-
  Do you have aspirations to smoothly fade between two signals? Then I have fantastic news for you, my friend. The Herzlich Crossfade lets you do exactly that, and exactly nothing else, using well-designed active circuitry and a smooth and performance friendly sliding potentiometer. Whatever your aspirations are, this crossfader lets you live out your crossfading dreams in the simplest possible way, with not a fraction of an inch wasted on unnecessary features. Only delightful build quality and pleasantly smooth crossfading lies ahead for you.
