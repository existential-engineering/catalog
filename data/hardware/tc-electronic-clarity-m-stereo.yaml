description: Stereo audio loudness and level meter with a 7-inch high-resolution
  display for precise monitoring in broadcast and studio applications.
details: |-
  The CLARITY M STEREO provides a comprehensive set of precision tools essential to the success of any audio producer. Ideally suited to stereo mixing, mastering and post-production, CLARITY M STEREO’s 7" high-resolution LCD display provides a wealth of monitoring information at-a-glance via a single screen. Metering options include; the legendary LM6 Loudness Radar Meter; a state-of-the-art true peak meter; downmix compliance; stereo correlation; and a RTA (Real Time Analyzer). Source inputs come in a vast array of options including: USB for hassle-free VST *, Audio Units * and AAX * plug-in metering; Stereo 96 kHz AES3 digital audio on 75 Ohm BNC connectors or S/PDIF via the supplied RCA adapter for broadcast-grade metering; and stereo optical for maximum flexibility. CLARITY M STEREO is fully compliant with all major broadcast standards including ITU BS.1770-4, ATSC A/85, EBU R128, TR-B32 and OP-59, and is recommended for all studio environments.

  Audio Toolbox

  CLARITY M STEREO provides a veritable toolbox of meter types to help you make the right mix and mastering decisions for truly professional recordings.

