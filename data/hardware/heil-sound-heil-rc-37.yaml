details: |-
  Product Overview

  The Heil RC 37 is a premium dynamic wireless replacement capsule engineered to bring the next-generation performance of the Heil PR 37 handheld vocal microphone to wireless handheld transmitters. Designed specifically to cut through dense, high-volume live instrument mixes, the RC 37 delivers exceptional upper-midrange clarity, fast transient response, and pristine vocal articulation for lead vocalists and broadcast professionals.

  Featuring a large dynamic element, the RC 37 provides a wide 40 Hz to 18 kHz frequency response and handles extreme sound pressure levels up to 140 dB Max SPL without distortion. Its tight supercardioid polar pattern yields an industry-leading -40 dB of rear noise rejection at 180° off-axis , providing maximum gain-before-feedback and isolating vocals from stage monitor bleed and drum spill. Built with industry-standard 31.3 mm / 1.0 thread pitch mountings, the RC 37 seamlessly replaces factory capsules on major wireless handheld transmitters (including compatible Shure, Lectrosonics, Line 6, Audio Technica, and Sony systems) for an immediate upgrade in live vocal presence and clarity. It is is compatible with some Sennheiser systems with the proper adapter (see ambient.de for adapters and compatible systems).

