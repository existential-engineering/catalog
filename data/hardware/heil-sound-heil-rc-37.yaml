details: |-
  Product Overview

  The Heil RC 37 is a premium dynamic wireless replacement capsule engineered to bring the next-generation performance of the Heil PR 37 handheld vocal microphone to wireless handheld transmitters. Designed specifically to cut through dense, high-volume live instrument mixes, the RC 37 delivers exceptional upper-midrange clarity, fast transient response, and pristine vocal articulation for lead vocalists and broadcast professionals.

  Featuring a large dynamic element, the RC 37 provides a wide 40 Hz to 18 kHz frequency response and handles extreme sound pressure levels up to 140 dB Max SPL without distortion. Its tight supercardioid polar pattern yields an industry-leading -40 dB of rear noise rejection at 180° off-axis , providing maximum gain-before-feedback and isolating vocals from stage monitor bleed and drum spill. Built with industry-standard 31.3 mm / 1.0 thread pitch mountings, the RC 37 seamlessly replaces factory capsules on major wireless handheld transmitters (including compatible Shure, Lectrosonics, Line 6, Audio Technica, and Sony systems) for an immediate upgrade in live vocal presence and clarity. It is is compatible with some Sennheiser systems with the proper adapter (see ambient.de for adapters and compatible systems).

  Key Features

  Heil RC 35 vs. Heil RC 37 Comparison Matrix

  Detailed Specification and Functional Comparison

  - Base Wired Microphone Design
    - Heil RC 35: Heil PR 35 Dynamic Microphone
    - Heil RC 37: Heil PR 37 Dynamic Microphone
  - Vocal Tone & Profile
    - Heil RC 35: Warm, rich, full-bodied studio sound with natural low-end presence
    - Heil RC 37: Ultra-clear, modern transparent sound designed to cut through dense, loud mixes
  - Frequency Response
    - Heil RC 35: 40 Hz – 18 kHz
    - Heil RC 37: 40 Hz – 18 kHz
  - Polar Pattern
    - Heil RC 35: Supercardioid
    - Heil RC 37: Supercardioid
  - Rear Rejection (@ 180°)
    - Heil RC 35: -35 dB
    - Heil RC 37: -40 dB
  - Output Sensitivity Level (@ 1 kHz)
    - Heil RC 35: -52.9 dB
    - Heil RC 37: -48.9 dB (Higher output sensitivity)
  - Impedance
    - Heil RC 35: 370 ohms balanced
    - Heil RC 37: 370 ohms balanced
  - Maximum SPL Handling
    - Heil RC 35: 140 dB
    - Heil RC 37: 140 dB
  - Primary Stage Applications
    - Heil RC 35: Vocalists seeking condenser-like warmth, acoustic sets, and controlled stages
    - Heil RC 37: High-volume rock stages, dense instrumental mixes, and maximum off-axis rejection
specs: |-
  - PR 37 Sound Quality for Wireless Systems: Translates the ultra-clear, transparent vocal voicing of the wired PR 37 dynamic microphone into a wireless capsule format.
  - High Output Sensitivity (-48.9 dB): Engineered with higher output level capability to ensure clean preamp drive and strong signal-to-noise ratio across wireless transmitters.
  - Exceptional Stage Isolation (-40 dB Rear Rejection): Supercardioid polar pattern provides outstanding rejection at 180° off-axis, preventing feedback and suppressing bleed from loud stage instruments.
  - Universal Wireless Transmitter Compatibility: Threaded mount attaches directly to industry-standard handheld wireless transmitters with 31.3 mm diameter / 1.0 thread pitch mounts (including compatible Shure, Lectrosonics, Line 6, and Sony models).
  - High SPL Capacity (140 dB Max SPL): Effortlessly handles high sound pressure levels without clipping or mechanical distortion, making it ideal for powerful vocalists.
  - Internal Shock Mounting: Built-in dynamic element isolation minimizes handling noise and mechanical vibration transmitted through the wireless body.
  - Heavy-Duty Metal Mesh Grille: Rugged outer screen protects the internal capsule structure from stage impacts, breath plosives, and sibilance.
  - Element type: dynamic.
  - Frequency response: 40 Hz to 18 kHz.
  - Polar pattern: supercardioid.
  - Rear rejection at 180 degrees off-axis: -40 dB.
  - Output level at 1 kHz: -48.9 dB.
  - Impedance: 370 ohms balanced.
  - Max SPL: 140 dB.
  - Threading and interface: industry-standard 31.3 mm diameter, 1.0 thread pitch wireless mount.
  - Weight: 5.4 oz (153.1 g).
  - No phantom or battery power drawn from the transmitter: the passive dynamic element generates the audio the transmitter sends over RF.
