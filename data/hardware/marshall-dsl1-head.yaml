description: The DSL1 Head is an all-valve 1W guitar amplifier head from
  Marshall's DSL (Dual Super Lead) range, designed for home, studio, and
  low-volume practice use without sacrificing the feel of a real valve amp. It
  carries two gain channels — Classic Gain and Ultra Gain — sharing a passive
  Treble/Middle/Bass tone stack with a Tone Shift switch for a scooped mid
  voicing, plus an onboard digital reverb. A power-reduction switch drops the
  output from 1W down to 0.1W for even lower-volume cranked-valve tones, and a
  3.5 mm emulated line output lets players record direct or quietly monitor
  through headphones. The rear panel adds a series effects loop, a footswitch
  jack for channel switching (PEDL-90011 included), an aux in for jamming along
  with a music source, and a single 1/4-inch speaker output (16 Ω only). Two
  ECC83 preamp valves and one ECC82 power valve drive the circuit, packaged in a
  compact lunchbox-style head cabinet.
