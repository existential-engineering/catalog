description: The DSL1 Head is an all-valve 1W guitar amplifier head from
  Marshall's DSL (Dual Super Lead) range, designed for home, studio, and
  low-volume practice use without sacrificing the feel of a real valve amp. It
  carries two gain channels — Classic Gain and Ultra Gain — sharing a passive
  Treble/Middle/Bass tone stack with a Tone Shift switch for a scooped mid
  voicing, plus an onboard digital reverb. A power-reduction switch drops the
  output from 1W down to 0.1W for even lower-volume cranked-valve tones, and a
  3.5 mm emulated line output lets players record direct or quietly monitor
  through headphones. The rear panel adds a series effects loop, a footswitch
  jack for channel switching (PEDL-90011 included), an aux in for jamming along
  with a music source, and a single 1/4-inch speaker output (16 Ω only). Two
  ECC83 preamp valves and one ECC82 power valve drive the circuit, packaged in a
  compact lunchbox-style head cabinet.
details: |-
  The DSL1 Head has the classic Marshall tone and features expected from a DSL but at a lower power to suit those who play at home. The DSL sound has been perfectly crafted to suit those with eclectic tastes, looking for tonal experimentation.

  Take control of your playing volume. Select between 1W and a more subdued 0.1W power output with a simple flick of a switch. Perfect for effortlessly moving between the rehearsal space and your home.

  The DSL1 Head was built for optimal convenience. Its compact size is not only ideal for home use but also makes it highly transportable, so you can take it to band practice with ease.

  Equipped with two distinct gain channels, ultra gain and classic gain, this amplifier offers enhanced versatility in sculpting your tone. The dual gain channels typically exhibit different levels of gain and distortion, enabling seamless transitions between cleaner tones and more intense overdriven or distorted sounds without the need for significant adjustments.

  An emulated output is provided for recording or headphones. Designed and engineered in UK. Made in Vietnam.
specs: |-
  - Model: DSL1HR
  - Range: DSL
  - Technology: All-valve
  - Channels: 2
  - Output wattage: 1W with optional power reduction to 0.1W
  - Outputs: 1 x 1/4" jack speaker output (16Ω load only), 1 x 3.5mm jack emulated line out
  - Inputs: 1 x 1/4" instrument jack, 1 x 3.5mm jack aux in, footswitch
  - Controls: Classic gain channel volume, channel select switch, ultra gain channel gain and volume, tone shift switch, treble, middle, bass, reverb
  - Effects: Digital reverb
  - Effects loop: Yes, 1 x series
  - Preamp valves: 2 x ECC83
  - Power amp valves: 1 x ECC82
  - Weight: 5.6 kg / 12 lb
  - Width: 360 mm / 14.2"
  - Height: 210 mm / 8.3"
  - Depth: 215 mm / 8.5"
  - Country of origin: Designed and engineered in UK. Made in Vietnam.
  - Box contents: PEDL-90011 footswitch included, detachable power cable included
