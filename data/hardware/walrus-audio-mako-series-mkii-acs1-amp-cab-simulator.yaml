description: The ACS1 is an amplifier and speaker cab simulator delivering the
  sound and feel of world-class amplifiers, complimentary speaker cabinet IRs
  created by Tone Factor and York Audio, and controllable room size.
details: "The ACS1 is an amplifier and speaker cab simulator delivering the
  sound and feel of world-class amplifiers, complimentary speaker cabinet IRs
  created by Tone Factor and York Audio, and controllable room size. The ACS1
  contains six amplifier models based on fan-favorite amps and twelve cab IRs.
  Three Vintage Amp Models: Fullerton (Fender Deluxe Reverb), London (1962
  Marshall Bluesbreaker), Dartford (1960s Vox AC30). Three High Gain Amp Models:
  Red (Peavey 5150), Citrus (Orange Rockerverb), Tread (Mesa Boogie Dual
  Rectifier). Cabinet IRs custom-engineered by Tone Factor and York Audio;
  user-loadable IRs via walrusaudio.io. Room has three reverb types (Room, Hall,
  Spring). Bass/Mid/Treble EQ via encoder knobs, noise gate, Amp EQ
  (presence/resonance), and IR/amp bypass. Save up to three presets onboard,
  additional banks in the Global Sound menu, and up to 128 presets via MIDI."
specs: |-
  - Six amp models (Fullerton, London, Dartford, Red, Citrus, Tread) and twelve cab IRs (Tone Factor + York Audio)
  - User-loadable IRs and firmware updates via walrusaudio.io
  - Stereo in and out; L/R independent amp+cab routing
  - Three reverb types (Room, Hall, Spring), Bass/Mid/Treble EQ, noise gate, Amp EQ
  - MIDI support (up to 128 presets); 2in 128x32 OLED screen
  - 24-bit 48kHz A/D and D/A converters, 32-bit floating point processing
  - Power: 9V DC, 300mA minimum, center negative
  - Dimensions: 4.9" x 2.52" x 2.64" (with knobs)
