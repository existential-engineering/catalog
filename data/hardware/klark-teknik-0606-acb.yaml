description: The KT-AES50 is an AES50 digital audio networking module using
  Klark Teknik's SuperMAC technology.
details: |-
  SuperMAC (AES50-compliant) digital audio networking technology provides high channel counts, ultra low and deterministic latencies, sample-synchronous and phase-aligned networked clock distribution, error detection and correction, network redundancy, and ease of deployment and use, to meet the requirements of live concert touring.

  The module is compatible with all Midas digital consoles, audio system engines and digital I/O units, as well as any other AES50-equipped device.
specs: |-
  - SuperMAC (AES50-compliant) digital audio networking
  - Compatible with Midas digital consoles, audio system engines and digital I/O units
