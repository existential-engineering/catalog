  Shadow."
details: |-
  The Mercury Flanger is a powerful stereo flanger pedal that leaves vapor trails in the sky. It offers three selectable flanger effect types: Classic (single-voiced), Thru-Zero (featuring phase cancellation at crossover), and Shadow (an extra resonant, jet-like effect).

  The pedal integrates with Neuro software to download additional phaser, flanger, and chorus algorithms at no extra cost, greatly expanding its modulation palette.

  An envelope follower mode enables pick-sensitive modulation control similar to auto-wah effects.

  Mercury stores 6 presets (two banks of three slots) and offers Universal Bypass with true bypass relay or transparent buffer options. It supports MIDI (PC and CC messages), MIDI clock sync, and expression pedal control via the Neuro Hub.
specs: |-
  - Three flanger types: Classic, Thru-Zero, Shadow
  - Downloadable phaser, flanger, chorus algorithms via Neuro software
  - Envelope follower mode for pick-sensitive modulation
  - Stereo instrument input/output
  - Stores 6 presets (two banks of three)
  - Universal Bypass (true bypass relay or transparent buffer)
  - MIDI capability (PC and CC messages), MIDI clock sync
  - Expression pedal compatible via Neuro Hub
  - Housing: brushed aluminum
  - Dimensions: 4.6" x 2.75" x 2.2"
  - Weight: 0.625 lb
  - Power consumption: 165 mA
