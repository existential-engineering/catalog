description: The HV-3C is a two channel transformerless microphone preamplifier
  in a 1U steel rack chassis. It uses stepped 36-position gain controls matched
  across both channels and a fully balanced path from the microphone input to a
  FET output stage.
details: |-
  The HV-3C places two channels of the Millennia HV-3 microphone preamplifier in a welded 16 gauge steel 19 inch chassis. The transformerless design uses a matched high-speed discrete transistor octet and accepts up to +23 dBu at the input, so no attenuator pad is required.

  Gain is set by 36-step switched controls at 1.5 dB per step, stereo matched to 0.08 dB, running from 8.5 dB to 60 dB with up to 70 dB available on request. The laser-trimmed FET-based output stage carries +32 dBu of headroom and is rated to drive cable runs of 1000 feet (300 m).

  The audio path is balanced throughout with precision components and is specified under 5 ppm THD. Switching uses Grayhill mil-spec gold contacts, audio wiring is OFC and power wiring is silver Teflon. The universal supply covers 90 to 240 V AC and is life-rated for over 500,000 hours MTBF.

  Factory options include a ribbon-optimized DC coupled input, an extra 10 dB of gain at no charge, and a 130 V DPA (B&K) microphone powering input, each ordered per channel. Standard phantom powering is +48 V dc.
specs: |-
  - Minimum Gain: 8.5 dB
  - Maximum Gain (1.5 dB per step, 36 steps): 60 dB (up to 70 dB on request)
  - Frequency Response (+0 / -3 dB): sub 8 Hz to beyond 300 kHz (sub 3 Hz by request)
  - Noise (60 dBu Gain, 10 Hz - 30 kHz, Inputs common): -133 dBu EIN
  - Total Harmonic Distortion + Noise (35 dB Gain, 10 Hz - 20 kHz bandwidth, +27 dBu Out): < .001%, Typ. < .0005% (< 5 ppm)
  - Intermodulation Distortion (50 Hz & 7 kHz, 35 dB Gain, +27 dBu Out): < .0009%
  - Phase Response (35 dB Gain, 50 Hz - 20 kHz bandwidth, +27 dBu Out): < 2 degrees deviation
  - Common Mode Rejection Ratio (35 dB Gain, 10 Hz - 20 kHz bandwidth, 100 mV C.M.): > 65 dB, Typ > 85 dB
  - Slew Rate (35 dB Gain, +27 dBu Out): > 25 Volts per microsecond
  - Maximum Input Level (20 Hz - 40 kHz): +23 dBu (no attenuator pads required)
  - Maximum Output Level (20 Hz - 40 kHz): +32 dBu
  - Phantom Input Impedance (1 kHz): 6,750 ohms
  - Output Impedance: 24.3 Ohms (x2)
  - DPA (B&K) Mic Powering: +130 V dc max (non-phantom)
  - Phantom Powering: +48 V dc, +/- 4 V dc
  - Power Consumption: 12 watts maximum
  - Power Requirements: 100V to 240V, 50/60 Hz
  - Dimensions/Shipping Weight: 19 in W x 1.75 in H x 12 in D, 15 lbs.
  - Environmental: 0 to +40 C / +32 to +104 F, 10% to 80% RH, maximum altitude 3,000 meters
