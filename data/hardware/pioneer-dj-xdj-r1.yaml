details: |-
  All-in-one DJ system for remotebox

  The XDJ-R1 is the all-in-one dream: the union of CD/USB decks, DJ software control, a top-flight mixer, powerful performance features and intuitive remote control via iPad, iPhone and iPod touch using our remotebox app. Analyse your tracks in the included rekordbox ™ software and load via USB to access a host of exciting features including Beat Sync and Quantized Beat FX.
