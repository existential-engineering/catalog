description: Three-way studio monitor, offering flawless reproduction of audio frequencies between 32 Hz and 50 kHz. Highly accurate imaging and localization.
details: |-
  The S3V is a three-way studio monitor optimized for vertical use and designed primarily for midfield applications, although it may also be used in more compact listening environments.

  Bass frequencies from 32 Hz to 250 Hz are handled by ADAM Audio's entirely new 9-inch Extended Linear Excursion (ELE) LF driver, which incorporates the company's equally groundbreaking Symmetrical Magnet Assembly (SMA) and delivers a powerful, extremely accurate low end extending right down into the sub-bass region. Mid-range and HF information is reproduced with equally analytical precision thanks to the combination of ADAM Audio's newly developed 4-inch DCH mid-range driver and the highly refined S-ART folded-ribbon HF driver. Together with the brand-new HPS waveguide, the latter offers high-frequency reproduction with an extremely broad sweet spot with fine, highly detailed imaging and a natural-sounding sense of depth.

  The S Series' custom-designed DSP optimizes the loudspeaker crossovers to create linear responses for the entire range, as well as providing user equalization and in-room tuning/voicing functions. The DSP also handles the limiter-based high-frequency driver protection, processes the signals from the AES3 digital inputs, and will in time facilitate various expansion options. Software updates can be carried out with ease via the associated USB port, which also allows users to connect computers and control the speakers' DSP functions via a software front-end.

  The S3V's built-in amplification is generously specified, comprising Class D units for the bass and mid-range drivers (500 W and 300 W RMS respectively) and a 50 W Class A/B amplifier for the S-ART tweeter.

  Offering flawless reproduction of audio frequencies between 32 Hz and 50 kHz, the S3V is a standout offering for anyone demanding highly accurate imaging and localization from their reference monitors.
specs: |-
  - Three-way active studio monitor, vertical orientation, midfield
  - Frequency response: 32 Hz - 50 kHz (-20 dB)
  - Max. SPL per pair at 1 m: ≥124 dB
  - THD > 100 Hz: ≤0.4 %
  - Crossover frequencies: 250 Hz, 3 kHz
  - Total RMS amplifier power: 850 W
  - Woofer amplifier: PWM, 500 W RMS
  - Midrange amplifier: PWM, 300 W RMS
  - Tweeter amplifier: Class A/B, 50 W RMS
  - Woofer: 9″ basket, HexaCone cone, 2″ (50 mm) voice coil
  - Midrange: 4″ dome/cone hybrid, Carbon Composite, 2.4″ (60 mm) voice coil
  - Tweeter: S-ART folded ribbon with HPS waveguide, 4 inch² (2420 mm²) diaphragm area, 0.17 g diaphragm weight, 4:1 velocity transform ratio
  - Analog input impedance: 48 kOhm, max. input level +24 dBu
  - Digital input: AES3
  - Control options: adjustable input sensitivity, 6 parametric EQs, 1 room compensation high-shelf EQ, 1 room compensation low-shelf EQ, 5 preset memories, delay 0 ms to 5 ms
  - Rear-panel OLED display with dual-function push-button/rotary encoder
  - Max. power consumption: 550 W
  - Dimensions (H x W x D): 21.1″ (536 mm) x 11.5″ (293 mm) x 15.0″ (380 mm)
  - Weight: 55.0 lb (25.0 kg)
  - Warranty: 5 years (2 years plus 3 years optional with product registration)
  - Delivery contents: power cord, manual
