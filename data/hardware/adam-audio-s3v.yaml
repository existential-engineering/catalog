description: Three-way studio monitor, offering flawless reproduction of audio
  frequencies between 32 Hz and 50 kHz. Highly accurate imaging and
  localization.
details: |-
  The ADAM Audio S3V is a three-way active studio monitor optimized for vertical use and designed primarily for midfield applications, though it remains suitable for more compact listening environments. It pairs a newly developed 9-inch Extended Linear Excursion (ELE) HexaCone woofer (32 Hz to 250 Hz) with a custom 4-inch Dome/Cone Hybrid (DCH) carbon-composite midrange and the refined S-ART folded-ribbon tweeter mated to the HPS waveguide.

  A custom-designed DSP engine handles the crossovers for linear response across the entire range, exposes user EQ and in-room tuning, manages high-frequency driver protection, processes AES3 digital signals, and supports firmware updates over USB. The result is flawless reproduction between 32 Hz and 50 kHz with highly accurate imaging and localization.

  Tri-amplification totals 850 W RMS: 500 W Class D drives the woofer, 300 W Class D drives the midrange, and 50 W Class A/B drives the S-ART tweeter. Maximum SPL is ≥124 dB per pair at 1 m with THD ≤0.4% above 100 Hz. Crossover points sit at 250 Hz and 3 kHz.

  Rear-panel I/O includes a balanced analog XLR input (48 kOhm input impedance, +24 dBu max input level, adjustable sensitivity), an AES3 digital input, and a USB port for software updates and DSP control. DSP processing exposes 6 parametric EQs, 1 room-compensation high-shelf and 1 low-shelf EQ, 0–5 ms of delay, and 5 preset memories for storing voicings per room or scenario.

  The cabinet measures 536 × 293 × 380 mm (H × W × D) and weighs 25.0 kg (55.0 lb). Maximum power consumption is 550 W. The S3V ships with a 5-year warranty (2 years standard plus 3 additional years with registration) and is intended for midfield use in demanding professional recording, mixing, and mastering environments.
specs: |-
  - Three-way active studio monitor optimized for vertical use (midfield)
  - 9" HexaCone ELE (Extended Linear Excursion) woofer with 2" (50 mm) voice coil
  - 4" Dome/Cone Hybrid (DCH) carbon composite midrange driver with 2.4" (60 mm) voice coil
  - S-ART folded-ribbon tweeter with HPS waveguide
  - S-ART diaphragm area: 4 in² (2420 mm²), 2" (56 mm) equivalent diameter, 4:1 velocity transform ratio, 0.17 g diaphragm weight
  - Frequency response: 32 Hz – 50 kHz (-20 dB)
  - THD > 100 Hz: ≤0.4%
  - Max SPL per pair at 1 m: ≥124 dB
  - Crossover frequencies: 250 Hz and 3 kHz
  - Woofer amplifier: PWM/Class D, 500 W RMS
  - Midrange amplifier: PWM/Class D, 300 W RMS
  - Tweeter amplifier: Class A/B, 50 W RMS
  - Total amplification: 850 W RMS
  - Analog input: XLR, 48 kOhm input impedance, max input level +24 dBu, adjustable sensitivity
  - Digital input: AES3 (AES/EBU)
  - USB port for software updates and DSP control
  - DSP controls: 6 parametric EQs, 1 high-shelf and 1 low-shelf room compensation EQ
  - 5 preset memories
  - Delay: 0–5 ms
  - Max power consumption: 550 W
  - Dimensions (H x W x D): 536 x 293 x 380 mm (21.1 x 11.5 x 15.0 in)
  - Weight: 25.0 kg (55.0 lb)
  - Warranty: 5 years (2 years standard + 3 years optional with registration)
