description: "Modular 4U AD/DA converter chassis with up to 80 analog channels,
  10 daughter card slots, and a swappable digital motherboard supporting
  DigiLink, MADI, Dante, and SoundGrid connectivity — all class-A, discrete, no
  ICs or capacitors in the signal path."
details: |-
  The B80 Mothership is a high-end modular AD/DA converter chassis that has redefined digital recording by bringing analog warmth and musicality to digital workflows. Building on the technology of the two-channel B2 Bombers, the B80 Mothership employs all class-A, discrete electronics without any integrated circuits or capacitors in the signal path, and supports up to 80 analog channels via 10 card slots.

  Digital interconnect is completely configurable via a swappable motherboard. Burl Audio offers four digital motherboards: the BMB1 (DigiLink, 64-channel IO at all sample rates), the BMB2 (MADI, two optical ports, 64-channel IO at 44.1–96 kHz, 32-channel at 176.4–192 kHz), the BMB3 (Dante, two Ethernet ports), and the BMB4 (SoundGrid, one Ethernet port).

  The BURL BACKBONE is a high-bandwidth backplane delivering digital audio throughput and routing master clock directly to each daughter card, eliminating the need for individual PLLs. Multiple B80 chassis can be daisy-chained for larger channel counts.

  Powering the B80 is the BP300 power supply with 300-watt continuous power capability and +/- 24-volt rails to drive the 80 channels of class-A analog circuitry.
specs: |-
  - 4U main chassis, 10 card slots
  - Up to 80 analog channels
  - Swappable digital motherboard (BMB1/BMB2/BMB3/BMB4)
  - 1 BNC word clock input (fixed on chassis)
  - 2 BNC word clock outputs (fixed on chassis)
  - BURL BACKBONE high-bandwidth backplane with direct master clock distribution
  - BP300 power supply: 300 W continuous, +/- 24 V rails
  - All class-A, discrete signal path — no ICs or capacitors in signal path
  - BMB1: 2 DigiLink ports, 64-channel IO at all sample rates
  - BMB2: 2 optical MADI ports, 64 ch at 44.1/48/88.2/96 kHz, 32 ch at 176.4/192 kHz
  - BMB3: 2 Dante Ethernet ports, 64 ch at 44.1/48/88.2/96 kHz, 32 ch at 176.4/192 kHz
  - BMB4: 1 SoundGrid Ethernet port, 64 ch at 44.1/48/88.2/96 kHz
