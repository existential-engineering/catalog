description: >-
  The Sequential Prophet 3000 is a rackmount 16-bit sampler featuring warm
  analog filters, variable sample rates up to 48kHz, and a detachable front
  panel display, released during Sequential Circuits' final years of production.
details: |-
  The Prophet 3000 arrived in 1987 as one of Sequential Circuits' last products before the company
  ceased operations, making it a relatively rare piece of sampling history. It represented a serious
  attempt to compete in the professional sampler market alongside offerings from Akai and E-mu,
  bringing Sequential's signature analog warmth to the digital sampling domain.

  At its core, the Prophet 3000 offers 16-bit sampling with variable sample rates up to 48kHz,
  providing up to 21 seconds of recording time with 2MB of internal memory expandable to 8MB. What
  truly set it apart from competitors was its resonant low-pass analog filter, which imparted a
  musical character to samples that purely digital samplers of the era could not match. Auto-editing
  features streamlined the often tedious process of loop point selection and sample trimming.

  The hardware design included thoughtful touches like a detachable faceplate with LCD display for
  comfortable editing, eight individual audio outputs plus a stereo pair, and SCSI connectivity for
  fast sample transfer. The final OS version 3.0B refined the unit's capabilities, though the
  machine's scarcity has made it more of a collector's item than a studio staple.
specs: |-
  - Polyphony: 8 voices
  - Sample Resolution: 16-bit
  - Sample Rate: Variable up to 48kHz
  - Sample Time: Up to 21 seconds
  - Memory: 2MB internal, expandable to 8MB
  - Filter: Resonant low-pass analog filter
  - VCA: Yes
  - Outputs: 8 individual + stereo pair
  - Control: MIDI, SCSI
  - OS: Version 3.0B (final)
  - Format: Rackmount with detachable LCD faceplate
releaseDate: "1987"
