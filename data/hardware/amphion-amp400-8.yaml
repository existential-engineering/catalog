description: The Amp400.8 is an 8-channel power amplifier delivering rock-solid
  control and tight, fast, highly resolving low-distortion power, featuring a
  proprietary in-house designed buffer stage with Class-D technology as a sonic
  match for Amphion and other passive studio monitors.
details: |-
  The Amp400.8 is an 8-channel rack-mountable power amplifier designed to complement passive studio monitors and speakers in professional studio environments. It delivers 410W into 4 ohms or 205W into 8 ohms per channel (1% THD+N, 20Hz-20kHz), providing substantial headroom for accurate monitoring applications.

  At the heart of the Amp400.8 is a proprietary in-house designed buffer stage combined with Class-D amplification technology. This combination delivers tight, fast, and highly resolving low-distortion power, making it a sonic match for Amphion's own passive monitor lineup as well as other passive speakers.

  The amplifier features balanced 3-pin XLR female inputs on all 8 channels, paired with Neutrik Speakon NL2FX 2-pole speaker connectors for outputs. The universal mains input accepts 100-240V at 50-60 Hz automatically, making it suitable for use in studios worldwide.

  The unit is housed in a 19-inch rack-mountable 3U aluminum chassis measuring 133 x 483 x 330 mm and weighing 7.5 kg. With a dynamic range of 121.5 dB(A), the Amp400.8 is engineered for high-fidelity studio monitoring applications where accurate power delivery is critical.

  The Amp400.8 is assembled in Finland.
specs: |-
  - Power output: 410W @ 4Ω / 205W @ 8Ω (1% THD+N, 20Hz–20kHz)
  - Dynamic range: 121.5 dB(A)
  - Channels: 8
  - Input connectors: Balanced 3-pin XLR female
  - Speaker output connectors: Neutrik Speakon NL2FX 2-pole
  - Power supply: Universal mains, auto-select (100–240V, 50–60Hz)
  - Chassis: 19" rack-mountable, 3U, aluminum
  - Dimensions: 483W × 133H × 330D mm
  - Weight: 7.5 kg (16.5 lbs)
  - Amplifier technology: Class-D with proprietary buffer stage
  - Assembled in Finland
