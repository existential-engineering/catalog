description: >-
  The Wersi Bass Synthesizer is a monophonic analog synthesizer from German organ builders
  WERSI, marketed as two instruments in one combining electric bass guitar and synthesizer
  capabilities. Aimed at keyboard and organ players, it features authentic bass guitar
  sounds alongside a versatile synthesizer section with multiple waveform stops.
  Designated model AP-6, it was produced in 1977 and offered in kit form or pre-assembled
  with various keyboard and pedal clavier options.
details: |-
  The Wersi Bass Synthesizer was designed specifically for keyboard and organ players who needed bass guitar and synthesizer sounds for live performance. The bass guitar section is remarkably authentic, with an "On" control that adjusts initial attack for picked versus fingered bass characteristics and a "Damp" control that functions as a sustain envelope for muted bass effects.

  The synthesizer section uses organ player terminology rather than synth jargon, featuring multiple waveform stops: five flute stops (sine waves) at 16', 8', 4', 2', and 1' footages; two brass stops (sawtooth waves) at 16' and 8'; and a woodwind stop (square wave) at 8'. Multiple stops can be layered simultaneously for complex tones, with each section having independent volume controls.

  A formant filter labeled "Wah-Wah" affects brass and woodwind waveforms in automatic or manual modes. The distinctive "Hawaii" button provides a downward pitch bend of a half-tone at a fixed rate, while a "Glide" slider pitch-shifts the entire keyboard by an octave with optional automation. Vibrato effects include rate, depth, and continuous or delayed modes.

  The instrument was available in kit form or pre-assembled, with options to connect to organ keyboards or WERSI's 13-, 25-, or 32-pedal claviers via a 16-pin connector interface. It featured a carry-case-style chassis with handle and cover, identified by the front panel label "Bass Synthesizer" using the German eszett character.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO
  - Waveforms: Bass Guitar, Sawtooth (Brass), Square (Woodwind), Sine (Flutes)
  - Filter: Formant filter (Wah-Wah) with manual and auto modes
  - Modulation: Vibrato with on/off, delayed, and slow rate options
  - Effects: Octave Glide (up/down, manual/auto), Hawaii pitch bend
  - Envelope: Attack and sustain controls
  - Keyboard: 36 keys; optional pedal claviers (13, 25, or 32 pedals)
  - Memory: None
  - Model Designation: AP-6
  - Year Produced: 1977
releaseDate: "1977"
