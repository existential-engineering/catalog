details: |-
  The Limited-edition Custom Line TAT Special FX 'Metal Machine', elegant, exceptional, brutal and beautiful. While the original Adam Dutkiewicz signature model comes as a stripped-down, high octane hot rod, the new Custom Line model offers all of the 'shiny side up' top-shelf upgrades, but with the same need for speed, power-house muscle under the hood. The single Killswitch signature Fluence humbucker (of the original model) is now complimented with the addition of a single coil Fluence SSA at the neck. A three-way rotary switch provides the pickup selections and a push pull volume control accesses the dual voicing modes. The select flame maple top combined with an Australian Blackwood back provides the Custom Line Metal Machine with a distinct character and tonality. It has a sweet and focused midrange, with a clear and punchy low end topped off with a glassy high-end shimmer. A 5-piece Maple/Walnut neck and through body stringing adds rock-solid stability with increased projection and sustain. The Caparison Custom Line TAT-Special FX Metal Machine is unleashed
