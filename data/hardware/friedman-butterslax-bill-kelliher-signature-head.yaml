description: The Butterslax is Bill Kelliher's signature Friedman head, a
  hand-wired 100 watt three channel amp powered by four EL34s. Each channel
  steps up the gain, with global presence and thump controls, a line out with
  level and an ultra transparent series effects loop.
details: |-
  Bill Kelliher's guitar playing is rooted in metal, infused with rock 'n' roll and progressive rock and sprinkled with bits and pieces of thrash, punk and psychedelic-ness. So when it came time for Mastodon's guitar player to design the ultimate amp to cover the complexity of his playing, Bill decided to team with long time friend and respected tone guru Dave Friedman.

  The result of this collaboration is the Friedman Butterslax, a 100 watt, three channel beast powered by 4 x EL34s with gain, more gain, extreme gain and some more gain to top it off. High-gain is an over simplification of the Butterslax: what Dave and Bill created is a super high gain, ultra tight amp that delivers deep, rich low end, with detailed midrange and singing highs that capture every drop of each refined note.

  The Butterslax features three channels. Channel one, with gain, master, bass, middle and treble, runs from slightly overdriven tones to hard rock. Channel two, with the same controls, picks up where most metal amps leave off. The third, fire breathing channel goes 100 miles past the extreme, to gain heaven or hell depending on perspective.

  The Butterslax features an ultra transparent effects loop, Baltic Birch construction, black tolex and checkered grille cloth. It is not an amp for clean tones, but for a tone machine that measures on the Richter Scale.

  The Butterslax is hand-wired in the U.S.A. using hand selected components, and Friedman amps are designed and built to last a lifetime.
specs: |-
  - 100 watt all-tube head
  - Three channels, each with more gain than the last
  - Hand-wired in the USA using hand selected components
  - 4 x EL34 power tubes
  - 4 x 12AX7 preamp tubes
  - Channel 1: Gain 1, Master 1, Bass, Middle, Treble
  - Channel 2: Gain 2, Master 2, Bass, Middle, Treble (EQ shared with channel 3)
  - Channel 3: Gain 3, Master 3, Bass, Middle, Treble (EQ shared with channel 2)
  - Global Presence and Thump controls
  - Channel select switch
  - Line out with level control
  - Ultra transparent series effects loop
  - 4, 8 and 16 ohm impedance selector switch
  - Custom USA made transformers
  - 2 button footswitch with LEDs included
  - Baltic Birch construction, black tolex and checkered grille cloth
  - Dimensions 9 in (D) x 27.5 in (W) x 10.75 in (H)
  - Weight 42 lbs
  - Limited lifetime warranty
