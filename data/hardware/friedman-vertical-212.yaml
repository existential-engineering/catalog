details: |-
  The Friedman vertical 2x12 inch cabinet features a rear-ported, closed-back design which uses tongue and groove Baltic birch construction to deliver the bass and mid response expected from a Friedman cab.

  The vertical cabinet design solves the problem of traditional low-profile cabinets whose speakers fire too low to the ground. With the Friedman vertical cab, the bottom speaker faces outward while the top speaker is angled slightly upward, making it easier to hear over a full band.

  At the heart of the cab are two Celestion Vintage 30 speakers, which mate with any Friedman amplifier. The V30's sound has been captured on thousands of recordings from a diverse range of notable players. It features detailed and complex overtones, a warm low end, a rich vocal mid-range and a detailed top end. This cab delivers an intricate Vintage 30 crunch, revealing the complexities found in hand-wired boutique amps.

  As with all Friedman cabinets, oversized 12-gauge speaker wire is soldered between the speaker and the terminal. The Friedman 2x12 is handcrafted in the USA and designed to withstand the rigors of the road.
specs: |-
  - 2 x Celestion 12 inch Vintage 30 speakers
  - Nominal impedance: 8 ohms
  - Closed-back, rear-ported cabinet design
  - Vertical layout: bottom speaker faces outward, top speaker angled slightly upward
  - Tongue and groove Baltic birch construction
  - Oversized 12-gauge speaker wire soldered between speaker and terminal
  - Grill cloth and faceplate chosen at order: Black, Gold Weave, Silver Weave, Vintage
  - Dimensions: 14 in (d) x 24 in (w) x 28 in (h)
  - Weight: 64 lbs
  - Hand-crafted in the USA
  - Limited lifetime warranty
