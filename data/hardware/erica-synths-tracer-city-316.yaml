description: Analogue modulation for any audio source
details: |-
  The Tracer City is in many ways very similar to what you might find on an old or new analog synthesizer. The main synthesizer components it carries are filters, an oscillator that can also be used as an LFO, and a pseudo-random LFO with lag.

  It also has an envelope follower with up or down response and lag, which works very well with drums, loops and anything else that is very percussive.

  Like a synthesizer, the Tracer City allows its multi-mode filter to be controlled by two external CV sources. Audio sources can be plugged into these inputs as well, which creates frequency modulation of the filter.

  For anyone familiar with modular or analog synthesizers the control names are in many cases self-explanatory, so what is left to learn is the layout and the way the modulators are routed to the filter.
