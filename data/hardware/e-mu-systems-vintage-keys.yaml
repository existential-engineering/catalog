description: >-
  A rackmount sound module from E-mu that packed 8MB of sampled classic
  synthesizer sounds into a compact unit, offering 32-voice polyphony and
  extensive real-time MIDI control.
details: |-
  Released in 1993, the Vintage Keys was E-mu's answer to the growing demand for classic analog synthesizer tones in a convenient digital format. Rather than requiring a room full of vintage gear, producers could access sampled sounds from legendary instruments in a single rackmount module with full MIDI control.

  The original unit shipped with 8MB of ROM samples and 358 patches. An upgrade kit was available for original owners wanting to reach Plus specifications. The module featured a lowpass VCF filter, ADSR envelopes, portamento, and chorus effects, with extensive real-time modulation options.

  The Vintage Keys found a dedicated following in the electronic and dance music scenes of the early-to-mid 1990s. Notable users included Hardfloor, The Prodigy, Fatboy Slim, Meat Beat Manifesto, Goldie, and Faithless. While it delivered a distinctly digital interpretation of analog sounds rather than exact replicas, that character became part of its appeal for producers working in genres where pristine accuracy mattered less than having usable vintage-flavored tones on tap.
specs: |-
  - Polyphony: 32 voices
  - Multitimbral: 16 parts
  - Sound memory: 8MB ROM
  - Patches: 358
  - Filter: Lowpass VCF
  - Envelope: ADSR VCA
  - Effects: Chorus
  - LFO: Multiple modulation sources and destinations
  - Control: MIDI
  - Format: Rackmount (no keyboard)
