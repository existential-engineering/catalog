details: |-
  The Fusion 12 Natural CD is a nylon-string guitar designed for comfort and playability, featuring a slim steel-string style neck (48mm nut width) with a radiused fingerboard. Built with a solid Canadian cedar top and mahogany back and sides, it offers the warm, responsive tone that cedar is known for. As the name suggests, the 12 Natural Cedar has 12 frets to the body, allowing the bridge to sit further back on the soundboard, where resonance is optimized for a fuller voice with enhanced warmth and long, singing sustain. Thoughtful details like a hand-inlaid wooden rosette, 3-ply maple and ebony top purfling, and a high gloss polyurethane finish make this Fusion model both elegant and practical. Plug in and play with the built-in Fishman Presys preamp.
specs: |-
  - Construction: Solid Top
  - Family: Cutaway & Electric
  - Style: Fusion
  - Back and Sides Wood: Mahogany
  - Body Top: Solid Canadian Cedar
  - Finish: High Gloss Polyurethane
  - Frets to Body: 12
  - Rosette: Hand-inlaid Wood
  - Top Purfling: 3-ply Maple and Ebony
  - Electronics: Fishman Presys
  - Nut Width: 48mm (1 7/8")
  - Number of Strings: 6
  - Tuning: E-A-D-G-B-E
