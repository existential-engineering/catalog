description: Custom Shop 21st Anniversary colourway of the Loomer fuzz and
  reverb workstation, with a tri-voiced fuzz, three reverb programs and
  switchable effect order.
details: |-
  The Loomer pairs a heavy fuzz with a reverb section voiced for shoegaze textures. A tri-voiced fuzz can be combined with any one of three reverb programs, and the order of the two sections can be switched. The fuzz offers three EQ profiles: Flat, Full and Scoop. A Blend control lets any of the reverbs run fully wet.

  Three reverb programs are on offer. Hall is a long ambient wash that can take octave regeneration in its feedback loop for an ascending shimmer. Reverse is modelled on the Yamaha SPX90 and Alesis MidiVerb II and is not a true reversed reverb: it reads through a delay line at successive points while rising in volume, and its Decay control steps through eight fixed times of 150, 200, 250, 300, 350, 400, 450 and 500 ms to set the rhythm at which notes return. Soft Focus approximates the Yamaha FX500 patch of the same name, a dense reverb with two parallel delays set to 250 ms and 380 ms.

  In Reverse mode the vibrato is envelope controlled over a range of 0 to 50 ms of time shift, and the tone control is modelled loosely on a Jazzmaster rhythm circuit, a low pass filter centred at 156.6 Hz. Playing hard produces a pitch bend in the manner of a Jazzmaster or Jaguar tremolo arm. The fuzz section is named Muffdive.

  This 21st Anniversary Custom Shop edition is finished in a two tone matte enclosure, released alongside a matching Realizer colourway.
specs: |-
  - Tri-voiced fuzz with three EQ profiles: Flat, Full, Scoop
  - Three reverb programs: Hall, Reverse, Soft Focus
  - Switchable effect order between fuzz and reverb
  - Hall reverb supports octave regeneration in the feedback loop
  - Reverse reverb modelled on the Yamaha SPX90 and Alesis MidiVerb II
  - Reverse Decay control steps through eight fixed times: 150, 200, 250, 300, 350, 400, 450 and 500 ms
  - Soft Focus is a dense reverb with two parallel delays at 250 ms and 380 ms
  - Envelope controlled vibrato in Reverse mode, 0 to 50 ms of time shift
  - Tone control is a low pass filter centred at 156.6 Hz
  - Blend control allows a fully wet reverb
  - 21st Anniversary Custom Shop two tone matte finish
