details: |-
  The PRS SE Custom 24 Quilt brings the original PRS to the more-accessible SE Series with the addition of a quilted maple top veneer and matching quilted maple headstock veneer. This model’s polished aesthetic gives the guitar stage-worthy style to go with its road-worthy reliability.

  With a 24-fret, 25” scale length, Wide Thin maple neck, the SE Custom 24 Quilt is comfortable and addictive to play. The 85/15 “S” dual humbuckers and 3-way blade switch with push/pull coil-tap tone control offer versatility and full-spectrum tone. A fitting workhorse for touring musicians, professional players, and at home guitarists alike.
