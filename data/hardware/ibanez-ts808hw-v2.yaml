description: Hand-wired Tube Screamer flagship — a re-envisioning of the
  original TS808 built around the JRC NJM4558 op-amp, with MOGAMI OFC internal
  wiring, a +6dB boost stage, true bypass, and an updated modern aesthetic.
details: |-
  At Ibanez, we sought to take the iconic Tube Screamer and push it further with a re-envisioning of the flagship, hand-wired model. The design incorporates the JRC NJM4558 op-amp to achieve the pedal's signature sound, while adding high-end components such as MOGAMI OFC cables and a boost stage that increases maximum output by +6dB.

  The appearance has been updated with a modern aesthetic while maintaining the traditional Tube Screamer shape. Custom-designed black Alumite knobs, a standard 2.1mm DC jack, and a wide 9-18V supply range complete a faithful but elevated take on the original.
specs: |-
  - Hand-wired construction
  - Japanese MOGAMI OFC Cable (AWG21)
  - Controls: Overdrive, Tone, Level
  - Custom Designed Black Alumite Knobs
  - Standard 2.1mm DC Jack (center negative)
  - True Bypass
  - I/O: INPUT, OUTPUT
  - Required Current: 7mA@9V / 11mA@18V
  - Power Supply: One 9V battery or external AC adapter (DC 9-18V, center negative)
  - JRC NJM4558 op-amp
