details: |-
  Chandler Limited's REDD.47 Mic Amplifier is a recreation of the original valve line amplifiers used in Abbey Road Studios' heralded and rare EMI REDD.51 recording consoles circa 1959-1968. Designed as a central component to the EMI REDD.51 recording console, the original REDD.47 line amplifier was used to amplify virtually every stage of the audio path (mic inputs, line inputs, echo sends and monitors).

  The REDD.47 lent its unmistakably punchy, aggressive character to music recorded at Abbey Road Studios' Studio Two between 1964 and 1968, including many tracks by The Beatles. The Chandler Limited REDD.47 Mic Amplifier offers many additional benefits to the original design including increased gain, allowing a range of tonal options from pristine clean sound to classic rich, saturated tone with up to 2% harmonic distortion before clipping.

  The Chandler Limited REDD.47 preamp easily reproduces the distortions heard on The Beatles' 'Revolution.' Chandler Limited's REDD.47 tube microphone preamplifier delivers the legendary sound of Abbey Road Studios' 'Holy Grail' preamp, with extra features to meet today's recording studio standards.

  The circuit is based on the EMI REDD valve topology using EF86 and E88CC tubes. It provides a stepped voltage gain range of 16-52 dB, a fine gain control of ±5 dB, and a continuous output control, giving a total usable gain of up to +57 dB. An inductor-based rumble filter with eight switchable frequencies (30, 45, 60, 70, 90, 110, 130, 180 Hz) is included alongside a switchable 20 dB pad, polarity inversion, and +48V phantom power.
