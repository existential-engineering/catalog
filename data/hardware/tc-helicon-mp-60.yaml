description: Handheld dynamic vocal microphone with a cardioid polar pattern and
  a neodymium capsule, built for live use. An internal pop filter and a steel
  grille handle plosives and the knocks of touring.
details: |-
  The MP-60 is a road-ready dynamic vocal microphone built for singers who need a microphone that survives the gig and still sits well at the front of the mix. Its cardioid polar pattern concentrates on the voice and rejects the wedge monitor in front of it, so feedback stays manageable on a loud stage with the monitors turned up.

  A neodymium capsule delivers strong output and clear midrange detail, while an internal pop filter and a rugged steel grille keep plosives in check and absorb the knocks that come with travel. Plugged into a TC-Helicon vocal processor, it hands off a clean, present signal for the harmony and adaptive tone engines to shape.
specs: |-
  - Cardioid polar pattern
  - Neodymium capsule
  - Internal pop filter
  - Rugged steel grille
