url: https://www.kieselguitars.com/series/guitar/z2
description: The Z2, the re-imagining of the Zeus, uses new features to enhance
  aesthetics and playability further. The offset body gives a prominent arm
  contour for comfort and a renewed appearance, with bevels added to the lower
  horn and body shape.
specs: |-
  - Scale length: 25.5" or 27" fixed, or 25.5" to 26.5", 25.5" to 27" and 26" to 27.5" multiscale
  - Frets: 24 stainless steel medium-jumbo, .103" wide x .048" tall
  - Body: alder, 30.5" long, 1.62" to 1.65" thick, 12" to 12.75" wide depending on configuration
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69" to 2.12" at nut depending on string count and scale
  - Construction: bolt-on with radiused neck heel
  - Fingerboard: ebony with 20" radius
  - Bridge: Hipshot fixed bridge or Hipshot Solo saddle bridge, .4125" (10.5mm) spacing
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Hardware: black
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Strings: Elixir Nanoweb 1046E
  - Weight: 5.15 lbs, 5.25 lbs or 5.45 lbs depending on configuration
  - Bevels on the lower horn and body shape are reminiscent of the A2
