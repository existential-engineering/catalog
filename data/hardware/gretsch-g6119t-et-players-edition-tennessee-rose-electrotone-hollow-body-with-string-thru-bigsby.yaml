details: |-
  The world's greatest hollow body guitars just got even better. The Players Edition Tennessee Rose Electrotone features all-new FT-67 Filter'Tron humbucking pickups designed for authentic vintage Gretsch voicing but with a more well-rounded tone for modern playing styles.

  The shallow 2-inch maple body with parallel bracing delivers resonant hollow body sound with additional feedback control and low-end thump.

  Controls include separate bridge and neck volume controls, three-way pickup toggle switching, no-load master tone and master volume alongside a treble bleed circuit for tonal retention. The Bigsby B6CP String-Thru tailpiece and Gotoh locking tuners round out a modern Tennessee Rose built for the working professional.
