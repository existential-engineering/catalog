name: Agro Bass Overdrive
manufacturer: aguilar
primaryCategory: pedal
categories:
  - overdrive
url: https://aguilaramp.com/products/agro-bass-overdrive-pedal
description: Capable of producing everything from warm, tube-like overdrive to
  full-on distortion, the Agro preserves your low end while delivering the grind
  you need. The SATURATION control spans a tremendous range of distortion,
  CONTOUR dials in scooped or boosted midrange, and PRESENCE adds attack to keep
  your bass defined even at maximum saturation.
details: |-
  Saturation control offers a wide range from warm tube-like overdrive to full
  distortion while preserving low-end frequencies.

  Contour control provides a broad-spectrum mid scoop/boost centered around
  900 Hz — sweep between a scooped vintage tone and an aggressive, boosted
  midrange.

  Presence control adds +6 dB / -20 dB of high-frequency content above 4 kHz
  to keep the bass defined at any saturation level. Output Level control allows
  independent volume adjustment at any distortion setting.

  Backed by Aguilar's three-year limited warranty to the original owner.
specs: |-
  - Power: 9V DC (not included)
  - Input: One 1/4-inch jack
  - Output: One 1/4-inch jack
  - Contour: Broad spectrum mid scoop centered around 900 Hz
  - Presence: +6 dB / -20 dB above 4 kHz
