description: Paul Franklin is one of the most famous Pedal- and Lapsteel players
  on the planet and has collected 30 CMA nominations to date. With this custom
  Lapsteel, we have made an instrument tailored to his specific needs but made
  for everyone.
details: |-
  The Alliance Series Paul Franklin is a lap steel built from Korina with a Maple top on the headstock, measuring 92 x 19,3 x 4 cm / 36.2" x 7.6" x 1.57". The scale length is 648 mm / 25.5", the nut width is 65 mm / 2.56" and the string spacing is 54 mm / 2.13". Its fingerboard is transparent plexiglass with the markings printed on the back, and the finish is PUR lacquer in Red and Vintage White. The specification sheet also records a specially requested Capo-delete, so no capo is fitted.

  Pickups are a Duesenberg GrandVintage Humbucker at the bridge, described as cutting and balanced, and a hum-cancelling Duesenberg SingleTwin Domino at the neck, intended for smoother and warmer lines. Wiring is one volume, one tone and a 3-way pickup selector, with custom laser-etched knobs.

  Hardware is nickel finished and includes Duesenberg Z-Tuners and a Duesenberg Roller Nut. The bridge is the Duesenberg Multibender, a user-configurable string bending system for harmonic up-bends and down-bends: it accepts up to five levers, each of which can be set up to bend a chosen string a semitone or a full tone, operated with the heel of the hand while playing, so chords can be shifted between minor and major or other intervals. Additional levers are available separately. The instrument is strung with Duesenberg Custom 016/056.

  The lap steel ships with a Duesenberg Custom Line Case, all required allen keys and a certificate.
specs: |-
  - Body/Neck wood: Korina (+ Maple top on headstock)
  - Width at nut: 65 mm / 2.56"
  - Dimensions: 92 x 19,3 x 4 cm / 36.2" x 7.6" x 1.57"
  - Stringspacing: 54 mm / 2.13"
  - Fingerboard: Transparent plexi with imprint on the back
  - Scale length: 648 mm / 25.5"
  - Finish: PUR lacquer, Red & Vintage White
  - Tuners: Duesenberg Z-Tuners
  - Nut: Duesenberg Roller Nut
  - Bridge: Duesenberg Multibender
  - Capo: None ("Capo-Delete")
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 016/056 (016-018-026-036-046-056)
  - Pickup (neck): Duesenberg SingleTwin Domino
  - Pickup (bridge): Duesenberg GrandVintage Humbucker
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector
  - Knobs: Custom laser etched
  - Case: Custom Line Case (included)
  - Tools: All required allen keys (included)
  - Certificate: included
