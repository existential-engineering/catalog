description: Massive Passive Mastering
details: |-
  Mastering version of the modern classic, tube mastering EQ with smooth, musical tone shaping.

  Two-channel, 4-band passive tube equalizer with high-pass and low-pass filters optimized for mastering applications, hand-crafted in California with premium components.

  Passive filter design uses metal-film resistors, film capacitors, and hand-wound inductors, with tube-driven make-up gain stages. Four parallel filter bands per channel switch between bell and shelf response.
specs: |-
  - Two-channel passive tube mastering EQ (3U)
  - 4 overlapping bands per channel with shelf/bell switching
  - High-pass and low-pass filters per channel optimized for mastering
  - Tube complement: 2 x 5751, 4 x 6922/ECC88
  - Frequency Response: 10 Hz - 70 kHz
  - THD+N: <0.01%
  - Signal-to-Noise Ratio: 116 dB
  - Max Output: +37 dBv (LF ~+26 dBv)
