description: A discontinued subharmonic synthesizer designed for portable and
  tour applications, adding low-frequency enhancement to audio systems.
details: |-
  The 120XP is a subharmonic synthesis processor that generates complementary low-frequency content to enhance bass response in audio systems. Ideal for portable PA and touring sound reinforcement applications, it synthesizes subharmonic frequencies from the input signal to add perceived depth and impact to the mix.
specs: |-
  - Subharmonic synthesizer
  - Recommended for portable and tour applications
  - Generates complementary low-frequency content
  - Enhances bass response in audio systems
