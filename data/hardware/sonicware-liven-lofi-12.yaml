url: https://sonicware.jp/products/liven-lofi-12
description: LIVEN Lofi-12 is a lo-fi sampling groovebox with a 12-bit sampler
  mode and 4-track sequencer for easy lo-fi and chill beat making. It offers
  chromatic sample playback, resampling and chopping, 12 track effects, 9 master
  reverbs, and a "laid-back" knob for drunk-beat swing.
details: |-
  LIVEN Lofi-12 is a lo-fi sampling groovebox with a 4-track sequencer for easy lo-fi and chill music creation. Its retro sampling engine offers a 12-bit sampler mode, and you can easily play samples chromatically across the keyboard. A powerful 4-track sequencer adds parameter and sound locking, a laid-back knob creates drunk beats, and each track carries 12 types of effects alongside 9 types of master reverb.

  This product does not include an AC adapter. If you need one, please select the "With PSU" option.
specs: |-
  - Sound Source: 16bit - 12kHz or 24kHz (switchable) linear PCM sampling (mono), Sampling up to 4 seconds per sample (12kHz) or 2 seconds per sample (24kHz)
  - 12bit Sampler mode
  - Various sample editing features
  - Resampling and Chopping
  - Maximum polyphony: 10 voices
  - 12 Track effects: Chorus, Flanger, Tremolo, Delay, Distortion, Bit Crusher, Low Pass Filter, High Pass Filter, Isolator, Tilt EQ, Compressor, S.Maximizer
  - 9 Master effects: Hall Reverb, Room Reverb, Arena Reverb, Plate Reverb, Tunnel Reverb, Infinity Reverb, Cassette Tape Simulator, Vinyl Simulator, Remix performance effect
  - 128 sample memory slots (16 x 8 banks)
  - Sequencer: 4 tracks, up to 64 steps, 64 patterns, Swing
  - I/O : MIDI IN/OUT, SYNC IN/OUT, LINE IN/OUT , headphone out
  - Size : 11.7 inch (W) x 6.92 inch (D) x 1.89 inch (H), 297mm (W) x 176mm (D) x 48mm (H)
  - Weight : 1.74lb., 790g
  - Accessories: Overlay sheet for sound edit, Warranty
  - Power supply: AA batteries x 6, or 9V DC output AC adapter (1A or higher, EIAJ3 standard inner diameter 1.7mm outer diameter 4.75mm, center +) *The AC adapter is not included.
