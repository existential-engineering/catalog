details: |-
  Core Sub is the ideal low-frequency extension for all speakers in the Core studio monitor range. It delivers flat response down to 15Hz with a 6dB roll-off at 13.5Hz, combining a handcrafted Danish-made cabinet with four low-frequency drive units and 1000W of Pascal class-D amplification.

  The subwoofer integrates the same DSP engine found across the Core speaker line, enabling customization based on room placement. With both analogue and AES digital inputs, it supports configurations from single-channel extension through 2.1-channel bass management to theatrical LFE channels.

  Core Sub features four handmade 9-inch MSP+ Hybrid Drive units constructed from aluminium with dual-action damping systems combining paper dampening and Magnesium Silicate Polymer material, ensuring controlled, accurate bass reproduction at output levels up to 120dB.

  The design allows stacking multiple units and combining them with other Core products, including VESA wall mounting compatibility — suitable for music recording studios, post-production rooms, broadcast facilities, and theatrical LFE applications.
specs: |-
  - Type: Subwoofer
  - Box principle: Sealed
  - Woofer: 4x 9" MSP Hybrid Drive
  - Amplifier power: 2x 500W (1000W total)
  - Maximum SPL: 106 dB
  - Lower cutoff (85 dB ±3 dB): 15 Hz
  - Upper cutoff (85 dB ±3 dB): 160 Hz
  - Lower cutoff (-6 dB): 14 Hz
  - Upper cutoff (-6 dB): 165 Hz
  - AC power input: 100-120V / 200-240V, 50/60Hz
  - Standby power: 0.5W
  - Auto on/off: Yes
  - Weight: 48 kg (105.8 lbs)
  - Dimensions (W x H x D): 390 x 514 x 365 mm (15 3/8" x 20" x 14 3/8")
