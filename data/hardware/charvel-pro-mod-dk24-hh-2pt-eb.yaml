description: A Pro-Mod Series Dinky with an alder body in Gloss Black,
  graphite-reinforced caramelized maple bolt-on neck, 12"-16" compound radius
  ebony fingerboard with 24 jumbo frets and Luminlay side dots, Seymour Duncan
  HH pickup configuration with series/parallel mini toggle, and a Gotoh Custom
  510 two-point tremolo.
details: |-
  Featuring a sculpted shredder's cut heel and scalloped lower back bout for comfortable and unencumbered upper fret access, the Dinky alder body is paired with a graphite-reinforced bolt-on caramelized maple neck for rock-solid stability.

  The baked neck includes a silky-smooth hand-rubbed satin urethane finish on the back for sublime playability and incorporates Luminlay side dots to guide your way along the fretboard on dark stages. A heel-mounted truss rod adjustment wheel enables quick neck relief adjustments.

  Designed for high-speed playing, its 12"-16" compound radius ebony fingerboard features comfortable rolled edges, 24 jumbo frets, pearloid dot inlays and Graph Tech TUSQ XL nut.

  An HH pickup configuration consisting of a Seymour Duncan Full Shred TB-10 humbucking bridge pickup and Seymour Duncan Alnico II Pro APH-1N humbucking neck pickup is paired with a 500K EVH Bourns Low Friction volume pot, no-load tone control, 5-position blade switch and 2-position mini toggle for all-series/all-parallel switching.

  Other premium features include a Gotoh Custom 510 two-point tremolo bridge, Charvel-branded die-cast locking tuners and chrome hardware.
