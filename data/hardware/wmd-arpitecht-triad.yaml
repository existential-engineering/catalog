details: |-
  Expansion module for the Arpitecht

  A companion module to Arpitecht , Triad sends out three static voltages to be used with three oscillators in order to create chords underneath your Arpeggios. Triad connects to the back of Arpitecht via included ribbon cable and will adhere to the scale and transpose information set by it's master. Triad knob and CV input set different combinations so your chord can be completely unique, while still in key with your arpeggio. Inversion switch and CV input allow you to select three different chord voicings easily. Controls:

  Triad Knob: Selects the 3-note combination sent via CV. Becomes an offset with CV. Inversion Switch: Selects which inversion of the chord the Triad will play. Set at 0 for use with CV as it will "take over". Jacks:

  Note 1,2,3: CV outputs for use with 1V/Oct inputs on 3 oscillators. New: This output sends a trigger each time a new chord is made/selected. Inv: CV input for the inversion selection. Accepts 0V to +5V. - Thresholds for 1st and 2nd inversions are 1.25V and 2.5V respectively. Triad: CV input for Triad selection. Accepts 0V to +5V.
