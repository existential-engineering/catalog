description: Test out the power of the 4099 CORE+ with this kit.
details: |-
  Test out the power of the 4099 CORE+ with this kit. The case contains one each of our 2 versions of the 4099 CORE+ – one for loud SPLs and one for even louder, extreme SPL.

  Also included is a full complement of all our fabulous instrument clips, mounts and other accessories that make miking quick and easy.

  This fantastic kit includes the newest versions of our mics and accessories – including CORE+ and MicroLock®.

  What's in the box — Microphones: 1× 4099 CORE+ Mic (Loud SPL), 1× 4099 CORE+ Mic (Extreme SPL).

  Accessories: 1× Gooseneck Extension with MicroLock; 1× DAD9001 Adapter (MicroLock to 3-pin XLR with Belt Clip); 1× DAD9099 Adapter (MicroLock to XLR with Belt Clip & Low Cut); 1× DAD9003 Adapter for Sennheiser, Trantec, Shure and Wisycom systems; 1× DAD9010 Adapter for Shure, TOA and Line 6 systems; 1× MicroLock Extension Cable; 1× Heavy Duty MicroLock Extension Cable.

  Instrument clips: Accordion, Cello, Clamp Mount, Cold Shoe, Drum, Microphone Stand, Piano, Universal, Bass (BC4099), Guitar (GC4099), Sax and Trumpet (STC4099), Violin and Mandolin (VC4099), plus XLR Mount for Microphone Clips and 2× locking mechanisms for VC4099, GC4099 & STC4099.

  Packaged in a Peli Case.
specs: |-
  - Directional pattern: Supercardioid
  - Principle of operation: Pressure gradient
  - Cartridge type: Pre-polarized condenser
  - Frequency response: 20 Hz - 20 kHz
  - Effective frequency range ±2 dB, at 20 cm (7.9 in): 80 Hz - 17 kHz with 2 dB soft boost at 10-12 kHz
  - Sensitivity, nominal, ±3 dB at 1 kHz: 6 mV/Pa; -44 dB re. 1 V/Pa
  - Equivalent noise level, A-weighted: Typ. 23 dB(A) re. 20 μPa (max. 26 dB(A))
  - Distortion, THD < 0.5%: 135 dB SPL RMS, 138 dB SPL peak
  - Distortion, THD < 1%: 138 dB SPL RMS, 141 dB SPL peak
  - Dynamic range: Typ. 118 dB
  - Max. SPL, THD 10%: 145 dB SPL peak
  - Rated output impedance: From MicroLock: 30 - 40 Ω. From DAD9099 or DAD9001: 100 Ω
  - Cable drive capability: Up to 300 m (984 ft) with DAD9001/DAD9099 XLR Adapter
  - Output balance principle: Signal balanced with DAD9099 or DAD9001 XLR Adapter
  - Common mode rejection ratio (CMRR): > 60 dB from 50 Hz to 15 kHz with DAD9099 or DAD9001 XLR Adapter
  - Power supply (for full performance): For wireless systems Min. 5 V - max. 10 V through DPA adapter. With DAD9001 or DAD9099: P48 (Phantom Power). Will work from 12 V
  - Current consumption: Typ. 1.5 mA (microphone). 3.5 mA with DAD9099 or DAD9001 XLR Adapter
  - Connector: MicroLock
  - Microphone weight: 18 g (0.63 oz)
  - Microphone diameter: 5.7 mm (0.22 in)
  - Microphone length: 50 mm (1.97 in)
  - Gooseneck length: 140 mm (5.5 in)
  - Cable length: 1.8 m (5.9 ft) (not included with 4099-DP-1 and 4099-DP-2)
  - Cable diameter: 1.6 mm (0.06 in) / 2.2 mm (0.09 in)
  - Polarity: +V at MicroLock pin for positive sound pressure (and pin 2 on DAD9099 or DAD9001 XLR adapter)
  - Temperature range: -40°C to 45°C (-40°F to 113°F)
  - Relative humidity (RH): Up to 90%
  - Sensitivity selection tolerance (at 1 kHz): ±1 dB
  - Color: Black
