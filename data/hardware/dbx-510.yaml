name: dbx 510
manufacturer: dbx
primaryCategory: dynamics
url: https://dbxpro.com/en/products/510
description: The dbx 510 is a 500 Series subharmonic synthesizer module
  delivering patented bass enhancement technology in a single-slot format.
details: |-
  For decades, dbx's patented Subharmonic Synthesis has enhanced bass in professional applications including nightclub and DJ mixing, theatre and film sound, music recording, live performance, and broadcasting.

  The dbx process produces a new, waveform-modeled bass note exactly an octave below the original audio's bass content. The 510 features two separate bands of subharmonic synthesis with an independent Low Frequency Boost circuit designed for high-performance speaker systems.

  Unlike other bass synthesis approaches, dbx's process generates musical low frequencies that don't interfere with mid and high-band information, even at maximum synthesis and boost settings. The result delivers low-end punch designed to be felt by audiences.

  The 510 offers a simple, intuitive interface with synthesized frequency level indicator LEDs, individual controls for two ranges of subharmonic frequencies, subharmonics level control, and a Synthesis Bypass switch.
specs: |-
  - Input Type: Electronically balanced/unbalanced, RF filtered
  - Input Impedance: 20 kΩ balanced, 10 kΩ unbalanced
  - Maximum Input Level: +22 dBu
  - CMRR: >40 dB; typically >55 dB at 1 kHz
  - Output Type: Electronically balanced/unbalanced, RF filtered
  - Output Impedance: Balanced 30 Ω, unbalanced 15 Ω
  - Maximum Output Level: +22 dBu
  - Frequency Response: 20 Hz – 20 kHz, +0/–0.5 dB; 14 Hz – 120 kHz, +0/–3 dB
  - Noise: <–99 dBu, unweighted (22 Hz – 22 kHz)
  - THD+Noise: <0.003% typical, 22 Hz – 22 kHz at 0 dBu
  - Dynamic Range: >120 dB
  - Synthesis Frequency Range: 26–56 Hz (from 54–110 Hz input signal)
  - Power Requirements: +/– 16 V DC
  - Power Current Draw: 85 mA per power rail
  - Power Draw: 2.7 W
  - Rack Compatibility: 500 Series compatible power-frame
  - Rack Space: 1 slot
  - Dimensions: 5.25" × 1.5" × 6" (13.34 cm × 3.81 cm × 15.24 cm)
  - Weight: 1.3 lbs (0.59 kg)
  - Shipping Weight: 1.7 lbs (0.77 kg)
