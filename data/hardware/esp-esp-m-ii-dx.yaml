description: All ESP Original Series instruments are hand-crafted, one at a time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan. If you're ready to shine in the spotlight with a guitar built to the world's highest standards in reliability, speedy and precise playability, and versatile, powerful tones, the ESP M-II DX was made for you.
details: |-
  All ESP Original Series instruments are hand-crafted, one at a time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan. If you're ready to shine in the spotlight with a guitar built to the world's highest standards in reliability, speedy and precise playability, and versatile, powerful tones, the ESP M-II DX was made for you.

  Built using bolt-on construction at 25.5" scale, this guitar gleams in a brilliant Snow White Satin finish. It pairs a roasted alder body to a speedy thin u-shaped three-piece maple neck, then adds a flamed fingerboard with offset bar inlays, Luminlay side dots, a reverse matching-finish headstock, and 24 extra-jumbo stainless steel frets.

  The ESP M-II DX has a phenomenal component set that includes black hardware, ESP strap locks, Gotoh locking tuners, a Floyd Rose Original double-locking tremolo bridge, and a set of premier-class Seymour Duncan pickups: a TB-4 JB Trembucker in the bridge position, and an SH-1 '59 in the neck position with brushed chrome covers, providing full and powerful low end, crisp highs, and a sweet midrange bump for extraordinary clarity. Includes a deluxe ESP form fit case.

  Finish: Snow White Satin. Series: M-II Series, ESP Original Series. New for 2026.
specs: |-
  - Construction: Bolt-On
  - Scale: 25.5"
  - Body: Roasted Alder
  - Neck: 3Pc Maple
  - Fingerboard: Flamed Maple
  - Fingerboard Radius: 305mm
  - Finish: Snow White Satin
  - Nut Width: 42mm
  - Nut Type: Locking
  - Neck Contour: Thin U
  - Frets/Type: 24 XJ Stainless
  - Hardware Color: Black
  - Strap Button: ESP Strap Lock
  - Tuners: Gotoh Locking
  - Bridge: Floyd Rose Original
  - Bridge PU: Seymour Duncan JB Black Nickel Direct Mount (pull tone for split)
  - Neck PU: Seymour Duncan '59 Black Nickel Direct Mount (pull tone for split)
  - Electronics Layout: Volume / Tone (Push/Pull) / 3-way Switch
  - Strings: Elixir Nanoweb Super Light (.009/.011/.016/.024/.032/.042)
  - Case: MH Guitar Form Fit Case (included)
  - Certificate of Authenticity included
