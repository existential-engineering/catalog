description: All ESP Original Series instruments are hand-crafted, one at a
  time, by the world-renowned expert luthiers at the ESP Custom Shop in Japan.
  The M-II DX features bolt-on construction, a roasted alder body, a thin
  U-shaped 3-piece maple neck, a flamed maple fingerboard with offset bar
  inlays, Luminlay side dots, a reverse matching-finish headstock, and 24
  extra-jumbo stainless steel frets. It is loaded with Seymour Duncan pickups
  (TB-4 JB Trembucker at the bridge and SH-1 '59 at the neck), a Floyd Rose
  Original tremolo, Gotoh locking tuners, and ESP strap locks. Includes a deluxe
  ESP form-fit case.
