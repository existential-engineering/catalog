details: |-
  The Custom 24 is the quintessential PRS guitar: the iconic guitar that started it all back in 1985. The Custom 24-08 keeps all the foundational specs of the instrument, while taking the Custom platform to new sonic territories. Like the Core Series instrument, the SE Custom 24-08 features two mini-toggle coil-tap switches that individually tap the humbuckers for single coil sounds and a total of eight pickup configurations.

  Classic design elements include a maple top, mahogany back, rosewood fretboard, 24 frets, 25” scale length, bird inlays, signature headstock logo, and PRS patented tremolo.
specs: |-
  - Body Construction: Solidbody
  - Top Wood: Maple
  - Veneer: Flame Maple
  - Back Wood: Mahogany
  - Top Carve: Shallow Violin
  - Number of Frets: 24
  - Neck Wood: Maple
  - Neck Construction: Multi-Ply
  - Truss Rod: PRS Double-Acting
  - Neck Shape: Wide Thin
  - Fretboard Wood: Rosewood
  - Fretboard Inlay: Birds
  - Bridge: PRS Patented Tremolo
  - Tuners: PRS Designed Tuners
  - Hardware Type: Nickel
  - Nut: PRS
  - Treble Pickup: TCI “S”
  - Gig Bag: Controls
  - Down - humbucker mode: Up - single coil mode
