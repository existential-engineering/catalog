url: https://apiaudio.com/product/1608-ii-console/
description: Classic API Console with 16, 32, or 48 inputs and optional Final
  Touch Automation® system. Installed in over 600 studios worldwide,
  characterized as the quintessential American recording console with clean,
  crisp tone and flexible routing.
details: |-
  The API 1608-II is a large-format analog recording console available in 16, 32, or 48 input channel configurations. Each channel features a built-in API mic preamp and equalizer, with 12 API 550A equalizers and 4 API 560 graphic equalizers per base 16-channel frame. The console accepts API 500 Series Equalizers for customization.

  Routing includes 8 multitrack buses, 8 auxiliary buses, 1 stereo bus, and 4 stereo returns with 100mm faders. Center section provides 5.1 surround monitoring and classic analog metering with global 0dB fader bypass.

  The optional Final Touch Automation® system is self-contained requiring no external computer, featuring a 7.5" touchscreen interface, motorized faders, unlimited fader groups, and DAW control with unity gain audio bypass. Settings save to standard memory cards.
specs: |-
  - Available in 16, 32, or 48 input channel frame sizes
  - 8 multitrack buses, 8 auxiliary buses, 1 stereo bus
  - 4 stereo returns with 100mm faders
  - 12 API 550A + 4 API 560 equalizers per 16-channel frame
  - API 500 Series Equalizer slot compatibility
  - 5.1 surround monitoring
  - Classic analog metering
  - Global 0dB fader bypass
  - Unlimited fader groups, 2 dedicated Group Master Faders
  - Optional Final Touch Automation® (7.5" touchscreen, motorized faders)
