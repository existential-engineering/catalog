description: The iQ7 is a mid-side stereo condenser microphone for Lightning-equipped iPhone, iPad and iPod touch devices, with a three-way switch for 90 degrees, 120 degrees or raw mid-side recording. A rotating mechanism keeps left-right orientation correct for audio or for audio shot with video, and a front-facing MIC GAIN knob, LED level meters and a headphone jack that doubles as a line output sit on the body.
details: |-
  For the iPhone, iPad and iPod touch. When you are ready to take your iOS audio to the next level, plug in a Zoom iQ7. This compact yet full-featured mid-side stereo condenser mic is perfect for capturing music as well as video with outstanding audio, so you can create great-sounding recordings on an iPhone, iPad or iPod touch any time, any place.

  The iQ7 offers advanced features for stereo recording. A large front-facing MIC GAIN knob sets the optimum input level, and three-segment LED level meters guard against signal overload. A dedicated headphone jack, which doubles as a line output, allows monitoring during both recording and playback.

  The iQ7 works with all Lightning-equipped iOS devices. It comes with an extended Lightning connector and a removable spacer for compatibility with most iPhone, iPad and iPod cases, so the case can stay on. The rotating mechanism ensures correct left-right stereo orientation whether the recording is audio-only or audio for video.

  Mid-side is an advanced recording technique that allows the width of the stereo image to be varied, even in post-production. The two microphone elements in the iQ7 include a directional mid mic that captures signal coming from directly in front of the iOS device, and a bidirectional side mic that captures the audio coming from both sides. A three-way switch selects between 90 degrees, to focus on sounds coming from the centre, and 120 degrees, for a wider image that includes ambience and room signal. A third setting, labelled M-S, records the audio raw so its stereo width can be adjusted afterwards in the free Handy Recorder iOS app.

  The free Handy Recorder app from the App Store adds overdubbing to iQ7 stereo recordings, fine editing in a waveform display, saving in linear PCM or AAC, and onboard effects such as compression, EQ and reverb. The iQ7 is also compatible with most iOS apps that support input from an external microphone, including Voice Memos and GarageBand, as well as other popular music recording, voice recognition and streaming apps. For optimum audio quality, the Handy Recorder app supports a sample rate of 48 kHz.
specs: |-
  - Microphone: mid-side (M-S) stereo mic, switchable 90 degrees / 120 degrees / M-S raw
  - Output connector: stereo mini 1/8-inch jack (combined headphone and line level output)
  - Audio quality: 48 kHz/16-bit
  - Input gain: +3 to +43 dB
  - Maximum input sound pressure: 120 dB SPL
  - Connector: Lightning connector, with extended reach and a removable spacer for cased devices
  - Power: powered by the connected iOS device
  - Three-segment LED clip meter and front-facing MIC GAIN knob
  - Supported OS: iOS 6 to 26, iPadOS 13 to 26
  - Compatible devices: iPhone 5 through 14 Pro Max, iPod touch 5th to 7th generation, iPad 4th to 9th generation, Air, Air 2, Air 3, mini to mini 5, Pro and Pro 2
  - Not compatible with video or voice call apps
  - Included accessories: operation manual, foam windscreen
  - Optional accessories: hairy windscreen (WSU-1)
  - Dimensions: 54.5 mm (W) x 57.2 mm (D) x 26.5 mm (H)
  - Weight: 30.5 g
