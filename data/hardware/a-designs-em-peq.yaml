details: |-
  The EM-PEQ is a 500-Series single-slot module that faithfully recreates the
  legendary Pultec EQP-1A passive equalizer design in a compact, modern format.
  It is API VPR Alliance approved and handmade in the USA.

  The unit features a three-band EQ with the classic Pultec control layout.
  The low band offers boost and attenuation at 20Hz, 30Hz, 60Hz, or 100Hz.
  The mid-high band provides adjustable bandwidth and boost at 3k, 4k, 5k,
  6k, 10k, 12k, and 16kHz. The high attenuation band operates at 5k, 10k,
  or 20kHz.

  Premium components are used throughout, including a custom-tapped Cinemag
  inductor matched to original Pultec values, a nickel-core Cinemag output
  transformer, Gold Grayhill rotary switches, and Wima capacitors. A discrete
  Class AB output amplifier and true hard-wired bypass round out the signal
  path.

  The EM-PEQ is fully balanced for noise-free performance and requires 48V
  from the 500-series rack to operate. Its broad, musical equalization curves
  make it suitable for tracking, mixing, and mastering applications on vocals,
  guitars, bass, drums, acoustic instruments, and stereo bus processing.
specs: |-
  - Format: 500-Series single-slot module
  - Three-band EQ with classic Pultec EQP-1A control layout
  - Low band: Boost/attenuation at 20Hz, 30Hz, 60Hz, or 100Hz
  - Mid-high band: Bandwidth and boost at 3k, 4k, 5k, 6k, 10k, 12k, 16kHz
  - High attenuation band: 5k, 10k, 20kHz
  - Boost/attenuation range: 0dB to ±10dB
  - Fully balanced, noise-free performance
  - True hard-wired bypass
  - Custom-tapped Cinemag inductor (matched to original Pultec values)
  - Nickel-core Cinemag output transformer
  - Gold Grayhill rotary switches
  - Wima capacitors
  - Discrete Class AB output amplifier
  - Requires 48V to operate
  - API VPR Alliance approved
  - Handmade in USA
  - 1-year full warranty
