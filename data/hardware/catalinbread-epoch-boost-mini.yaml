details: |-
  The Epoch Boost Mini is Catalinbread's miniaturized version of their acclaimed Epoch Boost, replicating the preamp circuit of the Maestro Echoplex EP-3 tape echo unit.

  While many guitarists used the EP-3 for its echo effect, the most discerning players dragged one to every gig purely for its always-on preamp circuit, which provided significant tonal enhancement regardless of the echo setting. The preamp added a distinctive quality that became a foundational element of some of rock's greatest tones — from Eddie Van Halen to East Bay Ray of the Dead Kennedys.

  The Epoch Boost Mini runs at the original 22V operating voltage via an internal charge pump (powered from a standard 9V supply), delivering high-headroom punch and the same tonal character as the original unit. The Preamp control functions as a hybrid volume/EQ pan — below noon it acts as a volume control, while above noon it introduces gentle frequency enhancement. The Boost control sets gain level, adding sparkle and volume.

  Do not exceed 9V input — the internal charge pump converts to 22V internally, and exceeding 9V input voids the warranty.
