description: The OC-S10 is Austrian Audio's flagship large-diaphragm condenser
  microphone, built to put voices and solo instruments front and center.
  Handcrafted in Vienna, it features multiple polar patterns (Omni, Wide
  Cardioid, Cardioid, Hypercardioid, Figure-of-Eight), dual XLR outputs for
  independent capsule recording, and a fully discrete signal path.
details: |-
  The OC-S10 features the handcrafted CKR12 1-inch true condenser capsule with a ceramic backplate and Open Acoustic design that minimizes internal reflections for fast transient response and low distortion.

  Five selectable polar patterns (Omni, Wide Cardioid, Cardioid, Hypercardioid, Figure-of-Eight) and dual XLR outputs allow each capsule membrane to be recorded independently, enabling post-production polar pattern adjustment via Austrian Audio's PolarDesigner and StereoCreator plug-ins.

  Three switchable low-cut filters at 40 Hz, 80 Hz, 160 Hz and two pad options (-10 dB, -20 dB). Integrated metal foam pop filter built into the capsule housing.

  Handcrafted in Vienna, Austria. Winner of TEC Award 2026.
specs: |-
  - Frequency Range: 20 Hz – 22 kHz
  - Sensitivity: 14 mV/Pa
  - Equivalent Noise Level: 8 dB SPL (A)
  - Maximum SPL: 147 dB SPL (157 dB SPL with pad)
  - Output Impedance: 108 Ω (symmetrical)
  - Supply Voltage: 48V phantom power (< 3 mA)
  - Connectors: 2× XLR 3-pin
  - Polar Patterns: Omni, Wide Cardioid, Cardioid, Hypercardioid, Figure-of-Eight
  - Low-cut filter: 40 Hz, 80 Hz, 160 Hz switchable
  - Pad: -10 dB, -20 dB switchable
  - Capsule: CKR12, 1-inch true condenser with ceramic backplate
  - Dimensions: 205 × 63 × 63 mm
  - Weight: 710g
