description: >-
  The S2000 is a professional, user-expandable studio sampler with 2MB base memory
  expandable to 32MB, offering variable sampling rates and comprehensive editing tools.
details: |-
  Professional studio sampler with expandable memory configuration. Base model includes 2MB sample memory which can be expanded to 32MB total capacity.

  Sampling specifications support variable rates from 22kHz to 44.1kHz in both stereo and mono modes, with 16-bit or 8-bit resolution options.

  Comprehensive editing suite includes time compression/expansion, tuning, pitch shifting, truncation, looping, key placement, and velocity effects.

  Offers up to 32 voices of polyphony with complete MIDI implementation across 16 channels. Features built-in disk drive and SCSI interface for studio integration.

  Expandable design allows addition of up to eight outputs, digital I/O, four effects processors, expanded filters, EQ, and alternate internal disk storage to approach S3200-series capabilities.
specs: |-
  - Polyphony: 32 voices
  - Sampling rates: 22 to 44.1 kHz
  - Bit depth: 8-bit or 16-bit
  - LFO: 2 LFOs
  - Filter: 12 dB resonant filtering
  - Effects: Up to 4 effects
  - Memory: 48 MB total (2 MB base expandable to 32 MB plus 16 MB ROM Card)
  - Control: MIDI (16 channels)
releaseDate: "1995"
