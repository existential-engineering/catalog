description: High-performance large-diaphragm studio condenser microphone with a
  34mm pure gold-sputtered diaphragm in a cardioid polar pattern. Handles
  sources up to 135dB SPL with a switchable −10dB pad and high-pass filter.
  Includes a suspension shockmount, pop filter, and flight case.
details: |-
  Large-diaphragm cardioid condenser. 34mm pure gold-sputtered diaphragm. Sensitivity −36dB ±2dB (0dB=1V/Pa @ 1kHz), output impedance 50Ω ±30%, min load impedance 1kΩ, max SPL 135dB, S/N 80dB. Freq response 20Hz–20kHz. Requires 48V phantom power. Switchable high-pass filter and −10dB pad. 3-pin XLR male connector at base. Dimensions: 1.98" × 7.4", 14.7 oz. Includes suspension shockmount (5/8" fitting), pop filter, flight case, and 5/8"–3/8" thread adapter.
specs: |-
