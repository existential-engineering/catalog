  - Output impedance: 50Ω ±30%; min load: 1kΩ
  - Max SPL: 135dB; S/N: 80dB
  - Freq response: 20Hz–20kHz
  - Power: 48V phantom
  - Connector: 3-pin XLR male
  - Weight: 14.7 oz
