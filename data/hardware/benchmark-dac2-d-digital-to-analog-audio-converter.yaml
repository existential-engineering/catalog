description: The DAC2 D is a 2-channel digital-to-analog converter designed for
  professional studio and high-fidelity audio applications, featuring lower
  noise and distortion than its predecessor. It emphasizes transparency and
  accuracy for critical monitoring and reference-quality playback.
details: |-
  The Benchmark DAC2 D is a 2-channel digital-to-analog converter built for professional studio monitoring and high-fidelity playback. It succeeds the DAC1 series with significant improvements in noise floor and distortion performance, achieving a dynamic range of 126 dB (A-weighted) and THD+N of -109 dB at 1 kHz, 0 dBFS.

  The unit supports native DSD conversion via DoP 1.1 and asynchronous USB 2.0 (up to 192 kHz) as well as USB 1.1 (up to 96 kHz). Five digital inputs are provided: one asynchronous USB, two coaxial S/PDIF, and two optical Toslink.

  The DAC2 D incorporates Benchmark's UltraLock2 jitter attenuation system and Quad 32-bit Balanced D/A Conversion with 3.5 dB of internal headroom. It also includes a Hybrid Gain Control, polarity switch, home theater bypass, and sample rate/word-length display indicators.

  Designed, assembled, and tested in the USA. Discontinued and replaced by the DAC2 DX.
specs: |-
  - Dynamic Range: 126 dB (A-Weighted), 123 dB (Unweighted)
  - THD+N: -109 dB at 1 kHz, 0 dBFS
  - Frequency Response: +0/-0.04 dB (20 Hz to 20 kHz at 96 kHz sample rate)
  - Internal Processing: 32-bit with 3.5 dB headroom
  - Native DSD conversion with DoP 1.1 support
  - Asynchronous USB 2.0 (up to 192 kHz) and USB 1.1 (up to 96 kHz)
  - 5 digital inputs: 1x USB, 2x Coaxial S/PDIF, 2x Optical Toslink
  - Balanced XLR and unbalanced RCA stereo analog outputs
  - HPA2 headphone amplifier with dual 1/4-inch jacks
  - UltraLock2 jitter attenuation system
  - Quad 32-bit Balanced D/A Conversion
  - Hybrid Gain Control, polarity switch, home theater bypass
  - Power consumption: 12W typical
