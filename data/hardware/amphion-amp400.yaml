url: https://amphion.fi/products/amp400/
description: The Amp400 is a multichannel power amplifier available in 8-channel
  and 12-channel configurations, delivering rock-solid control and tight, fast,
  highly resolving low-distortion power with a proprietary buffer stage
  complementing Class-D technology.
details: |-
  The Amp400 is Amphion's multichannel power amplifier designed for professional studio and immersive audio applications. It is available in two configurations: the Amp400.8 (8-channel) and the Amp400.12 (12-channel), both housed in a 19-inch 3U rack-mountable aluminum chassis assembled in Finland.

  At its core, the Amp400 features a proprietary in-house designed buffer stage that complements Class-D amplification technology, resulting in tight, fast, and highly resolving low-distortion power delivery. The amplifier delivers 410W into 4Ω or 205W into 8Ω per channel.

  The Amp400 achieves a dynamic range of 121.5 dB(A), making it well-suited for high-resolution monitoring environments. Inputs are balanced XLR female connectors, while speaker outputs use Neutrik Speakon NL2FX 2-pole connectors.

  The power supply is universal mains auto-select, supporting 100–240V at 50–60Hz, making the unit compatible worldwide.
specs: |-
  - Power output: 410W @ 4Ω / 205W @ 8Ω (1% THD+N, 20Hz–20kHz)
  - Dynamic range: 121.5 dB(A)
  - Input connectors: Balanced 3-pin XLR female
  - Speaker output connectors: Neutrik Speakon NL2FX 2-pole
  - Power supply: Universal mains, auto-select (100–240V, 50–60Hz)
  - Chassis: 19" rack-mountable, 3U, aluminum
  - Dimensions: 483W × 133H × 330D mm
  - Weight (Amp400.8): 7.5 kg | Weight (Amp400.12): 8 kg
  - Configurations: 8-channel (Amp400.8) or 12-channel (Amp400.12)
  - Amplifier technology: Class-D with proprietary buffer stage
  - Assembled in Finland
