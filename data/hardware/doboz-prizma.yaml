details: |-
  Prizma is a versatile and powerful sequencer for Eurorack modular systems. A composition tool focusing on the creation of complex melodic and rhythmic progressions, utilizing the principles of controlled unpredictability, with the ability to determine the timing and location of randomness and the degree to which it influences your sequences. The module features 2 tracks of CV and GATE outputs which are driven by a 16-step sequencer, an auxiliary sequencer with its own clock divider, and further sub-circuitry that shapes the eventual output results.
