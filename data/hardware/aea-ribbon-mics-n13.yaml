details: |-
  The AEA N13 is designed to be natural and open at a mid-field distance, with a particularly strong ability to pick up fast transients. Relatively bright for a ribbon mic, the N13 microphone excels in capturing drum overheads, strings, acoustic guitars, and piano.

  With phantom-powered JFET electronics and a custom German transformer, the N13 performs equally well with a wide range of preamps ranging from vintage high-end models to USB audio interfaces common in home studio setups. The full potential of the N13 is perhaps best realized when configured in the NUVO Stereo Kit, as it draws on the same successful sonic concepts as the AEA R88 stereo mic.

  AEA's NUVO series microphones have long been user favorites for their clarity, portability, and higher-output active electronics. The near-field N22 delivers clarity and balance for close-up sources, while the far-field N8 excels at capturing the open, natural tonality of entire rooms and ensembles. The N13 is the mid-field companion to these designs, featuring a new motor design and a thinner, smaller ribbon (1.2 microns, rather than the standard 1.8), making it AEA's first non-Big Ribbon™ bidirectional microphone.

  Bright and sonically distinct from the N22 model, the N13 excels in capturing the subtle nuances of strings, acoustic guitars, and percussion. It is also well-suited for any sources that could use a boost in top-end clarity. Handcrafted in Pasadena, CA, USA.
specs: |-
  - Transducer type: Active ribbon (bidirectional / figure-8 polar pattern)
  - Ribbon thickness: 1.2 µm (thinner than AEA's standard 1.8 µm Big Ribbon™)
  - Electronics: Phantom-powered JFET active electronics
  - Transformer: Custom German transformer
  - Optimal working distance: Mid-field (~8"–36")
  - Finish: Low-profile slate gray
  - AEA's first non-Big Ribbon™ bidirectional microphone
  - Handcrafted in Pasadena, CA, USA
