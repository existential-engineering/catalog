description: The DS2H is a 12-fret slope shoulder dreadnought based on the
  original oversized Hawaiian guitar shape developed nearly a century ago. Built
  with a Sitka spruce top and East Indian rosewood back and sides, it delivers
  an open, airy tone with smoothness and warmth suited to both flatpicking and
  fingerstyle playing. Herringbone purfling and abalone long diamond and square
  inlays place it in the middle of the DS lineup.
details: |-
  The DS2H revives the original 12-fret dreadnought shape, first designed as an oversized Hawaiian guitar almost a century ago. The neck meets the body at the 12th fret, giving the instrument more body resonance and a warmer, fuller low-end response compared to a standard 14-fret dreadnought. The Sitka spruce top is braced with a pre-war scalloped X-brace pattern, supporting dynamic response across a wide range of playing styles. East Indian rosewood back and sides contribute sustain and tonal complexity, while the Honduran mahogany neck with a modified V profile provides a comfortable vintage feel. The ebony fingerboard features abalone long diamond and square inlays, and the body is bound in ivoroid with herringbone purfling.
specs: |-
  - Top: Sitka spruce
  - Back & Sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony with abalone long diamond & squares
  - Scale Length: 25 1/2"
  - Nut Width: 1 13/16"
  - Fingerboard Radius: 14" - 26" compound
  - Bridge: Ebony belly-style, 2 3/8" spacing
  - Saddle: Bone, drop-in
  - Neck Profile: Modified V
  - Neck Joint: Mortise & tenon hybrid
  - Frets: Medium 18% nickel-silver
  - Tuners: Nickel Waverly
  - Body Binding: Ivoroid with herringbone purfling
  - Rosette: iv/tort/iv & b/w purflings
  - Backstrip: 2-style (Zipper)
  - Bridge Pins/End Pin: Ebony with MOP dot
  - Pickguard: Tortoise
  - Brace Pattern: Pre-war scalloped X-brace
  - Body Finish: High gloss nitrocellulose lacquer
  - Neck Finish: High gloss polyester resin
  - Body Width: 15 5/8"
  - Body Length: 20 7/8"
  - Body Depth: 4 7/8"
  - Total Length: 40 1/8"
  - Strings: D'Addario EJ-17 (.013"-.056")
