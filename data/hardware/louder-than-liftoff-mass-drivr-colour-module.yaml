description: Classic American console sound in the Colour format. The Mass Drivr
  is inspired by discrete line amplifiers found in vintage 1970s American
  recording consoles. Features a custom American-made steel output transformer
  and an integrated 2520-style Rogue Six discrete op amp. Compatible with DIYRE
  Colour format and Louder Than Liftoff Chroma hosts.
details: |-
  The Mass Drivr circuit draws inspiration from discrete line amplifiers in vintage 1970s American recording consoles. A custom steel output transformer contributes to the classic American console character. The integrated 2520-style Rogue Six discrete op amp is built in. The module is analog plugin compatible with Chroma, allowing 'A' into 'N' or 'A' into 'A' gain staging. Compatible with Silver Bullet mk2, Chroma 500 Series, Chroma+, Mister Focus, and DIY Recording Equipment hosts. Ships in 3-5 business days when in stock.

specs: |-
