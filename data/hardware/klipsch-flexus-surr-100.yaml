details: |-
  The Klipsch Flexus Surr 100 are wireless surround speakers designed for multichannel home theater systems. Sold as a pair, each speaker plugs directly into a wall outlet using a right-angle IEC power cord — no junction boxes, dongles between units, or speaker wire required.

  Connectivity is handled by Klipsch Transport technology, a proprietary wireless protocol that enables low-latency multi-channel audio when paired with a Flexus Core soundbar and optional Flexus Subwoofer. USB ports are present on each unit for firmware updates and MP3 file playback for test/debug purposes.

  Each speaker houses a single 3-inch paper cone full-range driver in a sealed plastic and metal enclosure. Controls, power indicators, and LED lights are recessed on the bottom surface. The speakers are compatible with the Klipsch Connect Plus app, which provides EQ presets, Night Mode, Dialogue Boost, and volume control. The system is manufactured in partnership with Onkyo.
