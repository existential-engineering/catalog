description: The DDJ-S1 offers familiarity, innovation and pure controllerism to
  maximize performance with Serato DJ Pro software (which is included ). A Plug
  and Play connection via USB, a unique XLR input/output to connect directly to
  professional PA equipment, and a microphone talk-over feature makes the DDJ-S1
  the perfect home or mobile DJ set-up. The space for laptop keyboards under the
  controller eliminates set-up issues, and places the screen in the DJ’s line of
  sight at all times. The controller’s layout inherits tried and tested Pioneer
  functionality , offering excellent operability. The controls include an
  alphabetic search function for quick song selection and a slip mode for
  momentary looping, reversing and scratching without losing the song position
  on return. A dedicated effect control area allows you to add Serato DJ Pro FX
  to your mixes, while the master and channel level meters allow you to monitor
  while adjusting the volume. A Playing Address feature displays track
  progression on an LED display, while the needle search function allows DJs to
  quickly skip through a song to a preferred playback point. Optimised audio
  circuitry in the master output area, borrowed from Pioneer pro-DJ equipment,
  ensures high quality sound that has beaten the competition hands down in
  listening tests. This, coupled with audio characteristics optimised for Serato
  DJ Pro softwar e, ensure superior sound delivery. All buttons are pre-assigned
  to the software functions, and the controller can be connected to the computer
  via USB cable, meaning DJs can truly “Plug and Play”. The DDJ-S1 can also be
  powered by the USB port of a computer.
