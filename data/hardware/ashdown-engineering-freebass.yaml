description: FreeBass is a UHF diversity wireless system designed specifically
  for bass guitar, engineered to faithfully reproduce the low frequencies and
  high dynamics of a bass signal over a wireless link. The receiver adds a
  Modeling control that selects between 16 DSP-enhanced bass settings. Both
  receiver and transmitter feature large backlit displays and an intuitive menu
  for frequency selection, sensitivity and muting.
details: |-
  FreeBass is described as the first UHF diversity wireless system designed and engineered specifically for bass guitar. Unlike conventional wireless systems, it overcomes the difficulty of faithfully reproducing the low frequencies and high dynamics typical of a bass guitar signal over a wireless link, giving bassists stage freedom without compromising tone. A Modeling control on the receiver selects between 16 DSP-enhanced bass settings for added sonic versatility. Both the receiver and transmitter feature large backlit displays and an intuitive menu system for controlling functions including frequency selection, sensitivity and muting. The rear panel of the receiver provides an unbalanced jack output for connection to a bass amplifier and a balanced XLR output for direct connection to a PA system.
specs: |-
  - UHF diversity wireless system for bass guitar
  - Modeling control: 16 DSP-enhanced bass settings
  - Backlit displays on receiver and transmitter
  - Menu control of frequency selection, sensitivity and muting
  - Receiver rear panel: unbalanced jack output for bass amplifier
  - Receiver rear panel: balanced XLR output for PA
