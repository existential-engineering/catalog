description: FUMANA is a dual all-analog fixed filter bank built from two arrays
  of sixteen bandpass filters, one that processes a sound and one that analyses
  it. Sixteen voltage-controllable faders, per-band envelope followers and
  global parametric controls let it work as a spectral editor or as a
  sixteen-band vocoder.
details: |-
  FUMANA is a dual all-analog fixed filter bank. Each filter bank is composed of an array of 16 independent bandpass filters tuned to specific frequencies. It is built around one basic core principle: modify the spectral content of an incoming audio signal by filtering it through 16 bandpass filters in parallel, then vary the amplitude of each resulting band.

  Simple as that principle is, the key feature of FUMANA is the breadth of control it offers over the bands' amplitude. The spectrum of the incoming sound can be modified by the faders, which are individually CV-controllable, by the envelope followers generated from the analysis of the sound patched into the Modulation input, and by global parametric controls such as Tilt and Scan.

  The two arrays serve different jobs. The first, with 48 dB/oct filters, is the colorful processing path for the incoming sound, while the second, with 36 dB/oct filters, analyzes a sound and extracts sixteen envelopes for spectral transferring. Four voltage-controlled functions, Tilt, Peak/Notch, Center and Width, animate the timbre above the sixteen individual faders.

  A flexible input and output routing lets the musician split the 16 filters into two 8-band spectral processors by grouping the odd and even bands separately. Two semi-normalled inputs make it possible to process two independent signals, to blend two signals into a single All output, to route one signal's odd and even bands to two different points of a patch for a stereo spread, or to perform two different treatments of the same signal and send each to its own output section.

  Because the parallel analysis array covers all sixteen bands, FUMANA performs spectral transferring and vocoding over the whole spectrum, or two simultaneous eight-band vocoding operations using different sounds for the odd and even bands. Attack and release times of the spectral transferring are set independently, and individual outputs are available for each band, both for the Main filtered sound and for the Mod envelopes, so analysis bands can be re-routed to synthesis bands by hand as in classic analog vocoders. A global Envelope Follower output drives external ducking or other parallel processing, and a dedicated input for an external noise source supplies fricative and sibilant sounds.
specs: |-
  - Two arrays of sixteen analog bandpass filters: 48 dB/oct for processing the sound and 36 dB/oct for analysing it
  - Sixteen faders set each band's amplitude and are individually voltage-controllable
  - Four voltage-controlled global functions: Tilt, Peak/Notch, Center and Width
  - Two semi-normalled inputs split the sixteen filters into odd and even eight-band spectral editors
  - Odd and even grouping allows two sounds merged to a single All output, one sound split to two points of a patch for stereo spread, or two separate sounds with independent routing
  - Spectral transferring and vocoding across all sixteen bands, or two eight-band vocoding operations at once on the odd and even bands
  - Independent attack and release control over the spectral transferring
  - Individual outputs for every band, for the Main filtered sound and for the Mod envelopes, so analysis bands can be re-routed to synthesis bands by hand
  - Global Envelope Follower output for external ducking or parallel processing
  - Dedicated external noise input for fricative and sibilant sounds
  - Eurorack module, bus-powered from the case's power header, with no power jack of its own
