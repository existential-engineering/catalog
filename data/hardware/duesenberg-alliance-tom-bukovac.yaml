details: |-
  The Alliance Series Tom Bukovac is a signature model built around Duesenberg's classic semi-hollow construction, with bent sides, an arched top and back and a solid centreblock. That layout is intended to give a distinct tonal response while keeping the feedback resistance of a solid body. The body carries a laminated quilted maple top with laminated flamed maple back and sides, multi black and white binding, a cat-eye f-hole and a custom black pickguard, finished in PUR lacquer.

  The neck is a set three-piece flamed maple neck in a Medium D shape, topped with an Indian rosewood fingerboard at a 305 mm / 12 inch radius and 22 jumbo frets over a 648 mm / 25.5 inch scale. The 12th fret carries a "SESSION MAN" inlay, and the rosewood headstock carries a silver leaf "D" inlay. A steel dual-action truss rod sits inside the neck.

  Electronics are a pair of Duesenberg GrandVintage humbuckers, which the maker describes as delivering a wide, clear and defined tone without noise, with pickup baseplates and open covers made from German silver so that the material does not colour the signal at the start of the chain. An additional piezo pickup sits inside the bridge and is switched in with a small switch on the pickguard, then blended against the magnetic pickups with Duesenberg's Multi-Tone control for a brighter, more responsive voice suited to fingerstyle work. Controls are one volume, one tone, a three-way pickup selector and the piezo switch.

  Hardware is nickel finished throughout and includes Duesenberg open Z-Tuners, a Duesenberg Steel Saddle Piezo Bridge and the Diamond Deluxe Tremola vibrato, whose arm rotates freely through 360 degrees and can be set to a preferred angle and length, with needle and nylon bearings carrying the action. On this model the usual metal three-step brace that holds the pickguard in place is removed to give more freedom of movement for fingerstyle playing.

  The instrument ships with a Duesenberg Custom Line case as standard, along with all required allen keys.
specs: |-
  - Neck type: Set Neck, 3-piece Flamed Maple
  - Neck width: 42.5 mm / 1.67" (nut), 52 mm / 2.05" (12th fret)
  - Neck thickness: 21 mm / 0.8" (1st fret), 24 mm / 0.95" (12th fret)
  - Neck shape: Medium D
  - Fingerboard: Indian Rosewood, radius 305 mm / 12"
  - Inlays: 12th fret "SESSION MAN"
  - Frets: 22 Jumbo 2.8 x 1.0 mm
  - Scale length: 648 mm / 25.5"
  - Trussrod: Steel dual-action
  - Headstock: Rosewood, silver leaf "D" inlay
  - Body type: Semi-hollow with sustain block, bent sides, f-hole
  - Top: Laminated Quilted Maple
  - Back, sides: Laminated flamed Maple
  - Dimensions: 46 x 34 x 7 cm / 18.11" x 13.38" x 2.75"
  - Height (sides): 4.5 cm / 1.8"
  - Binding: Multi black&white
  - Pickguard: Custom Black
  - Finish: PUR lacquer
  - Tuners: Duesenberg open Z-Tuners
  - Bridge: Duesenberg Steel Saddle Piezo Bridge
  - Vibrato System: Duesenberg Diamond Deluxe Tremola
  - Strap pins: Duesenberg Standard (Straplock compatible)
  - Hardware color: Nickel
  - Strings: Duesenberg Custom 10/50 (010-013-017-028-042-050)
  - Pickup (neck pos.): Duesenberg GrandVintage Humbucker
  - Pickup (bridge pos.): Duesenberg GrandVintage Humbucker
  - Pickup (bridge): Piezo
  - Wiring: 1 Volume, 1 Tone, 3-Way Pickup Selector, Piezo switch
  - Case: Custom Line case (included)
  - Tools: All required allen keys (included)
