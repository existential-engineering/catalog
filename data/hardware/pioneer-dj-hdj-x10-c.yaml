description: We’ve enhanced our flagship HDJ-X10 professional DJ headphones to
  bring you the premium, limited-edition carbon fibre HDJ-X10C. The special
  materials used in this one-off model not only deliver a premium look, but also
  help you listen to your tracks with pristine sound quality and lasting comfort
  during those marathon DJ sets.
details: |-
  ### Premium sound quality

  Monitor your music with crisp, high-resolution sound thanks to the same 50 mm HD drivers used in the HDJ-X10 headphones. In addition, the housings are made of carbon materials that eliminate unwanted vibration and noise, while the inclusion of metal mesh maximises the performance of the HD drivers, so you’ll hear your mixes with the clarity they deserve.

  ### Enhanced comfort

  We’ve improved the flexible headband with breathable, punched leather to ensure they still feel comfortable at the end of those long, hot performances.

  ### One-off look

  Stand out in the DJ booth with this limited-edition design that features premium carbon-fibre elements and gold finishes. Along with the headphones themselves, we’ve transformed the high-quality polyurethane leather carry case with gold hues so they maintain their refined look on the move.

  ### Improved durability

  Having cleared the US Military Standard MIL-STD-810G Shock test2 and with extra-durable aramid material on the straight cable, the HDJ-X10C DJ headphones are highly robust.

  ### Nano coating

  The polyurethane leather ear pads and headband cushion on the HDJ-X10C headphones are resistant to deterioration thanks to the use of nano coating which allows you to easily wipe off sweat and dirt.

  ### 3-year warranty

  Count on long-term, reliable performance from your HDJ-X10C headphones. A 3-year warranty has got you covered.

  ### Excellent portability

  Protect your headphones from damage on the road with the high-quality polyurethane-leather flat carry case. Featuring gold accents to match your HDJ-X10C, it fits easily into travel bags and provides space for extra USB devices and SD cards.

  ### Various accessories included

  The HDJ-X10C headphones come with a detachable 1.2 m coiled cable, a 1.6 m aramid fibre-coated straight cable and an L-type mini-jack to prevent accidental disconnection.
