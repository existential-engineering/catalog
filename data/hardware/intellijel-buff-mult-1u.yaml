description: Mighty Multiplier Multiply one audio/CV signal into eight perfect
  copies or two signals into two sets of four. Multiply your sequencer out to
  multiple oscillators and send a third copy to your favorite modulation input.
details: |-
  Turn one audio or CV signal into eight copies, or two signals into two sets of four. This is very useful when setting up all kinds of patches where you want to route one source to multiple destinations.
specs: |-
  - Width: 14HP
  - Depth: 29mm
  - Power: 4mA @ +12V, 17mA @ -12V
  - Top section normalled to bottom section for single-signal 1x8 duplication
  - Active buffered design maintains voltage accuracy and electrical isolation from faults or shorts
