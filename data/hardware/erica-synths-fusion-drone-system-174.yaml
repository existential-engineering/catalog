description: Erica Synths Fusion Drone System is here for those, who want to
  explore the dark territories of the sound, where only few have stepped in.
details: |-
  Vacuum tube based Erica Synths Fusion Series modules are the basis for this system, while Black Modulator and Black Envelope Generator add plenty of modulation and noise generation possibilities. It has 43 patch points for extensive experiments in sound design, with an all analogue signal and CV path to create drones of massive power. For a solid bassline with great 1V/oct tracking, a CV/Gate sequencer or keyboard drives the system directly.

  The Fusion VCO uses two double triodes in a bistable latch connection as suboscillators at minus one and minus two octaves, with plenty of mixing opportunities for amazing sonic results, and an external audio signal can replace the internal VCO. The Fusion Ringmodulator V2 enriches the sound with germanium diodes that add extra harmonic content, while a vacuum tube adds evilish overdrive to the audio and carrier signals. In the Fusion VCF V2 each side of the double triode drives the signal between the second and third stage of the filter, and germanium diodes limit the output signal.

  The Fusion VCA V2 is built around a Russian miniature pentode with power consumption comparable to an LED, and the Fusion Delay/Flanger/Vintage Ensemble combines BBD chip based effects with an adjustable tube overdrive in the delay output and a feedback path for extra thickness of the sound.

  Three Black series modules complete the system. Black Modulator is a fully analogue modulation and noise source, Black EG gives control over envelopes in the modular system, and Black 8-Multi is an active buffered multiple with signal status LEDs that serves as an advanced replacement for stackable patch cables.

  The system is housed in a 104HP one row skiff case and ships with 20 patch cables.
specs: |-
  - 43 patch points
  - All analogue signal and CV path
  - Fusion VCO with two double triodes as suboscillators at -1 and -2 octaves
  - Fusion Ringmodulator V2 with germanium diodes and a vacuum tube overdrive
  - Fusion VCF V2 with double triode and germanium diode output limiting
  - Fusion VCA V2 based on a Russian miniature pentode
  - Fusion Delay/Flanger/Vintage Ensemble BBD multi-FX module
  - Black Modulator analogue modulation and noise source
  - Black EG envelope generator
  - Black 8-Multi active buffered multiple with signal status LEDs
  - 104HP one row skiff case
  - 20 patch cables included
