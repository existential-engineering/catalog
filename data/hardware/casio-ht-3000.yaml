description: >-
  The Casio HT-3000 is a home keyboard synthesizer from 1987 featuring Casio's proprietary
  SD (Spectrum Dynamic) Synthesis, which combines 32 digitally-designed waveforms with
  real analog voltage-controlled filtering. It offers 8-voice polyphony, a built-in drum
  machine, auto-accompaniment, and analog chorus effects in a 61-key package.
details: |-
  The HT-3000 belongs to the Casio HT and HZ series of synthesizers produced between 1987 and 1991, representing an interesting chapter in affordable home keyboard design. These instruments employed a proprietary synthesis method called Spectrum Dynamic (SD) Synthesis, which differentiated them from conventional subtractive synthesizers available during that era.

  The SD Synthesis approach combined analog signal processing with digitally-designed waveforms. The system passed waveforms through a real analog VCF (voltage-controlled filter) and incorporated ADSR envelopes for both the DCA and VCF. The synthesis engine featured an LFO capable of modulating pitch (vibrato) and volume (tremolo), similar to traditional subtractive designs.

  The distinctive characteristic lay in the waveform library. Rather than standard shapes, the 32 available waveforms exhibited varied timbres, with some described as nasal or narrow, others resembling conventional sawtooth or square waves, and several containing metallic timbre qualities. Experts theorize these waves incorporated harmonically-rich pulse waves at different octaves, as well as a ring modulator and an analog noise source, though their exact generation method remained proprietary.

  As a home keyboard, the HT-3000 included practical features such as built-in speakers, a drum machine with sounds resembling the Casio RZ-1, an analog chorus effect, and auto-accompaniment functionality. The HT family expanded to include the HT-700 with 49 mini-keys and the HT-6000 featuring four DCOs, eight VCFs, and 64 waveforms.
specs: |-
  - Polyphony: 8 voices
  - Multitimbral: 3 parts (Upper tone, Lower tone, Drums)
  - Oscillators: 1 DCO
  - Waveforms (Upper tone): 32 SD waves
  - Waveforms (Lower tone): 16 SD waves
  - Noise Generator: Yes
  - LFO: 1 LFO with 5 waveforms (Upper Tone); 1 LFO (Lower Tone)
  - LFO Modulation: Volume or pitch only
  - Filter: 1 VCF resonant analog lowpass with ADSR envelope
  - Envelope: 1 DCA with ADSR envelope
  - Effects: Analog Chorus (3 types)
  - Patterns: 10 user patterns (Drums/accompaniment)
  - Keyboard: 61 keys (no velocity)
  - Mod and Pitch Wheels: Yes
  - Memory: 30 preset, 30 user
  - MIDI: In/Out/Thru (3 channels only; no SysEx)
