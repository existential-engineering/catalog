details: |-
  The 5K Uke represents the pinnacle of Martin craftsmanship and elegance in a soprano-sized ukulele. Inspired by the tradition of the Style 45 guitar, this top-tier model is crafted with highly flamed solid Hawaiian koa for the top, back, and sides, finished in a polished gloss that brings out the wood's striking natural grain.

  It's richly appointed with abalone inlay throughout—including the top trim, rosette, fingerboard, and iconic flower pot headplate logo—paired with antique white binding and a bound ebony fingerboard for a refined, timeless look.

  The genuine mahogany neck joins the body at the 12th fret with a traditional dovetail joint, and the koa bridge with bone saddle completes a build that prioritizes both tonal clarity and visual elegance. Gold ukulele tuners with ivoroid knobs add another layer of vintage-inspired charm.

  The 5K Uke ships pre-strung with Martin Ukulele Strings (Soprano/Concert) and includes a form-fitted molded hardshell case. Optional Fishman electronics are available for players who want to amplify this heirloom-quality instrument.
