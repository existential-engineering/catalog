name: BASIL
manufacturer: bastl-instruments
primaryCategory: delay
categories:
  - reverb
  - stereo
url: https://bastl-instruments.com/eurorack/modules/basil
description: A flexible 8HP stereo space delay module built on the Bastl Pizza
  platform. Combines clean digital delay and lo-fi processing with a Space
  section for chorus, flanger, vibrato, pitch shifting, reverb, and stereo
  widening. Includes a Freeze function for micro-looping, an assignable CTRL
  knob with CV input, and firmware updates via micro USB. Free VCV Rack plugin
  available.
details: |-
  BASIL is a flexible stereo space delay module built on the Bastl Pizza platform. It delivers clean digital delay alongside lo-fi processing options toggled via an anti-aliasing filter switch.

  The Space section adds chorus, flanger, vibrato, pitch shifting, reverb, and stereo widening — making BASIL capable of much more than conventional delay. A Freeze function enables micro-looping of audio material.

  The assignable CTRL knob and CV input allow real-time modulation of any parameter. Stereo inputs are normalized (Left to Right), and ping-pong mode effectively doubles delay time in mono use. V/OCT input tracks delay time for musical pitch-matched effects. Named among 'Best of Superbooth 2023'.
