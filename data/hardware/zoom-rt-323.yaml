description: The RT-323 is a battery-portable drum machine with 13 velocity-sensitive pads, an onboard bass voice and a pattern and song sequencer, drawing on 377 internal drum sounds and 55 bass programs across 128 drum kits. A groove play mode assigns patterns to the pads and plays up to four at once, and the JAM slider sweeps pitch, volume, pan or tone in real time.
details: |-
  The RT-323 is a battery-portable drum machine with a 13-pad performance surface and an onboard bass voice, built around preset and user-programmable drum kits and a pattern and song sequencer. Sound generation runs at a 48 kHz sampling frequency with 24-bit, 8-times oversampling D/A conversion and 30-voice maximum polyphony, drawing on 377 internal drum sounds and 55 bass programs.

  Sounds are organised as drum kits and bass programs. There are 128 drum kits, 64 of them read-only presets and 64 user-writable, and two can be in use at once on the drum A and drum B tracks, while one bass program plays at a time. A kit spreads up to 39 sounds across three pad banks of 13, and each pad in a user kit carries its own instrument, volume, pitch (plus or minus 7.9 semitones in tenth-semitone steps), pan, output routing and poly/mono grouping, so a closed and open hi-hat assigned to the same group cut each other off.

  Sequencing works at 96 PPQN over a tempo range of 40.0 to 250.0 BPM, with memory for 40,000 notes, 500 rhythm patterns (400 preset, 100 user) and 100 songs. Patterns are entered in real time against a metronome with selectable quantize and precount, or step by step with the STEP key while the unit is stopped, on separate drum A, drum B and bass tracks. The bass track records note duration as well as position, and swing, pattern length, beat, play timing shift and per-track balance are all editable. Songs chain patterns by step or real-time input and carry an extra song track and a MIDI track for driving external gear.

  Two performance features sit on top of the sequencer. Groove play assigns patterns to the pads and plays up to four of them at once for as long as a pad is held, with quantized start and stop and a REPEAT key to latch them, which Zoom pitches as playing patterns the way a DJ handles records. The JAM slider, set by the JAM FUNCTION key, sweeps pitch, volume, pan or a per-sound tone change in real time for the selected track, and those moves can be recorded into a pattern.

  Connections are a mono LINE IN that mixes an external instrument straight into the output, L/MONO and R line outputs, two SUB OUT jacks for pulling individual sounds out separately, a headphone jack, two CONTROL IN jacks for the optional FP01 or FP02 pedal and FS01 footswitch, and MIDI in and out. A side-panel DATA CARD slot takes a 4 MB to 128 MB 3.3 V SmartMedia card for pattern, song and kit storage, including import and export of PS-02 data. The unit measures 265 x 175 x 55 mm, weighs 870 g, and runs from the AD-0006 9 V DC adapter or six AA batteries for at least seven hours.
specs: |-
  - Sampling frequency 48 kHz, D/A conversion 24-bit with 8-times oversampling
  - Maximum polyphony 30 voices
  - 377 internal drum sounds, 55 bass programs
  - 128 drum kits (64 preset read-only, 64 user), two usable simultaneously on the drum A and drum B tracks
  - Up to 39 drum sounds per kit across three pad banks of 13
  - User kit pad parameters: instrument, volume, pitch (-7.9 to +7.9 in 0.1 semitone steps), pan, main and sub output level, poly/mono and pad group 1-7
  - Bass programs play over a four-octave range selected with the OCTAVE key, one program at a time
  - 500 rhythm patterns (400 preset, 100 user) and 100 songs
  - Sequencer resolution 96 PPQN, tempo 40.0 to 250.0 BPM, maximum 40,000 notes
  - Pattern real-time input with metronome, selectable quantize (sixteenth note default) and 1-measure, 2-measure or pad-triggered precount
  - Pattern step input with the STEP key, storing pad hit intensity
  - Editable pattern swing, length, beat, play timing shift and per-track volume balance
  - Song step input and real-time input, plus a song track and a MIDI track
  - Groove play mode assigns patterns to pads and plays up to four simultaneously with quantized start and stop
  - JAM slider controls pitch, volume, pan or sound change in real time and can be recorded into a pattern
  - 13 velocity-sensitive pads with seven sensitivity settings (SOFT, MEDIUM, LOUD, LITE, NORMAL, HARD, EX HARD)
  - Display: 640-segment custom LCD
  - Control inputs: FP-01 / FP-02 pedal or FS-01 footswitch, 2 jacks
  - MIDI: IN and OUT, with program change, control change and system exclusive bulk dump of internal data
  - LINE IN: mono standard phone jack, analog mix, input impedance 10 kohm, rated input level -10 dBm
  - Outputs: Line Out L/MONO and R plus SUB OUT 1 and SUB OUT 2 on standard phone jacks, output impedance 1 kohm maximum, rated output level -10 dBm
  - PHONES: mini phone jack, 50 mW into 32 ohm
  - Data card: SmartMedia SSFDC 4 MB to 128 MB, 3.3 V
  - Power: 9 V DC, 300 mA from AC adapter AD-0006, centre-minus plug
  - Batteries: 6 x IEC R6 (AA), 7 hours minimum continuous operation
  - Dimensions 265 mm (W) x 175 mm (D) x 55 mm (H), weight 870 g
