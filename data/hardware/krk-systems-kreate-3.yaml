description: The Kreate 3 is a two-way active studio monitor pair, sold as one
  active left cabinet and one passive right cabinet, with 3.5-inch woven glass
  fibre composite woofers and 3/4-inch textile dome tweeters. Balanced 1/4-inch
  TRS, RCA, 1/8-inch auxiliary and Bluetooth inputs are provided.
details: |-
  The KRK KREATE SERIES monitors bring KRK studio monitoring performance to musicians, engineers, producers and content creators. Available in three sizes, these two-way studio monitors are designed for the needs of creative professionals.

  KREATE SERIES monitors offer acoustic boundary condition and tuning EQ combinations to help correct problems in the room and dial in the voicing. Composite woven glass fibre cone woofers provide dynamics with good damping and modal breakup control. High frequency reproduction comes from a woven textile dome tweeter with a neodymium motor.

  For transient response and dynamics reproduction, Class D amplifiers drive the transducers efficiently at reduced operating temperatures to maintain audio integrity during long sessions.
specs: |-
  - Configuration: 2-way bass reflex
  - System type: active studio monitor pair (left active, right passive), sold as a pair
  - Low-frequency driver: woofer, 3.5-inch, woven glass fibre composite cone, ferrite magnet
  - High-frequency driver: tweeter, 3/4-inch, textile dome, neodymium magnet
  - Frequency response (+/- 3 dB): 70 Hz to 33 kHz
  - LF frequency range (-10 dB): 63 Hz
  - Crossover frequency: 3.06 kHz
  - Amplifier configuration: Class D
  - Amp power output left: 32.5 W
  - Amp power output right: 32.5 W
  - Total power: 65 W
  - Total dynamic power output: 130 W
  - Max SPL (pair): 104 dB
  - Coverage angles: 147 degrees horizontal x 70 degrees vertical
  - Analog audio inputs: balanced 1/4-inch TRS, RCA, 1/8-inch auxiliary
  - Wireless input: Bluetooth Classic 5.3 A2DP
  - Signal to noise ratio: >95.7 dB
  - AC input voltage: 100 to 240 VAC (+/- 10%), 50/60 Hz
  - Fuse type: T4AL/250 V, not user serviceable
  - Enclosure construction: PVC vinyl wrapped MDF
  - Baffle construction: MDF with reinforced high impact polystyrene faceplate
  - Product dimensions each (H x W x D): 8.07 in (205 mm) x 5.51 in (140 mm) x 6.25 in (159 mm)
  - Product weight: 10 lb (4.5 kg)
