description: The mastering standard for the world's top engineers — an all-tube,
  all-transformer stereo limiter/compressor with detented controls for precise,
  repeatable settings and expanded modes and ratios.
details: |-
  The Manley Variable Mu Mastering Edition is the definitive tool for mastering engineers who demand a musical and cohesive final product. This all-tube classic uses a unique variable gain vacuum tube to provide smooth and transparent compression that acts as the 'glue' that holds the mix together.

  The Mastering Edition is designed for the surgical precision needed in mastering applications. Every knob — Input and Output, Threshold, and Attack — is a precision-stepped switch, replacing the continuous potentiometers of the standard Variable Mu. These detented controls allow for perfect, repeatable settings and total session recall.

  The Mastering Variable Mu offers an expanded set of ratios and modes for unparalleled control, including additional Limit ratios up to 20:1 alongside the classic 1.5:1 Compress mode. Each unit is meticulously hand-crafted in California with attention to detail from the custom-wound Manley IRON® transformers to the hand-selected vacuum tubes (5670, 5751, 12BH7).
specs: |-
  - All-tube, all-transformer stereo limiter/compressor
  - Detented (stepped) Input, Output, Threshold, and Attack controls for repeatable recall
  - Expanded modes and ratios vs. standard Variable Mu
  - Ratios: 1.5:1 (Compress), 4:1 to 20:1 (Limit)
  - Frequency Response: 20 Hz – 25 kHz, ±0.1 dB
  - Max Output: +30 dBu
  - Noise Floor: -85 dB
  - Tubes: 5670, 5751, 12BH7
  - Custom-wound Manley IRON® transformers
  - Dimensions: 19" × 3.5" × 10" (2U rack space)
  - Hand-crafted in California
