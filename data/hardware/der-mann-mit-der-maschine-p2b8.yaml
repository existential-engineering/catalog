description: The P2B8 is a Eurorack controller module for the DROID system with
  two potentiometers and eight push buttons. Buttons and pots can be freely
  assigned to functions in a DROID patch.
details: |-
  The P2B8 controller has two potentiometers (knobs) and eight push buttons - hence the name. In your DROID patch you can assign arbitrary functions to the bottons and pots. The P2B8 is a good choice if it is your first or your only controller. With the buttons it is possible to "overlay" the pots with various functions, so you are not limited to controlling just two parameters. Shipping includes a short ribbon cable for connecting the controller to the master or to the previous controller. If you want to place the controller further away from the master, you can purchaser longer ribbon cables here in the shop. The P2B8 controller is also part of several sets:

  Current Draw: 12 mA +12V | 0 mA -12V | 0 mA 5V

  Width: 5 HP
  Depth: 25 mm

  Link to the P2B8 Controller on ModularGrid
