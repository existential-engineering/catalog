description: A stereo compressor featuring threshold, ratio, makeup gain,
  attack, and release controls, plus sidechain input to help sounds cut through
  a mix.
details: |-
  Our full featured stereo compressor with threshold, ratio, and makeup gain controls, along with attack and release timing controls. You can also sidechain to help highlight sounds competing in the same sonic space.
specs: |-
  - Attack – 0.15ms to 15ms/db
  - Release – 1.5ms to 150ms/db
  - Threshold – 10dbu to -30dbu
  - Ratio – 0 to infinity
  - Gain - -20db to +20db
