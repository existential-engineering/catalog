description: A headless counterpart to the Kyber, keeping the original's overall
  design and purpose while adding a headpiece for wall hanging and an exclusive
  Kiesel locking nut. Builds average around 5 lbs or under depending on specs.
details: |-
  After the release of the Kyber, Kiesel developed a counterpart for headless players. The Kyber Headless remains true to the original but adds twists of its own, starting with a headpiece that allows for seamless wall hanging while contributing to the instrument's look.

  The aggressive horns work with the extreme body cuts and contours to create a contemporary instrument. Carved "scoops" along the body's perimeter are an optional aesthetic addition at the player's request.

  Developed at the Kiesel factory by Mark and Jeff Kiesel, the exclusive locking nut accommodates the headpiece and prevents strings from poking through the piece. Though the Kyber is already celebrated for its weight relief on a headstock-equipped model, the Kyber Headless averages around 5 lbs or under depending on specs.

  The benefits that accompanied the original Kyber carry over, including increased upper fret access, the extreme arm contour and rear-mounted strap buttons for balance. The Masvidalien MIII is a Paul Masvidal spin-off based on the Kyber Headless that reworks the upper horns and adds Masvidal's signature inlay.
specs: |-
  - Configurations: 6-string and 7-string, with a multiscale option
  - Construction: bolt-on with radiused neck heel, headless
  - Body: alder
  - Nut: exclusive Kiesel locking nut
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck widths: 1.69 in, 1.71 in, 1.90 in, 1.92 in or 2.12 in at nut depending on configuration
  - Fingerboard: ebony with 14 in or 20 in radius
  - Frets: 24 stainless steel medium-jumbo, .103 in wide x .048 in tall
  - Scale lengths: 25.5 in, or 25.5 in to 26.5 in, 25.5 in to 27 in and 26 in to 27.5 in multiscale
  - Bridge: Hipshot fixed, or Hipshot fixed headless multiscale, .4125 in (10.5 mm) spacing
  - Bridge pickup: direct-mount passive Kiesel Thorium humbucker
  - Neck pickup: direct-mount passive Kiesel Empyrean humbucker
  - Electronics: master volume control with push-pull coil splitting, 3-way pickup selector, flush mount output jack
  - Inlays: white pearl dots, black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Headpiece allows wall hanging; optional carved body scoops; rear-mounted strap buttons
  - Body dimensions: 33 in, 33.5 in or 34 in long, 1.375 in thick, 12.6 in to 13.1 in wide
  - Weight: 4.8 lbs to 5.5 lbs
  - Strings: Elixir Nanoweb 1046E
