description: Limited Edition Professional Closed-Back Headphones.
details: |-
  Whether you're referencing your mix in the studio or producing your next track, MC Series Headphones allow you to take the Mackie studio sound, trusted by artists around the world, wherever you go.

  Building on our studio monitor legacy, MC-350 Professional Closed-Back Headphones offer stunning stereo imaging, vocal clarity, and present but not harsh high end. The precision-tuned, closed-back design features reference-quality 50mm drivers for excellent isolation and distortion-free audio.

  Experience the signature Mackie studio sound in headphones that offer a balanced, full sound. High-headroom, reference-quality 50mm transducers provide an accurate reproduction of your mix and your music.
specs: |-
  - Frequency Response: 20Hz – 20kHz
  - Impedance: 32 Ohms
  - Transducer size: 50mm
  - Sensitivity: 97 dB
  - Weight: 370g / 13.05oz
  - Premium cables with locking bayonet connectors
  - 9.8ft fabric-jacketed straight cable
  - 4ft coiled cable
  - 4ft straight cable with phone control/mic
  - Gold-plated 1/4" adapter included
