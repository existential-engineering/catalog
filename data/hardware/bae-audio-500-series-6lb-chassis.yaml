description: A 6-space 500 Series desktop chassis (6LB) with a heavy-duty steel
  chassis and point-to-point wiring. It features XLR inputs and outputs with a
  remote 1.6A power supply to keep transformer interference away from modules.
details: |-
  BAE's 6LB is a 6-space desktop chassis for standard API-format 500-series modules. It is built with a strong steel chassis — not aluminum — and features shielded wires on individual connectors for serviceability with no PCBs, using point-to-point wiring throughout.

  The remote power supply design keeps the power transformer interference away from the modules for cleaner audio performance, providing ±16V bi-polar power at 1.6A to hosted 500-series modules via the standard edge-connector bus.

  A conversion kit is available (for units purchased after June 1, 2012) to add rack ears and convert the 6LB desktop chassis to a standard 19-inch rack-mount form factor. A dedicated 19-inch 6 Space Rack and a larger 11 Space Rack are also available.
specs: |-
  - Power: ±16V @ 1.6A
  - Power Requirements: 115/230 VAC, 36W
  - Construction: Steel chassis, point-to-point wiring, no PCBs
  - Form Factor: Desktop chassis (rack-ear conversion kit available)
