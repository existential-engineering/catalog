description: An expander module for the Alan and Benjolin V2 modules that
  enables manipulation of the stepped CV sequence to create related sequences,
  daisy-chainable for multiple units.
details: |-
  An expander for our Alan (a smaller version of the Turing Machine) and our Benjolin V2 that enables you to manipulate the stepped CV sequence. This enables you to create a different, yet related sequence to the main Alan output. CONNECTION

  The module comes with the required cable to connect to Alan or Benjolin V2. On the back of Enigma you will see two headers with the word GATES written on the PCB (either will work), and on the back of Alan or Benjolin, there will be a corresponding header that also says GATES. This is how the expander is connected to the main module. There are 2 headers on the back of Enigma because it can be daisy chained. 1 Alan or Benjolin can support up to 5 Enigmas. Based on open source design by Tom Whitwell under Creative Commons ( CC-BY-SA ) license.
