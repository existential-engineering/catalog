description: Hand-modded Custom Shop D&M Drive, signed inside by Robert Keeley,
  with a high-voltage mid boost channel, a harmonically rich drive channel and
  limited-edition cuneiform graphics.
details: |-
  The Altered History edition is a hand-modded Custom Shop run of the D&M Drive, the dual boost and drive pedal developed with That Pedal Show, offered in two colourways named Nergal Red and Ninazu Purple. Each unit is modded and signed on the inside by Robert Keeley.

  The circuit itself is close to the standard pedal. The modifications are an A-taper potentiometer on the boost side's volume control, which softens the output volume taper, and a 1 megohm gain control on the drive side in place of the standard 500 kilohm part, which raises the maximum gain. The sounds are described as largely identical, reached at different control settings.

  Functionally the pedal is unchanged: the high-voltage boost side acts as a midrange clarifier that pushes an amp and saturates as it is turned up, and the drive side runs from a flat honest overdrive to a hot, sustaining lead tone. An order switching toggle selects which side comes first when both are engaged.

  The Custom Shop treatment includes artwork of Ereshkigal in an imagined cuneiform font, UV-printed backplates carrying the serial number, and aluminium knobs.
