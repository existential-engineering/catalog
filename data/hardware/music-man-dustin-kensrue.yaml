details: |-
  The Dustin Kensrue Artist Series StingRay Guitar blends innovation and versatility, crafted for the dynamic style of solo artist and Thrice frontman Dustin Kensrue.

  The guitar features an okoume body, 22 high-profile medium-width stainless steel frets, and a maple neck in a dark classic tint. The asymmetrical C-shaped carve delivers effortless playability, while a 5-bolt sculpted neck joint and locking Schaller M6-IND tuners keep the instrument stable and stage-ready.

  Electronics include a custom Music Man StingRay RS alnico humbucker at the bridge paired with an alnico single coil at the neck. A passive concentric 500k volume/tone knob keeps the control plate compact, while a 3-way pickup selector and a mode switch — wired to route both pickups directly to the jack in stereo — open up extra tonal options.

  Available in Dark Satin Tobacco Burst, TV Blonde, and the 2025 Daiquiri Ice finish. Strung with RPS Slinky strings tuned to D standard, the StingRay ships ready for low-slung rock duties.
specs: |-
  - Body wood: Okoume
  - Body finish: Satin or high gloss polyester
  - Body colors: Dark Satin Tobacco Burst, TV Blonde, Daiquiri Ice
  - Body dimensions: 14-1/16" wide, 1-5/8" thick, 39-1/4" long
  - Neck wood: Select maple
  - Neck finish: Ultra-light satin polyurethane
  - Neck width: 1-5/8" at nut, 2-1/4" at last fret
  - Neck radius: 10"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Maple
  - Fret markers: 1/4" black dot inlay
  - Frets: 22 high-profile, medium-width stainless steel
  - Scale length: 25-1/2"
  - Pickups: Alnico StingRay RS bridge humbucker; custom alnico neck single-coil
  - Controls: Passive concentric 500k volume/tone; 3-way pickup selector; stereo mode switch
  - Bridge: Music Man modern tremolo with vintage bent steel saddles
  - Pickguard: Black or mint
  - Tuning machines: Schaller M6-IND locking
  - Headstock length: 6-3/8"
  - Strings: 11p-14p-18p-32w-44w-58w RPS Slinky (D Standard tuning)
