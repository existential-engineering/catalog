description: Katana Mini in the No420 Custom Shop finish. Over 35dB of boost
  from dual Class A JFETs, with four modes set by two internal switches for
  filter and gain.
details: |-
  The Katana Mini is a smaller version of Keeley's oldest design, here in the No420 Custom Shop finish. The Katana began in 2002 inside the Time Machine Boost as a dual Class A JFET circuit, and the Mini version provides over 35dB of boost.

  As a clean boost it raises level for solos or dynamic sections without altering the natural tone of the instrument, keeping note clarity and articulation intact. Its compact size and simple controls are aimed at on-the-fly adjustment on a crowded board.

  The Mini adds a second internal switch, giving four modes in total. The internal Hi-Gain switch takes the circuit into overdriven territory, the Hi-Cut switch (new for the Katana Mini) gives a warmer voicing to soften a Stratocaster or Telecaster, and both engaged together give a thick, valve-like boost with plenty of volume available.
specs: |-
  - - Over 35dB of boost
  - - Dual Class A JFET circuit, cascading FET gain stages
  - - Two internal DIP switches giving four boost modes
  - - Internal Hi-Gain switch for overdriven tone
  - - Internal Hi-Cut switch for a warmer voicing
  - - Mini enclosure
