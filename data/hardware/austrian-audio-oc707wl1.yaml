details: |-
  Handcrafted true condenser capsule for professional wireless vocal applications, featuring Austrian Audio's OCC7 capsule design for raw detail, rich presence, and zero hype. Open acoustic design preserves the natural character of the voice.

  Compatible with Shure, Sony, and Lectrosonics wireless transmitter systems. Made in Vienna.
