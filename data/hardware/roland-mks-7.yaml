description: >-
  The Roland MKS-7 Super Quartet is a multitimbral rack-mount analog module from
  1986 that combines Juno-106-based melody, chord, and bass sections with
  TR-707-derived PCM drum sounds in a single unit.
details: |-
  Released in 1986, the Roland MKS-7 Super Quartet packed four independent sound
  sections into a single rack module. The Melody section offered 2-voice
  polyphony with 100 presets, the Chord section provided 4-voice polyphony with
  100 presets, the Bass section was monophonic with 20 presets, and the Rhythm
  section featured 11 PCM drum sounds.

  The sound architecture of the Melody, Chord, and Bass sections closely mirrors
  that of the beloved Juno-106, giving the MKS-7 access to the same warm analog
  tones. The Rhythm section borrows its electronic rock drum sounds from the
  TR-707 drum machine, making this an unusually versatile all-in-one solution.

  All four sections can operate simultaneously with independent MIDI control,
  enabling complete arrangements from a single module. The device supports
  System Exclusive messages for deeper editing, and most Juno-106 patch editors
  are compatible with its synth sections.

  Despite its impressive feature set, the MKS-7 remains something of an
  underrated machine in Roland's catalog. Its combination of analog warmth,
  multitimbral flexibility, and compact form factor made it a practical choice
  for MIDI-based studios of the mid-1980s.
specs: |-
  - Polyphony: 8 voices total
  - Oscillators: 3 DCOs
  - Multitimbral: 4 parts (Melody, Chord, Bass, Rhythm)
  - Filter: Non-resonant high-pass and resonant low-pass
  - VCA: ADSR envelope
  - Memory: 120 patches
  - Rhythm: 11 PCM drum sounds
  - Control: MIDI
releaseDate: "1986"
