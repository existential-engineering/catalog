description: >-
  The Korg ElecTribe M (EM-1) is an all-in-one music production station combining two
  synth parts and eight drum parts into a compact groovebox designed for dance music
  production. It merges the synthesis capabilities of the ElecTribe EA-1 with the drum
  machine features of the ER-1, offering 144 drum sounds, 50 synth waveforms, and a
  powerful step/real-time sequencer. The EM-1 also includes a motion sequencer for
  recording knob movements in real time, making it a versatile performance tool for DJs
  and electronic musicians.
details: |-
  The ElecTribe M (EM-1) is part of Korg's popular ElecTribe series, combining the best elements of the ElecTribe EA-1 synthesizer and ER-1 drum machine into a single music production system. It was designed as an all-in-one groove and dance music machine for DJs and musicians alike.

  The drum section features 144 different sounds suited for dance music production, with patterns supporting up to eight drum parts that can be individually muted and processed in real time. The synth section offers up to two synth parts per pattern with 50 waveforms, and editing capabilities include volume, panning, envelope, filtering, roll effect, internal effects processing, pitch, and glide (portamento). The filter is a 12 dB/oct low-pass design with cutoff and resonance controls.

  The onboard sequencer holds up to 256 patterns and 16 songs, with 192 factory patterns pre-loaded. Users can sequence in step or real time using the 16 pads, which represent 16th notes of a one-bar pattern, with patterns extending up to 64 steps (4 bars). Effects processing includes a master tempo delay and one of 11 insert effects: reverb, flanger/chorus, phaser, ring modulator, pitch shifter, compressor, distortion, decimator, resonator, and modulation delay.

  The Motion Sequencer is a standout feature, allowing users to record movements of the EM-1's knobs in real time to create rhythmic effects, filter sweeps, and evolving synth or effect changes. For live performance, up to 64 patterns can be stored to the step keys for real-time pattern recall, combined with real-time part muting and soloing, filtering, tweaking, and tap-tempo or MIDI clock sync. Notable users include The Prodigy.
specs: |-
  - Polyphony: 2 voices (synth), 8 voices (drums)
  - Synthesizer waveforms: 50
  - Drum waveforms: 144
  - Patterns: 256 (192 factory presets)
  - Songs: 16
  - Pattern length: up to 64 steps (4 bars)
  - Song capacity: 256 patterns per song, 35,700 events
  - Filter: 12 dB/oct resonant low-pass with cutoff and resonance
  - Master effect: Tempo delay
  - Insert effects: 11 types (reverb, flanger/chorus, phaser, ring modulator, pitch shifter, compressor, distortion, decimator, resonator, modulation delay)
  - Motion sequences: 2 per drum part, 3 per synth part, 1 per insert effect, 1 per master delay
  - Interface: 16 touch pads (no keyboard)
  - MIDI: IN/OUT/THRU
  - MIDI parts: 2 synth parts, 8 drum parts
