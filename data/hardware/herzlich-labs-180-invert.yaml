description: A 2hp module containing four independent signal inverters that
  shift the phase of input signals by 180 degrees, useful for fixing phase
  errors and other creative applications.
details: |-
  Turn that frown upside down - or make that negative waveform positive. Or vice versa! The Herzlich 180° Invert will shift the phase of any four signals you put in by 180 degrees, effectively inverting them. This has countless applications: fix phase errors in your mix, turn a low pass signal into a high pass, cancel out unwanted signals, change the behaviour of an LFO or gate, there are countless situations and applications where inverters are incredibly useful. You'll be happy to own an inverter in any system - but why own just one when you get four here? Add a useful tool to your system today, with the 180° Invert.
