details: |-
  Introducing Assembler, a synth-focused audio mixer meticulously engineered to deliver unmatched vintage mixing console sound and intuitive, hands-on control. Developed in partnership with the renowned Pittsburgh Modular Synthesizers team, Assembler builds on the rich history and sonic warmth of classic analog audio mixers while embracing a modern workflow designed specifically for contemporary electronic artists.

  Inspired by the sound of iconic analog consoles that shaped decades of music production, Assembler captures the essence of vintage mixers famed for their warmth, character, and dynamic response through tonal shaping and analog tape saturation emulation. These custom circuits, meticulously engineered for Assembler by Pittsburgh Modular, utilize signal contouring and soft compression to unify the overall mix.

  Assembler's ten audio inputs are split into three distinct mixer channel types. Each input includes a powerful preamp capable of up to 20x gain boost. Three assignable aux sends add flexible audio processing options to each channel. Three segment LED meters, independent headphone Cue, and channel Mutes allow for precise and comprehensive monitoring. Channel 1 and 2 add extensive tonal control with vintage-inspired high and low EQ knobs, each offering ±15 dB of boost or cut, while all six mono inputs include a dedicated pan control.

  The Assembler offers significant flexibility with its three assignable aux send channels, allowing effortless integration of external effects like reverbs and delays or functioning as sub-mix channels. Two stereo returns and one mono return, each with independent gain adjustments, enable both creative experimentation and professional-grade signal blending.

  Assembler prioritizes ease of use with its intuitive one-knob-per-function design. Equally adept at managing both line-level instruments and Eurorack signals, Assembler effortlessly integrates into any studio or live performance setup. A dedicated headphone output with a separate cue mix ensures detailed and reliable monitoring in live situations.
specs: |-
  - Audio Channels: 10 total
  - 2 Complex Mono Channels (1-2): vintage-inspired High/Low EQ (±15 dB), up to 20x gain boost, dual aux sends (1 assignable), pan, mute, assignable cue monitoring, 3-stage LED meter, analog tape saturation
  - 4 Standard Mono Channels (3-6): up to 20x gain boost, dual aux sends (1 assignable), pan, mute, assignable cue monitoring, 3-stage LED meter, analog tape saturation
  - 2 Stereo Channels (7/8, 9/10): up to 20x gain boost, assignable aux send, pan, mute, assignable cue monitoring, 3-stage LED meter, analog tape saturation
  - 3 Aux Sends: mono, post-fader
  - 2 Stereo Aux Returns: up to 2.7x gain, mute, assignable cue monitoring, analog tape saturation
  - 1 Mono Aux Return: up to 2.7x gain, mute, assignable cue monitoring, analog tape saturation
  - Independent Main and Cue output levels
  - Eurorack and line level compatible
  - Usable standalone in included case or removed for use as a Eurorack format module
  - Eurorack module width: 40HP, depth: 30mm
  - Power consumption: +12V 380mA, -12V 275mA
  - Reversed power polarity protection
  - Dimensions: 207mm x 138mm x 61mm
  - Weight: 845g
  - Included in the box: 1x Assembler, 1x wall-wart power supply
