description: A collaboration between Greg Howe and Kiesel that takes the Lyra
  platform and adds a poplar burl top with Kiesel's Antique Ash Treatment and a
  California Burst in translucent finishes. The model is built around the
  VegaTrem bridge, exclusive to this guitar.
details: |-
  A collaborative project between Greg Howe and Kiesel from its inception, the Lyra sees a bold take in the Greg Howe Signature. The GS package is crafted standard with a poplar burl top treated with Kiesel's signature Antique Ash Treatment and then completed with a California Burst in a selection of translucent finishes.

  The extreme arm contour adorning the bass side of the body forms a natural flow for the player's arm, offering relief for extended sessions. While the shape modernizes the Lyra in an Aries-esque bevel, small touches such as the GT headstock, pickguard and classic plastic knobs refer back to the classic era of guitar.

  The most distinctive difference is the VegaTrem, a bridge exclusive to this model and favored by Howe, who describes the trem as sturdy and smooth with no play in the arm.
specs: |-
  - Package designation: GS
  - Construction: bolt-on with radiused neck heel
  - Body: alder with poplar burl top
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods, thinner profile
  - Neck width: 1.67 in at nut, .76 in thick at 1st fret, .86 in thick at 12th fret, 2.25 in wide at 24th fret
  - Fingerboard: birdseye maple with 14 in radius
  - Frets: 24 stainless jumbo, .103 in wide x .048 in tall
  - Scale length: 25.5 in
  - Headstock: inline GT with birdseye maple overlay
  - Bridge: Vega VT1 Ultra Trem 2-point, .42 in (10.7 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Pickup configuration: humbucker-single-single
  - Bridge pickup: Seymour Duncan Whole Lotta Humbucker
  - Middle and neck pickups: S60 single coils
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector
  - Finish: translucent orange with California Burst and Raw Tone top coat
  - Hardware: gold with black plastic knobs
  - Pickguard: red tortoise shell multi-layered
  - Inlays: black acrylic diamond, black-ring Luminlay Super Blue side dots
  - Dimensions: 39.5 in long, 1.72 in thick, 12.75 in wide
  - Weight: 7.7 lbs
  - Strings: Elixir Nanoweb 1046E
