description: >-
  The JoMoX MBase 11 is an upgraded analog bass drum synthesizer building on the MBase 01, adding
  compression, gate, and metal noise parameters for expanded kick drum sound design.
details: |-
  The JoMoX MBase 11 is an enhanced version of the MBase 01, featuring a darker aesthetic and several significant improvements for analog bass drum synthesis. Three new parameters distinguish it from its predecessor: Compression, Gate, and Metal Noise, along with output volume control and expanded preset memory from 64 to 100 patches.

  The Compression parameter affects the decay phase by slowing the initial decay portion and adding sustain to the sound tail, addressing a noted limitation in the MBase 01 regarding tone control during decay. The Gate parameter enables substantial attack shaping with adjustable gate time between 0.1ms and 16ms, allowing precise control over noise introduction or minimal attack blips.

  Metal Noise generates complex metallic characters that add an entirely new dimension to the bass drum sounds. Values above zero create high-pitch digital multi-tones and bit-pattern signals, where each unique value produces distinctly different sonic results. The LFO has been expanded to eight waveform settings with selectable polarity, including Saw Up/Down, Sine Ascending/Descending, Triangle Ascending/Descending, and Rectangular patterns.

  MIDI implementation has been improved with doubled CC control capabilities, now covering sixteen total parameters including the new Compression, Metal Noise, and full LFO parameter control. The unit retains the compact desktop form factor and analog VCO-based synthesis of its predecessor while offering substantially more creative possibilities for kick drum sound design.
specs: |-
  - Polyphony: Monophonic
  - Multitimbral: 1 part
  - Oscillators: 1 VCO
  - Waveforms: Sine
  - LFO: 1 with Saw, Sine, Triangle, Rectangular (polarity selectable)
  - Filter: None
  - Envelope: 1 VCA with Attack and Decay
  - Effects: None
  - Keyboard: None (1 trigger button)
  - Memory: 100 preset, 10 user patches
  - Control: MIDI In/Out, Audio Trigger Input
  - Weight: 1.1 lbs (0.5 kg)
releaseDate: "2009"
