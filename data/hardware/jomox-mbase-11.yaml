description: >-
  The JoMoX MBase 11 is a VCO-based analog bass drum synthesizer and an improved version
  of the MBase 01. It adds three major new parameters — Compression, Gate, and Metal Noise
  — along with expanded patch memory and doubled MIDI control capabilities for extensive
  kick drum sound design.
details: |-
  The MBase 11 retains the fundamental VCO-based architecture of the MBase 01 but introduces significant enhancements through three new parameters. The Compression parameter affects the decay phase of the bass drum, effectively slowing the first half of the decay and adding sustain to the tail of the sound, addressing a noted limitation in the MBase 01's tone control during decay.

  The Gate feature allows further substantial shaping of the attack portion of the bass drum, with adjustable gate time between 0.1ms and 16ms. Though the range seems narrow, it produces a significant difference to the attack, opening it up to allow more noise in or shortening it to minimal blips.

  The Metal Noise parameter alters the character of the noise feature, shaping it into something more metallic sounding. On values above zero, a complex signal made from high-pitch digital multi-tones and the bit pattern of the value is created, where each unique single pattern corresponds to a value number. This creates vast sonic variation across the parameter range.

  The LFO has been expanded to eight waveform settings with selectable polarity, including Saw Up/Down, Sine Ascending/Descending, Triangle Ascending/Descending, and Rectangular patterns, with maximum speed capped at 290 BPM. MIDI implementation has been doubled from eight to sixteen CC-controllable parameters, now covering Compression, Metal Noise, and full LFO parameter control. Patch memory has been expanded from 64 to 100 factory presets with 10 user slots, though the output remains unbalanced.
specs: |-
  - Polyphony: Monophonic
  - Multitimbral: 1 part
  - Oscillators: 1 VCO
  - Waveforms: Sine
  - LFO: 1 with Saw, Sine, Triangle, Rectangular (polarity selectable)
  - Filter: None
  - Envelope: 1 VCA with Attack and Decay
  - Effects: None
  - Arpeggiator/Sequencer: None
  - Keyboard: None (1 trigger button)
  - Memory: 100 preset patches, 10 user patches
  - Control: MIDI In/Out, Audio Trigger Input
  - Weight: 1.1 lbs (0.5 kg)
releaseDate: "2009"
releaseDateYearOnly: true
