url: https://apiaudio.com/product/tranzformer-llx-bass-pedal/
description: Bass-optimized guitar effects pedal with API's EQ circuit, three
  bass-specific frequency bands (100 Hz, 400 Hz, 2 kHz), switchable Clean Boost
  or Overdrive, buffered bypass, output pad, and transformer output stage.
  Operates on 9–18VDC.
details: |-
  API EQ circuit in bass guitar pedal format. 3 bands tuned for bass:
  100 Hz and 400 Hz (peaking), 2 kHz (shelving/peaking). ±15 dB per band.
  Switchable Clean Boost or Overdrive. Buffered bypass at 0 dB. −20 dB switched
  output pad. Transformer output stage. 9–18VDC power (higher voltage increases
  headroom).
specs: |-
  - Input impedance: 1 MΩ
  - Output impedance: <1 kΩ
  - Input gain: 0–40 dB (variable)
  - Output pad: 0 / −20 dB (switched)
  - Max output: +15 dBu @ 9V / +22 dBu @ 18V
  - Tone bands: 100 Hz + 400 Hz (peaking), 2 kHz (shelf/peak), ±15 dB
  - Power: 9–18VDC @ 100 mA
  - Dimensions: 4.6" × 3.8" × 3"
  - Weight: 1.5 lb
