description: The LiveTrak L6 is Zoom's most compact and portable digital mixer /
  recorder, with 10 tracks of studio quality audio, effects, MIDI and sound pads
  for bands, synth players and live streaming.
details: |-
  The LiveTrak L6 is the smallest mixer-recorder in Zoom's LiveTrak line, a 223 mm wide desktop unit with 10 channels across six LED-ringed control knobs. Channels 1 and 2 are mono mic/line inputs on XLR/TRS combo jacks with +48 V phantom power, and channels 3 to 6 are stereo line inputs on pairs of unbalanced TS jacks. Channels 3 and 4 can be split into two mono inputs each with a MONO x2 button, and channels 5 and 6 switch to the USB audio return so backing tracks or a laptop feed sit in the mix on their own faders.

  Each channel has a full strip reached from the CHANNEL STRIP column: two aux sends, effect send, pan, level and a 3-band EQ with a sweepable mid (10 kHz shelving high, 100 Hz to 8 kHz peaking mid, 100 Hz shelving low, each plus or minus 15 dB). Five send effects cover three reverbs, a delay and an echo, with tempo set by a TAP button or synced over MIDI. A compressor on the main output raises loudness and adds saturation, and three scene memories store a finished mix and its tempo for instant recall.

  Recording is 32-bit float at 48 kHz to microSDHC or microSDXC cards of up to 2 TB, capturing 12 tracks at once, the 10 discrete channels plus the stereo mix. With 32-bit float and the unit's dual A/D converter circuits there is no input gain control to set and the page states the audio will not clip. Four assignable sound pads play back pre-recorded backing tracks or samples, and can sample in real time during a performance.

  MIDI arrives and leaves on 3.5 mm jacks, or over USB. Parameters such as volume, pan and EQ can be mapped to outboard gear, sound pads and scene switching can be triggered from a controller, and the delay and echo sync to incoming tempo. The free L6 Editor software for Windows and macOS exposes MIDI programming, effect parameters, aux send points and sound pad settings from a computer.

  Over USB-C the L6 is a 32-bit float 12-in/4-out audio interface for a computer, iOS or Android device while it keeps recording to the microSD card, and it doubles as a DAW control surface. Power comes from four AA batteries for about 3 hours, from a USB battery pack or from the supplied AD-17 DC 5 V adapter, and an optional ERL-6 adapter mounts the unit in a standard Eurorack case.
specs: |-
  - 10-channel ultra-compact digital mixer: 2 XLR/TRS combo inputs plus 4 stereo inputs
  - Inputs: MIC/LINE (mono) x 2, LINE (stereo) x 4. Outputs: AUX SEND (mono) x 2, MASTER (stereo) x 1, MONITOR (stereo) x 1
  - MIC/LINE: 2 XLR/TRS combo jacks (XLR 2 HOT, TRS TIP HOT), XLR mic and TRS line (+4 dBu balanced)
  - Input gain adjustment unnecessary, dual A/D converter circuits used
  - MIC/LINE input impedance: XLR 3.8 kOhm or more, TRS 39 kOhm or more. Maximum input level XLR +4 dBu, TRS +24 dBu
  - Phantom power: +48 V, channel total of 10 mA or less
  - LINE: 8 TS phone jacks (unbalanced, -10 dBu), input impedance 10 kOhm, maximum input level +9 dBu
  - AUX SEND: 2 TRS phone jacks (impedance balanced), maximum output level +9.5 dBu, output impedance 147 Ohm
  - MASTER: 2 TRS phone jacks (balanced), maximum output level +15 dBu, output impedance 147 Ohm
  - MONITOR: TRS phone jack, maximum output level 50 mW + 50 mW into 63 Ohm, output impedance 14.7 Ohm
  - Buses: MASTER 1, AUX SEND 2, SEND EFX 1
  - Channel strip: 3-band EQ, HIGH 10 kHz shelving, MID 100 Hz to 8 kHz peaking, LOW 100 Hz shelving, each plus or minus 15 dB
  - Level meters: 6 segments
  - Send effects: 5 types, three reverbs (Hall, Room, Spring) plus Delay and Echo
  - Main output compressor that increases loudness while adding natural saturation
  - 4 assignable sound pads (sample player), with real-time sampling
  - 3 scene memories storing mixer and tempo settings
  - Maximum simultaneous recording tracks: 12, maximum simultaneous playback tracks: 2
  - Recording format: 48 kHz, 32-bit float, mono or stereo WAV
  - Recording media: microSDHC and microSDXC memory cards, class 10 or higher, up to 2 TB
  - Audio interface: 12 in / 4 out, 48 kHz, 32-bit float or 24-bit, USB 2.0. Also a DAW control surface
  - MIDI In and Out on 3.5 mm jacks, plus USB MIDI, for parameter mapping, sound pad and scene triggering, and tempo-synced delay and echo
  - L6 Editor software for Windows and macOS covers MIDI programming, effect parameters, aux send points and sound pads
  - Card reader: mass storage class USB 2.0 High Speed
  - Frequency response: 20 Hz to 20 kHz, -1.0 dB
  - Equivalent input noise: -120 dBu or less (IHF-A) at 150 Ohm input
  - Power: 4 AA batteries (alkaline, lithium or rechargeable NiMH), ZOOM AD-17 AC adapter (DC 5 V / 1 A), or USB bus power
  - Estimated continuous recording time on batteries (12-track recording, phantom power off, 63 Ohm headphones, no MASTER connections): about 3 hours alkaline, about 3.5 hours NiMH 1900 mAh, about 7 hours lithium
  - Power consumption: 5 W maximum
  - Mountable in a standard Eurorack case with the optional ERL-6 rack ears and power supply
  - Dimensions: 223 mm (W) x 114 mm (D) x 46.5 mm (H)
  - Weight: 526 g main unit only, 618 g including batteries
  - Supplied with the AD-17 USB AC adapter and a USB-C cable
