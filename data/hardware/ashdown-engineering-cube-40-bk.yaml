url: https://ashdownmusic.com/products/cube-40-bk
description: The Cube 40 (AA-40) is a 45 watt single-channel acoustic guitar
  amplifier built to be ultra-portable, weighing just 3.4 kg. A fully-featured
  preamp with treble and bass EQ, digital reverb with four flavours and a
  feedback-cancelling notch filter drives a custom 5-inch speaker paired with a
  studio-quality tweeter. It adds a balanced DI output, FX send and return, and
  a link output for an AA Power Cube extension combo.
details: |-
  The Cube 40 (AA-40) is a 45 watt single-channel acoustic guitar amplifier designed to be ultra-portable for the musician on the move, weighing just 3.4 kg. A fully-featured preamp lets the player sculpt acoustic tones with treble and bass EQ while retaining the instrument's character. Digital reverb is available in four flavours and a notch filter (70 to 350Hz, Q=5) helps cancel feedback-inducing frequencies at higher volumes. A custom 5-inch speaker combined with a studio-quality tweeter delivers acoustic tone and projection that belies its size. It measures 230mm on each side and includes a carry strap and a 35mm recessed speaker pole socket.
specs: |-
  - Power output: 45 watts
  - Power requirement: 115/230V auto-select
  - Speaker configuration: 1 x 5 inch plus tweeter
  - Frequency response: -3dB at 52Hz and 28kHz
  - High instrument input (Ch 1 active): 10k ohms, 200mV to 30V p-p
  - Low instrument input (Ch 1 passive): 3.9M ohms, 150mV to 10V p-p
  - Line input: 10k ohms, 0dBu
  - Line output: 4.7k ohms, 0dBu
  - DI output: 600 ohms, -20dBu
  - EQ: Bass and Treble +/-15dB at 100Hz and 10kHz
  - Effects send: 10k ohms, 0dBu
  - Effects return: 22k ohms, 0dBu
  - Signal to noise: greater than 80dB (EQ flat)
  - Distortion: less than 0.8% THD
  - Notch filter: 70 to 350Hz, Q=5
  - Shape switch
  - Carry strap
  - 35mm recessed speaker pole socket
  - Link output for AA Power Cube extension combo
  - Dimensions (H x W x D): 230 x 230 x 230 mm
  - Weight: 3.4 kg
