details: |-
  The Realizer Reverberator is an ambient reverb pedal based on the left side of the Keeley Loomer Workstation, aimed at shoegaze and ambient players who have already settled their drive tones. This run is finished in a teal and purple flip flop, similar to the second anniversary Loomer, with minimal graphics and chrome knobs and switches. Three distinct reverb modes are offered.

  Soft Focus is a recreation of the Soft Focus patch from the Yamaha FX500 multi-effects processor, a late 1980s rack unit used for many signature delay and modulation sounds of the early 1990s. In this mode the Decay control changes both the reverb decay time and the feedback of the dual delay, while Depth sets the depth of all four chorus voices.

  Reverse is a reverse reverb inspired by the Yamaha SPX90 and the Alesis Midiverb II. Here Decay switches between eight fixed delay times, from 150ms up to half a second. The mode also carries an envelope triggered vibrato that emulates the pitch bend of a Jazzmaster tremolo arm, with Depth setting how far that arm is pushed, and its Warmth control behaves like a Jazzmaster rhythm pickup tone control.

  Hall is a hall reverb with ascending shimmer. The reverb output feeds an octave up, which feeds back into the reverb input, creating an infinitely ascending octave feedback loop; Depth sets how noticeable that pitch effect is.
specs: |-
  - - Three reverb modes: Soft Focus, Reverse, and Hall with ascending shimmer
  - - Controls: Decay, Depth, Warmth
  - - Based on the left side of the Loomer Workstation
  - - Soft Focus mode: dual delay plus four chorus voices
  - - Reverse mode: eight fixed delay times from 150ms to half a second, plus envelope triggered vibrato
  - - Hall mode: octave up fed back into the reverb input
  - - Custom Shop teal and purple flip flop finish, chrome knobs and switches
