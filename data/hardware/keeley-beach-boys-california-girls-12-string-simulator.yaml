description: Stereo twelve-string simulator combining chorus, an octave voice
  and a short slapback echo.
details: |-
  The California Girls 12 String Simulator reproduces the sound of doubled twelve-string guitars from a standard six-string, using chorusing octaves and a short delay as the ingredients of a twelve-string shimmer.

  The effect is built from a blend of chorus, an octave voice and a touch of slapback echo. Blend sets the balance between dry signal and effect, from a subtle shimmer to a full octave jangle. Chorus sets the depth of the twelve-string simulation and Rate sets its speed. An Echo toggle adds the short slapback that stands in for the string interaction of a real twelve-string, and an alternate Echo Level control sets its volume. A further alternate control, Octave Tone, sets the brightness of the octave voice. The X2 stomp switch engages the twelve-string simulation, and with X2 off the pedal works as a chorus on its own, indicated by the blue jewel dimming.

  The pedal has stereo inputs and outputs, and bypass can be set to either true or buffered for use in longer chains.

  Beyond the twelve-string sound it is also usable as a plain chorus, as an octave layer under lead lines, and on bass guitar for a full octave effect.
