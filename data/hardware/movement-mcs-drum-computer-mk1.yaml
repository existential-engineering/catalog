description: >-
  An exceptionally rare British drum machine from 1981 combining analog
  synthesized sounds with 8-bit digital samples, featuring a CRT display
  interface. Only approximately 30 units were made.
details: |-
  The Movement MCS Drum Computer MK1 represents a unique hybrid approach to drum machine design from the early 1980s. Manufactured by Movement Computer Systems in Britain, it blends analog synthesis with digital sampling technology in a single unit — a forward-thinking combination that predates the widespread adoption of either approach. With only an estimated 30 units ever produced, it remains one of the rarest drum machines in existence.

  The instrument features seven voice cards, each containing two drum voices for a total of 14. Each voice can independently toggle between analog synthesized or 8-bit digital sampled modes, with dedicated volume and pitch-sustain controls. A distinctive computer-like interface with a monochrome CRT monitor enables graphic editing of drum patterns, which can be chained into complete songs.

  The MK1's cultural impact far exceeded its tiny production numbers. David Stewart of Eurythmics used it prominently on "Sweet Dreams," and it was also employed by The Thompson Twins, Human League, Phil Collins, Thomas Dolby, Kajagoogoo, Japan, William Orbit, Chemical Brothers, and Vince Clarke. Historical accounts suggest some of these artists used the same physical unit as it passed between groups.

  The MK2 revision arrived in 1983 with an integrated CRT display and orange or black case options. By 1984, the MK2 gained MIDI support, an 8-track sequencer, battery-backed memory, and a floppy disk drive — significant enhancements that reflected rapid technological progress in the era.
specs: |-
  - Polyphony: 14 voices (7 voice cards x 2)
  - Sound Sources: Analog synthesized and 8-bit digital samples
  - Controls: 14 trigger keys, QWERTY keyboard
  - Sequencer: Pattern-based with song chaining
  - Display: Monochrome CRT (external monitor capable)
  - Outputs: Stereo main, individual voice outputs
  - Sync: Drum sync, trigger I/O per voice, clock output
  - Storage: Cassette tape (MK1), floppy disk (MK2)
  - MIDI: Added in 1984 MK2 models
