details: |-
  The BAE Audio 8CR is an 8-module self-powered rack designed specifically for vintage Neve 10-series 8¾" high modules including the 1066, 1073, 1084, and BAE's own reproduction modules.

  Each channel features individual output level controls and a lighted 48V phantom power switch for convenient per-channel control. XLR connectors for mic input, line input, and output are located on the back panel.

  The oversized external power supply delivers twice the necessary current, ensuring clean and stable operation. An extra DC outlet is included for use with 1272 preamps or Class A Mixers. The unit is configurable for 115/230 VAC, 220/240V (Europe/Australia), or 100V (Japan) at no extra charge. Modules are not included.
specs: |-
  - Power Requirements: 115/230 VAC, 39W
  - Weight (Empty): 12 lbs / 5.44 kg
  - Dimensions: 19"W × 8.75"L × 16"D
  - Modules: not included
  - Configurable for 115/230 VAC, 220/240V (Europe/Australia), or 100V (Japan)
