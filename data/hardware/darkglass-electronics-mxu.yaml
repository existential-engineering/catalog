description: The Microtubes X Ultra is a flagship bass distortion preamp and DI
  pedal covering the whole bass distortion spectrum, with parallel processing
  split by variable low-pass and high-pass filters, a 6-band graphic EQ,
  switchable cab-sim, and a dedicated clean channel.
details: |-
  The Microtubes X Ultra is the top-tier member of Darkglass's X series bass distortion line. It brings the studio method producers have used for years to cover the whole bass distortion spectrum: from articulate high gain to punchy mild overdrive, raw and gnarly fuzz, and everything in between, giving absolute control over the texture, definition, and size of the distortion.

  The signal is split at the input by two variable low-pass and high-pass filters for parallel processing. Distortion is applied only to the high-pass signal, while a compressor works only on the low-pass signal, so lows stay tight while highs get aggressive. A dedicated clean channel bypasses the distortion and low-pass filter for a crystal-clean tone.

  Tone shaping runs through a 6-band graphic EQ (Low Shelf, 250Hz, 500Hz, 1.5kHz, 3kHz, High Shelf) and a switchable impulse-response cabinet simulation. An auxiliary input lets you play along with songs or backing tracks.
specs: |-
  - Flagship bass distortion preamp/DI pedal
  - Parallel processing split by variable low-pass and high-pass filters at the input
  - Distortion on the high-pass signal only
  - Compressor on the low-pass signal only
  - Dedicated clean channel bypasses distortion and low-pass filter
  - 6-band graphic EQ: Low Shelf, 250Hz, 500Hz, 1.5kHz, 3kHz, High Shelf
  - Switchable impulse-response cabinet simulation
  - Auxiliary input for backing tracks
