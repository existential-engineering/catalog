description: >-
  The EMS Synthi AKS extends the Synthi A briefcase synthesizer with a 256-step
  digital sequencer and a 30-note touchplate keyboard activated by the 50 Hz hum
  in the player's fingers, adding performance and sequencing capabilities to the
  portable analog format.
details: |-
  The Synthi AKS, released in 1972, builds on the Synthi A by adding a 256-step monophonic digital sequencer and a 30-note touchplate keyboard. The touchplate keyboard is activated by the 50 Hz hum present in the player's fingers, providing a unique and expressive control method.

  Electronically, the AKS retains the same core as the Synthi A and VCS3: three oscillators, a pin-matrix patchbay for signal routing, noise generator, ring modulator, voltage-controlled lowpass filter, trapezoid envelope generator, joystick controller, voltage-controlled spring reverb, and two stereo output amplifiers. After about ten minutes of warm-up, the oscillators become reasonably stable.

  The case mounting on the AKS can be fragile, and used units should be examined carefully for this common issue. The Synthi family is famous for generating the sci-fi sounds heard in productions like Doctor Who. Notable users include Brian Eno, Pink Floyd, Jean-Michel Jarre, Aphex Twin, Autechre, Vince Clarke, The Who, Yes, Stereolab, and Todd Rundgren.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 3
  - Filter: Lowpass VCF
  - Envelope: Trapezoid waveshape generator
  - LFO: Yes
  - Patching: Pin-matrix patchbay
  - Keyboard: 30-note touchplate (activated by 50 Hz hum)
  - Sequencer: 256-step monophonic digital
  - Effects: Voltage-controlled spring reverb
  - Memory: None
  - Control: CV/Gate
