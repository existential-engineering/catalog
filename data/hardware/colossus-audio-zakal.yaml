details: |-
  THIS PRODUCT IS MADE TO ORDER

  All orders placed after 10.07.26 will ship in September

  Est. shipping time approximately 3/4 weeks

  Zakal is a resonant audio feedback instrument. It generates feedback using reverb springs, with the feedback signal shaped by a low-pass filter and a delay in the feedback path or simple feedback. Additionally, Zakal can function as a spring reverb effect, offering versatile sonic possibilities. Zakal contains amplification and recovery circuits designed to generate audio feedback through its reverb springs. A switch allows you to engage the LPF and Delay within the feedback path, enabling creative control over the frequencies fed back into the spring reverb, shaping unique resonant textures. When used as a spring reverb effects unit, the POST EQ provides precise shaping of the wet signal, offering enhanced tonal flexibility. At the end of the chain, a 3-band EQ provides additional shaping of the output, offering precise control over the final sound. When used as a spring reverb effects unit, the EQ enhances the wet signal for even greater tonal versatility. ZAKAL does not include a power supply. It operates on a standard 9V DC (negative center, 2.1mm barrel plug) compatible with most guitar pedal power supplies. If you do not own one feel free to reach out, and I'll help you find a suitable option. ENG Manual

  Cancellations are accepted only within 24 hours of placing your order. After this period, production begins, and cancellations are no longer possible.
