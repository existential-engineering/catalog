details: |-
  This Custom Shop edition of the Germanium Ecstasy Treble Booster was limited to 50 units, each hand signed, and carries space-themed artwork by Phillip Ortiz. The enclosure uses oversized military-grade aluminium knobs.

  The circuit is a simple germanium treble booster. Where earlier Keeley boosters were each built around a particular batch of transistors, this version uses Russian germanium transistors, combined with three EQ options.

  A treble booster of this kind is intended for producing overdrive tones from an amplifier already pushed towards breakup, and follows from the Java Boost, Keeley's first treble booster. Circuits of this type have long been used by players including Tony Iommi, Brian May, Rory Gallagher, Eric Clapton, Ritchie Blackmore, Dweezil Zappa and Wolf Hoffmann.
