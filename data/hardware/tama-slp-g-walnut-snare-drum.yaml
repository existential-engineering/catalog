description: This 14" x 6.5" snare is constructed with an exceptionally thick
  10-ply, 9mm thick 100% walnut shell. The use of walnut- known for its dark
  fundamental timbre - for this snare's thick shell, results in a deep, complex
  tone with exceptional attack and cut.
details: |-
  Sound Arc Hoop: S.L.P. G-Walnut snare drum will be fitted with our new Sound Arc Hoops, inspired by the so-called "stick saver hoops" which were used on select vintage snare drums. The edges of the Sound Arc Hoops bend inward to enhance the natural tone of the drum and offer increased sensitivity, precision, and control.
