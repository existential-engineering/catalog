description: The TS107 is the smallest subwoofer in EVE Audio's ThunderStorm
  range, an active 7 inch class design whose 100 W PWM amplifier drives a
  proprietary 6.5 inch woofer for a response from 36 Hz to 300 Hz and a maximum
  102 dB SPL at 1 m. A passive radiator replaces the usual bass reflex tube, and
  balanced XLR inputs and outputs let the TS107 sit between the source and the
  satellite monitors.
details: |-
  EVE Audio's ThunderStorm range of subwoofers is built to give precise control over the bass frequencies in a room without low-port noise distortion, because every model uses a passive radiator rather than a reflex tube. Each ThunderStorm carries detailed controls, including switchable satellite filters (full range and 80 Hz), a phase switch (0 and 180 degrees) and a variable subwoofer filter frequency between 60 Hz and 140 Hz, so the unit can be tailored to a specific room.

  The TS107 is the smallest model in the range of EVE Audio subwoofers and features a very efficient 100 W PWM amplifier that drives a proprietary 6.5 inch woofer. That combination gives a frequency response reaching down to 36 Hz and up to 300 Hz, for a maximum output of 102 dB SPL at 1 m.

  As with every other EVE Audio subwoofer, the TS107 provides balanced XLR inputs and outputs (stereo in and out, LFE in, LFE and sub out). The TS107 additionally features an unbalanced input for connecting an SC203.

  The DSP section uses a high resolution Burr-Brown converter and affects only the bass driver operation. The signal path to the satellite speakers is kept purely analog with no A/D/A conversion, which is why the Pure Satellite function, when activated, bypasses the subwoofer and the DSP filter section completely and leaves only the satellite volume adjustable. The included remote control sets the subwoofer volume and, when the subwoofer is connected through the XLR inputs and outputs, the volume of the complete stereo system from the listening position. With an SC203 connected through the RCA input, the remote's System Volume buttons change only the subwoofer volume.

  The passive radiator that replaces the common bass reflex tube removes all audible noise caused by air turbulence and eliminates the pipe resonances that a two-sided pipe opening makes unavoidable. Its suspension has a restoring force underneath the tuning frequency and so reduces inaudible excursions in the subsonic range, which in turn reduces intermodulation distortion in the working range. The design also allows a particularly low tuning or lower cut-off frequency in a very compact cabinet.
specs: |-
  - Frequency range: 36 - 300 Hz
  - Woofer size: 6,5"
  - Max. SPL: 102 dB
  - Frequency range measured at -3 dB, 1 m distance
  - Output power: 100 W
  - Output power woofer: 100 W
  - Passive radiator: 6,5" diameter
  - Protection limiter: Yes
  - Phase inversion: 0 / 180 degrees
  - Switchable satellite filter: flat / 80 Hz
  - Variable subwoofer filter: 60 to 140 Hz + LFE
  - Remote control: Included
  - Dimensions: 230 x 355 x 300 mm (9.1 x 14 x 11.8 inches, WxHxD)
  - Weight: 8,2 kg (18.1 lb)
  - Power consumption: < 1 W standby, 120 VA maximum
