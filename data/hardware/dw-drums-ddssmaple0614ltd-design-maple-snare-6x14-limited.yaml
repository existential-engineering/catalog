details: |-
  Blue Granite FinishPly™

  While supplies last, the DW Design Series® is available in a Blue Granite FinishPly™ to add unique color to your custom-inspired, 100% Maple DW drum tone. This blue-gray finish features flakes of ashy gray to deep blue for a striking stony sparkle.Less than 100 snare drums will be made in this limited edition finish.

  100% American Maple Shells: Ten-ply shells with classic warm tones and versatility.

  DW MAG™ Throw-off System: The MAG™ throw-off has an integrated magnet and horizontal tension adjustment for smooth, easy-adjust action.

  True Pitch Tuning: Extra threads to dial in your tuning while reducing unwanted slippage.

  Triple Flange Hoops: 3.0mm chrome Steel triple flange counter hoops.
