description: Erica Synths DIY MIDI-CV is compact, highly accurate and easy to
  use duophonic MIDI interface.
details: |-
  The Erica Synths DIY MIDI-CV emulates classical monophonic and duophonic synth behaviour, and it can also be configured to follow two independent MIDI channels. A one or two voice switch and a one or two channel configuration cover both uses from the same 6HP panel.

  Two CV and gate outputs carry the converted notes, and a configurable MOD output can be set to follow either the modulation wheel or velocity. A MIDI clock output lets the rest of the system run from the incoming MIDI timing.

  An analogue glide circuit is built in on both channels, with glide time running from zero to two seconds. Conversion accuracy is held to a maximum CV deviation of 0.001V, which is one cent.

  CV output range is 0 to 8V and gate and clock levels are 5V. The module is 6HP wide and 35mm deep, and it draws 40mA from the positive rail and 9mA from the negative rail.
specs: |-
  - CV range 0-8V
  - Max CV deviation 0.001V, 1 cent
  - Gate and Clock level 5V
  - Glide time 0 to 2 seconds
  - Two CV and Gate outputs
  - Configurable MOD output, modulation wheel or velocity
  - Analogue glide on both MIDI channels
  - One or two MIDI channel configuration
  - One or two voice switch
  - MIDI clock output
  - Module width 6HP
  - Module depth 35mm
  - Power consumption +40mA, -9mA
