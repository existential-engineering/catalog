description: The AIR LINK DW 20BR is a Bluetooth wireless stereo receiver that
  brings audio streaming to an installed or portable sound system, aimed at
  hospitality and event spaces as well as retail and home audio. It has a
  maximum wireless range of 100 feet (30 m) and balanced XLR plus unbalanced
  1/4" TRS outputs.
details: |-
  A high headroom design is used for the receiver's audio path, with attention to both the design process and component selection.

  An external articulated antenna supports dependable reception over a range of up to 100 feet (30 m). Multiple receivers can be deployed to provide targeted zone broadcasting, as long as each DW 20BR is paired with only one Bluetooth streaming device at a time, which allows unique content to be streamed concurrently across individual zones.

  The compact aluminium extrusion enclosure can be permanently installed via the included floor and wall mount brackets, or placed on a shelf on its corner protectors. Connectivity is industry-standard XLR and 1/4" TRS output sockets, feeding professional mixers, amplifiers or powered loudspeakers.
specs: |-
  - Bluetooth wireless stereo receiver
  - Maximum wireless range: 100 feet (30 m)
  - Outputs: balanced XLR and unbalanced 1/4" TRS
  - External articulated antenna
  - Pairs with one Bluetooth streaming device at a time
  - Aluminium extrusion enclosure with corner protectors, floor and wall mount brackets included
