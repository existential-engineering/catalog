details: |-
  The 30ms Automatic Double Tracker is a stereo effect pedal offering studio-style doubling effects for thicker, fuller sounding instruments, here in a limited edition blackout finish. It also carries a reverb that simulates the chamber in Studio Two at Abbey Road, and is designed to work with guitar, bass, keyboard and vocals.

  Automatic double tracking was pioneered by Ken Townsend and John Lennon at Abbey Road Studios, and became a standard way of making a recording sound bigger by giving the impression of two players performing at once. The pedal is intended to put those techniques on a pedalboard.

  It can be used in mono with the built-in Abbey Verb reverb control, or in stereo as the Double Tracker Pro. Dimension mode produces altered and detuned effects in the manner of a chorus but without the regularity of an LFO, creating up to two voices for a stereo double-tracked field under user control of tuning and delay. Abbey mode is closer to a conventional chorus, simulating synchronised tape decks running in parallel at varying speeds for a wide, lush sound. Slapback mode gives a double-tracked echo using the two altered voices, and the Abbey Verb can be added to it.

  In stereo Double Tracker Pro mode the reverb channel is dropped in favour of full control of the two double-tracked voices. Each voice can be tuned up to 30 cents sharp or flat and then delayed by up to 30 milliseconds, from subtle to very distinctive doubling. Internal switches set the wet output to carry either dry and effected signal or the effect alone.
