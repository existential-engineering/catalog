description: The most powerful floorboard amp modeler, featuring six processing
  cores, Neural Capture technology, a 7-inch touchscreen, and over 90 amp models
  with 100+ effects for guitar and bass.
details: |-
  Quad Cortex is the most powerful floorboard amp modeler, featuring an unprecedented processing capacity with six cores that enables limitless sound design possibilities. Its unique Neural Capture technology can learn and replicate the sonic characteristics of physical amplifiers, overdrive pedals, and cabinets with remarkable accuracy.

  The device offers extensive connectivity and control options, including dual combo inputs with variable impedance, built-in microphone preamps, dual effects loops, and MIDI connectivity. Users can connect up to two expression pedals and utilize 11 stainless steel stomp and rotary actuators for comprehensive performance control.

  With a massive 7-inch touchscreen, Quad Cortex provides an incredibly intuitive user interface that allows effortless creation of complex signal paths. The device supports loading Neural DSP plugins and integrates with the Cortex mobile app for iOS and Android, enabling users to discover, backup, and share presets and neural captures.

  The Quad Cortex comes with an extensive library of 90+ amp models, 100+ effects, and 1000+ impulse responses, providing musicians with an unprecedented range of sonic possibilities. Neural DSP collaborates with top producers and sound designers to continually expand the device's capabilities and provide free rig captures.

  Users can manage the Quad Cortex through multiple interfaces, including the Cortex mobile app, a desktop control interface, and the device's own touchscreen, making it a versatile and powerful tool for musicians seeking advanced sound shaping and modeling capabilities.
specs: |-
  - 6 cores processing
  - 7-inch touchscreen
  - Dual combo inputs (TS, TRS, XLR)
  - Variable impedance and level controls
  - Built-in microphone preamps
  - Phantom power
  - Dual effects loops
  - Two mono balanced (TRS) outputs
  - MIDI in/out/thru
  - Dual expression inputs
  - 11 stainless steel stomp and rotary actuators
  - 90+ amp models
  - 100+ effects
  - 1000+ impulse responses
  - Neural Capture technology
