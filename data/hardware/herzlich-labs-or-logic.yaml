description: A dual 3:1 analog passive OR logic module for CV, clock, gate and
  trigger signals, passing the strongest current signal while blocking others;
  can also process audio for hard-clipped harmonics.
details: |-
  OR? Or what, buddy? Sometimes, you can't have it all - it's one or the other. That is often the case with logic signals, like gates, clocks and triggers, and mixing them can have unintended, undesirable side effects. The simple solution is the clever application of a bit of logic - OR logic. Trigger patterns, gates, clock, all fall well in control with the OR. Use the fact that stronger signals take priority to your advantage, and attenuate signals that you want to take less priority to build interesting patterns with this analog logic device. Not experimental enough? Send audio through! You will get some very interesting harmonics as all negative waveforms are hard clipped, and the strongest amplitudes will continuously take precedence over other inputs. You may just discover sounds no one had dared dream of. What you do now is up to you - or is it?
specs: |-
  - Analog logic circuit designed for CV, clock, gate and triggers
  - Use it as a dual 3:1 logic, or leave Output A unplugged to use it as 6:1 logic
  - Only passes the strongest current signal, while blocking others
  - Passive design: draws no power from your case
