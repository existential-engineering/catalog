description: An analog asymmetric fuzz derived from Keeley's Moon fuzz, with a
  redesigned tone stack for a tighter low end and a reactive clipping LED,
  controlled by Level, Filter and Fuzz.
details: |-
  The Suns Ultravoid builds on Keeley's Moon fuzz pedal, tweaking and refining that circuit rather than replacing it. The control set is deliberately simple: Level, Filter and Fuzz.

  Its redesigned tone stack gives a tighter low-end response, so the result is sharper and more focused than the original Moon. A reactive clipping LED gives the pedal a lively, harmonic-rich and dynamic feel note to note.

  The circuit is analog, with a single 1/4-inch input and output, and runs from a 9 V DC supply that is not included. It is made in the USA alongside the rest of Keeley's stompboxes.
