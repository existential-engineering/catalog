description: Hand-built analog fuzz with a switchable octave circuit, housed in
  a stainless steel vintage-style enclosure.
details: |-
  The Vintage Octave Fuzz II uses the wedge-shaped enclosure associated with the 1960s Mosrite Fuzzrite, machined from stainless steel. Alongside the fuzz circuit it carries an octave circuit, engaged by a switch on the side of the enclosure.

  The run was limited to 20 numbered and signed units, built on new red epoxy circuit boards that tie the fuzz and octave circuits together. The enclosures are new old stock cases held since Keeley's earlier batch of Fuzzrite-style builds, which the page dates to roughly seven years before this release.

  Cosmetic details follow the vintage original: flying saucer style knobs and a battery plate of the correct period design. Each unit is signed and numbered by Robert Keeley and supplied in custom packaging.

  The page carries an author credit for Robert Keeley dated December 28, 2018, links to reference material on the original Mosrite Fuzzrite and to Keeley's 2012 Fuzz Rite recreation, and points readers to a third-party builder's Fuzzrite as an alternative. A demo video is embedded.
