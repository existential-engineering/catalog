details: |-
  The Tube Drive Twin Triode Dual Overdrive carries two separate gain voices in one enclosure. One side is a genuine high-voltage vacuum tube overdrive running at 168V, and the other is the Keeley Super Phat Mod drive circuit. Either side can be used on its own or the two can be stacked.

  The tube section runs both triodes of a 12AX7 in series in Class A, and the pair of amplifier stages feeds a vintage tweed amp style tone stack. The fitted tube is a Keeley-branded Russian 12AX7, burned in and tested, displayed behind a custom matte black tube shroud. A vented jack plate manages airflow around the tube section, a rear-panel marking identifies the high-voltage design inside, and the tube can be swapped using the supplied extraction pin and allen key.

  The second side is based on the Super Phat Mod, which adds punch and sustain with a thick amp-like drive while keeping the guitar's own character. A foot gesture reverses the order of the two sections while playing, so the tube preamp can run into the Phat Mod or the Phat Mod into the tube side, which widens the range from low-gain texture to harmonically rich saturated overdrive.

  All connections sit along one side of the enclosure: Input, Output, and a Remote jack for external switching, with the tip conductor assigned to the Drive side and the ring conductor to the Tube side. Switching is selectable between true bypass and Keeley's silent buffered mode. Power is a standard 9V DC centre-negative supply rated at 500mA or more, with the high voltage for the tube generated inside the pedal. The standard version has a matte black face, backplate and tube shroud, and the pedal is designed, assembled, tested and finished at Keeley Electronics in Oklahoma City.
