description: >-
  The Roland JV-30 is a 16-part multitimbral digital synthesizer released in 1992. It
  features 24-voice polyphony, a 61-note velocity and aftertouch sensitive keyboard, and
  compatibility with Roland's GS format for seamless MIDI integration. Its preset-based
  architecture and straightforward front-panel controls make it accessible for performers
  and newcomers alike.
details: |-
  The JV-30 is a performance-oriented preset keyboard synthesizer from Roland, designed for ease of use without sacrificing professional sound quality. It is compatible with Roland's GS (General Sound) tone-mapping standard, allowing seamless integration with other Roland equipment and MIDI sequencers of the era.

    The instrument offers four key modes — Dual, Split, Fat, and Octave — accessible via dedicated front-panel buttons. Three sliders function as MIDI controllers for applying real-time expression to performances. The front panel features a 16x2 character LCD screen, volume slider, parameter buttons, effect buttons, key mode buttons, edit palette buttons, and transpose and solo controls.

    Effects processing on the JV-30 is limited to chorus and reverb, though eight different types of each are available. The 61-note keyboard provides velocity sensitivity and aftertouch with a substantial key feel. Rear connectivity includes MIDI In/Out/Thru, left (mono) and right audio outputs, a stereo headphone output, and a sustain pedal socket.

    The JV-30 is not designed for deep sound design but excels at delivering quality preset tones, particularly piano sounds. It was later succeeded by the Roland JV-35, which offered memory enhancements over the original.
specs: |-
  - 24-voice polyphony
    - 16-part multitimbral
    - 4 oscillators with ROM-based waveforms
    - 24dB slope (4-pole) filter with high pass and low pass modes
    - 1 LFO with saw up, saw down, square, and triangle waveforms
    - 1 ADR (Attack, Decay, Release) envelope
    - 8 chorus types and 8 reverb types
    - 61-note keyboard with velocity and aftertouch
    - 128 memory slots
    - MIDI In/Out/Thru
    - Left (Mono) and Right audio outputs
    - Stereo headphone output
    - Sustain pedal input
