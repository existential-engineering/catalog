  tweeter with a three-way switch (hi, low, or off) tailors the top end. Its
  distinctive high-quality finish looks the part on any stage.
details: |-
  Super-lightweight 4 x 10" bass speaker cabinet in the Rootmaster EVO II range, rated at 600 watts at 4 ohms while weighing just 21kg (46lbs). Four custom-designed White Line 10" speakers deliver the classic Ashdown sound with exceptional attack, crystal-clear clarity, and a thunderous low-end, and a high-frequency tweeter with a three-way switch (hi, low, or off) gives complete control over the highs. Constructed from lightweight plywood with a distinctive high-quality finish.
