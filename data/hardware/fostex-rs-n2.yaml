url: https://www.fostex.jp/en/products/rs-n2/
description: Reference Monitor Speaker System. A 3-way bass reflex active
  reference monitor developed based on a thorough high-fidelity reproduction
  concept, with a guaranteed frequency response of 50Hz to 20kHz +/-3dB.
  Combines a 20mm pure magnesium hard dome tweeter, 130mm (1.5") HP Scorcher
  midrange, and 300mm HP woofer with alnico magnet. Powered by a dedicated
  Accuphase Corporation PRO-30(N)/RS-N2 specification amplifier in an active
  speaker configuration. Made-to-order professional product not sold to general
  consumers or retail stores.
details: |-
  Configuration: 3-way bass reflex active speaker system

  Tweeter: 20mm pure magnesium hard dome

  Midrange: 130mm (1.5") HP Scorcher (neodymium magnet, damper-less structure, repulsive magnetic circuit)

  Woofer: 300mm HP woofer with alnico magnet and UDR tangential damper

  Amplifier: Dedicated Accuphase PRO-30(N)/RS-N2 specification (2-way multichannel)

  Accessories: Dedicated speaker cable (Neutrik speakON NL4FX-NL4FRX, 1.2m)

  Availability: Made-to-order professional product; not sold to general consumers or retail stores
