description: Reference Monitor Speaker System. A 3-way bass reflex active reference monitor developed based on a thorough high-fidelity reproduction concept, with a guaranteed frequency response of 50Hz to 20kHz +/-3dB. Combines a 20mm pure magnesium hard dome tweeter, 130mm (1.5") HP Scorcher midrange, and 300mm HP woofer with alnico magnet. Powered by a dedicated Accuphase Corporation PRO-30(N)/RS-N2 specification amplifier in an active speaker configuration. Made-to-order professional product not sold to general consumers or retail stores.
details: |-
  Developed based on a thorough high-fidelity reproduction concept, with a guaranteed frequency response. This is a made-to-order product for business use and is not sold to general commercial stores or individuals; consult Fostex for delivery dates.

  Tweeter: 20 mm pure magnesium hard dome. The need for even lower distortion and wider bandwidth in high-frequency reproduction is becoming more important with the spread of high-quality formats. In pursuit of high response performance, a pure magnesium diaphragm is used as a hard dome tweeter material.

  Mid: 130 mm HP squawker. In pursuit of the best reproducibility of vocals and narration, new technologies were applied to the materials, to the magnetic circuit with neodymium magnets and to the support structure. A damper-less structure is used for the vibration system, and the magnetic circuit uses a repulsive magnetic circuit structure holding the voice coil together with a high magnetic flux fluid. An ultra-lightweight seamless carbon bobbin, a voice coil using copper/silver alloy wire and a high-carbon cast iron frame eliminate unwanted incidental sounds.

  Woofer: 300 mm HP woofer. The woofer section uses an alnico magnet, and the latest radial paper-making technology achieves low distortion and natural mid-high frequency characteristics. A double damper structure supports the voice coil symmetrically, and UDR tangential dampers with excellent linearity provide an ideal support mechanism.

  The system is driven by a dedicated PRO-30(N)/RS-N2 specification amplifier manufactured by Accuphase Corporation, an active speaker specification combined with a dedicated amplifier to avoid fluctuations in playback conditions.
specs: |-
  - Impedance: 8 ohm
  - Form: 3-way bass reflex type
  - Units used: 300 mm HP woofer, 130 mm (1.5 inch) squawker, 20 mm pure magnesium hard dome tweeter
  - Playback frequency band: 40 Hz to 20 kHz +/-3 dB
  - Crossover frequency: 200 Hz (-18 dB) / 3.5 kHz (-12 dB)
  - Drive system: powered by a dedicated amplifier (Accuphase PRO30N/RS-N2 specification only)
  - Input (program): 300 W
  - External dimensions: 500 (W) x 830 (H) x 490 (D) mm
  - Mass: approx. 75 kg per speaker (excluding amplifier and cables)
  - Accessory: dedicated speaker cable (1.2 m)
  - Made-to-order product for business use
