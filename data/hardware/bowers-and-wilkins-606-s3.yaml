description: Performance stand-mount loudspeaker pairing a new Titanium Dome
  tweeter with the acclaimed Continuum cone bass/midrange. Delivers the ideal
  combination of size and performance for two-channel listening.
details: |-
  The 606 S3 is the larger stand-mount model in the third-generation Bowers & Wilkins 600 Series, designed to deliver high-end performance in a room-friendly cabinet. Stands are not included.

  It is a 2-way vented-box system that combines a 25mm (1 in) Decoupled Double Dome Titanium high-frequency driver with a 165mm (6.5 in) Continuum cone bass/midrange driver. The Titanium Dome tweeter is new for this generation and is paired with an acoustically transparent tweeter grille mesh for cleaner dispersion.

  Low-frequency tuning is handled by Bowers & Wilkins' Flowport technology to reduce port noise, while upgraded speaker terminals derived from the 700 Series provide an improved layout and a cleaner signal path between amplifier and drivers.

  Nominal impedance is 8 ohms (3.7 ohm minimum) with a sensitivity of 88dB and a recommended amplifier power range of 30W to 120W into 8 ohms, making the 606 S3 well-suited to a wide range of integrated amplifiers and stereo receivers.

  The cabinet is available in Black, White, or Oak finishes. The model has been recognised by What Hi-Fi? as a leading standmount speaker at its price point.
specs: |-
  - 2-way vented-box system
  - High-frequency driver: 1x 25mm (1 in) Decoupled Double Dome Titanium
  - Bass/midrange driver: 1x 165mm (6.5 in) Continuum cone
  - Frequency response: 52Hz - 28kHz (±3dB on-axis)
  - Frequency range: 40Hz - 33kHz (-6dB)
  - Sensitivity: 88dB (on axis at 2.83Vrms at 1m)
  - Nominal impedance: 8Ω (minimum 3.7Ω)
  - Recommended amplifier power: 30W - 120W into 8Ω
  - Harmonic distortion: <1% (100Hz - 22kHz), <0.5% (150Hz - 12kHz)
  - Max recommended cable impedance: 0.1Ω
  - Dimensions (H x W x D): 344 x 189 x 300mm (13.5 x 7.4 x 11.8 in), 328mm (12.9 in) depth with grille
  - Net weight: 7.05kg (15.5 lb) each
  - Available finishes: Black, White, Oak
