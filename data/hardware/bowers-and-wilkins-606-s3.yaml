details: |-
  The 606 S3 is the larger of the two stand-mount models in the Bowers & Wilkins 600 Series, pitched as the balance point between size and performance in the range. It is a two-way vented-box design pairing a 25mm Titanium Dome tweeter with a 165mm Continuum cone that handles bass and midrange together, with Flowport porting.

  Bowers & Wilkins describes the model as taking the award-winning 606 formula and evolving it, complementing the Continuum cone and the Titanium Dome tweeter with upgraded speaker terminals and a subtly modernised design. The all-new Titanium Dome tweeter is credited with combining resolution and insight with a smooth, refined high-frequency reproduction, and it sits behind a new, more acoustically transparent tweeter grille mesh first developed for the Signature models.

  The Continuum cone's composite construction is intended to avoid the abrupt transitions in behaviour that can impair a conventional drive unit, which Bowers & Wilkins ties to a more open and neutral performance. The speaker terminals are derived from those introduced in the 700 Series range and are described as having an improved layout and a cleaner signal path between amplifier and loudspeaker.

  The 606 S3 is passive and needs an external amplifier. Nominal impedance is 8 ohms with a 3.7 ohm minimum, sensitivity is 88dB, and Bowers & Wilkins recommends 30W to 120W into 8 ohms on unclipped programme with total cable impedance below 0.1 ohm. The owner's manual states the speaker has two linked pairs of terminals: the links remain fitted for a conventional single-amplifier connection and are removed for bi-wiring or bi-amplification, which the manual says can improve the resolution of low-level detail.

  Placement is stand-first. The manual says the 606 S3 is primarily designed for the dedicated FS-600 S3 floor stand and notes that shelf placement offers less flexibility to optimise performance, recommending the supplied foam plugs to tune port behaviour if a shelf must be used and that the four self-adhesive rubber feet be fitted underneath. Stands are not included. Three finishes are offered, Black, White and Oak, with a black grille on Black and a grey grille on White and Oak.
specs: |-
  - Description: 2-way vented-box system
  - Technical features: Decoupled Double Dome Titanium tweeter, Continuum cone bass/midrange, Flowport
  - Drive units: 1x 25mm (1in) Titanium Dome high-frequency, 1x 165mm (6.5in) Continuum cone bass/midrange
  - Frequency range: -6dB 40Hz to 33kHz
  - Frequency response: 52Hz to 28kHz +/-3dB from reference axis
  - Sensitivity: 88dB (on axis at 2.83Vrms at 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m on axis), less than 1% 100Hz to 22kHz, less than 0.5% 150Hz to 12kHz
  - Nominal impedance: 8 ohms (minimum 3.7 ohms)
  - Recommended amplifier power: 30W to 120W into 8 ohms on unclipped programme
  - Max recommended cable impedance: 0.1 ohms
  - Terminals: two linked pairs of binding posts, links fitted for conventional connection and removed for bi-wiring or bi-amplification
  - Terminals accept 4mm banana plugs, 6mm and 8mm (1/4in and 5/16in) spades, or bare wire up to 4mm diameter
  - Dimensions: Height 344mm (13.6in) cabinet only, Width 189mm (7.4in) cabinet only, Depth 300mm (11.8in) cabinet only, 328mm (12.9in) including grille and terminals
  - Net weight: 7.05kg (15.5 lb)
  - Cabinet finishes: Black, White, Oak
  - Grille finishes: Black (Black), Grey (White and Oak)
  - Primarily designed for the FS-600 S3 floor stand, may be shelf placed; stands not included
  - Supplied with grille, foam port plug and four self-adhesive rubber feet
  - Passive loudspeaker: no on-board amplification and no mains connection
