description: The RFX-1000 is a 1U 19-inch rack digital reverb and multi-effect processor holding 33 effects across three banks (REVERB, EFFECTS and MIX&SFX), each with 11 character or variation settings for 363 preset programs in total. A front-panel microphone input mixes with the rear line inputs and supplies the control signal for the vocoder effect.
details: |-
  The RFX-1000 is a 1U 19-inch rack digital reverb and multi-effect processor. Its 33 effects are laid out as 11 effects across three banks selected by a switch, each effect carrying 11 character or variation settings, which Zoom counts as 363 preset programs. Reverb alone accounts for 121 of those settings.

  The REVERB bank runs from Hall, Room and Plate programs through banks tuned to a source: VOCAL for singers and narration, AMBIENCE for whole stereo mixes, PERCUSSION for drums, ENSEMBLE for strings, brass and organ, and POWER for adding weight to kicks, snares, distorted guitar and vocals. A DIMENSION group controls spatial spread instead, with stereo-to-mono and mono-to-stereo conversion, left-right swaps and ping-pong reverb, and the bank closes with a GATE program whose reverb is cut short by a threshold-triggered gate and a REVERSE program that works like tape run backwards.

  The EFFECTS bank holds seven single effects, a compressor and limiter, a delay reaching 1486 ms with cross-feedback, a stereo pitch shifter covering a 7 cent detune up to an octave either way, a three-voice-per-channel stereo chorus, a wide-range stereo flanger, a phaser and a tremolo-to-auto-pan effect. Four more entries combine two of them, either in series (delay or chorus into reverb) or split across the two channels in parallel (delay left and reverb right, flanger left and reverb right).

  The MIX&SFX bank covers mixdown and the unusual ones. Four mixdown programs emphasise bass, stereo spread, the extremes of the spectrum, or the midrange with plate reverb added. MIC SIMULATOR makes a cheap dynamic microphone sound like a high-quality condenser, with a limiter and a treble enhancer. CABINET SIM adds combo or stack speaker-cabinet character to an electric guitar. ROTARY models a mechanically turned rotary speaker with its own drive control. RING MOD is a ring modulator with a short delay. RESONANCE is a resonant filter with manually set or envelope-following cutoff. Lo-Fi EFX degrades the sound on purpose. VOCODER uses a microphone on the front-panel jack to shape a synthesizer fed to the left input, across 10 or 18 bands with optional chorus and distortion.

  Signal handling is 18-bit conversion at 44.1 kHz, with 64-times oversampling in and 8-times out, around Zoom's own ZFX-2 DSP doing 24-bit processing. Rear 1/4-inch inputs take a line-level stereo or mono source at -10 dBm to +4 dBm, with the L/MONO jack feeding both channels on its own. A guitar needs a preamp or pedal in front. The dedicated front-panel MIC IN jack takes a 600 ohm dynamic microphone, mixed with the rear inputs except when VOCODER uses it as the control signal. A rear BYPASS jack takes the optional FS01 foot switch for turning effects on and off, and power comes from the supplied AD-0008 12 V AC adapter. The chassis is 482 x 44 x 115 mm and weighs 1.5 kg on a metal frame.
specs: |-
  - 1U 19-inch rack digital reverb and multi-effect processor, EIA and DIN rack compatible (rack screws not supplied)
  - 33 effects (11 effects x 3 banks), 363 preset programs counting the 11 character or variation settings per effect
  - REVERB bank: HALL, ROOM, PLATE, VOCAL, AMBIENCE, DIMENSION, PERCUSSION, ENSEMBLE, POWER, GATE, REVERSE. 121 reverb settings in total
  - EFFECTS bank: COMP LIM, DELAY, PITCH, CHORUS, FLANGER, PHASER, TRM-PAN, plus DLY+REV and CHO+REV in series and DLY/REV and FLG/REV split across the two channels in parallel
  - MIX&SFX bank: POWER MIX, WIDE MIX, BOOST MIX, VOCAL MIX, MIC SIMULATOR, CABINET SIM, ROTARY, RING MOD, RESONANCE, Lo-Fi EFX, VOCODER
  - Delay time up to 1486 ms with normal or cross feedback, 743 ms in the combined delay and reverb programs
  - Pitch shift from a 7 cent detune to 1200 cents (one octave) up or down, stereo
  - VOCODER selectable 10 or 18 filter bands, fast or slow attack, with optional chorus and distortion. Controlled from MIC IN or from the right input
  - RESONANCE filter cutoff set manually or driven automatically by the input signal envelope
  - Sampling frequency 44.1 kHz, A/D converter 18-bit with 64 times oversampling, D/A converter 18-bit with 8 times oversampling
  - DSP: Zoom original ZFX-2, 24-bit signal processing
  - Rear inputs: L/MONO and R on standard monaural phone jacks, input impedance 10 kohm mono and 20 kohm stereo, reference input level -10 dBm to +4 dBm. L/MONO alone feeds both channels
  - Microphone input: 1 standard monaural phone jack on the front panel, input impedance 20 kohm, reference input level -56 dBm, for a dynamic microphone of about 600 ohm output impedance
  - Outputs: L and R on standard monaural phone jacks, output impedance 100 ohm or more, reference output level -10 dBm to +4 dBm
  - Control connector: BYPASS, for the optional FS01 foot switch, which turns the effects on and off
  - Front panel controls: INPUT, OUTPUT, MIX (dry/wet), REVERB TIME/ADJUST, CHARACTER/VARIATION selector, BANK switch, EFFECT TYPE selector, level meter with CLIP LED
  - A high-impedance source such as an electric guitar should be routed through a preamplifier or a guitar effect first
  - Power requirements: AC adapter 12 V AC (AD-0008), supplied
  - Dimensions 482 (W) x 44 (H) x 115 (D) mm
  - Weight 1.5 kg
