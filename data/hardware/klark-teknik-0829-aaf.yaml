description: Used in conjunction with the DM8000 Digital Audio Processor, the
  CP8000UL provides control over volume and selection for up to 6 auxiliary
  inputs. Its illuminated soft-touch controls receive power directly from the
  DM8000 over CAT5/6 or any 5-conductor cable, and the single-gang plate fits
  most standard-depth installation enclosures.
details: |-
  The CP8000UL acts as a remote control centre for a range of audio applications, allowing fast input selection from up to 6 auxiliary sources and adjustment of the selection's volume level. The volume control may be assigned to either the auxiliary input section or the main mix bus, and the soft-touch illuminated controls need no external power because the operating voltage is supplied by the DM8000.

  Installation uses most standard-depth enclosures and two screws beneath the front plate: remove the front panel, connect the cabling, fasten the main unit into the enclosure with the provided mounting screws and replace the front panel. The compact single-gang format allows use with low voltage trim rings, and inexpensive CAT5/6 or any 5-conductor cable carries the connection for distances up to 300 feet (100 m).

  A generous space beside each soft-touch button allows the name of the assigned audio source to be noted, either written directly onto the surface or applied as a sticky label.
specs: |-
  - Remote control panel for the DM8000 Digital Audio Processor
  - Volume and selection control for up to 6 auxiliary inputs
  - Volume control assignable to the auxiliary input section or the main mix bus
  - Illuminated soft-touch controls powered from the DM8000, no external power required
  - Connects over CAT5/6 or any 5-conductor cable
  - Cable runs up to 300 feet (100 m)
  - Single-gang format, fits most standard-depth installation enclosures
  - Compatible with low voltage trim rings
