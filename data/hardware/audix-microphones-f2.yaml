details: |-
  The Fusion Series are high-performance microphones in a cost-effective package.
  The f2 dynamic instrument microphone is best used for miking instruments requiring mid-bass and mid-high reproduction in live and studio applications. Its hypercardioid pick-up pattern helps to minimize feedback and isolate the instrument from ambient sound coming from the room or other instruments on stage.

  Low impedance and balanced output on the f2 allow interference-free performance. Compact and durable, the f2 hypercardioid instrument microphone features a cast zinc alloy body, steel mesh grille and gold plated XLR connector.

  Designed, assembled, and tested by AUDIX in the USA.
specs: |-
  - Type: Dynamic instrument microphone
  - Polar pattern: Hypercardioid
  - Body: Cast zinc alloy with steel mesh grille
  - Output: Low impedance, balanced, gold-plated XLR connector
