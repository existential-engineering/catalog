details: |-
  The 4 Knob Compressor is the pedal Keeley built the company on, with more than 44,000 units made in the USA since 2001. It has been described by Keeley as an audiophile and studio-grade compressor with rack mount quality in a stompbox enclosure. It took Guitar Player magazine's Editor's Pick award in 2004 and a later Reader's Choice award for stompbox compression.

  The Sustain control sets the amount of compression. Around the 9 o'clock position the effect is barely noticeable and takes out only loud sudden peaks, which is useful for protecting speakers. Around 12 o'clock it gives the presence suited to leaving the pedal on continuously while performing, and around 3 o'clock it suits solos and brings out playing dynamics. Fully cranked, the pluck of the pick is emphasised.

  An internal Attack control is provided for bass players with high-output active pickups or active pedalboards with buffers. The Clipping control is an input sensitivity control, which allows the pedal to be used in a studio with keyboards, drum machines, drum mics, master recordings and other line-level sources.

  Switching is true bypass through a triple pole double throw switch, so there is no tone loss or signal reduction when the effect is off, with an LED for effect indication. The pedal runs from a 9V battery or a standard 9V DC adapter at a low 5mA current draw, and every unit is tested before it leaves the shop.
