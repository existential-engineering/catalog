details: |-
  The Synthetone SX-1000 is a basic monophonic synthesizer produced by Italian
  manufacturer Jen Electronics from 1978 to 1982. Despite its simplicity, this
  compact instrument has earned a dedicated following thanks to its distinctive
  analog voice and surprisingly capable sound.

  The synth features a single DCO offering sawtooth, square, and pulse-width
  modulation waveforms across a four-octave range, paired with white and pink
  noise generators. A 12dB/octave low-pass filter with its own ADSR envelope
  provides the tonal shaping, while a separate ADSR handles the VCA.

  The SX-1000 lacks MIDI, CV/Gate, or any other form of external control in
  its stock configuration, though MIDI retrofit kits have become available.
  It also has no patch memory, meaning all sound settings are managed entirely
  through its front panel controls. Glide and vibrato effects round out the
  feature set.

  Despite these limitations, the Synthetone has appeared on recordings by
  notable electronic acts including Future Sound of London, LFO, Ladytron,
  Prodigy, and Broadcast, all drawn to its raw analog character and its
  ability to cut through a mix with aggressive lead tones.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 DCO (sawtooth, square, PWM)
  - Octave range: 32', 16', 8', 4'
  - Noise: White and pink generators
  - Filter: 12dB/oct low-pass with ADSR
  - VCA: 1 ADSR envelope
  - LFO: 1 with vibrato
  - Keyboard: 37 keys
  - Effects: Glide, vibrato
  - Memory: None
  - Control: None (MIDI retrofits available)
releaseDate: "1978"
