description: >-
  The Casio SK-1 is an inexpensive portable sampling keyboard released in 1985, featuring
  four-voice polyphony, 8-bit PCM sampling, and 32 mini-keys. Despite its toy-like design
  and limited capabilities, it became a cult classic in lo-fi and experimental music, used
  by artists including Fatboy Slim, Beck, and Portishead.
details: |-
  The SK-1 emerged in 1985 as "the cheapest sampler in the world," designed primarily as a consumer toy rather than a professional instrument. Its simplicity and affordability made it accessible to amateur musicians and producers who couldn't afford genuine sampling equipment. The device featured eight-bit PCM sampling at 9.38kHz with approximately 1.4 seconds of recording time, delivering characteristically gritty, degraded audio.

  The unit's built-in sampling was limited to either a low-quality onboard microphone or a 3.5mm line input. Its memory would completely clear upon power-off, preventing any permanent sound storage. These restrictions, combined with cheap plastic mini-keys and lack of MIDI connectivity, positioned it squarely in the novelty category.

  The SK-1 included eleven preset drum accompaniment patterns covering styles like disco, rock, samba, and waltz. Thirteen envelope shapes provided some sonic flexibility, alongside portamento and vibrato modulation. However, the absence of filters, effects processing, and real editing capabilities severely limited creative potential.

  Despite its limitations, the SK-1 achieved cult status in experimental and lo-fi music circles. Notable artists including Fatboy Slim, Beck, Portishead, Nine Inch Nails, and Blur incorporated the SK-1 into their work, particularly favoring circuit-bending modifications to unlock unconventional sounds.
specs: |-
  - Polyphony: 4 voices
  - Keyboard: 32 mini-keys
  - Sampling: 8-bit PCM, 9.38kHz, ~1.4 seconds maximum
  - Oscillators: 5 PCM tones (piano, brass ensemble, trumpet, synth drums, human voice); 3 synth tones (flute, pipe organ, jazz organ)
  - Drum Patterns: 11 styles
  - Sequencer: 100 steps polyphonic; 99-step chord sequence; 198 steps per two solo voices
  - Envelope Shapes: 13
  - Modulation: Portamento and vibrato
  - Filter: None
  - Effects: None
  - Memory: Volatile (lost when powered off)
  - MIDI: Not supported
