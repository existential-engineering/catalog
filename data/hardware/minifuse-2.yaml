description: >
  MiniFuse 2 is a next-gen audio & MIDI interface that gives you everything you need to make music and audio your own way. With unmatched sound quality, smart connectivity, and an exclusive music-making software pack, this is a portable audio companion evolved.
details: |-
  Minifuse 2 is a next-generation audio and MIDI interface designed for musicians, producers, singer-songwriters, podcasters, and content creators. It combines unmatched sound quality with smart connectivity and an exclusive music-making software pack, offering a portable audio companion that works seamlessly whether you're in a studio, at home, or on the go. The interface is built to answer every audio question with intuitive controls and professional-grade sound reproduction.

  The audio inputs feature a single combo xlr/1/4 inch input with 48v phantom power for condenser microphones, gain control with backlit knobs that turn red when signal is too high, and an instrument level switch for clear, consistent signal. The monitoring system includes a vu meter for real-time color-coded feedback, direct mono switch to monitor inputs as a single mono signal, and monitoring mix control to blend between input and computer signals. Output options include 2x 1/4 inch trs balanced line outputs for studio monitors and a stereo headphone output with independent volume control.

  Connectivity is handled through USB-c for computer connection (compatible with both pc and mac), MIDI din in/out for synths and drum machines, and a USB 2.0 type-a hub port for additional devices up to 250ma. The interface features stereo virtual loopback functionality for recording system audio, with windows offering 3 independent stereo loopback channels with individual mixers. The rugged aluminum casing and compact lightweight design make it ideal for mobile producers, while the minifuse control center app provides centralized monitoring of inputs, outputs, settings, and firmware updates.

  The included software package features ableton live lite for composition and production, analog lab intro with 500 vintage and modern keyboard presets, and arturia fx plugins including rev plate-140 reverb, pre 1973 vintage preamp, delay tape-201 echo, and chorus jun-6 analog chorus. Additional software includes native instruments guitar rig for guitar processing with amps, cabs, delays, reverbs, and compressors, plus 3-month subscriptions to auto-tune unlimited for vocal tuning and splice creator plan for royalty-free samples and tutorials.

  The minifuse 2 champagne edition features the same specifications and capabilities as the standard model but with a sleek metallic champagne finish. Every unit undergoes over 200 reliability tests before approval, ensuring robust build quality and durability. The 5-year hardware warranty is one of the most extensive warranties on the market, reflecting arturia's confidence in the product's longevity and reliability.
specs: |-
  - 2x combo xlr/1/4 inch inputs with 48v phantom power
  - 2x 1/4 inch trs balanced line outputs
  - 1x stereo headphone output with 1/4 inch jack
  - 1x MIDI din in/out
  - 1x USB-c connection
  - 1x USB 2.0 type-a hub port (250ma max)
  - 110db dynamic range
  - -129db equivalent input noise (microphone preamp)
  - Gain control with backlit knobs
  - Instrument level switch
  - Direct mono switch
  - Monitoring mix control
  - Vu meter
  - Stereo virtual loopback channel
  - 3x stereo virtual loopback channels with independent mixer (windows only)
  - Rugged aluminum casing
  - Compact and lightweight design
  - Windows 10+ (64-bit) compatible
  - Macos 10.13+ (64-bit) compatible
  - 4gb ram minimum (8gb+ recommended)
  - 64-bit intel core or amd multi-core processor (i5 or faster recommended)
  - Size: 43 x 200 x 100 mm (1.69 x 7.87 x 3.94 inches)
  - Weight: 0.43 kg (0.95 lb)
  - Line input impedance: 16k ohms
  - Line input maximum level: +22dbu
  - Line input gain range: 56db
  - Line input frequency response: 20hz to 20khz ±0.05db
  - Instrument input impedance: 1m ohm on tip
  - Instrument input maximum level: +11.5dbu
  - Instrument input gain range: 56db
  - Instrument input frequency response: 20hz to 20khz ±0.06db
  - Microphone preamp input impedance: 2.5k ohms
  - Microphone preamp maximum input level: +9dbu
  - Microphone preamp gain range: 56db
  - Microphone preamp frequency response: 20hz to 20khz ±0.06db
  - Speaker output impedance: 94 ohms
  - Speaker output maximum level: +12dbu
  - Speaker output frequency response: 20-20khz ±0.09db
  - Headphone output impedance: 10 ohms
  - Headphone output maximum level: +11.4dbu
  - Headphone output frequency response: 20-20khz ±0.09db
  - Headphone power at 33 ohm: 137mw
  - 5-year hardware warranty
