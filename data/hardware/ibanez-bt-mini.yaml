name: BTMINI
manufacturer: ibanez
primaryCategory: pedal
categories:
  - boost
url: https://www.ibanez.com/usa/products/detail/btmini_01.html
description: Made in Japan booster pedal with Bass, Treble, and Level controls —
  a step up from single-knob boosters, offering tonal flexibility from
  wide-range tone shaping to mid-boost lead cut. Built around a Japanese-made
  JRC MUSES 8820 op-amp.
details: |-
  Ibanez is proud to announce a new addition to the MINI pedal lineup. The BTMINI booster features three controls; BASS, TREBLE and LEVEL. Unlike a single knob booster, the BASS and TREBLE EQ enables significant tonal flexibility.

  The pedal offers settings such as Wide Range (Bass and Treble turned up for broader tone and volume) and Mid Boost for cutting through band mixes. All manufacturing occurs in Japan using a Japanese-made JRC MUSES 8820 op-amp. A true bypass switch ensures the shortest, most direct signal path.
specs: |-
  - Controls: Level, Bass, Treble
  - True Bypass
  - Required Current: 12mA@9V
  - Power Supply: External DC 9 volt AC adapter (Center-negative)
  - Japanese-made JRC MUSES 8820 op-amp
  - Made in Japan
