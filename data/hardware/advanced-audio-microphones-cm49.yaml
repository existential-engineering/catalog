  well as classical orchestral use.
details: |-
  THE CM49 HAS BEEN DISCONTINUED AND IS NO LONGER BEING STOCKED. IT HAS BEEN REPLACED BY THE CM49LE WHICH IS EVEN CLOSER TO THE ORIGINAL M49C

  "The Classical Companion. Elegant and Exceptional"

  The Advanced Audio CM49 was designed with the vintage Neumann M49 in mind. As with all of our microphones, we did not clone one of the vintage M49 versions. Rather, we used modern designs, circuitry, and components while maintaining the sound of this classic microphone famous for producing smooth pop and soulful vocals. The M49 gained notoriety capturing the distinct vocals of Bob Dylan, Miles Davis, Billie Holliday, and the Beatles ´Help´ overdubs. Additionally, it is considered the classical orchestra workhorse. Renowned for the lush vocal sounds of the 50's, Advanced Audio's CM49 touts the same natural and accurate reproduction, but captures a more refined high-end and smooth bottom-end. The story of how it came about:

  A visit to the Sony Culver city lot and the first meeting of our friend, Joseph Magee (supervising music mixer), led us into the famed soundstage that recorded Wizard of Oz in 1939, which now uses, you guessed it- Neumann M49's. Joseph's comment: "Have you guys ever thought of making an M49 type mic? I love your 251 and 47ve, but would absolutely love to have an m49." We returned from LA and the team got started right away. The resulting prototype made its rounds, with the first going directly to Joseph Magee who gave it his seal of approval. "When it arrived, I put it up against one my favourite M49's on the planet. The result was shocking...anyone knowing M49's would be shocked" -Joseph Magee(Supervising film music mixer)

  Here is a great example of what the CM49 does best- female vocals. Joseph used his CM49 (among other AA mics) on the beautiful and talented Katie Anne Clark:

  "This new CM49 gives me such a sense of detail. The results of the mic in the mix are awesome." -Katie Anne Clark

  The CM49 was also featured not only the vocals of legendary jazz singer and founding member of the Manhattan Transfer, Erin Dickens but also on the cover of her latest and highly rated Jazz Album "Vignettes". Capsule:

  The CM49 uses our own, hand-assembled AK47. The capsule is a 32mm OD dual diaphragm, single back-plate, centre-fed design. Although they originally called the capsule a K49, it is an exact reproduction of the early Neumann K47 from the late 50's (the capsule used in the M49). Each capsule is hand-inspected and tested by Advanced Audio techs. Advanced Audio capsules use 6 micron thick, gold-sputtered mylar. "The CM49 on Pete Effamy's vintage sax"orauthenticity from your end is fantastic! A lovely mix of treacle, air and clarity"-Peter Effamy(London sessions player)

  O riginal 1959 K49 capsule AA exact reproduction AK47 capsule t

  In the initial stages, Advanced Audio had the opportunity to have our CM49 shot out against originals on varied sources. As well as the M49's solid reputation as a soulful vocal mic, it became the go-to mic for horns and as an orchestra OH. Ross Cullum, A-B'd our CM49 prototype against an original M49 on strings and OH. "I thought it was very musically pure. It has good body and warmth. It's the sort of mic where you just hear the instrument, not the mic - a very good thing sometimes" -Ross Cullum(London composer)

  Circuit:

  By using Advanced Audio's modern 2-stage tube mic circuitry, the CM49 has a much lower output impedance, yielding more headroom than the original. The hand-selected Electro Harmonix 6072a valve is one of the quietest hifi tubes available. The output transformer is our own custom-wound BV18 transformer. This dual bobbin transformer has bi-metal (a mixture of iron and nickel) laminations. It provides very fast damping, resulting in a clear, undistorted transient response. The 8:1 ratio windings, along with the dual-stage circuit, deliver > +10dBu, with less than 1% of distortion. "The CM49 looking lovely in lights"

  The CM49 also traveled to Atlantico Blue in Lisbon to test on piano and vocals. "Unbelievable! Both the bottom and top end are more extended and defined when placed against the orginal" -Rui Guerreiro(Producer, Studio Manager Atlantico Blue)

  The voltage of the power supply (included) is set for each microphone. The 9-pattern power supply adds significant versatility. You can open up the cardioid to get more room, or tighten it to get more proximity. Put it on fig 8 for Miles-type horns, or put it in omni for Dylan-like vocals! The Curves:

  Specifications:

  Whats included?
specs: |-
  - Pattern Selection: 9 patterns switched for the power supply.
  - Circuit type: Class "A" 2 stage CCDA tube circuit, transformer coupled
  - Capsule: 32mm singleback-plate, 6-micron mylar skinned diaphragms
  - Capsule Polarization: 60V in Cardiod to back-plate
  - Tube type: socketed 9 pin, selected 6072a dual triode
  - Transformer:BV18 dual bobbin custom 8:1 ratio with bi-metal laminations.
  - Transformer Distortion: <1%@20Hz/+10dBu and <0.05%@50Hz/+10dBu
  - Max SPL: 128dB
  - Frequency response: 25Hz-20kHz + or - 3db
  - Equivalent Noise Level: <14dB (A- weighted)
  - S/N Ratio: >85dB (Ref. 1Pa A-weighted)
  - Sensitivity: -34dBu
  - Output impedance <200 ohm (load impedance <1.2K)
  - Output connector: Male XLR, 7-pin gold plated
  - The beautiful CM49 in leather case
  - Heavy duty, thread-on shock mount
  - 25' gold pin, 7 pin cable
  - Foam pop filter
  - 9 pattern power supply
  - Power cable
  - Travel case
  - 2 year warranty
