description: 12 simultaneous recording tracks, interchangeable capsules, and an
  App-driven touchscreen interface, the H8 is designed to meet all your audio
  recording needs.
details: |-
  Whether you are capturing audio on location, recording music, or producing a podcast, the H8 colour touchscreen adapts to your project's needs with three App-driven interface options, all with the touch of a finger.

  The PODCAST App makes high-production quality simple. With dedicated Sound Pads, use the touch screen to trigger sound effects, music beds and more. Choose from 13 high quality sounds or load your own via an SD card. The Podcast app accommodates up to 4 mics and two Sound Pad channels.

  The MUSIC App puts all the important controls at your fingertips: audio levels, faders, metering and more. With 10 inputs and 12 tracks, capturing a large group is easy. Mix, overdub, and enhance your recordings with EQ and compression, and connect to Zoom's Guitar Lab via USB to access an assortment of amps and effects. The FIELD App is ideal for location sound, sound design, conferences, and more, giving instant access to large meters for every track and to input type, lo-cut, compressor, limiter, noise gate and other key settings.

  The H8 comes with the Zoom XYH-6 microphone, a capsule providing two matched high-quality unidirectional mics for capturing signal directly in front of the recorder, and the Zoom mic capsule system lets you swap capsules to suit the job. Zoom's Capsule System 2.0 allows up to 4 channels of audio to be added to the H8's capsule connection: the XAH-8 rotates from a tight XY pattern to a wide AB pattern, the VRH-8 is an Ambisonic capsule using four condenser microphones with a built-in accelerometer and an on-board Ambisonic decoder, and the EXH-8 expander provides 4 additional XLR inputs for a total of 10.

  The H8 offers 4 XLR inputs with dedicated pad switches and gain control. Two additional XLR/TRS combo jacks with Hi-Z switches allow you to capture line level signals, microphones, or directly record electric guitars and basses. Monitor tracks using the built-in 1/8-inch headphone output or connect directly to a camera using the dedicated stereo line output, and connect via USB to a PC, Mac or iPad for up to 12 channels of simultaneous recording.

  Get more than 10 hours of recording time from just 4 AA batteries, or run continuously with the optional AD-17 adapter. The H8 records BWF-compliant WAV and MP3 files. Insert a BTA-1 wireless adapter and connect an iOS device to monitor level meters and hit REC, PLAY and STOP in each H8 application mode.
specs: |-
  - Customized applications for field recording, music and podcasting, with 3 distinct interfaces
  - Interchangeable input capsules
  - 12-track simultaneous recording
  - Four mic inputs and two XLR/TRS combo connectors
  - Gain control knobs and -20 dB pads for each input
  - Supplied XYH-6 X/Y capsule provides secondary input via a stereo 1/8-inch Mic/Line In mini phone jack
  - Phantom power for all six XLR mic inputs: +24V/+48V, independent on/off for Inputs 1 to 4, A and B
  - Large color LCD touchscreen display
  - Records directly to SD, SDHC and SDXC cards up to 512 GB
  - Up to 24-bit/96 kHz audio in BWF-compliant WAV or a variety of MP3 formats
  - Auto-Record, Pre-Record and Backup-Record functions
  - Built-in effects, including low-cut filtering, compression, and limiting
  - Multichannel and stereo USB audio interface for PC/Mac/iPad
  - Accepts standard AA alkaline or NiMH rechargeable batteries
  - Over 10 hours of operation with 4 AA alkaline batteries
  - Number of input channels: 8 (X/Y mic capsule, 1 to 4, A, B)
  - Number of output channels: 2 (stereo headphone and stereo line)
  - Mic In connector: Zoom mic connector
  - Inputs 1 to 4: XLR jacks (pin 2 hot)
  - Inputs A/B: XLR/TRS combo jacks (XLR pin 2 hot, TRS tip hot)
  - USB: USB Micro-B for audio interface, mass storage and Guitar Lab connection. A data-transfer cable is required and operation on USB bus power is possible
  - Remote: Zoom BTA-1 or other dedicated wireless adapter
  - Line Out: 3.5 mm stereo mini
  - Phone Out: 3.5 mm stereo mini
  - Recording media: cards that support SD/SDHC/SDXC specifications
  - Formats: WAV 44.1/48/96 kHz at 16/24-bit mono or stereo, MP3 128/192/320 kbps
  - Maximum simultaneous recording tracks: 12 (Mic In, backup recording, 1 to 4, A, B, and LR)
  - Audio interface multitrack mode: 44.1/48/96 kHz at 16/24-bit, 12 in / 2 out
  - Audio interface stereo mix mode: 44.1/48 kHz at 24-bit, 2 in / 2 out
  - Tuner: chromatic, guitar, bass, open A, open D, open E, open G, DADGAD
  - Built-in speaker: 400 mW, 8 ohm, mono
  - Display: 2.4-inch full-color touchscreen LCD, 320 x 240
  - Power: 4 AA batteries (alkaline, NiMH or lithium), AC adapter (Zoom AD-17) DC 5V/1A, or USB bus power
  - Battery operation using the X/Y mic at 44.1 kHz/24-bit (stereo x 1): about 10 hours
  - External dimensions, H8: 116.4 (W) x 163.3 (D) x 48.6 (H) mm, 354 g
  - External dimensions, XYH-6: 78.9 (W) x 60.2 (D) x 45.2 (H) mm, 130 g
