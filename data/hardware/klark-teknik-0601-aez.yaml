id: 98ZqrCcCecS7qohbLx5tj
name: DN1248PLS-FM
manufacturer: klark-teknik
primaryCategory: routing
categories:
  - preamp
  - rack-mount
  - outboard
url: https://www.klarkteknik.com/en/products/0601-AEZ
description: The DN1248PLS-FM combines full transformer isolation with dual
  redundant auto-ranging power supplies, the highest reliability tier in Klark
  Teknik's 12-channel microphone splitter range. It is intended for broadcast,
  festival main-stage and installation work where downtime is unacceptable and
  ground-loop immunity is required across every output.
details: |-
  Each of the twelve channels passes through a MIDAS HERITAGE microphone preamplifier, then feeds four transformer-balanced outputs. The transformers provide galvanic isolation across all 48 outputs, decoupling consoles, outside broadcast trucks and recording rigs from any shared earth reference.

  Two auto-ranging universal switch-mode power supplies operate in parallel, and either supply can power the entire chassis. Failure of one supply is transparent to the signal path, with the second carrying the load instantly. Both supplies accept 100 to 240 V AC at 50/60 Hz.

  Applications include major-event broadcast splits, network television outside broadcast feeds, festival main-stage distribution between front of house, monitor and broadcast positions, and continuous installations where the splitter is on a critical path.
specs: |-
  - 12 channels x 4 transformer-balanced outputs
  - MIDAS HERITAGE microphone preamplifier per channel
  - Galvanic isolation across all 48 outputs
  - Dual redundant auto-ranging switch-mode power supplies, either able to power the chassis
  - Both supplies accept 100 to 240 V AC at 50/60 Hz
  - +30 dB and -15 dB gain switches per channel
  - +48 V phantom power per channel
  - Earth lift per channel
  - Solo bus with headphone amplifier and level control
  - Input 1 and Output 1 duplicated front and rear
  - 3 U rackmount
  - Designed and engineered in the United Kingdom
