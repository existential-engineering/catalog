description: An 8hp DC-coupled precision matrix mixer with LED-indicated routing
  for mixing audio, CV, triggers and gates.
details: |-
  Precision matrix mixing for fun and profit. You are familiar with matrix mixing, and I am certain you are also familiar with precision adders - but have you ever considered what happens when a device does both? Exceptionally well-suited for audio, but just as good for CV, triggers and gates, and - you guessed it - pitch voltages. Build complex and evolving sequences by adding sequencer outputs, or get even more creative by patching in inverted or offset sequences. With neatly arranged rows and columns, the 4x4 Switch Matrix MKII takes up only 8hp, and shimmering LEDs make it easy to determine what's live - and what's not - even in the pitch darkness of your chamber of Eurorack. Explore what other matrix mixers dare not: evolving sequences, developing rhythms, unusual trigger sequences, strange gates and combined LFOs, or patch in audio for the ultimate thrill: that which has no volume control.
specs: |-
  - DC coupled: mix audio, pitch CV, modulations and more
  - Precision summing: high precision components and op-amps are both accurate with CV and excellent with audio
  - Performance ready: one LED per junction makes it easy to visualize routing
  - Creative routing: build rhythms, mix effects or create complex modulations
  - Compact design: only 23mm deep and 8hp wide
  - Built to last: Rigid chassis construction that will hold up to even the most vigorous button-mashing action
