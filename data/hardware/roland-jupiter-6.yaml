description: >-
  The Jupiter-6 is an incredible six-voice analog synthesizer with 12 analog
  oscillators, offering a sound unlike any other synthesizer. It serves as a
  scaled-down version of the Jupiter-8 with newly added MIDI control and better
  tuning stability.
details: |-
  The Jupiter-6 features six voices of polyphony with two VCOs per voice for a total of 12 analog oscillators. Easy and intuitive programming via front panel sliders, knobs, and buttons makes sound design straightforward and immediate.

  The filter section is notably versatile, offering 24 dB/oct 4-pole lowpass/highpass or 12 dB/oct 2-pole bandpass modes. Two LFOs with four waveforms each (sine, triangle, ramp, random) provide extensive modulation options, and two standard ADSR envelopes shape the amplitude and filter contours.

  While it lacks built-in effects, the Jupiter-6 excels at ambient drones, pads, blips, buzzes, and leads. It includes an arpeggiator and stores 48 tones and 32 patches in memory. The addition of MIDI control was a significant improvement over its predecessor, the Jupiter-8.
specs: |-
  - Polyphony: 6 voices
  - Oscillators: 2 VCOs per voice (12 total)
  - LFO: 2 with 4 waveforms (sine, triangle, ramp, random)
  - Filter: 24 dB/oct 4-pole lowpass/highpass or 12 dB/oct 2-pole bandpass
  - VCA: 2 standard ADSRs
  - Effects: None
  - Arpeggiator: Yes
  - Memory: 48 tones, 32 patches
  - Keyboard: 61 keys
  - Control: MIDI
releaseDate: "1983"
