description: >-
  The Korg M50 is a lightweight music workstation that shares the EDS (Enhanced Definition
  Synthesis) sound engine with the higher-end M3, delivering professional-quality sounds
  at a more accessible price point. Available in 61-key and 88-key configurations, it
  features a 16-track MIDI sequencer, dual polyphonic arpeggiator, and a monochrome
  touchscreen interface. Its plastic construction prioritizes portability, making it
  well-suited for both live performance and studio use.
details: |-
  The Korg M50 was introduced as a more affordable alternative to the Korg M3, utilizing the same EDS (Enhanced Definition Synthesis) sound engine with 256MB of wave memory. While it inherits much of the M3's sonic capability, it trades certain premium features for a lower price, including reduced polyphony (80 voices versus the M3's 120), no sampling capability, and no support for expansion cards.

  The M50 features a monochrome touchscreen display for navigating its extensive sound library and editing parameters. The front panel includes a joystick for real-time synthesis and effects manipulation, along with dedicated knobs and switches for program and effect parameters. Its lightweight plastic construction draws comparisons to the classic M1, making it significantly more portable than the M3.

  A capable 16-track MIDI sequencer supports up to 128 songs with 522 preset patterns, and up to 99 songs can be queued for seamless live performance chains. Instead of the M3's Karma 2 engine, the M50 uses a dual polyphonic arpeggiator inspired by the Triton series. Connectivity includes MIDI In/Out, USB for computer-based MIDI, an SD card slot for program and song storage, audio outputs, a headphone jack, and pedal inputs.
specs: |-
  - 80-voice polyphony
  - Up to 16-part multitimbral
  - EDS (Enhanced Definition Synthesis) sound engine
  - 256MB wave memory
  - 61-key semi-weighted or 88-key weighted keyboard options
  - Dual oscillators per voice (single or double mode)
  - Two multi-mode filters per voice (low pass, high pass, band pass, band reject)
  - Dual polyphonic arpeggiator
  - 16-track MIDI sequencer with 128 songs
  - 522 preset patterns, 100 user patterns per song
  - Effects: dynamics, EQ, overdrive, chorus, flanger, phaser, delay, reverb
  - Monochrome touchscreen display
  - Joystick controller
  - MIDI In/Out
  - USB connectivity
  - SD card slot
  - Audio outputs, headphone jack, pedal inputs
