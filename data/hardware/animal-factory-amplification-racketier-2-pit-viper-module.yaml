name: Pit Viper V2 (Eurorack)
manufacturer: animal-factory-amplification
primaryCategory: overdrive
categories:
  - filter
  - modular
  - equalizer
url: https://animalfactoryamps.com/products/racketier-2-pit-viper-module
description: A Eurorack overdrive/state-variable EQ module built from the Pit
  Viper distortion circuit, feeding an unattenuated 6dB state-variable filter
  with lowpass, bandpass and highpass outputs.
details: |-
  We built the venomous Pit Viper circuit from the ground up for Eurorack users who wanted even more of its bite. The latest version of this module sees our cult classic distortion circuit boasting more gain, more tonal control and some serious versatility! We have retained the classic Pit Viper distortion circuit, as you know and love it, just with a touch of more heat. The output goes unattenuated into a 6 dB state-variable filter borrowed from our Bonesaw module, with each output going to it's own volume knob. Use lowpass, bandpass and highpass outputs alone or blended with each other, sweep the midpoint and make it resonant. If you need even more bite, crank up the FM knob!
