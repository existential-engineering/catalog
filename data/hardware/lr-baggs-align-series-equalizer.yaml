details: |-
  This is basically the guts of our Para DI, minus the DI. The Align EQ features our proprietary 6-band EQ combined with our high-graded FET gain staging to add richness and balance to any acoustic pickup signal. It is versatile and flexible enough to cover a broad range of acoustic instruments for level matching and total EQ control.
specs: |-
  - Proprietary 6-band EQ
  - Variable high-pass filter for sound and feedback control
  - Phase inversion for passive and active pickups
  - 3-position gain switch for level control
  - Garrett Null notch filter to manage resonant feedback
  - High-graded FET gain staging
  - Powered by 9V battery or 9V DC supply
