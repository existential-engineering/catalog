details: |-
  The DB 115 is a single 15-inch bass speaker cabinet from Aguilar's DB series,
  designed to provide deep low-end extension and punchy midrange response that has
  become the signature character of the DB cabinet line.

  The cabinet is constructed from 13-ply Baltic Birch, providing exceptional
  rigidity and resonance control. It features a custom Ceramic Eminence driver
  paired with Aguilar's proprietary horn and crossover design for balanced,
  full-range reproduction.

  With a power handling capacity of 400 watts RMS and 96 dB sensitivity at
  1W/1M, the DB 115 is capable of delivering high-output performance for both
  stage and studio applications. Its frequency response spans 32 Hz to 3 kHz,
  making it well-suited for extended-range bass instruments.

  The enclosure measures 21 inches high by 24.5 inches wide by 17.5 inches deep
  and weighs 71 lbs. Removable casters are included for easier transport and
  positioning on stage.

  The DB 115 can be used as a standalone cabinet or combined with the DB 210 or
  DB 410 cabinets for a full-range rig. It is covered by Aguilar's three-year
  limited warranty to the original owner.
