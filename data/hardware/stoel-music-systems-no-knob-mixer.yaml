details: |-
  The Stoel Music Systems No-Knob Mixer is a simple summing mixer for combining signals at unity gain. It is useful as a pre-filter or output mixer for multiple voices or percussion sounds. All Stoel Music Systems modules feature aluminum front panels with a durable high-gloss white finish. For a crisp appearance and exceptional durability, the front panel markings are digitally printed at high-resolution with UV-cured ink. Mounting holes are plated to significantly reduce screw rash. The power connection features polarity protection to prevent accidental damage to the module if it is connected backward. Each module includes a 12" long 10-pin to 16-pin ribbon cable compatible with the Eurorack standard, M3 mounting screws, and a complimentary sticker. Technical Specifications

  Width
  4 HP

  Depth
  26 mm

  Current Draw
  +12V: 4mA, -12V: 4mA, +5V: 0mA
