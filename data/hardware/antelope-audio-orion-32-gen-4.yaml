description: "Thunderbolt 3 and USB AD/DA audio interface with 32 analog inputs
  and 32 analog outputs on D-Sub 25 (TASCAM) connectors, plus MADI, ADAT, S/PDIF
  and word/atomic clock I/O in a 1U rack."
details: |-
  For over a decade now the Orion 32 line of interfaces has been revolutionizing the world of professional audio recording and production. The latest revision of this iconic 1U studio centerpiece steps up the game by taking the best of its predecessors and adjusting it to the ever-growing needs and standards of the industry. Orion 32+ Gen4 incorporates the latest Antelope Audio tech, drastically boosting the unit's potential.

  Antelope Audio interfaces are globally renowned for their industry-leading conversion and clocking, and the new Orion 32 is, as always, at the forefront. Its AD/DA converters perform at up to 130dB dynamic range, ensuring Gen4's leading position among high-end multichannel interfaces. The high-performing conversion is powered by the same proprietary 64-bit Acoustically Focused Clocking technology and jitter management algorithm, which over the years has proven irreplaceable for countless productions.

  The Orion 32+ Gen4 offers double the Thunderbolt channel streaming and MADI connectivity compared to its predecessor. With 128 channels available, up to four units can be daisy-chained through a single computer connection, making it ideal for large recording sessions, live sound, complex post-production setups, and broadcast facilities. It is the preferred companion for large mixing consoles, hardware effects processing, analog summing boxes, reel-to-reel setups, hardware synthesizers, and more.

  A complete Atmos-ready surround and immersive audio monitoring system is supported by the interface, compatible with over 23 audio formats from stereo to Dolby Atmos 9.1.6. It offers precise speaker and room calibration tools as well as intuitive monitoring controls and fast preset recall functionality, designed to increase productivity. The functionality is optionally available through a separate upgrade license, with each MRC remote purchase including a complimentary license code.

  Orion 32+ Gen4 comes with a redesigned Software Control Panel featuring a powerful preset recall system complete with signal routing, level adjustments, mixer settings and monitoring controls. A handy monitoring pop-out widget provides hands-on output level control and preset recall, featuring an always-on-top function. The unit is compatible with both Windows and macOS systems, and its DC Coupled outputs send CV signal from your DAW straight to hardware modular synthesizers.
specs: |-
  - 32 analog inputs via 4x D-Sub 25 connectors (TASCAM standard) with AC/DC coupling switch
  - 32 analog outputs via 4x DC-coupled D-Sub 25 connectors (TASCAM standard)
  - 1x stereo monitor speaker output on 1/4-inch TRS
  - AD/DA conversion with up to 130 dB dynamic range
  - Proprietary 64-bit Acoustically Focused Clocking (AFC) with jitter management algorithm
  - 1x USB-C port supporting Thunderbolt 3 or USB 2.0
  - Thunderbolt 3: 128 channels of I/O (up to 24-bit, 192 kHz)
  - USB 2.0: 32 channels of I/O (up to 24-bit, 192 kHz)
  - 4x optical MADI ports - 128 channels of I/O (24-bit, 48 kHz; reduced at higher sample rates)
  - 2x ADAT ports - 8 channels of I/O (24-bit, 48 kHz; reduced at higher sample rates)
  - 2x S/PDIF ports - 2 channels of I/O (up to 24-bit, 192 kHz)
  - External clocking: 1x Word Clock In, 2x Word Clock Out, 1x 10M atomic clock In
  - DC-coupled outputs for CV signal routing to modular hardware synthesizers
  - Up to 4 units daisy-chained over Thunderbolt for scalable channel counts
  - Atmos-ready immersive monitoring compatible with 23+ formats including Dolby Atmos 9.1.6 (optional upgrade license)
  - Redesigned Software Control Panel with preset recall system and customizable signal routing matrix
  - Monitoring pop-out widget with always-on-top function
  - Compatible with Windows and macOS
  - 2x IPS displays, main rotary encoder, hardware preset buttons, on/standby button
  - 1U rack form factor
