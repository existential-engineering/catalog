description: 10" compact band pass passive subwoofer engineered for speech and
  music reinforcement across fixed, portable, and touring applications. Excels
  in clubs, bars, theatres, and AV environments.
details: |-
  10" compact band pass passive subwoofer engineered for speech and music reinforcement across fixed, portable, and touring applications. Excels in clubs, bars, theatres, and AV environments. Features a dual ported band pass enclosure design that maximizes bass output within specific frequency ranges, handling 800W with extended low frequency response to well below 40 Hz. Cabinet is internally braced plywood with a hard-wearing semi-matt black paint finish and rugged powder coated perforated steel mesh grille backed with reticulated foam. Includes integral M10 rigging points for mounting and Integrip ergonomic handles on the rear panel.
specs: |-
  - driverSize: 10"
  - powerHandling: 800 W
  - frequencyResponse: Extended to well below 40 Hz
  - enclosureType: Dual ported band pass
  - cabinetMaterial: Internally braced plywood
  - finish: Hard wearing semi-matt black paint
  - grille: Powder coated perforated steel mesh with reticulated foam backing
  - rigging: M10 rigging points
  - mounting: Optional VTH pole mount blanking plate
  - handles: Integral Integrip ergonomic handles (rear panel)
