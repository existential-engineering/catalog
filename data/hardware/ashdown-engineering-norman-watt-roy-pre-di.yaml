description: A special-edition version of Ashdown's OriginAL valve-driven bass
  preamp DI pedal, developed with bass legend Norman Watt-Roy. The pedal shapes
  and optimises the bass signal before the power stage, pairing crystal-clear
  cleans with a foot-switchable 12AX7 valve overdrive. A 5-band EQ (bass,
  low-mid, middle, hi-mid, treble) plus Drive Gain and Drive Level controls dial
  in anything from subtle valve grit to full bass overdrive. A -3dB pad matches
  high- or low-output instruments, an output control sets preamp volume, a rear
  DI out feeds the house post EQ/drive, and a ground lift reduces noise across
  two signal paths. A headphone socket allows silent practice and a line input
  lets you jam along to tracks. Strictly limited to a run of 50 units, each
  numbered 1-50 and hand-signed by Norman, with an anodised aluminium front
  panel finished in Shoreline Gold to match his 1962 Fender Jazz Bass.
details: |-
  Special edition of the OriginAL Valve Pre-DI pedal, tweaked to Norman Watt-Roy's specification with input sensitivity optimised for his fast finger style. Norman Watt-Roy is best known as the bass player for Ian Dury and the Blockheads and has a long relationship with Ashdown founder Mark Gooday dating back to Mark's time at Trace Elliot. Limited run of 50 numbered, hand-signed units in Shoreline Gold. 18-volt operation. Controls: -3dB pad, input, 5-band EQ (bass, low-mid, middle, hi-mid, treble), Drive Gain, Drive Level, foot-switchable 12AX7 valve drive, output, ground lift. Rear DI out; front headphone socket and line input.
specs: |-
  - Power requirement: 15-18V external power supply, centre pin negative
  - EQ: 5-band (bass, low-mid, middle, hi-mid, treble)
  - Preamp tube: 12AX7 powered valve drive
  - Dimensions (H x W x D): 56 x 183 x 118 mm (H +6mm for the feet)
  - Weight: 1.4 kg
  - Limited edition: 50 units, numbered and hand-signed
