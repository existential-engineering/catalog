description: The brightest preamp in A-Designs' 500-series EM family, built
  around a custom-wound nickel output transformer for an airier, top-end
  oriented tone, with a -20 dB pad and a front-panel instrument input. No longer
  in production.
details: |-
  The EM-Blue is the brightest sounding module in A-Designs Audio's 500-series EM family, a line of transformer I/O mic preamps each voiced with a distinct sonic character. It is equipped with a nickel custom-wound output transformer for accentuated highs, producing an airier, more top-end oriented tone than its EM-series siblings.

  A-Designs pitch it as the preamp to pair with an opposite source: a dark-sounding microphone or an alto vocalist opens up through it, and it provides a crisp crack when recording a snare drum. The nickel transformer is also recommended for drawing the highs gently out of ribbon microphones.

  A front-panel direct input takes instruments, and the module carries a -20 dB pad that lets an electric guitar be run hot into it, switching in the pad and cranking the gain for a slight growl. Like the rest of the EM series it is physically compatible with any API or VPR Alliance 500-series mounting device and meets the power rating those racks require. A-Designs no longer offer the module: only the P-1 and the EM-PEQ remain available from the 500-series line.
specs: |-
  - Format: 500-series (API/VPR Alliance compatible)
  - Output transformer: nickel, custom-wound
  - Pad: -20 dB
  - Front-panel instrument direct input
  - Sonic character: brightest in the EM series, accentuated highs
  - Ideal sources: snare drum, ribbon microphones, dark-sounding microphones, alto vocals, electric guitar
  - Availability: no longer offered by A-Designs
