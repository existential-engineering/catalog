url: https://www.mrblackpedals.com/products/doublechorus-diamond-sunset
description: A full-range analog-voiced chorus that braids four discrete
  modulated delay lines into a deep, multi-dimensional shimmer, offered here in
  a "Diamond Sunset" special-edition finish (black satin or high-gloss white).
details: |-
  The DoubleChorus is a stereo-capable chorus pedal built around four discrete modulated delay lines that interweave and braid together, producing a rich, multi-dimensional modulation that Mr. Black describes as smooth, natural and deep. Rather than a single sweeping voice, the overlapping lines create a complex, syrupy movement that fills out a signal without becoming seasick or artificial.

  A full Wet/Dry Mix control allows anything from a subtle thickening to a fully wet (100%) chorus, and a wide range of cycle speeds covers everything from slow, glacial drift to faster vibrato-like textures. High input headroom (up to 3V peak-to-peak) keeps the effect clean and undistorted with hot signals from active pickups, keyboards or line-level sources.

  The Diamond Sunset is a special-edition run of the standard DoubleChorus, available in a choice of black satin or high-gloss white powder-coat. The circuit and voicing are the same as the regular DoubleChorus; only the finish differs.

  Equally at home on electric guitar, bass and keys, it ships in a compact enclosure and runs on standard 9V pedalboard power or an internal battery.
specs: |-
  - Full-range chorus with four modulated delay lines
  - Full Wet/Dry Mix control (100% wet capable)
  - Wide range of cycle speeds
  - High input headroom (3V peak-to-peak max input signal)
  - Great on electric guitar, bass and keys
  - Compact footprint (2.4" x 4.5" x 1.8")
  - Input Impedance: ~500KΩ
  - Output Impedance: ~2KΩ
  - True-Bypass
  - 9VDC 2.1mm negative center-pin power or internal 9V battery (not included)
  - <60mA current draw (≥100mA recommended)
