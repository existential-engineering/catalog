description: The entry-level DDJ-RB is inspired by our professional controllers
  for rekordbox dj, the DDJ-RZ and DDJ-RX. This USB-powered, 2-channel
  controller is all you need to get started with our rekordbox DJ software.
  Perfected for use on the move, the DDJ-RB is a compact, lightweight controller
  packed with advanced features. It has an intuitive layout, responsive jog
  wheels and tactile Performance Pads that let you trigger Hot Cues, Pad FX,
  Slicer and Sampler. Plus a button to call up sample sequences directly from
  the hardware.
