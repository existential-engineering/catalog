description: >-
  Bob Moog's personal reimagining of his most iconic instrument, blending the
  original Model D's analog soul with modern conveniences like patch memory,
  MIDI, and a unique 3D touch controller.
details: |-
  The Minimoog Voyager marked a triumphant return for both the Minimoog lineage and Moog Music as a company. Released in 2002, it was designed under the direct supervision of Robert Moog himself, who sought to honor the spirit of the 1970 original while addressing the practical needs of contemporary musicians. The result is an instrument that feels both deeply familiar and genuinely new.

  The voice architecture stays true to the original formula: three wide-range analog oscillators feeding through a mixer into a filter stage, then on to a voltage-controlled amplifier. But the details reveal thoughtful evolution. The oscillators offer triangle, sawtooth, square, and narrow rectangular waveforms. The filter section now provides two analog filters that can operate in dual lowpass or combined highpass/lowpass configurations, opening up timbral possibilities the original could never reach.

  Among the most distinctive additions is the touch surface controller — a pressure-sensitive 3D pad that can be routed to multiple parameters simultaneously, giving performers an expressive interface unlike anything found on traditional synthesizers. The 44-note keyboard responds to both velocity and aftertouch, and 128 onboard patch memories mean sounds can finally be saved and recalled instantly.

  The Voyager spawned an entire family of variants over its production life. The Performer Edition stripped back some features for a lower price point, the Rack Mount version eliminated the keyboard entirely, the XL expanded to 61 keys with an integrated patch bay, and limited editions like the Electric Blue and Old School offered cosmetic and functional variations. Across all versions, the Voyager has been embraced by artists including Stevie Wonder, Radiohead, Nine Inch Nails, and Herbie Hancock.
specs: |-
  - Polyphony: Monophonic (switchable note priority)
  - Oscillators: 3 wide-range analog (triangle, sawtooth, square, narrow rectangular)
  - LFO: 1 dedicated (VCO3 usable as second LFO), triangle/square/S&H/smoothed S&H, 0.2–50Hz, syncable
  - Filter: Dual analog filters, lowpass/lowpass or highpass/lowpass modes with cutoff, resonance, spacing, and ADSR
  - VCA: ADSR envelope
  - Keyboard: 44 keys with velocity and aftertouch
  - Memory: 128 programs
  - Control: MIDI In/Out/Thru, CV/Gate, extensive pedal and CV jacks
  - Produced: 2002
