url: https://bastl-instruments.com/eurorack/modules/kong
description: Dedicated dual-channel interface between drumpad performance and
  Eurorack modular synthesis. Fully analog core that converts drumpad signals
  into trigger and velocity CV outputs, with a low-drift sample-and-hold circuit
  for velocity generation. Dual audio outputs function as a modular pre-amp
  suitable for piezo pickups.
details: |-
  5HP, 55mm depth. +12V <50mA, -12V <60mA. 10-pin power connector with PTC fuse and diode protection. 2 channels with individual gain controls. Trigger output with LED indication per channel.
