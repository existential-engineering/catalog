description: The Expert Sleepers USAMO (Universal Sample-Accurate MIDI Output)
  provides a sample-accurate, jitter-free MIDI output from a DAW. A companion
  plug-in turns MIDI into audio, and the standalone box reconstructs it on a 5
  pin DIN MIDI socket.
details: |-
  The Expert Sleepers USAMO (Universal Sample-Accurate MIDI Output) provides a sample-accurate, jitter-free MIDI output from a DAW.

  The MIDI signal is generated by the USAMO software, a plug-in which runs as a virtual instrument (AU, VST and AAX, for Mac and Windows), as audio in the DAW. The DAW sends MIDI to the plug-in, the plug-in translates that to audio and sends it to the USAMO hardware via an output on the computer's audio interface. The USAMO then reconstructs the MIDI and outputs it on a standard 5 pin DIN MIDI socket.

  In addition to MIDI note and controller data from the DAW, the USAMO software also generates MIDI clock and Song Position Pointer. It can also handle Sysex.

  Because the MIDI signals are generated and transported as audio, they are guaranteed to be sample-accurately synced with the audio, and free of the jitter often associated with computer-generated MIDI.

  The USAMO uses the same technology previously available from Expert Sleepers Silent Way and the ESX-8MD module, but now in a standalone box and over an analogue audio connection (the ESX-8MD requires a Eurorack housing and a digital audio connection).
specs: |-
  - Input: 1/4" audio jack socket, accepts balanced or unbalanced signals
  - Output: standard 5 pin DIN MIDI socket
  - Controls: Trim pot
  - Indicators: Power, Clip, Activity
  - Power requirements: 9V DC at 7mA, external PSU (not included)
  - Power connector: 2.1mm barrel socket, positive or negative tip
  - Aluminium box, 108x80x44mm (4.25" x 3.15" x 1.73")
  - 1U high, approximately quarter rack width
  - Companion plug-in in AU, VST and AAX for Mac and Windows
