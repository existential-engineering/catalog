url: https://www.darkglass.com/products/microtubes-x7
description: The Microtubes X7 is a bass distortion pedal with parallel
  split-band processing and a built-in XLR direct output. Separate distortion
  and compression paths for high and low frequency ranges let you construct
  customized bass distortion textures.
details: |-
  The Microtubes X7 is a bass distortion pedal from Darkglass's Solid Series. It brings the studio method producers have used for years to cover the whole bass distortion spectrum: from articulate high gain to punchy mild overdrive, raw and gnarly fuzz, and everything in between.

  The pedal splits the signal into two paths. The high-pass side is distorted: a High Pass Frequency control sets the cutoff to be distorted (100Hz to 1kHz), High Drive sets the amount of distortion, and High Level sets the output volume of that side. The low-pass side is preserved and compressed: a Low Pass Frequency control sets the cutoff mixed back to the high-pass side, Low Comp sets the amount of compression, and Low Level sets that side's volume. A Master control sets the overall output.

  Alongside the standard instrument input and output, the X7 carries a balanced XLR direct output with ground lift for connecting to a PA or console, plus a parallel output.

  The pedal runs on a regulated 9V DC adapter with a center-negative plug.
specs: |-
  - Bass distortion pedal with parallel split-band processing
  - High Pass Frequency: distorted cutoff, 100Hz to 1kHz
  - High Drive: amount of distortion for the high-pass side
  - High Level: output volume of the distorted high-pass signal
  - Low Pass Frequency: cutoff mixed back to the high-pass side
  - Low Comp: compression amount for the low-pass signal
  - Low Level: output volume of the low-pass signal
  - Master: overall output volume
  - XLR direct output with ground lift
  - Dimensions: 94mm W x 120mm L x 46mm H, 320g
  - Power: regulated 9V DC, center-negative, 100mA
