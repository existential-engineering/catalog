description: >-
  A compact, performance-oriented groovebox from Roland built around the D-Field touch-sensitive
  controller, offering 600 preset dance-focused sounds from the MC-505 library with 64-voice
  polyphony and an eight-track sequencer.
details: |-
  The Roland D2 arrived in 2001 as a more compact and affordable alternative to the MC-505 groovebox, targeting electronic music producers and performers on a budget. Its centerpiece was the D-Field Controller, a touch-sensitive pad that provided three distinct interaction modes: SOUND mode for triggering patterns, XY mode for simultaneous dual-parameter control, and SPIN mode for simulating turntable-style effects.

  Drawing its sound library directly from the MC-505, the D2 shipped with 600 preset patches and 30 preset drum kits heavily weighted toward dance, electronica, and hip-hop production. Users could create up to 256 custom patches and 20 user rhythm sets. The 64-voice polyphonic engine supported eight-part multitimbrality, providing enough headroom for layered arrangements.

  The sequencer section offered 150 patterns across eight tracks with 96 pulses-per-quarter-note resolution and a generous 40,000-note capacity. A built-in arpeggiator with 43 presets and 10 user slots added further creative potential. The effects section included six reverb types, two delay algorithms, and 25 multi-effects, giving producers tools to shape and polish their tracks without external processing.

  While the D-Field controller and eight trigger pads made the D2 highly engaging for live performance, its reliance on hidden menus and multi-layered navigation for deeper editing was a common criticism. The tempo range spanned 20 to 240 BPM, and MIDI In/Out connections allowed integration with larger setups. Despite its limitations, the D2 succeeded as an accessible entry point into Roland's groovebox ecosystem.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 8 parts
  - Oscillators: Sample-driven
  - Memory: 600 preset patches, 256 user patches; 30 preset drum kits, 20 user sets
  - Sequencer: 150 patterns, 8 tracks, 96 ppq, 40,000 note capacity
  - Arpeggiator: 43 presets, 10 user
  - Effects: Reverb (6 types), delay (2 types), multi-FX (25 types)
  - Controllers: D-Field touch pad, 8 trigger pads
  - Tempo: 20-240 BPM
  - MIDI: In/Out
  - Keyboard: None
