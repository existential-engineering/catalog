description: >-
  The E-MU MP-7 Command Station is a desktop production module combining E-MU's
  Mo'Phatt sample-playback sound engine with an integrated MPC-style sequencer.
  Featuring 13 velocity and aftertouch-sensitive pads, 128-voice polyphony, and
  32 MB of hip-hop-oriented ROM sounds, it was designed as an all-in-one
  instrument for urban music production.
details: |-
  The MP-7 represents E-MU's approach to making their professional sound modules more accessible to musicians who prefer compact desktop setups. Based on the Mo'Phatt module, it inherits the same proven Pure Phatt soundset containing 32 MB of hip-hop samples, scratches, and drum kits. The device maintains compatibility with E-MU's expandable ROM card ecosystem, allowing users to incorporate sounds from other genre-specific modules.

  What distinguishes the MP-7 from its sound-module and keyboard counterparts is the built-in sequencer. Featuring 13 velocity and aftertouch-sensitive pads, users can perform note sequences, play chords, and trigger drum sounds in real-time. The sequencer supports multiple programming methods including real-time recording, step input, and grid-based drum machine-style pattern creation, with patterns up to 32 bars long and comprehensive features including quantization and parameter automation.

  The instrument provides substantial creative control through 16 front-panel real-time controllers for live parameter manipulation and sound design. The 32 simultaneous arpeggiators include preset patterns and customizable user patterns, with dual stereo effects processors delivering reverb, delay, chorus, flange, and distortion.

  Six analog outputs plus S/PDIF digital output enable flexible routing in studio and live environments, while USB and MIDI connectivity support integration with computer-based setups. The MP-7 appealed primarily to hip-hop producers and DJs seeking an integrated production solution combining proven sounds with hands-on sequencing capabilities.
specs: |-
  - Polyphony: 128 voices
  - Sound Engine: Sample-playback synthesis with Z-Plane filters
  - ROM Soundset: 32 MB Pure Phatt (expandable to 128 MB via 3 additional slots)
  - Filter Types: 50 types of 6th and 12th-order Z-Plane filters
  - Effects: Dual stereo processor with 29 reverb types, 15 delay types, 8 chorus types, 7 flange types, 5 distortion types
  - Sequencer: 16 tracks, 1024 patterns (up to 32 bars each), 512 songs, 300,000 note capacity, 384 ppqn resolution
  - Arpeggiator: 32 simultaneous with 200 preset and 100 user patterns
  - Pads: 13 velocity and aftertouch-sensitive
  - Presets: 512 ROM, 512 user
  - MIDI: In/Out/Thru (32 channels), Standard MIDI File import/export
  - Connectivity: USB, six analog outputs, S/PDIF digital output
  - Lamp Socket: BNC 12V
