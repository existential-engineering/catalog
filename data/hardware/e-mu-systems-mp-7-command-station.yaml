description: >-
  The E-mu MP-7 Command Station is a desktop groovebox combining the Mo'Phatt sound engine with an
  MPC-style sequencer, 13 velocity-sensitive pads, and 128-voice polyphony for hip-hop and R&B
  production.
details: |-
  The MP-7 Command Station merges E-mu's Proteus 2000 sound engine with hands-on sequencing controls, creating a self-contained production workstation aimed squarely at hip-hop and urban music producers. Sharing its core architecture with the Mo'Phatt module, it ships with a 32MB "Pure Phatt" ROM soundset expandable to 128MB across three additional expansion slots.

  The centerpiece of the MP-7 is its built-in MPC-style sequencer with 13 velocity and aftertouch-sensitive pads. Sequences can be recorded in real-time, entered step-by-step, or programmed using classic TR-style grid input. The sequencer handles patterns up to 32 bars long with quantization, overdubbing, and full synth parameter automation, storing up to 1,024 patterns and 512 songs with a 300,000-note capacity at 384 PPQN resolution.

  Performance features are extensive, with 16 front panel controllers, mute/enable track buttons, and a real-time assignable touch strip ribbon controller. The unit provides 32 simultaneously available arpeggiators supporting all basic patterns plus up to 300 preset and user patterns, making it capable of generating complex rhythmic and melodic variations on the fly.

  Audio processing includes dual 24-bit stereo effects processors offering 29 reverb types, 15 delay types, 8 chorus types, 7 flange types, and 5 distortion types, alongside 50 types of 6th and 12th-order Z-plane filters. Connectivity includes MIDI in/out/thru across 32 channels, USB, six audio outputs, S/PDIF digital output, and a BNC lamp socket for low-light studio work.
specs: |-
  - Polyphony: 128 voices
  - Oscillators: Sample-playback with Z-Plane filters
  - Sound ROM: 32MB "Pure Phatt" (expandable to 128MB via 3 slots)
  - Filter: 50 types of 6th and 12th-order Z-plane filters
  - Effects: 24-bit dual stereo processors (29 reverb, 15 delay, 8 chorus, 7 flange, 5 distortion)
  - Sequencer: 16 tracks, 1024 patterns, 512 songs, 300,000 notes, 384 PPQN
  - Arpeggiator: 32 simultaneous (200 preset, 100 user patterns)
  - Keyboard: 13 velocity/aftertouch-sensitive pads
  - Memory: 512 ROM, 512 user presets
  - Control: MIDI in/out/thru (32 channels), USB
  - Outputs: 6 analog, S/PDIF digital
