  samples, 8 Hot Cues and more than 30 FX Powered by iZotope - without the need
  to touch a keyboard or mouse.
details: |-
  Sub controller for Serato DJ Pro. Add the DDJ-SP1 to a set-up that supports mixing and scratching with Serato DJ Pro – for example a laptop, or timecode CDJs/turntables with a DJM-900SRT mixer – and use the pre-mapped buttons and dials to trigger 6 samples, 8 Hot Cues and more than 30 FX Powered by iZotope - without the need to touch a keyboard or mouse.
