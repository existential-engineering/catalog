description: The LTD Deluxe SN-1000HT is designed for professional guitar
  players who require the versatile tones, smooth playability, and complete
  reliability for serious recording and touring needs. It features a Swamp Ash
  body with quilted maple top and matching headplate, bolt-on 3-piece roasted
  maple neck with Macassar ebony fingerboard, 24 XJ stainless steel frets, a
  300-400mm compound radius, Hipshot bridge with string-thru body, LTD locking
  tuners, and Seymour Duncan pickups (Custom 14 TB bridge / Alnico II Pro neck),
  both split-capable via push/pull tone control.
