  - Body: Swamp Ash
  - Top: Quilted Maple
  - Neck: 3Pc Roasted Maple
  - Fingerboard: Macassar Ebony
  - Fingerboard Radius: 300-400mm Compound
  - Finish: Dark Brown Sunburst
  - Nut Width: 42mm
  - Nut Type: Black Bone
  - Neck Contour: Thin U
  - Frets/Type: 24 XJ Stainless Steel
  - Hardware Color: Black
