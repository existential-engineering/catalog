description: The LTD Deluxe SN-1000HT is designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs. It features a Swamp Ash body with quilted maple top and matching headplate, bolt-on 3-piece roasted maple neck with Macassar ebony fingerboard, 24 XJ stainless steel frets, a 300-400mm compound radius, Hipshot bridge with string-thru body, LTD locking tuners, and Seymour Duncan pickups (Custom 14 TB bridge / Alnico II Pro neck), both split-capable via push/pull tone control.
details: |-
  The LTD Deluxe SN-1000 HT is designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs. This guitar takes a traditional shape and then supercharges it with outstanding quilted maple top and matching headplate. But the SN-1000 HT is more than good looking; it has the performance tools you need for your best work. Built with bolt-on construction at 25.5” scale, it offers a resonant swamp ash body and a thin U-shaped three-piece roasted maple neck with a compound radius Macassar ebony fingerboard, offset dot inlays, 24 extra-jumbo stainless steel frets, and a reverse headstock. Components on the SN-1000 HT include black hardware, a black bone nut, LTD locking tuners, a Hipshot hardtail bridge with string-thru-body, and an outstanding set of Seymour Duncan Custom14 — an ESP exclusive — in the bridge position and an APH-1N in the neck. A push-pull control allows the pickups to be split into single-coil mode.
specs: |-
