description: The SJ is a Small Jumbo acoustic guitar featuring a 16-inch lower
  bout with deep sides and a tight waist curve that creates a distinctive sound
  chamber. It delivers pronounced midrange response alongside strong bass and
  volume, balanced with treble clarity. The standard model features a Sitka
  spruce top with European maple back, sides, and neck, finished in high gloss
  nitrocellulose lacquer.
details: |-
  The SJ is the maple-sided variant of the Small Jumbo, offering a 16-inch lower bout that is slightly wider than a dreadnought, with deep sides and a tight waist curve that creates a very different sound chamber from a dreadnought, yielding more pronounced midrange response. Players who want the bass and overall volume of a large guitar but with lots of treble clarity will find the SJ well suited to their needs. The SJ features European maple back, sides, and neck paired with a Sitka spruce top braced in a pre-war scalloped X-brace pattern. The ebony fingerboard features MOP Modern Diamond inlays and a 14"-26" compound fingerboard radius. Construction uses a mortise and tenon hybrid neck joint.
specs: |-
  - Body Style: Small Jumbo
  - Top: Sitka spruce
  - Back & Sides: European maple
  - Neck: European maple
  - Brace Pattern: Pre-war scalloped X-brace
  - Scale Length: 25 1/2"
  - Nut: Bone, 1 11/16"
  - Saddle: Bone, drop-in
  - Fingerboard: Ebony
  - Fingerboard Inlays: MOP Modern Diamonds
  - Fingerboard Radius: 14" - 26" compound
  - Frets: Medium 18% nickel-silver
  - Neck Profile: C-shape
  - Neck Joint: Mortise & tenon hybrid
  - Truss Rod: Fully adjustable
  - Bridge: Ebony modern-style, 2 3/16" spacing
  - Bridge Pins: Ebony with MOP dot
  - Tuners: Nickel Waverly
  - Rosette: Ivoroid with b/w purfling
  - Body Binding: Ivoroid with b/w/b/w/b purfling
  - Fingerboard Binding: .100" ivoroid with b/w purfling
  - Peghead Binding: .100" ivoroid with b/w purfling
  - Backstrip: Maple mosaic
  - Pickguard: Tortoise
  - Body Finish: High gloss nitrocellulose lacquer
  - Body Width: 16"
  - Body Length: 20 1/8"
  - Body Depth: 4 1/2"
  - Total Length: 41"
  - Strings: D'Addario EJ-17 (.013" - .056")
