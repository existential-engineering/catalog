description: An analog multi-effect pedal that allows sophisticated control over
  a wide range of effects including EQ, overdrive, boost, tremolo, and filter
  tones, with a parametric mids control ranging from 150Hz to 4kHz and three
  separate low pass filter and bass boost/cut modes.
details: |-
  Condor is an analog multi-effect that allows sophisticated control over a wide range of effects including EQ, overdrive, boost, tremolo, and filter tones. The pedal has a powerful parametric mids control that ranges from 150Hz to 4kHz, along with three separate low pass filter and bass boost/cut modes.

  Along with expansive frequency controls, Condor has gain and volume knobs and a switchable overdrive circuit for sculpting your ideal guitar tone. The Bass control boosts up to 12dB or cuts low frequencies, the Mids control boosts or cuts up to 18dB at the frequency selected by the Freq knob, and the LPF toggle selects between a gentle one-pole filter, a slightly resonant two-pole filter, and a highly resonant two-pole filter.

  Like all Chase Bliss Audio pedals, all of these settings can be stored in presets, ramped, or controlled via expression pedal. Every knob and switch is connected to a little digital brain while the guitar signal stays 100% analog and never gets digitally processed. The Gain (Ramp) knob provides up to 20dB of gain and can also modulate or ramp-and-hold any of five parameters (freq, volume, bass, mids, LPF) assigned via the rear DIP switches, and an internal voltage doubler provides extra headroom for massive gain staging.

  The Drive/Hold stomp switch engages an overdrive circuit designed to complement stacking with other gain pedals, or acts as a hold/ramp control depending on the DIP switch configuration. The Bypass stomp offers true bypass via relay or selectable buffered bypass, and a preset toggle recalls two onboard presets. Via MIDI, up to 122 preset slots can be saved and recalled, with control change messages available for every knob, toggle, and switch.

  Connectivity includes a TRS expression jack that also accepts 0-5V control voltage, and a 1/4-inch TRS jack that interfaces with the Chase Bliss Midibox or Faves MIDI controller. The pedal consumes around 70mA and runs on a standard 2.1mm 9V DC center negative supply rated 100mA or more, with 1M input impedance and 1k output impedance.
specs: |-
  - 100% analog signal path with digital control
  - Parametric mids: up to 18dB boost/cut, 150Hz to over 4kHz
  - Bass control: up to 12dB boost or cut
  - Low pass filter with three modes (one-pole gentle, two-pole slightly resonant, two-pole high resonance)
  - Switchable overdrive circuit (Drive/Hold stomp)
  - Up to 20dB of gain
  - Internal voltage doubler for extra headroom
  - Ramping and modulation of freq, volume, bass, mids, and LPF
  - Expression pedal and 0-5V CV control
  - MIDI via Midibox or Faves controller (channel 2 default)
  - 2 onboard presets, 122 preset slots via MIDI
  - True bypass (relay) or buffered bypass
  - 16 DIP switches for customization
  - Mono input and output
  - Input impedance 1M, output impedance 1k
  - Power: 9V DC center negative, 2.1mm barrel, ~70mA (100mA supply recommended)
