description: Classic 80s British crunch and searing leads recreated in a modular
  all-tube preamp module designed to fit Synergy Amps chassis. Advanced
  three-tube architecture delivers deeper saturation and clarity, with two
  independent channels for rhythm and lead tones, a high/low input switch for
  adjustable gain and harmonic intensity, and a built-in phase inverter with
  mini transformer that recreates the feel of a cranked amp at lower volumes.
  Tuned for aggressive midrange, tight punch, and classic 80s overdrive.
details: |-
  - Designed in collaboration with Synergy Amps
  - All-tube modular preamp
  - Advanced three-tube architecture for deeper saturation and clarity
  - Two independent channels (rhythm and lead)
  - High/Low input switch for adjustable gain and harmonic intensity
  - Built-in phase inverter with mini transformer for cranked-amp feel at low volumes
  - Classic 80s British crunch and searing lead voicing
  - Aggressive midrange and tight punch
