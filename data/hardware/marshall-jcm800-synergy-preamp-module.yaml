description: Classic 80s British crunch and searing leads recreated in a modular all-tube preamp module designed to fit Synergy Amps chassis. Advanced three-tube architecture delivers deeper saturation and clarity, with two independent channels for rhythm and lead tones, a high/low input switch for adjustable gain and harmonic intensity, and a built-in phase inverter with mini transformer that recreates the feel of a cranked amp at lower volumes. Tuned for aggressive midrange, tight punch, and classic 80s overdrive.
details: |-
  Capture the legendary Marshall JCM800 sound with this dual-channel, three-tube Synergy module: authentic 1980s British crunch, soaring lead tones, and true 800 tone at any volume.

  For the very first time, Synergy introduces its advanced three-tube module architecture. This design provides deeper saturation, greater clarity, and a more authentic modular take on the JCM800 tone, recreating the aggressive midrange, tight punch and classic 80s overdrive of the original using genuine 12AX7 tubes.

  Two identical, separate channels expand on the original single-channel JCM800 design, so rhythm and lead tones can be changed instantly. A High / Low input switch on each channel moves between the classic low-input JCM800 crunch and a high-input mode for increased gain, sustain and aggressive 80s-style harmonic intensity, and Classic/Hot voicing switches choose between stock JCM800 crunch and a hotter mode inspired by the modded 800 tones of the era.

  A built-in phase inverter and mini transformer, Synergy's 0-Watt power amp section, deliver real tube sag, harmonics and the feel of a cranked JCM800 at any volume.

  The module installs into any Synergy preamp dock for a flexible, expandable all-tube rig. Designed and engineered in USA. Made in USA.
specs: |-
  - Dual-channel, three-tube all-tube preamp module (12AX7 tubes)
  - Synergy three-tube modular architecture
  - Controls per channel: Gain, Bass, Middle, Treble, Master
  - Bright switch per channel
  - High / Low input switch per channel
  - Classic / Hot voicing switches
  - Onboard phase inverter with 0-Watt power amp circuitry
  - Wired connectivity: none on the module, the guitar input and preamp output are the host Synergy dock's 1/4-inch jacks
  - Compatible software: Synergy Editor Software when used with SYN20-IR
  - Installs into a Synergy preamp dock, which supplies power and all audio connections; the module itself carries no jacks or mains inlet
  - Width: 177.8 mm / 7"
  - Height: 38.1 mm / 1.5"
  - Depth: 139.7 mm / 5.5"
  - Water resistance: no
  - Colour: Black
  - In the box: preamp module, warranty card, quick start guide, legal and safety information
  - Country of origin: designed and engineered in USA, made in USA
