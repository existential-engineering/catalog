description: Portable outdoor speaker with 30+ hours of playtime, True
  Stereophonic 360 degree sound and an IP67 dust and waterproof build.
details: |-
  Emberton II produces a sound much larger than its size. Two 2" full range drivers and two passive radiators bring you the heavy Marshall sound you know and love. Experience absolute 360 degree sound with True Stereophonic, a unique form of multi-directional sound from Marshall. Weighing in at only 0.7 kg (1.5 lbs), this speaker is tough and resilient. Designed and engineered in Sweden. Made in China.

  Marshall signature sound: Emberton II delivers sound that is rich, clear and loud, like the artist intended. Its custom-tuned audio components enhance the multi-directional sound by providing brilliantly powerful and clear sound throughout the entire frequency range.

  True Stereophonic (360 degree sound): a unique form of multi-directional sound from Marshall, where every spot is a sweet spot. By separating out the spatial content of stereo recordings, Emberton II produces a sound much larger than its size.

  30+ hours of portable playtime: Emberton II offers 30+ hours of portable playtime on a single charge. Its compact size, rugged durability and reliable playtime make it perfect to take with you. When you're out of battery, plug in your speaker and return to full battery in 3 hours.

  Dust and waterproof (IP67): Emberton II has an IP67 dust and waterproof rating, so you can submerge it in 1 m (3 ft) of water for a period of up to 30 minutes. Download and connect to the Marshall Bluetooth app to access over-the-air updates, equaliser presets and additional controls.
