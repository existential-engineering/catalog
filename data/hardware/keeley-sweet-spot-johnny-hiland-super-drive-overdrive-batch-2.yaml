details: |-
  The Sweet Spot Super Drive is Johnny Hiland's signature overdrive, designed with Keeley around a midrange-forward voice aimed at country, rock and blues playing, with a gain range that stays touch sensitive and gives singing sustain. Batch 2 is a Custom Shop silver sparkle finish of the same circuit as the first run, which sold out.

  The circuit uses a discrete JFET transistor input stage for a tube-like response, built around a 4558 op-amp, with diodes chosen for asymmetrical clipping. The voicing follows the recipe Keeley describes for the sound: cut a little bass, lift the midrange slightly, and roll off some high end to avoid harshness.

  The tone control is a circuit that keeps the highs at full strength while reducing the load on the guitar's own tone control, so the midrange stays present across the neck. A gain toggle switch sets the gain range, from light preamp clipping through to a heavier, power-tube-style breakup, and the level control can be set high enough to push the next pedal or amplifier in the chain. The pedal is true bypass and made in the USA.
