details: |-
  The 0002H is a 12-fret 000-sized acoustic guitar featuring East Indian rosewood back and sides with herringbone purfling trim. The longer 12-fret body configuration typically produces more bass and overall volume, making it ideal for string-band purists or any guitarist who wants maximum power from a comfortably-sized instrument.

  The guitar features a Sitka spruce top with pre-war scalloped X-brace pattern, ebony fingerboard with abalone inlays, and an ebony pyramid-style bridge with herringbone purfling. Nickel Waverly tuners and bone nut and saddle are standard.
specs: |-
  - Top: Sitka spruce
  - Back & sides: East Indian rosewood
  - Neck: Honduran mahogany
  - Fingerboard: Ebony
  - Fingerboard inlays: Abalone
  - Bridge: Ebony pyramid-style with herringbone purfling
  - Nut: Bone
  - Saddle: Bone
  - Frets: Medium 18% nickel-silver
  - Tuners: Nickel Waverly
  - Strings: D'Addario EJ-16 (.012"-.053")
  - Finish: High gloss nitrocellulose lacquer
  - Pickguard: Tortoise
  - Bracing: Pre-war scalloped X-brace pattern
  - Truss rod: Fully adjustable
  - Scale length: 25.5"
  - Body width: 15"
  - Body length: 20.25"
  - Body depth: 4"
  - Total length: 39.5"
  - Neck profile: Modified V
