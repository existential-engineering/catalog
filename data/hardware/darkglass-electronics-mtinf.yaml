details: |-
  The Microtubes Infinity answers the question of what a single all-in-one piece of gear to take on tour would look like. It is an advanced bass distortion and compression preamp/DI pedal that gathers the Darkglass drive voicings into one unit, capable of Microtubes, Microtubes X, and Vintage Microtubes tones.

  It offers 5 compressor modes, 5 distortion modes, and 5 cabinet-simulation impulse responses, plus a 6-band graphic EQ for detailed tone shaping. Parameters can be controlled externally via a MIDI input.

  The pedal doubles as an audio interface over USB-C, so it can record directly into a computer. It brings the full Darkglass distortion and compression toolkit into a single tour-ready enclosure.
specs: |-
  - Advanced bass distortion and compression preamp/DI pedal
  - Capable of Microtubes, Microtubes X, and Vintage Microtubes tones
  - 5 compressor modes, 5 distortion modes, 5 cab-sim IRs
  - 6-band graphic EQ
  - Audio interface capability over USB-C
  - MIDI input to externally control parameters
