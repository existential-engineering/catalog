description: The AGM-284C is a 15 watt all-valve 1x12" guitar combo from
  Ashdown's Guitar Magnifier range, designed by UK amp designer Dave Green and
  hand-built in Essex, England. With simple controls and an intuitive 4-band EQ
  it covers shimmering reverb-laden cleans, classic rock crunch and full
  hard-rock tones. The 15 watt 2 x EL84 power section makes it easy to get the
  output valves cooking at lower volumes at home or in the studio while
  retaining enough power for small and medium gigs, delivered through a 12"
  Celestion G12M Creamback speaker. Footswitchable Accutronics reverb and
  variable boost add versatility, and a series valve-driven FX loop suits
  modulation effects.
details: |-
  Ashdown Guitar Magnifier 15W 1 x 12" combo. Designed by UK amp legend Dave Green and lovingly built by hand in Essex UK using only the finest hand selected components, the portable yet potent AGM-284C 15 watt all valve combo punches way above its weight in every department. With easy to dial in tones via simple controls and an intuitive 4 band EQ the AGM-284 does it all from classic shimmering reverb laden clean tones through biting classic rock crunch to full on hard rock tones full of rich harmonic overtones, making this amp perfect for a wide range of players whatever the genre. The perfect choice as a grab and go combo for rehearsals and small to medium gigs. The 15 watt 2 x EL84 power section means it is easy to get the output valves cooking when playing at lower volumes at home and in the studio, yet there is still enough power for small/medium gigs and rehearsals when required, delivered via a 12" Celestion G12-M Creamback speaker. Footswitchable Accutronics reverb plus variable boost increase the versatility further, and a series valve driven FX loop allows players the best results from their modulation type FX.
specs: |-
  - 15 watt all-valve 1 x 12" combo
