name: DCi 8|600DA
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/dci-8-600da
description: Eight-channel, 600W @ 4Ω Power Amplifier with Dante™ / AES67
  Networked Audio, and 70V/100V. EN 54-16 compliant for life safety
  applications.
details: |-
  The DCi 8|600DA is part of the DriveCore Install DA series, combining Crown's proprietary DriveCore amplifier technology with integrated Dante™/AES67 networked audio. The 8-channel design delivers 600W per channel into 4Ω in a 2RU chassis and supports 2/4/8/16 ohm, 70V and 100V speaker loads. The unit is EN 54-16 compliant for life safety voice alarm systems.

  Redundant, independent Dante/AES67 ports (Primary & Secondary) accept 48kHz or 96kHz audio and can also send Dante/AES67 audio from analog inputs (pre/post processing @ 48kHz). HiQnet protocol over standard TCP/IP enables remote configuration, monitoring, and control via Audio Architect software. A programmable GPIO aux port supports volume control, preset recall, sleep contact closure, and amp status output.

  Integrated DSP at 48kHz provides LevelMAX limiters, input/output EQ, crossover, delay, matrix router, and speaker line monitoring. The unit supports 20 presets, input delay up to 2 seconds, output delay up to 100ms, channel auto-standby, JBL speaker tunings, and load monitoring with continuous and sweep modes. A universal PFC power supply, continuously variable speed forced-air cooling, removable air filters, and front-panel LED indicators round out the design.
specs: |-
  - Output Channels: 8
  - Output Power (4Ω, Dual Mode): 600W
  - Output Power (Bridge Mono, 8Ω): 1200W
  - Frequency Response (8Ω, 20Hz–20kHz): ±0.25dB
  - Total Harmonic Distortion: 0.35% (full rated power)
  - Damping Factor (20Hz–100Hz): >1000
  - Load Impedance (Stereo): 2Ω–16Ω; 70Vrms, 100Vrms
  - Load Impedance (Bridge Mono): 4Ω–16Ω; 140Vrms, 200Vrms
  - DSP: 48kHz processing, 20 presets
  - Input Delay: up to 2 seconds
  - Output Delay: up to 100ms
  - Networking: Dante / AES67, redundant Primary & Secondary
  - Certification: EN 54-16 compliant
  - Cooling: Continuously variable speed forced air, front-to-back
  - Max Fan Noise: 47 dBA SPL @ 1M
  - AC Mains: 100V–240V ~ 50/60Hz (±10%)
  - Power Connector: 20A IEC
  - Dimensions: 483 × 89 × 432 mm (19″ × 3.5″ × 17″)
  - Weight: 13.60 kg (30 lbs)
