details: |-
  The Active A/B/Y is a professional routing tool for guitarists and bassists. Use it to send your signal to Output A, Output B, or both simultaneously (Y mode). A high-quality active buffer preserves your tone across long cable runs.

  Transformer isolation on Output B eliminates hum loops caused by ground differences between amplifiers. A polarity inversion switch on Output B helps phase-align two amps for maximum impact. The XLR DI output can send your signal directly to a mixing board, recording interface, or PA system.
