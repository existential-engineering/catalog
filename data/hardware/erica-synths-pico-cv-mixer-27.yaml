description: Erica Synths Pico CV Mixer is a simple 3 channel DC coupled mixer,
  intended to mix CV signals in order to obtain complex modulations. It can also
  serve as a CV attenuator.
details: |-
  Pico CV Mixer is a simple 3 channel DC coupled mixer intended to mix CV signals in order to obtain complex modulations. Because the signal path is DC coupled, slow control voltages pass through unaltered rather than being filtered out.

  With a single input patched it also serves as a CV attenuator, so the module doubles as a level control for a modulation source. Mixer gain is unity and the inputs carry diode protection against overvoltage.

  The module is part of the Pico Series, Erica Synths' effort to fit substantial functionality into an affordable 3HP panel. It is 3HP wide and 35mm deep, and draws only +4mA and -4mA from the bus.
specs: |-
  - 3 inputs
  - DC coupled
  - Mixer gain 1
  - Diode protection against overvoltage
  - Power consumption +4mA, -4mA
  - Module width 3HP
  - Module depth 35mm
