details: |-
  4-channel club digital mixer.

  The DJM-900NXS is the next level in creativity, delivering excellent connectivity, up-to-date FX and mind-blowing performance features to make it the centrepiece of any professional DJ setup. Built to stand up to the rigours of professional use, the mixer features improved fader technology and audio circuits that reduce the need for servicing and significantly increase its lifespan.

  USB sound card. A built-in USB sound card allows simultaneous input/output of stereo signals from 4 ins and 4 outs, while 96 kHz/24-bit high-sampling processing ensures the audio quality. Connect the unit to your laptop or computer via USB and the settings utility tool will automatically open, allowing you to configure the mixer, sound card and audio routing to suit your preferences.

  Effects with simple controls. Six studio-quality sound FX - Filter, Crush, Gate/Comp, Dub Echo, Noise and Space - are available on every channel.

  Channel-assignable BEAT FX. 13 channel-assignable Beat FX to mash up the music in sync with the BPM, including as DELAY, ECHO, SPIRAL, REVERB, FILTER, FLANGER, ROLL and REVERSE ROLL.

  One finger manipulation. Use the X-PAD to engage Beat FX and adjust the parameters, all with just one finger.

  Quantized Beat FX. Quantize snaps Beat FX, cues and loops to the rekordbox beat grid for precision performances.
