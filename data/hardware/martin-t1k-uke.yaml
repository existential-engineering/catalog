details: |-
  The Martin T1K Uke is a tenor-body ukulele built with a solid Hawaiian koa top, back, and sides, delivering the warm, lively tone and rich figured appearance that koa is known for.

  A select hardwood neck in Martin's tenor profile joins the body at the 14th fret, with 20 total frets on a Sipo fingerboard accented by white plastic dot inlays. The Sipo bridge is paired with a compensated white Tusq saddle and a matching white Tusq nut for accurate intonation.

  Nickel open-gear tuners and a hand-rubbed finish round out the appointments, keeping the focus on tone and feel. The ukulele ships pre-strung with Martin Ukulele Strings - Tenor.

  The T1K Uke comes with a soft gig bag featuring backpack-style straps for easy transport, and is backed by Martin's one-year limited warranty. A left-handed version is also available.
specs: |-
  - Tenor body
  - Solid Hawaiian koa top
  - Solid Hawaiian koa back and sides
  - Select hardwood neck, tenor profile
  - Sipo fingerboard with white plastic dot inlays
  - 20 frets, neck joins body at 14th fret
  - Sipo bridge with compensated white Tusq saddle
  - White Tusq nut
  - Nut width: 1 11/32"
  - Width at 12th fret: 1 23/32"
  - Nickel open-gear tuners
  - Hand-rubbed finish
  - Pre-strung with Martin Ukulele Strings - Tenor
  - Includes soft gig bag with backpack/shoulder strap
