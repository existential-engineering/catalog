description: The M•2000 harnesses the power of the G&L L•2000 with a new sonic
  palate, pairing two M-spec MFD humbuckers with a studio-quality 18v preamp
  system designed for them. It carries primary volume and pan controls, a 3-band
  EQ and the return of the classic "C"-shape 1 5/8" neck.
details: |-
  Three decades ago, the G&L L•2000 bass served notice that company founder Leo Fender was ready to disrupt the status quo. The bold, brash L•2000 has always been an exhilarating experience for players with the skill to pull it off. Now the new M•2000 and M•2500 harness that power with a sonic palate that will surprise and delight new and die-hard G&L fans alike.

  Leo's MFD humbuckers have always been the heart of the iconic L-Series. In the all-new M-Series, these powerhouses are voiced to fully exploit a studio-quality 18v preamp system specially designed for them. With an LF442 chip, 100v poly caps, 1% metal film resistors and big, fat signal traces on the mil-spec circuit board, this preamp reveals everything the player and the instrument have to offer. There is more besides:

  Primary volume and pan controls to explore the full range of sounds available between the two pickups.
  3-band EQ with peripherally placed, center-detent, reduced-diameter knobs.
  An impeccable, familiar "feel" of the instrument in the hands and on the shoulder.
  The return of the classic "C"-shape 1 5/8" neck, discontinued by G&L in the 1980s.

  For slapping, rolling back some highs and dialing up some lows, coupled with a mid-range boost, magnifies the intensity that Leo's humbuckers are famous for. For more definition in fingerstyle playing, bringing up the treble and rolling off the bass gives a nuanced and detailed sound. The new M-Series preamp harnesses the power of those meaty MFD humbuckers without a hint of clipping. The best tools are simple, intuitive and easy to use, and that is what the new M-Series package sets out to be. It is the evolution of Leo's revolution.

  Founded by Leo Fender in 1980, G&L USA instruments continue to be made in the historic G&L facility on Fender Avenue in Fullerton, California, the Birthplace of Bolt-on.
specs: |-
  - Pickups: Two M-spec G&L Magnetic Field humbucking pickups
  - Body wood: Alder on Standard and all solid finishes, Swamp Ash on Premier Finishes
  - Neck wood: Hard Rock Maple with Rosewood or Maple fingerboard
  - Neck profile: G&L 1 5/8" Medium C with 9 1/2" radius
  - Frets: Medium Jumbo, Jescar 57110 18% nickel silver
  - Tuning keys: Custom G&L "Ultra-Lite" with aluminum tapered string posts
  - Bridge: Leo Fender-designed G&L Saddle Lock with chrome-plated brass saddles
  - Electronics: G&L M-spec 18v preamp, volume, pan, 3-band boost/cut EQ with center detents
  - Power: battery-powered, 18V active preamp
  - Includes: G&L Deluxe Gig Bag
