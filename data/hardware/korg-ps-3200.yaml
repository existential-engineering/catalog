description: >-
  The Korg PS-3200 is a semi-modular fully polyphonic analog synthesizer and the
  final model in Korg's PS series. It essentially combines two PS-3100 units
  into a single enclosure, offering 48 notes of full polyphony with two
  oscillators per key. The PS-3200 features 16 addressable and recallable memory
  patches, a groundbreaking feature for its era that persisted even after
  powering down.
details: |-
  The PS-3200 represented the pinnacle of Korg's PS series of polyphonic synthesizers when it was released in 1978. Building on the architecture of its predecessor, the PS-3100, the PS-3200 essentially doubled the oscillator count by providing two VCOs per voice across all 48 keys. Each VCO module included its own dedicated VCF and LFO, offering substantial sonic flexibility and one of the fattest analog sounds of its era.

  The memory system was revolutionary for the late 1970s, allowing users to take a snapshot of all panel settings and store them across 16 patches that could be recalled at any time. These patches persisted even after powering down, eliminating the need to manually recreate complex sound designs. An optional PS-3060 Programmer Remote Controller enabled wireless patch selection via proprietary 60-pin cables shared with the PS-3010 keyboard.

  The PS-3200 found its way into the studios of notable artists including Hans Zimmer, Jean-Michel Jarre, and Emerson, Lake & Palmer. Its lush, full polyphonic analog sound and semi-modular patching capabilities have made it a highly sought-after vintage instrument.
specs: |-
  - Polyphony: 48 voices, fully polyphonic
  - Oscillators: 2 VCOs per voice (96 total)
  - Filter: Individual VCF per VCO module with resonance and envelope
  - LFO: Individual LFO per VCO module
  - Equalizer: Built-in 7-band EQ
  - Memory: 16 recallable patches with power-off persistence
  - Keyboard: PS-3010 48-key remote polyphonic keyboard
  - Control: CV/Gate
  - Optional Accessory: PS-3060 Programmer Remote Controller
