description: SACD 30n was designed for the experienced audiophile who
  appreciates flexibility in format and expects the most realistic sound.
  Hundreds of hours of careful Sound Master tuning ensure the exquisite detail
  and musicality Marantz has always delivered.
details: |-
  SACD 30n is built for the audiophile who wants to combine a large digital music collection with the leading online music services, playing SACD, CD, CD-R/RW and DVD-R/+R/-RW/+RW discs.

  The analog stage is built on a discrete Hyper-Dynamic Amplifier Module, fed by the Marantz Musical Mastering digital-to-analog converter with MMM Conversion, MMM-Stream digital filtering, a jitter reducer and a dual clock for 44.1 and 48 kHz material.

  HEOS Built-in provides multiroom playback and search across TIDAL, Pandora, Amazon Music HD and other services, with AirPlay 2, Bluetooth, Roon Ready, TuneIn internet radio and streaming up to WAV, FLAC, ALAC 192/24 and DSD 5.6.

  Digital inputs cover a USB-DAC (PCM up to 384kHz/32bit, DSD up to 11.2MHz) with asynchronous mode and isolation, one coaxial and two optical inputs, and switchable coaxial and optical outputs. Analog output is a gold-plated RCA pair with a dedicated variable output driven by a digital volume control.

  A full discrete HDAM-SA2 headphone amplifier with Low / Mid / High gain and automatic plug detection drives the 6.3mm headphone output. The unit is crafted in Shirakawa, Japan, carries a 3 year warranty and is available in Black and Silver-Gold.
specs: |-
  - Disc types: SACD / CD / CD-R / CD-RW / DVD-R / +R / -RW / +RW, Super Audio CD Text
  - USB-DAC: 1 (PCM up to 384kHz/32bit, DSD up to 11.2MHz), asynchronous mode, isolator
  - USB-A: 1 (rear), mass storage, FAT 16/32 and NTFS, WMA / MP3 / AAC / WAV 192/24 / FLAC 192/24 / AIFF 192/24 / ALAC 96/24 / DSD 2.8/5.6
  - Coax in: 1
  - Optical in: 2
  - Coax out: 1 (on/off switchable)
  - Optical out: 1 (on/off switchable)
  - RCA out: 1 L/R independent, gold plated high grade brass terminals
  - XLR out: none
  - HDMI ARC in: none
  - Variable audio output: dedicated, digital volume (JRC)
  - Ethernet: Yes
  - Wi-Fi 2.4GHz (11b/g/n) and 5GHz (11a/n), removable rod antenna
  - Bluetooth (SBC, AAC)
  - Network engine: HEOS
  - AirPlay 2
  - internet radio TuneIn
  - gapless playback (FLAC, WAV, AIFF, ALAC, DSD)
  - Headphone: 6.3mm x 1, full discrete HDAM-SA2 amp, gain setting Low / Mid / High, auto plug detection
  - Audio circuit: HDAM
  - D/A converter: MMM Conversion
  - Power transformer: Toroidal
  - Digital filter: MMM-Stream (Filter 1, 2)
  - Jitter reducer: Yes
  - Dual clock for 44.1/48kHz
  - Control: RS232C, flasher input x1, RC5 remote in/out, IP control, web control, Wake on LAN, Control4 certified
  - Display: OLED 3-line with 4-level dimmer
  - Power consumption: 48W
  - network off mode 5W
  - Dimensions (W x H x D): 443 x 130 x 424 mm
  - Weight: 13.7 kg
  - AC inlet: Yes (IEC)
  - Chassis material: SECC, single 3.0mm thick bottom layer
  - aluminum front panel and side covers, steel top cover
  - Panel colors: Silver-Gold / Black
