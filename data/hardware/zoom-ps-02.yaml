description: The PS-02 Palmtop Studio combines a drum and bass machine, a
  digital multi-recorder, and a multi-effect device in a single compact unit.
details: |-
  The PS-02 Palmtop Studio puts a drum and bass machine, a three-track digital recorder and a multi-effect device into a body measuring 90 x 85 x 35 mm and weighing 140 g without batteries. It ships with a belt clip and runs either from the AD-0006 9 V DC adaptor or from four AAA batteries, giving about four hours of continuous operation on alkalines.

  Recording goes to SmartMedia rather than to internal storage, and the card is required for the unit to start at all. A song holds two rhythm tracks from the internal drum and bass machine plus three audio tracks, each audio track carrying ten virtual takes for 30 takes in total, and up to 100 songs fit on one card. Running time depends on card size and mode, from 3 minutes 12 seconds of HiFi mono on an 8 MB card to about 67 minutes on a 128 MB card, with a Long mode roughly doubling each figure. Auto punch-in and punch-out and a bounce function that ping-pongs tracks onto tracks 1 and 2 are both included.

  The rhythm track is programmed by choosing patterns and specifying chords rather than by step sequencing, drawing on more than 200 preset drum and bass patterns across rock, blues and dance styles, with six drum kits and five bass programs. The bass line follows the chord entered for each section, and the pattern and sound library can be extended with new data loaded from SmartMedia.

  The effect section runs on Zoom's ZFX-2 DSP with 24-bit internal processing and offers 50 effects across six simultaneous modules: DRIVE, CABINET SIMULATOR, EQ, ZNR, MODULATION and REVERB, stored as 60 preset and 60 user patches. The DRIVE module carries Zoom's VAMS amp modelling, from transistor and tube combo models through British stack voicings to fuzz and bass amps, plus compressor and distortion types and a MICPRE mic preamp with its own limiter. A separate mixdown effect processes the finished mix with high and low balance and reverb, and three sliders give direct hands-on control of one parameter each from the DRIVE, MODULATION and REVERB modules.

  The effect output appears at the OUTPUT jack as well as feeding the recorder, so the unit doubles as a standalone amp simulator or effect box. A quarter-inch mono INPUT jack takes a guitar, bass or microphone with switchable high and low gain for each, a mini stereo AUX IN takes a CD player or similar, and a non-directional condenser microphone is built into the body for recording acoustic guitar or vocals. Tuning is reached through the [BYPASS TUNER] key.
specs: |-
  - Sampling frequency: 31.25 kHz
  - A/D conversion: 20-bit, 64-times oversampling. D/A conversion: 20-bit, 8-times oversampling
  - DSP: ZOOM original ZFX-2 with internal 24-bit processing
  - Audio tracks: 3, each with 10 virtual takes (30 takes total), plus 2 rhythm tracks (drums and bass)
  - Recording media: SmartMedia, 3.3 V specification. Card required for operation
  - Audio recording time per card, mono converted to 1 track (HiFi / Long mode): 8 MB 3 m 12 s / 6 m 24 s, 16 MB 7 m 30 s / 15 m 0 s, 32 MB 16 m 11 s / 32 m 23 s, 64 MB 33 m 33 s / 67 m 7 s, 128 MB (support planned) approx. 67 m / approx. 134 m
  - Maximum number of songs: 100
  - Rhythm patterns: 211, drum kits: 6, bass programs: 5
  - Effect patches: 60 preset and 60 user, 120 total. Effect modules: 6, number of effects: 50
  - Other recorder functions: auto punch-in/punch-out, bounce
  - Input jack: standard mono phone jack, input impedance 500 kilohms
  - Rated input level: -10 dBm (GUITAR GAIN LOW), -16 dBm (GUITAR GAIN HIGH), -40 dBm (MIC GAIN LOW), -50 dBm (MIC GAIN HIGH)
  - Built-in microphone: non-directional condenser microphone
  - AUX input: mini stereo phone jack, rated input level -10 dBm, input impedance 40 kilohms
  - Output jack: standard stereo phone jack, rated output level -10 dBm into a load impedance of 10 kilohms or higher, output impedance 1 kilohm or less
  - Headphones: mini stereo phone jack
  - Display: PS-02 original LCD
  - Power: supplied AD-0006 AC adapter, 9 V DC 300 mA, or 4 x IEC R03 (size AAA) batteries. Battery life approx. 4 hours continuous on alkaline
  - Dimensions: 90 mm (D) x 85 mm (W) x 35 mm (H)
  - Weight: 140 g excluding batteries
  - Supplied accessories: SmartMedia (8 MB), belt clip, AC adapter (AD-0006)
