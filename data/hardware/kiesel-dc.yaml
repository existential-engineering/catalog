details: |-
  With a lineage traced back to the 70s, the DC series has consistently evolved with the changing tastes of each decade. In the early 2010s, the DC600 line was overhauled with advancements from the Kiesel Custom Shop.

  The optional bevel, extra deep tummy cut, and pointier horns are just a few features that modernize the series. The shape of the DC is reminiscent of the 80s compared to similar models, such as the Aries Neck-Through.

  Construction is neck-through with a sculpted neck heel, using a tung-oiled maple neck with a 2-way adjustable truss rod and dual carbon-fiber rods for additional strength and stability, under a 3 x 3 pointed headstock.

  Electronics are master volume and tone controls with a 5-way blade-style pickup selector feeding direct-mount passive Kiesel Lithium humbuckers, with both a flush mount and a rear access output jack offered. Bridge choices are a Hipshot fixed bridge or a Hipshot Solo Saddle bridge at .4125 inch (10.5 mm) spacing.

  The gallery covers 6-, 7- and 8-string builds (DC600H, DC600C, DC700X, DC800) with alder and black limba bodies, flamed koa and black limba tops, ebony, royal ebony, palemoon ebony and roasted maple fingerboards, and finishes from california aqua burst to custom jawbreaker and pink splatter.
specs: |-
  - Available in multiple string counts, with 6-, 7- and 8-string builds shown, plus multiscale options
  - Construction: neck-through with sculpted neck heel
  - Body: alder
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Fingerboard: ebony with 14 inch radius, or ebony with 20 inch radius
  - Frets: 24 stainless steel medium-jumbo, .103 inch wide x .048 inch tall
  - Scale length options: 25.5 inch, 27 inch, and multiscale 25.5 to 26.5 inch, 25.5 to 27 inch, 26 to 27.5 inch
  - Pickups: direct-mount passive Kiesel Lithium humbuckers
  - Electronics: master volume and tone controls, 5-way blade-style pickup selector, flush mount output jack and rear access output jack offered
  - Bridge: Hipshot fixed bridge, .4125 inch (10.5 mm) spacing, or Hipshot Solo Saddle bridge, .4125 inch (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: 3 x 3 pointed headstock
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Hardware: chrome
  - Neck width: 1.69 inch to 2.12 inch wide at the nut depending on configuration, 0.75 to 0.79 inch thick at the 1st fret, 0.85 to 0.88 inch thick at the 12th fret
  - Body dimensions: 39.5 inch, 40.15 inch or 42.25 inch long, 1.68 inch thick, 12.75 inch wide
  - Weight: 7.5 lbs, 7.6 lbs or 7.85 lbs depending on configuration
  - Strings: Elixir Nanoweb 1046E
  - The DC600 is the 6-string line within the series
