description: A modernized take on the classic So-Cal shred machine, pairing an
  alder body with a caramelized maple neck and ebony fingerboard. Dual Seymour
  Duncan Distortion humbuckers, a Floyd Rose 1500 double-locking tremolo, and
  5-position coil-split switching deliver versatile high-performance tones built
  for fast playing.
details: |-
  The Pro-Mod Plus So-Cal Style 1 HH FR EB features an alder So-Cal body in a gloss Snow White finish. The bolt-on caramelized maple neck has graphite reinforcement and a hand-rubbed satin urethane finish, with a D-shaped profile for fast, comfortable playing.

  The ebony fingerboard carries a 12"-16" compound radius, 22 jumbo frets, 4mm pearloid dot inlays, rolled fingerboard edges, and Luminlay side dots. A Floyd Rose 1500 Series locking nut (1.6875" width) anchors the 25.5" scale length, and a licensed Fender Stratocaster headstock completes the classic So-Cal profile.

  Electronics include a Seymour Duncan Distortion TB-6 humbucker in the bridge and a Seymour Duncan Distortion SH-6N humbucker in the neck (both in black), wired through a 5-position blade switch that delivers inner- and outer-coil combinations alongside the standard bridge/neck positions, plus master volume and tone controls.

  Hardware is finished in black and includes a Floyd Rose 1500 Series double-locking tremolo with locking tremolo arm, Charvel-branded die-cast tuning machines, a 1-ply black anodized aluminum pickguard, dome-style control knobs, and standard strap buttons. The guitar ships with .009-.042 nickel-plated steel strings and a Charvel multi-fit gig bag.
