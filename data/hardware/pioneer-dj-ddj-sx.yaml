description: The DDJ-SX delivers intuitive control of all Serato DJ Pro’s
  exciting features. Dedicated buttons and dials deliver plug-and-play control
  of Serato DJ Pro’s 4 decks, 8 Hot Cues, 6 samples, and 10 high-quality sound
  effects powered by iZotope. Pro-DJ performance is even further enhanced with
  tactile Performance Pads with Velocity Mode and Dual Deck Control – which lets
  you perform live edits on two decks simultaneously; so scratching on Deck A
  can be applied to Deck C at the same time.
details: |-
  4-channel controller for Serato DJ Pro with Dual Deck Control. The DDJ-SX delivers intuitive control of all Serato DJ Pro’s exciting features. Dedicated buttons and dials deliver plug-and-play control of Serato DJ Pro’s 4 decks, 8 Hot Cues, 6 samples, and 10 high-quality sound effects powered by iZotope. Pro-DJ performance is even further enhanced with tactile Performance Pads with Velocity Mode and Dual Deck Control – which lets you perform live edits on two decks simultaneously; so scratching on Deck A can be applied to Deck C at the same time.
