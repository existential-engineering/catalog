description: >-
  The Oberheim DX is a lighter version of the classic DMX drum machine with 18
  sampled drum sounds, individual tuning knobs, swing function, and 6 individual
  outputs, widely used in early hip hop production.
details: |-
  The DX was a lighter version of the classic DMX drum machine. Its look, features, and programming method are basically the same as the DMX. The DX has individual tuning knobs for the drum tones and an external trigger input. Its sounds are sampled recordings of actual instruments.

  The DX has 18 drum sounds compared to the DMX's 24. Both drum machines have a number of human-like feel effects such as a great swing function, rolls, flams, and other time signatures and grooves. There are 6 individual outputs like the DMX for easing studio use.

  The DX has been used by hip hop artists since the very beginning of hip hop, as well as by Apollo 440, Daft Punk, and Jimi Tenor.
specs: |-
  - Polyphony: 6 voices
  - Sounds: 18 drum sounds
  - Sequencer: 100 sequences, 50 songs
  - VCA: 6 level sliders
  - Keyboard: 18 keys
  - Effects: Individual tuning control, Swing Function
  - Control: Trigger In/Out (MIDI by modification)
