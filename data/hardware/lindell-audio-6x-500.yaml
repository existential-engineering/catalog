details: |-
  The Six X Five Hundred is a one channel transformer coupled Microphone Preamplifier and Passive 2 Band Pultec Equalizer. It's an all discrete design based upon the great 990 amplifier.

  The Equalizer is Lindell Audio's take on the magical classic Pultec design. It's got 12db boost of the creamiest high end you've ever heard and the most punchy low end heard the 21st Century.

  The Sound can be described as Fast, Punchy and In ya face. The 6X-500 fits in all 500 series compatible power supplies.
specs: |-
  - Transformer coupled Balanced inputs and Balanced Outputs
  - Up to 65db of Gain
  - Passive Pultec Equalizer. Inductor + 990 gain make-up amplifier
  - 3 Step Switched Eq Low Freq Boost 30Hz, 60Hz, 100Hz +/-10%
  - 3 Step Switched Eq High Freq Boost 6kHz, 10kHz, 16kHz +/-10%
  - Selectable High Boost Bandwidth on pcb
  - Polarity Reverse
  - Pin Compatible with 990 & 2520 type op-amps
  - 48V Phantom Power
  - 5-LED VU Meters
