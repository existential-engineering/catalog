description: >-
  The Korg X5D is an entry-level 61-key digital synthesizer from 1995
  featuring the Ai2 sound engine from the 01/W series, 64-voice polyphony,
  General MIDI compatibility, and classic Korg voices including the M1 Piano.
details: |-
  The X5D packaged Korg's acclaimed Ai2 synthesis engine from the 01/W series into a lightweight, affordable instrument aimed at players who wanted quality digital sounds without workstation complexity. With 64-voice polyphony and 16-part multitimbrality, it was surprisingly capable for its market segment.

  The sound library draws from 430 multi-sounds and 215 drum sounds stored in 8 MB of ROM. A complete General MIDI sound set sits alongside two banks of Korg-specific presets, including beloved voices inherited from the M1 workstation such as the famous Universe pad and M1 Piano. Storage provides 128 GM patches plus 100 program and 100 combination patches.

  Two independent digital multi-effects processors offer 47 effects each, an unusually generous effects section for an entry-level keyboard. The low-pass VDF filter on every oscillator shapes tones effectively, though it lacks resonance, keeping the sound character smooth rather than aggressive.

  The 61-key keyboard responds to velocity but omits aftertouch, a reasonable compromise for the price point. MIDI in/out/thru connectivity integrates the X5D into larger setups. With no sequencer or arpeggiator onboard, the X5D focuses purely on sound generation and performance, relying on external sequencers or DAWs for production work.
specs: |-
  - Polyphony: 64 voices
  - Multitimbral: 16 parts
  - Oscillators: 2 per voice
  - Waveforms: 430 multi-sounds, 215 drum sounds
  - ROM: 8 MB
  - Filter: Low-pass VDF per oscillator (non-resonant)
  - Effects: 2 independent multi-effects processors, 47 effects each
  - Keyboard: 61 keys with velocity (no aftertouch)
  - Memory: 128 GM patches, 100 programs, 100 combinations
  - Sequencer: None
  - MIDI: In/Out/Thru
releaseDate: "1995"
