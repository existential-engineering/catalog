description: A bass-focused octave fuzz pedal with extended gain range, a
  notch-filter tone sweep, and a mix control to blend clean and fuzz signals.
details: |-
  We’ve hit a new low. From this moment forward, the power and intensity of bass fuzz is changed forever. The Bass War by Death By Audio is a louder, wider-ranging, earth-shaking bass fuzz that can get more oomph than any other pedal we’ve ever heard. Details The Bass War began with the idea that we could make a version of the Fuzz War that was even more perfect for bass. Twisting classic circuit ideas to our own tastes, we’ve crafted a wicked, harmonically rich octave fuzz. It boasts extraordinary levels of gain, a massive tone sweep, and a MIX control, providing everything you need for the ultimate bass fuzz at your fingertips. It sounds freaking amazing but it doesn’t stop there, the Bass War goes BEYOND that and can deliver more volume, more tones, more fuzz, and more sonic syrup guaranteed to turn the heads of any bystander. The controls have super-extended ranges that let you dial in so many wildly different tones that are all surprisingly useful and HEAVY. Roll the FUZZ knob back for a dirty, sleazy, grinding drive, turn it up to noon for a super thick distortion, and then alllllll the way up for a blistering wall of total destruction. The TONE knob is a notch filter that transforms the overall sonic spectrum of the fuzz to sound like you are sweeping through an arsenal of 100 different fuzz pedals. Combine this with insane volume on tap and a MIX knob to get the extreme fuzz and distortion you always wanted for your bass without sacrificing volume or floor-shaking subs. Wrap it all up in a DBA punk-style raw enclosure with spray-painted graphics, and all that’s left to do is find a time machine so you can re-record all those old bass parts! Controls VOLUME Controls the overall output level from -inf to +27 dB, 10 o'clock is close to unity volume. WARNING: The Bass War is capable of extreme volume! FUZZ Controls the gain of the fuzz from +16 to +64 dB. Ranges from raunchy drive, to smooth fuzz, to overloaded insanity. TONE Sweeps a deep notch filter tuned for a wide range of 98 Hz to 3.3 kHz. This radically reshapes the fuzz sound for a massive range of tones. MIX Blends between your clean sound and the fuzz. Blending in your clean tone helps your notes stay articulate, balanced, and bassy against the huge sound of the fuzz circuitry. Specifications Power Details Power Supply: Standard 9 VDC power supply with a 2.1mm negative center barrel Current Draw: 33 mA Physical Details Dimensions: 5.9" x 4.73" x 2.24" (including hardware) Weight: 15.5 oz. Sound Samples Bass Porcupine Fuzz Plucks of Doom Climbing the Crush Blown Circuits Guitar Classic Fuzz Metal Domination Beyond Crushed Ascending Chaos Digital Manual
