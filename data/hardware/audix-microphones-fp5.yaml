description: The FP5 Drum Pack contains a combination of f2, f5, and f6 dynamic microphones.
details: |-
  The FP5 Drum Pack contains a combination of f2, f5, and f6 dynamic microphones. The f5 is tuned for snare drum and can be used as well for bongos, timbales, guitar cabinets, and acoustic instruments; the f2 is ideally suited for rack and floor toms, congas, djembe, bongos, timbales, brass, and woodwind instruments. The f6 dynamic microphone, with its extended bass response, is designed for kick drum, bass cabinets, cajon, and other low-frequency instruments.

  Built to withstand the rigors of live stage applications, the Fusion Series mics are also excellent for rehearsal, school, house of worship, and a wide variety of home recording applications.
