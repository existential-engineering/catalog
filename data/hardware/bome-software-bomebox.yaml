description: The MIDI hub for stage and studio. The BomeBox is the solution for
  connecting and mapping MIDI devices via MIDI DIN, USB, Ethernet and WiFi,
  without the need of a computer.
details: |-
  The BomeBox is a standalone MIDI hub for stage and studio that connects and maps MIDI devices over MIDI DIN, USB, Ethernet and WiFi without needing a computer. It cross-connects USB-MIDI devices (which it can power), 5-pin DIN MIDI gear, other BomeBoxes, computers, iPhones and iPads, all inside one reinforced ABS enclosure measuring 121mm x 96mm x 38mm and weighing 180g.

  Configuration happens entirely in a browser. Connect any computer, smartphone or tablet to the BomeBox's built-in WiFi (default SSID "BomeBox", IP 192.168.153.1) or over Ethernet, and the web config exposes MIDI ports and aliases, MIDI routes and route sets, network MIDI connections to other BomeBoxes, MIDI Translator project management, a MIDI-CI proxy setup, serial port assignment, Allen & Heath mixer connections, and settings for name, password, Ethernet addressing, WiFi mode and backups or firmware updates.

  The built-in MIDI router provides an unlimited virtual MIDI patch bay: by default every port is forwarded to every other port, and routes can be refined, duplicated or merged arbitrarily. For deeper work the BomeBox carries a MIDI Translator Pro runtime, so project files authored on a Windows or macOS machine can be uploaded and executed standalone, giving mappings, filtering, math on values, conditional logic, layers, timers and presets. The MIDI Translator Pro editor is sold separately, though running someone else's project file needs no licence.

  Connectivity expands through the USB 2 host Type A receptacle, which takes USB-MIDI controllers and synths, multi-port MIDI DIN interfaces, powered and passive hubs, USB-to-serial adapters, HID QWERTY keyboards and thumb drives. Up to firmware 1.4.2 the box handled 8 USB devices; firmware 1.5 raised that to 30. The DIN ports follow the current MIDI specification and supply 5V MIDI phantom power. USB-audio interfaces are not supported, although their MIDI ports are.

  Two 100MBit/s Ethernet ports form a built-in switch and are labelled PoE In and PoE Out. Power comes either from a 5V micro-USB supply drawing 150mA (a standard phone charger is enough for the 0.75W the unit needs) or from a 48V Power-over-Ethernet source on the PoE In port; the PoE Out port then acts as a PoE source so a chain of BomeBoxes on a stage can share one cable run for both power and network MIDI. The micro-USB connector is power only and carries no MIDI to a host computer.
specs: |-
  - Arbitrary MIDI thru connections (routes) from and to all connected MIDI devices
  - Web Config for configuration from any WiFi-enabled device
  - Loads and executes MIDI Translator Pro project files for advanced mappings (editor sold separately)
  - MIDI connections to computers over a high-speed network protocol via Ethernet or WiFi using the Bome Network tool
  - MIDI in and out with very low latency
  - MIDI-DIN: 1x input, 1x output, expandable via the USB host port
  - USB 2 host (Type A receptacle) for MIDI controllers, synthesizers, serial ports, USB hubs and more
  - 2x Ethernet 100MBit/s with a built-in 2-port switch, labelled PoE In and PoE Out
  - WiFi: 802.11 b/g/n, 2.4 GHz (wireless, not a physical port)
  - Power: requires 0.75W, either via micro-USB Type B at 5V (150mA) from a standard phone charger, or via Power over Ethernet (48V) on the PoE In port. There is no DC barrel jack: the only dedicated power connector is the micro-USB Type B socket, which is power-only and carries no data
  - Provides power for connected USB-MIDI devices (max. 1A at 5V)
  - Provides power to other daisy-chained BomeBoxes via PoE Out when itself powered via PoE
  - MIDI phantom power: 5V on the DIN ports, per the current MIDI specification
  - Up to 30 USB-MIDI devices via hubs since firmware 1.5 (8 devices up to firmware 1.4.2)
  - Approx. 8MB internal storage for MIDI Translator Pro projects, roughly 500,000 translations, extendable with a USB thumb drive
  - Does not support USB-audio, and does not implement RTP-MIDI
  - New features delivered by firmware update
  - Dimensions: 121mm x 96mm x 38mm (4.8 x 3.7 x 1.5 inches)
  - Weight: 180g (6.3oz)
  - Robust reinforced ABS case
