description: Backpack Modular. Your Palette case is the ideal solution for your
  space conscious and/or portable needs. With either 62hp or 104hp of rack
  space, you can piece together powerful but focused mini systems and control
  surfaces.
details: |-
  The Palette case is a portable, space-conscious Eurorack solution that fits on a desktop, at a coffee shop, or in a jam space. It's available with either 62HP or 104HP of 3U Eurorack rack space plus a matching row of Intellijel 1U modules.

  The 62HP configuration includes a built-in dual buffered multiple with bi-polar LED level indicators, expansion jacks for MIDI and balanced audio I/O, and a 40W power supply capable of powering up to 12 modules.

  The 104HP configuration steps up to a built-in triple buffered multiple, dual precision summers, four 1/4-inch balanced audio jacks, MIDI in/out, and a 60W power supply capable of powering up to 24 modules.

  Construction is anodized aluminum with extruded rails and steel threaded inserts, rubber feet, and a rear-mounted power supply that maximizes available module depth.

  Each Palette case ships with a Meanwell AC/DC adapter, an IEC power cable, and a 1/8-inch-to-5-pin-DIN MIDI adaptor; a separate polycarbonate lid is sold as an accessory.
specs: |-
  - 62HP: 324.4mm x 204.4mm x 51.3mm, 1.36kg with AC adaptor
  - 62HP PSU: +12V at 1.2A, -12V at 1.2A, +5V at 500mA (40W, up to 12 modules)
  - 104HP: 537.7mm x 204.4mm x 51.3mm, 2.6kg with AC adaptor
  - 104HP PSU: +12V at 1.5A, -12V at 1.5A, +5V at 500mA (60W, up to 24 modules)
  - Module depth: 45.5mm (37.4mm at each 1HP edge)
  - Anodized aluminum construction, extruded rails with steel threaded inserts
