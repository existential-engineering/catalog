details: |-
  Considered by many as one of the greatest heavy metal guitarists of all time, Michael James Romeo is the lead guitarist and founding member of the world renowned progressive metal act Symphony X. When you listen to MJR play, his infusion of influences from classic metal bands to classical composers soar from him in an immaculately precise, impeccably phrased, technical assault that demands a special sort of guitar to live up to his calibre of virtuoso. With an elaborate bolt on neck joint and body structure, the Dellinger Prominence-MJR has been upgraded from a Dellinger to a Dellinger Prominence body. This introduces a curved top, offering the greatly improved playing experience of a through neck model TAT on a bolt on neck guitar. The Dellinger Prominence-MJR also features the Caparison "M3" composite tone wood body construction, which consists of a central Maple section sandwiched between two Mahogany sides, the neck bolts directly to the Maple section. The result is a balanced sound with focused low frequencies and rich sustain. The Dellinger Prominence-MJR also now features a 5-piece Maple and Walnut neck for ultimate stability. At Michael Romeo's request, the Dellinger Prominence-MJR is equipped with the Jim Dunlop super jumbo frets and a modified neck profile, which supports high-speed playing. Coupled with a blistering combination of DiMarzio Tone Zone (neck) and X2N (bridge), Maple fretboard and is rounded off by a Schaller double locking tremolo. Flawless like the artist it was created for.
