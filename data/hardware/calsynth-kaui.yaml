description: KAUI is an 8HP dual-oscillator Eurorack sound generator designed
  for Techno basses and leads, featuring two oscillators with square-to-triangle
  waveshaping blended with sine waves, noise, and CV pitch control.
details: |-
  DUAL TECHNO OSCILLATOR 8HP

  PLEASE NOTE: BUILD AND TROUBLESHOOTING ADVICE CAN NOT BE PROVIDED ON AN INDIVIDUAL BASIS. PLEASE GO TO THE FORUM ON THE ST MODULAR SITE IF YOU NEED HELP.

  KAU'I is a basic two oscillator sound generator that was designed to create Techno basses and leads. Oscillators A and B share identical designs but cover distinct pitch ranges. Using the A and B knobs located atop the module, you can seamlessly transition the waveform of each oscillator from a square-wave to a triangle wave. The SHAPE2 knobs then take this waveform and blend it with an independent sine-wave signal for each oscillator. The LVL knobs adjust the volume of each sound generator, while rotating the NOISE knob introduces white noise to oscillator A on the MIX output. Both oscillators feature a pitch control input accompanied by an attenuator. This input follows a linear voltage-to-frequency response (Hz/Oct), making it ideal for generating unique Techno sequences at lower frequencies. At the module's base, you'll discover a MIX OUT combining the outputs of both oscillators, alongside individual outputs for each oscillator.
