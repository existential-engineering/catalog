description: Highly versatile in-wall speaker with Carbon Dome tweeter and
  Continuum mid/bass driver for thrilling sound.
details: |-
  CWM 7.5 S2 is the compact two-way in-wall model in the Bowers & Wilkins Reference Series. It shares the acoustic configuration of the 707 S2 bookshelf loudspeaker, housing a 130mm (5in) Continuum cone bass/midrange driver and a 25mm (1in) Carbon Dome tweeter.

  The bass driver is coupled to a forward-firing Flowport, which is what gets the low-end reach out of a relatively small footprint. The baffle is critically formed from glass reinforced ABS.

  Like the larger CWM7.3 S2, it has its own integrated back box. That makes installation retrofittable into an existing wall and fixes the rear volume the driver works into, so performance does not depend on the cavity behind it.

  Bowers & Wilkins positions it as an outstanding performer in stereo or multi-room installations and equally at home as the rear channel in a larger theatre system. It is a passive loudspeaker: no on-board amplifier and no mains connection, driven from an external power amplifier rated 25W to 150W into 8 ohms on unclipped programme, with -6dB points at 43Hz and 33kHz, a 45Hz to 28kHz +/-3dB response, 86dB sensitivity and a nominal 8 ohm impedance with a 3.8 ohm minimum.

  The frame is 356mm (14in) high by 212mm (8.5in) wide, needs a 331mm by 187mm cut-out (336mm by 192mm with the 7.5W pre-mount kit) and sits 102mm (4in) behind the wall surface. The internal reservoir box measures 385mm by 181mm, protrusion is 8mm (0.32in) and net weight is 3.8kg (8.38lb). Back box and grille are finished in White.
specs: |-
  - 2-way in-wall system with integrated back box
  - Drive units: 1x ø25mm (1in) Carbon Dome tweeter, 1x ø130mm (5in) Continuum cone bass/midrange driver
  - Technical features: Carbon Dome tweeter, Continuum mid/bass, Flowport
  - Shares the acoustic configuration of the 707 S2
  - Frequency range: -6dB at 43Hz and 33kHz
  - Frequency response: 45Hz to 28kHz +/-3dB (-3dB)
  - Sensitivity: 86dB SPL (2.83Vrms, 1m)
  - Harmonic distortion: 2nd and 3rd harmonics (90dB, 1m) under 1% from 90Hz to 33kHz, under 0.5% from 120Hz to 33kHz
  - Nominal impedance: 8 ohms (minimum 3.8 ohms)
  - Recommended amplifier power: 25W to 150W into 8 ohms on unclipped programme
  - Frame: 356mm (14in) high x 212mm (8.5in) wide
  - Depth behind surface: 102mm (4in)
  - Cut-out: 331mm (13in) high x 187mm (7.4in) wide
  - Cut-out with pre-mount kit: 336mm (13.2in) high x 192mm (7.6in) wide
  - Reservoir box: 385mm (15.2in) high x 181mm (7.1in) wide
  - Protrusion: 8mm (0.32in)
  - Pre-mount kit: PMK 7.5W
  - Net weight: 3.8kg (8.38lb)
  - Forward-firing Flowport
  - Baffle critically formed from glass reinforced ABS
  - Passive: no on-board amplifier and no mains inlet, driven from an external power amplifier
  - Finishes: back box White, grille White
