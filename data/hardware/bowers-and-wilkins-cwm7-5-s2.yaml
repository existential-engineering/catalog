description: Highly versatile in-wall speaker with Carbon Dome tweeter and
  Continuum mid/bass driver for thrilling sound.
details: |-
  The CWM7.5 S2 is the Reference Series two-way in-wall speaker, listed on the product page as a Reference two-way in-wall speaker in a White finish.

  The CWM7.5 shares the acoustic configuration of the 707 S2 and like its sibling, it houses a 130mm (5in) bass/mid-range Continuum cone driver plus a 25mm (1in) Carbon Dome tweeter, coupled to a forward-firing Flowport for outstanding bass response from a relatively small footprint.

  It has a critically formed baffle constructed from glass reinforced ABS plus its own integrated backbox, ensuring retrofittable installation plus optimum performance.

  It is an outstanding performer when used in stereo or multi-room installations, and is equally at home as the rear speaker in a larger theatre application. The page's own Technical details block lists the drive units as one 25mm Carbon Dome tweeter and one 130mm Continuum cone bass/midrange driver.
specs: |-
  - Description: 2-way in-wall system
  - Technical features: Carbon Dome tweeter, Continuum mid/bass, Flowport
  - Drive units: 1x ø25mm (1in) Carbon Dome high-frequency
  - Drive units: 1x ø130mm (5in) Continuum cone mid/bass
  - Frequency range (-6dB): 43Hz – 33kHz
  - Frequency response: 45Hz – 28kHz ±3dB (-3dB)
  - Sensitivity: 86dB SPL (2.83Vrms, 1m)
  - Harmonic distortion (2nd and 3rd harmonics, 90dB, 1m): <1% 90Hz – 33kHz, <0.5% 120Hz – 33kHz
