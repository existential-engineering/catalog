details: |-
  Get daily beat-making workouts: beatrace offers a daily workout that will help
  you train and improve your beat-making skills. The workout includes
  challenging beat games: recreate a drum pattern from scratch, identify bpm and
  swing values, pass levels, compare scores with others and keep motivated.

  Win hourly beat-making races: beatrace offers hourly real-time beat-making
  matches. Reconstruct beats as fast as you can; the fastest competitor wins the
  race. Weekly leaders will get two special prizes: regroover and beatformer
  cutting-edge beat-making plugins by accusonus.

  Create and share beats online: use beatrace online drum machine to create and
  share drum sequences, load, save and download your grooves. 11 classic drum
  machine kits are included.

  Beatrace is available to all soundgym members with premium features and
  unlimited training available for soundgym pro members.
