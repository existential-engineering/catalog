description: MiniFreak is a polyphonic hybrid keyboard that unites dual digital sound
  engines with analog filters, playful modulation, instinctive sequencing, and
  rich stereo effects for sounds that are immediately curious, beautiful, and
  chaotic in equal measure.
details: |-
  From virtual analog to fm, additive to granular, collide contrasting modes for compound polyphonic timbres, feed engine 1s sound into engine 2 for stacked sonic interplay, and process your voice or external audio through its architecture to unleash any sounds wild side.

  With twin lfos, polyphonic cycling envelopes, and customizable lfo shapes, modulate your sound engines, filters, effects - even your modulation sources themselves. Anything goes with this simple-but-powerful modulation matrix, putting any flavor of animated, evolving, or untamed sonic alteration at your disposal in seconds.

  Minifreak is armed with stereo outputs and 3 fx slots, each with 13 curated fx algorithms to choose from, ensuring that every patch is mix-ready and as wide as you need it to be.

  Minifreak is a monster built for playing. Enjoy polyphony that responds to your every input with a quality slim-key keybed with aftertouch, make sweeping changes to your sound with dynamic macros, turn your melodies into dense chord stacks with chord mode, and keep your harmony in-check with scale mode.
specs: |-
  - 6-voice polyphonic hybrid synthesizer
  - 37-note velocity-sensitive slim-key keybed with aftertouch
  - 2 sound engines with 22 oscillator modes in total
  - Engine 1 oscillator modes: granular, sample, superwaves, karplus strong, wavetable, audio in, speech, modal, and 3 modes by noise engineering
  - Engine 2 modes: comb filter, destroy, ring mod
  - Polyphonic state-variable resonant filters with low-pass, band-pass, and high-pass modes
  - Self-oscillating filters
  - Standard ADSR envelope with 4 modes: polyphonic, monophonic, paraphonic, and unison
  - Cycling envelope with shape-adjustable second envelope
  - Run or loop modes for repeating modulations
  - 2 LFOs with free-running or sync'd operation
  - Custom LFO shaper
  - Modulation matrix with 7 sources and 13 potential destinations
  - 3 digital FX slots in insert or send mode
  - 13 FX algorithms including ext vocoder and self vocoder
  - OLED display for real-time visual feedback
  - Intuitive 64-step sequencer with 4 pages of 16 steps
  - 4 lanes of automated modulation
  - Performance arpeggiator controls including ratchet, octave randomize
  - Spice & dice randomization and one-touch mutations
  - Sustain, audio in, and clock in/out connectivity
  - Balanced stereo outputs
  - 244 user preset slots
  - MIDI in, out, or thru connectivity
  - USB connectivity for updates and preset management
  - Audio in mode for processing external signals
  - Dual oscillators with 3 FX engines
  - Shift button for secondary settings
  - Touch strips for pitch bend, mod, and macro control tweaking
  - Seq & arp controls for sequence and arpeggio manipulation
  - Chord mode
  - Scale mode
  - Dimensions: 578 x 231 x 55mm (22.75 x 9.09 x 1.57 inches)
  - Weight: 2.94 kg (6.48 lbs)
  - Universal psu - 12v 1a
  - Included: MiniFreak unit, USB a to USB 2.0 cable, registration card
