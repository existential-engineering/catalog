description: >-
  The Korg Volca Bass is a compact, battery-powered analog synthesizer featuring three
  oscillators and a built-in 16-step sequencer. Its entirely analog signal path includes a
  resonant low-pass filter recreated from the classic MiniKorg-700S, delivering vintage
  character in a portable format roughly the size of a VHS cassette. MIDI input and sync
  connectivity allow integration with external gear and other Volca units.
details: |-
  Announced at Musikmesse 2013 alongside the Volca Beats and Volca Keys, the Volca Bass caught the synth community off guard with its combination of genuine analog circuitry and an aggressive price point. Three VCOs with sawtooth and square waveforms provide the raw tonal material, capable of unison bass tones or three-note paraphonic sequences.

  The resonant 12dB per octave low-pass filter is modeled after the one found in Korg's classic MiniKorg-700S, giving the Volca Bass a vintage character despite its modern design. At high resonance settings the filter self-oscillates, producing an aggressive, screaming sound. A single LFO with triangle and square waveforms can operate at audio rates for more extreme modulation effects, and the VCA features an ADSD envelope with a sustain on/off toggle.

  The built-in 16-step sequencer supports both real-time and step-by-step entry modes with slide editing capability. Eight pattern memory locations store sequences, and sync in/out jacks allow multiple Volca units to be chained together for synchronized performances. MIDI input via a standard DIN connector enables external control from keyboards or DAWs.

  A 16-key multi-touch ribbon controller handles note input with automatic quantization across a range of over six octaves via transpose. The compact, battery-powered format with a built-in speaker makes the Volca Bass genuinely portable, powered by six AA batteries or an optional 9V DC adaptor.
specs: |-
  - Polyphony: 3-note paraphonic (sequenced)
  - Oscillators: 3 VCOs
  - Waveforms: Sawtooth, square (no pulse-width modulation)
  - Filter: 12dB/octave resonant low-pass (MiniKorg-700S recreation, self-oscillating)
  - LFO: 1 (triangle/square, audio-rate capable)
  - VCA: 1 with ADSD envelope (sustain on/off)
  - Sequencer: 16 steps, real-time and step entry, slide edit
  - Memory: 8 patterns
  - Keyboard: 16-key multi-touch quantized ribbon controller
  - Control: MIDI In (5-pin DIN), sync in/out
  - Audio Output: Mono 3.5mm (headphone compatible)
  - Power: 6 AA batteries or 9V DC adaptor
  - Built-in speaker
