description: The LiveTrak L6max is a compact 12-channel digital mixer with a built-in multi-track recorder, four MIC/LINE combo inputs, eight TS line inputs, 3-band channel EQ and six internal send effects. It records 14 tracks at once as 48 kHz 32-bit float WAV to microSD and doubles as a 14-in/4-out USB-C audio interface and DAW control surface.
details: |-
  The LiveTrak L6max is a compact 12-channel digital mixer with a built-in multi-track recorder. Four of the channels are mono MIC/LINE combo jacks, two of which carry a Hi-Z switch for guitar and bass, and the remaining eight are TS line inputs arranged as four stereo channels for synths and effects.

  Recording is 48 kHz 32-bit float WAV to a microSD card of up to 2 TB, with 14 tracks captured at once: 12 individual tracks plus the stereo mix. Channels 1 to 4 use dual A/D converter circuits, so input gain needs no adjustment and extreme dynamics stay clean. Tracks can be bounced to a dedicated bounce track to free up channels for more layers, the bounce can be undone, and the individual tracks stay on the card for later mixing.

  Each channel has a 3-band EQ with LOW and HIGH shelving bands and a variable MID peaking band, plus sends to two AUX buses and one internal send effect. Six internal effects are available: hall, room and spring reverbs, a digital delay of up to 2000 ms, a tape echo, and AI Noise Reduction that analyses the room and removes hum, hiss and background noise. A TAP key sets delay and echo times by tempo, and a master compressor raises the mix level while preventing clipping.

  Monitoring runs to two headphone-capable outputs, MONITOR and SUB-OUT, with SUB-OUT switchable between the master mix and its own SUB-MIX so a performer can hear a different balance. Balanced TRS MASTER L and R outputs feed a PA or powered monitors, and two impedance-balanced AUX SEND jacks handle external effects or monitor feeds. Four sound pads play audio files assigned from the card or recorded on the unit, and can follow a MIDI clock.

  Over USB-C the L6max works as a 32-bit float 14-in/4-out audio interface for a computer, iOS or Android device while still recording to the card, and it doubles as a DAW control surface. MIDI IN and OUT jacks take 3.5 mm TRS cables, and USB MIDI is supported. Four mixes can be stored as scenes, the free ZOOM L6 Editor for Mac and Windows configures pads, effects and MIDI assignments, and power comes from four AA batteries, USB bus power, a 5 V portable battery or the supplied AD-17 adapter. An optional ERL-6 adapter mounts the unit in a Eurorack case.
specs: |-
  - Input channels: 4 MIC/LINE mono, 4 LINE stereo (12 channels total)
  - Output channels: 2 AUX SEND mono, 1 MASTER stereo, 1 MONITOR stereo, 1 SUB-OUT stereo
  - MIC/LINE connectors: 4 XLR/TRS combo jacks (XLR: 2 HOT, TRS: TIP HOT)
  - MIC/LINE input gain: adjustment unnecessary, dual A/D converter circuits used
  - MIC/LINE input impedance: XLR 3.8 kOhm or more. TRS 18 kOhm or more with Hi-Z off, 1 MOhm or more with Hi-Z on
  - MIC/LINE maximum input level: XLR +4 dBu, TRS +24 dBu
  - Phantom power: +48 V, channel total 20 mA or less
  - LINE connectors: 8 TS phone jacks, input impedance 30 kOhm or more
  - LINE maximum input level: +4 dBu with PAD at 0 dB, +24 dBu with PAD at -20 dB
  - AUX SEND: 2 TRS phone jacks (impedance balanced), maximum output level +9.5 dBu, output impedance 147 Ohm
  - MASTER: 2 TRS phone jacks (balanced), maximum output level +15 dBu, output impedance 147 Ohm
  - MONITOR and SUB-OUT: TRS phone jack each, maximum output level 50 mW + 50 mW into a 63 Ohm load, output impedance 14.7 Ohm
  - Buses: MASTER x 1, SUB-MIX x 1, AUX SEND x 2, SEND EFX x 1
  - Channel strip EQ: HIGH 10 kHz shelving plus or minus 15 dB, MID 100 Hz to 8 kHz peaking plus or minus 15 dB, LOW 100 Hz shelving plus or minus 15 dB
  - Level meters: 6 segments per channel
  - Send effects: 6 types (Hall, Room, Spring, Delay up to 2000 ms, tape Echo, AI Noise Reduction)
  - Maximum simultaneous recording tracks: 14, maximum simultaneous playback tracks: 14
  - Recording format: 48 kHz, 32-bit float, mono or stereo WAV
  - Recording media: microSDHC and microSDXC cards, Class 10 or higher, up to 2 TB
  - Display: 128 x 64 OLED
  - Audio interface: 14 in / 4 out, 48 kHz, 32-bit float or 24-bit, USB 2.0
  - Card reader: mass storage class, USB 2.0 High Speed
  - Frequency response: 20 Hz to 20 kHz, -1.0 dB / +0.5 dB
  - Equivalent input noise: -120 dBu or less (IHF-A) at 150 Ohm input
  - MIDI IN/OUT jacks use 3.5 mm TRS cables. 5-pin DIN devices connect through DIN-TRS MIDI (Type-A) conversion cables
  - Power: 4 AA batteries (alkaline, lithium or rechargeable NiMH), ZOOM AD-17 DC 5V/1A adapter, or USB bus power
  - Estimated continuous recording time: about 1.5 hours alkaline, about 2.5 hours NiMH 1900 mAh, about 5 hours lithium
  - Power consumption: 5 W maximum
  - Dimensions: 284 mm (W) x 114 mm (D) x 46.5 mm (H)
  - Weight: 673 g main unit only, 767 g including batteries
  - Four sound pads with MIDI clock sync, playing files assigned from the card or recorded on the unit
  - Scene memory stores up to four mixes for single-button recall
  - PAD switches on channels 5 to 8 attenuate the input by 0 dB or -20 dB
  - Eurorack installation via the optional ERL-6 adapter through openings on the bottom panel
