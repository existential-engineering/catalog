details: |-
  The TC Electronic Flashback 2 X4 Delay takes the most celebrated delay pedal of a generation and expands it into a four-footswitch flagship engineered for guitarists who demand serious control and unmistakably musical delays. New Crystal, Analog and Tape delay algorithms join the existing TC Electronic family, three MASH pressure-sensitive footswitches open up a new dimension of expression, and six instantly recallable delay presets make even the most demanding set list a pleasure to perform. Delays that breathe Built on the same studio-grade audio path that has earned TC Electronic its reputation in professional production, the Flashback 2 X4 delivers delays with the warmth, depth and movement that define great guitar tone. The new Crystal algorithm shimmers, the Analog algorithm sings with classic bucket-brigade character and the Tape algorithm captures the saturated, slightly wow-and-flutter feel of a beloved studio echo unit. MASH expression, instantly recallable The three MASH footswitches translate the pressure of your foot into real-time parameter control — pitch bends, feedback runaways and dynamic mix swells become part of the performance, not a compromise. Six onboard preset slots store your favourite sounds for instant recall, and TonePrint editor support means every detail of every delay can be shaped to taste and reloaded to the pedal in seconds. Built for the stage and the studio Stereo I/O, true-bypass switching and a heavy-duty enclosure mean the Flashback 2 X4 is ready for the realities of touring, while studio engineers will appreciate the high-headroom analog-dry-through signal path that keeps your core tone intact at every stage of the rig.
