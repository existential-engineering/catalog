description: >-
  The Ensoniq ZR-76 is a 76-key weighted-action workstation offering 64-voice polyphony, over
  1,200 ROM sounds including the acclaimed Perfect Piano, a 16-track sequencer with sketch pad
  recording, and a 24-bit effects processor.
details: |-
  The ZR-76 combined a weighted 76-key keyboard with a substantial 32 MB wave ROM library
  including the Perfect Piano by W. Coakley, making it a strong choice for pianists who also
  needed a broad range of synthesizer and ensemble sounds. Three expansion slots allowed the
  sound set to grow further.

  A notable usability feature was the sound finder, which let performers type the first few
  letters of a desired patch name for instant lookup, or browse sounds by category. This made
  navigating the 778 patches and 751 drum elements far more practical during live performance
  than traditional bank/program scrolling.

  The performance recorder functioned as an idea sketch pad, continuously capturing everything
  played so that performers could instantly play back their last performance or send it to the
  sequencer for editing. The exclusive Delta Quantize feature adjusted recorded performances
  to match sequence tempo without rigid grid snapping.

  The sound engine provided dual 24 dB filters per voice, LFOs with sine, triangle, and square
  waveforms, and six effects units covering 40 different effect types. The 16-track sequencer
  supported 24 songs with full 16-part multitimbral operation via MIDI.
specs: |-
  - Polyphony: 64 voices
  - Oscillators: 16 MB wave ROM + 16 MB ZR/Perfect Piano sound set ROM
  - LFO: Sine, triangle, square waveforms
  - Filter: 2 x 24 dB filters per voice
  - Effects: 6 units, 40 effect types
  - Keyboard: 76 weighted keys with programmable velocity
  - Memory: 778 patches + 751 drum elements
  - Sequencer: 16-track, 24 songs, Delta Quantize
  - Control: MIDI In/Out (16-part multitimbral)
releaseDate: "1998"
