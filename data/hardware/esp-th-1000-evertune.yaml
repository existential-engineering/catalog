description: The LTD Deluxe TH-1000 EverTune FM is designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs.
details: |-
  The LTD Deluxe TH-1000 EverTune FM is designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs. The traditional shape of the guitar belies its phenomenal contemporary appointments, making it ready for any kind of performance-intensive music. It features bolt-on construction at 25.5” scale, pairing its swamp ash body — with figured flamed maple top — to a thin U-shaped three-piece roasted maple neck, with a Macassar ebony fingerboard, offset dot inlays, 24 extra-jumbo stainless steel frets, and a matching headstock. The components on this spectacular guitar include the innovative EverTune constant tension bridge, keeping your guitar in perfect tune and intonation in nearly every possible circumstance. More components of the TH-1000 EverTune FM include black hardware, a black bone nut, LTD locking tuners, a set of Seymour Duncan Mortal Coil 3-Voice Active Humbucker pickups. These outstanding ESP-exclusive pickups have push-pull controls to activate their multiple voices.
specs: |-
  - Construction: Bolt-On
  - Scale: 25.5"
  - Body: Swamp Ash
  - Top: Flamed Maple
  - Neck: 3Pc Roasted Maple
  - Fingerboard: Macassar Ebony
  - Fingerboard Radius: 350mm
  - Finish: See Thru Black Sunburst
  - Nut Width: 42mm
  - Nut Type: Black Bone
  - Neck Contour: Thin U
  - Frets/Type: 24 XJ Stainless Steel
  - Hardware Color: Black
  - Strap Button: Standard
  - Tuners: LTD Locking
  - Bridge: EverTune
  - Bridge PU: Seymour Duncan Mortal Coil 3-Voice Humbucker Direct-Mount *(Pull Volume for Voice 3 / Pull Tone for Voice 2)
  - Neck PU: Seymour Duncan Mortal Coil 3-Voice Humbucker Direct-Mount *(Pull Volume for Voice 3 / Pull Tone for Voice 2)
  - Electronics Layout: Volume(Push/Pull)/Tone(Push/Pull)/3-way Switch
  - Strings: D'Addario XL120 (.009/.011/.016/.024/.032/.042)
  - Case: ST-1 FORM FIT CASE
  - Case Included: N
