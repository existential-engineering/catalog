description: The LTD MH-400 Snow White offers the powerful design features of the MH Series with professional components and build quality at a price that musicians can afford.
details: |-
  The LTD MH-400 Snow White offers the powerful design features of the MH Series with professional components and build quality at a price that musicians can afford. This gleaming Snow White guitar will catch the spotlight like no other. It offers set-thru construction at 25.5” scale for smooth access to the highest frets, with an arch-topped mahogany body, a three-piece extra-thin U-shaped maple neck, rosewood fingerboard, single-ply black binding, and reversed matching-finish headstock. Components on the MH-400 Snow White include black hardware, a Floyd Rose Special double-locking tremolo bridge, Grover tuners, and a set of powerful, aggressive EMG 81 (bridge) and EMG 85 (neck) active pickups.
specs: |-
  - Construction: Set-Thru
  - Scale: 25.5"
  - Body: Mahogany
  - Neck: 3Pc Maple
  - Fingerboard: Rosewood
  - Fingerboard Radius: 350mm
  - Finish: Snow White
  - Nut Width: 42mm
