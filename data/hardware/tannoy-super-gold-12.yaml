details: |-
  The Super Gold 12 (SGM-12) is a 2-way floorstanding loudspeaker featuring a 12" Dual Concentric driver — Tannoy's proprietary co-axial design placing woofer and tweeter on the same acoustic axis for point-source imaging and best-in-class phase coherence. Descended from the Monitor GOLD lineage used in professional studios. Front-accessible two-way energy control system for room acoustic compensation. Front-firing bass ports enable flexible placement. Cabinet finished in American walnut veneer with gold-anodized aluminum adjustment panel.
specs: |-
  - frequencyResponse: 38 Hz - 30 kHz ± 6 dB
