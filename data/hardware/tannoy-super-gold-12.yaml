  - recommendedAmplifierPower: 20-250 W
  - powerHandlingContinuous: 125 W
  - powerHandlingPeak: 500 W
  - crossoverFrequency: 1.2 kHz
  - lowFrequencyDriver: 12" paper pulp cone, 52 mm edge-wound voice coil
  - highFrequencyDriver: 1.3" aluminium/magnesium alloy dome
  - dimensionsHWD: 447 x 308 x 863.3 mm
  - netWeight: 29.4 kg
