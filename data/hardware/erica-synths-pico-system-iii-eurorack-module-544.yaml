description: Erica Synths Pico System III is affordable, compact, yet powerful
  sounding, full analogue modular system. It comes in two formats – eurorack and
  desktop.
details: |-
  Pico System III is an affordable, compact and fully analogue modular system, offered as a desktop unit and as a eurorack module. This is the eurorack module, 42 HP wide, for installation in an existing case.

  It takes modular synthesis back to basics. Where the Pico System II was built from single function modules such as Pico Drums and Pico Trigger, System III uses multifunctional analogue modules, with the aim of encouraging creativity in patching rather than in menu diving.

  The patch surface is 31 inputs and 20 outputs, the master output being duplicated, plus 7 switches. Ignoring the potentiometers entirely, that is in the order of 1.21x10^29 possible patches, which is the maker's way of saying a lifetime of patching will not exhaust it.

  Voice-cards carrying preset patches are what set the system apart from other eurorack systems. They change a patch instantly and radically, which suits experimental live performance. Five factory preset voice-cards and five empty DIY cards are included, so users can develop their own.

  The module complement runs to a 2-3-4 step sequencer, two VCOs, a VCO controller and VCA module, several mixers that handle both CV and audio, a Modulator with syncable LFO and random CV and noise, two voltage controlled ASR envelope generators, two resonant lowpass gates and a BBD delay. The eurorack version ships with one Hosa stackable cable, a ribbon power cable, the ten voice-cards, a user manual and patch note sheets.
specs: |-
  - 2-3-4 step sequencer
  - 2x VCOs
  - VCO controller and VCA module
  - Several mixers that work both with CV and audio signals
  - Modulator (syncable LFO, random CV and noise source)
  - 2x voltage controlled ASR envelope generators
  - 2x resonant lowpass gates
  - BBD delay
  - 31 inputs and 20 outputs (master output is duplicated) plus 7 switches
  - Audio signal levels 10Vptp
  - CV signal levels (full span) -5V to +5V
  - Sequencer CV output range 0V to +5V
  - VCO tune range C0 to E7
  - LFO rate 0.21Hz to 20Hz
  - VC EG attack time 0 to 3 seconds
  - VC EG release time 0 to 4.2 seconds
  - Max BBD delay time 400ms
  - Panel width 42 HP
  - Power consumption 175mA@+12V, 112mA@-12V
