description: Portable Bluetooth conference speakerphone with AI noise reduction,
  beam-forming microphones, and planar magnetic speaker technology.
details: |-
  Audeze FILTER is engineered as a high-performance compact wireless conference speakerphone combining advanced neural network noise-cancellation with proprietary planar magnetic speaker technology. The device incorporates A.I.-based microphone circuitry trained to identify and eliminate over 500,000 noise samples using A.I.-on-the-Edge Technology, with algorithms built directly into hardware requiring no configuration of virtual sound cards or app settings.

  The microphone array features intelligent beam-forming technology designed for both personal and conference calls, allowing users to select pickup patterns ranging from full 360 degree coverage down to 70 degrees. This capability enables precise focus on desired voices while removing unwanted background sounds.

  FILTER uses Audeze's patented Fluxor magnets and Uniforce diaphragm in an ultra-thin planar magnetic transducer optimized for crystal-clear voice-call playback. The driver reaches 85-118 dB output with zero audible distortion, described as the most powerful speaker in any conference speakerphone of comparable size.

  Connects wirelessly via Bluetooth 5.0 (A2DP, AVRCP, HFP, BLE; SBC, AAC, and aptX Classic) or wired via USB-C (with a USB-A adapter included). Runs up to 15 hours on its 1050mAH lithium-polymer battery.
specs: |-
  - Noise reduction: AI Based Intelligent Zero-Noise
  - Microphone: Dual microphone with beam-forming technology
  - Microphone range: 10 feet
  - Transducer type: Ultra-thin planar magnetic with Uniforce voice coil
  - Magnetic structure: Fluxor magnet array
  - Transducer size: 70mm x 105mm
  - Speaker max SPL: Normal - 85dB @ 3ft; Speaker Boost - 118dB @ 2ft, 75dB @ 45ft
  - Speaker frequency response: 300Hz - 20kHz
  - Speaker THD: <0.2% (1 kHz, 70dB, 0.5m)
  - Sensitivity: 90 dB/1mW (at Drum Reference Point)
  - Wireless connection: Bluetooth 5.0 (A2DP, AVRCP, HFP, BLE; SBC, AAC, aptX Classic codecs)
  - Wired connection: USB-C or USB-A (with included adapter)
  - Battery: 1050mAH Lithium-polymer, up to 15 hours @ 80dB (at 50cm)
  - Total unit size: 11mm x 76mm x 152mm
  - Weight: 280g
