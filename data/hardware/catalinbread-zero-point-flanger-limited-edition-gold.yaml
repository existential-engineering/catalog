description: The Zero Point Flanger is a limited-edition (100 units)
  through-zero flanger pedal that replicates authentic studio tape flanging as
  it was originally achieved. Unlike LFO-driven electronic flangers, it uses a
  momentary FLANGE switch to manually control upward and downward sweeps,
  mimicking the feel of a thumb on a tape reel.
details: |-
  Limited edition of 100 units in gold finish. The momentary FLANGE switch simulates applying thumb pressure to a tape reel flange, producing upward and downward sweeps. In subtractive mode, holding the switch causes signal cancellation through phase opposition.

  An internal GAIN trimpot (factory-set for slight volume boost) is accessible from the back of the pedal. Power accepts 9-18V DC center-negative only. Backed by a 3-year warranty.
