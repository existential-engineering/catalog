description: The P10 is a Eurorack controller module with two large and eight
  small potentiometers, each assignable to any function in a DROID patch.
details: |-
  Each P10 controller has 2 large and 8 small potentiometers. You can control any function in your DROID patch with any of these 10 knobs. Each knob simply gives a value between 0 and 1, which you can assign to any function, e.g. the attack, release, sustain and decay values of an envelope or the steps of a sequencer. Shipping includes a short ribbon cable for connecting the controller to the master or to the previous controller. If you want to place the controller further away from the master, you can purchaser longer ribbon cables here in the shop. You can connect up to 16 controllers to each DROID master. The P10 is part of a controller set together with two P2B8s , and also part of the Live Kit . Current Draw: 10 mA +12V | 0 mA -12V | 0 mA 5V

