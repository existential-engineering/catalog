description: A wireless CV interface for Eurorack modular synthesizers that
  connects motion sensors, Ableton Link, OSC applications and Bluetooth MIDI
  controllers to generate control voltages. It features 2 multimode CV outputs,
  built-in LFOs and a web-based configuration app.
details: |-
  Wireless CV interface for Eurorack modular synthesizers. Connect: 2.4SINK motion sensors, Ableton Link, OSC applications and Bluetooth MIDI controllers. About:

  2.4SINK allows wireless connections to our high precision motion sensors with low latency to create highly expressive and unique stage performances. Additionally, 2.4SINK is compatible with Ableton Link, Open Sound Control (OSC) and Bluetooth MIDI to use a wide range of applications (e.g. Max, Pure Data, SuperCollider), sensors and maker technologies (e.g. Arduino). Built-in LFOs and 2 multimode outputs cover all kinds of control signals. Key Features:

  2 (12-bit) multimode CV outputs:

  Motion sensors:

  Built-in LFOs:

  Open Sound Control (OSC):

  Ableton Link :

  Max for Live devices:

  Bluetooth LE MIDI:

  Built-in Web App:

  Power Consumption:

  Width: 10HP

  Walkthrough:

  ( Sensors not included)
specs: |-
  - Unipolar mode (0 to +10V)
  - Bipolar mode (-5V to +5V)
  - Gate/Trigger mode (0 to +10V)
  - Convert your movements into control voltages
  - 3D tilt angles and acceleration axes
  - Theremin comparable precision
  - No perceivable latency
  - Up to seven sensors simultaneously
  - Custom firmware with 9-DOF state-of-the-art sensor fusion
  - Waveforms: Sine, Saw, Ramp, Triangle, Square, Stepped Noise or Clock (0V to +5V)
  - Frequency modulation via sensor data, OSC or MIDI CC
  - Connect OSC applications via Wi-Fi
  - Simple address scheme to easily adapt 2.4SINK to your application
  - Customizable (real) clock divider for each output
  - Synced LFOs to Ableton Link clock
  - Use Ableton Live as a sequencer or to transmit automations
  - CC, Gate, Pitch, Velocity, Pitchbend, Aftertouch signals transmitted to 2.4SINK
  - Up to 16 automations simultaneously
  - Use Bluetooth MIDI devices to control your rack
  - Support for Control Change, Gate, Pitch, Velocity, Pitchbend and Aftertouch
  - Wi-Fi configuration
  - Connect Bluetooth LE devices
  - Map and scale sensor values
  - Output configuration
  - Firmware Upgrades
  - +12V: 250 mA / -12V: 30 mA /
