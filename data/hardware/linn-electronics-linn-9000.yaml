description: >-
  The Linn 9000 is a groundbreaking drum machine and sequencer workstation released in
  1984 by Roger Linn, combining 18 velocity-sensitive pads, 8-bit sampling at 40 kHz, and
  a 32-track MIDI sequencer. Fewer than 1,100 units were produced before Linn Electronics
  closed, making it both historically significant and genuinely rare. Its integrated
  design directly influenced the Akai MPC60 and the broader MPC series.
details: |-
  Debuting in 1984, the Linn 9000 was Roger Linn's most ambitious design and represented the pinnacle of Linn Electronics' product line. It combined a drum machine with a full 32-track MIDI sequencer and optional sampling capability, innovations that were remarkably sophisticated for the mid-1980s and would directly influence the design of the Akai MPC60 that followed.

  The drum section offered 18 velocity-sensitive pads triggering 32 drum sounds, with a mixer section providing programmable hi-hat decay and panning. The 8-bit sampler operated at 40 kHz, delivering 13.1 seconds of sample memory. A large LCD screen made programming more accessible than competing machines of the era. Optional features included SMPTE synchronization and a floppy disk drive for storage.

  The 32-track MIDI sequencer could store 20 songs and 99 sequences with a total capacity of 60,000 notes, making the Linn 9000 a genuine production hub rather than just a beat machine. This integration of sequencing and drum programming in a single unit was genuinely pioneering.

  No more than 1,100 units were produced between 1984 and 1986 before the company closed, making surviving examples both historically significant and genuinely rare. Its design philosophy lived on directly in the MPC series that Roger Linn co-developed with Akai.
specs: |-
  - Polyphony: 18 sounds
  - Sampler: 8-bit, 40 kHz, 13.1 seconds
  - Sounds: 32 drum sounds
  - Patterns: 24,000 notes
  - Sequencer: 32-track MIDI, 20 songs, 99 sequences, 60,000 note capacity
  - Keyboard: 18 velocity-sensitive pads
  - Control: MIDI, SMPTE, trigger inputs
