details: |-
  The Red Nectar is a dual-effect pedal pairing a compressor and an overdrive in one compact enclosure, aimed at players after sustain, touch response, clarity and harmonic character. It is positioned for stacked tones, pushed amps and articulate lead playing, and can run from subtle enhancement to fully saturated drive.

  The Berzerker overdrive side builds on Robert Keeley's early 2000s modified screamer-style work and adds a germanium diode for a sweeter clipping response and more touch-sensitive feel, with more gain, fuller low end and sustaining tone. Its Drive, Tone and Level controls cover focused midrange push through thicker saturated sounds.

  The Constrictor compressor side draws on the design of the original Keeley Compressor and expands the control set with Blend and Tone. Sustain and Level set the amount of compression, from light tone enhancement to blooming compression; Blend mixes dry signal back in for clarity and punch, and the Tone control shapes the top end.

  An FX Order switch on the top panel sets how the two circuits interact. Compressor into overdrive gives a tighter, more controlled gain structure with added sustain, while overdrive into compressor gives a more levelled, polished lead sound.
