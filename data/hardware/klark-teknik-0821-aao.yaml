description: The DN360B adds balanced transformer outputs to the DN360 dual
  30-band, 1/3 octave analogue graphic equaliser platform, configured pin 3 hot.
  The transformer output stage provides the galvanic isolation and common-mode
  rejection that broadcast facilities, fixed installations and long-cable-run
  touring systems demand.
details: |-
  The transformer output stage eliminates ground loops and hum at the source rather than treating symptoms downstream, which suits broadcast facilities, fixed installations and systems running long cables.

  The signal-processing core is unchanged from the DN360: dual 30-band Proportional-Q equalisation. Wide, musical filters at small fader excursions narrow to surgical precision as cuts and boosts increase, supporting feedback control and room correction without audible signature.

  Each channel includes an 18 dB/octave low-cut filter for subsonic rejection.

  The 3U chassis carries 30 mm oil-damped precision faders with centre detents, channel bypass switches, graphic EQ scale selection, power-off bypass relays, and industry-standard XLR connectors wired pin 3 hot with transformer-balanced outputs.

  The DN360B is obsolete but remains a benchmark for analogue equalisation, with legacy support available through Music Tribe Care.
specs: |-
  - Dual channel, 30 band 1/3 octave graphic equalisation per channel
  - Proportional-Q filter response
  - Transformer-balanced outputs
  - Low-cut filter: 18 dB/octave, one per channel
  - 30 mm oil-damped precision faders with centre detents
  - Channel bypass switches and graphic EQ scale selection
  - Power-off bypass relays
  - XLR connectors wired pin 3 hot
  - 3U rackmount chassis
