description: >-
  The EML Poly-Box is a unique pitch-following variable chord generator that creates polyphony from
  monophonic synthesizers, using programmable chord memory presets controlled via CV/Gate.
details: |-
  Produced from 1977 to 1984, the Poly-Box occupies a distinctive niche in synthesizer history as a
  device designed to add polyphonic capability to monophonic analog synthesizers. Rather than being
  a conventional keyboard instrument, it functions as a pitch-following chord generator that tracks
  the pitch of an incoming CV signal and generates harmonically related notes based on user-defined
  chord presets.

  The unit features a compact 13-key keyboard used primarily for programming chord voicings rather
  than traditional playing. Twenty-six programmable patches (13 per bank) store chord configurations
  that can be recalled instantly during performance, allowing a monophonic synth to produce complex
  chordal textures it could never achieve on its own.

  Control is handled entirely through CV/Gate connections, keeping the Poly-Box firmly in the analog
  domain. The device receives pitch information from the connected synthesizer and generates
  additional CV outputs to drive other oscillators or voices, effectively multiplying a single
  monophonic source into a polyphonic ensemble.

  EML described it as "a pitch following variable chord generator controlled by your synthesizer and
  Poly-Box's own keyboard with built-in memory." The device found notable use by the band Devo and
  remains a sought-after curiosity among collectors of unusual vintage analog equipment.
specs: |-
  - Voices: 26 (13 per bank)
  - Keyboard: 13 keys
  - Memory: 26 patches (2 banks of 13)
  - Control: CV/Gate
  - Function: Pitch-following variable chord generator
