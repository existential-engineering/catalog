description: >-
  The Sequential Circuits Six-Trak is a six-voice analog polyphonic synthesizer
  released in 1984, designed as an affordable entry point into the Sequential
  lineup. It features six VCOs with cross-modulation capabilities, a built-in
  arpeggiator, and a two-track sequencer, plus full MIDI control of all
  parameters. In Unison mode all six oscillators combine for rich, fat Moog-like
  tones, though its polyphonic mode can sound relatively thin without external
  chorus processing.
details: |-
  The Six-Trak was Sequential Circuits' answer to the demand for a more affordable polyphonic analog synthesizer. Released in 1984, it packed six analog oscillators into a compact 48-key keyboard format, offering both six-voice polyphonic and six-part multitimbral operation.

  In Polyphonic mode the Six-Trak delivers classic Sequential character, though its sound can be somewhat thin compared to the company's flagship Prophet models. Switching to Unison mode stacks all six oscillators together, producing fat, creamy, and wild tones that make an excellent stand-in for Moog-like lead and bass sounds. Cross-modulation between oscillators opens the door to complex and unusual sound effects.

  Programming the Six-Trak is notoriously tedious, as it relies on a single data knob with parameter selection rather than dedicated knobs for each function. However, all parameters are accessible via MIDI, making it much easier to program with an external MIDI controller or computer-based editor such as Unisyn.

  The synthesizer includes a built-in arpeggiator with up and down modes, as well as a two-track sequencer capable of storing up to 800 notes. Its biggest limitations include an attack time that is too slow for truly percussive sounds, VCO frequency adjustment steps that are too coarse for subtle frequency envelopes, and the lack of a built-in chorus effect.
specs: |-
  - Polyphony: 6 voices, 6-part multitimbral
  - Oscillators: 6 VCOs (sawtooth, triangle, variable pulse width)
  - Filter: 24 dB/oct lowpass with ADSR envelope
  - VCA: Standard ADSR envelope
  - LFO: Yes
  - Memory: 100 patches
  - Keyboard: 48 keys
  - Arpeggiator: Up/Down modes
  - Sequencer: 2-track, up to 800 notes
  - Control: MIDI (all parameters controllable)
  - Year Produced: 1984
releaseDate: "1984"
