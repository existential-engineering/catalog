description: One of the world's best-selling 12-string acoustic-electric
  guitars, the Taylor 150ce delivers a satisfyingly textured 12-string tone —
  clear and balanced with a rich low-end response and octave shimmer on a
  traditional Dreadnought body.
details: |-
  The 150ce is part of Taylor's 100 Series, built on a traditional Dreadnought body with a Venetian cutaway and Expression System 2 electronics. The torrefied spruce top and layered sapele back and sides provide a full, resonant voice, while the 12-string configuration adds rich octave shimmer and textural depth.

  Torrefied spruce replicates the tonal character of aged tonewoods through a specialized roasting process, delivering sweetness and clarity from the first note. The layered sapele back and sides combine attractive aesthetics with durability at an accessible price point.

  Taylor's Expression System 2 features a behind-the-saddle pickup design that captures more of the guitar's dynamic range than traditional transducers. The system allows players to plug into amplifiers or PA systems with natural-sounding acoustic tone reproduction.

  The Venetian cutaway provides access to upper register frets without compromising the Dreadnought's full projection and bass response. The guitar ships with a gig bag.
