description: "- Our Best Sounding Envelope Filter EVER! - Improved Note Tracking
  - Upgraded Components - External Output Vol. Control"
details: |-
  The Neutrino V2 is the second version of Keeley's opto-coupler envelope filter, with improved note tracking, upgraded components and an external output volume control. A power supply voltage doubler is built in to keep headroom high.

  The pedal creates an automatic wah from pick attack. Keeley argues that envelope filters react best when they are opto-coupler based, and the opto-couplers used here are chosen for a smooth, vowel-like tone suited to funk and jam band playing.

  Controls cover three filter types, two sweep directions, two ranges for the frequency centre and a Peak control, in a compact and heavily built enclosure. The circuit is fully analog, true bypass, and made in the USA.
specs: |-
  - Envelope filter and auto wah for guitar, bass and keyboard
  - Peak control: sets how much quack or how smooth the sweep is
  - Filter Selector: three filter types, high-pass, low-pass and band-pass
  - Range switch: high or low frequency centre
  - Direction switch: sweep up or down
  - External output volume control
  - Power supply voltage doubler for extra headroom
  - True bypass, 9 VDC, 25mA, fully analog, made in the USA
