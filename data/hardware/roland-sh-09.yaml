description: >-
  The SH-09 is a very stripped down monosynth from Roland's classic SH-series with a single
  oscillator offering PWM, ramp, square and noise waveforms. It features a VCA switchable between
  gate or envelope, a standard VCF, and sample-hold functionality for voltage-controlled filtering
  with external audio input capability.
details: |-
  The SH-09 shares a similar architecture to the SH-101 and was released in 1980. It is a
  monophonic analog synthesizer with a 32-key keyboard and CV/Gate control. The LFO is switchable
  between sine, square, or random waveforms. External audio can be filtered through the VCF.
  Vintage condition concerns include sticky keys and noisy knobs and signal due to age. Used by
  notable artists including Orbital, Vince Clarke, BT, Conemelt, Josh Wink, Banco De Gaia, Mr.
  Oizo, Ladytron, Jimmy Edgar, Dave Holmes, Freddy Fresh, OMD, and 808 State.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 1 VCO with selectable ramp, PWM, noise, or square waveforms
  - LFO: Switchable sine, square, or random waveforms
  - Filter: VCF with cutoff, resonance, and envelope
  - VCA: ADSR envelope
  - Keyboard: 32 keys
  - Memory: None
  - Control: CV/Gate
releaseDate: "1980"
