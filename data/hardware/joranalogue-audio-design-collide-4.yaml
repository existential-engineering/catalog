details: |-
  QUADRATURE SPECTRAL COMPUTER 20 HP | +12: 200 mA, −12: 200 mA | JORC4 User Manual (PDF) | ModularGrid Available exclusively through our authorised dealer network . “A modern lock-in amplifier that fits in the palm of your hand.” The origins of electronic music are found within the early works of a small group of forward-thinking mid-century composers, harnessing electronic test gear to create strange new sounds. Building upon this heritage, today everything comes full circle again through Collide 4. The first hardware release to be co-developed by acclaimed musician and YouTube sensation Hainbach, Collide 4 builds upon the lock-in amplifier concept, and brings it into the Eurorack world. These atomic age physics research instruments are known for their raw power when used in musical applications. Now, any synthesist can experience this for themselves, at a fraction of the size and weight of a vintage unit, and with full voltage control. The result is a wholly new kind of analogue synth voice and audio processor, with capabilities far beyond what the avant-garde pioneers could have imagined. Collide 4 is an expression of Hainbach's extensive experience in exploring the deepest musical realms contained within vintage test equipment, and the Joranalogue philosophy of electronic instrument design. Honouring its innovative dual-phase architecture, this new kind of musical generator and processor has been christened the ‘quadrature spectral computer’. The sound? Quite simply: it's smashing!
specs: |-
  - Modern, fully analogue Eurorack format re-imagining of the lock-in amplifier concept, expanded to new heights.
  - Pingable variable bandwidth filter with self-oscillation capability.
  - Pre- and post-filter gain stages, for a total of up to 130 dB of amplification!
  - Through-zero sine/cosine quadrature oscillator.
  - Hilbert transform network for frequency shifter use.
  - Dual ring modulators with output lowpass filters.
  - Extensive output section, including magnitude and phase analogue computing outputs.
  - Unique X/Y quadrature topology, ideal for stereo use.
  - Handsome (and useful) signal level/overload LED indicator.
  - CV control over everything, with temperature compensation and excellent volt/octave pitch tracking.
  - 20 HP, 30 mm deep. Over 600 components, yet a fraction of the weight and size of a vintage Model 124A lock-in amplifier unit.
  - Impedance-compensated outputs with dual-colour LEDs.
  - Trim potentiometers accessible from the front panel.
  - Precision-milled 2 mm anodised aluminium front panel with high-resolution, non-erasable graphics.
  - Bullet-proof design: polarised power header and MOSFET protection circuit.
  - Includes 16-to-10-pin Eurorack power ribbon cable.
  - Premium mounting hardware: black screws, black nylon washers and matching hex key.
  - Supplied with fold-out signal flow and front panel diagram.
  - High-quality components and assembly; designed and made in Belgium.
