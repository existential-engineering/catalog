description: >-
  The Roland R-8 is a highly regarded digital drum machine featuring 68 ROM-based samples, 32-voice
  polyphony, and expandable sound cards including dedicated 808 and 909 sets.
details: |-
  Released in 1989, the Roland R-8 quickly earned a reputation as one of the finest drum machines ever produced. Its sound library spans rock, electronic, ethnic, and industrial drumkits, with most sounds offering hands-on editing of tune, decay, attack, nuance, and output parameters.

  One of the R-8's standout features is its Feel Patches system, which applies subtle timing variations to programmed patterns to achieve a more human-like groove. This was a significant innovation at the time, addressing the common criticism that drum machines sounded too mechanical and rigid.

  The sound set could be expanded through additional ROM cards, most notably the 808 and 909 cards that gave users access to those iconic sounds within the R-8's more modern workflow. The sequencer provides 100 patterns and 10 songs, offering plenty of room for complex arrangements.

  The R-8 was later succeeded by the R-8 mkII in 1992, which added more memory and an expanded sound set. Notable users of the R-8 include Orbital, Underworld, Autechre, 808 State, Human League, and The Shamen.
specs: |-
  - Polyphony: 32 voices
  - Sounds: 68 ROM samples (expandable via sound cards)
  - Sound Cards: Optional 808, 909, and other expansion sets
  - Controls: Tune, decay, attack, nuance, output per sound
  - Patterns: 100
  - Songs: 10
  - Feel Patches: Human-like groove templates
  - Sequencer: Real-time and step input
  - Connections: MIDI
