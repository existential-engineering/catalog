description: A two-channel pedal pairing a hand-biased germanium fuzz with a
  modulation channel offering rotary speaker, vibe and harmonic wah sounds,
  octave up or down, and expression pedal control.
details: |-
  The Germanium Monterey Special pairs a germanium fuzz with a modulation channel, and the two can be configured to give five different sounds. Each fuzz output transistor is measured and biased individually for a smooth voicing, using a hand-selected NOS germanium transistor for the output stage and a silicon 2n3565 for current gain. Every unit is hand built, aligned and tested.

  The right stomp switch engages the fuzz channel, a two-transistor classic fuzz voiced to be full and accurate with some added smoothness. Keeley notes that the moderate-gain germanium and Fairchild 2n3565 transistors used avoid the temperature sensitivity germanium devices can show.

  The modulation channel offers three voicings alongside an octave control. The Kool Vibe setting combines phasing and tremolo at selected frequencies and emulates the pulsing of a photocell-based effect. The Les Rotary setting simulates a rotary cabinet, joining the lower drum and upper horn with short reverberated reflections and a Doppler-based chorused effect, where the Octave control sets horn volume instead of adding an octave. The Harmonic Wah section covers a fixed or cocked wah, an auto wah driven by picking strength, a harmonic tremolo wah, and a conventional foot-controlled wah when an expression pedal is connected. The Octave control adds an octave up when turned clockwise from centre, an octave down when turned anticlockwise, and nothing at centre.

  An expression pedal connected to the EXP input on the rear controls the rate of the Les Rotary and Kool Vibe settings, and the frequency in the Harmonic Wah setting. No expression pedal is supplied. A DIP switch under the base plate swaps the order of the fuzz and modulation sections. The pedal is not battery powered and needs a 9V 100 mA supply with a negative tip.
