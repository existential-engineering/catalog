description: >-
  The Yamaha A3000 is a professional 2U rack-mount hardware sampler released in
  1997, featuring 64-note polyphony and 16-part multitimbrality. Designed as a
  break-beat machine and phrase sampler for recording and performance, it
  includes three independent real-time effects blocks and five front-panel
  editing knobs. Though powerful, its small two-line LED display makes sample
  editing a challenge.
details: |-
  Yamaha's entry into the sampling market with the A3000 was unexpected, as the company was not previously known for sampling equipment. The instrument shipped with an almost 400-page manual documenting its comprehensive capabilities, reflecting the complexity users would encounter when mastering its extensive feature set.

  The A3000 shipped with only 2 megabytes of memory, barely enough for ten seconds of stereo sound. Users can expand storage through single in-line memory modules up to 128MB maximum, making the upgrade path essential for practical use. For direct digital I/O, the optional AIEB1 expansion board adds optical and coaxial connectors plus three stereo assignable output pairs.

  The sampler includes three independent effects blocks handling delay, reverb, and chorus effects, plus sample-specific effects. Notably, effects are accessed and applied in real time to any of its audio inputs, allowing the A3000 to double as a standalone effects processor. It also features a 4-band EQ system with parametric EQ and five multifunctional front-panel knobs for fast real-time editing.
specs: |-
  - 64-note polyphony
  - 16-part multitimbral
  - 12dB slope filter with band pass, resonance, high pass, and low pass modes
  - 4 LFOs with sine, square, saw up, sample and hold, delay, and key sync
  - 3 envelope generators
  - Three independent effects blocks (delay, reverb, chorus)
  - 2MB RAM standard, expandable to 128MB via SIMMs
  - MIDI In/Out/Thru
  - Optional AIEB1 digital I/O expansion board
  - Included CD-ROM sample library
