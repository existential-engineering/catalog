details: |-
  A powerful, ethereal, and nuanced delay pedal with otherworldly controls. Push the feedback for vast worlds of colorful sound. Introduce a bit of warble with the modulator for ghastly chorus tones, or a ton of it to absolutely warp the delayed signal. Once your delay is thoroughly contorted, turn up the fuzz and pulverize it into repeating, shattered pieces.

  This is the preferred echo for recording engineers and touring pros around the world because, simply put, it just sounds that good. From delicate, beautiful sounds to yawning voids of fuzz and feedback, the Echo Dream 2 is ready to transform anything you throw at it.

  Master controls the output volume of the effect. Fuzz sets the amount of gain, from clean to fuzzed-out bliss: this gain is after the echo and will distort both the clean and the echoes when cranked up. Delay sets the volume of the delayed signal.

  D Time controls the delay time (in milliseconds) between 20 ms and 1 second, where long delay times can create flutter, noise, and distortion. FBack controls the feedback of the delays, from slapback to wild runaway oscillation. The Dry toggle passes the dry signal through when up, or kills it when down so only the repeats are heard.

  Speed controls how fast the modulating oscillator runs. Depth sets how far the modulator will swing the delay time, shifting the pitch of the repeats very far at high intervals. The Shape toggle selects a smoother, sine-like modulator waveform when up, or a sharp, square-shaped waveform when down.
