details: |-
  The CT8 CC is the centre channel speaker of the CT800 Series, a three-way closed-box design in a Matrix cabinet. It has the identical driver complement to the CT8 LR for precise timbre matching, rearranged into a horizontal cabinet, so the same 1,100mm and 325mm dimensions are swapped between width and height.

  The CT8 CC can be positioned below the screen, and it could equally well be placed above, thanks to the adjustable midrange/tweeter head.

  The driver complement is a 32mm (1.25in) aluminium dome tweeter with Nautilus spiral tube loading, a 150mm (6in) Aramid fibre cone FST midrange and two 250mm (10in) Carbon Aerofoil bass cones, crossing over at 300Hz and 4kHz.

  Custom Theater speakers are specifically designed to be built into the fabric of the listening room or into custom furniture as part of a fully designed theatre concept, and all the models except the CT8 DS surround are supplied without grilles because custom installs normally hide built-in speakers behind acoustically transparent cloth.

  The CT800 manual notes that although the speakers are semi-active and require an active crossover, all power amplification must be separately sourced: each CT8 LR, CT8 CC and CT8 DS requires two channels of power amplification, or three if used with a CT8 SW subwoofer.
specs: |-
  - Technical features: Nautilus spiral tube-loaded tweeter, Aramid fibre FST midrange, Carbon Aerofoil bass cone, Matrix cabinet, active bass crossover
  - Description: 3-way closed-box system
  - Drive units: 1x ø32mm (1.25in) aluminium dome with Nautilus spiral tube-loaded high-frequency
  - Drive units: 1x ø150mm (6in) Aramid fibre cone FST midrange
  - Drive units: 2x ø250mm (10in) Carbon Aerofoil bass cone
  - Frequency range: -6dB at 23Hz to 40kHz
  - Frequency response: 29Hz to 24kHz ±3dB on reference axis
  - Dispersion (within 2dB of reference response): horizontal over 60° arc, vertical over 10° arc
  - Sensitivity (2.83V, 1m): 93dB
  - Harmonic distortion: <1% 45Hz to 20kHz
  - Harmonic distortion (2nd and 3rd harmonics, 90dB, 1m): <0.5% 55Hz to 20kHz
  - Nominal impedance: 8Ω (minimum 4Ω)
  - Crossover frequencies: 300Hz, 4kHz
  - Recommended amplifier power: 500W to 1,000W into 8Ω on unclipped programme
  - Max. recommended cable impedance: 0.1Ω
  - Dimensions: Height 325mm (12.8in), Width 1,100mm (43.3in), Depth 550mm (21.65in)
  - Net weight: 85kg (187lb)
  - Finishes: Cabinet Black painted
  - Semi-active design: requires an external active crossover and two channels of power amplification
