details: |-
  The CT8 CC is the dedicated centre channel speaker of the Bowers & Wilkins CT800 Series, the top of the Custom Theatre range. It is a three-way closed-box design built around a Matrix cabinet, installed inside home theatre cabinetry. It is semi-active: it needs the CT8 XO active crossover and two channels of external power amplification, or three when used with a CT8 SW subwoofer, and carries no amplifier of its own.

  It carries the identical driver complement to the CT8 LR for precise timbre matching, rearranged to suit its horizontal orientation. Bowers & Wilkins notes that although the CT8 CC can be positioned below the screen, it could equally well be placed above, thanks to the adjustable midrange and tweeter head.

  The drive units are a 32mm (1.25in) aluminium dome tweeter with Nautilus spiral tube loading, a 150mm (6in) Aramid Fibre FST midrange cone, and two 250mm (10in) Carbon Aerofoil bass cones. Crossover points are 300Hz and 4kHz, and the Information Sheet lists an active bass crossover among the technical features.

  Sensitivity is 93dB (2.83V, 1m) and nominal impedance is 8 ohms with a 4 ohm minimum. Bowers & Wilkins recommends 500W to 1,000W of amplifier power into 8 ohms on unclipped programme, and frequency response is quoted as 29Hz to 24kHz plus or minus 3dB on the reference axis, reaching -6dB at 23Hz.

  The cabinet measures 1,100mm (43.3in) wide by 325mm (12.8in) high by 550mm (21.65in) deep and weighs 85kg (187 lb). It is finished in black paint, which is the only finish offered.
specs: |-
  - Description: 3-way closed-box system
  - Drive units: 1x 32mm (1.25in) aluminium dome with Nautilus spiral tube-loaded high-frequency; 1x 150mm (6in) Aramid fibre cone FST midrange; 2x 250mm (10in) Carbon Aerofoil bass cones
  - Technical features: Nautilus spiral tube-loaded tweeter, Aramid fibre FST midrange, Carbon Aerofoil bass cone, Matrix cabinet, active bass crossover
  - Frequency range: -6dB at 23Hz to 40kHz
  - Frequency response: 29Hz - 24kHz +/-3dB on reference axis
  - Dispersion (within 2dB of reference response): horizontal over 60 degree arc, vertical over 10 degree arc
  - Sensitivity: 93dB (2.83V, 1m)
  - Harmonic distortion: <1% 45Hz - 20kHz; 2nd and 3rd harmonics (90dB, 1m) <0.5% 55Hz - 20kHz
  - Nominal impedance: 8 ohms (minimum 4 ohms)
  - Crossover frequencies: 300Hz, 4kHz
  - Recommended amplifier power: 500W - 1,000W into 8 ohms on unclipped programme
  - Max. recommended cable impedance: 0.1 ohms
  - Dimensions: height 325mm (12.8in), width 1,100mm (43.3in), depth 550mm (21.65in)
  - Net weight: 85kg (187 lb)
  - Finishes: cabinet black painted
  - Adjustable midrange/tweeter head, so the speaker can be placed below or above the screen
  - Identical driver complement to the CT8 LR, rearranged for horizontal orientation, for precise timbre matching
  - Semi-active: requires the CT8 XO active crossover and two channels of external power amplification (three when used with a CT8 SW). No on-board amplifier and no mains inlet
  - Shares the CT800 Series owner's manual with the other CT800 models
