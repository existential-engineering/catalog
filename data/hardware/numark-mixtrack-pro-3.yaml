description: Mixtrack Pro 3 All-in-one Controller Solution for Serato DJ.
details: |-
  From Numark the world's leading innovator of DJ equipment and technologies, comes the incredible MIXTRACK PRO 3 DJ controller, designed with the skilled, professionally-aspiring DJ in mind. It's the latest addition to the Numark family of industry-leading DJ solutions. This controller offers a whole host of features and performance that sets it way above conventional DJ controllers, yet it offers great bang-for-the-buck and it's a snap to take anywhere.

  Mixtrack Pro 3 gives you 100mm pitch sliders that make it easy to perform even the finest pitch adjustments, so it's easy to keep two cuts in perfect beat sync without any drift. Dive into 16 multi-function backlit performance pads to add loops, launch samples, and control hot cues. Use the multi-function touch strip for dynamic FX control and track search operation. Dedicated filter knobs for each channel give you tonal control for that perfect sound.

  Get precise control over every track and every transition with Mixtrack Pro 3's advanced low-profile rugged metal platters. They are capacitive and dual-zone, giving you the ability to scratch or stop a track simply by touching the top of the platter, while at the same time allowing you to adjust the pitch by manipulating the platter from the side. Heavy-duty metal stands up to the hottest action, night after night.

  Mixtrack Pro 3 gives you comprehensive control over its included Serato Intro software. Plus, it's class-compliant with both Mac and PC, so you'll be able to plug in and start mixing your music right away — no drivers or complicated set up necessary.

  With its built-in audio system, Mixtrack Pro 3 is ready to go right out of the box. Plug in your headphones, microphone, and PA system and start mixing right away with no external audio interface needed. Plus, Mixtrack Pro 3 has two headphone jacks, making it easy to mix with friends and fellow DJs or tradeoff in-between sets.
specs: |-
  - All-new 5-inch high resolution metal jog wheels
  - Dedicated filter knobs for each channel
  - Multi-function Touch Strip for dynamic FX control and Track Search
  - 100mm pitch sliders for fine pitch adjustments
  - Dedicated track browsing controls for your library
  - 16 multi-function performance pads
  - Integrated class compliant audio interface with 1/4-inch and 1/8-inch headphone connections
  - 1/4-inch microphone input
  - Includes Serato DJ Intro upgrade-ready for Serato DJ
  - Includes Prime Loops remix tool kit
  - 24-bit, 44.1kHz audio interface
  - Line Out: Output Level 1.3V±0.2V, SNR >80dB (A-weighted), THD <0.03%, Frequency Response ±3dB (20Hz–20kHz), Channel Separation >80dB
  - Headphone Out (32 Ohm load): Output Level 0.65V±0.1V, SNR >80dB (A-weighted), THD <0.03%
  - Communication Protocol: MIDI
  - Dimensions: 21.6" x 9.1" x 1.1" (550.9mm x 233mm x 30.3mm)
  - Construction: high-impact polymer composite
