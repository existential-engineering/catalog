description: The Zoom Q8n-4K is designed to capture professional-grade audio
  with 4K video in a versatile, all-in-one handy recorder. It is the perfect
  video production and livestreaming solution for today's musicians, filmmakers,
  podcasters and more.
details: |-
  The Q8n-4K captures audio alongside 4K video in an all-in-one handy recorder, aimed at video production and livestreaming for musicians, filmmakers and podcasters. Compared to a mirrorless or DSLR, its size is meant to fit into a production, and it elevates videos with four audio tracks alongside 4K UHD video.

  With the included X/Y mic capsule and two XLR inputs, up to four tracks of simultaneous audio can be captured, and the main outputs of a mixing board can be run straight into the unit to capture a whole band. The mic capsule system is interchangeable, with the XYQ-8n X/Y capsule supplied as standard and the XAH-8, VRH-8, MSH-6, SGH-6, SSH-6 and EXH-6 capsules available as options.

  Video is recorded at 4K resolution up to 30fps. The F2.8/150 degree wide-angle lens, five field of view settings and brightness adjustments cover a range of shoots, and Scene presets for Indoor, Outdoor, Nighttime and Concert Lighting (plus an Auto setting that optimises for the environment) get the right look. A flip-out full-color screen allows self-recording, and the compact body suits run-and-gun shooting handheld or on a gimbal.

  A stereo headphone output jack and on-screen level meters are provided for monitoring, and a USB connection to a computer streams to the usual platforms. The Q8n Control app for iOS and Android remotely monitors levels and starts and stops recording, which requires the optional BTA-1 Bluetooth adapter.

  Power comes from the rechargeable Li-ion battery, from USB, or from an optional AC adapter, while recording to a microSD card of up to 1 TB. In the box are the Q8n-4K, a BT-03 battery, a lens cover, a lens hood, a windscreen, a USB cable and a Quick Guide.
specs: |-
  - Image sensor: 1/2.3 inch 16 M-pixel CMOS sensor
  - Lens: F2.8, 150 degree field of view
  - Video format: MPEG-4 AVC/H.264 (MOV)
  - Video resolutions: 4K at 30, 25 and 24 fps. 1080 at 60, 50, 30, 25 and 24 fps. 720 at 60, 50, 30, 25 and 24 fps
  - Audio formats: WAV at 96 kHz, 48 kHz and 44.1 kHz, 24-bit and 16-bit
  - Audio functions: LoCut off / 80 / 120 / 160 / 200 / 240 Hz, Fx off / Limiter / Compressor / Leveler / DeEsser / NoiseGate, Level -inf dB to +10 dB, Pan L100 to center to R100, Delay 0 ms to 300 ms during web camera use, Direct Monitor on/off during web camera and USB mic use
  - Image functions: FOV in 5 steps, SCENE AUTO / INDOOR / OUTDOOR / NIGHT / CONCERT LIGHT, self timer off / 3 / 5 / 10 sec, brightness LOW / NORMAL / HIGH
  - Mic input: XYQ-8 120 degree XY stereo mic capsule, maximum sound pressure 120 dB SPL, input gain -inf dB to 43 dB
  - Inputs 1/2: XLR connectors, input gain (PAD off) -inf dB to 55 dB, input impedance 1.8 kohm or more, maximum permissible input level +26 dBu (PAD on), phantom power +12 V / +24 V / +48 V, equivalent input noise -120 dBu or less
  - PAD switch attenuates Inputs 1/2 by 20 dB
  - Outputs: combined line/headphone stereo mini jack, and micro HDMI Type D
  - Built-in speaker: 300 mW 8 ohm mono speaker
  - Recording media: microSD, microSDHC and microSDXC cards up to 1 TB
  - USB Type-C: webcam class UVC 1.0 plus UAC 1.0 with 720p and 1080p video and 48 kHz/16-bit audio. Card reader class USB Mass Storage. USB mic class UAC 1.0 at 44.1 kHz/16-bit, 2 channels up and 2 channels down. Card reader and USB mic functions support iOS devices. Supports USB bus power operation
  - REMOTE: ZOOM BTA-1 or other dedicated wireless adapter
  - Power: lithium-ion battery, DC 4.2 V maximum, DC 3.7 V nominal, 1600 mAh. ZOOM AD-17 AC adapter at DC 5 V/1 A
  - Recharging times: about 4 hours 30 minutes from a USB 2.0 port, about 3 hours from a USB 3.0 port or the ZOOM AD-17
  - Battery operation time: 1 hour 20 minutes at 4K/30, 2 hours 30 minutes at 1080/30 (MOV mode, 48 kHz/24-bit, XYQ-8 connected, no XLR input, Power Saving enabled)
  - Optional mic capsules: XAH-8 combination XY/AB, VRH-8 Ambisonics VR, MSH-6 mid-side, SGH-6 shotgun, SSH-6 mid-side stereo shotgun, EXH-6 dual XLR/TRS input
