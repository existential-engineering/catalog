description: A closely matched stereo pair of Delphinas. A pair of warm and
  smooth microphones for medium-to-long distance applications in a compact body.
details: |-
  The Delphina Stereo Pair is a matched set of the Ear Trumpet Labs Delphina microphone, intended for rich, balanced stereo recordings. Suited to capturing acoustic instruments, ensembles or nuanced vocal performances, the pair provides a detailed and natural stereo image, and each microphone is hand-assembled and tuned by the maker for clarity and consistency across both units.

  Delphina takes the warm, detailed sound and feedback rejection of the standard Edwina and adds a low end tuned for accurately capturing acoustic instruments from any distance, in the manner of the Myrtle. The warm, smooth midrange suits medium-to-long distance applications in a compact body.

  A closely matched stereo pair of Delphinas makes a flexible tool for applications in the studio and on the stage. In stereo, the two microphones make drum overheads and room mics, and they can be used in x/y, spaced pair or ORTF to capture stereo images of acoustic instruments or group performances. The pair is packaged in a single blue case with custom-cut foam.

  Each microphone can be side or end addressed using its pivoting brass bracket and uses transformerless FET fully balanced electronics, hand-wired with film caps, precision resistors and hand-tested, matched transistors, with component values tuned for the individual circuit. Internal shock dampers keep handling noise down, and an integral silk and mesh pop filter controls plosives without loss of clarity.
specs: |-
  - Two hand-made microphones with unique appearance
  - Closely matched stereo pair of Delphinas
  - Side or end address, using pivoting brass bracket
  - Internal shock dampers for minimal handling noise
  - Warm and smooth midrange for medium-to-long distance applications in a compact body
  - Integral silk and mesh pop filter, for effective control of plosives without loss of clarity
  - Transformerless FET fully balanced electronics
  - Hand-wired electronic components: film caps, precision resistors, hand tested and matched transistors, with component values tuned for the individual circuit
  - 30-day return policy and lifetime warranty
  - Transducer type: condenser, large (26 mm) diaphragm
  - Polar pattern: cardioid
  - Sensitivity (re 1000Hz, 94 dB): -40.9 dB (9 mV/Pa)
  - Power requirement: +24V to +48V phantom power for each microphone
  - Packaged in a single blue case with custom-cut foam
