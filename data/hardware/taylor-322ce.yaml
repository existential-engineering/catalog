description: The 322ce is a Grand Concert acoustic-electric built entirely from
  Neo-Tropical Mahogany — top, back, sides, and neck — delivering rich midrange
  punch and articulate fingerstyle response with V-Class bracing and ES2
  electronics.
details: |-
  The 322ce is Taylor's all-mahogany entry in the 300 Series Grand Concert lineup, featuring Neo-Tropical Mahogany for the top, back, sides, and neck — a tonal combination that emphasizes warm midrange character and controlled, articulate note separation.

  V-Class bracing enhances sustain and intonation. The Shaded Edgeburst top finish adds visual depth to the satin-finished body. Taylor Satin Black tuners and a Firestripe pickguard complement the understated aesthetic.

  Expression System 2 electronics enable natural amplified performance via a behind-the-saddle pickup. The guitar ships with a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Concert
  - Top: Neo-Tropical Mahogany (solid, satin)
  - Back/sides: Neo-Tropical Mahogany (solid, satin)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Neo-Tropical Mahogany
  - Fretboard: West African Crelicam Ebony
  - Inlays: Gemstone
  - Scale length: 24-7/8"
  - Nut width: 1-3/4"
  - Tuners: Taylor Satin Black
  - Binding: Black
  - Pickguard: Firestripe
  - Electronics: Expression System 2 (ES2)
  - Finish: Shaded Edgeburst (top), satin (back/sides)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
