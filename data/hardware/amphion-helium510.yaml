description: A highly versatile two-way bookshelf loudspeaker featuring
  Amphion's 5th generation waveguide technology for seamless driver integration
  and a room-wide sweet spot.
details: |-
  The Helium510 is Amphion's most popular Helium model, a two-way vented bookshelf loudspeaker handmade in Finland. It features a 1" titanium tweeter and a 5¼" paper woofer with a crossover point at 1600 Hz, delivering a frequency response of 48–25,000 Hz (-6dB) at 8 Ω impedance and 86 dB sensitivity.

  The Helium510 employs Amphion's 5th generation waveguide technology, which enables a low crossover point and seamless driver integration. This design produces unrivalled midrange clarity, particularly in reproducing the naturalness and purity of human voice and acoustic instruments.

  Even dispersion from the waveguide creates a room-wide sweet spot, allowing multiple listeners to enjoy equal sound quality from different positions in the room. The speaker performs clearly even at low listening volumes and in challenging acoustic environments.

  The Helium510 is available in four finishes: Black, Full White, Standard White, and Walnut. Optional color grids allow mix-and-match customization. Wall mounting brackets are also available as accessories.

  Recommended amplifier power is 20–100 W. The cabinet measures 316×160×265 mm and weighs 6 kg.
specs: |-
  - Operating Principle: Two-way, vented
  - Tweeter: 1" titanium
  - Woofer: 5¼" paper
  - Crossover Point: 1600 Hz
  - Impedance: 8 Ω
  - Sensitivity: 86 dB
  - Frequency Response: 48–25,000 Hz (-6dB)
  - Power Recommendation: 20–100 W
  - Dimensions (H×W×D): 316×160×265 mm
  - Grid protrusion: 8 mm
  - Weight: 6 kg (13.2 lbs)
  - Manufacturing: Handmade in Finland
