  - Technology: Solid State
  - Channels: 2 (Clean / Overdrive)
  - Controls: GAIN, VOLUME, CONTOUR, OD (overdrive channel select), POWER
  - Equalisation: Single CONTOUR control (shifts highs/lows relative to mids)
  - Inputs: 1 x 1/4" jack instrument input, 1 x 1/8" MP3/line in
  - Outputs: 1 x 1/8" emulated headphone output
  - Speaker Config: 1 x 6.5"
  - Footswitch: No
