  - Technology: solid state
  - Channels: 2 (split, clean and overdrive)
  - Controls: clean volume, channel select switch, overdrive gain, overdrive volume, contour
  - Speaker configuration: 1 x 6.5"
  - Speaker model: custom speaker (8 ohm, 10W)
  - Unit impedance: 8 ohm
  - Inputs: 1 x 1/4" jack instrument input, 1 x 3.5 mm aux in
  - Outputs: 1 x 3.5 mm jack headphone output
  - Emulated speaker output on the headphone jack for direct recording and silent practice
  - Weight: 4.8 kg / 11 lb
  - Width: 290 mm / 11.4"
  - Height: 310 mm / 12.2"
