description: A simple 10W solid-state practice combo designed for home use,
  portable playing and quiet practice. The MG10 packs two channels (clean and
  overdrive), a contour control for shifting tonal emphasis between mids and the
  highs/lows, an emulated-speaker headphone output for silent practice and
  direct recording, and an MP3/line-in input for jamming along with backing
  tracks. Compact, lightweight and finished in classic Marshall black-and-gold
  styling.
details: |-
  Rehearse day and night with the MG10 Combo. Simple yet mighty, this 10W amp is perfect for band practice or home use. The two channels, clean and overdrive, and the contour control function provide a great way to experiment with your sound.

  Recording directly and practising silently is more convenient than ever thanks to the emulated speaker output on the headphone jack. The MP3 / line-in feature also lets you jam along with your favourite songs.

  The contour control provides a platform for fine-tuning your sound, adjusting the highs and lows in relation to the mids. Whether you are aiming for a crisp, cutting-edge tone or a warmer, more rounded one, it allows nuanced adjustments to suit your preferences.

  A 6.5-inch custom speaker sits in a compact cabinet that is versatile enough for both home settings and on-the-go scenarios, light enough to carry to a rehearsal and back.

  Designed and engineered in UK. Made in Vietnam.
specs: |-
