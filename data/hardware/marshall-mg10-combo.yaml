description: A simple 10W solid-state practice combo designed for home use,
  portable playing and quiet practice. The MG10 packs two channels (clean and
  overdrive), a contour control for shifting tonal emphasis between mids and the
  highs/lows, an emulated-speaker headphone output for silent practice and
  direct recording, and an MP3/line-in input for jamming along with backing
  tracks. Compact, lightweight and finished in classic Marshall black-and-gold
  styling.
