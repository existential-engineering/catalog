description: Bluetooth speaker delivering home-filling Marshall sound.
details: |-
  Stanmore III has an even wider soundstage than its predecessor, delivering home-filling Marshall signature sound, re-engineered for a more immersive experience. The two-way driver system delivers a heavy but balanced sound, with crisp, soaring treble and controlled bass that really roars. Easily connect to this speaker from your device using Bluetooth, RCA or 3.5 mm and get listening.

  Re-engineered wider stereo soundstage: this generation of the home line-up has an even wider soundstage than before, delivering heavy Marshall signature sound re-engineered for a more immersive experience. Generation III has tweeters angled outwards and updated waveguides to deliver a consistently solid sound that is so wide it chases you around the room.

  Pair, play and turn it up: these speakers are straight to business, so you can just pair and play without the hassle of a complex set-up. You'll find everything you need right there on the unit, including the Bluetooth pairing button, power switch, bass and treble controls and the control knob so you can easily control your music without ever picking up your device.

  Wired connectivity: with next-generation Bluetooth 5.2, the RCA input and the 3.5 mm input, connecting to Stanmore III and getting the right sound has never been so effortless. Download and connect to the Marshall Bluetooth app to access advanced settings and Over-the-Air (OTA) updates. While you can control the bass and treble on top of the speaker, you'll also find additional controls in the app.

  A more sustainable approach: this generation takes a PVC-free build made from 70 percent recycled plastic and only vegan materials, while staying true to the iconic design that speaks to the brand's heritage. Designed and engineered in Sweden. Made in Thailand.
specs: |-
  - Frequency range: 45 to 20,000 Hz
  - Stereo/mono: Stereo
  - Maximum sound pressure level: 97 dB at 1 m
  - Cabinet principle: Bass-reflex
  - One 50 Watt Class D amplifier for the woofer
  - Two 15 Watt Class D amplifiers for the tweeters
  - Adjustable bass and treble controls via analogue controls on the speaker
  - Wireless connectivity: Bluetooth 5.2, ready for Bluetooth LE Audio
  - Bluetooth range: 10 m / 30 ft
  - Wired connectivity: 3.5 mm input and RCA input
  - Top panel controls: source button, volume control knob, bass control knob, treble control knob, play/pause button, skip backward/forward control knob, power switch
  - Wi-Fi: No
  - Microphone system: No
  - Voice command: No
  - Mains input voltage: 100 to 240 V
  - Mains frequency: 50 to 60 Hz
  - Weight: 4.25 kg / 9.37 lb
  - Width: 350 mm / 13.78"
  - Height: 203 mm / 8.00"
  - Depth: 188 mm / 7.40"
  - Water resistance: No
  - Box contents: Stanmore III speaker, user manual and legal and safety information, mains lead
  - Compatible app: Marshall Bluetooth app (iOS and Android), with over-the-air software updates
