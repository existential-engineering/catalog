details: |-
  Building directly off of the specialized engineering of our Baggs Violin Pickup design, molding our miniature vibration sensor directly into the bridge, we adapted this same concept for the banjo. We use a 5/8” Grover bridge and cast a pickup sensor directly into the center of it to capture the vibrating head and the string energy, producing a full and rich amplified banjo sound. Our fully custom jack seamlessly integrates into the design. Easy to install and non-invasive, it matches the aesthetics of the world’s finest banjos. Banjo by Bill Lester, Chestnut Grove Banjos
specs: |-
  - 5/8" Grover maple bridge with pickup sensor cast into the center
  - Miniature vibration sensor derived from the Baggs Violin Pickup design
  - Unitary design for maximum sensitivity and signal transfer
  - Custom integrated jack and mounting system
  - Passive piezo type; external preamp required
  - Easy, non-invasive installation
