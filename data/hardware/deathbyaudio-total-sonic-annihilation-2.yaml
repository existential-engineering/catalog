description: The Death By Audio Total Sonic Annihilation 2 is a controllable
  feedback loop that runs your pedals back through themselves so you can
  experience true sonic exploration. Turn your whole pedal board into one giant
  Death By Audio fuzz box.
details: |-
  The TSA2 works on a simple premise: what if effect pedals were patched back into themselves? What does it sound like for a filter to be multiplied by infinity, or for your modulator to modulate its own modulations? The TSA2 creates a controllable feedback loop, causing your pedals to cycle back on themselves and feeding the output back into the input as much or as little as you want. Every unique pedal array will produce a vast world of textures and possibilities.

  With this updated version of the original Total Sonic Annihilation, the Active Boost maximizes usability for many applications where the original fell short. For example, if the effect in the feedback loop is out of phase with itself, the original loop would turn the pedal into a volume or blend pedal; with the TSA2, just flip the Phase switch and those dormant possibilities are awakened. The Boost also has a boatload of gain to awaken even the faintest effect, and a Limiter to tame the most unruly beast.

  Feedback, the big knob, controls the amount the Send is forced back into the Receive, creating feedback within the circuit for new experimental effects; the Active Boost is also in this loop and, if engaged, will be forced back into itself. The On toggle activates the Active Boost circuit. Phase flips the phase of the effects loop, only when the Active Boost is on. Gain controls the amount of gain of the Active Boost, and Limit limits the output volume of the entire pedal only when the Active Boost is engaged. The stomp switch bypasses the effect, though every pedal in the loop remains part of your signal chain.

  Plug an instrument into the Input, and the Output connects to your amplifier. Connect the Send to the input of the effect or chain you would like to control (if left unconnected it is connected internally to the Receive jack), and the Receive connects to the output of the effects in the feedback loop. When the Active Boost is not engaged, the pedal is completely passive and can work without power.
