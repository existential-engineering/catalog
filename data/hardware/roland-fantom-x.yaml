description: >-
  The Roland Fantom-X is a professional synthesizer workstation released in 2004,
  combining sampling, synthesis, and sequencing in 61-, 76-, and 88-key configurations. It
  features 128 voices of polyphony, 128 MB of waveform memory, 1,480 waveforms, and a 32
  MB sampler expandable to 544 MB via DIMM slots. The Fantom-X represented a major upgrade
  over the Fantom-S series with doubled polyphony, a color LCD display, and enhanced user
  sampling capabilities.
details: |-
  The Roland Fantom series initially faced an uphill battle at launch due to missing features like user sampling compared to competitors from Korg and Yamaha. Roland addressed these shortcomings with the Fantom-S in 2003 and then the significantly improved Fantom-X in 2004.

  The Fantom-X comes in three keyboard configurations: the X6 (61 keys), X7 (76 keys), and X8 (88 keys). The 61- and 76-key models include velocity and aftertouch sensitivity, while the 88-key version features a fully weighted piano keyboard. A rack version, the Fantom-XR, was also produced with minor hardware differences. In 2005, Roland released the Fantom-Xa, a budget-friendly 61-key variant without aftertouch and with a smaller screen.

  The sound engine provides 128 MB of internal waveform memory, double what the Fantom-S series offered, with 1,480 different waveforms available. As a full-featured sampler, it ships with 32 MB of sampling memory as standard, expandable through DIMM modules up to 544 MB total. The 16-part multitimbral architecture and 128-voice polyphony enable complex, layered arrangements.

  The built-in high-resolution 16-track MRC-Pro sequencer offers graphical editing via the large color LCD. Sound design is supported by 78 different multi-effects along with dedicated chorus and reverb processors. The front panel features Roland's D Beam controller, which allows users to apply effects and trigger sounds by moving their hand over an infrared sensor, alongside real-time control knobs and comprehensive MIDI and USB connectivity.
specs: |-
  - 128-voice polyphony
  - 16-part multitimbral
  - 1,480 waveforms with 128 MB waveform memory
  - 2 LFOs
  - 32 MB sampling memory, expandable to 544 MB via DIMM
  - 16-track MRC-Pro sequencer
  - Arpeggiator with chord memory
  - 256 preset patterns
  - Up to 256 songs
  - 78 multi-effects, 3 choruses, 5 reverbs, 6 input effects
  - D Beam infrared controller
  - Color LCD display
  - MIDI In/Out/Thru
  - USB connectivity
  - Available in 61-key, 76-key, and 88-key configurations
  - 88-key model with fully weighted piano keyboard
