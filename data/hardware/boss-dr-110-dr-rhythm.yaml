description: >-
  The Boss DR-110 Dr. Rhythm is a compact analog drum machine from 1983 that expanded on
  the original Dr. Rhythm with a wider selection of sounds, programmable patterns, and
  song chaining.
details: |-
  In 1980, Roland introduced the DR-55, the first affordable Boss Dr. Rhythm drum machine with basic sounds and limited patterns. The DR-110 followed in 1983 as a significant upgrade, offering a wider selection of sounds, preset patterns, an increased number of programmable patterns, and the ability to chain patterns together to form songs.

  The step programming interface was enhanced with an LCD grid displaying individual notes in patterns, though a tap write mode was also included for real-time input. Pattern organization spans four banks with 32 total patterns, while two songs can store up to 128 bars each.

  The analog sound generation circuitry proved more sophisticated than the TR-606, delivering crisp and punchy drum tones across six voices. A balance knob adjusts kick, snare, and clap levels relative to other sounds, while an accent knob controls emphasis on accented steps.

  Compared to similar machines like the TR-606, the DR-110 remains relatively affordable on the used market and is often found in good condition thanks to protective carry cases that were commonly bundled with the unit.
specs: |-
  - Polyphony: 6 voices
  - Sounds: 6 (Bass drum, Snare drum, Open HiHat, Closed HiHat, Cymbal, Clap)
  - Effects: Accent
  - Patterns: 32 (4 banks of 8 patterns each)
  - Memory: 16 preset patterns, 16 user patterns
  - Songs: 2 songs (up to 128 bars each)
  - Pattern steps: Switchable between 12 or 16 steps
  - Keyboard: 7 Drum Pads
  - Control: Trigger out
  - Date Produced: 1983
releaseDate: "1983"
