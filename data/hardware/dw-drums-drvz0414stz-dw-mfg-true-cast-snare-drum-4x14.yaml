description: This limited 4x14″ piccolo snare features a sand-cast, machined bell bronze shell.
details: |-
  Designed in collaboration with DW Artist Dave Elitch, this first-ever True-Cast piccolo snare drum is precision-engineered and ready for stage or studio.

  The 4x14″ fully machined snare features a sandcast Bell Bronze shell that offers a contoured interior shape varying from 5mm to the top and bottom edges to 3mm at the center. Features include a patented 2-piece machined mini lug with dual lug receivers and True-Cast counter hoops, delivering ample volume, attack, and an incredibly wide tuning range.

  The limited-edition snare is also fitted with a machined Mini MAG™ throw-off with matching butt plate, True-Pitch™ tension rods, 20-strand True-Tone™ snare wires, and DW MFG heads by Remo USA.

  A stealthy, custom-made flight case and signed certificate of authenticity are included. Only 100 True-Cast 4x14″ snare drums will ever be produced.
specs: |-
  - Sand-Cast Bell Bronze shell, 5mm at the bearing edges tapering to 3mm at the center
  - True-Cast counter hoops
  - Brass Mini Turret lugs
  - Brass Mini MAG throw-off
  - True-Pitch tension rods
  - 20-strand True-Tone snare wires
  - DW MFG heads by Remo USA
  - DW MFG flight case by Calzone included
  - Size: 4x14
  - Limited to 100 units worldwide, each with a numbered badge and certificate of authenticity
