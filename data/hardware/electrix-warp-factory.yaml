description: >-
  The Electrix Warp Factory is a dedicated standalone vocoder designed for both DJs and musicians,
  featuring large hands-on controls, multiple input options, and a built-in oscillator for classic
  robot voice effects.
details: |-
  The Warp Factory stands out as one of the most accessible standalone vocoders ever produced,
  designed with large knobs and straightforward controls for real-time hands-on manipulation.
  It accepts a formant signal via front-panel XLR mic input or quarter-inch line input, while
  the source signal comes through two quarter-inch and two RCA phono inputs for stereo sources
  like drum loops, mixes, or synth pads.

  The vocoding engine warps the formant signal to take on the tonal characteristics of the
  source signal, producing the classic robot voice effect and many other timbral transformations.
  A Gender knob adjusts the pitch of the formant, while the Q control sets filter bandwidth and
  the Order knob adjusts filter resolution from clear to abstract vocoding effects.

  Built-in sound sources include a noise generator and an oscillator whose pitch is controlled
  by the Robot Pitch knob, allowing vocoding effects without an external source signal. Low-pass
  and high-pass filtering switches provide additional tonal shaping. All settings can be saved
  and recalled via MIDI.

  The Warp Factory has been used by U2, John Digweed, United State of Electronica, and the
  Chemical Brothers.
specs: |-
  - Formant Inputs: XLR mic, 1/4-inch line
  - Source Inputs: 2x 1/4-inch line, 2x RCA phono
  - Outputs: 1/4-inch line
  - Filter: High-pass and low-pass switching
  - Built-in Sources: Oscillator with Robot Pitch, noise generator
  - Controls: Gender, Q, Order, Robot Pitch, Noise Mix
  - Memory: Settings saveable via MIDI
  - Control: MIDI
releaseDate: "1999"
releaseDateYearOnly: true
