details: |-
  The Sonzera 20 Combo also features global spring reverb control that is designed to enhance notes without clouding them. The reverb can be turned on and off via the footswitch. The addition of a built-in effects loop allows players to use all their time-based effects with ease without negatively impacting the overall tone of the amp. With robust construction, a wide range of tones, and steadfast controllability, the Sonzera 20 Combo is a solid gig- and studio- worthy amplifier.
specs: |-
  - Available Configurations: Combo
  - Channels: Gain & Clean
  - Wattage: 20
  - Tubes: Power Tubes
  - (2) 5881 or 6L6WGC-STR Short Bottle: Preamp Tubes
  - (4) 12AX7 / ECC83: Front Panel Controls
  - Clean Channel: Bass,																					Treble,																					Volume
  - Global Controls: Channel Select Switch, Reverb, Presence
  - Back Panel Features: Inlet
  - Fused Power Inlet (IEC): Effects Loop
  - Loop Return, Loop Send: Extension Speaker Jacks
  - 5: Ohm Switching
  - (2) 4 ohm & (2) 8 ohm parallel, (1) 16 ohm: Bias
  - Cabinet Material / Construction: Plywood
  - Covering: Textured Black Vinyl
  - Grill Cloth: Salt and Pepper
  - Piping: Silver
  - Speakers: Celestion V-Type
  - Measurements: Amp Width
  - Amp Weight: 42 lbs. (19.05 kg)
  - 2-Button Footswitch (Channel Gain/Clean, Reverb On/Off): Preamp Tube Positions & Functions
  - V1: Common Input Gain Stage
  - V2: Gain Channel
  - V3: Reverb
  - V4: Phase Inverter
