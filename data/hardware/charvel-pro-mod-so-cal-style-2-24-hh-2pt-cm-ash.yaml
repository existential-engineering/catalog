details: |-
  The Pro-Mod So-Cal Style 2 24 HH 2PT CM Ash is a So-Cal Style 2-shaped electric guitar built around a resonant ash body finished in satin Black Ash with a matching 1-ply black pickguard and black hardware. Dramatically curved body contours, a scalloped lower back bout and a shredder's cut heel work together to deliver ergonomic comfort and unencumbered upper fret access.

  The bolt-on caramelized maple neck is graphite-reinforced and shaped to a Speed Neck profile with rolled fingerboard edges and a hand-rubbed satin urethane finish for fast, friction-free play. A heel-mount truss rod adjustment wheel allows neck-relief tweaks without removing the neck, and the reverse licensed Fender Telecaster headstock is fitted with Charvel-branded die-cast locking tuners.

  The caramelized maple fingerboard carries a 12"-16" compound radius, 24 jumbo frets, 4mm pearloid dot inlays and Luminlay side dots for low-light visibility. A Graph Tech TUSQ XL nut sits 1.6875" wide at the headstock end of the 25.5" scale.

  Electronics are a versatile HH layout: dual Fishman Fluence Open Core PRF-COC humbuckers in black, controlled by a 3-position blade pickup switch and a 2-way mini toggle for voice selection. The push/pull tone control activates secondary voicings, giving access to vintage PAF tones, modern hot-rodded humbucking and single-coil emulations.

  Hardware includes a Gotoh Custom 510 tremolo bridge with Gotoh tremolo arm, Charvel-branded die-cast locking tuners and a black hardware finish throughout. The guitar ships strung with .009-.042 nickel-plated steel strings.
