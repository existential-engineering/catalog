name: T50RPmk4g
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/t50rpmk4g/
description: Gaming-oriented semi-open RP stereo headphones built on Fostex's
  4th-generation planar magnetic driver. Optimized for competitive gaming with
  strong sound localization and clear separation, while retaining the
  studio-grade pedigree of the RP series. Bilateral detachable 3.5 mm cable
  connectors on both housings allow left- or right-side cable routing.
details: |-
  4th generation RP planar magnetic driver with increased magnet count and optimized coil pattern

  Semi-open dynamic design tuned for gaming localization and separation

  Bilateral cable connectors on both housings for ergonomic left/right routing

  OFC conductor cable for low-loss signal transmission

  Thicker, low-resilience around-ear earpads for extended sessions

  Includes 3.5 mm (4-pole) to 3.5 mm (3-pole) stereo cable (2 m)

  Includes 3.5 mm to 6.3 mm conversion connector

  Optional EX-EP-RP60 replacement earpads

  Optional ET-RP4.4BL2.0 4.4 mm balanced cable
