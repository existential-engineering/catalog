name: T50RPmk4g
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/t50rpmk4g/
description: Semi-open gaming headphones in the RP technology series, built on Fostex's proprietary planar magnetic driver. The driver delivers a fast response for sound localization and separation during play, with a wired connection using high-quality OFC conductor cables.
details: |-
  The T50RPmk4g is the latest model in the RP technology headphone series, which has been continuously refined for 50 years and is used in professional music studios worldwide. Featuring Fostex's RP technology proprietary planar magnetic driver, it delivers an unparalleled response, resulting in exceptional sound localization and clear separation for gaming.

  The RP technology planar diaphragm driver has evolved into its fourth generation with an increase in the number of magnets that sandwich the diaphragm and a new design for the pattern shape of the printed coil. This enables accurate and high-definition reproduction from the low to high frequency range and delivers an outstanding sense of localization and separation. It is an advantage in hearing minute sounds like footsteps, quickly and accurately locating them, and pinpointing and clearly distinguishing targets against environmental sounds and background music.

  The wired connection uses high quality OFC conductor cables that reproduce the sound of games in high resolution without degradation.

  Both the left and right housings are equipped with connectors so the cable can be connected to either side depending on which is more ergonomic. The symmetrical design of the left and right housings reduces the auditory difference normally caused by the presence or absence of connectors and other internal parts, and allows each side to be even more closely matched.

  The new, thicker ear pads feature a low-resilience, around-ear type that provides a comfortable fit which does not compromise the immersive experience even when gaming for long periods of time.
specs: |-
  - Type: Semi-open dynamic
  - Driver: RP planar magnetic
  - Impedance: 28 ohm
  - Sensitivity: 97 dB/mW
  - Maximum input: 3,000 mW
  - Frequency response: 10 to 40,000 Hz
  - Weight: Approx. 330 g (excluding cable)
  - Cable connectors on both left and right housings
  - Accessories: 3.5 mm (4-pole) to 3.5 mm (3-pole) stereophone cable (2 m) x 1, 3.5 mm to 6.3 mm stereophone conversion connector x 1
  - Passive wired headphones, no power supply required
  - Series: RP Series
