details: |-
  Not just the ultimate gig saver: The Ultimate Tone Saver! Hey there, gigging guitarist! Ever arrived at a session only to find your amp is dead, or maybe it's a "silent stage" with no amps allowed? Say hello to the Quilter Phantom Block, the ultimate direct interface for your electric guitar that ensures you never miss a beat! The Quilter Phantom Block

  The Quilter Phantom Block is your sonic knight in shining armor, providing the correct input impedance, gain, tone, and overdrive that your electric guitar needs to sound its best. This simple, low-cost device gives you the key creative controls you need at your fingertips and should be in every gig bag as a backup solution. Power Options

  The Phantom Block runs on 48V phantom power via the XLR output, external 9V pedal power, or you can install a 9V battery that will run for about 100 hours. No matter the situation, the Phantom Block has you covered. Tone and Versatility

  The high impedance input gets optimum tone from standard passive pickups, while the Gain control ranges from clean to overdrive. A wide-range Tone control covers the most popular sounds, and the Master adjusts the overall output level. Switchable Cab Sim warms up the sound of the electric guitar, while FRFR mode suits other devices such as acoustic guitars and keyboards. Compact and Reliable

  Gigging musicians know that sometimes it's the most inconspicuous piece of gear that can make or break a performance. The compact size of the Phantom Block, as well as its ability to use phantom power, makes it the ideal problem solver to keep in your gig bag. -
