description: Amphion Two15 studio monitor truthfully reproduces sound with all
  engineering nuances, while retaining the musical emotions present and vivid.
  Ideal for short listening distances, they offer fast transients with added
  bass extension.
details: |-
  The Two15 is a two-way passive radiator studio monitor designed for nearfield listening. Rather than standard reflex ports, it employs a tuned passive radiator for improved bass performance and more even room loading, delivering a frequency response of 44–20,000 Hz ±3dB.

  Lowering the crossover point to 1600 Hz allows both drivers to operate in a point-source manner, resulting in industry-leading phase coherence and pinpoint imaging across width, height, and depth.

  A waveguide time-aligns the 1" titanium tweeter and dual 5¼" aluminum woofer voice coils so sound from both drivers arrives at the listener simultaneously, contributing to the monitor's depth and spatial accuracy.

  The DSP-free acoustic design minimises electrical interference, keeping the signal path pure and allowing downstream processing to work with a clean audio foundation.

  The Two15 operates clearly at low listening volumes with even dispersion. Recommended amplifier power is 100–350 W into a 4 Ω load.
specs: |-
  - Operating Principle: Two-way, passive radiators
  - Tweeter: 1" titanium
  - Woofers: 2×5¼" aluminum
  - Crossover Point: 1600 Hz
  - Impedance: 4 Ω
  - Sensitivity: 86 dB @ 2.83V/1m
  - Frequency Response: 44–20,000 Hz ±3dB
  - Power Recommendation: 100–350 W
  - Dimensions (H×W×D): 452×160×265 mm
  - Weight: 10 kg (22 lbs)
  - Manufacturing: Handmade in Finland
