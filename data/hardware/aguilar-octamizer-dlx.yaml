description: Aguilar's most powerful bass octave pedal, combining the musical
  feel of the original Octamizer with expanded octave voices, advanced tracking,
  and flexible footswitch control. Features octave-down (Mode A and Mode B) plus
  a dedicated octave-up voice designed specifically for bass guitar, all
  accessible via three independent footswitches.
details: |-
  Advanced DSP platform with in-house algorithms for superior bass tracking.

  Octave Down Mode A: original Octamizer filter sweep — smooth round lows to
  synth-forward textures. Mode B: inspired by classic octave divider circuits,
  grittier character-rich tones. Both modes have independent Volume and Filter
  controls.

  Octave Up: dedicated bass-specific harmonic engine with its own Volume and
  Filter controls. Clean mute function for isolated sub sounds.

  Three independent footswitches allow engaging clean signal, octave down, and
  octave up independently or simultaneously stacked. Requires 9V 500mA supply.

  Backed by Aguilar's three-year limited warranty to the original owner.
specs: |-
  - Power: 9V DC, 500mA (not included)
  - Footswitches: 3 (clean, octave down, octave up)
  - IO: 1/4-inch mono in/out
