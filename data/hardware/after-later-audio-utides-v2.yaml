details: |-
  uTides is a micro version (8HP) of the Mutable Instruments Tides v2/2018. It retains all of the original functionality of the full size version, both software and hardware. Its core is a triangle function generator and waveshaper that can be used as an LFO, oscillator, AD-style envelope generator (EG), and AR-style EG. Tons of utility nicely packed into 8HP. Based on open source designs by émilie gillet under Creative Commons ( CC-BY-SA ) license. Open source designs by Jakplugg under Creative Commons ( CC-BY-SA ) license.
