description: >
  BeatStep Pro is unique: a world-class controller, performance sequencer and composing tool all in one very connectible package.
details: |-
  Beatstep pro is a world-class controller, performance sequencer, and composing tool combining two independent melodic sequencers with a 16-track drum sequencer. It provides thousands of on-the-spot creative possibilities, allowing complete control over virtual devices, analog and digital instruments, drum machines, and ipad apps simultaneously. With 16 projects instantly accessible, each containing 16 sequences per melodic sequencer and 16 drum patterns, the device offers over 4000 possible combinations per project.

  Each melodic sequence supports up to 64 steps with individual articulation of pitch, velocity, and gate time per note, representing the most powerful step sequencers available. The drum sequencer features 16 separate tracks per sequence with one track per pad, enabling real-time recording from pads or classic drum machine workflow using step buttons. Beatstep pro integrates unique performance effects including a looper with touch strip, randomizer, swing settings, and hands-on controls for legendary performances.

  The device features comprehensive connectivity supporting virtually any musical device: computers, virtual instruments, modular synths, drum machines, and any equipment with USB, MIDI in/out, CV/gate outputs, clock in/out, or din sync. Control mode enables triggering clips in daws, playing sounds from external devices, or controlling plug-ins, while MIDI machine control messages start and stop favorite daws. The front panel includes 16 highly responsive pads for playing sounds in control or drum mode, 16 step buttons for enabling/disabling steps and selecting presets, and touch-sensitive encoder knobs for editing pitch, gate, velocity values, and timing shifts per step.

  Advanced features include independent sequence selection with customizable knobs mode per sequencer, mute/unmute capabilities, and linked preset or transposition changes across all sequencers simultaneously. Swing amount can be set per sequencer or globally, while randomness and probability controls add subtle or wild pattern unpredictability. The device supports internal clock operation or slaving to daws, external MIDI clocks, or analog/din sync, with tap tempo and metronome functions accessible via dedicated controls.

  Beatstep pro includes 1 volt/octave CV/gate outputs and velo output for controlling modular synths or arturia minibrute/microbrute synthesizers, with external devices triggerable via pads 1-8 and drum sequencer gate outputs. The device operates via USB class-compliant bus-powered operation or standalone with a USB power adaptor. Included accessories comprise the beatstep pro unit, quick start guide, registration card, 2 MIDI adaptors, clock adaptor, and anti ground-loop adaptor, with dimensions of 16.3 x 6.4 x 1.4 inches and weight of 3.20 lbs.
specs: |-
  - 2 monophonic step sequencers
  - 16-track drum sequencer
  - Up to 64 steps per sequence
  - Note, velocity and gate time settings per step
  - Note tie
  - 16 projects with 16 sequences per melodic sequencer and 16 drum patterns
  - MIDI controller mode
  - Fully customizable knobs, step buttons, velocity and pressure sensitive pads
  - CV/gate outputs (1 volt per octave CV, 10 volt gates)
  - 8 drum gate outputs
  - Clock sync with multiple standards
  - MIDI in/out with supplied MIDI adaptors
  - USB class compliant
  - Looper with touch strip
  - Randomizer
  - Swing settings
  - Randomness and probability controls
  - Tap tempo
  - Metronome
  - Internal clock or slave to DAW/external MIDI clock/analog din sync
  - MIDI machine control messages
  - Record mode for real-time sequencing
  - Preset linking and transposition
  - Knobs mode selection per sequencer
  - Mute/unmute sequences
  - 16 step buttons
  - 16 highly responsive pads
  - Touch-sensitive encoder knobs
  - Display for tempo and parameter values
  - Din sync support with included adaptors
  - Bus-powered USB operation
  - Standalone operation with USB power adaptor
