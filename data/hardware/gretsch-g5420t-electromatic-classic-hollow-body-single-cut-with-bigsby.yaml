details: |-
  Get classic '50s and '60s-inspired Gretsch sound and style with the all-new Electromatic Classic Hollow Body guitars. The G5420T features a laminated maple body with vintage-inspired perimeters and refined arches, as well as all-new trestle block bracing to help reduce unwanted feedback.

