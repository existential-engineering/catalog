description: >-
  The Roland CR-78 CompuRhythm is a classic analog rhythm machine released in
  1978, notable as the first programmable rhythm unit to incorporate a
  microprocessor. It features 34 preset rhythm patterns and 14 electronic analog
  drum tones covering kicks, snares, hi-hats, cymbals, congas, bongos, and more.
  Used by artists ranging from Phil Collins and Blondie to Fatboy Slim and
  Underworld, it remains a sought-after vintage instrument for electronic,
  ambient, and dub production.
details: |-
  The Roland CR-78 CompuRhythm, introduced in 1978, was a groundbreaking instrument as the first rhythm machine to use microprocessor technology. It bridged the gap between simple preset rhythm boxes and the fully programmable drum machines that would follow, such as the TR-808. Production continued until 1981.

  The CR-78 offers 34 built-in preset rhythm patterns spanning a wide range of styles including Rock, Disco, Waltz, Shuffle, Slow Rock, Swing, Fox Trot, and Tango. These patterns can be varied at the push of a button using 11 variation effects, and the unit provides adjustable tempo, accents, and fade in/out controls for expressive performance.

  Its 14 analog drum tones are distinctly electronic in character, covering Kick, Snare, Rim Shot, Cow Bell, Hi-Hats, Cymbals, Congas, Bongos, Tambourine, and Guiros. User patterns can be programmed via a step-programming method using the optional TS-1 Memory Write Switch or the rare WS-1 programming switch, with up to 30 user presets stored in battery-backed memory. Each 2-bar pattern supports up to 4 simultaneously playing voices, each independently mutable.

  The CR-78 has been embraced across genres, appearing on records by Phil Collins, Peter Gabriel, Genesis, Blondie, Hall & Oates, Gary Numan, Ultravox, Men Without Hats, John Foxx, OMD, Brian Ferry, Underworld, Fatboy Slim, BT, 808 State, and Jimmy Edgar.
specs: |-
  - Polyphony: 4 voices
  - Drum Sounds: 14 analog tones (Kick, Snare, Rim Shot, Cow Bell, Hi-Hats, Cymbals, Congas, Bongos, Tambourine, Guiros)
  - Preset Patterns: 34 rhythm styles
  - User Presets: 30 programmable patterns (battery-backed memory)
  - Pattern Length: 2 bars
  - Programming: Step-programming via optional TS-1 or WS-1 switch
  - Variation Effects: 11
  - Controls: Tempo, accent, fade in/out
  - Output: Trigger out, 24ppq clock pulse (0-5V V-Trig)
  - Production Period: 1978-1981
