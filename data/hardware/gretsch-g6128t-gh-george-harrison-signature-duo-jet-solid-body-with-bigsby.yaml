details: |-
  The G6128T-GH George Harrison Signature Duo Jet guitar celebrates the legacy of George Harrison — modeled on the instrument that the legendary guitarist often referred to as his 'first real decent guitar.' Built in the Professional Collection, this Jet pairs a chambered mahogany body with an arched laminated maple top in classic all-black livery.

  A 1-piece mahogany neck with a U-shape profile carries a 12"-radius rosewood fingerboard with 22 vintage small frets and pearloid hump block inlays at a 24.6" scale. DynaSonic bridge and neck pickups feed individual neck and bridge volumes plus master tone through a 3-position toggle, while a Rocking Bar bridge, Bigsby B3C vibrato, and Grover Sta-Tite die-cast tuners complete the package. Ships in a G6276 hardshell case.
