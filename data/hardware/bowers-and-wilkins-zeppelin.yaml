description: Zeppelin is a wireless smart speaker reimagined for the streaming
  age. Its elegant form combines high-resolution stereo sound with a
  comprehensive range of smart, connected features and services.
details: |-
  Zeppelin is a network connected, wireless active speaker that provides extremely high performance. It is primarily intended to be configured and controlled using the Bowers & Wilkins Music App, available for both iOS and Android devices, and it is only possible to install and configure a Zeppelin using that app. Some commonly used control functions are also available via touch buttons on the Zeppelin rear panel.

  Zeppelin will enable you to listen to audio from streaming services like Tidal, Qobuz, Deezer, Spotify and Apple Music, to audio over Bluetooth from appropriately enabled Bluetooth source devices, and to audio playing anywhere in your home on any compatible Bowers & Wilkins wireless speaker connected to your home network.

  In addition to a mains power socket, the Zeppelin speaker has a USB-C connection for service. It is possible to connect the Zeppelin to a wired (Ethernet) network with the use of an Ethernet-to-USB-C adaptor, which is not supplied.

  Zeppelin requires a mains power supply to operate, so it must be located within reach of a mains socket. It can be placed on a shelf, table or furniture unit, or wall-mounted on a dedicated wall bracket available as an accessory. The speaker has no mains power switch and, once connected to mains, runs a short start-up routine before being ready to use. It manages its operational state and power consumption entirely automatically and will switch to a power saving mode after twenty minutes of inactivity, retaining its settings without mains power.

  Like the vast majority of speakers, Zeppelin radiates sound energy not only forward but also to the side and rear, so bass may become overemphasised if it is positioned close to room boundaries or in a corner. Moving it to an alternative position may be beneficial, or the bass level can be lowered from the Bowers & Wilkins Music App settings menu.
specs: |-
  - Description: Wireless smart speaker
  - Drive units: HF 2x 25mm (1in) double dome tweeters, MF 2x 90mm (3.5in) FST midrange, LF 1x 150mm (6in) subwoofer
  - Amplifier power output: 240W
  - Frequency response: 35Hz to 24kHz
  - Technical features: Bowers & Wilkins Music App (with Deezer, Qobuz and TIDAL support), Apple AirPlay 2, Spotify Connect, Bluetooth In, Digital Signal Processing, Dynamic EQ
  - Bluetooth: 5.0
  - Bluetooth codecs: aptX Adaptive, AAC, SBC
  - AirPlay 2 compatibility: iPhone, iPad and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Connections: USB-C (service only)
  - Input voltage: 100V to 240V, 50/60Hz
  - Power consumption: Below 2 Watts (sleep)
  - Dimensions: Height 210mm (8.3in), Width 650mm (25.6in), Depth 194mm (7.6in)
  - Net weight: 6.5kg
  - Finishes: Midnight Grey, Pearl Grey
  - No mains power switch, automatic power saving mode after twenty minutes of inactivity
  - Wired Ethernet is possible only via an Ethernet-to-USB-C adaptor, not supplied
