  comprehensive range of smart, connected features and services.
details: |-
  Zeppelin is Bowers & Wilkins' wireless smart speaker, described as reimagined for the streaming age, combining an elegant single-cabinet form with high-resolution stereo sound and a range of smart, connected features and services.

  The driver complement is a true stereo three-way arrangement rather than a mono array: two 25mm double dome tweeters and two 90mm FST midrange units give left and right channels, and a single 150mm subwoofer driver handles the low end. Total amplifier power output is 240W and the quoted frequency response is 35Hz to 24kHz.

  Streaming is handled on-board. It supports the Bowers & Wilkins Music App with Deezer, Qobuz and TIDAL, Apple AirPlay 2 and Spotify Connect, alongside Bluetooth 5.0 input carrying aptX Adaptive, AAC and SBC codecs. AirPlay 2 compatibility is stated for iPhone, iPad and iPod touch on iOS 11.4 or later, Apple TV 4K or Apple TV 4th generation on tvOS 11.4 or later, and Mac or PC with iTunes 12.8 or later.

  Signal processing is on-board too: the technical features list names Digital Signal Processing and Dynamic EQ, the latter being the speaker's own equalisation stage rather than a source-side setting.

  The cabinet measures 210mm high, 650mm wide and 194mm deep and weighs 6.5kg. Mains input is 100V to 240V at 50/60Hz, with sleep-mode power consumption below 2 Watts. The only signal connector is a USB-C socket marked service only. Two finishes were offered, Pearl Grey and Midnight Grey.
specs: |-
  - Drive units: HF 2x 25mm (1in) Double dome tweeters, MF 2x 90mm (3 1/2in) FST midrange, LF 1x 150mm (6in) Subwoofer
  - Amplifier power output: 240W
  - Frequency response: 35Hz to 24kHz
  - Technical features: Bowers & Wilkins Music App (with Deezer, Qobuz and TIDAL support), Apple AirPlay 2, Spotify Connect, Bluetooth In, Digital Signal Processing, Dynamic EQ
  - Bluetooth: 5.0
  - Bluetooth codecs: aptX Adaptive, AAC, SBC
  - AirPlay 2 compatibility: iPhone, iPad, and iPod touch with iOS 11.4 or later, Apple TV 4K or Apple TV (4th Generation) with tvOS 11.4 or later, Mac or PC with iTunes 12.8 or later
  - Connections: USB-C, service only
  - Input voltage: 100V to 240V, 50/60Hz
  - Power consumption: below 2 Watts (Sleep)
  - Dimensions: Height 210mm (8.3in), Width 650mm (25.6in), Depth 194mm (7.6in)
  - Net weight: 6.5kg
  - Finishes: Midnight Grey, Pearl Grey
