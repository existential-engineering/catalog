description: 8 Additional CV outputs for your MIDI 1U module. Fully configurable
  with the Intellijel Config app. In addition to clock and transport outputs,
  this expander also adds poly and drum synth enhancements to the MIDI 1U.
details: |-
  The CVx 1U expander module has eight user-configurable outputs and connects to the MIDI 1U module. Using the Intellijel Config app, you can assign each of the eight jacks to generate just about any type of voltage that can be derived from a MIDI signal: pitch, gates, triggers, clocks, velocity, and more. You can chain up to four CVx modules to a single MIDI 1U to add up to 32 additional channels of MIDI control to your modular.

  Each CVx module can also allow you to generate 2, 3 or 4 voice polyphonic controls with selectable voice allocation modes. The connectivity, feature set, expandability, and compact size make the MIDI 1U + CVx system ideal for integrating your modular gear with the rest of your rig.

  CVx 1U module: this optional 14HP 1U module connects to the MIDI 1U module and adds an additional eight 3.5mm CV outputs. These outputs are fully programmable using the Intellijel Config app, and greatly expand MIDI 1U's ability to control your entire Eurorack system.
specs: |-
  - Width: 14HP
  - Depth: 32mm
  - Power: 55mA @ +12V, 6mA @ -12V
  - Eight user-configurable 3.5mm CV outputs
  - Chainable up to four CVx modules per MIDI 1U (32 additional channels)
  - Requires an Intellijel MIDI 1U module to function
