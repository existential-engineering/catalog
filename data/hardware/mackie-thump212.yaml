description: The lightweight Thump212 12" 1400W loudspeaker features proven
  sound quality in an all-new design with a built-in Feedback Eliminator and
  Music Ducking mode.
details: |-
  Completely redesigned from the ground up, Thump212 has beefier drivers, a 1400W amplifier, and powerful tools to make your next gig easier than ever. Packed with incredibly useful features, Thump212 makes gigs run smoother with feedback elimination and music ducking built right in. And with dual TRS / XLR inputs plus a stereo 1/8" aux input, you can plug in all of your gear without odd cables and adapters.

  Connect any combination of audio sources, including guitar, microphone, keyboard, or DJ mixer. The built-in 2-channel mixer on the rear panel has two combo input jacks for easy plug-and-play plus an 1/8" stereo line in.
specs: |-
  - 1400W ultra-efficient Class-D amplifier
  - Frequency response: 47 Hz – 23kHz
  - Max SPL: 128 dB
  - 12" high-performance woofer
  - 1" compression driver
  - Weight: 27.6 lb / 12.5 kg
  - Dimensions: 24.2 x 14.1 x 14 in / 615 x 358 x 356 mm (HxWxD)
  - Built-Like-A-Tank™ lightweight design
  - Universal Power Supply (100-240VAC)
