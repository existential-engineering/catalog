description: The Mackie Thump212 12" 1400W loudspeaker is great for DJs, clubs,
  bands and more and features a built-in Feedback Eliminator and Music Ducking
  mode.
details: |-
  Thump212 pairs a 1400W ultra-efficient Class-D amplifier with a 12 inch high-performance woofer and a 1 inch compression driver. Frequency response is 47 Hz to 23 kHz with a maximum SPL of 128 dB.

  The rear panel carries a built-in 2-channel mixer. Channel 1 takes an XLR/TRS combo input that accepts mic or line signals, channel 2 takes an XLR/TRS line input plus a stereo 1/8 inch input for a phone or media player, and a Thru output passes audio from both channels on to the next box.

  A built-in Feedback Eliminator suppresses squeals and runaway rumble, and Music Ducking automatically reduces the level of channel 2 whenever channel 1 receives signal, so announcements cut through without manual level changes.

  The cabinet is Built-Like-A-Tank while staying light to load, with a standard pole mount and a monitor wedge angle for floor-monitor use. It runs from a universal power supply (100-240VAC) and weighs 27.6 lb / 12.5 kg.
specs: |-
  - 1400W ultra-efficient Class-D amplifier
  - 12 inch high-performance woofer
  - 1 inch compression driver
  - Frequency response: 47 Hz - 23 kHz
  - Max SPL: 128 dB
  - Horizontal coverage 90 degrees, vertical coverage 60 degrees
  - Electronic crossover frequency: 2.1 kHz
  - Channel 1 XLR/TRS input accepts mic or line signals
  - Channel 2 XLR/TRS line input plus stereo 1/8 inch input
  - Thru output contains audio from both input channels
  - Built-in Feedback Eliminator
  - Music Ducking reduces the level of Ch.2 when Ch.1 receives signal
  - Standard pole mount
  - Monitor wedge angle for floor monitor use
  - Universal power supply (100-240VAC), 3-pin IEC inlet
  - Weight: 27.6 lb / 12.5 kg
  - Dimensions (HxWxD): 24.2 x 14.1 x 14 in / 615 x 358 x 356 mm
