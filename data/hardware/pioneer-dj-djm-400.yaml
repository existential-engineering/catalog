details: |-
  2-channel effects mixer.

  Although the DJM-400 is the smallest mixer in our Pioneer range, it is perfectly portable and huge in performance, boasting outstanding audio quality . The mixer’s intelligent 96 kHz/24-bit sampler automatically detects the tempo of a track during playback, sampling it for four beats, then loops the sample. As the sampled audio is in sync with the beat of the track being played (no matter the tempo) you are given more time to be creative. Samples are automatically beat matched and up to five samples can be stored in memory. This compact 2-channel mixer moreover features an in-loop sampler and digital beat effects . Drawing on our digital heritage of larger mixers, the DJM-400 is designed as an ideal partner for the CDJ-200 in terms of style and function. When combined, these units create a portable yet powerful and robust DJ setup. The DJM-400 is tailored to the demands of DJs mixing in bars and smaller clubs and those mobile artists who demand a reliable, robust and high-quality mixer.
