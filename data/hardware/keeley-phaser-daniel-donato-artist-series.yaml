details: |-
  The Artist Series is a Custom Shop line of established Keeley pedals, each carrying artwork from the associated artist and an Artist Series bottom print, with a portion of sales going to that artist. This edition of the Keeley Phaser is Daniel Donato's, with Cosmic Country artwork by Isabelle Hall.

  The pedal offers two, four or six stages of phasing across three modes. Phasing creates moving peaks and valleys in the output spectrum, and the number of stages sets how pronounced those filter sweeps are around the tonal centre.

  Three controls shape the effect. Depth sets how deep the moving EQ notches go, Rate sets the speed of the low frequency oscillator driving them, and Feedback returns some of the output to an earlier stage near the input for a thicker, more resonant sweep.

  Daniel Donato is a Telecaster player whose Cosmic Country style joins country picking with Grateful Dead influences; his debut album A Young Man's Country was produced by Robben Ford.
specs: |-
  - - Two, four or six stage phasing, selectable across three modes
  - - Controls: Rate, Depth, Feedback
  - - Artist Series bottom print
  - - Cosmic Country artwork by Isabelle Hall
