description: A 500-watt lightweight bass amp head, the same compact size as the
  best-selling OriginAL 300 with power increased for players who need headroom
  on larger stages. At under 2.5kg (7lbs) it is highly portable, with a 5-band
  EQ (bass, middle, treble plus hi- and lo-mid), a front-facing effects loop,
  and an XLR DI output. Delivers Ashdown tone in a gig-ready, versatile and
  affordable package.
details: |-
  Lightweight bass amp head, same footprint as the OriginAL 300 with output raised to 500W. 5-band EQ (bass, hi-mid, middle, lo-mid, treble). Front-facing effects loop and XLR DI output. Weight under 2.5kg / 7lbs.
specs: |-
  - Power output: 500 watts
  - EQ: 5-band (bass, lo-mid, middle, hi-mid, treble)
  - Front-facing effects loop
  - XLR DI output
  - Weight: under 2.5 kg / 7 lbs
