description: A Pro-Mod Plus Series Dinky with a basswood body in Raven Black,
  graphite-reinforced caramelized maple bolt-on Speed Neck, 12"-16" compound
  radius ebony fingerboard with 24 stainless steel jumbo frets and Luminlay side
  dots, Seymour Duncan HH pickup configuration with series/parallel mini toggle,
  and a Wilkinson WVS130-2P two-point tremolo with locking saddles.
details: |-
  Loaded with premium features, this Pro-Mod Plus Dinky DK24 2PT model features a sleek Dinky body constructed from basswood, sculpted shredder's cut heel and scalloped lower back bout for seamless access to the upper registers.

  The graphite-reinforced bolt-on caramelized maple Speed Neck features a natural satin finish, rolled fingerboard edges and a heel-mounted truss rod adjustment wheel for quick neck relief adjustments.

  Designed for high-speed playing, its 12"-16" compound radius ebony fingerboard features 24 stainless steel jumbo frets, 4mm pearloid dot inlays, Luminlay side dots and a Graph Tech TUSQ XL nut.

  An HH pickup configuration consisting of a Seymour Duncan Full Shred TB-10 humbucking bridge pickup and Seymour Duncan Alnico II Pro APH-1N humbucking neck pickup is paired with a 500K EVH Bourns low friction volume pot, no-load tone control, 5-position blade switch and 2-position mini toggle for series/parallel switching.

  Other premium features include a Wilkinson WVS130-2P two-point tremolo with locking saddles, Charvel-branded die-cast locking tuners, chrome hardware and a Charvel Deluxe Gig Bag.
