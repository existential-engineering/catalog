url: https://www.engl-amps.com/shop/heads/powerball-ii-e645ii/
description: The Powerball II E645II is a 100-watt, four-channel, all-valve
  high-gain guitar amplifier head with a valve-buffered FX loop with balance
  control, a noise gate, Master A/B, S.A.C. serial amp control and a 6L6GC power
  section.
details: |-
  The Powerball II is a pure, uncompromising metal amp. Its low end reaches territory no earlier ENGL amp had, which is the point of modern metal, but the amp also produces crystal clear clean tones, crisp crunch and dense solo sounds with ease.

  Its four channels are matched to each other so that the degrees of distortion fit together seamlessly. The output transformers are generously dimensioned for uninterrupted low end, and every gain setting is differentiated and delivered with razor-sharp attack, which suits guitars in drop tunings.

  Channels cover Clean, Crunch, Lead 1 and Lead 2, each with its own gain and volume control. Clean and Crunch share a 3-band EQ with separate treble controls, Lead 1 and Lead 2 share a 3-band EQ with a middle voiced control, and Presence and Depth Punch sit over the top. Bright, Bottom and Middle Boosted switches handle further voicing.

  The preamp runs four ENGL ECC83 / 12AX7 valves into four ENGL 6L6GC output valves for 100 watts, with a valve-buffered FX loop with adjustable balance, a noise gate with threshold control, Master A/B and a power tube monitor. Speaker outputs cover 4, 8 and 16 Ohm loads, singly or in parallel pairs, and the S.A.C. port and dual footswitch jack take the ENGL Z9 and Z4.
specs: |-
  - 4 channels: Clean, Crunch, Lead 1, Lead 2
  - All-valve head
  - Valve-buffered FX loop with adjustable balance control
  - Noise gate
  - Master A/B
  - Power tube monitor
  - S.A.C. serial amp control
  - Sound options: Middle Boosted, Bright (Clean, Crunch), Bottom (Clean, Crunch), Bottom (Lead 1), Bottom (Lead 2)
  - Controls: Gain (for each channel), 3-band EQ for Clean and Crunch (shared) with separate treble controls, 3-band EQ (shared Lead 1 / Lead 2), Middle Voiced control (Lead 1 / Lead 2), Volume (for each channel), Presence, Depth Punch, Master A, Master B, noise gate threshold level, FX Loop Balance
  - Power amp output: 1 x 4 Ohm, 1 x 8 Ohm, 1 x 16 Ohm, 2 x 8 Ohm parallel, 2 x 16 Ohm parallel
  - Footswitch support: Z4 and Z9 (channels, Master A/B, Middle Boosted, FX loop, noise gate)
  - Preamp valves: 4 x ENGL ECC83 / 12AX7
  - Output valves: 4 x ENGL 6L6GC
  - Output power: 100 W
  - Dimensions: 71 x 27 x 27 cm
  - Weight: 21 kg
