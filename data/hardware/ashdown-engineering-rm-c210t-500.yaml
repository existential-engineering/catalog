url: https://ashdownmusic.com/products/rm-c210t-500
description: Rootmaster EVO combos are made from light-weight ply to cut down on
  weight without risk to the signature Ashdown sound.
details: |-
  Ashdown Rootmaster EVO combos employ the Ashdown White Line speakers for a refined tone and can be extended with an 8 ohm extension cabinet output to produce full power. They feature bar handles for ease of transport, a Buffalo Tolex finish with a black cloth grill, and an adjustable tweeter that can be set to hi, low or off. The preamp includes passive and active input jacks for high- and low-output instruments, feeding the trademark Ashdown VU meter, a shape button, 5-band EQ and an onboard compressor. The drive control delivers valve-emulated overdrive and the sub-harmonic controls add fatness, both foot-switchable via an FS-2 footswitch (sold separately). An upgraded power section and a mute button round out the feature set, with the VU meter turning from orange to blue when muted.
specs: |-
  - Speakers: 2 x 10" Ashdown White Line + tweeter
  - 8 ohm extension cabinet output
  - 5-band EQ
  - Onboard compressor
  - Valve-emulated drive
  - Sub-harmonic controls
  - Shape button
  - FS-2 footswitch compatible (sold separately)
