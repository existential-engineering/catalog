description: The Empress Buffer++ is the ultimate utility pedal, combining
  pristine buffering, plentiful I/O, and advanced signal control. It offers
  stereo loop switching, instrument switching, tuner mute, and an onboard boost
  with 12 internal routing modes so you can route almost anything and adapt on
  the fly.
details: |-
  The Empress Buffer++ is the ultimate utility pedal, built for musicians who want total control over their signal path and the freedom to experiment. Whether you're toggling between inputs, switching amps, summing loops, or doing something no pedalboard was ever meant to do, the Buffer++ has your back.

  It protects your tone against signal loss over long cable runs while consolidating a huge amount of connectivity: two inputs, two outputs, a stereo effects loop (loop in/out 1 and 2), and a tuner output. Twelve internal routing modes let you sum stereo effects to dual mono, run mono effects in parallel, switch instruments, or fold your amp's FX loop into the same interface.

  Additional tools include input pads for level matching, a footswitchable clean boost of up to 30dB, tuner mute (hold to mute for tuning), variable input loading, noise filtering, an isolation transformer on Output 2 to avoid ground loops, and AB/AY switching.
specs: |-
  - All-analog signal path with pristine buffering
  - 12 internal routing modes
  - Two inputs, two outputs, stereo effects loop, tuner output
  - Input pads for level balancing
  - Footswitchable clean boost up to 30dB
  - Tuner output with hold-for-mute
  - Variable input loading and noise filtering
  - Isolation transformer on Output 2 to avoid ground loops
  - AB/AY switching
  - Input 1 impedance 10k - 1M Ohm, Input 2 impedance 1M Ohm
  - Frequency response 20Hz - 20kHz
  - THD+N Out 1 <0.1% (200Hz-20kHz); Out 2 (isolation transformer) <0.1% (200Hz-20kHz)
  - Noise < -110dBu
  - Power 9V DC center-negative, 2.1mm barrel connector, 100mA draw
  - Dimensions 4.5" (L) x 3.5" (W) x 2" (H), weight 1 lb
