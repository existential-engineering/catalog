details: |-
  The BAE Audio Bi Polar PSU (11 Space / 2.1A) is a hand-wired power supply designed to power API-format 500-series and lunchbox-style rack modules. It delivers a true bi-polar ±16V rail at 2.1 amps along with 48V phantom power at 0.1A.

  This model is designed for 11-space racks. A smaller 6-space model rated at 1.6A is also available.

  The unit is convertible to international mains voltages (100V, 220V, 230V, and 240VAC) and ships with an AC cable included. Construction follows BAE Audio's traditional hand-wired approach.
specs: |-
