url: https://www.tchelicon.com/en/products/0726-aan
description: Single-footswitch vocal stompbox that adds two doubled voices to a
  lead vocal, plus an optional octave-down or octave-up voice, with reverb and
  pitch correction. An Adaptive Tone engine applies EQ, compression, gating and
  de-essing in parallel to keep the lead clear.
details: |-
  Duplicator is a single-footswitch doubling pedal for lead vocals. Pressing the switch brings in two voiced double-tracks, and an optional octave-down or octave-up voice can be added for a heavier low part or a higher top line.

  An Adaptive Tone engine runs in parallel with the doubling, applying real-time EQ, compression, gating and de-essing so the lead voice stays clear while the doubled voices are present. There is no menu system, no key to set and no MIDI control.

  The pedal carries an XLR input with 48V phantom power for condenser microphones, an XLR output, and true bypass when the effect is off. It runs from a standard 9V supply, so it shares a power brick with the rest of a pedalboard.
specs: |-
  - Two doubled voices from a single lead vocal
  - Optional octave-down or octave-up voice
  - Reverb and pitch correction
  - Adaptive Tone engine with EQ, compression, gating and de-essing
  - 48V phantom power on the XLR microphone input
  - True bypass
  - 9V DC power input
