description: "Compact and stylish, the G Two offers the perfect blend of size
  and performance. All the detail and precision you'd expect, but in a form
  factor that'll fit into the smallest of spaces."
details: |-
  The G Two is a compact active two-way home audio speaker from Genelec's G Series, designed to deliver the company's signature uncoloured, reference-grade sound in a form factor suited to living rooms, desks, and small spaces. Built around a 105 mm bass driver and a 19 mm metal-dome tweeter, each powered by its own 50 W Class D amplifier and crossed over at 3 kHz, the G Two extends Genelec's professional monitoring heritage into domestic high-fidelity listening.

  The G Two reproduces a frequency response of 62 Hz - 20 kHz (±2.5 dB) with a peak SPL of at least 100 dB at one metre. Its die-cast aluminium Minimum Diffraction Enclosure (MDE) and Directivity Control Waveguide (DCW) provide controlled dispersion and low cabinet colouration, while the rear-firing reflex port supports extended low-frequency response from the small cabinet. Paired with a Genelec F Series subwoofer, the system scales to fuller-range home theatre and music playback.

  Because the amplifiers are integrated, no external power amp is required - source components such as TVs, computers, streamers, and turntables (with phono stage) can be connected directly via a single RCA female input per speaker. Rear-panel room compensation switches let listeners tailor the speaker's bass response to wall- or corner-loaded placements without external processing, and the supplied Iso-Pod stand decouples the cabinet from its surface while providing tilt for the listening position.

  The G Two incorporates Genelec's Intelligent Signal Sensing (ISS) circuitry, which drops idle power consumption to ≤0.5 W when no signal is detected. Combined with the recycled-aluminium enclosure and Genelec's long-lifetime design ethos, the G Two is positioned as both a high-quality compact speaker and a low-impact product consistent with the company's sustainability practices.

  Available in White (G2BWM), Black (G2BMM), and a Raw aluminium finish (G2BRWM-6), the G Two is targeted at high-end home listening, TV and gaming audio, and compact home theatre setups where space is limited but reference-grade reproduction is desired.
specs: |-
  - Frequency response: 62 Hz - 20 kHz (±2.5 dB)
  - Low cutoff (-6 dB): 56 Hz
  - High cutoff (-6 dB): 25 kHz
  - Peak SPL: ≥93 dB
  - Short term max SPL: ≥100 dB
  - Long term max SPL: ≥93 dB
  - Self-generated noise: ≤5 dB SPL
  - Harmonic distortion 50-200 Hz: ≤3%
  - Harmonic distortion >200 Hz: ≤0.5%
  - Crossover frequency: 3000 Hz
  - Bass driver: 105 mm cone
  - Treble driver: 19 mm metal dome
  - Bass amplifier: 50 W Class D
  - Treble amplifier: 50 W Class D
  - Enclosure: Die-cast aluminium, reflex port
  - Signal input: 1 x RCA female, 10 kOhm
  - Mains: 100-240 VAC, 50/60 Hz
  - Power consumption (ISS active): ≤0.5 W
  - Power consumption (idle): ≤3 W
  - Power consumption (full output): 60 W
  - Height: 230 mm (242 mm with Iso-Pod)
  - Width: 151 mm
  - Depth: 142 mm
  - Weight: 3.2 kg (7.1 lb)
