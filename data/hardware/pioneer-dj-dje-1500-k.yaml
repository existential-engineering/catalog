details: |-
  The DJE-1500 in-ear headphones are your professional option for in-ear monitoring and preparing sets on the road. Like their top-flight sibling the DJE-2000s, they offer powerful sound across the frequencies and superior noise dampening – plus a choice of secure over-ear and in-ear positions for maximum comfort and versatility.

  Key features:

      - The DJE-1500s use a single dynamic driver to give a rich bass, and ceramic-coated tremblers and lightweight CCAW voice coils produce a clear mids and trebles.

      - Choose between over-ear and normal in-ear wearing styles, or easily switch between the two.

      - Choose between the included polyurethane or silicone earbud tips for a snug fit and superb noise cancellation in any environment.

      - The robust, thick cables are clad in a braided textile material to prevent tangling, and can be detached and replaced if necessary. Plus a durable carry case helps prolong their life.
