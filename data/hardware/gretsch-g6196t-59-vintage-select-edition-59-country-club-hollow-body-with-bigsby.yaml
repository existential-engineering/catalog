details: |-
  Honoring one of the first "custom color" guitars created by Gretsch, the G6196T-59 Vintage Select Edition '59 Country Club Hollow Body with Bigsby is a rich-sounding instrument that's waiting to be turned loose on your music. Its huge, sonorous voice and elegant looks are an ideal match for any player who wants to stand out from the crowd. Simply put, this guitar is the perfect companion onstage or in the studio, cranking out everything from sensitive ballads to raucous rock.

  A pair of highly dynamic TV Jones Classic pickups reacts to your pick hand with vibrant tone. Traditional Gretsch controls, including individual pickup volume controls, master volume and a three-way tone switch, allow you to blend the pickups, personalizing your sound with countless tonal variations. Add the new Gretsch "Squeezebox" capacitors and you get incredibly silky vintage high end. The standard "U"-shaped maple neck bears a 12"-radius ebony fingerboard with 22 medium jumbo frets for a memorable playing experience that works with any style. 1959-style trestle bracing connects the top and back of this guitar for distinctive warm, balanced tone while minimizing feedback.
