name: Lambda
manufacturer: lexicon
primaryCategory: audio-interface
categories:
  - discontinued
  - legacy
url: https://lexiconpro.com/en-US/products/lambda
description: A compact 4x2x2 USB-powered desktop recording interface that turns
  a PC or Mac into a 24-bit recording studio with mic, line, and instrument
  inputs plus MIDI I/O.
specs: |-
  - 4x2x2 desktop recording interface
  - USB bus-powered (no external power supply required)
  - 24-bit audio
  - Two studio-quality balanced microphone inputs with phantom power
  - Two RF-filtered TRS balanced line-level stereo inputs
  - High-impedance front-panel instrument input for guitar/bass
  - Balanced analog line outputs
  - Separate high-powered headphone amplifier with dedicated jack
  - TRS inserts for outboard processors
  - Opto-isolated MIDI In/Out
  - Individual peak indicators for mic and line inputs
  - Monitor mix control with stereo/mono switching
  - 2-channel, 4-segment bargraph metering
