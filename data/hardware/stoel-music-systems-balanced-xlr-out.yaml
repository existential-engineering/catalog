description: A Eurorack module that converts a high-level modular synthesizer
  signal into a balanced line output, using a broadcast-quality balanced line
  driver, an LED meter, and a gold-plated XLR connector.
details: |-
  Low-quality direct boxes tend to distort easily and lack bass response because they are usually designed for handling low-level signals from passive guitar pickups. In addition, modular synthesizers have very high signal outputs, well beyond what a typical direct box can handle without distortion. The Stoel Music Systems Balanced XLR Out addresses all of these problems in a convenient Eurorack module. Featuring a broadcast-quality balanced line driver, an LED meter, level control, and a rugged gold-plated Neutrik XLR connector. The Stoel Music Systems Balanced XLR Out delivers clean signals to your mixer, audio interface, or sound system, even if it is hundreds of feet away. Both gigging and studio musicians can benefit from excellent sound quality, the ability to drive hundreds of feet of balanced XLR cable with low distortion and noise, and the simplicity of just plugging in an XLR cable. The LED bargraph shows the presence and level of signals, making troubleshooting easier. The volume control can be dialed in over a range of signal levels. Even in a crowded rack, the LED meter is easy to see, and the knob is large enough to grab quickly and set accurately. Plus, the module stays mounted in the rack, so it can't get lost like a direct box or cable adapter. The XLR output uses a gold-plated Neutrik connector. The output circuit features short circuit protection and can drive a shorted cable indefinitely without damage. The output is protected against phantom power, even when cables with phantom power applied are unexpectedly unplugged. This module does not require phantom power to operate. All Stoel Music Systems modules feature aluminum front panels with a durable high-gloss white finish. For a crisp appearance and exceptional durability, the front panel markings are digitally printed at high-resolution with UV-cured ink. Mounting holes are plated to significantly reduce screw rash. The power connection features polarity protection to prevent accidental damage to the module if it is connected backward. Each module includes a 12" long 10-pin to 16-pin ribbon cable compatible with the Eurorack standard, M3 mounting screws, and a complimentary sticker. Technical Specifications

  Width
  6 HP

  Depth
  28 mm

  Current Draw
  +12V: 38mA, -12V: 6mA, +5V: 0mA
