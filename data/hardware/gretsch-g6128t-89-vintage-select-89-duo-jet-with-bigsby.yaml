details: |-
  Vintage Select Edition guitars are designed for the player who appreciates the finest in musical instrument heritage. Our all-new G6128T-89VS Vintage Select '89 Duo Jet with Bigsby pays homage to a classic late-'80s design that rocked the forefront of the Pacific Northwest grunge movement that overtook the music world in the early 1990s.

  Delivering signature solid-body power and punch, the G6128T-89VS features period-correct chambered mahogany construction, which magnifies harmonic richness by letting air resonate between the top and body for livelier and more articulate tone.
