details: |-
  Made for situations where you require maximum security and where the visual size of the mic is less important. The Heavy Duty 4660 features a stainless steel housing, a heavy-duty cable relief and a thick 2.2 mm (0.09 in) cable. DPA's Heavy Duty microphones are a more robust version of the original mics they are based upon. Now available with CORE+ & MicroLock. CORE+ takes the miniature mic to the next level, neutralizing distortion across the entire dynamic range. MicroLock is a dependable, secure locking microphone connector with limitless flexibility and reassuring reliability.
specs: |-
  - Polar pattern: Omnidirectional
  - Transducer type: Condenser (pre-polarized)
  - Housing: Stainless steel
  - Cable diameter: 2.2 mm (0.09 in)
  - Reinforced heavy-duty cable relief
  - Sound Pressure Level options - Normal SPL (20 mV/Pa sensitivity), Loud SPL (6 mV/Pa), or Loud SPL with Presence Boost (6 mV/Pa, optimized for chest placement)
  - IP58 rated
  - Available with CORE+ amplifier technology
  - 2-year warranty
