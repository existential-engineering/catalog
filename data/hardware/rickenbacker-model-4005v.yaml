description: Explore the Model 4005V Vintage Bass Guitar, a stunning re-issue
  with vintage pickups and iconic design features.
details: |-
  Perhaps the most anticipated re-issue in Rickenbacker history. The 4005V is
  inspired by the iconic 4005 semi-acoustic body introduced in 1965.

  The updated version of this classic boasts two vintage pickups, crushed
  pearl inlays, and checkered binding. It also includes Rickenbacker's new
  single dual-action truss rod.

  Built with the same slimmed down neck profile of the 4003 and an X braced
  semi-acoustic body. This provides the same deep warm tone as its 60's
  predecessor.
