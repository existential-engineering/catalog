name: T60RPmk2ai
manufacturer: fostex
primaryCategory: headphones
url: https://www.fostex.jp/en/products/t60rpmk2ai/
description: Domestically produced (Made in Japan) variant of the T60RPmk2
  semi-open RP planar magnetic stereo headphone. Features a solid hard maple
  housing hand-dyed with traditional Awa Aizome (Tokushima indigo) and
  high-fidelity internal components including 7N-grade high-purity OFC wiring
  and the 4th generation RP driver with improved sensitivity and transient
  response. Standard Ultrasuede ear pads provide breathable long-session
  comfort. Detachable cable system uses dual 2-pole 3.5 mm connectors on the
  cups; ships with a 2 m 3-pole 3.5 mm stereo mini plug cable and a 6.3 mm
  stereo phone adapter.
details: |-
  Configuration: Semi-open, around-ear, planar magnetic headphones with detachable dual-entry cable

  Features:
  - Solid hard maple housing hand-dyed with Awa Aizome (Tokushima indigo)
  - 4th generation RP planar magnetic driver with improved sensitivity and transient response
  - 7N-grade high-purity OFC internal wiring
  - Standard Ultrasuede ear pads for breathable comfort
  - Detachable dual 2-pole 3.5 mm cable system (recable-compatible)
  - Includes 6.3 mm stereo phone adapter
  - Optional balanced 4.4 mm cable available (ET-RP4.4BL2Y)

  Country Of Manufacture: Japan

  Series: T60RP Series
