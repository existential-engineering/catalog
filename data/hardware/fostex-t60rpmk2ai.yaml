description: Domestically produced (Made in Japan) variant of the T60RPmk2 semi-open RP planar magnetic stereo headphone. Features a solid hard maple housing hand-dyed with traditional Awa Aizome (Tokushima indigo) and high-fidelity internal components including 7N-grade high-purity OFC wiring and the 4th generation RP driver with improved sensitivity and transient response. Standard Ultrasuede ear pads provide breathable long-session comfort. Detachable cable system uses dual 2-pole 3.5 mm connectors on the cups; ships with a 2 m 3-pole 3.5 mm stereo mini plug cable and a 6.3 mm stereo phone adapter.
details: |-
  This model maximizes the potential of the fourth-generation RP driver, Fostex's proprietary full-range planar diaphragm technology, by housing it in a hard maple enclosure dyed by Awa indigo artisans in Tokushima. As the first Made in Japan model in the T60RP series, each unit is assembled in the company's domestic factory.

  Each hard maple housing is hand-dyed with Awa indigo from Tokushima, developed in collaboration with master artisans, achieving a deep indigo blue that highlights the wood grain. Dyeing with hon-ai (true indigo), made solely from the indigo plant, leverages hard maple's hard, high-density properties that resist unnecessary tonal coloring, resulting in a solid, deep bass range and a clear, extended high range. Because the housing is solid natural wood, each piece may vary in grain, texture, color and knots without affecting sound quality.

  The internal wiring uses 7N-grade (99.99999%) high-purity OFC cable, matching higher-end models. Dual 3.5 mm connectors on each housing improve re-cable compatibility. The standard included unbalanced cable features high-fidelity OFC conductors, while the optional balanced cable is the 4.4 mm ET-RP4.4BL2Y.

  The optional Toray Ultrasuede ear pads are standard equipment on this model. They provide breathable, soft-to-the-touch comfort and deliver smooth sound from deep bass to high frequencies, combined with the fit of the low-rebound around-ear design.

  The fully driven planar diaphragm driver has reached its 4th generation. The number of magnets sandwiching the diaphragm has been increased and the printed coil pattern redesigned. Renewing the magnetic circuit components and optimizing magnetic flux distribution suppresses unwanted diaphragm resonance, achieving sharp response with rapid sound attack and decay.
specs: |-
  - Type: Semi-open dynamic
  - Driver: RP planar magnetic
  - Impedance: 28 ohm
  - Sensitivity: 96 dB/mW
  - Maximum input: 3,000 mW
  - Frequency response: 10 to 40,000 Hz
  - Weight: Approx. 398 g (excluding cable)
  - Housing: Solid hard maple dyed with Awa indigo
  - Internal wiring: 7N (99.99999%) grade high-purity OFC
  - Ultrasuede ear pads fitted as standard
  - Cable: 3.5 mm (2-pin) mini plug x2 (L, R) to 3.5 mm (3-pin) stereo mini plug cable (2 m) x1, 3.5 mm to 6.3 mm stereo phone adapter x1
  - Accessories: Dedicated pouch, safety precautions
  - Optional balanced cable: 4.4 mm ET-RP4.4BL2Y
  - Made in Japan
  - Passive wired headphones, no power supply required
  - Series: RP Series
