description: A Eurorack module that distributes control voltage or audio signals
  to up to eight destinations, using a separate unity gain buffer amplifier for
  each output to prevent voltage drop.
details: |-
  The Stoel Music Systems Buffered multiple provides precise distribution of control voltages to up to eight destinations. When splitting a control voltage, the voltage will often drop as it is divided to more destinations. This can be a significant problem, especially when controlling the pitch of oscillators. This module provides a separate unity gain buffer amplifier for each output, ensuring that splitting the signal will not affect the level. Both CV and audio signals can be distributed with this module. All Stoel Music Systems modules feature aluminum front panels with a durable high-gloss white finish. For a crisp appearance and exceptional durability, the front panel markings are digitally printed at high-resolution with UV-cured ink. Mounting holes are plated to significantly reduce screw rash. The power connection features polarity protection to prevent accidental damage to the module if it is connected backward. Each module includes a 12" long 10-pin to 16-pin ribbon cable compatible with the Eurorack standard, M3 mounting screws, and a complimentary sticker. Technical Specifications

  Width
  4 HP

  Depth
  25 mm

  Current Draw
  +12V: 14mA, -12V: 14mA, +5V: 0mA
