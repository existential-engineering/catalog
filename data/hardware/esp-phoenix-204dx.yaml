description: The LTD Phoenix-204DX takes the flowing curves of the Phoenix shape and delivers it in a powerful bass that's priced to fit the budgets of most musicians. It features bolt-on construction at 34" scale, with a poplar body topped by burled poplar where the natural knots and figured grain offers a terrific aesthetic look. This bass also offers a smooth and comfortable thin U-shaped roasted maple neck and a rosewood fingerboard with dot inlays and 21 extra-jumbo frets, as well as a reverse headstock. Components on the B-204DX include black hardware, LTD vintage tuners, an LTD DB-4 fixed bridge, controls for volume, balance, and tone boost, and a set of excellent ESP SB-4 bridge and neck pickups.
