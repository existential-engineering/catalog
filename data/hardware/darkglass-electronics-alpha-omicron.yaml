details: |-
  The Alpha Omicron is a dual-engine bass distortion pedal from Darkglass's Core Series, positioned as a slimmer, simpler, and more affordable take on the Darkglass Alpha·Omega. It features two blendable distortion circuits: Alpha (punchy and tight with a lot of definition) and Omega (brutal and raw), letting bassists mix between distinct tonal characters.

  The pedal offers independent Drive and Level controls for distortion intensity and output volume, plus Growl (bass boost shelving) and Bite (2.8 kHz high-mid presence boost) switches. Its premium analog signal path enables continuous wet/dry blending, mixing the clean and processed signals while maintaining unity gain on the dry path.

  The unit requires a regulated 9V center-negative power supply (20 mA draw, not included) and measures 75 mm x 111 mm x 43 mm, weighing 250 grams.
specs: |-
  - Premium analog signal path
  - Two blendable distortion modes (Alpha, Omega)
  - Continuous clean/wet blend
  - Independent distortion Drive and Level controls
  - Growl switch (shelving bass boost) thickens low end
  - Bite switch (2.8 kHz high-mid boost) adds presence
  - Requires a standard 9V center-negative power supply (20 mA); not included
  - Dimensions: 75 mm x 111 mm x 43 mm; weight 250 g
