description: "Transformer-coupled, 4-channel digital-to-analog converter
  daughter card for the B80 and B16 MOTHERSHIP, featuring BOPA14 all-discrete
  class-A op-amps with BURL NextGen Analog and BX5 nickel core output
  transformers."
specs: |-
  - 4-channel DAC
  - 4-channel XLR connectivity
  - All class-A, discrete signal path
  - BURL NextGen Analog BOPA14 op-amp
  - BX5 nickel core output transformers
  - Avid delay matching
  - DAC filter select
  - 115 dB Dynamic Range
  - -96 dB THD+N, full scale output = +22 dBU
  - Frequency response at 48 kHz: 10 Hz to 22 kHz, +/- 0.1 dB
  - Frequency response at 96 kHz: 10 Hz to 30 kHz, +/- 0.1 dB, -0.3 dB @ 40 kHz
  - Frequency response at 192 kHz: 10 Hz to 30 kHz, +/- 0.1 dB, -1.5 dB @ 90 kHz
  - Made in USA
