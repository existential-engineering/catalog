description: "- DynaFlange - DynaMoPhase - Random Filter"
details: |-
  The Bubble Tron Dynamic Flanger Phaser and Random Synth Filter is a three-mode modulation pedal built around playing dynamics rather than a free-running LFO. Two of its three sections start and stop with pick attack and strength, so the effect follows the envelope of the signal instead of cycling continuously in the background.

  The DynaFlange section takes its cue from the MicMix DynaFlanger, a dynamic flanger that begins and ends with the player's attack. A FDBK control selects positive or negative feedback, the negative setting reading as more hollow and vocal and the positive as thicker and smoother. Sensitivity sets how hard the pedal has to be driven before the flanger sweeps fully, and Depth sets how deep the sweep goes.

  The DynaMoPhase section holds two phasers. One runs from an LFO whose speed is set by the Rate control while its depth is modulated dynamically, and the other is a purely dynamic phaser that starts and stops with pick attack. Turning Rate fully off leaves only the dynamic phaser. Depth and Sensitivity shape how strongly the signal drives the sweep.

  The Filter section is the one part that is not dynamic. A Shape control selects between ramp and random stepped patterns, and the Sensitivity control acts as a vintage synth style bandpass filter control, shaping the filter band for keyboard-like voices. Because the flanger and phaser are envelope driven, neither produces the constant swooshing of an LFO-based effect.
specs: |-
  - Three modes: DynaFlange, DynaMoPhase and Random Filter
  - Flanger controls: FDBK (positive or negative feedback), Sensitivity, Depth
  - Phaser controls: Rate (switchable off), Depth, Sensitivity
  - Filter controls: Shape (ramp or random stepped), Sensitivity (bandpass shaping)
  - External and internal toggle switches for alternate voicings
  - Designed and engineered by Aaron Tackett, Craighton Hale and Robert Keeley
  - Built in Edmond, Oklahoma
