url: https://animalfactoryamps.com/products/vivisect-4-channel-signal-processor-offset-and-noise-module
description: A Eurorack module offering four channels of attenuverters with
  independent outputs, a switchable offset, and an independent white noise
  output, with jumpers to normalize inputs to Input 1.
details: |-
  In production and shipping with a 5 day lead time! What joy is modular synthesis if you can't perform anaesthesia-free surgical operations on living, screaming electrical signals? The Vivisect is designed for just that. Simple but deep, this module gives you four channels of attenuverters with independent outputs, an offset that can be switched in and out of the summed signal and a completely independent white noise out. Jumpers on the back allow you to normalize any or all of the other three inputs to Input 1. IMPORTANT: Please note that while you can definitely use Vivisect to process/attenuate/mix/mult audio signals, it was not designed with that in mind. This module operates on the principle of phase-cancellation - the faster or more complex the signal, the harder it will be to get a perfect zero output in the center position - some signal will tend to bleed through. For DC and most CV signals, you should be able to achieve a dead zero in the center position.
