details: |-
  No detail left unheard

  MC-450 Professional Open-Back Headphones deliver top-level performance, presentation, and comfort for the most discerning listener. Suited to critical listening and mixing, the open-back design provides an ultra-wide soundstage and clarity that translates every detail in your music without sounding harsh or artificial.

  High-Performance Monitoring Headphones

  High-headroom, reference-quality 42mm transducers provide an accurate reproduction of your mix and your music, and the open-back design offers an immersive and spacious listening experience.

  Professional Design

  A premium leather adjustable headband and memory foam ear pads provide an ergonomic fit for hours of comfort, and the rugged design is built to last and meet the demands of professionals in the studio or on location.

  Cables and Accessories

  Premium cables with locking bayonet connectors are included: a 9.8 ft fabric-jacketed straight cable, a 4 ft coiled cable, and a 4 ft straight cable with phone control and mic, along with a gold-plated 1/4-inch adapter and a premium protective case.
