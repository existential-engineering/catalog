description: A pulverizing distortion pedal that captures the mighty 'chainsaw
  sound' typically associated with a cranked HM-2. The Carbide splits your
  signal into two parallel paths — a powerful clean boost and a distortion
  circuit — each with independent volume controls for custom blending.
details: |-
  The Carbide Distortion is Catalinbread's take on the iconic 'chainsaw' heavy distortion sound made famous by the Boss HM-2 Heavy Metal pedal. Rather than a straight clone, Catalinbread engineered a more refined and musical clipping arrangement with optimized transistor selection.

  The pedal features a unique dual-signal-path design. Your guitar signal is split into two parallel paths: one path feeds a powerful clean boost circuit optimized for downtuned instruments, and the other path feeds the distortion circuit. Each path has its own dedicated volume control (Dry and Wet knobs), allowing you to dial in the precise blend of clean and saturated tone.

  The Emphasis control shapes the frequency response of the distortion path, giving you control over low-end tightness and high-frequency content. The Carbide also incorporates three specific frequency boosts centered at 87Hz, 958Hz, and 1279Hz, contributing to its characteristic heavy and cutting sound.

  The pedal accepts a standard center-negative DC power supply and can run from 9 to 15 volts.
