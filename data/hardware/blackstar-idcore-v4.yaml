description: The ultimate feature-packed home practice amps for beginners or professionals.
details: |-
  Whether a beginner or a pro, when you play we want you to have the best possible playing experience. That's why the same R&D team responsible for our professional amps also designed the ID:CORE V4. Unique innovations and connectivity give guitarists the best possible sound from the first time they plug in.

  ID:CORE V4 houses 6 enhanced voices from ultra clean to extreme overdrive — Clean Warm, Clean Bright, Crunch, Super Crunch, OD1 and OD2. Guitarist-friendly controls combined with the power of programmability allow for an amazingly versatile tone range, from pristine cleans to high gain crunch and overdrive. The patented ISF (Infinite Shape Feature) control lets you blend between American (tight bottom-end, more aggressive middle) and British ('woody' and less aggressive) tonal characteristics.

  Immerse yourself in sound with Blackstar's unique Super Wide Stereo technology — an immersive sound experience that lets you hear your playing all around the room. The effects section delivers studio-quality Super Wide Stereo modulation, delay and reverb effects simultaneously: 4 Delays (Linear, Analogue, Tape, Multi), 4 Modulation effects (Phaser, Chorus/Flanger, Envelope, Tremolo), and 4 Reverbs (Room, Hall, Spring, Plate). A built-in chromatic tuner is engaged by holding the Reverb button.

  The ID:CORE V4 40 is now louder than ever thanks to advancements in both hardware and software voicing. Power Reduction down to 1W (on all models) lets you switch between full power headroom and lower 1W power at the press of a button — perfect for home practice. USB-C connectivity provides 4-channel low-latency recording and professional re-amping, turning the amp into an audio interface, while a TRRS 3.5mm jack enables direct-to-phone audio for high-quality livestreaming.

  Free Architect software provides deep editing, patch sharing and access to CabRig Lite — Blackstar's next-generation cabinet simulator with user controls for cabinet, mic and room environment. The line includes a Bluetooth version of the ID:CORE V4 10 model for wireless music playback, plus a Double Cream finish variant of the 10W model. A unique recessed handle on the rear allows for easy carrying.
specs: |-
  - ID:CORE V4 10: 10W (2x5W Super Wide Stereo), 2 x Blackstar 3" speakers
  - ID:CORE V4 20: 20W (2x10W Super Wide Stereo), 2 x Blackstar 5" speakers
  - ID:CORE V4 40: 40W (2x20W Super Wide Stereo), 2 x Blackstar 6.5" speakers
  - 6 Voices: Clean Warm, Clean Bright, Crunch, Super Crunch, OD1, OD2
  - 12 built-in effects in Super Wide Stereo (4 Delay, 4 Modulation, 4 Reverb)
  - Delay: Linear, Analogue, Tape, Multi
  - Modulation: Phaser, Chorus/Flanger, Envelope, Tremolo
  - Reverb: Room, Hall, Spring, Plate
  - Patented ISF (Infinite Shape Feature) tone control
  - Power Reduction down to 1W (all models)
  - USB-C connectivity, 4-channel audio for recording and re-amping
  - CabRig Lite advanced speaker simulator (configurable cabinet, mic and room)
  - Direct-to-phone TRRS 3.5mm audio for streaming/content creation
  - Built-in chromatic tuner
  - Free Architect software for deep editing and patch sharing
  - Bluetooth connectivity (ID:CORE V4 10 Bluetooth model only)
  - Full-range linear speakers
