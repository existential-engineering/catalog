description: >-
  The Ryan "Fluff" Bruce Artist Series StingRay — limited to 25 numbered
  instruments — features a roasted figured maple neck with matching headstock,
  Honduran mahogany body, and a Custom Shop Seymour Duncan FLF humbucker
  hand-wound by Maricela "MJ" Juarez. Available in Iron Swan (Sweetwater
  exclusive, ebony/matte black) and Grit City Green (Vault exclusive,
  rosewood/chrome).
details: |-
  The Ryan "Fluff" Bruce Artist Series StingRay combines bold looks, killer tone, and the kind of playability Music Man is known for.

  Available in two stunning finishes — a striking Iron Swan with black hardware and ebony fretboard (offered exclusively through Sweetwater.com), and a Grit City Green version with chrome hardware and rosewood fretboard (available exclusively through the Ernie Ball Music Man Vault) — this limited-run guitar delivers both collectability and stage-ready performance.

  Each features a roasted figured maple neck capped with a matching headstock; the neck's oil-and-wax finish feels fast and broken-in right out of the case.

  Under the hood is the Custom Shop Seymour Duncan FLF model — Fluff's signature humbucker hand-wound by Maricela "MJ" Juarez — delivering his unmistakable punch and clarity. Only 25 of these guitars exist, each with a numbered neck plate.
specs: |-
  - Body wood: Honduran mahogany
  - Body finish: Satin
  - Body colors: Grit City Green; Iron Swan
  - Neck wood: Roasted figured maple (matching headstock)
  - Neck finish: Gunstock oil and hand-rubbed wax
  - Neck width: 1-5/8" at nut, 2-1/4" at last fret
  - Neck radius: 10"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Rosewood (Grit City Green) / Ebony (Iron Swan)
  - Fret markers: Atlanté blocks
  - Frets: 22 high-profile, medium-width stainless steel
  - Scale length: 25.5"
  - Pickup: Custom Shop Seymour Duncan FLF model, hand-wound by Maricela "MJ" Juarez
  - Controls: 500k volume pot
  - Bridge: Modern Classic Music Man string-through, steel bridge plate with vintage steel saddles
  - Pickguard: Vintage white pearloid
  - Tuning machines: Schaller M6-IND locking
  - Hardware: Chrome (Grit City Green) / Matte black (Iron Swan)
  - Electronic shielding: Chrome-plated aluminum control cover
  - Production: Limited to 25 numbered instruments
