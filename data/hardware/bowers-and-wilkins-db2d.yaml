description: High-performance 10-in subwoofer that uses identical 10-inch
  Aerofoil cone drivers found in the flagship 800 D4 speakers, with
  high-efficiency amplification and intelligent DSP for room optimization.
details: |-
  The DB2D is a high-performance 10-inch subwoofer from Bowers & Wilkins' DB Series, engineered to deliver fast, solid bass that complements the 800 Series Diamond speakers. It employs the same Aerofoil cone driver technology found in the flagship 800 D4 speakers, scaled for low-frequency reproduction.

  Two 250mm (10 in) Aerofoil cone drive units are arranged in a balanced configuration, mounted on opposite faces of the cabinet. This opposed-driver layout cancels mechanical reaction forces, reducing cabinet vibration and allowing the subwoofer to operate with greater positioning flexibility within a room.

  Amplification is handled by a digital preamplifier paired with Dynamic EQ, which adapts the subwoofer's tonal balance to suit the listening environment. Setup and tuning are managed through a dedicated app over Bluetooth Low Energy (BT-LE), giving the user fine-grained control over crossover, level, and room correction.

  The DB2D reaches down to 10Hz (-3dB, centered at 100Hz) and extends to 350Hz, with a -6dB range of 8.5Hz to 500Hz. Connectivity includes balanced XLR, unbalanced RCA, and 3.5mm audio inputs, plus a 12V trigger and RS-232 9-pin D connector for system integration.

  Available in Gloss Black or Satin White cabinet finishes with Black or Grey grille options, the DB2D weighs 36kg and measures 430 x 377 x 360mm (H x W x D).
specs: |-
  - Drive units: 2 x 250mm (10 in) Aerofoil cone drivers in balanced configuration
  - Frequency response: 10Hz - 350Hz (-3dB, centered at 100Hz)
  - Frequency range: 8.5Hz - 500Hz (-6dB)
  - Amplification: Digital preamplifier with Dynamic EQ
  - Control: App-based setup and BT-LE control
  - Inputs: 2 x XLR, 2 x RCA, 2 x 3.5mm audio in
  - Additional connections: 12V trigger, RS-232 9-pin D connector
  - Cabinet finishes: Gloss Black, Satin White
  - Grille finishes: Black, Grey
  - Dimensions (H x W x D): 430 x 377 x 360mm (16.9 x 14.8 x 14.2 in)
  - Weight: 36kg
