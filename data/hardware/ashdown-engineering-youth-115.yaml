details: |-
  Designed for Martin 'Youth' Glover from Killing Joke, the YOUTH 115 is a folded 1x15" bin featuring a neo B&C driver custom made in Italy. It is built from Birch Ply with a PA-style spatter finish and four rear casters for ease of manoeuvrability. The cabs can be ordered directly and are built to order in the UK at the Ashdown custom shop, with special requirements accommodated on request.
specs: |-
  - Speaker configuration: folded 1 x 15" bin, neo B&C driver (custom made in Italy)
  - Size: H 512mm (20"), W 849mm (33.5"), D 760mm (30")
  - Nominal power handling: 400W AES
  - Continuous program: 800W (3dB greater than nominal rating)
  - Impedance: 8 Ohms
  - Birch Ply construction with PA-style spatter finish
  - Four rear casters
