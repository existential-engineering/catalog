description: The DROID master is the central Eurorack module of the DROID
  system, providing eight precision CV inputs and eight CV outputs and serving
  as the hub for attached controllers and expanders.
details: |-
  DROID master module

  The DROID master is the central module in your DROID setup. In any Droid setup you need one master module. You can use it stand alone or with up to 16 controllers and up to one G8 and one X7 expander attached. Currently there are six different controllers available: B32 , P4B2 , P2B8 , P10 , S10 , and M4 . The DROID master has eight CV inputs and eight CV outputs, all of them very precise in voltage and timing. The range is from -10V to +10V. Shipping includes a micro SD card, a micro SD card reader for USB 2, a ribbon cable for connecting to a Eurorack (Doepfer) compatible modular system with +/- 12V and four 3 mm mounting screws. The master is also available in the master + G8 set and in the Livekit

  Here are a few examples of what your DROID can be for you. As long as you don't run out of inputs and outputs or RAM you can use as many of these functions (and/or multiple instances of them) at the same time in one DROID. Some of the magic lies in connecting them internally to create more complex CVs. Current Draw: 154 mA +12V | 15 mA -12V | 0 mA 5V

  Width: 8 HP
  Depth : 40 mm

  Link to the DROID master on ModularGrid
specs: |-
  - Envelope generator
  - Melody sequencer
  - Trigger sequencer
  - Random / Pseudo random melody or trigger generator
  - Precision adder
  - Slew limiter
  - Clock divider and multiplier
  - Logic gate
  - CV looper
  - Sample and hold
  - Euclidean rhythms generator
  - Quantizer
  - Addressable and clockable CV switch
  - CV mixing and routing matrix
  - LFO
  - Bernoulli gate
  - Mathematical operator
  - ... and many many more
