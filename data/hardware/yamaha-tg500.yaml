description: >-
  The Yamaha TG500 is a rack-mounted tone generator based on Yamaha's SY85 synthesizer,
  featuring the AWM2 (Advanced Wave Memory) synthesis engine. It offers 64-voice polyphony
  with 16-part multitimbral capability, dual effects processors, and four expansion card
  slots. Despite its minimal front-panel controls, it provides extensive sound editing
  capabilities and six individual audio outputs for studio or live use.
details: |-
  The TG500 offers three operational modes: Voice mode for accessing individual patches, Multi mode supporting up to 16-part multitimbral sequences, and Performance mode allowing users to split or layer up to four patches across a keyboard controller. Despite its minimal physical interface, the synthesizer provides extensive editing capabilities equivalent to the SY-85, though users typically rely on external editors or software-based programming tools.

  Sound customization extends through four expansion card slots — two for data cards and two for wave cards — enabling musicians to supplement the stock sounds with additional tones across various musical styles. The device features six individual audio outputs, making it suitable for multitrack recording or live performance mixing applications.

  The dual-effects processor includes 90 effect types per unit, encompassing chorus, flange, reverb, delay, exciter, parametric EQ, echo, ring modulation, leslie, and distortion among others. Effects can operate in series or parallel routing through four buses.
specs: |-
  - 64-voice polyphony (2 x 32 configuration)
  - AWM2 (Advanced Wave Memory) synthesis engine
  - Digital LPF, HPF, BPF, and BEF filters
  - 384 patches, 252 performances
  - 2 discrete effects processors with 90 effect types each
  - 4 expansion card slots (2 data, 2 wave)
  - 16-part multitimbral via MIDI
  - 6 individual audio outputs
  - Rack-mount form factor
