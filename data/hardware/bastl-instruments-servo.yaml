name: Servo
manufacturer: bastl-instruments
primaryCategory: utility
categories:
  - discontinued
url: https://bastl-instruments.com/eurorack/modules/servo
description: Two-channel Eurorack module designed to drive hobby 5V servo motors
  from CV signals. Each channel features optically isolated CV and motor
  circuitry, a trigger/gate input, a CV input with attenuator, and an onboard 5V
  regulator to power the motors. External motor power (9–15V, positive polarity)
  is required.
details: |-
  5HP, 50mm depth. +12V <5mA, -12V <5mA, +5V <35mA. Requires external motor power (9–15V, positive polarity). PTC fuse and diode protection on 16-pin power connector. CV and motor circuitry optically isolated.
