  - Phantom Power: Yes (48V)
  - Polarity Switch: Yes
  - Gain: 70dB
  - Analog Inputs: 1 x XLR (mic/line), 1 x 1/4" TS (Hi-Z/DI, front panel)
  - Analog Outputs: 1 x 1/4" TRS
  - Form factor: Half-rack (1U)
  - Power Source: 24V AC adapter (included)
  - Dimensions: 9.5" W x 1.75" H x 6.5" D
  - Weight: 3.2 lbs.
