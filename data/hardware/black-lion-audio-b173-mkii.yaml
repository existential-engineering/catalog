description: Single-channel British-style mic/DI preamp with Cinemag transformer
details: The B173 mkII delivers the muscular lows, assertive mids, and glossy
  highs characteristic of a vintage '73 (Neve 1073-style) preamp in a
  budget-friendly half-rack unit. It leverages Cinemag transformers on both the
  input and output stages to deliver 70dB of gain with a low noise floor. The
  front-mounted Hi-Z DI input adds a harmonically rich tone to guitars,
  keyboards, and synthesizers. Stepped input gain and variable output
  attenuation allow precise control over transformer saturation. Low-noise
  headroom makes it ideal for ribbon mics on quiet sources.
specs: |-
