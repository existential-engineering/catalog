details: |-
  Billy Duffy is not afraid to make a statement, and few things make a bolder statement than Duffy wielding his Gretsch White Falcon under the stage lights with British rock legends The Cult.

  It is with great pleasure that Gretsch released the G7593T Billy Duffy Falcon guitar, which has immediately become one of the most unique and bewitching White Falcon guitars ever made.

  Duffy's signature bird of prey features a 17" wide, 2 3/4" deep single-cutaway three-ply maple body with a three-ply maple arched top and back and two spruce parallel tone bars and sound post, a three-piece maple/walnut/maple neck with ebony fingerboard, and a chrome-plated truss rod cover emblazoned with Duffy's signature.
