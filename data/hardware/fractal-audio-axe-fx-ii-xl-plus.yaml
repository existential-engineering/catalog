description: The XL+ is the ultimate Axe-Fx II all-in-one preamp/effects
  processor. It contains a vast virtual inventory of hundreds of vintage and
  modern guitar amps, speaker cabinets, guitar stompbox and studio effects, and
  more.
details: |-
  The Axe-Fx II XL+ is the last revision of Fractal Audio Systems' Axe-Fx II generation, an all-in-one preamp and effects processor holding hundreds of vintage and modern guitar amp, speaker cabinet, stompbox and studio effect models. It recreates the sound and feel of tube amps and can tone match the sound of a live amp or a recording, and it is built for stage and studio use with heavy-duty construction and a high-quality, low-noise design.

  Two Analog Devices TigerSHARC DSPs drive the unit, one dedicated to amp modeling and the other to effects and the rest of the processing. Preamp and power amp sections are modeled separately, down to tubes, transformers, choke and filter caps, across more than 180 amp models that range from industry standards to boutique designs. Everything can be controlled from the front panel through knobs, buttons and a large backlit LCD display, with a large VALUE knob for most edits and four smaller QUICK CONTROL knobs for extra parameters including scenes. Each of the 768 presets holds 8 scenes, every one a different combination of effect on and off states and amp X/Y channel selections.

  Speaker simulation uses UltraRes technology, with over 150 factory cabinet models and room for 512 User Cab locations, plus built-in tools to capture the sound of any speaker. Factory cabs draw on Fractal's own Cab-Packs as well as selections by artists, engineers and third-party IR designers such as RedWirez and OwnHammer. Tone Matching clones another amp, rig or recording into a single preset or into a User Cab for use across the unit, and the separate Cab-Lab application for Mac and Windows mixes custom IR blends.

  As a multi-effects processor it covers more than 29 drive pedal models, dozens of delays, 19 reverb types, a customizable wah and Whammy, fixed and intelligent harmony, shimmer and crystals, phaser and Uni-Vibe, flanger and chorus, panner and tremolo, rotary speaker, 7 filter types, graphic and parametric EQ, pedal, studio and optical compressors, a limiter and gate, a front-end noise gate, a mono guitar synth, a looper, a true tape echo and a vocoder. Routing is fully modular, and real-time control comes from LFOs, envelopes, a sequencer, extensive MIDI support and two onboard pedal jacks.

  On the I/O side, balanced XLR outputs sit alongside 1/4 inch unbalanced outputs carrying Humbuster ground-loop reduction, the rear analog inputs are balanced for cleaner runs over distance, and extra analog processing keeps the noise floor lower still on Output 2, which is meant for the front of an amplifier. The front panel adds the Secret Sauce III instrument input and a high-quality headphone jack. Over USB the unit becomes a 2x4 audio interface with 1x1 high-speed MIDI, so the processed outputs and a dry re-amping track can be recorded at once and Axe-Edit needs no separate MIDI interface. Against the earlier Axe-Fx II models the XL line adds EtherCON and FASLINK connectors for the MFC-101, a dedicated MIDI THRU jack, two pedal jacks, an optical main encoder, crash-resistant Super-FLASH preset storage with built-in recovery firmware, and backward compatibility with Mark I and Mark II presets. The XL+ then adds a brighter, sharper display and an even lower noise floor.
specs: |-
  - Two Analog Devices TigerSHARC DSPs, one dedicated to amp modeling and one to effects and other processing
  - 180+ amp models, with preamp and power amp sections modeled separately
  - 150+ factory speaker cabinet models using UltraRes technology, plus 512 User Cab memory locations
  - 768 user presets, each holding 8 scenes with per-scene effect on/off states and amp X/Y selection
  - Tone Matching and an onboard IR Capture Utility for cloning an amp, rig or recording
  - 29+ drive pedal models, dozens of delays, 19 reverb types and 7 filter types
  - Graphic and parametric EQ, pedal, studio and optical compressors, limiter/gate and a front-end noise gate
  - Mono guitar synth, built-in looper, true tape echo and vocoder
  - Real-time control via LFOs, envelopes, a sequencer and two onboard pedal jacks
  - USB 2x4 audio interface with 1x1 high-speed MIDI, for simultaneous wet and dry recording
  - Balanced XLR outputs plus 1/4 inch unbalanced outputs with Humbuster ground-loop reduction
  - Balanced rear analog inputs and extra analog processing for a lower noise floor on Output 2
  - Secret Sauce III instrument input circuitry and a front-panel headphone jack
  - FASLINK port for the MFC-101 Mark III and an EtherCON port for the MFC-101
  - Dedicated MIDI THRU jack
  - Primary VALUE entry via an optical encoder rated for 1,000,000+ rotations
  - Crash-resistant non-volatile Super-FLASH preset storage with built-in backup firmware for recovery during updates
  - Backward compatible with Axe-Fx II Mark I and Mark II presets
  - Upgraded brighter, sharper display and an even lower noise floor than the Axe-Fx II XL
  - 80mm fan
  - Made in USA
