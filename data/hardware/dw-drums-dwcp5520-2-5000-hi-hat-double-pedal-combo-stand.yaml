details: |-
  This 5000 Hi-Hat Stand with Percussion Mount and 5000 Double Pedal is a package for drum kit players looking to add Latin rhythms to any song. The combo stand positions a cowbell, jam block, or other compact percussion accessory at your feet.

  The DW 5000 Series Hi-Hat Stand features patented innovations, including DW's Lateral Cymbal Seat Adjustment, Delta Ball-Bearing Hinge, Locking Clutch, and Folding Footboard.

  The package is completed by the industry-standard, dual-chain 5000 Double Bass Drum Pedal, which includes the Tri-Pivot toe clamp, Dual-Bearing Spring Rocker, Dual-Chain Accelerator cam and Single-Post Casting.
