description: The Mutant Rimshot is a fully analog rimshot and clave generator
  inspired by the rimshot found in the legendary 909 drum machine; a triple
  bridged-T oscillator coupled with a state variable filter. The clave sound
  (not a feature of the original 909 rimshot) is achieved by using just one of
  the oscillators.
details: |-
  The Mutant Rimshot is a fully analog rimshot and clave generator, built around a triple bridged-T oscillator coupled to a state variable filter and inspired by the rimshot circuit of the 909 drum machine. The clave sound, which the original 909 rimshot did not offer, comes from using just one of the three oscillators.

  Three oscillator modes are on offer. Rimshot HI gives the classic rimshot sounds, Rimshot LO drops into a lower pitch range that reaches low tom and kick drum territory when the filter is brought in, and CLV uses a single oscillator for a brighter, higher percussive sound. A switch on the back selects between original and extended pitch modes, where original mode models the rimshots of classic machines in Hi mode and extended mode trades that accuracy for a wider pitch range.

  The state variable filter also has three modes. Lowpass and highpass cover classic sounding rimshots, while highpass and bandpass open up a wider range of clave and rimshot sounds and completely different percussive elements as the resonance is raised. A VCF input lets the clave or rimshot be blended with other sounds, so filtered noise can be added for a more acoustic rimshot or for pseudo-snare tones.

  Decay and filter modulation are handled by a MOD DECAY envelope that sets the decay of the VCA envelope, and a VCF MOD attenuverter that modulates the filter cutoff from that same envelope. A switch on the back instead routes the pitch-controlled internal VCO to the filter cutoff, for filter FM style percussive hits.

  Erica Synths redesigned the module in close collaboration with Hexinverter. After Hexinverter Électronique founder Stacy Gaudreau announced the close of operations in September 2022, Erica Synths took over manufacturing, sales and support for several Hexinverter Électronique modules, retaining the functionality of the originals and supporting the reissue modules only.
specs: |-
  - Three oscillator modes: Rimshot HI, Rimshot LO and CLV (Clave)
  - Rear switch selects original or extended pitch mode
  - Three filter modes: lowpass, highpass and bandpass, with resonance control
  - VCF input for blending the rimshot or clave with external sounds
  - MOD DECAY envelope sets VCA decay
  - VCF MOD attenuverter for cutoff modulation from the MOD DECAY envelope
  - Rear switch routes the internal VCO to filter cutoff for filter FM
