description: The TLM 170 R is a truly universal microphone for even the most
  demanding recording situations. It combines technical excellence with the
  smoothness and flexibility of a large diaphragm capsule.
details: |-
  Uncolored, linear, flexible: The professional solution for any recording situation.

  The TLM 170 R is Neumann's most universal microphone, offering a remarkably linear frequency response both on- and off-axis across five polar patterns (omni, wide cardioid, cardioid, hypercardioid, figure-8). It uses Neumann's fet 100 technology with a transformerless output stage and the K89 dual diaphragm capsule, providing an enormous 130 dB dynamic range, very low self-noise (14 dB-A), and a -10 dB preattenuation switch enabling up to 154 dB SPL. A 100 Hz low cut is included, and the pattern can be remote controlled via the optional N248 PSU using a voltage-sensing scheme over standard P48 phantom power.

  Highlights:
  - 5 directional patterns plus remote control option
  - Very low self-noise and distortion
  - Enormous dynamic range of 130 dB
  - Extremely versatile
  - Even frequency response for all 5 polar patterns
  - Transformerless fet 100 circuitry

  Applications:
  - Orchestral main microphone
  - Orchestral spot microphone
  - Vocals
  - Speech
  - Studio recording
  - Guitar amps
  - Piano
  - Stereo recording
specs: |-
  - Acoustical operating principle: Pressure gradient transducer
  - Directional Pattern: Omnidirectional, wide angle cardioid, cardioid, hypercardioid, figure-8
  - Frequency Range: 20 Hz ... 20 kHz
  - Sensitivity at 1 kHz into 1 kohm: 8 mV/Pa ± 1 dB
  - Rated Impedance: 50 ohms
  - Rated load impedance: 1 kohms
  - Equivalent noise level, CCIR: 26 dB
  - Equivalent noise level, A-weighted: 14 dB-A
  - Maximum SPL for THD 0.5%: 144 dB
  - Maximum SPL for THD 0.5% with preattenuation: 154 dB
  - Signal-to-noise ratio, CCIR (re. 94 dB SPL): 68 dB
  - Signal-to-noise ratio, A-weighted (re. 94 dB SPL): 80 dB
  - Maximum output voltage: 10 dBu
  - Supply voltage ( P48, IEC 61938): 48 V ± 4 V
  - Current consumption ( P48, IEC 61938): 3 mA
  - Matching connector: XLR 3 F
  - Weight: 625 g
  - Diameter: 60 mm
  - Length: 152 mm
