description: A two-channel fixed wah with two preset tones and a three-way bass
  sweep switch for mellow, cutting, or thick filter and vocal tones.
details: |-
  The Nova Wah puts two fixed wah sounds under the player's feet, so two different wah voices can be set and recalled without rocking a treadle. Both channels use true wah circuits rather than an op-amp design.

  The pedal arrives with two preset tones so no searching is needed, and a three-way bass sweep switch moves between mellow, cutting, and thick, fat filter or vocal tones. Two stomp switches select the channels, a blue LED indicates power, and a dual red and green LED indicates which wah channel is active.

  The page is explicit that this is not an envelope filter or an auto wah and that nothing about it is automatic. It is a fully manual filter with two wah tones.

  The pedal is true bypass, and it was the first Keeley enclosure to carry lettering and the then-new Keeley logo. The page names recordings and players that used it, including Brad Paisley's 'Ticks'.
specs: |-
  - Two fixed wah channels with independent preset tones
  - True wah circuits, not op-amp based
  - Three-way bass sweep switch
  - Two stomp switches
  - Blue LED for power, dual red and green LED for wah channel indication
  - True bypass
  - Fully manual filter, not an envelope filter or auto wah
