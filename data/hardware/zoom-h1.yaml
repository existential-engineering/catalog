details: |-
  The ultra-compact H1 Handy Recorder brings new meaning to the term "portability." Small enough to slip in your pocket, it offers professional-quality stereo recording. Take it along to live concerts and band rehearsals, location video shoots, lectures and meetings, or use it to capture musical ideas whenever inspiration strikes.

  Recording runs through a built-in 90 degree X/Y stereo mic, a pair of unidirectional condenser capsules with 0 to +39 dB of gain and a 120 dB SPL maximum. A stereo 1/8-inch Mic/Line Input mini phone jack with 2.5V plug-in power accepts an external microphone, and a stereo 1/8-inch Phones/Line Output jack with dedicated volume control handles monitoring alongside the built-in reference speaker.

  Audio is written directly to microSD and microSDHC cards up to 32 GB, at up to 24-bit/96 kHz in BWF-compliant WAV or a variety of MP3 formats. Auto Level controls input level automatically, a low-cut filter removes wind noise and rumble, and up to 99 marks can be placed in a recording.

  The USB port transfers data to a computer and also puts the recorder to work as an audio interface, a USB microphone, or an SD card reader. The H1 mounts directly to a tripod, or to a mic stand or DSLR with an optional adapter, and runs for up to 10 hours on a single standard AA alkaline or NiMH rechargeable battery.
specs: |-
  - Simultaneous recording tracks: 2, simultaneous playback tracks: 2
  - Functions: lo-cut filter, auto REC level, marker
  - Recording and playback format: WAV 44.1 / 48 / 96 kHz, 16- / 24-bit, MP3 44.1 kHz at 48 to 320 kbps
  - A/D and D/A conversion: 24-bit, 128x oversampling
  - Signal processing: 32-bit
  - Recording media: microSD card (16MB to 2GB), microSDHC card (4GB to 32GB)
  - Display: 127 segment custom LCD with backlight
  - Built-in stereo mic: unidirectional condenser, gain 0 to +39 dB, minimum gain with digital attenuation -28 dB, maximum SPL 120 dB
  - Mic/line input: 1/8-inch stereo phone jack with plug-in power, 2 kOhm, input level 0 to -39 dBm
  - Phones/line output: 1/8-inch stereo phone jack, load impedance 10 kOhm or more, rated output level -10 dBm, phones 20 mW + 20 mW into 32 Ohm
  - USB interface: Mini-B type, USB 2.0 High Speed compatible, mass storage class operation, 44.1 kHz/16-bit or 48 kHz/16-bit
  - Power: 1 x alkaline or Ni-MH AA battery, or AC adapter (AD-17, USB to AC type)
  - Battery life on alkaline: 10 hours (MP3), 9.5 hours (WAV)
  - Dimensions: 44 (W) x 136 (D) x 31 (H) mm
  - Weight: 60 g without batteries
