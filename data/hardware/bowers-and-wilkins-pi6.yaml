description: Pi6. An earbud that defines excellence in its True Wireless category. Class-leading audio performance, bespoke ANC and crystal-clear call quality with the comfort and elegance of a highly considered earbud design.
details: |-
  Pi6 offers class-leading audio performance, bespoke ANC, and crystal-clear call quality with the comfort and elegance of a highly considered earbud design.

  Advanced noise cancellation that automatically adapts to your surroundings and three microphones per earbud ensures uninterrupted sound and call performance no matter where you are.

  By reducing distortion and improving high-frequency detail, Pi6's bio-cellulose drivers deliver music with lifelike clarity and detail.

  A quick and convenient charging case allows you to boost your earbud's battery as and when you need to. Simply charge your Pi6 case, to deliver 24 hours of the highest quality sound on the go. Thanks to the secure construction of Pi6, you can enjoy your favourite music out in the elements or at the gym without worrying about dust or water damage.

  The Bowers & Wilkins Music app provides industry-first headphone music streaming, plus simple setup and control that makes Pi6 smart, intuitive and easy to use.
specs: |-
  - Wearing style: in-ear noise-cancelling True Wireless earbuds
  - Drive units: 12 mm bio-cellulose
  - Microphones: 3 per earbud for telephony and ANC
  - Technical features: high-performance DSP, true 24-bit audio connection, 2-band customisable EQ, Bluetooth 5.4 with aptX Adaptive, multipoint connectivity, Active Noise Cancellation (ANC), USB-C charging, fast charging support, Apple MFi Made for iPhone support
  - Bluetooth codecs: aptX Adaptive, aptX Classic, AAC, SBC
  - Audio inputs: earbuds, Bluetooth
  - Battery type: rechargeable lithium-ion (earbuds and charging case)
  - Battery life and charging: up to 8 hours for earbuds (with ANC on), additional 16 hours from charging case, charge time 2 hours, 15-minute charge = 2 hours playback
  - Wireless charging support: no
  - Water resistance: IP54 (earbuds)
  - Weight: earbuds 7g each, charging case 46g
  - Dimensions (charging case): 65 mm (w) x 29 mm (d) x 52 mm (h)
  - In the box: extra small / small / medium / large ear tips, 60 cm USB-C to USB-C charging cable
  - Finishes: Cloud Grey, Forest Green, Glacier Blue, Storm Grey
