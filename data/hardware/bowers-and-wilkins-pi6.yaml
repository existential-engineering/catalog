description: Pi6. An earbud that defines excellence in its True Wireless
  category. Class-leading audio performance, bespoke ANC and crystal-clear call
  quality with the comfort and elegance of a highly considered earbud design.
details: |-
  Pi6 is the high-performance model in the current Bowers & Wilkins True Wireless earbud range, sitting below the reference Pi8. It pairs class-leading audio performance with bespoke active noise cancellation and call quality, in the same highly considered form factor and four ear tip sizes as its flagship sibling.

  Each earbud carries a 12mm Bio-cellulose drive unit fed by a high-performance DSP and a true 24-bit audio connection. Three microphones per earbud serve both telephony and the Active Noise Cancellation system, and a 2-band customisable EQ allows the tuning to be adjusted in the Bowers & Wilkins Music app.

  The wireless link is Bluetooth 5.4 with aptX Adaptive, alongside aptX Classic, AAC and SBC, plus multipoint connectivity for two simultaneous devices and Apple MFi Made for iPhone support.

  Battery life is up to 8 hours from the earbuds with ANC on, the longest in the range, with a further 16 hours from the charging case for up to 24 hours of playback in total. A full charge takes 2 hours and a 15-minute charge returns 2 hours of playback. Unlike Pi8, the Pi6 case does not support wireless charging and offers no audio retransmission, so charging is over USB-C only and Bluetooth is the sole audio input.

  The earbuds weigh 7g each and are rated IP54. The charging case weighs 46g and measures 65 x 29 x 52mm. Finishes are Cloud Grey, Storm Grey, Forest Green and Glacier Blue.
specs: |-
  - Wearing style: in-ear noise-cancelling True Wireless earbuds
  - Drive units: 12 mm Bio-cellulose
  - Microphones: 3 per earbud for telephony and ANC
  - Technical features: high-performance DSP, true 24-bit audio connection, 2-band customisable EQ, Bluetooth 5.4 with aptX Adaptive, multipoint connectivity, Active Noise Cancellation (ANC), USB-C charging, fast charging support, Apple MFi Made for iPhone support
  - Bluetooth codecs: aptX Adaptive, aptX Classic, AAC, SBC
  - Battery type: rechargeable lithium-ion (earbuds and charging case)
  - Battery life: up to 8 hours for earbuds (with ANC on), additional 16 hours from charging case
  - Charge time: 2 hours, 15-minute charge = 2 hours playback
  - Wireless charging support: no
  - Water resistance: IP54 (earbuds)
  - Audio inputs: earbuds Bluetooth
  - Accessories: extra small / small / medium / large ear tips, 60 cm USB-C to USB-C charging cable
  - Weight: earbuds 7 g (each), charging case 46 g
  - Charging case dimensions: 65 mm (w) x 29 mm (d) x 52 mm (h)
  - Finishes: Cloud Grey, Forest Green, Glacier Blue, Storm Grey
