details: |-
  The Tweed Edition is a heavily modified Katana Blues Drive. Gain in the pre-amp stage is lowered so the JFET stages do more of the work, giving a fatter, more tube-like tone. The rectifier diodes are swapped for LED clipping, described as bolder and smoother, and the edition uses expensive audiophile grade integrated circuits for very low noise.

  The base Katana Blues Drive is a musically rich and dynamic overdrive. It captures tube-like character with a transparency that lets the guitar's full tonal range through while remaining sensitive to the touch, and it cleans up when the guitar volume is rolled back.

  The circuit takes the JFET gain stages of the Katana Boost and blends them with an overdrive section influenced by Keeley's own overdrive pedal modifications. Active tone controls and layered overdrive voicings give a thick, rich response that still lets the guitar's own tone come through. The design took more than thirteen years and incorporated customer feedback across that period.
