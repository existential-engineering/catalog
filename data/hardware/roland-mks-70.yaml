description: >-
  The Roland MKS-70 is the rackmount version of the JX-10 Super JX, combining
  two independent JX-8P synth engines for 12-voice polyphony and a lush analog
  sound prized in modern production.
details: |-
  Released in 1986, the MKS-70 packages the formidable JX-10 Super JX synthesizer into a
  rack-friendly format, making its rich analog tones accessible to studios without the footprint of
  a full keyboard instrument. By combining two complete JX-8P synthesis engines, it delivers 12
  voices of polyphony with two DCOs per voice for a total of 24 oscillators capable of dense,
  layered textures.

  The sound architecture features lowpass and highpass voltage-controlled filters along with dual
  ADSR envelope generators per voice, yielding the warm, expansive character that has kept the
  MKS-70 relevant in studios decades after its release. Onboard chorus and delay effects add spatial
  dimension, while the distinctive "chase-play" function creates programmable delayed voice repeats
  for rhythmic and textural interest.

  The optional PG-800 programmer is highly recommended for serious sound design, as it provides
  direct knob-per-function access to the synthesis parameters that are otherwise navigated through
  menus. Notable users include Vangelis, Astral Projection, Josh Wink, and Uberzone, reflecting the
  instrument's versatility across ambient, trance, and electronic genres. External memory cartridges
  provide additional patch storage beyond the internal presets.
specs: |-
  - Polyphony: 12 voices
  - Oscillators: 2 DCOs per voice (24 total)
  - Filters: Lowpass and highpass VCF
  - Envelopes: 2 ADSR per voice
  - Effects: Portamento, delay, chorus (off/slow/fast)
  - Features: Chase-play function for delayed voice repeats
  - Memory: Internal patches + external memory cartridges
  - Control: MIDI
  - Optional: PG-800 Programmer
  - Format: Rackmount
releaseDate: "1986"
