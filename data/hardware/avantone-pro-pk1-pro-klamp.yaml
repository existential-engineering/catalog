details: |-
  The PK1 Pro Klamp attaches directly to drum rims, eliminating the need for
  boom stands that add clutter to the stage or studio. Its durable steel frame
  features three vibration deadening contact points that isolate the microphone
  from drum shell resonance and mechanical noise.

  The clamp grips the rim firmly and securely without marring or discoloring
  the finish, regardless of drum rim type. Compatible with the Avantone SSM
  shock mount for further decoupling and enhanced isolation.
specs: |-
  - Construction: Durable steel frame
  - Vibration Isolation: Three contact points
  - Rim Compatibility: All drum rim finishes (will not damage or discolor)
  - Shock Mount Compatibility: Avantone SSM
