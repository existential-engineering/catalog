description: The DM80-DANTE is a Dante digital audio networking option for the
  DM8000 Digital Audio Processor.
details: |-
  Modern meetings and telephone or video conferencing require a flexible digital audio processor with user-friendly features, such as user-configurable DSP and routing options, multiple inputs and outputs, and auto mixing.

  DM8000 processing modules include: Input; Output; ULTRANET I/O digital audio transport output for use with compatible devices; AEC (Automatic Echo Cancellation) for up to 8 channels; USB In and Out; Mixers; Auto Mixer; Equalisers; Feedback Suppression; and a variety of audio filters. The processor provides a large audio toolkit for building a custom configuration per application.
