description: Bitbox is a Eurorack module that delivers recording, clip
  launching, and looping in a musically intelligent way with impeccable audio
  quality.
details: |-
  Bitbox delivers recording, sample playback, clip launching, and looping in a musically intelligent way. With a 3.5 inch touchscreen, bitbox makes easy work of selecting, editing, and tweaking your samples. Load a bank of drum hits, musical loops, sound effects, or whatever strikes your fancy. You can also slice and dice samples to create the ultimate masterpiece driven by CV or MIDI control.

  Features:
  - Play up to 16 simultaneous samples from internal memory or up to 4 samples directly from microSD
  - Trigger samples with the touch screen, CV gate inputs, or MIDI input
  - Use MIDI for polyphonic playback of samples or slices
  - Control various sample parameters, including start position, length, pitch, gain, pan, loop mode, and launch quantization
  - Up to 8 CV modulators that can control the pitch, gain, pan, start, and length of all active samples
  - Import or export WAV files with your Mac or PC using a microSD card
  - 24-bit 48kHz stereo processing
  - 4-channel output available to each cell as 4 mono outputs or 2 stereo pairs
  - Various launch modes, including one-shot, toggle, and gate
  - Playback can be immediate or synchronized to analog or MIDI clock
  - Stereo or mono recording with the option to synchronize the start and stop times to clock inputs
  - Make recordings up to 4 hours in length
  - Record using preset loop lengths with automated playback
  - Save and recall unlimited presets
  - Export your sets to Ableton Live
  - Accepts TRS MIDI input compatible with Arturia and other products
  - Upside down UI mode enables you to mount the unit with screen on the bottom and use the screen, knobs, buttons, and CV jacks as you normally would

  What Is Included: a Series 1 eurorack module with a bitbox faceplate, a microSD card with bitbox firmware loaded on it, a eurorack power cable, a bitbox Quick Start guide, a MIDI Adapter.

  Series 1 Module Firmware Switching: Because bitbox is a Series 1 module, you can swap out the bitbox firmware for other Series 1 module firmware (fxbox or synthbox) by signing up at forum.1010music.com, downloading the new firmware and following the instructions on the forum. You can also download the latest bitbox firmware to get new features and updates. It's like getting three modules in 1 with available upgrades!

  Discontinuation notice (on page): "The Original Bitbox has been Discontinued. Please check out the new, more powerful, Bitbox MK2."
specs: |-
  - 26 HP
  - Power: +12V 350mA, -12V 0mA, 5V 0mA
  - Weight: 0.78 lbs
  - Dimensions: 6.75 x 6.25 x 2.125 in (WooCommerce package dimensions; panel depth not separately stated)
  - SKU: 001
  - Up to 16 simultaneous samples from internal memory, up to 4 directly from microSD (20 total sample/cell slots)
  - 24-bit 48kHz stereo processing
  - 4-channel output (4 mono outputs or 2 stereo pairs)
  - Up to 8 CV modulators (pitch, gain, pan, start, length)
  - Recording up to 4 hours
  - 8 total labeled 1/8-inch (3.5mm) I/O jacks: MIDI In, Clock In, In 1, In 2, FX 1, FX 2, Out 1, Out 2
  - Additional unlabeled 5-column x 4-row grid of 20 x 1/8-inch jacks on the front panel (visually confirmed present; likely per-cell CV/Gate trigger inputs, but individual jack functions are not labeled on the panel or described in page text, so omitted from the structured io array)
  - MicroSD card slot for firmware/sample storage
