description: Keeley's first fuzz-drive design, a hand-built pedal with a
  germanium treble-booster front end feeding a transistor gain stage for
  tube-amp style breakup, in a trans-sparkle red enclosure.
details: |-
  The Fuzz Head was Robert Keeley's first fuzz-drive design. A germanium treble booster was reworked for full frequency range and used to push a transistor amplifier stage into overdrive, so the pedal keeps the dynamics of a germanium booster while adding rounded, smoother breakup on top of the fuzz.

  The design is aimed at players who use a Fuzz Face style pedal as a lead boost but want more note definition, less low end and more sustain. It blends the character of germanium fuzz circuits with that of an overdrive, stays responsive to picking, and cleans up when the guitar volume is rolled back.

  This listing covered a small quantity of hand-built units made between 2011 and 2013 that were returned to Keeley from a distributor, then retested, realigned where needed and hand signed. The red units are hand silk-screened. Construction is through-hole with a panel-mounted DC jack and open-frame Switchcraft audio jacks.
