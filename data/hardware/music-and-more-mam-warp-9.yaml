description: >-
  An affordable analog multi-mode filter processor from German manufacturer MAM,
  based on the classic EDP Wasp filter circuit and offering 32 storable patches
  with MIDI sync and control.
details: |-
  The WARP 9 from Music And More (MAM) is a dedicated analog filter designed for processing external audio signals. Its filter circuit traces its lineage to the EDP Wasp synthesizer from 1978, lending it a distinctive and somewhat aggressive tonal character that sets it apart from cleaner modern alternatives.

  The 12dB per octave two-pole resonant filter offers four modes: low-pass, high-pass, band-pass, and notch. An LFO with nine available waveforms and MIDI clock synchronization provides rhythmic filter sweeps, while a built-in ADSR envelope with an added delay stage allows more complex dynamic shaping. Distortion, velocity sensitivity, and key tracking round out the sound-sculpting tools.

  Practical features include 32 patch storage locations and full MIDI IN/OUT/THRU connectivity along with a gate input, making it easy to integrate into both hardware and software-based setups. Its compact rack format fits neatly into any studio configuration.

  Positioned as a budget-friendly competitor to units like the Vermona DAF-1, the WARP 9 distinguishes itself with its patch memory capability and the unique tonal flavor inherited from its Wasp heritage.
specs: |-
  - Type: Mono external audio filter processor
  - Filter: 12dB/oct (2-pole) resonant; low-pass, high-pass, band-pass, notch modes
  - LFO: 1 with 9 waveforms; MIDI clock sync
  - Envelope: ADSR with delay
  - Effects: Distortion
  - Modulation: Velocity and key tracking
  - Memory: 32 patches
  - Control: MIDI IN/OUT/THRU, gate input
