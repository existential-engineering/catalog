name: TYPE 20 MK2
manufacturer: hedd
primaryCategory: studio-monitor
url: https://hedd.audio/products/type-20-mk2
description: A versatile 3-way DSP-enabled active studio monitor, the TYPE 20
  MK2 is an all-rounder for professionals who tackle a wide range of audio
  tasks, from bass-heavy production to Atmos mixing.
details: |-
  The TYPE 20 MK2 leverages HEDD's Air Motion Transformer driver technology to deliver precise midrange clarity paired with substantial low-end performance. Its three-way configuration combines a 7-inch woofer, a dedicated 4-inch midrange driver, and the handcrafted AMT tweeter, creating a cohesive platform suited to bass-hungry beats, jazz recordings, soundtrack work, and immersive mixing.

  A defining feature is the Closed or Ported (CoP) functionality, which lets users switch between two monitoring modes with a removable plug: closed-cabinet operation prioritizes bass precision and transient detail, while ported mode emphasizes bass extension and energy, without any hardware modification.

  Advanced DSP integration powers extensive calibration, including the HEDD Lineariser zero-phase filter for stereo imaging, desktop reflection filtering, and hi/low shelving controls. All adjustments run through the free HEDD CTRL software for transparent real-time control of filters, EQ, delay, and CoP settings from the listening position.

  Built and assembled in Berlin from premium components, each unit is rigorously tested and covered by a 5-year warranty after registration.
specs: |-
  - Configuration: 3-way active monitor
  - Woofers: 7" and 4" honeycomb
  - Tweeter: HEDD Air Motion Transformer
  - Crossover frequencies: 250 Hz / 3,200 Hz
  - Frequency response: 32 Hz - 40 kHz (LFE mode: 26 Hz - 40 kHz)
  - Maximum SPL: 120 dB per pair at 1 m
  - Amplification: 3 x 300 W ICEpower Class D (85-264 V)
  - DSP: 96 kHz / 32-bit AD/DA converter
  - Features: HEDD Lineariser, CoP, desktop filter, bass-extension mode (+20%), LFE mode
  - Dimensions: 280 x 358 x 338 mm
  - Weight: 15.4 kg per unit
