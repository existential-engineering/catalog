description: UK-built, Ice Blue 200-watt 1x12" bass combo designed for
  portability and modern clarity. Featuring a premium Sica 12" speaker, a
  Speaker Mute switch, onboard Overdrive, FX Loop, Balanced DI, and Headphone
  Out, it is finished in Charcoal Tweed with a Silver Weave grill. A compact,
  lightweight solution for rehearsal, small gigs, and home recording.
details: |-
  The Ashdown UK-SBM-112-200 delivers 200 watts of clean, reliable power in a compact, UK-built format. Designed for portability without compromising tone, it is ideal for rehearsals, small venues, and home recording. A premium Sica NEO 12" speaker delivers punchy lows, articulate mids, and crisp, well-defined highs. A responsive tube-emulated Overdrive circuit shapes tone from subtle warmth to gritty growl, while the FX Loop allows integration with pedals and external processors. A dedicated Speaker Mute switch enables silent operation, the Headphone Out makes quiet practice simple, and the Balanced DI Output ensures reliable connectivity for live or studio use. A Passive/Active switch with a -15dB pad matches active instruments, and a footswitch jack controls Drive in and out.
specs: |-
  - Power output: 200 Watts
  - Speaker: 1 x Sica NEO 12"
  - Input signal range: 100 mV to 10 V
  - Passive/Active switch with -15 dB input pad
  - Pre-shape EQ switch
  - Pre-Gain control
  - Tube-emulated Drive control
  - EQ: Bass +/-15dB, Lo-Mid +/-15dB, Middle, Hi-Mid +/-15dB, Treble +/-15dB
  - Master Volume control
  - Weight: 17.14 kg
