description: >-
  The Akai S700 is a 12-bit rack-mount sampler released in 1987 as a spin-off of the X7000
  keyboard sampler, offering user-friendly sampling capabilities with up to 8 seconds of
  sample time.
details: |-
  Akai's 12-bit S700 was designed as a rack-mount variant of the popular X7000 keyboard sampler. The unit shares the same filters and effects found in the earlier S612 model, providing familiar sonic characteristics.

  The sampler features variable sampling frequencies ranging from 4 to 32 kHz and supports up to 8 seconds of sample time. However, polyphony is limited to just 6 voices, which can be expanded to 16 with the optional ASK70 expansion board.

  A notable limitation stems from the S700's reliance on the obsolete 2.8-inch QuickDisk format for loading and saving samples. The unit can record only six 0.8-second samples at maximum bandwidth (16kHz), with mono sampling using twelve bits producing a distinctly lo-fi sound quality.

  The S700 includes a low-pass filter, though it lacks resonance capabilities. Despite its limited memory, sound quality, and outdated storage format, some enthusiasts appreciate the unit's character and continue using them, valuing it as a unique vintage piece.
specs: |-
  - Polyphony: 6 voices (expandable to 16 with ASK70 expansion board)
  - Resolution: 12-bit linear
  - Sampling rates: 4kHz - 32kHz (variable)
  - Memory: 128 or 256 KB (8 seconds at 4KHz)
  - Modulation: LFO with sine wave, speed, depth and delay controls
  - Filter: High and Low Pass filter
  - Keyboard: None (rack-mount)
  - Effects: None
  - Control: MIDI
  - Storage: 2.8-inch QuickDisk format
