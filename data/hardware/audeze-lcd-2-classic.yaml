details: |-
  The LCD-2 Classic delivers the relaxed, full, spacious sound that established Audeze's reputation when the original LCD-2 launched in 2009. Now more affordable, this handcrafted Southern California model combines classic audio character with modern comfort enhancements.

  The LCD-2 Classic is the most affordable LCD-series headphone, offering a warm, energetic musical presentation. Its planar drivers feature an offset magnetic array that increases airflow and spatial clarity.

  Reduced weight and a ventilated suspension headband enable extended listening sessions. The headphone exhibits a tube-like character with a forgiving yet clear sonic signature.

  Despite the lower price, the LCD-2 Classic uses the same 106mm planar magnetic driver platform as more expensive LCD models, delivering a true LCD listening experience.
