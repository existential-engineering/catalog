id: jeyGk5YxopSbt5eNqZADO
name: "4420A Smart IP Installation Speaker"
manufacturer: genelec
primaryCategory: speaker
url: https://www.genelec.com/4420a
description: "The 4420A packs the power and flexibility of Smart IP technology
  into an ultra-compact enclosure, bringing clarity, intelligibility and uniform
  room coverage to the tightest of spaces."
details: |-
  The 4420A is the most compact member of Genelec's Smart IP family of installation loudspeakers, packing Smart IP technology into a die-cast aluminium enclosure measuring just 226 x 151 x 142 mm. Designed for bringing clarity, intelligibility and uniform room coverage to the tightest of spaces, it pairs class-leading sound quality with the single cable convenience of Power over Ethernet for an installation experience that radically simplifies cabling, rigging and commissioning.

  Combining a 105 mm cone woofer and a 19 mm metal dome tweeter driven by two 50 W Class D amplifiers, the 4420A delivers a frequency response of 62 Hz to 20 kHz (+/-1.5 dB) and a short-term maximum SPL of >=100 dB, with low-frequency extension reaching down to 55 Hz at the -6 dB point. The result is a huge sound from a tiny footprint, suitable for AV, hospitality, corporate, public space and education applications.

  PoE/PoE+ provides power, control and audio over a single Ethernet cable. The 4420A is fully compatible with both Dante and open streaming standards such as AES67, allowing it to drop into existing IP audio networks without proprietary lock-in. Maximum continuous power draw at full output is 25.5 W, while Intelligent Signal Sensing (ISS) reduces idle consumption to <=4 W to meet ErP efficiency requirements.

  As part of the Smart IP family, the 4420A integrates tightly with Genelec's Smart IP Manager software, which provides device discovery, room EQ tools, system organisation and status monitoring across an almost unlimited number of rooms, zones, loudspeakers and audio channels. A public API command set then allows the speaker to be integrated into house automation systems for everyday use.

  The 4420A is supplied with a simple bracket, mounting screw set and 3-position terminal block for the analog audio input. Standard finishes are black, white and raw aluminium, and the speaker is also available in over 120 custom RAL colour options to blend into any architectural environment.
specs: |-
  - Frequency response: 62 Hz - 20 kHz (+/-1.5 dB)
  - Low cutoff -6 dB: 55 Hz
  - High cutoff -6 dB: 39 kHz
  - Peak SPL: >=104 dB
  - Short term maximum SPL: >=100 dB
  - Long term maximum SPL: >=93 dB
  - Self-generated noise: <=5 dB (A-weighted)
  - Harmonic distortion 50-200 Hz: <=2%
  - Harmonic distortion >200 Hz: <=0.5%
  - High frequency latency: 2.2 ms
  - Bass amplifier: 50 W Class D
  - Treble amplifier: 50 W Class D
  - Woofer: 105 mm cone driver
  - Tweeter: 19 mm metal dome
  - Crossover frequency: 3000 Hz (Bass/Treble)
  - Analog audio input: 10 kOhm balanced (Euroblock 3-position terminal block)
  - Network: RJ45 (PoE+/PoE power and AES67/Dante audio)
  - Power: PoE+/PoE
  - Power consumption (ISS active): <=4 W
  - Power consumption (idle): <=5 W
  - Power consumption (full output): 25.5 W
  - Dimensions: 226 x 151 x 142 mm (H x W x D)
  - Weight: 3.1 kg (6.8 lb)
  - Enclosure: Die-cast aluminium with reflex port
  - Available finishes: Black, White, Raw aluminium, 120+ RAL custom colors
