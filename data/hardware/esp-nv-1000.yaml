details: |-
  The LTD Deluxe NV-1000 offers the coveted ESP NV shape that’s designed for professional guitar players who require the versatile tones, smooth playability, and complete reliability for serious recording and touring needs. A tough-looking V shape, the NV-1000 is built for brutality with neck-thru-body construction at 25.5” scale. It pairs a mahogany body to a thin U-shaped three-piece maple neck, with Macassar Ebony fingerboard, 24 extra-jumbo stainless steel frets, and a reversed headstock. Components on the NV-1000 include matching black hardware, a Floyd Rose 1000SE double-locking tremolo bridge with stainless steel screws, precise Grover tuners, and a set of in-your-face aggressive EMG 81 (bridge) and EMG 60 (neck) active pickups.
specs: |-
  - Construction: Neck-Thru
