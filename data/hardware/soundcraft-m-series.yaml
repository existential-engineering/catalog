description: Compact mixer series (M4, M8, M12) equally suited to recording and
  live sound applications, featuring 100mm faders, integral rack mounting, and
  brushed steel side panels.
details: |-
  In a world full of cheap compact mixers, Soundcraft has achieved something
  exceptional with the M Series. Equally suited to recording and live sound
  applications, the M Series delivers a great-sounding, reliable performance,
  session after session, mix after mix.

  Even before plugging in a Soundcraft M Series mixer, the build quality is
  apparent. The brushed steel side panels can withstand a weight of 60kg
  (132 lbs) and are designed to leave the mixer with no sharp edges. Removing
  these panels reveals a robust, integral rack mounting system.

  High quality 100mm faders combine with signal and peak LEDs on every channel
  and high resolution output metering. Available in 4, 8 or 12 mono input
  channel frame sizes, all three mixers include four stereo inputs and four
  stereo returns.
