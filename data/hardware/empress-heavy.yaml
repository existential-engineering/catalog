description: An aptly named high-gain distortion pedal spanning a huge range of
  tones, from crisp, mid-driven 80s metal to scooped, modern down-tuned
  brutality. Two independent channels and a built-in noise gate make it a
  serious tool for a heavy rig.
details: |-
  The Empress Heavy packs a wide range of high-gain tones into a compact box. Its two independent channels can be voiced similarly, letting one act as a solo boost, or voiced entirely differently using the midrange control together with a three-position mid-frequency select switch. Separate Weight controls shape the low-end response of each channel, and a global hi/low EQ section fine-tunes the pedal to your particular amp and cab combination.

  An extremely responsive, hassle-free noise gate keeps operation dead silent even with obscene amounts of gain. Soft-touch switches with relay bypass and intelligent switching make the pedal easy to use, and it is true bypass when disengaged.
specs: |-
  - Controls: two channels (Heavy / Heavier), per-channel Weight, 3-band EQ with selectable mid frequency (up to 10dB boost/cut per band), global hi/low EQ, noise gate
  - 3-position mid-frequency select switch
  - Dual-channel design (rhythm/solo or two distinct voicings)
  - Adaptive noise gate (natural and aggressive settings)
  - Soft-touch relay bypass switching
  - All-analog signal path (no digital)
  - True bypass
  - Input impedance: 1M
  - Output impedance: 510 Ohm
  - Frequency response (-3dB): 35Hz - 17kHz
  - Power: 9-18V DC (negative tip), 2.1mm barrel connector
  - Power consumption: ~200mA
  - Enclosure: die-cast aluminum
  - Dimensions: 3.5" L x 4.5" W x 1.5" H (enclosure), 2" H including controls
  - Weight: 1 lb
