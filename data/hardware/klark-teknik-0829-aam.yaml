description: The DM8008 Channel Output Box is a rugged 19-inch 1U rack-mount
  chassis designed for the ULTRANET environment, providing 8 channels of
  analogue output for hotel, house of worship, casino and other professional
  audio applications. Up to 7 DM8008s may be connected in series on a single
