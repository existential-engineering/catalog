details: |-
  Digital music and sound distribution requires specialised tools to ensure the desired content arrives at the proper zones in all its sound quality. The DM8008 Channel Output Box, a rugged 19-inch 1U rack-mount chassis designed specifically for the ULTRANET environment, provides 8 channels of analogue output, making it suited to hotel, house of worship, casino and many other professional audio applications. Up to 7 DM8008s may be connected in series on a single ULTRANET cable for signal routing versatility.

  DM8008 uses Klark Teknik's proprietary ULTRANET networking, which transmits up to 16 independent channels of 24-bit audio between ULTRANET-enabled devices over CAT5 cabling with RJ45 connections. The digital signal is converted internally to analogue by the DM8008's 24-bit D/A converters, which offer a 48 kHz sample rate.

  Outputs are provided in the form of standard balanced analogue Euroblock connectors, and a switch on the rear panel selects between channels 1 to 8 or channels 9 to 16.

  Designed for shelf mounting or installation in conventional 19-inch rack systems, the DM8008 chassis houses an auto-ranging universal switch-mode power supply (100 to 240 V AC) for use anywhere in the world.
specs: |-
  - 8 channels of balanced analogue output on Euroblock connectors
  - ULTRANET transport of up to 16 independent channels of 24-bit audio over CAT5 cabling with RJ45 connections
  - Rear-panel switch selects output channels 1 to 8 or 9 to 16
  - 24-bit D/A converters, 48 kHz sample rate
  - Up to 7 units connectable in series on a single ULTRANET cable
  - 19-inch 1U rack-mount chassis, also suitable for shelf mounting
  - Auto-ranging universal switch-mode power supply, 100 to 240 V AC
