description: >-
  The Nord Stage 2 is a professional digital stage keyboard by Clavia that
  combines piano, organ, and synthesizer sections into a single performance
  instrument. Released in 2011 as the successor to the original Nord Stage, it
  features state-of-the-art sample-based pianos, B3 tonewheel organ modeling,
  and powerful analog, FM, and wavetable synthesis. It remains a coveted stage
  instrument known for its immediate, menu-free controls and distinctive red
  design.
details: |-
  The Nord Stage 2 offers three primary sound sections — Organ, Synthesizer, and Piano — that can be used simultaneously, with the ability to layer up to two sounds from each section within individual programs. Single-function control knobs provide instant visibility of all current settings without any menu diving.

  The Piano section incorporates advanced sample-based acoustic pianos and vintage electric piano emulations, with full compatibility with the Nord Piano Library for expanded sound options. The Synthesizer section provides classic analog, FM, and wavetable synthesis along with sample playback, an arpeggiator, and a master clock, and supports the Nord Sample Library for additional sonic possibilities.

  The Organ section delivers B3 tonewheel organ modeling alongside authentic Vox and Farfisa organ simulations, with an advanced rotary speaker offering slow, fast, and stop modes. Draw buttons with LED bar graphs provide visual feedback for drawbar settings.

  A comprehensive effects section includes two effect slots, delay, three speaker simulations, tube amp simulation, rotary speaker, compressor, and reverb. The instrument was available in three keyboard configurations: the HA88 and HA76 with fully weighted Hammer Action keyboards individually tuned at the Stockholm factory, and the SW73 with a 73-note Semi-Weighted Waterfall keyboard. An Extern Section allows the Nord Stage 2 to function as a master keyboard for controlling external MIDI devices.
specs: |-
  - Polyphony: 18 voices
  - Multitimbral: 2 parts
  - Synthesis: Analog, FM, and wavetable (62 waveforms)
  - LFO: Square, triangle, ramp, and sample & hold modes
  - Arpeggiator: Up, Down, Up-Down, Random with 1-4 octave range
  - Effects: Effect 1, Effect 2, Delay, 3 speaker simulations, tube amp, rotary speaker, compressor, reverb
  - Piano memory: 500MB
  - Sample memory: 380MB
  - Patch locations: 300
  - MIDI: In/Out, USB
  - Keyboard options: HA88 (88-key weighted), HA76 (76-key weighted), SW73 (73-key semi-weighted)
