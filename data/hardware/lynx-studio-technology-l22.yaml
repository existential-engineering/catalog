description: The L22 is a two-channel PCI audio interface card providing two 192
  kHz analog channels and two 96 kHz digital channels with the same audio engine
  as the LynxTWO. It uses the LynxTWO 16-channel software mixer and accepts
  optional LStream daughter cards for extra I/O.
details: |-
  The L22 offers the audio performance of a LynxTWO or Lynx Aurora converter in a two-channel format. The L22 PCI card provides two 192 kHz analog channels and two 96 kHz digital channels with the same audio engine as LynxTWO. Although it has only four channels in total, the L22 uses the LynxTWO's 16-channel software mixer and can add I/O channels using the optional LS-ADAT and LS-AES LStream daughter cards.

  The L22 is an excellent choice for mastering and broadcast facilities where quality and stability are crucial. This professional audio interface card is also intended for use in the most demanding audio recording, post-production, and measurement applications.

  Using proprietary circuit topologies and custom components in the analog stages along with the latest converter technology, the L22 achieves a 117 dB dynamic range. Most importantly, advanced noise-rejection design techniques are incorporated to maintain this performance from computer to computer.

  The onboard digital mixer is extremely flexible allowing the L22 to adapt to any studio or workstation configuration. Each of the mixer's 16 outputs is capable of mixing signals from 16 physical inputs or 16 playback tracks with 32-bit precision. Lynx device drivers are developed in-house to insure quality and robust operation, giving the card compatibility with a wide range of platforms and operating systems.

  The L22 was discontinued in Q4 2015, and its product page names the E22 as an excellent substitute in most cases.
specs: |-
  - 200kHz sample rate / 100kHz analog bandwidth
  - Two 24-bit balanced analog inputs and outputs
  - Two 192 kHz analog channels and two 96 kHz digital channels
  - +4dBu or -10dBV line levels selectable per channel pair
  - 24-bit AES3 or S/PDIF I/O with full status and subcode support
  - Non-audio digital I/O support for Dolby Digital and HDCD
  - 32-channel / 32-bit digital mixer with 16 sub outputs
  - Multiple dither algorithms per channel
  - Word, 256 Word, 13.5MHz or 27MHz clock sync
  - 117 dB dynamic range
  - Optional LS-ADAT and LS-AES LStream daughter cards add I/O channels
  - PCI expansion card: draws power from the host computer's PCI slot, no external power connector
