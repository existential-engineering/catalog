description: A Pro-Mod Plus Limited Edition seven-string Dinky with a basswood
  body in Celestial Silk gloss, graphite-reinforced caramelized maple bolt-on
  speed neck with natural satin finish, 12"-16" compound radius ebony
  fingerboard with 24 jumbo stainless steel frets and Luminlay side dots,
  Seymour Duncan HH pickup configuration (Full Shred TB-10 bridge / Alnico II
  Pro APH-1N neck) with series/parallel mini toggle, and a Gotoh Custom 510
  two-point tremolo.
details: |-
  The bolt-on caramelized maple “speed” neck has graphite reinforcement, silky-smooth hand-rubbed urethane back finish, heel-mount truss rod adjustment wheel and Luminlay® side dots. Its 12”-16” compound radius ebony fingerboard features comfortable rolled edges, 24 jumbo stainless steel frets, pearloid dot inlays and Graph Tech® TUSQ® XL nut.

  Brimming with versatility courtesy of the mini two-way toggle switch for series and parallel, this axe features an HH pickup configuration consisting of a direct mount Custom Seymour Duncan® Full Shred TB-10 bridge pickup and direct mount Seymour Duncan® Alnico II Pro APH-1N neck pickup. The bridge pickup radiates a crisp top-end with low-end articulation, while the neck pickup has incredible range with soaring highs and silky lows.

  Blending sophisticated style with assertive tone, the DK24-7 HH 2PT EB also offers premium modern features such as a five-way blade pickup switch, speed knobs for the volume (with 500K EVH® Bourns® low-friction potentiometer) and no-load tone controls, Gotoh® Custom 510 recessed tremolo bridge, locking tuners, chrome hardware and more.
