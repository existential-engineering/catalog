details: |-
  The S2 Custom 24-08 shares many of the same specifications as the S2 Custom 24 but adds a new level of versatility with its intuitive switching system. Platform specifications for this guitar include a maple top, mahogany back and neck, and rosewood fretboard with bird inlays. It boasts 24 frets, a 25” scale length Pattern Thin neck, PRS’s Patented Gen III Tremolo, and Phase III Tuners with unplated brass shafts and wing buttons.

  The Maryland, USA-made PRS TCI pickups deliver full, single-coil tones reminiscent of vintage soapbars. The pickups are paired with a 3-way toggle switch and two mini-toggle EQ switches. The dual EQ mini-toggle switches act as tuned high-pass filters when engaged (in the up position), removing shelved low-end and allowing the high frequencies through for more clarity and musical highs.

  For classic PRS feel with expanded flexibility, check out the PRS S2 Custom 24-08.
