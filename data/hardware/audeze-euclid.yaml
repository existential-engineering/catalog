description: Premium closed-back planar magnetic in-ear monitors featuring an
  18mm driver, precision-milled aluminum and carbon fiber construction, and
  superior detail retrieval for audiophiles.
details: |-
  The Euclid combines features to deliver superior detail retrieval and sonic accuracy with a soundstage and dynamic range so robust you'll forget you're listening to a closed-back in-ear. The design leverages an extra-large 18mm single planar magnetic driver without crossovers for superior frequency spectrum cohesion.

  Engineering excellence is reflected in the device's incredible 105 dB/mW efficiency and a max SPL well over 120dB, delivering the highest dynamic range category. The construction incorporates precision-milled aluminum and carbon fiber for a look that combines elegance and comfort.

  Euclid's 18mm planar magnetic drivers incorporate Audeze's patented Fazor waveguides to eliminate the phasing and distortion typical of most closed-back dynamic in-ears. The design employs patented Fluxor magnets and Uniforce voice coils for distortion reduction and enhanced sensitivity.

  Euclid's high sensitivity and low impedance make it an ideal companion to any high resolution audio player. Gold-plated MMCX terminations ensure secure, durable connections compatible with various cable options.

  Smoothly contoured with an elegant matte black finish, Euclid's light-weight and durable body is precision-milled from solid aluminum and capped with a layer of carbon fiber. The ergonomic design features a small 5mm ear port and braided cable routed behind the ear, eliminating the need for ear hooks.
specs: |-
  - Style: In-ear, closed-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
  - Magnet type: Neodymium N50
  - Diaphragm type: Ultra-thin Uniforce
  - Transducer size: 18mm
  - Maximum SPL: >120dB
  - Frequency response: 10Hz - 50kHz
  - THD: <0.1% @ 100 dB SPL
  - Sensitivity: 105 dB/1mW (at Drum Reference Point)
  - Impedance: 12 ohms
  - Max power handling: 500mW
  - Min recommended power: >50mW
  - Weight: 15g/pair without cable
  - Sound port diameter: 5mm
  - Cable terminations: Gold-plated MMCX
  - Included cables: 3.5mm single-ended and 4.4mm balanced
  - Included adapter: 1/4" TRS adapter
  - Warranty: 3 Year driver warranty, 1 Year warranty on parts
