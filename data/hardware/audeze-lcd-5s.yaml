description: Reference open-back planar magnetic headphones with a new driver
  design and SLAM technology for mastering-grade precision, redesigned earpads,
  and a 475g chassis of carbon fiber, magnesium, leather and acetate.
details: |-
  Incorporating Audeze's latest technical advancements, the LCD-5s rewards listeners with a vast, immersive soundscape and palpably physical bass response. A new driver design combines with SLAM technology to produce mastering-grade precision even better than the original LCD-5, with a more natural, lifelike frequency response.

  To present listeners the most natural frequency response, LCD-5s uses a new driver design featuring Audeze's thinnest, most responsive materials. The nano-scale Parallel Uniforce diaphragm connects to a revised chassis structure, allowing the most precise midrange tuning possible.

  LCD-5s offers powerful, extended bass response and a strikingly open soundstage, thanks to the pinpoint driver control allowed by the addition of SLAM technology.

  Sophisticated copper accents highlight the outstanding handcrafted material quality — featuring carbon fiber, magnesium, genuine leather, and polished polymer acetate.

  The smoothly flowing, curved forms of LCD-5s' new earpads are crafted to provide effortless comfort for hours of listening. This design also minimizes audible reflections to elevate sonic accuracy.
specs: |-
  - Style: Over-ear (circumaural), open-back
  - Transducer type: Planar Magnetic
  - Magnetic structure: Fluxor magnet array
  - Phase management: Fazor
