description: Skis is a discontinued 5HP dual decay envelope and VCA Eurorack module, predecessor to Skis II. Each of the two independent channels (A and B) generates a decay envelope with adjustable timing and routes it through a voltage-controlled amplifier. A CRUNCH switch activates a lo-fi MOSFET VCA circuit. A jumper selects between decay and release modes; an optional output filter can also be toggled.
details: |-
  5HP width, 35mm depth. Power: +12V <30mA, -12V <20mA. 10-pin power connector.
  Predecessor to Skis II.
