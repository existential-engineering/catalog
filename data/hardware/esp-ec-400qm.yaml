description: The LTD EC-400QM takes ESP's classic single-cutaway body shape and offers it with professional components and build quality at a price that musicians can afford. This guitar features set-thru construction at 24.75" scale for smooth access to the highest frets, and a mahogany body topped with figured quilted maple in an outstanding Vintage Burst finish, with white binding on the body, neck, and headstock.
details: |-
  The LTD EC-400QM takes ESP’s classic single-cutaway body shape and offers it with professional components and build quality at a price that musicians can afford. This guitar features set-thru construction at 24.75” scale for smooth access to the highest frets, and a mahogany body topped with figured quilted maple in an outstanding Vintage Burst finish, with white binding on the body, neck, and headstock. A three-piece mahogany neck adds a rosewood fingerboard and 22 extra-jumbo frets. The EC-400QM’s components include a TOM-style bridge and tailpiece, black hardware, LTD locking tuners, and a set of powerful, aggressive EMG 81 (bridge) and EMG 85 (neck) active pickups.
specs: |-
  - Construction: Set-Thru
  - Scale: 24.75"
  - Body: Mahogany
  - Top: Quilted Maple
  - Neck: 3Pc Mahogany
  - Fingerboard: Rosewood
  - Fingerboard Radius: 350mm
  - Finish: Vintage Burst
  - Nut Width: 42mm
  - Nut Type: Molded
  - Neck Contour: Thin U
  - Frets/Type: 22 XJ
  - Hardware Color: Black
  - Strap Button: Standard
  - Tuners: LTD Locking
  - Bridge: TOM & Tailpiece
  - Bridge PU: EMG 81 Black
  - Neck PU: EMG 85 Black
  - Electronics Layout: Volume/Volume/Tone/Toggle Switch
  - Strings: D'Addario XL110 (.010/.013/.017/.026/.036/.046)
  - Case: EC GUITAR FORM FIT CASE
