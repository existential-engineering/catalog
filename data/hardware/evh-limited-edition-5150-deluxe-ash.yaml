details: |-
  Engineered for speed, comfort and full-throttle attitude, the reimagined 5150® Series Deluxe is an iconic blast from the past that blends both throwback and modernized features.

  The modified Strat-style body features a deeper upper body curve reminiscent of the early super-Strat body styles, and hugs your frame for increased performance comfort. The ash wood exhibits snappier tone with a bright edge, as well as more treble and enhanced sustain.

  Bolt-on is a type of neck construction that joins the maple neck to the body of the guitar with screws or bolts, resulting in bright tone with more control. The quartersawn grain runs the length of the neck and as well as being visually appealing, is less susceptible to shrinking, warping or splitting. Graphite-reinforcement rods flank the truss rod for even more increased neck stability, while your fretting hand will feel right at home on the modified “C”-shape neck, which has a .790” thickness at the 3rd fret and .825” at the 12th fret.

  Not all humbuckers are created equal. Direct mount EVH Wolfgang humbuckers with Alnico 2 magnets are hotter and harness Eddie’s scorching signature lead tone that captivated the world of rock ‘n’ roll in the ‘70s and ‘80s. These pickups deliver rich harmonics, cutting highs and snarling mids in spades.

  Explore the tonal landscape with the upper bout three-way toggle switch, which in position one engages the bridge pickup for robust rhythm riffing. Position two engages both pickups, while position three’s neck pickup provides a warmer tone for leads. The volume knobs houses a 500K EVH Bourns low friction pot with treble bleed circuit for seamless swells, while the tone control with 250K EVH Bourns high friction pot will stay in place even if accidentally nudged. A kill switch on the lower bout blocks the signal from the guitar to the amp, temporarily stopping noise output as long as the switch is pressed down. This feature adds an expressive stutter, rhythmic effect to performances.

  Eddie Van Halen was the first player to popularize the innovative Floyd Rose locking tremolo, even advising Floyd Rose on his early designs to integrate round disc finger-type tuners that you would see on a cello or violin. Now universally embraced, our EVH-branded Floyd Rose bridge features our EVH logo stamped on the bridge plate, steel saddles and a solid brass block. The Floyd Rose bridge and R3 (43 mm) locking nut is a professional-grade double-locking design that secures the strings in the saddle and nut, providing ultimate tuning stability and dynamic tremolo action. Standard equipment on Eddie’s personal guitars since the early ‘90s, the EVH D-Tuna is a unique patented device that enables players to drop the E to D and back, in an instant.
