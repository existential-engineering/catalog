details: |-
  Loaded with custom Ashdown drivers for exceptional attack, clarity and low-end performance, Rootmaster cabinets are engineered for performance and reliability. Rootmaster cabs are now sealed, creating an infinite baffle for a smoother low-end response and faster attack. Solid construction is paired with hard-wearing vinyl coverings, protective corners, tough grille cloths and vibration-reducing rubber feet. Rated at 450W into 4 ohms, the RM 414T brings the classic 4x10 inch sound to the forefront with added top-end definition thanks to four custom Ashdown 10 inch drivers and a HF tweeter. Supplied with casters and caster plates.
specs: |-
  - Power Output: 450 Watts
  - Speaker Configuration: 4 x 10 inch + HF tweeter
  - Frequency Response: 60Hz - 20kHz
  - Impedance: 4 Ohms
  - SPL: 98dB 1W @ 1m
  - H x W x D: 603 x 603 x 335 mm
  - Weight: 36 kg
