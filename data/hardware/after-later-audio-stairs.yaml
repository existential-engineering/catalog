description: A stereo ladder filter offering HP, BP, LP2, and LP4 outputs for
  each side, with a bias knob that can create detuning, glitchy, and warbly
  sounds.
details: |-
  Our first ladder filter, and it's in stereo. You'll get HP, BP. LP2, and LP4 outputs for each side. Please read below on the HP and BP outputs as they are a bit temperamental. Along with all of the great traditional sounds of a ladder filter, we've added a bias knob which starves ladder transistors of bias current. This can create some fun detuning, glitchy, and warbly sounds. It sounds best with the resonance turned up a bit. Turning the bias will mess with the cutoff frequency and resonance settings so it takes some knob tweaking to master it. There is decent volt/octave tracking for about 3 octaves. The HP and BP are possible due to pole mixing. When combined with the level control and the resonance it can lead to some atypical behaviors. So keeping the resonance low and you'll need to manage the level control to get a typical HP and BP responses.
