description: The HV-316 is a 1U rack mount microphone preamplifier carrying 8 or
  16 channels of the Millennia HV-3 circuit with a Dante network output as
  standard. Gain, pad, phantom power and metering are set remotely over Ethernet
  from the Ælogic application for macOS and Windows.
details: |-
  The HV-316 puts 8 or 16 channels of the HV-3 microphone preamplifier into a road-hardened 1U aluminum chassis of about 10 pounds, with a billet aluminum laser etched front panel. The gain topology is the matched discrete-octet transistor double-balanced circuit used across the HV-3 range, with +34 dBu of input headroom with the pad engaged, all channels matched to 0.08 dB, and a fully balanced audio path specified under 10 PPM THD.

  Conversion uses paralleled next-generation AKM converters feeding a Dante network output, with MADI and analog output boards offered as options. Dante runs over dual RJ-45 ports at 1 Gbps in redundant or switched mode and supports sample rates from 44.1 kHz to 192 kHz at a minimum latency of 250 microseconds. The optional analog output stage is laser-trimmed and FET-based and is rated to drive 1000 foot (300 m) cable runs.

  Up to 256 channels can be controlled at once over conventional Ethernet. The third-generation Ælogic application for macOS and Windows provides high-definition meters, channel grouping and linking, scene management and temperature monitoring, and addresses both the HV-316 and the HV-3R on the same network.

  Powering is either worldwide 80 to 264 V AC or 12 V DC for battery operation, with a redundant supply for fail-safe operation and a power supply rated at 650,000 hours MTBF. The chassis is designed for continuous operation to 65 C (150 F) and carries RF pi filter shielding on its analog and digital feeds. The HV-316-8 is a short-loaded 8 channel version that can be upgraded to 16 channels at the factory.
specs: |-
  - Minimum Gain: 1 dB
  - Maximum Gain (1 dB per step): 64 dB
  - Attenuator Pad: -20 dB
  - Frequency Response (analog output option) (+0 / -3 dB): sub 8 Hz to beyond 200 kHz
  - Noise (60 dBu Gain, 10 Hz - 30 kHz, Inputs common): -130 dB EIN
  - Total Harmonic Distortion + Noise (35 dB Gain): < .005% (<.001% Typ.)
  - Intermodulation Distortion (50 Hz & 7 kHz, 35 dB Gain, 0 dBFS): < .0009%
  - Phase Response (35 dB Gain, 50 Hz - 20 kHz bandwidth, 0 dBFS): < 2 degrees deviation
  - Common Mode Rejection Ratio (35 dB Gain, 10 Hz - 20 kHz bandwidth, 100 mV C.M.): > 65 dB, Typ > 85 dB
  - Slew Rate (35 dB Gain): > 25 Volts per microsecond
  - Maximum Input Level (20 Hz - 40 kHz): +34 dBu (pad in)
  - Maximum Output Level (20 Hz - 40 kHz): +22 dBu (analog output option)
  - Phantom Input Impedance (1 kHz): 6,750 ohms
  - Output Impedance: 24.3 Ohms (analog output option)
  - Phantom Powering: +48 V dc, +/- 2 V dc, 15 ma per channel in reserve
  - Power Consumption: 100 watts maximum, AC universal 80-264V 47-63 Hz, DC 12V
  - Dimensions/Shipping Weight: 19 in W x 1.75 in H x 16 in D, 10 lbs. (16ch), 9 lbs (8ch)
  - Dante Physical Layer: Ethernet
  - Dante Connectors: Dual RJ-45 (Primary / Secondary)
  - Dante Cable Quality: CAT-5e or better
  - Dante Transmission Speed: 1Gbps
  - Dante Supported Sample Rates: 44.1kHz, 48kHz, 88.2kHz, 96kHz, 176.4kHz, 192kHz
  - Minimum Dante Latency: 250 µS
  - Dante Supported Modes: Redundant / Switched
  - AES67 Support: Planned (Dante embedded)
  - Certifications: FCC CFR 47 Part 15 Subpart B Class A, ICES-03 Issue 6 (Canada), ANSI C63.4-2014, EN 55032:2015, EN 55035:2017, EN 61000-3-2:2014, EN 61000-3-3:2013
  - Compliance: RoHS 2011/65/EU (and delegated directive (EU) 2015/863), WEEE 2012/19/EU, REACH
  - Environmental: -10 to +65 C / +15 to +150 F (fans enabled), -10 to +45 C / +15 to +115 F (fans disabled), 10% to 80% RH
  - Maximum Altitude: 5,000 meters
