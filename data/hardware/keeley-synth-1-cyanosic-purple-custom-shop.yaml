description: Custom Shop colourway of the Synth-1, a guitar-triggered single
  note synth wave generator with fuzz voicing, bandpass filter, reverse attack
  swell, chaos switch and expression control.
details: |-
  The Synth-1 is a guitar-triggered single note wave generator that produces fuzzed-out synth tones. A Filter control sets the tone of the generated wave, an Attack knob sets the lead-in time or swell of the note, and a Blend control sets how much of the guitar's natural tone remains against the synth wave.

  A foot-operated wave selector changes wave modes while playing, and a Chaos switch alters the triggering behaviour and octaves. The reverse attack produces volume swell effects in the manner of a slow gear, and the range runs from those swells through to sustained, harmonically unstable fuzz textures.

  A side-mounted expression jack gives TRS control of the Filter, so an expression pedal sweeps it like a wah. This is the Cyanosic Purple Custom Shop colourway. The pedal is true bypass, has top-mounted jacks, and is designed and made in the USA.
specs: |-
  - Guitar-triggered single note synth wave generator
  - Bandpass filter control shaping the tone of the generated wave
  - Reverse attack control for volume swell effects
  - Chaos switch altering triggering and octaves
  - Footswitchable wave selector
  - Blend control between the natural guitar signal and the wave generator
  - Side-mounted expression jack for TRS control of the filter
  - Top-mounted jacks
  - True bypass
  - Designed and made in the USA
