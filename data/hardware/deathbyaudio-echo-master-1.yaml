details: |-
  Designed for vocals, the Echo Master is a lo-fi, analog tape-style delay unit that can transform your voice into a chaotic realm of noise and feedback. It is not just a delay unit, however: it utilizes matched Bourns transformers on the input to create a vibrant-sounding and feedback-minimizing preamp to bring you phenomenal vocal quality before you even hit the PA.

  This multitasking analog tape-style echo delivers lush vocals shrouded in dusky analog repeats onstage, and is invaluable in the studio while recording, reamping, and mixing. It's carefully voiced to avoid shrieking monitor feedback, includes a robust transformer-balanced mic preamp with sturdy Neutrik XLR jacks, and is equipped with an impedance-matching effects loop so you can patch other pedals into your vocal chain. An optional mic clip backplate puts the controls within reach during performances so you can tweak the delay effect as you sing. Simply plug your microphone into the mic input, connect the sound engineer's vocal line to the mic output, and plug your pedals into the effects loop. In the studio, use it with acoustic instrument and percussion mics to commit wild new sounds to tape. A 9 VDC power supply (US or EU) is included.

  Time controls the delay time, labeled in milliseconds; in the Red Zone the delay chip is pushed to the extreme and the signal decreases in fidelity as time increases. F-Back controls the number of repeats, from one to an infinite wall of oscillation. Mix is calibrated to preserve intelligibility, sweeping from fully dry to a 50/50 wet/dry blend. An internal FBack control sets the maximum level of the external feedback.

  The Send and Return effects loop sits before the delay line, so you can plug the Send jack into additional effects and back into the Return jack to affect your dry vocals before they enter the Echo Master. The Echo Master can also be purchased with a backplate that mounts to your mic stand, putting the pedal within hands reach to maximize live performance tweak-ability (cords, microphone, and stand not included).
