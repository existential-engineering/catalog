description: >-
  An early menu-driven analog synthesizer from Crumar featuring six voices with dual DCOs,
  99 onboard patches, and the ability to layer two sounds simultaneously.
details: |-
  Released in 1985, the Crumar Bit 99 was among the first synthesizers to abandon traditional knobs and sliders in favor of menu-driven parameter editing. This made it a harbinger of the interface philosophy that would come to define mid-to-late 1980s synthesizer design, for better or worse.

  Under the hood, the Bit 99 packed genuine analog muscle with two DCOs per voice across six voices of polyphony. A dual-layer mode allowed two sounds to be stacked simultaneously, though this halved the available polyphony to three notes. The filter section featured a VCF with cutoff, resonance, keyboard tracking, and an invert function, each with its own ADSR envelope. Two assignable LFOs could modulate the VCA, VCF, or either DCO independently.

  The 61-key keyboard was full-size and slightly weighted, giving it a more substantial feel than many competitors in its price range. Memory held 99 patches, with slots 1-75 dedicated to single programs and 76-99 reserved for split and double modes. A tape save/load function provided backup storage. MIDI compatibility kept it connected to the expanding world of digital music production.

  A rackmount variant called the Bit-01 was subsequently released. The Bit 99 found fans in the electronic music scene, with 808 State among its notable users, and its sonic character has been compared to the sounds heard on Orbital's "In-sides" album.
specs: |-
  - Polyphony: 6 voices (3 in dual-layer mode)
  - Oscillators: 2 DCOs per voice
  - LFOs: 2 assignable (VCA, VCF, DCO1, DCO2)
  - Filter: VCF with cutoff, resonance, tracking, invert, ADSR
  - VCA: ADSR envelope
  - Keyboard: 61 full-size keys, slightly weighted
  - Memory: 99 patches (75 single, 24 split/double)
  - Control: MIDI
  - Storage: Tape save/load
