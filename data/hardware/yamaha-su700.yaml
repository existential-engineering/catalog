description: >-
  Yamaha's all-in-one music production studio combining a professional-grade sampler with a
  versatile sequencer, 64-voice polyphony, and hands-on real-time controls for electronic music.
details: |-
  The SU700 positions itself as a complete music production workstation aimed at DJs, producers, and electronic musicians. Its sampling section handles professional studio-quality recording with both analog and digital inputs, supporting 16-bit and 8-bit linear sampling in stereo across multiple sample rates up to 44.1 kHz analog or 48 kHz digital.

  The built-in sequencer offers 42 tracks across 20 songs, suitable for both meticulous step programming and spontaneous live performance recording. Auto beat-matching and auto time-slicing capabilities streamline the process of working with rhythmic material, while a groove function adds humanized feel to programmed patterns.

  Twelve knobs provide immediate access to key edit parameters for real-time sound manipulation, complemented by a ribbon controller for expressive performance gestures. The effects section delivers 43 effect types with up to three running simultaneously. Memory starts at 4 MB RAM but can be expanded to 68 MB for extended sampling time. The SU700 has been used by Speedy J.
specs: |-
  - Polyphony: 64 voices
  - Sampling: 16-bit/8-bit linear, stereo
  - Sample Rates: 44.1 kHz, 22.05 kHz, 11.025 kHz (analog); 48 kHz, 32 kHz (digital)
  - Memory: 4 MB RAM (expandable to 68 MB)
  - Sample Time: 22.3 sec (44.1 kHz stereo 16-bit) to 357.2 sec (11.025 kHz mono 8-bit)
  - Sequencer: 42 tracks, 20 songs
  - Pads: 12 (8 velocity-sensitive)
  - Filters: Lowpass, highpass, bandpass resonant
  - Effects: 43 types (3 simultaneous)
  - Storage: Floppy disk drive
  - Control: MIDI, MTC
releaseDate: "1998"
releaseDateYearOnly: true
