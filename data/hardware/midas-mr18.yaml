name: MR18
manufacturer: midas
primaryCategory: mixer
categories:
  - audio-interface
  - rack-mount
url: "https://www.midasconsoles.com/en/products/0605-AAF"
description: 18-input rack-mountable digital mixer for iPad and Android tablets,
  featuring 16 award-winning Midas PRO microphone preamplifiers on
  industry-standard XLR/TRS combo connectors with locking latches, an 18 x 18
  channel bidirectional USB 2.0 audio interface, and a built-in tri-mode WiFi
  router (Access Point, Client, or wired LAN). The MR18 provides 6 aux buses
  plus main L/R outputs with inserts, full dynamics processing, 6-band
  parametric or 31-band graphic EQ, 4 onboard M32-derived true-stereo effects
  engines, M AIR Gain Sharing automixing for up to 16 microphones, 40-bit
  floating-point DSP, and a 100-band Real Time Analyzer for all channel and bus
  EQs. Outputs include 6 XLR aux outputs, 2 XLR main outputs, and a headphone
  connector. Connectivity includes MIDI In/Out, Ethernet (Cat 5e, max 100 m),
  and 16-channel ULTRANET for P-16 personal monitor distribution. Rack ears and
  protection bumpers are included. Free M AIR MIX (iOS, Android) and M AIR EDIT
  (PC/Mac/Linux) apps provide remote control over Ethernet, LAN, or WiFi.
  Auto-ranging universal switch-mode power supply.
details: |-
  Compact rack-mount sibling of the Midas M32 console, with the same Midas PRO microphone preamplifier design, M32 FX engines, and channel processing (low-cut filter, 4-band parametric EQ, gate, compressor with Expert/Simple modes). Controlled entirely via free M AIR MIX (iOS/Android) and M AIR EDIT (PC/Mac/Linux) apps over Ethernet, LAN, or built-in WiFi. The included effects library models legendary studio processors including the Lexicon 480L and PCM70, EMT250, Quantec QRS reverbs, Teletronix LA-2A, Urei 1176LN, Fairchild 670, and Pultec EQP-1a. Future firmware updates including new FX 'Plug Ins' are downloadable from midasconsoles.com free of charge.
specs: |-
  - Inputs: 16 Midas PRO microphone preamplifiers on XLR/TRS combo connectors with locking latches
  - Outputs: 6 XLR aux outputs, 2 XLR main L/R outputs, headphone connector
  - USB Audio Interface: 18 x 18 channel, bidirectional, USB 2.0
  - DSP: 40-bit floating-point
  - Buses: 6 aux buses plus main L/R, with inserts, full dynamics, and 6-band parametric or 31-band graphic EQ
  - Effects: 4 onboard M32-derived true-stereo (8 mono) effects engines
  - Auto-Mixing: M AIR Gain Sharing (Dugan-style) for up to 16 microphones
  - Real Time Analyzer: 100-band RTA on all channel and bus EQs
  - WiFi Router: Built-in tri-mode (Access Point, Client, or wired LAN)
  - Network: Ethernet (Cat 5e, max. 100 m)
  - ULTRANET: 16 channels for P-16 Personal Monitoring System
  - MIDI: In/Out (external controllers, Mackie Control protocol, or USB MIDI interface)
  - Power Supply: Auto-ranging universal switch-mode
  - Form Factor: Rack-mountable (rack ears and protection bumpers included)
