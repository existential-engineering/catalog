description: A hand-built UK guitar head delivering 20 watts of pure valve tone
  from 2 x 6V6, offering rich harmonics and touch-sensitive dynamics in a
  compact format. With Gain, Bass, Middle, Treble, and Master controls, plus
  Dark/Light voicing, a foot-switchable Boost, and a rear channel-link, it
  shifts from shimmering cleans to saturated drive. A built-in load allows
  silent practice or recording, making it a versatile blend of boutique
  craftsmanship and modern practicality, perfect for players who demand
  character without excess volume.
