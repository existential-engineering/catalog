description: A microcontroller-based digital VCO in a 2HP form factor, offering
  pitch CV input, filtered and unfiltered PWM waveform outputs, and waveform
  selection.
details: |-
  A VCO, albeit a microcontroller-based one, in 2HP? Yes indeed. Obviously, given the limitations of the 2HP form factor you're not going to find huge amounts of functionality - there's an input for pitch CV and an output for the PWM filtered waveform, plus pots for pitch CV attenuation and waveform selection. This iteration adds an output jack for the unfiltered PWM signal, which is more useful than it sounds. The PWM output is a 5V square wave which means it's extremely amenable to feeding into things like logic modules, clock dividers, filters (even something as simple as a 1-pole RC filter) and suchlike to create even weirder sounds or rhythms. Despite the 2HP form-factor I've decided to stick with a through-hole microcontroller - experience has shown me that SMD microcontrollers aren't a great idea if you're a tinkerer or flash the firmware a lot (in fact, they're a massive pain in the backside to program in-situ). Most of the other components are surface-mount in order to keep costs down whilst still allowing repairability

  The oscillator has a range of around 5 octaves, but be aware that the V/oct tracking will not be perfect - this is due to the limitations of using the internal clock on the microcontroller plus a 10-bit DAC. You can get round this if you're willing to tinker with the firmware. Works best with a sequencer, and as supplied the base frequency is around 32Hz. The firmware is made available under a permissive license and you are positively encouraged to do interesting things with it. The same firmware will run without modification on the original TinyDVCO

  The firmware source can be found here: https://github.com/yorkmodular/tinydvco 🔗
