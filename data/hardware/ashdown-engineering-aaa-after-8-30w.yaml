name: AAA - After 8 30w
manufacturer: ashdown-engineering
primaryCategory: bass-amplifier
url: https://ashdownmusic.com/products/aaa-after-8-30w
description: 'A 30-watt bass practice combo with a single 8" Ashdown speaker,
  part of the AAA range. It retains the core AAA features in a compact package:
  High and Low impedance inputs for active or passive basses, Bass/Middle/Treble
  EQ, a line input with mix control, a headphone output, an extension speaker
  output that mutes the internal speaker, and an AppTek socket for iOS amp-sim
  integration.'
details: |-
  30-watt bass practice combo with a single 8" Ashdown speaker. High and Low impedance inputs suit active or passive basses. Bass/Middle/Treble EQ. Line input with mix control for playing along, headphone connection for silent practice, and an extension speaker output that mutes the internal speaker. AppTek socket (4-pole mini jack) connects a smartphone or tablet for amp-sim and FX apps, including Ashdown's ABM Pre App (Sub Harmonic, Tube Drive, Compression, 7-band EQ) via Agile Partners Amp Kit.
specs: |-
  - Power output: 30 watts into 4 Ohms
  - Speaker configuration: 1 x 8"
  - EQ: Bass, Middle and Treble
  - High and Low impedance inputs
  - Line input with mix control
  - Headphone output
  - Extension speaker output (mutes internal speaker)
  - AppTek socket (iOS amp-sim integration)
  - H x W x D: 380 x 365 x 300 mm
  - Weight: 10 kg
