url: https://www.adam-audio.com/en/t-series/t10s/
description: The T10S is a powerful yet compact active subwoofer, designed to
  extend the bass response of ADAM Audio's T5V and T7V nearfield monitors.
details: |-
  The T10S is a powerful yet compact active subwoofer engineered to extend the bass response of nearfield studio monitors. Built around a down-firing 10" woofer with a 1.5" voice coil and paper cone, it is the dedicated low-end companion for ADAM Audio's T Series and an optimized match for the T5V and T7V.

  A 130 W RMS Class-D amplifier drives the system to a maximum SPL of at least 104 dB at 1 m, with a frequency response that reaches down to 28 Hz and tops out at 120 Hz (-6 dB). THD above 60 Hz stays at 0.6%, and standby kicks in automatically after 15 minutes of inactivity to conserve power.

  An internal adjustable two-channel crossover routes the bass signal between the satellites and the sub for proper system calibration. Crossover frequency can be set to 80 Hz, 120 Hz, or bypassed entirely, and phase can be inverted between 0° and 180° to align with the rest of the monitoring system.

  Rear-panel I/O is comprehensive for a compact sub: balanced XLR and unbalanced RCA inputs accept +4 dBu / -10 dBV signals, with matching XLR and RCA outputs to feed the satellite monitors. The cabinet measures 15.4" H × 12.5" W × 16.25" D and weighs 27 lb (12.2 kg), placing it among the most compact subwoofers in its class for easy studio integration.

  Acoustic performance benefits from four high-grade flexible rubber feet that prevent floor excitation and a rear-facing bass reflex port that optimizes airflow. The T10S ships with a 5-year warranty (2 years standard plus 3 years optional with registration).
specs: |-
  - Active subwoofer for T Series and nearfield monitoring systems
  - 10" (260 mm) down-firing woofer
  - 1.5" (38 mm) voice coil
  - Paper cone material
  - Frequency response: 28 Hz – 120 Hz (-6 dB)
  - THD > 60 Hz: 0.6%
  - Max SPL at 1 m: ≥104 dB
  - Amplifier type: Class-D
  - Amplifier power RMS: 130 W
  - Max power consumption: 190 W
  - Crossover frequency: 80 Hz / 120 Hz / Bypass
  - Phase inversion: 0° / 180°
  - Input sensitivity: +4 dBu / -10 dBV
  - Analog inputs: XLR and RCA
  - Analog outputs: XLR and RCA
  - Rear-facing bass reflex port
  - Four high-grade flexible rubber feet
  - Standby: activates after 15 minutes
  - Dimensions (H x W x D): 15.4" x 12.5" x 16.25"
  - Weight: 27 lb (12.2 kg)
  - Warranty: 5 years
