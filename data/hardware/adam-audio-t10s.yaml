description: The T10S is a powerful yet compact active subwoofer, designed to extend the bass response of ADAM Audio’s T5V and T7V nearfield monitors.
details: |-
  The T10S is a powerful yet compact active subwoofer, designed to extend the bass response of any nearfield studio monitor. The subwoofer's performance, features and connectivity are engineered specifically to complement ADAM Audio's T5V and T7V speakers.

  Equipped with a down-firing 10˝ woofer and a 130 W Class-D amplifier, the T10S' frequency response ranges from 28 Hz to 120 Hz and offers an impressive max. SPL of 104 dB. An internal adjustable two-channel crossover allows calibration of the bass signal and provides optimal performance of the total system. The options at the rear of the subwoofer allow for varied adjustments which compensate for room acoustics or they offer more control for satellites attached.

  While reflecting the T Series design language, the T10S is one of the most compact subwoofers in its class, which allows it to be easily integrated in any studio environment. The acoustic performance was optimized by four high grade flexible rubber feet that prevent the sound from exciting the floor and a spacious rear facing bass reflex port for an optimized airflow.

  Typically, the T10S subwoofer is an addition to a stereo monitoring system with a stereo signal source and two active speakers. Here, the T10S is connected as a link between the signal source and your speakers. On the rear panel of the T10S, a two-channel setup of XLR and RCA connectors receives and feeds balanced signals of +4 dBu and unbalanced -10 dBV nominal input levels, respectively.

  The subwoofer has no power switch and powers on as soon as it is connected to the mains, entering standby mode indicated by a red front LED; it returns to standby automatically after 15 minutes with no incoming signal. Because it accepts AC mains voltages from 100 V to 240 V at 50 and 60 Hz, no voltage selector setting is required.
specs: |-
  - 10″ down-firing subwoofer driver, paper cone
  - Basket diameter: 10″ (260 mm)
  - Voice coil diameter: 1.5″ (38 mm)
  - Amplification type: PWM
  - Amp. power RMS: 130 W
  - Frequency response: 28 Hz – 120 Hz (-6 dB)
  - THD > 60 Hz: 0.6 %
  - Max. SPL at 1 m (hemisphere): ≥104 dB
  - Crossover frequency: 80 Hz / 120 Hz / Bypass
  - Phase inversion: 0° / 180°
  - Input sensitivity: +4 dBu / -10 dBV
  - Analog inputs: XLR / RCA
  - Analog outputs: XLR / RCA
  - Panel: rear
  - Bypass: yes, via footswitch (not included)
  - Standby: yes, activates after 15 minutes with no incoming signal
  - Max. power consumption: 190 W
  - Accepts AC mains voltages from 100 V to 240 V, at 50 and 60 Hz
  - Weight: 27 lb (12.2 kg)
  - Height x Width x Depth: 15.4″ (390 mm) x 12.5″ (318 mm) x 16.25″ (413 mm)
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
  - Delivery contents: power cord, Quick Start Guide, Welcome Card
