description: A solid-state/tube hybrid dual-channel compressor/limiter with a
  Hard Threshold control, variable sidechain high-pass filter, continuously
  variable Mix control for parallel compression, and switchable stereo link or
  dual-mono operation.
details: |-
  The NAIL is a solid-state/tube hybrid dual-channel compressor/limiter
  designed for tracking, mixing, and mastering. It combines tube circuitry with
  solid-state technology to deliver one of the most musical yet transparent
  compressors ever manufactured.

  A key differentiator is the Hard Threshold control, which separates the
  amount of compression from the point at which compression begins — offering
  precision rarely found in analog compressors. A variable high-pass filter
  (Off, 8Hz–250Hz) on the sidechain allows the low end to pass through
  uncompressed, preserving bass weight while controlling dynamics.

  The NAIL features a continuously variable Mix control for parallel compression
  blending, allowing the dry signal to be blended with the compressed output
  without external routing. Attack and Release controls respond dynamically to
  program material, and the continuously self-adjusting compression ratio
  eliminates the need for a traditional ratio control.

  Switchable stereo link or dual-mono operation makes it suitable for both
  stereo bus work and independent dual-channel processing. An LED metering
  ladder is switchable between gain reduction and output level display, and an
  In/Out toggle enables quick A/B comparison.

  The unit is 2U rackmount, handmade in the USA, and has received the Mix
  Magazine ‘Mix Certified Hit’ designation. Carries a full 1-year warranty.
specs: |-
  - Configuration: 2U rackmount, dual-channel
  - Design: Solid state/tube hybrid
  - Frequency Response: 3Hz–50kHz
  - Noise Floor: -89dBu
  - Maximum Input Level: +20dBu clipping point
  - Channel Isolation: 90dB @ 1kHz
  - Compression Ratio: Variable, continuously self-adjusting
  - Sidechain Filter Range: Off, 8Hz to 250Hz
  - Power Supply: 120/230VAC, 23 watts
  - Dimensions: 19" W × 3.5" H × 10" D (2U)
  - Weight: 10 lbs
  - Handmade in the USA
  - 1-year warranty
