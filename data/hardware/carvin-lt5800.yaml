  - Specifications
  - Video/Reviews
  - The LT5800 5760W 2 Channel PFC Power Amplifier is a lightweight power amp which provides maximum headroom with pure amplification of the original signal source to extreme levels, covering all frequencies without added color. The LT5800 is designed for the largest events with multiple subs, and features a single space 1U frame, is 2 ohms capable, and includes PFC Power Factor Correction, which is internationally recognized as the foremost self-regulating power supply for high-end amplifiers. The LT5800 has exceptional headroom with lower power requirements than amps with a traditional power supply. Other models available in the LT Series are the LT2000 2010W 2 Channel PFC Power Amplifier, and the LT5204 4 Channel 5150W PFC Power Amplifier. The LT5800 2ch model delivers 1010W RMS at 8 ohms, 1690W at 4 ohms and 2880W at 2 ohms from each channel (5760W 4 ohms bridged).
  - » Power: 1010 WRMS @ 8ohms, 1690W @ 4ohms, 2880W @ 2ohms, 5760W Bridged @ 4ohms » 70V Distribution System: 2300W » Active PFC Power Factor Correction » Space saving lightweight 1-U frames » High slew rate class D design » Natural, pure-state amplification » 2 ohm operation, 4 ohm bridged design » For 70V distribution systems » Soft-Start 100-240VAC 50-60Hz » PowerCON AC connector » Front to rear cooling system » Protect and Limiter circuits » IEC60065 compliant, CB certified » Up to 12 LT amplifiers in one 12U rack case » Net Weight: 22lbs » 1 Year Warranty
  - "The bingo hall we tried last weekend with the LT5204 amp and the amplifier worked great for our test. The bingo will open in a month, we installed (36) in-ceiling spks in 4-zones we will be finished next week. Another project was a pro golf country club we installed spks in 4-zones with three zones has outdoor spks mounted on trees all operating in 70v line. They had a pro golf tournament last weekend and used the system with wireless microphones for the first time and was amazed. So the new amplifier pass the test for me. Thank you for a great product…" Don S. - TX
