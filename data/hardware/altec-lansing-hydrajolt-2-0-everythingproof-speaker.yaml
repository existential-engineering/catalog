details: |-
  Altec Lansing HydraJolt 2.0 EVERYTHINGPROOF Speaker

  Take your music anywhere with the Altec Lansing HydraJolt 2.0 EVERYTHINGPROOF Speaker. Built for outdoor adventures, this rugged Bluetooth speaker is IP67 waterproof, dustproof, shockproof, and floats in water. Mount it, clip it, or stick it to most metal surfaces using the included speaker mount, carabiner, and built-in magnet. Enjoy powerful sound with up to 16 hours of playtime and create the ultimate listening experience by connecting 100+ Hydra 2.0 speakers together using Party Sync technology. HyperEdge LED light modes add vibrant visual effects, while the built-in USB-A smartphone charger keeps your devices powered on the go. With a 100-foot Bluetooth wireless range and USB-C quick charging, the HydraJolt 2.0 is the perfect companion for the beach, camping, hiking, boating, tailgating, and everyday adventures.
