  - #MountIT, #ClipIT, #StickIT – Included Speaker Mount, Carabiner and Built-In Magnet (stick to most metal surfaces)
  - Built-in magnet, speaker mount, and carabiner
  - Party Sync connects 100+ Hydra 2.0 speakers
  - HyperEdge LED light modes
