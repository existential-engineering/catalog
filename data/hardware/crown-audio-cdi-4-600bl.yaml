name: CDi 4|600BL
manufacturer: crown-audio
primaryCategory: power-amp
categories:
  - amplifier
  - rack-mount
url: https://www.crownaudio.com/en-US/products/cdi-4-600bl
description: A 4-channel professional power amplifier delivering 600W per output
  channel, combining analog and BLU link digital audio inputs. Part of Crown's
  CDi DriveCore series for medium-sized installations such as cinemas, houses of
  worship, bars, and lounges.
details: |-
  The CDi 4|600BL is a 4-channel professional power amplifier delivering 600W per output channel and combining analog and BLU link digital audio inputs. Designed for medium-sized installations including cinemas, houses of worship, bars, and lounges, it incorporates technology from Crown's flagship DriveCore Install series.

  BLU link capability enables digital audio distribution over HARMAN's 256-channel digital audio bus, and network control and monitoring are available via HiQnet Audio Architect software. High-level onboard DSP and a front-panel interface allow direct configuration of routing, EQ, crossover, delays, and limiting.

  The amplifier supports driving up to 100Vrms speaker loads without external transformers and ships with pre-loaded JBL speaker tunings for faster installs. DriveCore Technology reduces component count, improving reliability and audio fidelity.
specs: |-
  - 4 channels
  - 600W per channel @ 4Ω
  - Dual mode: 300W @ 2Ω, 600W @ 4Ω, 600W @ 8Ω, 300W @ 16Ω, 600W @ 70Vrms, 600W @ 100Vrms
  - Bridge mono: 600W @ 4Ω, 1200W @ 8Ω, 1200W @ 16Ω, 1200W @ 140Vrms, 1200W @ 200Vrms
  - Sensitivity: 0.7V RMS (full rated power @ 8Ω)
  - Signal-to-Noise Ratio: >104dB
  - THD: 0.35% (full rated power, 20Hz–20kHz)
  - Damping Factor: >1000 (20Hz–100Hz)
  - Frequency Response: ±0.25dB (8Ω, 20Hz–20kHz)
  - Crosstalk: >80dB (below rated power, 20Hz–1kHz)
  - Input Impedance: 20kΩ balanced / 10kΩ unbalanced
  - BLU link: Yes (256-channel digital audio bus)
  - Onboard DSP: parametric EQ, crossover, LevelMAX limiter
  - Network control via HiQnet Audio Architect
  - Direct Drive 70/100Vrms output (no transformer required)
  - Pre-loaded JBL speaker tunings
  - Dimensions: 19" W × 3.5" H × 12.25" D (excluding 1.3" front panel protrusion)
  - Weight: 16.3 lbs (7.39 kg)
  - Power: 15A IEC connector, 100–240V AC
