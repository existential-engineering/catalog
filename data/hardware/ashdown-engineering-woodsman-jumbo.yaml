url: https://ashdownmusic.com/products/woodsman-jumbo
description: Woodsman Jumbo 65W acoustic combo. The Woodsman builds on a long
  legacy of acoustic amp design to deliver class-leading standards of vocal and
  instrument performance, combining a traditional wooden cabinet with modern
  features for live performance and recording.
details: |-
  Designed for the new wave of acoustic performers, the Woodsman family combines traditional, beautiful wooden cabinets with modern features for live performance and recording. With inputs for microphones and acoustic guitar, the amps are ideal for duos or solo singer/guitar players, delivering pure, clear acoustic tone with performance tuning features including phase reverse and feedback-eliminating notch filters. Each model features a custom-designed 8" Ashdown driver. The flagship 65W Jumbo adds yet more flexible features, including a full 3-band EQ for the Mic Channel, enhanced reverb algorithms (including Hall and Spring settings), and a transparent effects loop for use with external devices. All models include an Aux In jack for connecting an MP3 player.
specs: |-
  - Power output: 65W
  - Speaker configuration: 2 x 8"
  - Frequency response: -3dB @ 28Hz and 28kHz
  - High Instrument Input: Impedance 10k Ohms, input range 300mV - 20V p-p
  - Low Instrument Input: Impedance 3.9M Ohms, input range 150mV - 10V p-p
  - Line Input: 10k Ohms, Level 0dBu
  - Line Output: 4.7k Ohms, Level 0dBu
  - Signal to noise: greater than 80dB (EQ flat)
  - EQ: +/-15dB @ 100Hz and 10kHz
  - Effects send: 10k Ohms, Level 0dBu
  - Distortion: less than 0.8% THD
  - H x W x D: 326 x 468 x 225 mm (H: +15mm for feet)
  - Weight: 12.18 kg
