url: https://lexiconpro.com/en-US/products/i-o-fw810s
description: 10 input / 12 output FireWire audio interface with dbx high-voltage
  mic preamps, dbx Type IV conversion, and bundled Pantheon II reverb.
specs: |-
  - 10 input / 12 output FireWire 400 audio interface
  - 24-bit recording at sample rates from 44.1 kHz to 96 kHz
  - 8 dbx high-voltage mic preamps with dbx Type IV conversion
  - 8 combo XLR/TRS analog inputs (front 2 switchable for mic/line/instrument)
  - 8 balanced TRS line outputs (7.1 surround capable)
  - Stereo S/PDIF digital I/O on RCA
  - MIDI In and Out on 5-pin DIN
  - Zero-latency monitoring
  - Bundled software: Steinberg Cubase LE 4, Toontrack EZ Drummer Lite, Lexicon Pantheon II reverb plug-in, XILS 3 SE virtual synth
