description: The Iron Cobra 600 series hi-hat stand (HH605) offers functionality
  and stability reminiscent of the highly regarded Iron Cobra 900 series. The
  HH605 is equipped with the new Spring Seat and Swing Lock Clutch which enhance
  the sound of hi-hat cymbals.
details: |-
  Swing Lock Clutch (US.PAT.NO.8604325): This allows the top hi-hat cymbal to float more freely, maximizing the natural resonance of the cymbals.

  Swivel Foot: Since the foot pedal can be rotated around the tripod base, the Swivel Foot feature greatly expands floor space and set-up flexibility.

  Footboard Angle Adjustment: Allows much easier footboard angle adjustments.

  Spare-The-Rods Tension Rod Protector: No more tension rods getting bent out of shape during transport! With Spare-The-Rod, you can save your tension rod the rigors of the road by packing it in the specially designed upper section pipe. It's a small, but very significant TAMA hardware innovation. Insert the tension rod into the upper tube. Hold the tension rod in place with the hi-hat clutch. Done. The upper tube covers the tension rod.
