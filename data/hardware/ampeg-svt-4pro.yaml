  - rack-mount
url: "https://ampeg.com/products/pro/heads.html#svt-4pro"
description: "The SVT-4PRO crystallizes the SVT-PRO philosophy, delivering more
  performance, flexibility, and power than any other amp in its class. A hybrid
  tube/solid-state preamp drives dual high-output Class AB power amps in a 3U
  rack chassis with extensive tone shaping and bi-ampable, bridgeable outputs."
details: |-
  Hybrid tube/solid-state design pairing a tube preamp with high-output Class AB power amps.

  Comprehensive tone shaping: 5-position Midrange peaking filter, shelving bass and treble filters, and a 9-band graphic EQ that can be footswitched as a second channel.

  Defeatable optocoupler limiters and an onboard compressor with variable ratio (1:1–10:1).

  Dual power amps bi-ampable with a variable 24 dB/octave crossover, stereo/bridgeable operation, in a 3U rackmount chassis.
specs: |-
  - Power Output: 300W x 2; 900W mono-bridged @ 8 ohms
  - Power Output: 490W x 2; 1200W mono-bridged @ 4 ohms
  - Power Output: 600W x 2 @ 2 ohms
  - Weight: 39.6 lb (17.9 kg)
  - Form factor: 3U rackmount
