name: M21 Platinum
manufacturer: bricasti-design
primaryCategory: outboard
categories:
  - rack-mount
url: https://bricasti.com/en/consumer/m21_platinum.php
description: The Bricasti M21 Platinum is the M21 DAC with the MDx Network
  Processor Board factory-installed, adding streaming and network playback
  without requiring a separate upgrade. All three D/A conversion paths
  (delta-sigma, ladder, and direct DSD) remain, along with Ethernet
  connectivity. Handcrafted in Massachusetts, USA.
specs: |-
  - Three simultaneous D/A conversion paths: delta-sigma, R2R ladder, direct DSD
  - MDx Network Processor Board factory-installed
  - USB: up to 32-bit / 384kHz PCM, DSD64/128/256
  - AES/EBU, S/PDIF (BNC and RCA): up to 24-bit / 192kHz
  - Toslink: up to 24-bit / 96kHz
  - I²S (HDMI connector): up to DSD256
  - Balanced analog output: 4VRMS (XLR)
  - Unbalanced analog output: 2VRMS (RCA)
  - Output impedance: 100Ω (balanced), 50Ω (unbalanced)
  - THD+N: <0.001%
  - SNR: >118dB
  - Power consumption: 55W
  - Chassis: 2U rack-mount, 19-inch
  - Handcrafted in Massachusetts, USA
