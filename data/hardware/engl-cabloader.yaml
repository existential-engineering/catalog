description: The ENGL Cabloader is a fully-featured speaker cabinet simulator,
  IR loader and DI box, with built-in cabinet, microphone and power amp
  emulations plus balanced and unbalanced outputs and a headphone out.
details: |-
  The ENGL Cabloader is a fully-featured speaker cabinet simulator, IR loader and DI box. This all-in-one solution can transform your pedalboard into a full DI rig, provide a perfect link from your amplifier to a recording interface, or even just give you a great way to hook up your pedals to your headphones for silent practice.

  The Cabloader sports a whole host of IR-based digital cabinet simulation models, as well as various microphone and optional power amp emulations. These allow you to digitally recreate the sound and feel of a fully mic'd guitar speaker and experiment with cab models you may never be able to actually experience in real life. Third party IR loading is also supported via the proprietary software, so you can load .wav IR files from any of your favorite manufacturers or studios.

  As complicated as all the digital wizardry that's going on inside this little box is, the Cabloader was designed with sheer simplicity and ease of use in mind. Even if you're a complete newcomer to the world of digital cab sims and IR loaders, you'll be able to quickly set up an amazing sound thanks to the intuitive controls. The quality of the simulations and the extensive connection options make this the perfect tool for anyone from beginners to professionals.

  Twelve ENGL cabinets are built in, alongside four user slots for third-party impulse responses loaded over the micro USB port, ten microphone models and four power amp simulations, each of which can also be switched off. Two footswitches store and recall presets A and B, and the unit is true bypass.
specs: |-
  - Impulse response cabinet simulator
  - Microphone simulator
  - Poweramp simulator
  - 12 built-in ENGL cabinets
  - 4 user / third-party IR slots (accessible via USB)
  - 10 microphone models plus microphone off
  - 4 poweramp simulations plus poweramp off
  - Input jack with instrument / line level adjustment switch
  - Thru jack
  - Unbalanced out jack
  - Balanced out jack (XLR) with ground lift switch
  - Headphones out
  - Micro USB port for IR loading (PC and Mac)
  - Favourite A and Favourite B footswitches to save and recall presets
  - True bypass
  - Microphone section: MIC selector, Center and Distance controls
  - CAB section: CAB selector
  - Power amp section: POWER AMP selector, Presence and Master controls
  - Sampling rate: at least 44.1 kHz
  - Sampling accuracy: 24 bit
  - Signal to noise ratio: 100 dB
  - IR format: .wav, 1024 samples (23.22 ms)
  - Power requirements: 9 V DC 300 mA (negative center)
  - Dimensions: 12 x 9.5 x 5.55 cm
  - Weight: 0.405 kg
