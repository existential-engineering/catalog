details: |-
  The Martin J-40 is part of Martin's refreshed Standard Series, pairing the bold projection of a Jumbo body shape with the refined appointments expected from a flagship rosewood-and-spruce acoustic. Built around a J-14 Fret body with a solid Sitka-style spruce top finished in Aging Toner and solid East Indian Rosewood back and sides, the J-40 delivers a rich, vintage-inspired voice with strong low end and clear projection.

  Forward Shifted X-Bracing with GE-scalloped 5/16" spruce braces lets the top move freely, giving the J-40 its open, resonant character. Antique White binding, an abalone rosette with multi-stripe purfling, faux tortoise pickguard, and gold open-gear tuners reinforce the guitar's classic look while reduced hexagon abalone fingerboard inlays add a distinctive Martin signature.

  The genuine mahogany neck is finished in satin with a GE Modified Low Oval profile and High-Performance Taper, giving the J-40 a fast, comfortable feel across its 25.4" scale. An ebony fingerboard and bridge, compensated bone saddle, bone nut, and bone bridge pins with abalone dots round out the playing surface. Every J-40 is Plek'd at the factory for consistent setup and intonation.

  The J-40 ships with a hardshell case with brass and nickel hardware, Authentic Acoustic Lifespan 2.0 Phosphor Bronze Medium strings, and Martin's Limited Lifetime Warranty. A left-handed version is also available.
specs: |-
  - Body shape: J-14 Fret (Jumbo)
  - Top: Solid Spruce, Aging Toner, Gloss finish
  - Back & sides: Solid East Indian Rosewood, Natural, Gloss finish
  - Bracing: Forward Shifted X-Brace, GE-Scalloped Spruce, 5/16"
  - Neck: Genuine Mahogany, Dark, Satin finish
  - Neck shape: GE Modified Low Oval with High-Performance Taper
  - Scale length: 25.4"
  - Frets: 20 total, joins body at 14th fret
  - Fingerboard: Ebony
  - Nut width: 1¾"
  - Width at 12th fret: 2⅛"
  - Fingerboard inlays: Reduced Hexagon in Abalone
  - Bridge: Ebony, GE Modern Belly with drop-in saddle, 2 5/32" spacing
  - Saddle: Compensated Bone, 16" radius
  - Nut: Bone
  - Bridge pins: Bone with Abalone dots
  - Tuners: Gold Open Gear
  - Binding: Antique White
  - Rosette: Abalone with Multi-Stripe
  - Pickguard: Faux Tortoise
  - Electronics: None
  - Plek'd at the factory
  - Left-handed option available
  - Case: Hardshell with brass/nickel hardware
  - Strings: Authentic Acoustic Lifespan 2.0 Phosphor Bronze Medium
