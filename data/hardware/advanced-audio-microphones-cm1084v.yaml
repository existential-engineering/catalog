details: |-
  **** unavailable at this time...we are working hard to bring this mic back to production****

  CM1084V

  Hand-held condenser mic, with vocal head grill for live performance and recording. The CM1084V came after a client asked if we could build a super-cardiod hand held pencil condenser microphone that could be used in live recording and live sound applications. We redesigned the AA-CM1084 by adding a rugged head-grill with open cell foam inside to reduce popping and fitted it with our low profile 22mm super-cardiod capsule. CM1084V on our friend Maria Babone(Fado Artist) performing for a live TV show. The Advanced Audio CM1084 is one of the most versatile small diaphragm condenser microphones available today. The mic was inspired by the sought after vintage KM84 and the Calrec 1000 series SDC's which were used in the R&D of the 1084. Advanced Audio Microphones worked very closely with UK engineer Niall John Acott to develop a mic that not only works in large orchestral sessions, but equally well on sources in a rock or jazz sessions. The final shootout, done at Angel studios in London, under the supervision of Gary Thomas locked the mic in as a serious competitor in the SDC microphone field. Circuit:

  The CM1084's uses a very clean Class "A" fet, 2 stage amplifier circuit coupled to a custom wound 2:1 transformer. The circuit was carefully designed to emulate the tight, flatter response of a vintage KM84. However, the circuit provides 14dB more headroom. The mic features a -10dB/-20db PAD and a 75hz/150Hz low-frequency roll-off. This means the CM1084 and CM1084V can be used extremely close to loud sources like toms and snare drums. Capsule:

  The CM1084V capsule is an externally polarized super-cardiod 22mm true condenser capsule. The 1084V diaphragm is skinned with 6 micron thick gold sputtered mylar. Summary:

  The CM1084V is equally at home recording acoustic instruments and for recording high-transient studio instruments such as drums, percussion, or grand piano. With the 1084V head-grill this microphones provides a smoother option to the SM58 for live recording situations. The 1084V head-grill can also be a very good option for live miking drums, percussion and other instruments in windy outdoor situations.
specs: |-
  - CM1084 body with 1084V vocal head-grill
  - Additional Card, super-cardiod and omni capsules can be bought for $50 each.
  - Frequency response: 50Hz to 20kHz +/-3dB
  - Impedance: <150 ohms
  - Equivalent noise: <15dB (A-weighted) This is measured with the capsule in place.
  - Maximum SPL: 127dB, 137db / -10db pad, -147db / -20db pad@1kHz for 0.5% THD .75Hz & 100Hz switchable LF roll-off filter
  - -10dB/-20db selectable pad
  - 48V phantom power required
  - Molded plastic road case
  - Shock-mount
