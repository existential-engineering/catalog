description: >-
  The Chimera Synthesis bC16 is a compact battery-powered analog modular
  synthesizer with 25 patch points and a discrete ladder filter, capable of
  generating experimental textures and effects from a remarkably small form
  factor.
details: |-
  The bC16 from Chimera Synthesis packs genuine analog modular synthesis into a
  tiny, affordable package. With 25 patch points connected via 2mm mini banana
  patch cords, it offers real modular flexibility despite its diminutive size
  and budget-friendly price point.

  The sound engine features two linked analog VCOs producing sine, triangle,
  sawtooth, and square waveforms with adjustable duty cycle. A 24dB/octave
  discrete ladder analog filter with resonance and cutoff controls provides
  classic subtractive synthesis shaping, while an ADSR envelope and VCA handle
  amplitude contouring.

  Two linked LFOs offer extensive modulation possibilities through the patch
  matrix, and a built-in arpeggiator with rising, falling, rising/falling,
  and ordered modes can sync to either internal or MIDI clock. The synth
  excels at generating experimental sound effects and textures rather than
  conventional melodic synthesis.

  The bC16 runs on six AAA batteries or an external 9-12V power supply,
  making it completely portable. It accepts MIDI and CV/Gate control for
  integration with other equipment. Notably, Depeche Mode used the bC16 on
  multiple tracks from their album Sounds of the Universe, proving that this
  little modular can hold its own in professional productions.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 linked analog VCOs
  - Waveforms: Sine, triangle, sawtooth, square (adjustable duty cycle)
  - Filter: 24dB/oct discrete ladder analog with resonance
  - Envelope: 1 ADSR
  - VCA: 1
  - LFO: 2 linked
  - Arpeggiator: Rising, falling, rising/falling, ordered modes
  - Patch points: 25 (2mm mini banana)
  - Control: MIDI In, CV/Gate
  - Power: 6x AAA batteries or 9-12V external
