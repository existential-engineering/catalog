details: |-
  Erica Synths Fusion Box is a distinct multifunctional analogue effects unit that combines BBD chip based effects, delay, flanger and chorus, with tube overdrive in the delay output and in the feedback path for extra thickness of sound. Lowpass filtering is fully adjustable from none to extreme for a really deep bass sound.

  A special feature, not found in other contemporary stompboxes or effect units, is the Vintage Stereo Ensemble. It provides the classic stereo ensemble effect found on many vintage synthesizers from almost any brand and make. The delayed, processed and filtered sound is added back to the dry mono audio with inverted phase in one channel and direct phase in the other, which gives it a distinct and unique moving character, different from that obtained with chorus effects.

  Use of inverted phase in the stereo field also adds certain peculiarities to watch out for. Played back on an older surround decoding sound system, the ensemble sound may move to the rear channel, and if the output gets mixed back to mono the effect may disappear. The same applies to mono subwoofer systems, or to speakers placed too close together. This is normal and occurs with any similar vintage stereo ensemble processing. Where those oddities are undesirable, only one of the output channels can be used, or two separate ensemble processors for the left and right channels.

  Fusion Box has adjustable input gain, so it works with various sound sources: guitars, units with line level signals such as synthesizers and grooveboxes, and modular synths. A footswitch switches the effects on or bypasses them, which makes the unit a practical choice for guitar players.
specs: |-
  - Input signal level up to 20V ptp
  - Input signal amplification up to +48dB
  - Power supply 110 to 220V
  - Mass 0,7kg
  - Dimensions 185x140x55mm
  - 2 BBD chips (1024 and 4096 stages)
  - Passive lowpass filter for extreme subbass sound
  - Tube overdrive in the delay output and feedback path
  - FX send/receive connector
  - Footswitch connector
