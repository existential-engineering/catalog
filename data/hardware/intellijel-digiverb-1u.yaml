description: Make Space Fly your patch to lo-fi space. The Digiverb falls
  somewhere between a virtual spring reverb and a dense multi-tap delay with
  simple controls. Drift away in the near three seconds of decay.
details: |-
  Digiverb is a lo-fi reverb effect unit that uses an Accutronic digital reverb "tank" module. The sound is somewhere between a virtual spring reverb and a dense multi tap delay with a musical and interesting effect.

  Use the Digiverb as a simple and fun way to add extra dimension to your patches!
specs: |-
  - Width: 14HP
  - Depth: 45mm
  - Power: 72mA @ +12V, 17mA @ -12V
  - Uses an Accutronic digital reverb "tank" module
  - Dry/Wet Mix knob
  - Decay knob controls length of reverb tail (up to approximately three seconds)
