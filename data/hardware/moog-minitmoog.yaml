description: >-
  The Minitmoog is a rare monophonic preset synthesizer produced by Moog in the mid-1970s,
  closely related to the Moog Satellite. It features 13 preprogrammed instrument sounds
  selected via flip-switches and a 37-note keyboard with aftertouch for expressive
  performance.
details: |-
  The Minitmoog is a compact preset synthesizer offering thirteen built-in sounds: Mute, Trumpet, Oboe, Clarinet, Sax, Taurus, Violin, Piano, Guitar I, Guitar II, Aries, Lunar, and Flute. Sounds are selected using flip-switches located below the keyboard and can be transposed across three octaves for extended pitch range.

  Despite being a preset instrument, the Minitmoog provides real-time sound shaping through fader-type sliders on the left side of the panel, allowing performers to tweak filter cutoff, modulation depth, and glide during performance. Its dual VCOs with oscillator sync capability can be tuned far apart or locked together for a fat dual-oscillator sound, and the Sync-Sweep effect adds motion to the oscillator tones.

  Notably, the Minitmoog employs aftertouch via pressure-sensitive keys, enabling the player to sweep through filters, engage sync sweep effects, bend pitch, and modulate sound based on key pressure intensity. However, it lacks programmability and memory storage beyond its twelve factory presets, limiting its flexibility compared to later synthesizers.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 2 VCOs with sync
  - LFO: Yes
  - Filter: Yes
  - VCA: Yes
  - Keyboard: 37 keys with aftertouch
  - Memory: 13 preset sounds (Mute, Trumpet, Oboe, Clarinet, Sax, Taurus, Violin, Piano, Guitar I, Guitar II, Aries, Lunar, Flute)
  - Control: CV/Gate
  - Sounds transposable across 3 octaves
releaseDate: "1975"
releaseDateYearOnly: true
