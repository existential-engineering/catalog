description: The FE10 Ether combines the Fat channel fuzz of the Air with a
  powerful parametric equalizer covering 100 Hz to 5 kHz, allowing unlimited
  tonal variations on the classic Super Fuzz sound.
details: |-
  The FE10 Ether takes the Fat channel of the FA10 Air and combines it with a parametric equalizer to create unlimited variations on the classic Super Fuzz sound. Water's powerful parametric EQ covers a massive frequency range from a hefty 100 Hz to ear-splitting 5 kHz. Select a frequency and then boost or cut to tweak your tone with pinpoint accuracy. From Sizzling, scorching highs that accentuate the upper octave harmonic to big, beefy bottom that's perfect for Bass Guitar: These are just two of the limitless possibilities that Ether's versatile EQ can offer. When true-to-spec vintage clones aren't enough, Ether takes a classic vintage Fuzz and turns it into a modern-day monster. Ether takes the classic Super Fuzz sound and modernizes it with a powerful parametric EQ stage that can create a limitless variety of new fuzz effects. TECH TALK:

  The FE10 features mechanical true bypass switching, Effect LED Indicator, and 9-Volt DC Battery or external adaptor operation.
specs: |-
  - Fuzz engine based on vintage Shin-Ei / Univox Super Fuzz
  - Square Wave clipping with upper octave harmonic
  - Level and Expand controls
  - Parametric Tone circuit with Frequency and Cut/Boost controls
  - Unlimited variety of tonal colors
  - Mechanical True Bypass Switching
