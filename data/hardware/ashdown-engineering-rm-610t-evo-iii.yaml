details: |-
  The Rootmaster 610T-EVO III is a 6x10 inch powerhouse delivering an immense 900 watts of output at 4 ohms through six custom-designed 10 inch Ashdown speakers, engineered for punch, clarity and depth. A three-way switchable tweeter (Hi, Low, Off) lets you tailor the high-end, from crisp brightness to smooth warmth or a stripped-back vintage response, combined with a dynamic midrange and signature Ashdown low-end punch. Constructed from lightweight ply, it is fitted with rear handles, castors and a kick-back design for effortless transport, and finished in durable Buffalo Tolex with a silver cloth grille.
specs: |-
