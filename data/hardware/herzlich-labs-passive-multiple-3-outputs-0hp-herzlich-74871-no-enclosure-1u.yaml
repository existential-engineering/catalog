description: A passive multiple that creates 3 identical copies from 1 input
  signal, accepting both CV and audio signals.
details: |-
  More for less. There is no simpler, yet more essential tool in the modular toolbox, than the passive multiple. Replicating audio or CV signals to send to different destinations, to modify in various ways, to aid in complex operations and modulations, it is an essential piece of electronic plumbing that no system should be without. However, every single hp of rack space is costly, and your most used utilities may not always be placed at the most convenient location in your system. Sometimes, space is simply a premium, and you need every bit of flexibility you can get. When purchased with an enclosure, you get a rock solid and road-ready module that will stand up to even the most experimental noise gig. The module can easily be removed and reinstalled at a later date thanks to the internal brass threads in the enclosure, meaning you have the flexibility to use it within, or without, your rack.
specs: |-
  - Accepts both CV and audio signals
  - Creates 3 identical copies from 1 input signal
  - Can be used both as a 0hp unit, or installed as a 1U unit in your rack
  - Passive design: no external power, no batteries
