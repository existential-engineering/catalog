description: Introducing the limited-edition PolyBrute Noir. Rediscover the
  morphing analog powerhouse with a fresh Noir finish, sleek redesigned knobs,
  and ionized parts, culminating in a deeper, darker aesthetic straight from the
  abyss.
details: |-
  A 6-voice analog synthesizer that treads new ground between sonic universes, reimagined with black-hole aesthetics. Morph seamlessly between sounds within sounds, discover unparalleled multi-axis expression, and push analog timbres deeper into uncharted darkness.

  Polybrute noir's presets exist in two simultaneous states, and the morph control lets you sweep effortlessly between them. Adjust numerous parameters at once for huge variety within a single preset.

  Polybrute noir's voice is a collision between signature brute oscillators and dual analog filters for sounds that quickly move between the light and the dark, the familiar and the otherworldly. Start your voice right with two powerful brute analog vcos that generate sawtooth, triangle, and square waves simultaneously, with jagged metalizer wavefolding, cavernous sub-oscillator, and cross-mod & sync controls right at your fingertips.

  Add color and shape to your timbres with two classic filter designs, configurable in series, parallel, or continuously variable. The first, a steiner 12db/octave filter with continuous slope type, enhanced with signature brute factor feedback; the second, the legendary 24db/octave ladder filter for that essential low-pass smoothness, supercharged with biting distortion.

  Create your own unique web of modulators and dive deeper into your sound design than ever before; tap into hundreds of exclusive presets that push polybrute noir's architecture to the brink; enjoy a visual overview of your sequences and arps in real-time; the matrix is where polybrute noir's analog reactivity and digital precision collide.
specs: |-
  - 6-voice polyphony
  - Analog morphing synthesizer
  - Two brute analog VCOs
  - Sawtooth, triangle, and square waves
  - Metalizer wavefolding
  - Sub-oscillator
  - Cross-mod and sync controls
  - Steiner 12db/octave multimode filter
  - Continuous LP>notch>HP>BP morphing
  - Brute factor feedback
  - 24db/octave ladder filter
  - Distortion overdrive
  - High-resonance gain compensation
  - Three envelope generators (egs)
  - Three LFOs
  - Lfo1 and lfo2 with waveform selection
  - Lfo3 with waveform shaping
  - Rate control and tempo sync
  - Various retrig options
  - 61-note velocity and pressure-sensitive keyboard
  - Pitch wheel
  - Assignable mod wheel
  - Foot pedal controller inputs
  - Morphe controller (x-y-z with pressure and position)
  - Ribbon controller
  - 32-step arpeggiator
  - 64-step polyphonic sequencer
  - Motion recorder
  - Matrix arpeggiator
  - 96-point digital patchbay
  - Up to 32 modulation destinations
  - 64 total connections
  - 768 memory locations for presets
  - Nearly 400 professionally designed patches
  - Three stereo digital effects slots
  - Modulation FX: chorus, phaser, flanger, ring modulation
  - Delay: 9 algorithms including bbd and digital delay
  - Reverb: 9 algorithms including hall, plate, spring, shimmer
  - Distortion effects: subtle tape, classic distortion, soft clip, worn out tape, germanium, bitcrusher, downsample
  - Polybrute connect software (mac/pc standalone app and DAW plugin)
  - Bi-directional editing between software and hardware
  - Real-time parameter mirroring
  - Mono, unison, poly voicing modes
  - Single, split, layer modes
  - Series and parallel filter routing
  - Continuously variable filter configuration
  - Dedicated velocity-sensitive adsrs for VCF and VCA
  - Freely assignable third eg with delay stage
  - Touch-sensitive ribbon strip above keyboard
  - Stereo placement of voices
  - Fine tuning control
  - Headphone volume control
  - Master volume control
  - Instrument size: 38.3 x 14.9 x 4.4 inches (972 x 378 x 110mm)
  - Instrument weight: 44 lbs (20 kg)
