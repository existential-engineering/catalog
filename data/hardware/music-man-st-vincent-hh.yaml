description: >-
  The St. Vincent signature model in a dual-humbucker configuration —
  lightweight okoume body, roasted figured maple neck with ebony or rosewood
  fingerboard, custom Music Man humbuckers, and a 5-way switch. 2018 colors:
  Charcoal Sparkle, Blue Dawn, Stealth Black, and Sea Breeze.
details: |-
  The St. Vincent HH is the dual-humbucker variant of the Annie Clark signature model — a sleek, angular okoume-body guitar with a roasted figured maple neck and a 5-7/8" oversized 4-over-2 headstock.

  Electronics use two custom Music Man designed humbuckers with chrome covers (matte black on Stealth Black), routed through a 5-way lever pickup selector with a custom configuration. A 500k volume and tone with a 0.047µF tone cap keeps the signal path simple and direct.

  The body is finished in high gloss polyester — except the matte Stealth Black — and is available in Blue Dawn, Sea Breeze, Charcoal Sparkle, or Stealth Black. Hardware is consistent across the line: a custom St. Vincent Music Man modern tremolo with vintage bent steel saddles, Schaller M6-IND locking tuners with pearl buttons, and a 5-bolt sculpted neck joint.
specs: |-
  - Body wood: Okoume
  - Body finish: High gloss polyester (matte on Stealth Black)
  - Body colors: Blue Dawn, Sea Breeze, Charcoal Sparkle, Stealth Black
  - Body dimensions: 12-9/16" wide, 1-5/8" thick, 39-9/16" long
  - Neck wood: Roasted figured maple (maple on Stealth Black)
  - Neck finish: Gunstock oil and hand-rubbed wax (ultra-light satin polyurethane on Stealth Black)
  - Neck width: 1-5/8" at nut, 2-1/4" at last fret
  - Neck radius: 10"
  - Neck attachment: 5-bolt sculpted joint
  - Fingerboard: Ebony (Stealth Black, Charcoal Sparkle, Sea Breeze) or Rosewood (Blue Dawn)
  - Fret markers: Custom St. Vincent inlays
  - Frets: 22 high-profile, medium-width
  - Headstock length: 5-7/8" (4-over-2)
  - Scale length: 25-1/2"
  - Pickups: HH — 2 custom Music Man designed humbuckers (chrome covers; black on Stealth Black)
  - Controls: 500k volume and tone (0.047µF tone cap)
  - Switching: 5-way lever pickup selector with custom configuration
  - Bridge: Custom St. Vincent Music Man modern tremolo with vintage bent steel saddles
  - Pickguard: White (Blue Dawn); Matte black (Charcoal Sparkle, Stealth Black); Parchment (Sea Breeze)
  - Tuning machines: Schaller M6-IND locking with pearl buttons (black on Stealth Black)
  - Electronic shielding: Graphite acrylic resin body cavity; aluminum control cover
  - Strings: 10p-13p-17p-26-36-46 (RPS 10 Slinkys #2240)
