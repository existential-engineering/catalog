details: |-
  Based on the SGB that he played in high school back in 1966, Mark Kiesel designed the Mark 66 to invoke a sense of nostalgia while utilizing the modern upgrades of the Custom Shop. A true offset hasn't been seen from Kiesel Guitars since the early 70s, marking a triumphant return for the beloved shape.

  Enhancing overall comfort, the model borrows the top arm contour and tummy cut seen on current Kiesels, as well as the sculpted neck heel and slightly-rolled fingerboard edges.

  The aesthetics of the Mark 66 cater to players of all kinds. The Pickguard option is standard, signaling back to a classic design, while a Pickguard Delete shows the top on full display.

  Inspired by Lowell Kiesel's first pickup design, the AP6, Mark Kiesel commemorated his father's idea in the form of the P90 AP90s. For further variety, Kiesel humbuckers are also available.

  While the guitar comes standard with a stop tail, players can choose the non-floating Gotoh 510 tremolo or the EverTune, expanding the Mark 66's versatility. The Mark 66 is available in the standard 25.5" scale length, but players can opt for the extended 30" scale length to suit their playing needs.
specs: |-
  - Scale length: 25.5" standard, with an extended 30" scale length available
  - Frets: 22 stainless steel medium-jumbo, .103" wide x .048" tall
  - Body: alder, 42" long, 1.65" thick, 12" wide
  - Neck: tung-oiled maple with 2-way adjustable truss rod and dual carbon-fiber rods
  - Neck width: 1.69" at nut, 0.78" thick at 1st fret, 0.88" thick at 12th fret
  - Construction: bolt-on with radiused neck heel
  - Fingerboard: ebony with 14" radius
  - Headstock: GT-style inline headstock
  - Pickups: Kiesel AP90 humbuckers; Kiesel humbuckers also available
  - Bridge: Tune-O-Matic with stop piece, .4125" (10.5mm) spacing; non-floating Gotoh 510 tremolo and EverTune also offered
  - Electronics: master volume and tone controls, 3-way pickup selector
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Hardware: chrome
  - Inlays: white pearl dots with standard black-ring Luminlay Super Blue side dots
  - Pickguard: white multi-layered pickguard, or Pickguard Delete
  - Strings: Elixir Nanoweb 1046E
  - Weight: 7.3 lbs
