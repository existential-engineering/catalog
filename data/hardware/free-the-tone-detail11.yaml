description: An easy-to-use, compact programmable MIDI controller that operates
  in two modes, Mode-1 for sending program change numbers and Mode-2 for presets
  that can also carry control change numbers.
details: |-
  The Free The Tone MC-3 is an easy-to-use, compact programmable MIDI controller which operates in two modes, Mode-1 for sending program change numbers and Mode-2 for presets. Three footswitches cover both.

  In Mode-1 the program change number is selected by pressing the left or right footswitch and the number to be sent is determined by the centre footswitch. Any channel from 1 to 16 can be selected and a program change number from 1 to 128 sent on it.

  In Mode-2, the preset mode, control change numbers can be selected in addition to program change numbers, and the desired number can be assigned and programmed to one of the three footswitches and then sent. That makes for more flexible sound system creation.

  Because the MC-3 supports control change sending, it is useful well beyond recalling a program on a connected device: it can act as a tap tempo entry controller for an effects unit, or as a channel switching footswitch for a MIDI amplifier.

  The MC-3 can be powered either by a 9-volt battery (PP3/006P) or by a common 9 VDC AC adapter, which widens where it can be used. Estimated battery life in actual use is about 10 hours on a manganese battery and about 35 hours on an alkaline one. The unit draws approximately 25 mA, measures 120 by 95.7 by 54.1 mm including protuberances such as footswitches, and weighs approximately 315 g excluding the battery.
specs: |-
  - Terminals: 1x DIN 5-pin connector (MIDI OUT), 1x DC 9V input jack (for AC adapter)
  - Power supply: 9-volt battery (PP3/006P) or AC adapter
  - Estimated battery life: about 10 hours (manganese), about 35 hours (alkaline)
  - Current consumption: approx. 25 mA
  - Mode-1 sends program change numbers 1 to 128 on any channel from 1 to 16
  - Mode-2 (preset mode) also allows control change numbers
  - Dimensions: 120W x 95.7D x 54.1H mm (incl. protuberances such as footswitches)
  - Weight: approx. 315 g (excl. battery)
  - Accessories: warranty card, Web Access Card, battery (PP3/006P), 4x rubber feet
