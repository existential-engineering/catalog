description: The Belle Epoch + is a compact tape echo simulator with full tap
  tempo capabilities, offering more headroom, a redesigned Mix control, improved
  buffered bypass, noise gating, and better impedance specs. It features three
  tape wear modes ranging from pristine to aged vintage tones.
details: |-
  The Belle Epoch + is Catalinbread's upgraded take on the classic tape echo simulator, building on the original Belle Epoch with a suite of improvements aimed at modern players.

  The pedal features full tap tempo functionality with a hold-to-activate footswitch, allowing players to sync delay time to a song's tempo on the fly. Delay time reaches up to approximately 900ms.

  Three tape wear modes simulate different states of vintage tape condition, from fresh and clean to aged and saturated, giving the player control over how much vintage character is applied.

  The redesigned preamp delivers improved dynamic range and headroom compared to the original model, while a noise gating circuit keeps the signal clean during quiet passages. Power requirements are 9VDC center-negative at a minimum of 200mA.
specs: |-
  - Power source: center-negative 9V DC power supply capable of at least 200mA
  - Max delay time: approximately 900ms
  - Tap tempo: hold the footswitch to enter tap mode, hold again for tap bypass mode
  - Three tape wear modes
  - Buffered bypass
  - Controls: Sustain, Mix, Tape FX, Rec Level, Echo Delay
