details: |-
  WM200 is a cardioid, dynamic microphone that is rugged and reliable enough to stand up to the real-world rigors of the DJ stage.

  With a steel-mesh basket that's optimized to present the best acoustics, a die-cast alloy body and a high-sensitivity capsule, whether you need a microphone to sing, rap, make announcements, or amplify instruments, WM200 is the only trusty transducer you need.

  WM200 includes a built-in on/off switch that is silent in operation, and a XLR-to-1/4" connection cable to hook into your mixer or amplifier. You even get a mounting clip and a hard, foam-lined case to transport WM200 wherever you go.

  Nobody knows DJs better than Numark. When it's a microphone you need, there's nothing like a Numark WM200.
specs: |-
  - Steel mesh capsule housing
  - Wide frequency response
  - Die cast alloy body
  - Sliding steel ball on/off switch
  - Includes 20ft (6M) shielded cable
  - Carrying case and mounting bracket
