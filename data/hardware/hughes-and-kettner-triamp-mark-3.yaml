description: 30 years of guitar tube amp expertise. The ultimate
  guitaramplification. Breathtaking versatility and inspiration.
details: |-
  No limits. No compromises. This is what you get when 30 years of tube amp expertise combine with an absolute freedom of engineering. The result is an amp boasting a range of professional sounds not offered by any other amp anywhere on the planet. And best of all, TriAmp Mark 3's breathtaking versatility and inspirational tonality is matched only by its ease and joy of use.

  You can also combine two or even all three of the power amps, merge different power amp characters, and play TriAmp Mark 3 with up to 150 watts of sheer tube power. This effectively lets you custom tailor your amp in the amp, recalling up to 128 sound constellations with the touch of a button via MIDI.

  Get all the true tube tones you want and all the stage-rumbling wattage you need! The Hughes & Kettner Triamp MKIII head comes equipped with a trio of independent power amp sections that can be used independently or combined. You can use a wide range of different tube types to conjure authentic American and British amp tones. Each of the Triamp MKIII's three preamp sections has a pair of channels, and you can route them independently to the power sections. You're plugged into 42 different amp possibilities, all from one amp head. You also get a DI output with Ambience Emulation, full MIDI control, an included MIDI footboard, intuitive controls, an onboard noise gate, and much more.
specs: |-
  - Channels: 50s Californian Clean, 60s British Clean, 70s British Lead, 80s Brown Sound, 90s Californian High Gain, Modern-Day High Gain and beyond
  - Power: 150 Watts
  - FX: Noise Gate
  - Power Amp Tubes (as shipped): 2x EL34 (84 watts / 34 watts), 2x 6L6 (72 watts / 30 watts), 4x 6L6 (126 watts / 93 watts), 2x 6L6 + 2x EL34 (132 watts / 95 watts), 4x 6L6 + 2x EL34 (145 watts / 116 watts)
  - TSC: Tube Safety Control
  - Dimensions: 740 x 303 x 254 mm, Weight 22 kg/48.5 lbs.
  - Accessories: TSM 432 Floorboard + Softbag included
  - Speaker Out: 1 x 4 Ω, 1 x 8 Ω / 2 x 16 Ω, 1 x 16 Ω
  - Effects Loop: Serial/parallel, switchable
  - Red Box: DI Out XLR
  - MIDI: In, Out/Thru
  - Footswitch: TSM-432 (included)
