details: |-
  The MicParts SDC-84 is a small-diaphragm condenser based on the vintage Neumann KM84, a design that favors character over accuracy. Transients are slightly controlled, meaning moderate to high-SPL transients are slightly compressed. It is magic on acoustic guitars and other stringed instruments.

  The vintage KM84 has not been in production for decades and should not be confused with the modern Neumann KM-184, which omits the KM84's transformer. The KM-184 does not sound like the KM84: the circuit is different and the voicing is much brighter.

  The MicParts SDC-84 is hand-built in Roswell's California workshop.

  Matched pairs work beautifully as drum overheads. They omit the zipper pouch in favor of a robust flight case.
