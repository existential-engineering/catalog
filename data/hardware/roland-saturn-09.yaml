description: >-
  The Saturn 09 is an analog organ synthesizer similar to the RS-09 which added a string sound. It
  can create sounds suitable for techno and ambient music, including low drone organ bass tones and
  blips. While not the best organ synthesizer, it is capable of producing creative results with
  imaginative use.
details: |-
  The Saturn 09 is a polyphonic analog organ synthesizer with a single VCO and a 44-key keyboard.
  It features ensemble chorus and vibrato effects with CV/Gate control. There is very little market
  demand for this instrument and it can typically be found for under $100, making it suitable for
  adding flavor to modern analog-electronic keyboard studios. It was used by the electro group
  Newcleus and likely other electro artists in their rigs.
specs: |-
  - Polyphony: Polyphonic
  - Oscillators: 1 VCO
  - Effects: Ensemble (chorus), Vibrato
  - Keyboard: 44 keys
  - Memory: None
  - Control: CV/Gate
releaseDate: "1980"
