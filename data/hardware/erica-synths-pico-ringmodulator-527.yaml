url: https://www.ericasynths.lv/pico-ringmodulator-527/
description: Erica Pico Ring is a balanced modulator (quadrant multiplier)
  circuit to create bell-like, metallic or robotic sounds. It has built-in
  sinewave modulation oscillator for more versatility.
details: |-
  Erica Pico Ring is a balanced modulator, a quadrant multiplier circuit that multiplies two signals together to produce bell like, metallic and robotic sounds.

  The circuit is fully analogue, and a built in sinewave oscillator sits alongside it, so the module can produce classic ring modulation from a single input without a second oscillator patched in.

  Input level attenuators set how hard each signal drives the multiplier, which is where the character of the effect comes from. Audio inputs accept levels up to 20Vptp.

  Inputs and output are protected against overvoltage and the module is protected against a reverse PSU connection. The panel is 3HP wide and the module is 35mm deep.
specs: |-
  - Full analogue circuit
  - Built-in sinewave oscillator
  - Input level attenuators
  - Audio input level up to 20Vptp
  - Input and output protection against overvoltage
  - Protection against reverse PSU connection
  - Power consumption +10mA, -19mA
  - Module width 3HP
  - Module depth 35mm
