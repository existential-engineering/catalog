description: >-
  The OB-8 was the last of Oberheim's classic OB series, an eight-voice polyphonic analog
  synthesizer produced from 1983 to 1985. It featured a fully programmable architecture
  with dedicated knobs and sliders, switchable two- or four-pole filters, and Oberheim's
  proprietary digital buss system for connecting to other Oberheim instruments.
details: |-
  The OB-8 represents the culmination of Oberheim's classic OB line, following the OB-1, OB-X, and OB-Xa. Its defining characteristic was totally programmable access with dedicated knobs, sliders, and a traditional layout that made sound design intuitive and immediate.

  The synth introduced a dual-layer programming system where a Page 2 button reassigned all front panel controls to an entire second set of parameters. Early production models lacked front-panel labeling for these hidden functions, which was corrected in later runs.

  Sound design capabilities included syncable VCOs and an eight-note arpeggiator, with each voice individually detunable for a very thick or unusual sound. The filter architecture matched the OB-Xa's switchable two- or four-pole VCF with ADSR envelope, providing significant tonal flexibility.

  Before MIDI became standard, the OB-8 used Oberheim's proprietary digital buss system, making it the centerpiece of an all-Oberheim studio by connecting to the DSX polyphonic sequencer, DMX drum machine, and other OB synthesizers. Some models were later retrofitted with MIDI capability.

  Storage included 120 patches of memory with 24 additional patches reserved for doubled and layered presets, and external cassette storage provided further expansion. The OB-8 was used by Depeche Mode, Prince, The Police, Trent Reznor, Thompson Twins, Rush, Simple Minds, Van Halen, Stevie Nicks, Styx, Future Sound of London, Paul McCartney, and many others.
specs: |-
  - Polyphony: 8 voices
  - Oscillators: 2 VCOs per voice (saw, pulse, triangle waveforms)
  - Filter: Switchable 2-pole or 4-pole VCF with ADSR envelope
  - LFO: Triangle, square, ramp, sample & hold waveforms
  - Memory: 120 patch programs, 12 split programs, 12 double programs
  - External Storage: Cassette interface, MIDI SysEx data dump
  - Keyboard: 61 keys, splittable and doubleable, no velocity or aftertouch
  - Arpeggiator: 8-note with external sync source
  - Connectivity: Oberheim digital buss; MIDI (channels 1-9) available as retrofit
  - Production Period: 1983-1985
releaseDate: "1983"
