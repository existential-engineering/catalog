name: Prime 2
manufacturer: denon-dj
primaryCategory: console
categories:
  - control-surface
  - mixer
url: https://www.denondj.com/prime-2-prime2xus.html
description: 2-Deck Smart DJ Console with 7" Touchscreen — essential mobile DJ
  workhorse and 2-deck standalone DJ system with WiFi streaming.
details: |-
  Standalone 2-deck Smart DJ Console with a 7" HD multi-touch, multi-gesture display for waveforms, library navigation, and track search.

  Powered by Engine OS with WiFi and Ethernet for streaming via Beatport LINK, Beatsource LINK, SoundCloud GO+, TIDAL, and Dropbox.

  Dual 6" capacitive-touch jog wheels with color displays plus 8 ultra-responsive trigger pads for hot cues, loops, beat rolls, and slicer.

  Multiple media sources: USB drives, SD card, and an internal 2.5" SATA drive bay for high-capacity onboard libraries.

  Built-in 2-channel mixer with 3-band EQ, filter, dual independent microphone channels, onboard recording, and Controller Mode for VirtualDJ.
specs: |-
  - Number of Decks: 2-deck
  - Channels: 2-channel
  - Display: 7" HD multi-touch, multi-gesture
  - Jog Wheels: 6" capacitive-touch with HD color display
  - Pads: 8 ultra-responsive trigger pads
  - Frequency Response: 20 Hz – 20 kHz (±1 dB)
  - Dynamic Range: > 112 dB (A-weighted)
  - Signal-to-Noise Ratio: > 92 dB (A-weighted)
  - Channel Separation: < -85 dB (1 kHz, unity)
  - Bit Depth: 24-bit
  - Sample Rate: 44.1 kHz
  - Headphone Output: < 150 mW @ 40 Ohms
  - Mic Inputs: 2 x XLR-1/4" combo
  - Analog Inputs: 1 x Dual RCA Stereo (line)
  - Analog Outputs: 2 x XLR (master L/R), 1 x Dual RCA (master), 2 x XLR (booth L/R)
  - USB: 3 x USB Type-A, 1 x USB Type-B
  - Other I/O: 1 x Ethernet, 1 x SD card slot, 1 x 2.5" SATA drive bay
  - Features: Built-in Wi-Fi
  - Power Supply: IEC, 100–240 VAC, 50/60 Hz
  - Power Consumption: 32–34 W
  - Width: 644.8 mm (25.39")
  - Depth: 410.1 mm (16.15")
  - Height: 120.2 mm (4.73")
  - Weight: 7.2 kg (15.9 lbs) without USB and power cable
