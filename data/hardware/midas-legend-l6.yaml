name: LEGEND L6
manufacturer: midas
primaryCategory: rack-mount
categories:
  - outboard
url: "https://www.midasconsoles.com/en/products/0831-AAB"
description: The LEGEND L6 is a 500 series portable chassis for 6 single-width
  modules, featuring advanced audio routing with output link switches for
  cable-free daisy-chain connections between modules and Compressor Bus Link
  switches for stereo and multi-channel dynamics sidechain linking. It includes
  a rugged free-standing chassis with carry handle for portable applications and
  a 3U 19-inch rackmount kit for installation in recording studios and live
  touring racks. An earth lift switch eliminates ground loop problems, and the
  high-power auto-ranging universal switch-mode power supply provides 3.2 A at
  +/-16 V and 300 mA at +48 V to power compatible 500 series modules. Main and
  auxiliary inputs and outputs per channel are provided on industry-standard XLR
  connectors.
details: |-
  Key features: 500 series portable chassis for 6 single-width modules; advanced audio routing reduces cabling complexity; audio output link switches provide cable-free daisy-chain connections between modules; compressor bus link switches enable stereo and multi-channel dynamics sidechain linking; rugged free-standing chassis with convenient carrying handle for portable applications; 3U 19-inch rackmount kit allows installation in recording studios and live touring racks (included); earth lift switch eliminates any ground loop problems; high-power auto-ranging universal switch-mode power supply for use worldwide; over-specified ultra-low noise power supply output provides 3.2 A @ +/-16 V and 300 mA @ +48 V; main and auxiliary inputs and outputs per channel on industry-standard XLR connectors; premium quality components throughout for crystal-clear audiophile signal path.
specs: |-
  - Chassis Capacity: 6 single-width 500 series modules
  - Rack Height: 3U (with included rackmount kit)
  - Module Power Output: 3.2 A @ +/-16 V
  - Phantom Power Output: 300 mA @ +48 V
  - Power Supply: Auto-ranging universal switch-mode
  - Connectors: Main and auxiliary XLR I/O per channel
