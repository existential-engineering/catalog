details: |-
  A throwback from the early era of rock 'n' roll, the G6119T-62 Vintage Select Edition '62 Tennessean Hollow Body with Bigsby is a solid performer with the sound and the style that have made Gretsch a household name. Highly resonant, the unique voice of this guitar cuts through any mix.

  A pair of rich-sounding TV Jones Hilo'Tron pickups creates broad tone with lively response, reflecting the natural voice of the guitar. Parallel tone bars provide authentic vintage tone.

  Designed for pure tone and slick, comfortable playing feel, this guitar features the classic aesthetics true Gretsch fans love — nickel G-arrow control knobs, aged white binding with black purfling and traditional vintage trim.
