details: |-
  Audioid is an advanced mobile electronic music rhythm composer for Android,
  combining drum machines similar to the mythical tr-808 and tr-909, two
  legendary tb-303-like basslines acting as grooveboxes and an interesting
  metropolis (m-185-like) sequencer linked to a virtual analog synthesizer
  engine with dual oscillators, ADSR envelopes, 4x LFOs, basic FM, phase offset
  modulation; all coupled with real-time filters, effects, randomness and a live
  approach.

  Audioid is also a nice proof-of-concept showing that dsp and real-time audio
  synthesis can benefit of parallel computations (provided by renderscript on
  android).

  You can get audioid on google play, there is a free and a paid version
  available.

  The free version has only few limitations compared to the full version, it
  displays ads, you cannot open your saved projects, you are restricted to 2 fx
  entries and 2 lfo entries (instead of 4) per machine and only bipolar lfo
  waveforms are allowed.
