url: https://amphion.fi/products/helium520c/
description: The Helium520C is a two-way center loudspeaker designed to work
  seamlessly with all Helium series models, equally suited for home theater and
  stereo playback, featuring Amphion's 5th generation waveguide and handmade
  construction in Finland.
details: |-
  The Helium520C is a two-way vented center loudspeaker from Amphion's Helium series, featuring a 1" titanium tweeter paired with two 5¼" paper woofers crossed over at 1600 Hz.

  Amphion's 5th generation waveguide ensures seamless driver integration and even dispersion throughout the room, creating a wide sweet spot that allows listeners to enjoy accurate sound beyond a single fixed position.

  The Helium520C maintains its performance at low listening volumes, delivering clear and detailed reproduction even at reduced levels. Its 90 dB sensitivity and 4-ohm nominal impedance make it compatible with a wide range of amplifiers from 10 to 150 watts.

  Each Helium520C is handmade in Finland and available in four finish options: Black, Full White, Standard White, and Walnut.

  The speaker measures 160×452×265 mm and weighs 9 kg, with a frequency response from 48 Hz to 25,000 Hz (-6 dB).
specs: |-
  - Operating Principle: Two-way, vented
  - Tweeter: 1" titanium
  - Woofers: 2×5¼" paper
  - Crossover Point: 1600 Hz
  - Impedance: 4 Ω
  - Sensitivity: 90 dB
  - Frequency Response: 48–25,000 Hz (-6dB)
  - Power Recommendation: 10–150 W
  - Dimensions (H×W×D): 160×452×265 mm
  - Weight: 9 kg (19.8 lbs)
  - Manufacturing: Handmade in Finland
