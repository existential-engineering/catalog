description: "The SGT-DI preamp and DI gives modern bassists an entire rig in a
  single stompbox. Enhanced Super Grit Technology overdrive with SVT and B-15
  voices, versatile 3-band EQ with sweepable mids, variable compressor, and an
  onboard IR Loader/Cab Simulator deliver authentic Ampeg tone for stage and
  studio."
details: |-
  The SGT-DI is a hybrid analog/digital bass preamp and DI pedal that puts an entire Ampeg rig in a single stompbox. The foot-switchable Super Grit Technology overdrive circuit features iconic Ampeg SVT and B-15 voices, while a foot-switchable 3-band EQ now adds sweepable mids on top of the classic Ultra-Hi and 3-way Ultra-Lo switches.

  An onboard IR Loader/Cab Simulator provides three classic factory cabs and three user-loadable slots via the free Ampeg IR Loader application. Six preloaded factory cabinet IRs are included — Heritage B-15, Heritage SVT-410HLF, and SVT-810 Squareback in Cab Mode; SVT-112AV, SVT-210AV, and SVT-212AV in the overwritable User Mode.

  Owners who register their SGT-DI receive the 75th Anniversary Free IR Pack, adding HSVT-810AV, SVT-610HLF, and SVT-15E cabs to the factory set.

  A variable 10:1 compressor and an Aux/Headphone section round out the feature set, plus balanced XLR and 1/4" line outputs for connecting to any rig. The pedal is available in standard and Blue Line Anniversary editions and is a 2024 TEC Award (Technical) nominee.
specs: |-
  - Foot-switchable 3-Band EQ with sweepable mids
  - Foot-switchable SGT circuit with SVT and B-15 voicing switch
  - Onboard IR Loader/Cab Simulator
  - Ultra-Hi and 3-way Ultra-Lo switches
  - Variable 10:1 compressor
  - Aux/Headphone section
  - Balanced XLR and 1/4" line outputs
  - Six preloaded Ampeg factory cabinet IRs
  - Three user-overwritable IR slots loadable via the free Ampeg IR Loader application
  - 75th Anniversary Free IR Pack available with product registration
