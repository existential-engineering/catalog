name: APC-40
manufacturer: akai
primaryCategory: controller
url: http://www.akaipro.com/apc40
description: The apc40 is the link between human and computer that balances
  analytical parameter control with creative expression.
details: >-
  The apc40 is the link between human and computer that balances analytical
  parameter control with creative expression.


  Whether you are an electronic music artist and live is your canvas, a dj using
  live to mix or remix tracks, or a more traditional musician using live on
  stage or in the studio, you will find the apc40 to the intuitive instrument
  that directly links with ableton live.
specs: |-
  - Dimensions: 16.88" x 13.13" x 2.62" (wxdxh) / 429mm x 334mm x 67mm (wxdxh)
  - Weight: 5.8 lbs / 2.64 kg
  - Power supply: 12v 2.0a pin-positive, included
  - Communication: USB-MIDI with proprietary hardware/software handshake
  - Inputs: USB, two assignable footswitch inputs
  - Mac system requirements: g4 or faster/intel mac recommended, 512 mb ram/1 gb
  recommended, os 10.3.9, 10.4 or later, quicktime 6.5 or higher, dvd-rom drive,
  USB port
  - Pc system requirements: 1.5 ghz or faster, 512 mb ram/1 gb recommended,
  windows xp or vista, windows-compatible sound card/asio driver support
  recommended, quicktime 6.5 or higher, dvd-rom drive, USB port
io:
  - name: USB
    signalFlow: input
    category: digital
    type: usb
    connection: usb-b
    position: Top
  - name: Footswitch Input 1
    signalFlow: input
    category: audio
    type: cv/gate
    connection: 1/4-inch
    position: Left
  - name: Footswitch Input 2
    signalFlow: input
    category: audio
    type: cv/gate
    connection: 1/4-inch
    position: Left
  - name: Power Input
    signalFlow: input
    category: power
    type: power
    connection: barrel
    position: Top
