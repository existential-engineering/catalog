description: The PRE420 is a four-channel microphone preamplifier with an
  integrated stereo mix bus and stereo/mono solo bus in a sleek, 1RU chassis. It
  is designed for maximum transparency, wide bandwidth, low-noise,
  low-distortion, and superior RF immunity for demanding studio and live venue
  applications.
details: |-
  The Benchmark PRE420 is a four-channel microphone preamplifier housed in a 1RU rack-mount chassis, designed for professional studio and live venue use. It combines four high-performance mic preamp channels with an integrated stereo mix bus and an isolated stereo/mono solo bus, making it a versatile tool for both tracking and monitoring applications.

  Each of the four channels features a 41-position gain control with a range of 22 to 60 dB (or 2 to 40 dB with the 20 dB pad engaged), per-channel switchable +48V phantom power, a 40 Hz high-pass filter, and variable intensity signal level meters with adjustable peak warning indicators.

  The integrated stereo mix bus uses MirrorPan constant-power pan controls to maintain consistent perceived loudness across the stereo field. A separate isolated stereo/mono solo bus provides control room monitoring independent of the main mix.

  The PRE420 includes Benchmark's HPA2 high-current headphone amplifier, enabling direct headphone monitoring from the unit itself. Eight XLR outputs are provided on the rear panel: four direct channel outputs, two control room outputs, and two stereo mix outputs.
specs: |-
  - THD+N @ 22 dB Gain: 0.00024%
  - EIN @ 60 dB Gain: -128 dBu (150 Ω), -131 dBu (40 Ω), -133 dBu (0 Ω)
  - Bandwidth: -3 dB at 500 kHz
  - Gain Range: 22–60 dB (without pad), 2–40 dB (with 20 dB pad)
  - 41-position gain control per channel
  - Per-channel switchable +48V phantom power
  - Per-channel 40 Hz high-pass filter
  - Per-channel 20 dB pad
  - MirrorPan constant-power pan controls on stereo mix bus
  - Integrated stereo/mono solo bus (isolated from mix bus)
  - HPA2 high-current headphone amplifier
  - 4 direct XLR outputs, 2 control room XLR outputs, 2 stereo mix XLR outputs
  - 1RU chassis
