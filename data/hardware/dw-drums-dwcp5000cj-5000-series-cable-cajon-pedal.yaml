description: An externally-mounted pedal that's compatible with virtually every cajon model in the industry.
details: |-
  A 5000 Series specialty pedal for today's most demanding players, the DW Cajon Pedal is an externally-mounted unit that's compatible with virtually every cajon model in the industry.

  Employing DW's industry-leading remote cable technology and a unique new Pivot Drive System, the DW Cajon Pedal offers low-latency, smooth, effortless playability.

  Other features include a Delta Ball-Bearing Hinge, a cajon platform with tension-adjustable remote beater hub, a sturdy aluminum base plate and a Soft-Touch Beater.
specs: |-
  - Pivot Drive system feels smooth and ultra-responsive
  - Delta ball-bearing hinge is built to last
  - Cajon platform and non-skid rubber grip combination provides a solid, stable connection
  - Remote beater hub is tension-adjustable to dial in the feel
  - Soft Touch Beater sounds like a palm hit, drawing full, deep bass tones
  - Remote cable drive
  - Sturdy aluminum base plate
