details: |-
  The Rebirth of a Modern Icon. Once a sleeper hit among discerning players and now returning by popular demand, the Rivolta Combinata VII is back — but it won't stay secret for long. Meticulously crafted in limited numbers by the expert luthiers at MIRR Korea, this reissue stays true to Dennis Fano's original vision, delivering vintage soul with modern precision. With its elegantly contoured offset body, chambered mahogany construction, and signature German carve top, the Combinata VII embodies the perfect balance of form and function. Loaded with custom-wound pickups and premium hardware, the Combinata VII offers a bold, articulate voice — equally at home pushing tube amps into gritty overdrive or cutting clean through a lush mix. Whether you're chasing retro tones or forging your own sound, the Combinata VII is ready to lead the way. FEATURES & SPECS

  CASE OPTIONS:
  Premium Soft Case
  Hard Case: Combinata
