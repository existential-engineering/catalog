description: Made in Japan phaser mini-pedal with Depth, Feedback, and Speed
  controls and a 4-stage / 6-stage mode switch. 100% pure analog circuitry with
  true bypass.
details: |-
  Phaser MINI is made in Japan and features three controls; DEPTH, FEEDBACK and SPEED. It delivers a variety of sounds ranging from subtle texture to deep saturation while maintaining clarity at high intensity levels.

  The pedal includes a switchable STAGE mode (4 or 6) — the 4-stage setting produces traditional rock phaser tones while the 6-stage offers more dramatic, deeper effects. 100% pure analog circuitry and true bypass switching keep the signal pristine when the pedal is engaged or off.
specs: |-
  - Controls: Speed, Depth, Feedback
  - Stage switch: 4-Stage / 6-Stage
  - True Bypass
  - Required Current: 5mA@9V
  - Power Supply: External DC 9 volt AC adapter (Center-negative)
  - 100% pure analog circuitry
  - Made in Japan
