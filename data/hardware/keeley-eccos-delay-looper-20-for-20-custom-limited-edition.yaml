description: Custom Shop 20 for 20 finish of the ECCOS, a true-stereo pedal
  pairing a tape-style flanged delay with a full-featured looper.
details: |-
  This 20 for 20 Custom Shop run of the ECCOS was the final instalment of the series and was limited to 20 units. It carries a matte black powder coat, black knob labels and a holographic badge and logo that shift colour with the lighting and viewing angle, printed by F5 Metalworks of Norman, Oklahoma.

  The pedal itself is the true-stereo ECCOS, which combines a tape-style flanged delay with a looper. Two footswitches change role with the mode: in delay mode they handle bypass, tap tempo and runaway feedback, and in looper mode they record, play, reverse, half-speed and trigger a single play-once pass. The delay and looper switch independently.

  A sound-on-sound mode records new layers without erasing the original loop, with older layers fading over time in the manner of a reel-to-reel recording. The decay rate is set by holding the feedback knob and turning the Depth control.

  The pedal runs a quad 24-bit, 56-bit Dream DSP with a fully analog dry path, and offers three memory presets, subdivisions, trails and an Alt Hold layer of secondary controls.
