details: |-
  Ice Nine Kills' Dan Sugarman teams up with Kiesel Guitars to create three editions of the Murder Axe, a package series that puts a horror spin on the Crescent. The Horrorwood edition uses a blacked-out-ash base and replicates a crime scene with a blood-splatter finish overlay.

  Because the artist edition is based on the Crescent, the added benefit of the set-through design accompanies the DS. The neck joint mimics the sound of a set-neck while replicating the widely-preferred feel of a neck-through.

  The body is 1-piece swamp ash with a blacked-out ash treatment, finished in textured blood splatter, and the headstock is a pointed straight 6 inline reverse headstock with a swamp ash overlay painted to match the body.

  Electronics are a master volume control with push/pull voicing feeding a direct-mount blood red Kiesel Polarity active system with black pole pieces at the bridge, with the neck pickup deleted. The neck is a tung-oiled 7-piece walnut neck with purpleheart, maple and walnut stripes in a thinner profile, with a 2-way adjustable truss rod, dual carbon-fiber rods, a roasted birdseye maple fingerboard at a 20 inch radius and 24 stainless jumbo frets.
specs: |-
  - Horrorwood edition of the Murder Axe, an artist edition based on the Kiesel Crescent; the Bateman edition is a separate entry
  - Offered as a 6-string or 7-string, with dimensions, neck width and weight listed per string count
  - Construction: set-through
  - Body: 1-piece swamp ash with blacked-out ash treatment
  - Finish: blood splatter (textured)
  - Neck: tung-oiled 7-piece walnut with purpleheart, maple and walnut stripes, 2-way adjustable truss rod and dual carbon-fiber rods, thinner profile
  - Fingerboard: roasted birdseye maple with 20 inch radius
  - Frets: 24 stainless jumbo, .110 inch wide x .055 inch tall
  - Scale length: 25.5 inch
  - Bridge pickup: direct-mount blood red Kiesel Polarity active system with black pole pieces, powered by an internal battery rather than an external supply
  - Neck pickup: deleted
  - Electronics: master volume control with push/pull voicing
  - Bridge: Hipshot/Kiesel tremolo, .4125 inch (10.5 mm) spacing
  - Tuners: premium Kiesel locking tuners, 19:1 ratio
  - Headstock: pointed straight 6 inline reverse headstock with swamp ash overlay, painted to match body
  - Inlays: black acrylic crescent moon with staggered offset dot inlays and standard black-ring Luminlay Super Blue side dots
  - Truss rod cover: Dan Sugarman signature truss rod cover
  - Hardware: black
  - Neck width: 1.69 inch (6-string) or 1.90 inch (7-string) wide at the nut, 0.76 to 0.82 inch thick at the 1st fret, 0.88 to 0.90 inch thick at the 12th fret
  - Dimensions: 37.5 inch long, 1.65 inch thick, 12.75 inch wide (6-string), or 37.75 inch long, 1.65 inch thick, 12.9 inch wide (7-string)
  - Weight: 8.2 lbs (6-string) or 8.35 lbs (7-string)
