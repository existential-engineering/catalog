description: >-
  The EMS Synthi A is a portable briefcase-format analog synthesizer electronically
  identical to the VCS3, featuring three oscillators and a distinctive pin-matrix patchbay
  instead of traditional patch cables. Also known as the "Portabella," it became famous
  for generating sci-fi sounds heard in productions like Doctor Who.
details: |-
  The Synthi A, commonly known as the "Portabella," packages the same electronics as the legendary EMS VCS3 into a slim plastic briefcase for easy portability. Released in 1971, two years after the VCS3, it established an iconic format that remains instantly recognizable in synthesizer history.

  Like the VCS3, the Synthi A features three oscillators and a unique patching system. Instead of patch cables, signal routing is accomplished through a patchbay grid where small pins are placed at intersection points to connect components. Additional modules include a noise generator, ring modulator, voltage-controlled lowpass filter, trapezoid envelope generator, joystick controller, voltage-controlled spring reverb, and two stereo output amplifiers.

  The AKS variant, released in 1972, adds a 256-step monophonic digital sequencer and a 30-note touchplate keyboard activated by the 50 Hz hum in the player's fingers. The case mounting on the AKS can be fragile, and used units should be examined carefully for this common issue. After about ten minutes of warm-up, the oscillators become reasonably stable.

  The Synthi family is famous for generating the sci-fi sounds heard in productions like Doctor Who. Notable users include Brian Eno, Pink Floyd, Jean-Michel Jarre, Aphex Twin, Autechre, Vince Clarke, The Who, Yes, Stereolab, and Todd Rundgren. EMS also produced the massive Synthi 100, loosely based on three combined VCS3 systems, of which approximately 29 units were built in the 1970s and early 1980s.
specs: |-
  - Polyphony: Monophonic
  - Oscillators: 3
  - Filter: Lowpass VCF
  - Envelope: Trapezoid waveshape generator
  - LFO: Yes
  - Patching: Pin-matrix patchbay
  - Keyboard: 30-note touchplate (AKS variant only)
  - Sequencer: 256-step monophonic digital (AKS variant only)
  - Effects: Voltage-controlled spring reverb
  - Memory: None
  - Control: CV/Gate
