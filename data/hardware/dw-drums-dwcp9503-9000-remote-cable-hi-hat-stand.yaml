details: |-
  DW's cable hi-hat systems have long been known as the most smooth and responsive in the industry. A higher quality cable yields a better remote hat, and the latest detachable linkage and sturdy, low profile housing take this hi-tech hi-hat further (U.S. Patent No. 5267500).

  The standard 9000 Series model comes with an 8-foot cable, with 2, 4, 6 and 10-foot cables sold separately. This 9503 version does not include the 505 drop clutch, carrying bag or the MG-1 and MG-2 clamps, and the cymbal stand is sold separately.

  The high-tech ball bearing hinge provides smooth, quick action, and the uni-body folding footboard stays attached to the base casting when secured in the folded position.

  The Lateral Cymbal Seat is a first in hi-hat design, allowing instant access for adjusting the bottom cymbal angle.
specs: |-
  - Remote cable hi-hat with detachable linkage and low profile housing
  - Ships with an 8-foot cable (2, 4, 6 and 10-foot cables sold separately)
  - Includes DWSP776L Dogbone V-to-V mounting clamp
  - Ball bearing hinge
  - Uni-body folding footboard
  - Lateral Cymbal Seat
  - U.S. Patent No. 5267500
  - Cymbal stand sold separately
  - Drop clutch, carrying bag and MG-1/MG-2 clamps not included
