description: The Cocktail-JAM Kit™ is a TAMA original in both appearance and
  sound. It's ideal for hip-hop, jazz, intimate acoustic settings, and tight
  rehearsal rooms.
details: |-
  Power Craft II Drumheads: Cocktail-JAM Kit's "Power Craft II" drum heads ensure a great sound practically right out of the box! Ring mufflers on bass drum heads remove the need for extra internal muffling.

  Cymbal Attachment Kit MCAX5366: A cymbal attachment kit is available for the Cocktail-JAM and the Cocktail-JAM Mini. These attachments have been simplified for portability. The hi-hat attachment allows you to open or close the hi-hats by simply flipping a lever.

  Set-up Expandability: You can also add cymbals or various percussion instruments by attaching more clamps to the connecting pipes.

  Specially Designed Bags: Cocktail-JAM Kit and Cocktail-JAM Mini Kit include a specially designed drum bag and hardware bag. You can pack up and transport the entire kit using only these two bags.

  Sound Focus Pad: By placing the Sound Focus Pad on top of the bass drum, you can get a tighter and more isolated bass drum sound. *It is also available separately.

  100% Birch shells (Cocktail-JAM): (TT/FT/SD) 6ply, 6mm / (BD) 7ply, 8mm Carefully selected birch materials are utilized for the shells in the Cocktail-JAM series. By using the same molding methods used for our high-end drums, a powerful sound, rich tone, and warm resonance usually only found with high-end drums are achieved.
