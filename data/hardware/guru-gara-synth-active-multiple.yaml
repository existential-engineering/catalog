  or 2x4 active multiple.
details: |-
  Active Multiple

  The Active Multiple Eurorack PCB and Front Panel Kit is a simple and reliable DIY utility module designed to distribute control voltages and audio signals without voltage drop. Using buffered outputs, it ensures stable signal duplication across multiple destinations in your modular system. Key Features

  - Maintains signal integrity for CV and audio
  - Beginner-friendly DIY build
  - Front panel made from PCB material, screen printed by hand

  Signal Distribution

  Input B is internally connected to A via a switched jack, allowing flexible operation. With a single input, the module functions as a 1-to-8 buffered multiple, ideal for distributing pitch CV, gates, clocks, or modulation signals. Using both inputs independently provides two separate 1-to-4 buffered multiples. Because the outputs are buffered, voltage accuracy and signal strength are preserved, making this module especially suitable for 1V/oct pitch CV distribution. DIY Build & Front Panel

  This beginner-level Eurorack DIY kit is easy to assemble and ideal for first-time builders. The front panel is constructed from durable PCB material and hand screen printed, matching the aesthetic of other Guru Gara Synth utility modules. Technical Specifications

  Skiff Friendly Module

  View Documents

  Compatible items such as knobs, potentiometers, jack sockets, and other build components can also be found in the Synth Parts category.
specs: |-
  - Eurorack PCB and front panel kit
  - Buffered (active) signal distribution
  - Two inputs (A and B) with switched jack connection
  - Can be used as: - 2 × 4 active multiple, or
  - 1 × 8 active multiple
  - Maintains signal integrity for CV and audio
  - Beginner-friendly DIY build
  - Front panel made from PCB material, screen printed by hand
  - Format: Eurorack
  - Width: 6HP
  - Depth: 25mm
  - Inputs: 2 (A & B)
  - Outputs: 8 (4 per input)
  - Signal Type: CV & Audio
