details: |-
  UX-LP1 User Manual

  The UX-LP1 Lavalier microphone is designed for speaking engagements where high intelligibility is required while maintaining a natural sound with crisp highs and defined low end. The UX-LP compact design allows for discreet placement on the speaker or presenter so the microphone will not distract from the person delivering the spoken word. Features:

  Designed for persons giving a spoken presentation or lecture
  Compact design allows for discreet positioning
  Excellent alternative for presenters and speakers not wanting a headset mic
  Included alligator style clip allows for easy positioning on a tie or lapel. 4-Pin TA4F style connector works with Carvin UX, SHURE and Anchor Audio systems

  Specifications:

  Type: Lavalier Microphone
  Polar Pattern: Cardioid
  Frequency Response: 100Hz-15kHz
  Sensitivity (1kHz): -60dB, (1mV)
  Impedance: 2.2k ohms
  Connector Type: TA4F 4-Pin
  Cable Length : 58.75" (150cm)
  Mic Windscreen Included : Yes
  Warranty: 90 Days
