description: For extreme, distorted drums Dual Drive module is a must! The
  module features two identical overdrive sections with adjustable Gain and
  Drive level, each with three flavors of overdrive. CV control over Gain and
  Drive adds more expression, while built in limiter prevents output signal to
  run into undesired clipping. Furthermore, the output of the first section is
  normalled to the input of the second, so you automatically get extreme,
  versatile dual overdrive circuit. The module can be used in the stereo
  appliations as well and it's not limited for drums only - it will turn any
  sound source into roaring monster.
details: |-
  Dual Drive is aimed at extreme, distorted drums. The module carries two identical overdrive sections with adjustable Gain and Drive level, and a mode switch on each selects one of three flavours of overdrive.

  CV control with an attenuator over Gain and Drive adds expression, while a built in output signal limiter stops the output running into undesired clipping. Drive level LEDs show how hard each section is being pushed.

  The output of the first section is normalled to the input of the second, so leaving the second input unpatched gives a versatile dual overdrive circuit in series with no extra cables.

  The module works in stereo applications as well, and it is not limited to drums: it will turn any sound source into a roaring monster.

  Audio output level and CV level both span -5V to +5V. The panel is 10HP wide, the module is 50mm deep, and power draw is 58mA on each of the +12V and -12V rails.
specs: |-
  - Two identical overdrive circuits
  - Manual GAIN and DRIVE controls
  - CV control with an attenuator over GAIN and DRIVE
  - Mode switch for selecting one of three overdrive flavours
  - Output signal limiter
  - Drive level LEDs
  - Audio output level -5V...+5V
  - CV level (full span) -5V...+5V
  - Power Consumption 58mA@+12V, 58mA@-12V
  - Module width 10HP
  - Module depth 50mm
