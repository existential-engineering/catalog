description: The pinnacle of the A Series, the A8H is a 3-way speaker that
  delivers the accurate and analytical sound required for critical-listening.
details: |-
  The pinnacle of the A Series, the A8H is a 3-way active studio monitor designed for the midfield. It delivers the extremely accurate and analytical sound required for critical-listening environments, scaling from mid- to full-sized rooms.

  Its driver complement pairs an 8-inch MLM (Multi-Layer Mineral) fiber woofer with a 3.5-inch DCH (Dome Cone Hybrid) midrange driver and ADAM Audio's handmade precision X-ART tweeter (2-inch equivalent diameter, 4:1 velocity transform). Together they produce an ultra-wide frequency response of 34 Hz to 41 kHz (-3 dB) and a max peak SPL of 116 dB at 1 m.

  Hybrid amplification provides 250 W peak PWM power to the woofer and Class A/B amplification to the midrange (70 W peak) and tweeter (20 W peak) for a total of 340 W peak. Crossover points are set at 400 Hz and 3.0 kHz.

  A rotatable HPS (High-frequency Propagation System) waveguide tailors high-frequency dispersion to horizontal or vertical orientations. Onboard 24-bit / 96 kHz DSP delivers room-adaptation controls (Bass, Desk, Presence, Treble), 0-10 ms delay, level trim, and Pure/UNR voicings.

  The A8H supports network-based remote control via Ethernet using OCA over standard IP, configured with the A Control software for Windows and macOS. Cabinet construction is a single front-ported bass-reflex design in vinyl-wrapped MDF with a painted front panel; the unit is sold in left and right versions.
