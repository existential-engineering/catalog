description: The pinnacle of the A Series, the A8H is a 3-way speaker that delivers the accurate and analytical sound required for critical-listening.
details: |-
  The A8H incorporates an 8-inch resonant Multi-Layer Mineral (MLM) fiber woofer, innovative midrange driver, and handmade precision X-ART tweeter, which together produce an ultra-wide frequency response.

  Like the other members of the A Series family, the A8H gives you tremendous flexibility for fine-tuning the sound through rotatable HPS waveguide technology and onboard DSP. At home across a full range of audio applications in mid- to full-sized spaces, the A8H is the right choice when you're looking for the most detailed representation of your audio.

  The DSP-based functionality of all A Series monitors can be controlled remotely and in real time over ethernet using A Control. ADAM Audio partners with Sonarworks on an automated room correction solution that runs directly on the DSP of A Series monitors, with import from Sonarworks SoundID Reference.

  On the back panel you will find four bands of room adaptation equalization (Bass, Desk, Presence and Treble) alongside two Voicing profiles, 'Pure' and 'UNR'. The backplate also carries a level control knob and an input select button that cycles the two analog inputs.

  The A8H is available in a left and right version. The cabinet is a single front-ported design in vinyl-wrapped MDF with a painted MDF front panel, and carries four M8 threaded inserts on the bottom for flexible speaker positioning.
specs: |-
  - 3-way active studio monitor (midfield)
  - German handmade precision X-ART tweeter, 2" (56 mm) equivalent diaphragm diameter, 4 inch² (2420 mm²) diaphragm area
  - Rotatable HPS waveguide, 120° horizontal by 70° vertical dispersion
  - 8" Multi-Layer Mineral (MLM) woofer, 1.5" (38 mm) voice coil
  - 3.5" Dome Cone Hybrid (DCH) midrange driver, 1.3" (33 mm) voice coil, MLM cone
  - Frequency response @ -3 dB: 34 Hz – 41 kHz; @ -6 dB: 31 Hz – 45 kHz
  - Crossover frequencies: 400 Hz and 3.0 kHz
  - Total peak amplifier power: 340 W (woofer 250 W peak / 200 W RMS PWM, midrange 70 W / 55 W Class A/B, tweeter 20 W / 15 W Class A/B)
  - Max. peak SPL per speaker at 1 m: 105 dB SPL (sine bursts), 116 dB SPL (IEC-weighted noise)
  - Dolby DARDT max SPL in full space: 117 dB SPL (121 dB SPL bass managed)
  - Signal processing: 24-bit AD converter, 96 kHz internal sample rate, 0 – 10 ms delay at 0.1 ms resolution
  - Independent peak and thermo limiters for each driver, plus amplifier thermo limiters
  - Input impedance 9 kOhm (XLR) / 3.3 kOhm (RCA); max. input level +19 dBu
  - Input sensitivity: 0 dBu = 100 dB SPL at 1 m @ 0 dB level setting; level range -12 dB to +12 dB
  - Room adaptation: Bass (+2, 0, -2, -4 dB), Desk (0, -2, -4 dB), Presence (+1, 0, -1 dB), Treble (+1.5, 0, -1.5 dB)
  - Voicings: Pure, UNR
  - Network control over RJ45 Ethernet using OCA over standard IP, with A Control software for Windows and macOS (6 x PEQ, Level, Delay)
  - Front panel multi-colour status LED
  - Single front-ported cabinet, vinyl-wrapped MDF with painted MDF front panel
  - Mounting: 4 x M8 threaded inserts on the bottom of the cabinet
  - AC input voltage 100 – 240 V, 50/60 Hz; power consumption 220 W max, 15 W idle, 3.5 W sleep; power rating 500 W max
  - Dimensions (H x W x D): 274 mm x 382 mm x 329 mm (10 3/4" x 15" x 13")
  - Weight: 13.6 kg (30 lb)
  - Warranty: 5 years (2 years plus 3 years optional with product registration)
