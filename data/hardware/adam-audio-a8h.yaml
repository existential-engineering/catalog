description: The pinnacle of the A Series, the A8H is a 3-way speaker that delivers the extremely accurate and analytical sound required for critical-listening environments.
details: |-
  The A8H incorporates an 8-inch resonant Multi-Layer Mineral (MLM) fiber woofer, innovative midrange driver, and handmade precision X-ART tweeter, which together produce an ultra-wide frequency response.

  Like the other members of the A Series family, the A8H gives you tremendous flexibility for fine-tuning the sound through rotatable HPS waveguide technology and onboard DSP. At home across a full range of audio applications in mid- to full-sized spaces, the A8H is the right choice when you're looking for the most detailed representation of your audio. The A8H is available in a left and right version.

  The DSP-based functionality of all A Series monitors can be controlled remotely and in real time over ethernet using A Control. On the back panel you will find two voicing selections, "UNR" and "Pure", along with four bands of room adaptation equalization: Bass, Desk, Presence and Treble.

  Made from a new glass fiber polymer compound, the HPS waveguide enables the X-ART tweeter to disperse sound in space with controlled consistency. The A Series combines the best of both digital and analog worlds through hybrid amplification, and the new A Series cabinets build on the heritage of ADAM Audio and the AX Series in particular.

  ADAM Audio is proud to partner with Sonarworks on an automated room correction solution that runs directly on the DSP of A Series monitors. The front-facing LED indicates status changes, and a mounting interface at the bottom of the cabinet allows for flexible speaker positioning.
specs: |-
  - German Handmade Precision X-ART Tweeter with rotatable HPS waveguide
  - 8" Woofer (Multi-Layer Mineral)
  - 3.5" DCH Midrange Driver
  - Total Peak Amp. Power: 340 W
  - Frequency Response @ -3 dB: 34 Hz – 41 kHz
  - Frequency Response @ -6 dB: 31 Hz – 45 kHz
  - Crossover Frequencies: 400 Hz, 3.0 kHz
  - Max. peak SPL per speaker at 1 m (sine bursts): 105 dB SPL
  - Max. peak SPL per speaker at 1 m (IEC-weighted noise): 116 dB SPL
  - Max SPL in full space at 1 m with sine bursts (average 100 Hz to 6 kHz) @ 3% THD: 104 dB SPL RMS, 107 dB SPL peak
  - Max SPL in full space at 1 m with sine bursts (average 50 Hz to 100 Hz) @ 3% THD: 101 dB SPL RMS, 104 dB SPL peak
  - Dolby DARDT max SPL in full space: 117 dB SPL (121 dB SPL bass managed)
  - Woofer amplifier: PWM, 250 W peak (10% THD), 200 W RMS (1% THD)
  - Midrange amplifier: Class A/B, 70 W peak (10% THD), 55 W RMS (1% THD)
  - Tweeter amplifier: Class A/B, 20 W peak (10% THD), 15 W RMS (1% THD)
  - Woofer: 8" basket diameter, 1.5" (38 mm) voice coil, MLM cone material
  - Midrange: Dome Cone Hybrid (DCH), 3.5" basket diameter, 1.3" (33 mm) voice coil, MLM cone material
  - X-ART tweeter: 4 inch² (2420 mm²) diaphragm area, 2" (56 mm) equivalent diameter, 4 to 1 velocity transform ratio, 0.17 g diaphragm weight
  - Waveguide: HPS (rotatable), 120° horizontal, 70° vertical dispersion
  - Signal processing: 24-bit AD converter, 96 kHz internal sample rate
  - Delay range, resolution: 0 – 10 ms, 0.1 ms
  - Protection: independent peak and thermo limiters for each driver, and amplifier thermo limiters
  - Audio input connectors: XLR, RCA. Input impedance 9 kOhm / 3.3 kOhm. Max. input level +19 dBu
  - Networking connector: RJ45, Ethernet, OCA using standard IP data
  - Control software: A Control (Windows and MacOS available)
  - Room adaption options: Backplate, Extended, Sonarworks SoundID Reference integration
  - Advanced room adaptation: 6 x PEQ, Level, Delay
  - Third-party calibration compatibility: Import from Sonarworks SoundID Reference
  - Backplate controls: Level -12 dB to +12 dB, Input selection (balanced/unbalanced), Voicings (Pure, UNR)
  - Backplate room adaption: Bass +2/0/-2/-4 dB, Desk 0/-2/-4 dB, Presence +1/0/-1 dB, Treble +1.5/0/-1.5 dB
  - Input sensitivity: 0 dBu = 100 dB SPL at 1 m @ 0 dB level setting
  - Display: front panel multi-colour LED
  - Cabinet design: single front ported. Vinyl wrapped MDF with painted MDF front panel
  - Mounting options: threaded inserts on the bottom of the cabinet (4 x M8)
  - Power consumption (max, idle, sleep): 220 W, 15 W, 3.5 W
  - AC input voltage: 100 – 240 V, 50/60 Hz. Power rating 500 W max.
  - Operating conditions: -10° C to +40° C (+14° F to +104° F); <75 % RH, non-condensing
  - Dimensions (H x W x D): 274 mm x 382 mm x 329 mm (10 3/4″ x 15″ x 13″)
  - Weight: 13.6 kg (30 lb)
  - Warranty: 5 years (2 years warranty plus 3 years optional with product registration)
  - Delivery contents: A8H loudspeaker, power cable, Quick Start Guide
