details: |-
  The Doctors Note is an analog envelope filter pedal designed for bass guitar, part of Ashdown's Dr Green range. Simple rotary controls let the player dial in and set oscillating frequencies with ease. The Q control finds the sweet spot of the frequency range, while sensitivity and decay controls tailor the nature of the effect, and a mix control blends the wet and dry signal. It features true bypass switching and is housed in a custom-designed steel casing that stands up to being stomped on night after night.
specs: |-
  - Analog envelope filter pedal for bass
  - Mix control: blend of clean and effected signal
  - Sens control: how the effect reacts to playing
  - Decay control: length of time the effect is active
  - Q control: the band width the effect covers
  - True bypass switching
  - Custom steel casing
