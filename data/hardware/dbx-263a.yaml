details: |-
  The dbx 263A is a discontinued dual-channel expander/gate from dbx Professional Audio. As a member of the 263-series dynamics processor family, it provided expansion and noise gating functionality for professional audio applications.

  This unit has been discontinued and superseded by the 263X in the dbx lineup. Documentation is available through the owner's manual.
