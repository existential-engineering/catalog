description: The first version of JHS Pedals' analog photocell-based Uni-Vibe
  modulator with tap tempo, in a larger enclosure than the V2.
details: |-
  The Unicorn V1 (released 2015) was the world's first bulb-driven photocell modulator with tap tempo — JHS's take on the classic Uni-Vibe effect. Version 1 uses a larger enclosure compared to the V2 (released 2018). The Unicorn delivers the lush, washy pulsations of the classic Shin-ei Uni-Vibe with a fully analog photocell topology, plus modern features including tap tempo, a Dry/Wet toggle for switching between Uni-Vibe and vibrato modes, and expression pedal control. It was succeeded by the Unicorn V2 which features a smaller enclosure.
