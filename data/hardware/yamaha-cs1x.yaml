description: >-
  The Yamaha CS1x is a digital synthesizer designed to emulate analog sounds and
  controls, targeting electronic and dance music production. It features 61
  velocity-sensitive keys, six real-time assignable knobs, scene memories with
  morphing, and a 30-pattern arpeggiator. Notable users include Underworld,
  Jamiroquai, and David Bowie.
details: |-
  The CS1x represents Yamaha's return to the CS (Control Synthesizer) line, specifically targeting producers in the electronic and dance music genres. It employs digital technology to recreate the sonic character of analog synthesizers while maintaining hands-on real-time control over sound parameters. All controls and parameters respond to MIDI, enabling deep integration with sequencers and external controllers.

  A standout feature is the scene memory system, which stores the current state of envelope and filter settings controlled by the dedicated knobs. These snapshots can be instantly recalled during performance, or morphed smoothly between scenes using the mod wheel, offering dynamic expression without complex menu diving.

  The built-in arpeggiator delivers 30 patterns tailored for dance music styles including techno and house, automatically generating rhythmic sequences that inspire creative exploration. With 128 preset sounds and 128 user-programmable slots, the CS1x provides substantial sound design flexibility. MIDI channels 5-16 access Yamaha's XG synth library, while channel 1 hosts the primary CS1x sounds and effects engine.
specs: |-
  - 32-note polyphony
  - XG Format with 480 normal voices and 11 drum kits
  - 16-part multitimbrality
  - 61 velocity-sensitive keys
  - 6 real-time assignable knobs (attack, release, filter cutoff, resonance, plus 2 assignable)
  - Scene memory with mod wheel morphing
  - 30-pattern arpeggiator with hold and split modes
  - 128 preset sounds, 128 user-programmable patches
  - Built-in digital effects processor
  - MIDI in/out/thru
