description: The 612ce is a Grand Concert acoustic-electric from Taylor's 600
  Series, featuring a torrefied Engelmann spruce top with solid maple back,
  sides, and neck, delivering bright and articulate tone with warmth — with
  V-Class bracing and ES2 electronics.
details: |-
  The 612ce pairs a torrefied Engelmann spruce top with solid maple back, sides, and neck in a Grand Concert body with Venetian cutaway. The torrefaction process mimics decades of natural aging, giving the top the resonant character of a vintage instrument. Maple's naturally reflective tonal character highlights every nuance of playing technique.

  V-Class bracing underpins the top for increased sustain and improved intonation. Ebony fretboard and bridge, grained ivoroid wing inlays, and ebony binding with ivoroid purfling complete the premium aesthetic. A Brown Sugar stain adds warm visual depth to the maple back and sides.

  Expression System 2 behind-the-saddle electronics capture the natural acoustic sound for amplified performance. Includes a deluxe hardshell case.
specs: |-
  - - Body shape: Grand Concert
  - Top: Torrefied Engelmann Spruce (solid, gloss)
  - Back/sides: Hard Rock Maple (solid, gloss)
  - Bracing: V-Class (patented)
  - Cutaway: Venetian
  - Neck: Hard Rock Maple (satin)
  - Fretboard: West African Crelicam Ebony
  - Bridge: West African Crelicam Ebony
  - Binding: Ebony with Grained Ivoroid purfling
  - Inlays: Grained Ivoroid Wings
  - Pickguard: Dark Stained Maple
  - Scale length: 24-7/8"
  - Tuners: Taylor Nickel
  - Finish: Brown Sugar stain (back/sides)
  - Electronics: Expression System 2 (ES2)
  - Strings: D'Addario XS Coated Phosphor Bronze Light (.012-.053)
  - Construction: All-solid
  - Case: Deluxe hardshell case included
