description: The Pro-Mod So-Cal Style 1 HSH FR E is a high-performance
  hot-rodded electric guitar built around an alder So-Cal Style 1 body and a
  bolt-on maple Speed Neck. An HSH set of Seymour Duncan pickups, a 12"-to-16"
  compound-radius ebony fingerboard and a recessed Floyd Rose 1000 Series
  double-locking tremolo combine for an aggressive, expressive shred-ready
  instrument.
details: |-
  The Pro-Mod So-Cal Style 1 HSH FR E pairs a sleekly sculpted alder body with a rock-solid bolt-on maple neck reinforced with graphite rods for durability and stability across changing climates. The Speed Neck profile carries rolled fingerboard edges for player comfort, and a heel-mounted spoke wheel makes truss rod adjustments convenient without removing the neck.

  The 25.5" scale maple neck is topped with a 12"-to-16" compound-radius ebony fingerboard featuring 22 jumbo frets, white dot inlays and white side dots. A Floyd Rose 1000 Series locking nut measures 1.6875" wide, and the licensed Fender Stratocaster headstock is fitted with Charvel-branded die-cast tuning machines. The bolt-on joint uses a serialized 4-bolt neck plate.

  Electronics deliver high-output aggression with a Seymour Duncan Distortion TB-6 humbucker at the bridge, a Custom Flat Strat SSL-6 single-coil in the middle and a Distortion SH-6N humbucker at the neck, all in black. A 5-position blade switch routes signal to a volume control and a no-load tone control mounted on a 1-ply white pickguard with knurled flat-top knobs and a white switch tip. The recessed Floyd Rose 1000 Series double-locking tremolo features a brass block for added sustain, and the rest of the chrome hardware is rounded out with standard strap buttons. The right-hand 6-string ships factory-strung with .009-.042 nickel-plated steel strings in a satin Robin's Egg Blue finish over a hand-rubbed satin urethane neck.
