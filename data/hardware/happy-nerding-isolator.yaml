details: |-
  Isolator is your 4 HP solution for galvanic isolation between its inputs and quarter inch TRS balanced outputs, interfacing your Eurorack modular system without an electric connection with the external equipment, which prevents possible ground loop issues.

  If no signal is plugged to the right input, then the left input will be sent to both Left and Right outputs.

  The Level knob adjusts output level for the Left and Right channels, and the Phones knob sets the level for the headphones output.

  If jumpers are installed, which is the default, the headphones output has the max gain. If the gain is too high for a particular headphones model, both jumpers should be removed.

  Reverse power protected like any other Happy Nerding module.
specs: |-
  - Galvanic isolation between inputs and outputs, preventing ground loops
  - Quarter inch TRS balanced outputs
  - Right input normalled to the left input, so a left-only signal feeds both outputs
  - Level knob for the Left and Right outputs, Phones knob for the headphones output
  - Rear jumpers set maximum headphone gain, installed by default
  - 50 mA +12V
  - 50 mA -12V
  - 45 mm depth
  - 4 HP wide
  - Reverse power protected
