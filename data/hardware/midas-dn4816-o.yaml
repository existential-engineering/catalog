url: "https://www.midasconsoles.com/en/products/0606-ADB"
description: Audio Interface from the Midas DN48XX Series for the StageConnect
  ecosystem. Provides 16 balanced line-level analog outputs (XLR male, e.g. for
  wireless / IEM transmitters or as stage spare outputs) plus an ULTRANET input
  that allows AIR-mixer style 16-channel 24-bit personal-monitoring signals to
  be carried over CAT5 and fed into the StageConnect bus. StageConnect
  transports 32 channels of uncompressed 24-bit PCM audio over a single standard
  XLR (110 Ohm DMX) cable with I/O latency at or below 0.5 ms, and can also
  distribute up to 18 W of remote power down the cable. Devices can be
  daisy-chained to scale to combinations such as 32 in or 32 out, or 16 in / 16
  out in parallel.
details: |-
  Part of the Midas DN48XX Series of I/O Interfaces built on the StageConnect standard introduced with the Behringer WING mixer. StageConnect carries 32 channels of uncompressed 24-Bit PCM audio with I/O latency at or below 0.5 ms over a single standard XLR cable; 110 Ohm DMX cable is recommended for optimal performance and long runs. The DN4816-O contributes 16 balanced line-level outputs (8 stereo mixes capacity) that can drive wireless / in-ear monitoring transmitters or act as spare stage outputs receiving signals directly from the console. Its ULTRANET input lets a personal-monitoring stream from AIR series mixers (and compatible devices) be carried over CAT5 into the StageConnect bus alongside other DN48XX interfaces. Devices can be daisy-chained for combinations such as 32 inputs total or 16 in and 16 out in parallel. Power can be delivered locally via the included 12 VDC / 2.5 A adapter or remotely down the StageConnect cable from another SC master device, with up to 18 W available via the MASTER XLR. The StageConnect Calculator (SSC Tool) checks a virtually configured chain for cable lengths, power supply and audio routing.
specs: |-
  - D/A Conversion: 24-Bit, 48/44.1 kHz, 114 dB
  - StageConnect Bus Capacity: 32 ch, 24-Bit PCM audio
  - I/O Latency: ≤0.5 ms
  - Analog Outputs: 16 x XLR male jacks, balanced
  - Output Impedance: 100 Ω unbalanced / 200 Ω balanced
  - Ultranet: 2 x RJ45
  - Shielded CAT5e Cable Max. Length: 75 m
  - StageConnect: 1 XLR male, 1 XLR female
  - Shielded Balanced 110-Ohm DMX Cable Max. Length: 40 m
  - USB: Type B
  - Frequency Response: 20 Hz - 20 kHz ±0.2 dB
  - Dynamic Range: 110 dB
  - Cross Talk Rejection @ 1 kHz, Adjacent Channels: 110 dB
  - Noise (20 Hz - 20 kHz Bandwidth): -90 dBu
  - Distortion: 0.004% / 1 kHz / 0 dBu out
  - Power Supply: 12 VDC / 2.5 A (30 W) adapter included; remote power input via SLAVE XLR (female); remote power output via MASTER XLR (male) 12 VDC / 1.5 A (18 W)
  - Power Consumption: 9 W
  - Standard Operating Temperature Range: 5° - 45° C (41° - 113° F)
  - Dimensions: 49 x 483 x 169 mm (1.9 x 19.0 x 6.7")
  - Weight: 2.2 kg (4.9 lbs)
