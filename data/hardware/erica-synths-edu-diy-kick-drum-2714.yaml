description: Unmistakable bassdrum sound.
details: |-
  There is nothing quite like the sound of old-school analog drum machines, and classic kicks like Roland's 808 and 909 are ubiquitous in electronic music. Their circuitry, though, is notoriously complex and difficult to understand.

  The mki x es.edu DIY Kick Drum kit sheds light on the fundamental circuit design principles behind those circuits, and it captures their unmistakable sound as a fully-fledged Eurorack module.

  Pitch is set manually or by CV, an accent input adds dynamics, and manual controls cover decay, tone and distortion. A manual pitch envelope with adjustable depth and decay time shapes the attack.

  Erica Synths and Moritz Klein developed the mki x es.EDU series of educational DIY kits with one specific goal in mind: to teach people with little to no prior experience how to design analog synthesizer circuits from scratch. The kit takes the builder through the circuit design process step by step, explaining every choice that was made and how it affects the finished module.

  The panel is 10HP wide and power draw is 6mA on the +12V rail and 7mA on the -12V rail.
specs: |-
  - Manual and CV controlled Pitch
  - Accent input
  - Manual decay control
  - Manual pitch envelope with adjustable depth and decay time
  - Tone control
  - Distortion control
  - Power consumption 6mA @ +12V, 7mA @ -12V
  - Module width 10HP
