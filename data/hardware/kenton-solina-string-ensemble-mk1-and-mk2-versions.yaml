description: A MIDI retrofit kit for the Eminent Solina String Ensemble, which
  was also re-badged as the ARP String Ensemble. Separate kits are built for the
  Type 1 and Type 2 versions of the instrument, which differ in internal wiring.
details: |-
  The retrofit kit for the Solina String Ensemble is supplied in two forms, one for Type 1 instruments and one for Type 2. The user facilities provided by the two versions are identical, but there are vast internal wiring differences between them, so the correct kit has to be ordered for the instrument in hand.

  Type 1 versions have the buttons for Contra Bass, Cello, Viola, Violin, Brass, Horn and Modulation fitted with LEDs in the centre to identify whether they are on or off. Type 2 versions have the same set of buttons as push on, push off types with no LEDs.

  A Type 1 kit will not work in a Type 2 instrument, and in the same way a Type 2 kit will not work in a Type 1 instrument.

  The Solina String Ensemble was manufactured by Eminent and was also re-badged as the ARP String Ensemble. The kit will work in both. It is not compatible with the Solina String Synthesizer.

  Installing a retrofit kit is a skilled job which should be undertaken only by a competent synth service engineer, or carried out at Kenton's premises in Tadworth, just outside London.
specs: |-
  - Separate kits for the Type 1 and Type 2 versions, which differ in internal wiring
  - Type 1 identified by Contra Bass, Cello, Viola, Violin, Brass, Horn and Modulation buttons with centre LEDs
  - Type 2 identified by the same buttons as push on, push off types without LEDs
  - Compatible with the Eminent Solina String Ensemble and the re-badged ARP String Ensemble
  - Not compatible with the Solina String Synthesizer
