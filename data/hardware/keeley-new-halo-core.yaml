details: |-
  The Halo Core is a streamlined version of the Keeley Halo, the Andy Timmons signature dual echo, with a simplified control set and the maker's current DSP. It offers three modes selected by a mini toggle: Timmons' Halo setting, quarter note and dotted eighth note.

  The Halo effect is a modulated dual echo. Notes repeat rhythmically to the point of resembling reverb diffusion, held together by tape-style modulation, saturation and compression. Delay time runs from 0 to 1500ms.

  The alt controls shape the delay further. A Saturate control adds tape compression texture, while Tone and a high-pass filter set the overall shape and mix of the repeats. With Time and Feedback set low the pedal moves into ambient chorus and flanger territory. The pedal has true stereo input and output for stereo imaging, a dedicated tap tempo footswitch, a redesigned infinite hold, switchable trails or true bypass, and all-wet or all-dry modes for amp front end or effects loop use.

  The enclosure measures 3.9 inches wide, 2.6 inches high and 4.9 inches deep. It runs on 9 to 18 VDC at 130mA, needs a high current supply, which is sold separately, and has no battery option.
specs: |-
  - Three modes: Halo, quarter note and dotted eighth note, selected by a mini toggle
  - Delay time 0 to 1500ms
  - True stereo input and output
  - Switchable trails or true bypass, changeable on the fly
  - All-wet or all-dry modes for amp front end or effects loop use
  - Dedicated tap tempo footswitch
  - Redesigned infinite hold
  - Alt controls: high pass filter, delay tone and tape-style saturation
  - Width 3.9in / 99mm, height 2.6in / 66mm, depth 4.9in / 124.5mm
  - Power: 9 to 18 VDC, 130mA, high current supply sold separately, no battery
