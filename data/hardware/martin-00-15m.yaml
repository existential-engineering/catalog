description: Compact Grand Concert body and all-solid mahogany construction for
  warm, intimate tone. Smooth playability, classic styling, optional
  electronics.
details:
  - The Martin 00-15M is part of Martin's 15 Series, featuring a compact Grand
    Concert (00-14 fret) body shape paired with all-solid mahogany construction.
    The mahogany top, back, and sides produce a warm, focused, and intimate tone
    that's well-suited for fingerstyle players, songwriters, and recording.
  - The guitar features a Modified Low Oval neck shape with a Standard Taper,
    providing a comfortable playing experience for both strumming and intricate
    fingerwork. The 25.4-inch scale length and 1 11/16-inch nut width follow
    classic Martin proportions.
  - Construction details include a non-scalloped spruce X-brace pattern, East
    Indian Rosewood fingerboard and bridge, satin finish throughout, Ping Nickel
    Open Gear tuners, and a tortoise or black pickguard option. The guitar comes
    pre-strung with Martin Authentic Acoustic Lifespan 2.0 strings.
  - Standard configuration ships with no electronics, but optional onboard
    systems are available including L.R. Baggs Anthem, Fishman Gold+Plus, and
    Fishman Matrix Infinity. Right and left-handed versions are available.
  - A softshell case with backpack straps and internal padding is included.
specs: |-
  - Body Size: 00-14 Fret (Grand Concert)
  - Top: Solid Mahogany (Dark Mahogany)
  - Back and Sides: Solid Mahogany (Dark Mahogany)
  - Bracing: Non-scalloped Spruce X-Brace
  - Finish: Satin
  - Scale Length: 25.4"
  - Nut Width: 1 11/16"
  - Fingerboard Material: East Indian Rosewood
  - Neck Shape: Modified Low Oval
  - Neck Taper: Standard Taper
  - Frets: 20 total (joins body at 14th)
  - Tuners: Ping Nickel Open Gear
  - Pickguard: Tortoise pattern or black
  - Strings: Martin Authentic Acoustic Lifespan 2.0
  - Electronics: None standard (optional L.R. Baggs Anthem, Fishman Gold+Plus, Fishman Matrix Infinity)
  - Case: Softshell with backpack straps
