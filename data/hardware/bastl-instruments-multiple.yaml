url: https://bastl-instruments.com/eurorack/modules/multiple
description: >-
  Multiple is a discontinued compact 2HP passive nine-jack signal splitter for
  Eurorack. All nine jacks ship internally connected; cutting internal wires
  reconfigures it as independent groups (e.g., 4+5 or 3+3+3). Skiff-friendly at
  15mm depth. Handmade in Brno, Czech Republic.
details: |-
  2HP width, 15mm depth. Passive — no power connector required.
