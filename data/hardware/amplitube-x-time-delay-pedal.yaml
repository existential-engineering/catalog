details: |-
  Bring your perfect studio guitar sound onstage with the new amplitube x-time
  delay pedal. This boutique pedal features 16 all-new delay effects leveraging
  ik's latest amplitube technologies, accompanied by an exclusive virtual x-gear
  version of the exact same effects.

  Breakthrough software and hardware integration for guitarists.
  State-of-the-art dsp in a road-worthy anodized aluminum chassis. All-new delay
  algorithms, from tape to bucket to crystal-clear.

  Amplitube x-time includes a matching virtual version for mac/pc and a copy of
  amplitube 5 se. Open any version of amplitube 5 and you'll find your virtual
  x-time pedal available as a stomp for use within the program. Adjust any of
  your pedal settings with the convenience of amplitube's award-winning workflow
  and save them as presets.

  The x-gear preset manager lets you move presets between x-gear pedals and
  amplitube and easily reorganize them on the hardware pedal. You can store up
  to 300 presets per pedal.

  Use the virtual version with amplitube 5 (se version included) to record and
  tweak settings and save as presets on your x-time pedal for world-class tone
  anywhere. USB port for preset management and use as a recording interface.
  Full MIDI implementation including control over amplitube 5. Designed and made
  in italy for a lifetime of playing and gigging.
specs: |-
  - 16 delay algorithms
  - 50 factory presets
  - 300 storable presets
  - Tap tempo
  - Bpm sync
  - Spillover/trails function
  - USB port
  - MIDI implementation
  - Expression pedal
  - Headphone hiz in
  - Line out
  - Headphone
  - MIDI in
  - MIDI out
  - Anodized aluminum chassis
  - Mac/pc compatibility
  - Amplitube 5 se included
