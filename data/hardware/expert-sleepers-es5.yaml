url: https://www.expert-sleepers.co.uk/es5.html
description: The ES-5 is a Eurorack expansion module for the Expert Sleepers
  ES-3, ES-8, ES-9, ES-10, disting EX and disting NT. It piggybacks on one of
  the host module's stereo channels to provide eight gate, clock, sync and MIDI
  outputs, plus headers for up to six further expansion modules.
details: |-
  The ES-5 is an expansion module for the Expert Sleepers ES-3 Lightpipe/CV Interface, ES-8 USB Audio Interface, ES-9 USB Audio Interface, ES-10 ADAT Interface, disting EX and disting NT. It piggybacks on one of the host module's stereo channels to provide eight gate, clock, sync and MIDI outputs on the ES-5 itself.

  Alongside those eight jacks, the ES-5 carries further expansion headers for connecting up to six expansion modules, such as the ESX-8GT Gate Expander, the ESX-8CV CV Expander or the ESX-8MD MIDI/DINsync Expander. Connection to the host is by a simple plug-in cable for the ES-3 mk2 and above, and for all other supported modules. The original ES-3 requires some soldering to add the required connections.

  Four revisions have shipped. The ES-5 mk4, released December 2025, is identical to the ES-5 mk3 apart from the module depth, which falls from 49mm to 36mm. The mk3, launched in February 2017, is functionally equivalent to the mk2 and adds illuminated jack sockets and the look of the ES-8 and the other updates of that month. The mk2 arrived in February 2014 matching the look of the ESX-8GT mk2, with no functional differences from the mk1.

  Unlike the ES-3 itself, the ES-5 requires software in order to generate meaningful output signals. The options include the ES-5 Controller plug-in that forms part of Expert Sleepers Silent Way, the Expert Sleepers Max/MSP external and the free Expert Sleepers VCV Rack plug-in, and there are third party Max for Live devices as well.

  Silent Way is offered in AudioUnit, VST and AAX formats for Mac OS X and Windows, so using it requires a compatible host application. A Silent Way licence is not included with the ES-5, and the ES-5 Controller plug-in functions in a licence-free mode, so an ES-5 owner is not obliged to buy Silent Way.
specs: |-
  - Panel width: 4HP
  - Module depth: 36mm (mk4, previously 49mm)
  - Digital input: connection from ES-3, ES-8, ES-9, ES-10, disting EX or disting NT module
  - Analogue outputs: 8x 3.5mm jacks, DC-coupled
  - Output voltages: 0V/5V
  - Indicators: illuminated jack sockets
  - Expansion: 6 headers for connecting expansion modules, for example the ESX-8GT
  - Current draw: 8mA on the +12V rail, 0mA on the -12V rail
