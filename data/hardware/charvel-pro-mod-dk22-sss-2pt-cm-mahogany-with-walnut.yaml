description: A Pro-Mod Series Dinky with a mahogany body, figured walnut top in
  Natural finish, caramelized maple neck and fingerboard, and an SSS Seymour
  Duncan pickup configuration. Built for versatile performance with a Gotoh
  Custom 510 tremolo and gold hardware.
details: |-
  Charvel presents a sleek new instrument designed especially for a new breed of player whose musical vision and versatility knows no bounds.

  The Dinky mahogany body features a figured walnut top with sculpted shredder's cut heel and scalloped lower back bout for upper-fret access. The caramelized bolt-on maple neck includes graphite-reinforced rods and hand-rubbed satin urethane finish, complemented by a 12"-16" compound radius caramelized maple fingerboard with 22 jumbo frets and Luminlay side dots.

  The SSS configuration combines a Seymour Duncan Custom Hot Rails bridge humbucking pickup with two Seymour Duncan Custom Flat Strat single-coil pickups (middle and neck) for glassy, vintage-style timbre with classic Strat chime.
