# Valid IO connection/connector types (advisory - warning if not matched)
#
# The `connection` field describes the physical connector of an IO port.
# Add new values here as they appear in data. Unknown values generate warnings
# in `pnpm validate` and are surfaced during data review.
connections:
  # Quarter-inch jacks
  - 1/4-inch

  # Bantam / TT jacks (patchbays)
  - tt

  # Eighth-inch / 3.5mm jacks
  - 1/8-inch

  # 2.5mm jacks
  - 2.5mm

  # XLR connectors
  - xlr
  - mini-xlr
  - combo jack

  # DIN connectors
  - 4-pin din # external analogue PSU (e.g. Black Lion Auteur Quad)
  - 5-pin din
  - 7-pin din # powered MIDI (e.g. remote foot controllers)
  - mini-din

  # RCA
  - rca

  # USB connectors
  - usb-a
  - usb-b
  - usb-b-micro
  - usb-b-mini
  - usb-c

  # Other digital connectors
  - thunderbolt 1
  - thunderbolt 2
  - thunderbolt 3
  - toslink
  - bnc
  - firewire 400
  - ethernet
  - ethercon # locking Neutrik ethernet (e.g. SLink/gigaACE/Dante ports)
  - hdmi
  - lightning
  - aes/ebu
  - digilink # Avid DigiLink (Pro Tools HD/HDX interface ports)

  # Multi-pin connectors
  - 2-pin
  - db9 # 9-pin D-sub (RS-232C serial control)
  - db15 # 15-pin D-sub (e.g. Crane Song STC-8 side chain insert)
  - db25
  - dt12 37-pin
  - edac
  - idc # ribbon/box header (e.g. Eurorack bus power)
  - pin-header # bare 0.1" pins (hobby-servo outputs, sensor patchbays)
  - speakon

  # Speaker terminals
  - binding-post
  - banana
  - spring-terminal

  # Power connectors
  - barrel
  - iec-c6
  - iec-c14
  - iec-c20
  - powercon

  # Terminal block / phoenix style connectors
  - euroblock

  # Misc
  - built-in
  - card-slot # empty option-card bay (fitted cards present their own connectors)
  - pin # bare pins or card-edge contacts (phono cartridges, 500-series modules)
  - mmcx # IEM earphone cable connector
  - apple-30-pin # legacy iPod/iPad dock connector
