allowBuilds:
  better-sqlite3: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@changesets/apply-release-plan@8.0.0'
  - '@changesets/assemble-release-plan@7.0.0'
  - '@changesets/changelog-git@1.0.0'
  - '@changesets/cli@3.0.0'
  - '@changesets/config@4.0.0'
  - '@changesets/errors@1.0.0'
  - '@changesets/get-dependents-graph@3.0.0'
  - '@changesets/git@4.0.0'
  - '@changesets/parse@1.0.0'
  - '@changesets/pre@3.0.0'
  - '@changesets/read@1.0.0'
  - '@changesets/should-skip-package@1.0.0'
  - '@changesets/types@7.0.0'
  - '@changesets/write@1.0.0'

# Security overrides for transitive dependencies. To verify any of these is
# safe to drop: comment it out, run `pnpm install --no-frozen-lockfile`, then
# `pnpm audit` — if the corresponding advisory no longer appears, remove it.
#
# - vite >=8.0.16: vitest still resolves vite@8.0.13 by default, which trips
#   GHSA-fx2h-pf6j-xcff (server.fs.deny bypass) and GHSA-v6wh-96g9-6wx3
#   (launch-editor NTLMv2 disclosure). Patched in vite 8.0.16.
# - esbuild >=0.28.1: vite/tsx pull esbuild@0.28.0, vulnerable to
#   GHSA-g7r4-m6w7-qqqr (arbitrary file read via dev server). Patched in 0.28.1.
#
# No override is needed for postcss or nanoid. They reached this repo through
# vitest > vite and went stale only because the lockfile had not been
# re-resolved since 2026-07-17, not because any parent range excluded the
# patched version. A clean resolve floats vite to 8.2.1, which carries
# postcss 8.5.26 and nanoid 3.3.18. Note that deleting pnpm-lock.yaml is not
# enough on its own: pnpm reuses what is already in node_modules, so a genuine
# re-resolve needs both removed.
#
# The js-yaml and read-yaml-file overrides that used to live here are gone.
# They existed only because @changesets/cli 2.x pinned the CommonJS
# @manypkg/get-packages@1.x, which read pnpm-workspace.yaml through
# read-yaml-file. @changesets/cli 3.0.0 moved to @manypkg/get-packages@3.x
# (@manypkg/tools + @manypkg/find-root), so neither package is in the tree at
# all now. Do not re-add them without checking `pnpm why` first. The Changeset
# CI workflow's "Verify release tooling can load the workspace" step still
# guards the load path if a future bump drags the chain back in.
overrides:
  vite: ">=8.0.16 <9"
  esbuild: ">=0.28.1"
